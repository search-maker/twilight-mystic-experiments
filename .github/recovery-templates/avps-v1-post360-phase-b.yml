name: AVPS v1 post360 Phase B preregistered opening
run-name: AVPS v1 Phase B primary opening ${{ github.ref_name }}

on:
  push:
    branches:
      - status/avps-v1-post360-phase-b-ordinal-40
    paths:
      - .github/dispatch-requests/avps-v1-post360-phase-b.json

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: avps-v1-post360-phase-b-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  phase-b:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact Phase B request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Bind exact separately reviewed Phase B identity
        id: identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = status/avps-v1-post360-phase-b-ordinal-40
          test "$(git -C control rev-parse HEAD)" = "$GITHUB_SHA"

          python - <<'PY' > request.env
          import json
          r=json.load(open('control/.github/dispatch-requests/avps-v1-post360-phase-b.json'))
          if r.get('schemaVersion') != 1: raise SystemExit('request schema drift')
          if r.get('stageId') != 'aerosol-vertical-profile-sensitivity-v1-post360-phase-b': raise SystemExit('stage drift')
          if r.get('status') != 'REQUEST_PREREGISTERED_PRIMARY_RESULT_OPENING_ONLY': raise SystemExit('status drift')
          ints=('scientificOrdinal','phaseBReviewPr','phaseBReviewRunId','protocolReviewPr','phaseAReviewPr','phaseAReviewRunId','phaseARunId','phaseAArtifactId')
          for key in ints:
              v=r.get(key)
              if isinstance(v,bool) or not isinstance(v,int) or v<=0: raise SystemExit(f'{key} invalid')
              print(f'{key.upper()}={v}')
          shas=('phaseBReviewHead','protocolReviewHead','phaseAReviewHead','authorizationParent','authorizationHead','phaseARunHead')
          for key in shas:
              v=r.get(key)
              if not isinstance(v,str) or len(v)!=40 or any(c not in '0123456789abcdef' for c in v): raise SystemExit(f'{key} invalid')
              print(f'{key.upper()}={v}')
          for key in ('phaseAArtifactDigest','phaseAReceiptContentSha256','phaseAAnalysisInputContentSha256','phaseAAnalysisInputRawSha256','phaseAAcquisitionContentSha256'):
              v=r.get(key)
              if not isinstance(v,str) or not v: raise SystemExit(f'{key} invalid')
              print(f'{key.upper()}={v}')
          PY
          source request.env
          export SCIENTIFICORDINAL PHASEBREVIEWPR PHASEBREVIEWRUNID PROTOCOLREVIEWPR PHASEAREVIEWPR PHASEAREVIEWRUNID PHASEARUNID PHASEAARTIFACTID PHASEBREVIEWHEAD PROTOCOLREVIEWHEAD PHASEAREVIEWHEAD AUTHORIZATIONPARENT AUTHORIZATIONHEAD PHASEARUNHEAD PHASEAARTIFACTDIGEST PHASEARECEIPTCONTENTSHA256 PHASEAANALYSISINPUTCONTENTSHA256 PHASEAANALYSISINPUTRAWSHA256 PHASEAACQUISITIONCONTENTSHA256

          test "$SCIENTIFICORDINAL" = 40
          test "$PROTOCOLREVIEWPR" = 579
          test "$PROTOCOLREVIEWHEAD" = 5e191b1afbdb637e6534c856548af1d79138d6f1
          test "$PHASEAREVIEWPR" = 584
          test "$PHASEAREVIEWRUNID" = 33169583131
          test "$PHASEAREVIEWHEAD" = b93c284c8a24296dff9d8aedc265f7a3bdec465a
          test "$AUTHORIZATIONPARENT" = 99ade7798627e67921139697ba1a004fa8a304bb
          test "$AUTHORIZATIONHEAD" = 338ee82c8e088e929f45782b1f7ac1c3aaaaa533
          test "$PHASEARUNID" = 33170006532
          test "$PHASEARUNHEAD" = 17537a2a5d60d7836eb9a1e01169a5bab5c70ea2
          test "$PHASEAARTIFACTID" = 9685308839
          test "$PHASEAARTIFACTDIGEST" = sha256:68216d6a4982618d8cf9238948f0cbeb651bc9cde7ce53e688b5b1b11d204148
          test "$PHASEARECEIPTCONTENTSHA256" = c14ef76e6280bdd34172202c63e8a319b4044cdb647e348926c02d03160198e4
          test "$PHASEAANALYSISINPUTCONTENTSHA256" = c58907c2f838396417edcfe87d306c130b92374b649790ff25537f3ac049bdc8
          test "$PHASEAANALYSISINPUTRAWSHA256" = b1c2d82e53c91606854c6ae0fea4d6e08d959dd3ee26ac080d0ee62ad4a4096b
          test "$PHASEAACQUISITIONCONTENTSHA256" = b3d4ac428ced54e217721507c36e349511ef0b4478f5815af7fe557fed005541

          mapfile -t rp < <(git -C control cat-file -p HEAD | sed -n 's/^parent //p')
          test "${#rp[@]}" = 1
          CONTROL_HEAD="${rp[0]}"
          mapfile -t rc < <(git -C control diff-tree --no-commit-id --name-only -r HEAD)
          test "${#rc[@]}" = 1
          test "${rc[0]}" = .github/dispatch-requests/avps-v1-post360-phase-b.json
          mapfile -t cp < <(git -C control cat-file -p "$CONTROL_HEAD" | sed -n 's/^parent //p')
          test "${#cp[@]}" = 1
          test "${cp[0]}" = "$AUTHORIZATIONPARENT"
          mapfile -t cc < <(git -C control diff-tree --no-commit-id --name-only -r "$CONTROL_HEAD")
          test "${#cc[@]}" = 2
          printf '%s\n' "${cc[@]}" | sort > control-changed.txt
          printf '%s\n' '.github/workflows/avps-v1-post360-phase-b.yml' 'review/avps-v1-post360-phase-b-opening-control-v1/phase_b.py' | sort > expected-control-changed.txt
          diff -u expected-control-changed.txt control-changed.txt

          git -C control fetch origin main "$PHASEBREVIEWHEAD" "$PROTOCOLREVIEWHEAD" "$PHASEAREVIEWHEAD" authorization/aerosol-vertical-profile-sensitivity-v1-ordinal-40
          test "$(git -C control rev-parse origin/main)" = "$AUTHORIZATIONPARENT"
          test "$(git -C control rev-parse origin/authorization/aerosol-vertical-profile-sensitivity-v1-ordinal-40)" = "$AUTHORIZATIONHEAD"

          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PHASEBREVIEWPR}" > phase-b-review-pr.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PHASEBREVIEWRUNID}" > phase-b-review-run.json
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PROTOCOLREVIEWPR}" > protocol-pr.json
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PHASEAREVIEWPR}" > phase-a-review-pr.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PHASEAREVIEWRUNID}" > phase-a-review-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PHASEARUNID}" > phase-a-run.json
          PHASEBREVIEWHEAD="$PHASEBREVIEWHEAD" PHASEBREVIEWRUNID="$PHASEBREVIEWRUNID" PHASEAREVIEWHEAD="$PHASEAREVIEWHEAD" PROTOCOLREVIEWHEAD="$PROTOCOLREVIEWHEAD" python - <<'PY'
          import json,os
          p=json.load(open('phase-b-review-pr.json')); r=json.load(open('phase-b-review-run.json')); q=json.load(open('protocol-pr.json')); a=json.load(open('phase-a-review-pr.json')); ar=json.load(open('phase-a-review-run.json')); s=json.load(open('phase-a-run.json'))
          if p.get('state')!='open' or p.get('draft') is not True or p.get('merged_at') is not None: raise SystemExit('Phase B review must remain Draft/open/unmerged')
          if (p.get('base') or {}).get('sha')!='99ade7798627e67921139697ba1a004fa8a304bb' or (p.get('head') or {}).get('sha')!=os.environ['PHASEBREVIEWHEAD']: raise SystemExit('Phase B review identity drift')
          if int(r.get('id') or 0)!=int(os.environ['PHASEBREVIEWRUNID']) or r.get('head_sha')!=os.environ['PHASEBREVIEWHEAD'] or int(r.get('run_attempt') or 0)!=1 or r.get('status')!='completed' or r.get('conclusion')!='success': raise SystemExit('Phase B review run not exact attempt-1 success')
          if q.get('state')!='open' or q.get('draft') is not True or q.get('merged_at') is not None or (q.get('head') or {}).get('sha')!=os.environ['PROTOCOLREVIEWHEAD']: raise SystemExit('protocol review drift')
          if a.get('state')!='open' or a.get('draft') is not True or a.get('merged_at') is not None or (a.get('head') or {}).get('sha')!=os.environ['PHASEAREVIEWHEAD']: raise SystemExit('Phase A review drift')
          if int(ar.get('id') or 0)!=33169583131 or int(ar.get('run_attempt') or 0)!=1 or ar.get('status')!='completed' or ar.get('conclusion')!='success': raise SystemExit('Phase A review run drift')
          exp={'id':33170006532,'head_sha':'17537a2a5d60d7836eb9a1e01169a5bab5c70ea2','head_branch':'status/avps-v1-post360-phase-a-ordinal-40','event':'push','run_attempt':1,'status':'completed','conclusion':'success','path':'.github/workflows/avps-v1-post360-phase-a.yml'}
          for k,v in exp.items():
              if s.get(k)!=v: raise SystemExit(f'Phase A run drift: {k}')
          PY

          REVIEW_TEMPLATE_BLOB="$(git -C control rev-parse "$PHASEBREVIEWHEAD:.github/recovery-templates/avps-v1-post360-phase-b.yml")"
          REVIEW_WRAPPER_BLOB="$(git -C control rev-parse "$PHASEBREVIEWHEAD:review/avps-v1-post360-phase-b-opening-control-v1/phase_b.py")"
          test "$(git -C control rev-parse "$CONTROL_HEAD:.github/workflows/avps-v1-post360-phase-b.yml")" = "$REVIEW_TEMPLATE_BLOB"
          test "$(git -C control rev-parse "$CONTROL_HEAD:review/avps-v1-post360-phase-b-opening-control-v1/phase_b.py")" = "$REVIEW_WRAPPER_BLOB"

          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs?branch=${GITHUB_REF_NAME}&event=push&per_page=100" > current-runs.json
          python - <<'PY'
          import json,os
          runs=[r for page in json.load(open('current-runs.json')) for r in page.get('workflow_runs',[]) if r.get('path')=='.github/workflows/avps-v1-post360-phase-b.yml']
          ids=[int(r.get('id') or 0) for r in runs]
          if ids != [int(os.environ['GITHUB_RUN_ID'])]: raise SystemExit(f'Phase B activation is not one-shot: {ids}')
          PY

      - name: Checkout exact frozen authorized science
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 338ee82c8e088e929f45782b1f7ac1c3aaaaa533
          path: science
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch exact Phase A artifact and bind exact three-file input
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9685308839/zip" > phase-a.zip
          test "sha256:$(sha256sum phase-a.zip | awk '{print $1}')" = sha256:68216d6a4982618d8cf9238948f0cbeb651bc9cde7ce53e688b5b1b11d204148
          mkdir phase-a
          unzip -q phase-a.zip -d phase-a
          find phase-a -maxdepth 1 -type f -printf '%f\n' | sort > files.txt
          printf '%s\n' acquisition-audit.json analysis-input.json phase-a-receipt.json | sort > expected.txt
          diff -u expected.txt files.txt
          printf '%s  %s\n' b1c2d82e53c91606854c6ae0fea4d6e08d959dd3ee26ac080d0ee62ad4a4096b phase-a/analysis-input.json | sha256sum -c -
          python - <<'PY'
          import importlib.util,json,sys
          from pathlib import Path
          p=Path('control/review/avps-v1-post360-phase-b-opening-control-v1/phase_b.py'); s=importlib.util.spec_from_file_location('phase_b_precheck',p); m=importlib.util.module_from_spec(s); sys.modules[s.name]=m; s.loader.exec_module(m)
          m.validate_phase_a_payloads(Path('phase-a'))
          PY

      - name: Call frozen preregistered result opener exactly once
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util,sys
          from pathlib import Path
          p=Path('control/review/avps-v1-post360-phase-b-opening-control-v1/phase_b.py'); s=importlib.util.spec_from_file_location('phase_b_execute',p); m=importlib.util.module_from_spec(s); sys.modules[s.name]=m; s.loader.exec_module(m)
          receipt=m.run_phase_b(Path('science'),Path('phase-a'),Path('phase-b-output'))
          if receipt.get('status')!='PHASE_B_PREREGISTERED_PRIMARY_RESULTS_OPENED_NO_TAYLOR_OR_JERUSALEM_SCORING' or receipt.get('resultOpeningPerformed') is not True or receipt.get('scientificInterpretationPerformed') is not False or receipt.get('taylorOrJerusalemScoringPerformed') is not False or receipt.get('levelBMappingPerformed') is not False or receipt.get('productionRoutingChanged') is not False: raise SystemExit('Phase B opening boundary drift')
          PY
          rm -rf phase-a phase-a.zip

      - name: Persist preregistered primary opening output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: avps-v1-post360-phase-b-primary-results-ordinal-40
          path: phase-b-output/
          if-no-files-found: error
          compression-level: 0
