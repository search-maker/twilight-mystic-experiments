name: AVPS v1 Stage B executor-contract recovery
run-name: AVPS v1 executor recovery ${{ github.ref_name }}

on:
  push:
    branches:
      - status/avps-v1-stage-b-executor-recovery-ordinal-40
    paths:
      - .github/dispatch-requests/avps-v1-stage-b-executor-recovery.json

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: avps-v1-stage-b-executor-recovery-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      ordinal: ${{ steps.identity.outputs.ordinal }}
      auth_head: ${{ steps.identity.outputs.auth_head }}
      control_head: ${{ steps.identity.outputs.control_head }}
      matrix2: ${{ steps.matrices.outputs.matrix2 }}
      matrix4: ${{ steps.matrices.outputs.matrix4 }}
      matrix6: ${{ steps.matrices.outputs.matrix6 }}
      matrix8: ${{ steps.matrices.outputs.matrix8 }}
    steps:
      - name: Checkout exact recovery request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Bind exact separately reviewed recovery identity
        id: identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = status/avps-v1-stage-b-executor-recovery-ordinal-40
          test "$(git -C control rev-parse HEAD)" = "$GITHUB_SHA"

          python - <<'PY' > request.env
          import json
          r=json.load(open('control/.github/dispatch-requests/avps-v1-stage-b-executor-recovery.json'))
          if r.get('schemaVersion')!=1 or r.get('stageId')!='aerosol-vertical-profile-sensitivity-v1-stage-b-executor-contract-recovery-v1' or r.get('status')!='REQUEST_ONE_SHOT_SEPARATELY_REVIEWED_TRANSPORT_RECOVERY_RAW_CASES_ONLY':
              raise SystemExit('executor-recovery request drift')
          ints=('scientificOrdinal','recoveryReviewPr','recoveryReviewRunId','failedWorkflowRunId','failedPreflightArtifactId','cancelControlRunId')
          for key in ints:
              v=r.get(key)
              if isinstance(v,bool) or not isinstance(v,int) or v<=0: raise SystemExit(f'{key} invalid')
              print(f'{key.upper()}={v}')
          shas=('recoveryReviewHead','authorizationHead','authorizationParent','failedWorkflowHead')
          for key in shas:
              v=r.get(key)
              if not isinstance(v,str) or len(v)!=40 or any(c not in '0123456789abcdef' for c in v): raise SystemExit(f'{key} invalid')
              print(f'{key.upper()}={v}')
          d=r.get('failedPreflightArtifactDigest')
          if not isinstance(d,str) or len(d)!=71 or not d.startswith('sha256:'): raise SystemExit('failed preflight digest invalid')
          print(f'FAILEDPREFLIGHTARTIFACTDIGEST={d}')
          PY
          source request.env
          export SCIENTIFICORDINAL RECOVERYREVIEWPR RECOVERYREVIEWRUNID FAILEDWORKFLOWRUNID FAILEDPREFLIGHTARTIFACTID CANCELCONTROLRUNID RECOVERYREVIEWHEAD AUTHORIZATIONHEAD AUTHORIZATIONPARENT FAILEDWORKFLOWHEAD FAILEDPREFLIGHTARTIFACTDIGEST
          test "$SCIENTIFICORDINAL" = 40
          test "$AUTHORIZATIONHEAD" = 338ee82c8e088e929f45782b1f7ac1c3aaaaa533
          test "$AUTHORIZATIONPARENT" = 99ade7798627e67921139697ba1a004fa8a304bb
          test "$FAILEDWORKFLOWRUNID" = 33137514692
          test "$FAILEDWORKFLOWHEAD" = 79b95f0ee0fafeb07f3785da91e63598035d4ac1
          test "$FAILEDPREFLIGHTARTIFACTID" = 9672728847
          test "$FAILEDPREFLIGHTARTIFACTDIGEST" = sha256:afe5c4c11e7885023b443a49f2babbbe25f763f2486aa4042102c0a300bf16d6
          test "$CANCELCONTROLRUNID" = 33138196230

          mapfile -t REQUEST_PARENTS < <(git -C control cat-file -p HEAD | sed -n 's/^parent //p')
          test "${#REQUEST_PARENTS[@]}" = 1
          CONTROL_HEAD="${REQUEST_PARENTS[0]}"
          mapfile -t REQUEST_CHANGED < <(git -C control diff-tree --no-commit-id --name-only -r HEAD)
          test "${#REQUEST_CHANGED[@]}" = 1
          test "${REQUEST_CHANGED[0]}" = .github/dispatch-requests/avps-v1-stage-b-executor-recovery.json
          mapfile -t CONTROL_PARENTS < <(git -C control cat-file -p "$CONTROL_HEAD" | sed -n 's/^parent //p')
          test "${#CONTROL_PARENTS[@]}" = 1
          test "${CONTROL_PARENTS[0]}" = "$AUTHORIZATIONPARENT"
          mapfile -t CONTROL_CHANGED < <(git -C control diff-tree --no-commit-id --name-only -r "$CONTROL_HEAD")
          test "${#CONTROL_CHANGED[@]}" = 2
          printf '%s\n' "${CONTROL_CHANGED[@]}" | sort > control-changed.txt
          printf '%s\n' \
            '.github/workflows/avps-v1-stage-b-executor-recovery.yml' \
            'review/avps-v1-ordinal40-stage-b-executor-recovery-v1/recovery_executor.py' | sort > expected-control-changed.txt
          diff -u expected-control-changed.txt control-changed.txt

          git -C control fetch origin main "$RECOVERYREVIEWHEAD" "$AUTHORIZATIONHEAD" \
            authorization/aerosol-vertical-profile-sensitivity-v1-ordinal-40 \
            dispatch/aerosol-vertical-profile-sensitivity-v1-ordinal-40
          test "$(git -C control rev-parse origin/main)" = "$AUTHORIZATIONPARENT"
          test "$(git -C control rev-parse origin/authorization/aerosol-vertical-profile-sensitivity-v1-ordinal-40)" = "$AUTHORIZATIONHEAD"
          test "$(git -C control rev-parse origin/dispatch/aerosol-vertical-profile-sensitivity-v1-ordinal-40)" = "$AUTHORIZATIONHEAD"

          gh api "repos/${GITHUB_REPOSITORY}/pulls/${RECOVERYREVIEWPR}" > recovery-review-pr.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RECOVERYREVIEWRUNID}" > recovery-review-run.json
          python - <<'PY'
          import json,os
          p=json.load(open('recovery-review-pr.json')); r=json.load(open('recovery-review-run.json'))
          if p.get('state')!='open' or p.get('draft') is not True or p.get('merged_at') is not None:
              raise SystemExit('recovery review PR must remain Draft/open/unmerged')
          if (p.get('base') or {}).get('sha')!=os.environ['AUTHORIZATIONPARENT']:
              raise SystemExit('recovery review base drift')
          if (p.get('head') or {}).get('ref')!='review/avps-v1-ordinal40-stage-b-executor-contract-recovery-1' or (p.get('head') or {}).get('sha')!=os.environ['RECOVERYREVIEWHEAD']:
              raise SystemExit('recovery review head drift')
          if r.get('head_sha')!=os.environ['RECOVERYREVIEWHEAD'] or int(r.get('run_attempt') or 0)!=1 or r.get('status')!='completed' or r.get('conclusion')!='success':
              raise SystemExit('recovery review run is not exact attempt-1 success')
          PY

          REVIEW_TEMPLATE_BLOB="$(git -C control rev-parse "$RECOVERYREVIEWHEAD:.github/recovery-templates/avps-v1-stage-b-executor-recovery.yml")"
          REVIEW_EXECUTOR_BLOB="$(git -C control rev-parse "$RECOVERYREVIEWHEAD:review/avps-v1-ordinal40-stage-b-executor-recovery-v1/recovery_executor.py")"
          test "$(git -C control rev-parse "$CONTROL_HEAD:.github/workflows/avps-v1-stage-b-executor-recovery.yml")" = "$REVIEW_TEMPLATE_BLOB"
          test "$(git -C control rev-parse "$CONTROL_HEAD:review/avps-v1-ordinal40-stage-b-executor-recovery-v1/recovery_executor.py")" = "$REVIEW_EXECUTOR_BLOB"

          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/avps-v1-stage-b-executor-recovery.yml/runs?branch=${GITHUB_REF_NAME}&event=push&per_page=100" > recovery-run-pages.json
          python - <<'PY'
          import json,os
          runs=[r for p in json.load(open('recovery-run-pages.json')) for r in p.get('workflow_runs',[])]
          ids=[int(r.get('id') or 0) for r in runs]
          if ids != [int(os.environ['GITHUB_RUN_ID'])]:
              raise SystemExit(f'executor recovery is not one-shot: {ids}')
          PY

          echo "ordinal=$SCIENTIFICORDINAL" >> "$GITHUB_OUTPUT"
          echo "auth_head=$AUTHORIZATIONHEAD" >> "$GITHUB_OUTPUT"
          echo "control_head=$CONTROL_HEAD" >> "$GITHUB_OUTPUT"

      - name: Checkout exact frozen authorized scientific tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.identity.outputs.auth_head }}
          path: science
          fetch-depth: 0
          persist-credentials: false

      - name: Prove failed attempt, cancellation, zero case artifacts, and bind immutable preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git -C science rev-parse HEAD)" = 338ee82c8e088e929f45782b1f7ac1c3aaaaa533
          test "$(git -C science rev-parse HEAD:experiments/aerosol-vertical-profile-sensitivity-v1/executor.py)" = 68eb7f6916bae204e60f6a378eae25f9c2bff184
          test "$(git -C science rev-parse HEAD:experiments/aerosol-vertical-profile-sensitivity-v1/execution-contract.review.json)" = 230874923004115ff21f218bb0ce4d2e038d3a98

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33137514692" > failed-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33137514692/artifacts?per_page=100" > failed-artifacts.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/98741943312/logs" > failed-job-1.log
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/98741943322/logs" > failed-job-2.log
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33138196230" > cancel-run.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/60/comments?per_page=100" > issue60-pages.json
          gh api "repos/${GITHUB_REPOSITORY}/pulls/565" > auth-pr.json

          python - <<'PY'
          import json
          r=json.load(open('failed-run.json'))
          if int(r.get('id') or 0)!=33137514692 or r.get('head_sha')!='79b95f0ee0fafeb07f3785da91e63598035d4ac1' or r.get('head_branch')!='status/avps-v1-stage-b-science-recovery-ordinal-40' or r.get('event')!='workflow_dispatch' or int(r.get('run_attempt') or 0)!=1 or r.get('status')!='completed' or r.get('conclusion')!='cancelled':
              raise SystemExit('failed execution identity drift')
          arts=json.load(open('failed-artifacts.json')).get('artifacts',[])
          if len(arts)!=1 or int(arts[0].get('id') or 0)!=9672728847 or arts[0].get('digest')!='sha256:afe5c4c11e7885023b443a49f2babbbe25f763f2486aa4042102c0a300bf16d6':
              raise SystemExit('failed preflight artifact identity drift')
          if any(str(a.get('name') or '').startswith('avps-v1-case-') for a in arts):
              raise SystemExit('partial case artifact reuse is forbidden')
          needle='required raw output/member missing or empty: syntax-stdout.txt'
          for f in ('failed-job-1.log','failed-job-2.log'):
              if needle not in open(f,encoding='utf-8',errors='replace').read():
                  raise SystemExit(f'exemplar transport refusal missing: {f}')
          c=json.load(open('cancel-run.json'))
          if int(c.get('id') or 0)!=33138196230 or int(c.get('run_attempt') or 0)!=1 or c.get('status')!='completed' or c.get('conclusion')!='success':
              raise SystemExit('controlled cancellation evidence drift')
          p=json.load(open('auth-pr.json'))
          if p.get('state')!='open' or p.get('draft') is not True or p.get('merged_at') is not None or (p.get('head') or {}).get('sha')!='338ee82c8e088e929f45782b1f7ac1c3aaaaa533' or (p.get('base') or {}).get('sha')!='99ade7798627e67921139697ba1a004fa8a304bb':
              raise SystemExit('authorization PR drift')
          bodies=[str(x.get('body') or '').strip() for page in json.load(open('issue60-pages.json')) for x in page]
          alloc='ORDINAL40_AVPS_V1_AUTHORIZATION_ALLOCATED_REVIEWED_NOT_DISPATCHED commit=338ee82c8e088e929f45782b1f7ac1c3aaaaa533 parent=99ade7798627e67921139697ba1a004fa8a304bb pr=565'
          cons='ORDINAL40_AVPS_V1_DISPATCH_CONSUMED'
          if sum(x==alloc for x in bodies)!=1 or sum(x==cons for x in bodies)!=1:
              raise SystemExit('allocation/consumption cardinality drift')
          PY

          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9672728847/zip" > failed-preflight.zip
          test "sha256:$(sha256sum failed-preflight.zip | awk '{print $1}')" = sha256:afe5c4c11e7885023b443a49f2babbbe25f763f2486aa4042102c0a300bf16d6
          mkdir failed-preflight
          unzip -q failed-preflight.zip -d failed-preflight
          test -f failed-preflight/execution-guard.json
          test -f failed-preflight/authorization.json
          test -f failed-preflight/optprop_v2.1.tar.gz
          test "$(stat -c %s failed-preflight/optprop_v2.1.tar.gz)" = 743391266
          printf '%s  %s\n' '11daa1f1f4be0fd4ddf7e881ec2005498049674a1540d37b4b1e8f5e16052c7e' failed-preflight/optprop_v2.1.tar.gz | sha256sum -c -

      - name: Recheck live 72-seed identity with bounded transport-only retry
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUTH_HEAD: ${{ steps.identity.outputs.auth_head }}
        run: |
          set -euo pipefail
          mkdir -p recovery-preflight
          git -C science ls-files -z > recovery-preflight/tracked-files.nul
          (
            cd science
            python - <<'PY' > ../recovery-preflight/candidate-seed-ledger.json
          import importlib.util,json,sys
          from pathlib import Path
          p=Path('experiments/aerosol-vertical-profile-sensitivity-v1/seed_ledger.py')
          s=importlib.util.spec_from_file_location('executor_recovery_seed_ledger',p); m=importlib.util.module_from_spec(s); sys.modules[s.name]=m; s.loader.exec_module(m)
          print(json.dumps(m.validate_ledger(),indent=2,sort_keys=True))
          PY
          )
          printf '%s\n' '{"schemaVersion":2,"requiredTrackedSelfLedgerPaths":[],"futureEvidenceSelfLedgerPaths":[]}' > recovery-preflight/empty-self-ledger-policy.json
          python science/experiments/aerosol-vertical-profile-sensitivity-v1/tracked_tree_seed_scan.py \
            --repo-root science \
            --file-list recovery-preflight/tracked-files.nul \
            --candidate-seed-ledger recovery-preflight/candidate-seed-ledger.json \
            --allow-self-ledger-json recovery-preflight/empty-self-ledger-policy.json \
            --output recovery-preflight/tracked-seed-scan.json
          scan_attempt=1
          while true; do
            scan_stdout="recovery-preflight/repository-global-seed-scan-attempt-${scan_attempt}.stdout"
            scan_stderr="recovery-preflight/repository-global-seed-scan-attempt-${scan_attempt}.stderr"
            rm -f recovery-preflight/repository-global-seed-scan.json
            set +e
            python science/experiments/aerosol-vertical-profile-sensitivity-v1/repository_global_seed_scan.py \
              --repository "$GITHUB_REPOSITORY" \
              --issue-number 60 \
              --candidate-seed-ledger recovery-preflight/candidate-seed-ledger.json \
              --current-run-id "$GITHUB_RUN_ID" \
              --audit-mode authorization-recheck \
              --expected-branch-name "dispatch/aerosol-vertical-profile-sensitivity-v1-ordinal-40" \
              --expected-repo-head "$AUTH_HEAD" \
              --output recovery-preflight/repository-global-seed-scan.json \
              >"$scan_stdout" 2>"$scan_stderr"
            rc=$?
            set -e
            cat "$scan_stdout"
            if [ "$rc" -eq 0 ]; then break; fi
            cat "$scan_stderr" >&2
            if [ "$scan_attempt" -ge 3 ]; then exit "$rc"; fi
            if ! python - "$scan_stderr" <<'PY'
          import re,sys
          text=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          ok=bool(re.search(r'HTTP Error 5[0-9]{2}',text)) or any(x in text for x in (
            'urllib.error.URLError','TimeoutError','socket.timeout','RemoteDisconnected',
            'ConnectionResetError','BrokenPipeError','Temporary failure in name resolution'))
          raise SystemExit(0 if ok else 1)
          PY
            then
              echo 'seed scan failed for non-transport reason; refusing retry' >&2
              exit "$rc"
            fi
            sleep "$((5 * scan_attempt))"
            scan_attempt=$((scan_attempt + 1))
          done
          printf '%s\n' "$scan_attempt" > recovery-preflight/repository-global-seed-scan-success-attempt.txt
          python science/experiments/aerosol-vertical-profile-sensitivity-v1/build_seed_authorization_proof.py \
            --stage-dir science/experiments/aerosol-vertical-profile-sensitivity-v1 \
            --tracked-tree-report recovery-preflight/tracked-seed-scan.json \
            --repository-global-report recovery-preflight/repository-global-seed-scan.json \
            --expected-main-head "$AUTH_HEAD" \
            --output recovery-preflight/live-seed-authorization-proof.json
          python - <<'PY'
          import json
          p=json.load(open('recovery-preflight/live-seed-authorization-proof.json'))
          if p.get('candidateSeedCanonicalSha256')!='a2e22b526dfad84d4f23c0ca8b143d028fddc7e55f78deb93a43e194ebd6c35e': raise SystemExit('candidate seed hash drift')
          if p.get('candidateRowsCanonicalSha256')!='f22de8a9e30ba106759effb1170a5ca1d1e747cb2ac68293fa232dc7ed6ca683': raise SystemExit('candidate row hash drift')
          PY

      - name: Derive current-run recovery guard from immutable successful failed-run preflight
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          old=json.load(open('failed-preflight/execution-guard.json'))
          auth=json.load(open('science/experiments/aerosol-vertical-profile-sensitivity-v1/authorization.json'))
          old_auth=json.load(open('failed-preflight/authorization.json'))
          live=json.load(open('recovery-preflight/live-seed-authorization-proof.json'))
          if old_auth!=auth: raise SystemExit('failed preflight authorization bytes/content differ from current frozen authorization')
          if old.get('status')!='EXACT_ONE_USE_AVPS_V1_DISPATCH_AUTHORIZED' or int(old.get('workflowRunId') or 0)!=33137514692 or old.get('workflowRunAttempt')!=1 or old.get('solverExecutionPermittedNow') is not True:
              raise SystemExit('failed-run successful preflight guard identity drift')
          if old.get('githubRerun') is not False or old.get('retryAllowed') is not False or old.get('resumeAllowed') is not False:
              raise SystemExit('failed-run guard violated one-shot semantics')
          canonical=hashlib.sha256(json.dumps(auth,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
          if old.get('authorizationDocumentSha256')!=canonical: raise SystemExit('old guard authorization binding drift')
          if old.get('executionContractGitBlobSha1')!='230874923004115ff21f218bb0ce4d2e038d3a98': raise SystemExit('old guard execution contract drift')
          if live.get('candidateSeedCanonicalSha256')!=auth.get('candidateSeedCanonicalSha256') or live.get('candidateRowsCanonicalSha256')!=auth.get('candidateRowsCanonicalSha256'):
              raise SystemExit('live recovery seed proof differs from frozen authorization')
          new=dict(old)
          new['workflowRunId']=int(os.environ['GITHUB_RUN_ID'])
          new['workflowRunAttempt']=1
          new['transportRecoveryAuthorized']=True
          new['recoveryOfWorkflowRunId']=33137514692
          new['recoveryReason']='EMPTY_DIAGNOSTIC_STREAM_ARTIFACT_CONTRACT_ONLY'
          new['recoveryLiveSeedRecheckPassed']=True
          new['recoveryRerunsExact360FromScratch']=True
          new['partialCaseReuseAuthorized']=False
          new['scientificInputsChangedByRecovery']=False
          new['resultOpeningAuthorizedByRecovery']=False
          Path('recovery-preflight/execution-guard.json').write_text(json.dumps(new,indent=2,sort_keys=True)+'\n')
          Path('recovery-preflight/authorization.json').write_text(json.dumps(auth,indent=2,sort_keys=True)+'\n')
          transport={
            'schemaVersion':1,
            'status':'SEPARATELY_REVIEWED_EXECUTOR_CONTRACT_RECOVERY_PREFLIGHT_PASS',
            'recoveryOfWorkflowRunId':33137514692,
            'failedPreflightArtifactId':9672728847,
            'failedPreflightArtifactDigest':'sha256:afe5c4c11e7885023b443a49f2babbbe25f763f2486aa4042102c0a300bf16d6',
            'authorizedOriginalExecutorGitBlobSha1':'68eb7f6916bae204e60f6a378eae25f9c2bff184',
            'repairScope':'EMPTY_DIAGNOSTIC_STREAM_ARTIFACT_CONTRACT_ONLY',
            'rerunAll360FromScratch':True,
            'githubRerun':False,
            'retryOfFailedWorkflowAttempt':False,
            'resumeOfPartialCaseSet':False,
            'scientificInputsChanged':False,
            'seedAllocationChanged':False,
            'caseUniverseChanged':False,
            'runtimeIdentityChanged':False,
            'resultOpeningAuthorized':False,
          }
          Path('recovery-preflight/recovery-transport.json').write_text(json.dumps(transport,indent=2,sort_keys=True)+'\n')
          PY
          cp failed-preflight/optprop_v2.1.tar.gz recovery-preflight/optprop_v2.1.tar.gz

      - name: Emit exact four 90-case matrices from frozen authorization
        id: matrices
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=science/experiments/aerosol-vertical-profile-sensitivity-v1 python - <<'PY'
          import importlib.util,json,os,sys
          from pathlib import Path
          p=Path('science/experiments/aerosol-vertical-profile-sensitivity-v1/adapter.py')
          s=importlib.util.spec_from_file_location('executor_recovery_adapter',p); m=importlib.util.module_from_spec(s); sys.modules[s.name]=m; s.loader.exec_module(m)
          auth=json.load(open('science/experiments/aerosol-vertical-profile-sensitivity-v1/authorization.json'))
          cases=m.authorized_case_universe(auth); by={2:[],4:[],6:[],8:[]}
          for case in cases:
              dep=int(round(float(case['sunDepressionDeg'])))
              if dep not in by: raise SystemExit(f'unexpected depression {dep}')
              by[dep].append({'caseId':case['caseId']})
          if any(len(x)!=90 for x in by.values()) or len({r['caseId'] for x in by.values() for r in x})!=360:
              raise SystemExit('exact frozen 360-case universe drift')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              for dep in (2,4,6,8):
                  f.write(f'matrix{dep}='+json.dumps({'include':sorted(by[dep],key=lambda r:r['caseId'])},sort_keys=True,separators=(',',':'))+'\n')
          PY

      - name: Persist immutable recovery preflight
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: avps-v1-stage-b-executor-recovery-preflight-ordinal-40
          path: recovery-preflight/
          if-no-files-found: error
          compression-level: 0

  cases-dep2:
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix2) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps: &case_steps
      - name: Checkout exact frozen authorized science
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.auth_head }}
          path: science
          persist-credentials: false

      - name: Checkout exact recovery control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.control_head }}
          path: control
          persist-credentials: false

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: avps-v1
          create-args: -c conda-forge python=3.12.4 rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Fetch exact same-run recovery preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" > current-run-artifact-pages.json
          AID="$(python - <<'PY'
          import json
          rows=[a for p in json.load(open('current-run-artifact-pages.json')) for a in p.get('artifacts',[])]
          good=[a for a in rows if a.get('name')=='avps-v1-stage-b-executor-recovery-preflight-ordinal-40' and not a.get('expired',False)]
          if len(good)!=1: raise SystemExit(f'expected one recovery preflight artifact, got {len(good)}')
          print(good[0]['id'])
          PY
          )"
          mkdir preflight
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${AID}/zip" > preflight.zip
          unzip -q preflight.zip -d preflight
          test -f preflight/execution-guard.json
          test -f preflight/recovery-transport.json
          test -f preflight/authorization.json
          test -f preflight/optprop_v2.1.tar.gz

      - name: Reconstruct exact frozen OPAC overlay and capture runtime identity
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          ARCHIVE=preflight/optprop_v2.1.tar.gz
          test "$(stat -c %s "$ARCHIVE")" = 743391266
          printf '%s  %s\n' '11daa1f1f4be0fd4ddf7e881ec2005498049674a1540d37b4b1e8f5e16052c7e' "$ARCHIVE" | sha256sum -c -
          PYTHONPATH=science/experiments/aerosol-full-phase-function-sensitivity-v1/execution-candidate python - <<'PY'
          import json,os
          from pathlib import Path
          from runtime_overlay import stage_frozen_overlay
          base=Path(os.environ['CONDA_PREFIX'])/'share/libRadtran/data'
          report=stage_frozen_overlay(base,Path('preflight/optprop_v2.1.tar.gz'),Path('libradtran-overlay'))
          Path('overlay-report.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          if report.get('status')!='FROZEN_OPAC_RUNTIME_OVERLAY_STAGED' or report.get('augmentedDataTreeSha256')!='5d8bbf8e6b91ec3d405dee36f21a94afbb6e5ec6cd67da2dd5dd541738199d80':
              raise SystemExit('OPAC overlay identity drift')
          PY
          python science/experiments/mystic-batch-v1/runtime_probe.py \
            --uvspec "$(command -v uvspec)" \
            --data-dir "$PWD/libradtran-overlay/data" \
            --atmosphere "$PWD/libradtran-overlay/data/atmmod/afglus.dat" \
            --runtime-lock science/experiments/mystic-batch-v1/runtime-lock.micromamba.json \
            --output runtime-report.json
          python - <<'PY'
          import json
          r=json.load(open('runtime-report.json'))
          if r.get('scientificSolverExecuted') is not False or r.get('libRadtranDataTreeSha256')!='5d8bbf8e6b91ec3d405dee36f21a94afbb6e5ec6cd67da2dd5dd541738199d80':
              raise SystemExit('pre-solver runtime identity drift')
          PY

      - name: Execute exactly one preregistered AVPS case through reviewed transport recovery
        shell: micromamba-shell {0}
        env:
          CASE_ID: ${{ matrix.caseId }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util,os,shutil,sys
          from pathlib import Path
          p=Path('control/review/avps-v1-ordinal40-stage-b-executor-recovery-v1/recovery_executor.py')
          s=importlib.util.spec_from_file_location('avps_executor_contract_recovery',p); m=importlib.util.module_from_spec(s); sys.modules[s.name]=m; s.loader.exec_module(m)
          uvspec=shutil.which('uvspec')
          if not uvspec: raise SystemExit('uvspec missing')
          out=m.execute_case_recovery(
              Path('science'),
              Path('preflight/authorization.json'),
              Path('preflight/execution-guard.json'),
              Path('runtime-report.json'),
              os.environ['CASE_ID'],
              Path('libradtran-overlay/data'),
              Path('case-output'),
              Path(uvspec),
              allow_execution=True,
          )
          if out.get('transportRecovery') is not True or out.get('recoveryOfWorkflowRunId')!=33137514692:
              raise SystemExit('case recovery provenance missing')
          PY
          cp overlay-report.json "case-output/${CASE_ID}/overlay-report.json"

      - name: Persist immutable raw recovered case evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: avps-v1-case-${{ matrix.caseId }}
          path: case-output/${{ matrix.caseId }}/
          if-no-files-found: error
          compression-level: 0

  cases-dep4:
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix4) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps: *case_steps

  cases-dep6:
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix6) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps: *case_steps

  cases-dep8:
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix8) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps: *case_steps

  freeze-exact360-artifact-metadata:
    if: ${{ always() }}
    needs: [preflight, cases-dep2, cases-dep4, cases-dep6, cases-dep8]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact frozen authorized science for case universe only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.auth_head }}
          path: science
          persist-credentials: false

      - name: Freeze exact 360 raw artifact metadata without opening contents
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${{ needs.cases-dep2.result }}" = success
          test "${{ needs.cases-dep4.result }}" = success
          test "${{ needs.cases-dep6.result }}" = success
          test "${{ needs.cases-dep8.result }}" = success
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" > artifact-pages.json
          PYTHONPATH=science/experiments/aerosol-vertical-profile-sensitivity-v1 python - <<'PY'
          import importlib.util,json,os,sys
          from pathlib import Path
          p=Path('science/experiments/aerosol-vertical-profile-sensitivity-v1/adapter.py')
          s=importlib.util.spec_from_file_location('freeze_exact360_adapter',p); m=importlib.util.module_from_spec(s); sys.modules[s.name]=m; s.loader.exec_module(m)
          auth=json.load(open('science/experiments/aerosol-vertical-profile-sensitivity-v1/authorization.json'))
          expected={f"avps-v1-case-{c['caseId']}" for c in m.authorized_case_universe(auth)}
          pages=json.load(open('artifact-pages.json')); rows=[a for page in pages for a in page.get('artifacts',[])]
          cases=[a for a in rows if str(a.get('name') or '').startswith('avps-v1-case-') and not a.get('expired',False)]
          names=[a['name'] for a in cases]
          if len(cases)!=360 or len(set(names))!=360 or set(names)!=expected:
              raise SystemExit(f'exact360 artifact universe mismatch: count={len(cases)} unique={len(set(names))} missing={len(expected-set(names))} extra={len(set(names)-expected)}')
          index={
            'schemaVersion':1,
            'status':'EXACT360_RAW_RECOVERY_ARTIFACT_METADATA_FROZEN_RESULTS_UNOPENED',
            'workflowRunId':int(os.environ['GITHUB_RUN_ID']),
            'recoveryOfWorkflowRunId':33137514692,
            'caseArtifactCount':360,
            'caseArtifactNames':sorted(names),
            'artifacts':[{'id':int(a['id']),'name':a['name'],'digest':a.get('digest'),'sizeInBytes':int(a.get('size_in_bytes') or 0)} for a in sorted(cases,key=lambda x:x['name'])],
            'caseContentsDownloaded':False,
            'aggregateResultsCalled':False,
            'openResultsCalled':False,
            'scientificInterpretationPerformed':False,
          }
          Path('exact360-artifact-metadata.json').write_text(json.dumps(index,indent=2,sort_keys=True)+'\n')
          print('EXACT360_RAW_RECOVERY_ARTIFACT_METADATA_FROZEN_RESULTS_UNOPENED')
          PY

      - name: Persist exact360 artifact metadata only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: avps-v1-stage-b-executor-recovery-exact360-metadata
          path: exact360-artifact-metadata.json
          if-no-files-found: error
          compression-level: 0
