name: OPAC continental_average multispecies transport capability v1
on:
  push:
    branches: [status/opac-continental-average-multispecies-transport-capability-v1]
    paths: [.github/dispatch-requests/opac-continental-average-multispecies-transport-capability-v1.json]
permissions: {actions: read, contents: read, pull-requests: read}
concurrency: {group: opac-continental-average-multispecies-transport-capability-v1, cancel-in-progress: false}
jobs:
  capability:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      SOURCE_URL: https://www.libradtran.org/lib/exe/fetch.php?media=download%3Aoptprop_v2.1.tar.gz
      V5_PR: '590'
      V5_REVIEW_HEAD: f0675ec48c637509cd7a5bb9c2a2746507e5bea8
      V5_RUN_ID: '33186446347'
      V5_ARTIFACT_ID: '9691923455'
      V5_ARTIFACT_DIGEST: sha256:fed6bb961088232e593159c4f50911758802e9209aed86e2a0eef4b403e4d9b7
      SOURCE_AUDIT_PR: '591'
      SOURCE_AUDIT_HEAD: 2bfae9341075eb04fe4621f4f53d4ab56262c22b
      SOURCE_AUDIT_RUN_ID: '33187119926'
      SOURCE_AUDIT_ARTIFACT_ID: '9692162280'
      SOURCE_AUDIT_ARTIFACT_DIGEST: sha256:cdcb0041a5197e31ff24520b3e653119d11c5d4a1c1b4f727e392ba7e719101e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {path: control, fetch-depth: 0, persist-credentials: false}
      - name: Bind exact reviewed one-shot identity and predecessor evidence
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = status/opac-continental-average-multispecies-transport-capability-v1
          python - <<'PY' > req.env
          import json
          r=json.load(open('control/.github/dispatch-requests/opac-continental-average-multispecies-transport-capability-v1.json'))
          if (r.get('schemaVersion'),r.get('stageId'),r.get('status')) != (1,'opac-continental-average-multispecies-transport-capability-v1','REQUEST_ONE_SHOT_OPAC_CONTINENTAL_AVERAGE_MULTISPECIES_CAPABILITY_V1'):
              raise SystemExit('request drift')
          for k in ('reviewPr','reviewRunId'): print(f'{k.upper()}={int(r[k])}')
          for k in ('reviewHead','baseMain'):
              v=r[k]
              if len(v)!=40 or any(c not in '0123456789abcdef' for c in v): raise SystemExit(f'{k} invalid')
              print(f'{k.upper()}={v}')
          PY
          source req.env; export REVIEWPR REVIEWRUNID REVIEWHEAD BASEMAIN
          test "$BASEMAIN" = 99ade7798627e67921139697ba1a004fa8a304bb
          P="$(git -C control rev-parse HEAD^)"
          test "$(git -C control diff-tree --no-commit-id --name-only -r HEAD)" = .github/dispatch-requests/opac-continental-average-multispecies-transport-capability-v1.json
          test "$(git -C control rev-parse "$P^")" = "$BASEMAIN"
          test "$(git -C control diff-tree --no-commit-id --name-only -r "$P" | sort | tr '\n' ' ')" = ".github/workflows/opac-continental-average-multispecies-transport-capability-v1.yml review/opac-continental-average-multispecies-transport-capability-v1/activation_support.py review/opac-continental-average-multispecies-transport-capability-v1/build_inputs.py "
          git -C control fetch origin main "$REVIEWHEAD"
          test "$(git -C control rev-parse origin/main)" = "$BASEMAIN"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$REVIEWPR" > pr.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REVIEWRUNID" > review-run.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/$V5_PR" > v5-pr.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V5_RUN_ID" > v5-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V5_RUN_ID/artifacts" > v5-artifacts.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/$SOURCE_AUDIT_PR" > source-pr.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_AUDIT_RUN_ID" > source-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_AUDIT_RUN_ID/artifacts" > source-artifacts.json
          REVIEWHEAD="$REVIEWHEAD" REVIEWRUNID="$REVIEWRUNID" python - <<'PY'
          import json,os
          p=json.load(open('pr.json')); r=json.load(open('review-run.json'))
          if p['state']!='open' or p['draft'] is not True or p['merged_at'] is not None or p['head']['ref']!='review/opac-continental-average-multispecies-transport-capability-v1' or p['head']['sha']!=os.environ['REVIEWHEAD'] or p['base']['sha']!='99ade7798627e67921139697ba1a004fa8a304bb': raise SystemExit('review PR drift')
          if r['id']!=int(os.environ['REVIEWRUNID']) or r['head_sha']!=os.environ['REVIEWHEAD'] or r['run_attempt']!=1 or r['conclusion']!='success': raise SystemExit('review run drift')
          vp=json.load(open('v5-pr.json')); vr=json.load(open('v5-run.json')); va=json.load(open('v5-artifacts.json'))['artifacts']
          if vp['state']!='open' or vp['draft'] is not True or vp['merged_at'] is not None or vp['head']['sha']!=os.environ['V5_REVIEW_HEAD']: raise SystemExit('v5 PR drift')
          if vr['id']!=int(os.environ['V5_RUN_ID']) or vr['run_attempt']!=1 or vr['conclusion']!='success': raise SystemExit('v5 run drift')
          vm=[a for a in va if a['id']==int(os.environ['V5_ARTIFACT_ID'])]
          if len(vm)!=1 or vm[0].get('digest')!=os.environ['V5_ARTIFACT_DIGEST'] or vm[0].get('expired'): raise SystemExit('v5 artifact drift')
          sp=json.load(open('source-pr.json')); sr=json.load(open('source-run.json')); sa=json.load(open('source-artifacts.json'))['artifacts']
          if sp['state']!='open' or sp['draft'] is not True or sp['merged_at'] is not None or sp['head']['sha']!=os.environ['SOURCE_AUDIT_HEAD']: raise SystemExit('source audit PR drift')
          if sr['id']!=int(os.environ['SOURCE_AUDIT_RUN_ID']) or sr['head_sha']!=os.environ['SOURCE_AUDIT_HEAD'] or sr['run_attempt']!=1 or sr['conclusion']!='success': raise SystemExit('source audit run drift')
          sm=[a for a in sa if a['id']==int(os.environ['SOURCE_AUDIT_ARTIFACT_ID'])]
          if len(sm)!=1 or sm[0].get('digest')!=os.environ['SOURCE_AUDIT_ARTIFACT_DIGEST'] or sm[0].get('expired'): raise SystemExit('source audit artifact drift')
          PY
          test "$(git -C control rev-parse "$P:.github/workflows/opac-continental-average-multispecies-transport-capability-v1.yml")" = "$(git -C control rev-parse "$REVIEWHEAD:.github/recovery-templates/opac-continental-average-multispecies-transport-capability-v1.yml")"
          test "$(git -C control rev-parse "$P:review/opac-continental-average-multispecies-transport-capability-v1/build_inputs.py")" = "$(git -C control rev-parse "$REVIEWHEAD:review/opac-continental-average-multispecies-transport-capability-v1/build_inputs.py")"
          test "$(git -C control rev-parse "$P:review/opac-continental-average-multispecies-transport-capability-v1/activation_support.py")" = "$(git -C control rev-parse "$REVIEWHEAD:review/opac-continental-average-multispecies-transport-capability-v1/activation_support.py")"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs?branch=$GITHUB_REF_NAME&event=push&per_page=100" > runs.json
          python - <<'PY'
          import json,os
          ids=[r['id'] for page in json.load(open('runs.json')) for r in page['workflow_runs'] if r['path']=='.github/workflows/opac-continental-average-multispecies-transport-capability-v1.yml']
          if ids != [int(os.environ['GITHUB_RUN_ID'])]: raise SystemExit(f'not one-shot: {ids}')
          PY
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: opac-continental-multi-v1
          create-args: -c conda-forge python=3.12.4 rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true
      - name: Reconstruct frozen runtime and OPAC archive
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          mkdir evidence
          mkdir -p capability-runtime/share/libRadtran
          python control/experiments/mystic-batch-v1/runtime_probe.py --uvspec "$(command -v uvspec)" --data-dir "$CONDA_PREFIX/share/libRadtran/data" --atmosphere "$CONDA_PREFIX/share/libRadtran/data/atmmod/afglus.dat" --runtime-lock control/experiments/mystic-batch-v1/runtime-lock.micromamba.json --skip-help --output evidence/base.json
          cp -a "$CONDA_PREFIX/share/libRadtran/data" capability-runtime/share/libRadtran/data
          curl -L --fail --retry 3 --retry-all-errors --max-time 2700 -o evidence/opac.tar.gz "$SOURCE_URL"
          PYTHONPATH=control/review/opac-continental-average-multispecies-transport-capability-v1 python - <<'PY'
          from pathlib import Path
          from activation_support import extract_frozen_opac_archive
          extract_frozen_opac_archive(Path('evidence/opac.tar.gz'),Path('capability-runtime/share/libRadtran'))
          PY
          DATA="$GITHUB_WORKSPACE/capability-runtime/share/libRadtran/data"
          for s in inso waso soot suso; do test -f "$DATA/aerosol/OPAC/optprop/$s.mie.cdf"; done
          for s in INSO WASO SOOT SUSO; do test ! -e "$DATA/aerosol/OPAC/optprop/$s"; test ! -e "$DATA/aerosol/OPAC/optprop/$s.nc"; test ! -e "$DATA/aerosol/OPAC/$s.nc"; done
          python control/experiments/mystic-batch-v1/runtime_probe.py --uvspec "$(command -v uvspec)" --data-dir "$DATA" --atmosphere "$DATA/atmmod/afglus.dat" --runtime-lock control/experiments/mystic-batch-v1/runtime-lock.micromamba.json --skip-help --output evidence/pre-alias-runtime-report.json
          rm evidence/opac.tar.gz
      - name: Build four-species profiles and byte-identical aliases
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          DATA="$GITHUB_WORKSPACE/capability-runtime/share/libRadtran/data"
          python control/review/opac-continental-average-multispecies-transport-capability-v1/build_inputs.py --atmosphere "$DATA/atmmod/afglus.dat" --data-dir "$DATA" --repository-root "$GITHUB_WORKSPACE/control" --output capability-inputs > evidence/builder.json
          cp capability-inputs/input-manifest.json evidence/
          cp capability-inputs/profiles/* evidence/
          cp capability-inputs/inputs/* evidence/
          cmp "$DATA/aerosol/OPAC/optprop/inso.mie.cdf" "$DATA/aerosol/OPAC/optprop/INSO"
          cmp "$DATA/aerosol/OPAC/optprop/waso.mie.cdf" "$DATA/aerosol/OPAC/optprop/WASO"
          cmp "$DATA/aerosol/OPAC/optprop/soot.mie.cdf" "$DATA/aerosol/OPAC/optprop/SOOT"
          cmp "$DATA/aerosol/OPAC/optprop/suso.mie.cdf" "$DATA/aerosol/OPAC/optprop/SUSO"
          for s in INSO WASO SOOT SUSO; do test ! -e "$DATA/aerosol/OPAC/optprop/$s.nc"; test ! -e "$DATA/aerosol/OPAC/$s.nc"; done
          python control/experiments/mystic-batch-v1/runtime_probe.py --uvspec "$(command -v uvspec)" --data-dir "$DATA" --atmosphere "$DATA/atmmod/afglus.dat" --runtime-lock control/experiments/mystic-batch-v1/runtime-lock.micromamba.json --skip-help --output evidence/post-alias-runtime-report.json
          PYTHONPATH=control/review/opac-continental-average-multispecies-transport-capability-v1 python - <<'PY'
          import json
          from activation_support import validate_runtime_reports
          validate_runtime_reports(json.load(open('evidence/base.json')),json.load(open('evidence/pre-alias-runtime-report.json')),json.load(open('evidence/post-alias-runtime-report.json')),json.load(open('evidence/input-manifest.json'))['resolverAliases'])
          PY
      - name: Syntax and deterministic DISORT multispecies transport
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          for m in disort mystic; do for s in low high; do timeout 120 uvspec -c < capability-inputs/inputs/$m-$s.inp > evidence/$m-$s-syntax.out 2> evidence/$m-$s-syntax.err; done; done
          for s in low high; do timeout 300 uvspec < capability-inputs/inputs/disort-$s.inp > evidence/disort-$s.out 2> evidence/disort-$s.err; test -s evidence/disort-$s.out; done
          PYTHONPATH=control/review/opac-continental-average-multispecies-transport-capability-v1 python - <<'PY'
          from pathlib import Path
          from activation_support import validate_output_pair
          validate_output_pair(Path('evidence/disort-low.out'),Path('evidence/disort-high.out'),'DISORT')
          PY
      - name: Paired spherical MYSTIC multispecies transport
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          for s in low high; do
            timeout 2400 uvspec < capability-inputs/inputs/mystic-$s.inp > evidence/mystic-$s.out 2> evidence/mystic-$s.err
            test -s capability-inputs/runs/mystic-$s/mc.rad.spc
            test -s capability-inputs/runs/mystic-$s/mc.rad.std.spc
            cp capability-inputs/runs/mystic-$s/mc.rad.spc evidence/mystic-$s-mc.rad.spc
            cp capability-inputs/runs/mystic-$s/mc.rad.std.spc evidence/mystic-$s-mc.rad.std.spc
          done
          PYTHONPATH=control/review/opac-continental-average-multispecies-transport-capability-v1 python - <<'PY'
          from pathlib import Path
          from activation_support import validate_output_pair,parse_numeric_grid
          validate_output_pair(Path('evidence/mystic-low-mc.rad.spc'),Path('evidence/mystic-high-mc.rad.spc'),'MYSTIC_MC_RAD')
          lo,_=parse_numeric_grid(Path('evidence/mystic-low-mc.rad.std.spc')); hi,_=parse_numeric_grid(Path('evidence/mystic-high-mc.rad.std.spc'))
          if lo != hi: raise SystemExit('MYSTIC standard-deviation grid mismatch')
          PY
      - name: Freeze capability report
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p evidence
          PYTHONPATH=control/review/opac-continental-average-multispecies-transport-capability-v1 python - <<'PY'
          import os
          from pathlib import Path
          from activation_support import freeze_capability_report
          freeze_capability_report(Path('evidence'),int(os.environ['GITHUB_RUN_ID']))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with: {name: opac-continental-average-multispecies-transport-capability-v1, path: evidence/, if-no-files-found: error, compression-level: 0}
      - name: Require terminal PASS
        run: python -c "import json; assert json.load(open('evidence/capability-report.json'))['status']=='PASS_FOUR_CONTINENTAL_SPECIES_REACH_DISORT_AND_MYSTIC'"
