name: OPAC species-profile transport capability v2
run-name: OPAC species-profile transport capability v2 ${{ github.ref_name }}

on:
  push:
    branches:
      - status/opac-species-profile-transport-capability-v2
    paths:
      - .github/dispatch-requests/opac-species-profile-transport-capability-v2.json

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: opac-species-profile-transport-capability-v2-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  transport-capability:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      SOURCE_URL: https://www.libradtran.org/lib/exe/fetch.php?media=download%3Aoptprop_v2.1.tar.gz
      EXPECTED_ARCHIVE_SHA256: 11daa1f1f4be0fd4ddf7e881ec2005498049674a1540d37b4b1e8f5e16052c7e
      EXPECTED_ARCHIVE_SIZE: '743391266'
      EXPECTED_BASE_DATA_SHA256: ad30b49177e9c84e46497d69faf0c75e466996b0d0003f1de210289ae9f847d7
      EXPECTED_STAGED_DATA_SHA256: 5d8bbf8e6b91ec3d405dee36f21a94afbb6e5ec6cd67da2dd5dd541738199d80
      EXPECTED_UVSPEC_SHA256: 2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3
    steps:
      - name: Checkout exact capability request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
          fetch-depth: 0
          persist-credentials: false

      - name: Bind separately reviewed one-shot capability identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = status/opac-species-profile-transport-capability-v2
          test "$(git -C control rev-parse HEAD)" = "$GITHUB_SHA"

          python - <<'PY' > request.env
          import json
          r=json.load(open('control/.github/dispatch-requests/opac-species-profile-transport-capability-v2.json'))
          if r.get('schemaVersion') != 1: raise SystemExit('request schema drift')
          if r.get('stageId') != 'opac-species-profile-transport-capability-v2': raise SystemExit('stage drift')
          if r.get('status') != 'REQUEST_ONE_SHOT_CORRECTED_SPECIES_PROFILE_TRANSPORT_CAPABILITY': raise SystemExit('status drift')
          for key in ('reviewPr','reviewRunId'):
              v=r.get(key)
              if isinstance(v,bool) or not isinstance(v,int) or v<=0: raise SystemExit(f'{key} invalid')
              print(f'{key.upper()}={v}')
          for key in ('reviewHead','baseMain'):
              v=r.get(key)
              if not isinstance(v,str) or len(v)!=40 or any(c not in '0123456789abcdef' for c in v): raise SystemExit(f'{key} invalid')
              print(f'{key.upper()}={v}')
          PY
          source request.env
          export REVIEWPR REVIEWRUNID REVIEWHEAD BASEMAIN
          test "$BASEMAIN" = 99ade7798627e67921139697ba1a004fa8a304bb

          mapfile -t rp < <(git -C control cat-file -p HEAD | sed -n 's/^parent //p')
          test "${#rp[@]}" = 1
          CONTROL_HEAD="${rp[0]}"
          mapfile -t rc < <(git -C control diff-tree --no-commit-id --name-only -r HEAD)
          test "${#rc[@]}" = 1
          test "${rc[0]}" = .github/dispatch-requests/opac-species-profile-transport-capability-v2.json
          mapfile -t cp < <(git -C control cat-file -p "$CONTROL_HEAD" | sed -n 's/^parent //p')
          test "${#cp[@]}" = 1
          test "${cp[0]}" = "$BASEMAIN"
          mapfile -t cc < <(git -C control diff-tree --no-commit-id --name-only -r "$CONTROL_HEAD")
          test "${#cc[@]}" = 2
          printf '%s\n' "${cc[@]}" | sort > changed.txt
          printf '%s\n' '.github/workflows/opac-species-profile-transport-capability-v2.yml' 'review/opac-species-profile-transport-capability-v2/build_inputs.py' | sort > expected.txt
          diff -u expected.txt changed.txt

          git -C control fetch origin main "$REVIEWHEAD"
          test "$(git -C control rev-parse origin/main)" = "$BASEMAIN"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${REVIEWPR}" > review-pr.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${REVIEWRUNID}" > review-run.json
          REVIEWHEAD="$REVIEWHEAD" REVIEWRUNID="$REVIEWRUNID" python - <<'PY'
          import json,os
          p=json.load(open('review-pr.json')); r=json.load(open('review-run.json'))
          if p.get('state')!='open' or p.get('draft') is not True or p.get('merged_at') is not None: raise SystemExit('review PR must remain Draft/open/unmerged')
          if (p.get('head') or {}).get('ref')!='review/opac-species-profile-transport-capability-v2' or (p.get('head') or {}).get('sha')!=os.environ['REVIEWHEAD']: raise SystemExit('review PR head drift')
          if (p.get('base') or {}).get('sha')!='99ade7798627e67921139697ba1a004fa8a304bb': raise SystemExit('review PR base drift')
          if int(r.get('id') or 0)!=int(os.environ['REVIEWRUNID']) or r.get('head_sha')!=os.environ['REVIEWHEAD'] or int(r.get('run_attempt') or 0)!=1 or r.get('status')!='completed' or r.get('conclusion')!='success': raise SystemExit('dedicated review is not exact attempt-1 success')
          PY

          REVIEW_TEMPLATE_BLOB="$(git -C control rev-parse "$REVIEWHEAD:.github/recovery-templates/opac-species-profile-transport-capability-v2.yml")"
          REVIEW_BUILDER_BLOB="$(git -C control rev-parse "$REVIEWHEAD:review/opac-species-profile-transport-capability-v2/build_inputs.py")"
          test "$(git -C control rev-parse "$CONTROL_HEAD:.github/workflows/opac-species-profile-transport-capability-v2.yml")" = "$REVIEW_TEMPLATE_BLOB"
          test "$(git -C control rev-parse "$CONTROL_HEAD:review/opac-species-profile-transport-capability-v2/build_inputs.py")" = "$REVIEW_BUILDER_BLOB"

          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs?branch=${GITHUB_REF_NAME}&event=push&per_page=100" > current-runs.json
          python - <<'PY'
          import json,os
          runs=[r for page in json.load(open('current-runs.json')) for r in page.get('workflow_runs',[]) if r.get('path')=='.github/workflows/opac-species-profile-transport-capability-v2.yml']
          ids=[int(r.get('id') or 0) for r in runs]
          if ids != [int(os.environ['GITHUB_RUN_ID'])]: raise SystemExit(f'capability activation is not one-shot: {ids}')
          PY

      - name: Install exact locked libRadtran runtime
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: opac-species-profile-capability-v2
          create-args: -c conda-forge python=3.12.4 rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Bind exact base runtime before OPAC overlay
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          mkdir -p capability-evidence
          python control/experiments/mystic-batch-v1/runtime_probe.py \
            --uvspec "$(command -v uvspec)" \
            --data-dir "$CONDA_PREFIX/share/libRadtran/data" \
            --atmosphere "$CONDA_PREFIX/share/libRadtran/data/atmmod/afglus.dat" \
            --runtime-lock control/experiments/mystic-batch-v1/runtime-lock.micromamba.json \
            --skip-help \
            --output capability-evidence/base-runtime-report.json
          python - <<'PY'
          import json,os
          x=json.load(open('capability-evidence/base-runtime-report.json'))
          if x.get('scientificSolverExecuted') is not False or x.get('syntaxCheckExecuted') is not False: raise SystemExit('base runtime probe crossed execution boundary')
          if x.get('uvspecSha256') != os.environ['EXPECTED_UVSPEC_SHA256']: raise SystemExit('uvspec SHA drift')
          if x.get('libRadtranDataTreeSha256') != os.environ['EXPECTED_BASE_DATA_SHA256']: raise SystemExit('base data-tree SHA drift')
          PY

      - name: Reconstruct exact reviewed OPAC data tree
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/capability-runtime/share/libRadtran"
          cp -a "$CONDA_PREFIX/share/libRadtran/data" "$GITHUB_WORKSPACE/capability-runtime/share/libRadtran/data"
          curl --location --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 10 \
            --connect-timeout 30 --max-time 2700 \
            --user-agent 'twilight-mystic-experiments opac-species-profile-capability-v2/1.0' \
            --output capability-evidence/optprop_v2.1.tar.gz "$SOURCE_URL"
          python - <<'PY'
          import hashlib,os,tarfile
          from pathlib import Path,PurePosixPath
          archive=Path('capability-evidence/optprop_v2.1.tar.gz')
          root=Path(os.environ['GITHUB_WORKSPACE'])/'capability-runtime/share/libRadtran'
          if archive.stat().st_size != int(os.environ['EXPECTED_ARCHIVE_SIZE']): raise SystemExit('OPAC archive size drift')
          if hashlib.sha256(archive.read_bytes()).hexdigest() != os.environ['EXPECTED_ARCHIVE_SHA256']: raise SystemExit('OPAC archive SHA drift')
          with tarfile.open(archive,'r:gz') as tf:
              members=tf.getmembers()
              if len(members)!=28: raise SystemExit(f'archive member count drift: {len(members)}')
              for m in members:
                  p=PurePosixPath(m.name)
                  if not m.isfile() or p.is_absolute() or '..' in p.parts or not p.parts or p.parts[0]!='data': raise SystemExit(f'unsafe archive member: {m.name}')
                  dest=root.joinpath(*p.parts)
                  if dest.exists(): raise SystemExit(f'overlay collision: {m.name}')
              for m in members:
                  p=PurePosixPath(m.name); dest=root.joinpath(*p.parts); dest.parent.mkdir(parents=True,exist_ok=True)
                  src=tf.extractfile(m)
                  if src is None: raise SystemExit(f'cannot stream {m.name}')
                  with dest.open('xb') as out:
                      while True:
                          block=src.read(1024*1024)
                          if not block: break
                          out.write(block)
          PY
          DATA="$GITHUB_WORKSPACE/capability-runtime/share/libRadtran/data"
          test -f "$DATA/aerosol/OPAC/optprop/inso.mie.cdf"
          python control/experiments/mystic-batch-v1/runtime_probe.py \
            --uvspec "$(command -v uvspec)" \
            --data-dir "$DATA" \
            --atmosphere "$DATA/atmmod/afglus.dat" \
            --runtime-lock control/experiments/mystic-batch-v1/runtime-lock.micromamba.json \
            --skip-help \
            --output capability-evidence/staged-runtime-report.json
          python - <<'PY'
          import json,os
          x=json.load(open('capability-evidence/staged-runtime-report.json'))
          if x.get('uvspecSha256') != os.environ['EXPECTED_UVSPEC_SHA256']: raise SystemExit('staged uvspec SHA drift')
          if x.get('libRadtranDataTreeSha256') != os.environ['EXPECTED_STAGED_DATA_SHA256']: raise SystemExit('staged data-tree SHA drift')
          PY
          rm capability-evidence/optprop_v2.1.tar.gz

      - name: Freeze exact synthetic LOW/HIGH custom species-profile inputs
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          DATA="$GITHUB_WORKSPACE/capability-runtime/share/libRadtran/data"
          python control/review/opac-species-profile-transport-capability-v2/build_inputs.py \
            --atmosphere "$DATA/atmmod/afglus.dat" \
            --data-dir "$DATA" \
            --repository-root "$GITHUB_WORKSPACE/control" \
            --output "$GITHUB_WORKSPACE/capability-inputs" \
            > capability-evidence/input-builder-stdout.json
          cp capability-inputs/input-manifest.json capability-evidence/input-manifest.json
          cp capability-inputs/profiles/*.dat capability-evidence/
          cp capability-inputs/inputs/*.inp capability-evidence/
          python - <<'PY'
          from pathlib import Path
          for p in Path('capability-inputs/inputs').glob('*.inp'):
              t=p.read_text()
              if 'aerosol_file tau' in t or 'aerosol_file ssa' in t or 'aerosol_file gg' in t or 'aerosol_file moments' in t: raise SystemExit(f'competing aerosol_file directive found: {p}')
              if t.count('aerosol_species_library OPAC') != 1 or t.count('aerosol_species_file ') != 1 or t.count(' INSO') != 1: raise SystemExit(f'custom INSO species surface drift: {p}')
              if t.count('aerosol_set_tau_at_wvl 550 0.100000') != 1: raise SystemExit(f'AOD normalization drift: {p}')
          PY

      - name: Run four exact syntax checks
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          for mode in disort mystic; do
            for state in low high; do
              input="capability-inputs/inputs/${mode}-${state}.inp"
              set +e
              timeout 120 "$(command -v uvspec)" -c < "$input" > "capability-evidence/${mode}-${state}-syntax-stdout.txt" 2> "capability-evidence/${mode}-${state}-syntax-stderr.txt"
              status=$?
              set -e
              test "$status" = 0
            done
          done

      - name: Run deterministic DISORT LOW/HIGH transport check
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          for state in low high; do
            set +e
            timeout 300 "$(command -v uvspec)" < "capability-inputs/inputs/disort-${state}.inp" > "capability-evidence/disort-${state}-stdout.txt" 2> "capability-evidence/disort-${state}-stderr.txt"
            status=$?
            set -e
            test "$status" = 0
            test -s "capability-evidence/disort-${state}-stdout.txt"
          done
          LOW_SHA="$(sha256sum capability-evidence/disort-low-stdout.txt | awk '{print $1}')"
          HIGH_SHA="$(sha256sum capability-evidence/disort-high-stdout.txt | awk '{print $1}')"
          test "$LOW_SHA" != "$HIGH_SHA"
          python - <<'PY'
          import math
          from pathlib import Path
          def parse(path):
              rows=[]
              for line in Path(path).read_text().splitlines():
                  parts=line.split()
                  if len(parts)<2: continue
                  try: rows.append(tuple(float(x) for x in parts))
                  except ValueError: continue
              if not rows: raise SystemExit(f'no numeric DISORT rows: {path}')
              if any(not math.isfinite(x) for r in rows for x in r): raise SystemExit(f'nonfinite DISORT output: {path}')
              return rows
          low=parse('capability-evidence/disort-low-stdout.txt'); high=parse('capability-evidence/disort-high-stdout.txt')
          if [r[0] for r in low] != [r[0] for r in high]: raise SystemExit('DISORT wavelength grid drift between LOW/HIGH')
          if low == high: raise SystemExit('corrected species profiles are numerically identical in DISORT')
          PY

      - name: Run paired spherical MYSTIC LOW/HIGH transport check
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          for state in low high; do
            run_dir="capability-inputs/runs/mystic-${state}"
            set +e
            timeout 900 "$(command -v uvspec)" < "capability-inputs/inputs/mystic-${state}.inp" > "capability-evidence/mystic-${state}-solver-stdout.txt" 2> "capability-evidence/mystic-${state}-solver-stderr.txt"
            status=$?
            set -e
            test "$status" = 0
            test -s "$run_dir/mc.rad.spc"
            test -s "$run_dir/mc.rad.std.spc"
            cp "$run_dir/mc.rad.spc" "capability-evidence/mystic-${state}-mc.rad.spc"
            cp "$run_dir/mc.rad.std.spc" "capability-evidence/mystic-${state}-mc.rad.std.spc"
          done
          LOW_SHA="$(sha256sum capability-evidence/mystic-low-mc.rad.spc | awk '{print $1}')"
          HIGH_SHA="$(sha256sum capability-evidence/mystic-high-mc.rad.spc | awk '{print $1}')"
          test "$LOW_SHA" != "$HIGH_SHA"
          python - <<'PY'
          import math
          from pathlib import Path
          def parse(path):
              wl=[]; rows=[]
              for line in Path(path).read_text().splitlines():
                  parts=line.split()
                  if len(parts)<2: continue
                  try: vals=tuple(float(x) for x in parts)
                  except ValueError: continue
                  if any(not math.isfinite(x) for x in vals): raise SystemExit(f'nonfinite MYSTIC value: {path}')
                  wl.append(vals[0]); rows.append(vals)
              if not rows: raise SystemExit(f'no numeric MYSTIC rows: {path}')
              return wl,rows
          lw,low=parse('capability-evidence/mystic-low-mc.rad.spc'); hw,high=parse('capability-evidence/mystic-high-mc.rad.spc')
          if lw != hw: raise SystemExit('MYSTIC wavelength grid drift between paired LOW/HIGH')
          if low == high: raise SystemExit('corrected species profiles are numerically identical in MYSTIC')
          PY

      - name: Freeze capability evidence without scientific interpretation
        if: always()
        shell: micromamba-shell {0}
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          def sha(path):
              p=Path(path)
              return hashlib.sha256(p.read_bytes()).hexdigest() if p.is_file() else None
          report={
            'schemaVersion':1,
            'stageId':'opac-species-profile-transport-capability-v2',
            'status':'CORRECTED_SPECIES_PROFILE_TRANSPORT_CAPABILITY_EXECUTED',
            'workflowRunId':int(os.environ['GITHUB_RUN_ID']),
            'workflowRunAttempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
            'workflowHead':os.environ['GITHUB_SHA'],
            'species':'INSO',
            'aod550':0.10,
            'mysticSeed':730194613,
            'mysticPhotonsPerProfile':500000,
            'scientificOrdinalAllocated':False,
            'taylorOrJerusalemUsed':False,
            'scientificMaterialityThresholdCreated':False,
            'levelBMappingPerformed':False,
            'productionAuthorized':False,
            'disortLowSha256':sha('capability-evidence/disort-low-stdout.txt'),
            'disortHighSha256':sha('capability-evidence/disort-high-stdout.txt'),
            'disortOutputsDiffer':sha('capability-evidence/disort-low-stdout.txt') not in (None,sha('capability-evidence/disort-high-stdout.txt')),
            'mysticLowRadianceSha256':sha('capability-evidence/mystic-low-mc.rad.spc'),
            'mysticHighRadianceSha256':sha('capability-evidence/mystic-high-mc.rad.spc'),
            'mysticRadianceOutputsDiffer':sha('capability-evidence/mystic-low-mc.rad.spc') not in (None,sha('capability-evidence/mystic-high-mc.rad.spc')),
            'inputManifestSha256':sha('capability-evidence/input-manifest.json'),
            'uvspecSha256':os.environ['EXPECTED_UVSPEC_SHA256'],
            'stagedDataTreeSha256':os.environ['EXPECTED_STAGED_DATA_SHA256'],
          }
          report['pass'] = bool(report['disortOutputsDiffer'] and report['mysticRadianceOutputsDiffer'] and report['workflowRunAttempt']==1)
          raw=json.dumps(report,sort_keys=True,separators=(',',':'),allow_nan=False).encode()
          report['contentSha256']=hashlib.sha256(raw).hexdigest()
          Path('capability-evidence/capability-report.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          PY

      - name: Require corrected transport capability PASS
        shell: micromamba-shell {0}
        run: |
          python - <<'PY'
          import json
          r=json.load(open('capability-evidence/capability-report.json'))
          if r.get('workflowRunAttempt') != 1: raise SystemExit('attempt drift')
          if r.get('disortOutputsDiffer') is not True: raise SystemExit('DISORT did not respond to corrected vertical species profile')
          if r.get('mysticRadianceOutputsDiffer') is not True: raise SystemExit('MYSTIC did not respond to corrected vertical species profile')
          if r.get('pass') is not True: raise SystemExit('corrected species-profile transport capability failed')
          if r.get('scientificOrdinalAllocated') is not False or r.get('taylorOrJerusalemUsed') is not False or r.get('productionAuthorized') is not False: raise SystemExit('capability crossed governance boundary')
          PY

      - name: Upload compact corrected transport capability evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opac-species-profile-transport-capability-v2
          path: capability-evidence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
