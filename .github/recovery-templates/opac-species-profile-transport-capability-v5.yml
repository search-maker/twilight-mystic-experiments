name: OPAC species-profile transport capability v5
on:
  push:
    branches: [status/opac-species-profile-transport-capability-v5]
    paths: [.github/dispatch-requests/opac-species-profile-transport-capability-v5.json]
permissions: {actions: read, contents: read, pull-requests: read}
concurrency: {group: opac-species-profile-transport-capability-v5, cancel-in-progress: false}
jobs:
  capability:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      SOURCE_URL: https://www.libradtran.org/lib/exe/fetch.php?media=download%3Aoptprop_v2.1.tar.gz
      TRACE_PR: '589'
      TRACE_REVIEW_HEAD: d2f78f8be3fb94e4e64ce4c12901cb3f937ef0b6
      TRACE_RUN_ID: '33185460954'
      TRACE_RUN_HEAD: a266d1d3705c41519d3930206ca4f918db9cbb9e
      TRACE_ARTIFACT_ID: '9691518729'
      TRACE_ARTIFACT_DIGEST: sha256:07fb60de7bef96253eaf29cb9303a83bab7f3f1952431c73a26499357b4d572a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {path: control, fetch-depth: 0, persist-credentials: false}
      - name: Bind exact reviewed one-shot identity and trace evidence
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = status/opac-species-profile-transport-capability-v5
          python - <<'PY' > req.env
          import json
          r=json.load(open('control/.github/dispatch-requests/opac-species-profile-transport-capability-v5.json'))
          if (r.get('schemaVersion'),r.get('stageId'),r.get('status')) != (1,'opac-species-profile-transport-capability-v5','REQUEST_ONE_SHOT_OPAC_TRACE_OBSERVED_ALIAS_CAPABILITY_V5'):
              raise SystemExit('request drift')
          for k in ('reviewPr','reviewRunId'):
              print(f'{k.upper()}={int(r[k])}')
          for k in ('reviewHead','baseMain'):
              v=r[k]
              if len(v)!=40 or any(c not in '0123456789abcdef' for c in v): raise SystemExit(f'{k} invalid')
              print(f'{k.upper()}={v}')
          PY
          source req.env; export REVIEWPR REVIEWRUNID REVIEWHEAD BASEMAIN
          test "$BASEMAIN" = 99ade7798627e67921139697ba1a004fa8a304bb
          P="$(git -C control rev-parse HEAD^)"
          test "$(git -C control diff-tree --no-commit-id --name-only -r HEAD)" = .github/dispatch-requests/opac-species-profile-transport-capability-v5.json
          test "$(git -C control rev-parse "$P^")" = "$BASEMAIN"
          test "$(git -C control diff-tree --no-commit-id --name-only -r "$P" | sort | tr '\n' ' ')" = ".github/workflows/opac-species-profile-transport-capability-v5.yml review/opac-species-profile-transport-capability-v5/activation_support.py review/opac-species-profile-transport-capability-v5/build_inputs.py "
          git -C control fetch origin main "$REVIEWHEAD"
          test "$(git -C control rev-parse origin/main)" = "$BASEMAIN"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$REVIEWPR" > pr.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REVIEWRUNID" > review-run.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/$TRACE_PR" > trace-pr.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TRACE_RUN_ID" > trace-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TRACE_RUN_ID/artifacts" > trace-artifacts.json
          REVIEWHEAD="$REVIEWHEAD" REVIEWRUNID="$REVIEWRUNID" python - <<'PY'
          import json,os
          p=json.load(open('pr.json')); r=json.load(open('review-run.json'))
          if p['state']!='open' or p['draft'] is not True or p['merged_at'] is not None or p['head']['ref']!='review/opac-species-profile-transport-capability-v5' or p['head']['sha']!=os.environ['REVIEWHEAD'] or p['base']['sha']!='99ade7798627e67921139697ba1a004fa8a304bb': raise SystemExit('v5 review PR drift')
          if r['id']!=int(os.environ['REVIEWRUNID']) or r['head_sha']!=os.environ['REVIEWHEAD'] or r['run_attempt']!=1 or r['conclusion']!='success': raise SystemExit('v5 review run drift')
          tp=json.load(open('trace-pr.json')); tr=json.load(open('trace-run.json')); arts=json.load(open('trace-artifacts.json'))['artifacts']
          if tp['state']!='open' or tp['draft'] is not True or tp['merged_at'] is not None or tp['head']['sha']!=os.environ['TRACE_REVIEW_HEAD']: raise SystemExit('trace PR drift')
          if tr['id']!=int(os.environ['TRACE_RUN_ID']) or tr['head_sha']!=os.environ['TRACE_RUN_HEAD'] or tr['run_attempt']!=1 or tr['conclusion']!='success': raise SystemExit('trace run drift')
          m=[a for a in arts if a['id']==int(os.environ['TRACE_ARTIFACT_ID'])]
          if len(m)!=1 or m[0].get('digest')!=os.environ['TRACE_ARTIFACT_DIGEST'] or m[0].get('expired'): raise SystemExit('trace artifact drift')
          PY
          test "$(git -C control rev-parse "$P:.github/workflows/opac-species-profile-transport-capability-v5.yml")" = "$(git -C control rev-parse "$REVIEWHEAD:.github/recovery-templates/opac-species-profile-transport-capability-v5.yml")"
          test "$(git -C control rev-parse "$P:review/opac-species-profile-transport-capability-v5/build_inputs.py")" = "$(git -C control rev-parse "$REVIEWHEAD:review/opac-species-profile-transport-capability-v5/build_inputs.py")"
          test "$(git -C control rev-parse "$P:review/opac-species-profile-transport-capability-v5/activation_support.py")" = "$(git -C control rev-parse "$REVIEWHEAD:review/opac-species-profile-transport-capability-v5/activation_support.py")"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs?branch=$GITHUB_REF_NAME&event=push&per_page=100" > runs.json
          python - <<'PY'
          import json,os
          ids=[r['id'] for page in json.load(open('runs.json')) for r in page['workflow_runs'] if r['path']=='.github/workflows/opac-species-profile-transport-capability-v5.yml']
          if ids != [int(os.environ['GITHUB_RUN_ID'])]: raise SystemExit(f'not one-shot: {ids}')
          PY
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: opac-v5
          create-args: -c conda-forge python=3.12.4 rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true
      - name: Reconstruct frozen runtime and OPAC archive
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          mkdir evidence
          mkdir -p capability-runtime/share/libRadtran
          python control/experiments/mystic-batch-v1/runtime_probe.py --uvspec "$(command -v uvspec)" --data-dir "$CONDA_PREFIX/share/libRadtran/data" --atmosphere "$CONDA_PREFIX/share/libRadtran/data/atmmod/afglus.dat" --runtime-lock control/experiments/mystic-batch-v1/runtime-lock.micromamba.json --skip-help --output evidence/base.json
          cp -a "$CONDA_PREFIX/share/libRadtran/data" capability-runtime/share/libRadtran/data
          curl -L --fail --retry 3 --retry-all-errors --max-time 2700 -o evidence/opac.tar.gz "$SOURCE_URL"
          PYTHONPATH=control/review/opac-species-profile-transport-capability-v5 python - <<'PY'
          from pathlib import Path
          from activation_support import extract_frozen_opac_archive
          extract_frozen_opac_archive(Path('evidence/opac.tar.gz'),Path('capability-runtime/share/libRadtran'))
          PY
          DATA="$GITHUB_WORKSPACE/capability-runtime/share/libRadtran/data"
          test -f "$DATA/aerosol/OPAC/optprop/inso.mie.cdf"
          test ! -e "$DATA/aerosol/OPAC/optprop/INSO"
          test ! -e "$DATA/aerosol/OPAC/optprop/INSO.nc"
          test ! -e "$DATA/aerosol/OPAC/INSO.nc"
          python control/experiments/mystic-batch-v1/runtime_probe.py --uvspec "$(command -v uvspec)" --data-dir "$DATA" --atmosphere "$DATA/atmmod/afglus.dat" --runtime-lock control/experiments/mystic-batch-v1/runtime-lock.micromamba.json --skip-help --output evidence/pre-alias-runtime-report.json
          rm evidence/opac.tar.gz
      - name: Build exact profiles and trace-observed byte-identical alias
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          DATA="$GITHUB_WORKSPACE/capability-runtime/share/libRadtran/data"
          python control/review/opac-species-profile-transport-capability-v5/build_inputs.py --atmosphere "$DATA/atmmod/afglus.dat" --data-dir "$DATA" --repository-root "$GITHUB_WORKSPACE/control" --output capability-inputs > evidence/builder.json
          cp capability-inputs/input-manifest.json evidence/
          cp capability-inputs/profiles/* evidence/
          cp capability-inputs/inputs/* evidence/
          cmp "$DATA/aerosol/OPAC/optprop/inso.mie.cdf" "$DATA/aerosol/OPAC/optprop/INSO"
          test ! -e "$DATA/aerosol/OPAC/optprop/INSO.nc"
          test ! -e "$DATA/aerosol/OPAC/INSO.nc"
          python control/experiments/mystic-batch-v1/runtime_probe.py --uvspec "$(command -v uvspec)" --data-dir "$DATA" --atmosphere "$DATA/atmmod/afglus.dat" --runtime-lock control/experiments/mystic-batch-v1/runtime-lock.micromamba.json --skip-help --output evidence/post-alias-runtime-report.json
          PYTHONPATH=control/review/opac-species-profile-transport-capability-v5 python - <<'PY'
          import json
          from activation_support import validate_runtime_reports
          validate_runtime_reports(json.load(open('evidence/base.json')),json.load(open('evidence/pre-alias-runtime-report.json')),json.load(open('evidence/post-alias-runtime-report.json')),json.load(open('evidence/input-manifest.json'))['resolverAlias'])
          PY
      - name: Syntax and deterministic DISORT profile transport
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          for m in disort mystic; do for s in low high; do timeout 120 uvspec -c < capability-inputs/inputs/$m-$s.inp > evidence/$m-$s-syntax.out 2> evidence/$m-$s-syntax.err; done; done
          for s in low high; do timeout 300 uvspec < capability-inputs/inputs/disort-$s.inp > evidence/disort-$s.out 2> evidence/disort-$s.err; test -s evidence/disort-$s.out; done
          PYTHONPATH=control/review/opac-species-profile-transport-capability-v5 python - <<'PY'
          from pathlib import Path
          from activation_support import validate_output_pair
          validate_output_pair(Path('evidence/disort-low.out'),Path('evidence/disort-high.out'),'DISORT')
          PY
      - name: Paired spherical MYSTIC profile transport
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          for s in low high; do
            timeout 2400 uvspec < capability-inputs/inputs/mystic-$s.inp > evidence/mystic-$s.out 2> evidence/mystic-$s.err
            test -s capability-inputs/runs/mystic-$s/mc.rad.spc
            test -s capability-inputs/runs/mystic-$s/mc.rad.std.spc
            cp capability-inputs/runs/mystic-$s/mc.rad.spc evidence/mystic-$s-mc.rad.spc
            cp capability-inputs/runs/mystic-$s/mc.rad.std.spc evidence/mystic-$s-mc.rad.std.spc
          done
          PYTHONPATH=control/review/opac-species-profile-transport-capability-v5 python - <<'PY'
          from pathlib import Path
          from activation_support import validate_output_pair, parse_numeric_grid
          validate_output_pair(Path('evidence/mystic-low-mc.rad.spc'),Path('evidence/mystic-high-mc.rad.spc'),'MYSTIC_MC_RAD')
          lo,_=parse_numeric_grid(Path('evidence/mystic-low-mc.rad.std.spc'))
          hi,_=parse_numeric_grid(Path('evidence/mystic-high-mc.rad.std.spc'))
          if lo != hi: raise SystemExit('MYSTIC standard-deviation grid mismatch')
          PY
      - name: Freeze capability report
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p evidence
          PYTHONPATH=control/review/opac-species-profile-transport-capability-v5 python - <<'PY'
          import os
          from pathlib import Path
          from activation_support import freeze_capability_report
          freeze_capability_report(Path('evidence'),int(os.environ['GITHUB_RUN_ID']))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with: {name: opac-species-profile-transport-capability-v5, path: evidence/, if-no-files-found: error, compression-level: 0}
      - name: Require terminal PASS
        run: python -c "import json; assert json.load(open('evidence/capability-report.json'))['status']=='PASS_TRACE_OBSERVED_ALIAS_REACHES_DISORT_AND_MYSTIC'"
