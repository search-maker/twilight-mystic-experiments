name: aerosol-family-v2-r7-ordinal31-dispatch-observer-2
on:
  push:
    branches: [status/aerosol-family-v2-r7-ordinal31-dispatch-observer-2]
    paths: [.github/workflows/aerosol-family-v2-r7-ordinal31-dispatch-observer-2.yml]
permissions:
  actions: read
  contents: write
  issues: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TARGET_BRANCH: dispatch/aerosol-family-challenge-v2-r7-ordinal-31
      TARGET_SHA: a89bc4e0852617891e623e81de9834b90684e3a1
      RESULT_BRANCH: status/aerosol-family-v2-r7-ordinal31-dispatch-observer-2-result
      EXPECTED_WORKFLOW: Aerosol-family v2 R7 scientific execution
    steps:
      - name: Snapshot exact target run list
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          gh api --paginate --slurp -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/aerosol-family-v2-r7-execution.yml/runs" -f branch="$TARGET_BRANCH" -f event=push -f per_page=100 > /tmp/pages.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/60/comments?per_page=100" > /tmp/comments-pages.json
          python3 - <<'PY'
          import json, os
          pages=json.load(open('/tmp/pages.json'))
          rows=[r for p in pages for r in p.get('workflow_runs',[])]
          matches=[r for r in rows if r.get('head_sha')==os.environ['TARGET_SHA'] and r.get('head_branch')==os.environ['TARGET_BRANCH'] and r.get('name')==os.environ['EXPECTED_WORKFLOW'] and r.get('event')=='push']
          cpages=json.load(open('/tmp/comments-pages.json'))
          comments=[c for p in cpages for c in p]
          consumed='ORDINAL31_AEROSOL_FAMILY_V2_R7_DISPATCH_CONSUMED'
          out={
            'matchingRunCount':len(matches),
            'runs':[{'id':r['id'],'runAttempt':r['run_attempt'],'status':r['status'],'conclusion':r['conclusion'],'headSha':r['head_sha'],'headBranch':r['head_branch'],'createdAt':r.get('created_at'),'updatedAt':r.get('updated_at')} for r in matches],
            'consumedMarkerCount':sum(1 for c in comments if (c.get('body') or '').strip()==consumed),
          }
          open('/tmp/readback.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
      - name: Publish snapshot readback
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          content="$(base64 -w0 /tmp/readback.json)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/ordinal31-dispatch-observer-2-readback.json" -f message='Record AFC2 R7 ordinal31 dispatch observer-2 readback' -f content="$content" -f branch="$RESULT_BRANCH" >/dev/null
