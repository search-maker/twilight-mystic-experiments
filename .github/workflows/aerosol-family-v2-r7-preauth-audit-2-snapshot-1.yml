name: aerosol-family-v2-r7-preauth-audit-2-snapshot-1
on:
  push:
    branches: [status/aerosol-family-v2-r7-preauth-audit-2-snapshot-1]
    paths: [.github/workflows/aerosol-family-v2-r7-preauth-audit-2-snapshot-1.yml]
permissions:
  actions: read
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Snapshot exact audit-2 run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_HEAD: f8cda0481ac1b6ba714de8d7ccecc1cd4331d028
          TARGET_BRANCH: status/aerosol-family-v2-r7-preauth-audit-2
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs?branch=${TARGET_BRANCH}&event=push&per_page=100" > /tmp/runs.json
          python3 - <<'PY'
          import json, os
          pages=json.load(open('/tmp/runs.json'))
          rows=[r for p in pages for r in p.get('workflow_runs',[])]
          rows=[r for r in rows if r.get('head_sha')==os.environ['TARGET_HEAD'] and r.get('name')=='aerosol-family-v2-r7-preauth-audit-2']
          if len(rows)!=1: raise SystemExit(f'expected one run, got {len(rows)}')
          r=rows[0]
          out={k:r.get(k) for k in ('id','name','status','conclusion','run_attempt','head_branch','head_sha','created_at','updated_at','jobs_url')}
          open('audit-2-snapshot.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
          git add audit-2-snapshot.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Snapshot AFC2 R7 preauthorization audit-2"
          git push origin HEAD
