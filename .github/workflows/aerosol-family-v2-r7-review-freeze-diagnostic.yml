name: aerosol-family-v2-r7-review-freeze-diagnostic
on:
  push:
    branches:
      - status/aerosol-family-v2-r7-review-freeze-diagnostic-1
    paths:
      - .github/workflows/aerosol-family-v2-r7-review-freeze-diagnostic.yml
permissions:
  contents: write
  issues: write
jobs:
  build-r7-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_MAIN: 7309e32e08be01dffb60e3a0bc77cb6e4588c0ec
      TARGET_BRANCH: prep/aerosol-family-challenge-v2-r7-transport-v1
      R6_DIR: experiments/aerosol-family-challenge-v2/execution-candidate
      R7_DIR: experiments/aerosol-family-challenge-v2-r7/execution-candidate
    steps:
      - name: Checkout exact evidence-preserved main
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_MAIN }}
          fetch-depth: 1
          persist-credentials: true
      - name: Refuse drift or duplicate target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          live="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          test "$live" = "$EXPECTED_MAIN" || { echo "refuse: main moved expected=$EXPECTED_MAIN live=$live"; exit 2; }
          if git ls-remote --exit-code --heads origin "refs/heads/${TARGET_BRANCH}" >/dev/null 2>&1; then
            echo "refuse: target transport branch already exists: ${TARGET_BRANCH}"
            exit 3
          fi
          test -f evidence/aerosol-family-challenge-v2-r7/freeze-record.json
          test -f evidence/aerosol-family-challenge-v2-r7/manifest.frozen.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          freeze=json.loads(Path('evidence/aerosol-family-challenge-v2-r7/freeze-record.json').read_text())
          manifest=json.loads(Path('evidence/aerosol-family-challenge-v2-r7/manifest.frozen.json').read_text())
          assert freeze['status']=='FROZEN_REVIEW_PACKAGE_NOT_AUTHORIZATION'
          assert freeze['scientificExecutionAuthorized'] is False
          assert freeze['solverExecutionAuthorized'] is False
          assert freeze['authorizationTimeSeedRecheckStillRequired'] is True
          assert manifest['stageId']=='aerosol-family-challenge-v2-r7'
          assert manifest['caseCount']==576
          assert manifest['comparisonGroupCount']==72
          assert manifest['configuredPhotonHistoriesTotal']==11520000000
          assert manifest['resultsOpened'] is False
          assert manifest['scientificExecutionAuthorized'] is False
          assert manifest['solverExecutionAuthorized'] is False
          PY
      - name: Derive R7 transport mechanically from reviewed R6 transport
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$R7_DIR"
          files=(
            README.md
            authorization-review-workflow.yml.template
            authorization.template.json
            authorization_guard.py
            dispatch_guard.py
            executor.py
            freshness.py
            guard.py
            transport-contract.v3.json
            workflow.yml.template
            aggregate_results.py
            authorization_surface.py
          )
          for name in "${files[@]}"; do
            test -f "$R6_DIR/$name"
            cp "$R6_DIR/$name" "$R7_DIR/$name"
          done
          cp .github/workflows/aerosol-family-v2-authorization-review.yml .github/workflows/aerosol-family-v2-r7-authorization-review.yml
          cp .github/workflows/aerosol-family-v2-execution.yml .github/workflows/aerosol-family-v2-r7-execution.yml
          cp tests/test_aerosol_family_transport_activation.py tests/test_aerosol_family_r7_transport_activation.py
          python3 - <<'PY'
          from pathlib import Path
          targets=[
            *Path('experiments/aerosol-family-challenge-v2-r7/execution-candidate').glob('*'),
            Path('.github/workflows/aerosol-family-v2-r7-authorization-review.yml'),
            Path('.github/workflows/aerosol-family-v2-r7-execution.yml'),
            Path('tests/test_aerosol_family_r7_transport_activation.py'),
          ]
          def transform(text:str)->str:
              proof='__AFC2_R7_PROOF_ARTIFACT__'
              text=text.replace('aerosol-family-v2-r6-freeze-proof',proof)
              text=text.replace('aerosol-family-challenge-v2','aerosol-family-challenge-v2-r7')
              text=text.replace('aerosol-family-v2','aerosol-family-v2-r7')
              text=text.replace(proof,'aerosol-family-v2-r7-freeze-proof')
              text=text.replace('AEROSOL_FAMILY_V2','AEROSOL_FAMILY_V2_R7')
              text=text.replace('candidate-seed-ledger.v1.json','candidate-seed-ledger.v2.json')
              text=text.replace('R6_REVIEW_ONLY_TRANSPORT_CANDIDATE_NOT_AUTHORIZED','R7_REVIEW_ONLY_TRANSPORT_CANDIDATE_NOT_AUTHORIZED')
              text=text.replace('Aerosol-family v2 authorization review','Aerosol-family v2 R7 authorization review')
              text=text.replace('Aerosol-family v2 scientific execution','Aerosol-family v2 R7 scientific execution')
              text=text.replace('Aerosol-family v2 ${{ github.ref_name }}','Aerosol-family v2 R7 ${{ github.ref_name }}')
              return text
          for path in targets:
              if path.is_file():
                  value=transform(path.read_text())
                  if path.name=='README.md':
                      value=value.replace('R6','R7')
                  path.write_text(value,encoding='utf-8',newline='\n')
          PY
      - name: Add identity-only equivalence regression
        shell: bash
        run: |
          set -euo pipefail
          cat >> tests/test_aerosol_family_r7_transport_activation.py <<'PY'

          import json

          class R7TransportIdentityOnlyEquivalence(unittest.TestCase):
              def test_r7_transport_is_mechanical_identity_path_adaptation_of_r6(self):
                  root = Path(__file__).resolve().parents[1]
                  r6 = root / 'experiments' / 'aerosol-family-challenge-v2' / 'execution-candidate'
                  r7 = root / 'experiments' / 'aerosol-family-challenge-v2-r7' / 'execution-candidate'
                  names = [
                      'README.md', 'authorization-review-workflow.yml.template', 'authorization.template.json',
                      'authorization_guard.py', 'dispatch_guard.py', 'executor.py', 'freshness.py', 'guard.py',
                      'transport-contract.v3.json', 'workflow.yml.template', 'aggregate_results.py', 'authorization_surface.py',
                  ]
                  def normalize(text: str, name: str) -> str:
                      proof='__AFC2_R6_PROOF_ARTIFACT__'
                      text=text.replace('aerosol-family-v2-r7-freeze-proof',proof)
                      text=text.replace('aerosol-family-challenge-v2-r7','aerosol-family-challenge-v2')
                      text=text.replace('aerosol-family-v2-r7','aerosol-family-v2')
                      text=text.replace(proof,'aerosol-family-v2-r6-freeze-proof')
                      text=text.replace('AEROSOL_FAMILY_V2_R7','AEROSOL_FAMILY_V2')
                      text=text.replace('candidate-seed-ledger.v2.json','candidate-seed-ledger.v1.json')
                      text=text.replace('R7_REVIEW_ONLY_TRANSPORT_CANDIDATE_NOT_AUTHORIZED','R6_REVIEW_ONLY_TRANSPORT_CANDIDATE_NOT_AUTHORIZED')
                      text=text.replace('Aerosol-family v2 R7 authorization review','Aerosol-family v2 authorization review')
                      text=text.replace('Aerosol-family v2 R7 scientific execution','Aerosol-family v2 scientific execution')
                      text=text.replace('Aerosol-family v2 R7 ${{ github.ref_name }}','Aerosol-family v2 ${{ github.ref_name }}')
                      if name == 'README.md':
                          text=text.replace('R7','R6')
                      return text
                  for name in names:
                      self.assertEqual((r6/name).read_text(), normalize((r7/name).read_text(),name), name)

              def test_r7_transport_keeps_science_and_holdout_boundaries_closed(self):
                  root = Path(__file__).resolve().parents[1]
                  contract=json.loads((root/'experiments/aerosol-family-challenge-v2-r7/execution-candidate/transport-contract.v3.json').read_text())
                  self.assertEqual(contract['stageId'],'aerosol-family-challenge-v2-r7-execution-transport')
                  self.assertEqual(contract['status'],'R7_REVIEW_ONLY_TRANSPORT_CANDIDATE_NOT_AUTHORIZED')
                  self.assertEqual(contract['caseUniverse']['caseCount'],576)
                  self.assertEqual(contract['caseUniverse']['comparisonGroupCount'],72)
                  self.assertEqual(contract['caseUniverse']['configuredPhotonHistories'],11520000000)
                  self.assertFalse(contract['scientificExecutionAuthorized'])
                  self.assertFalse(contract['solverExecutionAuthorized'])
                  self.assertFalse(contract['githubRerunAllowed'])
                  self.assertFalse(contract['retryAllowed'])
                  self.assertFalse(contract['resumeAllowed'])
                  self.assertFalse(contract['authorizationBoundary']['protectedHoldoutOpeningAuthorized'])
                  self.assertEqual(contract['reviewSeedProofLifecycle']['proofBundleArtifactName'],'aerosol-family-v2-r7-freeze-proof')
          PY
      - name: Static refusal checks and tests
        shell: bash
        run: |
          set -euo pipefail
          test ! -e experiments/aerosol-family-challenge-v2-r7/authorization.json
          grep -q 'candidate-seed-ledger.v2.json' .github/workflows/aerosol-family-v2-r7-authorization-review.yml
          grep -q 'candidate-seed-ledger.v2.json' .github/workflows/aerosol-family-v2-r7-execution.yml
          grep -q 'dispatch/aerosol-family-challenge-v2-r7-ordinal-' .github/workflows/aerosol-family-v2-r7-execution.yml
          grep -q 'aerosol-family-v2-r7-case-' experiments/aerosol-family-challenge-v2-r7/execution-candidate/authorization_surface.py
          grep -q 'AEROSOL_FAMILY_V2_R7_DISPATCH_CONSUMED' experiments/aerosol-family-challenge-v2-r7/execution-candidate/freshness.py
          ! grep -R 'candidate-seed-ledger.v1.json' "$R7_DIR" .github/workflows/aerosol-family-v2-r7-authorization-review.yml .github/workflows/aerosol-family-v2-r7-execution.yml
          python3 -m py_compile "$R7_DIR"/*.py
          python3 -m unittest discover -s tests -p 'test_aerosol_family_challenge_v2_r7.py'
          python3 -m unittest discover -s tests -p 'test_aerosol_family_r7_transport_activation.py'
      - name: Create one transport-only commit and publish branch
        shell: bash
        run: |
          set -euo pipefail
          git switch -c "$TARGET_BRANCH"
          git add -- \
            "$R7_DIR/README.md" \
            "$R7_DIR/authorization-review-workflow.yml.template" \
            "$R7_DIR/authorization.template.json" \
            "$R7_DIR/authorization_guard.py" \
            "$R7_DIR/dispatch_guard.py" \
            "$R7_DIR/executor.py" \
            "$R7_DIR/freshness.py" \
            "$R7_DIR/guard.py" \
            "$R7_DIR/transport-contract.v3.json" \
            "$R7_DIR/workflow.yml.template" \
            "$R7_DIR/aggregate_results.py" \
            "$R7_DIR/authorization_surface.py" \
            .github/workflows/aerosol-family-v2-r7-authorization-review.yml \
            .github/workflows/aerosol-family-v2-r7-execution.yml \
            tests/test_aerosol_family_r7_transport_activation.py
          test "$(git diff --cached --name-only | wc -l)" -eq 15
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Activate fail-closed AFC2 R7 transport"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          git rev-parse HEAD > /tmp/r7-transport-head.txt
      - name: Record transport preparation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head="$(cat /tmp/r7-transport-head.txt)"
          body="AFC2-R7-TRANSPORT-PREPARED branch=${TARGET_BRANCH} commit=${head} parent=${EXPECTED_MAIN} files=15 status=CONTROL_PLANE_ONLY_NOT_AUTHORIZATION_NOT_DISPATCHED"
          gh api "repos/${GITHUB_REPOSITORY}/issues/60/comments" -f body="$body" >/dev/null
          echo "$body"
