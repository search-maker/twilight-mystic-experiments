name: aerosol-family-v2-r7-transport-builder-diagnostic
on:
  push:
    branches:
      - status/aerosol-family-v2-r7-transport-builder-diagnostic-1
    paths:
      - .github/workflows/aerosol-family-v2-r7-transport-builder-diagnostic.yml
permissions:
  actions: read
  contents: read
  issues: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read builder runs and report
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/aerosol-family-v2-r7-review-freeze-diagnostic.yml/runs?per_page=100" > /tmp/pages.json
          python3 - <<'PY' > /tmp/body.txt
          import json
          pages=json.load(open('/tmp/pages.json'))
          runs=[r for page in pages for r in page.get('workflow_runs',[])]
          wanted=[r for r in runs if r.get('head_branch')=='status/aerosol-family-v2-r7-review-freeze-diagnostic-1']
          wanted=sorted(wanted,key=lambda r:int(r.get('id') or 0),reverse=True)[:6]
          compact=[{k:r.get(k) for k in ('id','status','conclusion','run_attempt','head_sha','created_at','updated_at')} for r in wanted]
          print('AFC2-R7-TRANSPORT-BUILDER-DIAG-1')
          print('```json')
          print(json.dumps(compact,sort_keys=True,indent=2))
          print('```')
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/60/comments" -f body="$(cat /tmp/body.txt)" >/dev/null
          cat /tmp/body.txt
