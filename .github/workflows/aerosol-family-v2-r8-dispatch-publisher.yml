name: Aerosol-family v2 R8 dispatch publisher
run-name: R8 dispatch publisher ${{ github.ref_name }}
on:
  push:
    branches:
      - "status/aerosol-family-v2-r8-dispatch-publisher-ordinal-*"
    paths:
      - .github/dispatch-requests/aerosol-family-v2-r8.json
permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: read
concurrency:
  group: aerosol-family-v2-r8-dispatch-publisher-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact request ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - name: Bind request, authorization and zero-runtime review
        id: identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$GITHUB_REF_NAME" =~ ^status/aerosol-family-v2-r8-dispatch-publisher-ordinal-([1-9][0-9]*)$ ]]
          BRANCH_ORDINAL="${BASH_REMATCH[1]}"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mapfile -t REQUEST_PARENTS < <(git cat-file -p "$GITHUB_SHA" | sed -n 's/^parent //p')
          test "${#REQUEST_PARENTS[@]}" = 1
          REQUEST_PARENT="${REQUEST_PARENTS[0]}"
          mapfile -t REQUEST_CHANGED < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")
          test "${#REQUEST_CHANGED[@]}" = 1
          test "${REQUEST_CHANGED[0]}" = .github/dispatch-requests/aerosol-family-v2-r8.json
          python3 - <<'PY2' > request.env
          import json
          from pathlib import Path
          r=json.loads(Path('.github/dispatch-requests/aerosol-family-v2-r8.json').read_text())
          if r.get('schemaVersion') != 1 or r.get('stageId') != 'aerosol-family-challenge-v2-r8-dispatch-request': raise SystemExit('request schema/stage drift')
          if r.get('status') != 'REQUEST_ACTUAL_GIT_PUSH_AND_WORKFLOW_DISPATCH': raise SystemExit('request status drift')
          n=r.get('scientificOrdinal'); h=r.get('authorizationHead')
          if not isinstance(n,int) or n <= 0: raise SystemExit('request ordinal invalid')
          if not isinstance(h,str) or len(h)!=40: raise SystemExit('request authorization head invalid')
          print(f'ORDINAL={n}')
          print(f'AUTH_HEAD={h}')
          PY2
          source request.env
          test "$ORDINAL" = "$BRANCH_ORDINAL"
          AUTH_BRANCH="authorization/aerosol-family-challenge-v2-r8-ordinal-$ORDINAL"
          DISPATCH_BRANCH="dispatch/aerosol-family-challenge-v2-r8-ordinal-$ORDINAL"
          git fetch origin main "$AUTH_BRANCH"
          LIVE_MAIN="$(git rev-parse origin/main)"
          test "$REQUEST_PARENT" = "$LIVE_MAIN"
          AUTH_REMOTE="$(git rev-parse "origin/$AUTH_BRANCH")"
          test "$AUTH_REMOTE" = "$AUTH_HEAD"
          mapfile -t AUTH_PARENTS < <(git cat-file -p "$AUTH_HEAD" | sed -n 's/^parent //p')
          test "${#AUTH_PARENTS[@]}" = 1
          AUTH_PARENT="${AUTH_PARENTS[0]}"
          test "$AUTH_PARENT" = "$LIVE_MAIN"
          mapfile -t AUTH_CHANGED < <(git diff-tree --no-commit-id --name-only -r "$AUTH_HEAD")
          test "${#AUTH_CHANGED[@]}" = 1
          test "${AUTH_CHANGED[0]}" = experiments/aerosol-family-challenge-v2-r8/authorization.json
          git checkout --detach "$AUTH_HEAD"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls?state=all&head=${OWNER}:${AUTH_BRANCH}&per_page=100" > auth-pr-pages.json
          python3 - <<'PY2'
          import json, os
          from pathlib import Path
          pages=json.loads(Path('auth-pr-pages.json').read_text()); prs=[p for page in pages for p in page]
          matches=[p for p in prs if (p.get('head') or {}).get('ref')==os.environ['AUTH_BRANCH'] and (p.get('head') or {}).get('sha')==os.environ['AUTH_HEAD']]
          if len(matches)!=1: raise SystemExit(f'expected one auth PR, got {len(matches)}')
          p=matches[0]
          if p.get('state')!='open' or p.get('draft') is not True or p.get('merged_at') is not None: raise SystemExit('auth PR must remain Draft/open/unmerged')
          if (p.get('base') or {}).get('ref')!='main': raise SystemExit('auth PR base drift')
          if (p.get('head') or {}).get('repo',{}).get('full_name')!=os.environ['GITHUB_REPOSITORY']: raise SystemExit('auth PR repo drift')
          Path('auth-pr-selected.json').write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          PY2
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/aerosol-family-v2-r8-authorization-review.yml/runs?branch=${AUTH_BRANCH}&event=pull_request&per_page=100" > auth-review-run-pages.json
          python3 - <<'PY2'
          import json, os
          from pathlib import Path
          pages=json.loads(Path('auth-review-run-pages.json').read_text()); runs=[r for page in pages for r in page.get('workflow_runs',[])]
          same=[r for r in runs if r.get('head_sha')==os.environ['AUTH_HEAD']]
          good=[r for r in same if int(r.get('run_attempt') or 0)==1 and r.get('status')=='completed' and r.get('conclusion')=='success']
          if len(same)!=1 or len(good)!=1: raise SystemExit('exactly one successful attempt-1 auth review required')
          Path('auth-review-selected.json').write_text(json.dumps(good[0],indent=2,sort_keys=True)+'\n')
          PY2
          REVIEW_RUN_ID="$(python3 -c 'import json;print(json.load(open("auth-review-selected.json"))["id"])')"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${REVIEW_RUN_ID}/artifacts?per_page=100" > auth-review-artifacts.json
          python3 - <<'PY2'
          import json, os
          from pathlib import Path
          rows=json.loads(Path('auth-review-artifacts.json').read_text()).get('artifacts',[])
          expected=f'aerosol-family-v2-r8-authorization-review-ordinal-{os.environ["ORDINAL"]}'
          good=[a for a in rows if a.get('name')==expected and not a.get('expired',False)]
          if len(good)!=1: raise SystemExit('auth-review artifact missing/drifted')
          Path('auth-review-artifact-selected.json').write_text(json.dumps(good[0],indent=2,sort_keys=True)+'\n')
          PY2
          ARTIFACT_ID="$(python3 -c 'import json;print(json.load(open("auth-review-artifact-selected.json"))["id"])')"
          mkdir auth-review-artifact
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > auth-review.zip
          unzip -q auth-review.zip -d auth-review-artifact
          python3 - <<'PY2'
          import json, os
          from pathlib import Path
          matches=list(Path('auth-review-artifact').rglob('authorization-review.json'))
          if len(matches)!=1: raise SystemExit('authorization-review.json missing')
          review=json.loads(matches[0].read_text()); pr=json.loads(Path('auth-pr-selected.json').read_text())
          if review.get('status')!='AUTHORIZATION_REVIEW_PASS_ZERO_RUNTIME': raise SystemExit('auth review status drift')
          if review.get('headSha')!=os.environ['AUTH_HEAD'] or review.get('prNumber')!=pr.get('number'): raise SystemExit('auth review identity drift')
          if review.get('scientificRuntimeSetupPerformed') is not False or review.get('scientificExecutionPerformed') is not False: raise SystemExit('auth review was not zero-runtime')
          PY2
          PR_NUMBER="$(python3 -c 'import json;print(json.load(open("auth-pr-selected.json"))["number"])')"
          GITHUB_TOKEN="$GH_TOKEN" PYTHONPATH=experiments/aerosol-family-challenge-v2-r8/execution-candidate \
          python3 experiments/aerosol-family-challenge-v2-r8/execution-candidate/authorization_surface.py \
            --repository "$GITHUB_REPOSITORY" \
            --authorization experiments/aerosol-family-challenge-v2-r8/authorization.json \
            --current-pr "$PR_NUMBER" --current-run-id "$GITHUB_RUN_ID" \
            --marker-head "$AUTH_HEAD" --marker-parent "$AUTH_PARENT" \
            --output freshness-pre.json
          python3 - <<'PY2'
          import importlib.util, json, os
          from pathlib import Path
          base=Path('experiments/aerosol-family-challenge-v2-r8'); cand=base/'execution-candidate'
          import sys; sys.path.insert(0,str(cand))
          from dispatch_guard import evaluate
          a=json.loads((base/'authorization.json').read_text()); fresh=json.loads(Path('freshness-pre.json').read_text())
          pr=json.loads(Path('auth-pr-selected.json').read_text()); rr=json.loads(Path('auth-review-selected.json').read_text())
          review=json.loads(list(Path('auth-review-artifact').rglob('authorization-review.json'))[0].read_text())
          paths={'manifest':Path('evidence/aerosol-family-challenge-v2-r8/manifest.frozen.json'),'freeze':Path('evidence/aerosol-family-challenge-v2-r8/freeze-record.json'),'transport':cand/'transport-contract.v3.json','adapter':base/'adapter.py','executor':cand/'executor.py','workflow':Path('.github/workflows/aerosol-family-v2-r8-execution.yml'),'authorizationGuard':cand/'authorization_guard.py','dispatchGuard':cand/'dispatch_guard.py','freshness':cand/'freshness.py','authorizationReviewWorkflow':Path('.github/workflows/aerosol-family-v2-r8-authorization-review.yml'),'dispatchPublisherWorkflow':Path('.github/workflows/aerosol-family-v2-r8-dispatch-publisher.yml')}
          ctx={'liveMain':os.environ['AUTH_PARENT'],'authorizationHead':os.environ['AUTH_HEAD'],'authorizationParent':os.environ['AUTH_PARENT'],'pr':{'number':pr['number'],'state':pr['state'],'draft':pr['draft'],'merged':pr.get('merged_at') is not None,'headBranch':pr['head']['ref'],'headSha':pr['head']['sha']},'authorizationReview':{'status':review['status'],'headSha':review['headSha'],'prNumber':review['prNumber'],'runAttempt':rr['run_attempt'],'conclusion':rr['conclusion'],'scientificRuntimeSetupPerformed':False,'scientificExecutionPerformed':False},'freshness':fresh,'issue60Markers':fresh.get('matchingAuthorizationMarkerBodies',[])}
          out=evaluate(a,ctx,paths,post_dispatch=False)
          Path('dispatch-pre.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY2
          echo "ordinal=$ORDINAL" >> "$GITHUB_OUTPUT"
          echo "auth_head=$AUTH_HEAD" >> "$GITHUB_OUTPUT"
          echo "auth_parent=$AUTH_PARENT" >> "$GITHUB_OUTPUT"
          echo "auth_branch=$AUTH_BRANCH" >> "$GITHUB_OUTPUT"
          echo "dispatch_branch=$DISPATCH_BRANCH" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "review_run_id=$REVIEW_RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Actual git push consumes dispatch identity
        id: push
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AUTH_HEAD: ${{ steps.identity.outputs.auth_head }}
          DISPATCH_BRANCH: ${{ steps.identity.outputs.dispatch_branch }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${{ steps.identity.outputs.auth_parent }}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          set +e
          git push origin "$AUTH_HEAD:refs/heads/$DISPATCH_BRANCH" >git-push.stdout 2>git-push.stderr
          RC=$?
          set -e
          test "$RC" = 0
          git ls-remote --exit-code --heads origin "$DISPATCH_BRANCH" > dispatch-ls-remote.txt
          grep -q "^${AUTH_HEAD}[[:space:]]" dispatch-ls-remote.txt
          echo "git_push_stdout_sha256=$(sha256sum git-push.stdout | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "git_push_stderr_sha256=$(sha256sum git-push.stderr | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Mark consumed exactly once and prove post-dispatch state
        id: post
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ORDINAL: ${{ steps.identity.outputs.ordinal }}
          AUTH_HEAD: ${{ steps.identity.outputs.auth_head }}
          AUTH_PARENT: ${{ steps.identity.outputs.auth_parent }}
          PR_NUMBER: ${{ steps.identity.outputs.pr_number }}
          DISPATCH_BRANCH: ${{ steps.identity.outputs.dispatch_branch }}
        run: |
          set -euo pipefail
          MARKER="ORDINAL${ORDINAL}_AEROSOL_FAMILY_V2_R8_DISPATCH_CONSUMED"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/60/comments" -f body="$MARKER" > consumed-comment.json
          GITHUB_TOKEN="$GH_TOKEN" PYTHONPATH=experiments/aerosol-family-challenge-v2-r8/execution-candidate \
          python3 experiments/aerosol-family-challenge-v2-r8/execution-candidate/authorization_surface.py \
            --repository "$GITHUB_REPOSITORY" --authorization experiments/aerosol-family-challenge-v2-r8/authorization.json \
            --current-pr "$PR_NUMBER" --current-run-id "$GITHUB_RUN_ID" \
            --marker-head "$AUTH_HEAD" --marker-parent "$AUTH_PARENT" --output freshness-post.json
          python3 - <<'PY2'
          import json, os, sys
          from pathlib import Path
          base=Path('experiments/aerosol-family-challenge-v2-r8'); cand=base/'execution-candidate'; sys.path.insert(0,str(cand))
          from dispatch_guard import evaluate
          a=json.loads((base/'authorization.json').read_text()); fresh=json.loads(Path('freshness-post.json').read_text())
          pr=json.loads(Path('auth-pr-selected.json').read_text()); rr=json.loads(Path('auth-review-selected.json').read_text())
          review=json.loads(list(Path('auth-review-artifact').rglob('authorization-review.json'))[0].read_text())
          paths={'manifest':Path('evidence/aerosol-family-challenge-v2-r8/manifest.frozen.json'),'freeze':Path('evidence/aerosol-family-challenge-v2-r8/freeze-record.json'),'transport':cand/'transport-contract.v3.json','adapter':base/'adapter.py','executor':cand/'executor.py','workflow':Path('.github/workflows/aerosol-family-v2-r8-execution.yml'),'authorizationGuard':cand/'authorization_guard.py','dispatchGuard':cand/'dispatch_guard.py','freshness':cand/'freshness.py','authorizationReviewWorkflow':Path('.github/workflows/aerosol-family-v2-r8-authorization-review.yml'),'dispatchPublisherWorkflow':Path('.github/workflows/aerosol-family-v2-r8-dispatch-publisher.yml')}
          ctx={'liveMain':os.environ['AUTH_PARENT'],'authorizationHead':os.environ['AUTH_HEAD'],'authorizationParent':os.environ['AUTH_PARENT'],'pr':{'number':pr['number'],'state':pr['state'],'draft':pr['draft'],'merged':pr.get('merged_at') is not None,'headBranch':pr['head']['ref'],'headSha':pr['head']['sha']},'authorizationReview':{'status':review['status'],'headSha':review['headSha'],'prNumber':review['prNumber'],'runAttempt':rr['run_attempt'],'conclusion':rr['conclusion'],'scientificRuntimeSetupPerformed':False,'scientificExecutionPerformed':False},'freshness':fresh,'issue60Markers':fresh.get('matchingAuthorizationMarkerBodies',[]),'dispatchBranchHeadSha':fresh.get('dispatchBranchHeadSha')}
          out=evaluate(a,ctx,paths,post_dispatch=True)
          Path('dispatch-post.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY2
          python3 - <<'PY2'
          import hashlib,json,os
          from pathlib import Path
          pre=json.loads(Path('dispatch-pre.json').read_text()); post=json.loads(Path('dispatch-post.json').read_text())
          out={'schemaVersion':1,'stageId':'aerosol-family-challenge-v2-r8-dispatch-publisher','status':'DISPATCH_PUBLISHER_PASS_ACTUAL_GIT_PUSH','scientificOrdinal':int(os.environ['ORDINAL']),'authorizationHead':os.environ['AUTH_HEAD'],'authorizationParent':os.environ['AUTH_PARENT'],'authorizationPr':int(os.environ['PR_NUMBER']),'dispatchBranch':os.environ['DISPATCH_BRANCH'],'dispatchBranchHead':os.environ['AUTH_HEAD'],'publisherRunId':int(os.environ['GITHUB_RUN_ID']),'publisherRunAttempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'actualGitPush':True,'githubTokenPushReliedUponToTriggerScience':False,'scienceTriggerMode':'EXPLICIT_WORKFLOW_DISPATCH_AFTER_ACTUAL_GIT_PUSH','currentConsumedMarkerPosted':True,'gitPushStdoutSha256':'${{ steps.push.outputs.git_push_stdout_sha256 }}','gitPushStderrSha256':'${{ steps.push.outputs.git_push_stderr_sha256 }}','preDispatchGuard':pre,'postDispatchGuard':post,'scientificRuntimeSetupPerformed':False,'scientificExecutionPerformed':False,'solverExecutionPerformed':False}
          Path('dispatch-publisher.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY2
      - name: Persist immutable publisher evidence before science trigger
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aerosol-family-v2-r8-dispatch-publisher-ordinal-${{ steps.identity.outputs.ordinal }}
          path: |
            dispatch-publisher.json
            dispatch-pre.json
            dispatch-post.json
            freshness-pre.json
            freshness-post.json
            consumed-comment.json
            git-push.stdout
            git-push.stderr
            dispatch-ls-remote.txt
            auth-pr-selected.json
            auth-review-selected.json
            auth-review-artifact-selected.json
          if-no-files-found: error
          compression-level: 0
      - name: Explicitly dispatch attempt-1 science on pushed ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_BRANCH: ${{ steps.identity.outputs.dispatch_branch }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/aerosol-family-v2-r8-execution.yml/dispatches" -f ref="$DISPATCH_BRANCH"
          echo "actual git push completed; science invoked via workflow_dispatch"
          echo "scientific runtime setup performed by publisher: false"
