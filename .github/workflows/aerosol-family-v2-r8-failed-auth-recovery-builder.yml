name: AFC2 R8 failed authorization recovery builder

on:
  push:
    branches:
      - "status/aerosol-family-v2-r8-failed-auth-recovery-builder-1"
    paths:
      - ".github/recovery-parts/afc2-r8-preauth-part-*"
      - ".github/workflows/aerosol-family-v2-r8-failed-auth-recovery-builder.yml"

permissions:
  contents: write

concurrency:
  group: afc2-r8-failed-auth-recovery-builder
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact builder head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Reconstruct verified recovery bytes and fast-forward PR branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = "status/aerosol-family-v2-r8-failed-auth-recovery-builder-1"
          cat \
            .github/recovery-parts/afc2-r8-preauth-part-0 \
            .github/recovery-parts/afc2-r8-preauth-part-1 \
            .github/recovery-parts/afc2-r8-preauth-part-2 \
            .github/recovery-parts/afc2-r8-preauth-part-3 \
            > /tmp/preauthorization_ordinal.py
          test "$(wc -c < /tmp/preauthorization_ordinal.py)" = 19033
          test "$(git hash-object /tmp/preauthorization_ordinal.py)" = "7ca8efd17ae9e7ec2baa32fe935e5173ca6d173f"
          test "$(sha256sum /tmp/preauthorization_ordinal.py | awk '{print $1}')" = "9e64384f26b8b1dc55011b9ab7daf1a45d6d11c51da43519f4694b875475f3e1"

          TARGET_BRANCH="fix/aerosol-family-v2-r8-failed-authorization-recovery"
          TARGET_PATH="experiments/aerosol-family-challenge-v2-r8/execution-candidate/preauthorization_ordinal.py"
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "fa5ec5bb40bd75334318ab92252d02942f3791fc"
          git checkout -B publish "origin/$TARGET_BRANCH"
          cp /tmp/preauthorization_ordinal.py "$TARGET_PATH"
          git diff --check
          mapfile -t CHANGED < <(git diff --name-only)
          test "${#CHANGED[@]}" = 1
          test "${CHANGED[0]}" = "$TARGET_PATH"

          git config user.name "search-maker"
          git config user.email "304153003+search-maker@users.noreply.github.com"
          git add -- "$TARGET_PATH"
          mapfile -t STAGED < <(git diff --cached --name-only)
          test "${#STAGED[@]}" = 1
          test "${STAGED[0]}" = "$TARGET_PATH"
          git commit -m "Preserve retired ordinal refusal in AFC2 R8 recovery"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = "$TARGET_PATH"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "published_head=$(git rev-parse HEAD)"
          echo "scientific_runtime=false"
          echo "solver_execution=false"
