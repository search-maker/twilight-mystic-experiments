name: aerosol-family-v2-r8-freeze-status-observer
on:
  push:
    branches:
      - status/aerosol-family-v2-r8-freeze-status-observer
    paths:
      - .github/workflows/aerosol-family-v2-r8-freeze-status-observer.yml
permissions:
  actions: read
  contents: read
  issues: write
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read R8 bootstrap and proof status only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          h={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'afc2-r8-freeze-status-observer'}
          def get(path):
              r=urllib.request.Request('https://api.github.com'+path,headers=h)
              with urllib.request.urlopen(r,timeout=90) as x: return json.load(x)
          def latest(workflow):
              ref=urllib.parse.quote(workflow,safe='')
              rows=get(f'/repos/{repo}/actions/workflows/{ref}/runs?per_page=20').get('workflow_runs',[])
              rows=sorted(rows,key=lambda r:int(r.get('id') or 0),reverse=True)
              if not rows: return None
              r=rows[0]
              return {k:r.get(k) for k in ('id','status','conclusion','event','head_sha','run_attempt','created_at','updated_at')}
          main=str((get(f'/repos/{repo}/branches/main').get('commit') or {}).get('sha') or '')
          boot=latest('aerosol-family-v2-r8-review-freeze-bootstrap.yml')
          proof=latest('aerosol-family-v2-r8-seed-proof-review.yml')
          proof_artifacts=[]
          if proof:
              rows=get(f"/repos/{repo}/actions/runs/{proof['id']}/artifacts?per_page=100").get('artifacts',[])
              proof_artifacts=[{'id':a.get('id'),'name':a.get('name'),'expired':a.get('expired')} for a in rows]
          def one(label,row):
              if row is None: return f'{label}=NONE'
              return (f"{label}=id:{row['id']},status:{row['status']},conclusion:{row['conclusion']},"
                      f"event:{row['event']},attempt:{row['run_attempt']},head:{row['head_sha']},"
                      f"created:{row['created_at']},updated:{row['updated_at']}")
          body='\n'.join([
              'AFC2-R8-FREEZE-STATUS-OBSERVER',
              f'main={main}',
              one('bootstrap',boot),
              one('seed_proof',proof),
              'seed_proof_artifacts='+json.dumps(proof_artifacts,separators=(',',':')),
              'observer_only=true',
              'scientific_runtime=false',
              'solver_execution=false',
              'no_rerun=true',
          ])
          payload=json.dumps({'body':body}).encode()
          req=urllib.request.Request('https://api.github.com'+f'/repos/{repo}/issues/60/comments',data=payload,method='POST',headers=h|{'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=90) as x: x.read()
          print(body)
          PY
