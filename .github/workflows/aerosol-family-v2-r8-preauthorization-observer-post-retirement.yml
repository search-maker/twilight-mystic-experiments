name: AFC2 R8 post-retirement preauthorization status observer
on:
  push:
    branches:
      - status/aerosol-family-v2-r8-preauthorization-observer-post-retirement
    paths:
      - .github/workflows/aerosol-family-v2-r8-preauthorization-observer-post-retirement.yml
permissions:
  actions: read
  contents: read
  issues: write
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read exact-main preauthorization status only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN: 39c60e72748262e320149497f385a8bf768ae2d2
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/aerosol-family-v2-r8-preauthorization-audit.yml/runs?branch=main&event=push&per_page=20" > runs.json
          python3 - <<'PY' > body.txt
          import json, os
          rows=json.load(open('runs.json')).get('workflow_runs',[])
          matches=[r for r in rows if r.get('head_sha')==os.environ['EXPECTED_MAIN']]
          lines=[
              'AFC2-R8-PREAUTHORIZATION-STATUS-OBSERVER',
              f"exact_main={os.environ['EXPECTED_MAIN']}",
              f'matching_run_count={len(matches)}',
          ]
          for i,r in enumerate(sorted(matches,key=lambda x:int(x.get('id') or 0)),1):
              lines.append(
                  f"run_{i}=id:{r.get('id')},status:{r.get('status')},conclusion:{r.get('conclusion')},"
                  f"event:{r.get('event')},attempt:{r.get('run_attempt')},head:{r.get('head_sha')},"
                  f"created:{r.get('created_at')},updated:{r.get('updated_at')}"
              )
          lines += ['observer_only=true','scientific_runtime=false','solver_execution=false','no_rerun=true']
          print('\n'.join(lines))
          PY
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/60/comments" -F body=@body.txt
          cat body.txt
