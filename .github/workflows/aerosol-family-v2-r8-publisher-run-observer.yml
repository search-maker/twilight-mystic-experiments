name: aerosol-family-v2-r8-publisher-run-observer
on:
  push:
    branches:
      - status/aerosol-family-v2-r8-publisher-run-observer-1
    paths:
      - .github/workflows/aerosol-family-v2-r8-publisher-run-observer.yml
permissions:
  actions: read
  contents: read
  issues: write
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read publisher run metadata only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          headers={
              'Authorization':f'Bearer {token}',
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'afc2-r8-publisher-run-observer',
          }
          workflow=urllib.parse.quote('aerosol-family-v2-r8-dispatch-publisher.yml',safe='')
          branch=urllib.parse.quote('status/aerosol-family-v2-r8-dispatch-publisher-ordinal-32',safe='')
          path=f'/repos/{repo}/actions/workflows/{workflow}/runs?branch={branch}&event=push&per_page=100'
          req=urllib.request.Request('https://api.github.com'+path,headers=headers)
          with urllib.request.urlopen(req,timeout=90) as response:
              data=json.load(response)
          runs=[]
          for row in data.get('workflow_runs',[]):
              runs.append({
                  'id':row.get('id'),
                  'status':row.get('status'),
                  'conclusion':row.get('conclusion'),
                  'event':row.get('event'),
                  'run_attempt':row.get('run_attempt'),
                  'head_sha':row.get('head_sha'),
                  'created_at':row.get('created_at'),
                  'updated_at':row.get('updated_at'),
              })
          runs.sort(key=lambda r:int(r.get('id') or 0))
          lines=['AFC2-R8-PUBLISHER-RUN-OBSERVER',f'publisher_run_count={len(runs)}']
          for i,row in enumerate(runs,1):
              lines.append(
                  f"publisher_{i}=id:{row['id']},status:{row['status']},conclusion:{row['conclusion']},"
                  f"event:{row['event']},attempt:{row['run_attempt']},head:{row['head_sha']},"
                  f"created:{row['created_at']},updated:{row['updated_at']}"
              )
          lines += ['observer_only=true','scientific_runtime=false','solver_execution=false','no_rerun=true']
          body='\n'.join(lines)
          payload=json.dumps({'body':body}).encode()
          post=urllib.request.Request(
              f'https://api.github.com/repos/{repo}/issues/60/comments',
              data=payload,method='POST',headers=headers|{'Content-Type':'application/json'})
          with urllib.request.urlopen(post,timeout=90) as response:
              response.read()
          print(body)
          PY
