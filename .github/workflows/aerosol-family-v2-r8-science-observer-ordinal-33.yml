name: AFC2 R8 ordinal-33 science observer

on:
  push:
    branches:
      - status/aerosol-family-v2-r8-science-observer-ordinal-33

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Resolve exact R8 ordinal-33 science run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: dispatch/aerosol-family-challenge-v2-r8-ordinal-33
          TARGET_HEAD: 770495459c12da2542a62b362cff7032ee6386ed
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/aerosol-family-v2-r8-execution.yml/runs?event=workflow_dispatch&branch=${TARGET_BRANCH}&per_page=100" > runs.json
          python3 - <<'PY' > observer.env
          import json, os
          from pathlib import Path
          pages=json.loads(Path('runs.json').read_text())
          runs=[r for page in pages for r in page.get('workflow_runs',[])]
          matches=[r for r in runs if r.get('head_branch')==os.environ['TARGET_BRANCH'] and r.get('head_sha')==os.environ['TARGET_HEAD']]
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one exact branch/head workflow_dispatch run, got {len(matches)}')
          r=matches[0]
          print('RUN_ID='+str(r['id']))
          print('RUN_ATTEMPT='+str(r.get('run_attempt')))
          print('RUN_STATUS='+str(r.get('status')))
          print('RUN_CONCLUSION='+str(r.get('conclusion')))
          print('RUN_EVENT='+str(r.get('event')))
          print('RUN_HEAD='+str(r.get('head_sha')))
          print('RUN_BRANCH='+str(r.get('head_branch')))
          print('RUN_CREATED='+str(r.get('created_at')))
          print('RUN_UPDATED='+str(r.get('updated_at')))
          if int(r.get('run_attempt') or 0) != 1:
              raise SystemExit('science run attempt is not 1')
          PY
          cat observer.env
      - name: Post exact observer checkpoint to Issue 60
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source observer.env
          BODY=$(cat <<EOF
          AFC2-R8-ORDINAL33-SCIENCE-OBSERVER
          run=${RUN_ID}
          attempt=${RUN_ATTEMPT}
          status=${RUN_STATUS}
          conclusion=${RUN_CONCLUSION}
          event=${RUN_EVENT}
          head=${RUN_HEAD}
          branch=${RUN_BRANCH}
          created=${RUN_CREATED}
          updated=${RUN_UPDATED}
          observer_branch=${GITHUB_REF_NAME}
          observer_only=true
          target_mutation=false
          rerun_retry_resume=false
          EOF
          )
          gh api "repos/${GITHUB_REPOSITORY}/issues/60/comments" -f body="$BODY" >/dev/null
