name: AFC2 R8 timeout recovery v1 combined opening publisher v3
run-name: AFC2 R8 combined opening publisher v3 source-run-32503223236

on:
  push:
    branches:
      - status/aerosol-family-v2-r8-timeout-recovery-v1-combined-opening-publisher-v3-run-32503223236
    paths:
      - .github/dispatch-requests/aerosol-family-v2-r8-timeout-recovery-combined-opening-v3.json

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: afc2-r8-timeout-recovery-v1-combined-opening-publisher-v3-run-32503223236
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact v3 one-file opening request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - name: Prove exact reviewed v3 transport bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('.')
          freeze=json.loads((root/'evidence/aerosol-family-challenge-v2-r8-timeout-recovery-v1/combined-trigger-recovery-v3.freeze.json').read_text())
          paths={
            'reviewRawSha256':root/'experiments/aerosol-family-challenge-v2-r8-timeout-recovery-v1/combined-trigger-recovery-v3.review.json',
            'openingWorkflowRawSha256':root/'.github/workflows/aerosol-family-v2-r8-timeout-recovery-v1-combined-opening-recovery-v3.yml',
            'publisherWorkflowRawSha256':root/'.github/workflows/aerosol-family-v2-r8-timeout-recovery-v1-combined-opening-publisher-v3.yml',
            'testRawSha256':root/'tests/test_aerosol_family_r8_timeout_recovery_combined_trigger_recovery_v3.py',
          }
          if freeze.get('status')!='FROZEN_FRESH_V3_CONTROL_PLANE_IDENTITY_NOT_DISPATCHED': raise SystemExit('v3 freeze status drift')
          if freeze.get('scientificResultOpeningAuthorizedByFreezeAlone') is not False or freeze.get('scientificSolverExecutionAuthorized') is not False: raise SystemExit('v3 freeze opened forbidden boundary')
          for key,path in paths.items():
              got=hashlib.sha256(path.read_bytes()).hexdigest()
              if freeze.get(key)!=got: raise SystemExit(f'v3 byte binding drift: {key} expected={freeze.get(key)} observed={got}')
          PY
      - name: Prove v1 and v2 terminal histories and fresh v3 one-use surface
        id: identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: '32503223236'
          SOURCE_HEAD: b37aab8fd2c2f0a6b58eef79a00811c9adea02a0
          SOURCE_BRANCH: dispatch/aerosol-family-challenge-v2-r8-timeout-recovery-v1-ordinal-35
          V1_REQUEST_BRANCH: status/aerosol-family-v2-r8-timeout-recovery-v1-combined-opening-publisher-run-32503223236
          V1_REQUEST_HEAD: 1d8b5c047341d3e81a69463433e26cd94d6836e7
          V1_DISPATCH_BRANCH: dispatch/aerosol-family-v2-r8-timeout-recovery-v1-combined-opening-run-32503223236
          V1_TRANSPORT_HEAD: 0ca71ea91a94707f23c1d5da31526bf4e68b1423
          V1_PUBLISHER_RUN_ID: '32508493509'
          V1_PUBLISHER_JOB_ID: '96853960455'
          V2_REQUEST_BRANCH: status/aerosol-family-v2-r8-timeout-recovery-v1-combined-opening-publisher-v2-run-32503223236
          V2_REQUEST_HEAD: b4ddc0fb20f219b5e6f9dddc50d0a5e5bfc2f37c
          V2_TRANSPORT_HEAD: e938a5383f41220bb26ca1e681a792dbbcbcf8d3
          V2_PUBLISHER_RUN_ID: '32510096551'
          V2_PUBLISHER_JOB_ID: '96858517974'
          REQUEST_BRANCH: status/aerosol-family-v2-r8-timeout-recovery-v1-combined-opening-publisher-v3-run-32503223236
          DISPATCH_BRANCH: dispatch/aerosol-family-v2-r8-timeout-recovery-v1-combined-opening-v3-run-32503223236
          EXECUTION_WORKFLOW: aerosol-family-v2-r8-timeout-recovery-v1-combined-opening-recovery-v3.yml
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = "$REQUEST_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mapfile -t PARENTS < <(git cat-file -p "$GITHUB_SHA" | sed -n 's/^parent //p')
          test "${#PARENTS[@]}" = 1
          TRANSPORT_HEAD="${PARENTS[0]}"
          export TRANSPORT_HEAD
          git fetch origin main "$V1_REQUEST_BRANCH" "$V1_DISPATCH_BRANCH" "$V2_REQUEST_BRANCH"
          test "$TRANSPORT_HEAD" = "$(git rev-parse origin/main)"
          test "$(git rev-parse origin/$V1_REQUEST_BRANCH)" = "$V1_REQUEST_HEAD"
          test "$(git rev-parse origin/$V1_DISPATCH_BRANCH)" = "$V1_TRANSPORT_HEAD"
          test "$(git rev-parse origin/$V2_REQUEST_BRANCH)" = "$V2_REQUEST_HEAD"
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")
          test "${#CHANGED[@]}" = 1
          test "${CHANGED[0]}" = .github/dispatch-requests/aerosol-family-v2-r8-timeout-recovery-combined-opening-v3.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('.github/dispatch-requests/aerosol-family-v2-r8-timeout-recovery-combined-opening-v3.json').read_text())
          expected={
            'schemaVersion':1,
            'stageId':'aerosol-family-challenge-v2-r8-timeout-recovery-v1-combined-opening-v3-request',
            'status':'REQUEST_FRESH_V3_ONE_USE_FROZEN_COMBINED_RESULT_OPENING',
            'sourceScienceRunId':32503223236,
            'sourceScienceHead':'b37aab8fd2c2f0a6b58eef79a00811c9adea02a0',
            'failedV1PublisherRunId':32508493509,
            'failedV2PublisherRunId':32510096551,
            'failedV2RequestHead':'b4ddc0fb20f219b5e6f9dddc50d0a5e5bfc2f37c',
            'frozenAnalysisCommit':'19bd924ab86ed0744b3fd77ce5d6756039674d5f',
            'transportHead':os.environ['TRANSPORT_HEAD'],
          }
          if r!=expected: raise SystemExit(f'v3 opening request drift: {r}')
          PY
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > source-run.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" > source-artifact-pages.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${V1_PUBLISHER_RUN_ID}" > v1-publisher-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${V1_PUBLISHER_JOB_ID}" > v1-publisher-job.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${V2_PUBLISHER_RUN_ID}" > v2-publisher-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${V2_PUBLISHER_JOB_ID}" > v2-publisher-job.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/aerosol-family-v2-r8-timeout-recovery-v1-combined-analysis.yml/runs?per_page=100" > original-combined-runs.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/aerosol-family-v2-r8-timeout-recovery-v1-combined-opening-recovery.yml/runs?per_page=100" > v1-opening-runs.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/aerosol-family-v2-r8-timeout-recovery-v1-combined-opening-recovery-v2.yml/runs?per_page=100" > v2-opening-runs.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/${EXECUTION_WORKFLOW}/runs?per_page=100" > v3-opening-runs-before.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/60/comments?per_page=100" > issue60-comments.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls?state=all&head=${GITHUB_REPOSITORY%%/*}:authorization/aerosol-family-challenge-v2-r8-timeout-recovery-v1-ordinal-35&per_page=100" > auth-pr-pages.json
          python - <<'PY'
          import json,os
          source=json.load(open('source-run.json'))
          if source.get('id')!=32503223236 or source.get('run_attempt')!=1 or source.get('status')!='completed' or source.get('conclusion')!='success' or source.get('event')!='workflow_dispatch': raise SystemExit('source science is not exact successful attempt1')
          if source.get('head_sha')!=os.environ['SOURCE_HEAD'] or source.get('head_branch')!=os.environ['SOURCE_BRANCH']: raise SystemExit('source science identity drift')
          pages=json.load(open('source-artifact-pages.json')); arts=[a for p in pages for a in p.get('artifacts',[])]
          aq=[a for a in arts if a.get('id')==9454797882 and a.get('name')=='afc2-r8-timeout-recovery-v1-acquisition-ordinal-35' and a.get('digest')=='sha256:93730886d7cf26f8c97cf6a40f84533cce4fefa7c2b9bc0f91af070b626d2a56' and not a.get('expired',False)]
          if len(aq)!=1: raise SystemExit('exact acquisition artifact missing/drifted')
          v1=json.load(open('v1-publisher-run.json')); j1=json.load(open('v1-publisher-job.json'))
          v2=json.load(open('v2-publisher-run.json')); j2=json.load(open('v2-publisher-job.json'))
          if v1.get('id')!=32508493509 or v1.get('run_attempt')!=1 or v1.get('status')!='completed' or v1.get('conclusion')!='failure' or v1.get('head_sha')!=os.environ['V1_REQUEST_HEAD']: raise SystemExit('v1 publisher history drift')
          if v2.get('id')!=32510096551 or v2.get('run_attempt')!=1 or v2.get('status')!='completed' or v2.get('conclusion')!='failure' or v2.get('head_sha')!=os.environ['V2_REQUEST_HEAD']: raise SystemExit('v2 publisher history drift')
          s1={str(s.get('name')):s.get('conclusion') for s in j1.get('steps',[])}
          s2={str(s.get('name')):s.get('conclusion') for s in j2.get('steps',[])}
          if s1.get('Actual authenticated push creates exact opening dispatch ref')!='success' or s1.get('Consume opening recovery identity exactly once after successful push')!='success' or s1.get('Dispatch exact guarded combined opening recovery')!='failure': raise SystemExit('v1 step history drift')
          if s2.get('Prove exact reviewed v2 transport bytes')!='success' or s2.get('Prove v1 terminal failure and fresh v2 one-use surface')!='failure' or s2.get('Actual authenticated push creates fresh v2 opening dispatch ref')!='skipped' or s2.get('Consume fresh v2 opening identity exactly once after successful push')!='skipped': raise SystemExit('v2 pre-dispatch failure history drift')
          original=[r for p in json.load(open('original-combined-runs.json')) for r in p.get('workflow_runs',[])]
          v1o=[r for p in json.load(open('v1-opening-runs.json')) for r in p.get('workflow_runs',[])]
          v2o=[r for p in json.load(open('v2-opening-runs.json')) for r in p.get('workflow_runs',[])]
          v3o=[r for p in json.load(open('v3-opening-runs-before.json')) for r in p.get('workflow_runs',[])]
          if original or v1o or v2o or v3o: raise SystemExit(f'opening history not empty original={len(original)} v1={len(v1o)} v2={len(v2o)} v3={len(v3o)}')
          prs=[p for page in json.load(open('auth-pr-pages.json')) for p in page]
          good=[p for p in prs if p.get('number')==291 and p.get('state')=='open' and p.get('draft') is True and p.get('merged_at') is None and (p.get('head') or {}).get('sha')==os.environ['SOURCE_HEAD']]
          if len(good)!=1: raise SystemExit('PR291 must remain Draft/open/unmerged')
          comments=[c for page in json.load(open('issue60-comments.json')) for c in page]
          by_id={int(c.get('id') or 0):str(c.get('body') or '') for c in comments}
          if 'CONTROL_PLANE_WORKFLOW_DISPATCH_INPUT_TYPE_COERCION_HTTP_422_AFTER_OPENING_IDENTITY_CONSUMED_NO_OPENING_RUN' not in by_id.get(5373207353,''): raise SystemExit('v1 terminal checkpoint missing/drifted')
          if 'CONTROL_PLANE_AUDIT_RAW_LOG_RENDER_REFUSAL_BEFORE_V2_PUSH_CONSUME_DISPATCH_NO_RESULTS_OPENED' not in by_id.get(5373348599,''): raise SystemExit('v2 terminal checkpoint missing/drifted')
          v2_alloc='AFC2_R8_TIMEOUT_RECOVERY_V1_COMBINED_OPENING_RECOVERY_V2_ALLOCATED source_run=32503223236 transport_head='+os.environ['V2_TRANSPORT_HEAD']
          v2_consumed='AFC2_R8_TIMEOUT_RECOVERY_V1_COMBINED_OPENING_RECOVERY_V2_CONSUMED source_run=32503223236 transport_head='+os.environ['V2_TRANSPORT_HEAD']
          v3_alloc='AFC2_R8_TIMEOUT_RECOVERY_V1_COMBINED_OPENING_RECOVERY_V3_ALLOCATED source_run=32503223236 transport_head='+os.environ['TRANSPORT_HEAD']
          v3_consumed='AFC2_R8_TIMEOUT_RECOVERY_V1_COMBINED_OPENING_RECOVERY_V3_CONSUMED source_run=32503223236 transport_head='+os.environ['TRANSPORT_HEAD']
          if len([c for c in comments if str(c.get('body') or '').strip()==v2_alloc])!=1 or [c for c in comments if str(c.get('body') or '').strip()==v2_consumed]: raise SystemExit('v2 marker history drift')
          if len([c for c in comments if str(c.get('body') or '').strip()==v3_alloc])!=1 or [c for c in comments if str(c.get('body') or '').strip()==v3_consumed]: raise SystemExit('v3 marker surface drift')
          PY
          if git ls-remote --exit-code --heads origin "$DISPATCH_BRANCH" >/dev/null 2>&1; then echo 'v3 opening dispatch branch already exists' >&2; exit 1; fi
          echo "transport_head=$TRANSPORT_HEAD" >> "$GITHUB_OUTPUT"
          echo "dispatch_branch=$DISPATCH_BRANCH" >> "$GITHUB_OUTPUT"
      - name: Actual authenticated push creates fresh v3 opening dispatch ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRANSPORT_HEAD: ${{ steps.identity.outputs.transport_head }}
          DISPATCH_BRANCH: ${{ steps.identity.outputs.dispatch_branch }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$TRANSPORT_HEAD"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "$TRANSPORT_HEAD:refs/heads/$DISPATCH_BRANCH" > v3-opening-git-push.stdout 2> v3-opening-git-push.stderr
          git ls-remote --exit-code --heads origin "$DISPATCH_BRANCH" > v3-opening-dispatch-ls-remote.txt
          grep -q "^${TRANSPORT_HEAD}[[:space:]]" v3-opening-dispatch-ls-remote.txt
      - name: Consume fresh v3 opening identity exactly once after successful push
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRANSPORT_HEAD: ${{ steps.identity.outputs.transport_head }}
        run: |
          set -euo pipefail
          MARKER="AFC2_R8_TIMEOUT_RECOVERY_V1_COMBINED_OPENING_RECOVERY_V3_CONSUMED source_run=32503223236 transport_head=${TRANSPORT_HEAD}"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/60/comments" -f body="$MARKER" > v3-opening-consumed-comment.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/60/comments?per_page=100" > issue60-after-v3-consume.json
          python - <<'PY'
          import json,os
          comments=[c for p in json.load(open('issue60-after-v3-consume.json')) for c in p]
          marker='AFC2_R8_TIMEOUT_RECOVERY_V1_COMBINED_OPENING_RECOVERY_V3_CONSUMED source_run=32503223236 transport_head='+os.environ['TRANSPORT_HEAD']
          matches=[c for c in comments if str(c.get('body') or '').strip()==marker]
          if len(matches)!=1: raise SystemExit(f'v3 consumed marker must exist exactly once, got {len(matches)}')
          PY
      - name: Dispatch exact guarded combined opening recovery v3 with explicit JSON string input
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_BRANCH: ${{ steps.identity.outputs.dispatch_branch }}
          TRANSPORT_HEAD: ${{ steps.identity.outputs.transport_head }}
          EXECUTION_WORKFLOW: aerosol-family-v2-r8-timeout-recovery-v1-combined-opening-recovery-v3.yml
        run: |
          set -euo pipefail
          export DISPATCH_BRANCH
          python - <<'PY'
          import json,os
          payload={'ref':os.environ['DISPATCH_BRANCH'],'inputs':{'science_run_id':'32503223236'}}
          with open('workflow-dispatch-v3.json','w') as f: json.dump(payload,f,separators=(',',':'))
          check=json.load(open('workflow-dispatch-v3.json'))
          if not isinstance(check['inputs']['science_run_id'],str) or check['inputs']['science_run_id']!='32503223236': raise SystemExit('science_run_id is not an exact JSON string')
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/${EXECUTION_WORKFLOW}/dispatches" --input workflow-dispatch-v3.json
          FOUND=0
          for i in $(seq 1 30); do
            gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/${EXECUTION_WORKFLOW}/runs?branch=${DISPATCH_BRANCH}&event=workflow_dispatch&per_page=100" > v3-opening-runs-after.json
            if python - <<'PY'
          import json,os,sys
          runs=[r for p in json.load(open('v3-opening-runs-after.json')) for r in p.get('workflow_runs',[])]
          good=[r for r in runs if r.get('head_branch')==os.environ['DISPATCH_BRANCH'] and r.get('head_sha')==os.environ['TRANSPORT_HEAD'] and int(r.get('run_attempt') or 0)==1]
          if len(good)==1:
              json.dump(good[0],open('v3-opening-run-selected.json','w'),indent=2,sort_keys=True); sys.exit(0)
          sys.exit(1)
          PY
            then FOUND=1; break; fi
            sleep 2
          done
          test "$FOUND" = 1
          echo "opening_run_id=$(python -c 'import json;print(json.load(open("v3-opening-run-selected.json"))["id"])')" >> "$GITHUB_OUTPUT"
      - name: Persist immutable v3 publisher evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: afc2-r8-timeout-recovery-v1-combined-opening-publisher-v3-run-32503223236
          path: |
            .github/dispatch-requests/aerosol-family-v2-r8-timeout-recovery-combined-opening-v3.json
            source-run.json
            source-artifact-pages.json
            v1-publisher-run.json
            v1-publisher-job.json
            v2-publisher-run.json
            v2-publisher-job.json
            original-combined-runs.json
            v1-opening-runs.json
            v2-opening-runs.json
            auth-pr-pages.json
            v3-opening-git-push.stdout
            v3-opening-git-push.stderr
            v3-opening-dispatch-ls-remote.txt
            v3-opening-consumed-comment.json
            workflow-dispatch-v3.json
            v3-opening-run-selected.json
          if-no-files-found: error
          compression-level: 0
