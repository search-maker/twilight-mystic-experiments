name: AFC2 R8 timeout recovery v1 combined opening recovery
run-name: AFC2 R8 combined opening recovery source-run-${{ inputs.science_run_id }}

on:
  workflow_dispatch:
    inputs:
      science_run_id:
        description: Exact successful recovery science run
        required: true
        type: string

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: afc2-r8-timeout-recovery-v1-combined-opening-recovery-${{ inputs.science_run_id }}
  cancel-in-progress: false

jobs:
  combined-opening-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact trigger-recovery transport head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - name: Prove one-use publisher-controlled opening identity before any scientific download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SCIENCE_RUN_ID: ${{ inputs.science_run_id }}
          EXPECTED_SCIENCE_RUN_ID: '32503223236'
          EXPECTED_SCIENCE_HEAD: b37aab8fd2c2f0a6b58eef79a00811c9adea02a0
          EXPECTED_SCIENCE_BRANCH: dispatch/aerosol-family-challenge-v2-r8-timeout-recovery-v1-ordinal-35
          REQUEST_BRANCH: status/aerosol-family-v2-r8-timeout-recovery-v1-combined-opening-publisher-run-32503223236
          DISPATCH_BRANCH: dispatch/aerosol-family-v2-r8-timeout-recovery-v1-combined-opening-run-32503223236
          PUBLISHER_WORKFLOW: aerosol-family-v2-r8-timeout-recovery-v1-combined-opening-publisher.yml
          EXECUTION_WORKFLOW: aerosol-family-v2-r8-timeout-recovery-v1-combined-opening-recovery.yml
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$SCIENCE_RUN_ID" = "$EXPECTED_SCIENCE_RUN_ID"
          test "$GITHUB_REF_NAME" = "$DISPATCH_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/aerosol-family-v2-r8-timeout-recovery-v1-combined-opening-recovery.yml').read_text()
          forbidden=('setup-'+'micromamba','rubin-'+'libradtran','command -v '+'uvspec','--allow-'+'execution')
          found=[x for x in forbidden if x in text]
          if found: raise SystemExit(f'combined opening recovery exposed scientific solver runtime: {found}')
          PY
          git fetch origin main "$REQUEST_BRANCH" "$DISPATCH_BRANCH"
          test "$(git rev-parse origin/$DISPATCH_BRANCH)" = "$GITHUB_SHA"
          REQUEST_HEAD="$(git rev-parse origin/$REQUEST_BRANCH)"
          mapfile -t REQUEST_PARENTS < <(git cat-file -p "$REQUEST_HEAD" | sed -n 's/^parent //p')
          test "${#REQUEST_PARENTS[@]}" = 1
          TRANSPORT_HEAD="${REQUEST_PARENTS[0]}"
          test "$GITHUB_SHA" = "$TRANSPORT_HEAD"
          test "$(git rev-parse origin/main)" = "$TRANSPORT_HEAD"
          git show "$REQUEST_HEAD:.github/dispatch-requests/aerosol-family-v2-r8-timeout-recovery-combined-opening-v1.json" > opening-request.json
          python - <<'PY'
          import json,os
          r=json.load(open('opening-request.json'))
          expected={
            'schemaVersion':1,
            'stageId':'aerosol-family-challenge-v2-r8-timeout-recovery-v1-combined-opening-request',
            'status':'REQUEST_ONE_USE_FROZEN_COMBINED_RESULT_OPENING',
            'sourceScienceRunId':32503223236,
            'sourceScienceHead':'b37aab8fd2c2f0a6b58eef79a00811c9adea02a0',
            'frozenAnalysisCommit':'19bd924ab86ed0744b3fd77ce5d6756039674d5f',
            'transportHead':os.environ['GITHUB_SHA'],
          }
          if r!=expected: raise SystemExit(f'opening request drift: {r}')
          PY
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SCIENCE_RUN_ID}" > science-run.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${SCIENCE_RUN_ID}/artifacts?per_page=100" > recovery-artifact-pages.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/${PUBLISHER_WORKFLOW}/runs?branch=${REQUEST_BRANCH}&event=push&per_page=100" > publisher-runs.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/${EXECUTION_WORKFLOW}/runs?branch=${DISPATCH_BRANCH}&event=workflow_dispatch&per_page=100" > opening-runs.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/aerosol-family-v2-r8-timeout-recovery-v1-combined-analysis.yml/runs?per_page=100" > original-combined-runs.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/60/comments?per_page=100" > issue60-comments.json
          python - <<'PY'
          import json,os,time,subprocess
          from pathlib import Path
          science=json.load(open('science-run.json'))
          if science.get('id')!=32503223236 or science.get('event')!='workflow_dispatch' or science.get('run_attempt')!=1 or science.get('status')!='completed' or science.get('conclusion')!='success': raise SystemExit('source science identity/status drift')
          if science.get('head_sha')!=os.environ['EXPECTED_SCIENCE_HEAD'] or science.get('head_branch')!=os.environ['EXPECTED_SCIENCE_BRANCH']: raise SystemExit('source science head/branch drift')
          pages=json.load(open('recovery-artifact-pages.json')); arts=[a for p in pages for a in p.get('artifacts',[])]
          aq=[a for a in arts if a.get('id')==9454797882 and a.get('name')=='afc2-r8-timeout-recovery-v1-acquisition-ordinal-35' and a.get('digest')=='sha256:93730886d7cf26f8c97cf6a40f84533cce4fefa7c2b9bc0f91af070b626d2a56' and not a.get('expired',False)]
          if len(aq)!=1: raise SystemExit('exact acquisition artifact missing/drifted')
          original=[r for p in json.load(open('original-combined-runs.json')) for r in p.get('workflow_runs',[])]
          if original: raise SystemExit(f'original combined workflow unexpectedly materialized runs={len(original)}')
          comments=[c for p in json.load(open('issue60-comments.json')) for c in p]
          allocated='AFC2_R8_TIMEOUT_RECOVERY_V1_COMBINED_OPENING_RECOVERY_ALLOCATED source_run=32503223236 transport_head='+os.environ['GITHUB_SHA']
          consumed='AFC2_R8_TIMEOUT_RECOVERY_V1_COMBINED_OPENING_RECOVERY_CONSUMED source_run=32503223236 transport_head='+os.environ['GITHUB_SHA']
          if len([c for c in comments if str(c.get('body') or '').strip()==allocated])!=1: raise SystemExit('opening allocation marker must exist exactly once')
          if len([c for c in comments if str(c.get('body') or '').strip()==consumed])!=1: raise SystemExit('opening consumed marker must exist exactly once')
          pages=json.load(open('opening-runs.json')); runs=[r for p in pages for r in p.get('workflow_runs',[])]
          same=[r for r in runs if r.get('head_branch')==os.environ['DISPATCH_BRANCH'] and r.get('head_sha')==os.environ['GITHUB_SHA']]
          current=[r for r in same if int(r.get('id') or 0)==int(os.environ['GITHUB_RUN_ID']) and int(r.get('run_attempt') or 0)==1]
          if len(same)!=1 or len(current)!=1: raise SystemExit(f'opening execution must be exactly one attempt-1 run; same={len(same)} current={len(current)}')
          publisher_pages=json.load(open('publisher-runs.json')); pubs=[r for p in publisher_pages for r in p.get('workflow_runs',[])]
          matching=[r for r in pubs if r.get('head_branch')==os.environ['REQUEST_BRANCH']]
          if len(matching)!=1: raise SystemExit(f'exactly one publisher run required, got {len(matching)}')
          pub=matching[0]
          if int(pub.get('run_attempt') or 0)!=1: raise SystemExit('publisher was rerun')
          pub_id=int(pub.get('id') or 0)
          for _ in range(90):
              row=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{pub_id}'],text=True))
              if row.get('status')=='completed':
                  if row.get('conclusion')!='success': raise SystemExit(f'publisher terminal non-success: {row.get("conclusion")}')
                  break
              time.sleep(2)
          else: raise SystemExit('publisher did not complete success before opening')
          arts_pages=json.loads(subprocess.check_output(['gh','api','--paginate','--slurp',f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{pub_id}/artifacts?per_page=100'],text=True))
          rows=[a for p in arts_pages for a in p.get('artifacts',[])]
          good=[a for a in rows if a.get('name')=='afc2-r8-timeout-recovery-v1-combined-opening-publisher-run-32503223236' and not a.get('expired',False)]
          if len(good)!=1: raise SystemExit('exact publisher evidence artifact required once')
          Path('opening-publisher-artifact.json').write_text(json.dumps(good[0],indent=2,sort_keys=True)+'\n')
          PY
      - name: Download and validate exact acquisition metadata without opening case channels
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p combined-inputs/recovery-acquisition
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9454797882/zip" > combined-inputs/recovery-acquisition.zip
          unzip -q combined-inputs/recovery-acquisition.zip -d combined-inputs/recovery-acquisition
          test -f combined-inputs/recovery-acquisition/acquisition.json
          python - <<'PY'
          import json
          a=json.load(open('combined-inputs/recovery-acquisition/acquisition.json'))
          if a.get('status')!='COMPLETE_EXACT_8_FRESH_REPLACEMENT_CASE_ARTIFACT_UNIVERSE': raise SystemExit('acquisition status drift')
          if a.get('runId')!=32503223236 or a.get('workflowRunAttempt')!=1 or a.get('scientificOrdinal')!=35: raise SystemExit('acquisition identity drift')
          if a.get('caseArtifactCount')!=8 or a.get('retainedSourceCaseCountForFutureCombinedAnalysis')!=568 or a.get('effectiveCombinedCaseCount')!=576: raise SystemExit('acquisition cardinality drift')
          if a.get('scientificChannelsInterpreted') is not False: raise SystemExit('channels were interpreted before authorized opening')
          PY
      - name: Checkout exact frozen combined-analysis repository snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 19bd924ab86ed0744b3fd77ce5d6756039674d5f
          path: frozen-analysis
          fetch-depth: 0
          persist-credentials: false
      - name: Prove frozen analysis bytes before downloading case outputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C frozen-analysis rev-parse HEAD)" = 19bd924ab86ed0744b3fd77ce5d6756039674d5f
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('frozen-analysis')
          expected={
            'experiments/aerosol-family-challenge-v2-r8-timeout-recovery-v1/combined-analysis.review.json':'7a570e2f90077135ce884b92bde245e6586d3d332cdcc134d9cb735a93bbecaf',
            'experiments/aerosol-family-challenge-v2-r8-timeout-recovery-v1/combined_aggregate.py':'617d9f2110a43727ea62421df0f4672d2607aae8fcab0e024fc2df785fd4b39a',
            '.github/workflows/aerosol-family-v2-r8-timeout-recovery-v1-combined-analysis.yml':'92f4a6d6ebcf8a96893c35f5a1043296e8414e5f4bcfffef5ac7546fa21190ba',
            'tests/test_aerosol_family_r8_timeout_recovery_combined_analysis_v1.py':'6a22d2aca10eab9323a21ecb8345d15dbcd5762bcef5025ade42095184363f3d',
          }
          for rel,want in expected.items():
              got=hashlib.sha256((root/rel).read_bytes()).hexdigest()
              if got!=want: raise SystemExit(f'frozen analysis binding drift {rel}: {got} != {want}')
          review=json.loads((root/'experiments/aerosol-family-challenge-v2-r8-timeout-recovery-v1/combined-analysis.review.json').read_text())
          if review.get('scientificResultOpeningAuthorizedAtFreeze') is not False: raise SystemExit('original freeze unexpectedly authorized early opening')
          if (review.get('scientificResultOpeningTransition') or {}).get('requiredAcquisitionStatus')!='COMPLETE_EXACT_8_FRESH_REPLACEMENT_CASE_ARTIFACT_UNIVERSE': raise SystemExit('original opening condition drift')
          PY
      - name: Download exact source and recovery case artifacts only after opening gate passes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p combined-inputs/source-downloads combined-inputs/recovery-downloads
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/32447101887" > combined-inputs/source-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/32503223236" > combined-inputs/recovery-run.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/32447101887/artifacts?per_page=100" > combined-inputs/source-artifact-pages.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/32503223236/artifacts?per_page=100" > combined-inputs/recovery-artifact-pages.json
          gh run download 32447101887 --repo "$GITHUB_REPOSITORY" --pattern 'aerosol-family-v2-r8-case-*' --dir combined-inputs/source-downloads
          gh run download 32503223236 --repo "$GITHUB_REPOSITORY" --pattern 'afc2-r8-timeout-recovery-v1-case-*' --dir combined-inputs/recovery-downloads
      - name: Execute exact frozen 568 plus 8 combined analysis with no solver runtime
        shell: bash
        run: |
          set -euo pipefail
          python frozen-analysis/experiments/aerosol-family-challenge-v2-r8-timeout-recovery-v1/combined_aggregate.py \
            --repository-root frozen-analysis \
            --source-run combined-inputs/source-run.json \
            --recovery-run combined-inputs/recovery-run.json \
            --recovery-acquisition combined-inputs/recovery-acquisition/acquisition.json \
            --source-metadata combined-inputs/source-artifact-pages.json \
            --recovery-metadata combined-inputs/recovery-artifact-pages.json \
            --source-downloads combined-inputs/source-downloads \
            --recovery-downloads combined-inputs/recovery-downloads \
            --output-dir combined-output
          python - <<'PY'
          import json
          i=json.load(open('combined-output/combined-index.json'))
          expected={'status':'COMPLETED_FROZEN_COMBINED_ANALYSIS','sourceRunId':32447101887,'recoveryRunId':32503223236,'effectiveCaseCount':576,'comparisonGroupCount':72,'analysisCellCount':24,'sourceAffectedGroupArtifactsReused':False,'scientificSolverExecuted':False}
          for k,v in expected.items():
              if i.get(k)!=v: raise SystemExit(f'combined terminal gate drift {k}: {i.get(k)} != {v}')
          PY
      - name: Persist immutable recovered-trigger combined analysis artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: afc2-r8-timeout-recovery-v1-combined-analysis-trigger-recovery
          path: |
            combined-output/combined-index.json
            combined-output/effective-manifest.json
            combined-output/effective-freeze.json
            combined-output/effective-artifact-metadata.json
            combined-output/acquisition.json
            combined-output/analysis.json
            combined-output/spectral-analysis.json
            combined-inputs/source-run.json
            combined-inputs/recovery-run.json
            combined-inputs/recovery-acquisition/acquisition.json
            opening-request.json
            opening-publisher-artifact.json
          if-no-files-found: error
          compression-level: 0
