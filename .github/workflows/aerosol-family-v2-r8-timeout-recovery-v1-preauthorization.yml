name: AFC2 R8 timeout recovery v1 preauthorization

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/aerosol-family-v2-r8-timeout-recovery-v1-preauthorization.yml
      - .github/workflows/aerosol-family-v2-r8-timeout-recovery-v1-authorization-review.yml
      - .github/workflows/aerosol-family-v2-r8-timeout-recovery-v1-execution.yml
      - experiments/aerosol-family-challenge-v2-r8-timeout-recovery-v1/**
      - evidence/aerosol-family-challenge-v2-r8-timeout-recovery-v1/**
      - tests/test_aerosol_family_r8_timeout_recovery_activation_v1.py

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: write

concurrency:
  group: afc2-r8-timeout-recovery-v1-preauthorization-${{ github.sha }}
  cancel-in-progress: false

jobs:
  preauthorization:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - name: Prove exact attempt-1 main and zero scientific runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/aerosol-family-v2-r8-timeout-recovery-v1-preauthorization.yml').read_text()
          forbidden=('setup-'+'micromamba','rubin-'+'libradtran','command -v '+'uvspec','--allow-'+'execution','workflow_'+'dispatch:','repository_'+'dispatch:')
          found=[x for x in forbidden if x in text]
          if found: raise SystemExit(f'preauthorization exposed scientific runtime/dispatch: {found}')
          PY
      - name: Verify deterministic recovery freeze against immutable source R8 manifest
        shell: bash
        run: |
          set -euo pipefail
          python experiments/aerosol-family-challenge-v2-r8-timeout-recovery-v1/freeze.py --repository-root . --verify
      - name: Stable repository-global seed and identity audit
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p preauthorization-evidence
          python experiments/aerosol-family-challenge-v2-r8-timeout-recovery-v1/execution-candidate/seed_audit.py \
            --repository "$GITHUB_REPOSITORY" --repository-root . \
            --expected-branch main --expected-head "$GITHUB_SHA" \
            --current-run-id "$GITHUB_RUN_ID" \
            --output preauthorization-evidence/seed-and-identity-audit.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          a=json.loads(Path('preauthorization-evidence/seed-and-identity-audit.json').read_text())
          if a.get('status')!='PASS_STABLE_DOUBLE_ENUMERATION_NO_EXTERNAL_SEED_COLLISION': raise SystemExit('seed audit failed')
          if a.get('auditedHead')!=os.environ['GITHUB_SHA'] or a.get('auditedBranch')!='main': raise SystemExit('preauthorization audit not exact-main')
          if int(a.get('nextGlobalOrdinal') or 0) <= 34: raise SystemExit('fresh global ordinal was not derived above consumed ordinal 34')
          report={
            'schemaVersion':1,
            'stageId':'aerosol-family-challenge-v2-r8-timeout-recovery-v1-preauthorization',
            'status':'PREAUTHORIZATION_PASS_NOT_ALLOCATED',
            'exactMainSha':os.environ['GITHUB_SHA'],
            'runId':int(os.environ['GITHUB_RUN_ID']),
            'runAttempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
            'globalOrdinalMaxObserved':a['globalOrdinalMaxObservedExcludingCurrentCandidate'],
            'nextAvailableScientificOrdinal':a['nextGlobalOrdinal'],
            'stableCollisionContextSha256':a['stableCollisionContextSha256'],
            'authorizationCreated':False,
            'scientificOrdinalAllocated':False,
            'dispatchCreated':False,
            'scientificRuntimeSetupPerformed':False,
            'scientificExecutionPerformed':False,
            'solverExecutionPerformed':False,
          }
          Path('preauthorization-evidence/preauthorization.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'status':report['status'],'exactMainSha':report['exactMainSha'],'nextAvailableScientificOrdinal':report['nextAvailableScientificOrdinal']},sort_keys=True))
          PY
      - name: Persist zero-runtime preauthorization evidence
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: afc2-r8-timeout-recovery-v1-preauthorization
          path: preauthorization-evidence/
          if-no-files-found: error
          compression-level: 0
      - name: Publish non-allocation checkpoint to Issue 60
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          r=json.loads(Path('preauthorization-evidence/preauthorization.json').read_text())
          if r['status']!='PREAUTHORIZATION_PASS_NOT_ALLOCATED': raise SystemExit('refuse checkpoint')
          body='\n'.join([
            'AFC2-R8-TIMEOUT-RECOVERY-V1-PREAUTHORIZATION-RUN',
            f'exact_main={r["exactMainSha"]}',f'run={r["runId"]}',f'attempt={r["runAttempt"]}',
            f'status={r["status"]}',f'global_ordinal_max_observed={r["globalOrdinalMaxObserved"]}',
            f'next_if_separately_allocated={r["nextAvailableScientificOrdinal"]}',
            f'artifact_id={os.environ["ARTIFACT_ID"]}',f'artifact_digest=sha256:{os.environ["ARTIFACT_DIGEST"]}',
            'authorization_created=false','scientific_identity_allocated=false','dispatch_created=false','scientific_runtime=false','solver_execution=false'
          ])
          req=urllib.request.Request(f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/issues/60/comments',data=json.dumps({'body':body}).encode(),headers={'Authorization':f'Bearer {os.environ["GITHUB_TOKEN"]}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=90) as response: row=json.load(response)
          print('issue60_comment_id='+str(row['id']))
          PY
