name: aerosol-family-v2-r8-transport-builder-diagnostic-1
on:
  push:
    branches:
      - status/aerosol-family-v2-r8-transport-builder-diagnostic-1
    paths:
      - .github/workflows/aerosol-family-v2-r8-transport-builder-diagnostic-1.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decode prior builder payload around failure anchor
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin status/aerosol-family-v2-r8-transport-builder
          git show origin/status/aerosol-family-v2-r8-transport-builder:.github/workflows/aerosol-family-v2-r8-transport-builder.yml > /tmp/builder.yml
          python3 - <<'PY'
          import base64, gzip, re
          from pathlib import Path
          text=Path('/tmp/builder.yml').read_text()
          m=re.search(r'^\s*BUILDER_PAYLOAD:\s*(\S+)\s*$', text, re.M)
          if not m:
              raise SystemExit('payload not found')
          payload=gzip.decompress(base64.b64decode(m.group(1))).decode()
          lines=payload.splitlines()
          hits=[i for i,l in enumerate(lines) if 'auth review paths anchor missing' in l]
          if len(hits)!=1:
              raise SystemExit(f'expected one failure marker, got {len(hits)}')
          i=hits[0]
          for j in range(max(0,i-24), min(len(lines),i+25)):
              print(f'{j+1:04d}: {lines[j]}')
          PY
