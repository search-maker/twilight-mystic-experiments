name: aerosol-family-v2-r8-transport-builder-diagnostic-2
on:
  push:
    branches:
      - status/aerosol-family-v2-r8-transport-builder-diagnostic-2
    paths:
      - .github/workflows/aerosol-family-v2-r8-transport-builder-diagnostic-2.yml
permissions:
  contents: read
  issues: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decode and publish prior builder failure context
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          git fetch origin status/aerosol-family-v2-r8-transport-builder
          git show origin/status/aerosol-family-v2-r8-transport-builder:.github/workflows/aerosol-family-v2-r8-transport-builder.yml > /tmp/builder.yml
          python3 - <<'PY'
          import base64, gzip, json, os, re, urllib.request
          from pathlib import Path
          text=Path('/tmp/builder.yml').read_text()
          m=re.search(r'^\s*BUILDER_PAYLOAD:\s*(\S+)\s*$', text, re.M)
          if not m: raise SystemExit('payload not found')
          payload=gzip.decompress(base64.b64decode(m.group(1))).decode()
          lines=payload.splitlines()
          hits=[i for i,l in enumerate(lines) if 'auth review paths anchor missing' in l]
          if len(hits)!=1: raise SystemExit(f'expected one failure marker, got {len(hits)}')
          i=hits[0]
          snippet='\n'.join(f'{j+1:04d}: {lines[j]}' for j in range(max(0,i-30), min(len(lines),i+31)))
          body='AFC2-R8-TRANSPORT-BUILDER-DIAGNOSTIC-2\n```text\n'+snippet+'\n```\nauthorization=false\nscientific_runtime=false\nsolver_execution=false\n'
          req=urllib.request.Request(
              'https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/issues/60/comments',
              data=json.dumps({'body':body}).encode(),
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},
              method='POST')
          with urllib.request.urlopen(req) as r:
              if r.status != 201: raise SystemExit(f'comment post failed: {r.status}')
          print(snippet)
          PY
