# REVIEW-ONLY ONE-SHOT BOOTSTRAP.
# The merge that first installs this file on main is the only normal trigger.
# It can dispatch only the existing aerosol-family v2 review-freeze workflow.
# It cannot modify repository contents, authorize scientific execution, or invoke a solver.
name: aerosol-family-v2-review-freeze-bootstrap

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/aerosol-family-v2-review-freeze-bootstrap.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: aerosol-family-v2-review-freeze-bootstrap
  cancel-in-progress: false

jobs:
  dispatch-review-freeze-on-install:
    if: github.ref_name == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Bind exact main head and dispatch only review-freeze
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          REPOSITORY = os.environ['GITHUB_REPOSITORY']
          TOKEN = os.environ['GH_TOKEN']
          EVENT_SHA = os.environ['GITHUB_SHA']
          DEFAULT_BRANCH = 'main'
          TARGET_WORKFLOW = 'aerosol-family-v2-seed-proof-review.yml'
          TARGET_ARTIFACT = 'aerosol-family-v2-r6-freeze-proof'

          headers = {
              'Authorization': f'Bearer {TOKEN}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'aerosol-family-v2-review-freeze-bootstrap',
          }

          def request(path, *, method='GET', payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(
                  'https://api.github.com' + path,
                  data=data,
                  method=method,
                  headers=headers,
              )
              try:
                  with urllib.request.urlopen(req, timeout=90) as response:
                      raw = response.read()
                      return None if not raw else json.loads(raw)
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode('utf-8', errors='replace')
                  raise RuntimeError(f'GitHub API {exc.code} for {method} {path}: {detail}') from exc

          def pages(path, key):
              rows = []
              page = 1
              while True:
                  sep = '&' if '?' in path else '?'
                  data = request(f'{path}{sep}per_page=100&page={page}')
                  batch = data.get(key, [])
                  if not isinstance(batch, list):
                      raise RuntimeError(f'GitHub response missing {key} list')
                  rows.extend(batch)
                  if len(batch) < 100:
                      return rows
                  page += 1

          repo = request(f'/repos/{REPOSITORY}')
          if repo.get('default_branch') != DEFAULT_BRANCH:
              raise SystemExit('refuse: repository default branch is not main')

          branch = request(f'/repos/{REPOSITORY}/branches/{DEFAULT_BRANCH}')
          live_head = str((branch.get('commit') or {}).get('sha') or '')
          if live_head != EVENT_SHA:
              raise SystemExit(f'refuse: main moved before bootstrap dispatch: event={EVENT_SHA} live={live_head}')

          artifacts = pages(f'/repos/{REPOSITORY}/actions/artifacts', 'artifacts')
          if any(str(row.get('name') or '') == TARGET_ARTIFACT for row in artifacts):
              raise SystemExit('refuse: review-freeze proof artifact already exists')

          workflow_ref = urllib.parse.quote(TARGET_WORKFLOW, safe='')
          runs = pages(
              f'/repos/{REPOSITORY}/actions/workflows/{workflow_ref}/runs',
              'workflow_runs',
          )
          if any(str(row.get('status') or '') != 'completed' for row in runs):
              raise SystemExit('refuse: review-freeze workflow already has an active run')
          if any(str(row.get('conclusion') or '') == 'success' for row in runs):
              raise SystemExit('refuse: successful review-freeze already exists')

          request(
              f'/repos/{REPOSITORY}/actions/workflows/{workflow_ref}/dispatches',
              method='POST',
              payload={'ref': DEFAULT_BRANCH},
          )
          print(f'dispatched {TARGET_WORKFLOW} on exact main head {EVENT_SHA}')
          print('scientific execution authorized: false')
          print('solver dispatch capability: absent')
          PY
