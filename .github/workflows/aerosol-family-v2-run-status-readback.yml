name: AFC2 status readback

on:
  push:
    branches:
      - "status/aerosol-family-v2-run-readback-1"

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read exact execution run without mutation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/aerosol-family-v2-execution.yml/runs?branch=dispatch%2Faerosol-family-challenge-v2-ordinal-29&event=push&per_page=20" > runs.json
          python - <<'PY' > comment.txt
          import json
          target='f89d15063a26caaa7412cfc689f6647bc0306774'
          rows=json.load(open('runs.json')).get('workflow_runs',[])
          rows=[r for r in rows if r.get('head_sha')==target and r.get('head_branch')=='dispatch/aerosol-family-challenge-v2-ordinal-29' and r.get('event')=='push']
          if len(rows)!=1:
              print(f'AFC2-RUN-READBACK count={len(rows)}')
          else:
              r=rows[0]
              print(f"AFC2-RUN-READBACK id={r.get('id')} status={r.get('status')} conclusion={r.get('conclusion')} attempt={r.get('run_attempt')} head={r.get('head_sha')}")
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/60/comments" -f body="$(cat comment.txt)"
