name: OPAC staged-runtime syntax resolver audit v1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/aerosol-opac-syntax-resolver-v1.yml
      - experiments/aerosol-full-phase-function-sensitivity-v1/OPAC_SYNTAX_RESOLVER_REVIEW.md

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOURCE_URL: https://www.libradtran.org/lib/exe/fetch.php?media=download%3Aoptprop_v2.1.tar.gz
      EXPECTED_ARCHIVE_SHA256: 11daa1f1f4be0fd4ddf7e881ec2005498049674a1540d37b4b1e8f5e16052c7e
      EXPECTED_ARCHIVE_SIZE: '743391266'
      EXPECTED_BASE_DATA_SHA256: ad30b49177e9c84e46497d69faf0c75e466996b0d0003f1de210289ae9f847d7
      EXPECTED_STAGED_DATA_SHA256: 5d8bbf8e6b91ec3d405dee36f21a94afbb6e5ec6cd67da2dd5dd541738199d80
      EXPECTED_UVSPEC_SHA256: 2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3
      OVERLAY_MAIN_SHA: ea60021574b60363b7e9c0089a95b71749adc0a8
      OVERLAY_RUN_ID: '32656136706'
      OVERLAY_ARTIFACT_ID: '9497493535'
      OVERLAY_REPORT_SHA256: 54eafae989d3b7ad369fa8cf194c69efde203b54ebed5b248cf9e80da9deec7a
      PROCESS_RUNNER_BLOB_SHA1: e23d724e99c1cf9b0b862f8ab48356bd3d9bc56c
    steps:
      - name: Checkout exact main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enforce one-use syntax-only identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Prove exact prior overlay checkpoint exists once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/60/comments?per_page=100" > overlay-ledger-comment-pages.json
          python - <<'PY'
          import json, os
          pages=json.load(open('overlay-ledger-comment-pages.json'))
          rows=[row for page in pages for row in page]
          needle=(
              'AEROSOL_OPTPROP_EXACT_RUNTIME_OVERLAY_V1 '
              'status=PASS_EXACT_RUNTIME_OVERLAY_AND_MIXTURE_DEPENDENCIES '
              f'main={os.environ["OVERLAY_MAIN_SHA"]} '
              f'run={os.environ["OVERLAY_RUN_ID"]} attempt=1 '
              f'artifact_id={os.environ["OVERLAY_ARTIFACT_ID"]} '
              'source_v2_run=32655624673 source_v2_artifact=9497367203 '
              f'archive_sha256={os.environ["EXPECTED_ARCHIVE_SHA256"]} '
              f'base_data_sha256={os.environ["EXPECTED_BASE_DATA_SHA256"]} '
              f'post_data_sha256={os.environ["EXPECTED_STAGED_DATA_SHA256"]} '
              'added_members=28 referenced_species=13 '
              f'report_sha256={os.environ["OVERLAY_REPORT_SHA256"]} '
              'base_runtime_mutated=false uvspec_invoked=false syntax_check=false scientific_solver=false results_opened=false'
          )
          matches=[r for r in rows if (r.get('body') or '') == needle]
          if len(matches) != 1:
              raise SystemExit(f'expected one exact overlay checkpoint, got {len(matches)}')
          print('prior overlay checkpoint exact and unique')
          PY

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: aerosol-opac-syntax-resolver-v1
          create-args: -c conda-forge python=3.12.4 rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Bind exact base runtime and process-group runner without invoking uvspec
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          mkdir -p syntax-audit
          python experiments/mystic-batch-v1/runtime_probe.py \
            --uvspec "$(command -v uvspec)" \
            --data-dir "$CONDA_PREFIX/share/libRadtran/data" \
            --atmosphere "$CONDA_PREFIX/share/libRadtran/data/atmmod/afglus.dat" \
            --runtime-lock experiments/mystic-batch-v1/runtime-lock.micromamba.json \
            --skip-help \
            --output syntax-audit/base-runtime-report.json
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          x=json.load(open('syntax-audit/base-runtime-report.json'))
          if x.get('scientificSolverExecuted') is not False or x.get('syntaxCheckExecuted') is not False:
              raise SystemExit('base runtime identity crossed no-execution boundary')
          if x.get('libRadtranDataTreeSha256') != os.environ['EXPECTED_BASE_DATA_SHA256']:
              raise SystemExit('base data-tree drift')
          if x.get('uvspecSha256') != os.environ['EXPECTED_UVSPEC_SHA256']:
              raise SystemExit('uvspec byte drift')
          p=Path('experiments/aerosol-family-challenge-v2-r8-timeout-recovery-v1/execution-candidate/process_runner.py')
          data=p.read_bytes()
          blob=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          if blob != os.environ['PROCESS_RUNNER_BLOB_SHA1']:
              raise SystemExit('process runner byte drift')
          PY

      - name: Reconstruct exact staged augmented data tree
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/syntax-runtime/share/libRadtran"
          cp -a "$CONDA_PREFIX/share/libRadtran/data" "$GITHUB_WORKSPACE/syntax-runtime/share/libRadtran/data"
          curl \
            --location \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 10 \
            --connect-timeout 30 \
            --max-time 2700 \
            --user-agent 'twilight-mystic-experiments opac-syntax-resolver/1.0' \
            --dump-header syntax-audit/http-headers.txt \
            --write-out '%{url_effective}\n%{http_code}\n%{size_download}\n' \
            --output syntax-audit/optprop_v2.1.tar.gz \
            "$SOURCE_URL" > syntax-audit/curl-summary.txt
          python - <<'PY'
          import hashlib, os, tarfile
          from pathlib import Path, PurePosixPath
          archive=Path('syntax-audit/optprop_v2.1.tar.gz')
          lr_root=Path(os.environ['GITHUB_WORKSPACE'])/'syntax-runtime/share/libRadtran'
          def sha(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for b in iter(lambda:f.read(4*1024*1024),b''): h.update(b)
              return h.hexdigest()
          if archive.stat().st_size != int(os.environ['EXPECTED_ARCHIVE_SIZE']): raise SystemExit('archive size drift')
          if sha(archive) != os.environ['EXPECTED_ARCHIVE_SHA256']: raise SystemExit('archive SHA drift')
          summary=Path('syntax-audit/curl-summary.txt').read_text().splitlines()
          if len(summary)<3 or summary[-2] != '200' or int(float(summary[-1])) != archive.stat().st_size:
              raise SystemExit('archive HTTP/byte-count mismatch')
          with tarfile.open(archive,'r:gz') as tf:
              members=tf.getmembers()
              if len(members)!=28: raise SystemExit(f'archive member-count drift: {len(members)}')
              for m in members:
                  p=PurePosixPath(m.name)
                  if not m.isfile() or p.is_absolute() or '..' in p.parts or not p.parts or p.parts[0] != 'data':
                      raise SystemExit(f'unsafe archive member: {m.name}')
                  if lr_root.joinpath(*p.parts).exists(): raise SystemExit(f'overlay collision: {m.name}')
              for m in members:
                  p=PurePosixPath(m.name); dest=lr_root.joinpath(*p.parts); dest.parent.mkdir(parents=True,exist_ok=True)
                  src=tf.extractfile(m)
                  if src is None: raise SystemExit(f'cannot stream {m.name}')
                  total=0
                  with dest.open('xb') as out:
                      while True:
                          block=src.read(1024*1024)
                          if not block: break
                          out.write(block); total += len(block)
                  if total != m.size: raise SystemExit(f'size mismatch {m.name}')
          PY
          python experiments/mystic-batch-v1/runtime_probe.py \
            --uvspec "$(command -v uvspec)" \
            --data-dir "$GITHUB_WORKSPACE/syntax-runtime/share/libRadtran/data" \
            --atmosphere "$GITHUB_WORKSPACE/syntax-runtime/share/libRadtran/data/atmmod/afglus.dat" \
            --runtime-lock experiments/mystic-batch-v1/runtime-lock.micromamba.json \
            --skip-help \
            --output syntax-audit/staged-runtime-report.json
          python - <<'PY'
          import json,os
          x=json.load(open('syntax-audit/staged-runtime-report.json'))
          if x.get('scientificSolverExecuted') is not False or x.get('syntaxCheckExecuted') is not False:
              raise SystemExit('staged identity probe crossed no-execution boundary')
          if x.get('libRadtranDataTreeSha256') != os.environ['EXPECTED_STAGED_DATA_SHA256']:
              raise SystemExit('staged augmented data-tree drift')
          if x.get('uvspecSha256') != os.environ['EXPECTED_UVSPEC_SHA256']:
              raise SystemExit('uvspec byte drift after staging')
          PY
          rm syntax-audit/optprop_v2.1.tar.gz
          test ! -e syntax-audit/optprop_v2.1.tar.gz

      - name: Execute exactly ten process-isolated uvspec syntax checks
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, importlib.util, json, os, shutil
          from pathlib import Path

          mixtures=[
              'continental_clean','continental_average','continental_polluted','urban',
              'maritime_clean','maritime_polluted','maritime_tropical','desert','antarctic','desert_spheroids',
          ]
          root=Path(os.environ['GITHUB_WORKSPACE'])
          data=root/'syntax-runtime/share/libRadtran/data'
          uvspec=Path(shutil.which('uvspec') or '')
          if not uvspec.is_file(): raise SystemExit('uvspec missing')
          if hashlib.sha256(uvspec.read_bytes()).hexdigest()!=os.environ['EXPECTED_UVSPEC_SHA256']:
              raise SystemExit('uvspec SHA drift')
          runner_path=root/'experiments/aerosol-family-challenge-v2-r8-timeout-recovery-v1/execution-candidate/process_runner.py'
          spec=importlib.util.spec_from_file_location('opac_syntax_process_runner',runner_path)
          if spec is None or spec.loader is None: raise SystemExit('cannot import process runner')
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)

          out_root=root/'syntax-audit/syntax-cases'; out_root.mkdir(parents=True,exist_ok=False)
          rows=[]
          for mixture in mixtures:
              case_dir=out_root/mixture; case_dir.mkdir()
              text='\n'.join([
                  f'data_files_path {data.as_posix()}/',
                  f'atmosphere_file {(data/"atmmod/afglus.dat").as_posix()}',
                  'source solar',
                  'wavelength 380 780',
                  'albedo 0.15',
                  'sza 96',
                  'aerosol_default',
                  'aerosol_species_library OPAC',
                  f'aerosol_species_file {mixture}',
                  'aerosol_set_tau_at_wvl 550 0.10',
                  'rte_solver disort',
                  'number_of_streams 8',
                  'output_user lambda edir edn eup',
                  'quiet',
                  '',
              ])
              if text.count('aerosol_species_library OPAC')!=1 or text.count(f'aerosol_species_file {mixture}')!=1 or text.count('aerosol_set_tau_at_wvl 550 0.10')!=1:
                  raise SystemExit(f'input surface drift: {mixture}')
              input_path=case_dir/'case.inp'; input_path.write_text(text,encoding='utf-8',newline='\n')
              before=sorted(p.name for p in case_dir.iterdir())
              if before != ['case.inp']: raise SystemExit(f'pre-syntax directory drift: {mixture}: {before}')
              result=mod.run_process_group([str(uvspec),'-c'],text,case_dir,120,sigterm_grace_seconds=5)
              produced=sorted(p.name for p in case_dir.iterdir() if p.name!='case.inp')
              (case_dir/'syntax-stdout.txt').write_text(str(result.get('stdout') or ''),encoding='utf-8')
              (case_dir/'syntax-stderr.txt').write_text(str(result.get('stderr') or ''),encoding='utf-8')
              if result.get('processGroupIsolated') is not True: raise SystemExit(f'process group not isolated: {mixture}')
              if result.get('timedOut') is not False: raise SystemExit(f'syntax timeout: {mixture}')
              if result.get('exitCode') != 0: raise SystemExit(f'syntax failure: {mixture}: {result.get("exitCode")}')
              if produced: raise SystemExit(f'uvspec -c unexpectedly created files for {mixture}: {produced}')
              rows.append({
                  'mixture':mixture,
                  'command':[str(uvspec),'-c'],
                  'inputSha256':hashlib.sha256(text.encode()).hexdigest(),
                  'stdoutSha256':hashlib.sha256(str(result.get('stdout') or '').encode()).hexdigest(),
                  'stderrSha256':hashlib.sha256(str(result.get('stderr') or '').encode()).hexdigest(),
                  'exitCode':result.get('exitCode'),
                  'timedOut':result.get('timedOut'),
                  'processGroupIsolated':result.get('processGroupIsolated'),
                  'unexpectedProducedFiles':produced,
              })
          if len(rows)!=10 or [r['mixture'] for r in rows] != mixtures:
              raise SystemExit('syntax result cardinality/order drift')
          Path('syntax-audit/syntax-results.json').write_text(json.dumps(rows,indent=2,sort_keys=True)+'\n')
          PY

      - name: Build immutable syntax-only audit report
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          base=json.load(open('syntax-audit/base-runtime-report.json'))
          staged=json.load(open('syntax-audit/staged-runtime-report.json'))
          rows=json.load(open('syntax-audit/syntax-results.json'))
          if len(rows)!=10 or any(r['exitCode']!=0 or r['timedOut'] is not False or r['processGroupIsolated'] is not True or r['unexpectedProducedFiles'] for r in rows):
              raise SystemExit('syntax results fail closed')
          report={
              'schemaVersion':1,
              'stageId':'aerosol-opac-syntax-resolver-v1',
              'status':'PASS_ALL_10_DOCUMENTED_OPAC_MIXTURES_SYNTAX_RESOLVED',
              'repository':os.environ.get('GITHUB_REPOSITORY'),
              'exactMainSha':os.environ.get('GITHUB_SHA'),
              'runId':int(os.environ.get('GITHUB_RUN_ID','0')),
              'runAttempt':int(os.environ.get('GITHUB_RUN_ATTEMPT','0')),
              'overlayBinding':{
                  'mainSha':os.environ['OVERLAY_MAIN_SHA'],
                  'runId':int(os.environ['OVERLAY_RUN_ID']),
                  'artifactId':int(os.environ['OVERLAY_ARTIFACT_ID']),
                  'reportSha256':os.environ['OVERLAY_REPORT_SHA256'],
              },
              'archiveSha256':os.environ['EXPECTED_ARCHIVE_SHA256'],
              'baseDataTreeSha256':base['libRadtranDataTreeSha256'],
              'stagedDataTreeSha256':staged['libRadtranDataTreeSha256'],
              'uvspecSha256':staged['uvspecSha256'],
              'mixtureCount':10,
              'mixtures':[r['mixture'] for r in rows],
              'syntaxCheckCount':10,
              'syntaxResults':rows,
              'uvspecInvoked':True,
              'uvspecInvocationMode':'syntax-check-only--c',
              'nonSyntaxUvspecInvocationCount':0,
              'syntaxCheckExecuted':True,
              'scientificSolverExecuted':False,
              'scientificRuntimeSetupPerformed':False,
              'scientificOrdinalAllocated':False,
              'seedDerived':False,
              'resultOpeningPerformed':False,
              'scientificStateSetFrozen':False,
          }
          raw=(json.dumps(report,indent=2,sort_keys=True)+'\n').encode()
          Path('syntax-audit/syntax-resolver-audit.json').write_bytes(raw)
          Path('syntax-audit/syntax-resolver-audit.sha256').write_text(hashlib.sha256(raw).hexdigest()+'  syntax-resolver-audit.json\n')
          print(json.dumps({
              'status':report['status'],
              'mixtureCount':report['mixtureCount'],
              'syntaxCheckCount':report['syntaxCheckCount'],
              'stagedDataTreeSha256':report['stagedDataTreeSha256'],
              'uvspecInvoked':True,
              'uvspecInvocationMode':'syntax-check-only--c',
              'scientificSolverExecuted':False,
          },indent=2))
          PY

      - name: Persist syntax-only resolver evidence
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aerosol-opac-syntax-resolver-v1
          path: |
            syntax-audit/http-headers.txt
            syntax-audit/curl-summary.txt
            syntax-audit/base-runtime-report.json
            syntax-audit/staged-runtime-report.json
            syntax-audit/syntax-results.json
            syntax-audit/syntax-resolver-audit.json
            syntax-audit/syntax-resolver-audit.sha256
            syntax-audit/syntax-cases/
          if-no-files-found: error
          compression-level: 0

      - name: Record syntax-only checkpoint in sole control ledger
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          set -euo pipefail
          REPORT_SHA="$(cut -d' ' -f1 syntax-audit/syntax-resolver-audit.sha256)"
          BODY="AEROSOL_OPAC_SYNTAX_RESOLVER_V1 status=PASS_ALL_10_DOCUMENTED_OPAC_MIXTURES_SYNTAX_RESOLVED main=${GITHUB_SHA} run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT} artifact_id=${ARTIFACT_ID} overlay_run=${OVERLAY_RUN_ID} overlay_artifact=${OVERLAY_ARTIFACT_ID} archive_sha256=${EXPECTED_ARCHIVE_SHA256} staged_data_sha256=${EXPECTED_STAGED_DATA_SHA256} syntax_checks=10 report_sha256=${REPORT_SHA} uvspec_invoked=true uvspec_mode=syntax-check-only--c non_syntax_uvspec=0 scientific_solver=false results_opened=false scientific_state_set_frozen=false"
          gh api "repos/${GITHUB_REPOSITORY}/issues/60/comments" -f body="$BODY" >/dev/null
