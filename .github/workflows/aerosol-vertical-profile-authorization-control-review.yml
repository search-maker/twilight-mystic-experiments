name: Aerosol vertical-profile v1 authorization control review

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/aerosol-vertical-profile-sensitivity-v1/execution_design.py'
      - 'experiments/aerosol-vertical-profile-sensitivity-v1/authorization_guard.py'
      - 'experiments/aerosol-vertical-profile-sensitivity-v1/build_authorization.py'
      - 'experiments/aerosol-vertical-profile-sensitivity-v1/preauthorization_surface.py'
      - 'tests/test_aerosol_vertical_profile_authorization_control_current_v1.py'
      - '.github/workflows/aerosol-vertical-profile-authorization-review.yml'
      - '.github/workflows/aerosol-vertical-profile-authorization-control-review.yml'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact review head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Require solver-free control environment
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(command -v uvspec || true)"
          test ! -e experiments/aerosol-vertical-profile-sensitivity-v1/authorization.json

      - name: Run current-main authorization-control tests
        shell: bash
        run: python -m unittest discover -s tests -p 'test_aerosol_vertical_profile_authorization_control_current_v1.py' -v

      - name: Re-run preauthorization control regression
        shell: bash
        run: python -m unittest discover -s tests -p 'test_aerosol_vertical_profile_preauthorization_gate.py' -v

      - name: Claim boundary
        run: |
          echo 'Authorization-control review only.'
          echo 'No seed allocation, no scientific ordinal, no authorization.json, no runtime setup, no uvspec/MYSTIC, no results.'
