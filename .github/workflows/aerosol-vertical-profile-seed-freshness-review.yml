name: Aerosol vertical-profile candidate seed freshness review

on:
  pull_request:
    branches: [main]
    types: [opened]
    paths:
      - 'experiments/aerosol-vertical-profile-sensitivity-v1/seed_ledger.py'
      - 'experiments/aerosol-vertical-profile-sensitivity-v1/tracked_tree_seed_scan.py'
      - 'experiments/aerosol-vertical-profile-sensitivity-v1/repository_global_seed_scan.py'
      - 'experiments/aerosol-vertical-profile-sensitivity-v1/build_seed_freshness_proof.py'
      - 'tests/test_aerosol_vertical_profile_seed_freshness_review.py'
      - '.github/workflows/aerosol-vertical-profile-seed-freshness-review.yml'

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: write

jobs:
  freshness:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Enforce one-shot review-only surface
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "pull_request"
          test "$GITHUB_EVENT_ACTION" = "opened"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$EXPECTED_BRANCH" = "review/aerosol-vertical-profile-sensitivity-v1-preauthorization"
          test -z "$(command -v uvspec || true)"
          mkdir -p preauthorization-evidence
          git ls-files -z > preauthorization-evidence/tracked-files.nul

      - name: Test deterministic candidate seed derivation and refusal boundary
        shell: bash
        run: python -m unittest discover -s tests -p 'test_aerosol_vertical_profile_seed_freshness_review.py' -v

      - name: Build artifact-only candidate ledger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util,json,sys
          from pathlib import Path
          path=Path('experiments/aerosol-vertical-profile-sensitivity-v1/seed_ledger.py')
          spec=importlib.util.spec_from_file_location('vertical_profile_seed_ledger_workflow',path)
          if spec is None or spec.loader is None: raise SystemExit('cannot import seed ledger')
          mod=importlib.util.module_from_spec(spec); sys.modules[spec.name]=mod; spec.loader.exec_module(mod)
          ledger=mod.validate_ledger()
          if ledger['candidateSeedCount'] != 72 or ledger['trackedCandidateSeedLedger'] is not False:
              raise SystemExit('candidate ledger boundary drift')
          Path('preauthorization-evidence/candidate-seed-ledger.json').write_text(json.dumps(ledger,indent=2,sort_keys=True)+'\n')
          Path('preauthorization-evidence/empty-self-ledger-policy.json').write_text(json.dumps({
              'schemaVersion':2,
              'requiredTrackedSelfLedgerPaths':[],
              'futureEvidenceSelfLedgerPaths':[],
          },indent=2,sort_keys=True)+'\n')
          PY

      - name: Scan exact tracked tree for external candidate seed literals
        shell: bash
        run: |
          set -euo pipefail
          python experiments/aerosol-vertical-profile-sensitivity-v1/tracked_tree_seed_scan.py \
            --repo-root . \
            --file-list preauthorization-evidence/tracked-files.nul \
            --candidate-seed-ledger preauthorization-evidence/candidate-seed-ledger.json \
            --allow-self-ledger-json preauthorization-evidence/empty-self-ledger-policy.json \
            --output preauthorization-evidence/tracked-seed-scan.json

      - name: Two-pass repository-global candidate seed freshness scan
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          python experiments/aerosol-vertical-profile-sensitivity-v1/repository_global_seed_scan.py \
            --repository "$GITHUB_REPOSITORY" \
            --issue-number 60 \
            --candidate-seed-ledger preauthorization-evidence/candidate-seed-ledger.json \
            --current-run-id "$GITHUB_RUN_ID" \
            --audit-mode review-freeze \
            --expected-branch-name "$EXPECTED_BRANCH" \
            --expected-repo-head "$EXPECTED_HEAD" \
            --output preauthorization-evidence/repository-global-seed-scan.json

      - name: Freeze candidate seed freshness proof
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python experiments/aerosol-vertical-profile-sensitivity-v1/build_seed_freshness_proof.py \
            --stage-dir experiments/aerosol-vertical-profile-sensitivity-v1 \
            --tracked-tree-report preauthorization-evidence/tracked-seed-scan.json \
            --repository-global-report preauthorization-evidence/repository-global-seed-scan.json \
            --expected-head "$EXPECTED_HEAD" \
            --output preauthorization-evidence/seed-freshness-proof.json
          python - <<'PY'
          import json
          p=json.load(open('preauthorization-evidence/seed-freshness-proof.json'))
          assert p['status']=='PASS_CANDIDATE_SEEDS_FRESH_REVIEW_ONLY_NOT_ALLOCATED'
          assert p['candidateSeedCount']==72
          assert p['trackedTreeExternalCollisionCount']==0
          assert p['repositoryGlobalCollisionCount']==0
          assert p['scientificOrdinalAllocated'] is False
          assert p['authorizationCreated'] is False
          assert p['candidateSeedsAppliedToCases'] is False
          assert p['solverExecutionAuthorized'] is False
          assert p['resultOpeningAuthorized'] is False
          assert p['authorizationTimeRecheckRequired'] is True
          PY

      - name: Upload candidate seed freshness proof
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: vertical-profile-v1-seed-freshness-review-proof
          path: preauthorization-evidence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish non-seed checkpoint to Issue 60
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,re,urllib.request
          from pathlib import Path
          p=json.loads(Path('preauthorization-evidence/seed-freshness-proof.json').read_text())
          artifact_id=os.environ.get('ARTIFACT_ID','').strip()
          digest=os.environ.get('ARTIFACT_DIGEST','').strip()
          if not artifact_id.isdigit() or re.fullmatch(r'[0-9a-f]{64}',digest) is None:
              raise SystemExit('artifact identity malformed')
          body='\n'.join([
              'AEROSOL-VERTICAL-PROFILE-V1-CANDIDATE-SEED-FRESHNESS-REVIEW',
              f'audited_head={p["auditedHead"]}',
              f'run={os.environ["GITHUB_RUN_ID"]}',
              'attempt=1',
              f'status={p["status"]}',
              f'candidate_seed_count={p["candidateSeedCount"]}',
              f'candidate_seed_canonical_sha256={p["candidateSeedCanonicalSha256"]}',
              f'candidate_rows_canonical_sha256={p["candidateRowsCanonicalSha256"]}',
              'tracked_seed_literals=false',
              'tracked_tree_collisions=0',
              'repository_global_collisions=0',
              f'artifact_id={artifact_id}',
              f'artifact_digest=sha256:{digest}',
              'scientific_ordinal_allocated=false',
              'authorization_created=false',
              'candidate_seeds_applied=false',
              'scientific_runtime=false',
              'solver_execution=false',
              'authorization_time_recheck_required=true',
          ])
          req=urllib.request.Request(
              f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/issues/60/comments',
              data=json.dumps({'body':body}).encode(),
              headers={
                  'Authorization':f'Bearer {os.environ["GITHUB_TOKEN"]}',
                  'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28',
                  'Content-Type':'application/json',
              },
              method='POST',
          )
          with urllib.request.urlopen(req,timeout=90) as response:
              row=json.load(response)
          if not int(row.get('id') or 0): raise SystemExit('Issue60 checkpoint failed')
          print(f'issue60_comment_id={row["id"]}')
          PY

      - name: Claim boundary
        run: |
          echo 'Candidate seed freshness review only.'
          echo 'Seeds remain artifact-only and unapplied; no scientific ordinal, no authorization, no uvspec/MYSTIC, no result opening.'
