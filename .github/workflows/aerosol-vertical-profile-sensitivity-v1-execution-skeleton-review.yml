name: Aerosol vertical-profile sensitivity v1 execution skeleton review

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/aerosol-vertical-profile-sensitivity-v1/execution_candidate.py'
      - 'tests/test_aerosol_vertical_profile_sensitivity_v1_execution_candidate.py'
      - '.github/workflows/aerosol-vertical-profile-sensitivity-v1-execution-skeleton-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Require zero scientific runtime
        shell: bash
        run: test -z "$(command -v uvspec || true)"
      - name: Test exact unseeded execution skeleton
        shell: bash
        run: python -m unittest discover -s tests -p 'test_aerosol_vertical_profile_sensitivity_v1_execution_candidate.py' -v
      - name: Freeze skeleton summary
        shell: bash
        run: |
          python experiments/aerosol-vertical-profile-sensitivity-v1/execution_candidate.py > execution-skeleton.json
          python - <<'PY'
          import json
          x=json.load(open('execution-skeleton.json'))
          assert x['caseCount'] == 360
          assert x['groupCount'] == 72
          assert x['seedCount'] == 0
          assert x['scientificOrdinal'] is None
          assert x['scientificExecutionAuthorized'] is False
          assert x['solverExecutionAuthorized'] is False
          assert x['resultOpeningAuthorized'] is False
          print(x['canonicalSkeletonSha256'])
          PY
      - name: Upload review skeleton
        uses: actions/upload-artifact@v4
        with:
          name: aerosol-vertical-profile-sensitivity-v1-execution-skeleton
          path: execution-skeleton.json
          retention-days: 14
      - name: Claim boundary
        run: |
          echo 'Review-only execution skeleton: 360 cases, 72 groups, zero seeds, zero ordinal.'
          echo 'No uvspec/MYSTIC, no rendering, no scientific authorization, no results.'
