name: Aerosol vertical-profile sensitivity v1 review

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/aerosol-vertical-profile-sensitivity-v1/**'
      - 'tests/test_aerosol_vertical_profile_sensitivity_v1_review.py'
      - '.github/workflows/aerosol-vertical-profile-sensitivity-v1-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Require solver-free review environment
        shell: bash
        run: test -z "$(command -v uvspec || true)"
      - name: Run deterministic preregistration tests
        shell: bash
        run: python -m unittest discover -s tests -p 'test_aerosol_vertical_profile_sensitivity_v1_review.py' -v
      - name: Assert review-only protocol boundary
        shell: bash
        run: |
          python - <<'PY'
          import json
          p=json.load(open('experiments/aerosol-vertical-profile-sensitivity-v1/protocol.review.json'))
          for key in ('scientificExecutionAuthorized','solverExecutionAuthorized','resultOpeningAuthorized','candidateSeedsAllocated','scientificOrdinalAllocated','productionAuthorized'):
              assert p[key] is False, key
          assert p['caseCardinality']['expectedCases'] == 360
          assert p['commonRandomNumbers']['candidateSeedsAllocatedInThisReview'] is False
          print('review-only boundary: PASS')
          PY
      - name: Claim boundary
        run: |
          echo 'Preregistration/profile-construction tests only.'
          echo 'No uvspec, no MYSTIC, no seeds, no scientific ordinal, no results opened, no production authorization.'
