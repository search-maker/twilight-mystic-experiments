name: Review AVPS v2 disabled control package v1

on:
  pull_request:
    paths:
      - review/aerosol-vertical-profile-sensitivity-v2-control-v1/**
      - review/aerosol-vertical-profile-sensitivity-v2-prereg/**
      - review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/seed_ledger.py
      - review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/tracked_tree_seed_scan.py
      - .github/workflows/aerosol-vertical-profile-sensitivity-v2-control-v1-review.yml

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BASE_MAIN: 99ade7798627e67921139697ba1a004fa8a304bb
      EXPECTED_BRANCH: review/aerosol-vertical-profile-sensitivity-v2-control-v1
      RENDERER_PR: '596'
      RENDERER_HEAD: 8adfd4fafa4c039394d12e6f6aff1795b750f4d2
      RENDERER_RUN: '33193123594'
      RENDERER_CONTRACT: '33193123597'
      RENDERER_ARTIFACT: '9694613680'
      RENDERER_DIGEST: sha256:5e6942d879326ffc2dc8805d7649086cae32ad2e16aeec19a62cd3b0a89e3e27
      PREREG_PR: '597'
      PREREG_HEAD: 2bba54c6e78ed99d169887eef51d0c88d812b6f1
      PREREG_RUN: '33193778176'
      PREREG_CONTRACT: '33193778174'
      PREREG_ARTIFACT: '9694863701'
      PREREG_DIGEST: sha256:7de79aa4d8d9b51ad8ca4b1bdaceedae7ee5df17b3dd79c43c21cdaf9ae9a171
      SEED_PR: '598'
      SEED_HEAD: 64e7d68bd876a99aa5af49d97bcb53718238b39b
      SEED_RUN: '33194319669'
      SEED_CONTRACT: '33194319698'
      SEED_ARTIFACT: '9695260362'
      SEED_DIGEST: sha256:fb4613d654121098c9d247d6ed8b0f0788b26a179b5ff103dc01ed7d50c9f0db
      PREAUTH_PR: '599'
      PREAUTH_HEAD: a4e4700babddf0924135f5cc6ec6bfd21d8c9ec2
      PREAUTH_RUN: '33203372878'
      PREAUTH_CONTRACT: '33203372798'
      PREAUTH_ARTIFACT: '9699064164'
      PREAUTH_DIGEST: sha256:b1125375bae24638375853d3724c1c96ba1572dc02e1619eff37d9fdca70b92e
      SEED_CANONICAL: 02f624d582e9b2caba6b920d65a5e8a8bc8fc1a2693623bc2f73abf5d3f706d2
      ROW_CANONICAL: 41f70d6a0381db6b569d3f4e17d74bb38b05cf212c2f2e432455a502f73dc670
      SKELETON_CANONICAL: a8d2d8f59aec01d82d8d98672152d00c11261660b0a69a59e2716c2edabd2b02
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Bind exact Draft review and predecessor evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$PR_BRANCH" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_MAIN"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > current-pr.json
          python - <<'PY'
          import json,os
          p=json.load(open('current-pr.json'))
          if p['state']!='open' or p['draft'] is not True or p['merged_at'] is not None: raise SystemExit('control PR must remain Draft/open/unmerged')
          if p['head']['sha']!=os.environ['PR_HEAD'] or p['head']['ref']!=os.environ['EXPECTED_BRANCH'] or p['base']['sha']!=os.environ['BASE_MAIN']: raise SystemExit('control PR identity drift')
          PY
          for prefix in RENDERER PREREG SEED PREAUTH; do
            eval pr=\$${prefix}_PR
            eval head=\$${prefix}_HEAD
            eval run=\$${prefix}_RUN
            eval contract=\$${prefix}_CONTRACT
            eval artifact=\$${prefix}_ARTIFACT
            eval digest=\$${prefix}_DIGEST
            gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" > "$prefix-pr.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" > "$prefix-run.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$contract" > "$prefix-contract.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" > "$prefix-artifacts.json"
            PREFIX="$prefix" WANT_HEAD="$head" WANT_RUN="$run" WANT_CONTRACT="$contract" WANT_ARTIFACT="$artifact" WANT_DIGEST="$digest" python - <<'PY'
          import json,os
          x=os.environ['PREFIX']
          p=json.load(open(f'{x}-pr.json')); r=json.load(open(f'{x}-run.json')); c=json.load(open(f'{x}-contract.json')); arts=json.load(open(f'{x}-artifacts.json'))['artifacts']
          if p['state']!='open' or p['draft'] is not True or p['merged_at'] is not None or p['head']['sha']!=os.environ['WANT_HEAD'] or p['base']['sha']!=os.environ['BASE_MAIN']: raise SystemExit(x+' PR drift')
          if r['id']!=int(os.environ['WANT_RUN']) or r['head_sha']!=os.environ['WANT_HEAD'] or r['run_attempt']!=1 or r['conclusion']!='success': raise SystemExit(x+' dedicated run drift')
          if c['id']!=int(os.environ['WANT_CONTRACT']) or c['head_sha']!=os.environ['WANT_HEAD'] or c['run_attempt']!=1 or c['conclusion']!='success': raise SystemExit(x+' contract drift')
          hit=[a for a in arts if a['id']==int(os.environ['WANT_ARTIFACT'])]
          if len(hit)!=1 or hit[0].get('digest')!=os.environ['WANT_DIGEST'] or hit[0].get('expired'): raise SystemExit(x+' artifact drift')
          PY
          done

      - name: Prove exact vendored/reused byte bindings
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-prereg/protocol.review.json)" = d790fb3fa2d214d1f430f4417b17212a8e5038a8
          test "$(git rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-prereg/build_skeleton.py)" = b4a4ab6917ad28f08d4980194f7b68f3961d5d59
          test "$(git rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/seed_ledger.py)" = c757507b05074340507df1ca6e76d35b44cf6090
          test "$(git rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/tracked_tree_seed_scan.py)" = 3aa311db5c49c5dcf2bd12446f5e96b347080e96
          test "$(git rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-control-v1/renderer.py)" = 99f61e1daa03cecef055a3773544574738d65082
          test "$(git rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-control-v1/rh_audit_dependency.py)" = 095ff86f12a79dc312a51f734b0a03bd318f2337
          test "$(git rev-parse HEAD:experiments/aerosol-family-challenge-v2-r8/wavelength-grid-1nm.dat)" = 3bb3db96580d555ef758f57cabd6cac55b61cebb
          test "$(git rev-parse HEAD:experiments/aerosol-family-challenge-v2-r8-timeout-recovery-v1/execution-candidate/process_runner.py)" = e23d724e99c1cf9b0b862f8ab48356bd3d9bc56c

      - name: Run solver-free disabled-package and adapter tests
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(command -v uvspec || true)"
          python -m py_compile \
            review/aerosol-vertical-profile-sensitivity-v2-control-v1/control_package.py \
            review/aerosol-vertical-profile-sensitivity-v2-control-v1/adapter.py \
            review/aerosol-vertical-profile-sensitivity-v2-control-v1/runtime_stage.py \
            review/aerosol-vertical-profile-sensitivity-v2-control-v1/renderer.py \
            review/aerosol-vertical-profile-sensitivity-v2-control-v1/rh_audit_dependency.py \
            review/aerosol-vertical-profile-sensitivity-v2-prereg/build_skeleton.py \
            review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/seed_ledger.py
          mkdir -p review-evidence
          python review/aerosol-vertical-profile-sensitivity-v2-control-v1/control_package.py > review-evidence/package-summary.json
          python review/aerosol-vertical-profile-sensitivity-v2-control-v1/adapter.py > review-evidence/adapter-summary.json
          python review/aerosol-vertical-profile-sensitivity-v2-control-v1/runtime_stage.py > review-evidence/runtime-summary.json
          python - <<'PY'
          import importlib.util,json,tempfile
          from pathlib import Path
          def load(name,path):
              s=importlib.util.spec_from_file_location(name,Path(path)); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); return m
          package=load('cp','review/aerosol-vertical-profile-sensitivity-v2-control-v1/control_package.py')
          adapter=load('ad','review/aerosol-vertical-profile-sensitivity-v2-control-v1/adapter.py')
          p=package.build_disabled_package()
          assert p['caseCount']==360 and p['groupCount']==72 and p['statesPerGroup']==5
          assert p['candidateSeedValuesIncluded'] is False and p['scientificOrdinal'] is None
          assert p['scientificOrdinalAllocated'] is False and p['authorizationCreated'] is False and p['solverExecutionAuthorized'] is False
          assert all(str(c['caseId']).startswith('avps-v2-') for c in p['cases'])
          assert all(not any(line.startswith('aerosol_file ') for line in c['preSeedScienceSurface']) for c in p['cases'])
          auth={
            'stageId':'aerosol-vertical-profile-sensitivity-v2','status':'AUTHORIZED_PENDING_SEPARATE_DISPATCH','scientificOrdinal':1,
            'caseCount':360,'commonRandomNumberGroupCount':72,'statesPerGroup':5,'candidateSeedCount':72,
            'candidateSeedCanonicalSha256':adapter.EXPECTED_SEED_CANONICAL,'candidateRowsCanonicalSha256':adapter.EXPECTED_ROWS_CANONICAL,
            'disabledControlPackageCanonicalSha256':p['canonicalPackageSha256'],'exactFourSpeciesProfileSha256':adapter.EXPECTED_PROFILE_SHA256,
            'fourAliasDataTreeSha256':adapter.EXPECTED_FOUR_ALIAS_TREE_SHA256,'scientificExecutionAuthorized':True,'solverExecutionAuthorized':True,
            'dispatchAuthorized':False,'automaticDispatch':False,'resultOpeningAuthorized':False,'productionAuthorized':False,'taylorOrJerusalemFitAuthorized':False,
          }
          cases=adapter.authorized_case_universe(auth)
          assert len(cases)==360 and len({c['groupId'] for c in cases})==72
          by={}
          for c in cases: by.setdefault(c['groupId'],[]).append(c)
          assert all(len(rows)==5 and len({r['seed'] for r in rows})==1 for rows in by.values())
          c=cases[0]
          with tempfile.TemporaryDirectory() as td:
              root=Path(td); data=root/'data'; case_dir=root/'case'; case_dir.mkdir(parents=True); (data/'atmmod').mkdir(parents=True); (data/'solar_flux').mkdir()
              text=adapter.render_case_input(c,data,Path('.').resolve(),case_dir)
              assert 'aerosol_species_file profiles/' in text and ' INSO WASO SOOT SUSO' in text
              assert 'aerosol_file ' not in text and '<' not in text and '>' not in text
          bad=dict(auth); bad['dispatchAuthorized']=True
          try: adapter.validate_authorization(bad)
          except adapter.AdapterRefusal: pass
          else: raise AssertionError('adapter must refuse dispatch-authorized control mutation')
          print('disabled package + in-memory CRN adapter tests: PASS')
          PY

      - name: Repeat tracked-tree candidate seed leak scan on exact head
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z > tracked-files.nul
          python - <<'PY'
          import importlib.util,json,sys
          from pathlib import Path
          p=Path('review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/seed_ledger.py')
          s=importlib.util.spec_from_file_location('seed_temp',p); m=importlib.util.module_from_spec(s); sys.modules[s.name]=m; s.loader.exec_module(m)
          Path('candidate-ledger.TEMP.json').write_text(json.dumps(m.validate_ledger(),sort_keys=True))
          Path('empty-policy.TEMP.json').write_text(json.dumps({'schemaVersion':2,'requiredTrackedSelfLedgerPaths':[],'futureEvidenceSelfLedgerPaths':[]}))
          PY
          python review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/tracked_tree_seed_scan.py \
            --repo-root . --file-list tracked-files.nul \
            --candidate-seed-ledger candidate-ledger.TEMP.json \
            --allow-self-ledger-json empty-policy.TEMP.json \
            --output review-evidence/tracked-seed-scan.json
          rm -f candidate-ledger.TEMP.json empty-policy.TEMP.json tracked-files.nul
          python - <<'PY'
          import json
          x=json.load(open('review-evidence/tracked-seed-scan.json'))
          if x['candidateSeedCount']!=72 or x['trackedTreeExternalCollisionCount']!=0 or x['selfLedgerHitCount']!=0 or x['exactHeadTrackedTreeByteScanPassed'] is not True:
              raise SystemExit('tracked candidate seed leak scan failed')
          PY

      - name: Prove review-only scope and freeze receipt
        shell: bash
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test ! -e .github/workflows/aerosol-vertical-profile-sensitivity-v2-science.yml
          test ! -e .github/workflows/aerosol-vertical-profile-sensitivity-v2-dispatch.yml
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          def blob(path):
              b=Path(path).read_bytes(); return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          package=json.load(open('review-evidence/package-summary.json'))
          adapter=json.load(open('review-evidence/adapter-summary.json'))
          runtime=json.load(open('review-evidence/runtime-summary.json'))
          scan=json.load(open('review-evidence/tracked-seed-scan.json'))
          for x in (package,adapter,runtime):
              if x.get('scientificOrdinalAllocated') is not False: raise SystemExit('review summary crossed ordinal boundary')
          if package.get('authorizationCreated') is not False or package.get('solverExecutionAuthorized') is not False: raise SystemExit('disabled package crossed authorization boundary')
          if scan.get('trackedTreeExternalCollisionCount')!=0: raise SystemExit('candidate seed leaked into tracked tree')
          receipt={
            'schemaVersion':1,'stageId':'aerosol-vertical-profile-sensitivity-v2-control-v1-review',
            'status':'PASS_DISABLED_V2_CONTROL_PACKAGE_REVIEW_NO_ORDINAL_NO_AUTHORIZATION_NO_SOLVER',
            'reviewHead':os.environ['PR_HEAD'],'workflowRunId':int(os.environ['GITHUB_RUN_ID']),'workflowRunAttempt':1,
            'protocolGitBlobSha1':blob('review/aerosol-vertical-profile-sensitivity-v2-control-v1/PROTOCOL.md'),
            'controlPackageGitBlobSha1':blob('review/aerosol-vertical-profile-sensitivity-v2-control-v1/control_package.py'),
            'adapterGitBlobSha1':blob('review/aerosol-vertical-profile-sensitivity-v2-control-v1/adapter.py'),
            'runtimeStageGitBlobSha1':blob('review/aerosol-vertical-profile-sensitivity-v2-control-v1/runtime_stage.py'),
            'rendererGitBlobSha1':blob('review/aerosol-vertical-profile-sensitivity-v2-control-v1/renderer.py'),
            'rhStagingHelperGitBlobSha1':blob('review/aerosol-vertical-profile-sensitivity-v2-control-v1/rh_audit_dependency.py'),
            'disabledControlPackageCanonicalSha256':package['canonicalPackageSha256'],
            'caseCount':360,'groupCount':72,'statesPerGroup':5,'candidateSeedCount':72,
            'candidateSeedCanonicalSha256':os.environ['SEED_CANONICAL'],'candidateRowsCanonicalSha256':os.environ['ROW_CANONICAL'],
            'candidateSeedValuesIncluded':False,'trackedCandidateSeedCollisionCount':0,
            'scientificOrdinalAllocated':False,'authorizationCreated':False,'dispatchCreated':False,
            'candidateSeedsAppliedToCases':False,'scientificExecutionAuthorized':False,'solverExecutionAuthorized':False,
            'libRadtranInstalled':False,'libRadtranExecuted':False,'resultOpeningAuthorized':False,'productionAuthorized':False,
          }
          raw=json.dumps(receipt,sort_keys=True,separators=(',',':'),allow_nan=False).encode(); receipt['contentSha256']=hashlib.sha256(raw).hexdigest()
          Path('review-evidence/review-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aerosol-vertical-profile-sensitivity-v2-control-v1-review
          path: review-evidence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
