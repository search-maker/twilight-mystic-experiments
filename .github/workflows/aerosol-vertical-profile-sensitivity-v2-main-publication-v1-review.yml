name: Review AVPS v2 main publication v1

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/avps-v2-science.yml
      - .github/workflows/avps-v2-dispatch-publisher.yml
      - .github/workflows/aerosol-vertical-profile-sensitivity-v2-main-publication-v1-review.yml
      - review/aerosol-vertical-profile-sensitivity-v2-main-publication-v1/**
      - review/aerosol-vertical-profile-sensitivity-v2-execution-control-v1/execution-contract.review.json
      - review/aerosol-vertical-profile-sensitivity-v2-authorization-control-v4/authorization.json
      - review/aerosol-vertical-profile-sensitivity-v2-control-v1/adapter.py
      - review/aerosol-vertical-profile-sensitivity-v2-control-v1/control_package.py
      - review/aerosol-vertical-profile-sensitivity-v2-control-v1/runtime_stage.py
      - review/aerosol-vertical-profile-sensitivity-v2-prereg/build_skeleton.py
      - review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/seed_ledger.py
      - review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/repository_global_seed_scan.py
      - review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/tracked_tree_seed_scan.py
      - review/aerosol-vertical-profile-sensitivity-v2-executor-parity-v1/executor.py
      - review/aerosol-vertical-profile-sensitivity-v2-aggregator-parity-v1/aggregator.py

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: review-avps-v2-main-publication-v1-${{ github.event.pull_request.number }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact publication identity and path scope
        shell: bash
        env:
          EXPECTED_BASE_BRANCH: main
          EXPECTED_BASE_HEAD: 99ade7798627e67921139697ba1a004fa8a304bb
          EXPECTED_HEAD_BRANCH: review/aerosol-vertical-profile-sensitivity-v2-main-publication-v1
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "${{ github.event.pull_request.base.ref }}" = "$EXPECTED_BASE_BRANCH"
          test "${{ github.event.pull_request.base.sha }}" = "$EXPECTED_BASE_HEAD"
          test "${{ github.event.pull_request.head.ref }}" = "$EXPECTED_HEAD_BRANCH"
          test "${{ github.event.pull_request.draft }}" = true
          git fetch origin "$EXPECTED_BASE_BRANCH"
          test "$(git rev-parse origin/$EXPECTED_BASE_BRANCH)" = "$EXPECTED_BASE_HEAD"
          git diff --name-only "$EXPECTED_BASE_HEAD...$GITHUB_SHA" | sort > changed-paths.txt
          python - <<'PY'
          from pathlib import Path
          allowed={
            '.github/workflows/avps-v2-science.yml',
            '.github/workflows/avps-v2-dispatch-publisher.yml',
            '.github/workflows/aerosol-vertical-profile-sensitivity-v2-main-publication-v1-review.yml',
            'review/aerosol-vertical-profile-sensitivity-v2-main-publication-v1/PROTOCOL.md',
            'review/aerosol-vertical-profile-sensitivity-v2-execution-control-v1/execution-contract.review.json',
            'review/aerosol-vertical-profile-sensitivity-v2-authorization-control-v4/authorization.json',
            'review/aerosol-vertical-profile-sensitivity-v2-control-v1/adapter.py',
            'review/aerosol-vertical-profile-sensitivity-v2-control-v1/control_package.py',
            'review/aerosol-vertical-profile-sensitivity-v2-control-v1/runtime_stage.py',
            'review/aerosol-vertical-profile-sensitivity-v2-prereg/build_skeleton.py',
            'review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/seed_ledger.py',
            'review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/repository_global_seed_scan.py',
            'review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/tracked_tree_seed_scan.py',
            'review/aerosol-vertical-profile-sensitivity-v2-executor-parity-v1/executor.py',
            'review/aerosol-vertical-profile-sensitivity-v2-aggregator-parity-v1/aggregator.py',
          }
          rows={x for x in Path('changed-paths.txt').read_text().splitlines() if x}
          if rows != allowed:
              raise SystemExit(f'exact 15-file publication scope required; got {sorted(rows)}')
          PY

      - name: Verify exact reviewed source blobs copied onto publication branch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected={
            '.github/workflows/avps-v2-science.yml':'9970540d122a6feecbc19a34ec3e204e3aae10d9',
            '.github/workflows/avps-v2-dispatch-publisher.yml':'ce572e89bc6ea67757190cd60bd515d457833450',
            'review/aerosol-vertical-profile-sensitivity-v2-execution-control-v1/execution-contract.review.json':'383db5619849cb499104826801ed82227e6a2ddf',
            'review/aerosol-vertical-profile-sensitivity-v2-authorization-control-v4/authorization.json':'dcfbd39081abe8e98604eedd48a1d934cea5483a',
            'review/aerosol-vertical-profile-sensitivity-v2-control-v1/adapter.py':'c245eac2fe5b5d026e46ec4253bc377c5fde97ec',
            'review/aerosol-vertical-profile-sensitivity-v2-control-v1/control_package.py':'62bacf15d145051fcc5259a24c310eac761d0e74',
            'review/aerosol-vertical-profile-sensitivity-v2-control-v1/runtime_stage.py':'0d3ac10f3ef7d22f0205854233a6c37cbba03f7c',
            'review/aerosol-vertical-profile-sensitivity-v2-prereg/build_skeleton.py':'b4a4ab6917ad28f08d4980194f7b68f3961d5d59',
            'review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/seed_ledger.py':'c757507b05074340507df1ca6e76d35b44cf6090',
            'review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/repository_global_seed_scan.py':'2775c6c88e4a3d8bd269db76c413d93353630260',
            'review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/tracked_tree_seed_scan.py':'3aa311db5c49c5dcf2bd12446f5e96b347080e96',
            'review/aerosol-vertical-profile-sensitivity-v2-executor-parity-v1/executor.py':'bb1e4276d6383127a6b7e820fc2568d87d5de4b0',
            'review/aerosol-vertical-profile-sensitivity-v2-aggregator-parity-v1/aggregator.py':'ef24a0d30af3dfb46a6b764f3e426465da870fbe',
            'review/aerosol-vertical-profile-sensitivity-v2-main-publication-v1/PROTOCOL.md':'47f6013cc2eb03b90ea6ba1bc8f489a6507ef04f',
          }
          def blob(path):
              b=Path(path).read_bytes()
              return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          for path,want in expected.items():
              got=blob(path)
              if got!=want:
                  raise SystemExit(f'publication byte drift {path}: {got} != {want}')
          def sha256(path): return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          if sha256('.github/workflows/avps-v2-science.yml')!='f6d24a33d923bd4fa621a153dbeeddd35301551acc4d4aea32191e62735d1dc5':
              raise SystemExit('science workflow SHA-256 drift')
          if sha256('.github/workflows/avps-v2-dispatch-publisher.yml')!='e702518a88cdf9f88e00ec9b1021ea9d023dbb2e90dbe48443bfd667b2319478':
              raise SystemExit('publisher workflow SHA-256 drift')
          PY

      - name: Verify source implementation review and authorization remain immutable and unconsumed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/609" > source-pr.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/33229229379" > source-review-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/9707919147" > source-review-artifact.json
          python - <<'PY'
          import json
          p=json.load(open('source-pr.json'))
          if p['state']!='open' or p['draft'] is not True or p['merged_at'] is not None or p['head']['sha']!='2b0c349ad49678867742df5995ad13a23dc3f259':
              raise SystemExit('source PR #609 drift')
          r=json.load(open('source-review-run.json'))
          if r['id']!=33229229379 or r['run_attempt']!=1 or r['status']!='completed' or r['conclusion']!='success':
              raise SystemExit('source implementation review drift')
          a=json.load(open('source-review-artifact.json'))
          if a['id']!=9707919147 or a.get('digest')!='sha256:3c49e9f14c8018a609726c67a9a45f1ca204119535569650cf31406fbc560e8b' or a.get('expired'):
              raise SystemExit('source implementation review artifact drift')
          PY
          test "$(git ls-remote --heads origin authorization/aerosol-vertical-profile-sensitivity-v2-ordinal-41 | cut -f1)" = d5f5e4d9d19d7ede573fecae68565a92baabbec3
          if git ls-remote --exit-code --heads origin dispatch/aerosol-vertical-profile-sensitivity-v2-ordinal-41 >/dev/null 2>&1; then
            echo 'dispatch branch already exists; publication gate refuses' >&2
            exit 1
          fi

      - name: Emit solver-free publication review receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          out={
            'schemaVersion':1,
            'stageId':'aerosol-vertical-profile-sensitivity-v2-main-publication-v1',
            'status':'PASS_EXACT_BLOB_MAIN_PUBLICATION_SOLVER_FREE_NOT_DISPATCHED',
            'baseMain':'99ade7798627e67921139697ba1a004fa8a304bb',
            'sourceImplementationHead':'2b0c349ad49678867742df5995ad13a23dc3f259',
            'sourceReviewRun':33229229379,
            'sourceReviewArtifact':9707919147,
            'authorizationHead':'d5f5e4d9d19d7ede573fecae68565a92baabbec3',
            'scientificOrdinal':41,
            'scientificRuntimeSetupPerformed':False,
            'scientificExecutionPerformed':False,
            'solverExecutionPerformed':False,
            'dispatchCreated':False,
            'consumedMarkerPosted':False,
            'resultsOpened':False,
            'levelBOpened':False,
            'productionAuthorized':False,
          }
          Path('publication-review-receipt.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: avps-v2-main-publication-v1-review
          path: |
            publication-review-receipt.json
            changed-paths.txt
          if-no-files-found: error
          compression-level: 0
