name: Review AVPS v2 postconsumption recovery authorization control

on:
  pull_request:
    types: [opened]
    branches:
      - review/aerosol-vertical-profile-sensitivity-v2-postconsumption-preauthorization-v1
    paths:
      - .github/workflows/aerosol-vertical-profile-sensitivity-v2-postconsumption-authorization-control-v1-review.yml
      - review/aerosol-vertical-profile-sensitivity-v2-postconsumption-authorization-control-v1/PROTOCOL.md

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: avps-v2-postconsumption-auth-control-v1-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BASE_MAIN: 6f0b3f3c73b23f84951bd7b6a2bad58d00854982
      BASE_BRANCH: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-preauthorization-v1
      BASE_HEAD: 752e7c55740cdc0c6033deda71db9bc0dbb7fdf4
      CONTROL_BRANCH: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-authorization-control-v1
      AUTH_BRANCH: authorization/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery1-ordinal-42
      DISPATCH_BRANCH: dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery1-ordinal-42
      SEED_PR: '622'
      SEED_HEAD: 3f9a03b913125077a37a3eb56d1c031127bdfd60
      SEED_RUN: '33242753388'
      SEED_ARTIFACT: '9711902664'
      SEED_DIGEST: sha256:12934972f2a533c006a11012d2f2374e76873d9982dae0b1d5db656e6097b460
      PREAUTH_PR: '623'
      PREAUTH_HEAD: 752e7c55740cdc0c6033deda71db9bc0dbb7fdf4
      PREAUTH_RUN: '33245550336'
      PREAUTH_ARTIFACT: '9712820519'
      PREAUTH_DIGEST: sha256:5768dca0f4507c3a345f611ee4a71e1c955d3b1a6c95083add6f7030e55993de
      PREAUTH_CONTRACT: '33245550340'
      FAILED_RUN: '33236295233'
      FAILED_PREFLIGHT_ARTIFACT: '9710095370'
      FAILED_PREFLIGHT_DIGEST: sha256:64a00547a8d0be68322a58db239e9fbc57ad477938efd5d9254fa0098fe879f2
      SEED_CANONICAL: a514212990a94a39d577bd038b631a600e18e4c0f750f781bbd7c99b897228a7
      ROW_CANONICAL: 8213e65782b62d0e1a0ea51d620016fdcaa24b348e726f5570c54f7f1155a895
      OLD_SEED_CANONICAL: 02f624d582e9b2caba6b920d65a5e8a8bc8fc1a2693623bc2f73abf5d3f706d2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Prove exact two-file direct-child Draft control identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "${{ github.event.action }}" = opened
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$PR_BRANCH" = "$CONTROL_BRANCH"
          test "${{ github.event.pull_request.base.ref }}" = "$BASE_BRANCH"
          test "${{ github.event.pull_request.base.sha }}" = "$BASE_HEAD"
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          mapfile -t PARENTS < <(git cat-file -p HEAD | sed -n 's/^parent //p')
          test "${#PARENTS[@]}" = 1
          test "${PARENTS[0]}" = "$BASE_HEAD"
          git fetch origin main "$BASE_BRANCH"
          test "$(git rev-parse origin/main)" = "$BASE_MAIN"
          test "$(git rev-parse origin/$BASE_BRANCH)" = "$BASE_HEAD"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > current-pr.json
          python - <<'PY'
          import json,os
          p=json.load(open('current-pr.json'))
          if p['state']!='open' or p['draft'] is not True or p['merged_at'] is not None: raise SystemExit('control PR must remain Draft/open/unmerged')
          if p['head']['sha']!=os.environ['PR_HEAD'] or p['base']['sha']!=os.environ['BASE_HEAD']: raise SystemExit('control PR identity drift')
          PY
          git diff --name-only "$BASE_HEAD...$PR_HEAD" | sort > changed-paths.txt
          python - <<'PY'
          from pathlib import Path
          expected={
            '.github/workflows/aerosol-vertical-profile-sensitivity-v2-postconsumption-authorization-control-v1-review.yml',
            'review/aerosol-vertical-profile-sensitivity-v2-postconsumption-authorization-control-v1/PROTOCOL.md',
          }
          got={x for x in Path('changed-paths.txt').read_text().splitlines() if x}
          if got != expected: raise SystemExit(f'exact two-file control scope required; got {sorted(got)}')
          PY
          test "$(git rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-control-v1/control_package.py)" = 62bacf15d145051fcc5259a24c310eac761d0e74
          test "$(git rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-control-v1/adapter.py)" = c245eac2fe5b5d026e46ec4253bc377c5fde97ec
          test "$(git rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-control-v1/runtime_stage.py)" = 0d3ac10f3ef7d22f0205854233a6c37cbba03f7c
          test "$(git rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-control-v1/rh_audit_dependency.py)" = 095ff86f12a79dc312a51f734b0a03bd318f2337
          test "$(git rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-seed-freshness-v1/seed_ledger.py)" = 491d1b6653bea0fcc5275269723a76aa1af52300
          test -z "$(command -v uvspec || true)"
          mkdir -p review-evidence
          git ls-files -z > review-evidence/tracked-files.nul

      - name: Bind consumed failure and immutable predecessor proofs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RUN" > failed-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$FAILED_PREFLIGHT_ARTIFACT" > failed-artifact.json
          for prefix in SEED PREAUTH; do
            eval pr=\$${prefix}_PR; eval head=\$${prefix}_HEAD; eval run=\$${prefix}_RUN
            eval artifact=\$${prefix}_ARTIFACT; eval digest=\$${prefix}_DIGEST
            gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" > "$prefix-pr.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" > "$prefix-run.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact" > "$prefix-artifact.json"
            PREFIX="$prefix" WANT_HEAD="$head" WANT_RUN="$run" WANT_ARTIFACT="$artifact" WANT_DIGEST="$digest" python - <<'PY'
          import json,os
          x=os.environ['PREFIX']; p=json.load(open(f'{x}-pr.json')); r=json.load(open(f'{x}-run.json')); a=json.load(open(f'{x}-artifact.json'))
          if p['state']!='open' or p['draft'] is not True or p['merged_at'] is not None or p['head']['sha']!=os.environ['WANT_HEAD']: raise SystemExit(x+' proof PR drift')
          if r['id']!=int(os.environ['WANT_RUN']) or r['head_sha']!=os.environ['WANT_HEAD'] or r['run_attempt']!=1 or r['conclusion']!='success': raise SystemExit(x+' proof run drift')
          if a['id']!=int(os.environ['WANT_ARTIFACT']) or a.get('digest')!=os.environ['WANT_DIGEST'] or a.get('expired'): raise SystemExit(x+' proof artifact drift')
          PY
          done
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREAUTH_CONTRACT" > preauth-contract.json
          python - <<'PY'
          import json,os
          r=json.load(open('failed-run.json')); a=json.load(open('failed-artifact.json')); c=json.load(open('preauth-contract.json'))
          if r['id']!=int(os.environ['FAILED_RUN']) or r['run_attempt']!=1 or r['conclusion']!='failure': raise SystemExit('consumed ordinal-41 run drift')
          if a['id']!=int(os.environ['FAILED_PREFLIGHT_ARTIFACT']) or a.get('digest')!=os.environ['FAILED_PREFLIGHT_DIGEST'] or a.get('expired'): raise SystemExit('consumed preflight evidence drift')
          if c['id']!=int(os.environ['PREAUTH_CONTRACT']) or c['head_sha']!=os.environ['PREAUTH_HEAD'] or c['run_attempt']!=1 or c['conclusion']!='success': raise SystemExit('preauthorization repository contract drift')
          PY

      - name: Rebuild fresh recovery seed ledger and scan exact tracked tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util,json,sys
          from pathlib import Path
          p=Path('review/aerosol-vertical-profile-sensitivity-v2-postconsumption-seed-freshness-v1/seed_ledger.py')
          s=importlib.util.spec_from_file_location('recovery_auth_seed_ledger',p); m=importlib.util.module_from_spec(s); sys.modules[s.name]=m; s.loader.exec_module(m)
          x=m.validate_ledger()
          if x['candidateSeedCount']!=72 or x['candidateSeedCanonicalSha256']!='a514212990a94a39d577bd038b631a600e18e4c0f750f781bbd7c99b897228a7': raise SystemExit('recovery seed identity drift')
          if x['candidateRowsCanonicalSha256']!='8213e65782b62d0e1a0ea51d620016fdcaa24b348e726f5570c54f7f1155a895' or x['overlapWithConsumedOrdinal41SeedCount']!=0: raise SystemExit('recovery seed row/overlap drift')
          Path('candidate-ledger.TEMP.json').write_text(json.dumps(x,indent=2,sort_keys=True)+'\n')
          Path('empty-policy.TEMP.json').write_text(json.dumps({'schemaVersion':2,'requiredTrackedSelfLedgerPaths':[],'futureEvidenceSelfLedgerPaths':[]},indent=2,sort_keys=True)+'\n')
          PY
          python review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/tracked_tree_seed_scan.py \
            --repo-root . --file-list review-evidence/tracked-files.nul \
            --candidate-seed-ledger candidate-ledger.TEMP.json \
            --allow-self-ledger-json empty-policy.TEMP.json \
            --output review-evidence/tracked-seed-scan.json
          python - <<'PY'
          import json
          x=json.load(open('review-evidence/tracked-seed-scan.json'))
          if x.get('trackedTreeExternalCollisionCount')!=0 or x.get('exactHeadTrackedTreeByteScanPassed') is not True: raise SystemExit('control-head tracked-tree seed collision')
          PY

      - name: Fresh repository-global recovery seed fence
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python review/aerosol-vertical-profile-sensitivity-v2-postconsumption-seed-freshness-v1/repository_global_seed_scan.py \
            --repository "$GITHUB_REPOSITORY" --issue-number 60 \
            --candidate-seed-ledger candidate-ledger.TEMP.json \
            --current-run-id "$GITHUB_RUN_ID" --audit-mode authorization-recheck \
            --expected-branch-name "$CONTROL_BRANCH" --expected-repo-head "$PR_HEAD" \
            --output review-evidence/repository-global-seed-recheck.json
          python - <<'PY'
          import json,os,re
          x=json.load(open('review-evidence/repository-global-seed-recheck.json'))
          expected={'auditMode':'authorization-recheck','candidateSeedCount':72,'repositoryGlobalCollisionCount':0,'repositoryGlobalCollisionSurfaceScanPassed':True,'repositoryGlobalDoubleEnumerationStable':True,'auditedBranchName':os.environ['CONTROL_BRANCH'],'repositoryHeadExpected':os.environ['PR_HEAD'],'auditedBranchHeadShaObserved':os.environ['PR_HEAD'],'auditedBranchHeadMatchesRepositoryHead':True,'repositoryGlobalPostFenceCandidateSeedCollisionCount':0}
          for k,v in expected.items():
              if x.get(k)!=v: raise SystemExit(f'fresh seed surface drift {k}: {x.get(k)!r} != {v!r}')
          for k in ('repositoryGlobalStableContextSha256','repositoryGlobalSnapshotFenceSha256'):
              if re.fullmatch(r'[0-9a-f]{64}',str(x.get(k) or '')) is None: raise SystemExit('malformed fresh seed fence hash')
          PY

      - name: Fresh dynamic global ordinal fence
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util,json,os,sys
          from pathlib import Path
          p=Path('review/aerosol-vertical-profile-sensitivity-v2-postconsumption-preauthorization-v1/preauthorize.py')
          s=importlib.util.spec_from_file_location('recovery_auth_preauth',p); m=importlib.util.module_from_spec(s); sys.modules[s.name]=m; s.loader.exec_module(m)
          _,payload=m.collect_payload(os.environ['GITHUB_REPOSITORY'],os.environ['GITHUB_TOKEN'])
          x=m.ordinal_surface(payload,int(os.environ['GITHUB_RUN_ID'])); observations=x.pop('observations')
          if x['consumedScientificOrdinal']!=41 or x['occupiedMaxScientificOrdinal']!=41 or x['nextAvailableScientificOrdinal']!=42: raise SystemExit('fresh global ordinal surface is not consumed41 -> dynamic42')
          if x['authorizationBranch']!=os.environ['AUTH_BRANCH'] or x['dispatchBranch']!=os.environ['DISPATCH_BRANCH']: raise SystemExit('recovery ref proposal drift')
          Path('review-evidence/ordinal-surface.json').write_text(json.dumps(x,indent=2,sort_keys=True)+'\n')
          Path('review-evidence/ordinal-observations.json').write_text(json.dumps(observations,indent=2,sort_keys=True)+'\n')
          PY

      - name: Materialize exact recovery authorization proposal as artifact only
        shell: bash
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          seed=json.load(open('review-evidence/repository-global-seed-recheck.json')); ordinal=json.load(open('review-evidence/ordinal-surface.json'))
          profiles={
            'opac-profile-antarctic':'ee063c6dca68cf9a31d8bb9d993f1fed5cb34c8bb056ac180c97171b5d6b4f19',
            'opac-profile-arctic':'98f2fa5428c830764252fd0a2662b0f5c957fc027ffcb7bdc0a5e500dfd7d3d6',
            'opac-profile-continental-average':'ceed598f7681951cd0e6208b267beb5b41a52ab10311f37ce76f925700caff3d',
            'opac-profile-desert':'2b4d2e03c6ae3143d9bb05d2da49f57f75172dc1f24d34f7d4a4939bf9952fef',
            'opac-profile-maritime-clean':'487b67bd7dbe89d12d032fdf2b33cab545e16a2e0697170648317f1a76362a67',
          }
          a={
            'schemaVersion':2,'stageId':'aerosol-vertical-profile-sensitivity-v2','recoveryStageId':'aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery1',
            'status':'AUTHORIZED_POSTCONSUMPTION_RECOVERY_PENDING_SEPARATE_DISPATCH','scientificOrdinal':42,'consumedPredecessorScientificOrdinal':41,
            'consumedPredecessorRunId':33236295233,'consumedPredecessorRunAttempt':1,'consumedPredecessorFailureClass':'PRE_SOLVER_RUNTIME_SUPPORT_TRANSPORT_OMISSION_NO_SCIENTIFIC_RESULT',
            'consumedPredecessorPreflightArtifactId':9710095370,'consumedPredecessorPreflightArtifactDigest':'sha256:64a00547a8d0be68322a58db239e9fbc57ad477938efd5d9254fa0098fe879f2',
            'authorizationBranch':os.environ['AUTH_BRANCH'],'dispatchBranch':os.environ['DISPATCH_BRANCH'],'executionKey':'aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery1:numerical:42',
            'exactAuthorizationParentCommit':os.environ['PR_HEAD'],'reviewPackageMainSha':os.environ['BASE_MAIN'],'exactAuthorizationCommit':None,
            'seedReviewPr':622,'seedReviewHead':os.environ['SEED_HEAD'],'seedReviewRunId':33242753388,'seedReviewArtifactId':9711902664,'seedReviewArtifactDigest':os.environ['SEED_DIGEST'],
            'preauthorizationPr':623,'preauthorizationHead':os.environ['PREAUTH_HEAD'],'preauthorizationRunId':33245550336,'preauthorizationArtifactId':9712820519,'preauthorizationArtifactDigest':os.environ['PREAUTH_DIGEST'],'preauthorizationRepositoryContractRunId':33245550340,
            'nextOrdinalHardCoded':False,'candidateSeedCount':72,'candidateSeedCanonicalSha256':os.environ['SEED_CANONICAL'],'candidateRowsCanonicalSha256':os.environ['ROW_CANONICAL'],'consumedOrdinal41SeedCanonicalSha256':os.environ['OLD_SEED_CANONICAL'],
            'candidateSeedValuesIncluded':False,'candidateSeedsAppliedToTrackedCases':False,'candidateSeedsAuthorizedForLaterInMemoryApplication':True,
            'freshAuthorizationSeedStableContextSha256':seed['repositoryGlobalStableContextSha256'],'freshAuthorizationSeedSnapshotFenceSha256':seed['repositoryGlobalSnapshotFenceSha256'],'freshAuthorizationOrdinalObservationsCanonicalSha256':ordinal['ordinalObservationsCanonicalSha256'],
            'exactFourSpeciesProfileSha256':profiles,'fourAliasDataTreeSha256':'5e1814dd36cf861fd85477a97607299248f8272268df7bf428d31bbb6aa4354a','lockedLibRadtranPackage':'rubin-libradtran=2.0.6=py312pl5321he9373c2_1',
            'uvspecSha256':'2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3','baseDataTreeSha256':'ad30b49177e9c84e46497d69faf0c75e466996b0d0003f1de210289ae9f847d7','archiveStagedDataTreeSha256':'5d8bbf8e6b91ec3d405dee36f21a94afbb6e5ec6cd67da2dd5dd541738199d80','officialOptpropArchiveSha256':'11daa1f1f4be0fd4ddf7e881ec2005498049674a1540d37b4b1e8f5e16052c7e','afglUsSha256':'dab26290ed81c762ed0c607e5dc2d53393c1462a0c3a528bc5e3f5935191cfb5','restoredRhAuditDependencyGitBlobSha1':'095ff86f12a79dc312a51f734b0a03bd318f2337',
            'caseCount':360,'commonRandomNumberGroupCount':72,'statesPerGroup':5,'photonHistoriesPerCase':20000000,'frozenScientificDesignChanged':False,
            'scientificExecutionAuthorized':True,'solverExecutionAuthorized':True,'dispatchAuthorized':False,'automaticDispatch':False,'consumed':False,'resultOpeningAuthorized':False,'levelBOpeningAuthorized':False,'protectedHoldoutOpeningAuthorized':False,'productionAuthorized':False,'taylorOrJerusalemFitAuthorized':False,'githubRerunAllowed':False,'retryAllowed':False,'resumeAllowed':False,'workflowRunAttemptRequired':1,
          }
          raw=json.dumps(a,sort_keys=True,separators=(',',':'),allow_nan=False).encode(); a['authorizationDocumentContentSha256']=hashlib.sha256(raw).hexdigest()
          Path('review-evidence/authorization.json').write_text(json.dumps(a,indent=2,sort_keys=True)+'\n')
          r={'schemaVersion':1,'status':'PASS_RECOVERY_AUTHORIZATION_CONTROL_PROPOSAL_NOT_ALLOCATED_NOT_DISPATCHED','controlHead':os.environ['PR_HEAD'],'scientificOrdinalProposed':42,'consumedPredecessorOrdinal':41,'authorizationJsonSha256':hashlib.sha256(Path('review-evidence/authorization.json').read_bytes()).hexdigest(),'candidateSeedCanonicalSha256':os.environ['SEED_CANONICAL'],'candidateRowsCanonicalSha256':os.environ['ROW_CANONICAL'],'scientificOrdinalAllocated':False,'authorizationBranchCreated':False,'dispatchCreated':False,'scientificRuntimeSetupPerformed':False,'solverExecutionPerformed':False,'resultOpeningPerformed':False,'levelBOpened':False,'productionAuthorized':False,'taylorOrJerusalemUsed':False}
          raw=json.dumps(r,sort_keys=True,separators=(',',':'),allow_nan=False).encode(); r['contentSha256']=hashlib.sha256(raw).hexdigest()
          Path('review-evidence/control-review-receipt.json').write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          PY
          rm -f candidate-ledger.TEMP.json empty-policy.TEMP.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aerosol-vertical-profile-sensitivity-v2-postconsumption-authorization-control-v1
          path: review-evidence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
