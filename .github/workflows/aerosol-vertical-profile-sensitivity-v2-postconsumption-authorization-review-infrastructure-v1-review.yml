name: Review AVPS v2 postconsumption authorization-review infrastructure v1

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    paths:
      - .github/workflows/aerosol-vertical-profile-sensitivity-v2-postconsumption-authorization-review-v1.yml
      - .github/workflows/aerosol-vertical-profile-sensitivity-v2-postconsumption-authorization-review-infrastructure-v1-review.yml

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: avps-v2-postconsumption-auth-review-infra-v1-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BASE_MAIN: 6f0b3f3c73b23f84951bd7b6a2bad58d00854982
      EXPECTED_BRANCH: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-authorization-review-infra-v1
      FUTURE_WORKFLOW: .github/workflows/aerosol-vertical-profile-sensitivity-v2-postconsumption-authorization-review-v1.yml
      SELF_WORKFLOW: .github/workflows/aerosol-vertical-profile-sensitivity-v2-postconsumption-authorization-review-infrastructure-v1-review.yml
      CONTROL_HEAD: a68f603d6da21cd28ab8324da080cc8ad27f9094
      CONTROL_RUN: '33246777379'
      CONTROL_ARTIFACT: '9713174217'
      CONTROL_DIGEST: sha256:d96c4351bd5384a90af0c55b734c7508716689fa5eb1f9811a07f94d71e0c290
      CONTROL_BRANCH: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-authorization-control-v1
      AUTH_BRANCH: authorization/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery1-ordinal-42
      AUTH_PATH: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-authorization-control-v1/authorization.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Prove exact additive review-infrastructure proposal
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          case "${{ github.event.action }}" in opened|synchronize) ;; *) exit 1 ;; esac
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "${{ github.event.pull_request.head.ref }}" = "$EXPECTED_BRANCH"
          test "${{ github.event.pull_request.base.ref }}" = main
          test "${{ github.event.pull_request.base.sha }}" = "$BASE_MAIN"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_MAIN"
          test "$(git merge-base "$BASE_MAIN" "$PR_HEAD")" = "$BASE_MAIN"
          git diff --name-only "$BASE_MAIN...$PR_HEAD" | sort > changed-paths.txt
          python - <<'PY'
          import os
          from pathlib import Path
          got={x for x in Path('changed-paths.txt').read_text().splitlines() if x}
          want={os.environ['FUTURE_WORKFLOW'],os.environ['SELF_WORKFLOW']}
          if got!=want: raise SystemExit(f'exact two-workflow scope required; got {sorted(got)}')
          PY
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > current-pr.json
          python - <<'PY'
          import json,os
          p=json.load(open('current-pr.json'))
          if p['state']!='open' or p['draft'] is not True or p['merged_at'] is not None: raise SystemExit('infrastructure PR must remain Draft/open/unmerged')
          if p['head']['sha']!=os.environ['PR_HEAD'] or p['base']['sha']!=os.environ['BASE_MAIN']: raise SystemExit('infrastructure PR identity drift')
          PY
          test -z "$(command -v uvspec || true)"
          mkdir -p review-evidence control-artifact

      - name: Bind successful recovery authorization control artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CONTROL_RUN" > review-evidence/control-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CONTROL_ARTIFACT" > review-evidence/control-artifact.json
          python - <<'PY'
          import json,os
          r=json.load(open('review-evidence/control-run.json')); a=json.load(open('review-evidence/control-artifact.json'))
          if r['id']!=int(os.environ['CONTROL_RUN']) or r['head_sha']!=os.environ['CONTROL_HEAD'] or r['run_attempt']!=1 or r['status']!='completed' or r['conclusion']!='success': raise SystemExit('control run drift')
          if a['id']!=int(os.environ['CONTROL_ARTIFACT']) or a.get('digest')!=os.environ['CONTROL_DIGEST'] or a.get('expired'): raise SystemExit('control artifact drift')
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CONTROL_ARTIFACT/zip" > control.zip
          test "sha256:$(sha256sum control.zip | awk '{print $1}')" = "$CONTROL_DIGEST"
          unzip -q control.zip -d control-artifact
          CANDIDATE="$(find control-artifact -type f -name authorization.json -print -quit)"
          test -n "$CANDIDATE"
          cp "$CANDIDATE" review-evidence/proposed-authorization.json
          python - <<'PY'
          import json,os
          a=json.load(open('review-evidence/proposed-authorization.json'))
          if a.get('scientificOrdinal')!=42 or a.get('exactAuthorizationParentCommit')!=os.environ['CONTROL_HEAD']: raise SystemExit('candidate ordinal/parent drift')
          if a.get('authorizationBranch')!=os.environ['AUTH_BRANCH'] or a.get('dispatchBranch')!='dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery1-ordinal-42': raise SystemExit('candidate branch drift')
          if a.get('dispatchAuthorized') is not False or a.get('resultOpeningAuthorized') is not False or a.get('levelBOpeningAuthorized') is not False or a.get('productionAuthorized') is not False or a.get('taylorOrJerusalemFitAuthorized') is not False: raise SystemExit('candidate boundary drift')
          PY

      - name: Static audit future authorization-review workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,os
          from pathlib import Path
          p=Path(os.environ['FUTURE_WORKFLOW']); text=p.read_text(); low=text.lower()
          required=[
            'pull_request_target:',
            'types: [opened]',
            'review/aerosol-vertical-profile-sensitivity-v2-postconsumption-authorization-control-v1',
            'authorization/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery1-ordinal-42',
            'review/aerosol-vertical-profile-sensitivity-v2-postconsumption-authorization-control-v1/authorization.json',
            'a68f603d6da21cd28ab8324da080cc8ad27f9094',
            '33246777379','9713174217','sha256:d96c4351bd5384a90af0c55b734c7508716689fa5eb1f9811a07f94d71e0c290',
            'repository-global seed recheck','global ordinal review excluding exact self only','Final non-self ordinal readback',
            'contents: read','actions: read','pull-requests: read','issues: read','persist-credentials: false',
          ]
          for s in required:
              if s not in text: raise SystemExit(f'missing required authorization-review binding: {s}')
          forbidden=['contents: write','actions: write','pull-requests: write','issues: write','id-token: write','workflow_dispatch:','push:','libradtran','mystic','gh api -x post','gh api -x patch','gh api -x put','gh api -x delete']
          for s in forbidden:
              if s in low: raise SystemExit(f'forbidden mutation/runtime surface in authorization review: {s}')
          if low.count('uvspec') != 1 or 'command -v uvspec' not in low:
              raise SystemExit('uvspec may appear only in the single defensive runtime-absence check')
          if text.count('uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a')!=1: raise SystemExit('exact evidence upload action binding required')
          sha=hashlib.sha256(p.read_bytes()).hexdigest()
          Path('review-evidence/future-workflow.sha256').write_text(sha+'  '+str(p)+'\n')
          PY
          git diff --check "$BASE_MAIN...${{ github.event.pull_request.head.sha }}"

      - name: Freeze infrastructure review receipt
        shell: bash
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          r={'schemaVersion':1,'stageId':'aerosol-vertical-profile-sensitivity-v2-postconsumption-authorization-review-infrastructure-v1','status':'PASS_SOLVER_FREE_AUTHORIZATION_REVIEW_GATE_READY_FOR_PUBLICATION','baseMain':os.environ['BASE_MAIN'],'proposalHead':os.environ['PR_HEAD'],'prNumber':int(os.environ['PR_NUMBER']),'controlHead':os.environ['CONTROL_HEAD'],'controlRunId':int(os.environ['CONTROL_RUN']),'controlArtifactId':int(os.environ['CONTROL_ARTIFACT']),'controlArtifactDigest':os.environ['CONTROL_DIGEST'],'futureWorkflowSha256':hashlib.sha256(Path(os.environ['FUTURE_WORKFLOW']).read_bytes()).hexdigest(),'changedPathCount':2,'scientificOrdinalAllocated':False,'authorizationBranchCreated':False,'dispatchCreated':False,'scientificRuntimeSetupPerformed':False,'solverExecutionPerformed':False,'resultOpeningPerformed':False,'levelBOpened':False,'productionAuthorized':False,'taylorOrJerusalemUsed':False}
          raw=json.dumps(r,sort_keys=True,separators=(',',':'),allow_nan=False).encode(); r['contentSha256']=hashlib.sha256(raw).hexdigest()
          Path('review-evidence/infrastructure-review-receipt.json').write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          PY

      - name: Upload infrastructure review evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aerosol-vertical-profile-sensitivity-v2-postconsumption-authorization-review-infrastructure-v1
          path: review-evidence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
