name: Review AVPS v2 postconsumption authorization-review infrastructure v1

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    paths:
      - .github/workflows/aerosol-vertical-profile-sensitivity-v2-postconsumption-authorization-review-v1.yml
      - .github/workflows/aerosol-vertical-profile-sensitivity-v2-postconsumption-authorization-review-infrastructure-v1-review.yml
      - review/aerosol-vertical-profile-sensitivity-v2-postconsumption-authorization-review-infrastructure-v1/PROTOCOL.md

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: avps-v2-postconsumption-auth-review-infra-v1-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BASE_MAIN: 6f0b3f3c73b23f84951bd7b6a2bad58d00854982
      INFRA_BRANCH: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-authorization-review-infrastructure-v1
      CONTROL_HEAD: a68f603d6da21cd28ab8324da080cc8ad27f9094
      CONTROL_PR: '625'
      CONTROL_RUN: '33246777379'
      CONTROL_ARTIFACT: '9713174217'
      CONTROL_DIGEST: sha256:d96c4351bd5384a90af0c55b734c7508716689fa5eb1f9811a07f94d71e0c290
      TARGET_WORKFLOW: .github/workflows/aerosol-vertical-profile-sensitivity-v2-postconsumption-authorization-review-v1.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Prove exact additive infrastructure scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          case "${{ github.event.action }}" in opened|synchronize) ;; *) exit 1 ;; esac
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "${{ github.event.pull_request.head.ref }}" = "$INFRA_BRANCH"
          test "${{ github.event.pull_request.base.ref }}" = main
          test "${{ github.event.pull_request.base.sha }}" = "$BASE_MAIN"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git merge-base --is-ancestor "$BASE_MAIN" "$HEAD_SHA"
          test -z "$(git rev-list --merges "$BASE_MAIN..$HEAD_SHA")"
          git diff --name-only "$BASE_MAIN...$HEAD_SHA" | sort > changed.txt
          python - <<'PY'
          from pathlib import Path
          expected={
            '.github/workflows/aerosol-vertical-profile-sensitivity-v2-postconsumption-authorization-review-v1.yml',
            '.github/workflows/aerosol-vertical-profile-sensitivity-v2-postconsumption-authorization-review-infrastructure-v1-review.yml',
            'review/aerosol-vertical-profile-sensitivity-v2-postconsumption-authorization-review-infrastructure-v1/PROTOCOL.md',
          }
          got={x for x in Path('changed.txt').read_text().splitlines() if x}
          if got!=expected: raise SystemExit(f'exact three-file infrastructure scope required; got {sorted(got)}')
          PY
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > current-pr.json
          python - <<'PY'
          import json, os
          p=json.load(open('current-pr.json'))
          if p['state']!='open' or p['merged_at'] is not None or p['head']['sha']!=os.environ['HEAD_SHA']:
              raise SystemExit('infrastructure PR identity/state drift')
          PY
          test -z "$(command -v uvspec || true)"
          mkdir -p review-evidence

      - name: Bind successful recovery authorization control
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$CONTROL_PR" > control-pr.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CONTROL_RUN" > control-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CONTROL_ARTIFACT" > control-artifact.json
          python - <<'PY'
          import json, os
          p=json.load(open('control-pr.json')); r=json.load(open('control-run.json')); a=json.load(open('control-artifact.json'))
          if p['state']!='open' or p['draft'] is not True or p['merged_at'] is not None or p['head']['sha']!=os.environ['CONTROL_HEAD']:
              raise SystemExit('control PR drift')
          if r['head_sha']!=os.environ['CONTROL_HEAD'] or r['run_attempt']!=1 or r['conclusion']!='success':
              raise SystemExit('control review run drift')
          if a['id']!=int(os.environ['CONTROL_ARTIFACT']) or a.get('digest')!=os.environ['CONTROL_DIGEST'] or a.get('expired'):
              raise SystemExit('control artifact drift')
          PY

      - name: Static audit authorization-review target
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          t=Path('.github/workflows/aerosol-vertical-profile-sensitivity-v2-postconsumption-authorization-review-v1.yml').read_text()
          required=[
            'pull_request_target:',
            'types: [opened]',
            'review/aerosol-vertical-profile-sensitivity-v2-postconsumption-authorization-control-v1',
            'authorization/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery1-ordinal-42',
            'dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery1-ordinal-42',
            'CONTROL_HEAD: a68f603d6da21cd28ab8324da080cc8ad27f9094',
            "CONTROL_RUN: '33246777379'",
            "CONTROL_ARTIFACT: '9713174217'",
            'sha256:d96c4351bd5384a90af0c55b734c7508716689fa5eb1f9811a07f94d71e0c290',
            'persist-credentials: false',
            'Fresh authorization-head repository-global seed recheck',
            'Fresh global ordinal review excluding this authorization identity only',
            'PASS_AUTHORIZATION_REVIEWED_NOT_ALLOCATED_NOT_DISPATCHED',
          ]
          for s in required:
              if s not in t: raise SystemExit(f'missing target-workflow contract token: {s}')
          for s in ['workflow_dispatch:', 'gh workflow run', 'gh run rerun', 'git push', 'git reset --hard']:
              if s in t.lower(): raise SystemExit(f'forbidden target-workflow token: {s}')
          for line in t.splitlines():
              s=line.strip().lower()
              if s in ('contents: write','actions: write','pull-requests: write','issues: write'):
                  raise SystemExit('authorization review workflow must remain read-only')
              if s.startswith('uvspec ') or s.startswith('mystic ') or s.startswith('python -m mystic'):
                  raise SystemExit('scientific solver command found in authorization review workflow')
          PY

      - name: Freeze infrastructure review receipt
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          paths=[
            '.github/workflows/aerosol-vertical-profile-sensitivity-v2-postconsumption-authorization-review-v1.yml',
            '.github/workflows/aerosol-vertical-profile-sensitivity-v2-postconsumption-authorization-review-infrastructure-v1-review.yml',
            'review/aerosol-vertical-profile-sensitivity-v2-postconsumption-authorization-review-infrastructure-v1/PROTOCOL.md',
          ]
          r={'schemaVersion':1,'stageId':'aerosol-vertical-profile-sensitivity-v2-postconsumption-authorization-review-infrastructure-v1','status':'PASS_SOLVER_FREE_AUTHORIZATION_REVIEW_INFRASTRUCTURE','head':os.environ['HEAD_SHA'],'baseMain':os.environ['BASE_MAIN'],'controlHead':os.environ['CONTROL_HEAD'],'controlRunId':int(os.environ['CONTROL_RUN']),'controlArtifactId':int(os.environ['CONTROL_ARTIFACT']),'fileSha256':{p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths},'authorizationCreated':False,'dispatchCreated':False,'scientificRuntimeSetupPerformed':False,'solverExecutionPerformed':False,'resultOpeningPerformed':False,'levelBOpened':False,'productionAuthorized':False,'taylorOrJerusalemUsed':False}
          raw=json.dumps(r,sort_keys=True,separators=(',',':'),allow_nan=False).encode(); r['contentSha256']=hashlib.sha256(raw).hexdigest()
          Path('review-evidence/review-receipt.json').write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aerosol-vertical-profile-sensitivity-v2-postconsumption-authorization-review-infrastructure-v1
          path: review-evidence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
