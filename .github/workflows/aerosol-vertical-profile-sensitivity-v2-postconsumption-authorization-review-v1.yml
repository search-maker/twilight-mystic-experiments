name: Review AVPS v2 postconsumption recovery authorization v1

on:
  pull_request_target:
    types: [opened]
    branches:
      - review/aerosol-vertical-profile-sensitivity-v2-postconsumption-authorization-control-v1
    paths:
      - review/aerosol-vertical-profile-sensitivity-v2-postconsumption-authorization-control-v1/authorization.json

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: avps-v2-postconsumption-authorization-review-v1-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  authorization-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CONTROL_BRANCH: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-authorization-control-v1
      CONTROL_HEAD: a68f603d6da21cd28ab8324da080cc8ad27f9094
      CONTROL_PR: '625'
      CONTROL_RUN: '33246777379'
      CONTROL_ARTIFACT: '9713174217'
      CONTROL_DIGEST: sha256:d96c4351bd5384a90af0c55b734c7508716689fa5eb1f9811a07f94d71e0c290
      AUTH_BRANCH: authorization/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery1-ordinal-42
      DISPATCH_BRANCH: dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery1-ordinal-42
      AUTH_PATH: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-authorization-control-v1/authorization.json
      PROPOSED_ORDINAL: '42'
      CANDIDATE_SEED_CANONICAL: a514212990a94a39d577bd038b631a600e18e4c0f750f781bbd7c99b897228a7
      CANDIDATE_ROWS_CANONICAL: 8213e65782b62d0e1a0ea51d620016fdcaa24b348e726f5570c54f7f1155a895
      CONSUMED_ORDINAL41_SEED_CANONICAL: 02f624d582e9b2caba6b920d65a5e8a8bc8fc1a2693623bc2f73abf5d3f706d2
    steps:
      - name: Checkout exact authorization head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Prove one-file direct-child Draft authorization identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request_target
          test "${{ github.event.action }}" = opened
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "${{ github.event.pull_request.head.ref }}" = "$AUTH_BRANCH"
          test "${{ github.event.pull_request.base.ref }}" = "$CONTROL_BRANCH"
          test "$BASE_SHA" = "$CONTROL_HEAD"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git fetch origin "$CONTROL_BRANCH"
          test "$(git rev-parse origin/$CONTROL_BRANCH)" = "$CONTROL_HEAD"
          mapfile -t PARENTS < <(git cat-file -p HEAD | sed -n 's/^parent //p')
          test "${#PARENTS[@]}" = 1
          test "${PARENTS[0]}" = "$CONTROL_HEAD"
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = 1
          test "${CHANGED[0]}" = "$AUTH_PATH"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > current-pr.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/$CONTROL_PR" > control-pr.json
          python - <<'PY'
          import json, os
          p=json.load(open('current-pr.json')); c=json.load(open('control-pr.json'))
          if p['state']!='open' or p['draft'] is not True or p['merged_at'] is not None:
              raise SystemExit('authorization PR must remain Draft/open/unmerged')
          if p['head']['sha']!=os.environ['HEAD_SHA'] or p['base']['sha']!=os.environ['CONTROL_HEAD']:
              raise SystemExit('authorization PR identity drift')
          if p['head']['repo']['full_name']!=p['base']['repo']['full_name']:
              raise SystemExit('authorization PR must be same-repository')
          if c['state']!='open' or c['draft'] is not True or c['merged_at'] is not None or c['head']['sha']!=os.environ['CONTROL_HEAD']:
              raise SystemExit('reviewed control PR drift')
          PY
          test -z "$(command -v uvspec || true)"
          mkdir -p control-artifact auth-review-evidence
          git ls-files -z > auth-review-evidence/tracked-files.nul

      - name: Bind successful recovery authorization control and exact proposal
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CONTROL_RUN" > control-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CONTROL_ARTIFACT" > control-artifact-meta.json
          python - <<'PY'
          import json, os
          r=json.load(open('control-run.json')); a=json.load(open('control-artifact-meta.json'))
          if r['head_sha']!=os.environ['CONTROL_HEAD'] or r['run_attempt']!=1 or r['conclusion']!='success':
              raise SystemExit('control run drift')
          if a['id']!=int(os.environ['CONTROL_ARTIFACT']) or a.get('digest')!=os.environ['CONTROL_DIGEST'] or a.get('expired'):
              raise SystemExit('control artifact drift')
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CONTROL_ARTIFACT/zip" > control.zip
          test "sha256:$(sha256sum control.zip | awk '{print $1}')" = "$CONTROL_DIGEST"
          unzip -q control.zip -d control-artifact
          test -f control-artifact/authorization.json
          test -f control-artifact/control-review-receipt.json
          cmp -s "$AUTH_PATH" control-artifact/authorization.json
          cp control-artifact/control-review-receipt.json auth-review-evidence/control-review-receipt.json
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          a=json.load(open(os.environ['AUTH_PATH'])); r=json.load(open('auth-review-evidence/control-review-receipt.json'))
          expected={
            'schemaVersion':2,
            'scientificOrdinal':int(os.environ['PROPOSED_ORDINAL']),
            'authorizationBranch':os.environ['AUTH_BRANCH'],
            'dispatchBranch':os.environ['DISPATCH_BRANCH'],
            'exactAuthorizationParentCommit':os.environ['CONTROL_HEAD'],
            'candidateSeedCount':72,
            'candidateSeedCanonicalSha256':os.environ['CANDIDATE_SEED_CANONICAL'],
            'candidateRowsCanonicalSha256':os.environ['CANDIDATE_ROWS_CANONICAL'],
            'consumedOrdinal41SeedCanonicalSha256':os.environ['CONSUMED_ORDINAL41_SEED_CANONICAL'],
            'consumedPredecessorScientificOrdinal':41,
            'consumedPredecessorRunId':33236295233,
            'consumedPredecessorRunAttempt':1,
            'frozenScientificDesignChanged':False,
            'dispatchAuthorized':False,
            'resultOpeningAuthorized':False,
            'levelBOpeningAuthorized':False,
            'protectedHoldoutOpeningAuthorized':False,
            'productionAuthorized':False,
            'taylorOrJerusalemFitAuthorized':False,
            'githubRerunAllowed':False,
            'retryAllowed':False,
            'resumeAllowed':False,
          }
          for k,v in expected.items():
              if a.get(k)!=v: raise SystemExit(f'authorization proposal drift: {k}: {a.get(k)!r} != {v!r}')
          if r.get('status')!='PASS_RECOVERY_AUTHORIZATION_CONTROL_PROPOSAL_NOT_ALLOCATED_NOT_DISPATCHED' or r.get('controlHead')!=os.environ['CONTROL_HEAD']:
              raise SystemExit('control receipt drift')
          if r.get('authorizationJsonSha256')!=hashlib.sha256(Path(os.environ['AUTH_PATH']).read_bytes()).hexdigest():
              raise SystemExit('authorization bytes differ from reviewed receipt')
          PY

      - name: Rebuild recovery seed ledger and scan exact authorization head
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util, json, sys
          from pathlib import Path
          p=Path('review/aerosol-vertical-profile-sensitivity-v2-postconsumption-seed-freshness-v1/seed_ledger.py')
          s=importlib.util.spec_from_file_location('auth_recovery_seed_ledger',p); m=importlib.util.module_from_spec(s); sys.modules[s.name]=m; s.loader.exec_module(m)
          x=m.validate_ledger()
          if x.get('candidateSeedCount')!=72 or x.get('candidateSeedCanonicalSha256')!='a514212990a94a39d577bd038b631a600e18e4c0f750f781bbd7c99b897228a7':
              raise SystemExit('recovery seed identity drift')
          if x.get('candidateRowsCanonicalSha256')!='8213e65782b62d0e1a0ea51d620016fdcaa24b348e726f5570c54f7f1155a895' or x.get('overlapWithConsumedOrdinal41SeedCount')!=0:
              raise SystemExit('recovery seed row/overlap drift')
          Path('candidate-ledger.TEMP.json').write_text(json.dumps(x,indent=2,sort_keys=True)+'\n')
          Path('empty-policy.TEMP.json').write_text(json.dumps({'schemaVersion':2,'requiredTrackedSelfLedgerPaths':[],'futureEvidenceSelfLedgerPaths':[]},indent=2,sort_keys=True)+'\n')
          PY
          python review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/tracked_tree_seed_scan.py \
            --repo-root . --file-list auth-review-evidence/tracked-files.nul \
            --candidate-seed-ledger candidate-ledger.TEMP.json \
            --allow-self-ledger-json empty-policy.TEMP.json \
            --output auth-review-evidence/tracked-seed-scan.json
          python - <<'PY'
          import json
          x=json.load(open('auth-review-evidence/tracked-seed-scan.json'))
          if x.get('trackedTreeExternalCollisionCount')!=0 or x.get('exactHeadTrackedTreeByteScanPassed') is not True:
              raise SystemExit('authorization-head tracked-tree seed collision')
          PY

      - name: Fresh authorization-head repository-global seed recheck
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python review/aerosol-vertical-profile-sensitivity-v2-postconsumption-seed-freshness-v1/repository_global_seed_scan.py \
            --repository "$GITHUB_REPOSITORY" --issue-number 60 \
            --candidate-seed-ledger candidate-ledger.TEMP.json \
            --current-run-id "$GITHUB_RUN_ID" --audit-mode authorization-recheck \
            --expected-branch-name "$AUTH_BRANCH" --expected-repo-head "$HEAD_SHA" \
            --output auth-review-evidence/repository-global-seed-recheck.json
          python - <<'PY'
          import json, os
          x=json.load(open('auth-review-evidence/repository-global-seed-recheck.json'))
          if x.get('repositoryGlobalCollisionCount')!=0 or x.get('repositoryGlobalDoubleEnumerationStable') is not True:
              raise SystemExit('authorization-head global seed surface is not clean')
          if x.get('repositoryGlobalPostFenceCandidateSeedCollisionCount')!=0:
              raise SystemExit('post-fence candidate seed arrival detected')
          if x.get('auditedBranchName')!=os.environ['AUTH_BRANCH'] or x.get('repositoryHeadExpected')!=os.environ['HEAD_SHA']:
              raise SystemExit('authorization-head seed audit identity drift')
          PY

      - name: Fresh global ordinal review excluding this authorization identity only
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, importlib.util, json, os, sys
          from pathlib import Path
          p=Path('review/aerosol-vertical-profile-sensitivity-v2-postconsumption-preauthorization-v1/preauthorize.py')
          s=importlib.util.spec_from_file_location('auth_recovery_preauth',p); pre=importlib.util.module_from_spec(s); sys.modules[s.name]=pre; s.loader.exec_module(pre)
          _, payload=pre.collect_payload(os.environ['GITHUB_REPOSITORY'],os.environ['GITHUB_TOKEN'])
          ordinal=pre.bound_ordinal_module()
          obs=ordinal.authoritative_global_ordinal_observations(payload,current_run_id=int(os.environ['GITHUB_RUN_ID']))
          branch=os.environ['AUTH_BRANCH']; head=os.environ['HEAD_SHA']; pr=int(os.environ['PR_NUMBER']); target=int(os.environ['PROPOSED_ORDINAL'])
          def allowed_self(row):
              surface=str(row.get('surface') or ''); ident=str(row.get('id') or '')
              if surface=='branch' and ident==branch: return True
              if surface in ('pull-request','pull-request-prose') and ident==str(pr): return True
              if surface=='workflow-run':
                  for run in payload.get('runs',[]):
                      if str(run.get('id') or '')==ident:
                          return str(run.get('head_branch') or '')==branch and str(run.get('head_sha') or '')==head
              return False
          nonself=[]; selfrows=[]
          for row in obs:
              if int(row['ordinal'])==target and allowed_self(row): selfrows.append(row)
              else: nonself.append(row)
          consumed=sorted({int(r['ordinal']) for r in nonself if r.get('reason')=='exact-consumed-marker'})
          if 41 not in consumed: raise SystemExit('ordinal 41 no longer exactly consumed')
          illegal=[r for r in nonself if int(r['ordinal'])==target]
          if illegal: raise SystemExit(f'independent ordinal-{target} reservation/allocation surface exists: {illegal[:5]}')
          observed=max(int(r['ordinal']) for r in nonself)
          if observed+1!=target: raise SystemExit(f'global ordinal surface moved: nonself max={observed}, target={target}')
          names=[str(r.get('name') or '') for r in payload.get('branches',[])]
          if os.environ['DISPATCH_BRANCH'] in names: raise SystemExit('candidate dispatch branch already exists')
          marker=f'ORDINAL{target}_'
          if any(str(r.get('body') or '').strip().upper().startswith(marker) for r in payload.get('issue60Comments',[])):
              raise SystemExit(f'Issue #60 already contains ordinal-{target} marker')
          out={'status':'PASS_POSTCONSUMPTION_RECOVERY_AUTHORIZATION_REVIEW_SELF_ONLY_NOT_ALLOCATED','latestConsumedIncludes41':True,'nonSelfGlobalOrdinalMaxObserved':observed,'scientificOrdinal':target,'allowedSelfObservationCount':len(selfrows),'independentTargetOrdinalObservationCount':0,'dispatchBranchExists':False,'targetIssueMarkerExists':False,'nonSelfOrdinalObservationsCanonicalSha256':hashlib.sha256(json.dumps(nonself,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()}
          Path('auth-review-evidence/authorization-review-live-surface.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY

      - name: Freeze authorization-review receipt
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          live=json.load(open('auth-review-evidence/authorization-review-live-surface.json'))
          r={'schemaVersion':1,'stageId':'aerosol-vertical-profile-sensitivity-v2-postconsumption-authorization-review-v1','status':'PASS_AUTHORIZATION_REVIEWED_NOT_ALLOCATED_NOT_DISPATCHED','authorizationHead':os.environ['HEAD_SHA'],'authorizationParent':os.environ['CONTROL_HEAD'],'scientificOrdinal':int(os.environ['PROPOSED_ORDINAL']),'workflowRunId':int(os.environ['GITHUB_RUN_ID']),'workflowRunAttempt':1,'authorizationJsonSha256':hashlib.sha256(Path(os.environ['AUTH_PATH']).read_bytes()).hexdigest(),'nonSelfOrdinalObservationsCanonicalSha256':live['nonSelfOrdinalObservationsCanonicalSha256'],'scientificOrdinalAllocated':False,'issue60AllocationMarkerCreated':False,'dispatchCreated':False,'scientificRuntimeSetupPerformed':False,'solverExecutionPerformed':False,'resultOpeningPerformed':False,'levelBOpened':False,'productionAuthorized':False,'taylorOrJerusalemUsed':False}
          raw=json.dumps(r,sort_keys=True,separators=(',',':'),allow_nan=False).encode(); r['contentSha256']=hashlib.sha256(raw).hexdigest()
          Path('auth-review-evidence/authorization-review-receipt.json').write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          PY
          rm -f candidate-ledger.TEMP.json empty-policy.TEMP.json

      - name: Upload authorization-review evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aerosol-vertical-profile-sensitivity-v2-postconsumption-authorization-review-v1-evidence
          path: auth-review-evidence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
