name: Review AVPS v2 postconsumption recovery1 publication v1

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-postconsumption-recovery1-science.yml
      - .github/workflows/avps-v2-postconsumption-recovery1-dispatch-publisher.yml
      - .github/workflows/avps-v2-postconsumption-recovery1-publisher-trigger-bridge.yml
      - .github/workflows/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery1-publication-v1-review.yml
      - review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery1-publication-v1/PROTOCOL.md

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: avps-v2-postconsumption-recovery1-publication-v1-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_MAIN: 83ee3dba1ddf371cd0dd30a3e6436ca5049b22b0
      BRANCH: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery1-publication-v1
      SOURCE_PR: '631'
      SOURCE_HEAD: 09844e194588d2453c0844a8993a27b4a05f8943
      SOURCE_RUN: '33251991703'
      SOURCE_GENERIC_RUN: '33251991680'
      SOURCE_ARTIFACT: '9714641331'
      SOURCE_ARTIFACT_DIGEST: sha256:ba6db0039825ef50812fdeb84aa2c86352a675ab09ea21b2b31cc658051b8158
      AUTH_PR: '629'
      AUTH_HEAD: e627a689ada0493a8a5b9cdafc4aba0198fbabec
      AUTH_PARENT: a68f603d6da21cd28ab8324da080cc8ad27f9094
      ALLOCATION_MARKER: ORDINAL42_AVPS_V2_POSTCONSUMPTION_RECOVERY1_AUTHORIZATION_ALLOCATED_REVIEWED_NOT_DISPATCHED commit=e627a689ada0493a8a5b9cdafc4aba0198fbabec parent=a68f603d6da21cd28ab8324da080cc8ad27f9094 pr=629
      CONSUMED_MARKER: ORDINAL42_AVPS_V2_POSTCONSUMPTION_RECOVERY1_DISPATCH_CONSUMED
      EXECUTION_KEY: aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery1:numerical:42
      SCIENCE_PATH: .github/workflows/avps-v2-postconsumption-recovery1-science.yml
      PUBLISHER_PATH: .github/workflows/avps-v2-postconsumption-recovery1-dispatch-publisher.yml
      BRIDGE_PATH: .github/workflows/avps-v2-postconsumption-recovery1-publisher-trigger-bridge.yml
      SCIENCE_SHA256: 04a178e0cc777e0fc090c8bfc6175ad10b4bec56c6f12048428382ea36217878
      SCIENCE_BLOB: 7af7f28269ad245b1b9218012707957b048a6875
      SCIENCE_BYTES: '24265'
      PUBLISHER_SHA256: 114d2d9a8946dd400deb1e0e8a3827efb0ad7287f5ada84ff60d404fe6b24a2a
      PUBLISHER_BLOB: 885abc21c86d3bb0c3777e63b6254520479db34f
      PUBLISHER_BYTES: '13894'
      BRIDGE_SHA256: 29d5a59a7cc41ff9e50e210359ba7dd78033d04fbd43daeb76fe1c430b75b5b2
      BRIDGE_BLOB: 52d60be9c3f219f7fcbc0e692b9c8423cce3a95f
      BRIDGE_BYTES: '6583'
      MANIFEST_SHA256: b93edadc594a9321d00e2b9b6dc0f04f21d68ce20478eb0f0280a88ea33f5f16
      SEED_CANONICAL: a514212990a94a39d577bd038b631a600e18e4c0f750f781bbd7c99b897228a7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact publication-only scope and review safety
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "${{ github.event.pull_request.draft }}" = true
          test "${{ github.event.pull_request.head.ref }}" = "$BRANCH"
          test "${{ github.event.pull_request.base.ref }}" = main
          test "${{ github.event.pull_request.base.sha }}" = "$BASE_MAIN"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git diff --name-only "$BASE_MAIN...HEAD" | sort > changed.txt
          cat > expected.txt <<'PATHS'
          .github/workflows/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery1-publication-v1-review.yml
          .github/workflows/avps-v2-postconsumption-recovery1-dispatch-publisher.yml
          .github/workflows/avps-v2-postconsumption-recovery1-publisher-trigger-bridge.yml
          .github/workflows/avps-v2-postconsumption-recovery1-science.yml
          review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery1-publication-v1/PROTOCOL.md
          PATHS
          sort -o expected.txt expected.txt
          diff -u expected.txt changed.txt
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery1-publication-v1-review.yml')
          lines=p.read_text().splitlines()
          def block(name):
              i=next(i for i,x in enumerate(lines) if x==name+':')
              out=[]
              for x in lines[i+1:]:
                  if x and not x.startswith(' '): break
                  out.append(x)
              return out
          on=block('on'); perms=block('permissions')
          if not any(x.startswith('  pull_request:') for x in on): raise SystemExit('pull_request trigger missing')
          if any(x.startswith(('  workflow_dispatch:','  repository_dispatch:','  push:')) for x in on): raise SystemExit('unsafe trigger')
          if any(x.strip().endswith(': write') for x in perms): raise SystemExit('write permission in review gate')
          uses=[x.strip() for x in lines if x.lstrip().startswith('- uses:')]
          if any('setup-micromamba' in x or 'rubin-libradtran' in x for x in uses): raise SystemExit('runtime install leaked into review gate')
          PY

      - name: Verify exact reviewed artifact bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          H=(-H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28')
          curl -fsSL "${H[@]}" "$api/actions/artifacts/$SOURCE_ARTIFACT" -o artifact.json
          test "$(jq -r .id artifact.json)" = "$SOURCE_ARTIFACT"
          test "$(jq -r .name artifact.json)" = avps-v2-postconsumption-implementation-generator-v1-review
          test "$(jq -r .expired artifact.json)" = false
          test "$(jq -r .workflow_run.id artifact.json)" = "$SOURCE_RUN"
          test "$(jq -r .digest artifact.json)" = "$SOURCE_ARTIFACT_DIGEST"
          curl -fsSL "${H[@]}" -L "$api/actions/artifacts/$SOURCE_ARTIFACT/zip" -o source.zip
          rm -rf source-artifact && mkdir source-artifact && unzip -q source.zip -d source-artifact
          test "$(sha256sum source-artifact/generated-avps-v2-recovery1/MANIFEST.tsv | cut -d' ' -f1)" = "$MANIFEST_SHA256"
          cmp -s "$SCIENCE_PATH" source-artifact/generated-avps-v2-recovery1/avps-v2-postconsumption-recovery1-science.yml
          cmp -s "$PUBLISHER_PATH" source-artifact/generated-avps-v2-recovery1/avps-v2-postconsumption-recovery1-dispatch-publisher.yml
          cmp -s "$BRIDGE_PATH" source-artifact/generated-avps-v2-recovery1/avps-v2-postconsumption-recovery1-publisher-trigger-bridge.yml
          test "$(sha256sum "$SCIENCE_PATH" | cut -d' ' -f1)" = "$SCIENCE_SHA256"
          test "$(git hash-object "$SCIENCE_PATH")" = "$SCIENCE_BLOB"
          test "$(wc -c < "$SCIENCE_PATH" | tr -d ' ')" = "$SCIENCE_BYTES"
          test "$(sha256sum "$PUBLISHER_PATH" | cut -d' ' -f1)" = "$PUBLISHER_SHA256"
          test "$(git hash-object "$PUBLISHER_PATH")" = "$PUBLISHER_BLOB"
          test "$(wc -c < "$PUBLISHER_PATH" | tr -d ' ')" = "$PUBLISHER_BYTES"
          test "$(sha256sum "$BRIDGE_PATH" | cut -d' ' -f1)" = "$BRIDGE_SHA256"
          test "$(git hash-object "$BRIDGE_PATH")" = "$BRIDGE_BLOB"
          test "$(wc -c < "$BRIDGE_PATH" | tr -d ' ')" = "$BRIDGE_BYTES"

      - name: Recheck source, authorization, allocation and one-use fence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          H=(-H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28')
          curl -fsSL "${H[@]}" "$api/pulls/$SOURCE_PR" -o source-pr.json
          test "$(jq -r .state source-pr.json)" = open
          test "$(jq -r .draft source-pr.json)" = true
          test "$(jq -r .merged source-pr.json)" = false
          test "$(jq -r .head.sha source-pr.json)" = "$SOURCE_HEAD"
          for row in "$SOURCE_RUN:$SOURCE_HEAD" "$SOURCE_GENERIC_RUN:$SOURCE_HEAD"; do
            id="${row%%:*}"; sha="${row#*:}"
            curl -fsSL "${H[@]}" "$api/actions/runs/$id" -o run.json
            test "$(jq -r .run_attempt run.json)" = 1
            test "$(jq -r .status run.json)" = completed
            test "$(jq -r .conclusion run.json)" = success
            test "$(jq -r .head_sha run.json)" = "$sha"
          done
          curl -fsSL "${H[@]}" "$api/pulls/$AUTH_PR" -o auth-pr.json
          test "$(jq -r .state auth-pr.json)" = open
          test "$(jq -r .draft auth-pr.json)" = true
          test "$(jq -r .merged auth-pr.json)" = false
          test "$(jq -r .head.sha auth-pr.json)" = "$AUTH_HEAD"
          test "$(jq -r .base.sha auth-pr.json)" = "$AUTH_PARENT"
          : > comments.txt
          for page in $(seq 1 30); do
            curl -fsSL "${H[@]}" "$api/issues/60/comments?per_page=100&page=$page" -o page.json
            jq -r '.[].body' page.json >> comments.txt
            test "$(jq length page.json)" = 100 || break
          done
          test "$(grep -Fxc "$ALLOCATION_MARKER" comments.txt)" = 1
          test "$(grep -Fxc "$CONSUMED_MARKER" comments.txt || true)" = 0
          code="$(curl -sS -o /dev/null -w '%{http_code}' "${H[@]}" "$api/git/ref/heads/dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery1-ordinal-42")"
          test "$code" = 404
          : > runs.ndjson
          for page in $(seq 1 30); do
            curl -fsSL "${H[@]}" "$api/actions/runs?event=workflow_dispatch&per_page=100&page=$page" -o runs.json
            jq -c '.workflow_runs[]' runs.json >> runs.ndjson
            test "$(jq '.workflow_runs|length' runs.json)" = 100 || break
          done
          if grep -Fq 'avps-v2-postconsumption-recovery1-science' runs.ndjson || grep -Fq "$EXECUTION_KEY" runs.ndjson; then
            echo 'recovery science workflow_dispatch already exists' >&2; exit 1
          fi

      - name: Prove frozen identity and scientific-design boundaries
        shell: bash
        run: |
          set -euo pipefail
          cat "$SCIENCE_PATH" "$PUBLISHER_PATH" "$BRIDGE_PATH" > published-workflows.txt
          grep -Fq "$EXECUTION_KEY" published-workflows.txt
          grep -Fq "$CONSUMED_MARKER" published-workflows.txt
          grep -Fq "$SEED_CANONICAL" published-workflows.txt
          grep -Eq '20_000_000|20000000' "$SCIENCE_PATH"
          grep -Fq 'len(cases)!=360' "$SCIENCE_PATH"
          grep -Fq 'len(v)!=90' "$SCIENCE_PATH"
          grep -Fq "auth.get('resultOpeningAuthorized') is not False" "$SCIENCE_PATH"
          grep -Fq "auth.get('productionAuthorized') is not False" "$SCIENCE_PATH"
          grep -Fq 'githubRerun' "$SCIENCE_PATH"
          grep -Fq 'retryAllowed' "$SCIENCE_PATH"
          grep -Fq 'resumeAllowed' "$SCIENCE_PATH"
          grep -Fq "SCIENTIFIC_ORDINAL: '42'" published-workflows.txt
          if grep -Eq 'authorization/aerosol-vertical-profile-sensitivity-v2-ordinal-41|dispatch/aerosol-vertical-profile-sensitivity-v2-ordinal-41|ORDINAL41_AVPS_V2_DISPATCH_CONSUMED|ordinal-41|02f624d582e9b2caba6b920d65a5e8a8bc8fc1a2693623bc2f73abf5d3f706d2' published-workflows.txt; then
            echo 'consumed ordinal-41 identity leaked into publication' >&2; exit 1
          fi

      - name: Emit publication-only review receipt
        shell: bash
        run: |
          set -euo pipefail
          cat > publication-review-receipt.json <<EOFJSON
          {"schemaVersion":1,"status":"PASS_AVPS_V2_POSTCONSUMPTION_RECOVERY1_PUBLICATION_REVIEW_ONLY","baseMain":"$BASE_MAIN","publicationHead":"${{ github.event.pull_request.head.sha }}","sourcePr":$SOURCE_PR,"sourceHead":"$SOURCE_HEAD","sourceReviewRun":$SOURCE_RUN,"sourceArtifact":$SOURCE_ARTIFACT,"sourceArtifactDigest":"$SOURCE_ARTIFACT_DIGEST","scientificOrdinal":42,"scienceWorkflowSha256":"$SCIENCE_SHA256","publisherWorkflowSha256":"$PUBLISHER_SHA256","triggerBridgeWorkflowSha256":"$BRIDGE_SHA256","publicationOnly":true,"scientificRuntime":false,"solver":false,"dispatch":false,"results":false,"levelB":false,"production":false,"taylorOrJerusalem":false}
          EOFJSON

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: avps-v2-postconsumption-recovery1-publication-v1-review
          path: |
            publication-review-receipt.json
            changed.txt
            expected.txt
            artifact.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
