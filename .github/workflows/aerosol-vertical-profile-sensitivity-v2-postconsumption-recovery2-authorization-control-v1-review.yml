name: Review AVPS v2 recovery2 authorization control

on:
  pull_request:
    types: [opened]
    branches:
      - review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-preauthorization-v1
    paths:
      - .github/workflows/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-authorization-control-v1-review.yml
      - review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-authorization-control-v1/PROTOCOL.md

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: avps-v2-recovery2-auth-control-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BASE_MAIN: 09f3fbdefea6dd5ce68fdc0010347e5bfb28ff75
      BASE_BRANCH: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-preauthorization-v1
      BASE_HEAD: 0b5bbdc01275d6024809e2cf0f819712db766150
      CONTROL_BRANCH: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-authorization-control-v1
      AUTH_BRANCH: authorization/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-ordinal-43
      DISPATCH_BRANCH: dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-ordinal-43
      SEED_PR: '639'
      SEED_HEAD: 12b6b80853b41d768e220772d3a93cf5a7a6ed54
      SEED_RUN: '33260810647'
      SEED_ARTIFACT: '9717283554'
      SEED_DIGEST: sha256:0295c1e76e68f4436430a7b01bce5fa1138c15cb4a4061cd227c56620a00b89a
      PREAUTH_PR: '640'
      PREAUTH_HEAD: 0b5bbdc01275d6024809e2cf0f819712db766150
      PREAUTH_RUN: '33263522378'
      PREAUTH_ARTIFACT: '9718106095'
      PREAUTH_DIGEST: sha256:b5f76ba795d6b8208e596dd8a66e2fbd65fc6a7d16ed95c4ebba1269b939ed60
      PREAUTH_CONTRACT: '33263522344'
      RECOVERY2_TRANSPORT_PR: '638'
      RECOVERY2_TRANSPORT_HEAD: ccb3df801d472a3fed539cc4291005ff181bc78b
      RECOVERY2_TRANSPORT_REVIEW_RUN: '33260342729'
      ORDINAL41_RUN: '33236295233'
      ORDINAL42_RUN: '33259899524'
      ORDINAL42_AUTH_HEAD: e627a689ada0493a8a5b9cdafc4aba0198fbabec
      CANDIDATE_SEED_CANONICAL: 38c074fe01bd6d09fa7dc78af1ad323e2f42b606ca992c2950b8fc1f5b343a9f
      CANDIDATE_ROWS_CANONICAL: a88b28dcfaaeb354f294d1705a0f8ddbcd061083f277a038ab8c9dace44d9954
      ORDINAL41_SEED_CANONICAL: 02f624d582e9b2caba6b920d65a5e8a8bc8fc1a2693623bc2f73abf5d3f706d2
      ORDINAL42_SEED_CANONICAL: a514212990a94a39d577bd038b631a600e18e4c0f750f781bbd7c99b897228a7
      QUIET_PREFIX: WRITE_QUIET_BEGIN | AVPS_V2_POSTCONSUMPTION_RECOVERY2_AUTH_CONTROL_GLOBAL_SCAN

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Bind exact control identity and write-quiet fence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "${{ github.event.action }}" = opened
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$PR_BRANCH" = "$CONTROL_BRANCH"
          test "${{ github.event.pull_request.base.ref }}" = "$BASE_BRANCH"
          test "${{ github.event.pull_request.base.sha }}" = "$BASE_HEAD"
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          git merge-base --is-ancestor "$BASE_HEAD" "$PR_HEAD"
          git fetch origin main "$BASE_BRANCH"
          test "$(git rev-parse origin/main)" = "$BASE_MAIN"
          test "$(git rev-parse origin/$BASE_BRANCH)" = "$BASE_HEAD"
          git diff --name-only "$BASE_HEAD...$PR_HEAD" | sort > changed-paths.txt
          python - <<'PY'
          from pathlib import Path
          expected={
            '.github/workflows/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-authorization-control-v1-review.yml',
            'review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-authorization-control-v1/PROTOCOL.md',
          }
          got={x for x in Path('changed-paths.txt').read_text().splitlines() if x}
          if got != expected: raise SystemExit(f'exact two-path control scope required; got {sorted(got)}')
          PY
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > current-pr.json
          python - <<'PY'
          import json,os
          p=json.load(open('current-pr.json'))
          if p['state']!='open' or p['draft'] is not True or p['merged_at'] is not None: raise SystemExit('control PR must be Draft/open/unmerged')
          if p['head']['sha']!=os.environ['PR_HEAD'] or p['base']['sha']!=os.environ['BASE_HEAD']: raise SystemExit('control PR identity drift')
          PY
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > issue60-pages.json
          python - <<'PY'
          import json,os
          pages=json.load(open('issue60-pages.json')); comments=[r for page in pages for r in page]
          wanted=os.environ['QUIET_PREFIX']+f" | branch={os.environ['CONTROL_BRANCH']} | head={os.environ['PR_HEAD']}"
          matches=[r for r in comments if str(r.get('body') or '').startswith(wanted)]
          if len(matches)!=1: raise SystemExit(f'exact write-quiet begin marker required once; found {len(matches)}')
          end_prefix='WRITE_QUIET_END | AVPS_V2_POSTCONSUMPTION_RECOVERY2_AUTH_CONTROL_GLOBAL_SCAN'
          if any(str(r.get('body') or '').startswith(end_prefix) and f"head={os.environ['PR_HEAD']}" in str(r.get('body') or '') for r in comments):
              raise SystemExit('write-quiet fence already ended before review')
          PY
          test -z "$(command -v uvspec || true)"
          mkdir -p review-evidence
          git ls-files -z > review-evidence/tracked-files.nul

      - name: Bind immutable predecessor proofs and consumed failures
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for spec in \
            "$SEED_PR:$SEED_HEAD:$SEED_RUN:$SEED_ARTIFACT:$SEED_DIGEST" \
            "$PREAUTH_PR:$PREAUTH_HEAD:$PREAUTH_RUN:$PREAUTH_ARTIFACT:$PREAUTH_DIGEST"; do
            IFS=: read -r pr head run artifact digest_algo digest_hex <<< "$spec"
            digest="$digest_algo:$digest_hex"
            gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" > proof-pr.json
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" > proof-run.json
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact" > proof-artifact.json
            WANT_HEAD="$head" WANT_RUN="$run" WANT_ARTIFACT="$artifact" WANT_DIGEST="$digest" python - <<'PY'
          import json,os
          p=json.load(open('proof-pr.json')); r=json.load(open('proof-run.json')); a=json.load(open('proof-artifact.json'))
          if p['head']['sha']!=os.environ['WANT_HEAD']: raise SystemExit('proof PR head drift')
          if r['id']!=int(os.environ['WANT_RUN']) or r['head_sha']!=os.environ['WANT_HEAD'] or r['run_attempt']!=1 or r['conclusion']!='success': raise SystemExit('proof run drift')
          if a['id']!=int(os.environ['WANT_ARTIFACT']) or a.get('digest')!=os.environ['WANT_DIGEST'] or a.get('expired'): raise SystemExit('proof artifact drift')
          PY
          done
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREAUTH_CONTRACT" > preauth-contract.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/$RECOVERY2_TRANSPORT_PR" > transport-pr.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECOVERY2_TRANSPORT_REVIEW_RUN" > transport-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORDINAL41_RUN" > ordinal41-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORDINAL42_RUN" > ordinal42-run.json
          python - <<'PY'
          import json,os
          c=json.load(open('preauth-contract.json')); p=json.load(open('transport-pr.json')); t=json.load(open('transport-run.json')); r41=json.load(open('ordinal41-run.json')); r42=json.load(open('ordinal42-run.json'))
          if c['id']!=int(os.environ['PREAUTH_CONTRACT']) or c['head_sha']!=os.environ['PREAUTH_HEAD'] or c['run_attempt']!=1 or c['conclusion']!='success': raise SystemExit('preauth generic contract drift')
          if p.get('merged_at') is None or p['head']['sha']!=os.environ['RECOVERY2_TRANSPORT_HEAD']: raise SystemExit('recovery2 transport preregistration not merged/bound')
          if t['id']!=int(os.environ['RECOVERY2_TRANSPORT_REVIEW_RUN']) or t['head_sha']!=os.environ['RECOVERY2_TRANSPORT_HEAD'] or t['run_attempt']!=1 or t['conclusion']!='success': raise SystemExit('recovery2 transport review drift')
          for r,n in ((r41,41),(r42,42)):
              if r['run_attempt']!=1 or r['conclusion']!='failure': raise SystemExit(f'consumed ordinal-{n} failure identity drift')
          PY

      - name: Rebuild recovery2 candidate ledger at native historical path
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach historical-ordinal42 "$ORDINAL42_AUTH_HEAD"
          export AVPS_ORDINAL42_LEDGER_PATH="$PWD/historical-ordinal42/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-seed-freshness-v1/seed_ledger.py"
          test "$(git --git-dir=.git worktree list --porcelain | grep -c '^worktree ' || true)" -ge 2
          python - <<'PY'
          import importlib.util,json,os,sys
          from pathlib import Path
          p=Path('review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-seed-freshness-v1/seed_ledger.py')
          s=importlib.util.spec_from_file_location('recovery2_auth_control_seed_ledger',p); m=importlib.util.module_from_spec(s); sys.modules[s.name]=m; s.loader.exec_module(m)
          x=m.validate_ledger()
          expected={
            'candidateSeedCount':72,
            'candidateSeedCanonicalSha256':os.environ['CANDIDATE_SEED_CANONICAL'],
            'candidateRowsCanonicalSha256':os.environ['CANDIDATE_ROWS_CANONICAL'],
            'consumedOrdinal41SeedCanonicalSha256':os.environ['ORDINAL41_SEED_CANONICAL'],
            'consumedOrdinal42SeedCanonicalSha256':os.environ['ORDINAL42_SEED_CANONICAL'],
            'overlapWithConsumedOrdinal41SeedCount':0,
            'overlapWithConsumedOrdinal42SeedCount':0,
            'historicalOrdinal42LedgerValidatedAtNativePath':True,
          }
          for k,v in expected.items():
              if x.get(k)!=v: raise SystemExit(f'recovery2 ledger drift {k}: {x.get(k)!r} != {v!r}')
          Path('candidate-ledger.TEMP.json').write_text(json.dumps(x,indent=2,sort_keys=True)+'\n')
          Path('empty-policy.TEMP.json').write_text(json.dumps({'schemaVersion':2,'requiredTrackedSelfLedgerPaths':[],'futureEvidenceSelfLedgerPaths':[]},indent=2,sort_keys=True)+'\n')
          PY
          python review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/tracked_tree_seed_scan.py \
            --repo-root . --file-list review-evidence/tracked-files.nul \
            --candidate-seed-ledger candidate-ledger.TEMP.json \
            --allow-self-ledger-json empty-policy.TEMP.json \
            --output review-evidence/tracked-seed-scan.json
          python - <<'PY'
          import json
          x=json.load(open('review-evidence/tracked-seed-scan.json'))
          if x.get('trackedTreeExternalCollisionCount')!=0 or x.get('exactHeadTrackedTreeByteScanPassed') is not True: raise SystemExit('control-head tracked-tree seed collision')
          PY

      - name: Fresh repository-global seed and dynamic ordinal fences
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-seed-freshness-v1/repository_global_seed_scan.py \
            --repository "$GITHUB_REPOSITORY" --issue-number 60 \
            --candidate-seed-ledger candidate-ledger.TEMP.json \
            --current-run-id "$GITHUB_RUN_ID" --audit-mode authorization-recheck \
            --expected-branch-name "$CONTROL_BRANCH" --expected-repo-head "$PR_HEAD" \
            --output review-evidence/repository-global-seed-recheck.json
          python - <<'PY'
          import importlib.util,json,os,re,sys
          from pathlib import Path
          seed=json.load(open('review-evidence/repository-global-seed-recheck.json'))
          expected={'auditMode':'authorization-recheck','candidateSeedCount':72,'repositoryGlobalCollisionCount':0,'repositoryGlobalCollisionSurfaceScanPassed':True,'repositoryGlobalDoubleEnumerationStable':True,'auditedBranchName':os.environ['CONTROL_BRANCH'],'repositoryHeadExpected':os.environ['PR_HEAD'],'auditedBranchHeadShaObserved':os.environ['PR_HEAD'],'auditedBranchHeadMatchesRepositoryHead':True,'repositoryGlobalPostFenceCandidateSeedCollisionCount':0}
          for k,v in expected.items():
              if seed.get(k)!=v: raise SystemExit(f'fresh seed surface drift {k}: {seed.get(k)!r} != {v!r}')
          for k in ('repositoryGlobalStableContextSha256','repositoryGlobalSnapshotFenceSha256'):
              if re.fullmatch(r'[0-9a-f]{64}',str(seed.get(k) or '')) is None: raise SystemExit('malformed seed-fence hash')
          p=Path('review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-preauthorization-v1/preauthorize.py')
          s=importlib.util.spec_from_file_location('recovery2_auth_control_preauth',p); m=importlib.util.module_from_spec(s); sys.modules[s.name]=m; s.loader.exec_module(m)
          _,payload=m.collect_payload(os.environ['GITHUB_REPOSITORY'],os.environ['GITHUB_TOKEN'])
          ordinal=m.ordinal_surface(payload,int(os.environ['GITHUB_RUN_ID'])); observations=ordinal.pop('observations')
          if ordinal['latestConsumedScientificOrdinal']!=42 or ordinal['occupiedMaxScientificOrdinal']!=42 or ordinal['nextAvailableScientificOrdinal']!=43: raise SystemExit('fresh dynamic ordinal surface is not consumed42 -> successor43')
          if ordinal['authorizationBranch']!=os.environ['AUTH_BRANCH'] or ordinal['dispatchBranch']!=os.environ['DISPATCH_BRANCH']: raise SystemExit('recovery2 ref proposal drift')
          Path('review-evidence/ordinal-surface.json').write_text(json.dumps(ordinal,indent=2,sort_keys=True)+'\n')
          Path('review-evidence/ordinal-observations.json').write_text(json.dumps(observations,indent=2,sort_keys=True)+'\n')
          PY

      - name: Materialize recovery2 authorization proposal as artifact only
        shell: bash
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          seed=json.load(open('review-evidence/repository-global-seed-recheck.json')); ordinal=json.load(open('review-evidence/ordinal-surface.json'))
          profiles={
            'opac-profile-antarctic':'ee063c6dca68cf9a31d8bb9d993f1fed5cb34c8bb056ac180c97171b5d6b4f19',
            'opac-profile-arctic':'98f2fa5428c830764252fd0a2662b0f5c957fc027ffcb7bdc0a5e500dfd7d3d6',
            'opac-profile-continental-average':'ceed598f7681951cd0e6208b267beb5b41a52ab10311f37ce76f925700caff3d',
            'opac-profile-desert':'2b4d2e03c6ae3143d9bb05d2da49f57f75172dc1f24d34f7d4a4939bf9952fef',
            'opac-profile-maritime-clean':'487b67bd7dbe89d12d032fdf2b33cab545e16a2e0697170648317f1a76362a67',
          }
          a={
            'schemaVersion':2,
            'stageId':'aerosol-vertical-profile-sensitivity-v2',
            'recoveryStageId':'aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2',
            'status':'AUTHORIZED_POSTCONSUMPTION_RECOVERY_PENDING_SEPARATE_DISPATCH_AND_TRANSPORT_IMPLEMENTATION',
            'scientificOrdinal':43,
            'consumedPredecessorScientificOrdinal':42,
            'consumedPredecessorRunId':33259899524,
            'consumedPredecessorRunAttempt':1,
            'consumedPredecessorFailureClass':'PRE_SOLVER_RELOCATED_SEED_LEDGER_PATH_CONTEXT_NO_SCIENTIFIC_RESULT',
            'consumedPredecessors':[
              {'scientificOrdinal':41,'runId':33236295233,'runAttempt':1,'failureClass':'PRE_SOLVER_RUNTIME_SUPPORT_TRANSPORT_OMISSION_NO_SCIENTIFIC_RESULT','reusable':False},
              {'scientificOrdinal':42,'runId':33259899524,'runAttempt':1,'failureClass':'PRE_SOLVER_RELOCATED_SEED_LEDGER_PATH_CONTEXT_NO_SCIENTIFIC_RESULT','reusable':False},
            ],
            'authorizationBranch':os.environ['AUTH_BRANCH'],
            'dispatchBranch':os.environ['DISPATCH_BRANCH'],
            'executionKey':'aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2:numerical:43',
            'exactAuthorizationParentCommit':os.environ['PR_HEAD'],
            'exactAuthorizationCommit':None,
            'reviewPackageMainSha':os.environ['BASE_MAIN'],
            'seedReviewPr':639,'seedReviewHead':os.environ['SEED_HEAD'],'seedReviewRunId':33260810647,'seedReviewArtifactId':9717283554,'seedReviewArtifactDigest':os.environ['SEED_DIGEST'],
            'preauthorizationPr':640,'preauthorizationHead':os.environ['PREAUTH_HEAD'],'preauthorizationRunId':33263522378,'preauthorizationArtifactId':9718106095,'preauthorizationArtifactDigest':os.environ['PREAUTH_DIGEST'],'preauthorizationRepositoryContractRunId':33263522344,
            'recovery2TransportPr':638,'recovery2TransportHead':os.environ['RECOVERY2_TRANSPORT_HEAD'],'recovery2TransportReviewRunId':33260342729,
            'scienceTransportImplementationRequiredBeforeDispatch':True,
            'nativeHistoricalOrdinal42LedgerRequired':True,
            'nextOrdinalHardCoded':False,
            'candidateSeedCount':72,
            'candidateSeedCanonicalSha256':os.environ['CANDIDATE_SEED_CANONICAL'],
            'candidateRowsCanonicalSha256':os.environ['CANDIDATE_ROWS_CANONICAL'],
            'consumedOrdinal41SeedCanonicalSha256':os.environ['ORDINAL41_SEED_CANONICAL'],
            'consumedOrdinal42SeedCanonicalSha256':os.environ['ORDINAL42_SEED_CANONICAL'],
            'candidateSeedValuesIncluded':False,
            'candidateSeedsAppliedToTrackedCases':False,
            'candidateSeedsAuthorizedForLaterInMemoryApplication':True,
            'freshAuthorizationSeedStableContextSha256':seed['repositoryGlobalStableContextSha256'],
            'freshAuthorizationSeedSnapshotFenceSha256':seed['repositoryGlobalSnapshotFenceSha256'],
            'freshAuthorizationOrdinalObservationsCanonicalSha256':ordinal['ordinalObservationsCanonicalSha256'],
            'exactFourSpeciesProfileSha256':profiles,
            'fourAliasDataTreeSha256':'5e1814dd36cf861fd85477a97607299248f8272268df7bf428d31bbb6aa4354a',
            'lockedLibRadtranPackage':'rubin-libradtran=2.0.6=py312pl5321he9373c2_1',
            'uvspecSha256':'2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3',
            'baseDataTreeSha256':'ad30b49177e9c84e46497d69faf0c75e466996b0d0003f1de210289ae9f847d7',
            'archiveStagedDataTreeSha256':'5d8bbf8e6b91ec3d405dee36f21a94afbb6e5ec6cd67da2dd5dd541738199d80',
            'officialOptpropArchiveSha256':'11daa1f1f4be0fd4ddf7e881ec2005498049674a1540d37b4b1e8f5e16052c7e',
            'afglUsSha256':'dab26290ed81c762ed0c607e5dc2d53393c1462a0c3a528bc5e3f5935191cfb5',
            'restoredRhAuditDependencyGitBlobSha1':'095ff86f12a79dc312a51f734b0a03bd318f2337',
            'caseCount':360,'commonRandomNumberGroupCount':72,'statesPerGroup':5,'photonHistoriesPerCase':20000000,
            'frozenScientificDesignChanged':False,
            'scientificExecutionAuthorized':True,'solverExecutionAuthorized':True,
            'dispatchAuthorized':False,'automaticDispatch':False,'consumed':False,
            'resultOpeningAuthorized':False,'levelBOpeningAuthorized':False,'protectedHoldoutOpeningAuthorized':False,
            'productionAuthorized':False,'taylorOrJerusalemFitAuthorized':False,
            'githubRerunAllowed':False,'retryAllowed':False,'resumeAllowed':False,'workflowRunAttemptRequired':1,
          }
          raw=json.dumps(a,sort_keys=True,separators=(',',':'),allow_nan=False).encode(); a['authorizationDocumentContentSha256']=hashlib.sha256(raw).hexdigest()
          Path('review-evidence/authorization.json').write_text(json.dumps(a,indent=2,sort_keys=True)+'\n')
          receipt={
            'schemaVersion':1,
            'status':'PASS_RECOVERY2_AUTHORIZATION_CONTROL_PROPOSAL_NOT_ALLOCATED_NOT_DISPATCHED',
            'controlHead':os.environ['PR_HEAD'],
            'scientificOrdinalProposed':43,
            'consumedPredecessorOrdinals':[41,42],
            'authorizationJsonSha256':hashlib.sha256(Path('review-evidence/authorization.json').read_bytes()).hexdigest(),
            'candidateSeedCanonicalSha256':os.environ['CANDIDATE_SEED_CANONICAL'],
            'candidateRowsCanonicalSha256':os.environ['CANDIDATE_ROWS_CANONICAL'],
            'scientificOrdinalAllocated':False,'authorizationBranchCreated':False,'dispatchCreated':False,
            'scientificRuntimeSetupPerformed':False,'solverExecutionPerformed':False,'resultOpeningPerformed':False,
            'levelBOpened':False,'productionAuthorized':False,'taylorOrJerusalemUsed':False,
          }
          raw=json.dumps(receipt,sort_keys=True,separators=(',',':'),allow_nan=False).encode(); receipt['contentSha256']=hashlib.sha256(raw).hexdigest()
          Path('review-evidence/control-review-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          rm -f candidate-ledger.TEMP.json empty-policy.TEMP.json
          git worktree remove --force historical-ordinal42

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-authorization-control-v1
          path: review-evidence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
