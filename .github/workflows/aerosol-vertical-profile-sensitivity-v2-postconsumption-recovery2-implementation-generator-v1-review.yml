name: Review AVPS v2 postconsumption recovery2 implementation generator v1

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    paths:
      - .github/workflows/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-implementation-generator-v1-review.yml
      - review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-implementation-generator-v1/generate_recovery_workflows.py
      - review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-implementation-generator-v1/PROTOCOL.md

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: avps-v2-postconsumption-recovery2-implementation-generator-v1-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BASE_MAIN: db4c2574bcdf839f5112e1ca3c0242ff35b7880f
      BRANCH: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-implementation-generator-v1
      GENERATOR: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-implementation-generator-v1/generate_recovery_workflows.py
      CONTROL: review/avps-v2-recovery2-ordinal43-execution-control-v1/execution-delta.review.json
      AUTH_BRANCH: authorization/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-ordinal-43
      AUTH_HEAD: 5fd0c82cb14a02ace38a5a7be30b8b075ccae298
      AUTH_PARENT: 0842dd27f62c4bc2af4b5763ae4dd547ee009fce
      AUTH_PR: '647'
      AUTH_REVIEW_RUN: '33277629404'
      AUTH_REVIEW_ARTIFACT: '9722104370'
      AUTH_REVIEW_DIGEST: sha256:9dac9e9305b78e2ddbceacbc10a19435121b0eeacfe48550d23878359556ae15
      AUTH_PATH: review/avps-v2-recovery2-posttransport-authorization-control-recovery-v1/authorization.json
      AUTH_BLOB: 9db4602cd2877161b9c4d6d5ffad27409c52dd3f
      AUTH_SEED_PATH: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-seed-freshness-v1/seed_ledger.py
      AUTH_SEED_BLOB: d4bdc95e9ed576fa6c70711c81d8097ddab33dbf
      HISTORICAL_BRANCH: authorization/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery1-ordinal-42
      HISTORICAL_HEAD: e627a689ada0493a8a5b9cdafc4aba0198fbabec
      HISTORICAL_SEED_PATH: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-seed-freshness-v1/seed_ledger.py
      HISTORICAL_SEED_BLOB: 491d1b6653bea0fcc5275269723a76aa1af52300
      NATIVE_HELPER: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-science-transport-v1/native_authorization_seed_transport.py
      NATIVE_HELPER_BLOB: 2df2c3fd1ffa78e16f44e6825d67b3e82e903c1e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Prove exact review-only scope and frozen source bindings
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "${{ github.event.pull_request.number }}" = 653
          test "${{ github.event.pull_request.draft }}" = false
          test "${{ github.event.pull_request.head.ref }}" = "$BRANCH"
          test "${{ github.event.pull_request.base.ref }}" = main
          test "${{ github.event.pull_request.base.sha }}" = "$BASE_MAIN"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git diff --name-only "$BASE_MAIN...HEAD" | sort > changed.txt
          cat > expected.txt <<'EOF'
          .github/workflows/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-implementation-generator-v1-review.yml
          review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-implementation-generator-v1/PROTOCOL.md
          review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-implementation-generator-v1/generate_recovery_workflows.py
          EOF
          sort -o expected.txt expected.txt
          diff -u expected.txt changed.txt

          test "$(git rev-parse "$BASE_MAIN:$CONTROL")" = 005d0f2f531d613f24da019382cf66b9867709d1
          test "$(git rev-parse "$BASE_MAIN:.github/workflows/avps-v2-postconsumption-recovery1-science.yml")" = 7af7f28269ad245b1b9218012707957b048a6875
          test "$(git rev-parse "$BASE_MAIN:.github/workflows/avps-v2-postconsumption-recovery1-dispatch-publisher.yml")" = 885abc21c86d3bb0c3777e63b6254520479db34f
          test "$(git rev-parse "$BASE_MAIN:.github/workflows/avps-v2-postconsumption-recovery1-publisher-trigger-bridge.yml")" = 52d60be9c3f219f7fcbc0e692b9c8423cce3a95f
          test "$(git rev-parse "$BASE_MAIN:$NATIVE_HELPER")" = "$NATIVE_HELPER_BLOB"
          test -z "$(command -v uvspec || true)"

          git fetch origin "refs/heads/$AUTH_BRANCH:refs/remotes/origin/$AUTH_BRANCH" "refs/heads/$HISTORICAL_BRANCH:refs/remotes/origin/$HISTORICAL_BRANCH"
          test "$(git rev-parse origin/$AUTH_BRANCH)" = "$AUTH_HEAD"
          test "$(git rev-parse origin/$HISTORICAL_BRANCH)" = "$HISTORICAL_HEAD"
          test "$(git rev-parse "$AUTH_HEAD:$AUTH_PATH")" = "$AUTH_BLOB"
          test "$(git rev-parse "$AUTH_HEAD:$AUTH_SEED_PATH")" = "$AUTH_SEED_BLOB"
          test "$(git rev-parse "$HISTORICAL_HEAD:$HISTORICAL_SEED_PATH")" = "$HISTORICAL_SEED_BLOB"
          mapfile -t PARENTS < <(git cat-file -p "$AUTH_HEAD" | sed -n 's/^parent //p')
          test "${#PARENTS[@]}" = 1
          test "${PARENTS[0]}" = "$AUTH_PARENT"

          gh api "repos/$GITHUB_REPOSITORY/pulls/$AUTH_PR" > auth-pr.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$AUTH_REVIEW_RUN" > auth-review-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$AUTH_REVIEW_ARTIFACT" > auth-review-artifact.json
          python - <<'PY'
          import json,os
          p=json.load(open('auth-pr.json'))
          if p['number']!=647 or p['state']!='open' or p['draft'] is not True or p.get('merged_at') is not None: raise SystemExit('authorization PR state drift')
          if p['head']['sha']!=os.environ['AUTH_HEAD'] or p['base']['sha']!=os.environ['AUTH_PARENT']: raise SystemExit('authorization PR identity drift')
          r=json.load(open('auth-review-run.json'))
          if r['id']!=int(os.environ['AUTH_REVIEW_RUN']) or r['head_sha']!=os.environ['AUTH_HEAD'] or r['run_attempt']!=1 or r['status']!='completed' or r['conclusion']!='success': raise SystemExit('authorization review drift')
          a=json.load(open('auth-review-artifact.json'))
          if a['id']!=int(os.environ['AUTH_REVIEW_ARTIFACT']) or a.get('digest')!=os.environ['AUTH_REVIEW_DIGEST'] or a.get('expired'): raise SystemExit('authorization review artifact drift')
          PY

      - name: Generate and validate recovery2 candidate workflows without activation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile "$GENERATOR"
          rm -rf generated-avps-v2-recovery2
          python "$GENERATOR"
          test -s generated-avps-v2-recovery2/avps-v2-postconsumption-recovery2-science.yml
          test -s generated-avps-v2-recovery2/avps-v2-postconsumption-recovery2-dispatch-publisher.yml
          test -s generated-avps-v2-recovery2/avps-v2-postconsumption-recovery2-publisher-trigger-bridge.yml
          test -s generated-avps-v2-recovery2/MANIFEST.tsv
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('generated-avps-v2-recovery2')
          science_path=root/'avps-v2-postconsumption-recovery2-science.yml'
          publisher_path=root/'avps-v2-postconsumption-recovery2-dispatch-publisher.yml'
          bridge_path=root/'avps-v2-postconsumption-recovery2-publisher-trigger-bridge.yml'
          science=science_path.read_text(); publisher=publisher_path.read_text(); bridge=bridge_path.read_text()
          alltext='\n'.join((science,publisher,bridge))
          required=[
            'authorization/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-ordinal-43',
            '5fd0c82cb14a02ace38a5a7be30b8b075ccae298',
            '0842dd27f62c4bc2af4b5763ae4dd547ee009fce',
            'aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2:numerical:43',
            'ORDINAL43_AVPS_V2_POSTCONSUMPTION_RECOVERY2_DISPATCH_CONSUMED',
            '38c074fe01bd6d09fa7dc78af1ad323e2f42b606ca992c2950b8fc1f5b343a9f',
            'a88b28dcfaaeb354f294d1705a0f8ddbcd061083f277a038ab8c9dace44d9954',
            'native_authorization_seed_transport.py',
            '2df2c3fd1ffa78e16f44e6825d67b3e82e903c1e',
            'PASS_GLOBAL_ORDINAL43_ALLOCATED_NOT_CONSUMED_PRE_DISPATCH',
          ]
          for x in required:
              if x not in alltext: raise SystemExit(f'missing recovery2 binding: {x}')
          if 'execution-preflight/recovery-seed-ledger.py' in science: raise SystemExit('science still relocates authorization seed ledger before validation')
          if 'dispatch-evidence/recovery-seed-ledger.py' in publisher: raise SystemExit('publisher still relocates authorization seed ledger before validation')
          for text,label in ((science,'science'),(publisher,'publisher')):
              for x in ('--authorization-ledger-path "$AUTH_SEED_LEDGER_PATH"','--historical-ledger-path "$HISTORICAL_SEED_LEDGER_PATH"','--candidate-rows-sha256 "$CANDIDATE_ROWS_SHA256"'):
                  if x not in text: raise SystemExit(f'{label} missing native seed transport token: {x}')
          forbidden=[
            'aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery1:numerical:42',
            'ORDINAL42_AVPS_V2_POSTCONSUMPTION_RECOVERY1_DISPATCH_CONSUMED',
          ]
          for x in forbidden:
              if x in alltext: raise SystemExit(f'consumed ordinal42 executable identity leaked into candidate: {x}')
          if 'resultOpeningAuthorized' not in science or "auth.get('resultOpeningAuthorized') is not False" not in science: raise SystemExit('result-opening refusal not preserved')
          if 'productionAuthorized' not in science or "auth.get('productionAuthorized') is not False" not in science: raise SystemExit('production refusal not preserved')
          if '20_000_000' not in science and '20000000' not in science: raise SystemExit('20M/case frozen budget missing')
          if 'len(cases)!=360' not in science or 'len(v)!=90' not in science: raise SystemExit('360-case/four-shard guards missing')
          if 'githubRerun' not in science or 'retryAllowed' not in science or 'resumeAllowed' not in science: raise SystemExit('no-rerun/retry/resume evidence missing')
          if "SCIENTIFIC_ORDINAL: '43'" not in bridge: raise SystemExit('trigger bridge ordinal drift')
          publisher_blob=hashlib.sha1(b'blob '+str(len(publisher_path.read_bytes())).encode()+b'\0'+publisher_path.read_bytes()).hexdigest()
          if publisher_blob not in bridge: raise SystemExit('trigger bridge is not bound to generated publisher blob')
          rows=root.joinpath('MANIFEST.tsv').read_text().splitlines()
          if len(rows)!=4: raise SystemExit('manifest must contain exactly three generated workflows')
          def sha256(path): return hashlib.sha256(path.read_bytes()).hexdigest()
          receipt={
            'schemaVersion':1,
            'status':'PASS_AVPS_V2_POSTCONSUMPTION_RECOVERY2_GENERATED_IMPLEMENTATION_REVIEW_DISPATCH_NOT_CREATED',
            'baseMain':'db4c2574bcdf839f5112e1ca3c0242ff35b7880f',
            'scientificOrdinal':43,
            'authorizationHead':'5fd0c82cb14a02ace38a5a7be30b8b075ccae298',
            'caseCount':360,
            'groupCount':72,
            'statesPerGroup':5,
            'photonHistoriesPerCase':20000000,
            'candidateSeedCanonicalSha256':'38c074fe01bd6d09fa7dc78af1ad323e2f42b606ca992c2950b8fc1f5b343a9f',
            'candidateRowsCanonicalSha256':'a88b28dcfaaeb354f294d1705a0f8ddbcd061083f277a038ab8c9dace44d9954',
            'nativeAuthorizationSeedTransportRequired':True,
            'globalOrdinalPredispatchRecheckRequired':True,
            'generatedManifestSha256':sha256(root/'MANIFEST.tsv'),
            'scienceWorkflowSha256':sha256(science_path),
            'publisherWorkflowSha256':sha256(publisher_path),
            'triggerBridgeWorkflowSha256':sha256(bridge_path),
            'scientificRuntimeSetupPerformed':False,
            'solverExecutionPerformed':False,
            'dispatchCreated':False,
            'resultOpeningPerformed':False,
            'levelBOpened':False,
            'protectedHoldoutOpened':False,
            'productionAuthorized':False,
            'taylorOrJerusalemUsed':False,
          }
          Path('review-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY

      - name: Prove review workflow itself has no runtime or mutation path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-implementation-generator-v1-review.yml')
          text=p.read_text()
          forbidden=(
              'setup-'+'micromamba',
              'rubin-'+'libradtran',
              'workflow_'+'dispatch:',
              'repository_'+'dispatch:',
          )
          found=[x for x in forbidden if x in text]
          if found: raise SystemExit(f'review gate exposed runtime/dispatch path: {found}')
          PY
          if git diff --name-only "$BASE_MAIN...HEAD" | grep -E '^(.github/workflows/avps-v2-postconsumption-recovery2-|dispatch-triggers/)'; then
            echo 'generated executable recovery2 workflow or activation marker was tracked in review PR' >&2
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: avps-v2-postconsumption-recovery2-implementation-generator-v1-review
          path: |
            generated-avps-v2-recovery2/
            review-receipt.json
            changed.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
