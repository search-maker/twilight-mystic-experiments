name: Review AVPS v2 postconsumption recovery2 seed freshness

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-seed-freshness-v1-review.yml
      - review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-seed-freshness-v1/**

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: avps-v2-postconsumption-recovery2-seed-freshness-v1-${{ github.event.pull_request.number }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BASE_MAIN: b5784f0b9dd98a84b9798f6419229c1bf915b2b3
      EXPECTED_BRANCH: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-seed-freshness-v1
      CONSUMED_RUN_41: '33236295233'
      CONSUMED_RUN_42: '33259899524'
      ORDINAL42_AUTH_HEAD: e627a689ada0493a8a5b9cdafc4aba0198fbabec
      ORDINAL42_LEDGER_BLOB: 491d1b6653bea0fcc5275269723a76aa1af52300
      TRANSPORT_PROTOCOL_BLOB: 7ba4104338bbfda2f04417a66486ef2cedd142b0
      NEW_SEED_CANONICAL: 38c074fe01bd6d09fa7dc78af1ad323e2f42b606ca992c2950b8fc1f5b343a9f
      NEW_ROWS_CANONICAL: a88b28dcfaaeb354f294d1705a0f8ddbcd061083f277a038ab8c9dace44d9954
      ORDINAL41_SEED_CANONICAL: 02f624d582e9b2caba6b920d65a5e8a8bc8fc1a2693623bc2f73abf5d3f706d2
      ORDINAL42_SEED_CANONICAL: a514212990a94a39d577bd038b631a600e18e4c0f750f781bbd7c99b897228a7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Bind exact two-consumed-identity recovery boundary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$PR_BRANCH" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_MAIN"
          test "${{ github.event.pull_request.base.ref }}" = main
          test "${{ github.event.pull_request.base.sha }}" = "$BASE_MAIN"

          git diff --name-only "$BASE_MAIN...$PR_HEAD" | sort > changed-paths.txt
          python - <<'PY'
          from pathlib import Path
          expected={
            '.github/workflows/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-seed-freshness-v1-review.yml',
            'review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-seed-freshness-v1/PROTOCOL.md',
            'review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-seed-freshness-v1/repository_global_seed_scan.py',
            'review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-seed-freshness-v1/seed_ledger.py',
          }
          got={x for x in Path('changed-paths.txt').read_text().splitlines() if x}
          if got != expected:
              raise SystemExit(f'exact four-file recovery2 seed-review scope required; got {sorted(got)}')
          PY

          test "$(git rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-science-transport-v1/PROTOCOL.md)" = "$TRANSPORT_PROTOCOL_BLOB"
          test "$(git rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-prereg/build_skeleton.py)" = b4a4ab6917ad28f08d4980194f7b68f3961d5d59
          test "$(git rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/seed_ledger.py)" = c757507b05074340507df1ca6e76d35b44cf6090
          test "$(git rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/tracked_tree_seed_scan.py)" = 3aa311db5c49c5dcf2bd12446f5e96b347080e96
          test "$(git rev-parse HEAD:experiments/aerosol-family-challenge-v2/repository_global_seed_scan.py)" = 4c6d704fa24228284780bcb1dd7c52537b4c5b0d

          git cat-file -e "$ORDINAL42_AUTH_HEAD^{commit}"
          ORDINAL42_WORKTREE="$RUNNER_TEMP/avps-ordinal42-auth-native"
          rm -rf "$ORDINAL42_WORKTREE"
          git worktree add --detach "$ORDINAL42_WORKTREE" "$ORDINAL42_AUTH_HEAD"
          test "$(git -C "$ORDINAL42_WORKTREE" rev-parse HEAD)" = "$ORDINAL42_AUTH_HEAD"
          test "$(git -C "$ORDINAL42_WORKTREE" rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-seed-freshness-v1/seed_ledger.py)" = "$ORDINAL42_LEDGER_BLOB"
          test "$(git -C "$ORDINAL42_WORKTREE" rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-prereg/build_skeleton.py)" = b4a4ab6917ad28f08d4980194f7b68f3961d5d59
          test "$(git -C "$ORDINAL42_WORKTREE" rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/seed_ledger.py)" = c757507b05074340507df1ca6e76d35b44cf6090
          echo "AVPS_ORDINAL42_LEDGER_PATH=$ORDINAL42_WORKTREE/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-seed-freshness-v1/seed_ledger.py" >> "$GITHUB_ENV"

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CONSUMED_RUN_41" > consumed-run-41.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CONSUMED_RUN_41/jobs" > consumed-jobs-41.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CONSUMED_RUN_42" > consumed-run-42.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CONSUMED_RUN_42/jobs" > consumed-jobs-42.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > issue60-pages.json
          python - <<'PY'
          import json, os
          r41=json.load(open('consumed-run-41.json'))
          r42=json.load(open('consumed-run-42.json'))
          if r41.get('id')!=int(os.environ['CONSUMED_RUN_41']) or r41.get('run_attempt')!=1 or r41.get('status')!='completed' or r41.get('conclusion')!='failure':
              raise SystemExit('consumed ordinal-41 run identity/state drift')
          if r42.get('id')!=int(os.environ['CONSUMED_RUN_42']) or r42.get('run_attempt')!=1 or r42.get('status')!='completed' or r42.get('conclusion')!='failure':
              raise SystemExit('consumed ordinal-42 run identity/state drift')
          if r41.get('head_sha')!='3c93dce8b0a51b29cd1d3822c8ba3ed1c9ec3c62':
              raise SystemExit('consumed ordinal-41 run head drift')
          if r42.get('head_sha')!='83fa106956d003b087ac4d13f9d4200fc8a42bf2':
              raise SystemExit('consumed ordinal-42 run head drift')

          jobs42=json.load(open('consumed-jobs-42.json')).get('jobs',[])
          pre=[j for j in jobs42 if j.get('name')=='preflight']
          if len(pre)!=1 or pre[0].get('conclusion')!='failure':
              raise SystemExit('ordinal-42 preflight failure boundary drift')
          steps={s.get('name'):s.get('conclusion') for s in pre[0].get('steps',[])}
          if steps.get('Prove exact one-use dispatch and authorization identity before runtime')!='success':
              raise SystemExit('ordinal-42 one-use identity gate no longer proves success')
          if steps.get('Fresh repository-global candidate-seed recheck and one-use guard')!='failure':
              raise SystemExit('ordinal-42 expected pre-runtime seed-guard failure not preserved')
          for name in ('Recover immutable validated four-species profile bytes','Build exact four 90-case matrices in memory','Acquire and hash-bind exact OPAC archive once','Persist pre-solver guard, profiles and exact OPAC bytes'):
              if steps.get(name)!='skipped':
                  raise SystemExit(f'ordinal-42 crossed pre-runtime boundary at {name}')
          if any(str(j.get('name','')).startswith('cases-dep') and j.get('conclusion')!='skipped' for j in jobs42):
              raise SystemExit('ordinal-42 case job unexpectedly executed')

          pages=json.load(open('issue60-pages.json'))
          comments=[c for page in pages for c in page]
          bodies=[str(c.get('body') or '').strip() for c in comments]
          if sum(b=='ORDINAL41_AVPS_V2_DISPATCH_CONSUMED' for b in bodies)!=1:
              raise SystemExit('ordinal-41 consumed marker cardinality drift')
          if sum(b.startswith('ORDINAL42_AVPS_V2_POSTCONSUMPTION_RECOVERY1_DISPATCH_CONSUMED') for b in bodies)!=1:
              raise SystemExit('ordinal-42 consumed marker cardinality drift')
          PY

          mkdir -p seed-evidence
          git ls-files -z > seed-evidence/tracked-files.nul

      - name: Build deterministic fresh recovery2 candidate ledger
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-seed-freshness-v1/seed_ledger.py \
            review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-seed-freshness-v1/repository_global_seed_scan.py
          python - <<'PY'
          import importlib.util,json,os,sys
          from pathlib import Path
          p=Path('review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-seed-freshness-v1/seed_ledger.py')
          spec=importlib.util.spec_from_file_location('avps_v2_postconsumption_recovery2_seed_ledger',p)
          if spec is None or spec.loader is None: raise SystemExit('cannot import recovery2 seed ledger')
          m=importlib.util.module_from_spec(spec); sys.modules[spec.name]=m; spec.loader.exec_module(m)
          x=m.validate_ledger()
          if x['candidateSeedCount']!=72 or len(set(x['candidateSeeds']))!=72: raise SystemExit('fresh recovery2 seed cardinality drift')
          if x['candidateSeedCanonicalSha256']!=os.environ['NEW_SEED_CANONICAL']: raise SystemExit('fresh recovery2 seed canonical drift')
          if x['candidateRowsCanonicalSha256']!=os.environ['NEW_ROWS_CANONICAL']: raise SystemExit('fresh recovery2 row canonical drift')
          if x['consumedOrdinal41SeedCanonicalSha256']!=os.environ['ORDINAL41_SEED_CANONICAL']: raise SystemExit('ordinal-41 consumed seed binding drift')
          if x['consumedOrdinal42SeedCanonicalSha256']!=os.environ['ORDINAL42_SEED_CANONICAL']: raise SystemExit('ordinal-42 consumed seed binding drift')
          if x['overlapWithConsumedOrdinal41SeedCount']!=0 or x['overlapWithConsumedOrdinal42SeedCount']!=0: raise SystemExit('fresh recovery2 candidate set reuses consumed seed')
          if not x['allCollisionCountersZero'] or not x['historicalOrdinal42LedgerValidatedAtNativePath']:
              raise SystemExit('native historical ledger validation or collision invariant failed')
          for key in ('candidateSeedsAppliedToCases','scientificOrdinalAllocated','authorizationCreated','dispatchCreated','solverExecutionAuthorized','resultOpeningAuthorized','productionAuthorized'):
              if x[key]: raise SystemExit(f'candidate ledger crossed review boundary: {key}')
          Path('seed-evidence/candidate-seed-ledger.json').write_text(json.dumps(x,indent=2,sort_keys=True)+'\n')
          Path('seed-evidence/empty-self-ledger-policy.json').write_text(json.dumps({'schemaVersion':2,'requiredTrackedSelfLedgerPaths':[],'futureEvidenceSelfLedgerPaths':[]},indent=2,sort_keys=True)+'\n')
          PY

      - name: Scan exact tracked tree for fresh candidate literals
        shell: bash
        run: |
          set -euo pipefail
          python review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/tracked_tree_seed_scan.py \
            --repo-root . \
            --file-list seed-evidence/tracked-files.nul \
            --candidate-seed-ledger seed-evidence/candidate-seed-ledger.json \
            --allow-self-ledger-json seed-evidence/empty-self-ledger-policy.json \
            --output seed-evidence/tracked-seed-scan.json
          python - <<'PY'
          import json
          x=json.load(open('seed-evidence/tracked-seed-scan.json'))
          if x['candidateSeedCount']!=72 or x['trackedTreeExternalCollisionCount']!=0 or x['selfLedgerHitCount']!=0 or x['exactHeadTrackedTreeByteScanPassed'] is not True:
              raise SystemExit('tracked-tree fresh recovery2 seed scan failed')
          PY

      - name: Two-pass repository-global fresh recovery2 seed scan
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-seed-freshness-v1/repository_global_seed_scan.py \
            --repository "$GITHUB_REPOSITORY" \
            --issue-number 60 \
            --candidate-seed-ledger seed-evidence/candidate-seed-ledger.json \
            --current-run-id "$GITHUB_RUN_ID" \
            --audit-mode review-freeze \
            --expected-branch-name "$EXPECTED_BRANCH" \
            --expected-repo-head "$PR_HEAD" \
            --output seed-evidence/repository-global-seed-scan.json

      - name: Freeze recovery2 seed-freshness proof
        shell: bash
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          t=json.load(open('seed-evidence/tracked-seed-scan.json'))
          g=json.load(open('seed-evidence/repository-global-seed-scan.json'))
          if g.get('auditMode')!='review-freeze': raise SystemExit('global scan mode drift')
          if g.get('candidateSeedCount')!=72 or g.get('repositoryGlobalCollisionCount')!=0: raise SystemExit('repository-global fresh candidate collision')
          if g.get('repositoryGlobalCollisionSurfaceScanPassed') is not True or g.get('repositoryGlobalDoubleEnumerationStable') is not True: raise SystemExit('repository-global scan/fence did not pass')
          if g.get('auditedBranchHeadMatchesRepositoryHead') is not True: raise SystemExit('audited recovery2 branch head mismatch')
          if g.get('repositoryHeadExpected')!=os.environ['PR_HEAD'] or g.get('auditedBranchHeadShaObserved')!=os.environ['PR_HEAD']: raise SystemExit('expected/observed recovery2 head drift')
          if g.get('priorReviewProofArtifactCount')!=0 or g.get('reviewProofIdentityFresh') is not True: raise SystemExit('recovery2 proof artifact identity already existed')
          if g.get('repositoryGlobalPostFenceCandidateSeedCollisionCount') not in (0,None): raise SystemExit('post-fence candidate collision')
          out={
            'schemaVersion':1,
            'stageId':'aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-seed-freshness-review',
            'status':'PASS_POSTCONSUMPTION_RECOVERY2_CANDIDATE_SEEDS_FRESH_NOT_ALLOCATED',
            'auditedHead':os.environ['PR_HEAD'],
            'consumedScientificOrdinals':[41,42],
            'consumedRunIds':[33236295233,33259899524],
            'candidateSeedCount':72,
            'candidateSeedCanonicalSha256':os.environ['NEW_SEED_CANONICAL'],
            'candidateRowsCanonicalSha256':os.environ['NEW_ROWS_CANONICAL'],
            'consumedOrdinal41SeedCanonicalSha256':os.environ['ORDINAL41_SEED_CANONICAL'],
            'consumedOrdinal42SeedCanonicalSha256':os.environ['ORDINAL42_SEED_CANONICAL'],
            'overlapWithConsumedOrdinal41SeedCount':0,
            'overlapWithConsumedOrdinal42SeedCount':0,
            'historicalOrdinal42LedgerValidatedAtNativePath':True,
            'trackedTreeExternalCollisionCount':t.get('trackedTreeExternalCollisionCount'),
            'repositoryGlobalCollisionCount':g.get('repositoryGlobalCollisionCount'),
            'repositoryGlobalDoubleEnumerationStable':g.get('repositoryGlobalDoubleEnumerationStable'),
            'repositoryGlobalStableContextSha256':g.get('repositoryGlobalStableContextSha256'),
            'repositoryGlobalSnapshotFenceSha256':g.get('repositoryGlobalSnapshotFenceSha256'),
            'repositoryGlobalPostFenceArrivalCounts':g.get('repositoryGlobalPostFenceArrivalCounts') or {},
            'scientificOrdinalAllocated':False,
            'authorizationCreated':False,
            'dispatchCreated':False,
            'candidateSeedsAppliedToCases':False,
            'scientificExecutionAuthorized':False,
            'solverExecutionAuthorized':False,
            'resultOpeningAuthorized':False,
            'levelBOpened':False,
            'productionAuthorized':False,
            'authorizationTimeRecheckRequired':True,
            'nextOrdinalAssumed':False,
          }
          Path('seed-evidence/recovery2-seed-freshness-proof.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vertical-profile-v2-postconsumption-recovery2-seed-freshness-proof
          path: seed-evidence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Remove historical detached worktree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git worktree remove --force "$RUNNER_TEMP/avps-ordinal42-auth-native" 2>/dev/null || true
