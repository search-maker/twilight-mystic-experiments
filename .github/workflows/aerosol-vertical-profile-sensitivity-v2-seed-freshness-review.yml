name: Review AVPS v2 candidate seed freshness

on:
  pull_request:
    paths:
      - review/aerosol-vertical-profile-sensitivity-v2-prereg/**
      - review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/**
      - .github/workflows/aerosol-vertical-profile-sensitivity-v2-prereg-review.yml
      - .github/workflows/aerosol-vertical-profile-sensitivity-v2-seed-freshness-review.yml

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: write

jobs:
  freshness:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      BASE_MAIN: 99ade7798627e67921139697ba1a004fa8a304bb
      PREREG_PR: '597'
      PREREG_HEAD: 2bba54c6e78ed99d169887eef51d0c88d812b6f1
      PREREG_RUN: '33193778176'
      PREREG_CONTRACT_RUN: '33193778174'
      PREREG_ARTIFACT: '9694863701'
      PREREG_ARTIFACT_DIGEST: sha256:7de79aa4d8d9b51ad8ca4b1bdaceedae7ee5df17b3dd79c43c21cdaf9ae9a171
      PREREG_RECEIPT_SHA: 717411c68c48f34f79c93da3ae8024e3d99a32c78ebe63935d262b3548e62c61
      PREREG_SKELETON_CANONICAL: a8d2d8f59aec01d82d8d98672152d00c11261660b0a69a59e2716c2edabd2b02
      PREREG_PROTOCOL_BLOB: d790fb3fa2d214d1f430f4417b17212a8e5038a8
      PREREG_REVIEW_BLOB: 378ee19dc5bb3179993b3b00000743f559cc3e27
      PREREG_BUILDER_BLOB: b4a4ab6917ad28f08d4980194f7b68f3961d5d59
      PREREG_WORKFLOW_BLOB: 2172a915eba3867042eac8f789425c980f92176d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Bind exact seed-review identity and passed preregistration
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$EXPECTED_BRANCH" = review/aerosol-vertical-profile-sensitivity-v2-seed-freshness
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse origin/main)" = "$BASE_MAIN"
          git merge-base --is-ancestor "$PREREG_HEAD" HEAD
          test "$(git rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-prereg/protocol.review.json)" = "$PREREG_PROTOCOL_BLOB"
          test "$(git rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-prereg/PROTOCOL.md)" = "$PREREG_REVIEW_BLOB"
          test "$(git rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-prereg/build_skeleton.py)" = "$PREREG_BUILDER_BLOB"
          test "$(git rev-parse HEAD:.github/workflows/aerosol-vertical-profile-sensitivity-v2-prereg-review.yml)" = "$PREREG_WORKFLOW_BLOB"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PREREG_PR" > prereg-pr.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREREG_RUN" > prereg-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREREG_CONTRACT_RUN" > prereg-contract.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREREG_RUN/artifacts" > prereg-artifacts.json
          python - <<'PY'
          import json,os
          p=json.load(open('prereg-pr.json')); r=json.load(open('prereg-run.json')); c=json.load(open('prereg-contract.json'))
          if p['state']!='open' or p['draft'] is not True or p['merged_at'] is not None or p['head']['sha']!=os.environ['PREREG_HEAD'] or p['base']['sha']!=os.environ['BASE_MAIN']:
              raise SystemExit('#597 preregistration PR drift')
          if r['id']!=int(os.environ['PREREG_RUN']) or r['head_sha']!=os.environ['PREREG_HEAD'] or r['run_attempt']!=1 or r['conclusion']!='success':
              raise SystemExit('#597 dedicated review drift')
          if c['id']!=int(os.environ['PREREG_CONTRACT_RUN']) or c['head_sha']!=os.environ['PREREG_HEAD'] or c['run_attempt']!=1 or c['conclusion']!='success':
              raise SystemExit('#597 repository contract drift')
          arts=json.load(open('prereg-artifacts.json'))['artifacts']
          hit=[a for a in arts if a['id']==int(os.environ['PREREG_ARTIFACT'])]
          if len(hit)!=1 or hit[0].get('digest')!=os.environ['PREREG_ARTIFACT_DIGEST'] or hit[0].get('expired'):
              raise SystemExit('#597 preregistration artifact drift')
          PY
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/branches?per_page=100" > branches.json
          python - <<'PY'
          import json
          names=[row['name'] for page in json.load(open('branches.json')) for row in page]
          bad=[n for n in names if 'ordinal-41' in n or 'ordinal41' in n]
          if bad: raise SystemExit(f'ordinal 41 unexpectedly allocated before seed freshness review: {bad}')
          PY
          mkdir -p seed-evidence
          git ls-files -z > seed-evidence/tracked-files.nul

      - name: Verify preregistration artifact and rebuild exact skeleton
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf prereg-evidence
          gh run download "$PREREG_RUN" -n aerosol-vertical-profile-sensitivity-v2-prereg-review -D prereg-evidence
          python - <<'PY'
          import hashlib,json,os
          receipt=json.load(open('prereg-evidence/review-receipt.json'))
          skeleton=json.load(open('prereg-evidence/skeleton.json'))
          raw=dict(receipt); content=raw.pop('contentSha256')
          canonical=hashlib.sha256(json.dumps(raw,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
          if content!=os.environ['PREREG_RECEIPT_SHA'] or canonical!=content: raise SystemExit('#597 receipt content identity drift')
          if skeleton.get('canonicalSkeletonSha256')!=os.environ['PREREG_SKELETON_CANONICAL']: raise SystemExit('#597 skeleton canonical drift')
          if skeleton.get('seedCount')!=0 or skeleton.get('scientificOrdinal') is not None: raise SystemExit('#597 artifact no longer seed/ordinal free')
          PY
          python review/aerosol-vertical-profile-sensitivity-v2-prereg/build_skeleton.py > seed-evidence/rebuilt-skeleton.json
          python - <<'PY'
          import json,os
          x=json.load(open('seed-evidence/rebuilt-skeleton.json'))
          if x.get('canonicalSkeletonSha256')!=os.environ['PREREG_SKELETON_CANONICAL']: raise SystemExit('rebuilt skeleton canonical drift')
          if (x.get('groupCount'),x.get('caseCount'),x.get('seedCount'),x.get('scientificOrdinal'))!=(72,360,0,None): raise SystemExit('rebuilt skeleton boundary drift')
          PY

      - name: Build deterministic artifact-only candidate ledger
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/seed_ledger.py \
            review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/tracked_tree_seed_scan.py \
            review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/repository_global_seed_scan.py \
            review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/build_seed_freshness_proof.py
          python - <<'PY'
          import importlib.util,json,sys
          from pathlib import Path
          path=Path('review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/seed_ledger.py')
          spec=importlib.util.spec_from_file_location('avps_v2_seed_ledger_workflow',path)
          if spec is None or spec.loader is None: raise SystemExit('cannot import v2 seed ledger')
          mod=importlib.util.module_from_spec(spec); sys.modules[spec.name]=mod; spec.loader.exec_module(mod)
          ledger=mod.validate_ledger()
          if ledger['candidateSeedCount']!=72 or len(set(ledger['candidateSeeds']))!=72: raise SystemExit('candidate seed cardinality/uniqueness drift')
          if ledger['candidateSeedCanonicalSha256']!='02f624d582e9b2caba6b920d65a5e8a8bc8fc1a2693623bc2f73abf5d3f706d2': raise SystemExit('candidate seed canonical drift')
          if ledger['candidateRowsCanonicalSha256']!='41f70d6a0381db6b569d3f4e17d74bb38b05cf212c2f2e432455a502f73dc670': raise SystemExit('candidate row canonical drift')
          if not ledger['allCollisionCountersZero'] or ledger['candidateSeedsAppliedToCases'] or ledger['scientificOrdinalAllocated']: raise SystemExit('candidate ledger boundary drift')
          Path('seed-evidence/candidate-seed-ledger.json').write_text(json.dumps(ledger,indent=2,sort_keys=True)+'\n')
          Path('seed-evidence/empty-self-ledger-policy.json').write_text(json.dumps({'schemaVersion':2,'requiredTrackedSelfLedgerPaths':[],'futureEvidenceSelfLedgerPaths':[]},indent=2,sort_keys=True)+'\n')
          PY

      - name: Scan exact tracked tree for candidate literals
        shell: bash
        run: |
          set -euo pipefail
          python review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/tracked_tree_seed_scan.py \
            --repo-root . \
            --file-list seed-evidence/tracked-files.nul \
            --candidate-seed-ledger seed-evidence/candidate-seed-ledger.json \
            --allow-self-ledger-json seed-evidence/empty-self-ledger-policy.json \
            --output seed-evidence/tracked-seed-scan.json
          python - <<'PY'
          import json
          x=json.load(open('seed-evidence/tracked-seed-scan.json'))
          assert x['candidateSeedCount']==72
          assert x['trackedTreeExternalCollisionCount']==0
          assert x['selfLedgerHitCount']==0
          assert x['exactHeadTrackedTreeByteScanPassed'] is True
          PY

      - name: Two-pass repository-global candidate seed freshness scan
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          python review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/repository_global_seed_scan.py \
            --repository "$GITHUB_REPOSITORY" \
            --issue-number 60 \
            --candidate-seed-ledger seed-evidence/candidate-seed-ledger.json \
            --current-run-id "$GITHUB_RUN_ID" \
            --audit-mode review-freeze \
            --expected-branch-name "$EXPECTED_BRANCH" \
            --expected-repo-head "$EXPECTED_HEAD" \
            --output seed-evidence/repository-global-seed-scan.json

      - name: Freeze candidate seed freshness proof
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/build_seed_freshness_proof.py \
            --stage-dir review/aerosol-vertical-profile-sensitivity-v2-seed-freshness \
            --tracked-tree-report seed-evidence/tracked-seed-scan.json \
            --repository-global-report seed-evidence/repository-global-seed-scan.json \
            --expected-head "$EXPECTED_HEAD" \
            --output seed-evidence/seed-freshness-proof.json
          python - <<'PY'
          import json
          p=json.load(open('seed-evidence/seed-freshness-proof.json'))
          assert p['status']=='PASS_CANDIDATE_SEEDS_FRESH_REVIEW_ONLY_NOT_ALLOCATED'
          assert p['candidateSeedCount']==72
          assert p['trackedTreeExternalCollisionCount']==0
          assert p['repositoryGlobalCollisionCount']==0
          assert p['scientificOrdinalAllocated'] is False
          assert p['authorizationCreated'] is False
          assert p['candidateSeedsAppliedToCases'] is False
          assert p['solverExecutionAuthorized'] is False
          assert p['resultOpeningAuthorized'] is False
          assert p['authorizationTimeRecheckRequired'] is True
          PY

      - name: Upload candidate seed freshness proof
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: vertical-profile-v2-seed-freshness-review-proof
          path: seed-evidence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish non-seed checkpoint to Issue 60
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,re,urllib.request
          from pathlib import Path
          p=json.load(open('seed-evidence/seed-freshness-proof.json'))
          artifact_id=os.environ.get('ARTIFACT_ID','').strip()
          digest=os.environ.get('ARTIFACT_DIGEST','').strip()
          if not artifact_id.isdigit() or re.fullmatch(r'[0-9a-f]{64}',digest) is None: raise SystemExit('artifact identity malformed')
          body='\n'.join([
              'AEROSOL-VERTICAL-PROFILE-V2-CANDIDATE-SEED-FRESHNESS-REVIEW',
              f'audited_head={p["auditedHead"]}',
              f'run={os.environ["GITHUB_RUN_ID"]}',
              'attempt=1',
              f'status={p["status"]}',
              f'candidate_seed_count={p["candidateSeedCount"]}',
              f'candidate_seed_canonical_sha256={p["candidateSeedCanonicalSha256"]}',
              f'candidate_rows_canonical_sha256={p["candidateRowsCanonicalSha256"]}',
              'tracked_seed_literals=false',
              'tracked_tree_collisions=0',
              'repository_global_collisions=0',
              f'artifact_id={artifact_id}',
              f'artifact_digest=sha256:{digest}',
              'scientific_ordinal_allocated=false',
              'authorization_created=false',
              'candidate_seeds_applied=false',
              'scientific_runtime=false',
              'solver_execution=false',
              'authorization_time_recheck_required=true',
          ])
          req=urllib.request.Request(
              f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/issues/60/comments',
              data=json.dumps({'body':body}).encode(),
              headers={'Authorization':f'Bearer {os.environ["GITHUB_TOKEN"]}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(req,timeout=90) as response: row=json.load(response)
          if not int(row.get('id') or 0): raise SystemExit('Issue60 checkpoint failed')
          print(f'issue60_comment_id={row["id"]}')
          PY

      - name: Claim boundary
        run: |
          echo 'AVPS v2 candidate seed freshness review only.'
          echo 'Candidate seeds remain artifact-only and unapplied; no scientific ordinal, authorization, uvspec/MYSTIC, or result opening.'
