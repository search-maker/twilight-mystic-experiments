name: Aerosol vertical-profile transport review

on:
  pull_request:
    branches: [main]
    paths:
      - 'review/aerosol-vertical-profile-transport-v1/**'
      - 'tests/test_aerosol_vertical_profile_transport_v1.py'
      - '.github/workflows/aerosol-vertical-profile-transport-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Require solver-free review environment
        shell: bash
        run: test -z "$(command -v uvspec || true)"
      - name: Run deterministic transport tests
        shell: bash
        run: python -m unittest discover -s tests -p 'test_aerosol_vertical_profile_transport_v1.py' -v
      - name: Claim boundary
        run: |
          echo 'Pure profile-remapping software test only.'
          echo 'No MYSTIC/libRadtran execution, profile selection, fitting, or production authorization.'
