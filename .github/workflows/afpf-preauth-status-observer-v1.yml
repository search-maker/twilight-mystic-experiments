name: AFPF preauthorization status observer v1

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  actions: read

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read exact final-main preauthorization metadata only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 1b4a78bfd7bc416d0a42fd99251a95f0a120f8a0
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/afpf-v1-preauthorization-audit.yml/runs?branch=main&event=push&per_page=100" > run-pages.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          pages=json.load(open('run-pages.json'))
          rows=[r for page in pages for r in page.get('workflow_runs',[])]
          same=[r for r in rows if r.get('head_sha')==os.environ['TARGET_SHA']]
          if len(same)!=1:
              raise SystemExit(f'expected exactly one preauthorization run for target SHA, got {len(same)}')
          r=same[0]
          out={k:r.get(k) for k in ('id','name','path','event','status','conclusion','run_attempt','head_branch','head_sha','created_at','updated_at','run_started_at')}
          out['targetSha']=os.environ['TARGET_SHA']
          out['observerScientificRuntime']=False
          out['observerSolverExecution']=False
          out['observerResultsOpened']=False
          Path('preauth-status.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY
      - name: Persist metadata-only observer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: afpf-preauthorization-status-observer-v1
          path: preauth-status.json
          if-no-files-found: error
          compression-level: 0
