name: AFPF v1 analysis-recovery observer
run-name: Observe AFPF v1 ordinal 38 analysis-recovery run metadata

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/afpf-v1-analysis-recovery-observer.yml

permissions:
  contents: read
  actions: read

jobs:
  observe:
    if: ${{ github.event.pull_request.head.ref == 'observer/afpf-v1-analysis-recovery-ordinal38-v1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Read exact recovery run metadata only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/afpf-v1-analysis-recovery-v1.yml/runs?branch=status/afpf-v1-analysis-recovery-ordinal-38&event=push&per_page=100" > recovery-run-pages.json
          python - <<'PY'
          import json
          from pathlib import Path
          pages=json.load(open('recovery-run-pages.json'))
          runs=[r for page in pages for r in page.get('workflow_runs',[])]
          if len(runs)!=1:
              raise SystemExit(f'expected exactly one AFPF ordinal-38 recovery run, got {[(r.get("id"),r.get("run_attempt"),r.get("status"),r.get("conclusion")) for r in runs]}')
          r=runs[0]
          if int(r.get('run_attempt') or 0)!=1: raise SystemExit('recovery run attempt drift')
          if r.get('head_branch')!='status/afpf-v1-analysis-recovery-ordinal-38': raise SystemExit('recovery branch drift')
          if r.get('head_sha')!='b037c1787109fa9c15f86b58bbda9a166464e3ce': raise SystemExit('recovery request head drift')
          out={k:r.get(k) for k in ('id','name','head_branch','head_sha','event','status','conclusion','run_attempt','created_at','updated_at','html_url')}
          Path('recovery-run.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Upload observer metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: afpf-v1-analysis-recovery-observer-ordinal-38
          path: recovery-run.json
          if-no-files-found: error
          compression-level: 0
