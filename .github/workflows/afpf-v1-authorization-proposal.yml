name: AFPF v1 ordinal 38 authorization proposal

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/afpf-v1-authorization-proposal.yml

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: afpf-v1-authorization-proposal-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  proposal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact proposal head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"

      - name: Prove one-file Draft proposal identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "${{ github.event.action }}" = opened
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "${{ github.event.pull_request.draft }}" = true
          test "${{ github.event.pull_request.state }}" = open
          test "${{ github.event.pull_request.merged }}" = false
          test "${{ github.event.pull_request.base.ref }}" = main
          test "${{ github.event.pull_request.head.ref }}" = status/afpf-v1-authorization-ordinal-38-proposal-1
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          mapfile -t PARENTS < <(git cat-file -p HEAD | sed -n 's/^parent //p')
          test "${#PARENTS[@]}" = 1
          test "${PARENTS[0]}" = c6096fa860802793128c386bb685e6698af108f9
          git fetch origin main
          test "$(git rev-parse origin/main)" = c6096fa860802793128c386bb685e6698af108f9
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = 1
          test "${CHANGED[0]}" = .github/workflows/afpf-v1-authorization-proposal.yml
          test ! -e experiments/aerosol-full-phase-function-sensitivity-v1/authorization.json
          mkdir -p preauth-artifact proposal-evidence

      - name: Bind exact successful fresh preauthorization artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/32670868911" > preauth-run.json
          python - <<'PY'
          import json
          r=json.load(open('preauth-run.json'))
          if r.get('head_sha')!='c6096fa860802793128c386bb685e6698af108f9': raise SystemExit('preauthorization head drift')
          if r.get('head_branch')!='main' or r.get('event')!='push': raise SystemExit('preauthorization trigger identity drift')
          if int(r.get('run_attempt') or 0)!=1 or r.get('status')!='completed' or r.get('conclusion')!='success': raise SystemExit('exact attempt-1 successful preauthorization required')
          PY
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9501405183" > preauth-artifact.json
          python - <<'PY'
          import json
          a=json.load(open('preauth-artifact.json'))
          if int(a.get('id') or 0)!=9501405183: raise SystemExit('preauthorization artifact id drift')
          if a.get('name')!='afpf-v1-preauthorization-proof' or a.get('expired') is True: raise SystemExit('preauthorization artifact identity drift')
          if a.get('digest')!='sha256:ddfd0eb8a6bbc60f929da7c495907323c4686aaeb958f4a01663aee8b8eb55b0': raise SystemExit('preauthorization artifact digest drift')
          wr=a.get('workflow_run') or {}
          if int(wr.get('id') or 0)!=32670868911 or wr.get('head_sha')!='c6096fa860802793128c386bb685e6698af108f9': raise SystemExit('preauthorization artifact run binding drift')
          PY
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9501405183/zip" > preauth.zip
          printf '%s  %s\n' 'ddfd0eb8a6bbc60f929da7c495907323c4686aaeb958f4a01663aee8b8eb55b0' preauth.zip | sha256sum -c -
          unzip -q preauth.zip -d preauth-artifact
          python - <<'PY'
          import json
          from pathlib import Path
          def one(name):
              rows=[p for p in Path('preauth-artifact').rglob(name) if p.is_file()]
              if len(rows)!=1: raise SystemExit(f'expected exactly one {name}, got {len(rows)}')
              return rows[0]
          p=json.load(open(one('preauthorization.json')))
          s=json.load(open(one('seed-authorization-proof.json')))
          if p.get('status')!='PREAUTHORIZATION_SURFACE_CLEAN_NOT_ALLOCATED': raise SystemExit('preauthorization status drift')
          if p.get('exactMainSha')!='c6096fa860802793128c386bb685e6698af108f9': raise SystemExit('preauthorization main drift')
          if p.get('nextAvailableScientificOrdinal')!=38 or p.get('latestPriorConsumedScientificOrdinal')!=37: raise SystemExit('preauthorization ordinal drift')
          if p.get('candidateSeedCount')!=72 or p.get('trackedTreeExternalCollisionCount')!=0 or p.get('repositoryGlobalCollisionCount')!=0 or p.get('repositoryGlobalDoubleEnumerationStable') is not True: raise SystemExit('preauthorization seed freshness drift')
          if any(p.get(k) is not False for k in ('scientificOrdinalAllocated','authorizationCreated','dispatchCreated','scientificRuntimeSetupPerformed','scientificExecutionPerformed','solverExecutionPerformed')): raise SystemExit('preauthorization crossed boundary')
          if s.get('status')!='PASS_CANDIDATE_SEEDS_AUTHORIZATION_RECHECK_NOT_ALLOCATED': raise SystemExit('seed proof status drift')
          if s.get('auditedMainHead')!='c6096fa860802793128c386bb685e6698af108f9': raise SystemExit('seed proof main drift')
          if s.get('candidateSeedCount')!=72 or s.get('trackedTreeExternalCollisionCount')!=0 or s.get('repositoryGlobalCollisionCount')!=0 or s.get('repositoryGlobalDoubleEnumerationStable') is not True: raise SystemExit('seed proof freshness drift')
          Path('proposal-evidence/preauthorization-selected.json').write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          PY

      - name: Run frozen authorization builder without allocation
        shell: bash
        run: |
          set -euo pipefail
          FRESHNESS="$(find preauth-artifact -type f -name freshness.json -print)"
          PROOF="$(find preauth-artifact -type f -name seed-authorization-proof.json -print)"
          test "$(printf '%s\n' "$FRESHNESS" | sed '/^$/d' | wc -l)" = 1
          test "$(printf '%s\n' "$PROOF" | sed '/^$/d' | wc -l)" = 1
          python experiments/aerosol-full-phase-function-sensitivity-v1/execution-candidate/build_authorization.py \
            --repository-root . \
            --parent-main c6096fa860802793128c386bb685e6698af108f9 \
            --scientific-ordinal 38 \
            --freshness "$FRESHNESS" \
            --seed-authorization-proof "$PROOF" \
            --output proposal-evidence/authorization-proposal.json

      - name: Independently refuse any crossed control boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('proposal-evidence/authorization-proposal.json')
          a=json.load(open(p))
          expected={
            'schemaVersion':1,
            'stageId':'aerosol-full-phase-function-sensitivity-v1',
            'status':'AUTHORIZED_PENDING_SEPARATE_DISPATCH',
            'scientificOrdinal':38,
            'authorizationBranch':'authorization/aerosol-full-phase-function-sensitivity-v1-ordinal-38',
            'dispatchBranch':'dispatch/aerosol-full-phase-function-sensitivity-v1-ordinal-38',
            'executionKey':'aerosol-full-phase-function-sensitivity-v1:numerical:38',
            'exactAuthorizationParentCommit':'c6096fa860802793128c386bb685e6698af108f9',
            'reviewPackageMainSha':'c6096fa860802793128c386bb685e6698af108f9',
            'exactAuthorizationCommit':None,
            'scientificExecutionAuthorized':True,
            'solverExecutionAuthorized':True,
            'dispatchAuthorized':False,
            'resultOpeningAuthorized':False,
            'automaticDispatch':False,
            'consumed':False,
            'workflowRunAttemptRequired':1,
            'githubRerunAllowed':False,
            'retryAllowed':False,
            'resumeAllowed':False,
          }
          for k,v in expected.items():
              if a.get(k)!=v: raise SystemExit(f'authorization proposal drift for {k}: {a.get(k)!r} != {v!r}')
          if a.get('candidateSeedCanonicalSha256')!='d3a3b0f8ddd6f73160e021377c66a1dd6f16ea4f7c8687db7677caf84a033a2b': raise SystemExit('candidate seed hash drift')
          if a.get('candidateRowsCanonicalSha256')!='72a53f2a86be3b0d380528d9ef39893864d1f2ac9e2306611ce0c4afc88ffee4': raise SystemExit('candidate row hash drift')
          if a.get('augmentedDataTreeSha256')!='5d8bbf8e6b91ec3d405dee36f21a94afbb6e5ec6cd67da2dd5dd541738199d80': raise SystemExit('augmented tree drift')
          if a.get('officialOptpropArchiveSha256')!='11daa1f1f4be0fd4ddf7e881ec2005498049674a1540d37b4b1e8f5e16052c7e': raise SystemExit('optprop archive drift')
          if not isinstance(a.get('byteBindings'),dict) or not a['byteBindings']: raise SystemExit('authorization byte bindings missing')
          raw=p.read_bytes()
          Path('proposal-evidence/authorization-proposal.sha256').write_text(hashlib.sha256(raw).hexdigest()+'  authorization-proposal.json\n')
          boundary={
            'schemaVersion':1,
            'status':'AUTHORIZATION_PROPOSAL_BUILT_ZERO_RUNTIME_NOT_ALLOCATED',
            'exactParentMain':'c6096fa860802793128c386bb685e6698af108f9',
            'scientificOrdinalProposal':38,
            'authorizationJsonCommitted':False,
            'scientificOrdinalAllocated':False,
            'dispatchCreated':False,
            'scientificRuntimeSetupPerformed':False,
            'syntaxCheckExecuted':False,
            'solverExecutionPerformed':False,
            'resultOpeningPerformed':False,
            'authorizationProposalRawSha256':hashlib.sha256(raw).hexdigest(),
          }
          Path('proposal-evidence/proposal-boundary.json').write_text(json.dumps(boundary,indent=2,sort_keys=True)+'\n')
          PY

      - name: Persist proposal evidence only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: afpf-v1-authorization-ordinal-38-proposal
          path: proposal-evidence/
          if-no-files-found: error
          compression-level: 0
