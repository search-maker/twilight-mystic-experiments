name: AFPF v1 scientific execution
run-name: AFPF v1 science ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: write

concurrency:
  group: afpf-v1-science-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      ordinal: ${{ steps.identity.outputs.ordinal }}
      parent: ${{ steps.identity.outputs.parent }}
      matrix2: ${{ steps.matrices.outputs.matrix2 }}
      matrix4: ${{ steps.matrices.outputs.matrix4 }}
      matrix6: ${{ steps.matrices.outputs.matrix6 }}
      matrix8: ${{ steps.matrices.outputs.matrix8 }}
    steps:
      - name: Checkout exact dispatched authorization head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"

      - name: Bind dispatch authorization review publisher and preauthorization
        id: identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$GITHUB_REF_NAME" =~ ^dispatch/aerosol-full-phase-function-sensitivity-v1-ordinal-([1-9][0-9]*)$ ]]
          ORDINAL="${BASH_REMATCH[1]}"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY' > auth.env
          import json
          a=json.load(open('experiments/aerosol-full-phase-function-sensitivity-v1/authorization.json'))
          n=a.get('scientificOrdinal')
          if not isinstance(n,int) or n <= 0: raise SystemExit('authorization ordinal invalid')
          print(f'AUTH_ORDINAL={n}')
          print(f'AUTH_BRANCH={a.get("authorizationBranch","")}')
          print(f'DISPATCH_BRANCH={a.get("dispatchBranch","")}')
          print(f'AUTH_PARENT_DOC={a.get("exactAuthorizationParentCommit","")}')
          PY
          source auth.env
          test "$AUTH_ORDINAL" = "$ORDINAL"
          test "$DISPATCH_BRANCH" = "$GITHUB_REF_NAME"
          mapfile -t PARENTS < <(git cat-file -p HEAD | sed -n 's/^parent //p')
          test "${#PARENTS[@]}" = 1
          AUTH_PARENT="${PARENTS[0]}"
          test "$AUTH_PARENT" = "$AUTH_PARENT_DOC"
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = 1
          test "${CHANGED[0]}" = experiments/aerosol-full-phase-function-sensitivity-v1/authorization.json
          git fetch origin main "$AUTH_BRANCH" "$DISPATCH_BRANCH"
          test "$(git rev-parse origin/main)" = "$AUTH_PARENT"
          test "$(git rev-parse "origin/$AUTH_BRANCH")" = "$GITHUB_SHA"
          test "$(git rev-parse "origin/$DISPATCH_BRANCH")" = "$GITHUB_SHA"
          export ORDINAL AUTH_BRANCH AUTH_PARENT
          OWNER="${GITHUB_REPOSITORY%%/*}"

          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls?state=all&head=${OWNER}:${AUTH_BRANCH}&per_page=100" > auth-pr-pages.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          pages=json.load(open('auth-pr-pages.json')); prs=[p for page in pages for p in page]
          good=[p for p in prs if (p.get('head') or {}).get('ref')==os.environ['AUTH_BRANCH'] and (p.get('head') or {}).get('sha')==os.environ['GITHUB_SHA']]
          if len(good)!=1: raise SystemExit(f'expected one authorization PR, got {len(good)}')
          p=good[0]
          if p.get('state')!='open' or p.get('draft') is not True or p.get('merged_at') is not None: raise SystemExit('authorization PR must remain Draft/open/unmerged')
          if (p.get('base') or {}).get('ref')!='main': raise SystemExit('authorization PR base drift')
          Path('auth-pr-selected.json').write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          PY
          PR_NUMBER="$(python -c 'import json;print(json.load(open("auth-pr-selected.json"))["number"])')"

          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/afpf-v1-authorization-review.yml/runs?branch=${AUTH_BRANCH}&event=pull_request&per_page=100" > auth-review-run-pages.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          pages=json.load(open('auth-review-run-pages.json')); runs=[r for page in pages for r in page.get('workflow_runs',[])]
          same=[r for r in runs if r.get('head_sha')==os.environ['GITHUB_SHA']]
          good=[r for r in same if int(r.get('run_attempt') or 0)==1 and r.get('status')=='completed' and r.get('conclusion')=='success']
          if len(same)!=1 or len(good)!=1: raise SystemExit(f'authorization review history invalid: same={len(same)} good={len(good)}')
          Path('auth-review-selected.json').write_text(json.dumps(good[0],indent=2,sort_keys=True)+'\n')
          PY
          REVIEW_RID="$(python -c 'import json;print(json.load(open("auth-review-selected.json"))["id"])')"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${REVIEW_RID}/artifacts?per_page=100" > auth-review-artifacts.json
          REVIEW_AID="$(python - <<'PY'
          import json,os
          rows=json.load(open('auth-review-artifacts.json')).get('artifacts',[])
          expected=f'afpf-v1-authorization-review-ordinal-{os.environ["ORDINAL"]}'
          good=[a for a in rows if a.get('name')==expected and not a.get('expired',False)]
          if len(good)!=1: raise SystemExit(f'authorization review artifact count {len(good)}')
          print(good[0]['id'])
          PY
          )"
          mkdir auth-review-artifact
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${REVIEW_AID}/zip" > auth-review.zip
          unzip -q auth-review.zip -d auth-review-artifact

          PUBLISH_BRANCH="status/afpf-v1-dispatch-publisher-ordinal-$ORDINAL"
          export PUBLISH_BRANCH
          for i in $(seq 1 30); do
            gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/afpf-v1-dispatch-publisher.yml/runs?branch=${PUBLISH_BRANCH}&event=push&per_page=100" > publisher-run-pages.json
            python - <<'PY' > publisher-state.env
          import json,os
          from pathlib import Path
          pages=json.load(open('publisher-run-pages.json')); runs=[r for page in pages for r in page.get('workflow_runs',[])]
          same=[r for r in runs if (r.get('head_branch') or '')==os.environ['PUBLISH_BRANCH']]
          if len(same)!=1: raise SystemExit(f'expected exactly one publisher run, got {len(same)}')
          r=same[0]
          if int(r.get('run_attempt') or 0)!=1: raise SystemExit('publisher rerun forbidden')
          Path('publisher-selected.json').write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          print('PUBLISHER_STATUS='+str(r.get('status') or ''))
          print('PUBLISHER_CONCLUSION='+str(r.get('conclusion') or ''))
          print('PUBLISHER_RUN_ID='+str(r.get('id') or 0))
          PY
            source publisher-state.env
            if [ "$PUBLISHER_STATUS" = completed ]; then break; fi
            sleep 2
          done
          test "$PUBLISHER_STATUS" = completed
          test "$PUBLISHER_CONCLUSION" = success
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PUBLISHER_RUN_ID}/artifacts?per_page=100" > publisher-artifacts.json
          PUB_AID="$(python - <<'PY'
          import json,os
          rows=json.load(open('publisher-artifacts.json')).get('artifacts',[])
          expected=f'afpf-v1-dispatch-publisher-ordinal-{os.environ["ORDINAL"]}'
          good=[a for a in rows if a.get('name')==expected and not a.get('expired',False)]
          if len(good)!=1: raise SystemExit('publisher artifact missing/drifted')
          print(good[0]['id'])
          PY
          )"
          mkdir publisher-artifact
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${PUB_AID}/zip" > publisher.zip
          unzip -q publisher.zip -d publisher-artifact

          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/afpf-v1-preauthorization-audit.yml/runs?branch=main&event=push&per_page=100" > preauth-run-pages.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          pages=json.load(open('preauth-run-pages.json')); runs=[r for page in pages for r in page.get('workflow_runs',[])]
          same=[r for r in runs if r.get('head_sha')==os.environ['AUTH_PARENT']]
          good=[r for r in same if int(r.get('run_attempt') or 0)==1 and r.get('status')=='completed' and r.get('conclusion')=='success']
          if len(same)!=1 or len(good)!=1: raise SystemExit(f'exact-parent preauthorization history invalid: same={len(same)} good={len(good)}')
          Path('preauth-selected.json').write_text(json.dumps(good[0],indent=2,sort_keys=True)+'\n')
          PY
          PRE_RID="$(python -c 'import json;print(json.load(open("preauth-selected.json"))["id"])')"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PRE_RID}/artifacts?per_page=100" > preauth-artifacts.json
          PRE_AID="$(python - <<'PY'
          import json
          rows=json.load(open('preauth-artifacts.json')).get('artifacts',[])
          good=[a for a in rows if a.get('name')=='afpf-v1-preauthorization-proof' and not a.get('expired',False)]
          if len(good)!=1: raise SystemExit('preauthorization artifact missing/drifted')
          print(good[0]['id'])
          PY
          )"
          mkdir preauth-artifact
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${PRE_AID}/zip" > preauth.zip
          unzip -q preauth.zip -d preauth-artifact

          echo "ordinal=$ORDINAL" >> "$GITHUB_OUTPUT"
          echo "parent=$AUTH_PARENT" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "auth_branch=$AUTH_BRANCH" >> "$GITHUB_OUTPUT"
          git ls-files -z > tracked-files.nul
          mkdir -p execution-preflight

      - name: Exact authorization-head tracked-tree seed scan
        shell: bash
        run: |
          set -euo pipefail
          python experiments/aerosol-full-phase-function-sensitivity-v1/tracked_tree_seed_scan.py \
            --repo-root . --file-list tracked-files.nul \
            --candidate-seed-ledger experiments/aerosol-full-phase-function-sensitivity-v1/candidate-seed-ledger.v1.json \
            --allow-self-ledger-json experiments/aerosol-full-phase-function-sensitivity-v1/seed-self-ledger-policy.v1.json \
            --output execution-preflight/tracked-seed-scan.json

      - name: Stable authorization-head repository-global seed recheck
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python experiments/aerosol-full-phase-function-sensitivity-v1/repository_global_seed_scan.py \
            --repository "$GITHUB_REPOSITORY" --issue-number 60 \
            --candidate-seed-ledger experiments/aerosol-full-phase-function-sensitivity-v1/candidate-seed-ledger.v1.json \
            --current-run-id "$GITHUB_RUN_ID" --audit-mode authorization-recheck \
            --expected-branch-name "$GITHUB_REF_NAME" --expected-repo-head "$GITHUB_SHA" \
            --output execution-preflight/repository-global-seed-scan.json

      - name: Build live seed proof and exact one-use science guard
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ORDINAL: ${{ steps.identity.outputs.ordinal }}
          AUTH_PARENT: ${{ steps.identity.outputs.parent }}
          PR_NUMBER: ${{ steps.identity.outputs.pr_number }}
          AUTH_BRANCH: ${{ steps.identity.outputs.auth_branch }}
        run: |
          set -euo pipefail
          python experiments/aerosol-full-phase-function-sensitivity-v1/build_seed_authorization_proof.py \
            --stage-dir experiments/aerosol-full-phase-function-sensitivity-v1 \
            --tracked-tree-report execution-preflight/tracked-seed-scan.json \
            --repository-global-report execution-preflight/repository-global-seed-scan.json \
            --expected-main-head "$GITHUB_SHA" \
            --output execution-preflight/live-seed-authorization-proof.json
          PYTHONPATH=experiments/aerosol-full-phase-function-sensitivity-v1/execution-candidate python - <<'PY'
          import json,os
          from pathlib import Path
          import preauthorization_surface,science_guard
          root=Path('.'); stage=root/'experiments/aerosol-full-phase-function-sensitivity-v1'
          auth=json.load(open(stage/'authorization.json'))
          auth_seed=json.load(open('preauth-artifact/seed-authorization-proof.json'))
          live_seed=json.load(open('execution-preflight/live-seed-authorization-proof.json'))
          pr=json.load(open('auth-pr-selected.json')); rr=json.load(open('auth-review-selected.json'))
          review=json.load(open(next(Path('auth-review-artifact').rglob('authorization-review.json'))))
          pubrun=json.load(open('publisher-selected.json')); publisher=json.load(open(next(Path('publisher-artifact').rglob('dispatch-publisher.json'))))
          payload=preauthorization_surface.collect(os.environ['GITHUB_REPOSITORY'],os.environ['GITHUB_TOKEN'])
          surface=preauthorization_surface.build_dispatch_surface(
              payload,int(os.environ['ORDINAL']),os.environ['GITHUB_SHA'],os.environ['AUTH_PARENT'],
              current_pr=int(os.environ['PR_NUMBER']),current_run_id=int(os.environ['GITHUB_RUN_ID']),
              candidate_seed_authorization_recheck_passed=True,post_dispatch=True,
          )
          ctx={
              'eventName':os.environ['GITHUB_EVENT_NAME'],'runAttempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
              'headSha':os.environ['GITHUB_SHA'],'refName':os.environ['GITHUB_REF_NAME'],
              'dispatchBranchHeadSha':os.environ['GITHUB_SHA'],'authorizationBranchHeadSha':os.environ['GITHUB_SHA'],
              'liveMain':os.environ['AUTH_PARENT'],'workflowRunId':int(os.environ['GITHUB_RUN_ID']),
              'authorizationHead':os.environ['GITHUB_SHA'],'authorizationParent':os.environ['AUTH_PARENT'],
              'pr':{'number':pr['number'],'state':pr['state'],'draft':pr['draft'],'merged':pr.get('merged_at') is not None,'headBranch':pr['head']['ref'],'headSha':pr['head']['sha']},
              'authorizationReview':{'status':review['status'],'headSha':review['headSha'],'parentSha':review['parentSha'],'prNumber':review['prNumber'],'runAttempt':rr['run_attempt'],'conclusion':rr['conclusion'],'scientificRuntimeSetupPerformed':False,'scientificExecutionPerformed':False,'solverExecutionPerformed':False},
              'publisherRun':{'runAttempt':pubrun['run_attempt'],'status':pubrun['status'],'conclusion':pubrun['conclusion']},
              'publisherEvidence':publisher,'freshness':surface,
              'issue60AuthorizationMarkers':surface.get('matchingAuthorizationMarkerBodies',[]),
              'issue60ConsumedMarkers':surface.get('currentConsumedMarkerBodies',[]),
          }
          out=science_guard.evaluate(root,auth,auth_seed,live_seed,ctx)
          if out.get('status')!='EXACT_ONE_USE_AFPF_V1_DISPATCH_AUTHORIZED': raise SystemExit('science guard did not authorize exact one-use AFPF execution')
          Path('execution-preflight/execution-guard.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          Path('execution-preflight/freshness.json').write_text(json.dumps(surface,indent=2,sort_keys=True)+'\n')
          PY

      - name: Emit exact four 90-case matrices from frozen science plan
        id: matrices
        shell: bash
        env:
          AUTH_PARENT: ${{ steps.identity.outputs.parent }}
        run: |
          set -euo pipefail
          PYTHONPATH=experiments/aerosol-full-phase-function-sensitivity-v1/execution-candidate python - <<'PY'
          import json,os
          from pathlib import Path
          import science_plan
          root=Path('.')
          proof=json.load(open('preauth-artifact/seed-authorization-proof.json'))
          out=science_plan.build(root,proof,os.environ['AUTH_PARENT'])
          plan=out['plan']; design=out['design']
          if plan.get('status')!='EXACT_FOUR_90_CASE_SHARDS_REVIEW_DESIGN': raise SystemExit('science plan status drift')
          if plan.get('caseCount')!=360 or plan.get('groupCount')!=72 or plan.get('analysisCellCount')!=24: raise SystemExit('science plan cardinality drift')
          if plan.get('shardCount')!=4 or plan.get('casesPerShard')!=90 or plan.get('maxParallelPerShard')!=2 or plan.get('maximumGlobalCaseParallelism')!=8: raise SystemExit('science plan shard/parallelism drift')
          Path('execution-preflight/science-plan.json').write_text(json.dumps(plan,indent=2,sort_keys=True)+'\n')
          Path('execution-preflight/execution-design.json').write_text(json.dumps(design,indent=2,sort_keys=True)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              for key in ('2','4','6','8'):
                  rows=plan['shards'][key]
                  if len(rows)!=90: raise SystemExit(f'shard {key} cardinality drift')
                  f.write(f'matrix{key}='+json.dumps({'include':rows},sort_keys=True,separators=(',',':'))+'\n')
          PY

      - name: Persist pre-solver guard evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: afpf-v1-preflight-ordinal-${{ steps.identity.outputs.ordinal }}
          path: |
            execution-preflight/
            auth-pr-selected.json
            auth-review-selected.json
            publisher-selected.json
            preauth-selected.json
            experiments/aerosol-full-phase-function-sensitivity-v1/authorization.json
          if-no-files-found: error
          compression-level: 0

  cases-dep2:
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix2) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps: &case_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: afpf-v1
          create-args: -c conda-forge python=3.12.4 rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true
      - name: Fetch exact same-run preflight guard artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ORDINAL: ${{ needs.preflight.outputs.ordinal }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" > current-run-artifact-pages.json
          AID="$(python - <<'PY'
          import json,os
          pages=json.load(open('current-run-artifact-pages.json')); rows=[a for page in pages for a in page.get('artifacts',[])]
          expected=f'afpf-v1-preflight-ordinal-{os.environ["ORDINAL"]}'
          good=[a for a in rows if a.get('name')==expected and not a.get('expired',False)]
          if len(good)!=1: raise SystemExit(f'expected one preflight artifact, got {len(good)}')
          print(good[0]['id'])
          PY
          )"
          mkdir preflight
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${AID}/zip" > preflight.zip
          unzip -q preflight.zip -d preflight
          test -f preflight/execution-preflight/execution-guard.json
          test -f preflight/execution-preflight/execution-design.json

      - name: Reconstruct exact frozen OPAC overlay and capture runtime identity
        shell: micromamba-shell {0}
        env:
          SOURCE_URL: https://www.libradtran.org/lib/exe/fetch.php?media=download%3Aoptprop_v2.1.tar.gz
        run: |
          set -euo pipefail
          curl --location --fail-with-body --silent --show-error --retry 3 --retry-all-errors --retry-delay 10 --connect-timeout 30 --max-time 2700 \
            --user-agent 'twilight-mystic-experiments afpf-v1-science/1.0' \
            --output optprop_v2.1.tar.gz "$SOURCE_URL"
          PYTHONPATH=experiments/aerosol-full-phase-function-sensitivity-v1/execution-candidate python - <<'PY'
          import json,os
          from pathlib import Path
          from runtime_overlay import stage_frozen_overlay
          base=Path(os.environ['CONDA_PREFIX'])/'share/libRadtran/data'
          report=stage_frozen_overlay(base,Path('optprop_v2.1.tar.gz'),Path('libradtran-overlay'))
          Path('overlay-report.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          if report.get('status')!='FROZEN_OPAC_RUNTIME_OVERLAY_STAGED': raise SystemExit('overlay staging status drift')
          if report.get('augmentedDataTreeSha256')!='5d8bbf8e6b91ec3d405dee36f21a94afbb6e5ec6cd67da2dd5dd541738199d80': raise SystemExit('augmented data tree drift')
          PY
          rm optprop_v2.1.tar.gz
          python experiments/mystic-batch-v1/runtime_probe.py \
            --uvspec "$(command -v uvspec)" \
            --data-dir "$PWD/libradtran-overlay/data" \
            --atmosphere "$PWD/libradtran-overlay/data/atmmod/afglus.dat" \
            --runtime-lock experiments/mystic-batch-v1/runtime-lock.micromamba.json \
            --output runtime-report.json
          python - <<'PY'
          import json
          r=json.load(open('runtime-report.json'))
          if r.get('scientificSolverExecuted') is not False: raise SystemExit('runtime report not pre-solver')
          if r.get('libRadtranDataTreeSha256')!='5d8bbf8e6b91ec3d405dee36f21a94afbb6e5ec6cd67da2dd5dd541738199d80': raise SystemExit('runtime augmented data-tree hash drift')
          PY

      - name: Execute exactly one preregistered AFPF case
        shell: micromamba-shell {0}
        env:
          CASE_ID: ${{ matrix.caseId }}
        run: |
          set -euo pipefail
          PYTHONPATH=experiments/aerosol-full-phase-function-sensitivity-v1/execution-candidate python - <<'PY'
          import os,shutil
          from pathlib import Path
          from executor import execute_case
          uvspec=shutil.which('uvspec')
          if not uvspec: raise SystemExit('uvspec missing')
          execute_case(
              Path('.'),
              Path('preflight/execution-preflight/execution-design.json'),
              Path('preflight/execution-preflight/execution-guard.json'),
              Path('runtime-report.json'),
              os.environ['CASE_ID'],
              Path('libradtran-overlay/data'),
              Path('case-output'),
              Path(uvspec),
              allow_execution=True,
          )
          PY
          cp overlay-report.json "case-output/${CASE_ID}/overlay-report.json"

      - name: Persist immutable raw case evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: afpf-v1-case-${{ matrix.caseId }}
          path: case-output/${{ matrix.caseId }}/
          if-no-files-found: error
          compression-level: 0

  cases-dep4:
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix4) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps: *case_steps

  cases-dep6:
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix6) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps: *case_steps

  cases-dep8:
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix8) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps: *case_steps

  aggregate:
    if: ${{ always() && needs.preflight.result == 'success' && needs.cases-dep2.result == 'success' && needs.cases-dep4.result == 'success' && needs.cases-dep6.result == 'success' && needs.cases-dep8.result == 'success' }}
    needs: [preflight, cases-dep2, cases-dep4, cases-dep6, cases-dep8]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch exact same-run preflight design
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ORDINAL: ${{ needs.preflight.outputs.ordinal }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" > preflight-artifact-pages.json
          AID="$(python - <<'PY'
          import json,os
          pages=json.load(open('preflight-artifact-pages.json')); rows=[a for page in pages for a in page.get('artifacts',[])]
          expected=f'afpf-v1-preflight-ordinal-{os.environ["ORDINAL"]}'
          good=[a for a in rows if a.get('name')==expected and not a.get('expired',False)]
          if len(good)!=1: raise SystemExit(f'expected one preflight artifact, got {len(good)}')
          print(good[0]['id'])
          PY
          )"
          mkdir preflight
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${AID}/zip" > preflight.zip
          unzip -q preflight.zip -d preflight
          test -f preflight/execution-preflight/execution-design.json

      - name: Enumerate exact current-run case artifact metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" > artifact-pages.json
          python - <<'PY'
          import json
          from pathlib import Path
          pages=json.load(open('artifact-pages.json')); rows=[a for page in pages for a in page.get('artifacts',[])]
          cases=[a for a in rows if str(a.get('name') or '').startswith('afpf-v1-case-') and not a.get('expired',False)]
          if len(cases)!=360: raise SystemExit(f'expected exactly 360 current-run case artifacts, got {len(cases)}')
          if len({a['name'] for a in cases})!=360: raise SystemExit('duplicate current-run case artifact name')
          Path('case-artifacts.json').write_text(json.dumps({'artifacts':cases},indent=2,sort_keys=True)+'\n')
          PY

      - name: Download exact current-run cases only after complete enumeration
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p case-artifacts case-zips
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          for row in json.load(open('case-artifacts.json'))['artifacts']:
              name=row['name']; aid=row['id']; z=Path('case-zips')/(name+'.zip')
              with z.open('wb') as fh:
                  subprocess.run(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{aid}/zip"],stdout=fh,check=True)
              target=Path('case-artifacts')/name; target.mkdir(); subprocess.run(['unzip','-q',str(z),'-d',str(target)],check=True)
          PY

      - name: Run frozen exact-360 acquisition and scalar spectral analysis
        shell: bash
        run: |
          set -euo pipefail
          python experiments/aerosol-full-phase-function-sensitivity-v1/execution-candidate/aggregate_results.py \
            --repository-root . \
            --execution-design preflight/execution-preflight/execution-design.json \
            --artifact-root case-artifacts \
            --artifact-metadata case-artifacts.json \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --scientific-ordinal "${{ needs.preflight.outputs.ordinal }}" \
            --output-acquisition acquisition-manifest.json \
            --output-analysis analysis-index.json \
            --output-spectral spectral-analysis.json
          python - <<'PY'
          import json
          a=json.load(open('acquisition-manifest.json')); x=json.load(open('analysis-index.json')); s=json.load(open('spectral-analysis.json'))
          if a.get('status')!='COMPLETE_EXACT_360_CASE_ARTIFACT_UNIVERSE' or a.get('caseArtifactCount')!=360 or a.get('groupCount')!=72 or a.get('analysisCellCount')!=24: raise SystemExit('acquisition status/cardinality drift')
          if x.get('status')!='COMPLETED_PREREGISTERED_AFPF_V1_ANALYSIS' or x.get('analysisCellCount')!=24 or x.get('comparisonGroupCount')!=72 or x.get('contrastCountPerPrimaryChannelPerCell')!=7: raise SystemExit('scalar analysis status/cardinality drift')
          if x.get('priorityShapeContrast')!='desert_spheroids_vs_desert': raise SystemExit('priority shape contrast drift')
          if s.get('status')!='COMPLETED_PREREGISTERED_AFPF_V1_SPECTRAL_ANALYSIS' or s.get('analysisCellCount')!=24 or s.get('contrastCountPerCell')!=7: raise SystemExit('spectral analysis status/cardinality drift')
          if s.get('priorityShapeContrast')!='desert_spheroids_vs_desert': raise SystemExit('spectral priority shape contrast drift')
          PY

      - name: Build Level-B input only after exact-360 aggregate success
        shell: bash
        run: |
          set -euo pipefail
          python experiments/aerosol-full-phase-function-sensitivity-v1/execution-candidate/build_level_b_input.py \
            --execution-design preflight/execution-preflight/execution-design.json \
            --acquisition acquisition-manifest.json \
            --artifact-root case-artifacts \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --scientific-ordinal "${{ needs.preflight.outputs.ordinal }}" \
            --output level-b-input.json

      - name: Fetch exact bound starsvisibility human-threshold implementation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/search-maker/starsvisibility/contents/scientific-tools/visibility-v3/human-threshold.mjs?ref=a422afe5fc4197ab15323bafb15512001e061454" > human-threshold-api.json
          python - <<'PY'
          import base64,json
          from pathlib import Path
          row=json.load(open('human-threshold-api.json'))
          if row.get('sha')!='bb4cd0ff02159ecffe276022cec9d292c7a434a3': raise SystemExit('human-threshold Git blob drift')
          Path('human-threshold.mjs').write_bytes(base64.b64decode(str(row.get('content') or '').replace('\n','')))
          PY

      - name: Run frozen Level-B propagation only after exact-360 aggregate
        shell: bash
        run: |
          set -euo pipefail
          node experiments/aerosol-full-phase-function-sensitivity-v1/execution-candidate/level_b_runner.mjs \
            --input level-b-input.json --human-threshold human-threshold.mjs --output level-b-analysis.json
          node - <<'JS'
          const x=JSON.parse(require('fs').readFileSync('level-b-analysis.json','utf8'));
          if(x.status!=='COMPLETED_PREREGISTERED_AFPF_V1_LEVEL_B'||x.caseCount!==360||x.groupCount!==72||x.analysisCellCount!==24||x.contrastCountPerCell!==7) throw new Error('Level-B output status/cardinality drift');
          if(x.priorityShapeContrast!=='desert_spheroids_vs_desert') throw new Error('Level-B priority shape contrast drift');
          JS

      - name: Persist complete preregistered AFPF analysis evidence
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: afpf-v1-analysis
          path: |
            case-artifacts.json
            preflight/execution-preflight/execution-design.json
            acquisition-manifest.json
            analysis-index.json
            spectral-analysis.json
            level-b-input.json
            level-b-analysis.json
            human-threshold-api.json
          if-no-files-found: error
          compression-level: 0

      - name: Publish terminal success checkpoint to Issue 60
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          BODY="AFPF-V1-SCIENCE-COMPLETED ordinal=${{ needs.preflight.outputs.ordinal }} run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT} cases=360 groups=72 cells=24 contrasts=7 artifact_id=${ARTIFACT_ID} artifact_digest=sha256:${ARTIFACT_DIGEST} rerun=false retry=false resume=false"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/60/comments" -f body="$BODY" > /dev/null
