name: AFPF v1 final preauthorization observer

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/afpf-v1-final-preauth-observer.yml

permissions:
  contents: read
  actions: read

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read exact-main preauthorization run metadata only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN: 90bfdd177f394d5065243f4fad6595a41ef66bf4
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/afpf-v1-preauthorization-audit.yml/runs?branch=main&event=push&per_page=100" > pages.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          pages=json.load(open('pages.json'))
          runs=[r for page in pages for r in page.get('workflow_runs',[])]
          matches=[r for r in runs if r.get('head_sha')==os.environ['EXPECTED_MAIN']]
          report={
            'schemaVersion':1,
            'stageId':'afpf-v1-final-preauthorization-observer',
            'expectedMainSha':os.environ['EXPECTED_MAIN'],
            'matchingRunCount':len(matches),
            'runs':[
              {
                'id':r.get('id'),
                'name':r.get('name'),
                'headSha':r.get('head_sha'),
                'headBranch':r.get('head_branch'),
                'event':r.get('event'),
                'status':r.get('status'),
                'conclusion':r.get('conclusion'),
                'runAttempt':r.get('run_attempt'),
                'createdAt':r.get('created_at'),
                'updatedAt':r.get('updated_at'),
              }
              for r in matches
            ],
            'scientificRuntimeRead':False,
            'seedValuesRead':False,
            'resultArtifactsRead':False,
            'rerunOrRetryPerformed':False,
          }
          Path('afpf-final-preauth-observer.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: afpf-v1-final-preauth-observer
          path: afpf-final-preauth-observer.json
          if-no-files-found: error
          compression-level: 0
