name: AOPS v1 ordinal 37 analysis-only recovery
run-name: Recover AOPS v1 ordinal 37 analysis from immutable case artifacts

on:
  push:
    branches:
      - status/aops-v1-analysis-recovery-ordinal-37
    paths:
      - experiments/aerosol-optical-property-sensitivity-v1-analysis-recovery-v1/execution-request.json

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: aops-v1-analysis-recovery-ordinal-37
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact recovery request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bind single-use analysis-recovery request and exact source failure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: "32624595188"
          SOURCE_ORDINAL: "37"
          SOURCE_BRANCH: dispatch/aerosol-optical-property-sensitivity-v1-ordinal-37
          SOURCE_HEAD: a1895adebf39a5c2c12d80276a119e032fdf090b
          REQUEST_PATH: experiments/aerosol-optical-property-sensitivity-v1-analysis-recovery-v1/execution-request.json
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = status/aops-v1-analysis-recovery-ordinal-37
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mapfile -t PARENTS < <(git cat-file -p HEAD | sed -n 's/^parent //p')
          test "${#PARENTS[@]}" = 1
          REQUEST_PARENT="${PARENTS[0]}"
          export REQUEST_PARENT
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = 1
          test "${CHANGED[0]}" = "$REQUEST_PATH"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$REQUEST_PARENT"
          python - <<'PY'
          import json,os
          r=json.load(open(os.environ['REQUEST_PATH']))
          expected={
            'schemaVersion':1,
            'stageId':'aerosol-optical-property-sensitivity-v1-analysis-recovery-v1-request',
            'status':'REQUEST_ANALYSIS_ONLY_RECOVERY',
            'sourceWorkflowRunId':32624595188,
            'sourceScientificOrdinal':37,
            'sourceDispatchHead':'a1895adebf39a5c2c12d80276a119e032fdf090b',
            'sourceCaseArtifactCount':360,
            'solverExecutionPermitted':False,
            'scientificCaseExecutionPermitted':False,
            'githubRerunPermitted':False,
            'retryPermitted':False,
            'resumePermitted':False,
          }
          for k,v in expected.items():
            if r.get(k)!=v: raise SystemExit(f'recovery request drift: {k}={r.get(k)!r} expected {v!r}')
          if r.get('exactRecoveryParentMain')!=os.environ['REQUEST_PARENT']:
            raise SystemExit('recovery request/main binding drift')
          PY
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > source-run.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?filter=latest&per_page=100" > source-job-pages.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" > source-artifact-pages.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/aops-v1-analysis-recovery-v1.yml/runs?branch=${GITHUB_REF_NAME}&event=push&per_page=100" > recovery-run-pages.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/60/comments?per_page=100" > issue60-pages.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          source=json.load(open('source-run.json'))
          if int(source.get('id') or 0)!=32624595188 or int(source.get('run_attempt') or 0)!=1:
            raise SystemExit('source run identity drift')
          if source.get('event')!='workflow_dispatch' or source.get('status')!='completed' or source.get('conclusion')!='failure':
            raise SystemExit('source run is not exact terminal attempt-1 failure')
          if source.get('head_branch')!=os.environ['SOURCE_BRANCH'] or source.get('head_sha')!=os.environ['SOURCE_HEAD']:
            raise SystemExit('source branch/head drift')
          job_pages=json.load(open('source-job-pages.json')); jobs=[j for page in job_pages for j in page.get('jobs',[])]
          if len(jobs)!=362: raise SystemExit(f'expected exact 362 source jobs, got {len(jobs)}')
          pre=[j for j in jobs if j.get('name')=='preflight']
          cases=[j for j in jobs if str(j.get('name') or '').startswith('cases-dep')]
          agg=[j for j in jobs if j.get('name')=='aggregate']
          if len(pre)!=1 or pre[0].get('conclusion')!='success': raise SystemExit('source preflight not success')
          if len(cases)!=360 or any(j.get('conclusion')!='success' for j in cases): raise SystemExit('source case jobs not exact 360/360 success')
          if len(agg)!=1 or int(agg[0].get('id') or 0)!=97168843965 or agg[0].get('conclusion')!='failure': raise SystemExit('source aggregate failure identity drift')
          steps={s.get('name'):s.get('conclusion') for s in agg[0].get('steps',[])}
          required={
            'Enumerate exact current-run case artifact metadata':'success',
            'Download exact current-run cases only after complete enumeration':'success',
            'Run frozen exact-360 acquisition and scalar/spectral analysis':'success',
            'Fetch exact bound starsvisibility human-threshold implementation':'failure',
            'Run frozen Level-B propagation only after exact-360 aggregate':'skipped',
            'Persist complete preregistered AOPS analysis evidence':'skipped',
            'Publish terminal success checkpoint to Issue 60':'skipped',
          }
          for k,v in required.items():
            if steps.get(k)!=v: raise SystemExit(f'source aggregate step drift: {k}={steps.get(k)!r}')
          artifact_pages=json.load(open('source-artifact-pages.json')); artifacts=[a for page in artifact_pages for a in page.get('artifacts',[])]
          cases_meta=[a for a in artifacts if str(a.get('name') or '').startswith('aops-v1-case-') and not a.get('expired',False)]
          if len(cases_meta)!=360 or len({a.get('name') for a in cases_meta})!=360:
            raise SystemExit('source case artifact universe is not exact unique 360')
          if any(a.get('name')=='aops-v1-analysis' for a in artifacts):
            raise SystemExit('source unexpectedly already has final analysis artifact')
          Path('case-artifacts.json').write_text(json.dumps({'artifacts':cases_meta},indent=2,sort_keys=True)+'\n')
          run_pages=json.load(open('recovery-run-pages.json')); runs=[r for page in run_pages for r in page.get('workflow_runs',[])]
          same=[r for r in runs if r.get('head_branch')==os.environ['GITHUB_REF_NAME']]
          if len(same)!=1 or int(same[0].get('id') or 0)!=int(os.environ['GITHUB_RUN_ID']):
            raise SystemExit(f'recovery request is not single-use: observed runs={[(r.get("id"),r.get("run_attempt")) for r in same]}')
          comments=[c for page in json.load(open('issue60-pages.json')) for c in page]
          prefix='AOPS-V1-ANALYSIS-RECOVERY-COMPLETED ordinal=37 source_run=32624595188 '
          if any(str(c.get('body') or '').startswith(prefix) for c in comments):
            raise SystemExit('analysis recovery success marker already exists')
          PY

      - name: Prove frozen analysis bytes and local human-threshold byte identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object experiments/aerosol-optical-property-sensitivity-v1/execution-candidate/aggregate_results.py)" = 28ff3f4ea4b6c8e457b30abd234ecb8c4669cbd9
          test "$(git hash-object experiments/aerosol-optical-property-sensitivity-v1/analysis.py)" = 34be217fcd15596474ae368dbc2328356c33e742
          test "$(git hash-object experiments/aerosol-optical-property-sensitivity-v1/execution-candidate/level_b_driver.mjs)" = 0dda1975a87f379aa3faeac11559a2e4df258821
          test "$(git hash-object experiments/aerosol-optical-property-sensitivity-v1/level_b_analysis.mjs)" = 5dd88576b11a4de51b160935036bde162c94e2c8
          test "$(git hash-object experiments/aerosol-optical-property-sensitivity-v1/execution-contract.review.json)" = 23e494aa054425a236abf9b322180fe5576a7d5b
          test "$(git hash-object experiments/aerosol-optical-property-sensitivity-v1-analysis-recovery-v1/bound-human-threshold.mjs)" = bb4cd0ff02159ecffe276022cec9d292c7a434a3

      - name: Download immutable exact-360 source cases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p case-artifacts case-zips
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          rows=json.load(open('case-artifacts.json'))['artifacts']
          for row in rows:
            name=str(row['name']); aid=int(row['id']); z=Path('case-zips')/(name+'.zip')
            with z.open('wb') as fh:
              subprocess.run(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{aid}/zip"],stdout=fh,check=True)
            expected=str(row.get('digest') or '')
            actual='sha256:'+hashlib.sha256(z.read_bytes()).hexdigest()
            if expected and actual!=expected: raise SystemExit(f'artifact digest mismatch: {name}')
            target=Path('case-artifacts')/name; target.mkdir(); subprocess.run(['unzip','-q',str(z),'-d',str(target)],check=True)
          PY

      - name: Replay exact frozen acquisition and scalar-spectral analysis
        shell: bash
        run: |
          set -euo pipefail
          python experiments/aerosol-optical-property-sensitivity-v1/execution-candidate/aggregate_results.py \
            --repository-root . --artifact-root case-artifacts --artifact-metadata case-artifacts.json \
            --workflow-run-id 32624595188 --scientific-ordinal 37 \
            --output-acquisition acquisition-manifest.json --output-analysis analysis-index.json --output-spectral spectral-analysis.json
          python - <<'PY'
          import json
          a=json.load(open('acquisition-manifest.json')); x=json.load(open('analysis-index.json')); s=json.load(open('spectral-analysis.json'))
          if a.get('status')!='COMPLETE_EXACT_360_CASE_ARTIFACT_UNIVERSE' or a.get('workflowRunId')!=32624595188 or a.get('scientificOrdinal')!=37 or a.get('caseArtifactCount')!=360 or a.get('groupCount')!=72 or a.get('analysisCellCount')!=24:
            raise SystemExit('recovered acquisition status/identity/cardinality drift')
          if x.get('status')!='COMPLETED_PREREGISTERED_AOPS_V1_ANALYSIS' or x.get('workflowRunId')!=32624595188 or x.get('scientificOrdinal')!=37 or x.get('caseCount')!=360 or x.get('comparisonGroupCount')!=72 or x.get('analysisCellCount')!=24:
            raise SystemExit('recovered scalar analysis status/identity/cardinality drift')
          if s.get('status')!='COMPLETED_PREREGISTERED_AOPS_V1_SPECTRAL_ANALYSIS' or s.get('analysisCellCount')!=24 or s.get('contrastCountPerCell')!=9:
            raise SystemExit('recovered spectral analysis status/cardinality drift')
          if x.get('inferentialPValueOrConfidenceIntervalPermitted') is not False or s.get('inferentialPValueOrConfidenceIntervalPermitted') is not False:
            raise SystemExit('frozen no-inference rule drift')
          PY

      - name: Complete frozen preregistered Level-B propagation
        shell: bash
        run: |
          set -euo pipefail
          node experiments/aerosol-optical-property-sensitivity-v1/execution-candidate/level_b_driver.mjs \
            case-artifacts \
            experiments/aerosol-optical-property-sensitivity-v1-analysis-recovery-v1/bound-human-threshold.mjs \
            level-b-analysis.json
          node - <<'JS'
          const x=JSON.parse(require('fs').readFileSync('level-b-analysis.json','utf8'));
          if(x.status!=='COMPLETED_PREREGISTERED_AOPS_V1_LEVEL_B'||x.caseCount!==360||x.analysisCellCount!==24||x.statesPerGroup!==5||x.replicateCountPerCell!==3||x.contrastCountPerCell!==9) throw new Error('Level-B output status/cardinality drift');
          if(x.pValuesPermitted!==false||x.confidenceIntervalsPermitted!==false||x.epsilonSubstitutionPermitted!==false||x.universalSunDepressionToMinutesConversionPermitted!==false) throw new Error('Level-B frozen rule drift');
          JS

      - name: Build recovery provenance after complete frozen replay
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          def h(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          value={
            'schemaVersion':1,
            'stageId':'aerosol-optical-property-sensitivity-v1-analysis-recovery-v1',
            'status':'COMPLETED_ANALYSIS_ONLY_RECOVERY_READY_FOR_IMMUTABLE_UPLOAD',
            'sourceWorkflowRunId':32624595188,
            'sourceWorkflowRunAttempt':1,
            'sourceScientificOrdinal':37,
            'sourceDispatchHead':'a1895adebf39a5c2c12d80276a119e032fdf090b',
            'recoveryWorkflowRunId':int(os.environ['GITHUB_RUN_ID']),
            'recoveryWorkflowRunAttempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
            'recoveryRequestHead':os.environ['GITHUB_SHA'],
            'caseArtifactCount':360,
            'comparisonGroupCount':72,
            'analysisCellCount':24,
            'scientificCaseExecutionPerformed':False,
            'solverExecutionPerformed':False,
            'libRadtranRuntimeSetupPerformed':False,
            'scientificOrdinalAllocated':False,
            'scientificSeedAllocated':False,
            'githubRerun':False,
            'retryPerformed':False,
            'resumePerformed':False,
            'humanThresholdGitBlobSha1':'bb4cd0ff02159ecffe276022cec9d292c7a434a3',
            'outputSha256':{
              'case-artifacts.json':h('case-artifacts.json'),
              'acquisition-manifest.json':h('acquisition-manifest.json'),
              'analysis-index.json':h('analysis-index.json'),
              'spectral-analysis.json':h('spectral-analysis.json'),
              'level-b-analysis.json':h('level-b-analysis.json'),
              'bound-human-threshold.mjs':h('experiments/aerosol-optical-property-sensitivity-v1-analysis-recovery-v1/bound-human-threshold.mjs'),
            },
          }
          Path('recovery-provenance.json').write_text(json.dumps(value,indent=2,sort_keys=True)+'\n')
          PY

      - name: Persist complete AOPS ordinal 37 analysis-recovery evidence
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aops-v1-analysis-recovery-ordinal-37
          path: |
            case-artifacts.json
            acquisition-manifest.json
            analysis-index.json
            spectral-analysis.json
            level-b-analysis.json
            recovery-provenance.json
            experiments/aerosol-optical-property-sensitivity-v1-analysis-recovery-v1/bound-human-threshold.mjs
          if-no-files-found: error
          compression-level: 0

      - name: Publish distinct terminal recovery checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          BODY="AOPS-V1-ANALYSIS-RECOVERY-COMPLETED ordinal=37 source_run=32624595188 recovery_run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT} cases=360 groups=72 cells=24 artifact_id=${ARTIFACT_ID} artifact_digest=sha256:${ARTIFACT_DIGEST} solver=false rerun=false retry=false resume=false"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/60/comments" -f body="$BODY" > /dev/null
