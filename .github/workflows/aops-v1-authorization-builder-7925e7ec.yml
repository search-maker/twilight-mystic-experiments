name: AOPS v1 authorization builder 7925e7ec
on:
  push:
    branches: [status/aops-v1-authorization-builder-7925e7ec]
    paths: [.github/workflows/aops-v1-authorization-builder-7925e7ec.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
jobs:
  build:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - name: Freeze exact live main and failed unconsumed authorization history
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          MAIN=7925e7ec5496e8b532d8a46ead336d6ed0608ff7
          FAILED=aec35f62bf4971d871b5ae2a50bff6cdfb107ac4
          AUTH=authorization/aerosol-optical-property-sensitivity-v1-ordinal-36
          HIST=history/aerosol-optical-property-sensitivity-v1-ordinal-36-auth-review-failed-1
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN"
          test "$(git ls-remote origin refs/heads/$AUTH | cut -f1)" = "$FAILED"
          test "$(git ls-remote origin refs/heads/$HIST | cut -f1)" = "$FAILED"
          test -z "$(git ls-remote --heads origin refs/heads/dispatch/aerosol-optical-property-sensitivity-v1-ordinal-36)"
          gh api repos/${GITHUB_REPOSITORY}/pulls/299 > /tmp/failed-pr.json
          gh api repos/${GITHUB_REPOSITORY}/actions/runs/32612380809 > /tmp/failed-run.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/failed-pr.json')); r=json.load(open('/tmp/failed-run.json'))
          assert p['state']=='closed' and p.get('merged_at') is None and p.get('draft') is True
          assert p['head']['ref']=='authorization/aerosol-optical-property-sensitivity-v1-ordinal-36'
          assert p['head']['sha']=='aec35f62bf4971d871b5ae2a50bff6cdfb107ac4'
          assert r['id']==32612380809 and r['run_attempt']==1 and r['status']=='completed' and r['conclusion']=='failure'
          assert r['head_sha']==p['head']['sha'] and r['head_branch']==p['head']['ref']
          assert r['path']=='.github/workflows/aops-v1-authorization-review.yml'
          PY
      - name: Resolve and verify exact successful preauthorization for 7925e7ec
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          MAIN=7925e7ec5496e8b532d8a46ead336d6ed0608ff7
          found=''
          for i in $(seq 1 90); do
            gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/aops-v1-preauthorization-audit.yml/runs?branch=main&event=push&per_page=100" > /tmp/preauth-pages.json
            python - <<'PY' > /tmp/preauth-state.json
          import json
          pages=json.load(open('/tmp/preauth-pages.json'))
          rows=[r for page in pages for r in page.get('workflow_runs',[]) if r.get('head_sha')=='7925e7ec5496e8b532d8a46ead336d6ed0608ff7']
          if len(rows)>1: raise SystemExit('multiple exact-head preauthorization runs')
          if rows:
              r=rows[0]
              print(json.dumps({k:r.get(k) for k in ('id','path','head_branch','head_sha','run_attempt','status','conclusion')},sort_keys=True))
          PY
            if test -s /tmp/preauth-state.json; then
              status="$(python -c 'import json;print(json.load(open("/tmp/preauth-state.json"))["status"])')"
              if test "$status" = completed; then found=1; break; fi
            fi
            sleep 10
          done
          test -n "$found"
          python - <<'PY'
          import json
          r=json.load(open('/tmp/preauth-state.json'))
          assert r['path']=='.github/workflows/aops-v1-preauthorization-audit.yml'
          assert r['head_branch']=='main'
          assert r['head_sha']=='7925e7ec5496e8b532d8a46ead336d6ed0608ff7'
          assert r['run_attempt']==1
          assert r['status']=='completed' and r['conclusion']=='success'
          open('/tmp/preauth-run.json','w').write(json.dumps(r,sort_keys=True)+'\n')
          PY
          RID="$(python -c 'import json;print(json.load(open("/tmp/preauth-run.json"))["id"])')"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RID}/artifacts?per_page=100" > /tmp/preauth-artifacts.json
          AID="$(python - <<'PY'
          import json
          rows=json.load(open('/tmp/preauth-artifacts.json')).get('artifacts',[])
          good=[a for a in rows if a.get('name')=='aops-v1-preauthorization-proof' and not a.get('expired',False)]
          assert len(good)==1,len(good)
          print(good[0]['id'])
          PY
          )"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${AID}/zip" > /tmp/preauth.zip
          rm -rf /tmp/preauth && mkdir /tmp/preauth
          unzip -q /tmp/preauth.zip -d /tmp/preauth
          python - <<'PY'
          import json
          p=json.load(open('/tmp/preauth/preauthorization.json'))
          f=json.load(open('/tmp/preauth/freshness.json'))
          s=json.load(open('/tmp/preauth/seed-authorization-proof.json'))
          assert p['status']=='PREAUTHORIZATION_SURFACE_CLEAN_NOT_ALLOCATED'
          assert p['exactMainSha']=='7925e7ec5496e8b532d8a46ead336d6ed0608ff7'
          assert p['runAttempt']==1
          assert p['latestPriorConsumedScientificOrdinal']==35
          assert p['nextAvailableScientificOrdinal']==36
          assert f['latestPriorConsumedScientificOrdinal']==35
          assert f['nextAvailableScientificOrdinal']==36
          assert f['authorizationBranchReusableAfterFailedReview'] is True
          assert f['dispatchBranchExists'] is False
          assert f['currentConsumedMarkerCount']==0
          assert f['matchingAuthorizationMarkers']==0
          assert s['status']=='PASS_CANDIDATE_SEEDS_AUTHORIZATION_RECHECK_NOT_ALLOCATED'
          assert s['auditedMainHead']=='7925e7ec5496e8b532d8a46ead336d6ed0608ff7'
          assert s['candidateSeedCount']==72 and s['allCollisionCountersZero'] is True
          for d in (p,s):
              for k in ('scientificOrdinalAllocated','authorizationCreated','dispatchCreated','scientificRuntimeSetupPerformed','scientificExecutionPerformed','solverExecutionPerformed'):
                  if k in d: assert d[k] is False,(k,d[k])
          PY
      - name: Build and push exact one-file direct-child authorization head
        shell: bash
        run: |
          set -euo pipefail
          MAIN=7925e7ec5496e8b532d8a46ead336d6ed0608ff7
          FAILED=aec35f62bf4971d871b5ae2a50bff6cdfb107ac4
          AUTH=authorization/aerosol-optical-property-sensitivity-v1-ordinal-36
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$MAIN"
          test "$(git ls-remote origin refs/heads/$AUTH | cut -f1)" = "$FAILED"
          git checkout -b build-aops-authorization "$MAIN"
          python experiments/aerosol-optical-property-sensitivity-v1/execution-candidate/build_authorization.py \
            --repository-root . \
            --seed-proof /tmp/preauth/seed-authorization-proof.json \
            --main-sha "$MAIN" \
            --ordinal 36 \
            --output experiments/aerosol-optical-property-sensitivity-v1/authorization.json
          python - <<'PY'
          import json
          p='experiments/aerosol-optical-property-sensitivity-v1/authorization.json'
          a=json.load(open(p))
          assert a['status']=='AUTHORIZED_PENDING_SEPARATE_DISPATCH'
          assert a['scientificOrdinal']==36
          assert a['executionKey']=='aerosol-optical-property-sensitivity-v1:numerical:36'
          assert a['authorizationBranch']=='authorization/aerosol-optical-property-sensitivity-v1-ordinal-36'
          assert a['dispatchBranch']=='dispatch/aerosol-optical-property-sensitivity-v1-ordinal-36'
          assert a['exactAuthorizationParentCommit']=='7925e7ec5496e8b532d8a46ead336d6ed0608ff7'
          assert a['reviewPackageMainSha']=='7925e7ec5496e8b532d8a46ead336d6ed0608ff7'
          assert a['exactAuthorizationCommit'] is None
          assert a['scientificExecutionAuthorized'] is True and a['solverExecutionAuthorized'] is True
          assert a['dispatchAuthorized'] is False and a['automaticDispatch'] is False
          assert a['resultOpeningAuthorized'] is False and a['consumed'] is False
          assert a['githubRerunAllowed'] is False and a['retryAllowed'] is False and a['resumeAllowed'] is False
          PY
          test "$(git status --short | wc -l)" = 1
          test "$(git status --short | awk '{print $2}')" = experiments/aerosol-optical-property-sensitivity-v1/authorization.json
          git add experiments/aerosol-optical-property-sensitivity-v1/authorization.json
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Authorize AOPS v1 ordinal 36 pending separate dispatch'
          test "$(git rev-parse HEAD^)" = "$MAIN"
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = 1
          test "${CHANGED[0]}" = experiments/aerosol-optical-property-sensitivity-v1/authorization.json
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force-with-lease="refs/heads/${AUTH}:${FAILED}" origin HEAD:"refs/heads/${AUTH}"
