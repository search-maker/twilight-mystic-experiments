name: AOPS v1 authorization builder observer
on:
  push:
    branches: [status/aops-v1-authorization-builder-observer]
    paths: [.github/workflows/aops-v1-authorization-builder-observer.yml]
permissions:
  actions: read
  contents: write
jobs:
  observe:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read builder run and publish compact result
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target=b4cf23acf66b62edce8d45de4aa5c37a7ecb9a2f
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/aops-v1-post-recovery-authorization-builder.yml/runs?per_page=100" > /tmp/pages.json
          python - <<'PY'
          import json
          pages=json.load(open('/tmp/pages.json'))
          rows=[r for page in pages for r in page.get('workflow_runs',[]) if r.get('head_sha')=='b4cf23acf66b62edce8d45de4aa5c37a7ecb9a2f']
          assert len(rows)==1,rows
          r=rows[0]
          out={k:r.get(k) for k in ('id','name','path','head_branch','head_sha','run_attempt','status','conclusion','created_at','updated_at')}
          open('/tmp/status.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
          git checkout --orphan status/aops-v1-authorization-builder-observer-result
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p observer-result
          cp /tmp/status.json observer-result/status.json
          git add observer-result/status.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Record fresh AOPS authorization builder status'
          git push -f origin HEAD:refs/heads/status/aops-v1-authorization-builder-observer-result
