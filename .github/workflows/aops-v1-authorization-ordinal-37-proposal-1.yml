name: AOPS v1 authorization proposal ordinal 37 no allocation v2

on:
  push:
    branches:
      - status/aops-v1-authorization-ordinal-37-proposal-1
    paths:
      - .github/workflows/aops-v1-authorization-ordinal-37-proposal-1.yml

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  proposal:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact recovered main
        uses: actions/checkout@v4
        with:
          ref: 139c070aebd7cf9ebee4282a4b0995eb3fe418b4
          fetch-depth: 0

      - name: Verify live main and empty ordinal 37 identities
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA=139c070aebd7cf9ebee4282a4b0995eb3fe418b4
          AUTH_BRANCH=authorization/aerosol-optical-property-sensitivity-v1-ordinal-37
          DISPATCH_BRANCH=dispatch/aerosol-optical-property-sensitivity-v1-ordinal-37
          LIVE_MAIN="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$LIVE_MAIN" = "$MAIN_SHA"
          test -z "$(git ls-remote --heads origin "refs/heads/$AUTH_BRANCH")"
          test -z "$(git ls-remote --heads origin "refs/heads/$DISPATCH_BRANCH")"

      - name: Download and verify exact fresh preauthorization proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9488806015/zip" \
            -o /tmp/aops-preauth.zip
          echo "412392187f6fec3b70c3905a0459472be3aed70976f154cf4ace801abb2bdb44  /tmp/aops-preauth.zip" | sha256sum -c -
          mkdir -p /tmp/aops-preauth
          unzip -q /tmp/aops-preauth.zip -d /tmp/aops-preauth
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path('/tmp/aops-preauth')
          proof=root/'seed-authorization-proof.json'
          pre=root/'preauthorization.json'
          assert proof.is_file() and pre.is_file()
          d=json.loads(proof.read_text())
          p=json.loads(pre.read_text())
          assert d['status']=='PASS_CANDIDATE_SEEDS_AUTHORIZATION_RECHECK_NOT_ALLOCATED'
          assert d['auditedMainHead']=='139c070aebd7cf9ebee4282a4b0995eb3fe418b4'
          assert d['candidateSeedCount']==72
          assert d['repositoryGlobalCollisionCount']==0
          assert d['repositoryGlobalDoubleEnumerationStable'] is True
          assert d['scientificOrdinalAllocated'] is False
          assert d['authorizationCreated'] is False
          assert d['dispatchCreated'] is False
          assert d['solverExecutionAuthorized'] is False
          assert hashlib.sha256(proof.read_bytes()).hexdigest()=='f7605a204bc434bee1d86aa2b797770fa85aa80840c80f29e5ee94107ffb3ef5'
          assert p['status']=='PREAUTHORIZATION_SURFACE_CLEAN_NOT_ALLOCATED'
          assert p['exactMainSha']=='139c070aebd7cf9ebee4282a4b0995eb3fe418b4'
          assert p['runId']==32622318195
          assert p['runAttempt']==1
          assert p['latestPriorConsumedScientificOrdinal']==35
          assert p['globalOrdinalMaxObserved']==36
          assert p['nextAvailableScientificOrdinal']==37
          assert p['scientificOrdinalAllocated'] is False
          assert p['authorizationCreated'] is False
          assert p['dispatchCreated'] is False
          assert p['scientificExecutionPerformed'] is False
          assert p['scientificRuntimeSetupPerformed'] is False
          assert p['solverExecutionPerformed'] is False
          assert p['reportSha256']=='aa7a94ce53a8544e41f4db8733b11d2a02c873d65b238a3d36c37b29d3a9477e'
          PY

      - name: Build exact ordinal 37 proposal with frozen builder
        shell: bash
        run: |
          set -euo pipefail
          python experiments/aerosol-optical-property-sensitivity-v1/execution-candidate/build_authorization.py \
            --repository-root . \
            --seed-proof /tmp/aops-preauth/seed-authorization-proof.json \
            --main-sha 139c070aebd7cf9ebee4282a4b0995eb3fe418b4 \
            --ordinal 37 \
            --output /tmp/authorization.proposal.json
          python - <<'PY'
          import hashlib, json, pathlib
          p=pathlib.Path('/tmp/authorization.proposal.json')
          d=json.loads(p.read_text())
          assert d['status']=='AUTHORIZED_PENDING_SEPARATE_DISPATCH'
          assert d['scientificOrdinal']==37
          assert d['executionKey']=='aerosol-optical-property-sensitivity-v1:numerical:37'
          assert d['authorizationBranch']=='authorization/aerosol-optical-property-sensitivity-v1-ordinal-37'
          assert d['dispatchBranch']=='dispatch/aerosol-optical-property-sensitivity-v1-ordinal-37'
          assert d['exactAuthorizationParentCommit']=='139c070aebd7cf9ebee4282a4b0995eb3fe418b4'
          assert d['reviewPackageMainSha']=='139c070aebd7cf9ebee4282a4b0995eb3fe418b4'
          assert d['exactAuthorizationCommit'] is None
          assert d['dispatchAuthorized'] is False
          assert d['resultOpeningAuthorized'] is False
          assert d['automaticDispatch'] is False
          assert d['consumed'] is False
          assert d['githubRerunAllowed'] is False
          assert d['retryAllowed'] is False
          assert d['resumeAllowed'] is False
          print('proposal_sha256='+hashlib.sha256(p.read_bytes()).hexdigest())
          PY

      - name: Prove proposal did not allocate or dispatch
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git ls-remote --heads origin refs/heads/authorization/aerosol-optical-property-sensitivity-v1-ordinal-37)"
          test -z "$(git ls-remote --heads origin refs/heads/dispatch/aerosol-optical-property-sensitivity-v1-ordinal-37)"
          test "$(git rev-parse HEAD)" = "139c070aebd7cf9ebee4282a4b0995eb3fe418b4"

      - name: Upload proposal evidence only
        uses: actions/upload-artifact@v4
        with:
          name: aops-v1-authorization-ordinal-37-proposal-2
          path: /tmp/authorization.proposal.json
          if-no-files-found: error

      - name: Publish successful no-allocation proposal checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$(sha256sum /tmp/authorization.proposal.json | cut -d' ' -f1)"
          BODY=$(cat <<EOF
AOPS-V1-AUTHORIZATION-PROPOSAL-ORDINAL-37
exact_main=139c070aebd7cf9ebee4282a4b0995eb3fe418b4
preauthorization_run=32622318195
preauthorization_artifact=9488806015
run=${GITHUB_RUN_ID}
attempt=${GITHUB_RUN_ATTEMPT}
status=PROPOSAL_VERIFIED_NOT_ALLOCATED_NOT_DISPATCHED
proposal_sha256=${SHA}
authorization_created=false
dispatch_created=false
scientific_execution_performed=false
EOF
)
          gh api "repos/${GITHUB_REPOSITORY}/issues/60/comments" -f body="$BODY" >/dev/null
