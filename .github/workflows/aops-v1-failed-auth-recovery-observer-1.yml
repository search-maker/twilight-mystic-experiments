name: AOPS v1 failed auth recovery observer 1
on:
  push:
    branches: [status/aops-v1-failed-auth-recovery-observer-1]
    paths: [.github/workflows/aops-v1-failed-auth-recovery-observer-1.yml]
permissions:
  actions: read
  contents: write
jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read builder run and publish compact status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs?branch=status%2Faops-v1-failed-auth-recovery-builder-1&event=push&per_page=100" > /tmp/pages.json
          python - <<'PY'
          import json
          pages=json.load(open('/tmp/pages.json'))
          runs=[r for p in pages for r in p.get('workflow_runs',[])]
          if not runs: raise SystemExit('no builder run found')
          r=sorted(runs,key=lambda x:int(x['id']))[-1]
          out={k:r.get(k) for k in ('id','name','status','conclusion','run_attempt','head_sha','head_branch','event','created_at','updated_at','jobs_url')}
          json.dump(out,open('/tmp/status.json','w'),indent=2,sort_keys=True)
          print(json.dumps(out,sort_keys=True))
          PY
          RESULT=status/aops-v1-failed-auth-recovery-observer-1-result
          git checkout --orphan tmp-result
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p observer-result
          cp /tmp/status.json observer-result/status.json
          git add -- observer-result/status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish AOPS recovery builder status"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:refs/heads/$RESULT
