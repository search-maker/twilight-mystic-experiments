name: AOPS v1 materializer observer 5
on:
  push:
    branches: [status/aops-v1-materializer-observer-5]
    paths: [.github/workflows/aops-v1-materializer-observer-5.yml]
permissions:
  contents: write
  actions: read
jobs:
  observe:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read materializer run and publish compact result
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target=f45b7f6b3d143e57af0beed6a78de11191babfec
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${target}&per_page=20" > /tmp/runs.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/runs.json'))['workflow_runs']
          rows=[r for r in x if r.get('head_sha')=='f45b7f6b3d143e57af0beed6a78de11191babfec' and r.get('path')=='.github/workflows/aops-v1-recovery-materializer-5.yml']
          assert len(rows)==1, rows
          r=rows[0]
          out={k:r.get(k) for k in ('id','name','path','head_branch','head_sha','run_attempt','status','conclusion','created_at','updated_at')}
          open('/tmp/status.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
          git checkout --orphan status/aops-v1-materializer-observer-5-result
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p observer-result
          cp /tmp/status.json observer-result/status.json
          git add observer-result/status.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Record AOPS materializer status'
          git push -f origin HEAD:refs/heads/status/aops-v1-materializer-observer-5-result
