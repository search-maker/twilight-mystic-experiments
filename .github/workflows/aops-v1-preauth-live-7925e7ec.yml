name: AOPS v1 preauthorization live status 7925e7ec
on:
  push:
    branches: [status/aops-v1-preauth-live-7925e7ec]
    paths: [.github/workflows/aops-v1-preauth-live-7925e7ec.yml]
permissions:
  actions: read
  contents: write
jobs:
  observe:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish exact-main preauthorization current state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/aops-v1-preauthorization-audit.yml/runs?branch=main&event=push&per_page=100" > /tmp/pages.json
          python - <<'PY'
          import json
          pages=json.load(open('/tmp/pages.json'))
          rows=[r for page in pages for r in page.get('workflow_runs',[]) if r.get('head_sha')=='7925e7ec5496e8b532d8a46ead336d6ed0608ff7']
          assert len(rows)==1, rows
          r=rows[0]
          out={k:r.get(k) for k in ('id','name','path','head_branch','head_sha','run_attempt','status','conclusion','created_at','updated_at')}
          open('/tmp/status.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
          git checkout --orphan status/aops-v1-preauth-live-7925e7ec-result
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p observer-result
          cp /tmp/status.json observer-result/status.json
          git add observer-result/status.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Record live AOPS preauthorization state'
          git push -f origin HEAD:refs/heads/status/aops-v1-preauth-live-7925e7ec-result
