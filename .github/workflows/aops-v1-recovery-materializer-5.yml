name: AOPS v1 recovery materializer 5
on:
  push:
    branches: [status/aops-v1-recovery-materializer-5]
    paths: [.github/workflows/aops-v1-recovery-materializer-5.yml]
permissions:
  contents: read
  actions: read
jobs:
  materialize:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - name: Prove failed identity remains unconsumed and load tested patch generator
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          MAIN=7297a579112b6089acc5b5d45292e8169039c022
          FAILED=aec35f62bf4971d871b5ae2a50bff6cdfb107ac4
          AUTH=authorization/aerosol-optical-property-sensitivity-v1-ordinal-36
          HIST=history/aerosol-optical-property-sensitivity-v1-ordinal-36-auth-review-failed-1
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN"
          test "$(git ls-remote origin refs/heads/$AUTH | cut -f1)" = "$FAILED"
          test "$(git ls-remote origin refs/heads/$HIST | cut -f1)" = "$FAILED"
          test -z "$(git ls-remote --heads origin refs/heads/dispatch/aerosol-optical-property-sensitivity-v1-ordinal-36)"
          gh api repos/${GITHUB_REPOSITORY}/pulls/299 > /tmp/pr.json
          gh api repos/${GITHUB_REPOSITORY}/actions/runs/32612380809 > /tmp/run.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/pr.json')); r=json.load(open('/tmp/run.json'))
          assert p['state']=='closed' and p.get('merged_at') is None
          assert p['head']['ref']=='authorization/aerosol-optical-property-sensitivity-v1-ordinal-36'
          assert p['head']['sha']=='aec35f62bf4971d871b5ae2a50bff6cdfb107ac4'
          assert r['head_sha']==p['head']['sha'] and r['head_branch']==p['head']['ref']
          assert r['path']=='.github/workflows/aops-v1-authorization-review.yml'
          assert r['run_attempt']==1 and r['status']=='completed' and r['conclusion']=='failure'
          PY
          git fetch origin status/aops-v1-failed-auth-recovery-builder-2
          git show FETCH_HEAD:tools/aops_v1_failed_auth_recovery_builder_2.py > /tmp/recovery.py
          python -m py_compile /tmp/recovery.py
      - name: Reconstruct exact recovery bytes on frozen main
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach 7297a579112b6089acc5b5d45292e8169039c022
          python /tmp/recovery.py
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          gp=Path('experiments/aerosol-optical-property-sensitivity-v1/execution-candidate/global_ordinal.py')
          gt=gp.read_text()
          old=r'b"\\0"'; new=r'b"\0"'
          if gt.count(old)!=1: raise SystemExit(f'blob separator escape count={gt.count(old)}')
          gt=gt.replace(old,new,1)
          old=r'(?:\\s|$)'; new=r'(?:\s|$)'
          if gt.count(old)!=1: raise SystemExit(f'regex escape count={gt.count(old)}')
          gt=gt.replace(old,new,1)
          gp.write_text(gt)
          gdata=gp.read_bytes()
          gblob=hashlib.sha1(b'blob '+str(len(gdata)).encode()+b'\0'+gdata).hexdigest()

          cp=Path('experiments/aerosol-optical-property-sensitivity-v1/execution-candidate/control_surface.py')
          ct=cp.read_text()
          old='''import json\nimport re\nimport urllib.error\nimport urllib.parse\nimport urllib.request\nfrom typing import Any\n\nfrom freshness import (\n    authorization_branch,\n    consumed_marker,\n    dispatch_branch,\n    execution_key,\n    matching_marker,\n    positive_candidate_claims,\n)\nfrom global_ordinal import failed_authorization_history\n'''
          new=f'''import hashlib\nimport importlib.util\nimport json\nimport re\nimport urllib.error\nimport urllib.parse\nimport urllib.request\nfrom pathlib import Path\nfrom typing import Any\n\n\ndef _git_blob_sha1(path: Path) -> str:\n    data = path.read_bytes()\n    return hashlib.sha1(b"blob " + str(len(data)).encode() + b"\\0" + data).hexdigest()\n\n\ndef _load_bound_sibling(name: str, path: Path, expected_blob: str):\n    if _git_blob_sha1(path) != expected_blob:\n        raise RuntimeError(f"bound sibling byte drift: {{path.name}}")\n    spec = importlib.util.spec_from_file_location(name, path)\n    if spec is None or spec.loader is None:\n        raise RuntimeError(f"cannot load bound sibling: {{path}}")\n    mod = importlib.util.module_from_spec(spec)\n    spec.loader.exec_module(mod)\n    return mod\n\n\n_HERE = Path(__file__).resolve().parent\n_freshness = _load_bound_sibling(\n    "aops_control_surface_freshness", _HERE / "freshness.py",\n    "3b4b087a211a5400164ea592ac1e947cff29631d",\n)\n_global_ordinal = _load_bound_sibling(\n    "aops_control_surface_global_ordinal", _HERE / "global_ordinal.py",\n    "{gblob}",\n)\nauthorization_branch = _freshness.authorization_branch\nconsumed_marker = _freshness.consumed_marker\ndispatch_branch = _freshness.dispatch_branch\nexecution_key = _freshness.execution_key\nmatching_marker = _freshness.matching_marker\npositive_candidate_claims = _freshness.positive_candidate_claims\nfailed_authorization_history = _global_ordinal.failed_authorization_history\n'''
          if ct.count(old)!=1:
              raise SystemExit(f'control_surface import replacement count={ct.count(old)}')
          cp.write_text(ct.replace(old,new,1))

          fp=Path('evidence/aerosol-optical-property-sensitivity-v1/review-freeze.json')
          freeze=json.loads(fp.read_text())
          freeze['globalOrdinalWrapperGitBlobSha1']=gblob
          fp.write_text(json.dumps(freeze,indent=2,sort_keys=True)+'\n')

          tp=Path('experiments/aerosol-optical-property-sensitivity-v1/transport-contract.v1.json')
          contract=json.loads(tp.read_text())
          for rel in (
              '.github/workflows/aops-v1-authorization-review.yml',
              '.github/workflows/aops-v1-dispatch-publisher.yml',
              'experiments/aerosol-optical-property-sensitivity-v1/execution-candidate/control_surface.py',
              'experiments/aerosol-optical-property-sensitivity-v1/execution-candidate/global_ordinal.py',
          ):
              data=Path(rel).read_bytes()
              contract['gitBlobBindings'][rel]=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          tp.write_text(json.dumps(contract,indent=2,sort_keys=True)+'\n')
          PY
          cat > tests/test_aops_v1_module_isolation_recovery.py <<'PY'
          from __future__ import annotations
          import subprocess, sys, textwrap, unittest
          from pathlib import Path

          ROOT=Path(__file__).resolve().parents[1]

          class ModuleIsolation(unittest.TestCase):
              def test_control_surface_ignores_poisoned_global_freshness_module(self):
                  code=textwrap.dedent(r'''
                      import importlib.util, sys, types
                      from pathlib import Path
                      fake=types.ModuleType('freshness')
                      fake.authorization_branch=lambda ordinal: 'authorization/WRONG-stage-ordinal-'+str(ordinal)
                      sys.modules['freshness']=fake
                      p=Path('experiments/aerosol-optical-property-sensitivity-v1/execution-candidate/control_surface.py').resolve()
                      spec=importlib.util.spec_from_file_location('aops_control_surface_isolation_test',p)
                      m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
                      assert m.authorization_branch(36)=='authorization/aerosol-optical-property-sensitivity-v1-ordinal-36'
                  ''')
                  subprocess.run([sys.executable,'-c',code],cwd=ROOT,check=True)
          PY
          test "$(git diff --name-only | wc -l)" = 8
          git diff --check
          python -m unittest tests.test_aops_v1_failed_authorization_recovery tests.test_aops_v1_module_isolation_recovery tests.test_aerosol_optical_property_sensitivity_v1_global_ordinal_review -v
      - name: Reconfirm full repository suite on materialized bytes
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
      - name: Package exact eight-file recovery
        shell: bash
        run: |
          set -euo pipefail
          files=(
            .github/workflows/aops-v1-authorization-review.yml
            .github/workflows/aops-v1-dispatch-publisher.yml
            experiments/aerosol-optical-property-sensitivity-v1/execution-candidate/control_surface.py
            experiments/aerosol-optical-property-sensitivity-v1/execution-candidate/global_ordinal.py
            experiments/aerosol-optical-property-sensitivity-v1/transport-contract.v1.json
            evidence/aerosol-optical-property-sensitivity-v1/review-freeze.json
            tests/test_aops_v1_failed_authorization_recovery.py
            tests/test_aops_v1_module_isolation_recovery.py
          )
          mkdir -p recovery-materialized
          cp --parents "${files[@]}" recovery-materialized/
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('recovery-materialized')
          rows=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              rel=p.relative_to(root).as_posix(); data=p.read_bytes()
              rows.append({
                  'path':rel,
                  'sha256':hashlib.sha256(data).hexdigest(),
                  'gitBlobSha1':hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest(),
                  'bytes':len(data),
              })
          assert len(rows)==8
          Path('recovery-materialized/MANIFEST.json').write_text(json.dumps({'baseMain':'7297a579112b6089acc5b5d45292e8169039c022','files':rows},indent=2,sort_keys=True)+'\n')
          PY
          tar -C recovery-materialized -czf aops-v1-recovery-8files.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: aops-v1-recovery-8files
          path: aops-v1-recovery-8files.tar.gz
          if-no-files-found: error
          retention-days: 7
