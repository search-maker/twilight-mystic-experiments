name: AOPS v1 retirement builder observer 1
on:
  push:
    branches: [status/aops-v1-retirement-builder-observer-1]
    paths: [.github/workflows/aops-v1-retirement-builder-observer-1.yml]
permissions:
  actions: read
  contents: write
jobs:
  observe:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read builder run and publish compact result
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch=status/aops-v1-publisher-retirement-recovery-builder-1
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs?branch=${branch}&per_page=100" > /tmp/pages.json
          python - <<'PY'
          import json
          pages=json.load(open('/tmp/pages.json'))
          rows=[r for page in pages for r in page.get('workflow_runs',[]) if r.get('head_branch')=='status/aops-v1-publisher-retirement-recovery-builder-1']
          rows=[r for r in rows if r.get('path')=='.github/workflows/aops-v1-publisher-retirement-recovery-builder-1.yml']
          assert len(rows)==1, rows
          r=rows[0]
          out={k:r.get(k) for k in ('id','name','path','head_branch','head_sha','run_attempt','status','conclusion','created_at','updated_at')}
          open('/tmp/status.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
          git checkout --orphan status/aops-v1-retirement-builder-observer-1-result
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p observer-result
          cp /tmp/status.json observer-result/status.json
          git add observer-result/status.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Record AOPS retirement builder status'
          git push -f origin HEAD:refs/heads/status/aops-v1-retirement-builder-observer-1-result
