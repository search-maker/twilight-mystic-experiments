name: AOPS v1 ordinal 37 run observer
run-name: Observe AOPS v1 ordinal 37 run and job metadata only

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - .github/workflows/aops-v1-science-run-observer-37.yml

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read exact AOPS ordinal 37 run and job metadata only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: dispatch/aerosol-optical-property-sensitivity-v1-ordinal-37
          TARGET_HEAD: a1895adebf39a5c2c12d80276a119e032fdf090b
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/aops-v1-execution.yml/runs?branch=${TARGET_BRANCH}&event=workflow_dispatch&per_page=100" > run-pages.json
          python - <<'PY'
          import json, os
          pages=json.load(open('run-pages.json'))
          runs=[r for page in pages for r in page.get('workflow_runs',[])]
          same=[r for r in runs if r.get('head_branch')==os.environ['TARGET_BRANCH'] and r.get('head_sha')==os.environ['TARGET_HEAD']]
          if len(same)!=1: raise SystemExit(f'expected exactly one matching science run, got {len(same)}')
          print(same[0]['id'])
          PY
          SCIENCE_RUN_ID="$(python - <<'PY'
          import json, os
          pages=json.load(open('run-pages.json')); runs=[r for page in pages for r in page.get('workflow_runs',[])]
          same=[r for r in runs if r.get('head_branch')==os.environ['TARGET_BRANCH'] and r.get('head_sha')==os.environ['TARGET_HEAD']]
          if len(same)!=1: raise SystemExit(2)
          print(same[0]['id'])
          PY
          )"
          export SCIENCE_RUN_ID
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${SCIENCE_RUN_ID}/jobs?filter=latest&per_page=100" > job-pages.json
          python - <<'PY'
          import json, os
          from collections import Counter
          from pathlib import Path
          run_pages=json.load(open('run-pages.json')); runs=[r for page in run_pages for r in page.get('workflow_runs',[])]
          same=[r for r in runs if r.get('head_branch')==os.environ['TARGET_BRANCH'] and r.get('head_sha')==os.environ['TARGET_HEAD']]
          if len(same)!=1: raise SystemExit('matching run cardinality drift')
          run=same[0]
          job_pages=json.load(open('job-pages.json')); jobs=[j for page in job_pages for j in page.get('jobs',[])]
          run_fields=('id','name','display_title','event','status','conclusion','run_number','run_attempt','head_branch','head_sha','created_at','updated_at','run_started_at','html_url')
          job_fields=('id','name','status','conclusion','started_at','completed_at','runner_name','html_url')
          counts=Counter(str(j.get('conclusion') or j.get('status') or 'UNKNOWN') for j in jobs)
          nonsuccess=[{k:j.get(k) for k in job_fields} for j in jobs if j.get('conclusion') not in ('success','skipped')]
          skipped=[{k:j.get(k) for k in job_fields} for j in jobs if j.get('conclusion')=='skipped']
          out={
            'schemaVersion':2,
            'stageId':'aops-v1-ordinal-37-run-observer',
            'status':'CONTROL_METADATA_ONLY_NO_RESULT_OPENING',
            'targetBranch':os.environ['TARGET_BRANCH'],
            'targetHead':os.environ['TARGET_HEAD'],
            'matchingRunCount':1,
            'matchingRun':{k:run.get(k) for k in run_fields},
            'jobCount':len(jobs),
            'jobConclusionCounts':dict(sorted(counts.items())),
            'nonSuccessNonSkippedJobs':nonsuccess,
            'skippedJobs':skipped,
            'scientificArtifactsOpened':False,
            'scientificResultsInterpreted':False,
            'jobLogsOpened':False,
            'rerunRequested':False,
            'retryRequested':False,
            'resumeRequested':False,
          }
          Path('aops-v1-ordinal-37-run-metadata.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY
      - name: Persist observer metadata only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aops-v1-ordinal-37-run-observer
          path: aops-v1-ordinal-37-run-metadata.json
          if-no-files-found: error
          compression-level: 0
