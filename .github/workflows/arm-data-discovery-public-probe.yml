name: ARM Data Discovery Public Probe

on:
  workflow_dispatch:
  push:
    branches:
      - review/arm-ena-sws-v1-stage0
    paths:
      - 'review/arm-ena-sws-v1-stage0/probe_arm_data_discovery_public_search.py'
      - '.github/workflows/arm-data-discovery-public-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe public static frontend
        run: python review/arm-ena-sws-v1-stage0/probe_arm_data_discovery_public_search.py
      - name: Verify firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('review/arm-ena-sws-v1-stage0/public-discovery-probe-output/arm_data_discovery_public_probe_summary.json')
          x=json.loads(p.read_text())
          assert x['credentials_supplied'] is False
          assert x['measurement_files_requested'] is False
          assert x['protected_sws_values_opened'] is False
          assert x['native_disposition_not_inferred'] is True
          assert x['science_gate_changed'] is False
          assert x['stage_b_authorized'] is False
          print(json.dumps(x, indent=2, sort_keys=True))
          PY
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: ARM-Data-Discovery-Public-Probe
          path: review/arm-ena-sws-v1-stage0/public-discovery-probe-output/
          if-no-files-found: error
