name: ARM Data Discovery Public Probe

on:
  workflow_dispatch:
  push:
    branches:
      - review/arm-ena-sws-v1-stage0
    paths:
      - 'review/arm-ena-sws-v1-stage0/probe_arm_data_discovery_public_search.py'
      - 'review/arm-ena-sws-v1-stage0/probe_arm_public_file_info.py'
      - '.github/workflows/arm-data-discovery-public-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe public static frontend
        run: python review/arm-ena-sws-v1-stage0/probe_arm_data_discovery_public_search.py
      - name: Probe anonymous file-info metadata search
        run: python review/arm-ena-sws-v1-stage0/probe_arm_public_file_info.py
      - name: Verify firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('review/arm-ena-sws-v1-stage0/public-discovery-probe-output/arm_data_discovery_public_probe_summary.json').read_text())
          b=json.loads(Path('review/arm-ena-sws-v1-stage0/public-file-info-probe-output/arm_public_file_info_probe_summary.json').read_text())
          for x in (a,b):
              assert x['credentials_supplied'] is False
              assert x['protected_sws_values_opened'] is False
              assert x['native_disposition_not_inferred'] is True
              assert x['science_gate_changed'] is False
              assert x['stage_b_authorized'] is False
          assert a['measurement_files_requested'] is False
          assert b['measurement_files_requested'] is False
          assert b['measurement_payload_values_read'] is False
          print(json.dumps({'frontend':a,'file_info':b}, indent=2, sort_keys=True))
          PY
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: ARM-Data-Discovery-Public-Probe
          path: |
            review/arm-ena-sws-v1-stage0/public-discovery-probe-output/
            review/arm-ena-sws-v1-stage0/public-file-info-probe-output/
          if-no-files-found: error
