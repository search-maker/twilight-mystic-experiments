name: ARM ENA Live25 Public Completeness Audit

on:
  workflow_dispatch:
  push:
    branches:
      - review/arm-ena-sws-v1-stage0
    paths:
      - 'review/arm-ena-sws-v1-stage0/audit_ena_live25_public_completeness.py'
      - '.github/workflows/arm-ena-live25-public-completeness-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run public completeness audit
        run: python review/arm-ena-sws-v1-stage0/audit_ena_live25_public_completeness.py
      - name: Verify firewall and documentary-only semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('review/arm-ena-sws-v1-stage0/public-completeness-output/ena_live25_public_completeness_summary.json')
          x=json.loads(p.read_text())
          assert x['protected_sws_values_opened'] is False
          assert x['stage_b_authorized'] is False
          assert x['native_disposition_not_inferred'] is True
          assert x['absence_from_report_is_not_native_absence'] is True
          assert x['science_gate_changed'] is False
          print(json.dumps(x, indent=2, sort_keys=True))
          PY
      - name: Upload completeness audit
        uses: actions/upload-artifact@v4
        with:
          name: ARM-ENA-Live25-Public-Completeness-Audit
          path: review/arm-ena-sws-v1-stage0/public-completeness-output/
          if-no-files-found: error
