name: ARM ENA Live25 Public DQR Audit

on:
  workflow_dispatch:
  push:
    branches:
      - review/arm-ena-sws-v1-stage0
    paths:
      - 'review/arm-ena-sws-v1-stage0/audit_ena_live25_public_dqr.py'
      - 'review/arm-ena-sws-v1-stage0/failclose_ena_public_dqr_date_anomalies.py'
      - 'review/arm-ena-sws-v1-stage0/audit_ena_sws_e0.py'
      - 'review/arm-ena-sws-v1-stage0/ena_sws_e4_e7_25_live_cases.json'
      - '.github/workflows/arm-ena-live25-public-dqr-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen E0 dependencies
        run: python -m pip install -r review/arm-ena-sws-v1-stage0/requirements-ena-sws-e0.txt
      - name: Run public DQR audit
        run: python review/arm-ena-sws-v1-stage0/audit_ena_live25_public_dqr.py
      - name: Fail-close impossible DQR dates
        run: python review/arm-ena-sws-v1-stage0/failclose_ena_public_dqr_date_anomalies.py
      - name: Verify firewall and documentary-only semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('review/arm-ena-sws-v1-stage0/public-dqr-output/ena_live25_public_dqr_summary.json')
          x=json.loads(p.read_text())
          assert x['case_count']==25
          assert x['protected_sws_values_opened'] is False
          assert x['stage_b_authorized'] is False
          assert x['native_disposition_not_inferred'] is True
          assert x['absence_of_dqr_is_not_native_pass'] is True
          assert x['science_gate_changed'] is False
          assert x.get('dqr_interval_date_anomaly_rows',0) >= 0
          print(json.dumps(x, indent=2, sort_keys=True))
          PY
      - name: Upload documentary DQR audit
        uses: actions/upload-artifact@v4
        with:
          name: ARM-ENA-Live25-Public-DQR-Audit
          path: review/arm-ena-sws-v1-stage0/public-dqr-output/
          if-no-files-found: error
