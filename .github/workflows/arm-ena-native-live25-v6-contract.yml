name: ARM ENA native live25 v6 acquisition contract

on:
  push:
    branches:
      - review/arm-ena-sws-v1-stage0
    paths:
      - 'review/arm-ena-sws-v1-stage0/run_ena_native_live25_v6.py'
      - 'review/arm-ena-sws-v1-stage0/test_run_ena_native_live25_v6_transport.py'
      - 'review/arm-ena-sws-v1-stage0/run_ena_native_live25_v5.py'
      - 'review/arm-ena-sws-v1-stage0/ena_native_gate_core_v2.py'
      - 'review/arm-ena-sws-v1-stage0/ena_native_gate_core_v3.py'
      - 'review/arm-ena-sws-v1-stage0/ena_native_gate_core_v4.py'
      - 'review/arm-ena-sws-v1-stage0/ena_native_gate_core_v5.py'
      - '.github/workflows/arm-ena-native-live25-v6-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: review/arm-ena-sws-v1-stage0/requirements-ena-sws-e0.txt
      - name: Install frozen parser dependencies
        run: python -m pip install -r review/arm-ena-sws-v1-stage0/requirements-ena-sws-e0.txt
      - name: Compile corrected native chain
        working-directory: review/arm-ena-sws-v1-stage0
        run: |
          python -m py_compile \
            ena_native_gate_core_v2.py \
            ena_native_gate_core_v3.py \
            ena_native_gate_core_v4.py \
            ena_native_gate_core_v5.py \
            run_ena_native_live25_v5.py \
            run_ena_native_live25_v6.py \
            test_run_ena_native_live25_v6_transport.py
      - name: Verify unresolved-acquisition contracts
        working-directory: review/arm-ena-sws-v1-stage0
        run: python test_run_ena_native_live25_v6_transport.py
      - name: Verify corrected science-core wiring remains v5
        working-directory: review/arm-ena-sws-v1-stage0
        run: |
          python test_run_ena_native_live25_v2_wiring.py
          python test_run_ena_native_live25_v3_wiring.py
          python test_run_ena_native_live25_v4_wiring.py
          python test_run_ena_native_live25_v5_wiring.py
      - name: Static holdout boundary
        working-directory: review/arm-ena-sws-v1-stage0
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('run_ena_native_live25_v6.py').read_text(encoding='utf-8').lower()
          forbidden = ('enaswsc1', 'savedata?sws', 'radiance[', 'brightness[')
          assert not any(x in p for x in forbidden), forbidden
          print('PASS v6 wrapper contains no SWS datastream/protected-value access path')
          PY
