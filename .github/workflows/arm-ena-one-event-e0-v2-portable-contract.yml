name: ARM ENA portable one-event E0 v2 probe contract

on:
  push:
    branches:
      - review/arm-ena-sws-v1-stage0
    paths:
      - 'review/arm-ena-sws-v1-stage0/run_one_ena_sws_schema_probe_v2.py'
      - 'review/arm-ena-sws-v1-stage0/test_run_one_ena_sws_schema_probe_v2.py'
      - 'review/arm-ena-sws-v1-stage0/run_ena_sws_e0_frozen_v2.py'
      - '.github/workflows/arm-ena-one-event-e0-v2-portable-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile portable probe
        working-directory: review/arm-ena-sws-v1-stage0
        run: |
          python -m py_compile \
            run_one_ena_sws_schema_probe_v2.py \
            test_run_one_ena_sws_schema_probe_v2.py
      - name: Verify portable firewall contracts
        working-directory: review/arm-ena-sws-v1-stage0
        run: python test_run_one_ena_sws_schema_probe_v2.py
      - name: Static credential and holdout boundary
        working-directory: review/arm-ena-sws-v1-stage0
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('run_one_ena_sws_schema_probe_v2.py').read_text(encoding='utf-8').lower()
          assert '"--user-id"' not in text
          assert '"--access-token"' not in text
          assert 'radiance[' not in text
          assert 'brightness[' not in text
          assert 'intensity[' not in text
          assert 'counts[' not in text
          assert 'run_ena_sws_e0_frozen_v2.py' in text
          assert '--stop-after", "1"' in text
          print('PASS portable probe uses env-only credentials and frozen one-event E0-v2 path')
          PY
