name: ARM ENA surface live25 v3 acquisition contract

on:
  push:
    branches:
      - review/arm-ena-sws-v1-stage0
    paths:
      - 'review/arm-ena-sws-v1-stage0/run_ena_surface_live25.py'
      - 'review/arm-ena-sws-v1-stage0/run_ena_surface_live25_v2.py'
      - 'review/arm-ena-sws-v1-stage0/run_ena_surface_live25_v3.py'
      - 'review/arm-ena-sws-v1-stage0/ena_surface_gate_v2.py'
      - 'review/arm-ena-sws-v1-stage0/test_run_ena_surface_live25_v3_transport.py'
      - '.github/workflows/arm-ena-surface-live25-v3-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: review/arm-ena-sws-v1-stage0/requirements-ena-sws-e0.txt
      - name: Install frozen parser dependencies
        run: python -m pip install -r review/arm-ena-sws-v1-stage0/requirements-ena-sws-e0.txt
      - name: Compile E6 v2/v3 chain
        working-directory: review/arm-ena-sws-v1-stage0
        run: |
          python -m py_compile \
            ena_surface_gate_v2.py \
            run_ena_surface_live25.py \
            run_ena_surface_live25_v2.py \
            run_ena_surface_live25_v3.py \
            test_run_ena_surface_live25_v3_transport.py
      - name: Verify E6 unresolved-acquisition contracts
        working-directory: review/arm-ena-sws-v1-stage0
        run: python test_run_ena_surface_live25_v3_transport.py
      - name: Re-verify corrected E6 science gate and wiring
        working-directory: review/arm-ena-sws-v1-stage0
        run: |
          python test_ena_surface_gate_v2.py
          python test_run_ena_surface_live25_v2_wiring.py
      - name: Static holdout boundary
        working-directory: review/arm-ena-sws-v1-stage0
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('run_ena_surface_live25_v3.py','test_run_ena_surface_live25_v3_transport.py'):
              text=Path(name).read_text(encoding='utf-8').lower()
              forbidden=('enaswsc1','savedata?sws','radiance[','brightness[','intensity[','counts[')
              assert not any(x in text for x in forbidden), (name, forbidden)
          print('PASS E6 v3 wrapper/tests contain no SWS datastream/protected-value access path')
          PY
