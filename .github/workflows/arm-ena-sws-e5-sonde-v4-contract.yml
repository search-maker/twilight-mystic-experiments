name: ARM ENA SWS E5 sonde v4 contract

on:
  push:
    branches:
      - review/arm-ena-sws-v1-stage0
    paths:
      - 'review/arm-ena-sws-v1-stage0/ena_native_gate_core_v1.py'
      - 'review/arm-ena-sws-v1-stage0/ena_native_gate_core_v2.py'
      - 'review/arm-ena-sws-v1-stage0/ena_native_gate_core_v3.py'
      - 'review/arm-ena-sws-v1-stage0/ena_native_gate_core_v4.py'
      - 'review/arm-ena-sws-v1-stage0/test_ena_native_e5_v4.py'
      - 'review/arm-ena-sws-v1-stage0/run_ena_native_live25.py'
      - 'review/arm-ena-sws-v1-stage0/run_ena_native_live25_v4.py'
      - 'review/arm-ena-sws-v1-stage0/test_run_ena_native_live25_v4_wiring.py'
      - '.github/workflows/arm-ena-sws-e5-sonde-v4-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e5-v4-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install contract-test dependencies
        run: python -m pip install --disable-pip-version-check numpy netCDF4
      - name: Compile E5 chain and wrapper
        run: |
          python -m py_compile \
            review/arm-ena-sws-v1-stage0/ena_native_gate_core_v1.py \
            review/arm-ena-sws-v1-stage0/ena_native_gate_core_v2.py \
            review/arm-ena-sws-v1-stage0/ena_native_gate_core_v3.py \
            review/arm-ena-sws-v1-stage0/ena_native_gate_core_v4.py \
            review/arm-ena-sws-v1-stage0/test_ena_native_e5_v4.py \
            review/arm-ena-sws-v1-stage0/run_ena_native_live25_v4.py \
            review/arm-ena-sws-v1-stage0/test_run_ena_native_live25_v4_wiring.py
      - name: Prospective E5 v4 common vertical range contracts
        run: python review/arm-ena-sws-v1-stage0/test_ena_native_e5_v4.py
      - name: Prospective E5 v4 wiring and static acquisition boundary
        run: python review/arm-ena-sws-v1-stage0/test_run_ena_native_live25_v4_wiring.py
