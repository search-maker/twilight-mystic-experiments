name: ARM ENA SWS E6 surface v2 contract

on:
  push:
    branches:
      - review/arm-ena-sws-v1-stage0
    paths:
      - 'review/arm-ena-sws-v1-stage0/ena_surface_gate_v1.py'
      - 'review/arm-ena-sws-v1-stage0/ena_surface_gate_v2.py'
      - 'review/arm-ena-sws-v1-stage0/test_ena_surface_gate_v1.py'
      - 'review/arm-ena-sws-v1-stage0/test_ena_surface_gate_v2.py'
      - 'review/arm-ena-sws-v1-stage0/run_ena_surface_live25.py'
      - 'review/arm-ena-sws-v1-stage0/run_ena_surface_live25_v2.py'
      - 'review/arm-ena-sws-v1-stage0/test_run_ena_surface_live25_v2_wiring.py'
      - '.github/workflows/arm-ena-sws-e6-surface-v2-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e6-v2-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install contract-test dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Compile historical and prospective E6 layers
        run: |
          python -m py_compile \
            review/arm-ena-sws-v1-stage0/ena_surface_gate_v1.py \
            review/arm-ena-sws-v1-stage0/ena_surface_gate_v2.py \
            review/arm-ena-sws-v1-stage0/run_ena_surface_live25.py \
            review/arm-ena-sws-v1-stage0/run_ena_surface_live25_v2.py \
            review/arm-ena-sws-v1-stage0/test_ena_surface_gate_v1.py \
            review/arm-ena-sws-v1-stage0/test_ena_surface_gate_v2.py \
            review/arm-ena-sws-v1-stage0/test_run_ena_surface_live25_v2_wiring.py
      - name: Historical frozen E6 synthetic contracts
        run: python review/arm-ena-sws-v1-stage0/test_ena_surface_gate_v1.py
      - name: Prospective E6 v2 ambiguity contracts
        run: python review/arm-ena-sws-v1-stage0/test_ena_surface_gate_v2.py
      - name: Prospective E6 v2 wiring and static acquisition boundary
        run: python review/arm-ena-sws-v1-stage0/test_run_ena_surface_live25_v2_wiring.py
