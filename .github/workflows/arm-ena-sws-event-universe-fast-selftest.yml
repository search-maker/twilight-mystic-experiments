name: ARM ENA SWS Event Universe Fast Selftest

on:
  push:
    branches:
      - review/arm-ena-sws-v1-stage0
    paths:
      - review/arm-ena-sws-v1-stage0/generate_ena_event_universe_fast.py
      - review/arm-ena-sws-v1-stage0/audit_ena_sws_e0.py
      - .github/workflows/arm-ena-sws-event-universe-fast-selftest.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas pvlib netCDF4
      - name: Generate vectorized universe and compare reference samples
        run: |
          mkdir -p /tmp/ena_fast
          python review/arm-ena-sws-v1-stage0/generate_ena_event_universe_fast.py \
            --output /tmp/ena_fast/ena_sws_e0_event_universe_fast.csv \
            --reference-script review/arm-ena-sws-v1-stage0/audit_ena_sws_e0.py \
            | tee /tmp/ena_fast/report.json
      - name: Assert frozen universe shape
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          rows=list(csv.DictReader(Path('/tmp/ena_fast/ena_sws_e0_event_universe_fast.csv').read_text(encoding='utf-8-sig').splitlines()))
          report=json.loads(Path('/tmp/ena_fast/report.json').read_text())
          assert len(rows)==906
          assert rows[0]['case_id']=='2017-04-05_dusk'
          assert rows[-1]['case_id']=='2019-09-27_dusk'
          assert report['reference_check']['max_abs_difference_microseconds'] <= 1.0
          print('FAST_EVENT_UNIVERSE_PASS')
          print('SHA256='+report['sha256'])
          print('REFERENCE_MAX_US='+str(report['reference_check']['max_abs_difference_microseconds']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: arm-ena-sws-e0-event-universe-fast
          path: |
            /tmp/ena_fast/ena_sws_e0_event_universe_fast.csv
            /tmp/ena_fast/report.json
          if-no-files-found: error
