name: ARM ENA SWS query-only availability v1

on:
  pull_request:
    paths:
      - .github/workflows/arm-ena-sws-query-only-availability-v1.yml
      - tools/arm_ena_sws_query_only_availability_v1/**
      - tools/arm_e0_successor_case_binding_audit_v1/preflight_query_authorization_v1.py
      - tools/arm_e0_successor_case_binding_audit_v1/preflight_query_authorization_live_v2.py
      - tests/test_arm_e0_successor_query_authorization_preflight_v1.py
      - tests/test_arm_e0_successor_query_authorization_live_preflight_v2.py
  push:
    branches:
      - main
    paths:
      - .github/workflows/arm-ena-sws-query-only-availability-v1.yml
      - tools/arm_ena_sws_query_only_availability_v1/**
      - tools/arm_e0_successor_case_binding_audit_v1/preflight_query_authorization_v1.py
      - tools/arm_e0_successor_case_binding_audit_v1/preflight_query_authorization_live_v2.py
      - tests/test_arm_e0_successor_query_authorization_preflight_v1.py
      - tests/test_arm_e0_successor_query_authorization_live_preflight_v2.py
  workflow_dispatch:

permissions:
  contents: read
  issues: read

env:
  QUERY_TOOL: tools/arm_ena_sws_query_only_availability_v1
  PREFLIGHT_TOOL: tools/arm_e0_successor_case_binding_audit_v1

jobs:
  exact-executable-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and run query-only refusal tests
        run: |
          set -euo pipefail
          python -m py_compile \
            "$QUERY_TOOL/discover.py" \
            "$QUERY_TOOL/stress.py" \
            "$QUERY_TOOL/test_discover.py" \
            "$QUERY_TOOL/test_stress.py" \
            "$QUERY_TOOL/test_workflow_live_authorization_fence.py" \
            "$PREFLIGHT_TOOL/preflight_query_authorization_v1.py" \
            "$PREFLIGHT_TOOL/preflight_query_authorization_live_v2.py" \
            tests/test_arm_e0_successor_query_authorization_preflight_v1.py \
            tests/test_arm_e0_successor_query_authorization_live_preflight_v2.py
          python "$QUERY_TOOL/test_discover.py"
          python "$QUERY_TOOL/test_stress.py"
          python "$QUERY_TOOL/test_workflow_live_authorization_fence.py"
          python tests/test_arm_e0_successor_query_authorization_preflight_v1.py
          python tests/test_arm_e0_successor_query_authorization_live_preflight_v2.py
      - name: EXACT_EXECUTABLE_STRESS_PASS on actual bytes and complete Issue 60
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/arm-query-only-stress-v1/stress-receipt.json"
          rm -rf "$(dirname "$out")"
          mkdir -p "$(dirname "$out")"
          env -u ARM_USER_ID -u ARM_ACCESS_TOKEN \
            python "$QUERY_TOOL/stress.py" \
              --workflow .github/workflows/arm-ena-sws-query-only-availability-v1.yml \
              --executable "$QUERY_TOOL/discover.py" \
              --manifest "$QUERY_TOOL/ordered_25_cases.json" \
              --output "$out"
          test -s "$out"
      - name: Upload zero-runtime stress evidence
        uses: actions/upload-artifact@v4
        with:
          name: arm-ena-sws-query-only-stress-v1
          path: ${{ runner.temp }}/arm-query-only-stress-v1/stress-receipt.json
          if-no-files-found: error
          retention-days: 14

  query-only-discovery:
    needs: exact-executable-stress
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Bind workflow_dispatch source to authorized default branch
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REF_TYPE: ${{ github.ref_type }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          test "$EVENT_NAME" = workflow_dispatch
          test "$EVENT_DEFAULT_BRANCH" = main
          test "$EVENT_REF_TYPE" = branch
          test "$EVENT_REF" = refs/heads/main
          test "${#EVENT_SHA}" = 40
          case "$EVENT_SHA" in (*[!0-9a-f]*) exit 1;; esac
      - uses: actions/checkout@v4
      - name: Verify checked-out dispatch source SHA
        env:
          EVENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVENT_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Live authorization, credential presence, query, and continuity fence
        id: query
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARM_USER_ID: ${{ secrets.ARM_USER_ID }}
          ARM_ACCESS_TOKEN: ${{ secrets.ARM_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          pre_dir="$RUNNER_TEMP/arm-query-only-live-preflight-v2"
          query_dir="$RUNNER_TEMP/arm-ena-sws-query-only-v1"
          pre="$pre_dir/pre-query-live-preflight-receipt.json"
          post="$pre_dir/post-query-live-preflight-receipt.json"
          rm -rf "$pre_dir" "$query_dir"
          mkdir -p "$pre_dir" "$query_dir"

          # The governance process receives no ARM credentials. It derives the
          # latest ARM-relevant claim from two identical complete live ledgers
          # and requires that claim itself to be the exact positive direct
          # Coordinator authorization bound to this main/workflow/attempt.
          env -u ARM_USER_ID -u ARM_ACCESS_TOKEN \
            python "$PREFLIGHT_TOOL/preflight_query_authorization_live_v2.py" > "$pre"
          test -s "$pre"
          python - "$pre" <<'PY'
          import json, os, pathlib, sys
          obj = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert obj['status'] == 'QUERY_ONLY_SUCCESSOR_LIVE_PREDISPATCH_GOVERNANCE_PASS'
          assert obj['authorization_identity_derived_from_stable_live_ledger'] is True
          assert obj['live_default_branch'] == 'main'
          assert os.environ['GITHUB_REF'] == 'refs/heads/main'
          assert os.environ['GITHUB_REF_TYPE'] == 'branch'
          assert obj['exact_main_sha'] == os.environ['GITHUB_SHA']
          assert obj['arm_network_access_performed'] is False
          assert obj['arm_credentials_read'] is False
          assert obj['protected_sws_sasze_values_read'] is False
          assert obj['e0_execution_authorized_by_this_receipt'] is False
          print('PASS stable live authorization bound to actual current-main dispatch source immediately before query')
          PY

          # Presence only; values are never printed, written, or passed on a
          # command line. The immediately preceding governance subprocess had
          # both variables removed from its environment.
          if [ -z "${ARM_USER_ID:-}" ] || [ -z "${ARM_ACCESS_TOKEN:-}" ]; then
            echo '::error::Authenticated ARM environment unavailable; no query was made.'
            exit 2
          fi

          set +e
          python "$QUERY_TOOL/discover.py" --output "$query_dir/query-only-receipt.json"
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          test -s "$query_dir/query-only-receipt.json"
          test "$(find "$query_dir" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 1
          test "$(find "$query_dir" -mindepth 1 -maxdepth 1 ! -type f | wc -l)" -eq 0
          python - "$query_dir/query-only-receipt.json" <<'PY'
          import importlib.util, json, pathlib, sys
          root = pathlib.Path('tools/arm_ena_sws_query_only_availability_v1')
          spec = importlib.util.spec_from_file_location('discover_verify', root / 'discover.py')
          mod = importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          obj = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          manifest = mod.load_manifest(root / mod.MANIFEST_NAME)
          mod._validate_receipt(obj, list(manifest['ordered_case_ids']))
          print('PASS sanitized closed-schema query-only receipt')
          PY

          # Re-read the live control plane after the query, explicitly binding
          # to the same authorization identity used immediately beforehand.
          # Any intervening ARM-relevant governance or main drift makes this
          # one-shot terminal/non-admissible before its query receipt is uploaded.
          auth_comment="$(python - "$pre" <<'PY'
          import json, pathlib, sys
          print(json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))['authorization_comment'])
          PY
          )"
          auth_title="$(python - "$pre" <<'PY'
          import json, pathlib, sys
          print(json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))['authorization_title'])
          PY
          )"
          env -u ARM_USER_ID -u ARM_ACCESS_TOKEN \
            python "$PREFLIGHT_TOOL/preflight_query_authorization_live_v2.py" \
              --authorization-comment "$auth_comment" \
              --authorization-title "$auth_title" > "$post"
          test -s "$post"
          python - "$pre" "$post" <<'PY'
          import json, pathlib, sys
          pre = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          post = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding='utf-8'))
          for key in ('authorization_comment', 'authorization_title', 'exact_main_sha', 'workflow_path', 'event_name', 'run_attempt', 'one_shot'):
              assert pre[key] == post[key], key
          assert post['authorization_identity_derived_from_stable_live_ledger'] is False
          assert post['arm_network_access_performed'] is False
          assert post['arm_credentials_read'] is False
          assert post['protected_sws_sasze_values_read'] is False
          print('PASS authorization continuity remained exact across query-only request')
          PY
      - name: Upload live pre/post-query governance evidence
        uses: actions/upload-artifact@v4
        with:
          name: arm-ena-sws-query-only-live-preflight-v2
          path: ${{ runner.temp }}/arm-query-only-live-preflight-v2/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload sanitized query-only evidence only
        uses: actions/upload-artifact@v4
        with:
          name: arm-ena-sws-query-only-availability-v1
          path: ${{ runner.temp }}/arm-ena-sws-query-only-v1/query-only-receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve fail-closed query transport error as terminal failure
        if: steps.query.outputs.rc != '0'
        run: exit 2
