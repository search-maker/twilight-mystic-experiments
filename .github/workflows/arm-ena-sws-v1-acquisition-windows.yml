name: ARM ENA SWS V1 acquisition windows

on:
  workflow_dispatch:
  push:
    branches:
      - review/arm-ena-sws-v1-stage0
    paths:
      - 'review/arm-ena-sws-v1-stage0/build_ena_e1_acquisition_windows.py'
      - 'review/arm-ena-sws-v1-stage0/ena_sws_e1_pass_survivor_ranges.json'
      - '.github/workflows/arm-ena-sws-v1-acquisition-windows.yml'

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen geometry dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.3.2' 'pandas==2.3.1' 'pvlib==0.13.0'
      - name: Build result-blind acquisition windows
        run: |
          python review/arm-ena-sws-v1-stage0/build_ena_e1_acquisition_windows.py \
            --ranges review/arm-ena-sws-v1-stage0/ena_sws_e1_pass_survivor_ranges.json \
            --output-dir ena-acquisition-windows
          python - <<'PY'
          import csv,json,pathlib
          root=pathlib.Path('ena-acquisition-windows')
          rows=list(csv.DictReader((root/'ena_sws_e1_380_acquisition_windows.csv').open()))
          s=json.loads((root/'ena_sws_e1_380_acquisition_windows_summary.json').read_text())
          assert len(rows)==380 and s['survivor_count']==380
          assert s['protected_sws_values_opened'] is False
          assert s['atmospheric_values_opened'] is False
          assert s['stage_b_authorized'] is False
          assert all(r['case_id'].endswith('_dusk') for r in rows)
          assert '2017-07-11_dusk' not in {r['case_id'] for r in rows}
          print('PASS acquisition-window contract',s['csv_sha256'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ARM-ENA-SWS-V1-E1-380-acquisition-windows
          path: ena-acquisition-windows/
          if-no-files-found: error
          retention-days: 90
