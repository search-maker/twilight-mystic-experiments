name: ARM ENA SWS V1 E0 v2 contract

on:
  workflow_dispatch:
  push:
    branches:
      - review/arm-ena-sws-v1-stage0
    paths:
      - 'review/arm-ena-sws-v1-stage0/audit_ena_sws_e0.py'
      - 'review/arm-ena-sws-v1-stage0/audit_ena_sws_e0_v2.py'
      - 'review/arm-ena-sws-v1-stage0/test_audit_ena_sws_e0_v2.py'
      - 'review/arm-ena-sws-v1-stage0/run_ena_sws_e0_frozen_v2.py'
      - 'review/arm-ena-sws-v1-stage0/run_one_ena_sws_schema_probe_v2.ps1'
      - '.github/workflows/arm-ena-sws-v1-e0-v2-contract.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check -r review/arm-ena-sws-v1-stage0/requirements-ena-sws-e0.txt
      - name: Compile E0 v1/v2 and frozen v2 runner
        working-directory: review/arm-ena-sws-v1-stage0
        run: python -m py_compile audit_ena_sws_e0.py audit_ena_sws_e0_v2.py test_audit_ena_sws_e0_v2.py run_ena_sws_e0_frozen_v2.py stream_ena_sws_e0_from_arm_live.py
      - name: Run E0 v2 frozen usable-anchor synthetic contracts
        working-directory: review/arm-ena-sws-v1-stage0
        run: python test_audit_ena_sws_e0_v2.py
      - name: Verify immutable 906-event universe under E0 v2
        working-directory: review/arm-ena-sws-v1-stage0
        run: python run_ena_sws_e0_frozen_v2.py --dry-validate-universe
      - name: Static holdout-firewall assertions
        shell: python
        run: |
          from pathlib import Path
          root = Path('review/arm-ena-sws-v1-stage0')
          audit = (root / 'audit_ena_sws_e0_v2.py').read_text(encoding='utf-8')
          ps1 = (root / 'run_one_ena_sws_schema_probe_v2.ps1').read_text(encoding='utf-8')
          assert '>= 1' in audit and '>= 10' in audit
          assert 'run_ena_sws_e0_frozen_v2.py' in ps1
          assert 'ARM_ENA_SWS_V1_STAGE0_E0_RESULT_BLIND_V2' in ps1
          assert 'protected_variable_values_read' in ps1 and '$false' in ps1
          assert 'raw_sws_files_retained' in ps1
          print('PASS E0 v2 static holdout/firewall wiring')
