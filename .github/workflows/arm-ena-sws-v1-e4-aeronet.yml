name: ARM ENA SWS V1 E4 AERONET side

on:
  workflow_dispatch:
  push:
    branches:
      - review/arm-ena-sws-v1-stage0
    paths:
      - 'review/arm-ena-sws-v1-stage0/screen_ena_e4_aeronet_v1.py'
      - 'review/arm-ena-sws-v1-stage0/build_ena_e1_acquisition_windows.py'
      - 'review/arm-ena-sws-v1-stage0/ena_sws_e1_pass_survivor_ranges.json'
      - '.github/workflows/arm-ena-sws-v1-e4-aeronet.yml'

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.3.2' 'pandas==2.3.1' 'pvlib==0.13.0'
      - name: Build exact result-blind E4 windows
        run: |
          python review/arm-ena-sws-v1-stage0/build_ena_e1_acquisition_windows.py \
            --ranges review/arm-ena-sws-v1-stage0/ena_sws_e1_pass_survivor_ranges.json \
            --output-dir work/windows
      - name: Download one consolidated public AERONET V3 Level 2 request
        run: |
          curl --fail --silent --show-error --location --retry 2 --retry-delay 5 \
            --user-agent 'twilight-mystic-experiments-result-blind-e4/1.0' \
            'https://aeronet.gsfc.nasa.gov/cgi-bin/print_web_data_v3?site=ARM_Graciosa&year=2017&month=4&day=5&year2=2019&month2=9&day2=27&AOD20=1&AVG=10&if_no_html=1' \
            --output work/aeronet_ARM_Graciosa_20170405_20190927_AOD20.csv
          test -s work/aeronet_ARM_Graciosa_20170405_20190927_AOD20.csv
          sha256sum work/aeronet_ARM_Graciosa_20170405_20190927_AOD20.csv
      - name: Execute frozen CSPHOT-side gate
        run: |
          python review/arm-ena-sws-v1-stage0/screen_ena_e4_aeronet_v1.py \
            --windows work/windows/ena_sws_e1_380_acquisition_windows.csv \
            --aeronet work/aeronet_ARM_Graciosa_20170405_20190927_AOD20.csv \
            --output-dir work/e4-aeronet
          python - <<'PY'
          import csv,json,pathlib
          root=pathlib.Path('work/e4-aeronet')
          rows=list(csv.DictReader((root/'ena_sws_e4_aeronet_side_380.csv').open()))
          s=json.loads((root/'ena_sws_e4_aeronet_side_summary.json').read_text())
          assert len(rows)==380 and s['case_count']==380
          assert s['e4_primary_cases_promoted']==0
          assert s['protected_sws_values_opened'] is False and s['stage_b_authorized'] is False
          assert all(r['e4_primary_pass']=='False' for r in rows)
          print('PASS E4 public-side boundary',json.dumps(s['disposition_counts'],sort_keys=True))
          PY
      - name: Remove raw public response before artifact upload
        run: rm -f work/aeronet_ARM_Graciosa_20170405_20190927_AOD20.csv
      - uses: actions/upload-artifact@v4
        with:
          name: ARM-ENA-SWS-V1-E4-AERONET-side-380
          path: |
            work/windows/ena_sws_e1_380_acquisition_windows.csv
            work/windows/ena_sws_e1_380_acquisition_windows_summary.json
            work/e4-aeronet/ena_sws_e4_aeronet_side_380.csv
            work/e4-aeronet/ena_sws_e4_aeronet_side_summary.json
          if-no-files-found: error
          retention-days: 90
