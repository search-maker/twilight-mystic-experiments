name: ARM ENA SWS V1 E6 Review

on:
  push:
    branches:
      - review/arm-ena-sws-v1-stage0
    paths:
      - 'review/arm-ena-sws-v1-stage0/ena_surface_gate_v1.py'
      - 'review/arm-ena-sws-v1-stage0/test_ena_surface_gate_v1.py'
      - 'review/arm-ena-sws-v1-stage0/run_ena_surface_live25.py'
      - '.github/workflows/arm-ena-sws-v1-e6-review.yml'
  pull_request:
    paths:
      - 'review/arm-ena-sws-v1-stage0/ena_surface_gate_v1.py'
      - 'review/arm-ena-sws-v1-stage0/test_ena_surface_gate_v1.py'
      - 'review/arm-ena-sws-v1-stage0/run_ena_surface_live25.py'
      - '.github/workflows/arm-ena-sws-v1-e6-review.yml'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pure-test dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Compile E6 modules
        run: |
          python -m py_compile review/arm-ena-sws-v1-stage0/ena_surface_gate_v1.py
          python -m py_compile review/arm-ena-sws-v1-stage0/run_ena_surface_live25.py
          python -m py_compile review/arm-ena-sws-v1-stage0/test_ena_surface_gate_v1.py
      - name: Run result-blind synthetic E6 contracts
        run: python review/arm-ena-sws-v1-stage0/test_ena_surface_gate_v1.py
      - name: Assert no SWS datastream is present in E6 runner
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('review/arm-ena-sws-v1-stage0/run_ena_surface_live25.py')
          text=p.read_text(encoding='utf-8')
          forbidden=['enaswsC1','enaswsauxC1','sws radiance','SWS radiance']
          bad=[x for x in forbidden if x in text]
          if bad:
              raise SystemExit(f'forbidden E6 runner token(s): {bad}')
          print('PASS: E6 runner contains no SWS datastream token')
          PY
