name: ARM ENA SWS V1 native core contract

on:
  workflow_dispatch:
  push:
    branches:
      - review/arm-ena-sws-v1-stage0
    paths:
      - 'review/arm-ena-sws-v1-stage0/ena_native_gate_core_v1.py'
      - 'review/arm-ena-sws-v1-stage0/test_ena_native_gate_core_v1.py'
      - 'review/arm-ena-sws-v1-stage0/ena_native_gate_core_v2.py'
      - 'review/arm-ena-sws-v1-stage0/test_ena_native_gate_core_v2.py'
      - 'review/arm-ena-sws-v1-stage0/run_ena_native_live25.py'
      - 'review/arm-ena-sws-v1-stage0/run_ena_native_live25_v2.py'
      - 'review/arm-ena-sws-v1-stage0/test_run_ena_native_live25_v2_wiring.py'
      - '.github/workflows/arm-ena-sws-v1-native-core-contract.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.3.2' 'netCDF4==1.7.2' 'requests==2.32.5'
      - name: Compile frozen and prospective parsers
        working-directory: review/arm-ena-sws-v1-stage0
        run: python -m py_compile ena_native_gate_core_v1.py ena_native_gate_core_v2.py run_ena_native_live25.py run_ena_native_live25_v2.py test_ena_native_gate_core_v1.py test_ena_native_gate_core_v2.py test_run_ena_native_live25_v2_wiring.py
      - name: Run historical frozen synthetic contracts
        working-directory: review/arm-ena-sws-v1-stage0
        run: python test_ena_native_gate_core_v1.py
      - name: Run prospective E2 v2 frozen-contract synthetic tests
        working-directory: review/arm-ena-sws-v1-stage0
        run: python test_ena_native_gate_core_v2.py
      - name: Verify live25 v2 runner wiring
        working-directory: review/arm-ena-sws-v1-stage0
        run: python test_run_ena_native_live25_v2_wiring.py
