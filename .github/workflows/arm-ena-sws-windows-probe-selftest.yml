name: ARM ENA SWS Windows Probe Selftest

on:
  push:
    branches:
      - review/arm-ena-sws-v1-stage0
    paths:
      - review/arm-ena-sws-v1-stage0/run_one_ena_sws_schema_probe.ps1
      - review/arm-ena-sws-v1-stage0/requirements-ena-sws-e0.txt
      - .github/workflows/arm-ena-sws-windows-probe-selftest.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell launcher
        shell: pwsh
        run: |
          $p = 'review/arm-ena-sws-v1-stage0/run_one_ena_sws_schema_probe.ps1'
          $text = Get-Content -Raw -LiteralPath $p
          [void][ScriptBlock]::Create($text)
          Write-Host 'POWERSHELL_PARSE_PASS'
      - name: Static credential and raw-retention audit
        shell: pwsh
        run: |
          $p = 'review/arm-ena-sws-v1-stage0/run_one_ena_sws_schema_probe.ps1'
          $text = Get-Content -Raw -LiteralPath $p
          if ($text -match 'Write-Host\s+.*token' -or $text -match 'Write-Output\s+.*token') { throw 'possible token output path' }
          if ($text -notmatch 'Read-Host .* -AsSecureString') { throw 'secure token prompt missing' }
          if ($text -notmatch 'raw SWS NetCDF/CDF unexpectedly persisted') { throw 'raw persistence refusal missing' }
          if ($text -notmatch 'protected_variable_values_read') { throw 'holdout attestation check missing' }
          if ($text -notmatch '--stop-after 1') { throw 'one-event bound missing' }
          if ($text -notmatch '--probe-aux-schema') { throw 'schema probe flag missing' }
          Write-Host 'WINDOWS_PROBE_STATIC_FIREWALL_PASS'
      - name: Verify pinned requirements
        shell: pwsh
        run: |
          $r = Get-Content -LiteralPath 'review/arm-ena-sws-v1-stage0/requirements-ena-sws-e0.txt'
          $expected = @('numpy==2.5.2','pandas==3.0.5','pvlib==0.15.2','netCDF4==1.7.4')
          if ((Compare-Object $r $expected).Count -ne 0) { throw 'dependency lock drift' }
          Write-Host 'DEPENDENCY_LOCK_PASS'
