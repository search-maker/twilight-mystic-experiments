name: ARM Legacy Catalog Probe V1

on:
  push:
    branches:
      - review/arm-sgp-exact8-release-analysis-v1
    paths:
      - .github/workflows/arm-legacy-catalog-probe-v1.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install legacy public ARM archive client
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input 'arm_archive==0.1.0' 'suds-py3' || python -m pip install --disable-pip-version-check --no-input 'arm_archive==0.1.0'
      - name: Probe datastream catalog and exact dates without ordering
        shell: bash
        run: |
          set +e
          echo '=== DATASTREAM MATCHES SURFSPEC ==='
          python -m arm_archive datastreams surfspecalb
          echo '=== DATASTREAM MATCHES ARSCL ==='
          python -m arm_archive datastreams sgparsclkazr1kollias
          for ds in sgpsurfspecalb1mlawerC1.c1 sgparsclkazr1kolliasC1.c1; do
            for d in 20240127 20240128 20240201 20240202 20240328 20240329; do
              echo "=== LIST::$ds::$d ==="
              python -m arm_archive list "$ds" "$d"
            done
          done
          exit 0
