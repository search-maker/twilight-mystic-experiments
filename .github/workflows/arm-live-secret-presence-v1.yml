name: ARM Live Secret Presence V1

on:
  push:
    branches:
      - review/arm-sgp-exact8-release-analysis-v1
    paths:
      - .github/workflows/arm-live-secret-presence-v1.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      HAVE_ARM_USER_ID: ${{ secrets.ARM_USER_ID != '' }}
      HAVE_ARM_ACCESS_TOKEN: ${{ secrets.ARM_ACCESS_TOKEN != '' }}
      HAVE_ARM_USERNAME: ${{ secrets.ARM_USERNAME != '' }}
      HAVE_ARM_TOKEN: ${{ secrets.ARM_TOKEN != '' }}
    steps:
      - name: Report presence booleans only
        run: |
          set -euo pipefail
          printf 'ARM_USER_ID=%s\n' "$HAVE_ARM_USER_ID"
          printf 'ARM_ACCESS_TOKEN=%s\n' "$HAVE_ARM_ACCESS_TOKEN"
          printf 'ARM_USERNAME=%s\n' "$HAVE_ARM_USERNAME"
          printf 'ARM_TOKEN=%s\n' "$HAVE_ARM_TOKEN"
