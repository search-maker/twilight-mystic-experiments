name: ARM Order268666 Directory Probe V1

on:
  push:
    branches:
      - review/arm-sgp-exact8-release-analysis-v1
    paths:
      - .github/workflows/arm-order268666-directory-probe-v1.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: List preserved order root and probe missing independent cloud streams
        shell: bash
        run: |
          set -euo pipefail
          base='ftp://ftp.archive.arm.gov/buchingerp1/268666'
          echo '=== ORDER ROOT ==='
          curl --fail --show-error --silent --list-only "$base/" | sort
          echo '=== TARGET DIRECTORY PROBES ==='
          for d in sgparsclkazr1kolliasC1.c1 sgp30smplcmask1zwangC1.c1; do
            echo "--- $d ---"
            if curl --fail --show-error --silent --list-only "$base/$d/" | head -100; then
              echo "DIR_PRESENT::$d"
            else
              echo "DIR_ABSENT::$d"
            fi
          done
