name: ARM Order268666 Live2 HSRL Recovery V1

on:
  push:
    branches:
      - review/arm-sgp-exact8-release-analysis-v1
    paths:
      - .github/workflows/arm-order268666-live2-hsrl-recovery-v1.yml

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Recover exact non-SASZE HSRL files from preserved order
        shell: bash
        run: |
          set -euo pipefail
          base='ftp://ftp.archive.arm.gov/buchingerp1/268666/sgphsrlC1.a1'
          mkdir -p recovered
          cat > targets.txt <<'EOF'
          sgphsrlC1.a1.20240202.000000.nc
          sgphsrlC1.a1.20240329.000030.nc
          EOF
          printf 'filename,size_bytes,sha256,status\n' > recovery_manifest.csv
          while IFS= read -r name; do
            case "$name" in *sasze*|*SASZE*) echo 'HOLDOUT FIREWALL VIOLATION' >&2; exit 9;; esac
            curl --fail --show-error --silent --retry 2 --retry-delay 2 "$base/$name" -o "recovered/$name"
            size="$(stat -c %s "recovered/$name")"
            sha="$(sha256sum "recovered/$name" | awk '{print $1}')"
            printf '%s,%s,%s,RECOVERED_FROM_PRESERVED_ORDER\n' "$name" "$size" "$sha" >> recovery_manifest.csv
          done < targets.txt

      - name: Upload recovered HSRL evidence
        uses: actions/upload-artifact@v4
        with:
          name: ARM-order268666-live2-hsrl-recovery-v1
          path: |
            recovered/*.nc
            recovery_manifest.csv
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
