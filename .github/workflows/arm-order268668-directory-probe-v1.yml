name: ARM Order268668 Directory Probe V1

on:
  push:
    branches:
      - review/arm-sgp-exact8-release-analysis-v1
    paths:
      - .github/workflows/arm-order268668-directory-probe-v1.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: List order 268668 root
        shell: bash
        run: |
          set -euo pipefail
          base='ftp://ftp.archive.arm.gov/buchingerp1/268668'
          echo '=== ORDER 268668 ROOT ==='
          curl --fail --show-error --silent --list-only "$base/" | sort
