name: ARM Order268668 Live2 G6G8G9 Recovery V1

on:
  push:
    branches:
      - review/arm-sgp-exact8-release-analysis-v1
    paths:
      - .github/workflows/arm-order268668-live2-g6g8g9-recovery-v1.yml

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Recover exact non-SASZE supplemental files
        shell: bash
        run: |
          set -euo pipefail
          base='ftp://ftp.archive.arm.gov/buchingerp1/268668'
          mkdir -p recovered
          cat > targets.txt <<'EOF'
          gecomiX1.a1/gecomiX1.a1.20240202.000000.nc
          sgpmfrsr7nchaod1michC1.c1/sgpmfrsr7nchaod1michC1.c1.20240202.000000.nc
          sgpqcradbrs1longC1.c2/sgpqcradbrs1longC1.c2.20240202.000000.cdf
          gecomiX1.a1/gecomiX1.a1.20240328.000000.nc
          gecomiX1.a1/gecomiX1.a1.20240329.000000.nc
          sgpmfrsr7nchaod1michC1.c1/sgpmfrsr7nchaod1michC1.c1.20240328.000000.nc
          sgpmfrsr7nchaod1michC1.c1/sgpmfrsr7nchaod1michC1.c1.20240329.000000.nc
          sgpqcradbrs1longC1.c2/sgpqcradbrs1longC1.c2.20240328.000000.cdf
          sgpqcradbrs1longC1.c2/sgpqcradbrs1longC1.c2.20240329.000000.cdf
          EOF
          printf 'relative_path,size_bytes,sha256,status\n' > recovery_manifest.csv
          while IFS= read -r rel; do
            name="$(basename "$rel")"
            case "$name" in *sasze*|*SASZE*) echo 'HOLDOUT FIREWALL VIOLATION' >&2; exit 9;; esac
            echo "Recovering $name"
            curl --fail --show-error --silent --retry 2 --retry-delay 2 "$base/$rel" -o "recovered/$name"
            size="$(stat -c %s "recovered/$name")"
            sha="$(sha256sum "recovered/$name" | awk '{print $1}')"
            printf '%s,%s,%s,RECOVERED_FROM_PRESERVED_ORDER\n' "$rel" "$size" "$sha" >> recovery_manifest.csv
          done < targets.txt

      - name: Upload recovered supplemental evidence
        uses: actions/upload-artifact@v4
        with:
          name: ARM-order268668-live2-g6g8g9-recovery-v1
          path: |
            recovered/*
            recovery_manifest.csv
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
