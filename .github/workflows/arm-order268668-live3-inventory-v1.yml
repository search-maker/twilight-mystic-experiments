name: ARM Order268668 Live3 Inventory V1

on:
  push:
    branches:
      - review/arm-sgp-exact8-release-analysis-v1
    paths:
      - .github/workflows/arm-order268668-live3-inventory-v1.yml

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: List candidate-date files
        shell: bash
        run: |
          set -euo pipefail
          base='ftp://ftp.archive.arm.gov/buchingerp1/268668'
          for d in gecomiX1.a1 sgphsrlC1.a1 sgpmfrsr7nchaod1michC1.c1 sgpqcradbrs1longC1.c2; do
            echo "=== $d ==="
            curl --fail --show-error --silent --list-only "$base/$d/" \
              | grep -E '2024012[6789]|2024020[123]|2024032[789]|20240330' \
              | sort || true
          done
