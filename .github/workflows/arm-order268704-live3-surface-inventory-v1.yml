name: ARM Order268704 Live3 Surface Inventory V1

on:
  push:
    branches:
      - review/arm-sgp-exact8-release-analysis-v1
    paths:
      - .github/workflows/arm-order268704-live3-surface-inventory-v1.yml

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: List surface order root and candidate-date files
        shell: bash
        run: |
          set -euo pipefail
          base='ftp://ftp.archive.arm.gov/buchingerp1/268704'
          echo '=== ORDER ROOT ==='
          curl --fail --show-error --silent --list-only "$base/" | sort
          for d in sgpmfr7nch10mC1.b1 sgpmfr7nch25mC1.b1 sgpmfrsr7nchC1.b1 sgpsurfspecalb1mlawerC1.c1; do
            echo "=== $d ==="
            curl --fail --show-error --silent --list-only "$base/$d/" 2>/dev/null \
              | grep -E '2024012[67]|20240128|2024020[12]|2024032[89]' \
              | sort || true
          done
