name: ARM Preserved Order Filelist Probe V1

on:
  push:
    branches:
      - review/arm-sgp-exact8-release-analysis-v1
    paths:
      - .github/workflows/arm-preserved-order-filelist-probe-v1.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Inspect only known preserved order file lists
        shell: bash
        run: |
          set -euo pipefail
          base='ftp://ftp.archive.arm.gov/buchingerp1'
          for order in 268666 268668 268674 268691 268692 268699 268700 268702 268704 268811; do
            echo "=== ORDER::$order ==="
            if curl --fail --show-error --silent "$base/$order/file_list.txt" -o order_file_list.txt; then
              echo '-- surface modern streams/date matches --'
              grep -Ei 'sgpmfr7nch10mC1\.b1|sgpmfr7nch25mC1\.b1|sgpmfrsr7nchC1\.b1|sgpsurfspecalb1mlawerC1\.c1' order_file_list.txt \
                | grep -E '2024012[78]|2024020[12]|2024032[89]' || true
              echo '-- all candidate-date families --'
              grep -E '2024012[78]|2024020[12]|2024032[89]' order_file_list.txt | head -100 || true
            else
              echo 'NO_FILE_LIST'
            fi
          done
