name: ARM Preserved Order Root Inventory V1

on:
  push:
    branches:
      - review/arm-sgp-exact8-release-analysis-v1
    paths:
      - .github/workflows/arm-preserved-order-root-inventory-v1.yml

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: List only this preserved ARM staging account order directories
        shell: bash
        run: |
          set -euo pipefail
          base='ftp://ftp.archive.arm.gov/buchingerp1'
          echo '=== USER STAGING ROOT ==='
          curl --fail --show-error --silent --list-only "$base/" | sort -n | tail -100
          echo '=== KNOWN RECENT ORDER CONTENT FAMILIES ==='
          for order in $(curl --fail --show-error --silent --list-only "$base/" | grep -E '^[0-9]+/?$' | tr -d '/' | sort -n | tail -40); do
            echo "--- ORDER::$order ---"
            curl --fail --show-error --silent --list-only "$base/$order/" 2>/dev/null \
              | grep -E 'mfr7nch10m|mfrsr7nchC1|surfspecalb|arsclkazr1kolliasC1\.c1|mplcmask|gecomi|mfrsr7nchaod|qcrad' \
              | sort || true
          done
