name: ARM query-only predispatch diagnostic 5618177922

on:
  push:
    branches:
      - diagnostic/arm-query-only-auth-live-preflight-5618177922-20260910

permissions:
  contents: read
  issues: read

env:
  EXPECTED_MAIN: 3d87305043403fba9636bff2b6a2b624a905a343
  EXPECTED_AUTH_COMMENT: '5618177922'
  EXPECTED_AUTH_TITLE: COORDINATOR::ARM_QUERY_ONLY_AUTHENTICATED_DISCOVERY_SUCCESSOR_AUTHORIZED__ONE_SHOT_ATTEMPT1__HUMAN_WORKFLOW_DISPATCH_IF_NEEDED

jobs:
  enumerate-all-current-governance-defects:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact installed main bytes
        uses: actions/checkout@v4
        with:
          ref: 3d87305043403fba9636bff2b6a2b624a905a343
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove exact installed source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          python -m py_compile \
            tools/arm_ena_sws_query_only_availability_v1/stress.py \
            tools/arm_e0_successor_case_binding_audit_v1/preflight_query_authorization_v1.py \
            tools/arm_e0_successor_case_binding_audit_v1/preflight_query_authorization_live_v2.py
      - name: Enumerate every direct ARM classifier defect in complete live Issue 60
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/arm-predispatch-diagnostic"
          env -u ARM_USER_ID -u ARM_ACCESS_TOKEN python - <<'PY'
          import importlib.util, json, os, pathlib
          root = pathlib.Path('.')
          p = root / 'tools/arm_ena_sws_query_only_availability_v1/stress.py'
          spec = importlib.util.spec_from_file_location('installed_arm_stress', p)
          mod = importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          rows = mod.complete_issue_comments(os.environ['GITHUB_TOKEN'])
          ambiguous = []
          adverse = []
          allowed = []
          direct = []
          for row in rows:
              cid = int(row.get('id', 0))
              if cid <= mod.BASELINE_COORDINATOR_COMMENT:
                  continue
              title = mod.first_nonempty(str(row.get('body', '')))
              upper = title.upper()
              if not (upper.startswith('ARM_OWNER::') or upper.startswith('COORDINATOR::ARM')):
                  continue
              direct.append({'id': cid, 'title': title})
              try:
                  disposition = mod._direct_arm_control_disposition(title)
              except mod.StressFailure as exc:
                  ambiguous.append({'id': cid, 'title': title, 'error': str(exc)})
              else:
                  (adverse if disposition == 'adverse' else allowed).append({'id': cid, 'title': title})
          corr = next((r for r in direct if r['id'] == int(os.environ['EXPECTED_AUTH_COMMENT'])), None)
          if corr is None or corr['title'] != os.environ['EXPECTED_AUTH_TITLE']:
              raise SystemExit('corrected authorization missing/title drift')
          corr_disp = mod._direct_arm_control_disposition(corr['title'])
          out = {
              'schema': 1,
              'status': 'NONAUTHORIZING_DIAGNOSTIC_ALL_DIRECT_ARM_TITLES_ENUMERATED',
              'installedMain': os.environ['EXPECTED_MAIN'],
              'issue60CommentCount': len(rows),
              'issue60LatestCommentId': max(int(r.get('id', 0)) for r in rows),
              'correctedAuthorizationComment': int(os.environ['EXPECTED_AUTH_COMMENT']),
              'correctedAuthorizationTitle': corr['title'],
              'correctedAuthorizationClassifierDisposition': corr_disp,
              'directArmControlCount': len(direct),
              'ambiguousCount': len(ambiguous),
              'ambiguous': ambiguous,
              'adverseCount': len(adverse),
              'adverse': adverse,
              'armNetworkAccessPerformed': False,
              'armCredentialsRead': False,
              'protectedValuesRead': False,
          }
          pathlib.Path(os.environ['RUNNER_TEMP'], 'arm-predispatch-diagnostic', 'all-direct-arm-title-classifications.json').write_text(json.dumps(out, indent=2, sort_keys=True) + '\n')
          print(json.dumps({'ambiguousCount': len(ambiguous), 'ambiguous': ambiguous}, sort_keys=True))
          PY
      - name: Record full installed stress refusal without consuming query one-shot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          env -u ARM_USER_ID -u ARM_ACCESS_TOKEN \
            python tools/arm_ena_sws_query_only_availability_v1/stress.py \
              --workflow .github/workflows/arm-ena-sws-query-only-availability-v1.yml \
              --executable tools/arm_ena_sws_query_only_availability_v1/discover.py \
              --manifest tools/arm_ena_sws_query_only_availability_v1/ordered_25_cases.json \
              --output "$RUNNER_TEMP/arm-predispatch-diagnostic/stress-receipt.json" \
              > "$RUNNER_TEMP/arm-predispatch-diagnostic/stress-stdout.txt" \
              2> "$RUNNER_TEMP/arm-predispatch-diagnostic/stress-stderr.txt"
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$RUNNER_TEMP/arm-predispatch-diagnostic/stress-exit-code.txt"
          test "$rc" -ne 0
      - name: Upload non-authorizing diagnostic-all-defects evidence
        uses: actions/upload-artifact@v4
        with:
          name: arm-query-only-predispatch-diagnostic-all-defects-5618177922
          path: ${{ runner.temp }}/arm-predispatch-diagnostic/
          if-no-files-found: error
          retention-days: 14
