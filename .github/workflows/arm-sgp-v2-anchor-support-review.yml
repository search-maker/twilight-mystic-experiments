name: ARM SGP V2 anchor-support audit review

on:
  pull_request:
    paths:
      - 'tools/arm_sgp_compact_handoff_v1/audit_sasze_anchor_support_v2.py'
      - 'tools/arm_sgp_compact_handoff_v1/audit_sasze_anchor_support_v2_hardened.py'
      - 'tools/arm_sgp_compact_handoff_v1/requirements_v2_anchor_support.txt'
      - 'tools/arm_sgp_compact_handoff_v1/run_arm_v2_anchor_support.ps1'
      - '.github/workflows/arm-sgp-v2-anchor-support-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solver-free-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check -r tools/arm_sgp_compact_handoff_v1/requirements_v2_anchor_support.txt
      - name: Compile audit scripts
        run: python -m py_compile tools/arm_sgp_compact_handoff_v1/audit_sasze_anchor_support_v2.py tools/arm_sgp_compact_handoff_v1/audit_sasze_anchor_support_v2_hardened.py
      - name: Run hardened synthetic indexing and wavelength-grid tests
        working-directory: tools/arm_sgp_compact_handoff_v1
        run: python audit_sasze_anchor_support_v2_hardened.py --self-test
      - name: Verify exact frozen 344-event geometry universe
        working-directory: tools/arm_sgp_compact_handoff_v1
        run: |
          python - <<'PY'
          import audit_sasze_anchor_support_v2 as audit
          events = audit.build_event_universe()
          assert len(events) == 344, len(events)
          assert events[0].local_civil_date == '2023-12-14'
          assert events[-1].local_civil_date == '2024-06-02'
          assert {event.event for event in events} == {'dawn', 'dusk'}
          print('ARM_V2_EXACT_344_EVENT_UNIVERSE_PASS')
          PY
      - name: Assert result-blind V2 contract constants
        working-directory: tools/arm_sgp_compact_handoff_v1
        run: |
          python - <<'PY'
          import audit_sasze_anchor_support_v2 as audit
          assert audit.PROTOCOL == 'ARM_SGP_REAL_SKY_VALIDATION_V2_EXHAUSTIVE_ANCHOR_SUPPORT'
          assert audit.CONTROL_COMMENT == '5471264663'
          assert audit.TARGET_ELEVATIONS == (-8.0, -7.0, -6.0)
          assert audit.TARGET_WAVELENGTH_NM == 464.020874
          assert audit.KNOWN_EXPOSED == {'2024-02-08_dusk': 'EXPOSED_DEVELOPMENT_ONLY'}
          print('ARM_V2_FROZEN_CONSTANTS_PASS')
          PY
