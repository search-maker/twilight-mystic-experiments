name: ARM Stage-A decoded-time metadata one-shot v1

on:
  pull_request:
    paths:
      - .github/workflows/arm-stagea-decoded-time-metadata-one-shot-v1.yml
      - tools/arm_stagea_decoded_time_metadata_one_shot_v1/**
      - tools/arm_stagea_time_continuity_contract_v1/**
      - tests/test_arm_stagea_time_continuity_contract_v1.py
  push:
    branches:
      - main
    paths:
      - .github/workflows/arm-stagea-decoded-time-metadata-one-shot-v1.yml
      - tools/arm_stagea_decoded_time_metadata_one_shot_v1/**
      - tools/arm_stagea_time_continuity_contract_v1/**
      - tests/test_arm_stagea_time_continuity_contract_v1.py
  workflow_dispatch:
    inputs:
      authorization_comment_id:
        description: Exact fresh direct Coordinator Issue #60 authorization comment ID
        required: true
        type: string

permissions:
  contents: read
  issues: read

env:
  TOOL: tools/arm_stagea_decoded_time_metadata_one_shot_v1
  WORKFLOW_PATH: .github/workflows/arm-stagea-decoded-time-metadata-one-shot-v1.yml

jobs:
  exact-nonscience-structural:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and run exact non-science structural contracts
        run: |
          set -euo pipefail
          python -m py_compile "$TOOL/run.py" tools/arm_stagea_time_continuity_contract_v1/verify.py tests/test_arm_stagea_time_continuity_contract_v1.py
          python "$TOOL/run.py" self-test --priority "$TOOL/ARM_SGP_C1_stageA_priority20.csv" --workflow "$WORKFLOW_PATH"
          python tests/test_arm_stagea_time_continuity_contract_v1.py
      - name: Freeze exact-byte structural receipt
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/arm-stagea-install-structural-v1"
          mkdir -p "$out"
          python - <<'PY' "$out/receipt.json"
          import hashlib, json, pathlib, subprocess, sys
          paths = [
              pathlib.Path('.github/workflows/arm-stagea-decoded-time-metadata-one-shot-v1.yml'),
              pathlib.Path('tools/arm_stagea_decoded_time_metadata_one_shot_v1/run.py'),
              pathlib.Path('tools/arm_stagea_decoded_time_metadata_one_shot_v1/ARM_SGP_C1_stageA_priority20.csv'),
          ]
          obj = {
              'schema': 1,
              'purpose': 'ARM_STAGEA_DECODED_TIME_METADATA_INSTALL_V1_EXACT_NOSCIENCE_STRUCTURAL',
              'head_sha': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'files': {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in paths},
              'priority_ledger_sha256': '345d7023bb4e29e0cc7bb47f1eaaef33636e0bd1719d05e796e3d30cba310ae0',
              'canonical_request_sha256': '5ec3fb6b052d886091a77704bf425abcb0d04ea4279727c3a37b4f5ab6e63318',
              'native_file_opened': False,
              'arm_network_access_performed': False,
              'credential_values_read': False,
              'science_arrays_read': False,
              'protected_values_read': False,
              'stage_b_authorized': False,
              'mystic_science_authorized': False,
              'production_authorized': False,
          }
          pathlib.Path(sys.argv[1]).write_text(json.dumps(obj, indent=2, sort_keys=True)+'\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: arm-stagea-decoded-time-metadata-install-v1-structural
          path: ${{ runner.temp }}/arm-stagea-install-structural-v1/receipt.json
          if-no-files-found: error
          retention-days: 14

  decoded-time-metadata:
    needs: exact-nonscience-structural
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_type == 'branch' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Bind exact one-shot dispatch identity before checkout
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REF_TYPE: ${{ github.ref_type }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "$EVENT_NAME" = workflow_dispatch
          test "$EVENT_REF" = refs/heads/main
          test "$EVENT_REF_TYPE" = branch
          test "$EVENT_DEFAULT_BRANCH" = main
          test "$EVENT_ATTEMPT" = 1
          test "${#EVENT_SHA}" = 40
          case "$EVENT_SHA" in (*[!0-9a-f]*) exit 1;; esac
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify checkout and install pinned metadata decoder dependency
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m pip install --disable-pip-version-check 'netCDF4==1.7.2'
      - name: Exact live governance preflight with ARM credentials absent
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUTH_COMMENT: ${{ inputs.authorization_comment_id }}
        run: |
          set -euo pipefail
          case "$AUTH_COMMENT" in (''|*[!0-9]*) exit 2;; esac
          blob="$(git rev-parse "HEAD:$WORKFLOW_PATH")"
          test "${#blob}" = 40
          out="$RUNNER_TEMP/arm-stagea-governance-v1"
          rm -rf "$out"; mkdir -p "$out"
          env -u ARM_USER_ID -u ARM_ACCESS_TOKEN \
            python "$TOOL/run.py" preflight --authorization-comment "$AUTH_COMMENT" --workflow-blob-sha "$blob" > "$out/pre.json"
          python - "$out/pre.json" <<'PY'
          import json, os, pathlib, sys
          p=pathlib.Path(sys.argv[1]); o=json.loads(p.read_text())
          o['priority_ledger_sha256']='345d7023bb4e29e0cc7bb47f1eaaef33636e0bd1719d05e796e3d30cba310ae0'
          o['canonical_request_sha256']='5ec3fb6b052d886091a77704bf425abcb0d04ea4279727c3a37b4f5ab6e63318'
          o['latest_direct_arm_comment_id']=int(os.environ['AUTH_COMMENT'])
          p.write_text(json.dumps(o,sort_keys=True,separators=(',',':'))+'\n')
          PY
      - name: Protected decoded-time metadata extraction only
        env:
          ARM_USER_ID: ${{ secrets.ARM_USER_ID }}
          ARM_ACCESS_TOKEN: ${{ secrets.ARM_ACCESS_TOKEN }}
          AUTH_COMMENT: ${{ inputs.authorization_comment_id }}
        run: |
          set -euo pipefail
          test -n "${ARM_USER_ID:-}" && test -n "${ARM_ACCESS_TOKEN:-}"
          blob="$(git rev-parse "HEAD:$WORKFLOW_PATH")"
          out="$RUNNER_TEMP/arm-stagea-decoded-time-metadata-v1"
          rm -rf "$out"; mkdir -p "$out"
          python "$TOOL/run.py" extract \
            --priority "$TOOL/ARM_SGP_C1_stageA_priority20.csv" \
            --output-dir "$out" \
            --authorization-comment "$AUTH_COMMENT" \
            --workflow-blob-sha "$blob"
      - name: Exact post-extraction same-authorization governance continuity
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUTH_COMMENT: ${{ inputs.authorization_comment_id }}
        run: |
          set -euo pipefail
          blob="$(git rev-parse "HEAD:$WORKFLOW_PATH")"
          out="$RUNNER_TEMP/arm-stagea-governance-v1"
          mkdir -p "$out"
          env -u ARM_USER_ID -u ARM_ACCESS_TOKEN \
            python "$TOOL/run.py" preflight --authorization-comment "$AUTH_COMMENT" --workflow-blob-sha "$blob" > "$out/post.json"
          python - "$out/post.json" <<'PY'
          import json, os, pathlib, sys
          p=pathlib.Path(sys.argv[1]); o=json.loads(p.read_text())
          o['priority_ledger_sha256']='345d7023bb4e29e0cc7bb47f1eaaef33636e0bd1719d05e796e3d30cba310ae0'
          o['canonical_request_sha256']='5ec3fb6b052d886091a77704bf425abcb0d04ea4279727c3a37b4f5ab6e63318'
          o['latest_direct_arm_comment_id']=int(os.environ['AUTH_COMMENT'])
          p.write_text(json.dumps(o,sort_keys=True,separators=(',',':'))+'\n')
          PY
          python - "$out/pre.json" "$out/post.json" <<'PY'
          import json, pathlib, sys
          pre=json.loads(pathlib.Path(sys.argv[1]).read_text()); post=json.loads(pathlib.Path(sys.argv[2]).read_text())
          for k in ('authorization_comment_id','workflow_path','workflow_blob_sha','main_sha','event','ref','run_attempt','priority_ledger_sha256','canonical_request_sha256','latest_direct_arm_comment_id'):
              assert pre[k] == post[k], k
          PY
      - name: Upload pre/post governance receipts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm-stagea-decoded-time-metadata-governance-v1
          path: ${{ runner.temp }}/arm-stagea-governance-v1/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload sanitized decoded-time metadata artifacts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm-stagea-decoded-time-metadata-one-shot-v1
          path: |
            ${{ runner.temp }}/arm-stagea-decoded-time-metadata-v1/receipt.json
            ${{ runner.temp }}/arm-stagea-decoded-time-metadata-v1/stageA_actual_time_continuity_v2.csv
            ${{ runner.temp }}/arm-stagea-decoded-time-metadata-v1/stageA_actual_time_continuity_v2.json
          if-no-files-found: error
          retention-days: 14
