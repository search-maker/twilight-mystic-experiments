name: ASIV matched stellar asset preflight v1

on:
  pull_request:
    paths:
      - '.github/workflows/asiv-matched-stellar-asset-preflight-v1.yml'
      - 'review/asiv-matched-stellar-transport-v1/**'
      - 'tests/test_asiv_matched_stellar_transport_v1.py'
      - 'tests/test_asiv_matched_stellar_transport_execution_v1.py'
      - 'tests/test_asiv_matched_stellar_transport_validation_v1.py'
      - 'tests/test_asiv_matched_stellar_transport_authorization_gate_v1.py'

permissions:
  contents: read

jobs:
  review-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run matched-stellar zero-runtime review tests only
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_asiv_matched_stellar_transport_v1 \
            tests.test_asiv_matched_stellar_transport_execution_v1 \
            tests.test_asiv_matched_stellar_transport_validation_v1 \
            tests.test_asiv_matched_stellar_transport_authorization_gate_v1
      - name: Prove no scientific workflow or protected-data opening is authorized
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('review/asiv-matched-stellar-transport-v1')
          pre=json.loads((root/'PRECONTRACT.review.json').read_text())
          con=json.loads((root/'EXECUTION_TRANSPORT_CONTRACT.review.json').read_text())
          assert pre['sequencing']['scientificExecutionAuthorizedByThisFile'] is False
          assert pre['sequencing']['solverExecutionAuthorized'] is False
          assert con['scientificExecutionAuthorized'] is False
          assert con['solverExecutionAuthorized'] is False
          assert con['resultOpeningAuthorized'] is False
          assert con['pandoraHoldoutAccessAllowed'] is False
          assert con['productionActivationAuthorized'] is False
          print('matched-stellar review remains zero-runtime and non-authorizing')
          PY

  verify-exact-photometric-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify archived exact Pickles and Johnson-V byte identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/asiv-matched-stellar-assets
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          root=Path('review/asiv-matched-stellar-transport-v1/frozen-assets')
          pickles_path=root/'pickles-sed-1nm.json'
          johnson_path=root/'johnson-v-1nm.json'
          preservation_path=root/'PRESERVATION_REPORT.review.json'
          expected={
              'picklesSha256':'85cbf41c86309b9d54d4765516167165f2d8736bcda8994337ef25d775ea11cb',
              'picklesGitBlobSha1':'3a2bdcd1f9449bd0cdb330d57d5882c9f9a958ca',
              'johnsonSha256':'51c357eb4cb3609361759f9750ad13ae13a901970913e3a5d87bb5c45ee2db9a',
              'johnsonGitBlobSha1':'bbc12bf5543f373676612e00e411071cbf86acce',
          }
          def sha256(path): return hashlib.sha256(path.read_bytes()).hexdigest()
          def git_blob(path):
              data=path.read_bytes()
              return hashlib.sha1(b'blob '+str(len(data)).encode('ascii')+b'\0'+data).hexdigest()

          pickles=json.loads(pickles_path.read_text(encoding='utf-8'))
          johnson=json.loads(johnson_path.read_text(encoding='utf-8'))
          preservation=json.loads(preservation_path.read_text(encoding='utf-8'))
          report={
              'schemaVersion':1,
              'stageId':'asiv-matched-stellar-frozen-photometric-assets-v1',
              'sourceCaptureArtifactId':preservation.get('sourceArtifactId'),
              'sourceCaptureRunId':preservation.get('sourceRunId'),
              'picklesSha256':sha256(pickles_path),
              'picklesGitBlobSha1':git_blob(pickles_path),
              'johnsonSha256':sha256(johnson_path),
              'johnsonGitBlobSha1':git_blob(johnson_path),
              'picklesTemplateCount':len(pickles.get('templates',[])),
              'picklesWavelengthCount':len(pickles.get('wavelengthNm',[])),
              'picklesSourceKind':pickles.get('provenance',{}).get('pickles1998',{}).get('spectrumSourceKind'),
              'johnsonWavelengthCount':len(johnson.get('wavelengthNm',[])),
              'johnsonResponseCount':len(johnson.get('response',[])),
              'johnsonTrailingTenAllZero':johnson.get('response',[])[-10:]==[0.0]*10,
              'solverExecutionPerformed':False,
              'scientificResidualComputed':False,
              'pandoraHoldoutOpened':False,
              'productionAuthorized':False,
          }
          report['exactPicklesBytes']=report['picklesSha256']==expected['picklesSha256'] and report['picklesGitBlobSha1']==expected['picklesGitBlobSha1']
          report['exactJohnsonBytes']=report['johnsonSha256']==expected['johnsonSha256'] and report['johnsonGitBlobSha1']==expected['johnsonGitBlobSha1']
          Path('/tmp/asiv-matched-stellar-assets/preflight-report.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report,indent=2,sort_keys=True))

          if not report['exactPicklesBytes']:
              raise SystemExit('archived 0081 Pickles asset byte identity mismatch')
          if not report['exactJohnsonBytes']:
              raise SystemExit('archived 0081 Johnson-V asset byte identity mismatch')
          if report['picklesTemplateCount'] != 131 or report['picklesWavelengthCount'] != 401 or report['picklesSourceKind'] != 'STScI-MAST-Pickles-Atlas':
              raise SystemExit('archived 0081 Pickles structural identity mismatch')
          if johnson.get('wavelengthNm') != list(range(380,781)) or report['johnsonResponseCount'] != 411 or not report['johnsonTrailingTenAllZero']:
              raise SystemExit('archived 0081 Johnson-V structural identity mismatch')
          if preservation.get('exactJohnsonVBytesArchived') is not True:
              raise SystemExit('preservation report does not attest exact Johnson-V archival')
          PY
      - name: Upload provenance-only asset preflight report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asiv-matched-stellar-frozen-photometric-assets-v1
          if-no-files-found: warn
          retention-days: 30
          path: /tmp/asiv-matched-stellar-assets/preflight-report.json
