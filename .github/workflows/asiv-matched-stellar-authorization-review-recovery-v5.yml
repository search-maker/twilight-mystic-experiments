name: ASIV matched stellar authorization review recovery v5

on:
  pull_request:
    branches: [main]
    paths:
      - 'review/asiv-matched-stellar-transport-v1/authorization-recovery-v5.json'

permissions:
  contents: read
  actions: read

jobs:
  review-authorization:
    if: ${{ github.event.pull_request.draft == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact Recovery v5 authorization head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - name: Verify exact one-file Draft Recovery v5 authorization proposal and strict gates
        shell: bash
        env:
          AUTH_HEAD: ${{ github.event.pull_request.head.sha }}
          AUTH_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$BASE_REF" = main
          test "$AUTH_BRANCH" = authorization/asiv-matched-stellar-transport-recovery-v5
          test "$(git rev-parse HEAD)" = "$AUTH_HEAD"
          mapfile -t PARENTS < <(git cat-file -p HEAD | sed -n 's/^parent //p')
          test "${#PARENTS[@]}" = 1
          test "${PARENTS[0]}" = "$BASE_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = 1
          test "${CHANGED[0]}" = review/asiv-matched-stellar-transport-v1/authorization-recovery-v5.json
          export AUTH_HEAD AUTH_BRANCH BASE_SHA PR_NUMBER
          python - <<'PY'
          import importlib.util,json,os,subprocess
          from pathlib import Path
          root=Path('.')
          auth_path=root/'review/asiv-matched-stellar-transport-v1/authorization-recovery-v5.json'
          auth=json.loads(auth_path.read_text(encoding='utf-8'))
          def need(key,value):
              if auth.get(key)!=value: raise SystemExit(f'Recovery v5 authorization mismatch: {key}')
          need('schemaVersion',1)
          need('stageId','asiv-matched-stellar-transport-v1-execution-authorization')
          need('controlStageId','asiv-matched-stellar-transport-recovery-v5-authorization')
          need('recoveryVersion',5)
          need('authorizationBranch',os.environ['AUTH_BRANCH'])
          need('dispatchBranch','dispatch/asiv-matched-stellar-transport-recovery-v5')
          need('executionKey','asiv-matched-stellar-transport-recovery-v5-one-shot')
          need('exactAuthorizationParentCommit',os.environ['BASE_SHA'])
          need('automaticDispatch',False)
          need('dispatchAuthorized',False)
          need('consumed',False)
          need('githubRerunPermitted',False)
          need('solverRetryPermitted',False)
          need('solverResumePermitted',False)
          need('nativeRenderable',False)
          need('nativeRebuildAuthorized',False)
          need('pandoraHoldoutAccessAllowed',False)
          need('starsvisibilityMutationAuthorized',False)
          need('productionAuthorized',False)
          need('runtimeHelpInvocation','-h')
          need('frozenRuntimeHelpSha256','868aea5af762d968f6f62c4e1472916d25232ed9cab5be112d753b0823d20548')
          prior=auth.get('priorFailedScienceRuns')
          ids=[32848973816,32868735547,32874586374,32879766880]
          if not isinstance(prior,list) or [x.get('runId') for x in prior] != ids:
              raise SystemExit('Recovery v5 prior-run binding drift')
          if any(x.get('solverExecutionObserved') is not False for x in prior):
              raise SystemExit('Recovery v5 may only follow preserved pre-solver failures')
          expected_universe={
              'trainingSpectraTotal':2700,
              'trainingSpectraPerFamily':675,
              'validationAtmosphericSpectraTotal':768,
              'validationAtmosphericSpectraPerFamily':192,
              'validationSedRepresentatives':3,
              'validationJohnsonVComparisonsTotal':2304,
              'validationJohnsonVComparisonsPerFamily':576,
              'partialResultInterpretationPermitted':False,
          }
          if auth.get('caseUniverse') != expected_universe: raise SystemExit('Recovery v5 strict caseUniverse drift')
          expected_batch={
              'batchOrchestrationGitBlobSha1':'d1c4f156967e592ee41f4c1a829e7d551a4f7ea7',
              'batchContractGitBlobSha1':'7214a7e6ff969242cab20d9019ccc522ab96ddde',
              'batchManifestCanonicalSha256':'1756c756e1e865c729a3d93a1084c6081a5eefa6a05f4e874bdaed84e8359663',
              'totalShardCount':99,
              'totalCaseCount':3468,
          }
          if auth.get('batchBindings') != expected_batch: raise SystemExit('Recovery v5 batch binding drift')
          gates=auth.get('acceptanceGates') or {}
          if gates.get('perFamilyMaxAbsDeltaAvMag')!=0.025 or gates.get('perFamilyRmsDeltaAvMag')!=0.01: raise SystemExit('Recovery v5 validation threshold drift')
          if gates.get('everyFamilyMustPassSeparately') is not True or gates.get('aggregateCannotHideFamilyFailure') is not True: raise SystemExit('Recovery v5 per-family gate weakened')
          if any(gates.get(k) is not False for k in ('postResultThresholdRelaxationPermitted','postResultKnotRetuningPermitted','postResultInterpolationRetuningPermitted')): raise SystemExit('Recovery v5 post-result tuning must remain forbidden')
          rt=auth.get('runtimeIdentity') or {}
          if rt.get('uvspecSha256')!='2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3': raise SystemExit('Recovery v5 uvspec binary hash drift')
          if rt.get('uvspecHelpSha256')!='868aea5af762d968f6f62c4e1472916d25232ed9cab5be112d753b0823d20548': raise SystemExit('Recovery v5 help hash drift')
          bindings=auth.get('controlBindings') or {}
          paths={
              'scienceWorkflowActiveGitBlobSha1':'.github/workflows/asiv-matched-stellar-science-recovery-v5.yml',
              'scienceWorkflowCandidateGitBlobSha1':'review/asiv-matched-stellar-transport-v1/recovery-v5/science-workflow-v5.yml.review',
              'authorizationReviewWorkflowActiveGitBlobSha1':'.github/workflows/asiv-matched-stellar-authorization-review-recovery-v5.yml',
              'authorizationReviewWorkflowCandidateGitBlobSha1':'review/asiv-matched-stellar-transport-v1/recovery-v5/authorization-review-workflow-v5.yml.review',
              'historicalPreSolverEvidenceGitBlobSha1':'review/asiv-matched-stellar-transport-v1/recovery-v5/HISTORICAL_PRE_SOLVER_EVIDENCE.review.json',
              'uvspecHelpFlagDiagnosticGitBlobSha1':'review/asiv-matched-stellar-transport-v1/recovery-v5/UVSPEC_HELP_FLAG_DIAGNOSTIC.review.json',
              'recoveryV4FailureEvidenceGitBlobSha1':'review/asiv-matched-stellar-transport-v1/recovery-v5/RUN_32879766880_PRE_SOLVER_FAILURE.review.json',
              'recoveryControlContractGitBlobSha1':'review/asiv-matched-stellar-transport-v1/recovery-v5/RECOVERY_CONTROL_CONTRACT.review.json',
              'readOnlyApiRetryHelperGitBlobSha1':'review/asiv-matched-stellar-transport-v1/recovery-v4/read_only_gh_api_retry_v4.py',
              'batchOrchestrationGitBlobSha1':'review/asiv-matched-stellar-transport-v1/batch_orchestration_review.py',
              'executionTransportGitBlobSha1':'review/asiv-matched-stellar-transport-v1/execution_transport_review.py',
              'validationAssemblerGitBlobSha1':'review/asiv-matched-stellar-transport-v1/assemble_validate_matched_stellar_v1.py',
          }
          for key,path in paths.items():
              observed=subprocess.check_output(['git','hash-object',path],text=True).strip()
              if bindings.get(key)!=observed: raise SystemExit(f'Recovery v5 blob binding drift: {key}')
          gate_path=root/'review/asiv-matched-stellar-transport-v1/execution_authorization_gate_review.py'
          spec=importlib.util.spec_from_file_location('recovery_v5_strict_execution_gate',gate_path)
          gate=importlib.util.module_from_spec(spec); spec.loader.exec_module(gate)
          gate.validate_strict_authorization(auth)
          batch_path=root/'review/asiv-matched-stellar-transport-v1/batch_orchestration_review.py'
          bspec=importlib.util.spec_from_file_location('recovery_v5_batch_gate',batch_path)
          batch=importlib.util.module_from_spec(bspec); bspec.loader.exec_module(batch)
          batch.validate_batch_authorization(auth)
          PY
      - name: Compact-live verify immutable v1 through v4 pre-solver evidence before dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HELPER=review/asiv-matched-stellar-transport-v1/recovery-v4/read_only_gh_api_retry_v4.py
          for RID in 32848973816 32868735547 32874586374 32879766880; do
            python "$HELPER" --output "run-${RID}.json" -- "repos/${GITHUB_REPOSITORY}/actions/runs/${RID}"
            python "$HELPER" --output "artifacts-${RID}.json" -- "repos/${GITHUB_REPOSITORY}/actions/runs/${RID}/artifacts?per_page=100"
          done
          for JID in 97805508810 97870360724 97889371107 97906508551; do
            python "$HELPER" --output "job-${JID}.json" -- "repos/${GITHUB_REPOSITORY}/actions/jobs/${JID}"
          done
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          evidence_path=Path('review/asiv-matched-stellar-transport-v1/recovery-v5/HISTORICAL_PRE_SOLVER_EVIDENCE.review.json')
          diagnostic_path=Path('review/asiv-matched-stellar-transport-v1/recovery-v5/UVSPEC_HELP_FLAG_DIAGNOSTIC.review.json')
          v4_failure_path=Path('review/asiv-matched-stellar-transport-v1/recovery-v5/RUN_32879766880_PRE_SOLVER_FAILURE.review.json')
          evidence=json.loads(evidence_path.read_text(encoding='utf-8'))
          diag=json.loads(diagnostic_path.read_text(encoding='utf-8'))
          v4_failure=json.loads(v4_failure_path.read_text(encoding='utf-8'))
          if subprocess.check_output(['git','hash-object',str(evidence_path)],text=True).strip()!='1b96747b5e865f049a2c839d5adf077a2949d6fd': raise SystemExit('Recovery v5 historical evidence blob drift')
          if subprocess.check_output(['git','hash-object',str(diagnostic_path)],text=True).strip()!='e9c9ff71a9414e17403e96c2537d4724dabda3e4': raise SystemExit('Recovery v5 help diagnostic blob drift')
          if subprocess.check_output(['git','hash-object',str(v4_failure_path)],text=True).strip()!='5bd2a61b19dd601b6c755fcc2173dee6eab7966a': raise SystemExit('Recovery v5 v4-failure evidence blob drift')
          expected_ids=[32848973816,32868735547,32874586374,32879766880]
          prior=evidence.get('priorRuns') or []
          if [x.get('runId') for x in prior]!=expected_ids: raise SystemExit('Recovery v5 historical evidence run-id drift')
          common=evidence.get('commonBoundary') or {}
          for key in ('scientificSolverExecutionObserved','scientificShardArtifactsObserved','finalValidationArtifactsObserved','githubJobRerunPermitted','solverRetryPermitted','solverResumePermitted','pandoraHoldoutOpened','productionAuthorized','starsvisibilityMutationAuthorized'):
              if common.get(key) is not False: raise SystemExit(f'Recovery v5 immutable boundary drift: {key}')
          for row in prior:
              if row.get('solverExecutionObserved') is not False or row.get('scientificShardArtifactCount')!=0 or row.get('finalValidationArtifactCount')!=0: raise SystemExit(f'Recovery v5 frozen evidence not pre-solver for {row.get("runId")}')
          def load(path): return json.load(open(path))
          for row in prior:
              rid=int(row['runId']); live=load(f'run-{rid}.json')
              expected={'id':rid,'run_attempt':row['runAttempt'],'status':'completed','conclusion':row['conclusion'],'head_branch':row['headBranch'],'head_sha':row['headSha']}
              for key,value in expected.items():
                  if live.get(key)!=value: raise SystemExit(f'Recovery v5 historical run {rid} drift: {key}')
          job_map={32848973816:97805508810,32868735547:97870360724,32874586374:97889371107,32879766880:97906508551}
          for row in prior:
              job=load(f'job-{job_map[row["runId"]]}.json')
              if int(job.get('id') or 0)!=row['failedJobId'] or job.get('name')!=row['failedJobName'] or job.get('conclusion')!='failure': raise SystemExit(f'Recovery v5 failed-job drift for {row["runId"]}')
              steps={s.get('name'):s.get('conclusion') for s in job.get('steps') or []}
              if steps.get(row['failedStepName'])!='failure': raise SystemExit(f'Recovery v5 failed-step drift for {row["runId"]}')
              if row['runId'] in (32848973816,32879766880) and steps.get('Execute exactly one frozen shard with no retry or resume')!='skipped': raise SystemExit(f'Recovery v5 prior shard crossed solver boundary for {row["runId"]}')
              if row['runId'] in (32868735547,32874586374) and steps.get('Build exact frozen 99-shard matrix')!='skipped': raise SystemExit(f'Recovery v5 prior preflight crossed matrix boundary for {row["runId"]}')
          a1=load('artifacts-32848973816.json').get('artifacts',[])
          if len([a for a in a1 if a.get('name')=='asiv-matched-stellar-preflight-v1' and int(a.get('id') or 0)==9563491205])!=1: raise SystemExit('v1 preflight artifact drift')
          if [a for a in a1 if str(a.get('name') or '').startswith('asiv-matched-stellar-shard-v1-') or a.get('name')=='asiv-matched-stellar-final-validation-v1']: raise SystemExit('v1 scientific artifact appeared')
          if load('artifacts-32868735547.json').get('artifacts',[]): raise SystemExit('v2 artifact universe must remain empty')
          if load('artifacts-32874586374.json').get('artifacts',[]): raise SystemExit('v3 artifact universe must remain empty')
          a4=load('artifacts-32879766880.json').get('artifacts',[])
          pre4=[a for a in a4 if a.get('name')=='asiv-matched-stellar-preflight-recovery-v4' and int(a.get('id') or 0)==9575341217]
          sci4=[a for a in a4 if str(a.get('name') or '').startswith('asiv-matched-stellar-shard-recovery-v4-') or a.get('name')=='asiv-matched-stellar-final-validation-recovery-v4']
          if len(pre4)!=1 or sci4: raise SystemExit('v4 compact artifact boundary drift')
          failure=v4_failure.get('fullJobUniverseInspection') or {}
          if failure.get('totalJobCount')!=101 or failure.get('solverStepSuccessCount')!=0 or failure.get('solverStepFailureCount')!=0 or failure.get('aggregateConclusion')!='skipped' or failure.get('solverExecutionObserved') is not False: raise SystemExit('v4 full-universe frozen evidence drift')
          if diag.get('status')!='ZERO_SOLVER_DIAGNOSTIC_PASS' or (diag.get('boundaries') or {}).get('scientificSolverExecuted') is not False: raise SystemExit('help diagnostic safety boundary drift')
          obs=diag.get('observations') or {}; req=diag.get('requiredCorrection') or {}
          if (obs.get('shortFlag') or {}).get('combinedSha256')!='868aea5af762d968f6f62c4e1472916d25232ed9cab5be112d753b0823d20548' or (obs.get('shortFlag') or {}).get('matchesFrozenHash') is not True: raise SystemExit('documented -h identity drift')
          if (obs.get('longFlag') or {}).get('matchesFrozenHash') is not False or req.get('newInvocation')!='uvspec -h' or req.get('expectedHelpSha256Remains')!='868aea5af762d968f6f62c4e1472916d25232ed9cab5be112d753b0823d20548': raise SystemExit('help-flag diagnosis drift')
          raw=evidence_path.read_bytes(); draw=diagnostic_path.read_bytes()
          def git_blob(raw): return hashlib.sha1(b'blob '+str(len(raw)).encode('ascii')+b'\0'+raw).hexdigest()
          verification={
              'schemaVersion':1,
              'stageId':'asiv-matched-stellar-transport-recovery-v5-historical-live-verification',
              'status':'FOUR_RUN_HISTORICAL_PRE_SOLVER_EVIDENCE_LIVE_VERIFIED',
              'verificationMode':'IMMUTABLE_FULL_BOUNDARY_EVIDENCE_PLUS_COMPACT_LIVE_RUN_JOB_ARTIFACT_CHECK',
              'runIds':expected_ids,
              'liveFailedJobIds':[97805508810,97870360724,97889371107,97906508551],
              'fullHistoricalJobsEnumerationPerformedInThisReview':False,
              'historicalEvidenceRawSha256':hashlib.sha256(raw).hexdigest(),
              'historicalEvidenceGitBlobSha1':git_blob(raw),
              'uvspecHelpFlagDiagnosticRawSha256':hashlib.sha256(draw).hexdigest(),
              'uvspecHelpFlagDiagnosticGitBlobSha1':git_blob(draw),
              'uvspecRuntimeHelpInvocation':'-h',
              'uvspecFrozenHelpSha256':'868aea5af762d968f6f62c4e1472916d25232ed9cab5be112d753b0823d20548',
              'solverExecutionObserved':False,
              'scientificShardArtifactsObserved':False,
              'finalValidationArtifactsObserved':False,
              'verificationPerformedBeforeScienceDispatch':True,
          }
          Path('historical-presolver-verification-v5.json').write_text(json.dumps(verification,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(verification,sort_keys=True))
          PY
      - name: Build Recovery v5 authorization review receipt
        shell: bash
        env:
          AUTH_HEAD: ${{ github.event.pull_request.head.sha }}
          AUTH_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          export AUTH_HEAD AUTH_BRANCH BASE_SHA PR_NUMBER
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          auth_path=Path('review/asiv-matched-stellar-transport-v1/authorization-recovery-v5.json')
          history_path=Path('review/asiv-matched-stellar-transport-v1/recovery-v5/HISTORICAL_PRE_SOLVER_EVIDENCE.review.json')
          diag_path=Path('review/asiv-matched-stellar-transport-v1/recovery-v5/UVSPEC_HELP_FLAG_DIAGNOSTIC.review.json')
          raw=auth_path.read_bytes(); hraw=history_path.read_bytes(); draw=diag_path.read_bytes()
          verification=json.load(open('historical-presolver-verification-v5.json'))
          if verification.get('status')!='FOUR_RUN_HISTORICAL_PRE_SOLVER_EVIDENCE_LIVE_VERIFIED': raise SystemExit('historical verification missing before receipt')
          def git_blob(raw): return hashlib.sha1(b'blob '+str(len(raw)).encode('ascii')+b'\0'+raw).hexdigest()
          receipt={
              'schemaVersion':1,
              'status':'AUTHORIZATION_REVIEW_PASS_NO_DISPATCH',
              'authorizationHeadSha':os.environ['AUTH_HEAD'],
              'authorizationParentSha':os.environ['BASE_SHA'],
              'authorizationBranch':os.environ['AUTH_BRANCH'],
              'prNumber':int(os.environ['PR_NUMBER']),
              'authorizationRawSha256':hashlib.sha256(raw).hexdigest(),
              'authorizationGitBlobSha1':git_blob(raw),
              'workflowRunAttempt':1,
              'recoveryVersion':5,
              'priorFailedScienceRunIds':[32848973816,32868735547,32874586374,32879766880],
              'historicalPreSolverEvidenceVerified':True,
              'historicalEvidenceRawSha256':hashlib.sha256(hraw).hexdigest(),
              'historicalEvidenceGitBlobSha1':git_blob(hraw),
              'uvspecHelpFlagDiagnosticVerified':True,
              'uvspecHelpFlagDiagnosticRawSha256':hashlib.sha256(draw).hexdigest(),
              'uvspecHelpFlagDiagnosticGitBlobSha1':git_blob(draw),
              'uvspecRuntimeHelpInvocation':'-h',
              'uvspecFrozenHelpSha256':'868aea5af762d968f6f62c4e1472916d25232ed9cab5be112d753b0823d20548',
              'strictExecutionGateVerified':True,
              'strictBatchGateVerified':True,
              'scientificExecutionPerformed':False,
              'solverExecutionPerformed':False,
              'dispatchPerformed':False,
              'resultOpeningAuthorized':False,
              'pandoraHoldoutOpened':False,
              'productionAuthorized':False,
          }
          Path('authorization-review-recovery-v5.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(receipt,sort_keys=True))
          PY
      - name: Upload immutable Recovery v5 authorization-review evidence only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: asiv-matched-stellar-authorization-review-recovery-v5
          path: |
            authorization-review-recovery-v5.json
            historical-presolver-verification-v5.json
          if-no-files-found: error
          retention-days: 90
