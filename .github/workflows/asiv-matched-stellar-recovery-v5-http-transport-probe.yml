name: ASIV matched stellar Recovery v5 jobs-API-free transport probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/asiv-matched-stellar-recovery-v5-http-transport-probe.yml'
      - 'review/asiv-matched-stellar-transport-v1/recovery-v5-transport-probe/**'
      - 'tests/test_asiv_matched_stellar_recovery_v5_http_transport_probe.py'

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  probe-jobs-api-free:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact probe head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - name: Verify zero-solver probe contract and helper tests
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git hash-object review/asiv-matched-stellar-transport-v1/recovery-v5-transport-probe/read_only_github_rest_v5.py)" = 2bc293c7db73c436ba422f80566513459df77c7e
          test "$(git hash-object review/asiv-matched-stellar-transport-v1/recovery-v5-transport-probe/PROBE_CONTRACT.review.json)" = e4dcf9652eeefdbe8efb02a1ad97d16da52d5ba0
          test ! -e review/asiv-matched-stellar-transport-v1/authorization-recovery-v5.json
          python -m unittest discover -s tests -p 'test_asiv_matched_stellar_recovery_v5_http_transport_probe.py' -v
          python - <<'PY'
          import json
          row=json.load(open('review/asiv-matched-stellar-transport-v1/recovery-v5-transport-probe/PROBE_CONTRACT.review.json'))
          for key in ('scientificExecutionAuthorized','solverExecutionAuthorized','authorizationFileCreated','authorizationBranchCreated','dispatchBranchCreated','workflowDispatchPerformed','solverRetryPermitted','solverResumePermitted','githubJobRerunPermitted','resultOpeningAuthorized','pandoraHoldoutAccessAllowed','starsvisibilityMutationAuthorized','productionAuthorized'):
              if row.get(key) is not False: raise SystemExit(f'probe authority drift: {key}')
          PY
      - name: Probe cross-run authorization receipt download without Jobs API
        uses: actions/download-artifact@v4
        with:
          name: asiv-matched-stellar-authorization-review-recovery-v3
          path: transport-probe/historical-auth-receipt
          repository: ${{ github.repository }}
          run-id: 32873654251
          github-token: ${{ github.token }}
      - name: Verify exact downloaded historical authorization receipt
        shell: bash
        run: |
          set -euo pipefail
          test -f transport-probe/historical-auth-receipt/authorization-review-recovery-v3.json
          python - <<'PY'
          import json
          p='transport-probe/historical-auth-receipt/authorization-review-recovery-v3.json'
          row=json.load(open(p))
          expected={
              'status':'AUTHORIZATION_REVIEW_PASS_NO_DISPATCH',
              'authorizationHeadSha':'9f4dfae222a521cea2d85ca779d81109575448d2',
              'authorizationParentSha':'fa43b87647bf59704f6e6fa99eed248655fe8bc3',
              'authorizationBranch':'authorization/asiv-matched-stellar-transport-recovery-v3',
              'prNumber':381,
              'workflowRunAttempt':1,
              'recoveryVersion':3,
              'priorFailedScienceRunIds':[32848973816,32868735547],
              'strictExecutionGateVerified':True,
              'strictBatchGateVerified':True,
              'scientificExecutionPerformed':False,
              'solverExecutionPerformed':False,
              'dispatchPerformed':False,
              'resultOpeningAuthorized':False,
              'pandoraHoldoutOpened':False,
              'productionAuthorized':False,
          }
          for k,v in expected.items():
              if row.get(k)!=v: raise SystemExit(f'cross-run receipt mismatch: {k}')
          PY
      - name: Probe direct HTTPS GET only on current pull request metadata
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          H=review/asiv-matched-stellar-transport-v1/recovery-v5-transport-probe/read_only_github_rest_v5.py
          python "$H" pull-request --repository "$GITHUB_REPOSITORY" --pr-number "$PR_NUMBER" --output transport-probe/current-pr.json
          export PR_NUMBER HEAD_SHA
          python - <<'PY'
          import json,os
          row=json.load(open('transport-probe/current-pr.json'))
          pr=row.get('pullRequest') or {}
          if int(pr.get('number') or 0)!=int(os.environ['PR_NUMBER']): raise SystemExit('direct REST current PR number drift')
          if pr.get('state')!='open': raise SystemExit('direct REST current PR must be open during probe')
          if (pr.get('head') or {}).get('sha')!=os.environ['HEAD_SHA']: raise SystemExit('direct REST current PR head drift')
          if (pr.get('base') or {}).get('ref')!='main': raise SystemExit('direct REST current PR base drift')
          if (row.get('audit') or {}).get('requestMethod')!='GET' or (row.get('audit') or {}).get('writeMethodPermitted') is not False:
              raise SystemExit('current PR transport not proven read-only GET')
          PY
      - name: Verify frozen historical pre-solver evidence can replace Jobs API at dispatch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object review/asiv-matched-stellar-transport-v1/recovery-v4/HISTORICAL_PRE_SOLVER_EVIDENCE.review.json)" = b779f3dc46773fb4819fea6999ddd2fd68904aa1
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('review/asiv-matched-stellar-transport-v1/recovery-v4/HISTORICAL_PRE_SOLVER_EVIDENCE.review.json')
          row=json.loads(p.read_text(encoding='utf-8'))
          prior=row.get('priorRuns') or []
          if [x.get('runId') for x in prior] != [32848973816,32868735547,32874586374]: raise SystemExit('historical evidence run-id drift')
          if any(x.get('solverExecutionObserved') is not False for x in prior): raise SystemExit('historical evidence no-solver boundary drift')
          if any(int(x.get('scientificShardArtifactCount') or 0)!=0 for x in prior): raise SystemExit('historical scientific artifact boundary drift')
          result={
              'schemaVersion':1,
              'stageId':'asiv-matched-stellar-recovery-v5-jobs-api-free-transport-probe-result',
              'status':'JOBS_API_FREE_CONTROL_TRANSPORT_PROBE_PASS',
              'crossRunAuthorizationReceiptDownloadPassed':True,
              'currentPullRequestReadOnlyGetPassed':True,
              'historicalJobsApiRequiredAtDispatch':False,
              'historicalEvidenceGitBlobSha1':'b779f3dc46773fb4819fea6999ddd2fd68904aa1',
              'scientificExecutionPerformed':False,
              'solverExecutionPerformed':False,
              'authorizationCreated':False,
              'dispatchCreated':False,
              'pandoraOpened':False,
              'productionAuthorized':False,
          }
          Path('transport-probe/PROBE_RESULT.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(result,sort_keys=True))
          PY
      - name: Publish zero-solver jobs-API-free transport probe evidence only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: asiv-matched-stellar-recovery-v5-jobs-api-free-transport-probe
          path: transport-probe/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
