name: ASIV matched stellar recovery workflow activation review v2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/asiv-matched-stellar-authorization-review-recovery-v2.yml'
      - '.github/workflows/asiv-matched-stellar-science-recovery-v2.yml'
      - '.github/workflows/asiv-matched-stellar-recovery-workflow-activation-review-v2.yml'
      - '.github/workflows/asiv-matched-stellar-presolver-recovery-review-v2.yml'
      - 'review/asiv-matched-stellar-transport-v1/recovery-v2/WORKFLOW_ACTIVATION_CONTRACT.review.json'
      - 'tests/test_asiv_matched_stellar_recovery_workflow_activation_v2.py'

permissions:
  contents: read

jobs:
  exact-byte-activation-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - name: Run exact recovery v2 activation tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_asiv_matched_stellar_recovery_workflow_activation_v2 \
            tests.test_asiv_matched_stellar_recovery_v2
      - name: Prove exact recovery v2 activation boundary
        shell: bash
        run: |
          set -euo pipefail
          REC=review/asiv-matched-stellar-transport-v1/recovery-v2
          test ! -e review/asiv-matched-stellar-transport-v1/authorization-recovery-v2.json
          test "$(git hash-object "$REC/RECOVERY_CONTROL_CONTRACT.review.json")" = 28ec19fdc218e6230cf1aec7a52e69b5771363e6
          test "$(git hash-object "$REC/authorization-review-workflow-v2.yml.review")" = a334c8d4537f4503a502978f106daf83c87a1c9e
          test "$(git hash-object .github/workflows/asiv-matched-stellar-authorization-review-recovery-v2.yml)" = a334c8d4537f4503a502978f106daf83c87a1c9e
          test "$(git hash-object "$REC/science-workflow-v2.yml.review")" = 91fc9bc11102cc30db9c3ed46a2ee9290747c986
          test "$(git hash-object .github/workflows/asiv-matched-stellar-science-recovery-v2.yml)" = 91fc9bc11102cc30db9c3ed46a2ee9290747c986
          test "$(git hash-object .github/workflows/asiv-matched-stellar-authorization-review-v1.yml)" = 6ed68a90f2614dd762b5484e740a146e2cb636cc
          test "$(git hash-object .github/workflows/asiv-matched-stellar-science-v1.yml)" = 396bb79f0f00b36888f809f7f3bff40d62646632
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('review/asiv-matched-stellar-transport-v1/recovery-v2/WORKFLOW_ACTIVATION_CONTRACT.review.json')
          c=json.loads(p.read_text(encoding='utf-8'))
          assert c['status']=='REVIEW_ONLY_EXACT_RECOVERY_V2_WORKFLOW_ACTIVATION_NO_AUTHORIZATION_NO_DISPATCH'
          assert c['sourceRecoveryControlContract']['gitBlobSha1']=='28ec19fdc218e6230cf1aec7a52e69b5771363e6'
          roles={row['role']:row for row in c['exactActivations']}
          assert roles['authorization-review']['activeGitBlobSha1Required']=='a334c8d4537f4503a502978f106daf83c87a1c9e'
          assert roles['science']['activeGitBlobSha1Required']=='91fc9bc11102cc30db9c3ed46a2ee9290747c986'
          for key in ('scientificExecutionAuthorized','solverExecutionAuthorized','authorizationFileCreated','authorizationBranchCreated','dispatchBranchCreated','workflowDispatchPerformed','resultOpeningAuthorized','productionActivationAuthorized','pandoraHoldoutAccessAllowed','starsvisibilityMutationAuthorized','nativeRebuildAuthorized','retryPermitted','resumePermitted','githubRerunPermitted'):
              assert c[key] is False,key
          assert c['activationBoundary']['authorizationMayNotBeCreatedByThisReview'] is True
          assert c['activationBoundary']['scienceMayNotBeDispatchedByThisReview'] is True
          assert c['activationBoundary']['priorV1PreSolverFailureReverificationStillRequired'] is True
          print('exact recovery v2 workflow activation boundary preserved')
          PY
