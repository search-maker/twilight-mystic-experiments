name: ASIV matched stellar Recovery v3 workflow activation review

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/asiv-matched-stellar-authorization-review-recovery-v3.yml'
      - '.github/workflows/asiv-matched-stellar-science-recovery-v3.yml'
      - '.github/workflows/asiv-matched-stellar-recovery-workflow-activation-review-v3.yml'
      - 'review/asiv-matched-stellar-transport-v1/recovery-v3/authorization-review-workflow-v3.yml.review'
      - 'review/asiv-matched-stellar-transport-v1/recovery-v3/science-workflow-v3.yml.review'
      - 'review/asiv-matched-stellar-transport-v1/recovery-v3/WORKFLOW_ACTIVATION_CONTRACT.review.json'
      - 'tests/test_asiv_matched_stellar_recovery_v3.py'
      - 'tests/test_asiv_matched_stellar_recovery_workflow_activation_v3.py'

permissions:
  contents: read

jobs:
  review-activation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - name: Verify exact Recovery v3 workflow control alignment only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test ! -e review/asiv-matched-stellar-transport-v1/authorization-recovery-v3.json
          test "$(git hash-object review/asiv-matched-stellar-transport-v1/recovery-v3/authorization-review-workflow-v3.yml.review)" = 86564ecd4d33c6c5f94d657214c3aa98f09c211a
          test "$(git hash-object .github/workflows/asiv-matched-stellar-authorization-review-recovery-v3.yml)" = 86564ecd4d33c6c5f94d657214c3aa98f09c211a
          test "$(git hash-object review/asiv-matched-stellar-transport-v1/recovery-v3/science-workflow-v3.yml.review)" = fd844e53da4d4433a3a5322a40af2dd734238376
          test "$(git hash-object .github/workflows/asiv-matched-stellar-science-recovery-v3.yml)" = fd844e53da4d4433a3a5322a40af2dd734238376
          test "$(git hash-object review/asiv-matched-stellar-transport-v1/recovery-v3/read_only_gh_api_retry_v3.py)" = ce2ebe14f5128308fb8d138d38b064f8387feb29
          test "$(git hash-object review/asiv-matched-stellar-transport-v1/recovery-v3/RUN_32868735547_PRE_SOLVER_FAILURE.review.json)" = 2caae4d121e13eced92cfb7b362c29502d2a25f4
          python -m unittest discover -s tests -p 'test_asiv_matched_stellar_recovery_v3.py' -v
          python -m unittest discover -s tests -p 'test_asiv_matched_stellar_recovery_workflow_activation_v3.py' -v
      - name: Prove alignment review has no solver or dispatch authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('review/asiv-matched-stellar-transport-v1/recovery-v3/WORKFLOW_ACTIVATION_CONTRACT.review.json')
          row=json.loads(p.read_text(encoding='utf-8'))
          for key in (
              'scientificExecutionAuthorized','solverExecutionAuthorized','authorizationFileCreated',
              'authorizationBranchCreated','dispatchBranchCreated','workflowDispatchPerformed',
              'resultOpeningAuthorized','productionActivationAuthorized','pandoraHoldoutAccessAllowed',
              'starsvisibilityMutationAuthorized','nativeRebuildAuthorized','retryPermitted',
              'resumePermitted','githubRerunPermitted'):
              if row.get(key) is not False: raise SystemExit(f'control-alignment authority drift: {key}')
          alignment=row.get('strictGateAlignment') or {}
          if alignment.get('requiredScientificAuthorizationStageId')!='asiv-matched-stellar-transport-v1-execution-authorization': raise SystemExit('strict authorization stage drift')
          if alignment.get('recoveryControlStageId')!='asiv-matched-stellar-transport-recovery-v3-authorization': raise SystemExit('Recovery v3 control stage drift')
          if alignment.get('authorizationReviewMustExecuteStrictGateValidation') is not True: raise SystemExit('strict gate review missing')
          if alignment.get('authorizationReviewMustExecuteBatchGateValidation') is not True: raise SystemExit('batch gate review missing')
          print('RECOVERY_V3_CONTROL_ALIGNMENT_PASS_NO_AUTH_NO_DISPATCH_NO_SOLVER')
          PY
