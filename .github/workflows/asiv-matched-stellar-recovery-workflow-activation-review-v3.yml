name: ASIV matched stellar Recovery v3 workflow activation review

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/asiv-matched-stellar-authorization-review-recovery-v3.yml'
      - '.github/workflows/asiv-matched-stellar-science-recovery-v3.yml'
      - '.github/workflows/asiv-matched-stellar-recovery-workflow-activation-review-v3.yml'
      - 'review/asiv-matched-stellar-transport-v1/recovery-v3/authorization-review-workflow-v3.yml.review'
      - 'review/asiv-matched-stellar-transport-v1/recovery-v3/WORKFLOW_ACTIVATION_CONTRACT.review.json'
      - 'tests/test_asiv_matched_stellar_recovery_workflow_activation_v3.py'

permissions:
  contents: read

jobs:
  review-activation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - name: Verify exact Recovery v3 workflow activation only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test ! -e review/asiv-matched-stellar-transport-v1/authorization-recovery-v3.json
          test "$(git hash-object review/asiv-matched-stellar-transport-v1/recovery-v3/authorization-review-workflow-v3.yml.review)" = 7d902c2e08a437d25357b005e8f52d99c1b096aa
          test "$(git hash-object .github/workflows/asiv-matched-stellar-authorization-review-recovery-v3.yml)" = 7d902c2e08a437d25357b005e8f52d99c1b096aa
          test "$(git hash-object review/asiv-matched-stellar-transport-v1/recovery-v3/science-workflow-v3.yml.review)" = 36428e9d719e47550a7baa21c6dab61e38a3cd98
          test "$(git hash-object .github/workflows/asiv-matched-stellar-science-recovery-v3.yml)" = 36428e9d719e47550a7baa21c6dab61e38a3cd98
          test "$(git hash-object review/asiv-matched-stellar-transport-v1/recovery-v3/read_only_gh_api_retry_v3.py)" = ce2ebe14f5128308fb8d138d38b064f8387feb29
          test "$(git hash-object review/asiv-matched-stellar-transport-v1/recovery-v3/RUN_32868735547_PRE_SOLVER_FAILURE.review.json)" = 2caae4d121e13eced92cfb7b362c29502d2a25f4
          grep -F "validate_batch_authorization(auth)" .github/workflows/asiv-matched-stellar-authorization-review-recovery-v3.yml
          grep -F "asiv-matched-stellar-transport-v1-execution-authorization" .github/workflows/asiv-matched-stellar-authorization-review-recovery-v3.yml
          python -m unittest discover -s tests -p 'test_asiv_matched_stellar_recovery_workflow_activation_v3.py' -v
      - name: Prove activation review has no solver or dispatch authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('review/asiv-matched-stellar-transport-v1/recovery-v3/WORKFLOW_ACTIVATION_CONTRACT.review.json')
          row=json.loads(p.read_text(encoding='utf-8'))
          for key in (
              'scientificExecutionAuthorized','solverExecutionAuthorized','authorizationFileCreated',
              'authorizationBranchCreated','dispatchBranchCreated','workflowDispatchPerformed',
              'resultOpeningAuthorized','productionActivationAuthorized','pandoraHoldoutAccessAllowed',
              'starsvisibilityMutationAuthorized','nativeRebuildAuthorized','retryPermitted',
              'resumePermitted','githubRerunPermitted'):
              if row.get(key) is not False: raise SystemExit(f'activation authority drift: {key}')
          boundary=row.get('activationBoundary') or {}
          if boundary.get('authorizationMayNotBeCreatedByThisReview') is not True: raise SystemExit('authorization boundary weakened')
          if boundary.get('scienceMayNotBeDispatchedByThisReview') is not True: raise SystemExit('dispatch boundary weakened')
          if boundary.get('readOnlyApiTransportRetryDoesNotAuthorizeSolverRetry') is not True: raise SystemExit('retry boundary weakened')
          parity=row.get('strictAuthorizationParity') or {}
          if parity.get('authorizationReviewMustCallFrozenBatchValidator') is not True: raise SystemExit('strict authorization parity missing')
          if parity.get('authorizationReviewMayNotExecuteSolver') is not True: raise SystemExit('authorization review solver boundary weakened')
          print('RECOVERY_V3_WORKFLOW_ACTIVATION_REVIEW_PASS_STRICT_AUTH_PARITY_NO_AUTH_NO_DISPATCH_NO_SOLVER')
          PY
