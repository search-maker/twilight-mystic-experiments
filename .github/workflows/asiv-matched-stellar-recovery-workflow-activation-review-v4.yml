name: ASIV matched stellar Recovery v4 workflow activation review

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/asiv-matched-stellar-authorization-review-recovery-v4.yml'
      - '.github/workflows/asiv-matched-stellar-science-recovery-v4.yml'
      - '.github/workflows/asiv-matched-stellar-recovery-workflow-activation-review-v4.yml'
      - 'review/asiv-matched-stellar-transport-v1/recovery-v4/**'
      - 'tests/test_asiv_matched_stellar_recovery_v4.py'
      - 'tests/test_asiv_matched_stellar_recovery_workflow_activation_v4.py'

permissions:
  contents: read

jobs:
  review-activation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - name: Verify exact Recovery v4 compact-history control alignment only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test ! -e review/asiv-matched-stellar-transport-v1/authorization-recovery-v4.json
          test "$(git hash-object review/asiv-matched-stellar-transport-v1/recovery-v4/authorization-review-workflow-v4.yml.review)" = b4d7f489be60a98c6bc6a9af48fce70dcd40d6e9
          test "$(git hash-object .github/workflows/asiv-matched-stellar-authorization-review-recovery-v4.yml)" = b4d7f489be60a98c6bc6a9af48fce70dcd40d6e9
          test "$(git hash-object review/asiv-matched-stellar-transport-v1/recovery-v4/science-workflow-v4.yml.review)" = 1d36adb676cae115b141c8c085afb9e22e2142c3
          test "$(git hash-object .github/workflows/asiv-matched-stellar-science-recovery-v4.yml)" = 1d36adb676cae115b141c8c085afb9e22e2142c3
          test "$(git hash-object review/asiv-matched-stellar-transport-v1/recovery-v4/read_only_gh_api_retry_v4.py)" = 7b9a0698135f60c56cb8a212a724079cda054cc3
          test "$(git hash-object review/asiv-matched-stellar-transport-v1/recovery-v4/HISTORICAL_PRE_SOLVER_EVIDENCE.review.json)" = b779f3dc46773fb4819fea6999ddd2fd68904aa1
          test "$(git hash-object review/asiv-matched-stellar-transport-v1/recovery-v4/RECOVERY_CONTROL_CONTRACT.review.json)" = 775f65ee5f6ca8ec847829bc9ea73c08f0744f96
          test "$(git hash-object review/asiv-matched-stellar-transport-v1/recovery-v4/WORKFLOW_ACTIVATION_CONTRACT.review.json)" = d080814b874337a7e2ade96aa0d4b8d0f5efe5d0
          python -m unittest discover -s tests -p 'test_asiv_matched_stellar_recovery_v4.py' -v
          python -m unittest discover -s tests -p 'test_asiv_matched_stellar_recovery_workflow_activation_v4.py' -v
      - name: Prove compact-history fix grants no solver or dispatch authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          row=json.loads(Path('review/asiv-matched-stellar-transport-v1/recovery-v4/WORKFLOW_ACTIVATION_CONTRACT.review.json').read_text(encoding='utf-8'))
          for key in (
              'scientificExecutionAuthorized','solverExecutionAuthorized','authorizationFileCreated',
              'dispatchBranchCreated','workflowDispatchPerformed','resultOpeningAuthorized',
              'productionActivationAuthorized','pandoraHoldoutAccessAllowed','starsvisibilityMutationAuthorized',
              'nativeRebuildAuthorized','retryPermitted','resumePermitted','githubRerunPermitted'):
              if row.get(key) is not False: raise SystemExit(f'Recovery v4 activation authority drift: {key}')
          history=row.get('historicalEvidenceAlignment') or {}
          if history.get('fullHistoricalJobsEnumerationInAuthorizationReviewPermitted') is not False: raise SystemExit('fragile full historical jobs enumeration reopened')
          if history.get('exactFailedJobIdsForCompactLiveCheck') != [97805508810,97870360724,97889371107]: raise SystemExit('compact failed-job identity drift')
          preserved=row.get('preservedScience') or {}
          if preserved.get('scienceWorkflowGitBlobSha1')!='1d36adb676cae115b141c8c085afb9e22e2142c3' or preserved.get('scienceWorkflowChangedByThisControlFix') is not False:
              raise SystemExit('Recovery v4 science workflow changed during compact-history control fix')
          print('RECOVERY_V4_COMPACT_HISTORY_CONTROL_PASS_NO_AUTH_NO_DISPATCH_NO_SOLVER')
          PY
