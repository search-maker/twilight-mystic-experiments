name: ASIV matched stellar Recovery v4 workflow activation review

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/asiv-matched-stellar-authorization-review-recovery-v4.yml'
      - '.github/workflows/asiv-matched-stellar-science-recovery-v4.yml'
      - '.github/workflows/asiv-matched-stellar-recovery-workflow-activation-review-v4.yml'
      - 'review/asiv-matched-stellar-transport-v1/recovery-v4/**'
      - 'tests/test_asiv_matched_stellar_recovery_v4.py'
      - 'tests/test_asiv_matched_stellar_recovery_workflow_activation_v4.py'

permissions:
  contents: read

jobs:
  review-activation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - name: Verify exact Recovery v4 evidence-handoff workflow control alignment only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test ! -e review/asiv-matched-stellar-transport-v1/authorization-recovery-v4.json
          test "$(git hash-object review/asiv-matched-stellar-transport-v1/recovery-v4/authorization-review-workflow-v4.yml.review)" = d2c82687e558f16a5e23da5f67921e1282952eec
          test "$(git hash-object .github/workflows/asiv-matched-stellar-authorization-review-recovery-v4.yml)" = d2c82687e558f16a5e23da5f67921e1282952eec
          test "$(git hash-object review/asiv-matched-stellar-transport-v1/recovery-v4/science-workflow-v4.yml.review)" = 1d36adb676cae115b141c8c085afb9e22e2142c3
          test "$(git hash-object .github/workflows/asiv-matched-stellar-science-recovery-v4.yml)" = 1d36adb676cae115b141c8c085afb9e22e2142c3
          test "$(git hash-object review/asiv-matched-stellar-transport-v1/recovery-v4/read_only_gh_api_retry_v4.py)" = 7b9a0698135f60c56cb8a212a724079cda054cc3
          test "$(git hash-object review/asiv-matched-stellar-transport-v1/recovery-v4/HISTORICAL_PRE_SOLVER_EVIDENCE.review.json)" = b779f3dc46773fb4819fea6999ddd2fd68904aa1
          test "$(git hash-object review/asiv-matched-stellar-transport-v1/recovery-v4/RECOVERY_CONTROL_CONTRACT.review.json)" = 5351b7000a7fb282520113dfababfa173f2beb00
          test "$(git hash-object review/asiv-matched-stellar-transport-v1/recovery-v4/WORKFLOW_ACTIVATION_CONTRACT.review.json)" = 6679becd5ec3e9294719cf7c00ceb54d14a8155d
          python -m unittest discover -s tests -p 'test_asiv_matched_stellar_recovery_v4.py' -v
          python -m unittest discover -s tests -p 'test_asiv_matched_stellar_recovery_workflow_activation_v4.py' -v
      - name: Prove Recovery v4 activation review has no solver or dispatch authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('review/asiv-matched-stellar-transport-v1/recovery-v4/WORKFLOW_ACTIVATION_CONTRACT.review.json')
          row=json.loads(p.read_text(encoding='utf-8'))
          for key in (
              'scientificExecutionAuthorized','solverExecutionAuthorized','authorizationFileCreated',
              'authorizationBranchCreated','dispatchBranchCreated','workflowDispatchPerformed',
              'resultOpeningAuthorized','productionActivationAuthorized','pandoraHoldoutAccessAllowed',
              'starsvisibilityMutationAuthorized','nativeRebuildAuthorized','retryPermitted',
              'resumePermitted','githubRerunPermitted'):
              if row.get(key) is not False: raise SystemExit(f'Recovery v4 activation authority drift: {key}')
          alignment=row.get('strictGateAlignment') or {}
          if alignment.get('requiredScientificAuthorizationStageId')!='asiv-matched-stellar-transport-v1-execution-authorization': raise SystemExit('strict authorization stage drift')
          if alignment.get('recoveryControlStageId')!='asiv-matched-stellar-transport-recovery-v4-authorization': raise SystemExit('Recovery v4 control stage drift')
          if alignment.get('authorizationReviewMustExecuteStrictGateValidation') is not True: raise SystemExit('strict gate review missing')
          if alignment.get('authorizationReviewMustExecuteBatchGateValidation') is not True: raise SystemExit('batch gate review missing')
          history=row.get('historicalEvidenceAlignment') or {}
          if history.get('liveVerificationMustOccurInAuthorizationReviewBeforeDispatch') is not True: raise SystemExit('historical evidence handoff drift')
          if history.get('sciencePreflightHistoricalActionsApiReadsPermitted') is not False: raise SystemExit('historical API reads reopened in science')
          print('RECOVERY_V4_CONTROL_ALIGNMENT_PASS_NO_AUTH_NO_DISPATCH_NO_SOLVER')
          PY
