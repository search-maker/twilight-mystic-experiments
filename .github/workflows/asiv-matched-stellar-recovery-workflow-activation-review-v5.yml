name: ASIV matched stellar Recovery v5 workflow activation review

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/asiv-matched-stellar-authorization-review-recovery-v5.yml'
      - '.github/workflows/asiv-matched-stellar-science-recovery-v5.yml'
      - '.github/workflows/asiv-matched-stellar-recovery-workflow-activation-review-v5.yml'
      - 'review/asiv-matched-stellar-transport-v1/recovery-v5/WORKFLOW_ACTIVATION_CONTRACT.review.json'
      - 'tests/test_asiv_matched_stellar_recovery_workflow_activation_v5.py'

permissions:
  contents: read

jobs:
  activation-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact activation review head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - name: Verify exact active workflow blobs and frozen help correction
        run: python -m unittest tests.test_asiv_matched_stellar_recovery_workflow_activation_v5 -v
      - name: Prove activation creates no authorization dispatch or solver authority
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test ! -e review/asiv-matched-stellar-transport-v1/authorization-recovery-v5.json
          if git ls-remote --exit-code origin refs/heads/authorization/asiv-matched-stellar-transport-recovery-v5 >/dev/null 2>&1; then
            echo 'Recovery v5 authorization branch must not exist during workflow activation' >&2
            exit 1
          fi
          if git ls-remote --exit-code origin refs/heads/dispatch/asiv-matched-stellar-transport-recovery-v5 >/dev/null 2>&1; then
            echo 'Recovery v5 dispatch branch must not exist during workflow activation' >&2
            exit 1
          fi
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          root=Path('.')
          contract=json.loads((root/'review/asiv-matched-stellar-transport-v1/recovery-v5/WORKFLOW_ACTIVATION_CONTRACT.review.json').read_text())
          def blob(path): return subprocess.check_output(['git','hash-object',str(root/path)],text=True).strip()
          expected={
              '.github/workflows/asiv-matched-stellar-authorization-review-recovery-v5.yml':'1a9a5258f9980467ff1f5504a79ec9d5f78495b9',
              '.github/workflows/asiv-matched-stellar-science-recovery-v5.yml':'d6cced250cc3fdbdb914f3c643e419c6b931c8c6',
          }
          for path,sha in expected.items():
              if blob(path)!=sha: raise SystemExit(f'active Recovery v5 workflow blob drift: {path}')
          if contract.get('authorizationFileCreated') is not False or contract.get('dispatchBranchCreated') is not False or contract.get('scientificExecutionAuthorizedByActivation') is not False or contract.get('solverExecutionPerformedByActivation') is not False:
              raise SystemExit('Recovery v5 activation contract grants forbidden execution authority')
          science=(root/'.github/workflows/asiv-matched-stellar-science-recovery-v5.yml').read_text()
          if "subprocess.run([str(uvspec),'-h'],capture_output=True,check=True)" not in science: raise SystemExit('Recovery v5 documented -h probe missing')
          if "subprocess.run([str(uvspec),'--help']" in science: raise SystemExit('Recovery v5 unsupported --help probe returned')
          if '868aea5af762d968f6f62c4e1472916d25232ed9cab5be112d753b0823d20548' not in science: raise SystemExit('Recovery v5 frozen help hash missing')
          PY
