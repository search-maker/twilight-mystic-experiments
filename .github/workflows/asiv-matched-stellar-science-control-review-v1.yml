name: ASIV matched stellar science control review v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/asiv-matched-stellar-science-control-review-v1.yml'
      - 'review/asiv-matched-stellar-transport-v1/science-control/**'
      - 'tests/test_asiv_matched_stellar_science_control_v1.py'

permissions:
  contents: read

jobs:
  review-only-control-surface:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - name: Run inert science-control tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_asiv_matched_stellar_science_control_v1
      - name: Prove this review cannot authorize, activate or dispatch science
        shell: bash
        run: |
          set -euo pipefail
          test ! -e review/asiv-matched-stellar-transport-v1/authorization.json
          test ! -e .github/workflows/asiv-matched-stellar-authorization-review-v1.yml
          test ! -e .github/workflows/asiv-matched-stellar-science-v1.yml
          ! grep -F 'workflow_dispatch:' .github/workflows/asiv-matched-stellar-science-control-review-v1.yml
          ! grep -E '(^|[[:space:]])uvspec([[:space:]]|$)' .github/workflows/asiv-matched-stellar-science-control-review-v1.yml
          ! grep -F -- '--allow-execution' .github/workflows/asiv-matched-stellar-science-control-review-v1.yml
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('review/asiv-matched-stellar-transport-v1/science-control/SCIENCE_CONTROL_CONTRACT.review.json')
          c=json.loads(p.read_text())
          for key in (
              'scientificExecutionAuthorized','solverExecutionAuthorized','authorizationFileCreated',
              'authorizationCommitCreated','authorizationBranchCreated','dispatchBranchCreated',
              'workflowActivationAuthorized','workflowDispatchAuthorized','resultOpeningAuthorized',
              'productionActivationAuthorized','pandoraHoldoutAccessAllowed','starsvisibilityMutationAuthorized',
              'nativeRebuildAuthorized','retryPermitted','resumePermitted','githubRerunPermitted',
          ):
              assert c[key] is False,key
          assert c['activationRequirements']['activationMustBeSeparateReviewAfterThisContractIsMerged'] is True
          assert c['activationRequirements']['activationMustNotCreateAuthorizationJson'] is True
          assert c['activationRequirements']['activationMustNotDispatchScience'] is True
          print('science-control review remains inert and non-authorizing')
          PY
