name: ASIV matched stellar scientific recovery v5
run-name: ASIV matched stellar recovery v5 ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: asiv-matched-stellar-science-recovery-v5
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      auth_branch: ${{ steps.identity.outputs.auth_branch }}
      auth_parent: ${{ steps.identity.outputs.auth_parent }}
    steps:
      - name: Checkout exact dispatched Recovery v5 authorization head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - name: Verify one-use Recovery v5 dispatch and resolve exact successful authorization review
        id: identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HELPER=review/asiv-matched-stellar-transport-v1/recovery-v4/read_only_gh_api_retry_v4.py
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_RUN_NUMBER" = 1
          test "$GITHUB_REF_NAME" = dispatch/asiv-matched-stellar-transport-recovery-v5
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY' > auth.env
          import json
          p='review/asiv-matched-stellar-transport-v1/authorization-recovery-v5.json'
          a=json.load(open(p))
          print(f'AUTH_BRANCH={a.get("authorizationBranch","")}')
          print(f'DISPATCH_BRANCH={a.get("dispatchBranch","")}')
          print(f'AUTH_PARENT_DOC={a.get("exactAuthorizationParentCommit","")}')
          print(f'EXECUTION_KEY={a.get("executionKey","")}')
          PY
          source auth.env
          test "$AUTH_BRANCH" = authorization/asiv-matched-stellar-transport-recovery-v5
          test "$DISPATCH_BRANCH" = "$GITHUB_REF_NAME"
          test "$EXECUTION_KEY" = asiv-matched-stellar-transport-recovery-v5-one-shot
          mapfile -t PARENTS < <(git cat-file -p HEAD | sed -n 's/^parent //p')
          test "${#PARENTS[@]}" = 1
          AUTH_PARENT="${PARENTS[0]}"
          test "$AUTH_PARENT" = "$AUTH_PARENT_DOC"
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = 1
          test "${CHANGED[0]}" = review/asiv-matched-stellar-transport-v1/authorization-recovery-v5.json
          git fetch origin main "$AUTH_BRANCH" "$GITHUB_REF_NAME"
          test "$(git rev-parse origin/main)" = "$AUTH_PARENT"
          test "$(git rev-parse "origin/$AUTH_BRANCH")" = "$GITHUB_SHA"
          test "$(git rev-parse "origin/$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          export AUTH_BRANCH AUTH_PARENT
          OWNER="${GITHUB_REPOSITORY%%/*}"
          python "$HELPER" --output auth-pr-pages.json -- --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls?state=all&head=${OWNER}:${AUTH_BRANCH}&per_page=100"
          python - <<'PY'
          import json,os
          pages=json.load(open('auth-pr-pages.json')); prs=[p for page in pages for p in page]
          good=[p for p in prs if (p.get('head') or {}).get('ref')==os.environ['AUTH_BRANCH'] and (p.get('head') or {}).get('sha')==os.environ['GITHUB_SHA']]
          if len(good)!=1: raise SystemExit(f'expected exactly one Recovery v5 authorization PR for exact head; got {len(good)}')
          p=good[0]
          if p.get('state')!='open' or p.get('draft') is not True or p.get('merged_at') is not None or (p.get('base') or {}).get('ref')!='main':
              raise SystemExit('Recovery v5 authorization PR must remain Draft/open/unmerged against main')
          open('auth-pr-selected.json','w').write(json.dumps(p,indent=2,sort_keys=True)+'\n')
          PY
          PR_NUMBER="$(python -c 'import json;print(json.load(open("auth-pr-selected.json"))["number"])')"
          python "$HELPER" --output auth-review-run-pages.json -- --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/asiv-matched-stellar-authorization-review-recovery-v5.yml/runs?branch=${AUTH_BRANCH}&event=pull_request&per_page=100"
          python - <<'PY'
          import json,os
          pages=json.load(open('auth-review-run-pages.json')); runs=[r for page in pages for r in page.get('workflow_runs',[])]
          same=[r for r in runs if r.get('head_sha')==os.environ['GITHUB_SHA']]
          good=[r for r in same if int(r.get('run_attempt') or 0)==1 and r.get('status')=='completed' and r.get('conclusion')=='success']
          if len(same)!=1 or len(good)!=1: raise SystemExit(f'Recovery v5 authorization review history invalid: same={len(same)} good={len(good)}')
          open('auth-review-selected.json','w').write(json.dumps(good[0],indent=2,sort_keys=True)+'\n')
          PY
          REVIEW_RID="$(python -c 'import json;print(json.load(open("auth-review-selected.json"))["id"])')"
          echo "auth_branch=$AUTH_BRANCH" >> "$GITHUB_OUTPUT"
          echo "auth_parent=$AUTH_PARENT" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "review_run_id=$REVIEW_RID" >> "$GITHUB_OUTPUT"
      - name: Download exact Recovery v5 authorization-review evidence
        uses: actions/download-artifact@v4
        with:
          name: asiv-matched-stellar-authorization-review-recovery-v5
          path: auth-review-artifact
          repository: ${{ github.repository }}
          run-id: ${{ steps.identity.outputs.review_run_id }}
          github-token: ${{ github.token }}
      - name: Verify Recovery v5 receipt carries exact four-run evidence and help-flag diagnosis
        shell: bash
        env:
          AUTH_PARENT: ${{ steps.identity.outputs.auth_parent }}
          AUTH_BRANCH: ${{ steps.identity.outputs.auth_branch }}
          PR_NUMBER: ${{ steps.identity.outputs.pr_number }}
        run: |
          set -euo pipefail
          export AUTH_PARENT AUTH_BRANCH PR_NUMBER
          test -f auth-review-artifact/authorization-review-recovery-v5.json
          test -f auth-review-artifact/historical-presolver-verification-v5.json
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path('.')
          auth_path=root/'review/asiv-matched-stellar-transport-v1/authorization-recovery-v5.json'
          history_path=root/'review/asiv-matched-stellar-transport-v1/recovery-v5/HISTORICAL_PRE_SOLVER_EVIDENCE.review.json'
          diag_path=root/'review/asiv-matched-stellar-transport-v1/recovery-v5/UVSPEC_HELP_FLAG_DIAGNOSTIC.review.json'
          auth=json.loads(auth_path.read_text(encoding='utf-8'))
          receipt=json.load(open('auth-review-artifact/authorization-review-recovery-v5.json'))
          verification=json.load(open('auth-review-artifact/historical-presolver-verification-v5.json'))
          raw=auth_path.read_bytes(); hraw=history_path.read_bytes(); draw=diag_path.read_bytes()
          def git_blob(raw): return hashlib.sha1(b'blob '+str(len(raw)).encode('ascii')+b'\0'+raw).hexdigest()
          expected={
              'status':'AUTHORIZATION_REVIEW_PASS_NO_DISPATCH',
              'authorizationHeadSha':os.environ['GITHUB_SHA'],
              'authorizationParentSha':os.environ['AUTH_PARENT'],
              'authorizationBranch':os.environ['AUTH_BRANCH'],
              'prNumber':int(os.environ['PR_NUMBER']),
              'authorizationRawSha256':hashlib.sha256(raw).hexdigest(),
              'authorizationGitBlobSha1':git_blob(raw),
              'workflowRunAttempt':1,
              'recoveryVersion':5,
              'priorFailedScienceRunIds':[32848973816,32868735547,32874586374,32879766880],
              'historicalPreSolverEvidenceVerified':True,
              'historicalEvidenceRawSha256':hashlib.sha256(hraw).hexdigest(),
              'historicalEvidenceGitBlobSha1':git_blob(hraw),
              'uvspecHelpFlagDiagnosticVerified':True,
              'uvspecHelpFlagDiagnosticRawSha256':hashlib.sha256(draw).hexdigest(),
              'uvspecHelpFlagDiagnosticGitBlobSha1':git_blob(draw),
              'uvspecRuntimeHelpInvocation':'-h',
              'uvspecFrozenHelpSha256':'868aea5af762d968f6f62c4e1472916d25232ed9cab5be112d753b0823d20548',
              'strictExecutionGateVerified':True,
              'strictBatchGateVerified':True,
              'scientificExecutionPerformed':False,
              'solverExecutionPerformed':False,
              'dispatchPerformed':False,
              'resultOpeningAuthorized':False,
              'pandoraHoldoutOpened':False,
              'productionAuthorized':False,
          }
          for key,value in expected.items():
              if receipt.get(key)!=value: raise SystemExit(f'Recovery v5 authorization receipt mismatch: {key}')
          if verification.get('status')!='FOUR_RUN_HISTORICAL_PRE_SOLVER_EVIDENCE_LIVE_VERIFIED': raise SystemExit('Recovery v5 historical verification status drift')
          if verification.get('runIds')!=[32848973816,32868735547,32874586374,32879766880]: raise SystemExit('Recovery v5 historical verification run-id drift')
          if verification.get('solverExecutionObserved') is not False or verification.get('scientificShardArtifactsObserved') is not False or verification.get('finalValidationArtifactsObserved') is not False: raise SystemExit('Recovery v5 historical pre-solver boundary drift')
          diag=json.loads(diag_path.read_text(encoding='utf-8'))
          if diag.get('status')!='ZERO_SOLVER_DIAGNOSTIC_PASS': raise SystemExit('Recovery v5 diagnostic status drift')
          req=diag.get('requiredCorrection') or {}
          if req.get('newInvocation')!='uvspec -h' or req.get('expectedHelpSha256Remains')!='868aea5af762d968f6f62c4e1472916d25232ed9cab5be112d753b0823d20548': raise SystemExit('Recovery v5 help correction drift')
          def need(key,value):
              if auth.get(key)!=value: raise SystemExit(f'Recovery v5 authorization mismatch: {key}')
          need('stageId','asiv-matched-stellar-transport-v1-execution-authorization')
          need('controlStageId','asiv-matched-stellar-transport-recovery-v5-authorization')
          need('recoveryVersion',5)
          need('exactAuthorizationParentCommit',os.environ['AUTH_PARENT'])
          need('dispatchAuthorized',False)
          need('automaticDispatch',False)
          need('githubRerunPermitted',False)
          need('solverRetryPermitted',False)
          need('solverResumePermitted',False)
          universe=auth.get('caseUniverse') or {}; batch=auth.get('batchBindings') or {}
          if universe.get('validationJohnsonVComparisonsTotal')!=2304 or batch.get('totalCaseCount')!=3468 or batch.get('totalShardCount')!=99 or batch.get('batchManifestCanonicalSha256')!='1756c756e1e865c729a3d93a1084c6081a5eefa6a05f4e874bdaed84e8359663':
              raise SystemExit('Recovery v5 strict case/batch universe drift')
          bindings=auth.get('controlBindings') or {}
          paths={
              'scienceWorkflowActiveGitBlobSha1':'.github/workflows/asiv-matched-stellar-science-recovery-v5.yml',
              'authorizationReviewWorkflowActiveGitBlobSha1':'.github/workflows/asiv-matched-stellar-authorization-review-recovery-v5.yml',
              'historicalPreSolverEvidenceGitBlobSha1':'review/asiv-matched-stellar-transport-v1/recovery-v5/HISTORICAL_PRE_SOLVER_EVIDENCE.review.json',
              'uvspecHelpFlagDiagnosticGitBlobSha1':'review/asiv-matched-stellar-transport-v1/recovery-v5/UVSPEC_HELP_FLAG_DIAGNOSTIC.review.json',
              'recoveryV4FailureEvidenceGitBlobSha1':'review/asiv-matched-stellar-transport-v1/recovery-v5/RUN_32879766880_PRE_SOLVER_FAILURE.review.json',
              'recoveryControlContractGitBlobSha1':'review/asiv-matched-stellar-transport-v1/recovery-v5/RECOVERY_CONTROL_CONTRACT.review.json',
              'batchOrchestrationGitBlobSha1':'review/asiv-matched-stellar-transport-v1/batch_orchestration_review.py',
              'executionTransportGitBlobSha1':'review/asiv-matched-stellar-transport-v1/execution_transport_review.py',
              'validationAssemblerGitBlobSha1':'review/asiv-matched-stellar-transport-v1/assemble_validate_matched_stellar_v1.py',
          }
          for key,path in paths.items():
              if bindings.get(key)!=subprocess.check_output(['git','hash-object',path],text=True).strip(): raise SystemExit(f'Recovery v5 control binding drift: {key}')
          PY
      - name: Build exact frozen 99-shard matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import importlib.util,json
          from pathlib import Path
          p=Path('review/asiv-matched-stellar-transport-v1/batch_orchestration_review.py')
          s=importlib.util.spec_from_file_location('batch',p); m=importlib.util.module_from_spec(s); s.loader.exec_module(m)
          manifest=m.build_batch_manifest()
          if manifest['shardCount']!=99 or manifest['totalCaseCount']!=3468: raise SystemExit('batch manifest drift')
          matrix={'include':[{'shardId':row['shardId']} for row in manifest['shards']]}
          print('matrix='+json.dumps(matrix,separators=(',',':')))
          PY
      - name: Fetch exact official OPAC archive once and verify before any solver job
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p execution-preflight
          curl --fail --location --retry 3 --retry-all-errors \
            'https://www.libradtran.org/lib/exe/fetch.php?media=download%3Aoptprop_v2.1.tar.gz' \
            --output execution-preflight/optprop_v2.1.tar.gz
          test "$(stat -c %s execution-preflight/optprop_v2.1.tar.gz)" = 743391266
          printf '%s  %s\n' '11daa1f1f4be0fd4ddf7e881ec2005498049674a1540d37b4b1e8f5e16052c7e' execution-preflight/optprop_v2.1.tar.gz | sha256sum -c -
          cp review/asiv-matched-stellar-transport-v1/authorization-recovery-v5.json execution-preflight/authorization.json
          cp auth-review-artifact/authorization-review-recovery-v5.json execution-preflight/authorization-review.json
          cp auth-review-artifact/historical-presolver-verification-v5.json execution-preflight/historical-presolver-verification-v5.json
          cp review/asiv-matched-stellar-transport-v1/recovery-v5/HISTORICAL_PRE_SOLVER_EVIDENCE.review.json execution-preflight/historical-presolver-evidence-v5.json
          cp review/asiv-matched-stellar-transport-v1/recovery-v5/UVSPEC_HELP_FLAG_DIAGNOSTIC.review.json execution-preflight/uvspec-help-flag-diagnostic-v5.json
      - name: Publish same-run verified Recovery v5 preflight inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: asiv-matched-stellar-preflight-recovery-v5
          path: execution-preflight/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  shards:
    needs: preflight
    strategy:
      fail-fast: true
      max-parallel: 8
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download exact same-run Recovery v5 preflight artifact
        uses: actions/download-artifact@v4
        with:
          name: asiv-matched-stellar-preflight-recovery-v5
          path: preflight
      - name: Verify downloaded Recovery v5 preflight boundary before runtime setup
        shell: bash
        run: |
          set -euo pipefail
          test -f preflight/authorization.json
          test -f preflight/authorization-review.json
          test -f preflight/historical-presolver-verification-v5.json
          test -f preflight/historical-presolver-evidence-v5.json
          test -f preflight/uvspec-help-flag-diagnostic-v5.json
          test -f preflight/optprop_v2.1.tar.gz
          test "$(stat -c %s preflight/optprop_v2.1.tar.gz)" = 743391266
          printf '%s  %s\n' '11daa1f1f4be0fd4ddf7e881ec2005498049674a1540d37b4b1e8f5e16052c7e' preflight/optprop_v2.1.tar.gz | sha256sum -c -
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          receipt=json.load(open('preflight/authorization-review.json'))
          verification=json.load(open('preflight/historical-presolver-verification-v5.json'))
          hraw=Path('preflight/historical-presolver-evidence-v5.json').read_bytes()
          diag=json.load(open('preflight/uvspec-help-flag-diagnostic-v5.json'))
          if receipt.get('historicalPreSolverEvidenceVerified') is not True: raise SystemExit('historical evidence handoff missing')
          if receipt.get('historicalEvidenceRawSha256')!=hashlib.sha256(hraw).hexdigest(): raise SystemExit('historical evidence handoff sha drift')
          if receipt.get('uvspecHelpFlagDiagnosticVerified') is not True or receipt.get('uvspecRuntimeHelpInvocation')!='-h': raise SystemExit('help-flag correction handoff missing')
          if verification.get('status')!='FOUR_RUN_HISTORICAL_PRE_SOLVER_EVIDENCE_LIVE_VERIFIED': raise SystemExit('historical verification handoff status drift')
          if (diag.get('requiredCorrection') or {}).get('newInvocation')!='uvspec -h': raise SystemExit('help-flag diagnostic drift')
          PY
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: matched-stellar-v1
          create-args: -c conda-forge python=3.12.4 rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true
      - name: Reconstruct exact OPAC overlay and verify runtime identity
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          PYTHONPATH=experiments/aerosol-full-phase-function-sensitivity-v1/execution-candidate python - <<'PY'
          import json,os
          from pathlib import Path
          from runtime_overlay import stage_frozen_overlay
          base=Path(os.environ['CONDA_PREFIX'])/'share/libRadtran/data'
          report=stage_frozen_overlay(base,Path('preflight/optprop_v2.1.tar.gz'),Path('libradtran-overlay'))
          if report.get('augmentedDataTreeSha256')!='5d8bbf8e6b91ec3d405dee36f21a94afbb6e5ec6cd67da2dd5dd541738199d80': raise SystemExit('OPAC overlay drift')
          Path('overlay-report.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          PY
          python - <<'PY'
          import hashlib,importlib.util,json,shutil,subprocess
          from pathlib import Path
          payload=json.loads(subprocess.check_output(['micromamba','list','--json'],text=True))
          parser_path=Path('review/asiv-matched-stellar-transport-v1/recovery-v2/micromamba_list_parser_v2.py')
          pspec=importlib.util.spec_from_file_location('matched_stellar_mm_parser_v2',parser_path)
          pm=importlib.util.module_from_spec(pspec); pspec.loader.exec_module(pm)
          r=pm.extract_unique_package_record(payload,'rubin-libradtran')
          observed=pm.exact_package_spec(r)
          uvspec=Path(shutil.which('uvspec') or '')
          if not uvspec.is_file(): raise SystemExit('uvspec missing')
          help_run=subprocess.run([str(uvspec),'-h'],capture_output=True,check=True)
          help_sha=hashlib.sha256(help_run.stdout+help_run.stderr).hexdigest()
          if help_sha!='868aea5af762d968f6f62c4e1472916d25232ed9cab5be112d753b0823d20548': raise SystemExit(f'uvspec -h SHA-256 drift: {help_sha}')
          path=Path('review/asiv-matched-stellar-transport-v1/execution_transport_review.py')
          spec=importlib.util.spec_from_file_location('transport',path); m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          report=m.build_runtime_report(
              uvspec=uvspec,
              augmented_data_dir=Path('libradtran-overlay/data'),
              atmosphere_file=Path('libradtran-overlay/data/atmmod/afglus.dat'),
              observed_package_spec=observed,
              observed_uvspec_help_sha256=help_sha,
          )
          report['runtimeHelpInvocation']='-h'
          Path('matched-runtime-report.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          PY
      - name: Execute exactly one frozen shard with no retry or resume
        shell: micromamba-shell {0}
        env:
          SHARD_ID: ${{ matrix.shardId }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util,json,os,shutil
          from pathlib import Path
          p=Path('review/asiv-matched-stellar-transport-v1/batch_orchestration_review.py')
          s=importlib.util.spec_from_file_location('batch',p); m=importlib.util.module_from_spec(s); s.loader.exec_module(m)
          auth=json.load(open('preflight/authorization.json'))
          runtime=json.load(open('matched-runtime-report.json'))
          if runtime.get('runtimeHelpInvocation')!='-h': raise SystemExit('Recovery v5 runtime help invocation evidence missing')
          out=Path('shard-output')
          m.execute_shard_strict(
              shard_id=os.environ['SHARD_ID'], authorization=auth, runtime_report=runtime,
              output_root=out, allow_execution=True,
          )
          shutil.copy2('matched-runtime-report.json',out/'runtime-report.json')
          shutil.copy2('overlay-report.json',out/'overlay-report.json')
          PY
      - name: Persist complete shard evidence only after full shard success
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: asiv-matched-stellar-shard-recovery-v5-${{ matrix.shardId }}
          path: shard-output/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  aggregate:
    if: ${{ always() && needs.preflight.result == 'success' && needs.shards.result == 'success' }}
    needs: [preflight, shards]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - name: Download all same-run Recovery v5 shard artifacts without per-artifact API calls
        uses: actions/download-artifact@v4
        with:
          pattern: asiv-matched-stellar-shard-recovery-v5-*
          path: shard-artifacts
          merge-multiple: false
      - name: Verify exact local 99-shard Recovery v5 artifact universe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('shard-artifacts')
          rows=sorted([p for p in root.iterdir() if p.is_dir() and p.name.startswith('asiv-matched-stellar-shard-recovery-v5-')]) if root.is_dir() else []
          names=[p.name for p in rows]
          if len(rows)!=99 or len(set(names))!=99: raise SystemExit(f'exactly 99 unique complete Recovery v5 shard artifact directories required; got {len(rows)}')
          Path('shard-artifacts-local.json').write_text(json.dumps({'artifactDirectories':names},indent=2,sort_keys=True)+'\n')
          PY
      - name: Validate only the complete exact 3468-case universe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util,json
          from pathlib import Path
          p=Path('review/asiv-matched-stellar-transport-v1/batch_orchestration_review.py')
          s=importlib.util.spec_from_file_location('batch',p); m=importlib.util.module_from_spec(s); s.loader.exec_module(m)
          roots=sorted([x for x in Path('shard-artifacts').iterdir() if x.is_dir() and x.name.startswith('asiv-matched-stellar-shard-recovery-v5-')])
          if len(roots)!=99: raise SystemExit('Recovery v5 complete shard universe missing before validation')
          result=m.validate_complete_universe(
              shard_roots=roots,
              sed_bundle_path=Path('review/asiv-matched-stellar-transport-v1/frozen-assets/pickles-sed-1nm.json'),
              johnson_v_path=Path('review/asiv-matched-stellar-transport-v1/frozen-assets/johnson-v-1nm.json'),
          )
          result['workflowRunId']=int('${{ github.run_id }}')
          result['workflowRunAttempt']=int('${{ github.run_attempt }}')
