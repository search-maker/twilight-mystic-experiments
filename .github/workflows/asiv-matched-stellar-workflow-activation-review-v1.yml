name: ASIV matched stellar workflow activation review v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/asiv-matched-stellar-authorization-review-v1.yml'
      - '.github/workflows/asiv-matched-stellar-science-v1.yml'
      - '.github/workflows/asiv-matched-stellar-workflow-activation-review-v1.yml'
      - 'review/asiv-matched-stellar-transport-v1/science-control/WORKFLOW_ACTIVATION_CONTRACT.review.json'
      - 'tests/test_asiv_matched_stellar_workflow_activation_v1.py'

permissions:
  contents: read

jobs:
  exact-byte-activation-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - name: Run exact-byte workflow activation tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_asiv_matched_stellar_workflow_activation_v1
      - name: Prove exact activation boundary
        shell: bash
        run: |
          set -euo pipefail
          test ! -e review/asiv-matched-stellar-transport-v1/authorization.json
          test "$(git hash-object review/asiv-matched-stellar-transport-v1/science-control/authorization-review-workflow.yml.review)" = 6ed68a90f2614dd762b5484e740a146e2cb636cc
          test "$(git hash-object .github/workflows/asiv-matched-stellar-authorization-review-v1.yml)" = 6ed68a90f2614dd762b5484e740a146e2cb636cc
          test "$(git hash-object review/asiv-matched-stellar-transport-v1/science-control/science-workflow.yml.review)" = 396bb79f0f00b36888f809f7f3bff40d62646632
          test "$(git hash-object .github/workflows/asiv-matched-stellar-science-v1.yml)" = 396bb79f0f00b36888f809f7f3bff40d62646632
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('review/asiv-matched-stellar-transport-v1/science-control/WORKFLOW_ACTIVATION_CONTRACT.review.json')
          c=json.loads(p.read_text(encoding='utf-8'))
          for key in (
              'scientificExecutionAuthorized','solverExecutionAuthorized','authorizationFileCreated',
              'authorizationBranchCreated','dispatchBranchCreated','workflowDispatchPerformed',
              'resultOpeningAuthorized','productionActivationAuthorized','pandoraHoldoutAccessAllowed',
              'starsvisibilityMutationAuthorized','nativeRebuildAuthorized','retryPermitted',
              'resumePermitted','githubRerunPermitted',
          ):
              assert c[key] is False,key
          b=c['activationBoundary']
          assert b['authorizationMayNotBeCreatedByThisReview'] is True
          assert b['scienceMayNotBeDispatchedByThisReview'] is True
          assert b['activeScienceWorkflowAloneIsInsufficientForExecution'] is True
          print('exact workflow activation boundary preserved')
          PY
