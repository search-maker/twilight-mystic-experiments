name: ASIV v1 dispatch publisher
run-name: ASIV v1 dispatch publisher ${{ github.ref_name }}

on:
  push:
    branches:
      - "status/asiv-v1-dispatch-publisher-ordinal-*"
    paths:
      - .github/dispatch-requests/asiv-v1.json

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: asiv-v1-dispatch-publisher-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact request ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"

      - name: Bind request authorization review and parent preauthorization
        id: identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$GITHUB_REF_NAME" =~ ^status/asiv-v1-dispatch-publisher-ordinal-([1-9][0-9]*)$ ]]
          BRANCH_ORDINAL="${BASH_REMATCH[1]}"
          mapfile -t REQUEST_PARENTS < <(git cat-file -p "$GITHUB_SHA" | sed -n 's/^parent //p')
          test "${#REQUEST_PARENTS[@]}" = 1
          REQUEST_PARENT="${REQUEST_PARENTS[0]}"
          mapfile -t REQUEST_CHANGED < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")
          test "${#REQUEST_CHANGED[@]}" = 1
          test "${REQUEST_CHANGED[0]}" = .github/dispatch-requests/asiv-v1.json
          python - <<'PY' > request.env
          import json
          r=json.load(open('.github/dispatch-requests/asiv-v1.json'))
          if r.get('schemaVersion')!=1 or r.get('stageId')!='aerosol-scenario-interpolation-validation-v1-dispatch-request' or r.get('status')!='REQUEST_ACTUAL_GIT_PUSH_AND_WORKFLOW_DISPATCH': raise SystemExit('request identity drift')
          n=r.get('scientificOrdinal'); h=r.get('authorizationHead'); p=r.get('authorizationParent'); pr=r.get('authorizationPr')
          if not isinstance(n,int) or n<=0 or not isinstance(h,str) or len(h)!=40 or not isinstance(p,str) or len(p)!=40 or not isinstance(pr,int) or pr<=0: raise SystemExit('request fields invalid')
          print(f'ORDINAL={n}'); print(f'AUTH_HEAD={h}'); print(f'AUTH_PARENT_REQUEST={p}'); print(f'PR_REQUEST={pr}')
          PY
          source request.env
          test "$ORDINAL" = "$BRANCH_ORDINAL"
          AUTH_BRANCH="authorization/aerosol-scenario-interpolation-validation-v1-ordinal-$ORDINAL"
          DISPATCH_BRANCH="dispatch/aerosol-scenario-interpolation-validation-v1-ordinal-$ORDINAL"
          git fetch origin main "$AUTH_BRANCH"
          LIVE_MAIN="$(git rev-parse origin/main)"
          test "$REQUEST_PARENT" = "$LIVE_MAIN"
          test "$AUTH_PARENT_REQUEST" = "$LIVE_MAIN"
          AUTH_REMOTE="$(git rev-parse "origin/$AUTH_BRANCH")"
          test "$AUTH_REMOTE" = "$AUTH_HEAD"
          mapfile -t AUTH_PARENTS < <(git cat-file -p "$AUTH_HEAD" | sed -n 's/^parent //p')
          test "${#AUTH_PARENTS[@]}" = 1
          AUTH_PARENT="${AUTH_PARENTS[0]}"
          test "$AUTH_PARENT" = "$LIVE_MAIN"
          mapfile -t AUTH_CHANGED < <(git diff-tree --no-commit-id --name-only -r "$AUTH_HEAD")
          test "${#AUTH_CHANGED[@]}" = 1
          test "${AUTH_CHANGED[0]}" = experiments/aerosol-scenario-interpolation-validation-v1/authorization.json
          export ORDINAL AUTH_HEAD AUTH_PARENT AUTH_BRANCH DISPATCH_BRANCH
          OWNER="${GITHUB_REPOSITORY%%/*}"
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls?state=all&head=${OWNER}:${AUTH_BRANCH}&per_page=100" > auth-pr-pages.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          pages=json.load(open('auth-pr-pages.json')); prs=[p for page in pages for p in page]
          good=[p for p in prs if (p.get('head') or {}).get('ref')==os.environ['AUTH_BRANCH'] and (p.get('head') or {}).get('sha')==os.environ['AUTH_HEAD']]
          if len(good)!=1: raise SystemExit(f'expected one authorization PR, got {len(good)}')
          p=good[0]
          if p.get('state')!='open' or p.get('draft') is not True or p.get('merged_at') is not None or (p.get('base') or {}).get('ref')!='main': raise SystemExit('authorization PR must remain Draft/open/unmerged')
          Path('auth-pr-selected.json').write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          PY
          PR_NUMBER="$(python -c 'import json;print(json.load(open("auth-pr-selected.json"))["number"])')"
          test "$PR_NUMBER" = "$PR_REQUEST"
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/asiv-v1-authorization-review.yml/runs?branch=${AUTH_BRANCH}&event=pull_request&per_page=100" > auth-review-run-pages.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          pages=json.load(open('auth-review-run-pages.json')); runs=[r for page in pages for r in page.get('workflow_runs',[])]
          same=[r for r in runs if r.get('head_sha')==os.environ['AUTH_HEAD']]
          good=[r for r in same if int(r.get('run_attempt') or 0)==1 and r.get('status')=='completed' and r.get('conclusion')=='success']
          if len(same)!=1 or len(good)!=1: raise SystemExit(f'exactly one successful attempt-1 authorization review required: same={len(same)} good={len(good)}')
          Path('auth-review-selected.json').write_text(json.dumps(good[0],indent=2,sort_keys=True)+'\n')
          PY
          REVIEW_RUN_ID="$(python -c 'import json;print(json.load(open("auth-review-selected.json"))["id"])')"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${REVIEW_RUN_ID}/artifacts?per_page=100" > auth-review-artifacts.json
          REVIEW_AID="$(python - <<'PY'
          import json,os
          rows=json.load(open('auth-review-artifacts.json')).get('artifacts',[]); expected=f'asiv-v1-authorization-review-ordinal-{os.environ["ORDINAL"]}'
          good=[a for a in rows if a.get('name')==expected and not a.get('expired',False)]
          if len(good)!=1: raise SystemExit('authorization-review artifact missing/drifted')
          print(good[0]['id'])
          PY
          )"
          mkdir auth-review-artifact
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${REVIEW_AID}/zip" > auth-review.zip
          unzip -q auth-review.zip -d auth-review-artifact
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/asiv-v1-preauthorization-audit.yml/runs?branch=main&event=push&per_page=100" > preauth-run-pages.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          pages=json.load(open('preauth-run-pages.json')); runs=[r for page in pages for r in page.get('workflow_runs',[])]
          same=[r for r in runs if r.get('head_sha')==os.environ['AUTH_PARENT']]
          good=[r for r in same if int(r.get('run_attempt') or 0)==1 and r.get('status')=='completed' and r.get('conclusion')=='success']
          if len(same)!=1 or len(good)!=1: raise SystemExit(f'exact parent preauthorization history invalid: same={len(same)} good={len(good)}')
          Path('preauth-selected.json').write_text(json.dumps(good[0],indent=2,sort_keys=True)+'\n')
          PY
          PRE_RID="$(python -c 'import json;print(json.load(open("preauth-selected.json"))["id"])')"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PRE_RID}/artifacts?per_page=100" > preauth-artifacts.json
          PRE_AID="$(python - <<'PY'
          import json
          rows=json.load(open('preauth-artifacts.json')).get('artifacts',[]); good=[a for a in rows if a.get('name')=='asiv-v1-preauthorization-proof' and not a.get('expired',False)]
          if len(good)!=1: raise SystemExit('preauthorization artifact missing/drifted')
          print(good[0]['id'])
          PY
          )"
          mkdir preauth-artifact
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${PRE_AID}/zip" > preauth.zip
          unzip -q preauth.zip -d preauth-artifact
          git checkout --detach "$AUTH_HEAD"
          git ls-files -z > tracked-files.nul
          mkdir -p publisher-evidence
          echo "ordinal=$ORDINAL" >> "$GITHUB_OUTPUT"; echo "auth_head=$AUTH_HEAD" >> "$GITHUB_OUTPUT"; echo "auth_parent=$AUTH_PARENT" >> "$GITHUB_OUTPUT"; echo "auth_branch=$AUTH_BRANCH" >> "$GITHUB_OUTPUT"; echo "dispatch_branch=$DISPATCH_BRANCH" >> "$GITHUB_OUTPUT"; echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Fresh pre-dispatch seed and geometry audits on authorization head
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python experiments/aerosol-scenario-interpolation-validation-v1/tracked_tree_seed_scan.py --repo-root . --file-list tracked-files.nul --candidate-seed-ledger experiments/aerosol-scenario-interpolation-validation-v1/candidate-seed-ledger.v1.json --allow-self-ledger-json experiments/aerosol-scenario-interpolation-validation-v1/seed-self-ledger-policy.v1.json --output publisher-evidence/tracked-seed-scan.json
          python experiments/aerosol-scenario-interpolation-validation-v1/repository_global_seed_scan.py --repository "$GITHUB_REPOSITORY" --issue-number 60 --candidate-seed-ledger experiments/aerosol-scenario-interpolation-validation-v1/candidate-seed-ledger.v1.json --current-run-id "$GITHUB_RUN_ID" --audit-mode authorization-recheck --expected-branch-name "${{ steps.identity.outputs.auth_branch }}" --expected-repo-head "${{ steps.identity.outputs.auth_head }}" --output publisher-evidence/repository-global-seed-scan.json
          python experiments/aerosol-scenario-interpolation-validation-v1/geometry_collision_audit.py --repo-root . --file-list tracked-files.nul --repository "$GITHUB_REPOSITORY" --current-run-id "$GITHUB_RUN_ID" --expected-branch-name "${{ steps.identity.outputs.auth_branch }}" --expected-repo-head "${{ steps.identity.outputs.auth_head }}" --output publisher-evidence/geometry-collision-audit.json
          python experiments/aerosol-scenario-interpolation-validation-v1/build_freshness_proof.py --stage-dir experiments/aerosol-scenario-interpolation-validation-v1 --tracked-tree-report publisher-evidence/tracked-seed-scan.json --repository-global-report publisher-evidence/repository-global-seed-scan.json --geometry-report publisher-evidence/geometry-collision-audit.json --expected-main-head "${{ steps.identity.outputs.auth_head }}" --output publisher-evidence/live-freshness-proof.json

      - name: Prove dispatch eligible before creating ref
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ORDINAL: ${{ steps.identity.outputs.ordinal }}
          AUTH_HEAD: ${{ steps.identity.outputs.auth_head }}
          AUTH_PARENT: ${{ steps.identity.outputs.auth_parent }}
          PR_NUMBER: ${{ steps.identity.outputs.pr_number }}
        run: |
          set -euo pipefail
          PYTHONPATH=experiments/aerosol-scenario-interpolation-validation-v1/execution-candidate python - <<'PY'
          import json,os
          from pathlib import Path
          import control_surface,dispatch_guard
          root=Path('.'); stage=root/'experiments/aerosol-scenario-interpolation-validation-v1'
          auth=json.load(open(stage/'authorization.json')); parent_proof=json.load(open('preauth-artifact/freshness-proof.json')); live_proof=json.load(open('publisher-evidence/live-freshness-proof.json'))
          pr=json.load(open('auth-pr-selected.json')); rr=json.load(open('auth-review-selected.json')); review=json.load(open(next(Path('auth-review-artifact').rglob('authorization-review.json'))))
          payload=control_surface.collect(os.environ['GITHUB_REPOSITORY'],os.environ['GITHUB_TOKEN'])
          surface=control_surface.build_dispatch_surface(payload,int(os.environ['ORDINAL']),os.environ['AUTH_HEAD'],os.environ['AUTH_PARENT'],current_pr=int(os.environ['PR_NUMBER']),current_run_id=int(os.environ['GITHUB_RUN_ID']),candidate_seed_authorization_recheck_passed=True,candidate_geometry_authorization_recheck_passed=True,post_dispatch=False)
          ctx={'liveMain':os.environ['AUTH_PARENT'],'authorizationHead':os.environ['AUTH_HEAD'],'authorizationParent':os.environ['AUTH_PARENT'],'pr':{'number':pr['number'],'state':pr['state'],'draft':pr['draft'],'merged':pr.get('merged_at') is not None,'headBranch':pr['head']['ref'],'headSha':pr['head']['sha']},'authorizationReview':{'status':review['status'],'headSha':review['headSha'],'parentSha':review['parentSha'],'prNumber':review['prNumber'],'runAttempt':rr['run_attempt'],'conclusion':rr['conclusion'],'scientificRuntimeSetupPerformed':False,'scientificExecutionPerformed':False,'solverExecutionPerformed':False},'liveFreshnessProof':live_proof,'freshness':surface,'issue60AuthorizationMarkers':surface.get('matchingAuthorizationMarkerBodies',[]),'issue60ConsumedMarkers':surface.get('currentConsumedMarkerBodies',[])}
          out=dispatch_guard.evaluate(root,auth,parent_proof,ctx,post_dispatch=False)
          Path('publisher-evidence/dispatch-pre.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n'); Path('publisher-evidence/freshness-pre.json').write_text(json.dumps(surface,indent=2,sort_keys=True)+'\n')
          PY

      - name: Actual git push consumes dispatch identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AUTH_HEAD: ${{ steps.identity.outputs.auth_head }}
          AUTH_PARENT: ${{ steps.identity.outputs.auth_parent }}
          DISPATCH_BRANCH: ${{ steps.identity.outputs.dispatch_branch }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$AUTH_PARENT"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "$AUTH_HEAD:refs/heads/$DISPATCH_BRANCH" > publisher-evidence/git-push.stdout 2> publisher-evidence/git-push.stderr
          git ls-remote --exit-code --heads origin "$DISPATCH_BRANCH" > publisher-evidence/dispatch-ls-remote.txt
          grep -q "^${AUTH_HEAD}[[:space:]]" publisher-evidence/dispatch-ls-remote.txt

      - name: Mark consumed exactly once and prove post-dispatch state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          ORDINAL: ${{ steps.identity.outputs.ordinal }}
          AUTH_HEAD: ${{ steps.identity.outputs.auth_head }}
          AUTH_PARENT: ${{ steps.identity.outputs.auth_parent }}
          PR_NUMBER: ${{ steps.identity.outputs.pr_number }}
        run: |
          set -euo pipefail
          MARKER="ORDINAL${ORDINAL}_ASIV_V1_DISPATCH_CONSUMED"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/60/comments" -f body="$MARKER" > publisher-evidence/consumed-comment.json
          PYTHONPATH=experiments/aerosol-scenario-interpolation-validation-v1/execution-candidate python - <<'PY'
          import json,os
          from pathlib import Path
          import control_surface,dispatch_guard
          root=Path('.'); stage=root/'experiments/aerosol-scenario-interpolation-validation-v1'
          auth=json.load(open(stage/'authorization.json')); parent_proof=json.load(open('preauth-artifact/freshness-proof.json')); live_proof=json.load(open('publisher-evidence/live-freshness-proof.json'))
          pr=json.load(open('auth-pr-selected.json')); rr=json.load(open('auth-review-selected.json')); review=json.load(open(next(Path('auth-review-artifact').rglob('authorization-review.json'))))
          payload=control_surface.collect(os.environ['GITHUB_REPOSITORY'],os.environ['GITHUB_TOKEN'])
          surface=control_surface.build_dispatch_surface(payload,int(os.environ['ORDINAL']),os.environ['AUTH_HEAD'],os.environ['AUTH_PARENT'],current_pr=int(os.environ['PR_NUMBER']),current_run_id=int(os.environ['GITHUB_RUN_ID']),candidate_seed_authorization_recheck_passed=True,candidate_geometry_authorization_recheck_passed=True,post_dispatch=True)
          ctx={'liveMain':os.environ['AUTH_PARENT'],'authorizationHead':os.environ['AUTH_HEAD'],'authorizationParent':os.environ['AUTH_PARENT'],'dispatchBranchHeadSha':os.environ['AUTH_HEAD'],'pr':{'number':pr['number'],'state':pr['state'],'draft':pr['draft'],'merged':pr.get('merged_at') is not None,'headBranch':pr['head']['ref'],'headSha':pr['head']['sha']},'authorizationReview':{'status':review['status'],'headSha':review['headSha'],'parentSha':review['parentSha'],'prNumber':review['prNumber'],'runAttempt':rr['run_attempt'],'conclusion':rr['conclusion'],'scientificRuntimeSetupPerformed':False,'scientificExecutionPerformed':False,'solverExecutionPerformed':False},'liveFreshnessProof':live_proof,'freshness':surface,'issue60AuthorizationMarkers':surface.get('matchingAuthorizationMarkerBodies',[]),'issue60ConsumedMarkers':surface.get('currentConsumedMarkerBodies',[])}
          out=dispatch_guard.evaluate(root,auth,parent_proof,ctx,post_dispatch=True)
          publisher={'schemaVersion':1,'stageId':'aerosol-scenario-interpolation-validation-v1-dispatch-publisher','status':'DISPATCH_PUBLISHED_ZERO_RUNTIME','scientificOrdinal':int(os.environ['ORDINAL']),'authorizationHead':os.environ['AUTH_HEAD'],'authorizationParent':os.environ['AUTH_PARENT'],'authorizationPr':int(os.environ['PR_NUMBER']),'dispatchBranchHeadSha':os.environ['AUTH_HEAD'],'dispatchGuardStatus':out['status'],'scientificRuntimeSetupPerformed':False,'scientificExecutionPerformed':False,'solverExecutionPerformed':False,'githubRerun':False,'retryPerformed':False,'resumePerformed':False}
          Path('publisher-evidence/freshness-post.json').write_text(json.dumps(surface,indent=2,sort_keys=True)+'\n'); Path('publisher-evidence/dispatch-post.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n'); Path('publisher-evidence/dispatch-publisher.json').write_text(json.dumps(publisher,indent=2,sort_keys=True)+'\n')
          PY

      - name: Persist immutable zero-runtime publisher evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: asiv-v1-dispatch-publisher-ordinal-${{ steps.identity.outputs.ordinal }}
          path: publisher-evidence/
          if-no-files-found: error
          compression-level: 0

      - name: Dispatch exact attempt-1 ASIV science workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_BRANCH: ${{ steps.identity.outputs.dispatch_branch }}
        run: |
          set -euo pipefail
          gh workflow run asiv-v1-execution.yml --ref "$DISPATCH_BRANCH"
