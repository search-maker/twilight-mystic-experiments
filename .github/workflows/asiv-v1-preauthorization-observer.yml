name: ASIV v1 preauthorization observer

on:
  pull_request:
    paths:
      - .github/workflows/asiv-v1-preauthorization-observer.yml

permissions:
  contents: read
  actions: read

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read exact ASIV preauthorization run metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_HEAD: 0e3e190b9914eee1cfe338657646256b2de2221c
        shell: python
        run: |
          import json, os, urllib.request
          from pathlib import Path

          repo=os.environ['REPOSITORY']; token=os.environ['GITHUB_TOKEN']; head=os.environ['TARGET_HEAD']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=90) as r: return json.load(r)
          rows=[]
          page=1
          while True:
              data=get(f'https://api.github.com/repos/{repo}/actions/runs?per_page=100&page={page}')
              batch=data.get('workflow_runs',[]); rows.extend(batch)
              if len(batch)<100: break
              page+=1
          matches=[r for r in rows if r.get('head_sha')==head and r.get('event')=='push' and r.get('name')=='ASIV v1 fresh preauthorization audit']
          out={'schemaVersion':1,'targetHead':head,'matchingRunCount':len(matches),'runs':[]}
          for r in matches:
              rid=int(r['id']); jobs=get(f'https://api.github.com/repos/{repo}/actions/runs/{rid}/jobs?per_page=100').get('jobs',[])
              out['runs'].append({'id':rid,'runAttempt':r.get('run_attempt'),'status':r.get('status'),'conclusion':r.get('conclusion'),'createdAt':r.get('created_at'),'updatedAt':r.get('updated_at'),'headBranch':r.get('head_branch'),'htmlUrl':r.get('html_url'),'jobs':[{'id':j.get('id'),'name':j.get('name'),'status':j.get('status'),'conclusion':j.get('conclusion'),'steps':[{'name':s.get('name'),'status':s.get('status'),'conclusion':s.get('conclusion'),'number':s.get('number')} for s in j.get('steps',[])]} for j in jobs]})
          out['status']='MATCH_FOUND' if matches else 'NO_MATCHING_RUN'
          Path('observer-summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
      - name: Upload observer summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: asiv-v1-preauthorization-observer
          path: observer-summary.json
          if-no-files-found: error
          compression-level: 0
