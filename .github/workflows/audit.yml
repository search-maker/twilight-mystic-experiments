name: Corrected spectral convergence artifact audit

on:
  workflow_run:
    workflows: ["Corrected spectral convergence execution"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  audit-exact-first-attempt:
    if: >-
      github.event.workflow_run.head_branch == 'authorization/corrected-spectral-convergence-v1'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
      TARGET_RUN_ID: ${{ github.event.workflow_run.id }}
      TARGET_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      TARGET_ARTIFACT: corrected-spectral-convergence-run
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - name: Download exact artifact ZIP and freeze API metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import urllib.error
          import urllib.request

          api = "https://api.github.com"
          repo = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          run_id = int(os.environ["TARGET_RUN_ID"])
          head_sha = os.environ["TARGET_HEAD_SHA"]
          artifact_name = os.environ["TARGET_ARTIFACT"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "corrected-convergence-artifact-audit",
          }

          def get_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          run = get_json(f"{api}/repos/{repo}/actions/runs/{run_id}")
          if run.get("head_sha") != head_sha or run.get("status") != "completed" or run.get("run_attempt") != 1:
              raise SystemExit("exact run identity mismatch")
          artifacts = get_json(f"{api}/repos/{repo}/actions/runs/{run_id}/artifacts").get("artifacts", [])
          matches = [item for item in artifacts if item.get("name") == artifact_name and not item.get("expired")]
          if len(matches) != 1:
              raise SystemExit(f"expected one exact unexpired artifact, found {len(matches)}")
          artifact = matches[0]
          if not artifact.get("digest"):
              raise SystemExit("artifact digest missing")

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, response_headers, newurl):
                  return None

          request = urllib.request.Request(f"{api}/repos/{repo}/actions/artifacts/{artifact['id']}/zip", headers=headers)
          opener = urllib.request.build_opener(NoRedirect)
          try:
              opener.open(request, timeout=30)
              raise SystemExit("artifact endpoint did not redirect")
          except urllib.error.HTTPError as exc:
              if exc.code not in (301, 302, 303, 307, 308):
                  raise
              signed_url = exc.headers.get("Location")
              if not signed_url:
                  raise SystemExit("artifact redirect omitted signed location")
          with urllib.request.urlopen(urllib.request.Request(signed_url, headers={"User-Agent": "corrected-convergence-artifact-audit"}), timeout=120) as response:
              Path("exact-artifact.zip").write_bytes(response.read())

          metadata = {
              "run": {
                  "id": run.get("id"),
                  "run_number": run.get("run_number"),
                  "run_attempt": run.get("run_attempt"),
                  "event": run.get("event"),
                  "head_branch": run.get("head_branch"),
                  "head_sha": run.get("head_sha"),
                  "status": run.get("status"),
                  "conclusion": run.get("conclusion"),
                  "created_at": run.get("created_at"),
                  "updated_at": run.get("updated_at"),
                  "html_url": run.get("html_url"),
              },
              "artifact": {
                  "id": artifact.get("id"),
                  "name": artifact.get("name"),
                  "size_in_bytes": artifact.get("size_in_bytes"),
                  "digest": artifact.get("digest"),
                  "expired": artifact.get("expired"),
              },
              "boundary": "read-only lookup and download; no dispatch, rerun, resume, or mutation",
          }
          Path("exact-artifact-metadata.json").write_text(json.dumps(metadata, indent=2, sort_keys=True) + "\n")
          PY
      - name: Independently recompute or verify structural classification
        run: >-
          python experiment/audit.py
          --zip exact-artifact.zip
          --metadata exact-artifact-metadata.json
          --expected-run-id "$TARGET_RUN_ID"
          --expected-head-sha "$TARGET_HEAD_SHA"
          --output verified-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: corrected-spectral-convergence-verified-audit
          path: |
            exact-artifact-metadata.json
            verified-summary.json
          if-no-files-found: error
          retention-days: 90
