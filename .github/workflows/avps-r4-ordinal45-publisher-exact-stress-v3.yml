name: AVPS recovery4 ordinal45 publisher exact executable stress v3

on:
  push:
    branches:
      - stress/avps-r4-ordinal45-publisher-exact-v3-20260908-0543
    paths:
      - '.github/workflows/avps-r4-ordinal45-publisher-exact-stress-v3.yml'

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: avps-r4-ordinal45-publisher-exact-stress-v3-${{ github.sha }}
  cancel-in-progress: false

env:
  EXPECTED_MAIN: 28c47c92714aa2d0ad92a37a0c6dd5d12e622b16
  EXPECTED_BRANCH: stress/avps-r4-ordinal45-publisher-exact-v3-20260908-0543
  STRESS_PATH: .github/workflows/avps-r4-ordinal45-publisher-exact-stress-v3.yml
  PUBLISHER_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v3.yml
  PUBLISHER_BLOB: 3f051dc9ca138004615846e442fde53097eb0290
  PARSER_TEST_PATH: tests/test_avps_recovery4_ordinal45_write_quiet_parser_repair.py
  PARSER_TEST_BLOB: b50c64cd11ebd86970cd0dc93bf735b7296b4490
  SCIENCE_WORKFLOW: avps-v2-postconsumption-recovery4-science.yml
  SPENT_PUBLISHER_RUN: '34147692847'
  EXPECTED_GLOBAL_WORKFLOW_DISPATCH_COUNT: '58'
  CORRECTION_BEGIN: '5467776090'
  CORRECTION_PREDECESSOR: '5467858336'
  CORRECTION_CANONICAL: '5467875147'
  GOVERNANCE_CUTOFF: '5576203465'

jobs:
  exact-executable-stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Bind fresh stress head to exact clean repaired main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$EXPECTED_MAIN"
          test "$(git merge-base "$EXPECTED_MAIN" HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-list --count "$EXPECTED_MAIN..HEAD")" = 1
          test -z "$(git rev-list --merges "$EXPECTED_MAIN..HEAD")"
          git diff --name-only "$EXPECTED_MAIN"...HEAD > changed-paths.txt
          printf '%s\n' "$STRESS_PATH" > expected-paths.txt
          diff -u expected-paths.txt changed-paths.txt
          test "$(git hash-object "$PUBLISHER_PATH")" = "$PUBLISHER_BLOB"
          test "$(git hash-object "$PARSER_TEST_PATH")" = "$PARSER_TEST_BLOB"
          test -z "$(command -v uvspec || true)"
          test -f ".github/workflows/$SCIENCE_WORKFLOW"
          test ! -e candidate-seed-ledger.json
          test ! -e candidate-context.json
          test ! -e tracked-seed-scan.json
          test ! -e repository-global-seed-scan.json
          test ! -e repository-global-scan-success-attempt.txt

      - name: Materialize complete result-blind live governance and one-use inventory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p stress-evidence
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > stress-evidence/issue60-pages.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v3.yml/runs?event=workflow_dispatch&per_page=100" > stress-evidence/publisher-run-pages.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/$SCIENCE_WORKFLOW/runs?event=workflow_dispatch&per_page=100" > stress-evidence/science-run-pages.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs?event=workflow_dispatch&per_page=100" > stress-evidence/global-workflow-dispatch-pages.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SPENT_PUBLISHER_RUN" > stress-evidence/spent-publisher-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SPENT_PUBLISHER_RUN/jobs?per_page=100" > stress-evidence/spent-publisher-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SPENT_PUBLISHER_RUN/artifacts?per_page=100" > stress-evidence/spent-publisher-artifacts.json
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" > stress-evidence/main-ref.json
          set +e
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-ordinal-45" > stress-evidence/ordinal45-ref.json 2>stress-evidence/ordinal45-ref.err
          printf '%s\n' "$?" > stress-evidence/ordinal45-ref.rc
          set -e

      - name: Run deterministic parser and compatibility fixtures on ACTUAL publisher bytes
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_avps_recovery4_ordinal45_write_quiet_parser_repair

      - name: Diagnostic corpus from ACTUAL publisher bytes and COMPLETE live issue 60
        shell: /usr/bin/python3 -I -S {0}
        run: |
          import json, os, re, textwrap
          from pathlib import Path

          errors=[]; notes={}
          def check(cond,msg):
              if not cond: errors.append(msg)
          wf=Path(os.environ['PUBLISHER_PATH']).read_text(encoding='utf-8')
          check(wf.count('# BEGIN_WRITE_QUIET_END_LINE_PARSER_V1')==3,'parser begin sentinel cardinality')
          check(wf.count('# END_WRITE_QUIET_END_LINE_PARSER_V1')==3,'parser end sentinel cardinality')
          check('on:\n  workflow_dispatch:' in wf,'publisher trigger is not exact workflow_dispatch')
          for forbidden in ('uvspec ', 'mystic ', 'libRadtran'):
              check(forbidden not in wf, 'hidden science/runtime token present: '+forbidden)

          cutoff=re.findall(r'(?m)^\s*KNOWN_DEFECT=(\d+)\s*$',wf)
          check(cutoff==[os.environ['GOVERNANCE_CUTOFF']],'governance cutoff declaration cardinality/value drift: '+repr(cutoff))
          mB=re.search(r'(?m)^\s*B=\{([^}]*)\}',wf)
          if mB:
              suppression=sorted({int(x) for x in re.findall(r'\d+',mB.group(1))})
              notes['suppressionCount']=len(suppression)
              notes['suppressionTail']=suppression[-8:]
              check(all(x<int(os.environ['GOVERNANCE_CUTOFF']) for x in suppression),'suppression ledger reaches/passes cutoff')
          else: errors.append('suppression ledger not found')

          def extract(begin,end):
              pat=re.compile(r'^\s*'+re.escape(begin)+r'\n(.*?)^\s*'+re.escape(end)+r'$',re.MULTILINE|re.DOTALL)
              return [textwrap.dedent(x).strip() for x in pat.findall(wf)]

          parser=extract('# BEGIN_WRITE_QUIET_END_LINE_PARSER_V1','# END_WRITE_QUIET_END_LINE_PARSER_V1')
          check(len(parser)==3,'three actual parser blocks not extractable')
          check(len(set(parser))==1,'actual parser call sites drifted')
          pns={}
          try:
              exec(parser[0],pns)
          except BaseException as exc:
              errors.append('actual parser exec/embedded deterministic fixtures: '+repr(exc))

          pages=json.load(open('stress-evidence/issue60-pages.json'))
          comments=[row for page in pages for row in page]
          notes['issue60CommentCount']=len(comments)
          if pns:
              try:
                  begin_ids={int(c['id']) for c in comments if pns['is_write_quiet_begin'](str(c.get('body') or ''))}
                  closed=set()
                  for c in comments:
                      pns['record_write_quiet_end'](str(c.get('body') or ''),int(c['id']),begin_ids,closed)
                  unmatched=sorted(begin_ids-closed)
                  check(not unmatched,'live ledger unmatched WRITE_QUIET_BEGIN: '+repr(unmatched))
                  rec=pns['_write_quiet_end_records'](closed).get(int(os.environ['CORRECTION_BEGIN']),{})
                  check(rec.get('comment_id')==int(os.environ['CORRECTION_CANONICAL']),'canonical corrected END not selected')
                  check(tuple(rec.get('superseded_comment_ids') or ())==(int(os.environ['CORRECTION_PREDECESSOR']),),'predecessor provenance not retained exactly')
                  notes['writeQuietBeginCount']=len(begin_ids)
                  notes['writeQuietClosedCount']=len(closed)
              except BaseException as exc:
                  errors.append('complete live ledger actual parser: '+repr(exc))

          guard=extract('# BEGIN_PUBLISHER_RUN_CARDINALITY_GUARD_V1','# END_PUBLISHER_RUN_CARDINALITY_GUARD_V1')
          check(len(guard)==1,'publisher cardinality guard extract count')
          gns={}
          if guard:
              try:
                  exec(guard[0],gns); gns['run_publisher_guard_fixtures']()
                  live_pages=json.load(open('stress-evidence/publisher-run-pages.json'))
                  existing=[r for page in live_pages for r in page.get('workflow_runs',[])]
                  spent=[r for r in existing if int(r.get('id') or 0)==int(os.environ['SPENT_PUBLISHER_RUN'])]
                  check(len(spent)==1,'spent publisher run missing from exact publisher inventory')
                  if spent:
                      s=spent[0]; check(s.get('status')=='completed' and s.get('conclusion')=='failure' and s.get('run_attempt')==1,'spent publisher terminal identity drift')
                  synthetic={'id':999999999001,'status':'in_progress','run_attempt':1,'event':'workflow_dispatch','run_number':999999,'head_sha':os.environ['EXPECTED_MAIN'],'head_branch':'main','path':os.environ['PUBLISHER_PATH'],'conclusion':None}
                  combined=existing+[synthetic]
                  gns['validate_publisher_run_pages']([{'total_count':len(combined),'workflow_runs':combined}],{'run_id':synthetic['id'],'run_attempt':1,'event':'workflow_dispatch','run_number':synthetic['run_number'],'head_sha':os.environ['EXPECTED_MAIN'],'head_branch':'main','workflow_path':os.environ['PUBLISHER_PATH']})
                  notes['exactPublisherWorkflowDispatchCount']=len(existing)
              except BaseException as exc:
                  errors.append('actual runtime/cardinality guard: '+repr(exc))

          wiring=extract('# BEGIN_PUBLISHER_RUNTIME_WIRING_V2','# END_PUBLISHER_RUNTIME_WIRING_V2')
          check(len(wiring)==1,'publisher runtime wiring extract count')
          if wiring and guard:
              try:
                  prefix=wiring[0].split('RUNTIME_GUARD_RESULT=run_real_publisher_runtime_guard()',1)[0]
                  wns=dict(gns); exec(prefix,wns)
                  old=dict(os.environ)
                  try:
                      os.environ.update({'GITHUB_RUN_ID':'999999999001','GITHUB_RUN_ATTEMPT':'1','GITHUB_EVENT_NAME':'workflow_dispatch','GITHUB_RUN_NUMBER':'999999','GITHUB_SHA':os.environ['EXPECTED_MAIN'],'GITHUB_REF':'refs/heads/main','GITHUB_REF_NAME':'main','GITHUB_WORKFLOW_REF':f"{os.environ['GITHUB_REPOSITORY']}/{os.environ['PUBLISHER_PATH']}@refs/heads/main"})
                      exp=wns['_runtime_expected_from_github_env']()
                      check(exp['head_sha']==os.environ['EXPECTED_MAIN'] and exp['head_branch']=='main' and exp['event']=='workflow_dispatch','exact workflow_dispatch/default-branch context drift')
                  finally:
                      os.environ.clear(); os.environ.update(old)
              except BaseException as exc:
                  errors.append('actual workflow_dispatch/default-branch/event/ref context: '+repr(exc))

          global_pages=json.load(open('stress-evidence/global-workflow-dispatch-pages.json'))
          global_runs=[r for page in global_pages for r in page.get('workflow_runs',[])]
          notes['globalWorkflowDispatchCount']=len(global_runs)
          check(len(global_runs)==int(os.environ['EXPECTED_GLOBAL_WORKFLOW_DISPATCH_COUNT']),'global workflow_dispatch inventory drift: '+str(len(global_runs)))
          science_pages=json.load(open('stress-evidence/science-run-pages.json'))
          science=[r for page in science_pages for r in page.get('workflow_runs',[])]
          check(not science,'ordinal45 science workflow_dispatch already exists: '+repr([r.get('id') for r in science]))
          spent_art=json.load(open('stress-evidence/spent-publisher-artifacts.json'))
          check(spent_art.get('total_count')==0 and not spent_art.get('artifacts'),'spent publisher unexpectedly has artifacts')
          try:
              check(int(Path('stress-evidence/ordinal45-ref.rc').read_text().strip())!=0,'ordinal45 dispatch ref already exists')
          except BaseException as exc: errors.append('ordinal45 ref diagnostic: '+repr(exc))

          fenced=extract('# BEGIN_CANONICAL_AVPS_ORDINAL45_FENCED_DISPATCH_V2','# END_CANONICAL_AVPS_ORDINAL45_FENCED_DISPATCH_V2')
          check(len(fenced)==1,'fenced dispatch source extract count')
          if fenced:
              src=fenced[0]
              expected_order=["--method','POST',f'repos/{REPO}/git/refs'","--method','POST',f'repos/{REPO}/issues/60/comments'","actions/workflows/{SCIENCE_WORKFLOW}/dispatches","--method','PATCH',f'repos/{REPO}/issues/comments/{begin}'","Path('publisher-dispatch-receipt.json').write_text"]
              pos=[]
              for token in expected_order:
                  p=src.find(token); pos.append(p); check(p>=0,'fenced mutation/receipt token missing: '+token)
              check(all(a<b for a,b in zip(pos,pos[1:])),'fenced mutation ordering drift')
              check("'schemaVersion':2" in src,'publisher receipt schemaVersion drift')
              for key in ('beginCommentId','consumedCommentId','scienceRunId','scienceHeadSha','dispatchBranch','authorizationHead','fenceToken'):
                  check(("'"+key+"'") in src,'publisher receipt key missing: '+key)

          Path('stress-evidence/diagnostic-corpus.json').write_text(json.dumps({'errors':errors,'notes':notes},sort_keys=True,indent=2)+'\n')

      - name: Execute ACTUAL publisher prefence prefix result-blind under exact publisher context
        shell: /usr/bin/python3 -I -S {0}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          import json, os, re, textwrap, traceback
          from pathlib import Path
          wf=Path(os.environ['PUBLISHER_PATH']).read_text(encoding='utf-8')
          m=re.search(r'^\s*# BEGIN_CANONICAL_AVPS_ORDINAL45_PREFENCE_V1\n(.*?)^\s*# END_CANONICAL_AVPS_ORDINAL45_PREFENCE_V1$',wf,re.MULTILINE|re.DOTALL)
          result={'status':'not-run','error':None}
          try:
              if not m: raise RuntimeError('actual prefence source not extractable')
              src=textwrap.dedent(m.group(1)).strip()
              mutation="token='AVPS_V2_RECOVERY4_ORDINAL45_SNAPSHOT_'+os.environ['GITHUB_RUN_ID']"
              if mutation not in src: raise RuntimeError('prefence mutation boundary missing')
              prefix=src.split(mutation,1)[0].rstrip()
              old=dict(os.environ)
              os.environ.update({'GITHUB_EVENT_NAME':'workflow_dispatch','GITHUB_RUN_ATTEMPT':'1','GITHUB_SHA':os.environ['EXPECTED_MAIN'],'GITHUB_REF':'refs/heads/main','GITHUB_REF_NAME':'main','GITHUB_WORKFLOW_REF':f"{os.environ['GITHUB_REPOSITORY']}/{os.environ['PUBLISHER_PATH']}@refs/heads/main"})
              try:
                  exec(compile(prefix,'<actual-publisher-prefence-prefix>','exec'),{})
              finally:
                  keep={k:os.environ.get(k) for k in ('GH_TOKEN','GITHUB_TOKEN')}; os.environ.clear(); os.environ.update(old); os.environ.update({k:v for k,v in keep.items() if v is not None})
              result['status']='pass'
          except BaseException as exc:
              result['status']='fail'; result['error']=repr(exc); result['traceback']=traceback.format_exc()
          Path('stress-evidence/actual-prefence-prefix.json').write_text(json.dumps(result,sort_keys=True,indent=2)+'\n')

      - name: Classify complete stress diagnostics
        id: classify
        shell: /usr/bin/python3 -I -S {0}
        run: |
          import json, os
          from pathlib import Path
          errors=[]
          corpus=json.load(open('stress-evidence/diagnostic-corpus.json')); errors.extend(corpus.get('errors',[]))
          pref=json.load(open('stress-evidence/actual-prefence-prefix.json'))
          if pref.get('status')!='pass': errors.append('actual prefence prefix failed: '+str(pref.get('error')))
          required=('candidate-seed-ledger.json','candidate-context.json','tracked-seed-scan.json','repository-global-seed-scan.json','repository-global-scan-success-attempt.txt')
          for path in required:
              if not Path(path).is_file(): errors.append('missing actual prefence evidence file: '+path)
          if Path('tracked-seed-scan.json').is_file():
              x=json.load(open('tracked-seed-scan.json'))
              if x.get('trackedTreeExternalCollisionCount')!=0: errors.append('tracked candidate collision')
          if Path('repository-global-seed-scan.json').is_file():
              x=json.load(open('repository-global-seed-scan.json'))
              if x.get('repositoryGlobalCollisionCount',x.get('collisionCount'))!=0: errors.append('repository-global candidate collision')
              if x.get('repositoryGlobalDoubleEnumerationStable') is not True: errors.append('repository-global double enumeration unstable')
              if x.get('auditedBranchHeadMatchesRepositoryHead') is not True: errors.append('audited branch/head mismatch')
              if int(x.get('repositoryGlobalPostFenceCandidateSeedCollisionCount',0) or 0)!=0: errors.append('post-fence candidate collision')
          summary={'classification':'PASS_EXACT_EXECUTABLE_STRESS_PASS' if not errors else 'FAIL_EXACT_EXECUTABLE_STRESS_PASS','expectedMain':os.environ['EXPECTED_MAIN'],'publisherPath':os.environ['PUBLISHER_PATH'],'publisherBlob':os.environ['PUBLISHER_BLOB'],'diagnosticNotes':corpus.get('notes',{}),'errors':errors,'scienceRuntimeExecuted':False,'publisherInvoked':False,'writeQuietEntered':False,'dispatchConsumed':False,'protectedResultsOpened':False}
          Path('stress-evidence/stress-summary.json').write_text(json.dumps(summary,sort_keys=True,indent=2)+'\n')
          print(json.dumps(summary,sort_keys=True,indent=2))
          if errors: raise SystemExit(1)

      - name: Persist non-authorizing stress evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: avps-r4-ordinal45-exact-stress-v3-${{ github.run_id }}
          path: |
            stress-evidence/
            candidate-seed-ledger.json
            candidate-context.json
            tracked-seed-scan.json
            repository-global-seed-scan.json
            repository-global-scan-success-attempt.txt
            changed-paths.txt
            expected-paths.txt
          if-no-files-found: warn
          retention-days: 30
