name: Review AVPS Recovery4 canonical parser repair v2

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/avps-recovery4-canonical-parser-review-v2.yml
      - .github/workflows/avps-v2-postconsumption-recovery4-science.yml
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v3.yml
      - scripts/avps_write_quiet_parser_v1.py
      - tests/test_avps_recovery4_canonical_write_quiet_parser_v1.py
      - tests/test_avps_recovery4_ordinal45_write_quiet_parser_repair.py
      - tests/test_avps_recovery4_canonical_parser_reviewer_v2.py

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: avps-recovery4-canonical-parser-review-v2-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  zero-runtime-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SELF_PATH: .github/workflows/avps-recovery4-canonical-parser-review-v2.yml
      INSTALL_TEST: tests/test_avps_recovery4_canonical_parser_reviewer_v2.py
      SCIENCE_PATH: .github/workflows/avps-v2-postconsumption-recovery4-science.yml
      PUBLISHER_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v3.yml
      PARSER_PATH: scripts/avps_write_quiet_parser_v1.py
      PARSER_TEST: tests/test_avps_recovery4_canonical_write_quiet_parser_v1.py
      LEGACY_PARSER_TEST: tests/test_avps_recovery4_ordinal45_write_quiet_parser_repair.py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Bind exact event head base changed-path mode and direct-child identity
        shell: bash
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$EVENT_BASE_REF" = main
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test "$(git merge-base "$EVENT_BASE" HEAD)" = "$EVENT_BASE"
          test -z "$(git rev-list --min-parents=2 "$EVENT_BASE"..HEAD)"
          mapfile -t PARENTS < <(git cat-file -p HEAD | sed -n 's/^parent //p')
          test "${#PARENTS[@]}" = 1
          test "${PARENTS[0]}" = "$EVENT_BASE"
          git diff --name-only "$EVENT_BASE"...HEAD | sort > changed.txt
          python - <<'PY'
          import os
          from pathlib import Path
          changed=set(Path('changed.txt').read_text().splitlines())
          self_path=os.environ['SELF_PATH']; install_test=os.environ['INSTALL_TEST']
          science=os.environ['SCIENCE_PATH']; publisher=os.environ['PUBLISHER_PATH']
          parser=os.environ['PARSER_PATH']; parser_test=os.environ['PARSER_TEST']; legacy_parser_test=os.environ['LEGACY_PARSER_TEST']
          install={self_path,install_test}
          phase_b_required={science,publisher,parser,parser_test,legacy_parser_test}
          if changed==install:
              mode='INSTALLATION'
          elif self_path not in changed and install_test not in changed and changed==phase_b_required:
              mode='PHASE_B'
          else:
              raise SystemExit('AVPS canonical parser reviewer refuses changed-path scope: '+repr(sorted(changed)))
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('MODE='+mode+'\n')
          PY
          if [ "${MODE:-}" = INSTALLATION ]; then :; fi

      - name: Prove reviewer is read-only zero-runtime and non-authorizing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['SELF_PATH']).read_text()
          on=p.split('\non:\n',1)[1].split('\npermissions:\n',1)[0]
          if 'pull_request:' not in on or ('workflow_'+'dispatch:') in on: raise SystemExit('reviewer trigger drift')
          perms=p.split('\npermissions:\n',1)[1].split('\nconcurrency:\n',1)[0]
          if ': write' in perms: raise SystemExit('reviewer gained write permission')
          required=(os.environ['SCIENCE_PATH'],os.environ['PUBLISHER_PATH'],os.environ['PARSER_PATH'],os.environ['PARSER_TEST'],os.environ['LEGACY_PARSER_TEST'])
          for x in required:
              if x not in p: raise SystemExit('reviewer missing future repair surface: '+x)
          forbidden=('gh workflow '+'run','gh api -X '+'POST','workflow_'+'dispatch:', 'command -v '+'uvspec','rte_solver '+'mystic','mc_'+'photons 20000000')
          body=p.split('permissions:',1)[1]
          for x in forbidden:
              if x in body: raise SystemExit('reviewer contains forbidden execution token: '+x)
          if "mode='INSTALLATION'" not in p or "mode='PHASE_B'" not in p: raise SystemExit('reviewer mode gate missing')
          if "self_path not in changed" not in p or "install_test not in changed" not in p: raise SystemExit('reviewer could self-certify Phase-B')
          if 'phase_b_required={science,publisher,parser,parser_test,legacy_parser_test}' not in p: raise SystemExit('complete Phase-B parser test migration is not mandatory')
          for marker in ('REVIEWER_OWNED_CANONICAL_PARSER_SEMANTIC_CORPUS_V2','PARSER_STATIC_PURITY_GUARD_V2','REVIEWER_OWNED_PURITY_NEGATIVE_MATRIX_V2','MUTABLE_TEST_NON_SPOOF_GUARD_V2','ISOLATED_MODE_IMPORTABILITY_PROOF_V1'):
              if marker not in p: raise SystemExit('reviewer protection missing: '+marker)
          PY

      - name: Statically prove canonical parser purity and run immutable hostile matrix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          # PARSER_STATIC_PURITY_GUARD_V2
          # REVIEWER_OWNED_PURITY_NEGATIVE_MATRIX_V2
          import ast, os
          from pathlib import Path

          ALLOWED_MODULES={'re'}
          SAFE_BUILTINS={'all','any','bool','dict','enumerate','int','isinstance','len','list','max','min','range','set','sorted','str','sum','tuple','ValueError','RuntimeError','TypeError'}
          SAFE_RE_ATTRS={'compile','escape','findall','finditer','fullmatch','match','search'}
          SAFE_METHODS={'add','append','casefold','copy','difference','discard','endswith','extend','findall','finditer','fullmatch','get','group','groupdict','groups','intersection','isdigit','isdecimal','issubset','items','join','keys','lower','lstrip','match','partition','rstrip','search','setdefault','sort','split','splitlines','startswith','strip','union','upper','values'}
          FORBIDDEN_NAMES={'open','eval','exec','compile','__import__','input','breakpoint','globals','locals','vars','getattr','setattr','delattr'}
          FORBIDDEN_NODE_TYPES=(ast.AsyncFunctionDef,ast.Await,ast.ClassDef,ast.Global,ast.Lambda,ast.Nonlocal,ast.With,ast.AsyncWith,ast.Yield,ast.YieldFrom)

          def chain(node):
              parts=[]
              while isinstance(node,ast.Attribute):
                  parts.append(node.attr); node=node.value
              if isinstance(node,ast.Name):
                  parts.append(node.id); return list(reversed(parts))
              return []

          def literal_ok(node):
              try: ast.literal_eval(node); return True
              except Exception: return False

          def analyze_source(text,label):
              try: tree=ast.parse(text,filename=label)
              except SyntaxError as e: raise SystemExit(f'{label}: syntax invalid: {e}')
              top_imports={id(x) for x in tree.body if isinstance(x,(ast.Import,ast.ImportFrom))}
              functions={x.name for x in tree.body if isinstance(x,ast.FunctionDef)}
              import_aliases={}
              imported_symbols=set()
              for stmt in tree.body:
                  if isinstance(stmt,ast.Expr) and isinstance(stmt.value,ast.Constant) and isinstance(stmt.value.value,str) and stmt is tree.body[0]:
                      continue
                  if isinstance(stmt,ast.Import):
                      for a in stmt.names:
                          if a.name not in ALLOWED_MODULES: raise SystemExit(f'{label}: import module not exactly allowlisted: {a.name}')
                          import_aliases[a.asname or a.name]=a.name
                  elif isinstance(stmt,ast.ImportFrom):
                      if stmt.level or stmt.module not in ALLOWED_MODULES: raise SystemExit(f'{label}: from-import module not exactly allowlisted: {stmt.module}')
                      for a in stmt.names:
                          if a.name=='*': raise SystemExit(f'{label}: star import forbidden')
                          imported_symbols.add(a.asname or a.name)
                  elif isinstance(stmt,ast.FunctionDef):
                      if stmt.decorator_list: raise SystemExit(f'{label}: function decorators forbidden: {stmt.name}')
                      args=stmt.args
                      if stmt.returns is not None or any(a.annotation is not None for a in (args.posonlyargs+args.args+args.kwonlyargs)) or (args.vararg and args.vararg.annotation is not None) or (args.kwarg and args.kwarg.annotation is not None):
                          raise SystemExit(f'{label}: annotations forbidden: {stmt.name}')
                      if args.defaults or any(d is not None for d in args.kw_defaults): raise SystemExit(f'{label}: default expressions forbidden: {stmt.name}')
                  elif isinstance(stmt,ast.Assign):
                      if not all(isinstance(t,ast.Name) for t in stmt.targets) or not literal_ok(stmt.value): raise SystemExit(f'{label}: top-level assignment must be simple literal/container only')
                  else:
                      raise SystemExit(f'{label}: executable/unsupported module-level statement: {type(stmt).__name__}')

              for node in ast.walk(tree):
                  if isinstance(node,FORBIDDEN_NODE_TYPES): raise SystemExit(f'{label}: forbidden dynamic/runtime node: {type(node).__name__}')
                  if isinstance(node,(ast.Import,ast.ImportFrom)) and id(node) not in top_imports: raise SystemExit(f'{label}: nested import forbidden')
                  if isinstance(node,ast.Name) and isinstance(node.ctx,ast.Load):
                      if node.id in FORBIDDEN_NAMES or node.id.startswith('__'): raise SystemExit(f'{label}: forbidden dynamic/I-O name: {node.id}')
                  if isinstance(node,ast.Attribute):
                      if node.attr.startswith('__'): raise SystemExit(f'{label}: dunder attribute forbidden: {node.attr}')
                      parts=chain(node)
                      if len(parts)>2: raise SystemExit(f'{label}: multi-hop qualified reference forbidden: '+'.'.join(parts))
                      if len(parts)==2:
                          root,attr=parts
                          module=import_aliases.get(root)
                          if module is not None:
                              if module!='re' or attr not in SAFE_RE_ATTRS: raise SystemExit(f'{label}: qualified module reference not allowlisted: {module}.{attr}')
                          elif attr not in SAFE_METHODS:
                              raise SystemExit(f'{label}: object attribute/method not allowlisted: {attr}')
                  if isinstance(node,ast.Call):
                      if isinstance(node.func,ast.Name):
                          name=node.func.id
                          if name in FORBIDDEN_NAMES or name.startswith('__'): raise SystemExit(f'{label}: forbidden call: {name}')
                          if name not in SAFE_BUILTINS and name not in functions and name not in imported_symbols:
                              raise SystemExit(f'{label}: unknown/dynamic call target: {name}')
                      elif isinstance(node.func,ast.Attribute):
                          parts=chain(node.func)
                          if len(parts)!=2: raise SystemExit(f'{label}: dynamic/multi-hop call target forbidden')
                          root,attr=parts; module=import_aliases.get(root)
                          if module is not None:
                              if module!='re' or attr not in SAFE_RE_ATTRS: raise SystemExit(f'{label}: module call not allowlisted: {module}.{attr}')
                          elif attr not in SAFE_METHODS:
                              raise SystemExit(f'{label}: object call not allowlisted: {attr}')
                      else:
                          raise SystemExit(f'{label}: dynamic call expression forbidden')
              return True

          def must_reject(text,label):
              try: analyze_source(text,label)
              except SystemExit: return
              raise SystemExit(label+' hostile fixture unexpectedly passed purity guard')

          hostile={
            'urllib.parse.urlopen': "from urllib.parse import urlopen\ndef f(): return urlopen('x')\n",
            'http.client': "import http.client\ndef f(): return http.client.HTTPConnection('x')\n",
            'requests.sessions': "import requests.sessions\ndef f(): return requests.sessions.Session()\n",
            'pathlib.Path.read_text': "from pathlib import Path\ndef f(): return Path('x').read_text()\n",
            'os.environ': "import os\ndef f(): return os.environ.get('X')\n",
            'os.system': "import os\ndef f(): return os.system('x')\n",
            'os.popen': "import os\ndef f(): return os.popen('x')\n",
            'subprocess': "import subprocess\ndef f(): return subprocess.run(['x'])\n",
            'importlib': "import importlib\ndef f(): return importlib.import_module('os')\n",
            'tempfile': "import tempfile\ndef f(): return tempfile.NamedTemporaryFile()\n",
            'open': "def f(): return open('x')\n",
            'socket': "import socket\ndef f(): return socket.socket()\n",
            'time': "import time\ndef f(): return time.time()\n",
            'datetime': "from datetime import datetime\ndef f(): return datetime.now()\n",
            'random': "import random\ndef f(): return random.random()\n",
            'secrets': "import secrets\ndef f(): return secrets.token_hex()\n",
            'urllib alias': "import urllib.request as u\ndef f(): return u.urlopen('x')\n",
            'os alias': "from os import system as run\ndef f(): return run('x')\n",
            'eval': "def f(x): return eval(x)\n",
            'exec': "def f(x): exec(x)\n",
            'compile': "def f(x): return compile(x,'x','exec')\n",
            '__import__': "def f(): return __import__('os')\n",
            'star import': "from re import *\ndef f(x): return fullmatch('x',x)\n",
          }
          for label,text in hostile.items(): must_reject(text,'fixture:'+label)
          safe="import re\nTOKEN='x'\ndef parse(text):\n    out=set()\n    for line in text.splitlines():\n        m=re.fullmatch(r'\\d+',line.strip())\n        if m:\n            out.add(int(m.group(0)))\n    return sorted(out)\n"
          analyze_source(safe,'safe-positive')
          if os.environ.get('MODE')=='PHASE_B':
              analyze_source(Path(os.environ['PARSER_PATH']).read_text(),os.environ['PARSER_PATH'])
          PY

      - name: Prove isolated-mode repository import contract independently
        shell: bash
        run: |
          set -euo pipefail
          # ISOLATED_MODE_IMPORTABILITY_PROOF_V1
          ROOT="$RUNNER_TEMP/avps-isolated-import-fixture"
          rm -rf "$ROOT"
          mkdir -p "$ROOT/scripts"
          printf '%s\n' '' > "$ROOT/scripts/__init__.py"
          printf '%s\n' 'def probe():' '    return 7' > "$ROOT/scripts/avps_write_quiet_parser_v1.py"
          set +e
          GITHUB_WORKSPACE="$ROOT" PYTHONPATH="$ROOT" /usr/bin/python3 -I -S -c "from scripts.avps_write_quiet_parser_v1 import probe; raise SystemExit(0 if probe()==7 else 3)" >/tmp/avps-unbound.out 2>/tmp/avps-unbound.err
          UNBOUND_RC=$?
          set -e
          test "$UNBOUND_RC" -ne 0
          GITHUB_WORKSPACE="$ROOT" PYTHONPATH="$ROOT" /usr/bin/python3 -I -S -c "import os,sys; sys.path.insert(0, os.environ['GITHUB_WORKSPACE']); from scripts.avps_write_quiet_parser_v1 import probe; raise SystemExit(0 if probe()==7 else 4)"
          rm -rf "$ROOT" /tmp/avps-unbound.out /tmp/avps-unbound.err

      - name: Run installation contract only
        if: env.MODE == 'INSTALLATION'
        run: python "$INSTALL_TEST"

      - name: Statically prove mutable Phase-B tests cannot execute runtime or spoof later checks
        if: env.MODE == 'PHASE_B'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          # MUTABLE_TEST_NON_SPOOF_GUARD_V2
          import ast, os
          from pathlib import Path
          allowed_modules={'pathlib','re','textwrap','unittest','scripts.avps_write_quiet_parser_v1'}
          forbidden_names={'open','eval','exec','compile','__import__','input','breakpoint','globals','locals','vars','getattr','setattr','delattr'}
          forbidden_attrs={'open','write_text','write_bytes','touch','unlink','rename','replace','mkdir','rmdir','chmod','symlink_to','hardlink_to','system','popen','Popen','run','call','check_call','check_output','urlopen','urlretrieve','connect','socket','getenv','putenv','unsetenv','mkstemp','NamedTemporaryFile','TemporaryDirectory','sleep','now','utcnow','today'}
          for path in (os.environ['PARSER_TEST'],os.environ['LEGACY_PARSER_TEST']):
              text=Path(path).read_text()
              try: tree=ast.parse(text, filename=path)
              except SyntaxError as e: raise SystemExit(f'Phase-B test syntax invalid before execution: {path}: {e}')
              for node in ast.walk(tree):
                  if isinstance(node,ast.Import):
                      for a in node.names:
                          if a.name not in allowed_modules: raise SystemExit(f'Phase-B test imports non-whitelisted module: {path}: {a.name}')
                  elif isinstance(node,ast.ImportFrom):
                      module=node.module or ''
                      if node.level or module not in allowed_modules: raise SystemExit(f'Phase-B test imports non-whitelisted module: {path}: {module}')
                      if any(a.name=='*' for a in node.names): raise SystemExit(f'Phase-B test star import forbidden: {path}')
                  elif isinstance(node,ast.Name) and isinstance(node.ctx,ast.Load):
                      if node.id in forbidden_names or node.id.startswith('__'): raise SystemExit(f'Phase-B test dynamic/I-O namespace forbidden: {path}: {node.id}')
                  elif isinstance(node,ast.Attribute):
                      if node.attr.startswith('__') or node.attr in forbidden_attrs: raise SystemExit(f'Phase-B test mutating/runtime attribute forbidden: {path}: {node.attr}')
                  elif isinstance(node,ast.Call) and isinstance(node.func,ast.Name) and node.func.id in forbidden_names:
                      raise SystemExit(f'Phase-B test uses forbidden dynamic/I-O call: {path}: {node.func.id}')
          PY

      - name: Run reviewer-owned immutable semantic corpus against actual parser
        if: env.MODE == 'PHASE_B'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          # REVIEWER_OWNED_CANONICAL_PARSER_SEMANTIC_CORPUS_V2
          from scripts.avps_write_quiet_parser_v1 import write_quiet_end_binding, record_write_quiet_end, is_write_quiet_begin, _write_quiet_end_records

          def expect_exit(fn,label):
              try: fn()
              except SystemExit: return
              raise SystemExit(label+' unexpectedly passed')

          for key in ('begin','beginComment','begin_comment'):
              if write_quiet_end_binding(f'WRITE_QUIET_END | stage=x | {key}=123') != 123: raise SystemExit('legacy marker alias failed: '+key)
              if write_quiet_end_binding(f'WRITE_QUIET_END | stage=x\n{key}=123') != 123: raise SystemExit('standalone authoritative alias failed: '+key)
          if write_quiet_end_binding('WRITE_QUIET_END | begin=999 | stage=legacy\nbeginComment=123') != 123: raise SystemExit('structured standalone metadata must override legacy marker-line fallback')
          if write_quiet_end_binding('WRITE_QUIET_END begin=5471141095 stage=x') != 5471141095: raise SystemExit('historical legacy one-line END failed')
          if write_quiet_end_binding('WRITE_QUIET_END | stage=x\nbeginComment=5562775627') != 5562775627: raise SystemExit('historical multiline END failed')
          if write_quiet_end_binding('TOTAL_SKY_OWNER::WRITE_QUIET_END | stage=x\nbegin_comment=123') != 123: raise SystemExit('owner-aware END grammar failed')
          if write_quiet_end_binding('WRITE_QUIET_END | stage=x\nbegin=123\nbeginComment=123\nbegin_comment=123') != 123: raise SystemExit('repeated-identical aliases failed')
          for body in ('header\nWRITE_QUIET_END | beginComment=123','prose WRITE_QUIET_END | beginComment=123','`WRITE_QUIET_END | beginComment=123`','header\n> WRITE_QUIET_END | beginComment=123'):
              if write_quiet_end_binding(body) is not None: raise SystemExit('narrative/quoted END unexpectedly bound')
          for body in ('WRITE_QUIET_END | stage=x','WRITE_QUIET_END | stage=x\nbeginComment=0','WRITE_QUIET_END | stage=x\nbeginComment=abc','WRITE_QUIET_END | stage=x\nbegin=123\nbeginComment=124'):
              expect_exit(lambda body=body: write_quiet_end_binding(body),'malformed/conflicting END')
          for body in ('WRITE_QUIET_BEGIN | stage=x','TOTAL_SKY_OWNER::WRITE_QUIET_BEGIN | stage=x','ATMOSPHERE_OWNER::WRITE_QUIET_BEGIN token=x'):
              if not is_write_quiet_begin(body): raise SystemExit('owner-aware BEGIN grammar failed')
          for body in ('prose WRITE_QUIET_BEGIN | stage=x','Total_Sky_OWNER::WRITE_QUIET_BEGIN | stage=x','header\nTOTAL_SKY_OWNER::WRITE_QUIET_BEGIN | stage=x'):
              if is_write_quiet_begin(body): raise SystemExit('narrative/noncanonical BEGIN unexpectedly bound')

          generic=set(); record_write_quiet_end('WRITE_QUIET_END | beginComment=123',200,{123},generic)
          expect_exit(lambda: record_write_quiet_end('WRITE_QUIET_END | beginComment=123',201,{123},generic),'ordinary same-BEGIN duplicate')
          expect_exit(lambda: record_write_quiet_end('WRITE_QUIET_END | beginComment=999',202,{123},set()),'mismatched BEGIN reference')

          # UNAUTHORIZED_DUPLICATE_MATCHING_SHARED_EVIDENCE_V1: first closure is valid; an otherwise identical second closure with matching evidence and no exact supersession provenance must fail as duplicate.
          duplicate='WRITE_QUIET_END | TEST_VALID_SHARED_EVIDENCE | begin=777 | head=abc123 | run=42 | attempt=1 | preflight_job=43 | conclusion=success | artifact=44 | digest=sha256:deadbeef'
          duplicate_closed=set(); record_write_quiet_end(duplicate,7001,{777},duplicate_closed)
          expect_exit(lambda: record_write_quiet_end(duplicate,7002,{777},duplicate_closed),'unauthorized matching-evidence same-BEGIN duplicate')

          predecessor='WRITE_QUIET_END | LUNAR_FINITE_DISK_EXEC001_FINAL_PREFLIGHT_GLOBAL_SCAN_V1 | begin_comment=5467776090 | branch=execution/lunar-finite-disk-transfer-kernel-sensitivity-v1-exec001 | head=b73d5cf4a58aee3b3e8794b396b79bbd3463f680 | run=33303099872 | attempt=1 | preflight_job=99234734783 | conclusion=success | artifact=9729769639 | digest=sha256:50b9acdf55ebe3188a3f7762c79e0365a9b5c58d5bf2c1b877244b340c9773b8 | 2026-08-30T09:22Z'
          correction_line='WRITE_QUIET_END | LUNAR_FINITE_DISK_EXEC001_FINAL_PREFLIGHT_GLOBAL_SCAN_V1 | begin=5467776090 | head=b73d5cf4a58aee3b3e8794b396b79bbd3463f680 | run=33303099872 | attempt=1 | preflight_job=99234734783 | conclusion=success | artifact=9729769639 | digest=sha256:50b9acdf55ebe3188a3f7762c79e0365a9b5c58d5bf2c1b877244b340c9773b8 | 2026-08-30T09:27Z'
          correction_prose='CORRECTED MACHINE-READABLE FENCE RELEASE: the prior END comment `5467858336` used the human-readable key `begin_comment=` whereas the frozen workflow barrier requires the literal token `begin=`. This comment changes no scientific result, seed, execution identity, threshold, or preflight evidence; it supplies the exact already-preregistered release token after the successful immutable preflight.'
          canonical=correction_line+'\n\n'+correction_prose
          closed=set(); record_write_quiet_end(predecessor,5467858336,{5467776090},closed); record_write_quiet_end(canonical,5467875147,{5467776090},closed)
          record=_write_quiet_end_records(closed).get(5467776090,{})
          if record.get('comment_id')!=5467875147 or tuple(record.get('superseded_comment_ids') or ())!=(5467858336,): raise SystemExit('sole corrected END pair did not canonicalize with provenance')
          def reject_correction(candidate,label):
              trial=set(); record_write_quiet_end(predecessor,5467858336,{5467776090},trial)
              expect_exit(lambda: record_write_quiet_end(candidate,5467875147,{5467776090},trial),label)
          reject_correction(canonical.replace('run=33303099872','run=33303099873'),'shared-evidence mismatch')
          reject_correction(canonical.replace('`5467858336`','`5467858335`'),'wrong-predecessor reference')
          PY

      - name: Verify actual executable-chain wiring and isolated publisher bindings before mutable tests
        if: env.MODE == 'PHASE_B'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,re
          from pathlib import Path
          parser=Path(os.environ['PARSER_PATH']).read_text()
          science=Path(os.environ['SCIENCE_PATH']).read_text()
          publisher=Path(os.environ['PUBLISHER_PATH']).read_text()
          legacy_test=Path(os.environ['LEGACY_PARSER_TEST']).read_text()
          if 'def write_quiet_end_binding' not in parser or 'def record_write_quiet_end' not in parser or 'def is_write_quiet_begin' not in parser or 'def _write_quiet_end_records' not in parser: raise SystemExit('canonical parser API/provenance surface missing')
          import_token='from scripts.avps_write_quiet_parser_v1 import'
          if science.count(import_token) != 2: raise SystemExit(f'science preflight must import canonical parser at exactly two call sites, got {science.count(import_token)}')
          if publisher.count(import_token) != 3: raise SystemExit(f'publisher must import canonical parser at exactly three call sites, got {publisher.count(import_token)}')
          if legacy_test.count(import_token) != 1: raise SystemExit(f'historical regression must import canonical parser exactly once, got {legacy_test.count(import_token)}')
          stale=("first.startswith('WRITE_QUIET_END')", "elif first.startswith('WRITE_QUIET_BEGIN'):")
          for path_name,text in (('science',science),('publisher',publisher)):
              for x in stale:
                  if x in text: raise SystemExit(f'stale first-line-only {path_name} parser remains: {x}')
          if 'def write_quiet_end_binding' in science or 'def write_quiet_end_binding' in publisher: raise SystemExit('embedded sibling WRITE_QUIET binding implementation remains')
          if 'BEGIN_WRITE_QUIET_END_LINE_PARSER_V1' in legacy_test or 'expected three embedded parser blocks' in legacy_test: raise SystemExit('historical regression still depends on embedded parser blocks')

          iso='shell: /usr/bin/python3 -I -S {0}'
          if publisher.count(iso)!=3: raise SystemExit(f'publisher isolated Python shell count drift: {publisher.count(iso)}')
          segments=publisher.split(iso)[1:]
          binding_re=re.compile(r"(?m)^[ \t]*import os,sys[ \t]*\n[ \t]*sys\.path\.insert\(0, os\.environ\['GITHUB_WORKSPACE'\]\)[ \t]*\n[ \t]*from scripts\.avps_write_quiet_parser_v1 import ([A-Za-z0-9_, ]+)[ \t]*$")
          for idx,seg in enumerate(segments,1):
              seg=seg.split('\n      - name:',1)[0]
              if 'PYTHONPATH' in seg: raise SystemExit(f'publisher isolated callsite {idx} attempts forbidden PYTHONPATH repair')
              matches=binding_re.findall(seg)
              if len(matches)!=1: raise SystemExit(f'publisher isolated callsite {idx} lacks exactly one explicit GITHUB_WORKSPACE sys.path binding immediately before canonical import')
              names=[x.strip() for x in matches[0].split(',') if x.strip()]
              if not names: raise SystemExit(f'publisher isolated callsite {idx} imports no canonical API')
              tail=seg[seg.index(import_token):]
              if not any(re.search(r'\b'+re.escape(name)+r'\s*\(',tail) for name in names): raise SystemExit(f'publisher isolated callsite {idx} does not invoke an imported canonical API')
          PY

      - name: Run mutable parser regressions only after immutable semantic and wiring checks
        if: env.MODE == 'PHASE_B'
        shell: bash
        run: |
          set -euo pipefail
          python "$PARSER_TEST"
          python "$LEGACY_PARSER_TEST"

      - name: Emit non-authorizing summary
        if: always()
        shell: bash
        run: |
          {
            echo '### AVPS Recovery4 canonical parser review v2'
            echo "mode=${MODE:-UNBOUND}"
            echo 'read-only / zero-runtime / result-blind'
            echo 'Phase-B requires science + publisher + canonical parser + canonical parser test + migrated historical parser regression together'
            echo 'canonical parser purity is fail-closed by exact module allowlist plus immutable hostile fixtures before any import'
            echo 'publisher isolated-mode canonical imports require explicit GITHUB_WORKSPACE sys.path binding at all three actual /usr/bin/python3 -I -S call sites; PYTHONPATH is refused'
            echo 'reviewer-owned isolated-mode fixture proves unbound import fails and explicit workspace binding succeeds'
            echo 'reviewer-owned immutable semantic corpus includes the exact sole corrected pair and an otherwise-valid matching-evidence unauthorized duplicate negative'
            echo 'science must consume canonical parser at exactly 2 call sites; publisher at exactly 3; historical regression at exactly 1'
            echo 'no publisher invocation, WRITE_QUIET entry, dispatch, seed or ordinal allocation, solver, result opening, science authority, Taylor/Jerusalem use, or production is authorized by this review'
            echo 'installation-mode execution is installation evidence only and MUST NOT be treated as independent acceptance of the reviewer being installed'
          } >> "$GITHUB_STEP_SUMMARY"
