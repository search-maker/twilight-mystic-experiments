name: AVPS v2 dispatch publisher recovery1
run-name: AVPS v2 ordinal 41 zero-runtime dispatch publisher recovery1

on:
  push:
    branches:
      - dispatch-trigger/aerosol-vertical-profile-sensitivity-v2-ordinal-41-publisher-recovery1
    paths:
      - dispatch-triggers/avps-v2-ordinal41-publisher-recovery1.txt

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: avps-v2-ordinal-41-dispatch-publisher-recovery1
  cancel-in-progress: false

env:
  AUTH_BRANCH: authorization/aerosol-vertical-profile-sensitivity-v2-ordinal-41
  AUTH_HEAD: d5f5e4d9d19d7ede573fecae68565a92baabbec3
  AUTH_PARENT: b3d562222a38fc9d1ff5d218886afdda72c37fa2
  AUTH_PR: '604'
  AUTH_REVIEW_RUN: '33218101573'
  AUTH_REVIEW_ARTIFACT: '9704345296'
  AUTH_REVIEW_DIGEST: sha256:fdabe0425c3de893866c25f14b0da1e0038a8e6498b83a281fcae0e773e605d4
  DISPATCH_BRANCH: dispatch/aerosol-vertical-profile-sensitivity-v2-ordinal-41
  EXECUTION_KEY: aerosol-vertical-profile-sensitivity-v2:numerical:41
  ALLOCATION_MARKER: ORDINAL41_AVPS_V2_AUTHORIZATION_ALLOCATED_REVIEWED_NOT_DISPATCHED commit=d5f5e4d9d19d7ede573fecae68565a92baabbec3 parent=b3d562222a38fc9d1ff5d218886afdda72c37fa2 pr=604
  CONSUMED_MARKER: ORDINAL41_AVPS_V2_DISPATCH_CONSUMED
  CANDIDATE_SEED_SHA256: 02f624d582e9b2caba6b920d65a5e8a8bc8fc1a2693623bc2f73abf5d3f706d2
  PREREG_PROTOCOL_BLOB: d790fb3fa2d214d1f430f4417b17212a8e5038a8
  ORIGINAL_PUBLISHER_RUN: '33231924719'
  ORIGINAL_PUBLISHER_HEAD: e3ab0b7c7dae02773fc4756325dcc4d15efabd65
  ORIGINAL_PUBLISHER_WORKFLOW_SHA256: e702518a88cdf9f88e00ec9b1021ea9d023dbb2e90dbe48443bfd667b2319478
  RECOVERY_ACTIVATION_BRANCH: dispatch-trigger/aerosol-vertical-profile-sensitivity-v2-ordinal-41-publisher-recovery1
  RECOVERY_ACTIVATION_MARKER: dispatch-triggers/avps-v2-ordinal41-publisher-recovery1.txt

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Fresh recovery pre-dispatch fence
        id: fence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = "$RECOVERY_ACTIVATION_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -s "$RECOVERY_ACTIVATION_MARKER"
          test -s .github/workflows/avps-v2-science.yml
          test -s .github/workflows/avps-v2-dispatch-publisher.yml
          test -s .github/workflows/avps-v2-dispatch-publisher-recovery1.yml
          test -s review/aerosol-vertical-profile-sensitivity-v2-prereg/protocol.review.json
          mkdir -p dispatch-evidence

          git fetch origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          mapfile -t ACT_PARENTS < <(git cat-file -p HEAD | sed -n 's/^parent //p')
          test "${#ACT_PARENTS[@]}" = 1
          test "${ACT_PARENTS[0]}" = "$MAIN_SHA"
          git diff --name-only HEAD^ HEAD | sort > dispatch-evidence/activation-changed-paths.txt
          test "$(wc -l < dispatch-evidence/activation-changed-paths.txt | tr -d ' ')" = 1
          test "$(cat dispatch-evidence/activation-changed-paths.txt)" = "$RECOVERY_ACTIVATION_MARKER"

          python - <<'PY'
          import hashlib, os, subprocess
          from pathlib import Path
          def git_blob(raw: bytes) -> str:
              return hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          marker={}
          for line in Path(os.environ['RECOVERY_ACTIVATION_MARKER']).read_text(encoding='utf-8').splitlines():
              if '=' not in line: raise SystemExit(f'invalid marker line {line!r}')
              k,v=line.split('=',1)
              if k in marker: raise SystemExit(f'duplicate marker key {k}')
              marker[k]=v
          main=subprocess.check_output(['git','rev-parse','origin/main'],text=True).strip()
          expected={
              'schema':'AVPS_V2_PUBLISHER_RECOVERY1_TRIGGER_V1',
              'main':main,
              'originalPublisherRun':os.environ['ORIGINAL_PUBLISHER_RUN'],
              'scientificOrdinal':'41',
          }
          if marker != expected: raise SystemExit(f'recovery activation marker mismatch: {marker!r} != {expected!r}')
          prereg=Path('review/aerosol-vertical-profile-sensitivity-v2-prereg/protocol.review.json').read_bytes()
          if git_blob(prereg) != os.environ['PREREG_PROTOCOL_BLOB']:
              raise SystemExit('restored frozen prereg protocol blob drift')
          original=Path('.github/workflows/avps-v2-dispatch-publisher.yml').read_bytes()
          if hashlib.sha256(original).hexdigest() != os.environ['ORIGINAL_PUBLISHER_WORKFLOW_SHA256']:
              raise SystemExit('original publisher byte drift')
          PY

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORIGINAL_PUBLISHER_RUN" > dispatch-evidence/original-publisher-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORIGINAL_PUBLISHER_RUN/jobs?per_page=100" > dispatch-evidence/original-publisher-jobs.json
          python - <<'PY'
          import json, os
          r=json.load(open('dispatch-evidence/original-publisher-run.json'))
          if r.get('id') != int(os.environ['ORIGINAL_PUBLISHER_RUN']): raise SystemExit('wrong original publisher run')
          if r.get('event') != 'workflow_dispatch' or int(r.get('run_attempt') or 0) != 1 or r.get('status') != 'completed' or r.get('conclusion') != 'failure': raise SystemExit('original publisher terminal identity drift')
          if r.get('head_sha') != os.environ['ORIGINAL_PUBLISHER_HEAD']: raise SystemExit('original publisher head drift')
          jobs=json.load(open('dispatch-evidence/original-publisher-jobs.json')).get('jobs',[])
          if len(jobs)!=1 or jobs[0].get('name')!='publish' or jobs[0].get('conclusion')!='failure': raise SystemExit('original publisher job identity drift')
          steps={s.get('name'):s.get('conclusion') for s in jobs[0].get('steps',[])}
          if steps.get('Fresh zero-runtime pre-dispatch fence')!='failure': raise SystemExit('original publisher did not fail at frozen pre-dispatch fence')
          for name in ('Create exact dispatch ref and consumed marker once','Upload zero-runtime publisher evidence before science dispatch','Explicitly dispatch exact science workflow from main'):
              if steps.get(name) != 'skipped': raise SystemExit(f'original publisher advanced past pre-consumption boundary: {name}={steps.get(name)}')
          PY

          git fetch origin "refs/heads/$AUTH_BRANCH:refs/remotes/origin/$AUTH_BRANCH"
          test "$(git rev-parse origin/$AUTH_BRANCH)" = "$AUTH_HEAD"
          mapfile -t PARENTS < <(git cat-file -p "$AUTH_HEAD" | sed -n 's/^parent //p')
          test "${#PARENTS[@]}" = 1
          test "${PARENTS[0]}" = "$AUTH_PARENT"
          if git ls-remote --exit-code --heads origin "$DISPATCH_BRANCH" >/dev/null 2>&1; then echo 'dispatch branch already exists' >&2; exit 1; fi

          gh api "repos/$GITHUB_REPOSITORY/pulls/$AUTH_PR" > dispatch-evidence/authorization-pr.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$AUTH_REVIEW_RUN" > dispatch-evidence/authorization-review-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$AUTH_REVIEW_ARTIFACT" > dispatch-evidence/authorization-review-artifact.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > dispatch-evidence/issue60-pages.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/avps-v2-science.yml/runs?event=workflow_dispatch&per_page=100" > dispatch-evidence/science-run-pages.json
          python - <<'PY'
          import json,os
          p=json.load(open('dispatch-evidence/authorization-pr.json'))
          if p['number']!=604 or p['state']!='open' or p['draft'] is not True or p['merged_at'] is not None or p['head']['sha']!=os.environ['AUTH_HEAD'] or p['base']['sha']!=os.environ['AUTH_PARENT']: raise SystemExit('authorization PR drift')
          r=json.load(open('dispatch-evidence/authorization-review-run.json'))
          if r['id']!=int(os.environ['AUTH_REVIEW_RUN']) or r['head_sha']!=os.environ['AUTH_HEAD'] or r['run_attempt']!=1 or r['conclusion']!='success': raise SystemExit('authorization review drift')
          a=json.load(open('dispatch-evidence/authorization-review-artifact.json'))
          if a['id']!=int(os.environ['AUTH_REVIEW_ARTIFACT']) or a.get('digest')!=os.environ['AUTH_REVIEW_DIGEST'] or a.get('expired'): raise SystemExit('authorization review artifact drift')
          pages=json.load(open('dispatch-evidence/issue60-pages.json')); bodies=[str(c.get('body') or '').strip() for p in pages for c in p]
          if sum(b==os.environ['ALLOCATION_MARKER'] for b in bodies)!=1: raise SystemExit('allocation marker cardinality drift')
          if sum(b.startswith(os.environ['CONSUMED_MARKER']) for b in bodies)!=0: raise SystemExit('consumed marker already exists')
          pages=json.load(open('dispatch-evidence/science-run-pages.json')); runs=[r for p in pages for r in p.get('workflow_runs',[])]
          if runs: raise SystemExit(f'candidate science run already exists: {[r.get("id") for r in runs]}')
          PY

          git ls-files -z > dispatch-evidence/tracked-files.nul
          python - <<'PY'
          import importlib.util,json,sys
          from pathlib import Path
          p=Path('review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/seed_ledger.py')
          s=importlib.util.spec_from_file_location('avps_v2_recovery_seed',p); m=importlib.util.module_from_spec(s); sys.modules[s.name]=m; s.loader.exec_module(m)
          x=m.validate_ledger()
          if x.get('candidateSeedCount')!=72 or x.get('candidateSeedCanonicalSha256')!='02f624d582e9b2caba6b920d65a5e8a8bc8fc1a2693623bc2f73abf5d3f706d2': raise SystemExit('candidate seed identity drift')
          Path('dispatch-evidence/candidate-seed-ledger.json').write_text(json.dumps(x,indent=2,sort_keys=True)+'\n')
          Path('dispatch-evidence/empty-self-ledger-policy.json').write_text(json.dumps({'schemaVersion':2,'requiredTrackedSelfLedgerPaths':[],'futureEvidenceSelfLedgerPaths':[]},indent=2,sort_keys=True)+'\n')
          PY
          python review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/tracked_tree_seed_scan.py --repo-root . --file-list dispatch-evidence/tracked-files.nul --candidate-seed-ledger dispatch-evidence/candidate-seed-ledger.json --allow-self-ledger-json dispatch-evidence/empty-self-ledger-policy.json --output dispatch-evidence/tracked-seed-scan.json
          python review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/repository_global_seed_scan.py --repository "$GITHUB_REPOSITORY" --issue-number 60 --candidate-seed-ledger dispatch-evidence/candidate-seed-ledger.json --current-run-id "$GITHUB_RUN_ID" --audit-mode authorization-recheck --expected-branch-name "$RECOVERY_ACTIVATION_BRANCH" --expected-repo-head "$GITHUB_SHA" --output dispatch-evidence/repository-global-seed-scan.json
          python - <<'PY'
          import json
          t=json.load(open('dispatch-evidence/tracked-seed-scan.json')); g=json.load(open('dispatch-evidence/repository-global-seed-scan.json'))
          if t.get('trackedTreeExternalCollisionCount')!=0: raise SystemExit('tracked seed collision')
          if g.get('repositoryGlobalCollisionCount',g.get('collisionCount'))!=0: raise SystemExit('repository-global seed collision')
          PY

          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/aerosol-vertical-profile-sensitivity-v2-science-workflow-v1-review.yml/runs?event=pull_request&per_page=100" > dispatch-evidence/implementation-review-pages.json
          python - <<'PY'
          import json
          pages=json.load(open('dispatch-evidence/implementation-review-pages.json')); runs=[r for p in pages for r in p.get('workflow_runs',[])]
          good=[r for r in runs if int(r.get('run_attempt') or 0)==1 and r.get('status')=='completed' and r.get('conclusion')=='success']
          if not good: raise SystemExit('no successful attempt-1 AVPS v2 workflow implementation review')
          json.dump(good,open('dispatch-evidence/implementation-review-candidates.json','w'),indent=2)
          PY
          MATCHED=''
          for RID in $(python -c "import json; print(' '.join(str(x['id']) for x in json.load(open('dispatch-evidence/implementation-review-candidates.json'))))"); do
            rm -rf dispatch-evidence/review-artifact
            mkdir dispatch-evidence/review-artifact
            if gh run download "$RID" -n avps-v2-science-workflow-v1-review -D dispatch-evidence/review-artifact >/dev/null 2>&1; then
              if python - <<'PY'
          import hashlib,json
          from pathlib import Path
          hits=list(Path('dispatch-evidence/review-artifact').rglob('review-receipt.json'))
          if len(hits)!=1: raise SystemExit(1)
          r=json.load(open(hits[0]))
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          if r.get('status')!='PASS_SOLVER_FREE_SCIENCE_WORKFLOW_AND_ZERO_RUNTIME_PUBLISHER_REVIEW_DISPATCH_NOT_CREATED': raise SystemExit(1)
          if r.get('scienceWorkflowSha256')!=sha('.github/workflows/avps-v2-science.yml'): raise SystemExit(1)
          if r.get('publisherWorkflowSha256')!=sha('.github/workflows/avps-v2-dispatch-publisher.yml'): raise SystemExit(1)
          PY
              then MATCHED="$RID"; break; fi
            fi
          done
          test -n "$MATCHED"
          export MATCHED
          echo "review_run=$MATCHED" >> "$GITHUB_OUTPUT"

          python - <<'PY'
          import json,os
          from pathlib import Path
          out={'schemaVersion':1,'status':'RECOVERY1_PRE_DISPATCH_FENCE_PASS_ZERO_RUNTIME','scientificOrdinal':41,'executionKey':os.environ['EXECUTION_KEY'],'authorizationHead':os.environ['AUTH_HEAD'],'authorizationParent':os.environ['AUTH_PARENT'],'authorizationPr':604,'dispatchBranch':os.environ['DISPATCH_BRANCH'],'candidateSeedCanonicalSha256':os.environ['CANDIDATE_SEED_SHA256'],'implementationReviewRun':int(os.environ['MATCHED']),'originalFailedPublisherRun':int(os.environ['ORIGINAL_PUBLISHER_RUN']),'scientificRuntimeSetupPerformed':False,'scientificExecutionPerformed':False,'solverExecutionPerformed':False,'dispatchCreated':False}
          Path('dispatch-evidence/pre-dispatch-fence.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY

      - name: Create exact dispatch ref and consumed marker once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$DISPATCH_BRANCH" -f sha="$AUTH_HEAD" > dispatch-evidence/ref-create.json
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$DISPATCH_BRANCH" --jq .object.sha)" = "$AUTH_HEAD"
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/60/comments" -f body="$CONSUMED_MARKER" > dispatch-evidence/consumed-comment.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > dispatch-evidence/post-comments-pages.json
          python - <<'PY'
          import json,os
          pages=json.load(open('dispatch-evidence/post-comments-pages.json')); bodies=[str(c.get('body') or '').strip() for p in pages for c in p]
          if sum(b==os.environ['ALLOCATION_MARKER'] for b in bodies)!=1: raise SystemExit('post-dispatch allocation cardinality drift')
          if sum(b.startswith(os.environ['CONSUMED_MARKER']) for b in bodies)!=1: raise SystemExit('post-dispatch consumed cardinality drift')
          PY
          python - <<'PY'
          import json,os
          from pathlib import Path
          out={'schemaVersion':1,'status':'RECOVERY1_DISPATCH_PUBLISHED_ZERO_RUNTIME','scientificOrdinal':41,'executionKey':os.environ['EXECUTION_KEY'],'authorizationHead':os.environ['AUTH_HEAD'],'authorizationParent':os.environ['AUTH_PARENT'],'authorizationPr':604,'dispatchBranch':os.environ['DISPATCH_BRANCH'],'dispatchBranchHeadSha':os.environ['AUTH_HEAD'],'workflowRunAttempt':1,'originalFailedPublisherRun':int(os.environ['ORIGINAL_PUBLISHER_RUN']),'scientificRuntimeSetupPerformed':False,'scientificExecutionPerformed':False,'solverExecutionPerformed':False,'consumedMarkerPosted':True,'scienceDispatchRequested':False}
          Path('dispatch-evidence/dispatch-publisher.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY

      - name: Upload zero-runtime recovery publisher evidence before science dispatch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: avps-v2-dispatch-publisher-recovery1-ordinal-41
          path: dispatch-evidence/
          if-no-files-found: error
          compression-level: 0

      - name: Explicitly dispatch exact science workflow from main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PAYLOAD='{"ref":"main","inputs":{"dispatch_ref":"dispatch/aerosol-vertical-profile-sensitivity-v2-ordinal-41"}}'
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/avps-v2-science.yml/dispatches" --input - <<< "$PAYLOAD"
