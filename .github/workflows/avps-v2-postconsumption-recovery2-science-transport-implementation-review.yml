name: Review AVPS v2 recovery2 native seed transport implementation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-postconsumption-recovery2-science-transport-implementation-review.yml
      - review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-science-transport-v1/IMPLEMENTATION.md
      - review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-science-transport-v1/native_authorization_seed_transport.py

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: avps-v2-recovery2-native-seed-transport-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_BASE: 09f3fbdefea6dd5ce68fdc0010347e5bfb28ff75
      SOURCE_MAIN: 09f3fbdefea6dd5ce68fdc0010347e5bfb28ff75
      SOURCE_PARENT: b5784f0b9dd98a84b9798f6419229c1bf915b2b3
      SOURCE_LEDGER_PATH: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-seed-freshness-v1/seed_ledger.py
      SOURCE_LEDGER_BLOB: d4bdc95e9ed576fa6c70711c81d8097ddab33dbf
      CANDIDATE_SEED_SHA256: 38c074fe01bd6d09fa7dc78af1ad323e2f42b606ca992c2950b8fc1f5b343a9f
      CANDIDATE_ROWS_SHA256: a88b28dcfaaeb354f294d1705a0f8ddbcd061083f277a038ab8c9dace44d9954
      HISTORICAL_HEAD: e627a689ada0493a8a5b9cdafc4aba0198fbabec
      HISTORICAL_BRANCH: authorization/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery1-ordinal-42
      HISTORICAL_LEDGER_PATH: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-seed-freshness-v1/seed_ledger.py
      HISTORICAL_LEDGER_BLOB: 491d1b6653bea0fcc5275269723a76aa1af52300
      FAILED_RUN: '33259899524'
      FAILED_JOB: '99119933393'
      PRESERVED_RECOVERY1_SCIENCE_BLOB: 7af7f28269ad245b1b9218012707957b048a6875
      PRESERVED_RECOVERY1_SCIENCE_SHA256: 04a178e0cc777e0fc090c8bfc6175ad10b4bec56c6f12048428382ea36217878
      HELPER: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-science-transport-v1/native_authorization_seed_transport.py

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Bind exact additive mechanical scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "${{ github.event.pull_request.base.sha }}" = "$EXPECTED_BASE"
          test "${{ github.event.pull_request.base.ref }}" = main
          test "${{ github.event.pull_request.head.ref }}" = review/avps-v2-recovery2-native-seed-transport-implementation-v1
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git diff --name-only "$EXPECTED_BASE"...HEAD | sort > changed-paths.txt
          cat > expected-paths.txt <<'EOF'
          .github/workflows/avps-v2-postconsumption-recovery2-science-transport-implementation-review.yml
          review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-science-transport-v1/IMPLEMENTATION.md
          review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-science-transport-v1/native_authorization_seed_transport.py
          EOF
          sort -o expected-paths.txt expected-paths.txt
          diff -u expected-paths.txt changed-paths.txt
          python -m py_compile "$HELPER"
          test "$(git hash-object .github/workflows/avps-v2-postconsumption-recovery1-science.yml)" = "$PRESERVED_RECOVERY1_SCIENCE_BLOB"
          test "$(sha256sum .github/workflows/avps-v2-postconsumption-recovery1-science.yml | awk '{print $1}')" = "$PRESERVED_RECOVERY1_SCIENCE_SHA256"

      - name: Reprove consumed ordinal 42 stopped before runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p review-evidence
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RUN" > review-evidence/failed-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RUN/jobs" > review-evidence/failed-jobs.json
          python - <<'PY'
          import json, os
          run=json.load(open('review-evidence/failed-run.json'))
          jobs=json.load(open('review-evidence/failed-jobs.json')).get('jobs',[])
          if run.get('id')!=int(os.environ['FAILED_RUN']) or run.get('run_attempt')!=1 or run.get('conclusion')!='failure': raise SystemExit('consumed run identity drift')
          hits=[j for j in jobs if j.get('id')==int(os.environ['FAILED_JOB'])]
          if len(hits)!=1 or hits[0].get('name')!='preflight' or hits[0].get('conclusion')!='failure': raise SystemExit('consumed preflight identity drift')
          steps={s.get('name'):s.get('conclusion') for s in hits[0].get('steps',[])}
          if steps.get('Prove exact one-use dispatch and authorization identity before runtime')!='success': raise SystemExit('one-use identity gate drift')
          if steps.get('Fresh repository-global candidate-seed recheck and one-use guard')!='failure': raise SystemExit('expected relocated-ledger failure not preserved')
          for name in ('Recover immutable validated four-species profile bytes','Build exact four 90-case matrices in memory','Acquire and hash-bind exact OPAC archive once','Persist pre-solver guard, profiles and exact OPAC bytes'):
              if steps.get(name)!='skipped': raise SystemExit(f'ordinal42 crossed pre-runtime boundary: {name}={steps.get(name)!r}')
          for job in jobs:
              if str(job.get('name') or '').startswith('cases-dep') and job.get('conclusion')!='skipped': raise SystemExit(f'case job unexpectedly executed: {job.get("name")}')
          PY

      - name: Exercise native-path transport and refusal path
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/$HISTORICAL_BRANCH:refs/remotes/origin/$HISTORICAL_BRANCH"
          test "$(git rev-parse origin/$HISTORICAL_BRANCH)" = "$HISTORICAL_HEAD"
          rm -rf "$RUNNER_TEMP/avps-native-transport-review"
          python "$HELPER" \
            --repo-root . \
            --authorization-head "$SOURCE_MAIN" \
            --authorization-parent "$SOURCE_PARENT" \
            --authorization-ledger-path "$SOURCE_LEDGER_PATH" \
            --authorization-ledger-blob "$SOURCE_LEDGER_BLOB" \
            --candidate-seed-sha256 "$CANDIDATE_SEED_SHA256" \
            --candidate-rows-sha256 "$CANDIDATE_ROWS_SHA256" \
            --historical-head "$HISTORICAL_HEAD" \
            --historical-ledger-path "$HISTORICAL_LEDGER_PATH" \
            --historical-ledger-blob "$HISTORICAL_LEDGER_BLOB" \
            --work-root "$RUNNER_TEMP/avps-native-transport-review" \
            --output-ledger review-evidence/candidate-ledger.json \
            --output-context review-evidence/native-context.json
          python - <<'PY'
          import json, os
          x=json.load(open('review-evidence/native-context.json'))
          if x.get('status')!='PASS_NATIVE_AUTHORIZATION_SEED_TRANSPORT_NO_RELOCATION': raise SystemExit('native transport status drift')
          if x.get('authorizationLedgerValidatedAtNativePath') is not True or x.get('historicalDependencyValidatedAtNativePath') is not True: raise SystemExit('native worktree proof missing')
          if x.get('relocatedBeforeValidation') is not False: raise SystemExit('ledger relocation occurred')
          if x.get('candidateSeedCanonicalSha256')!=os.environ['CANDIDATE_SEED_SHA256'] or x.get('candidateRowsCanonicalSha256')!=os.environ['CANDIDATE_ROWS_SHA256']: raise SystemExit('candidate identity drift')
          if x.get('scientificRuntimeSetupPerformed') or x.get('solverExecutionPerformed') or x.get('resultOpeningPerformed'): raise SystemExit('review crossed runtime boundary')
          PY

          set +e
          python "$HELPER" \
            --repo-root . \
            --authorization-head "$SOURCE_MAIN" \
            --authorization-parent "$SOURCE_PARENT" \
            --authorization-ledger-path "../relocated-seed-ledger.py" \
            --authorization-ledger-blob "$SOURCE_LEDGER_BLOB" \
            --candidate-seed-sha256 "$CANDIDATE_SEED_SHA256" \
            --candidate-rows-sha256 "$CANDIDATE_ROWS_SHA256" \
            --historical-head "$HISTORICAL_HEAD" \
            --historical-ledger-path "$HISTORICAL_LEDGER_PATH" \
            --historical-ledger-blob "$HISTORICAL_LEDGER_BLOB" \
            --work-root "$RUNNER_TEMP/avps-native-transport-refusal" \
            --output-ledger review-evidence/forbidden-ledger.json \
            --output-context review-evidence/forbidden-context.json \
            >review-evidence/relocation-refusal.stdout 2>review-evidence/relocation-refusal.stderr
          rc=$?
          set -e
          test "$rc" -ne 0
          test ! -e review-evidence/forbidden-ledger.json
          test ! -e review-evidence/forbidden-context.json
          grep -F "seed-ledger path must be repository-relative" review-evidence/relocation-refusal.stderr

      - name: Freeze solver-free implementation receipt
        shell: bash
        run: |
          set -euo pipefail
          cp changed-paths.txt review-evidence/
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          helper=Path(os.environ['HELPER'])
          out={
            'schemaVersion':1,
            'status':'PASS_AVPS_V2_RECOVERY2_NATIVE_SEED_TRANSPORT_IMPLEMENTATION_SOLVER_FREE',
            'sourceMain':os.environ['SOURCE_MAIN'],
            'failedConsumedOrdinal':42,
            'failedRun':int(os.environ['FAILED_RUN']),
            'failedJob':int(os.environ['FAILED_JOB']),
            'helperGitBlobSha1':subprocess.check_output(['git','hash-object',str(helper)],text=True).strip(),
            'helperSha256':hashlib.sha256(helper.read_bytes()).hexdigest(),
            'nativeAuthorizationLedgerValidationProven':True,
            'nativeHistoricalDependencyValidationProven':True,
            'relocatedPathRefusalProven':True,
            'recovery1ScienceWorkflowPreserved':True,
            'scientificDesignChanged':False,
            'authorizationAllocated':False,
            'dispatchCreated':False,
            'scientificRuntimeSetupPerformed':False,
            'solverExecutionPerformed':False,
            'resultOpeningPerformed':False,
            'levelBAdmissionPerformed':False,
            'protectedHoldoutOpened':False,
            'taylorOrJerusalemUsed':False,
            'productionChanged':False,
            'freshPostMergeSeedAndPreauthorizationReviewRequired':True,
          }
          Path('review-evidence/implementation-review-receipt.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: avps-v2-recovery2-native-seed-transport-implementation-review
          path: review-evidence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
