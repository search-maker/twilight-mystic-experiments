name: AVPS v2 postconsumption recovery2 science transport review

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/avps-v2-postconsumption-recovery2-science-transport-review.yml'
      - 'review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-science-transport-v1/PROTOCOL.md'

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: avps-v2-postconsumption-recovery2-science-transport-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  solver-free-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_BASE: 83fa106956d003b087ac4d13f9d4200fc8a42bf2
      FAILED_RUN: '33259899524'
      FAILED_JOB: '99119933393'
      CONSUMED_MARKER: ORDINAL42_AVPS_V2_POSTCONSUMPTION_RECOVERY1_DISPATCH_CONSUMED
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prove additive protocol-only recovery review surface
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "${{ github.event.pull_request.base.sha }}" = "$EXPECTED_BASE"
          git diff --name-only "$EXPECTED_BASE"..."${{ github.event.pull_request.head.sha }}" | sort > changed-paths.txt
          cat > expected-paths.txt <<'EOF'
          .github/workflows/avps-v2-postconsumption-recovery2-science-transport-review.yml
          review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-science-transport-v1/PROTOCOL.md
          EOF
          sort -o expected-paths.txt expected-paths.txt
          diff -u expected-paths.txt changed-paths.txt

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RUN" > failed-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RUN/jobs" > failed-jobs.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > issue60-pages.json

          python - <<'PY'
          import json, os
          from pathlib import Path
          run=json.load(open('failed-run.json'))
          if run.get('id')!=int(os.environ['FAILED_RUN']) or run.get('run_attempt')!=1 or run.get('event')!='workflow_dispatch' or run.get('status')!='completed' or run.get('conclusion')!='failure':
              raise SystemExit('failed run identity/state drift')
          jobs=json.load(open('failed-jobs.json')).get('jobs',[])
          hits=[j for j in jobs if j.get('id')==int(os.environ['FAILED_JOB'])]
          if len(hits)!=1 or hits[0].get('name')!='preflight' or hits[0].get('conclusion')!='failure':
              raise SystemExit('failed preflight job identity/state drift')
          steps={s.get('name'):s.get('conclusion') for s in hits[0].get('steps',[])}
          if steps.get('Prove exact one-use dispatch and authorization identity before runtime')!='success':
              raise SystemExit('identity gate was not successful')
          if steps.get('Fresh repository-global candidate-seed recheck and one-use guard')!='failure':
              raise SystemExit('expected seed recheck failure not preserved')
          for name in ('Recover immutable validated four-species profile bytes','Build exact four 90-case matrices in memory','Acquire and hash-bind exact OPAC archive once','Persist pre-solver guard, profiles and exact OPAC bytes'):
              if steps.get(name)!='skipped':
                  raise SystemExit(f'ordinal42 crossed pre-runtime boundary: {name}={steps.get(name)!r}')
          for j in jobs:
              if str(j.get('name','')).startswith('cases-dep') and j.get('conclusion')!='skipped':
                  raise SystemExit(f'case job unexpectedly ran: {j.get("name")}={j.get("conclusion")}')
          pages=json.load(open('issue60-pages.json'))
          bodies=[str(c.get('body') or '').strip() for page in pages for c in page]
          if sum(b.startswith(os.environ['CONSUMED_MARKER']) for b in bodies)!=1:
              raise SystemExit('ordinal42 consumed marker cardinality drift')
          protocol=Path('review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-science-transport-v1/PROTOCOL.md').read_text()
          required=(
              'run `33259899524`, attempt 1',
              'job: `99119933393`',
              'native path in a detached authorization-head worktree',
              'never GitHub Re-run/retry/resume run `33259899524`',
              'fresh repository-global seed ledger',
              'dynamically verified next unused global scientific ordinal',
              '360 cases total',
              '20,000,000 photon histories per case',
              'resultOpeningAuthorized=false',
              'productionAuthorized=false',
          )
          # job spelling in protocol is contextual rather than key-value; tolerate the prose form below.
          if 'Failed preflight job: `99119933393`' not in protocol:
              raise SystemExit('protocol missing failed job identity')
          for token in required:
              if token == 'job: `99119933393`':
                  continue
              if token not in protocol:
                  raise SystemExit(f'protocol missing invariant: {token}')
          forbidden=('ordinal 42 is reusable','reuse ordinal 42','GitHub Re-run run `33259899524`','Taylor/Jerusalem residual use is allowed')
          for token in forbidden:
              if token in protocol:
                  raise SystemExit(f'forbidden recovery claim: {token}')
          PY

      - name: Record solver-free review receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p review-evidence
          cp changed-paths.txt failed-run.json failed-jobs.json review-evidence/
          python - <<'PY'
          import json, os
          from pathlib import Path
          out={
            'schemaVersion':1,
            'status':'PASS_AVPS_V2_POSTCONSUMPTION_RECOVERY2_SCIENCE_TRANSPORT_PROTOCOL_SOLVER_FREE',
            'failedRun':int(os.environ['FAILED_RUN']),
            'failedJob':int(os.environ['FAILED_JOB']),
            'ordinal42Consumed':True,
            'scientificRuntimePerformed':False,
            'solverExecutionPerformed':False,
            'resultOpeningPerformed':False,
            'levelBAdmissionPerformed':False,
            'productionPerformed':False,
            'freshIdentityRequired':True,
            'freshSeedsRequired':True,
            'dynamicNextOrdinalRequired':True,
          }
          Path('review-evidence/review-receipt.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: avps-v2-postconsumption-recovery2-science-transport-review
          path: review-evidence/
          if-no-files-found: error
          compression-level: 0
