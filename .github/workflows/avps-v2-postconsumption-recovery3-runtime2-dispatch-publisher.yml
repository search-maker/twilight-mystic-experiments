name: AVPS v2 recovery3 ordinal44 runtime2 dispatch publisher
run-name: AVPS v2 postconsumption recovery3 runtime2 ordinal 44 zero-runtime dispatch publisher

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: avps-v2-postconsumption-recovery3-runtime2-ordinal-44-dispatch-publisher
  cancel-in-progress: false

env:
  AUTH_BRANCH: authorization/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-ordinal-44
  AUTH_HEAD: dd3a4c692af505389e9feb1e5f5480fa389110a3
  AUTH_PARENT: d8cd4af807e7a8f11ed39fdc579ed92adf866aab
  AUTH_PR: '718'
  AUTH_REVIEW_RUN: '33319037610'
  AUTH_REVIEW_ARTIFACT: '9734515864'
  AUTH_REVIEW_DIGEST: sha256:bfef625ebb0a45f8a59e38cb46b64ded9e7d9f3fcbb895355144a3af5044eed7
  DISPATCH_BRANCH: dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-ordinal-44
  EXECUTION_KEY: aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3:numerical:44
  ALLOCATION_MARKER: ORDINAL44_AVPS_V2_POSTCONSUMPTION_RECOVERY3_AUTHORIZATION_ALLOCATED_REVIEWED_NOT_DISPATCHED commit=dd3a4c692af505389e9feb1e5f5480fa389110a3 parent=d8cd4af807e7a8f11ed39fdc579ed92adf866aab pr=718
  CONSUMED_MARKER: ORDINAL44_AVPS_V2_POSTCONSUMPTION_RECOVERY3_DISPATCH_CONSUMED
  CANDIDATE_SEED_SHA256: d2817b1ea4f2bdc8cb1842e565b099b015e4e28c5874482629fadc450069d9bf
  CANDIDATE_ROWS_SHA256: b6a519eadacdb99ea53c52d483c8acfeba05829643cb988de21682a53fc47896
  AUTH_SEED_LEDGER_PATH: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-seed-freshness-v1/seed_ledger.py
  AUTH_SEED_LEDGER_BLOB: a4fc0b95c3627a310c0c17a1ae8b89701511b3b8
  NATIVE_SEED_HELPER_PATH: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-science-transport-v1/native_authorization_seed_transport.py
  NATIVE_SEED_HELPER_BLOB: 2df2c3fd1ffa78e16f44e6825d67b3e82e903c1e
  HISTORICAL_AUTH_BRANCH: authorization/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery1-ordinal-42
  HISTORICAL_HEAD: e627a689ada0493a8a5b9cdafc4aba0198fbabec
  HISTORICAL_SEED_LEDGER_PATH: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-seed-freshness-v1/seed_ledger.py
  HISTORICAL_SEED_LEDGER_BLOB: 491d1b6653bea0fcc5275269723a76aa1af52300
  PACKAGE_REVIEW_WORKFLOW: avps-v2-recovery3-ordinal44-runtime2-publication-review.yml
  PACKAGE_REVIEW_ARTIFACT: avps-v2-recovery3-ordinal44-runtime2-publication-review

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Fresh zero-runtime pre-dispatch fence
        id: fence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -s .github/workflows/avps-v2-postconsumption-recovery3-runtime2-science.yml
          test -s .github/workflows/avps-v2-postconsumption-recovery3-runtime2-dispatch-publisher.yml
          mkdir -p dispatch-evidence
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          Path('dispatch-evidence/implementation-bytes.json').write_text(json.dumps({'scienceWorkflowSha256':sha('.github/workflows/avps-v2-postconsumption-recovery3-runtime2-science.yml'),'publisherWorkflowSha256':sha('.github/workflows/avps-v2-postconsumption-recovery3-runtime2-dispatch-publisher.yml')},indent=2,sort_keys=True)+'\n')
          PY
          git fetch origin "refs/heads/$AUTH_BRANCH:refs/remotes/origin/$AUTH_BRANCH"
          test "$(git rev-parse origin/$AUTH_BRANCH)" = "$AUTH_HEAD"
          mapfile -t PARENTS < <(git cat-file -p "$AUTH_HEAD" | sed -n 's/^parent //p')
          test "${#PARENTS[@]}" = 1
          test "${PARENTS[0]}" = "$AUTH_PARENT"
          if git ls-remote --exit-code --heads origin "$DISPATCH_BRANCH" >/dev/null 2>&1; then echo 'dispatch branch already exists' >&2; exit 1; fi

          gh api "repos/$GITHUB_REPOSITORY/pulls/$AUTH_PR" > dispatch-evidence/authorization-pr.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$AUTH_REVIEW_RUN" > dispatch-evidence/authorization-review-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$AUTH_REVIEW_ARTIFACT" > dispatch-evidence/authorization-review-artifact.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > dispatch-evidence/issue60-pages.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/avps-v2-postconsumption-recovery3-runtime2-science.yml/runs?event=workflow_dispatch&per_page=100" > dispatch-evidence/science-run-pages.json
          python - <<'PY'
          import json,os
          p=json.load(open('dispatch-evidence/authorization-pr.json'))
          if p['number']!=718 or p['state']!='open' or p['draft'] is not True or p['merged_at'] is not None or p['head']['sha']!=os.environ['AUTH_HEAD'] or p['base']['sha']!=os.environ['AUTH_PARENT']: raise SystemExit('authorization PR drift')
          r=json.load(open('dispatch-evidence/authorization-review-run.json'))
          if r['id']!=int(os.environ['AUTH_REVIEW_RUN']) or r['head_sha']!=os.environ['AUTH_HEAD'] or r['run_attempt']!=1 or r['conclusion']!='success': raise SystemExit('authorization review drift')
          a=json.load(open('dispatch-evidence/authorization-review-artifact.json'))
          if a['id']!=int(os.environ['AUTH_REVIEW_ARTIFACT']) or a.get('digest')!=os.environ['AUTH_REVIEW_DIGEST'] or a.get('expired'): raise SystemExit('authorization review artifact drift')
          pages=json.load(open('dispatch-evidence/issue60-pages.json')); bodies=[str(c.get('body') or '').strip() for p in pages for c in p]
          if sum(b==os.environ['ALLOCATION_MARKER'] for b in bodies)!=1: raise SystemExit('allocation marker cardinality drift')
          if sum(b.startswith(os.environ['CONSUMED_MARKER']) for b in bodies)!=0: raise SystemExit('consumed marker already exists')
          pages=json.load(open('dispatch-evidence/science-run-pages.json')); runs=[r for p in pages for r in p.get('workflow_runs',[])]
          if runs: raise SystemExit(f'candidate science run already exists: {[r.get("id") for r in runs]}')
          PY

          git ls-files -z > dispatch-evidence/tracked-files.nul
          test "$(git rev-parse HEAD:$NATIVE_SEED_HELPER_PATH)" = "$NATIVE_SEED_HELPER_BLOB"
          git fetch origin "refs/heads/$HISTORICAL_AUTH_BRANCH:refs/remotes/origin/$HISTORICAL_AUTH_BRANCH"
          test "$(git rev-parse origin/$HISTORICAL_AUTH_BRANCH)" = "$HISTORICAL_HEAD"
          python "$NATIVE_SEED_HELPER_PATH" \
            --repo-root . \
            --authorization-head "$AUTH_HEAD" \
            --authorization-parent "$AUTH_PARENT" \
            --authorization-ledger-path "$AUTH_SEED_LEDGER_PATH" \
            --authorization-ledger-blob "$AUTH_SEED_LEDGER_BLOB" \
            --candidate-seed-sha256 "$CANDIDATE_SEED_SHA256" \
            --candidate-rows-sha256 "$CANDIDATE_ROWS_SHA256" \
            --historical-head "$HISTORICAL_HEAD" \
            --historical-ledger-path "$HISTORICAL_SEED_LEDGER_PATH" \
            --historical-ledger-blob "$HISTORICAL_SEED_LEDGER_BLOB" \
            --work-root dispatch-evidence/native-seed-transport \
            --output-ledger dispatch-evidence/candidate-seed-ledger.json \
            --output-context dispatch-evidence/native-seed-context.json
          python - <<'PY'
          import json
          from pathlib import Path
          Path('dispatch-evidence/empty-self-ledger-policy.json').write_text(json.dumps({'schemaVersion':2,'requiredTrackedSelfLedgerPaths':[],'futureEvidenceSelfLedgerPaths':[]},indent=2,sort_keys=True)+'\n')
          PY
          python review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/tracked_tree_seed_scan.py --repo-root . --file-list dispatch-evidence/tracked-files.nul --candidate-seed-ledger dispatch-evidence/candidate-seed-ledger.json --allow-self-ledger-json dispatch-evidence/empty-self-ledger-policy.json --output dispatch-evidence/tracked-seed-scan.json
          python review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/repository_global_seed_scan.py --repository "$GITHUB_REPOSITORY" --issue-number 60 --candidate-seed-ledger dispatch-evidence/candidate-seed-ledger.json --current-run-id "$GITHUB_RUN_ID" --audit-mode authorization-recheck --expected-branch-name main --expected-repo-head "$GITHUB_SHA" --output dispatch-evidence/repository-global-seed-scan.json
          python - <<'PY'
          import json
          t=json.load(open('dispatch-evidence/tracked-seed-scan.json')); g=json.load(open('dispatch-evidence/repository-global-seed-scan.json'))
          if t.get('trackedTreeExternalCollisionCount')!=0: raise SystemExit('tracked seed collision')
          if g.get('repositoryGlobalCollisionCount',g.get('collisionCount'))!=0: raise SystemExit('repository-global seed collision')
          PY

          PYTHONPATH=experiments/aerosol-vertical-profile-sensitivity-v1 python - <<'PY'
          import json,os
          from pathlib import Path
          import preauthorization_surface, global_ordinal
          payload=preauthorization_surface.collect(os.environ['GITHUB_REPOSITORY'],os.environ['GITHUB_TOKEN'])
          latest=preauthorization_surface.latest_consumed_or_dispatched_ordinal(payload)
          observations=global_ordinal.authoritative_global_ordinal_observations(payload,current_run_id=int(os.environ['GITHUB_RUN_ID']))
          ordinals=sorted({int(row['ordinal']) for row in observations})
          if latest!=43: raise SystemExit(f'latest consumed/dispatched global ordinal drift: {latest}')
          if not ordinals or max(ordinals)!=44: raise SystemExit(f'global ordinal surface drift: {ordinals[-10:]}')
          bodies=[str(c.get('body') or '').strip() for c in payload.get('issue60Comments',[])]
          if sum(b==os.environ['ALLOCATION_MARKER'] for b in bodies)!=1: raise SystemExit('ordinal44 allocation marker cardinality drift in global surface')
          if sum(b.startswith(os.environ['CONSUMED_MARKER']) for b in bodies)!=0: raise SystemExit('ordinal44 consumed marker already exists in global surface')
          Path('dispatch-evidence/global-ordinal-observations.json').write_text(json.dumps(observations,indent=2,sort_keys=True)+'\n')
          Path('dispatch-evidence/global-ordinal-recheck.json').write_text(json.dumps({'schemaVersion':1,'status':'PASS_GLOBAL_ORDINAL44_ALLOCATED_NOT_CONSUMED_PRE_DISPATCH','latestConsumedOrDispatchedScientificOrdinal':latest,'maxObservedScientificOrdinal':max(ordinals),'candidateScientificOrdinal':44},indent=2,sort_keys=True)+'\n')
          PY

          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/$PACKAGE_REVIEW_WORKFLOW/runs?event=pull_request&per_page=100" > dispatch-evidence/package-review-pages.json
          python - <<'PY'
          import json
          pages=json.load(open('dispatch-evidence/package-review-pages.json')); runs=[r for p in pages for r in p.get('workflow_runs',[])]
          good=[r for r in runs if int(r.get('run_attempt') or 0)==1 and r.get('status')=='completed' and r.get('conclusion')=='success']
          if not good: raise SystemExit('no successful attempt-1 recovery3 ordinal44 execution-package review')
          json.dump(good,open('dispatch-evidence/package-review-candidates.json','w'),indent=2)
          PY
          MATCHED=''
          for RID in $(python -c "import json; print(' '.join(str(x['id']) for x in json.load(open('dispatch-evidence/package-review-candidates.json'))))"); do
            rm -rf dispatch-evidence/package-review-artifact; mkdir dispatch-evidence/package-review-artifact
            if gh run download "$RID" -n "$PACKAGE_REVIEW_ARTIFACT" -D dispatch-evidence/package-review-artifact >/dev/null 2>&1; then
              if python - <<'PY'
          import json,subprocess
          from pathlib import Path
          hits=list(Path('dispatch-evidence/package-review-artifact').rglob('review-receipt.json'))
          if len(hits)!=1: raise SystemExit(1)
          r=json.load(open(hits[0]))
          science_blob=subprocess.check_output(['git','hash-object','.github/workflows/avps-v2-postconsumption-recovery3-runtime2-science.yml'],text=True).strip()
          publisher_blob=subprocess.check_output(['git','hash-object','.github/workflows/avps-v2-postconsumption-recovery3-runtime2-dispatch-publisher.yml'],text=True).strip()
          trigger_blob=subprocess.check_output(['git','hash-object','.github/workflows/avps-v2-postconsumption-recovery3-runtime2-publisher-trigger-bridge.yml'],text=True).strip()
          if r.get('status')!='PASS_AVPS_V2_RECOVERY3_ORDINAL44_RUNTIME2_PUBLICATION_REVIEW_ZERO_RUNTIME' or r.get('mode')!='publication' or r.get('authorizationHead')!='dd3a4c692af505389e9feb1e5f5480fa389110a3' or r.get('authorizationParent')!='d8cd4af807e7a8f11ed39fdc579ed92adf866aab' or r.get('authorizationPr')!=718: raise SystemExit(1)
          if r.get('scienceBlob')!=science_blob or r.get('publisherBlob')!=publisher_blob or r.get('triggerBlob')!=trigger_blob: raise SystemExit(1)
          if r.get('scientificOrdinal')!=44 or r.get('solverExecutionPerformed') is not False or r.get('dispatchCreated') is not False: raise SystemExit(1)
          PY
              then MATCHED="$RID"; break; fi
            fi
          done
          test -n "$MATCHED"
          export MATCHED
          echo "review_run=$MATCHED" >> "$GITHUB_OUTPUT"

          python - <<'PY'
          import json,os
          from pathlib import Path
          out={'schemaVersion':1,'status':'PRE_DISPATCH_FENCE_PASS_ZERO_RUNTIME','scientificOrdinal':44,'executionKey':os.environ['EXECUTION_KEY'],'authorizationHead':os.environ['AUTH_HEAD'],'authorizationParent':os.environ['AUTH_PARENT'],'authorizationPr':718,'dispatchBranch':os.environ['DISPATCH_BRANCH'],'candidateSeedCanonicalSha256':os.environ['CANDIDATE_SEED_SHA256'],'implementationReviewRun':int(os.environ['MATCHED']),'scientificRuntimeSetupPerformed':False,'scientificExecutionPerformed':False,'solverExecutionPerformed':False,'dispatchCreated':False}
          Path('dispatch-evidence/pre-dispatch-fence.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY

      - name: Acquire snapshot fence, bootstrap once, dispatch science, observe exact guard step, and release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dispatch-evidence
          FENCE_BEGIN=0
          FENCE_CLOSED=0
          SCIENCE_RUN=0
          PREFLIGHT_JOB=0
          STEP_CONCLUSION=not_observed
          FENCE_TOKEN="AVPS_V2_RECOVERY3_ORDINAL44_SNAPSHOT_${GITHUB_RUN_ID}"

          close_fence() {
            if [ "$FENCE_BEGIN" = 0 ] || [ "$FENCE_CLOSED" = 1 ]; then return 0; fi
            local observed_at body
            observed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            body="WRITE_QUIET_END begin=$FENCE_BEGIN token=$FENCE_TOKEN authorization=$AUTH_HEAD dispatch=$DISPATCH_BRANCH science_run=$SCIENCE_RUN preflight_job=$PREFLIGHT_JOB guard=repository-global-candidate-seed-recheck step_conclusion=$STEP_CONCLUSION observed_at=$observed_at"
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/60/comments" -f body="$body" > dispatch-evidence/write-quiet-end.json
            FENCE_CLOSED=1
          }
          trap 'rc=$?; trap - EXIT; if [ "$FENCE_BEGIN" != 0 ] && [ "$FENCE_CLOSED" != 1 ]; then STEP_CONCLUSION="publisher_exit_${rc}"; close_fence || true; fi; exit "$rc"' EXIT

          # Last live-ledger/main check before acquiring the short-lived fence.
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          if git ls-remote --exit-code --heads origin "$DISPATCH_BRANCH" >/dev/null 2>&1; then
            echo 'dispatch branch appeared after pre-dispatch review' >&2
            exit 1
          fi
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > dispatch-evidence/pre-begin-comments.json
          python - <<'PY'
          import json, os, re
          pages=json.load(open('dispatch-evidence/pre-begin-comments.json'))
          comments=[c for page in pages for c in page]
          not_admissible=5470658421
          prefix='AVPS_V2_RECOVERY3_ORDINAL44_RUNTIME2_EXECUTION_PACKAGE_CORRECTED_ADMISSIBLE'
          corrected=[c for c in comments if int(c.get('id') or 0)>not_admissible and str(c.get('body') or '').strip().startswith(prefix)]
          if len(corrected)!=1: raise SystemExit(f'exactly one post-invalidation corrected-admissible marker required, got {len(corrected)}')
          corrected_id=int(corrected[0]['id'])
          open_begins={}
          for c in comments:
              cid=int(c.get('id') or 0)
              if cid<=corrected_id: continue
              body=str(c.get('body') or '').strip()
              if body.startswith('WRITE_QUIET_BEGIN '):
                  open_begins[cid]=body
              elif body.startswith('WRITE_QUIET_END '):
                  m=re.search(r'\bbegin=(\d+)\b',body)
                  if not m: raise SystemExit(f'new WRITE_QUIET_END lacks begin binding: {cid}')
                  open_begins.pop(int(m.group(1)),None)
          if open_begins: raise SystemExit(f'unmatched WRITE_QUIET_BEGIN after corrected-admissible marker: {sorted(open_begins)}')
          blockers=('NOT_ADMISSIBLE','DO NOT USE','FAIL-CLOSED','CLOSED')
          for c in comments:
              cid=int(c.get('id') or 0)
              if cid<=corrected_id: continue
              upper=str(c.get('body') or '').upper()
              relevant=('AVPS' in upper or 'ORDINAL44' in upper or 'ORDINAL 44' in upper or 'RECOVERY3' in upper)
              superseding=('SUPERSED' in upper or ('COORDINATOR' in upper and 'RECOVERY' in upper))
              if relevant and (any(x in upper for x in blockers) or superseding):
                  raise SystemExit(f'newer relevant fail-closed/closure/recovery directive: {cid}')
          PY

          BEGIN_BODY="WRITE_QUIET_BEGIN token=$FENCE_TOKEN authorization=$AUTH_HEAD dispatch=$DISPATCH_BRANCH expected_science_workflow=avps-v2-postconsumption-recovery3-runtime2-science.yml publisher_run=$GITHUB_RUN_ID"
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/60/comments" -f body="$BEGIN_BODY" > dispatch-evidence/write-quiet-begin.json
          FENCE_BEGIN=$(python -c "import json; print(json.load(open('dispatch-evidence/write-quiet-begin.json'))['id'])")
          test "$FENCE_BEGIN" -gt 0

          # Bootstrap writes are the only intentional repository mutations while the fence is held.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$DISPATCH_BRANCH" -f sha="$AUTH_HEAD" > dispatch-evidence/ref-create.json
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$DISPATCH_BRANCH" --jq .object.sha)" = "$AUTH_HEAD"
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/60/comments" -f body="$CONSUMED_MARKER" > dispatch-evidence/consumed-comment.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > dispatch-evidence/post-bootstrap-comments.json
          python - <<'PY'
          import json,os
          pages=json.load(open('dispatch-evidence/post-bootstrap-comments.json')); bodies=[str(c.get('body') or '').strip() for p in pages for c in p]
          if sum(b==os.environ['ALLOCATION_MARKER'] for b in bodies)!=1: raise SystemExit('post-bootstrap allocation cardinality drift')
          if sum(b.startswith(os.environ['CONSUMED_MARKER']) for b in bodies)!=1: raise SystemExit('post-bootstrap consumed cardinality drift')
          PY

          PAYLOAD='{"ref":"main","inputs":{"dispatch_ref":"dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-ordinal-44"}}'
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/avps-v2-postconsumption-recovery3-runtime2-science.yml/dispatches" --input - <<< "$PAYLOAD"

          # Resolve exactly one attempt-1 science run on the publisher's exact main head.
          for attempt in $(seq 1 120); do
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/avps-v2-postconsumption-recovery3-runtime2-science.yml/runs?event=workflow_dispatch&branch=main&per_page=20" > dispatch-evidence/science-runs.json
            set +e
            SCIENCE_RUN=$(python - <<'PY'
          import json,os,sys
          rows=json.load(open('dispatch-evidence/science-runs.json')).get('workflow_runs',[])
          good=[r for r in rows if r.get('head_sha')==os.environ['GITHUB_SHA'] and int(r.get('run_attempt') or 0)==1 and os.environ['DISPATCH_BRANCH'] in str(r.get('display_title') or '')]
          if len(good)>1: raise SystemExit(f'multiple matching science runs: {[r.get("id") for r in good]}')
          if not good: sys.exit(2)
          print(good[0]['id'])
          PY
            )
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then break; fi
            if [ "$rc" -ne 2 ]; then exit "$rc"; fi
            if [ "$attempt" -eq 120 ]; then echo 'science run not created within bounded 10-minute wait' >&2; exit 1; fi
            sleep 5
          done
          test "$SCIENCE_RUN" -gt 0

          # Remain read-only until the exact repository-global guard step is terminal.
          for attempt in $(seq 1 360); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SCIENCE_RUN/jobs?per_page=100" > dispatch-evidence/science-jobs.json
            set +e
            STATE=$(python - <<'PY'
          import json,sys
          jobs=json.load(open('dispatch-evidence/science-jobs.json')).get('jobs',[])
          pre=[j for j in jobs if j.get('name')=='preflight']
          if len(pre)>1: raise SystemExit('multiple preflight jobs')
          if not pre:
              print('WAIT'); sys.exit(2)
          job=pre[0]
          hits=[s for s in (job.get('steps') or []) if s.get('name')=='Fresh repository-global candidate-seed recheck and one-use guard']
          if len(hits)>1: raise SystemExit('multiple repository-global guard steps')
          if hits and hits[0].get('status')=='completed':
              print(f"TERMINAL {job['id']} {hits[0].get('conclusion') or 'unknown'}"); sys.exit(0)
          if job.get('status')=='completed':
              print(f"TERMINAL {job['id']} guard_step_missing"); sys.exit(0)
          print('WAIT'); sys.exit(2)
          PY
            )
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              read -r tag PREFLIGHT_JOB STEP_CONCLUSION <<< "$STATE"
              test "$tag" = TERMINAL
              break
            fi
            if [ "$rc" -ne 2 ]; then exit "$rc"; fi
            if [ "$attempt" -eq 360 ]; then echo 'guard step not terminal within bounded 30-minute wait' >&2; exit 1; fi
            sleep 5
          done

          close_fence
          trap - EXIT

          # Durable readback: exactly one END must bind this BEGIN and exact science run.
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > dispatch-evidence/post-end-comments.json
          python - <<'PY'
          import json,os
          begin=json.load(open('dispatch-evidence/write-quiet-begin.json'))
          end=json.load(open('dispatch-evidence/write-quiet-end.json'))
          pages=json.load(open('dispatch-evidence/post-end-comments.json')); comments=[c for p in pages for c in p]
          bid=str(begin['id']); eid=int(end['id'])
          hits=[]
          for c in comments:
              body=str(c.get('body') or '').strip()
