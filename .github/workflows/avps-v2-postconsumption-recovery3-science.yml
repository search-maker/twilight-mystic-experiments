          r={'schemaVersion':1,'status':'PASS_FROZEN_BASE_ARCHIVE_AND_FOUR_ALIAS_RUNTIME_IDENTITIES','uvspecSha256':os.environ['UVSPEC_SHA256'],'baseDataTreeSha256':base['libRadtranDataTreeSha256'],'archiveStagedDataTreeSha256':'5d8bbf8e6b91ec3d405dee36f21a94afbb6e5ec6cd67da2dd5dd541738199d80','fourAliasDataTreeSha256':os.environ['FOUR_ALIAS_SHA256'],'afglSha256':'dab26290ed81c762ed0c607e5dc2d53393c1462a0c3a528bc5e3f5935191cfb5','scientificSolverExecuted':False}
          Path('runtime-report.json').write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
