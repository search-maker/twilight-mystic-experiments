name: AVPS v2 scientific execution
run-name: AVPS v2 postconsumption recovery4 ordinal 45 | ${{ inputs.dispatch_ref }}

on:
  workflow_dispatch:
    inputs:
      dispatch_ref:
        description: Exact frozen AVPS v2 dispatch branch
        required: true
        type: string

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: avps-v2-postconsumption-recovery4-ordinal-45-science
  cancel-in-progress: false

env:
  AUTH_BRANCH: authorization/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-ordinal-45
  AUTH_HEAD: 6e095b4b1603c90dcee0943295909b30cd1b374d
  AUTH_PARENT: 5685d5c313071014a94c816ee26b129f1f17a7fc
  AUTH_PR: '774'
  AUTH_REVIEW_RUN: '33368601918'
  AUTH_REVIEW_ARTIFACT: '9749469156'
  AUTH_REVIEW_DIGEST: sha256:1d7d8d62f5372b989a9bbb2b9546598de4dac350adeb4c00db4712420be5e751
  DISPATCH_BRANCH: dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-ordinal-45
  EXECUTION_KEY: aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4:numerical:45
  ALLOCATION_MARKER: ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_AUTHORIZATION_ALLOCATED_REVIEWED_NOT_DISPATCHED commit=6e095b4b1603c90dcee0943295909b30cd1b374d parent=5685d5c313071014a94c816ee26b129f1f17a7fc pr=774
  CONSUMED_MARKER: ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_DISPATCH_CONSUMED
  CANDIDATE_SEED_SHA256: ddded6b2d170ca2fac8d498bdba2887446c16995df0880d948fb2be00870b3de
  CANDIDATE_ROWS_SHA256: c439de417520b330c037e2628df02b6955f652563300aa5ef30477abf7661a98
  AUTH_SEED_LEDGER_PATH: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-seed-global-control-v1/seed_ledger.py
  AUTH_SEED_LEDGER_BLOB: 16af5c68ae7e3cfc0cfbef4c8e2022517bf2ae91
  NATIVE_SEED_HELPER_PATH: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-science-transport-v1/native_authorization_seed_transport.py
  NATIVE_SEED_HELPER_BLOB: 2df2c3fd1ffa78e16f44e6825d67b3e82e903c1e
  HISTORICAL_AUTH_BRANCH: authorization/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery1-ordinal-42
  HISTORICAL_HEAD: e627a689ada0493a8a5b9cdafc4aba0198fbabec
  HISTORICAL_SEED_LEDGER_PATH: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-seed-freshness-v1/seed_ledger.py
  HISTORICAL_SEED_LEDGER_BLOB: 491d1b6653bea0fcc5275269723a76aa1af52300
  FOUR_ALIAS_SHA256: 5e1814dd36cf861fd85477a97607299248f8272268df7bf428d31bbb6aa4354a
  UVSPEC_SHA256: 2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3
  OPAC_SHA256: 11daa1f1f4be0fd4ddf7e881ec2005498049674a1540d37b4b1e8f5e16052c7e
  OPAC_SIZE: '743391266'
  RENDERER_RUN: '33193123594'
  RENDERER_ARTIFACT: '9694613680'
  RENDERER_DIGEST: sha256:5e6942d879326ffc2dc8805d7649086cae32ad2e16aeec19a62cd3b0a89e3e27
  RUNTIME_DIR: runtime-avps-v2-recovery4-ordinal45-v1
  RUNTIME_ADAPTER_PATH: runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py
  EXECUTOR_PATH: runtime-avps-v2-recovery4-ordinal45-v1/executor.py
  AGGREGATOR_PATH: runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      matrix2: ${{ steps.matrices.outputs.matrix2 }}
      matrix4: ${{ steps.matrices.outputs.matrix4 }}
      matrix6: ${{ steps.matrices.outputs.matrix6 }}
      matrix8: ${{ steps.matrices.outputs.matrix8 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Prove exact one-use dispatch and authorization identity before runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_INPUT: ${{ inputs.dispatch_ref }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$DISPATCH_INPUT" = "$DISPATCH_BRANCH"
          test "$GITHUB_REF_NAME" = main
          git fetch origin "refs/heads/$DISPATCH_BRANCH:refs/remotes/origin/$DISPATCH_BRANCH" "refs/heads/$AUTH_BRANCH:refs/remotes/origin/$AUTH_BRANCH"
          test "$(git rev-parse origin/$DISPATCH_BRANCH)" = "$AUTH_HEAD"
          test "$(git rev-parse origin/$AUTH_BRANCH)" = "$AUTH_HEAD"
          mapfile -t PARENTS < <(git cat-file -p "$AUTH_HEAD" | sed -n 's/^parent //p')
          test "${#PARENTS[@]}" = 1
          test "${PARENTS[0]}" = "$AUTH_PARENT"
          test "$(git rev-parse "$AUTH_HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-authorization-control-v1/authorization.json")" = 96ee8299d00bd72cdb73de4583670730ce89c73b
          mkdir -p execution-preflight/profiles
          git show "$AUTH_HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-authorization-control-v1/authorization.json" > execution-preflight/authorization.json
          test "$(git hash-object execution-preflight/authorization.json)" = "96ee8299d00bd72cdb73de4583670730ce89c73b"

          gh api "repos/$GITHUB_REPOSITORY/pulls/$AUTH_PR" > execution-preflight/authorization-pr.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$AUTH_REVIEW_RUN" > execution-preflight/authorization-review-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$AUTH_REVIEW_ARTIFACT" > execution-preflight/authorization-review-artifact.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > execution-preflight/issue60-pages.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/avps-v2-postconsumption-recovery4-science.yml/runs?event=workflow_dispatch&per_page=100" > execution-preflight/science-run-pages.json
          python - <<'PY'
          import json,os
          p=json.load(open('execution-preflight/authorization-pr.json'))
          if p['number']!=774 or p['state']!='open' or p['draft'] is not True or p['merged_at'] is not None: raise SystemExit('authorization PR state drift')
          if p['head']['sha']!=os.environ['AUTH_HEAD'] or p['base']['sha']!=os.environ['AUTH_PARENT']: raise SystemExit('authorization PR identity drift')
          r=json.load(open('execution-preflight/authorization-review-run.json'))
          if r['id']!=int(os.environ['AUTH_REVIEW_RUN']) or r['head_sha']!=os.environ['AUTH_HEAD'] or r['run_attempt']!=1 or r['status']!='completed' or r['conclusion']!='success': raise SystemExit('authorization review drift')
          a=json.load(open('execution-preflight/authorization-review-artifact.json'))
          if a['id']!=int(os.environ['AUTH_REVIEW_ARTIFACT']) or a.get('digest')!=os.environ['AUTH_REVIEW_DIGEST'] or a.get('expired'): raise SystemExit('authorization review artifact drift')
          pages=json.load(open('execution-preflight/issue60-pages.json')); comments=[c for page in pages for c in page]
          bodies=[str(c.get('body') or '').strip() for c in comments]
          if sum(b==os.environ['ALLOCATION_MARKER'] for b in bodies)!=1: raise SystemExit('allocation marker cardinality drift')
          if sum(b.startswith(os.environ['CONSUMED_MARKER']) for b in bodies)!=1: raise SystemExit('consumed marker cardinality drift')
          pages=json.load(open('execution-preflight/science-run-pages.json')); runs=[r for page in pages for r in page.get('workflow_runs',[])]
          prior=[r for r in runs if int(r.get('id') or 0)!=int(os.environ['GITHUB_RUN_ID'])]
          if prior: raise SystemExit(f'prior AVPS v2 science workflow_dispatch exists: {[r.get("id") for r in prior]}')
          auth=json.load(open('execution-preflight/authorization.json'))
          required={'scientificOrdinal':45,'executionKey':os.environ['EXECUTION_KEY'],'candidateSeedCanonicalSha256':os.environ['CANDIDATE_SEED_SHA256'],'caseCount':360,'commonRandomNumberGroupCount':72,'statesPerGroup':5,'photonHistoriesPerCase':20_000_000}
          for k,v in required.items():
              if auth.get(k)!=v: raise SystemExit(f'authorization drift {k}')
          if auth.get('resultOpeningAuthorized') is not False or auth.get('productionAuthorized') is not False: raise SystemExit('closed-result boundary drift')
          PY

      - name: Fresh repository-global candidate-seed recheck and one-use guard
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git ls-files -z > execution-preflight/tracked-files.nul
          test "$(git rev-parse HEAD:$NATIVE_SEED_HELPER_PATH)" = "$NATIVE_SEED_HELPER_BLOB"
          git fetch origin "refs/heads/$HISTORICAL_AUTH_BRANCH:refs/remotes/origin/$HISTORICAL_AUTH_BRANCH"
          test "$(git rev-parse origin/$HISTORICAL_AUTH_BRANCH)" = "$HISTORICAL_HEAD"
          python "$NATIVE_SEED_HELPER_PATH" \
            --repo-root . \
            --authorization-head "$AUTH_HEAD" \
            --authorization-parent "$AUTH_PARENT" \
            --authorization-ledger-path "$AUTH_SEED_LEDGER_PATH" \
            --authorization-ledger-blob "$AUTH_SEED_LEDGER_BLOB" \
            --candidate-seed-sha256 "$CANDIDATE_SEED_SHA256" \
            --candidate-rows-sha256 "$CANDIDATE_ROWS_SHA256" \
            --historical-head "$HISTORICAL_HEAD" \
            --historical-ledger-path "$HISTORICAL_SEED_LEDGER_PATH" \
            --historical-ledger-blob "$HISTORICAL_SEED_LEDGER_BLOB" \
            --work-root execution-preflight/native-seed-transport \
            --output-ledger execution-preflight/candidate-seed-ledger.json \
            --output-context execution-preflight/native-seed-context.json
          python - <<'PY'
          import json
          from pathlib import Path
          Path('execution-preflight/empty-self-ledger-policy.json').write_text(json.dumps({'schemaVersion':2,'requiredTrackedSelfLedgerPaths':[],'futureEvidenceSelfLedgerPaths':[]},indent=2,sort_keys=True)+'\n')
          PY
          python review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/tracked_tree_seed_scan.py \
            --repo-root . --file-list execution-preflight/tracked-files.nul \
            --candidate-seed-ledger execution-preflight/candidate-seed-ledger.json \
            --allow-self-ledger-json execution-preflight/empty-self-ledger-policy.json \
            --output execution-preflight/tracked-seed-scan.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > execution-preflight/pre-scan-issue60-pages.json
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          FENCE_PREFIX='AVPS_V2_RECOVERY4_ORDINAL45_SNAPSHOT_'
          WORKFLOW='avps-v2-postconsumption-recovery4-science.yml'
          EXECUTION_KEY='aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4:numerical:45'
          def fields(first):
              out={}
              for token in first.replace('|',' ').split():
                  if '=' in token:
                      k,v=token.split('=',1); out[k]=v
              return out
          pages=json.load(open('execution-preflight/pre-scan-issue60-pages.json'))
          comments=[c for page in pages for c in page]
          closed=set(); begins=[]
          for c in comments:
              body=str(c.get('body') or '').strip(); first=body.splitlines()[0] if body else ''
              f=fields(first)
              if first.startswith('WRITE_QUIET_END'):
                  end_ids=[]
                  for key in ('begin','beginComment','begin_comment'):
                      if key in f:
                          if not f[key].isdigit(): raise SystemExit(f'non-numeric WRITE_QUIET_END {key}: {f[key]!r}')
                          end_ids.append(int(f[key]))
                  distinct=set(end_ids)
                  if len(distinct)>1: raise SystemExit(f'conflicting WRITE_QUIET_END begin ids: {sorted(distinct)}')
                  if distinct: closed.add(next(iter(distinct)))
              if first.startswith('WRITE_QUIET_BEGIN'): begins.append((int(c['id']),f,str(c.get('created_at') or '')))
          unmatched=[b for b in begins if b[0] not in closed]
          matching=[b for b in unmatched if (
              b[1].get('token','').startswith(FENCE_PREFIX)
              and b[1].get('authorization')==os.environ['AUTH_HEAD']
              and b[1].get('dispatch')==os.environ['DISPATCH_BRANCH']
              and b[1].get('expected_science_workflow')==WORKFLOW
              and b[1].get('science_run')==str(os.environ['GITHUB_RUN_ID'])
              and b[1].get('execution_key')==EXECUTION_KEY)]
          if len(matching)!=1: raise SystemExit(f'exactly one matching unmatched pre-scan WRITE_QUIET_BEGIN required, got {len(matching)}')
          if [x[0] for x in unmatched] != [matching[0][0]]: raise SystemExit(f'unrelated unmatched WRITE_QUIET_BEGIN present: {[x[0] for x in unmatched]}')
          begin_id,f,created=matching[0]
          observed=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
          if not created: raise SystemExit('matching BEGIN created_at missing')
          begin_dt=datetime.fromisoformat(created.replace('Z','+00:00')); observed_dt=datetime.fromisoformat(observed.replace('Z','+00:00'))
          if begin_dt>observed_dt: raise SystemExit('matching BEGIN timestamp is after pre-scan observation')
          binding={'schemaVersion':1,'status':'BOUND_AVPS_V2_RECOVERY4_ORDINAL45_WRITE_QUIET_BEGIN_BEFORE_GLOBAL_SCAN','beginCommentId':begin_id,'fenceToken':f['token'],'authorizationHead':os.environ['AUTH_HEAD'],'dispatchBranch':os.environ['DISPATCH_BRANCH'],'scienceWorkflow':WORKFLOW,'scienceRunId':int(os.environ['GITHUB_RUN_ID']),'executionKey':EXECUTION_KEY,'beginCreatedAt':created,'bindingObservedAtUtc':observed,'beginWasUnmatchedAtBinding':True,'globalUnmatchedBeginCountAtBinding':1}
          Path('execution-preflight/pre-scan-fence-binding.json').write_text(json.dumps(binding,indent=2,sort_keys=True)+'\n')
          Path('execution-preflight/repository-global-seed-scan-started-at.txt').write_text(datetime.now(timezone.utc).isoformat().replace('+00:00','Z')+'\n')
          PY
          python review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/repository_global_seed_scan.py \
            --repository "$GITHUB_REPOSITORY" --issue-number 60 \
            --candidate-seed-ledger execution-preflight/candidate-seed-ledger.json \
            --current-run-id "$GITHUB_RUN_ID" --audit-mode authorization-recheck \
            --expected-branch-name main --expected-repo-head "$GITHUB_SHA" \
            --output execution-preflight/repository-global-seed-scan.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          t=json.load(open('execution-preflight/tracked-seed-scan.json')); g=json.load(open('execution-preflight/repository-global-seed-scan.json'))
          if t.get('trackedTreeExternalCollisionCount')!=0: raise SystemExit('tracked-tree candidate seed collision')
          collision=g.get('repositoryGlobalCollisionCount',g.get('collisionCount'))
          if collision!=0: raise SystemExit(f'repository-global candidate seed collision: {collision}')
          binding=json.load(open('execution-preflight/pre-scan-fence-binding.json'))
          scan_started=Path('execution-preflight/repository-global-seed-scan-started-at.txt').read_text().strip()
          from datetime import datetime, timezone
          begin_dt=datetime.fromisoformat(binding['beginCreatedAt'].replace('Z','+00:00')); scan_start_dt=datetime.fromisoformat(scan_started.replace('Z','+00:00'))
          if scan_start_dt<begin_dt: raise SystemExit('repository-global scan start predates bound BEGIN')
          scan_done=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
          scan_bytes=Path('execution-preflight/repository-global-seed-scan.json').read_bytes()
          scan_sha=__import__('hashlib').sha256(scan_bytes).hexdigest()
          guard={
            'schemaVersion':1,'status':'EXACT_ONE_USE_AVPS_V2_POSTCONSUMPTION_RECOVERY4_DISPATCH_AUTHORIZED','scientificOrdinal':45,
            'executionKey':os.environ['EXECUTION_KEY'],'authorizationHead':os.environ['AUTH_HEAD'],'authorizationPr':774,
            'dispatchBranch':os.environ['DISPATCH_BRANCH'],'dispatchBranchHeadSha':os.environ['AUTH_HEAD'],
            'workflowRunId':int(os.environ['GITHUB_RUN_ID']),'workflowRunAttempt':1,
            'allocationMarkerCount':1,'consumedMarkerCount':1,
            'candidateSeedCanonicalSha256':os.environ['CANDIDATE_SEED_SHA256'],
            'preSolverRepositoryGlobalSeedRecheckPassed':True,'fourAliasDataTreeSha256':os.environ['FOUR_ALIAS_SHA256'],
            'writeQuietBeginCommentId':binding['beginCommentId'],'writeQuietFenceToken':binding['fenceToken'],
            'writeQuietBeginCreatedAt':binding['beginCreatedAt'],'writeQuietBindingObservedAtUtc':binding['bindingObservedAtUtc'],
            'repositoryGlobalSeedScanStartedAtUtc':scan_started,'repositoryGlobalSeedScanCompletedAtUtc':scan_done,
            'repositoryGlobalSeedScanSha256':scan_sha,'preSolverWriteQuietBoundBeforeGlobalScan':True,
            'releaseMustUsePreflightBoundBeginOnly':True,
            'solverExecutionPermittedNow':True,'githubRerun':False,'retryAllowed':False,'resumeAllowed':False,
            'scientificRuntimeSetupPerformed':False,'solverExecutionPerformed':False,
          }
          Path('execution-preflight/execution-guard.json').write_text(json.dumps(guard,indent=2,sort_keys=True)+'\n')
          PY

      - name: Recover immutable validated four-species profile bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$RENDERER_ARTIFACT" > execution-preflight/renderer-artifact.json
          python - <<'PY'
          import json,os
          a=json.load(open('execution-preflight/renderer-artifact.json'))
          if a['id']!=int(os.environ['RENDERER_ARTIFACT']) or a.get('digest')!=os.environ['RENDERER_DIGEST'] or a.get('expired'): raise SystemExit('renderer artifact identity drift')
          if a.get('workflow_run',{}).get('id')!=int(os.environ['RENDERER_RUN']): raise SystemExit('renderer run binding drift')
          PY
          rm -rf renderer-evidence
          gh run download "$RENDERER_RUN" -n avps-four-species-renderer-validation-v1 -D renderer-evidence
          python - <<'PY'
          import hashlib,shutil
          from pathlib import Path
          expected={
            'opac-profile-continental-average':'ceed598f7681951cd0e6208b267beb5b41a52ab10311f37ce76f925700caff3d',
            'opac-profile-maritime-clean':'487b67bd7dbe89d12d032fdf2b33cab545e16a2e0697170648317f1a76362a67',
            'opac-profile-desert':'2b4d2e03c6ae3143d9bb05d2da49f57f75172dc1f24d34f7d4a4939bf9952fef',
            'opac-profile-arctic':'98f2fa5428c830764252fd0a2662b0f5c957fc027ffcb7bdc0a5e500dfd7d3d6',
            'opac-profile-antarctic':'ee063c6dca68cf9a31d8bb9d993f1fed5cb34c8bb056ac180c97171b5d6b4f19',
          }
          for state,want in expected.items():
              hits=list(Path('renderer-evidence').rglob(state+'.four-species.dat'))
              if len(hits)!=1: raise SystemExit(f'{state}: expected one validated profile, got {len(hits)}')
              b=hits[0].read_bytes(); got=hashlib.sha256(b).hexdigest()
              if got!=want: raise SystemExit(f'{state}: validated profile hash drift')
              shutil.copyfile(hits[0],Path('execution-preflight/profiles')/(state+'.four-species.dat'))
          PY

      - name: Build exact four 90-case matrices in memory
        id: matrices
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util,json,os,sys
          from pathlib import Path
          p=Path(os.environ['RUNTIME_ADAPTER_PATH'])
          spec=importlib.util.spec_from_file_location('avps_v2_science_adapter',p); m=importlib.util.module_from_spec(spec); sys.modules[spec.name]=m; spec.loader.exec_module(m)
          auth=json.load(open('execution-preflight/authorization.json')); cases=m.authorized_case_universe(auth)
          if len(cases)!=360: raise SystemExit('authorized case count drift')
          by={2:[],4:[],6:[],8:[]}
          for c in cases:
              dep=int(round(float(c['sunDepressionDeg'])))
              if dep not in by: raise SystemExit(f'unexpected solar depression {dep}')
              by[dep].append({'caseId':c['caseId']})
          if any(len(v)!=90 for v in by.values()): raise SystemExit(f'90-case shard cardinality drift: { {k:len(v) for k,v in by.items()} }')
          if len({x['caseId'] for v in by.values() for x in v})!=360: raise SystemExit('matrix case uniqueness drift')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              for dep in (2,4,6,8): f.write(f'matrix{dep}='+json.dumps({'include':sorted(by[dep],key=lambda x:x['caseId'])},separators=(',',':'))+'\n')
          PY

      - name: Acquire and hash-bind exact OPAC archive once
        shell: bash
        env:
          SOURCE_URL: https://www.libradtran.org/lib/exe/fetch.php?media=download%3Aoptprop_v2.1.tar.gz
        run: |
          set -euo pipefail
          OUT=execution-preflight/optprop_v2.1.tar.gz
          curl -L --fail --retry 3 --retry-all-errors --max-time 2700 -o "$OUT" "$SOURCE_URL"
          test "$(stat -c %s "$OUT")" = "$OPAC_SIZE"
          printf '%s  %s\n' "$OPAC_SHA256" "$OUT" | sha256sum -c -

      - name: Persist pre-solver guard, profiles and exact OPAC bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: avps-v2-postconsumption-recovery4-preflight-ordinal-45
          path: execution-preflight/
          if-no-files-found: error
          compression-level: 0

  snapshot-fence-release:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download exact current-run preflight guard and bound pre-scan fence evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p snapshot-fence-release/preflight
          gh run download "$GITHUB_RUN_ID" -n avps-v2-postconsumption-recovery4-preflight-ordinal-45 -D snapshot-fence-release/preflight
          test -s snapshot-fence-release/preflight/execution-guard.json
          test -s snapshot-fence-release/preflight/pre-scan-fence-binding.json
          python - <<'PY'
          import json, os
          g=json.load(open('snapshot-fence-release/preflight/execution-guard.json'))
          b=json.load(open('snapshot-fence-release/preflight/pre-scan-fence-binding.json'))
          required={'status':'EXACT_ONE_USE_AVPS_V2_POSTCONSUMPTION_RECOVERY4_DISPATCH_AUTHORIZED','scientificOrdinal':45,'workflowRunId':int(os.environ['GITHUB_RUN_ID']),'workflowRunAttempt':1,'authorizationHead':os.environ['AUTH_HEAD'],'dispatchBranch':os.environ['DISPATCH_BRANCH'],'preSolverRepositoryGlobalSeedRecheckPassed':True,'preSolverWriteQuietBoundBeforeGlobalScan':True,'releaseMustUsePreflightBoundBeginOnly':True}
          for k,v in required.items():
              if g.get(k)!=v: raise SystemExit(f'preflight execution guard drift {k}: {g.get(k)!r} != {v!r}')
          if g.get('writeQuietBeginCommentId')!=b.get('beginCommentId') or g.get('writeQuietFenceToken')!=b.get('fenceToken'): raise SystemExit('preflight guard/binding fence identity drift')
          if b.get('scienceRunId')!=int(os.environ['GITHUB_RUN_ID']): raise SystemExit('pre-scan fence binding run drift')
          PY

      - name: Verify only matching END for the exact pre-scan bound BEGIN
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > snapshot-fence-release/verify-bound-end.py <<'PY'
          import json, os, sys
          from datetime import datetime
          from pathlib import Path
          guard=json.load(open('snapshot-fence-release/preflight/execution-guard.json'))
          pages=json.load(open('snapshot-fence-release/issue60-pages.json'))
          comments=[c for page in pages for c in page]
          begin_id=int(guard['writeQuietBeginCommentId']); token=str(guard['writeQuietFenceToken'])
          ends=[]
          for c in comments:
              body=str(c.get('body') or '').strip(); first=body.splitlines()[0] if body else ''
              if not first.startswith('WRITE_QUIET_END'): continue
              fields={}
              for item in first.replace('|',' ').split():
                  if '=' in item:
                      k,v=item.split('=',1); fields[k]=v
              end_ids=[]
              for key in ('begin','beginComment','begin_comment'):
                  if key in fields:
                      if not fields[key].isdigit(): raise SystemExit(f'non-numeric WRITE_QUIET_END {key}: {fields[key]!r}')
                      end_ids.append(int(fields[key]))
              distinct=set(end_ids)
              if len(distinct)>1: raise SystemExit(f'conflicting WRITE_QUIET_END begin ids: {sorted(distinct)}')
              if distinct and next(iter(distinct))==begin_id: ends.append((int(c['id']),fields,str(c.get('created_at') or '')))
          if not ends: sys.exit(2)
          if len(ends)!=1: raise SystemExit(f'exactly one matching END for pre-scan bound BEGIN required, got {len(ends)}')
          end_id,end_fields,created=ends[0]
          required={'token':token,'authorization':os.environ['AUTH_HEAD'],'dispatch':os.environ['DISPATCH_BRANCH'],'science_run':str(os.environ['GITHUB_RUN_ID']),'guard':'repository-global-candidate-seed-recheck','step_conclusion':'success'}
          for k,v in required.items():
              if end_fields.get(k)!=v: raise SystemExit(f'WRITE_QUIET_END field drift {k}: {end_fields.get(k)!r} != {v!r}')
          if not created: raise SystemExit('matching END created_at missing')
          end_dt=datetime.fromisoformat(created.replace('Z','+00:00'))
          scan_done=datetime.fromisoformat(str(guard['repositoryGlobalSeedScanCompletedAtUtc']).replace('Z','+00:00'))
          if end_dt<scan_done: raise SystemExit('matching END predates completed pre-scan-bound repository-global guard')
          out={'schemaVersion':1,'status':'PASS_AVPS_V2_RECOVERY4_SNAPSHOT_FENCE_RELEASE_BEFORE_SOLVER','beginCommentId':begin_id,'endCommentId':end_id,'fenceToken':token,'authorizationHead':os.environ['AUTH_HEAD'],'dispatchBranch':os.environ['DISPATCH_BRANCH'],'scienceRunId':int(os.environ['GITHUB_RUN_ID']),'guardStepConclusion':'success','releaseUsesPreflightBoundBeginOnly':True,'solverExecutionPermittedAfterBarrier':True}
          Path('snapshot-fence-release/release-receipt.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
          for attempt in $(seq 1 120); do
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > snapshot-fence-release/issue60-pages.json
            set +e
            python snapshot-fence-release/verify-bound-end.py
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then break; fi
            if [ "$rc" -ne 2 ]; then exit "$rc"; fi
            if [ "$attempt" -eq 120 ]; then
              echo 'matching WRITE_QUIET_END for the pre-scan bound BEGIN not observed within bounded 10-minute barrier' >&2
              exit 1
            fi
            sleep 5
          done
          test -s snapshot-fence-release/release-receipt.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: avps-v2-recovery4-ordinal45-snapshot-fence-release
          path: snapshot-fence-release/release-receipt.json
          if-no-files-found: error
          compression-level: 0

  cases-dep2:
    needs: [preflight, snapshot-fence-release]
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix2) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps: &case_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: avps-v2
          create-args: -c conda-forge python=3.12.4 rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true
      - name: Download exact preflight artifact
        uses: actions/download-artifact@v4
        with:
          name: avps-v2-postconsumption-recovery4-preflight-ordinal-45
          path: preflight
      - name: Stage frozen runtime and execute exactly one preregistered AVPS v2 case
        shell: micromamba-shell {0}
        env:
          CASE_ID: ${{ matrix.caseId }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test -s preflight/execution-guard.json
          test "$(git rev-parse HEAD:$EXECUTOR_PATH)" = 7dc38e31c19701b1a1ceef300d75105cff179290
          test -s preflight/authorization.json
          test "$(stat -c %s preflight/optprop_v2.1.tar.gz)" = "$OPAC_SIZE"
          printf '%s  %s\n' "$OPAC_SHA256" preflight/optprop_v2.1.tar.gz | sha256sum -c -
          mkdir -p runtime-root/share/libRadtran case-output
          cp -a "$CONDA_PREFIX/share/libRadtran/data" runtime-root/share/libRadtran/data
          python experiments/mystic-batch-v1/runtime_probe.py --uvspec "$(command -v uvspec)" --data-dir "$CONDA_PREFIX/share/libRadtran/data" --atmosphere "$CONDA_PREFIX/share/libRadtran/data/atmmod/afglus.dat" --runtime-lock experiments/mystic-batch-v1/runtime-lock.micromamba.json --skip-help --output base-runtime.json
          PYTHONPATH=review/aerosol-vertical-profile-sensitivity-v2-control-v1 python - <<'PY'
          import json
          from pathlib import Path
          import runtime_stage
          s=runtime_stage.stage_frozen_opac(Path('preflight/optprop_v2.1.tar.gz'),Path('runtime-root'))
          Path('stage-report.json').write_text(json.dumps(s,indent=2,sort_keys=True)+'\n')
          PY
          DATA="$GITHUB_WORKSPACE/runtime-root/share/libRadtran/data"
          python experiments/mystic-batch-v1/runtime_probe.py --uvspec "$(command -v uvspec)" --data-dir "$DATA" --atmosphere "$DATA/atmmod/afglus.dat" --runtime-lock experiments/mystic-batch-v1/runtime-lock.micromamba.json --skip-help --output post-runtime.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          base=json.load(open('base-runtime.json')); post=json.load(open('post-runtime.json'))
          if base.get('uvspecSha256')!=os.environ['UVSPEC_SHA256']: raise SystemExit('base executable identity drift')
          if post.get('uvspecSha256')!=os.environ['UVSPEC_SHA256'] or post.get('libRadtranDataTreeSha256')!=os.environ['FOUR_ALIAS_SHA256']: raise SystemExit('staged runtime identity drift')
          r={'schemaVersion':1,'status':'PASS_FROZEN_BASE_ARCHIVE_AND_FOUR_ALIAS_RUNTIME_IDENTITIES','uvspecSha256':os.environ['UVSPEC_SHA256'],'baseDataTreeSha256':base['libRadtranDataTreeSha256'],'archiveStagedDataTreeSha256':'5d8bbf8e6b91ec3d405dee36f21a94afbb6e5ec6cd67da2dd5dd541738199d80','fourAliasDataTreeSha256':os.environ['FOUR_ALIAS_SHA256'],'afglSha256':'dab26290ed81c762ed0c607e5dc2d53393c1462a0c3a528bc5e3f5935191cfb5','scientificSolverExecuted':False}
          Path('runtime-report.json').write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          PY
          PYTHONPATH="$RUNTIME_DIR" python - <<'PY'
          import os
          from pathlib import Path
          import executor
          out=executor.execute_case(
              Path('.'),Path('preflight/authorization.json'),Path('preflight/execution-guard.json'),Path('runtime-report.json'),Path('preflight/profiles'),os.environ['CASE_ID'],Path('runtime-root/share/libRadtran/data'),Path('case-output'),Path(os.environ['CONDA_PREFIX'])/'bin/uvspec',allow_execution=True)
          if out.get('status')!='COMPLETED': raise SystemExit('case did not complete')
          text=(Path('case-output')/os.environ['CASE_ID']/'case.inp').read_text()
          if 'aerosol_species_file profiles/' not in text or 'INSO WASO SOOT SUSO' not in text: raise SystemExit('explicit four-species transport missing')
          if any(line.startswith('aerosol_file ') for line in text.splitlines()): raise SystemExit('legacy transport detected')
          PY
      - name: Persist immutable AVPS v2 case evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: avps-v2-case-${{ matrix.caseId }}
          path: case-output/${{ matrix.caseId }}/
          if-no-files-found: error
          compression-level: 0

