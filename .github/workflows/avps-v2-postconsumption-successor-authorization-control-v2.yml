name: AVPS v2 postconsumption successor authorization control v2

on:
  pull_request:
    types: [opened]
    branches:
      - main
    paths:
      - .github/workflows/avps-v2-postconsumption-successor-authorization-control-v2.yml
      - review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-authorization-control-v2/authorization_control.py
      - review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-authorization-control-v2/authorization_control_core_v1.py

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: avps-v2-postconsumption-successor-authorization-control-v2-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  authorization-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CONTROL_DIR: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-authorization-control-v2
      CONTROL_BRANCH: review/avps-v2-postconsumption-successor-authorization-control-replacement-v2-20260909
      EXPECTED_BASE: 8cd85cf393e2d86a1b6d7325654747460a13e697
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Bind fresh bundled replacement event and zero-runtime boundary
        shell: bash
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$EVENT_ACTION" = opened
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$EVENT_BRANCH" = "$CONTROL_BRANCH"
          test "$EVENT_BASE_REF" = main
          test "$EVENT_BASE" = "$EXPECTED_BASE"
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test -z "$(command -v uvspec || true)"
          git merge-base --is-ancestor "$EXPECTED_BASE" "$EVENT_HEAD"
          test -z "$(git rev-list --merges "$EXPECTED_BASE..$EVENT_HEAD")"
          git diff --name-only "$EXPECTED_BASE...$EVENT_HEAD" | sort > /tmp/avps-control-changed-paths.txt
          python - <<'PY'
          from pathlib import Path
          expected = {
              '.github/workflows/avps-v2-postconsumption-successor-authorization-control-v2.yml',
              'review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-authorization-control-v2/authorization_control.py',
              'review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-authorization-control-v2/authorization_control_core_v1.py',
          }
          got = {x for x in Path('/tmp/avps-control-changed-paths.txt').read_text().splitlines() if x}
          if got != expected:
              raise SystemExit(f'exact three-path bundled authorization-control scope required; got {sorted(got)}')
          PY

      - name: Run NON_AUTHORIZING ACTUAL bundled executable stress
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE${PYTHONPATH:+:$PYTHONPATH}"
          python "$CONTROL_DIR/authorization_control.py" \
            --mode stress \
            --repository "$GITHUB_REPOSITORY" \
            --token "$GITHUB_TOKEN" \
            --pr "$EVENT_PR" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --event-name "$GITHUB_EVENT_NAME" \
            --event-action "$EVENT_ACTION" \
            --branch "$EVENT_BRANCH" \
            --head "$EVENT_HEAD" \
            --base "$EVENT_BASE" \
            --evidence-dir control-evidence

      - name: Require exact-head generic attempt1 CI and terminal siblings
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE${PYTHONPATH:+:$PYTHONPATH}"
          python "$CONTROL_DIR/authorization_control.py" \
            --mode await-generic \
            --repository "$GITHUB_REPOSITORY" \
            --token "$GITHUB_TOKEN" \
            --pr "$EVENT_PR" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --event-name "$GITHUB_EVENT_NAME" \
            --event-action "$EVENT_ACTION" \
            --branch "$EVENT_BRANCH" \
            --head "$EVENT_HEAD" \
            --base "$EVENT_BASE" \
            --evidence-dir control-evidence

      - name: Run protected repository-global authorization-control snapshot
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE${PYTHONPATH:+:$PYTHONPATH}"
          python "$CONTROL_DIR/authorization_control.py" \
            --mode control \
            --repository "$GITHUB_REPOSITORY" \
            --token "$GITHUB_TOKEN" \
            --pr "$EVENT_PR" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --event-name "$GITHUB_EVENT_NAME" \
            --event-action "$EVENT_ACTION" \
            --branch "$EVENT_BRANCH" \
            --head "$EVENT_HEAD" \
            --base "$EVENT_BASE" \
            --evidence-dir control-evidence

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vertical-profile-v2-postconsumption-successor-authorization-control-v2-proof
          path: control-evidence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
