name: Review AVPS v2 successor ordinal46 authorization replacement v2

on:
  pull_request:
    types: [opened]
    branches:
      - review/avps-v2-postconsumption-successor-ordinal46-authorization-child-v1-20260909
    paths:
      - .github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v2.yml
      - review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v2/review_authorization.py

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: avps-v2-successor-ordinal46-authorization-review-replacement-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  authorization-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout exact reviewer bytes into dedicated checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: review-infra
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact frozen PR1026 subject into dedicated checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: subject
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: ACTUAL two-checkout identity stress before protected scan
        shell: bash
        env:
          EXPECTED_SUBJECT_HEAD: 5028cb7c7cd585d720749f0d572aa15e2f614bf9
          EXPECTED_AUTH_BLOB: 3dd0f80ff878d09987a91af0b4860a449fd41a92
          EXPECTED_REVIEW_SCRIPT_BLOB: 896a01c01ec3f0b814e10a417cbad1d7b5b9ea01
          AUTH_PATH: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-authorization-control-v2/authorization.json
          REVIEW_SCRIPT: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v2/review_authorization.py
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "${{ github.event.pull_request.base.sha }}" = "$EXPECTED_SUBJECT_HEAD"
          test "$(git -C subject rev-parse HEAD)" = "$EXPECTED_SUBJECT_HEAD"
          test "$(git -C subject rev-parse HEAD:$AUTH_PATH)" = "$EXPECTED_AUTH_BLOB"
          test "$(git -C review-infra rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git -C review-infra rev-parse HEAD:$REVIEW_SCRIPT)" = "$EXPECTED_REVIEW_SCRIPT_BLOB"
          test "$(git -C subject rev-parse --show-toplevel)" != "$(git -C review-infra rev-parse --show-toplevel)"
          python -m py_compile "review-infra/$REVIEW_SCRIPT"
          printf '%s\n' 'EXACT_EXECUTABLE_STRESS_PASS two-checkout subject/reviewer Git identity fixture'

      - name: Run protected zero-runtime authorization-time review
        shell: bash
        working-directory: subject
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_REVIEW_SCRIPT_BLOB: 896a01c01ec3f0b814e10a417cbad1d7b5b9ea01
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "5028cb7c7cd585d720749f0d572aa15e2f614bf9"
          test "$(git rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-authorization-control-v2/authorization.json)" = "3dd0f80ff878d09987a91af0b4860a449fd41a92"
          test "$(git -C ../review-infra rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git -C ../review-infra rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v2/review_authorization.py)" = "$EXPECTED_REVIEW_SCRIPT_BLOB"
          python ../review-infra/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v2/review_authorization.py \
            --repo "$GITHUB_REPOSITORY" \
            --tok "$GITHUB_TOKEN" \
            --rpr "${{ github.event.pull_request.number }}" \
            --rh "${{ github.event.pull_request.head.sha }}" \
            --rb "${{ github.event.pull_request.head.ref }}" \
            --base "${{ github.event.pull_request.base.sha }}" \
            --bb "${{ github.event.pull_request.base.ref }}" \
            --run "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            --event "$GITHUB_EVENT_NAME" \
            --action "${{ github.event.action }}" \
            --ev avps-ordinal46-authorization-review-evidence

      - name: Upload authorization-time review proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v2-proof
          path: subject/avps-ordinal46-authorization-review-evidence/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90
