name: Review AVPS v2 successor ordinal46 authorization replacement v23

on:
  pull_request:
    types: [opened, edited]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v23.yml
      - review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v23/review_authorization.py

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read
  discussions: read

concurrency:
  group: avps-v2-successor-ordinal46-authorization-review-v23-${{ github.event.pull_request.head.sha }}-${{ github.event.action }}
  cancel-in-progress: false

env:
  EXPECTED_MAIN: 6cd7c075766fe0c86bc7561ec205a3f9120fd1fb
  EXPECTED_SUBJECT_HEAD: 5028cb7c7cd585d720749f0d572aa15e2f614bf9
  EXPECTED_AUTH_BLOB: 3dd0f80ff878d09987a91af0b4860a449fd41a92
  EXPECTED_WQ_PARSER_BLOB: 7628651c9ddf740669d1fedf8fb18887d7155fe6
  EXPECTED_REVIEW_SCRIPT_BLOB: 52dd4af0f78e7d8418669d98562a77584bc7ab31
  REVIEW_SCRIPT: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v23/review_authorization.py
  V22_REVIEW_SCRIPT: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v22/review_authorization.py
  V17_REVIEW_SCRIPT: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v17/review_authorization.py

jobs:
  exact-executable-review:
    if: github.event.action == 'opened' || (github.event.action == 'edited' && contains(github.event.pull_request.body, 'AVPS_V23_PROTECTED_LAUNCH | authorized=true | '))
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout exact reviewer-v23 bytes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: review-infra
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact frozen PR1026 subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SUBJECT_HEAD }}
          path: subject
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Materialize exact frozen V22, V17 and V14..V4 worktrees and verify bytes
        shell: bash
        working-directory: subject
        run: |
          set -euo pipefail
          rows=(
            'v22-base|4b69615cd83a7bcec7e9fa7be17fd48b982367d8|review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v22/review_authorization.py|98fe1ca468a44ad385005111f38dc48c89a08b9e'
            'v17-base|fcd8f73db3d8cfb5899991756212ee653aa3c586|review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v17/review_authorization.py|06867e14710f15cade77ed24fbdc33dafb9f2f74'
            'v14-base|4a860efe18b607af06bc593b7783be8b9ada7a53|review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v14/review_authorization.py|db122927abbf0e8e3904b58042e56abcc3624252'
            'v13-base|f535ec5c0dd6a37778431e6f663dbaea822bf888|review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v13/review_authorization.py|0e136952aa3de0b7f0c8e0fb516891ef7fc14c59'
            'v12-base|ca44daf0355abc030da2bdfe6f647e0de9aa0805|review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v12/review_authorization.py|3c8b7f3ef02ad5d2d4ce09c2036bc071427e75a0'
            'v11-base|dc1e8f736f2f467dfef3b020ac879b2e4c692732|review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v11/review_authorization.py|e1d28737337e6213ebf634dabce5ae76b185d089'
            'v10-base|7af724da176133f87cb32fd36029575525e0423d|review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v10/review_authorization.py|c7fdf87adb95328eeb6d776918e35dad7f2aca00'
            'v9-base|05a91153a813d6b84de429645da4bf4d86f9e780|review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v9/review_authorization.py|4cc7e33e08e0add34b0b5229e9795f8820564d4a'
            'v8-base|03c6837bc31f5b8545987b11aed8da260b32ba11|review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v8/review_authorization.py|44b2deb795c3baa2890d99fffdfc58ee01a341a3'
            'v7-base|832a812b1d62e1bd304f64af2f5309c0c035277f|review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v7/review_authorization.py|de2140ac1fe4becf7dfa648469c79544100e52fd'
            'v6-base|efdf9cbab4e0dbeb718a800a823b59e7735ba755|review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v6/review_authorization.py|b53cdc4787b6714b6f14f6de90fca56c897ba751'
            'v5-base|0d7ad7030aacc1c34bca93fef6c02fd7dcf776c2|review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v5/review_authorization.py|6bf506cc0af62a313461db168c614b3494d6a95f'
            'v4-base|a3fc752af64599eed1dc5e358a23295e423b1eb8|review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v4/review_authorization.py|24b388589c0592b0a201313b57909888effd53ea'
          )
          for row in "${rows[@]}"; do
            IFS='|' read -r dir sha script blob <<<"$row"
            git -C "$GITHUB_WORKSPACE/review-infra" fetch --no-tags --depth=1 origin "$sha"
            git -C "$GITHUB_WORKSPACE/review-infra" worktree add --detach "$GITHUB_WORKSPACE/$dir" "$sha"
            test "$(git -C "$GITHUB_WORKSPACE/$dir" rev-parse HEAD)" = "$sha"
            test "$(git -C "$GITHUB_WORKSPACE/$dir" rev-parse HEAD:"$script")" = "$blob"
          done
          roots=("$GITHUB_WORKSPACE/subject" "$GITHUB_WORKSPACE/review-infra")
          for row in "${rows[@]}"; do IFS='|' read -r dir _ <<<"$row"; roots+=("$GITHUB_WORKSPACE/$dir"); done
          test "$(printf '%s\n' "${roots[@]}" | sort -u | wc -l)" = '15'

      - name: Exact event, subject, reviewer and mode guards
        shell: bash
        working-directory: subject
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "${{ github.event.pull_request.base.sha }}" = "$EXPECTED_MAIN"
          test "${{ github.event.pull_request.base.ref }}" = 'main'
          test "${{ github.event.pull_request.head.ref }}" = 'review/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v23-20260915'
          test "$(git rev-parse HEAD)" = "$EXPECTED_SUBJECT_HEAD"
          test "$(git rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-authorization-control-v2/authorization.json)" = "$EXPECTED_AUTH_BLOB"
          test "$(git rev-parse HEAD:scripts/avps_write_quiet_parser_v1.py)" = "$EXPECTED_WQ_PARSER_BLOB"
          test "$(git -C ../review-infra rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git -C ../review-infra rev-parse HEAD:$REVIEW_SCRIPT)" = "$EXPECTED_REVIEW_SCRIPT_BLOB"
          test "$(git -C ../v22-base rev-parse HEAD)" = '4b69615cd83a7bcec7e9fa7be17fd48b982367d8'
          test "$(git -C ../v22-base rev-parse HEAD:$V22_REVIEW_SCRIPT)" = '98fe1ca468a44ad385005111f38dc48c89a08b9e'
          test "$(git -C ../v17-base rev-parse HEAD)" = 'fcd8f73db3d8cfb5899991756212ee653aa3c586'
          test "$(git -C ../v17-base rev-parse HEAD:$V17_REVIEW_SCRIPT)" = '06867e14710f15cade77ed24fbdc33dafb9f2f74'
          python -m py_compile "../review-infra/$REVIEW_SCRIPT"
          if test "${{ github.event.action }}" = 'opened'; then
            echo 'V23_MODE=stress' >> "$GITHUB_ENV"
            echo 'V23_EV=avps-ordinal46-authorization-review-v23-stress-evidence' >> "$GITHUB_ENV"
            echo 'V23_ARTIFACT=avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v23-actual-stress-proof' >> "$GITHUB_ENV"
          else
            test "${{ github.event.action }}" = 'edited'
            echo 'V23_MODE=review' >> "$GITHUB_ENV"
            echo 'V23_EV=avps-ordinal46-authorization-review-v23-evidence' >> "$GITHUB_ENV"
            echo 'V23_ARTIFACT=avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v23-proof' >> "$GITHUB_ENV"
          fi

      - name: Prove V23 five Bash forms and malformed executable forms absent
        shell: bash
        working-directory: subject
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          workflow = Path(os.environ['GITHUB_WORKSPACE']) / 'review-infra' / '.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v23.yml'
          text = workflow.read_text(encoding='utf-8')
          materialize = text.split('      - name: Materialize exact frozen V22, V17 and V14..V4 worktrees and verify bytes\n', 1)[1].split('      - name: Exact event, subject, reviewer and mode guards\n', 1)[0]
          preserve = text.split('      - name: Preserve V23 proof, failure receipt and observed V4/V5 metadata\n', 1)[1].split('      - name: Upload immutable V23 evidence\n', 1)[0]
          assert materialize.count('for row in "${rows[@]}"; do') == 2
          assert materialize.count('"${roots[@]}"') == 1
          fallback = '${V23_EV:-avps-ordinal46-authorization-review-v23-stress-evidence}'
          assert preserve.count(fallback) == 2
          malformed = (
              '${' + '{rows[@]}}',
              '${' + '{roots[@]}}',
              '${' + '{V23_EV:-avps-ordinal46-authorization-review-v23-stress-evidence}}',
          )
          for bad in malformed:
              assert bad not in materialize
              assert bad not in preserve
          PY

      - name: Fetch immutable PR1032 and PR1033 metadata and prove representation, historical bases, carrier and subprocess proof-target binding
        shell: bash
        working-directory: subject
        env:
          GITHUB_TOKEN: ${{ github.token }}
          V22_FROZEN_REVIEWER: ${{ github.workspace }}/v22-base/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v22/review_authorization.py
          V17_FROZEN_REVIEWER: ${{ github.workspace }}/v17-base/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v17/review_authorization.py
        run: |
          set -euo pipefail
          export V23_PREACTUAL_FAILURE_DIR="$RUNNER_TEMP/v23-preactual-failure"
          export V23_PREACTUAL_ACTIVE=1
          mkdir -p "$V23_PREACTUAL_FAILURE_DIR"
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import urllib.request
          from pathlib import Path

          fail_dir = Path(os.environ['V23_PREACTUAL_FAILURE_DIR'])
          failure_path = fail_dir / 'failure.json'

          def durable_failure(exc: BaseException) -> None:
              if failure_path.exists():
                  return
              fail_dir.mkdir(parents=True, exist_ok=True)
              payload = {
                  'status': 'FAIL_V23_PREACTUAL_HISTORICAL_V5_BASE_SEPARATION_PROOF',
                  'type': type(exc).__name__,
                  'message': str(exc),
                  'authorizationRefCreated': False,
                  'dispatchCreated': False,
                  'scientificOrdinalAllocated': False,
                  'seedUniverseConsumed': False,
                  'scienceInvoked': False,
                  'solverExecuted': False,
                  'protectedResultsOpened': False,
                  'scienceFalse': True,
              }
              failure_path.write_text(json.dumps(payload, sort_keys=True) + '\n', encoding='utf-8')

          def fetch_pr(number: int, label: str) -> Path:
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/pulls/{number}",
                  headers={
                      'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'avps-v23-historical-v4-v5-base-separation-proof',
                  },
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  payload = json.load(response)
              path = Path(os.environ['RUNNER_TEMP']) / label
              path.write_text(json.dumps(payload, sort_keys=True) + '\n', encoding='utf-8')
              return path

          try:
              v4_metadata = fetch_pr(1032, 'v23-v4-pr1032.json')
              v5_metadata = fetch_pr(1033, 'v23-v5-pr1033.json')
              reviewer = Path(os.environ['GITHUB_WORKSPACE']) / 'review-infra' / os.environ['REVIEW_SCRIPT']
              v4_proof_path = Path(os.environ['RUNNER_TEMP']) / 'v23-preactual-historical-v4-base-proof.json'
              v5_proof_path = Path(os.environ['RUNNER_TEMP']) / 'v23-preactual-historical-v5-base-proof.json'
              zero_proof_path = Path(os.environ['RUNNER_TEMP']) / 'v23-preactual-zero-runtime-proof-target.json'
              subprocess.run(
                  [
                      sys.executable,
                      str(reviewer),
                      '--v23-proof-only',
                      '--v4-metadata', str(v4_metadata),
                      '--v5-metadata', str(v5_metadata),
                      '--v23-proof-out', str(v4_proof_path),
                      '--v23-v5-proof-out', str(v5_proof_path),
                      '--v23-zero-runtime-proof-out', str(zero_proof_path),
                  ],
                  check=True,
                  env=os.environ.copy(),
              )
              v4_proof = json.loads(v4_proof_path.read_text(encoding='utf-8'))
              assert v4_proof['status'] == 'PASS_V23_PREACTUAL_HISTORICAL_V4_BASE_SEPARATION_PROOF'
              assert v4_proof['scienceFalse'] is True
              assert v4_proof['scientificOrdinalAllocated'] is False
              assert v4_proof['seedUniverseConsumed'] is False
              assert v4_proof['fixtures']['unrelatedGenericElseNoiseIgnoredByLocalProof'] is True
              assert 'localComparatorStructureDriftFatal' in v4_proof['fixtures']
              v5_proof = json.loads(v5_proof_path.read_text(encoding='utf-8'))
              assert v5_proof['status'] == 'PASS_V23_PREACTUAL_HISTORICAL_V5_BASE_SEPARATION_PROOF'
              assert v5_proof['frozenV5Pr'] == 1033
              assert v5_proof['frozenV5Head'] == '0d7ad7030aacc1c34bca93fef6c02fd7dcf776c2'
              assert v5_proof['frozenV5Branch'] == 'review/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v5-20260910'
              assert v5_proof['frozenV5BaseRef'] == 'main'
              assert v5_proof['frozenV5ExpectedBaseSha'] == 'f5ebc646aba96ad13753d55baf2b0c55cff64ccb'
              assert v5_proof['successorMain'] == '6cd7c075766fe0c86bc7561ec205a3f9120fd1fb'
              assert v5_proof['expectedBaseComparatorUsesSpecFallbackMain'] is True
              assert v5_proof['frozenV4SpecByteSemanticEquivalent'] is True
              assert v5_proof['observedFrozenV5MetadataPasses'] is True
              expected_fixtures = {
                  'exactFrozenV5MetadataPasses': True,
                  'wrongHistoricalBaseFatal': True,
                  'wrongHeadFatal': True,
                  'wrongBranchFatal': True,
                  'wrongBaseRefFatal': True,
                  'wrongStateFatal': True,
                  'mergedIdentityFatal': True,
                  'successorCurrentMainLeakageFatal': True,
              }
              assert v5_proof['fixtures'] == expected_fixtures
              assert v5_proof['scienceFalse'] is True
              assert len(v5_proof['receiptSha256']) == 64
              zero_proof = json.loads(zero_proof_path.read_text(encoding='utf-8'))
              assert zero_proof['status'] == 'PASS_V23_PREACTUAL_ZERO_RUNTIME_PROOF_TARGET_BINDING'
              assert zero_proof['proofTargetDirectSubprocessSurface'] == ['run']
              assert len(zero_proof['proofTargetSha256']) == 64
              assert zero_proof['proofTargetIsExactCompiledBuilderBytes'] is True
              assert zero_proof['scannerReboundFromOuterLauncher'] is True
              assert zero_proof['scannerExpectedSurfacePreserved'] is True
              assert zero_proof['scienceFalse'] is True
              assert len(zero_proof['receiptSha256']) == 64
          except BaseException as exc:
              durable_failure(exc)
              raise
          PY

      - name: Run exact executable V23 reviewer
        shell: bash
        working-directory: subject
        env:
          GITHUB_TOKEN: ${{ github.token }}
          V22_FROZEN_REVIEWER: ${{ github.workspace }}/v22-base/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v22/review_authorization.py
          V17_FROZEN_REVIEWER: ${{ github.workspace }}/v17-base/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v17/review_authorization.py
          V23_PREPROOF_PATH: ${{ runner.temp }}/v23-preactual-historical-v4-base-proof.json
        run: |
          set -euo pipefail
          python "../review-infra/$REVIEW_SCRIPT" \
            --v5-metadata "$RUNNER_TEMP/v23-v5-pr1033.json" \
            --repo "$GITHUB_REPOSITORY" \
            --tok "$GITHUB_TOKEN" \
            --rpr "${{ github.event.pull_request.number }}" \
            --rh "${{ github.event.pull_request.head.sha }}" \
            --rb "${{ github.event.pull_request.head.ref }}" \
            --base "${{ github.event.pull_request.base.sha }}" \
            --bb "${{ github.event.pull_request.base.ref }}" \
            --run "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            --event "$GITHUB_EVENT_NAME" \
            --action "${{ github.event.action }}" \
            --mode "$V23_MODE" \
            --ev "$V23_EV"

      - name: Preserve V23 proof, failure receipt and observed V4/V5 metadata
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "subject/${V23_EV:-avps-ordinal46-authorization-review-v23-stress-evidence}"
          dest="subject/${V23_EV:-avps-ordinal46-authorization-review-v23-stress-evidence}"
          test ! -f "$RUNNER_TEMP/v23-preactual-historical-v4-base-proof.json" || cp "$RUNNER_TEMP/v23-preactual-historical-v4-base-proof.json" "$dest/v23-preactual-historical-v4-base-proof.json"
          test ! -f "$RUNNER_TEMP/v23-preactual-historical-v5-base-proof.json" || cp "$RUNNER_TEMP/v23-preactual-historical-v5-base-proof.json" "$dest/v23-preactual-historical-v5-base-proof.json"
          test ! -f "$RUNNER_TEMP/v23-preactual-zero-runtime-proof-target.json" || cp "$RUNNER_TEMP/v23-preactual-zero-runtime-proof-target.json" "$dest/v23-preactual-zero-runtime-proof-target.json"
          test ! -f "$RUNNER_TEMP/v23-v4-pr1032.json" || cp "$RUNNER_TEMP/v23-v4-pr1032.json" "$dest/v23-observed-v4-pr1032.json"
          test ! -f "$RUNNER_TEMP/v23-v5-pr1033.json" || cp "$RUNNER_TEMP/v23-v5-pr1033.json" "$dest/v23-observed-v5-pr1033.json"
          test ! -f "$RUNNER_TEMP/v23-preactual-failure/failure.json" || cp "$RUNNER_TEMP/v23-preactual-failure/failure.json" "$dest/failure.json"

      - name: Upload immutable V23 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.V23_ARTIFACT || 'avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v23-actual-stress-proof' }}
          path: subject/${{ env.V23_EV || 'avps-ordinal46-authorization-review-v23-stress-evidence' }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
