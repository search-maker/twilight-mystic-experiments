name: Review AVPS v2 successor ordinal46 authorization replacement v25

on:
  pull_request:
    types: [opened, edited]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v25.yml
      - review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v25/review_authorization.py

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read
  discussions: read

concurrency:
  group: avps-v2-successor-ordinal46-authorization-review-v25-${{ github.event.pull_request.head.sha }}-${{ github.event.action }}
  cancel-in-progress: false

env:
  EXPECTED_MAIN: 6cd7c075766fe0c86bc7561ec205a3f9120fd1fb
  EXPECTED_SUBJECT_HEAD: 5028cb7c7cd585d720749f0d572aa15e2f614bf9
  EXPECTED_AUTH_BLOB: 3dd0f80ff878d09987a91af0b4860a449fd41a92
  EXPECTED_WQ_PARSER_BLOB: 7628651c9ddf740669d1fedf8fb18887d7155fe6
  EXPECTED_REVIEW_SCRIPT_BLOB: 0d5fae5c74eb6ab2e9afccb75559e91b5870fa5c
  REVIEW_SCRIPT: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v25/review_authorization.py

jobs:
  exact-executable-review:
    if: github.event.action == 'opened' || (github.event.action == 'edited' && contains(github.event.pull_request.body, 'AVPS_V25_PROTECTED_LAUNCH | authorized=true | '))
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout exact reviewer-v25 bytes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: review-infra
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact frozen PR1026 subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_SUBJECT_HEAD }}
          path: subject
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Materialize exact frozen V24..V4 worktrees and verify bytes
        shell: bash
        working-directory: subject
        run: |
          set -euo pipefail
          rows=(
            'v24-base|9b65e7cb3f64f9ebf74ad5365250dbb818cc2b70|review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v24/review_authorization.py|e4d306e01f76cc4199364bcd9d6d1a1dbffabf52'
            'v23-base|3f81d9c890a38e64be40e2510cbc7bbf467b6c98|review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v23/review_authorization.py|52dd4af0f78e7d8418669d98562a77584bc7ab31'
            'v22-base|4b69615cd83a7bcec7e9fa7be17fd48b982367d8|review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v22/review_authorization.py|98fe1ca468a44ad385005111f38dc48c89a08b9e'
            'v17-base|fcd8f73db3d8cfb5899991756212ee653aa3c586|review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v17/review_authorization.py|06867e14710f15cade77ed24fbdc33dafb9f2f74'
            'v14-base|4a860efe18b607af06bc593b7783be8b9ada7a53|review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v14/review_authorization.py|db122927abbf0e8e3904b58042e56abcc3624252'
            'v13-base|f535ec5c0dd6a37778431e6f663dbaea822bf888|review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v13/review_authorization.py|0e136952aa3de0b7f0c8e0fb516891ef7fc14c59'
            'v12-base|ca44daf0355abc030da2bdfe6f647e0de9aa0805|review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v12/review_authorization.py|3c8b7f3ef02ad5d2d4ce09c2036bc071427e75a0'
            'v11-base|dc1e8f736f2f467dfef3b020ac879b2e4c692732|review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v11/review_authorization.py|e1d28737337e6213ebf634dabce5ae76b185d089'
            'v10-base|7af724da176133f87cb32fd36029575525e0423d|review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v10/review_authorization.py|c7fdf87adb95328eeb6d776918e35dad7f2aca00'
            'v9-base|05a91153a813d6b84de429645da4bf4d86f9e780|review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v9/review_authorization.py|4cc7e33e08e0add34b0b5229e9795f8820564d4a'
            'v8-base|03c6837bc31f5b8545987b11aed8da260b32ba11|review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v8/review_authorization.py|44b2deb795c3baa2890d99fffdfc58ee01a341a3'
            'v7-base|832a812b1d62e1bd304f64af2f5309c0c035277f|review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v7/review_authorization.py|de2140ac1fe4becf7dfa648469c79544100e52fd'
            'v6-base|efdf9cbab4e0dbeb718a800a823b59e7735ba755|review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v6/review_authorization.py|b53cdc4787b6714b6f14f6de90fca56c897ba751'
            'v5-base|0d7ad7030aacc1c34bca93fef6c02fd7dcf776c2|review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v5/review_authorization.py|6bf506cc0af62a313461db168c614b3494d6a95f'
            'v4-base|a3fc752af64599eed1dc5e358a23295e423b1eb8|review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v4/review_authorization.py|24b388589c0592b0a201313b57909888effd53ea'
          )
          for row in "${rows[@]}"; do
            IFS='|' read -r dir sha script blob <<<"$row"
            git -C "$GITHUB_WORKSPACE/review-infra" fetch --no-tags --depth=1 origin "$sha"
            git -C "$GITHUB_WORKSPACE/review-infra" worktree add --detach "$GITHUB_WORKSPACE/$dir" "$sha"
            test "$(git -C "$GITHUB_WORKSPACE/$dir" rev-parse HEAD)" = "$sha"
            test "$(git -C "$GITHUB_WORKSPACE/$dir" rev-parse HEAD:"$script")" = "$blob"
          done
          roots=("$GITHUB_WORKSPACE/subject" "$GITHUB_WORKSPACE/review-infra")
          for row in "${rows[@]}"; do IFS='|' read -r dir _ <<<"$row"; roots+=("$GITHUB_WORKSPACE/$dir"); done
          test "$(printf '%s\n' "${roots[@]}" | sort -u | wc -l)" = '17'

      - name: Exact event subject reviewer and mode guards
        shell: bash
        working-directory: subject
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "${{ github.event.pull_request.base.sha }}" = "$EXPECTED_MAIN"
          test "${{ github.event.pull_request.base.ref }}" = 'main'
          test "${{ github.event.pull_request.head.ref }}" = 'review/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v25-20260915'
          test "$(git rev-parse HEAD)" = "$EXPECTED_SUBJECT_HEAD"
          test "$(git rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-authorization-control-v2/authorization.json)" = "$EXPECTED_AUTH_BLOB"
          test "$(git rev-parse HEAD:scripts/avps_write_quiet_parser_v1.py)" = "$EXPECTED_WQ_PARSER_BLOB"
          test "$(git -C ../review-infra rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git -C ../review-infra rev-parse HEAD:$REVIEW_SCRIPT)" = "$EXPECTED_REVIEW_SCRIPT_BLOB"
          python -m py_compile "../review-infra/$REVIEW_SCRIPT"
          if test "${{ github.event.action }}" = 'opened'; then
            echo 'V25_MODE=stress' >> "$GITHUB_ENV"
            echo 'V25_EV=avps-ordinal46-authorization-review-v25-stress-evidence' >> "$GITHUB_ENV"
            echo 'V25_ARTIFACT=avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v25-actual-stress-proof' >> "$GITHUB_ENV"
          else
            test "${{ github.event.action }}" = 'edited'
            echo 'V25_MODE=review' >> "$GITHUB_ENV"
            echo 'V25_EV=avps-ordinal46-authorization-review-v25-evidence' >> "$GITHUB_ENV"
            echo 'V25_ARTIFACT=avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v25-proof' >> "$GITHUB_ENV"
          fi

      - name: Prove V25 five Bash forms and malformed executable forms absent
        shell: bash
        working-directory: subject
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['GITHUB_WORKSPACE'])/'review-infra'/'.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v25.yml'
          t=p.read_text()
          m=t.split('      - name: Materialize exact frozen V24..V4 worktrees and verify bytes\n',1)[1].split('      - name: Exact event subject reviewer and mode guards\n',1)[0]
          q=t.split('      - name: Preserve V25 proofs failure receipt and observed metadata\n',1)[1].split('      - name: Upload immutable V25 evidence\n',1)[0]
          assert m.count('for row in "${rows[@]}"; do') == 2
          assert m.count('"${roots[@]}"') == 1
          assert q.count('${V25_EV:-avps-ordinal46-authorization-review-v25-stress-evidence}') == 2
          bad_forms = (
              '$' + '{{rows[@]}}',
              '$' + '{{roots[@]}}',
              '$' + '{{V25_EV:-avps-ordinal46-authorization-review-v25-stress-evidence}}',
          )
          for bad in bad_forms:
              assert bad not in t
          PY

      - name: Fetch exact frozen PR1032 and PR1033 metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/1032" > "$RUNNER_TEMP/v25-v4-pr1032.json"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/1033" > "$RUNNER_TEMP/v25-v5-pr1033.json"

      - name: PRE-ACTUAL forensic and generated effective proofs
        shell: bash
        working-directory: subject
        env:
          GITHUB_TOKEN: ${{ github.token }}
          V24_FROZEN_REVIEWER: ${{ github.workspace }}/v24-base/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v24/review_authorization.py
          V23_FROZEN_REVIEWER: ${{ github.workspace }}/v23-base/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v23/review_authorization.py
          V22_FROZEN_REVIEWER: ${{ github.workspace }}/v22-base/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v22/review_authorization.py
          V17_FROZEN_REVIEWER: ${{ github.workspace }}/v17-base/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v17/review_authorization.py
          V13_FROZEN_REVIEWER: ${{ github.workspace }}/v13-base/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v13/review_authorization.py
          V25_PREACTUAL_ACTIVE: '1'
          V25_PREACTUAL_FAILURE_DIR: ${{ runner.temp }}/v25-preactual-failure
        run: |
          set -euo pipefail
          python "../review-infra/$REVIEW_SCRIPT" \
            --v25-proof-only \
            --v4-metadata "$RUNNER_TEMP/v25-v4-pr1032.json" \
            --v5-metadata "$RUNNER_TEMP/v25-v5-pr1033.json" \
            --v25-forensic-proof-out "$RUNNER_TEMP/v25-preactual-v4-comparator-forensic-proof.json" \
            --v25-proof-out "$RUNNER_TEMP/v25-preactual-historical-v4-base-proof.json" \
            --v25-v5-proof-out "$RUNNER_TEMP/v25-preactual-historical-v5-base-proof.json" \
            --v25-zero-runtime-proof-out "$RUNNER_TEMP/v25-preactual-zero-runtime-proof-target.json" \
            --v25-entrypoint-proof-out "$RUNNER_TEMP/v25-preactual-controlled-entrypoint-proof.json" \
            --repo "$GITHUB_REPOSITORY" --tok "$GITHUB_TOKEN" \
            --rpr "${{ github.event.pull_request.number }}" --rh "${{ github.event.pull_request.head.sha }}" \
            --rb "${{ github.event.pull_request.head.ref }}" --base "${{ github.event.pull_request.base.sha }}" \
            --bb "${{ github.event.pull_request.base.ref }}" --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --event "$GITHUB_EVENT_NAME" --action "${{ github.event.action }}" --mode "$V25_MODE" --ev "$V25_EV"
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=Path(os.environ['RUNNER_TEMP'])
          def g(n): return json.loads((r/n).read_text())
          f=g('v25-preactual-v4-comparator-forensic-proof.json')
          assert f['status']=='PASS_V25_PREACTUAL_V4_COMPARATOR_FORENSIC_AND_MATCHER_PROJECTION'
          assert f['baselineExactRefusal']=='V25 immutable-base comparator count drift: 0'
          assert f['representationMismatch']=='immutable-name-indirection-vs-proof-matcher-literal-shape'
          assert f['capturedComparatorDataflow']['semanticCandidateKind']=='name-indirection'
          assert all(f['metadataFixtures'].values()) and all(f['semanticFixtures'].values())
          assert f['scienceFalse'] is True
          assert g('v25-preactual-historical-v4-base-proof.json')['status']=='PASS_V25_PREACTUAL_HISTORICAL_V4_BASE_SEPARATION_PROOF'
          assert g('v25-preactual-historical-v5-base-proof.json')['status']=='PASS_V25_PREACTUAL_HISTORICAL_V5_BASE_SEPARATION_PROOF'
          z=g('v25-preactual-zero-runtime-proof-target.json'); assert z['proofTargetDirectSubprocessSurface']==['run']
          e=g('v25-preactual-controlled-entrypoint-proof.json'); assert e['status']=='PASS_V25_PREACTUAL_CONTROLLED_ENTRYPOINT_NAMESPACE_PROOF'
          assert e['negativeSyntheticNonMainRejected'] is True and e['controlledGeneratedEntrypointCallCount']==1
          assert e['actualReviewerEntrypointActivated'] is False and e['protectedReviewerActivated'] is False and e['scienceFalse'] is True
          PY

      - name: Run exact executable V25 reviewer
        shell: bash
        working-directory: subject
        env:
          GITHUB_TOKEN: ${{ github.token }}
          V24_FROZEN_REVIEWER: ${{ github.workspace }}/v24-base/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v24/review_authorization.py
          V23_FROZEN_REVIEWER: ${{ github.workspace }}/v23-base/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v23/review_authorization.py
          V22_FROZEN_REVIEWER: ${{ github.workspace }}/v22-base/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v22/review_authorization.py
          V17_FROZEN_REVIEWER: ${{ github.workspace }}/v17-base/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v17/review_authorization.py
          V13_FROZEN_REVIEWER: ${{ github.workspace }}/v13-base/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v13/review_authorization.py
          V25_PREPROOF_PATH: ${{ runner.temp }}/v25-preactual-historical-v4-base-proof.json
          V25_FORENSIC_PREPROOF_PATH: ${{ runner.temp }}/v25-preactual-v4-comparator-forensic-proof.json
        run: |
          set -euo pipefail
          python "../review-infra/$REVIEW_SCRIPT" \
            --v5-metadata "$RUNNER_TEMP/v25-v5-pr1033.json" --repo "$GITHUB_REPOSITORY" --tok "$GITHUB_TOKEN" \
            --rpr "${{ github.event.pull_request.number }}" --rh "${{ github.event.pull_request.head.sha }}" \
            --rb "${{ github.event.pull_request.head.ref }}" --base "${{ github.event.pull_request.base.sha }}" \
            --bb "${{ github.event.pull_request.base.ref }}" --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --event "$GITHUB_EVENT_NAME" --action "${{ github.event.action }}" --mode "$V25_MODE" --ev "$V25_EV"

      - name: Preserve V25 proofs failure receipt and observed metadata
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "subject/${V25_EV:-avps-ordinal46-authorization-review-v25-stress-evidence}"
          dest="subject/${V25_EV:-avps-ordinal46-authorization-review-v25-stress-evidence}"
          for f in v25-preactual-v4-comparator-forensic-proof.json v25-preactual-historical-v4-base-proof.json v25-preactual-historical-v5-base-proof.json v25-preactual-zero-runtime-proof-target.json v25-preactual-controlled-entrypoint-proof.json; do
            test ! -f "$RUNNER_TEMP/$f" || cp "$RUNNER_TEMP/$f" "$dest/$f"
          done
          test ! -f "$RUNNER_TEMP/v25-v4-pr1032.json" || cp "$RUNNER_TEMP/v25-v4-pr1032.json" "$dest/v25-observed-v4-pr1032.json"
          test ! -f "$RUNNER_TEMP/v25-v5-pr1033.json" || cp "$RUNNER_TEMP/v25-v5-pr1033.json" "$dest/v25-observed-v5-pr1033.json"
          test ! -f "$RUNNER_TEMP/v25-preactual-failure/failure.json" || cp "$RUNNER_TEMP/v25-preactual-failure/failure.json" "$dest/failure.json"

      - name: Upload immutable V25 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.V25_ARTIFACT || 'avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v25-actual-stress-proof' }}
          path: subject/${{ env.V25_EV || 'avps-ordinal46-authorization-review-v25-stress-evidence' }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
