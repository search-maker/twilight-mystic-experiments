name: Review AVPS v2 successor ordinal46 authorization replacement v28

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v28.yml
      - review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v28/review_authorization.py

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: avps-v2-successor-ordinal46-authorization-review-v28-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

env:
  EXPECTED_MAIN: 6cd7c075766fe0c86bc7561ec205a3f9120fd1fb
  EXPECTED_SUBJECT_HEAD: 5028cb7c7cd585d720749f0d572aa15e2f614bf9
  EXPECTED_AUTH_BLOB: 3dd0f80ff878d09987a91af0b4860a449fd41a92
  EXPECTED_WQ_PARSER_BLOB: 7628651c9ddf740669d1fedf8fb18887d7155fe6
  EXPECTED_REVIEW_SCRIPT_BLOB: f1e368e245ddea8750c39019dd3b29b4a0fcb2b5
  EXPECTED_V26_REVIEWER_BLOB: 3fb03fb408897464b1be3ebd67b67b6297235cbd
  EXPECTED_V26_WORKFLOW_BLOB: 853c0f49accaf4e2087fd2e4e6e98bc7ab7ef7d2
  REVIEW_SCRIPT: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v28/review_authorization.py

jobs:
  exact-nonauth-v28:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact V28 reviewer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: review-infra
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact frozen PR1026 subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_SUBJECT_HEAD }}
          path: subject
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Materialize exact frozen V26 V25 V24 V23 V22 V17 sources
        shell: bash
        working-directory: subject
        run: |
          set -euo pipefail
          rows=(
            'v26-base|8a36adecd48bc6de595d3ee87987abefc8536642|review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v26/review_authorization.py|3fb03fb408897464b1be3ebd67b67b6297235cbd'
            'v25-base|f1c72856ed8132e45ba6b4ce35c9d22b983f179f|review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v25/review_authorization.py|0d5fae5c74eb6ab2e9afccb75559e91b5870fa5c'
            'v24-base|9b65e7cb3f64f9ebf74ad5365250dbb818cc2b70|review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v24/review_authorization.py|e4d306e01f76cc4199364bcd9d6d1a1dbffabf52'
            'v23-base|3f81d9c890a38e64be40e2510cbc7bbf467b6c98|review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v23/review_authorization.py|52dd4af0f78e7d8418669d98562a77584bc7ab31'
            'v22-base|4b69615cd83a7bcec7e9fa7be17fd48b982367d8|review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v22/review_authorization.py|98fe1ca468a44ad385005111f38dc48c89a08b9e'
            'v17-base|fcd8f73db3d8cfb5899991756212ee653aa3c586|review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v17/review_authorization.py|06867e14710f15cade77ed24fbdc33dafb9f2f74'
          )
          for row in "${rows[@]}"; do
            IFS='|' read -r dir sha script blob <<<"$row"
            git -C "$GITHUB_WORKSPACE/review-infra" fetch --no-tags --depth=1 origin "$sha"
            git -C "$GITHUB_WORKSPACE/review-infra" worktree add --detach "$GITHUB_WORKSPACE/$dir" "$sha"
            test "$(git -C "$GITHUB_WORKSPACE/$dir" rev-parse HEAD)" = "$sha"
            test "$(git -C "$GITHUB_WORKSPACE/$dir" rev-parse HEAD:"$script")" = "$blob"
          done
          test "$(git -C "$GITHUB_WORKSPACE/v26-base" rev-parse HEAD:.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v26.yml)" = "$EXPECTED_V26_WORKFLOW_BLOB"

      - name: Exact V28 identity and frozen-boundary guards
        shell: bash
        working-directory: subject
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "${{ github.event.pull_request.draft }}" = 'true'
          test "${{ github.event.pull_request.base.sha }}" = "$EXPECTED_MAIN"
          test "${{ github.event.pull_request.base.ref }}" = 'main'
          test "${{ github.event.pull_request.head.ref }}" = 'review/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v28-20260915'
          test "$(git rev-parse HEAD)" = "$EXPECTED_SUBJECT_HEAD"
          test "$(git rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-authorization-control-v2/authorization.json)" = "$EXPECTED_AUTH_BLOB"
          test "$(git rev-parse HEAD:scripts/avps_write_quiet_parser_v1.py)" = "$EXPECTED_WQ_PARSER_BLOB"
          test "$(git -C ../review-infra rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git -C ../review-infra rev-parse HEAD:$REVIEW_SCRIPT)" = "$EXPECTED_REVIEW_SCRIPT_BLOB"
          test "$(git -C ../v26-base rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v26/review_authorization.py)" = "$EXPECTED_V26_REVIEWER_BLOB"
          python -m py_compile "../review-infra/$REVIEW_SCRIPT"

      - name: Fetch exact frozen PR1032 and PR1033 metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/1032" > "$RUNNER_TEMP/v28-v4-pr1032.json"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/1033" > "$RUNNER_TEMP/v28-v5-pr1033.json"

      - name: PRE-ACTUAL distributed V4 and controlled-entrypoint proof
        shell: bash
        working-directory: subject
        env:
          V26_FROZEN_REVIEWER: ${{ github.workspace }}/v26-base/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v26/review_authorization.py
          V25_FROZEN_REVIEWER: ${{ github.workspace }}/v25-base/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v25/review_authorization.py
          V24_FROZEN_REVIEWER: ${{ github.workspace }}/v24-base/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v24/review_authorization.py
          V23_FROZEN_REVIEWER: ${{ github.workspace }}/v23-base/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v23/review_authorization.py
          V22_FROZEN_REVIEWER: ${{ github.workspace }}/v22-base/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v22/review_authorization.py
          V17_FROZEN_REVIEWER: ${{ github.workspace }}/v17-base/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v17/review_authorization.py
          V28_PREACTUAL_ACTIVE: '1'
          V28_PREACTUAL_FAILURE_DIR: ${{ runner.temp }}/v28-preactual-failure
        run: |
          set -euo pipefail
          python "../review-infra/$REVIEW_SCRIPT" --v28-proof-only --v4-metadata "$RUNNER_TEMP/v28-v4-pr1032.json" --v5-metadata "$RUNNER_TEMP/v28-v5-pr1033.json" --v28-forensic-proof-out "$RUNNER_TEMP/v28-preactual-distributed-static-dataflow.json" --v28-zero-runtime-proof-out "$RUNNER_TEMP/v28-zero-runtime-proof.json" --v28-v5-proof-out "$RUNNER_TEMP/v28-v5-proof.json" --v28-entrypoint-proof-out "$RUNNER_TEMP/v28-entrypoint-proof.json"

      - name: NON_AUTHORIZING ACTUAL exact executable V28 reviewer
        if: success()
        shell: bash
        working-directory: subject
        env:
          V24_FROZEN_REVIEWER: ${{ github.workspace }}/v24-base/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v24/review_authorization.py
          V23_FROZEN_REVIEWER: ${{ github.workspace }}/v23-base/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v23/review_authorization.py
          V22_FROZEN_REVIEWER: ${{ github.workspace }}/v22-base/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v22/review_authorization.py
          V28_NONAUTH_ACTUAL: '1'
        run: |
          set -euo pipefail
          python "../review-infra/$REVIEW_SCRIPT" --v5-metadata "$RUNNER_TEMP/v28-v5-pr1033.json"

      - name: Preserve V28 proof and durable refusal
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          dest="subject/avps-ordinal46-v28-evidence"
          mkdir -p "$dest"
          for f in v28-preactual-distributed-static-dataflow.json v28-zero-runtime-proof.json v28-v5-proof.json v28-entrypoint-proof.json; do
            test ! -f "$RUNNER_TEMP/$f" || cp "$RUNNER_TEMP/$f" "$dest/"
          done
          test ! -f "$RUNNER_TEMP/v28-preactual-failure/failure.json" || cp "$RUNNER_TEMP/v28-preactual-failure/failure.json" "$dest/"
          cp "$RUNNER_TEMP/v28-v4-pr1032.json" "$dest/v28-observed-v4-pr1032.json"
          cp "$RUNNER_TEMP/v28-v5-pr1033.json" "$dest/v28-observed-v5-pr1033.json"
          printf '%s\n' 'PROTECTED=false' 'SCIENCE_FALSE=true' 'ORDINAL46=NOT_ALLOCATED_NOT_RESERVED_NOT_DISPATCHED' > "$dest/boundary.txt"

      - name: Upload immutable V28 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v28-proof
          path: subject/avps-ordinal46-v28-evidence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
