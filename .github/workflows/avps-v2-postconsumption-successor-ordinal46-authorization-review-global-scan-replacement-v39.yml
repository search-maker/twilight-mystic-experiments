name: Review AVPS v2 successor ordinal46 authorization replacement v39

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v39.yml
      - review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v39/review_authorization.py

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: avps-v2-successor-ordinal46-authorization-review-v39-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

env:
  EXPECTED_MAIN: 6cd7c075766fe0c86bc7561ec205a3f9120fd1fb
  EXPECTED_SUBJECT_HEAD: 5028cb7c7cd585d720749f0d572aa15e2f614bf9
  EXPECTED_AUTH_BLOB: 3dd0f80ff878d09987a91af0b4860a449fd41a92
  EXPECTED_WQ_PARSER_BLOB: 7628651c9ddf740669d1fedf8fb18887d7155fe6
  EXPECTED_REVIEW_SCRIPT_BLOB: e0ef777c69e7d36027212a344150b836ba7c51f9
  EXPECTED_V38_REVIEWER_BLOB: 50e966267259749d8d2fd81144339b2668887374
  EXPECTED_V38_WORKFLOW_BLOB: 536a498a15a05c63f20df4667aab070cf71183c3
  EXPECTED_V37_REVIEWER_BLOB: 842c4d53f734ef1b7ee0958307f21b761024321c
  EXPECTED_V37_WORKFLOW_BLOB: 41f4c2b24bc2156f888e9df2b8373da3daa0e3a4
  EXPECTED_V36_REVIEWER_BLOB: 0ad60505cf17f2f756daf694aed62b2105f7e1c0
  EXPECTED_V36_WORKFLOW_BLOB: dbced952f8f13784dd4f4820bd97b44e0ea324fa
  EXPECTED_V35_REVIEWER_BLOB: cd027a47f5230228f509ca834b02ac3b4e2e0629
  EXPECTED_V35_WORKFLOW_BLOB: 8af95d0ad92c986477c96b741cb002b454c1dc86
  EXPECTED_V17_REVIEWER_BLOB: 06867e14710f15cade77ed24fbdc33dafb9f2f74
  REVIEW_SCRIPT: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v39/review_authorization.py

jobs:
  exact-nonauth-v39:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact V39 reviewer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: review-infra
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact frozen PR1026 subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_SUBJECT_HEAD }}
          path: subject
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Materialize exact frozen V38 V37 V36 V35 V17 sources
        shell: bash
        working-directory: subject
        run: |
          set -euo pipefail
          rows=(
            'v38-base|c1ee38bd9d59249f11d1f4820bbff0dee45fa14b|review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v38/review_authorization.py|50e966267259749d8d2fd81144339b2668887374'
            'v37-base|562f184730d10b0ef7ec68e65871910148e4b828|review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v37/review_authorization.py|842c4d53f734ef1b7ee0958307f21b761024321c'
            'v36-base|bedf09d486ceb87059e1b19af4709ef718209f5f|review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v36/review_authorization.py|0ad60505cf17f2f756daf694aed62b2105f7e1c0'
            'v35-base|4bac55ed35666d37b7a478f08f7a6f5b4c66df4d|review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v35/review_authorization.py|cd027a47f5230228f509ca834b02ac3b4e2e0629'
            'v17-base|fcd8f73db3d8cfb5899991756212ee653aa3c586|review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v17/review_authorization.py|06867e14710f15cade77ed24fbdc33dafb9f2f74'
          )
          for row in "${rows[@]}"; do
            IFS='|' read -r dir sha script blob <<<"$row"
            git -C "$GITHUB_WORKSPACE/review-infra" fetch --no-tags --depth=1 origin "$sha"
            git -C "$GITHUB_WORKSPACE/review-infra" worktree add --detach "$GITHUB_WORKSPACE/$dir" "$sha"
            test "$(git -C "$GITHUB_WORKSPACE/$dir" rev-parse HEAD)" = "$sha"
            test "$(git -C "$GITHUB_WORKSPACE/$dir" rev-parse HEAD:"$script")" = "$blob"
          done
          test "$(git -C "$GITHUB_WORKSPACE/v38-base" rev-parse HEAD:.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v38.yml)" = "$EXPECTED_V38_WORKFLOW_BLOB"
          test "$(git -C "$GITHUB_WORKSPACE/v37-base" rev-parse HEAD:.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v37.yml)" = "$EXPECTED_V37_WORKFLOW_BLOB"
          test "$(git -C "$GITHUB_WORKSPACE/v36-base" rev-parse HEAD:.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v36.yml)" = "$EXPECTED_V36_WORKFLOW_BLOB"
          test "$(git -C "$GITHUB_WORKSPACE/v35-base" rev-parse HEAD:.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v35.yml)" = "$EXPECTED_V35_WORKFLOW_BLOB"
      - name: Exact V39 identity and frozen-boundary guards
        shell: bash
        working-directory: subject
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "${{ github.event.pull_request.draft }}" = 'true'
          test "${{ github.event.pull_request.base.sha }}" = "$EXPECTED_MAIN"
          test "${{ github.event.pull_request.base.ref }}" = 'main'
          test "${{ github.event.pull_request.head.ref }}" = 'review/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v39-20260916'
          test "$(git rev-parse HEAD)" = "$EXPECTED_SUBJECT_HEAD"
          test "$(git rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-authorization-control-v2/authorization.json)" = "$EXPECTED_AUTH_BLOB"
          test "$(git rev-parse HEAD:scripts/avps_write_quiet_parser_v1.py)" = "$EXPECTED_WQ_PARSER_BLOB"
          test "$(git -C ../review-infra rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git -C ../review-infra rev-parse HEAD:$REVIEW_SCRIPT)" = "$EXPECTED_REVIEW_SCRIPT_BLOB"
          python -m py_compile "../review-infra/$REVIEW_SCRIPT"
      - name: Fetch exact frozen PR1032 and PR1033 metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/1032" > "$RUNNER_TEMP/v39-v4-pr1032.json"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/1033" > "$RUNNER_TEMP/v39-v5-pr1033.json"
      - name: PRE-ACTUAL V39 zero-mismatch forensic classifier proof
        shell: bash
        working-directory: subject
        env:
          V38_FROZEN_REVIEWER: ${{ github.workspace }}/v38-base/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v38/review_authorization.py
          V37_FROZEN_REVIEWER: ${{ github.workspace }}/v37-base/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v37/review_authorization.py
          V36_FROZEN_REVIEWER: ${{ github.workspace }}/v36-base/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v36/review_authorization.py
          V35_FROZEN_REVIEWER: ${{ github.workspace }}/v35-base/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v35/review_authorization.py
          V17_FROZEN_REVIEWER: ${{ github.workspace }}/v17-base/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v17/review_authorization.py
          V39_PREACTUAL_FAILURE_DIR: ${{ runner.temp }}/v39-preactual-failure
        run: |
          set -euo pipefail
          python "../review-infra/$REVIEW_SCRIPT" --v39-proof-only --v39-forensic-out "$RUNNER_TEMP/v39-forensic.json" --v39-repair-proof-out "$RUNNER_TEMP/v39-repair-proof.json" --v4-metadata "$RUNNER_TEMP/v39-v4-pr1032.json" --v5-metadata "$RUNNER_TEMP/v39-v5-pr1033.json"
      - name: NON_AUTHORIZING ACTUAL exact executable V39 reviewer
        if: success()
        shell: bash
        working-directory: subject
        env:
          V38_FROZEN_REVIEWER: ${{ github.workspace }}/v38-base/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v38/review_authorization.py
          V37_FROZEN_REVIEWER: ${{ github.workspace }}/v37-base/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v37/review_authorization.py
          V36_FROZEN_REVIEWER: ${{ github.workspace }}/v36-base/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v36/review_authorization.py
          V35_FROZEN_REVIEWER: ${{ github.workspace }}/v35-base/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v35/review_authorization.py
          V17_FROZEN_REVIEWER: ${{ github.workspace }}/v17-base/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v17/review_authorization.py
          V39_PREACTUAL_FAILURE_DIR: ${{ runner.temp }}/v39-preactual-failure
        run: |
          set -euo pipefail
          python "../review-infra/$REVIEW_SCRIPT" --actual --v4-metadata "$RUNNER_TEMP/v39-v4-pr1032.json" --v5-metadata "$RUNNER_TEMP/v39-v5-pr1033.json"
      - name: Preserve V39 proof and durable refusal
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          dest="subject/avps-ordinal46-v39-evidence"; mkdir -p "$dest"
          for f in v39-forensic.json v39-repair-proof.json; do test ! -f "$RUNNER_TEMP/$f" || cp "$RUNNER_TEMP/$f" "$dest/"; done
          test ! -f "$RUNNER_TEMP/v39-preactual-failure/failure.json" || cp "$RUNNER_TEMP/v39-preactual-failure/failure.json" "$dest/failure.json"
          cp "$RUNNER_TEMP/v39-v4-pr1032.json" "$dest/v39-observed-v4-pr1032.json"
          cp "$RUNNER_TEMP/v39-v5-pr1033.json" "$dest/v39-observed-v5-pr1033.json"
          printf '%s\n' 'PROTECTED=false' 'SCIENCE_FALSE=true' 'ORDINAL46=NOT_ALLOCATED_NOT_RESERVED_NOT_DISPATCHED' > "$dest/boundary.txt"
      - name: Upload immutable V39 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v39-proof
          path: subject/avps-ordinal46-v39-evidence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
