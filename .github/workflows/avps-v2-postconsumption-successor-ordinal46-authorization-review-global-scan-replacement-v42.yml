name: Review AVPS v2 successor ordinal46 authorization replacement v42

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v42.yml
      - review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v42/review_authorization.py

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: avps-v2-successor-ordinal46-authorization-review-v42-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

env:
  EXPECTED_MAIN: 6cd7c075766fe0c86bc7561ec205a3f9120fd1fb
  V42_REVIEW: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v42/review_authorization.py

jobs:
  preactual-diagnostic-v42:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact V42 identity
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: v42
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout exact frozen V41
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 76fec680fd2d8b0772b9b60b06b5122d437bc62a
          path: v41
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout exact frozen V40
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6c7a64527450f6e61d7b9b41615bd4b4d11a68c1
          path: v40
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout exact frozen V39
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 43bfe9adce907739bd4d5a8c3d787e22604495fe
          path: v39
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout exact frozen V38
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c1ee38bd9d59249f11d1f4820bbff0dee45fa14b
          path: v38
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout exact frozen V37
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 562f184730d10b0ef7ec68e65871910148e4b828
          path: v37
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout exact frozen V36
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: bedf09d486ceb87059e1b19af4709ef718209f5f
          path: v36
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout exact frozen V35
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4bac55ed35666d37b7a478f08f7a6f5b4c66df4d
          path: v35
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout exact frozen V17
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fcd8f73db3d8cfb5899991756212ee653aa3c586
          path: v17
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Exact V42 boundary guards
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "${{ github.event.pull_request.draft }}" = 'true'
          test "${{ github.event.pull_request.base.sha }}" = "$EXPECTED_MAIN"
          test "${{ github.event.pull_request.base.ref }}" = 'main'
          test "${{ github.event.pull_request.head.ref }}" = 'review/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v42-20260916'
          python -m py_compile "$GITHUB_WORKSPACE/v42/$V42_REVIEW"
      - name: Fetch frozen V4 and V5 metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/1032" > "$RUNNER_TEMP/v42-v4-pr1032.json"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/1033" > "$RUNNER_TEMP/v42-v5-pr1033.json"
      - name: PRE-ACTUAL V42 immutable dynamic-source forensic and bounded V39 diagnostic reproduction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v42-evidence"
          python "$GITHUB_WORKSPACE/v42/$V42_REVIEW" \
            --v41-reviewer "$GITHUB_WORKSPACE/v41/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v41/review_authorization.py" \
            --v41-workflow "$GITHUB_WORKSPACE/v41/.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v41.yml" \
            --v40-reviewer "$GITHUB_WORKSPACE/v40/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v40/review_authorization.py" \
            --v40-workflow "$GITHUB_WORKSPACE/v40/.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v40.yml" \
            --v39-reviewer "$GITHUB_WORKSPACE/v39/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v39/review_authorization.py" \
            --v39-workflow "$GITHUB_WORKSPACE/v39/.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v39.yml" \
            --v38-reviewer "$GITHUB_WORKSPACE/v38/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v38/review_authorization.py" \
            --v37-reviewer "$GITHUB_WORKSPACE/v37/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v37/review_authorization.py" \
            --v36-reviewer "$GITHUB_WORKSPACE/v36/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v36/review_authorization.py" \
            --v35-reviewer "$GITHUB_WORKSPACE/v35/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v35/review_authorization.py" \
            --v17-reviewer "$GITHUB_WORKSPACE/v17/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v17/review_authorization.py" \
            --v4-metadata "$RUNNER_TEMP/v42-v4-pr1032.json" \
            --v5-metadata "$RUNNER_TEMP/v42-v5-pr1033.json" \
            --out-dir "$RUNNER_TEMP/v42-evidence"
      - name: NON_AUTHORIZING ACTUAL exact executable V42 reviewer
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          echo 'V42 ACTUAL remains structurally preserved but is unauthorized unless every PRE-ACTUAL forensic gate proves one unique V39 correction.'
          exit 97
      - name: Preserve immutable V42 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          dest="$GITHUB_WORKSPACE/v42-evidence-upload"
          mkdir -p "$dest"
          test ! -d "$RUNNER_TEMP/v42-evidence" || cp -R "$RUNNER_TEMP/v42-evidence/." "$dest/"
          cp "$RUNNER_TEMP/v42-v4-pr1032.json" "$dest/observed-pr1032.json"
          cp "$RUNNER_TEMP/v42-v5-pr1033.json" "$dest/observed-pr1033.json"
          printf '%s\n' 'PROTECTED=false' 'SCIENCE_FALSE=true' 'ORDINAL46=NOT_ALLOCATED_NOT_RESERVED_NOT_DISPATCHED' 'SEEDS_CONSUMED=false' > "$dest/boundary.txt"
      - name: Upload immutable V42 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: avps-v42-preactual-diagnostic-${{ github.event.pull_request.head.sha }}
          path: v42-evidence-upload/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
