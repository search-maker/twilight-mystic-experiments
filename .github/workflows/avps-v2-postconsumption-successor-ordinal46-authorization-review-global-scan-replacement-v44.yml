name: Review AVPS v2 successor ordinal46 authorization replacement v44

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v44.yml
      - review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v44/review_authorization.py

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: avps-v2-successor-ordinal46-authorization-review-v44-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

env:
  EXPECTED_MAIN: 6cd7c075766fe0c86bc7561ec205a3f9120fd1fb
  V44_REVIEW: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v44/review_authorization.py

jobs:
  preactual-diagnostic-v44:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact V44 identity
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: v44
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout exact frozen V43
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6c1cbbc06c8e56e3aef83e03577a18bbd6aa9835
          path: v43
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout exact frozen V42
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e9fc06b489407ed678adf394c8d08ba261f0b71a
          path: v42
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout exact frozen V41
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 76fec680fd2d8b0772b9b60b06b5122d437bc62a
          path: v41
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Exact V44 boundary guards
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "${{ github.event.pull_request.draft }}" = 'true'
          test "${{ github.event.pull_request.base.sha }}" = "$EXPECTED_MAIN"
          test "${{ github.event.pull_request.base.ref }}" = 'main'
          test "${{ github.event.pull_request.head.ref }}" = 'review/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v44-20260916'
          python -m py_compile "$GITHUB_WORKSPACE/v44/$V44_REVIEW"
          test "$(git -C "$GITHUB_WORKSPACE/v43" rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v43/review_authorization.py)" = '33032084f5f8a79cdd5e3ec4820929faeb153a0e'
          test "$(git -C "$GITHUB_WORKSPACE/v43" rev-parse HEAD:.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v43.yml)" = 'bd7d40f643f6bb86e79cef76f068810d92b1ae31'
          test "$(git -C "$GITHUB_WORKSPACE/v42" rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v42/review_authorization.py)" = 'ca32ab6af2152863fd58ff054e76a34db08e81d1'
          test "$(git -C "$GITHUB_WORKSPACE/v42" rev-parse HEAD:.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v42.yml)" = '070d35f797fd4cdb3ec049b75c4a2b37cbc93b2b'
          test "$(git -C "$GITHUB_WORKSPACE/v41" rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v41/review_authorization.py)" = '9856054db4e935719773ae4041b050140e79726d'
          test "$(git -C "$GITHUB_WORKSPACE/v41" rev-parse HEAD:.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v41.yml)" = 'df9bbd1605dd964e2bb2093241225c15d4b22fde'
      - name: Fetch frozen V4 and V5 metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/1032" > "$RUNNER_TEMP/v44-v4-pr1032.json"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/1033" > "$RUNNER_TEMP/v44-v5-pr1033.json"
      - name: PRE-ACTUAL V44 independent source and AST identity diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v44-evidence"
          python "$GITHUB_WORKSPACE/v44/$V44_REVIEW" \
            --v43-reviewer "$GITHUB_WORKSPACE/v43/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v43/review_authorization.py" \
            --v43-workflow "$GITHUB_WORKSPACE/v43/.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v43.yml" \
            --v42-reviewer "$GITHUB_WORKSPACE/v42/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v42/review_authorization.py" \
            --v42-workflow "$GITHUB_WORKSPACE/v42/.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v42.yml" \
            --v41-reviewer "$GITHUB_WORKSPACE/v41/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v41/review_authorization.py" \
            --v41-workflow "$GITHUB_WORKSPACE/v41/.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v41.yml" \
            --out-dir "$RUNNER_TEMP/v44-evidence"
      - name: NON_AUTHORIZING ACTUAL exact executable V44 reviewer
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          echo 'V44 ACTUAL is structurally preserved and must remain unreachable unless every PRE-ACTUAL uniqueness gate proves clean.'
          exit 97
      - name: Preserve immutable V44 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          dest="$GITHUB_WORKSPACE/v44-evidence-upload"
          mkdir -p "$dest"
          test ! -d "$RUNNER_TEMP/v44-evidence" || cp -R "$RUNNER_TEMP/v44-evidence/." "$dest/"
          cp "$RUNNER_TEMP/v44-v4-pr1032.json" "$dest/observed-pr1032.json"
          cp "$RUNNER_TEMP/v44-v5-pr1033.json" "$dest/observed-pr1033.json"
          printf '%s\n' 'PROTECTED=false' 'SCIENCE_FALSE=true' 'ORDINAL46=NOT_ALLOCATED_NOT_RESERVED_NOT_DISPATCHED' 'SEEDS_CONSUMED=false' > "$dest/boundary.txt"
      - name: Upload immutable V44 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: avps-v44-preactual-diagnostic-${{ github.event.pull_request.head.sha }}
          path: v44-evidence-upload/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
