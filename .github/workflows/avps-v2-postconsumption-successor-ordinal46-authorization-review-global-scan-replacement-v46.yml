name: Review AVPS v2 successor ordinal46 authorization replacement v46

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - '.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v46.yml'
      - 'review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v46/review_authorization.py'

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: avps-v46-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

env:
  EXPECTED_MAIN: 6cd7c075766fe0c86bc7561ec205a3f9120fd1fb
  V46_REVIEW: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v46/review_authorization.py

jobs:
  preactual-diagnostic-v46:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact V46 identity
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: v46
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact frozen V45
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7f9f97c53ff5250f52c2bed4d3b504641ed2b649
          path: v45
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact frozen V44
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b2d117d2a7e141f6db76546736f1e610868ae271
          path: v44
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact frozen V43
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6c1cbbc06c8e56e3aef83e03577a18bbd6aa9835
          path: v43
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact frozen V42
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e9fc06b489407ed678adf394c8d08ba261f0b71a
          path: v42
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact frozen V41
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 76fec680fd2d8b0772b9b60b06b5122d437bc62a
          path: v41
          fetch-depth: 1
          persist-credentials: false

      - name: Set up exact V44/V42 Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'

      - name: Exact V46 boundary guards
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "${{ github.event.pull_request.draft }}" = 'true'
          test "${{ github.event.pull_request.base.sha }}" = "$EXPECTED_MAIN"
          test "${{ github.event.pull_request.base.ref }}" = 'main'
          test "${{ github.event.pull_request.head.ref }}" = 'review/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v46-20260916'
          python -m py_compile "$GITHUB_WORKSPACE/v46/$V46_REVIEW"
          test "$(git -C "$GITHUB_WORKSPACE/v45" rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v45/review_authorization.py)" = 'b57e2fcde6e218496d17346653c54b0785ce0992'
          test "$(git -C "$GITHUB_WORKSPACE/v45" rev-parse HEAD:.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v45.yml)" = 'e6e57cddc3eaec6899e9b7d6257de5aa140eb03f'
          test "$(git -C "$GITHUB_WORKSPACE/v44" rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v44/review_authorization.py)" = 'ba6649c19b15498b166e469a3778425d8d2c7759'
          test "$(git -C "$GITHUB_WORKSPACE/v44" rev-parse HEAD:.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v44.yml)" = '12ff576e6dcc6a68295a619fe3392c0c33497915'
          test "$(git -C "$GITHUB_WORKSPACE/v43" rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v43/review_authorization.py)" = '33032084f5f8a79cdd5e3ec4820929faeb153a0e'
          test "$(git -C "$GITHUB_WORKSPACE/v43" rev-parse HEAD:.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v43.yml)" = 'bd7d40f643f6bb86e79cef76f068810d92b1ae31'
          test "$(git -C "$GITHUB_WORKSPACE/v42" rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v42/review_authorization.py)" = 'ca32ab6af2152863fd58ff054e76a34db08e81d1'
          test "$(git -C "$GITHUB_WORKSPACE/v42" rev-parse HEAD:.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v42.yml)" = '070d35f797fd4cdb3ec049b75c4a2b37cbc93b2b'
          test "$(git -C "$GITHUB_WORKSPACE/v41" rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v41/review_authorization.py)" = '9856054db4e935719773ae4041b050140e79726d'
          test "$(git -C "$GITHUB_WORKSPACE/v41" rev-parse HEAD:.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v41.yml)" = 'df9bbd1605dd964e2bb2093241225c15d4b22fde'
          python - <<'PY'
          import marshal, sys
          assert sys.version_info[:3] == (3, 13, 15), sys.version
          assert marshal.version == 4, marshal.version
          PY

      - name: Fetch exact frozen V45 artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v45-artifact"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/10468405882/zip" \
            -o "$RUNNER_TEMP/v45-artifact.zip"
          test "$(sha256sum "$RUNNER_TEMP/v45-artifact.zip" | awk '{print $1}')" = 'f99518c3833ccefb3b12d659363a70267c096e9c76de8c8037ec77f7a61cfb48'
          unzip -q "$RUNNER_TEMP/v45-artifact.zip" -d "$RUNNER_TEMP/v45-artifact"
          test -s "$RUNNER_TEMP/v45-artifact/failure.json"
          test -s "$RUNNER_TEMP/v45-artifact/identity-construction-matrix.json"
          test -s "$RUNNER_TEMP/v45-artifact/candidate-generation.json"
          test -s "$RUNNER_TEMP/v45-artifact/candidate-predicate-table.json"

      - name: PRE-ACTUAL V46 raw-bytes identity reconstruction and causal classification
        id: preactual
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v46-evidence"
          python "$GITHUB_WORKSPACE/v46/$V46_REVIEW" \
            --v45-reviewer "$GITHUB_WORKSPACE/v45/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v45/review_authorization.py" \
            --v45-workflow "$GITHUB_WORKSPACE/v45/.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v45.yml" \
            --v44-reviewer "$GITHUB_WORKSPACE/v44/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v44/review_authorization.py" \
            --v44-workflow "$GITHUB_WORKSPACE/v44/.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v44.yml" \
            --v43-reviewer "$GITHUB_WORKSPACE/v43/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v43/review_authorization.py" \
            --v43-workflow "$GITHUB_WORKSPACE/v43/.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v43.yml" \
            --v42-reviewer "$GITHUB_WORKSPACE/v42/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v42/review_authorization.py" \
            --v42-workflow "$GITHUB_WORKSPACE/v42/.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v42.yml" \
            --v41-reviewer "$GITHUB_WORKSPACE/v41/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v41/review_authorization.py" \
            --v41-workflow "$GITHUB_WORKSPACE/v41/.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v41.yml" \
            --v45-artifact-dir "$RUNNER_TEMP/v45-artifact" \
            --out-dir "$RUNNER_TEMP/v46-evidence"

      - name: NON_AUTHORIZING ACTUAL exact executable V46 reviewer
        if: steps.preactual.outcome == 'success'
        shell: bash
        run: |
          echo 'V46 PRE-ACTUAL unexpectedly reached clean state; ACTUAL intentionally structurally unavailable in this diagnostic identity.'
          exit 97

      - name: Preserve immutable V46 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          dest="$GITHUB_WORKSPACE/v46-evidence-upload"
          mkdir -p "$dest"
          test ! -d "$RUNNER_TEMP/v46-evidence" || cp -R "$RUNNER_TEMP/v46-evidence/." "$dest/"
          cp "$RUNNER_TEMP/v45-artifact/failure.json" "$dest/frozen-v45-failure.json"
          printf '%s\n' \
            'PROTECTED=false' \
            'SCIENCE_FALSE=true' \
            'PUBLISHER=false' \
            'NEWMAPPING=false' \
            'PRODUCTION=false' \
            'ORDINAL46=NOT_ALLOCATED_NOT_RESERVED_NOT_DISPATCHED' \
            'SEEDS_CONSUMED=false' > "$dest/boundary.txt"

      - name: Upload immutable V46 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: avps-v46-preactual-diagnostic-${{ github.event.pull_request.head.sha }}
          path: v46-evidence-upload/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
          overwrite: false
