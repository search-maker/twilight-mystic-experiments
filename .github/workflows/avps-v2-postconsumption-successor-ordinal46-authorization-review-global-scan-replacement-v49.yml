name: Review AVPS v2 successor ordinal46 authorization replacement v49

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - '.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v49.yml'
      - 'review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v49/review_authorization.py'

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: avps-v49-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

env:
  EXPECTED_MAIN: 6cd7c075766fe0c86bc7561ec205a3f9120fd1fb
  V49_REVIEW: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v49/review_authorization.py

jobs:
  preactual-diagnostic-v49:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact V49 identity
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: v49
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact frozen V48
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a8328be970f5675d56ab5a1539b81c63773ee5d9
          path: v48
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout exact frozen V47
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b3e9d050c227ee0255a5a3ae065a90ac6c7a4ea2
          path: v47
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout exact frozen V46
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 848d8cf8d135eff3a262ccdf63fc0ecb19181434
          path: v46
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout exact frozen V45
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7f9f97c53ff5250f52c2bed4d3b504641ed2b649
          path: v45
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout exact frozen V44
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b2d117d2a7e141f6db76546736f1e610868ae271
          path: v44
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout exact frozen V43
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6c1cbbc06c8e56e3aef83e03577a18bbd6aa9835
          path: v43
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout exact frozen V42
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e9fc06b489407ed678adf394c8d08ba261f0b71a
          path: v42
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout exact frozen V41
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 76fec680fd2d8b0772b9b60b06b5122d437bc62a
          path: v41
          fetch-depth: 1
          persist-credentials: false

      - name: Set up frozen reconstruction runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'

      - name: Exact V49 boundary guards
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "${{ github.event.pull_request.draft }}" = 'true'
          test "${{ github.event.pull_request.base.sha }}" = "$EXPECTED_MAIN"
          test "${{ github.event.pull_request.base.ref }}" = 'main'
          test "${{ github.event.pull_request.head.ref }}" = 'review/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v49-20260916'
          python -m py_compile "$GITHUB_WORKSPACE/v49/$V49_REVIEW"
          test "$(git -C "$GITHUB_WORKSPACE/v48" rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v48/review_authorization.py)" = '63ed4cbd813e1999fe5b24e9fbbb405a488ea02d'
          test "$(git -C "$GITHUB_WORKSPACE/v48" rev-parse HEAD:.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v48.yml)" = 'ecc782f88d7eb4af8a65d3ebd4c893f1998c0d84'
          test "$(git -C "$GITHUB_WORKSPACE/v47" rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v47/review_authorization.py)" = '492cb7a60eb5083990b6fb8c5f27b8bb381b57d2'
          test "$(git -C "$GITHUB_WORKSPACE/v47" rev-parse HEAD:.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v47.yml)" = '8b2d7ab9a261cd77c861c0a3e04ac706f2564431'
          test "$(git -C "$GITHUB_WORKSPACE/v46" rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v46/review_authorization.py)" = '91b3f57dfe12a22ef26cac7d6d55452ef0d9617d'
          test "$(git -C "$GITHUB_WORKSPACE/v45" rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v45/review_authorization.py)" = 'b57e2fcde6e218496d17346653c54b0785ce0992'
          test "$(git -C "$GITHUB_WORKSPACE/v44" rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v44/review_authorization.py)" = 'ba6649c19b15498b166e469a3778425d8d2c7759'
          test "$(git -C "$GITHUB_WORKSPACE/v43" rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v43/review_authorization.py)" = '33032084f5f8a79cdd5e3ec4820929faeb153a0e'
          test "$(git -C "$GITHUB_WORKSPACE/v42" rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v42/review_authorization.py)" = 'ca32ab6af2152863fd58ff054e76a34db08e81d1'
          test "$(git -C "$GITHUB_WORKSPACE/v41" rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v41/review_authorization.py)" = '9856054db4e935719773ae4041b050140e79726d'
          python - <<'PY'
          import marshal, sys
          assert sys.version_info[:3] == (3, 13, 15), sys.version
          assert marshal.version == 4, marshal.version
          PY

      - name: Fetch exact frozen V48 V47 V46 and V44 artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for d in v48 v47 v46 v44; do mkdir -p "$RUNNER_TEMP/$d-artifact"; done
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/10473813679/zip" -o "$RUNNER_TEMP/v48-artifact.zip"
          test "$(sha256sum "$RUNNER_TEMP/v48-artifact.zip" | awk '{print $1}')" = 'c6ac1c761f4d328a635a6b22c4786221757df7c0bbd4657c77e1bc7abedd3560'
          unzip -q "$RUNNER_TEMP/v48-artifact.zip" -d "$RUNNER_TEMP/v48-artifact"
          test -s "$RUNNER_TEMP/v48-artifact/failure.json"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/10471659071/zip" -o "$RUNNER_TEMP/v47-artifact.zip"
          test "$(sha256sum "$RUNNER_TEMP/v47-artifact.zip" | awk '{print $1}')" = '4c1d4b109d51cf71571b2d24aae4d38daa9a02adaaf6a9fd3eb080a8784bd5f5'
          unzip -q "$RUNNER_TEMP/v47-artifact.zip" -d "$RUNNER_TEMP/v47-artifact"
          test -s "$RUNNER_TEMP/v47-artifact/failure.json"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/10470332990/zip" -o "$RUNNER_TEMP/v46-artifact.zip"
          test "$(sha256sum "$RUNNER_TEMP/v46-artifact.zip" | awk '{print $1}')" = '44a2a1707189afe209656f1e4485037c75639dbe2779530bb685dac959d2b375'
          unzip -q "$RUNNER_TEMP/v46-artifact.zip" -d "$RUNNER_TEMP/v46-artifact"
          test -s "$RUNNER_TEMP/v46-artifact/v41-policy-preservation.json"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/10466285466/zip" -o "$RUNNER_TEMP/v44-artifact.zip"
          test "$(sha256sum "$RUNNER_TEMP/v44-artifact.zip" | awk '{print $1}')" = 'c31cb3fbb74749ff8e98fb9807ab4165c299104ee84b7017dded5ded185c68da'
          unzip -q "$RUNNER_TEMP/v44-artifact.zip" -d "$RUNNER_TEMP/v44-artifact"
          test -s "$RUNNER_TEMP/v44-artifact/member-observations.json"

      - name: PRE-ACTUAL V49 static str encode provenance correction and marshal-origin trace
        id: preactual
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v49-evidence"
          python "$GITHUB_WORKSPACE/v49/$V49_REVIEW" \
            --v48-reviewer "$GITHUB_WORKSPACE/v48/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v48/review_authorization.py" \
            --v48-workflow "$GITHUB_WORKSPACE/v48/.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v48.yml" \
            --v47-reviewer "$GITHUB_WORKSPACE/v47/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v47/review_authorization.py" \
            --v47-workflow "$GITHUB_WORKSPACE/v47/.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v47.yml" \
            --v46-reviewer "$GITHUB_WORKSPACE/v46/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v46/review_authorization.py" \
            --v46-workflow "$GITHUB_WORKSPACE/v46/.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v46.yml" \
            --v45-reviewer "$GITHUB_WORKSPACE/v45/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v45/review_authorization.py" \
            --v45-workflow "$GITHUB_WORKSPACE/v45/.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v45.yml" \
            --v44-reviewer "$GITHUB_WORKSPACE/v44/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v44/review_authorization.py" \
            --v44-workflow "$GITHUB_WORKSPACE/v44/.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v44.yml" \
            --v43-reviewer "$GITHUB_WORKSPACE/v43/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v43/review_authorization.py" \
            --v43-workflow "$GITHUB_WORKSPACE/v43/.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v43.yml" \
            --v42-reviewer "$GITHUB_WORKSPACE/v42/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v42/review_authorization.py" \
            --v42-workflow "$GITHUB_WORKSPACE/v42/.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v42.yml" \
            --v41-reviewer "$GITHUB_WORKSPACE/v41/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v41/review_authorization.py" \
            --v41-workflow "$GITHUB_WORKSPACE/v41/.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v41.yml" \
            --v48-artifact-dir "$RUNNER_TEMP/v48-artifact" \
            --v47-artifact-dir "$RUNNER_TEMP/v47-artifact" \
            --v46-artifact-dir "$RUNNER_TEMP/v46-artifact" \
            --v44-artifact-dir "$RUNNER_TEMP/v44-artifact" \
            --out-dir "$RUNNER_TEMP/v49-evidence"

      - name: NON_AUTHORIZING ACTUAL exact executable V49 reviewer
        if: steps.preactual.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/v49/$V49_REVIEW" \
            --v48-reviewer "$GITHUB_WORKSPACE/v48/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v48/review_authorization.py" \
            --v48-workflow "$GITHUB_WORKSPACE/v48/.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v48.yml" \
            --v47-reviewer "$GITHUB_WORKSPACE/v47/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v47/review_authorization.py" \
            --v47-workflow "$GITHUB_WORKSPACE/v47/.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v47.yml" \
            --v46-reviewer "$GITHUB_WORKSPACE/v46/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v46/review_authorization.py" \
            --v46-workflow "$GITHUB_WORKSPACE/v46/.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v46.yml" \
            --v45-reviewer "$GITHUB_WORKSPACE/v45/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v45/review_authorization.py" \
            --v45-workflow "$GITHUB_WORKSPACE/v45/.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v45.yml" \
            --v44-reviewer "$GITHUB_WORKSPACE/v44/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v44/review_authorization.py" \
            --v44-workflow "$GITHUB_WORKSPACE/v44/.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v44.yml" \
            --v43-reviewer "$GITHUB_WORKSPACE/v43/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v43/review_authorization.py" \
            --v43-workflow "$GITHUB_WORKSPACE/v43/.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v43.yml" \
            --v42-reviewer "$GITHUB_WORKSPACE/v42/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v42/review_authorization.py" \
            --v42-workflow "$GITHUB_WORKSPACE/v42/.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v42.yml" \
            --v41-reviewer "$GITHUB_WORKSPACE/v41/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v41/review_authorization.py" \
            --v41-workflow "$GITHUB_WORKSPACE/v41/.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v41.yml" \
            --v48-artifact-dir "$RUNNER_TEMP/v48-artifact" \
            --v47-artifact-dir "$RUNNER_TEMP/v47-artifact" \
            --v46-artifact-dir "$RUNNER_TEMP/v46-artifact" \
            --v44-artifact-dir "$RUNNER_TEMP/v44-artifact" \
            --out-dir "$RUNNER_TEMP/v49-evidence" --actual

      - name: Preserve immutable V49 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          dest="$GITHUB_WORKSPACE/v49-evidence-upload"
          mkdir -p "$dest"
          test ! -d "$RUNNER_TEMP/v49-evidence" || cp -R "$RUNNER_TEMP/v49-evidence/." "$dest/"
          test ! -f "$RUNNER_TEMP/v48-artifact/failure.json" || cp "$RUNNER_TEMP/v48-artifact/failure.json" "$dest/frozen-v48-failure-source.json"
          printf '%s\n' \
            'PROTECTED=false' \
            'SCIENCE_FALSE=true' \
            'PUBLISHER=false' \
            'NEWMAPPING=false' \
            'PRODUCTION=false' \
            'ORDINAL46=NOT_ALLOCATED_NOT_RESERVED_NOT_DISPATCHED' \
            'SEEDS_CONSUMED=false' > "$dest/boundary.txt"

      - name: Upload immutable V49 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: avps-v49-preactual-diagnostic-${{ github.event.pull_request.head.sha }}
          path: v49-evidence-upload/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
          overwrite: false
