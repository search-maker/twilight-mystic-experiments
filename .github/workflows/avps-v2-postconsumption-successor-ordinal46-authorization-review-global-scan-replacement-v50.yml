name: Review AVPS v2 successor ordinal46 authorization replacement v50

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - '.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v50.yml'
      - 'review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v50/review_authorization.py'

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: avps-v50-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

env:
  EXPECTED_MAIN: 6cd7c075766fe0c86bc7561ec205a3f9120fd1fb
  V50_REVIEW: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v50/review_authorization.py

jobs:
  preactual-diagnostic-v50:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact V50 identity
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.event.pull_request.head.sha }}', path: v50, fetch-depth: 1, persist-credentials: false}
      - name: Checkout exact frozen V49
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: bc65e11a7a007c479220ef758bcbfbe61d8dadfc, path: v49, fetch-depth: 1, persist-credentials: false}
      - name: Checkout exact frozen V48
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: a8328be970f5675d56ab5a1539b81c63773ee5d9, path: v48, fetch-depth: 1, persist-credentials: false}
      - name: Checkout exact frozen V47
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: b3e9d050c227ee0255a5a3ae065a90ac6c7a4ea2, path: v47, fetch-depth: 1, persist-credentials: false}
      - name: Checkout exact frozen V46
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: 848d8cf8d135eff3a262ccdf63fc0ecb19181434, path: v46, fetch-depth: 1, persist-credentials: false}
      - name: Checkout exact frozen V45
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: 7f9f97c53ff5250f52c2bed4d3b504641ed2b649, path: v45, fetch-depth: 1, persist-credentials: false}
      - name: Checkout exact frozen V44
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: b2d117d2a7e141f6db76546736f1e610868ae271, path: v44, fetch-depth: 1, persist-credentials: false}
      - name: Checkout exact frozen V43
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: 6c1cbbc06c8e56e3aef83e03577a18bbd6aa9835, path: v43, fetch-depth: 1, persist-credentials: false}
      - name: Checkout exact frozen V42
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: e9fc06b489407ed678adf394c8d08ba261f0b71a, path: v42, fetch-depth: 1, persist-credentials: false}
      - name: Checkout exact frozen V41
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: 76fec680fd2d8b0772b9b60b06b5122d437bc62a, path: v41, fetch-depth: 1, persist-credentials: false}
      - name: Set up frozen reconstruction runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13.15'}
      - name: Exact V50 boundary guards
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "${{ github.event.pull_request.draft }}" = 'true'
          test "${{ github.event.pull_request.base.sha }}" = "$EXPECTED_MAIN"
          test "${{ github.event.pull_request.base.ref }}" = 'main'
          test "${{ github.event.pull_request.head.ref }}" = 'review/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v50-20260916'
          python -m py_compile "$GITHUB_WORKSPACE/v50/$V50_REVIEW"
          test "$(git -C "$GITHUB_WORKSPACE/v49" rev-parse HEAD)" = bc65e11a7a007c479220ef758bcbfbe61d8dadfc
          test "$(git -C "$GITHUB_WORKSPACE/v48" rev-parse HEAD)" = a8328be970f5675d56ab5a1539b81c63773ee5d9
          test "$(git -C "$GITHUB_WORKSPACE/v47" rev-parse HEAD)" = b3e9d050c227ee0255a5a3ae065a90ac6c7a4ea2
          test "$(git -C "$GITHUB_WORKSPACE/v46" rev-parse HEAD)" = 848d8cf8d135eff3a262ccdf63fc0ecb19181434
          test "$(git -C "$GITHUB_WORKSPACE/v45" rev-parse HEAD)" = 7f9f97c53ff5250f52c2bed4d3b504641ed2b649
          test "$(git -C "$GITHUB_WORKSPACE/v44" rev-parse HEAD)" = b2d117d2a7e141f6db76546736f1e610868ae271
          test "$(git -C "$GITHUB_WORKSPACE/v43" rev-parse HEAD)" = 6c1cbbc06c8e56e3aef83e03577a18bbd6aa9835
          test "$(git -C "$GITHUB_WORKSPACE/v42" rev-parse HEAD)" = e9fc06b489407ed678adf394c8d08ba261f0b71a
          test "$(git -C "$GITHUB_WORKSPACE/v41" rev-parse HEAD)" = 76fec680fd2d8b0772b9b60b06b5122d437bc62a
          python - <<'PY'
          import marshal,sys
          assert sys.version_info[:3] == (3,13,15), sys.version
          assert marshal.version == 4, marshal.version
          PY
      - name: Fetch exact frozen V49 artifact
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v49-artifact"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/10475446807/zip" -o "$RUNNER_TEMP/v49-artifact.zip"
          test "$(sha256sum "$RUNNER_TEMP/v49-artifact.zip" | awk '{print $1}')" = d4d173303be4f00e1faecb034c27de2d70eca5061c1f599dc818804dd1e4a5cc
          unzip -q "$RUNNER_TEMP/v49-artifact.zip" -d "$RUNNER_TEMP/v49-artifact"
          test -s "$RUNNER_TEMP/v49-artifact/failure.json"
          test -s "$RUNNER_TEMP/v49-artifact/v44-compiled-marshal-producer-graph.json"
      - name: PRE-ACTUAL V50 lexical-scope producer correction and marshal-origin trace
        id: preactual
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v50-evidence"
          python "$GITHUB_WORKSPACE/v50/$V50_REVIEW" \
            --v41-reviewer "$GITHUB_WORKSPACE/v41/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v41/review_authorization.py" --v41-workflow "$GITHUB_WORKSPACE/v41/.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v41.yml" \
            --v42-reviewer "$GITHUB_WORKSPACE/v42/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v42/review_authorization.py" --v42-workflow "$GITHUB_WORKSPACE/v42/.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v42.yml" \
            --v43-reviewer "$GITHUB_WORKSPACE/v43/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v43/review_authorization.py" --v43-workflow "$GITHUB_WORKSPACE/v43/.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v43.yml" \
            --v44-reviewer "$GITHUB_WORKSPACE/v44/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v44/review_authorization.py" --v44-workflow "$GITHUB_WORKSPACE/v44/.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v44.yml" \
            --v45-reviewer "$GITHUB_WORKSPACE/v45/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v45/review_authorization.py" --v45-workflow "$GITHUB_WORKSPACE/v45/.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v45.yml" \
            --v46-reviewer "$GITHUB_WORKSPACE/v46/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v46/review_authorization.py" --v46-workflow "$GITHUB_WORKSPACE/v46/.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v46.yml" \
            --v47-reviewer "$GITHUB_WORKSPACE/v47/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v47/review_authorization.py" --v47-workflow "$GITHUB_WORKSPACE/v47/.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v47.yml" \
            --v48-reviewer "$GITHUB_WORKSPACE/v48/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v48/review_authorization.py" --v48-workflow "$GITHUB_WORKSPACE/v48/.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v48.yml" \
            --v49-reviewer "$GITHUB_WORKSPACE/v49/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v49/review_authorization.py" --v49-workflow "$GITHUB_WORKSPACE/v49/.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v49.yml" \
            --v49-artifact-dir "$RUNNER_TEMP/v49-artifact" --out-dir "$RUNNER_TEMP/v50-evidence" --phase preactual
      - name: NON_AUTHORIZING ACTUAL V50 reviewer
        if: steps.preactual.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v50-actual-evidence"
          python "$GITHUB_WORKSPACE/v50/$V50_REVIEW" \
            --v41-reviewer "$GITHUB_WORKSPACE/v41/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v41/review_authorization.py" --v41-workflow "$GITHUB_WORKSPACE/v41/.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v41.yml" \
            --v42-reviewer "$GITHUB_WORKSPACE/v42/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v42/review_authorization.py" --v42-workflow "$GITHUB_WORKSPACE/v42/.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v42.yml" \
            --v43-reviewer "$GITHUB_WORKSPACE/v43/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v43/review_authorization.py" --v43-workflow "$GITHUB_WORKSPACE/v43/.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v43.yml" \
            --v44-reviewer "$GITHUB_WORKSPACE/v44/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v44/review_authorization.py" --v44-workflow "$GITHUB_WORKSPACE/v44/.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v44.yml" \
            --v45-reviewer "$GITHUB_WORKSPACE/v45/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v45/review_authorization.py" --v45-workflow "$GITHUB_WORKSPACE/v45/.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v45.yml" \
            --v46-reviewer "$GITHUB_WORKSPACE/v46/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v46/review_authorization.py" --v46-workflow "$GITHUB_WORKSPACE/v46/.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v46.yml" \
            --v47-reviewer "$GITHUB_WORKSPACE/v47/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v47/review_authorization.py" --v47-workflow "$GITHUB_WORKSPACE/v47/.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v47.yml" \
            --v48-reviewer "$GITHUB_WORKSPACE/v48/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v48/review_authorization.py" --v48-workflow "$GITHUB_WORKSPACE/v48/.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v48.yml" \
            --v49-reviewer "$GITHUB_WORKSPACE/v49/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v49/review_authorization.py" --v49-workflow "$GITHUB_WORKSPACE/v49/.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v49.yml" \
            --v49-artifact-dir "$RUNNER_TEMP/v49-artifact" --out-dir "$RUNNER_TEMP/v50-actual-evidence" --phase actual
      - name: Assemble immutable V50 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf v50-evidence-upload; mkdir -p v50-evidence-upload
          if [ -d "$RUNNER_TEMP/v50-evidence" ]; then cp -a "$RUNNER_TEMP/v50-evidence/." v50-evidence-upload/; fi
          if [ -d "$RUNNER_TEMP/v50-actual-evidence" ]; then mkdir -p v50-evidence-upload/actual; cp -a "$RUNNER_TEMP/v50-actual-evidence/." v50-evidence-upload/actual/; fi
          printf '%s\n' 'PROTECTED=false' 'SCIENCE=false' 'PUBLISHER=false' 'NEWMAPPING=false' 'PRODUCTION=false' 'ORDINAL46=NOT_ALLOCATED_NOT_RESERVED_NOT_DISPATCHED' 'SEEDS_CONSUMED=false' > v50-evidence-upload/boundary.txt
          find v50-evidence-upload -type f -print0 | sort -z | xargs -0 sha256sum > v50-evidence-upload/files.sha256
      - name: Upload immutable V50 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: avps-v50-preactual-diagnostic-${{ github.event.pull_request.head.sha }}
          path: v50-evidence-upload/
          if-no-files-found: error
          compression-level: 0
