          import marshal,sys
          assert sys.version_info[:3] == (3,13,15), sys.version
          assert marshal.version == 4, marshal.version
          PY
      - name: Fetch exact frozen V51 artifact
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v51-artifact"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/10478209364/zip" -o "$RUNNER_TEMP/v51-artifact.zip"
          test "$(sha256sum "$RUNNER_TEMP/v51-artifact.zip" | awk '{print $1}')" = 66cc9aaf46f6a117405da2e0b2c0c01a6d1a15b9fedeab64792dbe40ed0863f7
          unzip -q "$RUNNER_TEMP/v51-artifact.zip" -d "$RUNNER_TEMP/v51-artifact"
          test "$(sha256sum "$RUNNER_TEMP/v51-artifact/failure.json" | awk '{print $1}')" = 4e09348fc1d4202caa10bc3544ae4a9de8df1684489aa71f5e5a06c45584bae5
      - name: PRE-ACTUAL V52 compile-filename provenance forensic
        id: preactual
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v52-evidence"
          python "$V52_REVIEW" --v51-reviewer "$GITHUB_WORKSPACE/v51/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v51/review_authorization.py" --v51-workflow "$GITHUB_WORKSPACE/v51/.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v51.yml" --v51-artifact-dir "$RUNNER_TEMP/v51-artifact" --out-dir "$RUNNER_TEMP/v52-evidence" --phase preactual
      - name: NON_AUTHORIZING ACTUAL V52 reviewer
        if: steps.preactual.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v52-actual-evidence"
          python "$V52_REVIEW" --v51-reviewer "$GITHUB_WORKSPACE/v51/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v51/review_authorization.py" --v51-workflow "$GITHUB_WORKSPACE/v51/.github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v51.yml" --v51-artifact-dir "$RUNNER_TEMP/v51-artifact" --out-dir "$RUNNER_TEMP/v52-actual-evidence" --phase actual
      - name: Assemble immutable V52 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf v52-evidence-upload; mkdir -p v52-evidence-upload
          if [ -d "$RUNNER_TEMP/v52-evidence" ]; then cp -a "$RUNNER_TEMP/v52-evidence/." v52-evidence-upload/; fi
          if [ -d "$RUNNER_TEMP/v52-actual-evidence" ]; then mkdir -p v52-evidence-upload/actual; cp -a "$RUNNER_TEMP/v52-actual-evidence/." v52-evidence-upload/actual/; fi
          printf '%s\n' 'PROTECTED=false' 'SCIENCE=false' 'PUBLISHER=false' 'NEWMAPPING=false' 'PRODUCTION=false' 'ORDINAL46=NOT_ALLOCATED_NOT_RESERVED_NOT_DISPATCHED' 'SEEDS_CONSUMED=false' > v52-evidence-upload/boundary.txt
          find v52-evidence-upload -type f -print0 | sort -z | xargs -0 sha256sum > v52-evidence-upload/files.sha256
      - name: Upload immutable V52 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: avps-v52-preactual-diagnostic-${{ github.event.pull_request.head.sha }}
          path: v52-evidence-upload/
          if-no-files-found: error
          compression-level: 0
