      - name: Bind exact V52 API identities and artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_HEAD_REF" = "$EXPECTED_BRANCH"
          mkdir -p /tmp/v53-api /tmp/v53-evidence
          api='https://api.github.com/repos/search-maker/twilight-mystic-experiments'
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          curl -fsSL "${auth[@]}" "$api/pulls/1081" -o /tmp/v53-api/pr.json
          curl -fsSL "${auth[@]}" "$api/actions/runs/35297047249" -o /tmp/v53-api/run.json
          curl -fsSL "${auth[@]}" "$api/actions/runs/35297047249/jobs?per_page=100" -o /tmp/v53-api/jobs.json
          curl -fsSL "${auth[@]}" "$api/actions/artifacts/10527608421" -o /tmp/v53-api/artifact.json
          curl -fsSL -L "${auth[@]}" "$api/actions/artifacts/10527608421/zip" -o /tmp/v52-artifact.zip
          printf '%s  %s\n' "$(sha256sum /tmp/v52-artifact.zip | awk '{print $1}')" /tmp/v52-artifact.zip

      - name: Run V53 result-blind exhaustive PRE-ACTUAL reviewer
        shell: bash
        run: |
          set -uo pipefail
          set +e
          python "$V53_REVIEW" \
            --v53 v53 --v52 v52 --v51 v51 \
            --v50 v50 \
            --v49 v49 \
            --v48 v48 \
            --v47 v47 \
            --v46 v46 \
            --v45 v45 \
            --v44 v44 \
            --v43 v43 \
            --v42 v42 \
            --v41 v41 \
            --artifact /tmp/v52-artifact.zip --api /tmp/v53-api --out /tmp/v53-evidence
          rc=$?
          set -e
          printf '%s\n' "$rc" > /tmp/v53-evidence/exit-code.txt
          exit 0

      - name: Upload frozen V53 PRE-ACTUAL evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v53-preactual-proof
          path: /tmp/v53-evidence
          if-no-files-found: error
          retention-days: 90

      - name: Enforce V53 fail-closed outcome
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/v53-evidence/exit-code.txt
          test "$(cat /tmp/v53-evidence/exit-code.txt)" = 0
