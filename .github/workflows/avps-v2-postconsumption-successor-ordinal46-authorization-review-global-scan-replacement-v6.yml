name: Review AVPS v2 successor ordinal46 authorization replacement v6

on:
  pull_request:
    types: [opened, edited]
    branches:
      - main
    paths:
      - .github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v6.yml
      - review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v6/review_authorization.py

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read
  discussions: read

concurrency:
  group: avps-v2-successor-ordinal46-authorization-review-v6-${{ github.event.pull_request.head.sha }}-${{ github.event.action }}
  cancel-in-progress: false

jobs:
  actual-stress:
    if: github.event.action == 'opened'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout exact reviewer-v6 bytes into dedicated checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: review-infra
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact frozen PR1026 subject into dedicated checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 5028cb7c7cd585d720749f0d572aa15e2f614bf9
          path: subject
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact frozen reviewer-v5 source into dedicated checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 0d7ad7030aacc1c34bca93fef6c02fd7dcf776c2
          path: v5-base
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact frozen reviewer-v4 source into dedicated checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: a3fc752af64599eed1dc5e358a23295e423b1eb8
          path: v4-base
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: NON_AUTHORIZING ACTUAL exact-executable stress on v6 bytes
        shell: bash
        working-directory: subject
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_MAIN: f5ebc646aba96ad13753d55baf2b0c55cff64ccb
          EXPECTED_SUBJECT_HEAD: 5028cb7c7cd585d720749f0d572aa15e2f614bf9
          EXPECTED_AUTH_BLOB: 3dd0f80ff878d09987a91af0b4860a449fd41a92
          EXPECTED_REVIEW_SCRIPT_BLOB: b53cdc4787b6714b6f14f6de90fca56c897ba751
          EXPECTED_WQ_PARSER_BLOB: 7628651c9ddf740669d1fedf8fb18887d7155fe6
          EXPECTED_V5_HEAD: 0d7ad7030aacc1c34bca93fef6c02fd7dcf776c2
          EXPECTED_V5_SCRIPT_BLOB: 6bf506cc0af62a313461db168c614b3494d6a95f
          EXPECTED_V4_HEAD: a3fc752af64599eed1dc5e358a23295e423b1eb8
          EXPECTED_V4_SCRIPT_BLOB: 24b388589c0592b0a201313b57909888effd53ea
          AUTH_PATH: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-authorization-control-v2/authorization.json
          WQ_PATH: scripts/avps_write_quiet_parser_v1.py
          REVIEW_SCRIPT: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v6/review_authorization.py
          V5_SCRIPT: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v5/review_authorization.py
          V4_SCRIPT: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v4/review_authorization.py
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "${{ github.event.action }}" = "opened"
          test "${{ github.event.pull_request.base.sha }}" = "$EXPECTED_MAIN"
          test "${{ github.event.pull_request.base.ref }}" = "main"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SUBJECT_HEAD"
          test "$(git rev-parse HEAD:$AUTH_PATH)" = "$EXPECTED_AUTH_BLOB"
          test "$(git rev-parse HEAD:$WQ_PATH)" = "$EXPECTED_WQ_PARSER_BLOB"
          test "$(git -C ../review-infra rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git -C ../review-infra rev-parse HEAD:$REVIEW_SCRIPT)" = "$EXPECTED_REVIEW_SCRIPT_BLOB"
          test "$(git -C ../v5-base rev-parse HEAD)" = "$EXPECTED_V5_HEAD"
          test "$(git -C ../v5-base rev-parse HEAD:$V5_SCRIPT)" = "$EXPECTED_V5_SCRIPT_BLOB"
          test "$(git -C ../v4-base rev-parse HEAD)" = "$EXPECTED_V4_HEAD"
          test "$(git -C ../v4-base rev-parse HEAD:$V4_SCRIPT)" = "$EXPECTED_V4_SCRIPT_BLOB"
          test "$(git rev-parse --show-toplevel)" != "$(git -C ../review-infra rev-parse --show-toplevel)"
          test "$(git rev-parse --show-toplevel)" != "$(git -C ../v5-base rev-parse --show-toplevel)"
          test "$(git rev-parse --show-toplevel)" != "$(git -C ../v4-base rev-parse --show-toplevel)"
          test "$(git -C ../review-infra rev-parse --show-toplevel)" != "$(git -C ../v5-base rev-parse --show-toplevel)"
          test "$(git -C ../review-infra rev-parse --show-toplevel)" != "$(git -C ../v4-base rev-parse --show-toplevel)"
          test "$(git -C ../v5-base rev-parse --show-toplevel)" != "$(git -C ../v4-base rev-parse --show-toplevel)"
          python -m py_compile "../review-infra/$REVIEW_SCRIPT"
          python "../review-infra/$REVIEW_SCRIPT" \
            --repo "$GITHUB_REPOSITORY" \
            --tok "$GITHUB_TOKEN" \
            --rpr "${{ github.event.pull_request.number }}" \
            --rh "${{ github.event.pull_request.head.sha }}" \
            --rb "${{ github.event.pull_request.head.ref }}" \
            --base "${{ github.event.pull_request.base.sha }}" \
            --bb "${{ github.event.pull_request.base.ref }}" \
            --run "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            --event "$GITHUB_EVENT_NAME" \
            --action "${{ github.event.action }}" \
            --mode stress \
            --ev avps-ordinal46-authorization-review-v6-stress-evidence

      - name: Upload immutable NON_AUTHORIZING ACTUAL v6 stress proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v6-actual-stress-proof
          path: subject/avps-ordinal46-authorization-review-v6-stress-evidence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  authorization-review:
    if: github.event.action == 'edited' && contains(github.event.pull_request.body, 'AVPS_V6_PROTECTED_LAUNCH | authorized=true | ')
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout exact reviewer-v6 bytes into dedicated checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: review-infra
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact frozen PR1026 subject into dedicated checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 5028cb7c7cd585d720749f0d572aa15e2f614bf9
          path: subject
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact frozen reviewer-v5 source into dedicated checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 0d7ad7030aacc1c34bca93fef6c02fd7dcf776c2
          path: v5-base
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact frozen reviewer-v4 source into dedicated checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: a3fc752af64599eed1dc5e358a23295e423b1eb8
          path: v4-base
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Run protected zero-runtime authorization-time review v6
        shell: bash
        working-directory: subject
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_MAIN: f5ebc646aba96ad13753d55baf2b0c55cff64ccb
          EXPECTED_SUBJECT_HEAD: 5028cb7c7cd585d720749f0d572aa15e2f614bf9
          EXPECTED_AUTH_BLOB: 3dd0f80ff878d09987a91af0b4860a449fd41a92
          EXPECTED_REVIEW_SCRIPT_BLOB: b53cdc4787b6714b6f14f6de90fca56c897ba751
          EXPECTED_V5_HEAD: 0d7ad7030aacc1c34bca93fef6c02fd7dcf776c2
          EXPECTED_V5_SCRIPT_BLOB: 6bf506cc0af62a313461db168c614b3494d6a95f
          EXPECTED_V4_HEAD: a3fc752af64599eed1dc5e358a23295e423b1eb8
          EXPECTED_V4_SCRIPT_BLOB: 24b388589c0592b0a201313b57909888effd53ea
          REVIEW_SCRIPT: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v6/review_authorization.py
          V5_SCRIPT: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v5/review_authorization.py
          V4_SCRIPT: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v4/review_authorization.py
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "${{ github.event.action }}" = "edited"
          test "${{ github.event.pull_request.base.sha }}" = "$EXPECTED_MAIN"
          test "${{ github.event.pull_request.base.ref }}" = "main"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SUBJECT_HEAD"
          test "$(git rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-authorization-control-v2/authorization.json)" = "$EXPECTED_AUTH_BLOB"
          test "$(git -C ../review-infra rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git -C ../review-infra rev-parse HEAD:$REVIEW_SCRIPT)" = "$EXPECTED_REVIEW_SCRIPT_BLOB"
          test "$(git -C ../v5-base rev-parse HEAD)" = "$EXPECTED_V5_HEAD"
          test "$(git -C ../v5-base rev-parse HEAD:$V5_SCRIPT)" = "$EXPECTED_V5_SCRIPT_BLOB"
          test "$(git -C ../v4-base rev-parse HEAD)" = "$EXPECTED_V4_HEAD"
          test "$(git -C ../v4-base rev-parse HEAD:$V4_SCRIPT)" = "$EXPECTED_V4_SCRIPT_BLOB"
          python "../review-infra/$REVIEW_SCRIPT" \
            --repo "$GITHUB_REPOSITORY" \
            --tok "$GITHUB_TOKEN" \
            --rpr "${{ github.event.pull_request.number }}" \
            --rh "${{ github.event.pull_request.head.sha }}" \
            --rb "${{ github.event.pull_request.head.ref }}" \
            --base "${{ github.event.pull_request.base.sha }}" \
            --bb "${{ github.event.pull_request.base.ref }}" \
            --run "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            --event "$GITHUB_EVENT_NAME" \
            --action "${{ github.event.action }}" \
            --mode review \
            --ev avps-ordinal46-authorization-review-v6-evidence

      - name: Upload authorization-time review proof v6
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-replacement-v6-proof
          path: subject/avps-ordinal46-authorization-review-v6-evidence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
