name: Review AVPS v2 successor ordinal46 authorization

on:
  pull_request:
    types: [opened]
    branches:
      - review/avps-v2-postconsumption-successor-ordinal46-authorization-child-v1-20260909
    paths:
      - .github/workflows/avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-v1.yml
      - review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-v1/review_authorization.py

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: avps-v2-successor-ordinal46-authorization-review-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  authorization-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout exact frozen PR1026 subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact reviewer bytes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: review-infra
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Run protected zero-runtime authorization-time review
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_REVIEW_SCRIPT_BLOB: d26c0cac3885f5f36c4204fecf8b272f797bf2d7
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git -C review-infra rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-v1/review_authorization.py)" = "$EXPECTED_REVIEW_SCRIPT_BLOB"
          python review-infra/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-v1/review_authorization.py \
            --repo "$GITHUB_REPOSITORY" \
            --tok "$GITHUB_TOKEN" \
            --rpr "${{ github.event.pull_request.number }}" \
            --rh "${{ github.event.pull_request.head.sha }}" \
            --rb "${{ github.event.pull_request.head.ref }}" \
            --base "${{ github.event.pull_request.base.sha }}" \
            --bb "${{ github.event.pull_request.base.ref }}" \
            --run "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            --event "$GITHUB_EVENT_NAME" \
            --action "${{ github.event.action }}" \
            --ev avps-ordinal46-authorization-review-evidence

      - name: Upload authorization-time review proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: avps-v2-postconsumption-successor-ordinal46-authorization-review-global-scan-v1-proof
          path: avps-ordinal46-authorization-review-evidence/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90
