name: AVPS v2 postconsumption successor preauthorization v1

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/avps-v2-postconsumption-successor-preauthorization-v1.yml
      - review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-preauth-v1/preauthorize.py
      - review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-preauth-v1/repository_global_seed_scan.py
      - review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-preauth-v1/seed_ledger.py

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: avps-v2-postconsumption-successor-preauth-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  preauthorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Run exact result-blind successor preauthorization derivation
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CONTROL_DIR: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-successor-preauth-v1
          ORDINAL42_AUTH_HEAD: e627a689ada0493a8a5b9cdafc4aba0198fbabec
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$EVENT_BASE" = 8cd85cf393e2d86a1b6d7325654747460a13e697
          test "$EVENT_BRANCH" = review/avps-v2-postconsumption-successor-preauth-v1-20260909
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          export PYTHONPATH="$GITHUB_WORKSPACE${PYTHONPATH:+:$PYTHONPATH}"
          ORDINAL42_WORKTREE="$RUNNER_TEMP/avps-successor-ordinal42-auth-native"
          trap 'git worktree remove --force "$ORDINAL42_WORKTREE" >/dev/null 2>&1 || true' EXIT
          git worktree add --detach "$ORDINAL42_WORKTREE" "$ORDINAL42_AUTH_HEAD"
          export AVPS_ORDINAL42_LEDGER_PATH="$ORDINAL42_WORKTREE/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-seed-freshness-v1/seed_ledger.py"
          python "$CONTROL_DIR/preauthorize.py" \
            --repository "$GITHUB_REPOSITORY" \
            --token "$GITHUB_TOKEN" \
            --pr "$EVENT_PR" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --event-name "$GITHUB_EVENT_NAME" \
            --branch "$EVENT_BRANCH" \
            --head "$EVENT_HEAD" \
            --expected-main "$EVENT_BASE" \
            --evidence-dir preauth-evidence

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vertical-profile-v2-postconsumption-successor-preauthorization-proof
          path: preauth-evidence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
