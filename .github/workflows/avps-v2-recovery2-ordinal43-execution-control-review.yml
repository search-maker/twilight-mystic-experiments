name: Review AVPS v2 recovery2 ordinal43 execution control

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery2-ordinal43-execution-control-review.yml
      - review/avps-v2-recovery2-ordinal43-execution-control-v1/**

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: avps-v2-recovery2-ordinal43-execution-control-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_MAIN: cfeeb0635c2874e2695884a9b4ec48bc9f73e6b6
      BRANCH: review/avps-v2-recovery2-ordinal43-execution-control-v1
      CONTRACT: review/avps-v2-recovery2-ordinal43-execution-control-v1/execution-delta.review.json
      AUTH_BRANCH: authorization/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-ordinal-43
      AUTH_HEAD: 5fd0c82cb14a02ace38a5a7be30b8b075ccae298
      AUTH_PARENT: 0842dd27f62c4bc2af4b5763ae4dd547ee009fce
      AUTH_PR: '647'
      AUTH_REVIEW_RUN: '33277629404'
      AUTH_REVIEW_ARTIFACT: '9722104370'
      AUTH_REVIEW_DIGEST: sha256:9dac9e9305b78e2ddbceacbc10a19435121b0eeacfe48550d23878359556ae15
      ALLOCATION_MARKER: ORDINAL43_AVPS_V2_POSTCONSUMPTION_RECOVERY2_AUTHORIZATION_ALLOCATED_REVIEWED_NOT_DISPATCHED commit=5fd0c82cb14a02ace38a5a7be30b8b075ccae298 parent=0842dd27f62c4bc2af4b5763ae4dd547ee009fce pr=647
      CONSUMED_MARKER: ORDINAL43_AVPS_V2_POSTCONSUMPTION_RECOVERY2_DISPATCH_CONSUMED
      DISPATCH_BRANCH: dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-ordinal-43
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Prove exact three-file solver-free scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "${{ github.event.pull_request.head.ref }}" = "$BRANCH"
          test "${{ github.event.pull_request.base.ref }}" = main
          test "${{ github.event.pull_request.base.sha }}" = "$BASE_MAIN"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git diff --name-only "$BASE_MAIN...HEAD" | sort > changed.txt
          cat > expected.txt <<'EOF'
          .github/workflows/avps-v2-recovery2-ordinal43-execution-control-review.yml
          review/avps-v2-recovery2-ordinal43-execution-control-v1/PROTOCOL.md
          review/avps-v2-recovery2-ordinal43-execution-control-v1/execution-delta.review.json
          EOF
          sort -o expected.txt expected.txt
          diff -u expected.txt changed.txt
          test -z "$(command -v uvspec || true)"

      - name: Verify frozen source bytes and recovery2 contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$BASE_MAIN:.github/workflows/avps-v2-postconsumption-recovery1-science.yml")" = 7af7f28269ad245b1b9218012707957b048a6875
          test "$(git rev-parse "$BASE_MAIN:.github/workflows/avps-v2-postconsumption-recovery1-dispatch-publisher.yml")" = 885abc21c86d3bb0c3777e63b6254520479db34f
          test "$(git rev-parse "$BASE_MAIN:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-science-transport-v1/native_authorization_seed_transport.py")" = 2df2c3fd1ffa78e16f44e6825d67b3e82e903c1e
          test "$(git rev-parse "$BASE_MAIN:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-seed-freshness-v1/seed_ledger.py")" = d4bdc95e9ed576fa6c70711c81d8097ddab33dbf
          test "$(git rev-parse "$BASE_MAIN:review/aerosol-vertical-profile-sensitivity-v2-control-v1/rh_audit_dependency.py")" = 095ff86f12a79dc312a51f734b0a03bd318f2337
          test "$(git rev-parse "$AUTH_HEAD:review/avps-v2-recovery2-posttransport-authorization-control-recovery-v1/authorization.json")" = 9db4602cd2877161b9c4d6d5ffad27409c52dd3f
          test "$(git rev-parse "$AUTH_HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-seed-freshness-v1/seed_ledger.py")" = d4bdc95e9ed576fa6c70711c81d8097ddab33dbf
          test "$(git rev-parse "e627a689ada0493a8a5b9cdafc4aba0198fbabec:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-seed-freshness-v1/seed_ledger.py")" = 491d1b6653bea0fcc5275269723a76aa1af52300
          python - <<'PY'
          import json
          c=json.load(open('review/avps-v2-recovery2-ordinal43-execution-control-v1/execution-delta.review.json'))
          assert c['status']=='REVIEW_ONLY_RECOVERY2_ORDINAL43_EXECUTION_DELTA_FROZEN_DISPATCH_NOT_AUTHORIZED'
          assert c['sourceMain']=='cfeeb0635c2874e2695884a9b4ec48bc9f73e6b6'
          assert c['scientificDesignChanged'] is False
          assert c['scientificOrdinal']==43
          assert c['executionKey']=='aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2:numerical:43'
          a=c['authorization']; s=c['freshSeedIdentity']; n=c['nativeSeedTransport']; f=c['frozenScientificContract']; r=c['requiredRecovery2Implementation']; o=c['resultOpeningBoundary']
          assert a['head']=='5fd0c82cb14a02ace38a5a7be30b8b075ccae298' and a['parent']=='0842dd27f62c4bc2af4b5763ae4dd547ee009fce' and a['pr']==647
          assert a['reviewRunId']==33277629404 and a['reviewRunAttempt']==1 and a['reviewArtifactId']==9722104370
          assert s['count']==72 and s['canonicalSha256']=='38c074fe01bd6d09fa7dc78af1ad323e2f42b606ca992c2950b8fc1f5b343a9f'
          assert s['rowsCanonicalSha256']=='a88b28dcfaaeb354f294d1705a0f8ddbcd061083f277a038ab8c9dace44d9954' and s['overlapWithConsumedOrdinal41']==0 and s['overlapWithConsumedOrdinal42']==0
          assert n['helperGitBlobSha1']=='2df2c3fd1ffa78e16f44e6825d67b3e82e903c1e' and n['nativePathValidationRequired'] is True and n['relocationBeforeValidationPermitted'] is False
          assert f['caseCount']==360 and f['commonRandomNumberGroupCount']==72 and f['statesPerGroup']==5 and f['photonHistoriesPerCase']==20000000 and f['attemptRequired']==1
          assert r['newScienceWorkflowRequired'] and r['newZeroRuntimePublisherRequired'] and r['newOneUseTriggerBridgeRequired']
          assert r['scientificMatrixGeometryWavelengthsProfilesPhotonBudgetStoppingAnalysisMayChange'] is False
          assert r['freshPreDispatchTrackedTreeSeedRecheckRequired'] and r['freshPreDispatchRepositoryGlobalSeedRecheckRequired'] and r['freshPreDispatchGlobalOrdinalIdentityRecheckRequired']
          for k in ('resultOpeningAuthorized','levelBOpeningAuthorized','protectedHoldoutOpeningAuthorized','productionAuthorized'):
              assert o[k] is False
          assert o['taylorOrJerusalemScoringPermitted'] is False
          assert all(x['reusable'] is False and x['numericalConclusionAvailable'] is False for x in c['consumedPredecessors'])
          PY

      - name: Verify live allocation and still-closed execution state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p review-evidence
          gh api "repos/$GITHUB_REPOSITORY/pulls/$AUTH_PR" > review-evidence/auth-pr.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$AUTH_REVIEW_RUN" > review-evidence/auth-review-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$AUTH_REVIEW_ARTIFACT" > review-evidence/auth-review-artifact.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > review-evidence/issue60-pages.json
          python - <<'PY'
          import json,os,subprocess
          p=json.load(open('review-evidence/auth-pr.json')); r=json.load(open('review-evidence/auth-review-run.json')); a=json.load(open('review-evidence/auth-review-artifact.json'))
          if p['state']!='open' or p['draft'] is not True or p['merged_at'] is not None or p['head']['sha']!=os.environ['AUTH_HEAD'] or p['base']['sha']!=os.environ['AUTH_PARENT']:
              raise SystemExit('authorization PR drift')
          if r['id']!=int(os.environ['AUTH_REVIEW_RUN']) or r['head_sha']!=os.environ['AUTH_HEAD'] or r['run_attempt']!=1 or r['status']!='completed' or r['conclusion']!='success':
              raise SystemExit('authorization review run drift')
          if a['id']!=int(os.environ['AUTH_REVIEW_ARTIFACT']) or a.get('digest')!=os.environ['AUTH_REVIEW_DIGEST'] or a.get('expired'):
              raise SystemExit('authorization review artifact drift')
          pages=json.load(open('review-evidence/issue60-pages.json')); bodies=[str(x.get('body') or '').strip() for page in pages for x in page]
          if sum(x==os.environ['ALLOCATION_MARKER'] for x in bodies)!=1: raise SystemExit('allocation marker cardinality drift')
          if any(x.startswith(os.environ['CONSUMED_MARKER']) for x in bodies): raise SystemExit('ordinal43 already consumed')
          cp=subprocess.run(['git','ls-remote','--heads','origin',os.environ['DISPATCH_BRANCH']],capture_output=True,text=True,check=True)
          if cp.stdout.strip(): raise SystemExit('ordinal43 dispatch branch already exists')
          PY

      - name: Freeze solver-free review receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          paths=[
            '.github/workflows/avps-v2-recovery2-ordinal43-execution-control-review.yml',
            'review/avps-v2-recovery2-ordinal43-execution-control-v1/PROTOCOL.md',
            'review/avps-v2-recovery2-ordinal43-execution-control-v1/execution-delta.review.json',
          ]
          out={
            'schemaVersion':1,
            'status':'PASS_AVPS_V2_RECOVERY2_ORDINAL43_EXECUTION_DELTA_REVIEW_DISPATCH_NOT_AUTHORIZED',
            'head':os.environ['GITHUB_SHA'],
            'baseMain':os.environ['BASE_MAIN'],
            'scientificOrdinal':43,
            'authorizationHead':os.environ['AUTH_HEAD'],
            'authorizationReviewRunId':33277629404,
            'authorizationReviewArtifactId':9722104370,
            'fileSha256':{p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths},
            'dispatchCreated':False,
            'scientificRuntimeSetupPerformed':False,
            'solverExecutionPerformed':False,
            'resultOpeningPerformed':False,
            'levelBOpened':False,
            'productionAuthorized':False,
            'taylorOrJerusalemUsed':False,
          }
          Path('review-evidence/review-receipt.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: avps-v2-recovery2-ordinal43-execution-control-review
          path: review-evidence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
