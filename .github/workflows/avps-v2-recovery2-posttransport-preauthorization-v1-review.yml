name: Review AVPS v2 recovery2 post-transport preauthorization

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/avps-v2-recovery2-posttransport-preauthorization-v1-review.yml
      - review/avps-v2-recovery2-posttransport-preauthorization-v1/**

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: avps-v2-recovery2-posttransport-preauth-${{ github.event.pull_request.number }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      BASE_MAIN: e0f632013a5ded92203b3eeb3df083f5ea5d40fc
      EXPECTED_BRANCH: review/avps-v2-recovery2-posttransport-preauthorization-v1
      FENCE_TOKEN: AVPS_V2_RECOVERY2_POSTTRANSPORT_PREAUTH_GLOBAL_SCAN_V1
      ORDINAL42_AUTH_HEAD: e627a689ada0493a8a5b9cdafc4aba0198fbabec
      ORDINAL42_LEDGER_BLOB: 491d1b6653bea0fcc5275269723a76aa1af52300
      SEED_REVIEW_HEAD: 12b6b80853b41d768e220772d3a93cf5a7a6ed54
      SEED_REVIEW_RUN: '33260810647'
      SEED_REVIEW_ARTIFACT: '9717283554'
      SEED_REVIEW_DIGEST: sha256:0295c1e76e68f4436430a7b01bce5fa1138c15cb4a4061cd227c56620a00b89a
      TRANSPORT_PR: '643'
      TRANSPORT_HEAD: 6f22ffa543e31cc9de6f3245e3bd1bd1db8e9534
      TRANSPORT_MERGE: e0f632013a5ded92203b3eeb3df083f5ea5d40fc
      TRANSPORT_HELPER_BLOB: 2df2c3fd1ffa78e16f44e6825d67b3e82e903c1e
      NEW_SEED_CANONICAL: 38c074fe01bd6d09fa7dc78af1ad323e2f42b606ca992c2950b8fc1f5b343a9f
      NEW_ROWS_CANONICAL: a88b28dcfaaeb354f294d1705a0f8ddbcd061083f277a038ab8c9dace44d9954

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Bind post-transport ancestry, proofs, and exact review surface
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$PR_BRANCH" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          test "${{ github.event.pull_request.base.ref }}" = main
          test "${{ github.event.pull_request.base.sha }}" = "$BASE_MAIN"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_MAIN"

          git diff --name-only "$BASE_MAIN...$PR_HEAD" | sort > changed-paths.txt
          python - <<'PY'
          from pathlib import Path
          expected={
            '.github/workflows/avps-v2-recovery2-posttransport-preauthorization-v1-review.yml',
            'review/avps-v2-recovery2-posttransport-preauthorization-v1/PROTOCOL.md',
            'review/avps-v2-recovery2-posttransport-preauthorization-v1/preauthorize.py',
          }
          got={x for x in Path('changed-paths.txt').read_text().splitlines() if x}
          if got != expected:
              raise SystemExit(f'exact three-file post-transport preauthorization scope required; got {sorted(got)}')
          PY

          test "$(git rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-science-transport-v1/native_authorization_seed_transport.py)" = "$TRANSPORT_HELPER_BLOB"
          test "$(git rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-seed-freshness-v1/seed_ledger.py)" = d4bdc95e9ed576fa6c70711c81d8097ddab33dbf
          test "$(git rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-seed-freshness-v1/repository_global_seed_scan.py)" = 0f28c2f242c99736089f74c47b43853fa8ccd8eb
          test "$(git rev-parse HEAD:experiments/aerosol-family-challenge-v2/repository_global_seed_scan.py)" = 4c6d704fa24228284780bcb1dd7c52537b4c5b0d
          test "$(git rev-parse HEAD:experiments/aerosol-family-challenge-v2-r8/execution-candidate/preauthorization_ordinal.py)" = 7ca8efd17ae9e7ec2baa32fe935e5173ca6d173f
          test "$(git rev-parse HEAD:experiments/aerosol-family-challenge-v2-r8/execution-candidate/freshness.py)" = 732f803b5261e7986582dd7e0d69a66f70432b1e

          gh api "repos/$GITHUB_REPOSITORY/pulls/$TRANSPORT_PR" > transport-pr.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/639" > seed-review-pr.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SEED_REVIEW_RUN" > seed-review-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SEED_REVIEW_RUN/artifacts" > seed-review-artifacts.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/33259899524" > ordinal42-run.json
          python - <<'PY'
          import json, os
          tr=json.load(open('transport-pr.json'))
          if not tr.get('merged') or tr.get('head',{}).get('sha') != os.environ['TRANSPORT_HEAD'] or tr.get('merge_commit_sha') != os.environ['TRANSPORT_MERGE']:
              raise SystemExit('merged recovery2 native-transport prerequisite drift')
          sr=json.load(open('seed-review-pr.json'))
          if not sr.get('merged') or sr.get('head',{}).get('sha') != os.environ['SEED_REVIEW_HEAD']:
              raise SystemExit('merged recovery2 seed-review prerequisite drift')
          run=json.load(open('seed-review-run.json'))
          if run.get('id') != int(os.environ['SEED_REVIEW_RUN']) or run.get('run_attempt') != 1 or run.get('status') != 'completed' or run.get('conclusion') != 'success' or run.get('head_sha') != os.environ['SEED_REVIEW_HEAD']:
              raise SystemExit('seed-review run identity drift')
          arts=json.load(open('seed-review-artifacts.json')).get('artifacts',[])
          matches=[a for a in arts if a.get('id') == int(os.environ['SEED_REVIEW_ARTIFACT'])]
          if len(matches) != 1 or matches[0].get('digest') != os.environ['SEED_REVIEW_DIGEST'] or matches[0].get('expired') is not False:
              raise SystemExit('seed-review artifact identity/expiry drift')
          r42=json.load(open('ordinal42-run.json'))
          if r42.get('id') != 33259899524 or r42.get('run_attempt') != 1 or r42.get('status') != 'completed' or r42.get('conclusion') != 'failure':
              raise SystemExit('consumed ordinal-42 failure identity drift')
          PY

          git cat-file -e "$ORDINAL42_AUTH_HEAD^{commit}"
          ORDINAL42_WORKTREE="$RUNNER_TEMP/avps-ordinal42-auth-native"
          rm -rf "$ORDINAL42_WORKTREE"
          git worktree add --detach "$ORDINAL42_WORKTREE" "$ORDINAL42_AUTH_HEAD"
          test "$(git -C "$ORDINAL42_WORKTREE" rev-parse HEAD)" = "$ORDINAL42_AUTH_HEAD"
          test "$(git -C "$ORDINAL42_WORKTREE" rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-seed-freshness-v1/seed_ledger.py)" = "$ORDINAL42_LEDGER_BLOB"
          echo "AVPS_ORDINAL42_LEDGER_PATH=$ORDINAL42_WORKTREE/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-seed-freshness-v1/seed_ledger.py" >> "$GITHUB_ENV"
          mkdir -p preauthorization-evidence
          git ls-files -z > preauthorization-evidence/tracked-files.nul

      - name: Rebuild exact fresh recovery2 candidate ledger
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(command -v uvspec || true)"
          python -m py_compile \
            review/avps-v2-recovery2-posttransport-preauthorization-v1/preauthorize.py \
            review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-seed-freshness-v1/seed_ledger.py \
            review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-seed-freshness-v1/repository_global_seed_scan.py
          python - <<'PY'
          import importlib.util,json,os,sys
          from pathlib import Path
          p=Path('review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-seed-freshness-v1/seed_ledger.py')
          spec=importlib.util.spec_from_file_location('avps_v2_recovery2_seed_ledger_posttransport',p)
          if spec is None or spec.loader is None: raise SystemExit('cannot import recovery2 seed ledger')
          m=importlib.util.module_from_spec(spec); sys.modules[spec.name]=m; spec.loader.exec_module(m)
          x=m.validate_ledger()
          if x['candidateSeedCount'] != 72 or len(set(x['candidateSeeds'])) != 72: raise SystemExit('recovery2 candidate cardinality drift')
          if x['candidateSeedCanonicalSha256'] != os.environ['NEW_SEED_CANONICAL']: raise SystemExit('recovery2 seed canonical drift')
          if x['candidateRowsCanonicalSha256'] != os.environ['NEW_ROWS_CANONICAL']: raise SystemExit('recovery2 row canonical drift')
          if x['overlapWithConsumedOrdinal41SeedCount'] != 0 or x['overlapWithConsumedOrdinal42SeedCount'] != 0: raise SystemExit('recovery2 candidate overlaps consumed seeds')
          if not x['historicalOrdinal42LedgerValidatedAtNativePath']: raise SystemExit('historical ordinal42 ledger not validated at native path')
          Path('preauthorization-evidence/candidate-seed-ledger.json').write_text(json.dumps(x,indent=2,sort_keys=True)+'\n')
          Path('preauthorization-evidence/empty-self-ledger-policy.json').write_text(json.dumps({'schemaVersion':2,'requiredTrackedSelfLedgerPaths':[],'futureEvidenceSelfLedgerPaths':[]},indent=2,sort_keys=True)+'\n')
          PY

      - name: Wait for exact write-quiet fence and exact-head sibling quiescence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          expected_marker="WRITE_QUIET_BEGIN | $FENCE_TOKEN | branch=$EXPECTED_BRANCH head=$PR_HEAD"
          found=0
          for _ in $(seq 1 60); do
            since="$(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"
            if gh api "repos/$GITHUB_REPOSITORY/issues/60/comments?since=$since&per_page=100" --jq '.[].body' | grep -Fq "$expected_marker"; then found=1; break; fi
            sleep 5
          done
          test "$found" = 1
          settled=0
          for _ in $(seq 1 60); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$PR_HEAD&per_page=100" > sibling-runs.json
            if python - <<'PY'
          import json, os, sys
          current=int(os.environ['GITHUB_RUN_ID'])
          rows=json.load(open('sibling-runs.json')).get('workflow_runs',[])
          pending=[(r.get('id'),r.get('name'),r.get('status')) for r in rows if int(r.get('id') or 0)!=current and r.get('status')!='completed']
          if pending:
              print('pending exact-head sibling workflows:', pending)
              sys.exit(1)
          PY
            then settled=1; break; fi
            sleep 10
          done
          test "$settled" = 1
          sleep 20
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_MAIN"
          test "$(git rev-parse HEAD)" = "$PR_HEAD"

      - name: Repeat tracked-tree and repository-global seed rechecks
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/tracked_tree_seed_scan.py \
            --repo-root . \
            --file-list preauthorization-evidence/tracked-files.nul \
            --candidate-seed-ledger preauthorization-evidence/candidate-seed-ledger.json \
            --allow-self-ledger-json preauthorization-evidence/empty-self-ledger-policy.json \
            --output preauthorization-evidence/tracked-seed-scan.json
          python review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-seed-freshness-v1/repository_global_seed_scan.py \
            --repository "$GITHUB_REPOSITORY" \
            --issue-number 60 \
            --candidate-seed-ledger preauthorization-evidence/candidate-seed-ledger.json \
            --current-run-id "$GITHUB_RUN_ID" \
            --audit-mode authorization-recheck \
            --expected-branch-name "$EXPECTED_BRANCH" \
            --expected-repo-head "$PR_HEAD" \
            --output preauthorization-evidence/repository-global-seed-recheck.json

      - name: Derive and freeze dynamic global ordinal proposal
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util,json,os,sys
          from pathlib import Path
          p=Path('review/avps-v2-recovery2-posttransport-preauthorization-v1/preauthorize.py')
          spec=importlib.util.spec_from_file_location('avps_v2_recovery2_posttransport_preauth',p)
          if spec is None or spec.loader is None: raise SystemExit('cannot import preauthorization module')
          m=importlib.util.module_from_spec(spec); sys.modules[spec.name]=m; spec.loader.exec_module(m)
          m.PREAUTH_BRANCH=os.environ['EXPECTED_BRANCH']
          m.BASE_MAIN=os.environ['BASE_MAIN']
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GITHUB_TOKEN']; head=os.environ['PR_HEAD']; runid=int(os.environ['GITHUB_RUN_ID'])
          _,payload=m.collect_payload(repo,token)
          seed=json.load(open('preauthorization-evidence/repository-global-seed-recheck.json'))
          report,obs=m.build_report(payload,seed,head,runid)
          if report['nextAvailableScientificOrdinal'] != report['occupiedMaxScientificOrdinal']+1 or report['nextAvailableScientificOrdinal'] <= 42: raise SystemExit('dynamic successor rule failed')
          for k in ('scientificOrdinalAllocated','authorizationCreated','dispatchCreated','solverExecutionAuthorized','resultOpeningAuthorized','levelBAuthorized','protectedHoldoutOpened','productionAuthorized','taylorOrJerusalemUsed'):
              if report.get(k) is not False: raise SystemExit('protected boundary crossed: '+k)
          Path('preauthorization-evidence/preauthorization.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          Path('preauthorization-evidence/global-ordinal-observations.json').write_text(json.dumps(obs,indent=2,sort_keys=True)+'\n')
          m.final_verify(repo,token,head,runid,report)
          print('dynamic_next_ordinal='+str(report['nextAvailableScientificOrdinal']))
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vertical-profile-v2-recovery2-posttransport-preauthorization-proof
          path: preauthorization-evidence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Remove historical detached worktree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git worktree remove --force "$RUNNER_TEMP/avps-ordinal42-auth-native" 2>/dev/null || true
