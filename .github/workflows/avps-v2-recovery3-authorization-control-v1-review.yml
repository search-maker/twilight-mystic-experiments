name: Review AVPS v2 recovery3 authorization control

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery3-authorization-control-v1-review.yml
      - review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-authorization-control-v1/authorize.py

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: avps-v2-recovery3-auth-control-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CONTROL_BRANCH: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-authorization-control-v1
      FENCE_TOKEN: AVPS_V2_RECOVERY3_AUTHORIZATION_CONTROL_GLOBAL_SCAN_V1
      V3_PREAUTH_HEAD: ec8af2af3e4eff1c9afd51d2d42a2b93698ab51a
      V3_PREAUTH_PATH: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-preauthorization-v3/preauthorize.py
      V3_PREAUTH_BLOB: 286b489911ce83f4eb6d6f0817f3c6271731a036
      V4_PR: '712'
      V4_HEAD: 278056fdd8390e0f32ecf25869c3044906a6fa15
      V4_RUN: '33314377420'
      V4_ARTIFACT: '9733170685'
      V4_DIGEST: sha256:fd647f37cd47af8a811a28b38e758cea1c298ad8a0ff96079a0820c8622784a1
      V4_BEGIN_COMMENT: '5468978587'
      V4_END_COMMENT: '5469076898'
      V4_TRANSITION_COMMENT: '5469090144'
      SEED_PROOF_PR: '689'
      SEED_PROOF_HEAD: ad2632c3d32b9a72805ade2c61c2ad3fe882fb09
      SEED_PROOF_RUN: '33305675119'
      SEED_PROOF_ARTIFACT: '9730444904'
      SEED_PROOF_DIGEST: sha256:13f833045d446b813e653ea10f018db98df956e80c51f76eccd9802f0bd47a48
      ORDINAL42_AUTH_HEAD: e627a689ada0493a8a5b9cdafc4aba0198fbabec
      ORDINAL42_LEDGER_BLOB: 491d1b6653bea0fcc5275269723a76aa1af52300
      ORDINAL41_RUN: '33236295233'
      ORDINAL42_RUN: '33259899524'
      ORDINAL43_RUN: '33298433506'
      ORDINAL43_CONSUMED_COMMENT: '5467301509'
      ORDINAL43_CONSUMED_BODY: ORDINAL43_AVPS_V2_POSTCONSUMPTION_RECOVERY2_DISPATCH_CONSUMED
      NEW_SEED_CANONICAL: d2817b1ea4f2bdc8cb1842e565b099b015e4e28c5874482629fadc450069d9bf
      NEW_ROWS_CANONICAL: b6a519eadacdb99ea53c52d483c8acfeba05829643cb988de21682a53fc47896

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Bind exact control identity and immutable predecessor evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "${{ github.event.action }}" = opened
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$PR_BRANCH" = "$CONTROL_BRANCH"
          test "${{ github.event.pull_request.base.ref }}" = main
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          test "$(git rev-parse HEAD^)" = "$PR_BASE"
          test "$(git rev-list --count "$PR_BASE"..HEAD)" = 1
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$PR_BASE"
          test -z "$(command -v uvspec || true)"
          echo "AVPS_AUTH_CONTROL_BASE_MAIN=$PR_BASE" >> "$GITHUB_ENV"

          git diff --name-only "$PR_BASE...$PR_HEAD" | sort > changed-paths.txt
          cat > expected-paths.txt <<'EOF'
          .github/workflows/avps-v2-recovery3-authorization-control-v1-review.yml
          review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-authorization-control-v1/authorize.py
          EOF
          sort -o expected-paths.txt expected-paths.txt
          diff -u expected-paths.txt changed-paths.txt

          git fetch --no-tags origin "$V3_PREAUTH_HEAD" "$ORDINAL42_AUTH_HEAD"
          test "$(git rev-parse "$V3_PREAUTH_HEAD:$V3_PREAUTH_PATH")" = "$V3_PREAUTH_BLOB"
          test "$(git rev-parse HEAD:experiments/aerosol-family-challenge-v2/repository_global_seed_scan.py)" = 4c6d704fa24228284780bcb1dd7c52537b4c5b0d
          test "$(git rev-parse HEAD:experiments/aerosol-family-challenge-v2-r8/execution-candidate/preauthorization_ordinal.py)" = 7ca8efd17ae9e7ec2baa32fe935e5173ca6d173f
          test "$(git rev-parse HEAD:experiments/aerosol-family-challenge-v2-r8/execution-candidate/freshness.py)" = 732f803b5261e7986582dd7e0d69a66f70432b1e

          HIST="$RUNNER_TEMP/avps-ordinal42-native-recovery3-auth-control"
          rm -rf "$HIST"
          git worktree add --detach "$HIST" "$ORDINAL42_AUTH_HEAD"
          test "$(git -C "$HIST" rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-seed-freshness-v1/seed_ledger.py)" = "$ORDINAL42_LEDGER_BLOB"
          echo "AVPS_ORDINAL42_LEDGER_PATH=$HIST/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-seed-freshness-v1/seed_ledger.py" >> "$GITHUB_ENV"

          mkdir -p control-evidence/v4-proof
          git ls-files -z > control-evidence/tracked-files.nul
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > current-pr.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/$V4_PR" > v4-pr.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V4_RUN" > v4-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$V4_ARTIFACT" > v4-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$V4_TRANSITION_COMMENT" > v4-transition.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/$SEED_PROOF_PR" > seed-pr.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SEED_PROOF_RUN" > seed-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SEED_PROOF_ARTIFACT" > seed-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORDINAL41_RUN" > ord41.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORDINAL42_RUN" > ord42.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORDINAL43_RUN" > ord43.json
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$ORDINAL43_CONSUMED_COMMENT" > ord43-marker.json
          python - <<'PY'
          import json,os
          cur=json.load(open('current-pr.json'))
          if cur.get('state')!='open' or cur.get('draft') is not True or cur.get('merged_at') is not None: raise SystemExit('control PR must remain Draft/open/unmerged')
          if cur['head']['sha']!=os.environ['PR_HEAD'] or cur['base']['sha']!=os.environ['PR_BASE']: raise SystemExit('control PR identity drift')
          vp=json.load(open('v4-pr.json')); vr=json.load(open('v4-run.json')); va=json.load(open('v4-artifact.json'))
          if vp['head']['sha']!=os.environ['V4_HEAD']: raise SystemExit('V4 head drift')
          if vr['id']!=int(os.environ['V4_RUN']) or vr['head_sha']!=os.environ['V4_HEAD'] or vr['run_attempt']!=1 or vr['status']!='completed' or vr['conclusion']!='success': raise SystemExit('V4 run drift')
          if va['id']!=int(os.environ['V4_ARTIFACT']) or va.get('digest')!=os.environ['V4_DIGEST'] or va.get('expired') is not False: raise SystemExit('V4 artifact drift')
          tr=json.load(open('v4-transition.json'))
          prefix='AVPS_V2_RECOVERY3_PREAUTH_V4_TRANSITION_ELIGIBLE_NOT_ALLOCATED'
          if tr.get('id')!=int(os.environ['V4_TRANSITION_COMMENT']) or not str(tr.get('body') or '').startswith(prefix): raise SystemExit('V4 transition classification drift')
          spr=json.load(open('seed-pr.json')); sr=json.load(open('seed-run.json')); sa=json.load(open('seed-artifact.json'))
          if spr['head']['sha']!=os.environ['SEED_PROOF_HEAD']: raise SystemExit('seed proof head drift')
          if sr['id']!=int(os.environ['SEED_PROOF_RUN']) or sr['head_sha']!=os.environ['SEED_PROOF_HEAD'] or sr['run_attempt']!=1 or sr['status']!='completed' or sr['conclusion']!='success': raise SystemExit('seed proof run drift')
          if sa['id']!=int(os.environ['SEED_PROOF_ARTIFACT']) or sa.get('digest')!=os.environ['SEED_PROOF_DIGEST'] or sa.get('expired') is not False: raise SystemExit('seed proof artifact drift')
          for path,label in (('ord41.json',41),('ord42.json',42),('ord43.json',43)):
              r=json.load(open(path))
              if r['run_attempt']!=1 or r['status']!='completed' or r['conclusion']!='failure': raise SystemExit(f'consumed ordinal {label} run drift')
          marker=json.load(open('ord43-marker.json'))
          if marker.get('id')!=int(os.environ['ORDINAL43_CONSUMED_COMMENT']) or str(marker.get('body') or '').strip()!=os.environ['ORDINAL43_CONSUMED_BODY']: raise SystemExit('ordinal43 consumed marker drift')
          PY
          gh run download "$V4_RUN" --name vertical-profile-v2-recovery3-preauthorization-v4-proof -D control-evidence/v4-proof
          test -s control-evidence/v4-proof/preauthorization.json

      - name: Rebuild exact recovery3 candidate ledger
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-authorization-control-v1/authorize.py
          python - <<'PY'
          import importlib.util,json,os,sys
          from pathlib import Path
          p=Path('review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-seed-freshness-v1/seed_ledger.py')
          spec=importlib.util.spec_from_file_location('avps_recovery3_auth_control_seed_ledger',p)
          m=importlib.util.module_from_spec(spec); sys.modules[spec.name]=m; spec.loader.exec_module(m)
          x=m.validate_ledger()
          if x.get('candidateSeedCount')!=72 or x.get('candidateSeedCanonicalSha256')!=os.environ['NEW_SEED_CANONICAL'] or x.get('candidateRowsCanonicalSha256')!=os.environ['NEW_ROWS_CANONICAL']: raise SystemExit('candidate ledger drift')
          if not x.get('allCollisionCountersZero'): raise SystemExit('historical consumed-overlap counter nonzero')
          Path('control-evidence/candidate-seed-ledger.json').write_text(json.dumps(x,indent=2,sort_keys=True)+'\n')
          Path('control-evidence/empty-self-ledger-policy.json').write_text(json.dumps({'schemaVersion':2,'requiredTrackedSelfLedgerPaths':[],'futureEvidenceSelfLedgerPaths':[]},indent=2,sort_keys=True)+'\n')
          PY

      - name: Require exact authorization-control WRITE_QUIET fence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > issue60-pages.json
          python - <<'PY'
          import json,os
          rows=[r for page in json.load(open('issue60-pages.json')) for r in page]
          wanted=f"WRITE_QUIET_BEGIN | {os.environ['FENCE_TOKEN']} | branch={os.environ['CONTROL_BRANCH']} | head={os.environ['PR_HEAD']} | baseHead={os.environ['PR_BASE']}"
          matches=[r for r in rows if str(r.get('body') or '').startswith(wanted)]
          if len(matches)!=1: raise SystemExit(f'exact authorization-control WRITE_QUIET_BEGIN required once; found {len(matches)}')
          begin_id=int(matches[0]['id'])
          if any(str(r.get('body') or '').startswith(f"WRITE_QUIET_END | {os.environ['FENCE_TOKEN']}") for r in rows if int(r.get('id') or 0)>begin_id): raise SystemExit('control fence ended before protected scan')
          PY

      - name: Require repository-wide workflow quiescence and cooldown
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          settled=0
          for _ in $(seq 1 90); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=in_progress&per_page=100" > active.json
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=queued&per_page=100" > queued.json
            if python - <<'PY'
          import json,os,sys
          current=int(os.environ['GITHUB_RUN_ID'])
          rows=json.load(open('active.json')).get('workflow_runs',[])+json.load(open('queued.json')).get('workflow_runs',[])
          external=[(r.get('id'),r.get('name'),r.get('status')) for r in rows if int(r.get('id') or 0)!=current]
          if external:
              print('repository workflows not quiescent:',external); sys.exit(1)
          PY
            then settled=1; break; fi
            sleep 10
          done
          test "$settled" = 1
          sleep 45
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=in_progress&per_page=100" > active-after.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=queued&per_page=100" > queued-after.json
          python - <<'PY'
          import json,os
          current=int(os.environ['GITHUB_RUN_ID'])
          rows=json.load(open('active-after.json')).get('workflow_runs',[])+json.load(open('queued-after.json')).get('workflow_runs',[])
          if [r for r in rows if int(r.get('id') or 0)!=current]: raise SystemExit('repository workflow churn resumed during control cooldown')
          PY
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$PR_BASE"
          test "$(git rev-parse HEAD)" = "$PR_HEAD"

      - name: Repeat tracked-tree and protected repository-global seed scan
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/tracked_tree_seed_scan.py \
            --repo-root . --file-list control-evidence/tracked-files.nul \
            --candidate-seed-ledger control-evidence/candidate-seed-ledger.json \
            --allow-self-ledger-json control-evidence/empty-self-ledger-policy.json \
            --output control-evidence/tracked-seed-scan.json
          python review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-seed-freshness-v1/repository_global_seed_scan.py \
            --repository "$GITHUB_REPOSITORY" --issue-number 60 \
            --candidate-seed-ledger control-evidence/candidate-seed-ledger.json \
            --current-run-id "$GITHUB_RUN_ID" --audit-mode authorization-recheck \
            --expected-branch-name "$CONTROL_BRANCH" --expected-repo-head "$PR_HEAD" \
            --output control-evidence/repository-global-seed-recheck.json

      - name: Derive live successor and emit proposal artifact only
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-authorization-control-v1/authorize.py build \
            --repository "$GITHUB_REPOSITORY" \
            --seed-global-report control-evidence/repository-global-seed-recheck.json \
            --v4-report control-evidence/v4-proof/preauthorization.json \
            --expected-head "$PR_HEAD" --current-run-id "$GITHUB_RUN_ID" \
            --fresh-report control-evidence/fresh-control-preauthorization.json \
            --observations-output control-evidence/global-ordinal-observations.json \
            --authorization-output control-evidence/authorization.proposed.json \
            --receipt-output control-evidence/control-review-receipt.json
          python review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-authorization-control-v1/authorize.py verify \
            --repository "$GITHUB_REPOSITORY" --expected-head "$PR_HEAD" --current-run-id "$GITHUB_RUN_ID" \
            --fresh-report control-evidence/fresh-control-preauthorization.json \
            --authorization-output control-evidence/authorization.proposed.json \
            --receipt-output control-evidence/control-review-receipt.json
          python - <<'PY'
          import json
          r=json.load(open('control-evidence/control-review-receipt.json'))
          if r.get('status')!='PASS_RECOVERY3_AUTHORIZATION_CONTROL_PROPOSAL_NOT_ALLOCATED_NOT_DISPATCHED': raise SystemExit('receipt status drift')
          if r.get('nextOrdinalHardCoded') is not False: raise SystemExit('successor hard-coded')
          for k in ('scientificOrdinalAllocated','authorizationBranchCreated','dispatchCreated','scientificRuntimeSetupPerformed','solverExecutionPerformed','resultOpeningPerformed','levelBOpened','protectedHoldoutOpened','productionAuthorized','taylorOrJerusalemUsed'):
              if r.get(k) is not False: raise SystemExit('boundary crossed: '+k)
          print('dynamic_successor='+str(r['scientificOrdinalProposed']))
          PY

      - name: Prove zero-runtime review boundary
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test -z "$(command -v uvspec || true)"
          if git diff --name-only "$PR_BASE...HEAD" | grep -E '^experiments/|^scientific-tools/|^src/'; then echo 'runtime/scientific source changed' >&2; exit 1; fi
          test -z "$(git status --porcelain --untracked-files=no)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: avps-v2-recovery3-authorization-control-v1-proof
          path: control-evidence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Remove historical detached worktree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git worktree remove --force "$RUNNER_TEMP/avps-ordinal42-native-recovery3-auth-control" 2>/dev/null || true
