name: Review/materialize corrected AVPS v2 recovery3 ordinal44 publication

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery3-ordinal44-corrected-publication-materializer-v1.yml
  push:
    branches:
      - transport-trigger/avps-v2-recovery3-ordinal44-corrected-publication-v1
    paths:
      - transport-triggers/avps-v2-recovery3-ordinal44-corrected-publication-v1.txt

concurrency:
  group: avps-v2-recovery3-ordinal44-corrected-publication-materializer-v1-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

env:
  MATERIALIZER: .github/workflows/avps-v2-recovery3-ordinal44-corrected-publication-materializer-v1.yml
  GENERATOR: review/avps-v2-recovery3-ordinal44-execution-package-generator-v1/generate.py
  POSTPROCESS: review/avps-v2-recovery3-ordinal44-execution-package-generator-v1/postprocess.py
  CORRECTION: review/avps-v2-recovery3-ordinal44-snapshot-choreography-correction-v1/postprocess.py
  CORRECTION_MAIN: 18ec5fe06415da116ae1fd9198ec21aea3f73760
  ACTIVATION_BRANCH: transport-trigger/avps-v2-recovery3-ordinal44-corrected-publication-v1
  ACTIVATION_MARKER: transport-triggers/avps-v2-recovery3-ordinal44-corrected-publication-v1.txt
  TARGET_BRANCH: review/avps-v2-recovery3-ordinal44-corrected-execution-package-publication-v1
  SCIENCE: .github/workflows/avps-v2-postconsumption-recovery3-science.yml
  PUBLISHER: .github/workflows/avps-v2-postconsumption-recovery3-dispatch-publisher.yml
  TRIGGER: .github/workflows/avps-v2-postconsumption-recovery3-publisher-trigger-bridge.yml
  SCIENCE_SHA256: 2fc04fcb18c13ecbedefa0e3685e78580acb6729e31098379765bc2e34494644
  PUBLISHER_SHA256: cc679ab0b1e8a1409675fa4d9df2a6f2dc0e6b05af7c9eb648a7394200f38b82
  TRIGGER_SHA256: a665422f12dbf195fc81d7214f504d1547d8e98abbbd9ae9cdfe47e2d885792a
  SCIENCE_BLOB: ddc2bb954cf07c4c7f314c3d551a8aee44381c73
  PUBLISHER_BLOB: 10099ff88e169b6b820469d6d19ce5003c6f46bb
  TRIGGER_BLOB: 63a897d49cf7832f882fe16227ff3023a73c46ec
  LEDGER_BASELINE_COMMENT: '5470368706'

jobs:
  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Bind one-file zero-runtime corrected materializer review scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git merge-base --is-ancestor "$CORRECTION_MAIN" HEAD
          git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD | sort > changed.txt
          printf '%s\n' "$MATERIALIZER" > expected.txt
          diff -u expected.txt changed.txt
          ! grep -Eq '^  workflow_dispatch:' "$MATERIALIZER"
          test -f "$CORRECTION"

      - name: Regenerate exact corrected reviewed publication bytes without publishing
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile "$GENERATOR" "$POSTPROCESS" "$CORRECTION"
          rm -rf generated-avps-v2-recovery3-ordinal44-execution-package
          python "$GENERATOR" > generator-output.json
          python "$POSTPROCESS"
          python "$CORRECTION"
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path('generated-avps-v2-recovery3-ordinal44-execution-package')
          checks={
            'avps-v2-postconsumption-recovery3-science.yml':(os.environ['SCIENCE_SHA256'],os.environ['SCIENCE_BLOB']),
            'avps-v2-postconsumption-recovery3-dispatch-publisher.yml':(os.environ['PUBLISHER_SHA256'],os.environ['PUBLISHER_BLOB']),
            'avps-v2-postconsumption-recovery3-publisher-trigger-bridge.yml':(os.environ['TRIGGER_SHA256'],os.environ['TRIGGER_BLOB']),
          }
          for name,(sha256,blob) in checks.items():
              p=root/name
              raw=p.read_bytes()
              if hashlib.sha256(raw).hexdigest()!=sha256: raise SystemExit(f'sha256 drift: {name}')
              got=subprocess.check_output(['git','hash-object',str(p)],text=True).strip()
              if got!=blob: raise SystemExit(f'git blob drift: {name}: {got}')
          m=json.load(open(root/'manifest.json'))
          required={'scientificOrdinal':44,'caseCount':360,'commonRandomNumberGroupCount':72,'statesPerGroup':5,'photonHistoriesPerCase':20000000,'frozenScienceDesignChanged':False,'snapshotFenceChoreographyCorrectionApplied':True,'guardStepTerminalEndRequired':True,'snapshotFenceReleaseBarrierRequired':True,'allSolverCaseJobsDependOnSnapshotFenceRelease':True,'dispatchCreated':False,'scientificRuntime':False,'solverExecution':False,'resultOpening':False,'levelBOpening':False,'protectedHoldoutOpening':False,'taylorOrJerusalemUsed':False,'invalidatedLowAltitudeEvidenceUsed':False,'productionAuthorized':False}
          for k,v in required.items():
              if m.get(k)!=v: raise SystemExit(f'manifest drift {k}: {m.get(k)!r} != {v!r}')
          PY
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Freeze zero-runtime corrected materializer review receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          out={'schemaVersion':1,'status':'PASS_AVPS_V2_RECOVERY3_ORDINAL44_CORRECTED_PUBLICATION_MATERIALIZER_REVIEW_ZERO_RUNTIME','headSha':'${{ github.event.pull_request.head.sha }}','scientificOrdinal':44,'targetBranch':os.environ['TARGET_BRANCH'],'scienceSha256':os.environ['SCIENCE_SHA256'],'publisherSha256':os.environ['PUBLISHER_SHA256'],'triggerSha256':os.environ['TRIGGER_SHA256'],'scienceBlob':os.environ['SCIENCE_BLOB'],'publisherBlob':os.environ['PUBLISHER_BLOB'],'triggerBlob':os.environ['TRIGGER_BLOB'],'repositoryMutationPerformed':False,'dispatchCreated':False,'solverExecutionPerformed':False,'resultOpeningPerformed':False,'levelBOpened':False,'holdoutOpened':False,'productionAuthorized':False}
          Path('review-receipt.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: avps-v2-recovery3-ordinal44-corrected-publication-materializer-review
          path: |
            changed.txt
            generator-output.json
            review-receipt.json
          if-no-files-found: error
          compression-level: 0

  materialize:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Prove fresh one-file activation from live main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = "$ACTIVATION_BRANCH"
          test -f "$ACTIVATION_MARKER"
          git fetch origin main
          mapfile -t parents < <(git cat-file -p HEAD | sed -n 's/^parent //p')
          test "${#parents[@]}" = 1
          test "${parents[0]}" = "$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$CORRECTION_MAIN" HEAD
          git diff --name-only HEAD^ HEAD | sort > activation-changed.txt
          printf '%s\n' "$ACTIVATION_MARKER" > activation-expected.txt
          diff -u activation-expected.txt activation-changed.txt
          test "$(cat "$ACTIVATION_MARKER")" = 'AVPS_V2_RECOVERY3_ORDINAL44_CORRECTED_PUBLICATION_MATERIALIZER_V1'
          if git ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null 2>&1; then
            echo 'target corrected publication branch already exists' >&2
            exit 1
          fi

      - name: Regenerate and verify exact corrected three-file payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf generated-avps-v2-recovery3-ordinal44-execution-package
          python "$GENERATOR" > generator-output.json
          python "$POSTPROCESS"
          python "$CORRECTION"
          python - <<'PY'
          import hashlib,os,subprocess
          from pathlib import Path
          root=Path('generated-avps-v2-recovery3-ordinal44-execution-package')
          checks={
            'avps-v2-postconsumption-recovery3-science.yml':(os.environ['SCIENCE_SHA256'],os.environ['SCIENCE_BLOB']),
            'avps-v2-postconsumption-recovery3-dispatch-publisher.yml':(os.environ['PUBLISHER_SHA256'],os.environ['PUBLISHER_BLOB']),
            'avps-v2-postconsumption-recovery3-publisher-trigger-bridge.yml':(os.environ['TRIGGER_SHA256'],os.environ['TRIGGER_BLOB']),
          }
          for name,(sha256,blob) in checks.items():
              p=root/name; raw=p.read_bytes()
              if hashlib.sha256(raw).hexdigest()!=sha256: raise SystemExit(f'sha256 drift: {name}')
              got=subprocess.check_output(['git','hash-object',str(p)],text=True).strip()
              if got!=blob: raise SystemExit(f'git blob drift: {name}: {got}')
          PY

      - name: Commit exact corrected publication payload atomically on fresh branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PARENT=$(git rev-parse origin/main)
          git switch --detach "$PARENT"
          git switch -c "$TARGET_BRANCH"
          cp generated-avps-v2-recovery3-ordinal44-execution-package/avps-v2-postconsumption-recovery3-science.yml "$SCIENCE"
          cp generated-avps-v2-recovery3-ordinal44-execution-package/avps-v2-postconsumption-recovery3-dispatch-publisher.yml "$PUBLISHER"
          cp generated-avps-v2-recovery3-ordinal44-execution-package/avps-v2-postconsumption-recovery3-publisher-trigger-bridge.yml "$TRIGGER"
          git add "$SCIENCE" "$PUBLISHER" "$TRIGGER"
          git diff --cached --name-only | sort > publication-changed.txt
          printf '%s\n' "$PUBLISHER" "$SCIENCE" "$TRIGGER" | sort > publication-expected.txt
          diff -u publication-expected.txt publication-changed.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Publish corrected AVPS recovery3 ordinal44 execution workflows'
          COMMIT=$(git rev-parse HEAD)
          test "$(git rev-parse HEAD^)" = "$PARENT"
          git diff --name-only "$PARENT" HEAD | sort > final-changed.txt
          diff -u publication-expected.txt final-changed.txt

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$PARENT"
          if git ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null 2>&1; then
            echo 'target corrected publication branch appeared before push' >&2
            exit 1
          fi

          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > /tmp/issue60-pages.json
          python - <<'PY'
          import json,os,re
          pages=json.load(open('/tmp/issue60-pages.json')); comments=[c for page in pages for c in page]
          baseline=int(os.environ['LEDGER_BASELINE_COMMENT'])
          post=[c for c in comments if int(c.get('id') or 0)>baseline]
          open_begins={}
          for c in post:
              cid=int(c.get('id') or 0); body=str(c.get('body') or '').strip()
              if body.startswith('WRITE_QUIET_BEGIN'):
                  open_begins[cid]=body
              elif body.startswith('WRITE_QUIET_END'):
                  m=re.search(r'\bbegin=(\d+)\b',body)
                  if m and int(m.group(1)) in open_begins:
                      del open_begins[int(m.group(1))]
          if open_begins: raise SystemExit(f'unmatched post-baseline WRITE_QUIET_BEGIN comments: {sorted(open_begins)}')
          blockers=('NOT_ADMISSIBLE','DO NOT USE','FAIL-CLOSED','CLOSED')
          for c in post:
              cid=int(c.get('id') or 0); upper=str(c.get('body') or '').upper()
              relevant=('AVPS' in upper or 'ORDINAL44' in upper or 'ORDINAL 44' in upper or 'RECOVERY3' in upper)
              superseding=('SUPERSED' in upper or ('COORDINATOR' in upper and 'RECOVERY' in upper))
              if relevant and (any(x in upper for x in blockers) or superseding):
                  raise SystemExit(f'newer relevant fail-closed/closure/recovery directive comment {cid}')
          PY
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          printf 'parent=%s\ncommit=%s\nbranch=%s\n' "$PARENT" "$COMMIT" "$TARGET_BRANCH" > materialization-receipt.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: avps-v2-recovery3-ordinal44-corrected-publication-materialization
          path: |
            activation-changed.txt
            generator-output.json
            publication-changed.txt
            final-changed.txt
            materialization-receipt.txt
          if-no-files-found: error
          compression-level: 0
