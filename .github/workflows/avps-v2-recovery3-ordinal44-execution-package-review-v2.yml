name: Review AVPS v2 recovery3 ordinal44 execution package v2

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery3-ordinal44-execution-package-review-v2.yml
      - review/avps-v2-recovery3-ordinal44-execution-package-generator-v1/**
      - .github/workflows/avps-v2-postconsumption-recovery3-science.yml
      - .github/workflows/avps-v2-postconsumption-recovery3-dispatch-publisher.yml
      - .github/workflows/avps-v2-postconsumption-recovery3-publisher-trigger-bridge.yml

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: avps-v2-recovery3-ordinal44-execution-package-v2-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GENERATOR: review/avps-v2-recovery3-ordinal44-execution-package-generator-v1/generate.py
      POSTPROCESS: review/avps-v2-recovery3-ordinal44-execution-package-generator-v1/postprocess.py
      PROTOCOL: review/avps-v2-recovery3-ordinal44-execution-package-generator-v1/PROTOCOL.md
      REVIEW_WORKFLOW: .github/workflows/avps-v2-recovery3-ordinal44-execution-package-review-v2.yml
      SCIENCE: .github/workflows/avps-v2-postconsumption-recovery3-science.yml
      PUBLISHER: .github/workflows/avps-v2-postconsumption-recovery3-dispatch-publisher.yml
      TRIGGER: .github/workflows/avps-v2-postconsumption-recovery3-publisher-trigger-bridge.yml
      SOURCE_SCIENCE_BLOB: bd973b2ea039ee696f26a600104932a8619d5633
      SOURCE_PUBLISHER_BLOB: a5349ad644f93bf45fba79c58cee2ec7b0dd6359
      SOURCE_TRIGGER_BLOB: c102d173aba9f0aa952b25459a9b4a30626c7936
      AUTH_HEAD: dd3a4c692af505389e9feb1e5f5480fa389110a3
      AUTH_PARENT: d8cd4af807e7a8f11ed39fdc579ed92adf866aab
      AUTH_REVIEW_RUN: '33319037610'
      AUTH_REVIEW_ARTIFACT: '9734515864'
      AUTH_REVIEW_DIGEST: sha256:bfef625ebb0a45f8a59e38cb46b64ded9e7d9f3fcbb895355144a3af5044eed7
      CANDIDATE_SEED: d2817b1ea4f2bdc8cb1842e565b099b015e4e28c5874482629fadc450069d9bf
      CANDIDATE_ROWS: b6a519eadacdb99ea53c52d483c8acfeba05829643cb988de21682a53fc47896
      EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Bind review mode and immutable source bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test "$(git hash-object .github/workflows/avps-v2-postconsumption-recovery2-science.yml)" = "$SOURCE_SCIENCE_BLOB"
          test "$(git hash-object .github/workflows/avps-v2-postconsumption-recovery2-dispatch-publisher.yml)" = "$SOURCE_PUBLISHER_BLOB"
          test "$(git hash-object .github/workflows/avps-v2-postconsumption-recovery2-publisher-trigger-bridge.yml)" = "$SOURCE_TRIGGER_BLOB"
          git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD | sort > changed.txt
          if grep -qx "$GENERATOR" changed.txt; then
            cat > expected.txt <<EOF
          $REVIEW_WORKFLOW
          $PROTOCOL
          $GENERATOR
          $POSTPROCESS
          EOF
            MODE=generator
          else
            cat > expected.txt <<EOF
          $SCIENCE
          $PUBLISHER
          $TRIGGER
          EOF
            MODE=publication
          fi
          sort -o expected.txt expected.txt
          diff -u expected.txt changed.txt
          echo "MODE=$MODE" >> "$GITHUB_ENV"

      - name: Generate and harden twice deterministically
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile "$GENERATOR" "$POSTPROCESS"
          rm -rf generated-avps-v2-recovery3-ordinal44-execution-package /tmp/avps-r3-first
          python "$GENERATOR" > generator-output-1.json
          python "$POSTPROCESS"
          cp -a generated-avps-v2-recovery3-ordinal44-execution-package /tmp/avps-r3-first
          rm -rf generated-avps-v2-recovery3-ordinal44-execution-package
          python "$GENERATOR" > generator-output-2.json
          python "$POSTPROCESS"
          diff -ru /tmp/avps-r3-first generated-avps-v2-recovery3-ordinal44-execution-package
          cmp generator-output-1.json generator-output-2.json

      - name: Verify frozen science, hardening and exact fresh identity boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path('generated-avps-v2-recovery3-ordinal44-execution-package')
          files=sorted(p.name for p in root.iterdir() if p.is_file())
          expected=sorted(['avps-v2-postconsumption-recovery3-science.yml','avps-v2-postconsumption-recovery3-dispatch-publisher.yml','avps-v2-postconsumption-recovery3-publisher-trigger-bridge.yml','manifest.json'])
          if files!=expected: raise SystemExit(f'generated file-set drift: {files}')
          m=json.load(open(root/'manifest.json'))
          required={'status':'GENERATED_AVPS_V2_RECOVERY3_ORDINAL44_EXECUTION_PACKAGE_ZERO_RUNTIME_NOT_PUBLISHED_NOT_DISPATCHED','scientificOrdinal':44,'authorizationHead':os.environ['AUTH_HEAD'],'authorizationParent':os.environ['AUTH_PARENT'],'authorizationPr':718,'authorizationReviewRun':int(os.environ['AUTH_REVIEW_RUN']),'authorizationReviewArtifact':int(os.environ['AUTH_REVIEW_ARTIFACT']),'authorizationReviewDigest':os.environ['AUTH_REVIEW_DIGEST'],'candidateSeedCanonicalSha256':os.environ['CANDIDATE_SEED'],'candidateRowsCanonicalSha256':os.environ['CANDIDATE_ROWS'],'caseCount':360,'commonRandomNumberGroupCount':72,'statesPerGroup':5,'photonHistoriesPerCase':20000000,'frozenScienceDesignChanged':False,'hardeningPostprocessApplied':True,'freshPreflightArtifactIdentity':True,'publicationModeReviewRequiredBeforeDispatch':True,'dispatchCreated':False,'scientificRuntime':False,'solverExecution':False,'resultOpening':False,'levelBOpening':False,'protectedHoldoutOpening':False,'taylorOrJerusalemUsed':False,'invalidatedLowAltitudeEvidenceUsed':False,'productionAuthorized':False}
          for k,v in required.items():
              if m.get(k)!=v: raise SystemExit(f'manifest drift {k}: {m.get(k)!r} != {v!r}')
          if m.get('sourceBlobs')!={'science':os.environ['SOURCE_SCIENCE_BLOB'],'publisher':os.environ['SOURCE_PUBLISHER_BLOB'],'trigger':os.environ['SOURCE_TRIGGER_BLOB']}: raise SystemExit('source blob drift')
          def git_blob(raw): return hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          for name,ident in m['outputs'].items():
              raw=(root/name).read_bytes()
              if ident!={'sha256':hashlib.sha256(raw).hexdigest(),'gitBlobSha1':git_blob(raw)}: raise SystemExit(f'output identity drift: {name}')
          science=(root/'avps-v2-postconsumption-recovery3-science.yml').read_text()
          pub=(root/'avps-v2-postconsumption-recovery3-dispatch-publisher.yml').read_text()
          trig=(root/'avps-v2-postconsumption-recovery3-publisher-trigger-bridge.yml').read_text()
          for token in (os.environ['AUTH_HEAD'],os.environ['AUTH_PARENT'],os.environ['CANDIDATE_SEED'],os.environ['CANDIDATE_ROWS'],"'scientificOrdinal':44",'20_000_000','resultOpeningAuthorized','avps-v2-postconsumption-recovery3-preflight-ordinal-44','avps-v2-postconsumption-recovery3-complete-ordinal-44'):
              if token not in science: raise SystemExit(f'science missing fresh/frozen token: {token}')
          for stale in ('5fd0c82cb14a02ace38a5a7be30b8b075ccae298','33277629404','9722104370','ORDINAL43_AVPS_V2_POSTCONSUMPTION_RECOVERY2_AUTHORIZATION_ALLOCATED_REVIEWED_NOT_DISPATCHED','avps-v2-postconsumption-recovery2-preflight-ordinal-43','avps-v2-postconsumption-recovery2-complete-ordinal-43'):
              if stale in science or stale in pub: raise SystemExit(f'stale consumed identity: {stale}')
          for token in ('GH_TOKEN:','GITHUB_TOKEN:','PACKAGE_REVIEW_WORKFLOW','PASS_GLOBAL_ORDINAL44_ALLOCATED_NOT_CONSUMED_PRE_DISPATCH','latest!=43','max(ordinals)!=44','avps-v2-postconsumption-recovery3-science.yml/dispatches',"r.get('mode')!='publication'",os.environ['AUTH_HEAD'],os.environ['AUTH_PARENT']):
              if token not in pub: raise SystemExit(f'publisher missing invariant: {token}')
          publisher_blob=subprocess.check_output(['git','hash-object',str(root/'avps-v2-postconsumption-recovery3-dispatch-publisher.yml')],text=True).strip()
          for token in ('dispatch-trigger/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-ordinal-44-publisher','avps-v2-postconsumption-recovery3-dispatch-publisher.yml',publisher_blob,"SCIENTIFIC_ORDINAL: '44'"):
              if token not in trig: raise SystemExit(f'trigger missing invariant: {token}')
          PY

      - name: Compare future publication bytes to reviewed hardened output
        if: env.MODE == 'publication'
        shell: bash
        run: |
          set -euo pipefail
          cmp "$SCIENCE" generated-avps-v2-recovery3-ordinal44-execution-package/avps-v2-postconsumption-recovery3-science.yml
          cmp "$PUBLISHER" generated-avps-v2-recovery3-ordinal44-execution-package/avps-v2-postconsumption-recovery3-dispatch-publisher.yml
          cmp "$TRIGGER" generated-avps-v2-recovery3-ordinal44-execution-package/avps-v2-postconsumption-recovery3-publisher-trigger-bridge.yml

      - name: Freeze exact-head zero-runtime review receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          root=Path('generated-avps-v2-recovery3-ordinal44-execution-package')
          def blob(name): return subprocess.check_output(['git','hash-object',str(root/name)],text=True).strip()
          out={'schemaVersion':2,'status':'PASS_AVPS_V2_RECOVERY3_ORDINAL44_EXECUTION_PACKAGE_REVIEW_ZERO_RUNTIME','pipelineVersion':2,'mode':os.environ['MODE'],'headSha':os.environ['EVENT_HEAD'],'mergeRefSha':os.environ['GITHUB_SHA'],'scientificOrdinal':44,'authorizationHead':os.environ['AUTH_HEAD'],'authorizationParent':os.environ['AUTH_PARENT'],'authorizationPr':718,'scienceBlob':blob('avps-v2-postconsumption-recovery3-science.yml'),'publisherBlob':blob('avps-v2-postconsumption-recovery3-dispatch-publisher.yml'),'triggerBlob':blob('avps-v2-postconsumption-recovery3-publisher-trigger-bridge.yml'),'hardeningPostprocessApplied':True,'publicationModeReviewRequiredBeforeDispatch':True,'dispatchCreated':False,'solverExecutionPerformed':False,'resultOpeningPerformed':False,'levelBOpened':False,'holdoutOpened':False,'taylorOrJerusalemUsed':False,'invalidatedLowAltitudeEvidenceUsed':False,'productionAuthorized':False}
          Path('review-receipt.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: avps-v2-recovery3-ordinal44-execution-package-review
          path: |
            changed.txt
            generator-output-1.json
            review-receipt.json
            generated-avps-v2-recovery3-ordinal44-execution-package/
          if-no-files-found: error
          compression-level: 0
