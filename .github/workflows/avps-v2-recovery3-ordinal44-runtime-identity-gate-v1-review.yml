name: Review AVPS recovery3 ordinal44 runtime identity gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery3-ordinal44-runtime-identity-gate-v1-review.yml
      - review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-runtime-identity-v1/**

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_BASE: e9f79772f07e2a90974979f187be137606c3dfea
      EXPECTED_BRANCH: review/avps-v2-recovery3-ordinal44-runtime-identity-gate-v1
      AUTH_BRANCH: authorization/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-ordinal-44
      AUTH_HEAD: dd3a4c692af505389e9feb1e5f5480fa389110a3
      AUTH_PATH: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-authorization-control-v1/authorization.json
      AUTH_BLOB: 927956c0c01d02d3b025b141bb1c8b72d873dfc7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Bind exact additive zero-runtime scope and defect-source bytes
        shell: bash
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$EVENT_BASE" = "$EXPECTED_BASE"
          test "$EVENT_BRANCH" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          git diff --name-only "$EXPECTED_BASE"...HEAD | sort > changed.txt
          cat > expected.txt <<'EOF'
          .github/workflows/avps-v2-recovery3-ordinal44-runtime-identity-gate-v1-review.yml
          review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-runtime-identity-v1/PROTOCOL.md
          review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-runtime-identity-v1/generate.py
          review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-runtime-identity-v1/identity-contract.review.json
          review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-runtime-identity-v1/test_generated.py
          EOF
          sort -o expected.txt expected.txt
          diff -u expected.txt changed.txt
          test "$(git rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-executor-parity-v1/executor.py)" = bb1e4276d6383127a6b7e820fc2568d87d5de4b0
          test "$(git rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-aggregator-parity-v1/aggregator.py)" = ef24a0d30af3dfb46a6b764f3e426465da870fbe
          test "$(git rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-control-v1/adapter.py)" = c245eac2fe5b5d026e46ec4253bc377c5fde97ec
          test "$(git rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-seed-freshness-v1/seed_ledger.py)" = a4fc0b95c3627a310c0c17a1ae8b89701511b3b8
          test "$(git rev-parse HEAD:.github/workflows/avps-v2-postconsumption-recovery3-science.yml)" = ddc2bb954cf07c4c7f314c3d551a8aee44381c73
      - name: Materialize exact reviewed authorization without mutating it
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/$AUTH_BRANCH:refs/remotes/origin/$AUTH_BRANCH"
          test "$(git rev-parse origin/$AUTH_BRANCH)" = "$AUTH_HEAD"
          test "$(git rev-parse "$AUTH_HEAD:$AUTH_PATH")" = "$AUTH_BLOB"
          git show "$AUTH_HEAD:$AUTH_PATH" > /tmp/recovery3-authorization.json
      - name: Generate twice deterministically and execute acceptance/refusal fixtures
        shell: bash
        run: |
          set -euo pipefail
          rm -rf generated-avps-v2-recovery3-ordinal44-runtime-identity /tmp/recovery3-first
          python review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-runtime-identity-v1/generate.py > generator-1.json
          cp -a generated-avps-v2-recovery3-ordinal44-runtime-identity /tmp/recovery3-first
          rm -rf generated-avps-v2-recovery3-ordinal44-runtime-identity
          python review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-runtime-identity-v1/generate.py > generator-2.json
          diff -ru /tmp/recovery3-first generated-avps-v2-recovery3-ordinal44-runtime-identity
          cmp generator-1.json generator-2.json
          python review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-runtime-identity-v1/test_generated.py /tmp/recovery3-authorization.json
          python - <<'PY'
          import json
          m=json.load(open('generated-avps-v2-recovery3-ordinal44-runtime-identity/manifest.json'))
          r=json.load(open('runtime-identity-review-receipt.json'))
          if m['status']!='GENERATED_AVPS_V2_RECOVERY3_ORDINAL44_RUNTIME_IDENTITY_ZERO_RUNTIME': raise SystemExit('manifest status drift')
          if r['status']!='PASS_AVPS_V2_RECOVERY3_ORDINAL44_RUNTIME_IDENTITY_ZERO_RUNTIME_REVIEW': raise SystemExit('receipt status drift')
          if r['oldOrdinal41GuardAccepted'] or r['oldOrdinal41AuthorizationAccepted']: raise SystemExit('old ordinal41 identity accepted')
          if not r['closedAggregate']['exact360ClosedAggregateCompatible'] or not r['closedAggregate']['missingCaseRefused']: raise SystemExit('closed aggregate fixture failed')
          for obj in (m,r):
              for k in ('scientificRuntime','solverExecution','resultsOpened','levelB','holdout','taylorOrJerusalemUsed','newMappingAuthorized'):
                  if obj.get(k) is not False: raise SystemExit(f'{k} boundary crossed')
          PY
      - name: Prove generated runtime identity is recovery3-only and review is solver-free
        shell: bash
        run: |
          set -euo pipefail
          grep -R -q 'aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3:numerical:44' generated-avps-v2-recovery3-ordinal44-runtime-identity
          grep -R -q 'EXACT_ONE_USE_AVPS_V2_POSTCONSUMPTION_RECOVERY3_DISPATCH_AUTHORIZED' generated-avps-v2-recovery3-ordinal44-runtime-identity
          ! grep -R -q 'd5f5e4d9d19d7ede573fecae68565a92baabbec3' generated-avps-v2-recovery3-ordinal44-runtime-identity
          ! grep -R -q 'aerosol-vertical-profile-sensitivity-v2:numerical:41' generated-avps-v2-recovery3-ordinal44-runtime-identity
          ! grep -R -q 'subprocess' review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-runtime-identity-v1
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: avps-v2-recovery3-ordinal44-runtime-identity-gate-v1
          path: |
            changed.txt
            generator-1.json
            runtime-identity-review-receipt.json
            generated-avps-v2-recovery3-ordinal44-runtime-identity/
          if-no-files-found: error
          compression-level: 0
