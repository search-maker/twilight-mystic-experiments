name: Review AVPS recovery3 ordinal44 runtime2 publication generator

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery3-ordinal44-runtime2-publication-generator-review.yml
      - .github/workflows/avps-v2-recovery3-ordinal44-runtime2-publication-review.yml
      - review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-runtime2-publication-generator-v1/**

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_BASE: 8e7498f58b219467ee3a17f9503a5b68b7d105eb
      EXPECTED_BRANCH: review/avps-v2-recovery3-ordinal44-runtime2-publication-generator-v1
      AUTH_BRANCH: authorization/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-ordinal-44
      AUTH_HEAD: dd3a4c692af505389e9feb1e5f5480fa389110a3
      AUTH_PATH: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-authorization-control-v1/authorization.json
      AUTH_BLOB: 927956c0c01d02d3b025b141bb1c8b72d873dfc7
      GENERATOR: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-runtime2-publication-generator-v1/generate.py
      RUNTIME_TEST: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-runtime-identity-v1/test_generated.py
      GENERATED: generated-avps-v2-recovery3-ordinal44-runtime2-publication
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Bind exact zero-runtime generator gate scope and source bytes
        shell: bash
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$EVENT_BASE" = "$EXPECTED_BASE"
          test "$EVENT_BRANCH" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          git diff --name-only "$EXPECTED_BASE"...HEAD | sort > changed.txt
          cat > expected.txt <<'PATHS'
          .github/workflows/avps-v2-recovery3-ordinal44-runtime2-publication-generator-review.yml
          .github/workflows/avps-v2-recovery3-ordinal44-runtime2-publication-review.yml
          review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-runtime2-publication-generator-v1/PROTOCOL.md
          review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-runtime2-publication-generator-v1/generate.py
          PATHS
          sort -o expected.txt expected.txt
          diff -u expected.txt changed.txt
          test "$(git rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-runtime-identity-v1/generate.py)" = 83313122917bb5da2bbb94107dfaf0e11ca18458
          test "$(git rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-runtime-identity-v1/test_generated.py)" = ac27392f8ef979490701d1dcb610520f0e99cda3
          test "$(git rev-parse HEAD:.github/workflows/avps-v2-postconsumption-recovery3-science.yml)" = ddc2bb954cf07c4c7f314c3d551a8aee44381c73
          test "$(git rev-parse HEAD:.github/workflows/avps-v2-postconsumption-recovery3-dispatch-publisher.yml)" = 10099ff88e169b6b820469d6d19ce5003c6f46bb
          test "$(git rev-parse HEAD:.github/workflows/avps-v2-postconsumption-recovery3-publisher-trigger-bridge.yml)" = 63a897d49cf7832f882fe16227ff3023a73c46ec

      - name: Materialize exact reviewed authorization
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/$AUTH_BRANCH:refs/remotes/origin/$AUTH_BRANCH"
          test "$(git rev-parse origin/$AUTH_BRANCH)" = "$AUTH_HEAD"
          test "$(git rev-parse "$AUTH_HEAD:$AUTH_PATH")" = "$AUTH_BLOB"
          git show "$AUTH_HEAD:$AUTH_PATH" > /tmp/recovery3-authorization.json

      - name: Generate publication twice and run zero-runtime acceptance/refusal fixtures
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GENERATED" /tmp/runtime2-first generated-avps-v2-recovery3-ordinal44-runtime-identity
          python "$GENERATOR" > generator-output-1.json
          cp -a "$GENERATED" /tmp/runtime2-first
          python "$RUNTIME_TEST" /tmp/recovery3-authorization.json
          cp runtime-identity-review-receipt.json runtime-identity-review-receipt-first.json
          rm -rf "$GENERATED" generated-avps-v2-recovery3-ordinal44-runtime-identity runtime-identity-review-receipt.json
          python "$GENERATOR" > generator-output-2.json
          diff -ru /tmp/runtime2-first "$GENERATED"
          cmp generator-output-1.json generator-output-2.json
          python "$RUNTIME_TEST" /tmp/recovery3-authorization.json
          cmp runtime-identity-review-receipt-first.json runtime-identity-review-receipt.json

      - name: Verify exact publication identities and preserved choreography
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('generated-avps-v2-recovery3-ordinal44-runtime2-publication')
          m=json.load(open(root/'manifest.json'))
          expected=sorted([
            '.github/workflows/avps-v2-postconsumption-recovery3-runtime2-science.yml',
            '.github/workflows/avps-v2-postconsumption-recovery3-runtime2-dispatch-publisher.yml',
            '.github/workflows/avps-v2-postconsumption-recovery3-runtime2-publisher-trigger-bridge.yml',
            'runtime-avps-v2-recovery3-ordinal44-v1/runtime_adapter.py',
            'runtime-avps-v2-recovery3-ordinal44-v1/executor.py',
            'runtime-avps-v2-recovery3-ordinal44-v1/aggregator.py'])
          if sorted(m['files']) != expected: raise SystemExit('six-file publication set drift')
          if m['status'] != 'GENERATED_AVPS_V2_RECOVERY3_ORDINAL44_RUNTIME2_PUBLICATION_ZERO_RUNTIME': raise SystemExit('manifest status drift')
          if (m['caseCount'],m['groupCount'],m['statesPerGroup'],m['photonHistoriesPerCase']) != (360,72,5,20_000_000): raise SystemExit('frozen science cardinality drift')
          exact={
            'runtime-avps-v2-recovery3-ordinal44-v1/runtime_adapter.py':('1d9eb949c284b5194990c3fd23d2e54fdab83527b937b2cfcff937353da7921f','9fce4f704040d7849b59ed96577d02e5aeecd455'),
            'runtime-avps-v2-recovery3-ordinal44-v1/executor.py':('85b411892bfea7699c232c0acd7a13132337b56f5f3df2cbf39688f03f0a7105','643c0d5b499747a8529a2a58c659ee24a7fd2a60'),
            'runtime-avps-v2-recovery3-ordinal44-v1/aggregator.py':('631d6cc1fd070841bc5c0c071bac9df790c96a6f7093211759680ccaf4cad8c2','abe8522d7e3562eef9f2c807911871916627fa96')}
          for p,(s,b) in exact.items():
              r=m['files'][p]
              if (r['sha256'],r['gitBlobSha1']) != (s,b): raise SystemExit(f'reviewed runtime drift: {p}')
          for key in ('frozenScienceChanged','dispatchCreated','scientificRuntime','solverExecution','resultsOpened','levelB','holdout','taylorOrJerusalemUsed','lowAltitudeEvidenceUsed','newMappingAuthorized'):
              if m.get(key) is not False: raise SystemExit(f'{key} boundary crossed')
          s=(root/'.github/workflows/avps-v2-postconsumption-recovery3-runtime2-science.yml').read_text()
          if 'runtime-avps-v2-recovery3-ordinal44-v1/executor.py' not in s or 'runtime-avps-v2-recovery3-ordinal44-v1/aggregator.py' not in s: raise SystemExit('runtime2 science routes missing')
          if 'review/aerosol-vertical-profile-sensitivity-v2-executor-parity-v1/executor.py' in s or 'review/aerosol-vertical-profile-sensitivity-v2-aggregator-parity-v1/aggregator.py' in s: raise SystemExit('old runtime route survived')
          if 'avps-v2-postconsumption-recovery3-runtime2-science.yml' not in s: raise SystemExit('new science identity missing')
          p=(root/'.github/workflows/avps-v2-postconsumption-recovery3-runtime2-dispatch-publisher.yml').read_text()
          required=['not_admissible=5470658421',"prefix='AVPS_V2_RECOVERY3_ORDINAL44_RUNTIME2_EXECUTION_PACKAGE_CORRECTED_ADMISSIBLE'",'PACKAGE_REVIEW_WORKFLOW: avps-v2-recovery3-ordinal44-runtime2-publication-review.yml','PACKAGE_REVIEW_ARTIFACT: avps-v2-recovery3-ordinal44-runtime2-publication-review','PASS_AVPS_V2_RECOVERY3_ORDINAL44_RUNTIME2_PUBLICATION_REVIEW_ZERO_RUNTIME','WRITE_QUIET_BEGIN ','WRITE_QUIET_END ','Fresh repository-global candidate-seed recheck and one-use guard','close_fence','avps-v2-postconsumption-recovery3-runtime2-science.yml']
          for x in required:
              if x not in p: raise SystemExit(f'publisher invariant missing: {x}')
          order=[p.index("gh api --paginate --slurp \"repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100\" > dispatch-evidence/pre-begin-comments.json"),p.index('BEGIN_BODY="WRITE_QUIET_BEGIN '),p.index('refs/heads/$DISPATCH_BRANCH'),p.index('actions/workflows/avps-v2-postconsumption-recovery3-runtime2-science.yml/dispatches'),p.index("get('name')=='Fresh repository-global candidate-seed recheck and one-use guard'"),p.index('close_fence\n          trap - EXIT')]
          if order != sorted(order): raise SystemExit(f'snapshot choreography order drift: {order}')
          t=(root/'.github/workflows/avps-v2-postconsumption-recovery3-runtime2-publisher-trigger-bridge.yml').read_text()
          required_t=['dispatch-trigger/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-runtime2-ordinal-44-publisher','dispatch-triggers/avps-v2-postconsumption-recovery3-runtime2-ordinal44-publisher.txt','avps-v2-postconsumption-recovery3-runtime2-dispatch-publisher.yml','AVPS_V2_POSTCONSUMPTION_RECOVERY3_RUNTIME2_ORDINAL44_PUBLISHER_TRIGGER_V1',f"PUBLISHER_BLOB: {m['publisherBlob']}"]
          for x in required_t:
              if x not in t: raise SystemExit(f'trigger invariant missing: {x}')
          r=json.load(open('runtime-identity-review-receipt.json'))
          if r['status']!='PASS_AVPS_V2_RECOVERY3_ORDINAL44_RUNTIME_IDENTITY_ZERO_RUNTIME_REVIEW' or r['oldOrdinal41GuardAccepted'] or r['oldOrdinal41AuthorizationAccepted']: raise SystemExit('runtime acceptance/refusal receipt drift')
          PY

      - name: Prove generator gate itself is zero-runtime and write receipt
        shell: bash
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          m=json.load(open('generated-avps-v2-recovery3-ordinal44-runtime2-publication/manifest.json'))
          out={'schemaVersion':1,'status':'PASS_AVPS_V2_RECOVERY3_ORDINAL44_RUNTIME2_PUBLICATION_GENERATOR_REVIEW_ZERO_RUNTIME','headSha':os.environ['EVENT_HEAD'],'baseSha':os.environ['EXPECTED_BASE'],'scientificOrdinal':44,'authorizationHead':os.environ['AUTH_HEAD'],'authorizationPr':718,'generatedFiles':m['files'],'publisherBlob':m['publisherBlob'],'dispatchCreated':False,'scientificRuntime':False,'solverExecution':False,'resultsOpened':False,'levelB':False,'holdout':False,'taylorOrJerusalemUsed':False,'lowAltitudeEvidenceUsed':False,'newMappingAuthorized':False}
          Path('runtime2-publication-generator-review-receipt.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
          test -z "$(git status --porcelain --untracked-files=no)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: avps-v2-recovery3-ordinal44-runtime2-publication-generator-review
          path: |
            changed.txt
            generator-output-1.json
            runtime-identity-review-receipt.json
            runtime2-publication-generator-review-receipt.json
            generated-avps-v2-recovery3-ordinal44-runtime2-publication/
          if-no-files-found: error
          compression-level: 0
