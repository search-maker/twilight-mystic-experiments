name: Review/materialize AVPS recovery3 ordinal44 runtime2 publication

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery3-ordinal44-runtime2-publication-materializer-v1.yml
  push:
    branches:
      - transport-trigger/avps-v2-recovery3-ordinal44-runtime2-publication-v1
    paths:
      - transport-triggers/avps-v2-recovery3-ordinal44-runtime2-publication-v1.txt

concurrency:
  group: avps-v2-recovery3-ordinal44-runtime2-publication-materializer-v1-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

env:
  MATERIALIZER: .github/workflows/avps-v2-recovery3-ordinal44-runtime2-publication-materializer-v1.yml
  GENERATOR: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-runtime2-publication-generator-v1/generate.py
  GENERATOR_BLOB: 9ed34260d944fa8d3d74e2578f790868cb91e42c
  GENERATOR_MAIN: 2c14f029534e20d2258a9fae1fbea49029a970e6
  ACTIVATION_BRANCH: transport-trigger/avps-v2-recovery3-ordinal44-runtime2-publication-v1
  ACTIVATION_MARKER: transport-triggers/avps-v2-recovery3-ordinal44-runtime2-publication-v1.txt
  TARGET_BRANCH: publication/avps-v2-recovery3-ordinal44-runtime2-v1
  GENERATED: generated-avps-v2-recovery3-ordinal44-runtime2-publication
  SCIENCE: .github/workflows/avps-v2-postconsumption-recovery3-runtime2-science.yml
  PUBLISHER: .github/workflows/avps-v2-postconsumption-recovery3-runtime2-dispatch-publisher.yml
  TRIGGER: .github/workflows/avps-v2-postconsumption-recovery3-runtime2-publisher-trigger-bridge.yml
  RUNTIME_ADAPTER: runtime-avps-v2-recovery3-ordinal44-v1/runtime_adapter.py
  EXECUTOR: runtime-avps-v2-recovery3-ordinal44-v1/executor.py
  AGGREGATOR: runtime-avps-v2-recovery3-ordinal44-v1/aggregator.py
  SCIENCE_SHA256: 30ad3f7fa18ec508dd0ebd688c1e179efac309a289856a6e415cf36782ae61a0
  SCIENCE_BLOB: a5154d238bddabaee1ec4a397b35b4ab596012d6
  PUBLISHER_SHA256: 2b553bae8bc39e96eb67f73b231866766782208004d8a7a87235bc79fd84b210
  PUBLISHER_BLOB: 3e583afb568acdb666c0910d2283819411b3487a
  TRIGGER_SHA256: 74bb16c92b4606aa04775893be81fa55e2b2eab912ae596ef4843599d2f0bc8c
  TRIGGER_BLOB: 2d277fc06bed4e7ab2f681f50fc4e35302ca2d42
  RUNTIME_ADAPTER_SHA256: 1d9eb949c284b5194990c3fd23d2e54fdab83527b937b2cfcff937353da7921f
  RUNTIME_ADAPTER_BLOB: 9fce4f704040d7849b59ed96577d02e5aeecd455
  EXECUTOR_SHA256: 85b411892bfea7699c232c0acd7a13132337b56f5f3df2cbf39688f03f0a7105
  EXECUTOR_BLOB: 643c0d5b499747a8529a2a58c659ee24a7fd2a60
  AGGREGATOR_SHA256: 631d6cc1fd070841bc5c0c071bac9df790c96a6f7093211759680ccaf4cad8c2
  AGGREGATOR_BLOB: abe8522d7e3562eef9f2c807911871916627fa96
  LEDGER_BASELINE_COMMENT: '5470816584'

jobs:
  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Bind one-file zero-runtime materializer scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "${{ github.event.pull_request.base.sha }}" = "$GENERATOR_MAIN"
          test "$(git rev-parse HEAD:$GENERATOR)" = "$GENERATOR_BLOB"
          git diff --name-only "$GENERATOR_MAIN"...HEAD | sort > changed.txt
          printf '%s\n' "$MATERIALIZER" > expected.txt
          diff -u expected.txt changed.txt
          ! grep -Eq '^  workflow_dispatch:' "$MATERIALIZER"
      - name: Regenerate and verify exact six-file runtime2 payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GENERATED" generated-avps-v2-recovery3-ordinal44-runtime-identity
          python "$GENERATOR" > generator-output.json
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['GENERATED']); m=json.load(open(root/'manifest.json'))
          if m.get('status')!='GENERATED_AVPS_V2_RECOVERY3_ORDINAL44_RUNTIME2_PUBLICATION_ZERO_RUNTIME': raise SystemExit('manifest status drift')
          if (m.get('caseCount'),m.get('groupCount'),m.get('statesPerGroup'),m.get('photonHistoriesPerCase'))!=(360,72,5,20_000_000): raise SystemExit('frozen science cardinality drift')
          for k in ('frozenScienceChanged','dispatchCreated','scientificRuntime','solverExecution','resultsOpened','levelB','holdout','taylorOrJerusalemUsed','lowAltitudeEvidenceUsed','newMappingAuthorized'):
              if m.get(k) is not False: raise SystemExit(f'{k} boundary crossed')
          checks={os.environ['SCIENCE']:(os.environ['SCIENCE_SHA256'],os.environ['SCIENCE_BLOB']),os.environ['PUBLISHER']:(os.environ['PUBLISHER_SHA256'],os.environ['PUBLISHER_BLOB']),os.environ['TRIGGER']:(os.environ['TRIGGER_SHA256'],os.environ['TRIGGER_BLOB']),os.environ['RUNTIME_ADAPTER']:(os.environ['RUNTIME_ADAPTER_SHA256'],os.environ['RUNTIME_ADAPTER_BLOB']),os.environ['EXECUTOR']:(os.environ['EXECUTOR_SHA256'],os.environ['EXECUTOR_BLOB']),os.environ['AGGREGATOR']:(os.environ['AGGREGATOR_SHA256'],os.environ['AGGREGATOR_BLOB'])}
          if sorted(m.get('files',{}))!=sorted(checks): raise SystemExit('six-file set drift')
          for rel,(s,b) in checks.items():
              p=root/rel; raw=p.read_bytes()
              if hashlib.sha256(raw).hexdigest()!=s: raise SystemExit(f'sha256 drift {rel}')
              if subprocess.check_output(['git','hash-object',str(p)],text=True).strip()!=b: raise SystemExit(f'blob drift {rel}')
          PY
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Freeze zero-runtime materializer review receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          out={'schemaVersion':1,'status':'PASS_AVPS_V2_RECOVERY3_ORDINAL44_RUNTIME2_PUBLICATION_MATERIALIZER_REVIEW_ZERO_RUNTIME','headSha':'${{ github.event.pull_request.head.sha }}','scientificOrdinal':44,'targetBranch':os.environ['TARGET_BRANCH'],'generatedFileCount':6,'repositoryMutationPerformed':False,'dispatchCreated':False,'scientificRuntime':False,'solverExecution':False,'resultsOpened':False,'levelB':False,'holdout':False,'taylorOrJerusalemUsed':False,'lowAltitudeEvidenceUsed':False,'newMappingAuthorized':False}
          Path('review-receipt.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: avps-v2-recovery3-ordinal44-runtime2-publication-materializer-review
          path: |
            changed.txt
            generator-output.json
            review-receipt.json
          if-no-files-found: error
          compression-level: 0

  materialize:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Prove fresh one-file activation from live main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = "$ACTIVATION_BRANCH"
          test -f "$ACTIVATION_MARKER"
          git fetch origin main
          mapfile -t parents < <(git cat-file -p HEAD | sed -n 's/^parent //p')
          test "${#parents[@]}" = 1
          test "${parents[0]}" = "$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$GENERATOR_MAIN" HEAD
          test "$(git rev-parse HEAD:$GENERATOR)" = "$GENERATOR_BLOB"
          git diff --name-only HEAD^ HEAD | sort > activation-changed.txt
          printf '%s\n' "$ACTIVATION_MARKER" > activation-expected.txt
          diff -u activation-expected.txt activation-changed.txt
          test "$(cat "$ACTIVATION_MARKER")" = 'AVPS_V2_RECOVERY3_ORDINAL44_RUNTIME2_PUBLICATION_MATERIALIZER_V1'
          if git ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null 2>&1; then echo 'target runtime2 publication branch already exists' >&2; exit 1; fi
      - name: Regenerate exact reviewed six-file payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GENERATED" generated-avps-v2-recovery3-ordinal44-runtime-identity
          python "$GENERATOR" > generator-output.json
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['GENERATED']); m=json.load(open(root/'manifest.json'))
          if (m.get('caseCount'),m.get('groupCount'),m.get('statesPerGroup'),m.get('photonHistoriesPerCase'))!=(360,72,5,20_000_000): raise SystemExit('science cardinality drift')
          for k in ('frozenScienceChanged','dispatchCreated','scientificRuntime','solverExecution','resultsOpened','levelB','holdout','taylorOrJerusalemUsed','lowAltitudeEvidenceUsed','newMappingAuthorized'):
              if m.get(k) is not False: raise SystemExit(f'{k} boundary crossed')
          checks={os.environ['SCIENCE']:(os.environ['SCIENCE_SHA256'],os.environ['SCIENCE_BLOB']),os.environ['PUBLISHER']:(os.environ['PUBLISHER_SHA256'],os.environ['PUBLISHER_BLOB']),os.environ['TRIGGER']:(os.environ['TRIGGER_SHA256'],os.environ['TRIGGER_BLOB']),os.environ['RUNTIME_ADAPTER']:(os.environ['RUNTIME_ADAPTER_SHA256'],os.environ['RUNTIME_ADAPTER_BLOB']),os.environ['EXECUTOR']:(os.environ['EXECUTOR_SHA256'],os.environ['EXECUTOR_BLOB']),os.environ['AGGREGATOR']:(os.environ['AGGREGATOR_SHA256'],os.environ['AGGREGATOR_BLOB'])}
          if sorted(m.get('files',{}))!=sorted(checks): raise SystemExit('six-file set drift')
          for rel,(s,b) in checks.items():
              p=root/rel; raw=p.read_bytes()
              if hashlib.sha256(raw).hexdigest()!=s: raise SystemExit(f'sha256 drift {rel}')
              if subprocess.check_output(['git','hash-object',str(p)],text=True).strip()!=b: raise SystemExit(f'blob drift {rel}')
          PY
      - name: Commit exact runtime2 publication atomically on fresh branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PARENT=$(git rev-parse origin/main)
          git switch --detach "$PARENT"
          git switch -c "$TARGET_BRANCH"
          for rel in "$SCIENCE" "$PUBLISHER" "$TRIGGER" "$RUNTIME_ADAPTER" "$EXECUTOR" "$AGGREGATOR"; do mkdir -p "$(dirname "$rel")"; cp "$GENERATED/$rel" "$rel"; done
          git add "$SCIENCE" "$PUBLISHER" "$TRIGGER" "$RUNTIME_ADAPTER" "$EXECUTOR" "$AGGREGATOR"
          git diff --cached --name-only | sort > publication-changed.txt
          printf '%s\n' "$SCIENCE" "$PUBLISHER" "$TRIGGER" "$RUNTIME_ADAPTER" "$EXECUTOR" "$AGGREGATOR" | sort > publication-expected.txt
          diff -u publication-expected.txt publication-changed.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Publish AVPS recovery3 ordinal44 runtime2 execution package'
          COMMIT=$(git rev-parse HEAD)
          test "$(git rev-parse HEAD^)" = "$PARENT"
          git diff --name-only "$PARENT" HEAD | sort > final-changed.txt
          diff -u publication-expected.txt final-changed.txt
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$PARENT"
          if git ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null 2>&1; then echo 'target runtime2 publication branch appeared before push' >&2; exit 1; fi
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > /tmp/issue60-pages.json
          python - <<'PY'
          import json,os,re
          pages=json.load(open('/tmp/issue60-pages.json')); comments=[c for p in pages for c in p]
          post=[c for c in comments if int(c.get('id') or 0)>int(os.environ['LEDGER_BASELINE_COMMENT'])]
          opens={}
          for c in post:
              cid=int(c.get('id') or 0); body=str(c.get('body') or '').strip()
              if body.startswith('WRITE_QUIET_BEGIN '): opens[cid]=body
              elif body.startswith('WRITE_QUIET_END '):
                  m=re.search(r'\bbegin=(\d+)\b',body)
                  if m: opens.pop(int(m.group(1)),None)
          if opens: raise SystemExit(f'unmatched WRITE_QUIET_BEGIN: {sorted(opens)}')
          blockers=('NOT_ADMISSIBLE','DO NOT USE','FAIL-CLOSED','CLOSED')
          for c in post:
              cid=int(c.get('id') or 0); upper=str(c.get('body') or '').upper()
              relevant=('AVPS' in upper or 'ORDINAL44' in upper or 'ORDINAL 44' in upper or 'RECOVERY3' in upper)
              superseding=('SUPERSED' in upper or ('COORDINATOR' in upper and 'RECOVERY' in upper))
              if relevant and (any(x in upper for x in blockers) or superseding): raise SystemExit(f'newer relevant fail-closed/recovery directive {cid}')
          PY
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          printf 'parent=%s\ncommit=%s\nbranch=%s\n' "$PARENT" "$COMMIT" "$TARGET_BRANCH" > materialization-receipt.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: avps-v2-recovery3-ordinal44-runtime2-publication-materialization
          path: |
            activation-changed.txt
            generator-output.json
            publication-changed.txt
            final-changed.txt
            materialization-receipt.txt
          if-no-files-found: warn
          compression-level: 0
