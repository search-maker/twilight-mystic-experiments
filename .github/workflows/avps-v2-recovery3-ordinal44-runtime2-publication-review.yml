name: Review AVPS recovery3 ordinal44 runtime2 publication

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-postconsumption-recovery3-runtime2-science.yml
      - .github/workflows/avps-v2-postconsumption-recovery3-runtime2-dispatch-publisher.yml
      - .github/workflows/avps-v2-postconsumption-recovery3-runtime2-publisher-trigger-bridge.yml
      - runtime-avps-v2-recovery3-ordinal44-v1/**

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_BRANCH: publication/avps-v2-recovery3-ordinal44-runtime2-v1
      SOURCE_MAIN: 8e7498f58b219467ee3a17f9503a5b68b7d105eb
      GENERATOR: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-runtime2-publication-generator-v1/generate.py
      GENERATOR_BLOB: 9ed34260d944fa8d3d74e2578f790868cb91e42c
      RUNTIME_TEST: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-runtime-identity-v1/test_generated.py
      AUTH_BRANCH: authorization/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-ordinal-44
      AUTH_HEAD: dd3a4c692af505389e9feb1e5f5480fa389110a3
      AUTH_PARENT: d8cd4af807e7a8f11ed39fdc579ed92adf866aab
      AUTH_PR: '718'
      AUTH_PATH: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-authorization-control-v1/authorization.json
      AUTH_BLOB: 927956c0c01d02d3b025b141bb1c8b72d873dfc7
      GENERATED: generated-avps-v2-recovery3-ordinal44-runtime2-publication
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Bind publication PR and exact generator/source identities
        shell: bash
        env:
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$EVENT_BASE_REF" = main
          test "$EVENT_BRANCH" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          git merge-base --is-ancestor "$SOURCE_MAIN" "$EVENT_BASE"
          test "$(git rev-parse HEAD:$GENERATOR)" = "$GENERATOR_BLOB"
          test "$(git rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-runtime-identity-v1/test_generated.py)" = ac27392f8ef979490701d1dcb610520f0e99cda3
          test "$(git rev-parse HEAD:.github/workflows/avps-v2-postconsumption-recovery3-science.yml)" = ddc2bb954cf07c4c7f314c3d551a8aee44381c73
          test "$(git rev-parse HEAD:.github/workflows/avps-v2-postconsumption-recovery3-dispatch-publisher.yml)" = 10099ff88e169b6b820469d6d19ce5003c6f46bb
          test "$(git rev-parse HEAD:.github/workflows/avps-v2-postconsumption-recovery3-publisher-trigger-bridge.yml)" = 63a897d49cf7832f882fe16227ff3023a73c46ec
          git diff --name-only "$EVENT_BASE"...HEAD | sort > changed.txt
          cat > expected.txt <<'PATHS'
          .github/workflows/avps-v2-postconsumption-recovery3-runtime2-dispatch-publisher.yml
          .github/workflows/avps-v2-postconsumption-recovery3-runtime2-publisher-trigger-bridge.yml
          .github/workflows/avps-v2-postconsumption-recovery3-runtime2-science.yml
          runtime-avps-v2-recovery3-ordinal44-v1/aggregator.py
          runtime-avps-v2-recovery3-ordinal44-v1/executor.py
          runtime-avps-v2-recovery3-ordinal44-v1/runtime_adapter.py
          PATHS
          sort -o expected.txt expected.txt
          diff -u expected.txt changed.txt

      - name: Materialize exact authorization
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/$AUTH_BRANCH:refs/remotes/origin/$AUTH_BRANCH"
          test "$(git rev-parse origin/$AUTH_BRANCH)" = "$AUTH_HEAD"
          mapfile -t PARENTS < <(git cat-file -p "$AUTH_HEAD" | sed -n 's/^parent //p')
          test "${#PARENTS[@]}" = 1
          test "${PARENTS[0]}" = "$AUTH_PARENT"
          test "$(git rev-parse "$AUTH_HEAD:$AUTH_PATH")" = "$AUTH_BLOB"
          git show "$AUTH_HEAD:$AUTH_PATH" > /tmp/recovery3-authorization.json

      - name: Regenerate and prove exact publication bytes plus acceptance/refusal fixtures
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GENERATED" generated-avps-v2-recovery3-ordinal44-runtime-identity
          python "$GENERATOR" > publication-generator-output.json
          for path in \
            .github/workflows/avps-v2-postconsumption-recovery3-runtime2-science.yml \
            .github/workflows/avps-v2-postconsumption-recovery3-runtime2-dispatch-publisher.yml \
            .github/workflows/avps-v2-postconsumption-recovery3-runtime2-publisher-trigger-bridge.yml \
            runtime-avps-v2-recovery3-ordinal44-v1/runtime_adapter.py \
            runtime-avps-v2-recovery3-ordinal44-v1/executor.py \
            runtime-avps-v2-recovery3-ordinal44-v1/aggregator.py; do
              cmp "$path" "$GENERATED/$path"
          done
          python "$RUNTIME_TEST" /tmp/recovery3-authorization.json
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          m=json.load(open('generated-avps-v2-recovery3-ordinal44-runtime2-publication/manifest.json'))
          r=json.load(open('runtime-identity-review-receipt.json'))
          if m['status']!='GENERATED_AVPS_V2_RECOVERY3_ORDINAL44_RUNTIME2_PUBLICATION_ZERO_RUNTIME': raise SystemExit('manifest drift')
          if r['status']!='PASS_AVPS_V2_RECOVERY3_ORDINAL44_RUNTIME_IDENTITY_ZERO_RUNTIME_REVIEW' or r['oldOrdinal41GuardAccepted'] or r['oldOrdinal41AuthorizationAccepted']: raise SystemExit('runtime acceptance/refusal drift')
          for key in ('frozenScienceChanged','dispatchCreated','scientificRuntime','solverExecution','resultsOpened','levelB','holdout','taylorOrJerusalemUsed','lowAltitudeEvidenceUsed','newMappingAuthorized'):
              if m.get(key) is not False: raise SystemExit(f'{key} boundary crossed')
          def blob(path): return subprocess.check_output(['git','hash-object',path],text=True).strip()
          out={'schemaVersion':1,'status':'PASS_AVPS_V2_RECOVERY3_ORDINAL44_RUNTIME2_PUBLICATION_REVIEW_ZERO_RUNTIME','mode':'publication','scientificOrdinal':44,'authorizationHead':'dd3a4c692af505389e9feb1e5f5480fa389110a3','authorizationParent':'d8cd4af807e7a8f11ed39fdc579ed92adf866aab','authorizationPr':718,'scienceBlob':blob('.github/workflows/avps-v2-postconsumption-recovery3-runtime2-science.yml'),'publisherBlob':blob('.github/workflows/avps-v2-postconsumption-recovery3-runtime2-dispatch-publisher.yml'),'triggerBlob':blob('.github/workflows/avps-v2-postconsumption-recovery3-runtime2-publisher-trigger-bridge.yml'),'runtimeAdapterBlob':blob('runtime-avps-v2-recovery3-ordinal44-v1/runtime_adapter.py'),'executorBlob':blob('runtime-avps-v2-recovery3-ordinal44-v1/executor.py'),'aggregatorBlob':blob('runtime-avps-v2-recovery3-ordinal44-v1/aggregator.py'),'candidateSeedCanonicalSha256':'d2817b1ea4f2bdc8cb1842e565b099b015e4e28c5874482629fadc450069d9bf','caseCount':360,'groupCount':72,'statesPerGroup':5,'photonHistoriesPerCase':20_000_000,'solverExecutionPerformed':False,'dispatchCreated':False,'resultsOpened':False,'levelB':False,'holdout':False,'taylorOrJerusalemUsed':False,'lowAltitudeEvidenceUsed':False,'newMappingAuthorized':False}
          Path('review-receipt.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
          test -z "$(git status --porcelain --untracked-files=no)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: avps-v2-recovery3-ordinal44-runtime2-publication-review
          path: |
            changed.txt
            publication-generator-output.json
            runtime-identity-review-receipt.json
            review-receipt.json
          if-no-files-found: error
          compression-level: 0
