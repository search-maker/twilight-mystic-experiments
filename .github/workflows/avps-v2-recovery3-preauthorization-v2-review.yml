name: Review AVPS v2 recovery3 live preauthorization v2

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery3-preauthorization-v2-review.yml
      - review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-preauthorization-v2/**

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: avps-v2-recovery3-preauthorization-v2-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BASE_MAIN: 384f94c02b892768a9dde6fe17e69a384112ef73
      EXPECTED_BRANCH: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-preauthorization-v2
      FENCE_TOKEN: AVPS_V2_RECOVERY3_PREAUTH_GLOBAL_SCAN_V2
      ORDINAL42_AUTH_HEAD: e627a689ada0493a8a5b9cdafc4aba0198fbabec
      ORDINAL42_LEDGER_BLOB: 491d1b6653bea0fcc5275269723a76aa1af52300
      ORDINAL41_RUN: '33236295233'
      ORDINAL42_RUN: '33259899524'
      ORDINAL43_RUN: '33298433506'
      ORDINAL43_CONSUMED_COMMENT: '5467301509'
      ORDINAL43_CONSUMED_BODY: ORDINAL43_AVPS_V2_POSTCONSUMPTION_RECOVERY2_DISPATCH_CONSUMED
      SEED_PROOF_PR: '689'
      SEED_PROOF_HEAD: ad2632c3d32b9a72805ade2c61c2ad3fe882fb09
      SEED_PROOF_RUN: '33305675119'
      SEED_PROOF_ARTIFACT: '9730444904'
      SEED_PROOF_DIGEST: sha256:13f833045d446b813e653ea10f018db98df956e80c51f76eccd9802f0bd47a48
      PUBLICATION_PR: '691'
      PUBLICATION_HEAD: e87109e0483649e6997d8a7f4a7551abe04cad24
      PUBLICATION_MERGE: 384f94c02b892768a9dde6fe17e69a384112ef73
      RECOVERY3_PROTOCOL_BLOB: 1f04f6676e71627ed4ed8dc24bb9e3f0366540ea
      RECOVERY3_WRAPPER_BLOB: e195956c8ce97ab1f7559b1c26d502f790d1508e
      RECOVERY3_LEDGER_BLOB: a4fc0b95c3627a310c0c17a1ae8b89701511b3b8
      NEW_SEED_CANONICAL: d2817b1ea4f2bdc8cb1842e565b099b015e4e28c5874482629fadc450069d9bf
      NEW_ROWS_CANONICAL: b6a519eadacdb99ea53c52d483c8acfeba05829643cb988de21682a53fc47896
      ORDINAL41_SEED_CANONICAL: 02f624d582e9b2caba6b920d65a5e8a8bc8fc1a2693623bc2f73abf5d3f706d2
      ORDINAL42_SEED_CANONICAL: a514212990a94a39d577bd038b631a600e18e4c0f750f781bbd7c99b897228a7
      ORDINAL43_SEED_CANONICAL: 38c074fe01bd6d09fa7dc78af1ad323e2f42b606ca992c2950b8fc1f5b343a9f

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Bind exact recovery3 v2 identity and immutable prerequisites
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "${{ github.event.action }}" = opened
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$PR_BRANCH" = "$EXPECTED_BRANCH"
          test "${{ github.event.pull_request.base.ref }}" = main
          test "${{ github.event.pull_request.base.sha }}" = "$BASE_MAIN"
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_MAIN"
          test -z "$(command -v uvspec || true)"

          git diff --name-only "$BASE_MAIN...$PR_HEAD" | sort > changed-paths.txt
          python - <<'PY'
          from pathlib import Path
          expected={
            '.github/workflows/avps-v2-recovery3-preauthorization-v2-review.yml',
            'review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-preauthorization-v2/PROTOCOL.md',
            'review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-preauthorization-v2/preauthorize.py',
          }
          got={x for x in Path('changed-paths.txt').read_text().splitlines() if x}
          if got != expected:
              raise SystemExit(f'exact three-file recovery3 v2 preauthorization scope required; got {sorted(got)}')
          PY

          test "$(git rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-seed-freshness-v1/PROTOCOL.md)" = "$RECOVERY3_PROTOCOL_BLOB"
          test "$(git rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-seed-freshness-v1/repository_global_seed_scan.py)" = "$RECOVERY3_WRAPPER_BLOB"
          test "$(git rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-seed-freshness-v1/seed_ledger.py)" = "$RECOVERY3_LEDGER_BLOB"
          test "$(git rev-parse HEAD:experiments/aerosol-family-challenge-v2/repository_global_seed_scan.py)" = 4c6d704fa24228284780bcb1dd7c52537b4c5b0d
          test "$(git rev-parse HEAD:experiments/aerosol-family-challenge-v2-r8/execution-candidate/preauthorization_ordinal.py)" = 7ca8efd17ae9e7ec2baa32fe935e5173ca6d173f
          test "$(git rev-parse HEAD:experiments/aerosol-family-challenge-v2-r8/execution-candidate/freshness.py)" = 732f803b5261e7986582dd7e0d69a66f70432b1e

          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > current-pr.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/$SEED_PROOF_PR" > seed-proof-pr.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SEED_PROOF_RUN" > seed-proof-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SEED_PROOF_ARTIFACT" > seed-proof-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PUBLICATION_PR" > publication-pr.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORDINAL41_RUN" > ordinal41-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORDINAL42_RUN" > ordinal42-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORDINAL43_RUN" > ordinal43-run.json
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$ORDINAL43_CONSUMED_COMMENT" > ordinal43-consumed-comment.json
          python - <<'PY'
          import json,os
          cur=json.load(open('current-pr.json'))
          if cur.get('state')!='open' or cur.get('draft') is not True or cur.get('merged_at') is not None:
              raise SystemExit('recovery3 v2 preauthorization PR must remain Draft/open/unmerged')
          if cur['head']['sha']!=os.environ['PR_HEAD'] or cur['base']['sha']!=os.environ['BASE_MAIN']:
              raise SystemExit('recovery3 v2 preauthorization PR identity drift')
          spr=json.load(open('seed-proof-pr.json')); sr=json.load(open('seed-proof-run.json')); sa=json.load(open('seed-proof-artifact.json'))
          if spr['head']['sha']!=os.environ['SEED_PROOF_HEAD']:
              raise SystemExit('recovery3 protected seed-proof PR head drift')
          if sr['id']!=int(os.environ['SEED_PROOF_RUN']) or sr['head_sha']!=os.environ['SEED_PROOF_HEAD'] or sr['run_attempt']!=1 or sr['status']!='completed' or sr['conclusion']!='success':
              raise SystemExit('recovery3 protected seed-proof run drift')
          if sa['id']!=int(os.environ['SEED_PROOF_ARTIFACT']) or sa.get('digest')!=os.environ['SEED_PROOF_DIGEST'] or sa.get('expired') is not False:
              raise SystemExit('recovery3 protected seed-proof artifact drift')
          pub=json.load(open('publication-pr.json'))
          if not pub.get('merged') or pub['head']['sha']!=os.environ['PUBLICATION_HEAD'] or pub.get('merge_commit_sha')!=os.environ['PUBLICATION_MERGE']:
              raise SystemExit('recovery3 publication merge drift')
          for path,label in (('ordinal41-run.json',41),('ordinal42-run.json',42),('ordinal43-run.json',43)):
              r=json.load(open(path))
              if r['run_attempt']!=1 or r['status']!='completed' or r['conclusion']!='failure':
                  raise SystemExit(f'consumed ordinal-{label} run identity drift')
          marker=json.load(open('ordinal43-consumed-comment.json'))
          if marker.get('id')!=int(os.environ['ORDINAL43_CONSUMED_COMMENT']):
              raise SystemExit('ordinal-43 consumed marker id drift')
          if str(marker.get('body') or '').strip()!=os.environ['ORDINAL43_CONSUMED_BODY']:
              raise SystemExit('ordinal-43 consumed marker body drift')
          PY

          git fetch --no-tags origin "$ORDINAL42_AUTH_HEAD"
          git cat-file -e "$ORDINAL42_AUTH_HEAD^{commit}"
          HIST="$RUNNER_TEMP/avps-ordinal42-native-recovery3-preauth-v2"
          rm -rf "$HIST"
          git worktree add --detach "$HIST" "$ORDINAL42_AUTH_HEAD"
          test "$(git -C "$HIST" rev-parse HEAD)" = "$ORDINAL42_AUTH_HEAD"
          test "$(git -C "$HIST" rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-seed-freshness-v1/seed_ledger.py)" = "$ORDINAL42_LEDGER_BLOB"
          AVPS_ORDINAL42_LEDGER_PATH="$HIST/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-seed-freshness-v1/seed_ledger.py"
          export AVPS_ORDINAL42_LEDGER_PATH
          echo "AVPS_ORDINAL42_LEDGER_PATH=$AVPS_ORDINAL42_LEDGER_PATH" >> "$GITHUB_ENV"
          mkdir -p preauthorization-evidence
          git ls-files -z > preauthorization-evidence/tracked-files.nul

      - name: Rebuild exact recovery3 candidate ledger
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-preauthorization-v2/preauthorize.py \
            review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-seed-freshness-v1/seed_ledger.py \
            review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-seed-freshness-v1/repository_global_seed_scan.py
          python - <<'PY'
          import importlib.util,json,os,sys
          from pathlib import Path
          p=Path('review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-seed-freshness-v1/seed_ledger.py')
          spec=importlib.util.spec_from_file_location('avps_v2_recovery3_seed_ledger_preauth_v2',p)
          if spec is None or spec.loader is None: raise SystemExit('cannot import recovery3 seed ledger')
          m=importlib.util.module_from_spec(spec); sys.modules[spec.name]=m; spec.loader.exec_module(m)
          x=m.validate_ledger()
          expected={
            'candidateSeedCount':72,
            'candidateSeedCanonicalSha256':os.environ['NEW_SEED_CANONICAL'],
            'candidateRowsCanonicalSha256':os.environ['NEW_ROWS_CANONICAL'],
            'consumedOrdinal41SeedCanonicalSha256':os.environ['ORDINAL41_SEED_CANONICAL'],
            'consumedOrdinal42SeedCanonicalSha256':os.environ['ORDINAL42_SEED_CANONICAL'],
            'consumedOrdinal43SeedCanonicalSha256':os.environ['ORDINAL43_SEED_CANONICAL'],
            'overlapWithConsumedOrdinal41SeedCount':0,
            'overlapWithConsumedOrdinal42SeedCount':0,
            'overlapWithConsumedOrdinal43SeedCount':0,
            'historicalOrdinal42LedgerValidatedAtNativePath':True,
            'allCollisionCountersZero':True,
          }
          for k,v in expected.items():
              if x.get(k)!=v: raise SystemExit(f'recovery3 candidate ledger drift {k}: {x.get(k)!r} != {v!r}')
          if len(set(int(v) for v in x.get('candidateSeeds',[]))) != 72: raise SystemExit('candidate seed uniqueness/cardinality drift')
          Path('preauthorization-evidence/candidate-seed-ledger.json').write_text(json.dumps(x,indent=2,sort_keys=True)+'\n')
          Path('preauthorization-evidence/empty-self-ledger-policy.json').write_text(json.dumps({'schemaVersion':2,'requiredTrackedSelfLedgerPaths':[],'futureEvidenceSelfLedgerPaths':[]},indent=2,sort_keys=True)+'\n')
          PY

      - name: Require v2 write-quiet fence and exact-head sibling quiescence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > issue60-pages.json
          python - <<'PY'
          import json,os
          pages=json.load(open('issue60-pages.json')); rows=[r for page in pages for r in page]
          wanted=f"WRITE_QUIET_BEGIN | {os.environ['FENCE_TOKEN']} | branch={os.environ['EXPECTED_BRANCH']} | head={os.environ['PR_HEAD']} | baseHead={os.environ['BASE_MAIN']}"
          matches=[r for r in rows if str(r.get('body') or '').startswith(wanted)]
          if len(matches)!=1: raise SystemExit(f'exact recovery3 v2 WRITE_QUIET_BEGIN required once; found {len(matches)}')
          begin_id=int(matches[0]['id'])
          later=[r for r in rows if int(r.get('id') or 0)>begin_id]
          if any(str(r.get('body') or '').startswith(f"WRITE_QUIET_END | {os.environ['FENCE_TOKEN']}") for r in later):
              raise SystemExit('recovery3 v2 fence already ended before protected scan')
          PY
          settled=0
          for _ in $(seq 1 60); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$PR_HEAD&per_page=100" > sibling-runs.json
            if python - <<'PY'
          import json,os,sys
          current=int(os.environ['GITHUB_RUN_ID'])
          rows=json.load(open('sibling-runs.json')).get('workflow_runs',[])
          pending=[(r.get('id'),r.get('name'),r.get('status')) for r in rows if int(r.get('id') or 0)!=current and r.get('status')!='completed']
          if pending:
              print('pending exact-head sibling workflows:',pending)
              sys.exit(1)
          PY
            then settled=1; break; fi
            sleep 10
          done
          test "$settled" = 1
          sleep 20
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_MAIN"
          test "$(git rev-parse HEAD)" = "$PR_HEAD"

      - name: Repeat tracked-tree and repository-global seed rechecks
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/tracked_tree_seed_scan.py \
            --repo-root . \
            --file-list preauthorization-evidence/tracked-files.nul \
            --candidate-seed-ledger preauthorization-evidence/candidate-seed-ledger.json \
            --allow-self-ledger-json preauthorization-evidence/empty-self-ledger-policy.json \
            --output preauthorization-evidence/tracked-seed-scan.json
          python review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-seed-freshness-v1/repository_global_seed_scan.py \
            --repository "$GITHUB_REPOSITORY" \
            --issue-number 60 \
            --candidate-seed-ledger preauthorization-evidence/candidate-seed-ledger.json \
            --current-run-id "$GITHUB_RUN_ID" \
            --audit-mode authorization-recheck \
            --expected-branch-name "$EXPECTED_BRANCH" \
            --expected-repo-head "$PR_HEAD" \
            --output preauthorization-evidence/repository-global-seed-recheck.json

      - name: Derive and freeze dynamic global ordinal proposal
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util,json,os,sys
          from pathlib import Path
          p=Path('review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-preauthorization-v2/preauthorize.py')
          spec=importlib.util.spec_from_file_location('avps_v2_recovery3_preauth_v2',p)
          if spec is None or spec.loader is None: raise SystemExit('cannot import recovery3 v2 preauthorization module')
          m=importlib.util.module_from_spec(spec); sys.modules[spec.name]=m; spec.loader.exec_module(m)
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GITHUB_TOKEN']; head=os.environ['PR_HEAD']; runid=int(os.environ['GITHUB_RUN_ID'])
          _,payload=m.collect_payload(repo,token)
          seed=json.load(open('preauthorization-evidence/repository-global-seed-recheck.json'))
          report,obs=m.build_report(payload,seed,head,runid)
          if report['nextAvailableScientificOrdinal'] != report['occupiedMaxScientificOrdinal']+1 or report['nextAvailableScientificOrdinal'] <= report['consumedFloorScientificOrdinal']:
              raise SystemExit('dynamic successor rule failed')
          for k in ('scientificOrdinalAllocated','authorizationCreated','dispatchCreated','solverExecutionAuthorized','resultOpeningAuthorized','levelBAuthorized','protectedHoldoutOpened','productionAuthorized','taylorOrJerusalemUsed'):
              if report.get(k) is not False: raise SystemExit('protected boundary crossed: '+k)
          if report.get('nextOrdinalHardCoded') is not False: raise SystemExit('successor ordinal was hard-coded')
          Path('preauthorization-evidence/preauthorization.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          Path('preauthorization-evidence/global-ordinal-observations.json').write_text(json.dumps(obs,indent=2,sort_keys=True)+'\n')
          m.final_verify(repo,token,head,runid,report)
          print('dynamic_next_ordinal='+str(report['nextAvailableScientificOrdinal']))
          PY

      - name: Prove zero-runtime boundary
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(command -v uvspec || true)"
          if git diff --name-only "$BASE_MAIN...HEAD" | grep -E '^experiments/|^scientific-tools/|^src/'; then
            echo 'runtime/scientific source changed by recovery3 v2 preauthorization PR' >&2
            exit 1
          fi
          python - <<'PY'
          import json
          x=json.load(open('preauthorization-evidence/preauthorization.json'))
          for k in ('scientificOrdinalAllocated','authorizationCreated','dispatchCreated','candidateSeedsAppliedToCases','scientificExecutionAuthorized','solverExecutionAuthorized','resultOpeningAuthorized','scientificRuntimeSetupPerformed','taylorOrJerusalemUsed','levelBAuthorized','protectedHoldoutOpened','productionAuthorized'):
              if x.get(k) is not False: raise SystemExit('boundary flag unexpectedly true: '+k)
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vertical-profile-v2-recovery3-preauthorization-v2-proof
          path: preauthorization-evidence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Remove historical detached worktree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git worktree remove --force "$RUNNER_TEMP/avps-ordinal42-native-recovery3-preauth-v2" 2>/dev/null || true
