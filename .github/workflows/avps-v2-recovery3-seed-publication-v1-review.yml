name: Review AVPS v2 recovery3 seed publication transport

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery3-seed-publication-v1-review.yml
      - review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-seed-freshness-v1/**

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_MAIN: 30ec5d1c37a3228b56a959e3b44afebd763a8563
      EXPECTED_BRANCH: review/avps-v2-recovery3-seed-publication-v1
      SOURCE_REVIEW_HEAD: ad2632c3d32b9a72805ade2c61c2ad3fe882fb09
      SOURCE_PROTOCOL_BLOB: 1f04f6676e71627ed4ed8dc24bb9e3f0366540ea
      SOURCE_GLOBAL_WRAPPER_BLOB: e195956c8ce97ab1f7559b1c26d502f790d1508e
      SOURCE_SEED_LEDGER_BLOB: a4fc0b95c3627a310c0c17a1ae8b89701511b3b8
      PRIOR_REVIEW_RUN: '33305675119'
      PRIOR_REVIEW_ARTIFACT: '9730444904'
      PRIOR_REVIEW_ARTIFACT_NAME: vertical-profile-v2-postconsumption-recovery3-seed-freshness-proof
      PRIOR_REVIEW_ARTIFACT_DIGEST: sha256:13f833045d446b813e653ea10f018db98df956e80c51f76eccd9802f0bd47a48
      PRIOR_FENCE_END_COMMENT: '5468118282'
      EXPECTED_SEED_CANONICAL: d2817b1ea4f2bdc8cb1842e565b099b015e4e28c5874482629fadc450069d9bf
      EXPECTED_ROWS_CANONICAL: b6a519eadacdb99ea53c52d483c8acfeba05829643cb988de21682a53fc47896
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Bind exact publication transport scope and source bytes
        shell: bash
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$PR_BRANCH" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_MAIN"
          test "${{ github.event.pull_request.base.ref }}" = main
          test "${{ github.event.pull_request.base.sha }}" = "$BASE_MAIN"

          git diff --name-only "$BASE_MAIN...$PR_HEAD" | sort > changed-paths.txt
          cat > expected-paths.txt <<'EOF'
          .github/workflows/avps-v2-recovery3-seed-publication-v1-review.yml
          review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-seed-freshness-v1/PROTOCOL.md
          review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-seed-freshness-v1/repository_global_seed_scan.py
          review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-seed-freshness-v1/seed_ledger.py
          EOF
          sort -o expected-paths.txt expected-paths.txt
          diff -u expected-paths.txt changed-paths.txt

          test "$(git rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-seed-freshness-v1/PROTOCOL.md)" = "$SOURCE_PROTOCOL_BLOB"
          test "$(git rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-seed-freshness-v1/repository_global_seed_scan.py)" = "$SOURCE_GLOBAL_WRAPPER_BLOB"
          test "$(git rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-seed-freshness-v1/seed_ledger.py)" = "$SOURCE_SEED_LEDGER_BLOB"
          if git cat-file -e HEAD:.github/workflows/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-seed-freshness-v1-review.yml 2>/dev/null; then
            echo 'publication carrier must not mint a second review-freeze workflow identity' >&2
            exit 1
          fi

          git fetch origin "$SOURCE_REVIEW_HEAD"
          git cat-file -e "$SOURCE_REVIEW_HEAD^{commit}"
          cat > source-expected-paths.txt <<'EOF'
          .github/workflows/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-seed-freshness-v1-review.yml
          review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-seed-freshness-v1/PROTOCOL.md
          review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-seed-freshness-v1/repository_global_seed_scan.py
          review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-seed-freshness-v1/seed_ledger.py
          EOF
          git diff --name-only "$BASE_MAIN...$SOURCE_REVIEW_HEAD" | sort > source-changed-paths.txt
          sort -o source-expected-paths.txt source-expected-paths.txt
          diff -u source-expected-paths.txt source-changed-paths.txt
          test "$(git rev-parse "$SOURCE_REVIEW_HEAD":review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-seed-freshness-v1/PROTOCOL.md)" = "$SOURCE_PROTOCOL_BLOB"
          test "$(git rev-parse "$SOURCE_REVIEW_HEAD":review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-seed-freshness-v1/repository_global_seed_scan.py)" = "$SOURCE_GLOBAL_WRAPPER_BLOB"
          test "$(git rev-parse "$SOURCE_REVIEW_HEAD":review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-seed-freshness-v1/seed_ledger.py)" = "$SOURCE_SEED_LEDGER_BLOB"

      - name: Verify prior exact-head protected proof identity and closure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR_REVIEW_RUN" > prior-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR_REVIEW_RUN/artifacts" > prior-artifacts.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > issue60-pages.json
          python - <<'PY'
          import json,os
          r=json.load(open('prior-run.json'))
          if r.get('id')!=int(os.environ['PRIOR_REVIEW_RUN']): raise SystemExit('prior review run id drift')
          if r.get('run_attempt')!=1 or r.get('status')!='completed' or r.get('conclusion')!='success': raise SystemExit('prior review terminal state drift')
          if r.get('head_sha')!=os.environ['SOURCE_REVIEW_HEAD'] or r.get('event')!='pull_request': raise SystemExit('prior review head/event drift')
          arts=json.load(open('prior-artifacts.json')).get('artifacts',[])
          hits=[a for a in arts if a.get('id')==int(os.environ['PRIOR_REVIEW_ARTIFACT']) and a.get('name')==os.environ['PRIOR_REVIEW_ARTIFACT_NAME']]
          if len(hits)!=1: raise SystemExit('prior proof artifact identity/cardinality drift')
          a=hits[0]
          if a.get('expired') is True: raise SystemExit('prior proof artifact expired')
          if a.get('digest')!=os.environ['PRIOR_REVIEW_ARTIFACT_DIGEST']: raise SystemExit(f"prior artifact digest drift: {a.get('digest')}")
          pages=json.load(open('issue60-pages.json'))
          comments=[c for page in pages for c in page]
          end=[c for c in comments if c.get('id')==int(os.environ['PRIOR_FENCE_END_COMMENT'])]
          if len(end)!=1: raise SystemExit('prior fence END comment missing/cardinality drift')
          body=str(end[0].get('body') or '')
          required=(
            'WRITE_QUIET_END | AVPS_V2_POSTCONSUMPTION_RECOVERY3_SEED_GLOBAL_SCAN_V1',
            'reviewRun=33305675119 attempt=1 terminal=SUCCESS',
            'artifact=9730444904',
            'PASS_POSTCONSUMPTION_RECOVERY3_CANDIDATE_SEEDS_FRESH_NOT_ALLOCATED',
            os.environ['EXPECTED_SEED_CANONICAL'],
            os.environ['EXPECTED_ROWS_CANONICAL'],
          )
          for token in required:
            if token not in body: raise SystemExit(f'prior fence END binding missing: {token}')
          PY

      - name: Download and verify immutable prior proof payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf prior-proof
          mkdir prior-proof
          gh run download "$PRIOR_REVIEW_RUN" -n "$PRIOR_REVIEW_ARTIFACT_NAME" -D prior-proof
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('prior-proof/recovery3-seed-freshness-proof.json')
          g=Path('prior-proof/repository-global-seed-scan.json')
          t=Path('prior-proof/tracked-seed-scan.json')
          if not p.is_file() or not g.is_file() or not t.is_file(): raise SystemExit('prior proof payload incomplete')
          x=json.load(open(p)); gs=json.load(open(g)); ts=json.load(open(t))
          if x.get('status')!='PASS_POSTCONSUMPTION_RECOVERY3_CANDIDATE_SEEDS_FRESH_NOT_ALLOCATED': raise SystemExit('prior proof status drift')
          if x.get('auditedHead')!=os.environ['SOURCE_REVIEW_HEAD']: raise SystemExit('prior proof audited head drift')
          if x.get('candidateSeedCount')!=72 or x.get('candidateSeedCanonicalSha256')!=os.environ['EXPECTED_SEED_CANONICAL'] or x.get('candidateRowsCanonicalSha256')!=os.environ['EXPECTED_ROWS_CANONICAL']: raise SystemExit('prior proof candidate identity drift')
          if x.get('consumedScientificOrdinals')!=[41,42,43] or x.get('consumedRunIds')!=[33236295233,33259899524,33298433506]: raise SystemExit('prior consumed predecessor binding drift')
          for key in ('overlapWithConsumedOrdinal41SeedCount','overlapWithConsumedOrdinal42SeedCount','overlapWithConsumedOrdinal43SeedCount','trackedTreeExternalCollisionCount','repositoryGlobalCollisionCount'):
            if x.get(key)!=0: raise SystemExit(f'prior proof collision invariant drift: {key}')
          if x.get('repositoryGlobalDoubleEnumerationStable') is not True or x.get('historicalOrdinal42LedgerValidatedAtNativePath') is not True or x.get('dynamicGlobalOrdinalReviewRequired') is not True or x.get('nextOrdinalHardCoded') is not False: raise SystemExit('prior proof freshness/ordinal invariant drift')
          for key in ('candidateSeedsAppliedToCases','scientificOrdinalAllocated','authorizationCreated','dispatchCreated','scientificExecutionAuthorized','solverExecutionAuthorized','resultOpeningAuthorized','levelBOpened','productionAuthorized'):
            if x.get(key) is not False: raise SystemExit(f'prior proof crossed boundary: {key}')
          arrivals=x.get('repositoryGlobalPostFenceArrivalCounts') or {}
          if any(v!=0 for v in arrivals.values()): raise SystemExit('prior proof post-fence arrival drift')
          if gs.get('repositoryGlobalCollisionCount')!=0 or gs.get('repositoryGlobalDoubleEnumerationStable') is not True: raise SystemExit('prior global scan payload drift')
          if ts.get('trackedTreeExternalCollisionCount')!=0 or ts.get('exactHeadTrackedTreeByteScanPassed') is not True: raise SystemExit('prior tracked-tree scan payload drift')
          PY

      - name: Prove publication carrier is transport-only
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-seed-freshness-v1/seed_ledger.py \
            review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-seed-freshness-v1/repository_global_seed_scan.py
          if git diff --name-only "$BASE_MAIN...HEAD" | grep -E '^experiments/|^scientific-tools/|^src/'; then
            echo 'publication carrier changed runtime/scientific source' >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/avps-v2-recovery3-seed-publication-v1-review.yml').read_text()
          forbidden = (
              'workflow_' + 'dispatch:',
              'uv' + 'spec',
              'lib' + 'Radtran',
              'mc_' + 'photons',
              'aerosol_set_' + 'tau_at_wvl',
          )
          for token in forbidden:
              if token in text:
                  raise SystemExit(f'publication review contains forbidden runtime token: {token}')
          PY

      - name: Write transport receipt
        shell: bash
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          out={
            'schemaVersion':1,
            'status':'PASS_AVPS_V2_RECOVERY3_SEED_PUBLICATION_TRANSPORT_PRIOR_PROOF_BOUND_ZERO_RUNTIME',
            'publicationHead':os.environ['PR_HEAD'],
            'baseMain':os.environ['BASE_MAIN'],
            'sourceReviewedHead':os.environ['SOURCE_REVIEW_HEAD'],
            'priorReviewRun':int(os.environ['PRIOR_REVIEW_RUN']),
            'priorReviewArtifact':int(os.environ['PRIOR_REVIEW_ARTIFACT']),
            'priorReviewArtifactDigest':os.environ['PRIOR_REVIEW_ARTIFACT_DIGEST'],
            'candidateSeedCanonicalSha256':os.environ['EXPECTED_SEED_CANONICAL'],
            'candidateRowsCanonicalSha256':os.environ['EXPECTED_ROWS_CANONICAL'],
            'copiedSourceBlobs':{
              'protocol':os.environ['SOURCE_PROTOCOL_BLOB'],
              'globalWrapper':os.environ['SOURCE_GLOBAL_WRAPPER_BLOB'],
              'seedLedger':os.environ['SOURCE_SEED_LEDGER_BLOB'],
            },
            'secondReviewFreezeProofAttempted':False,
            'scientificOrdinalAllocated':False,
            'authorizationCreated':False,
            'dispatchCreated':False,
            'scientificRuntime':False,
            'resultOpening':False,
            'levelBAdmission':False,
            'holdout':False,
            'taylorOrJerusalemUsed':False,
            'production':False,
          }
          Path('publication-transport-receipt.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: avps-v2-recovery3-seed-publication-v1-review
          path: |
            changed-paths.txt
            source-changed-paths.txt
            prior-run.json
            prior-artifacts.json
            publication-transport-receipt.json
          if-no-files-found: error
          compression-level: 0