      - name: Final live fence, head, seed and ordinal proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util,json,os,sys,time,urllib.error
          from pathlib import Path
          transient=(urllib.error.URLError,TimeoutError,ConnectionError,json.JSONDecodeError)
          def retry(label,fn):
              for n in range(1,4):
                  try: return fn()
                  except transient as e:
                      print(f'READ_RETRY::{label}::attempt={n}::{type(e).__name__}::{e}',file=sys.stderr)
                      if n==3: raise
                      time.sleep(n*3)
          def load(name,path):
              sp=importlib.util.spec_from_file_location(name,path); m=importlib.util.module_from_spec(sp); sys.modules[name]=m; sp.loader.exec_module(m); return m
          s=Path(os.environ['SCRATCH_DIR']); ledger=json.load(open(s/'control-proof/candidate-seed-ledger.json')); seeds={int(x) for x in ledger['candidateSeeds']}
          scanner=load('r4_auth_final_scanner',Path('experiments/aerosol-family-challenge-v2/repository_global_seed_scan.py'))
          freshness=load('r4_auth_final_freshness',Path('experiments/aerosol-family-challenge-v2-r8/execution-candidate/freshness.py')); sys.modules['freshness']=freshness
          ordinal=load('r4_auth_final_ordinal',Path('experiments/aerosol-family-challenge-v2-r8/execution-candidate/preauthorization_ordinal.py'))
          context,stable_sha,fence,post=retry('final-collect-stable',lambda: scanner.collect_stable(os.environ['GITHUB_REPOSITORY'],60,os.environ['GITHUB_TOKEN'],int(os.environ['GITHUB_RUN_ID']),seeds,'authorization-recheck'))
          seed_report=scanner.evaluate_context(context,seeds,int(os.environ['GITHUB_RUN_ID']),stable_double_enumeration_passed=True,stable_context_sha256_value=stable_sha,audit_mode='authorization-recheck',expected_branch_name=os.environ['CONTROL_BRANCH'],expected_repo_head=os.environ['PR_HEAD'],snapshot_fence=fence,post_fence_arrival_counts=post)
          if seed_report.get('repositoryGlobalCollisionCount')!=0 or seed_report.get('repositoryGlobalPostFenceCandidateSeedCollisionCount')!=0: raise SystemExit('final seed collision arrived')
          obs=ordinal.authoritative_global_ordinal_observations(context,current_run_id=int(os.environ['GITHUB_RUN_ID']))
          occupied=sorted({int(r['ordinal']) for r in obs}); consumed=sorted({int(r['ordinal']) for r in obs if r.get('reason')=='exact-consumed-marker'})
          if max(occupied)!=44 or any(x not in consumed for x in (41,42,43,44)): raise SystemExit('final ordinal surface drift')
          stage='aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4'; branches={str(r.get('name') or '') for r in context.get('branches',[])}
          if f'authorization/{stage}-ordinal-45' in branches or f'dispatch/{stage}-ordinal-45' in branches: raise SystemExit('ordinal45 ref appeared during review')
          if any(str(r.get('body') or '').strip().upper().startswith('ORDINAL45_') for r in context.get('issue60Comments',[])): raise SystemExit('ordinal45 marker appeared during review')
          PY
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$PR_BASE"
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          dirty="$(git status --porcelain --untracked-files=no)"
          test -z "$dirty" || { printf '%s\n' "$dirty" >&2; echo 'tracked tree dirty at Recovery4 auth-control completion' >&2; exit 1; }

