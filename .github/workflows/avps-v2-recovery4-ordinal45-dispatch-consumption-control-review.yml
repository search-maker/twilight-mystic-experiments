name: Review AVPS Recovery4 ordinal45 dispatch consumption control

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery4-ordinal45-dispatch-consumption-control-review.yml

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_BASE: 85f0b97f05a05a42ee35466518319b5451f2f46b
      EXPECTED_BRANCH: review/avps-v2-recovery4-ordinal45-dispatch-consumption-control-v2
      AUTH_BRANCH: authorization/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-ordinal-45
      AUTH_HEAD: 6e095b4b1603c90dcee0943295909b30cd1b374d
      AUTH_PARENT: 5685d5c313071014a94c816ee26b129f1f17a7fc
      AUTH_PR: '774'
      AUTH_REVIEW_RUN: '33368601918'
      AUTH_REVIEW_ARTIFACT: '9749469156'
      AUTH_REVIEW_DIGEST: sha256:1d7d8d62f5372b989a9bbb2b9546598de4dac350adeb4c00db4712420be5e751
      AUTHORIZATION_BLOB: 96ee8299d00bd72cdb73de4583670730ce89c73b
      DISPATCH_BRANCH: dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-ordinal-45
      EXECUTION_KEY: aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4:numerical:45
      ALLOCATION_MARKER: ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_AUTHORIZATION_ALLOCATED_REVIEWED_NOT_DISPATCHED commit=6e095b4b1603c90dcee0943295909b30cd1b374d parent=5685d5c313071014a94c816ee26b129f1f17a7fc pr=774
      CONSUMED_MARKER: ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_DISPATCH_CONSUMED
      CANDIDATE_SEED_SHA256: ddded6b2d170ca2fac8d498bdba2887446c16995df0880d948fb2be00870b3de
      CANDIDATE_ROWS_SHA256: c439de417520b330c037e2628df02b6955f652563300aa5ef30477abf7661a98
      AUTH_SEED_LEDGER_PATH: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-seed-global-control-v1/seed_ledger.py
      AUTH_SEED_LEDGER_BLOB: 16af5c68ae7e3cfc0cfbef4c8e2022517bf2ae91
      NATIVE_SEED_HELPER_PATH: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-science-transport-v1/native_authorization_seed_transport.py
      NATIVE_SEED_HELPER_BLOB: 2df2c3fd1ffa78e16f44e6825d67b3e82e903c1e
      HISTORICAL_AUTH_BRANCH: authorization/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery1-ordinal-42
      HISTORICAL_HEAD: e627a689ada0493a8a5b9cdafc4aba0198fbabec
      HISTORICAL_SEED_LEDGER_PATH: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-seed-freshness-v1/seed_ledger.py
      HISTORICAL_SEED_LEDGER_BLOB: 491d1b6653bea0fcc5275269723a76aa1af52300
      SCIENCE_WORKFLOW: .github/workflows/avps-v2-postconsumption-recovery4-science.yml
      SCIENCE_WORKFLOW_BLOB: 2d210b3a161f6889352d600fb9222c974e728034
      RUNTIME_ADAPTER_PATH: runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py
      RUNTIME_ADAPTER_BLOB: e4b690c2969fd01ecde5b08f554e47ad50b40914
      EXECUTOR_PATH: runtime-avps-v2-recovery4-ordinal45-v1/executor.py
      EXECUTOR_BLOB: 7dc38e31c19701b1a1ceef300d75105cff179290
      AGGREGATOR_PATH: runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py
      AGGREGATOR_BLOB: 6afc8b0d21c2b5553c251dc9ca5524c795ed2646
      RUNTIME_CONTRACT_PATH: runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json
      RUNTIME_CONTRACT_BLOB: 2d5f71d80b5e573b86775c2806b80dcc1fbe02f4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Bind exact one-file zero-runtime review identity
        shell: bash
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$EVENT_BASE" = "$EXPECTED_BASE"
          test "$EVENT_BRANCH" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_BASE"
          git diff --name-only "$EXPECTED_BASE"...HEAD > changed.txt
          test "$(wc -l < changed.txt)" = 1
          grep -Fx '.github/workflows/avps-v2-recovery4-ordinal45-dispatch-consumption-control-review.yml' changed.txt
          if git diff --name-only "$EXPECTED_BASE"...HEAD | grep -E '^(experiments|runtime-|scientific-tools|src)/'; then
            echo 'scientific/runtime source changed by zero-runtime control review' >&2
            exit 1
          fi

      - name: Bind published exact-five bytes and authorization evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse "$EXPECTED_BASE:$SCIENCE_WORKFLOW")" = "$SCIENCE_WORKFLOW_BLOB"
          test "$(git rev-parse "$EXPECTED_BASE:$RUNTIME_ADAPTER_PATH")" = "$RUNTIME_ADAPTER_BLOB"
          test "$(git rev-parse "$EXPECTED_BASE:$EXECUTOR_PATH")" = "$EXECUTOR_BLOB"
          test "$(git rev-parse "$EXPECTED_BASE:$AGGREGATOR_PATH")" = "$AGGREGATOR_BLOB"
          test "$(git rev-parse "$EXPECTED_BASE:$RUNTIME_CONTRACT_PATH")" = "$RUNTIME_CONTRACT_BLOB"
          git fetch origin "refs/heads/$AUTH_BRANCH:refs/remotes/origin/$AUTH_BRANCH"
          test "$(git rev-parse origin/$AUTH_BRANCH)" = "$AUTH_HEAD"
          mapfile -t PARENTS < <(git cat-file -p "$AUTH_HEAD" | sed -n 's/^parent //p')
          test "${#PARENTS[@]}" = 1
          test "${PARENTS[0]}" = "$AUTH_PARENT"
          test "$(git rev-parse "$AUTH_HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-authorization-control-v1/authorization.json")" = "$AUTHORIZATION_BLOB"
          mkdir -p dispatch-control
          git show "$AUTH_HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-authorization-control-v1/authorization.json" > dispatch-control/authorization.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/$AUTH_PR" > dispatch-control/authorization-pr.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$AUTH_REVIEW_RUN" > dispatch-control/authorization-review-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$AUTH_REVIEW_ARTIFACT" > dispatch-control/authorization-review-artifact.json
          python - <<'PY'
          import json,os
          p=json.load(open('dispatch-control/authorization-pr.json'))
          if p['number']!=774 or p['state']!='open' or p['draft'] is not True or p['merged_at'] is not None:
              raise SystemExit('authorization PR state drift')
          if p['head']['sha']!=os.environ['AUTH_HEAD'] or p['base']['sha']!=os.environ['AUTH_PARENT']:
              raise SystemExit('authorization PR identity drift')
          r=json.load(open('dispatch-control/authorization-review-run.json'))
          if r['id']!=int(os.environ['AUTH_REVIEW_RUN']) or r['head_sha']!=os.environ['AUTH_HEAD'] or r['run_attempt']!=1 or r['status']!='completed' or r['conclusion']!='success':
              raise SystemExit('authorization review drift')
          a=json.load(open('dispatch-control/authorization-review-artifact.json'))
          if a['id']!=int(os.environ['AUTH_REVIEW_ARTIFACT']) or a.get('digest')!=os.environ['AUTH_REVIEW_DIGEST'] or a.get('expired'):
              raise SystemExit('authorization review artifact drift')
          auth=json.load(open('dispatch-control/authorization.json'))
          required={'scientificOrdinal':45,'executionKey':os.environ['EXECUTION_KEY'],'candidateSeedCanonicalSha256':os.environ['CANDIDATE_SEED_SHA256'],'caseCount':360,'commonRandomNumberGroupCount':72,'statesPerGroup':5,'photonHistoriesPerCase':20_000_000}
          for k,v in required.items():
              if auth.get(k)!=v: raise SystemExit(f'authorization drift: {k}')
          for k in ('dispatchAuthorized','resultOpeningAuthorized','productionAuthorized'):
              if auth.get(k) is not False: raise SystemExit(f'closed authorization boundary drift: {k}')
          PY

      - name: Fresh Issue60 governance and one-use absence review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > dispatch-control/issue60-pages.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/avps-v2-postconsumption-recovery4-science.yml/runs?event=workflow_dispatch&per_page=100" > dispatch-control/science-run-pages.json
          if git ls-remote --exit-code --heads origin "$DISPATCH_BRANCH" >/dev/null 2>&1; then
            echo 'dispatch branch already exists' >&2
            exit 1
          fi
          python - <<'PY'
          import json,os,re
          pages=json.load(open('dispatch-control/issue60-pages.json'))
          comments=[c for page in pages for c in page]
          bodies=[str(c.get('body') or '').strip() for c in comments]
          if sum(b==os.environ['ALLOCATION_MARKER'] for b in bodies)!=1:
              raise SystemExit('allocation marker cardinality drift')
          if sum(b.startswith(os.environ['CONSUMED_MARKER']) for b in bodies)!=0:
              raise SystemExit('ordinal45 consumed marker already exists')
          opens={}
          aliases=('begin','beginComment','begin_comment')
          for c in comments:
              cid=int(c.get('id') or 0); body=str(c.get('body') or '').strip()
              if body.startswith('WRITE_QUIET_BEGIN'):
                  opens[cid]=body
              elif body.startswith('WRITE_QUIET_END'):
                  first=body.splitlines()[0]
                  vals=[]
                  for key in aliases:
                      vals += re.findall(r'(?<![A-Za-z0-9_])'+re.escape(key)+r'=(\d+)(?![A-Za-z0-9_])',first)
                  if vals:
                      unique=set(vals)
                      if len(unique)!=1: raise SystemExit(f'conflicting WRITE_QUIET_END begin aliases at {cid}: {vals}')
                      opens.pop(int(vals[0]),None)
          if opens:
              raise SystemExit(f'unmatched WRITE_QUIET_BEGIN: {sorted(opens)}')
          relevant=('AVPS','AEROSOL_VERTICAL_PROFILE','ORDINAL45')
          blockers=('NOT_ADMISSIBLE','DO NOT USE','FAIL-CLOSED','QUARANTINE_DOWNSTREAM=TRUE')
          for c in comments:
              if int(c.get('id') or 0) <= 5493157205: continue
              upper=str(c.get('body') or '').upper()
              if any(x in upper for x in relevant) and any(x in upper for x in blockers):
                  raise SystemExit(f'newer AVPS fail-closed/quarantine directive: {c.get("id")}')
          pages=json.load(open('dispatch-control/science-run-pages.json'))
          runs=[r for page in pages for r in page.get('workflow_runs',[])]
          if runs:
              raise SystemExit(f'prior Recovery4 science workflow_dispatch exists: {[r.get("id") for r in runs]}')
          PY

      - name: Fresh candidate-seed collision review
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git ls-files -z > dispatch-control/tracked-files.nul
          test "$(git rev-parse HEAD:$NATIVE_SEED_HELPER_PATH)" = "$NATIVE_SEED_HELPER_BLOB"
          git fetch origin "refs/heads/$HISTORICAL_AUTH_BRANCH:refs/remotes/origin/$HISTORICAL_AUTH_BRANCH"
          test "$(git rev-parse origin/$HISTORICAL_AUTH_BRANCH)" = "$HISTORICAL_HEAD"
          python "$NATIVE_SEED_HELPER_PATH" \
            --repo-root . \
            --authorization-head "$AUTH_HEAD" \
            --authorization-parent "$AUTH_PARENT" \
            --authorization-ledger-path "$AUTH_SEED_LEDGER_PATH" \
            --authorization-ledger-blob "$AUTH_SEED_LEDGER_BLOB" \
            --candidate-seed-sha256 "$CANDIDATE_SEED_SHA256" \
            --candidate-rows-sha256 "$CANDIDATE_ROWS_SHA256" \
            --historical-head "$HISTORICAL_HEAD" \
            --historical-ledger-path "$HISTORICAL_SEED_LEDGER_PATH" \
            --historical-ledger-blob "$HISTORICAL_SEED_LEDGER_BLOB" \
            --work-root dispatch-control/native-seed-transport \
            --output-ledger dispatch-control/candidate-seed-ledger.json \
            --output-context dispatch-control/native-seed-context.json
          python - <<'PY'
          import json
          from pathlib import Path
          Path('dispatch-control/empty-self-ledger-policy.json').write_text(json.dumps({'schemaVersion':2,'requiredTrackedSelfLedgerPaths':[],'futureEvidenceSelfLedgerPaths':[]},indent=2,sort_keys=True)+'\n')
          PY
          python review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/tracked_tree_seed_scan.py \
            --repo-root . --file-list dispatch-control/tracked-files.nul \
            --candidate-seed-ledger dispatch-control/candidate-seed-ledger.json \
            --allow-self-ledger-json dispatch-control/empty-self-ledger-policy.json \
            --output dispatch-control/tracked-seed-scan.json
          python review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/repository_global_seed_scan.py \
            --repository "$GITHUB_REPOSITORY" --issue-number 60 \
            --candidate-seed-ledger dispatch-control/candidate-seed-ledger.json \
            --current-run-id "$GITHUB_RUN_ID" --audit-mode authorization-recheck \
            --expected-branch-name "$EXPECTED_BRANCH" --expected-repo-head "$GITHUB_SHA" \
            --output dispatch-control/repository-global-seed-scan.json
          python - <<'PY'
          import json
          t=json.load(open('dispatch-control/tracked-seed-scan.json'))
          g=json.load(open('dispatch-control/repository-global-seed-scan.json'))
          if t.get('trackedTreeExternalCollisionCount')!=0: raise SystemExit('tracked candidate-seed collision')
          if g.get('repositoryGlobalCollisionCount',g.get('collisionCount'))!=0: raise SystemExit('repository-global candidate-seed collision')
          PY

      - name: Fresh global ordinal and final live governance review
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_BASE"
          test "$(git ls-remote origin refs/heads/$AUTH_BRANCH | cut -f1)" = "$AUTH_HEAD"
          if git ls-remote --exit-code --heads origin "$DISPATCH_BRANCH" >/dev/null 2>&1; then
            echo 'dispatch branch appeared after global scan' >&2
            exit 1
          fi
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > dispatch-control/final-issue60-pages.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/avps-v2-postconsumption-recovery4-science.yml/runs?event=workflow_dispatch&per_page=100" > dispatch-control/final-science-run-pages.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/$AUTH_PR" > dispatch-control/final-authorization-pr.json
          PYTHONPATH=experiments/aerosol-vertical-profile-sensitivity-v1 python - <<'PY'
          import json,os,re
          from pathlib import Path
          import preauthorization_surface, global_ordinal
          pages=json.load(open('dispatch-control/final-issue60-pages.json'))
          comments=[c for page in pages for c in page]
          bodies=[str(c.get('body') or '').strip() for c in comments]
          if sum(b==os.environ['ALLOCATION_MARKER'] for b in bodies)!=1: raise SystemExit('final allocation marker drift')
          if sum(b.startswith(os.environ['CONSUMED_MARKER']) for b in bodies)!=0: raise SystemExit('ordinal45 consumed during review')
          opens={}
          aliases=('begin','beginComment','begin_comment')
          for c in comments:
              cid=int(c.get('id') or 0); body=str(c.get('body') or '').strip()
              if body.startswith('WRITE_QUIET_BEGIN'):
                  opens[cid]=body
              elif body.startswith('WRITE_QUIET_END'):
                  first=body.splitlines()[0]; vals=[]
                  for key in aliases:
                      vals += re.findall(r'(?<![A-Za-z0-9_])'+re.escape(key)+r'=(\d+)(?![A-Za-z0-9_])',first)
                  if vals:
                      if len(set(vals))!=1: raise SystemExit(f'final conflicting WRITE_QUIET_END aliases at {cid}: {vals}')
                      opens.pop(int(vals[0]),None)
          if opens: raise SystemExit(f'final unmatched WRITE_QUIET_BEGIN: {sorted(opens)}')
          relevant=('AVPS','AEROSOL_VERTICAL_PROFILE','ORDINAL45')
          blockers=('NOT_ADMISSIBLE','DO NOT USE','FAIL-CLOSED','QUARANTINE_DOWNSTREAM=TRUE')
          for c in comments:
              if int(c.get('id') or 0) <= 5493157205: continue
              upper=str(c.get('body') or '').upper()
              if any(x in upper for x in relevant) and any(x in upper for x in blockers):
                  raise SystemExit(f'final newer AVPS fail-closed/quarantine directive: {c.get("id")}')
          sr=json.load(open('dispatch-control/final-science-run-pages.json'))
          runs=[r for page in sr for r in page.get('workflow_runs',[])]
          if runs: raise SystemExit(f'Recovery4 science workflow_dispatch appeared during review: {[r.get("id") for r in runs]}')
          pr=json.load(open('dispatch-control/final-authorization-pr.json'))
          if pr['number']!=774 or pr['state']!='open' or pr['draft'] is not True or pr['merged_at'] is not None or pr['head']['sha']!=os.environ['AUTH_HEAD'] or pr['base']['sha']!=os.environ['AUTH_PARENT']:
              raise SystemExit('final authorization PR drift')
          payload=preauthorization_surface.collect(os.environ['GITHUB_REPOSITORY'],os.environ['GITHUB_TOKEN'])
          latest=preauthorization_surface.latest_consumed_or_dispatched_ordinal(payload)
          observations=global_ordinal.authoritative_global_ordinal_observations(payload,current_run_id=int(os.environ['GITHUB_RUN_ID']))
          ordinals=sorted({int(row['ordinal']) for row in observations})
          if latest!=44: raise SystemExit(f'latest consumed/dispatched global ordinal drift: {latest}')
          if not ordinals or max(ordinals)!=45: raise SystemExit(f'global ordinal surface drift: {ordinals[-10:]}')
          proposal={
            'schemaVersion':1,
            'status':'PASS_AVPS_V2_RECOVERY4_ORDINAL45_DISPATCH_CONSUMPTION_CONTROL_PROPOSAL_ZERO_RUNTIME',
            'scientificOrdinal':45,
            'executionKey':os.environ['EXECUTION_KEY'],
            'authorizationHead':os.environ['AUTH_HEAD'],
            'authorizationParent':os.environ['AUTH_PARENT'],
            'authorizationPr':774,
            'publishedMain':os.environ['EXPECTED_BASE'],
            'dispatchBranch':os.environ['DISPATCH_BRANCH'],
            'candidateSeedCanonicalSha256':os.environ['CANDIDATE_SEED_SHA256'],
            'candidateRowsCanonicalSha256':os.environ['CANDIDATE_ROWS_SHA256'],
            'caseCount':360,
            'commonRandomNumberGroupCount':72,
            'statesPerGroup':5,
            'photonHistoriesPerCase':20000000,
            'latestConsumedOrDispatchedScientificOrdinal':latest,
            'maxObservedScientificOrdinal':max(ordinals),
            'publishedBlobs':{
              os.environ['SCIENCE_WORKFLOW']:os.environ['SCIENCE_WORKFLOW_BLOB'],
              os.environ['RUNTIME_ADAPTER_PATH']:os.environ['RUNTIME_ADAPTER_BLOB'],
              os.environ['EXECUTOR_PATH']:os.environ['EXECUTOR_BLOB'],
              os.environ['AGGREGATOR_PATH']:os.environ['AGGREGATOR_BLOB'],
              os.environ['RUNTIME_CONTRACT_PATH']:os.environ['RUNTIME_CONTRACT_BLOB']},
            'dispatchCreated':False,
            'consumedMarkerCreated':False,
            'workflowDispatchPerformed':False,
            'solverExecutionPerformed':False,
            'resultOpeningAuthorized':False,
            'levelBAdmissionAuthorized':False,
            'holdoutOpened':False,
            'productionAuthorized':False,
            'taylorOrJerusalemUsed':False,
            'newMappingAuthorized':False,
            'requiresSeparateIndependentAcceptance':True,
            'requiresFreshFinalWriteQuietGlobalScanBeforeConsumption':True}
          Path('dispatch-control/dispatch-consumption-control.proposed.json').write_text(json.dumps(proposal,indent=2,sort_keys=True)+'\n')
          receipt=dict(proposal)
          receipt['status']='PASS_AVPS_V2_RECOVERY4_ORDINAL45_DISPATCH_CONSUMPTION_CONTROL_REVIEW_ZERO_RUNTIME'
          receipt['reviewHead']=os.environ['GITHUB_SHA']
          Path('dispatch-control/review-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          test -z "$(git status --porcelain --untracked-files=no)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: avps-v2-recovery4-ordinal45-dispatch-consumption-control-review
          path: |
            changed.txt
            dispatch-control/authorization.json
            dispatch-control/tracked-seed-scan.json
            dispatch-control/repository-global-seed-scan.json
            dispatch-control/dispatch-consumption-control.proposed.json
            dispatch-control/review-receipt.json
          if-no-files-found: error
          compression-level: 0
