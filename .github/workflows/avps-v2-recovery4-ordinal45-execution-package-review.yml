name: Review AVPS Recovery4 ordinal45 execution package

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - authorization/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-ordinal-45
    paths:
      - .github/workflows/avps-v2-recovery4-ordinal45-execution-package-review.yml
      - review/avps-v2-recovery4-ordinal45-execution-package-v1/**

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  zero-runtime-package-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Bind exact reviewed authorization base and additive review scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$BASE_SHA" = 6e095b4b1603c90dcee0943295909b30cd1b374d
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          git diff --name-only "$BASE_SHA"...HEAD | sort > changed.txt
          cat > expected.txt <<'EOF'
          .github/workflows/avps-v2-recovery4-ordinal45-execution-package-review.yml
          review/avps-v2-recovery4-ordinal45-execution-package-v1/PROTOCOL.md
          review/avps-v2-recovery4-ordinal45-execution-package-v1/execution-identity.review.json
          EOF
          sort -o expected.txt expected.txt
          diff -u expected.txt changed.txt
          test "$(git rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-authorization-control-v1/authorization.json)" = 96ee8299d00bd72cdb73de4583670730ce89c73b
          test "$(git rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-seed-global-control-v1/seed_ledger.py)" = 16af5c68ae7e3cfc0cfbef4c8e2022517bf2ae91
          test "$(git rev-parse HEAD:.github/recovery-templates/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-successor-infrastructure-v1/generate.py)" = 052c9851a96f9c6cfe9aca2516e2ff6b5d09275a

      - name: Generate exact Recovery4 ordinal45 candidate package without science
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile .github/recovery-templates/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-successor-infrastructure-v1/generate.py
          python .github/recovery-templates/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-successor-infrastructure-v1/generate.py \
            --identity review/avps-v2-recovery4-ordinal45-execution-package-v1/execution-identity.review.json \
            --output generated-package
          python -m py_compile \
            generated-package/runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py \
            generated-package/runtime-avps-v2-recovery4-ordinal45-v1/executor.py \
            generated-package/runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py

      - name: Verify generated package identity, corrected routing and closed boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.load(open('generated-package/manifest.json'))
          required={
            'status':'GENERATED_AVPS_V2_RECOVERY4_SUCCESSOR_INFRASTRUCTURE_ZERO_RUNTIME_RESULTS_CLOSED',
            'scientificOrdinal':45,
            'syntheticReviewOnly':False,
            'stageId':'aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4',
            'candidateSeedCanonicalSha256':'ddded6b2d170ca2fac8d498bdba2887446c16995df0880d948fb2be00870b3de',
            'candidateRowsCanonicalSha256':'c439de417520b330c037e2628df02b6955f652563300aa5ef30477abf7661a98',
            'caseCount':360,'groupCount':72,'statesPerGroup':5,'photonHistoriesPerCase':20_000_000,
            'matrixUsesGeneratedRecoveryAdapter':True,
            'caseUsesGeneratedRecoveryExecutor':True,
            'closedAggregateUsesGeneratedRecoveryAggregator':True,
            'frozenScienceChanged':False,'dispatchCreated':False,'scientificRuntime':False,'solverExecution':False,
            'resultsOpened':False,'levelBOpeningAuthorized':False,'protectedHoldoutOpeningAuthorized':False,
            'productionAuthorized':False,'taylorOrJerusalemUsed':False,'newMappingAuthorized':False,
          }
          for k,v in required.items():
              if m.get(k)!=v: raise SystemExit(f'manifest drift {k}: {m.get(k)!r} != {v!r}')
          expected={
            'avps-v2-postconsumption-recovery4-science.yml',
            'runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py',
            'runtime-avps-v2-recovery4-ordinal45-v1/executor.py',
            'runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py',
            'runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json',
          }
          if set(m.get('outputs',{}))!=expected: raise SystemExit('generated output path set drift')
          wf=Path('generated-package/avps-v2-postconsumption-recovery4-science.yml').read_text()
          for token in (
            'authorization/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-ordinal-45',
            'dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-ordinal-45',
            'aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4:numerical:45',
            '6e095b4b1603c90dcee0943295909b30cd1b374d',
            '33368601918','9749469156',
            'ddded6b2d170ca2fac8d498bdba2887446c16995df0880d948fb2be00870b3de',
            'runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py',
            'runtime-avps-v2-recovery4-ordinal45-v1/executor.py',
            'runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py',
            'snapshot-fence-release:',
            'needs: [preflight, snapshot-fence-release]',
          ):
              if token not in wf: raise SystemExit(f'generated workflow missing required token: {token}')
          if wf.count('needs: [preflight, snapshot-fence-release]') != 4:
              raise SystemExit('every one of the four solver-bearing case shards must depend on the fence-release barrier')
          for forbidden in (
            'aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3:numerical:44',
            'dd3a4c692af505389e9feb1e5f5480fa389110a3',
            'dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-ordinal-44',
            'PYTHONPATH=review/aerosol-vertical-profile-sensitivity-v2-executor-parity-v1',
            'PYTHONPATH=review/aerosol-vertical-profile-sensitivity-v2-aggregator-parity-v1',
            "Path('review/aerosol-vertical-profile-sensitivity-v2-control-v1/adapter.py')",
          ):
              if forbidden in wf: raise SystemExit(f'generated workflow retained forbidden old routing token: {forbidden}')
          PY

      - name: Prove this review cannot dispatch or execute solver science
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/avps-v2-recovery4-ordinal45-execution-package-review.yml').read_text()
          forbidden=('workflow_'+'dispatch:','setup-'+'micromamba','command -v '+'uvspec','rte_solver '+'mystic','mc_photons '+'20000000')
          for token in forbidden:
              if token in p: raise SystemExit(f'review workflow contains scientific-runtime token: {token}')
          PY
          test -z "$(git status --porcelain --untracked-files=no)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: avps-v2-recovery4-ordinal45-generated-execution-package-review
          path: |
            changed.txt
            review/avps-v2-recovery4-ordinal45-execution-package-v1/
            generated-package/
          if-no-files-found: error
          compression-level: 0
