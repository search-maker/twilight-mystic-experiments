name: Review AVPS Recovery4 ordinal45 execution publisher

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery4-ordinal45-execution-publisher-v1.yml
      - .github/workflows/avps-v2-recovery4-ordinal45-execution-publication-review.yml
      - review/avps-v2-recovery4-ordinal45-execution-publication-gate-v1/PROTOCOL.md

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  zero-runtime-publication-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact additive review scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          git diff --name-only "$BASE_SHA"...HEAD | sort > changed.txt
          cat > expected.txt <<'EOF'
          .github/workflows/avps-v2-recovery4-ordinal45-execution-publication-review.yml
          .github/workflows/avps-v2-recovery4-ordinal45-execution-publisher-v1.yml
          review/avps-v2-recovery4-ordinal45-execution-publication-gate-v1/PROTOCOL.md
          EOF
          sort -o expected.txt expected.txt
          diff -u expected.txt changed.txt
          git diff --check "$BASE_SHA"...HEAD

      - name: Verify exact source artifact and generated-byte bindings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/avps-v2-recovery4-ordinal45-execution-publisher-v1.yml').read_text()
          required=(
            "SOURCE_REVIEW_RUN: '33372058737'",
            'SOURCE_REVIEW_HEAD: eb0ff26cbea7485ace9fe9bf6b1cc1a3c9d60489',
            "SOURCE_ARTIFACT_ID: '9750420831'",
            'SOURCE_ARTIFACT_DIGEST: sha256:f1c37d44636797ebcffa5eafe467ded0b9243e5b2e9fdbe66f7fd995986d75dd',
            '24290edce579b5cf1774cee61d2c7a4433f730f18c9c99d2e2144efedf163b1f',
            'e0c95d9ca15a78868bef13cb8375460de156075c07647298a2ad355c32d6d3ed',
            '37f1f52fa2381c3bc40580ffc16f45efd8503d9242c22d2d72eb28a27c3882f5',
            '3287fb59344c223eb871befb05bef141fe79c74fec45f096c29a4c05e29845c2',
            '3a3e09f1a9dda5435e455fbc9a508a924c080f7f265cdd7c29de912449bacc93',
            '6e095b4b1603c90dcee0943295909b30cd1b374d',
            'publication-trigger/aerosol-vertical-profile-sensitivity-v2-recovery4-ordinal45-v1',
            'review/avps-v2-recovery4-ordinal45-execution-publication-v1',
            "if: github.event.created == false && github.event.deleted == false",
            "changed != [p]",
            "parent!=main",
            "PUBLICATION_BRANCH",
            "gh pr create --base main",
          )
          for token in required:
              if token not in p: raise SystemExit(f'publisher missing required contract token: {token}')
          forbidden=(
            'command -v uvspec','rte_solver mystic','mc_photons 20000000',
            'dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-ordinal-45',
            'ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_DISPATCH_CONSUMED',
          )
          for token in forbidden:
              if token in p: raise SystemExit(f'publisher must remain science-free: {token}')
          if p.count('git push origin "$PUBLICATION_BRANCH"') != 1: raise SystemExit('publication branch push count drift')
          if p.count('gh pr create --base main') != 1: raise SystemExit('publication PR create count drift')
          PY

      - name: Verify publisher outputs only reviewed bytes plus receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/avps-v2-recovery4-ordinal45-execution-publisher-v1.yml').read_text()
          required_copies=(
            'cp reviewed/generated-package/avps-v2-postconsumption-recovery4-science.yml .github/workflows/avps-v2-postconsumption-recovery4-science.yml',
            'cp reviewed/generated-package/runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py',
            'cp reviewed/generated-package/runtime-avps-v2-recovery4-ordinal45-v1/executor.py runtime-avps-v2-recovery4-ordinal45-v1/executor.py',
            'cp reviewed/generated-package/runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py',
            'cp reviewed/generated-package/runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json',
            "test \"$(git diff --cached --name-only | wc -l)\" = 6",
          )
          for token in required_copies:
              if token not in p: raise SystemExit(f'publication copy contract drift: {token}')
          for closed in ('dispatchCreated\':False','solverExecution\':False','resultsOpened\':False','levelBOpeningAuthorized\':False','protectedHoldoutOpeningAuthorized\':False','productionAuthorized\':False','taylorOrJerusalemUsed\':False','newMappingAuthorized\':False'):
              if closed not in p: raise SystemExit(f'publication receipt missing closed boundary: {closed}')
          PY

      - name: Prove review has no publisher activation or science runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          r=Path('.github/workflows/avps-v2-recovery4-ordinal45-execution-publication-review.yml').read_text()
          for token in ('workflow_'+'dispatch:','git push origin "$PUBLICATION_BRANCH"','gh pr create --base main','command -v '+'uvspec','rte_solver '+'mystic'):
              if token in r: raise SystemExit(f'review workflow may not publish or execute science: {token}')
          PY
