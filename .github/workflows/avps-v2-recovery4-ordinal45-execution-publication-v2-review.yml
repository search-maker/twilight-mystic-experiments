name: Review corrected AVPS Recovery4 ordinal45 publication v2

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery4-ordinal45-execution-publication-v2-review.yml
      - .github/workflows/avps-v2-postconsumption-recovery4-science.yml
      - runtime-avps-v2-recovery4-ordinal45-v1/**

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

jobs:
  corrected-zero-runtime-publication-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SELF_PATH: .github/workflows/avps-v2-recovery4-ordinal45-execution-publication-v2-review.yml
      INFRA_BRANCH: review/avps-v2-recovery4-ordinal45-publication-review-v2-infrastructure-v2
      INFRA_BASE: 89d1ca09cfbd8a448d8b64bbef7c2451a7daa963
      PUBLICATION_BRANCH: review/avps-v2-recovery4-ordinal45-execution-publication-v2
      PUBLICATION_HEAD: fe9d2ffdfc44ba37b9a57f817f97adf5ade99b3c
      PUBLICATION_PARENT: 89d1ca09cfbd8a448d8b64bbef7c2451a7daa963
      SOURCE_REVIEW_PR: '777'
      SOURCE_REVIEW_HEAD: b5a68159aa09bb3f91cb050a7e1bb266f866c9f4
      SOURCE_REVIEW_RUN: '33377879606'
      SOURCE_REVIEW_ARTIFACT: '9752564112'
      SOURCE_REVIEW_DIGEST: sha256:e5ed2a26e917f3ee095c749d107c0ad16ac31c3ac9513da6717a5e66965557b5
      SOURCE_ACCEPTANCE_REVIEW: '5065401797'
      AUTH_BRANCH: authorization/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-ordinal-45
      AUTH_HEAD: 6e095b4b1603c90dcee0943295909b30cd1b374d
      AUTH_PARENT: 5685d5c313071014a94c816ee26b129f1f17a7fc
      AUTH_PR: '774'
      AUTH_PATH: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-authorization-control-v1/authorization.json
      AUTH_BLOB: 96ee8299d00bd72cdb73de4583670730ce89c73b
      ALLOCATION_MARKER: ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_AUTHORIZATION_ALLOCATED_REVIEWED_NOT_DISPATCHED commit=6e095b4b1603c90dcee0943295909b30cd1b374d parent=5685d5c313071014a94c816ee26b129f1f17a7fc pr=774
      CONSUMED_PREFIX: ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_DISPATCH_CONSUMED
      DISPATCH_BRANCH: dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-ordinal-45
      CANDIDATE_SEED_SHA256: ddded6b2d170ca2fac8d498bdba2887446c16995df0880d948fb2be00870b3de
      CANDIDATE_ROWS_SHA256: c439de417520b330c037e2628df02b6955f652563300aa5ef30477abf7661a98
      EXPECTED_WORKFLOW_BLOB: df0763b61ce89063de6992bb984dc854024a1aad
      EXPECTED_ADAPTER_BLOB: e4b690c2969fd01ecde5b08f554e47ad50b40914
      EXPECTED_EXECUTOR_BLOB: 7dc38e31c19701b1a1ceef300d75105cff179290
      EXPECTED_AGGREGATOR_BLOB: 6afc8b0d21c2b5553c251dc9ca5524c795ed2646
      EXPECTED_CONTRACT_BLOB: 2d5f71d80b5e573b86775c2806b80dcc1fbe02f4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Bind exact review identity and mode
        shell: bash
        env:
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$EVENT_BASE_REF" = main
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          if [ "$EVENT_BRANCH" = "$INFRA_BRANCH" ]; then
            MODE=infrastructure
            test "$EVENT_BASE" = "$INFRA_BASE"
            mapfile -t PARENTS < <(git cat-file -p HEAD | sed -n 's/^parent //p')
            test "${#PARENTS[@]}" = 1
            test "${PARENTS[0]}" = "$INFRA_BASE"
            git diff --name-only "$INFRA_BASE"...HEAD | sort > changed.txt
            printf '%s\n' "$SELF_PATH" > expected.txt
            diff -u expected.txt changed.txt
          elif [ "$EVENT_BRANCH" = "$PUBLICATION_BRANCH" ]; then
            MODE=publication
            test "$EVENT_HEAD" = "$PUBLICATION_HEAD"
            mapfile -t PARENTS < <(git cat-file -p HEAD | sed -n 's/^parent //p')
            test "${#PARENTS[@]}" = 1
            test "${PARENTS[0]}" = "$PUBLICATION_PARENT"
            git merge-base --is-ancestor "$PUBLICATION_PARENT" "$EVENT_BASE"
            git diff --name-only "$PUBLICATION_PARENT"...HEAD | sort > changed.txt
            cat > expected.txt <<'EOF'
          .github/workflows/avps-v2-postconsumption-recovery4-science.yml
          runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py
          runtime-avps-v2-recovery4-ordinal45-v1/executor.py
          runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py
          runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json
          EOF
            sort -o expected.txt expected.txt
            diff -u expected.txt changed.txt
          else
            echo "unexpected head branch: $EVENT_BRANCH" >&2
            exit 1
          fi
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          echo "EVENT_BASE=$EVENT_BASE" >> "$GITHUB_ENV"

      - name: Prove corrected review workflow contains no stale admissibility path
        shell: bash
        run: |
          set -euo pipefail
          if [ "$MODE" = infrastructure ]; then
            cp "$SELF_PATH" review-self.yml
          else
            git show "$EVENT_BASE:$SELF_PATH" > review-self.yml
          fi
          python - <<'PY'
          from pathlib import Path
          p=Path('review-self.yml').read_text()
          required=(
            'b5a68159aa09bb3f91cb050a7e1bb266f866c9f4',
            '33377879606','9752564112',
            'sha256:e5ed2a26e917f3ee095c749d107c0ad16ac31c3ac9513da6717a5e66965557b5',
            'review/avps-v2-recovery4-ordinal45-execution-publication-v2',
            'df0763b61ce89063de6992bb984dc854024a1aad',
            'e4b690c2969fd01ecde5b08f554e47ad50b40914',
            '7dc38e31c19701b1a1ceef300d75105cff179290',
            '6afc8b0d21c2b5553c251dc9ca5524c795ed2646',
            '2d5f71d80b5e573b86775c2806b80dcc1fbe02f4',
          )
          for t in required:
              if t not in p: raise SystemExit(f'corrected review missing binding: {t}')
          stale=(
            'eb0ff26'+'cbea7485ace9fe9bf6b1cc1a3c9d60489',
            '33372'+'058737','97504'+'20831',
            'sha256:f1c37d44636797ebcffa5eafe467ded0'+'b9243e5b2e9fdbe66f7fd995986d75dd',
            'b620f9e554378ec363ec1cc3da860432'+'b7615218',
          )
          for t in stale:
              if t in p: raise SystemExit(f'stale publication-review binding retained: {t}')
          runtime_tokens=('setup-'+'micromamba','command -v '+'uvspec','rte_solver '+'mystic','mc_'+'photons 20000000')
          for t in runtime_tokens:
              if t in p: raise SystemExit(f'review workflow contains scientific runtime token: {t}')
          PY

      - name: Bind immutable authorization, corrected source and live governance
        if: env.MODE == 'publication'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/$AUTH_BRANCH:refs/remotes/origin/$AUTH_BRANCH"
          test "$(git rev-parse origin/$AUTH_BRANCH)" = "$AUTH_HEAD"
          mapfile -t AP < <(git cat-file -p "$AUTH_HEAD" | sed -n 's/^parent //p')
          test "${#AP[@]}" = 1
          test "${AP[0]}" = "$AUTH_PARENT"
          test "$(git rev-parse "$AUTH_HEAD:$AUTH_PATH")" = "$AUTH_BLOB"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$AUTH_PR" > authorization-pr.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/$SOURCE_REVIEW_PR" > source-review-pr.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_REVIEW_RUN" > source-review-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_REVIEW_ARTIFACT" > source-review-artifact-metadata.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > issue60-pages.json
          python - <<'PY'
          import json,os
          ap=json.load(open('authorization-pr.json'))
          if ap['number']!=774 or ap['state']!='open' or ap['draft'] is not True or ap['merged_at'] is not None: raise SystemExit('authorization PR state drift')
          if ap['head']['sha']!=os.environ['AUTH_HEAD'] or ap['base']['sha']!=os.environ['AUTH_PARENT']: raise SystemExit('authorization PR identity drift')
          sp=json.load(open('source-review-pr.json'))
          if sp['number']!=777 or sp['state']!='open' or sp['draft'] is not True or sp['merged_at'] is not None: raise SystemExit('corrected source PR state drift')
          if sp['head']['sha']!=os.environ['SOURCE_REVIEW_HEAD']: raise SystemExit('corrected source head drift')
          sr=json.load(open('source-review-run.json'))
          if sr['id']!=int(os.environ['SOURCE_REVIEW_RUN']) or sr['head_sha']!=os.environ['SOURCE_REVIEW_HEAD'] or sr['run_attempt']!=1 or sr['status']!='completed' or sr['conclusion']!='success': raise SystemExit('corrected source review run drift')
          a=json.load(open('source-review-artifact-metadata.json'))
          if a['id']!=int(os.environ['SOURCE_REVIEW_ARTIFACT']) or a.get('digest')!=os.environ['SOURCE_REVIEW_DIGEST'] or a.get('expired'): raise SystemExit('corrected source artifact drift')
          if a.get('workflow_run',{}).get('id')!=int(os.environ['SOURCE_REVIEW_RUN']) or a.get('workflow_run',{}).get('head_sha')!=os.environ['SOURCE_REVIEW_HEAD']: raise SystemExit('source artifact/run binding drift')
          pages=json.load(open('issue60-pages.json')); comments=[c for page in pages for c in page]
          bodies=[str(c.get('body') or '').strip() for c in comments]
          if sum(b==os.environ['ALLOCATION_MARKER'] for b in bodies)!=1: raise SystemExit('allocation marker cardinality drift')
          if any(b.startswith(os.environ['CONSUMED_PREFIX']) for b in bodies): raise SystemExit('ordinal45 already consumed')
          if not any(os.environ['SOURCE_ACCEPTANCE_REVIEW'] in b and os.environ['SOURCE_REVIEW_HEAD'] in b for b in bodies): raise SystemExit('independent corrected-source acceptance not found in Issue #60 evidence')
          def fields(first):
              out={}
              for token in first.replace('|',' ').split():
                  if '=' in token:
                      k,v=token.split('=',1); out[k]=v
              return out
          closed=set(); begins=[]
          for c in comments:
              body=str(c.get('body') or '').strip(); first=body.splitlines()[0] if body else ''
              f=fields(first)
              if first.startswith('WRITE_QUIET_END'):
                  vals=[]
                  for key in ('begin','beginComment','begin_comment'):
                      v=f.get(key,'')
                      if v.isdigit(): vals.append(int(v))
                  if vals:
                      if len(set(vals))!=1: raise SystemExit(f'conflicting WRITE_QUIET_END begin ids: {vals}')
                      closed.add(vals[0])
              if first.startswith('WRITE_QUIET_BEGIN'): begins.append(int(c['id']))
          unmatched=[x for x in begins if x not in closed]
          if unmatched: raise SystemExit(f'unmatched WRITE_QUIET_BEGIN present: {unmatched}')
          PY
          if git ls-remote --exit-code origin "refs/heads/$DISPATCH_BRANCH" >/dev/null 2>&1; then
            echo 'dispatch branch already exists' >&2
            exit 1
          fi

      - name: Download exact corrected generated-package artifact
        if: env.MODE == 'publication'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 9752564112
          path: corrected-source-artifact
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33377879606

      - name: Verify corrected artifact and exact five publication bytes
        if: env.MODE == 'publication'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path('corrected-source-artifact/generated-package')
          m=json.load(open(root/'manifest.json'))
          required={
            'status':'GENERATED_AVPS_V2_RECOVERY4_SUCCESSOR_INFRASTRUCTURE_ZERO_RUNTIME_RESULTS_CLOSED',
            'scientificOrdinal':45,
            'candidateSeedCanonicalSha256':os.environ['CANDIDATE_SEED_SHA256'],
            'candidateRowsCanonicalSha256':os.environ['CANDIDATE_ROWS_SHA256'],
            'caseCount':360,'groupCount':72,'statesPerGroup':5,'photonHistoriesPerCase':20_000_000,
            'matrixUsesGeneratedRecoveryAdapter':True,'caseUsesGeneratedRecoveryExecutor':True,'closedAggregateUsesGeneratedRecoveryAggregator':True,
            'temporalFencePreScanBindingCorrected':True,'preScanFenceBindingRequired':True,
            'snapshotReleaseUsesPreflightBoundBeginOnly':True,'independentLateBeginSearchRemoved':True,
            'frozenScienceChanged':False,'dispatchCreated':False,'scientificRuntime':False,'solverExecution':False,
            'resultsOpened':False,'levelBOpeningAuthorized':False,'protectedHoldoutOpeningAuthorized':False,
            'productionAuthorized':False,'taylorOrJerusalemUsed':False,'newMappingAuthorized':False,
          }
          for k,v in required.items():
              if m.get(k)!=v: raise SystemExit(f'corrected source manifest drift {k}: {m.get(k)!r} != {v!r}')
          expected={
            'avps-v2-postconsumption-recovery4-science.yml':os.environ['EXPECTED_WORKFLOW_BLOB'],
            'runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py':os.environ['EXPECTED_ADAPTER_BLOB'],
            'runtime-avps-v2-recovery4-ordinal45-v1/executor.py':os.environ['EXPECTED_EXECUTOR_BLOB'],
            'runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py':os.environ['EXPECTED_AGGREGATOR_BLOB'],
            'runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json':os.environ['EXPECTED_CONTRACT_BLOB'],
          }
          if set(m.get('outputs',{}))!=set(expected): raise SystemExit('corrected source output set drift')
          mapping={
            '.github/workflows/avps-v2-postconsumption-recovery4-science.yml':'avps-v2-postconsumption-recovery4-science.yml',
            'runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py':'runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py',
            'runtime-avps-v2-recovery4-ordinal45-v1/executor.py':'runtime-avps-v2-recovery4-ordinal45-v1/executor.py',
            'runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py':'runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py',
            'runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json':'runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json',
          }
          for dst,src in mapping.items():
              f=root/src; b=f.read_bytes()
              got_blob=subprocess.check_output(['git','hash-object',str(f)],text=True).strip()
              if got_blob!=expected[src]: raise SystemExit(f'corrected artifact git blob drift: {src}')
              out=m['outputs'][src]
              if out.get('gitBlobSha1')!=expected[src] or out.get('sha256')!=hashlib.sha256(b).hexdigest(): raise SystemExit(f'corrected artifact manifest identity drift: {src}')
              if Path(dst).read_bytes()!=b: raise SystemExit(f'published byte mismatch: {dst}')
              if subprocess.check_output(['git','hash-object',dst],text=True).strip()!=expected[src]: raise SystemExit(f'published git blob drift: {dst}')
          PY

      - name: Verify corrected science choreography remains closed before dispatch
        if: env.MODE == 'publication'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/avps-v2-postconsumption-recovery4-science.yml').read_text()
          required=(
            'workflow_'+'dispatch:',
            'AUTH_HEAD: 6e095b4b1603c90dcee0943295909b30cd1b374d',
            'DISPATCH_BRANCH: dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-ordinal-45',
            'EXECUTION_KEY: aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4:numerical:45',
            'pre-scan-fence-binding.json','repository-global-seed-scan-started-at.txt',
            'writeQuietBeginCommentId','writeQuietFenceToken',
            'preSolverWriteQuietBoundBeforeGlobalScan','releaseMustUsePreflightBoundBeginOnly',
            'snapshot-fence-release:','needs: [preflight, snapshot-fence-release]',
            'Results remain closed. No primary interpretation or Level-B execution is authorized by this artifact.',
          )
          for t in required:
              if t not in p: raise SystemExit(f'corrected science invariant missing: {t}')
          if p.count('needs: [preflight, snapshot-fence-release]')!=4: raise SystemExit('all four solver shards must depend on fence release')
          bind_idx=p.index('pre-scan-fence-binding.json'); scan_idx=p.index('repository_global_seed_scan.py')
          if bind_idx>=scan_idx: raise SystemExit('pre-scan WRITE_QUIET binding is not before global scan')
          snap=p[p.index('  snapshot-fence-release:\n'):p.index('  cases-dep2:\n')]
          if 'WRITE_QUIET_BEGIN' in snap: raise SystemExit('release stage retained independent late BEGIN search')
          for stale in ('aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3:numerical:44','dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery3-ordinal-44'):
              if stale in p: raise SystemExit(f'old recovery routing retained: {stale}')
          PY

      - name: Write corrected zero-runtime review receipt
        shell: bash
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          out={
            'schemaVersion':1,
            'status':'PASS_AVPS_RECOVERY4_ORDINAL45_PUBLICATION_V2_CORRECTED_REVIEW_ZERO_RUNTIME',
            'mode':os.environ['MODE'],
            'headSha':os.environ['EVENT_HEAD'],
            'headBranch':os.environ['EVENT_BRANCH'],
            'sourceHead':os.environ['SOURCE_REVIEW_HEAD'],
            'sourceRun':int(os.environ['SOURCE_REVIEW_RUN']),
            'sourceArtifact':int(os.environ['SOURCE_REVIEW_ARTIFACT']),
            'sourceDigest':os.environ['SOURCE_REVIEW_DIGEST'],
            'authorizationHead':os.environ['AUTH_HEAD'],
            'scientificOrdinal':45,
            'dispatchCreated':False,'seedConsumption':False,'scientificRuntime':False,'solver':False,
            'results':False,'levelB':False,'holdout':False,'production':False,
            'taylorOrJerusalemUsed':False,'newMappingAuthorized':False,
          }
          Path('review-receipt.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
          test -z "$(git status --porcelain --untracked-files=no)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: avps-recovery4-ordinal45-publication-v2-corrected-review
          path: |
            changed.txt
            expected.txt
            review-receipt.json
          if-no-files-found: error
          compression-level: 0
