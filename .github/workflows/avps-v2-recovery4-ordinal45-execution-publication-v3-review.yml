name: Review AVPS Recovery4 ordinal45 corrected publication v3

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery4-ordinal45-execution-publication-v3-review.yml
      - .github/workflows/avps-v2-postconsumption-recovery4-science.yml
      - runtime-avps-v2-recovery4-ordinal45-v1/**

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

jobs:
  zero-runtime-publication-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SELF_PATH: .github/workflows/avps-v2-recovery4-ordinal45-execution-publication-v3-review.yml
      INFRA_BRANCH: review/avps-v2-recovery4-ordinal45-publication-review-v3-infrastructure-v1
      INFRA_BASE: b86c2142253c31dec3415bd1426210b1e73512f9
      PUBLICATION_BRANCH: review/avps-v2-recovery4-ordinal45-execution-publication-v3
      PUBLICATION_PARENT: b86c2142253c31dec3415bd1426210b1e73512f9
      SOURCE_CORRECTION_PR: '798'
      SOURCE_CORRECTION_HEAD: c0910978a6d9ca754695a6289a9cc3021d2d4db7
      SOURCE_CORRECTION_RUN: '33425490171'
      SOURCE_CORRECTION_ARTIFACT: '9770550740'
      SOURCE_CORRECTION_ARTIFACT_NAME: avps-v2-recovery4-ordinal45-durable-end-source-correction-v4
      SOURCE_CORRECTION_DIGEST: sha256:cc5eedecc5b23d8ca484830f6b0a7f04f35aa3ddc773ffdc9309197a5670c4ca
      SOURCE_CORRECTION_ACCEPTANCE_REVIEW: '5069881778'
      AUTH_PR: '774'
      AUTH_HEAD: 6e095b4b1603c90dcee0943295909b30cd1b374d
      AUTH_PARENT: 5685d5c313071014a94c816ee26b129f1f17a7fc
      AUTH_BRANCH: authorization/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-ordinal-45
      DISPATCH_BRANCH: dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-ordinal-45
      ALLOCATION_MARKER: ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_AUTHORIZATION_ALLOCATED_REVIEWED_NOT_DISPATCHED commit=6e095b4b1603c90dcee0943295909b30cd1b374d parent=5685d5c313071014a94c816ee26b129f1f17a7fc pr=774
      CONSUMED_PREFIX: ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_DISPATCH_CONSUMED
      EXPECTED_WORKFLOW_BLOB: 2d210b3a161f6889352d600fb9222c974e728034
      EXPECTED_ADAPTER_BLOB: e4b690c2969fd01ecde5b08f554e47ad50b40914
      EXPECTED_EXECUTOR_BLOB: 7dc38e31c19701b1a1ceef300d75105cff179290
      EXPECTED_AGGREGATOR_BLOB: 6afc8b0d21c2b5553c251dc9ca5524c795ed2646
      EXPECTED_CONTRACT_BLOB: 2d5f71d80b5e573b86775c2806b80dcc1fbe02f4
      EXPECTED_WORKFLOW_SHA256: fb9c499380af491a15d3a40d14e5bc36cf581b4679d8d046023d9a272d492fb9
      EXPECTED_ADAPTER_SHA256: e0c95d9ca15a78868bef13cb8375460de156075c07647298a2ad355c32d6d3ed
      EXPECTED_EXECUTOR_SHA256: 37f1f52fa2381c3bc40580ffc16f45efd8503d9242c22d2d72eb28a27c3882f5
      EXPECTED_AGGREGATOR_SHA256: 3287fb59344c223eb871befb05bef141fe79c74fec45f096c29a4c05e29845c2
      EXPECTED_CONTRACT_SHA256: 3a3e09f1a9dda5435e455fbc9a508a924c080f7f265cdd7c29de912449bacc93
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Bind exact review mode and path scope
        shell: bash
        env:
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$EVENT_BASE_REF" = main
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          mapfile -t PARENTS < <(git cat-file -p HEAD | sed -n 's/^parent //p')
          test "${#PARENTS[@]}" = 1
          if [ "$EVENT_BRANCH" = "$INFRA_BRANCH" ]; then
            MODE=infrastructure
            test "$EVENT_BASE" = "$INFRA_BASE"
            test "${PARENTS[0]}" = "$INFRA_BASE"
            git diff --name-only "$INFRA_BASE"...HEAD | sort > changed.txt
            printf '%s\n' "$SELF_PATH" > expected.txt
          elif [ "$EVENT_BRANCH" = "$PUBLICATION_BRANCH" ]; then
            MODE=publication
            test "${PARENTS[0]}" = "$PUBLICATION_PARENT"
            git merge-base --is-ancestor "$PUBLICATION_PARENT" "$EVENT_BASE"
            git diff --name-only "$PUBLICATION_PARENT"...HEAD | sort > changed.txt
            cat > expected.txt <<'EOF'
.github/workflows/avps-v2-postconsumption-recovery4-science.yml
runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py
runtime-avps-v2-recovery4-ordinal45-v1/executor.py
runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py
runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json
EOF
            sort -o expected.txt expected.txt
          else
            echo "unexpected review branch: $EVENT_BRANCH" >&2
            exit 1
          fi
          diff -u expected.txt changed.txt
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          echo "EVENT_HEAD=$EVENT_HEAD" >> "$GITHUB_ENV"
          echo "EVENT_BASE=$EVENT_BASE" >> "$GITHUB_ENV"

      - name: Prove review workflow is zero-runtime and fail-closed
        shell: bash
        run: |
          set -euo pipefail
          if [ "$MODE" = infrastructure ]; then cp "$SELF_PATH" review-self.yml; else git show "$EVENT_BASE:$SELF_PATH" > review-self.yml; fi
          python - <<'PY'
          from pathlib import Path
          p=Path('review-self.yml').read_text()
          forbidden=[
              'uv'+'spec',
              'micro'+'mamba',
              'setup-'+'micro'+'mamba',
              'workflow_'+'dispatch:',
              'ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_DISPATCH_'+'CONSUMED commit=',
          ]
          for token in forbidden:
              if token in p: raise SystemExit(f'zero-runtime review contains forbidden token: {token}')
          required=['SOURCE_CORRECTION_ARTIFACT: \'9770550740\'','EXPECTED_WORKFLOW_BLOB: 2d210b3a161f6889352d600fb9222c974e728034','beginComment','begin_comment']
          for token in required:
              if token not in p: raise SystemExit(f'missing exact review binding: {token}')
          PY

      - name: Verify exact publication bytes
        if: env.MODE == 'publication'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:.github/workflows/avps-v2-postconsumption-recovery4-science.yml)" = "$EXPECTED_WORKFLOW_BLOB"
          test "$(git rev-parse HEAD:runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py)" = "$EXPECTED_ADAPTER_BLOB"
          test "$(git rev-parse HEAD:runtime-avps-v2-recovery4-ordinal45-v1/executor.py)" = "$EXPECTED_EXECUTOR_BLOB"
          test "$(git rev-parse HEAD:runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py)" = "$EXPECTED_AGGREGATOR_BLOB"
          test "$(git rev-parse HEAD:runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json)" = "$EXPECTED_CONTRACT_BLOB"
          printf '%s  %s\n' "$EXPECTED_WORKFLOW_SHA256" .github/workflows/avps-v2-postconsumption-recovery4-science.yml | sha256sum -c -
          printf '%s  %s\n' "$EXPECTED_ADAPTER_SHA256" runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py | sha256sum -c -
          printf '%s  %s\n' "$EXPECTED_EXECUTOR_SHA256" runtime-avps-v2-recovery4-ordinal45-v1/executor.py | sha256sum -c -
          printf '%s  %s\n' "$EXPECTED_AGGREGATOR_SHA256" runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py | sha256sum -c -
          printf '%s  %s\n' "$EXPECTED_CONTRACT_SHA256" runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json | sha256sum -c -

      - name: Bind accepted V4 source artifact byte-for-byte
        if: env.MODE == 'publication'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p accepted-source
          gh api "repos/$GITHUB_REPOSITORY/pulls/$SOURCE_CORRECTION_PR" > source-pr.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_CORRECTION_RUN" > source-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_CORRECTION_ARTIFACT" > source-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/$SOURCE_CORRECTION_PR/reviews/$SOURCE_CORRECTION_ACCEPTANCE_REVIEW" > source-acceptance.json
          gh run download "$SOURCE_CORRECTION_RUN" -n "$SOURCE_CORRECTION_ARTIFACT_NAME" -D accepted-source
          python - <<'PY'
          import json, os
          p=json.load(open('source-pr.json')); r=json.load(open('source-run.json')); a=json.load(open('source-artifact.json')); v=json.load(open('source-acceptance.json'))
          if p['head']['sha']!=os.environ['SOURCE_CORRECTION_HEAD'] or p['merged_at'] is not None: raise SystemExit('source correction PR identity drift')
          if r['id']!=int(os.environ['SOURCE_CORRECTION_RUN']) or r['head_sha']!=os.environ['SOURCE_CORRECTION_HEAD'] or r['run_attempt']!=1 or r['status']!='completed' or r['conclusion']!='success': raise SystemExit('source correction run drift')
          if a['id']!=int(os.environ['SOURCE_CORRECTION_ARTIFACT']) or a.get('digest')!=os.environ['SOURCE_CORRECTION_DIGEST'] or a.get('expired'): raise SystemExit('source correction artifact drift')
          body=str(v.get('body') or '')
          if v.get('id')!=int(os.environ['SOURCE_CORRECTION_ACCEPTANCE_REVIEW']) or 'INDEPENDENT_AUDIT::ACCEPT_AVPS_ORDINAL45_DURABLE_END_SOURCE_CORRECTION_V4' not in body: raise SystemExit('independent source acceptance drift')
          PY
          test -f accepted-source/publication-payload/avps-v2-postconsumption-recovery4-science.yml
          cmp accepted-source/publication-payload/avps-v2-postconsumption-recovery4-science.yml .github/workflows/avps-v2-postconsumption-recovery4-science.yml
          cmp accepted-source/publication-payload/runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py
          cmp accepted-source/publication-payload/runtime-avps-v2-recovery4-ordinal45-v1/executor.py runtime-avps-v2-recovery4-ordinal45-v1/executor.py
          cmp accepted-source/publication-payload/runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py
          cmp accepted-source/publication-payload/runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json

      - name: Recheck authorization, allocation, no-consumption, and no active fence
        if: env.MODE == 'publication'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$AUTH_PR" > auth-pr.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > issue60-pages.json
          python - <<'PY'
          import json, os
          p=json.load(open('auth-pr.json'))
          if p['state']!='open' or p['draft'] is not True or p['merged_at'] is not None or p['head']['sha']!=os.environ['AUTH_HEAD'] or p['base']['sha']!=os.environ['AUTH_PARENT']: raise SystemExit('authorization identity/state drift')
          pages=json.load(open('issue60-pages.json')); comments=[c for page in pages for c in page]
          bodies=[str(c.get('body') or '') for c in comments]
          if sum(b.strip()==os.environ['ALLOCATION_MARKER'] for b in bodies)!=1: raise SystemExit('allocation marker cardinality drift')
          if any(b.strip().startswith(os.environ['CONSUMED_PREFIX']) for b in bodies): raise SystemExit('ordinal45 consumed marker already exists')
          active={}
          for c in comments:
              first=(str(c.get('body') or '').splitlines() or [''])[0].strip()
              if first.startswith('WRITE_QUIET_BEGIN'):
                  active[int(c['id'])]=first
              elif first.startswith('WRITE_QUIET_END'):
                  fields={}
                  for part in first.split('|')[1:]:
                      if '=' in part:
                          k,v=part.split('=',1); fields[k.strip()]=v.strip()
                  ids=[]
                  for key in ('begin','beginComment','begin_comment'):
                      if key in fields:
                          if not fields[key].isdigit(): raise SystemExit(f'non-numeric WRITE_QUIET_END {key}')
                          ids.append(int(fields[key]))
                  if len(set(ids))>1: raise SystemExit('conflicting WRITE_QUIET_END begin aliases')
                  if ids: active.pop(ids[0],None)
          if active: raise SystemExit(f'unmatched WRITE_QUIET_BEGIN exists: {sorted(active)}')
          PY
          if git ls-remote --exit-code --heads origin "$DISPATCH_BRANCH" >/dev/null 2>&1; then echo 'dispatch branch already exists' >&2; exit 1; fi

      - name: Emit review receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p review-output
          python - <<'PY'
          import json, os, pathlib
          out={
            'schemaVersion':1,
            'status':'PASS_AVPS_V2_RECOVERY4_ORDINAL45_CORRECTED_PUBLICATION_V3_ZERO_RUNTIME_REVIEW' if os.environ['MODE']=='publication' else 'PASS_AVPS_V2_RECOVERY4_ORDINAL45_PUBLICATION_V3_REVIEW_INFRASTRUCTURE',
            'mode':os.environ['MODE'],
            'reviewHead':os.environ['EVENT_HEAD'],
            'reviewBase':os.environ['EVENT_BASE'],
            'publicationParent':os.environ['PUBLICATION_PARENT'],
            'sourceCorrectionHead':os.environ['SOURCE_CORRECTION_HEAD'],
            'sourceCorrectionRun':int(os.environ['SOURCE_CORRECTION_RUN']),
            'sourceCorrectionArtifact':int(os.environ['SOURCE_CORRECTION_ARTIFACT']),
            'expectedWorkflowBlob':os.environ['EXPECTED_WORKFLOW_BLOB'],
            'scientificOrdinal':45,
            'caseCount':360,
            'commonRandomNumberGroupCount':72,
            'statesPerGroup':5,
            'photonHistoriesPerCase':20000000,
            'dispatchCreated':False,
            'seedConsumption':False,
            'solverExecution':False,
            'resultsOpened':False,
            'levelBOpeningAuthorized':False,
            'holdoutOpened':False,
            'productionAuthorized':False,
            'newMappingAuthorized':False,
            'taylorOrJerusalemUsed':False
          }
          pathlib.Path('review-output/publication-review-receipt.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: avps-v2-recovery4-ordinal45-corrected-publication-v3-review
          path: review-output/publication-review-receipt.json
          if-no-files-found: error
          compression-level: 0
