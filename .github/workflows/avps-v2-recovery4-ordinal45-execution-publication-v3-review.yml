name: Review AVPS Recovery4 ordinal45 corrected publication v3

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery4-ordinal45-execution-publication-v3-review.yml
      - .github/workflows/avps-v2-postconsumption-recovery4-science.yml
      - runtime-avps-v2-recovery4-ordinal45-v1/**

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SELF: .github/workflows/avps-v2-recovery4-ordinal45-execution-publication-v3-review.yml
      INFRA_BRANCH: review/avps-v2-recovery4-ordinal45-publication-review-v3-infrastructure-v3
      INFRA_BASE: b86c2142253c31dec3415bd1426210b1e73512f9
      FIX_BRANCH: review/avps-v2-recovery4-ordinal45-publication-v3-write-quiet-legacy-parser-fix-v1
      FIX_BASE: 5f42fd0e3bb6007b74b05619aac2fd9e0f9ef8b7
      PUB_BRANCH: review/avps-v2-recovery4-ordinal45-execution-publication-v3
      PUB_PARENT: b86c2142253c31dec3415bd1426210b1e73512f9
      SOURCE_PR: '798'
      SOURCE_HEAD: c0910978a6d9ca754695a6289a9cc3021d2d4db7
      SOURCE_RUN: '33425490171'
      SOURCE_ARTIFACT: '9770550740'
      SOURCE_ARTIFACT_NAME: avps-v2-recovery4-ordinal45-durable-end-source-correction-v4
      SOURCE_DIGEST: sha256:cc5eedecc5b23d8ca484830f6b0a7f04f35aa3ddc773ffdc9309197a5670c4ca
      SOURCE_ACCEPT_REVIEW: '5069881778'
      AUTH_PR: '774'
      AUTH_HEAD: 6e095b4b1603c90dcee0943295909b30cd1b374d
      AUTH_PARENT: 5685d5c313071014a94c816ee26b129f1f17a7fc
      DISPATCH_BRANCH: dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-ordinal-45
      ALLOCATION_MARKER: ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_AUTHORIZATION_ALLOCATED_REVIEWED_NOT_DISPATCHED commit=6e095b4b1603c90dcee0943295909b30cd1b374d parent=5685d5c313071014a94c816ee26b129f1f17a7fc pr=774
      CONSUMED_PREFIX: ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_DISPATCH_CONSUMED
      WF_BLOB: 2d210b3a161f6889352d600fb9222c974e728034
      ADAPTER_BLOB: e4b690c2969fd01ecde5b08f554e47ad50b40914
      EXECUTOR_BLOB: 7dc38e31c19701b1a1ceef300d75105cff179290
      AGGREGATOR_BLOB: 6afc8b0d21c2b5553c251dc9ca5524c795ed2646
      CONTRACT_BLOB: 2d5f71d80b5e573b86775c2806b80dcc1fbe02f4
      WF_SHA: fb9c499380af491a15d3a40d14e5bc36cf581b4679d8d046023d9a272d492fb9
      ADAPTER_SHA: e0c95d9ca15a78868bef13cb8375460de156075c07647298a2ad355c32d6d3ed
      EXECUTOR_SHA: 37f1f52fa2381c3bc40580ffc16f45efd8503d9242c22d2d72eb28a27c3882f5
      AGGREGATOR_SHA: 3287fb59344c223eb871befb05bef141fe79c74fec45f096c29a4c05e29845c2
      CONTRACT_SHA: 3a3e09f1a9dda5435e455fbc9a508a924c080f7f265cdd7c29de912449bacc93
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind mode and exact scope
        shell: bash
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          if [ "$BRANCH" = "$INFRA_BRANCH" ]; then
            test "$BASE_SHA" = "$INFRA_BASE"
            test "$(git rev-parse HEAD^)" = "$INFRA_BASE"
            test "$(git diff --name-only "$INFRA_BASE"...HEAD)" = "$SELF"
            echo MODE=infra >> "$GITHUB_ENV"
          elif [ "$BRANCH" = "$FIX_BRANCH" ]; then
            test "$BASE_SHA" = "$FIX_BASE"
            test "$(git merge-base "$FIX_BASE" HEAD)" = "$FIX_BASE"
            test "$(git rev-list --merges "$FIX_BASE"..HEAD | wc -l | tr -d ' ')" = 0
            test "$(git diff --name-only "$FIX_BASE"...HEAD)" = "$SELF"
            echo MODE=infra >> "$GITHUB_ENV"
          elif [ "$BRANCH" = "$PUB_BRANCH" ]; then
            test "$(git rev-parse HEAD^)" = "$PUB_PARENT"
            git merge-base --is-ancestor "$PUB_PARENT" "$BASE_SHA"
            git diff --name-only "$PUB_PARENT"...HEAD | sort > changed.txt
            printf '%s\n' \
              .github/workflows/avps-v2-postconsumption-recovery4-science.yml \
              runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py \
              runtime-avps-v2-recovery4-ordinal45-v1/executor.py \
              runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py \
              runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json | sort > expected.txt
            diff -u expected.txt changed.txt
            echo MODE=publication >> "$GITHUB_ENV"
          else
            echo unexpected-branch >&2; exit 1
          fi
          echo HEAD_SHA="$HEAD_SHA" >> "$GITHUB_ENV"
          echo BASE_SHA="$BASE_SHA" >> "$GITHUB_ENV"

      - name: Prove review itself is zero-runtime
        shell: bash
        run: |
          set -euo pipefail
          if [ "$MODE" = infra ]; then
            cp "$SELF" review-self.yml
          else
            git show "$BASE_SHA:$SELF" > review-self.yml
          fi
          python - <<'PY'
          from pathlib import Path
          p=Path('review-self.yml').read_text()
          bad=['uv'+'spec','workflow_'+'dispatch:','micro'+'mamba','setup-'+'micro'+'mamba']
          for x in bad:
              if x in p: raise SystemExit('forbidden review token: '+x)
          for x in ['9770550740','2d210b3a161f6889352d600fb9222c974e728034','beginComment','begin_comment','5471141095','5471174859']:
              if x not in p: raise SystemExit('missing binding: '+x)
          PY

      - name: Test WRITE_QUIET first-line compatibility parser
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .review-tmp
          cat > .review-tmp/write_quiet_parser.py <<'PY'
          ACCEPTED_KEYS=('begin','beginComment','begin_comment')

          def parse_end_id(first):
              values={}
              for token in first.replace('|',' ').split():
                  if '=' not in token:
                      continue
                  k,val=token.split('=',1)
                  k=k.strip(); val=val.strip()
                  if k not in ACCEPTED_KEYS:
                      continue
                  if k in values and values[k]!=val:
                      raise SystemExit('conflicting END aliases')
                  values[k]=val
              ids=[]
              for k in ACCEPTED_KEYS:
                  if k in values:
                      if not values[k].isdigit():
                          raise SystemExit('bad END id')
                      ids.append(int(values[k]))
              if len(set(ids))>1:
                  raise SystemExit('conflicting END aliases')
              return ids[0] if ids else None
          PY
          python - <<'PY'
          import sys
          sys.path.insert(0,'.review-tmp')
          from write_quiet_parser import parse_end_id

          # Durable historical fixture: Issue #60 END comment 5471174859 closes BEGIN 5471141095.
          cases=(
              ('WRITE_QUIET_END begin=5471141095 token=AVPS_V2_RECOVERY3_ORDINAL44_SNAPSHOT_33333805393 science_run=33334396129',5471141095),
              ('WRITE_QUIET_END | begin=5471141095 | token=fixture',5471141095),
              ('WRITE_QUIET_END | beginComment=5471141095 | token=fixture',5471141095),
              ('WRITE_QUIET_END begin_comment=5471141095 token=fixture',5471141095),
              ('WRITE_QUIET_END token=fixture',None),
          )
          for first,want in cases:
              got=parse_end_id(first)
              if got!=want:
                  raise SystemExit(f'END fixture mismatch: got={got} want={want}')
          for bad_first in (
              'WRITE_QUIET_END begin=not-a-number token=fixture',
              'WRITE_QUIET_END begin=5471141095 beginComment=5471174859 token=fixture',
              'WRITE_QUIET_END begin=5471141095 begin=5471174859 token=fixture',
          ):
              try:
                  parse_end_id(bad_first)
              except SystemExit:
                  pass
              else:
                  raise SystemExit('malformed END fixture did not fail closed')
          active={5471141095:1,9999999999:1}
          active.pop(parse_end_id(cases[0][0]),None)
          if 5471141095 in active or 9999999999 not in active:
              raise SystemExit('historical closure/unmatched preservation fixture failed')
          PY

      - name: Verify exact five publication bytes
        if: env.MODE == 'publication'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:.github/workflows/avps-v2-postconsumption-recovery4-science.yml)" = "$WF_BLOB"
          test "$(git rev-parse HEAD:runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py)" = "$ADAPTER_BLOB"
          test "$(git rev-parse HEAD:runtime-avps-v2-recovery4-ordinal45-v1/executor.py)" = "$EXECUTOR_BLOB"
          test "$(git rev-parse HEAD:runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py)" = "$AGGREGATOR_BLOB"
          test "$(git rev-parse HEAD:runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json)" = "$CONTRACT_BLOB"
          printf '%s  %s\n' "$WF_SHA" .github/workflows/avps-v2-postconsumption-recovery4-science.yml | sha256sum -c -
          printf '%s  %s\n' "$ADAPTER_SHA" runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py | sha256sum -c -
          printf '%s  %s\n' "$EXECUTOR_SHA" runtime-avps-v2-recovery4-ordinal45-v1/executor.py | sha256sum -c -
          printf '%s  %s\n' "$AGGREGATOR_SHA" runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py | sha256sum -c -
          printf '%s  %s\n' "$CONTRACT_SHA" runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json | sha256sum -c -

      - name: Rebind accepted source artifact and governance
        if: env.MODE == 'publication'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$SOURCE_PR" > p.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > r.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT" > a.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/$SOURCE_PR/reviews/$SOURCE_ACCEPT_REVIEW" > v.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/$AUTH_PR" > auth.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > comments.json
          gh run download "$SOURCE_RUN" -n "$SOURCE_ARTIFACT_NAME" -D accepted
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0,'.review-tmp')
          from write_quiet_parser import parse_end_id

          p=json.load(open('p.json')); r=json.load(open('r.json')); a=json.load(open('a.json')); v=json.load(open('v.json')); auth=json.load(open('auth.json'))
          if p['head']['sha']!=os.environ['SOURCE_HEAD']: raise SystemExit('source head drift')
          if r['run_attempt']!=1 or r['conclusion']!='success' or r['head_sha']!=os.environ['SOURCE_HEAD']: raise SystemExit('source run drift')
          if a.get('digest')!=os.environ['SOURCE_DIGEST'] or a.get('expired'): raise SystemExit('source artifact drift')
          if 'INDEPENDENT_AUDIT::ACCEPT_AVPS_ORDINAL45_DURABLE_END_SOURCE_CORRECTION_V4' not in str(v.get('body') or ''): raise SystemExit('source acceptance drift')
          if auth['state']!='open' or not auth['draft'] or auth['merged_at'] is not None or auth['head']['sha']!=os.environ['AUTH_HEAD'] or auth['base']['sha']!=os.environ['AUTH_PARENT']: raise SystemExit('auth drift')
          pages=json.load(open('comments.json')); cs=[c for page in pages for c in page]; bodies=[str(c.get('body') or '') for c in cs]
          if sum(b.strip()==os.environ['ALLOCATION_MARKER'] for b in bodies)!=1: raise SystemExit('allocation drift')
          if any(b.strip().startswith(os.environ['CONSUMED_PREFIX']) for b in bodies): raise SystemExit('already consumed')
          active={}
          for c in cs:
              first=(str(c.get('body') or '').splitlines() or [''])[0].strip()
              if first.startswith('WRITE_QUIET_BEGIN'):
                  active[int(c['id'])]=1
              elif first.startswith('WRITE_QUIET_END'):
                  end_id=parse_end_id(first)
                  if end_id is not None:
                      active.pop(end_id,None)
          if active: raise SystemExit('unmatched WRITE_QUIET')
          PY
          if git ls-remote --exit-code --heads origin "$DISPATCH_BRANCH" >/dev/null 2>&1; then echo dispatch-exists >&2; exit 1; fi
          cmp accepted/publication-payload/avps-v2-postconsumption-recovery4-science.yml .github/workflows/avps-v2-postconsumption-recovery4-science.yml
          cmp accepted/publication-payload/runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py
          cmp accepted/publication-payload/runtime-avps-v2-recovery4-ordinal45-v1/executor.py runtime-avps-v2-recovery4-ordinal45-v1/executor.py
          cmp accepted/publication-payload/runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py
          cmp accepted/publication-payload/runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json

      - name: Emit zero-runtime receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir out
          printf '{"schemaVersion":1,"status":"PASS","mode":"%s","head":"%s","scientificOrdinal":45,"caseCount":360,"crnGroups":72,"statesPerGroup":5,"photonsPerCase":20000000,"dispatchCreated":false,"seedConsumption":false,"solverExecution":false,"resultsOpened":false,"levelBOpeningAuthorized":false,"holdoutOpened":false,"productionAuthorized":false,"newMappingAuthorized":false,"taylorOrJerusalemUsed":false}\n' "$MODE" "$HEAD_SHA" > out/receipt.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: avps-v2-recovery4-ordinal45-publication-v3-review
          path: out/receipt.json
          if-no-files-found: error
          compression-level: 0
