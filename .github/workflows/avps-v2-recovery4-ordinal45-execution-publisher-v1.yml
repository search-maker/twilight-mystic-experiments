name: Publish reviewed AVPS Recovery4 ordinal45 execution bytes

on:
  push:
    branches:
      - publication-trigger/aerosol-vertical-profile-sensitivity-v2-recovery4-ordinal45-v1
    paths:
      - review/avps-v2-recovery4-ordinal45-execution-publication-gate-v1/activate.json

permissions:
  contents: write
  actions: read
  pull-requests: write

concurrency:
  group: avps-v2-recovery4-ordinal45-execution-publication-v1
  cancel-in-progress: false

jobs:
  publish-reviewed-bytes:
    if: github.event.created == false && github.event.deleted == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_REVIEW_RUN: '33372058737'
      SOURCE_REVIEW_HEAD: eb0ff26cbea7485ace9fe9bf6b1cc1a3c9d60489
      SOURCE_ARTIFACT_ID: '9750420831'
      SOURCE_ARTIFACT_DIGEST: sha256:f1c37d44636797ebcffa5eafe467ded0b9243e5b2e9fdbe66f7fd995986d75dd
      PUBLICATION_BRANCH: review/avps-v2-recovery4-ordinal45-execution-publication-v1
      ACTIVATION_BRANCH: publication-trigger/aerosol-vertical-profile-sensitivity-v2-recovery4-ordinal45-v1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Prove fresh exact one-file activation and current main binding
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = "$ACTIVATION_BRANCH"
          test "$GITHUB_EVENT_NAME" = push
          git fetch origin main --quiet
          python - <<'PY'
          import json, os, subprocess
          p='review/avps-v2-recovery4-ordinal45-execution-publication-gate-v1/activate.json'
          d=json.load(open(p))
          expected={
            'schemaVersion':1,
            'status':'PUBLISH_AVPS_V2_RECOVERY4_ORDINAL45_EXECUTION_BYTES_V1',
            'sourceReviewRunId':33372058737,
            'sourceReviewHead':'eb0ff26cbea7485ace9fe9bf6b1cc1a3c9d60489',
            'sourceArtifactId':9750420831,
            'sourceArtifactDigest':'sha256:f1c37d44636797ebcffa5eafe467ded0b9243e5b2e9fdbe66f7fd995986d75dd',
            'publicationBranch':'review/avps-v2-recovery4-ordinal45-execution-publication-v1',
            'authorizationHead':'6e095b4b1603c90dcee0943295909b30cd1b374d',
            'scientificOrdinal':45,
          }
          for k,v in expected.items():
              if d.get(k)!=v: raise SystemExit(f'activation drift {k}: {d.get(k)!r} != {v!r}')
          parent=subprocess.check_output(['git','rev-parse','HEAD^']).decode().strip()
          changed=subprocess.check_output(['git','diff','--name-only',parent,'HEAD']).decode().splitlines()
          if changed != [p]: raise SystemExit(f'activation must be exact one-file child: {changed}')
          main=subprocess.check_output(['git','rev-parse','origin/main']).decode().strip()
          if d.get('expectedMainSha')!=main: raise SystemExit(f'main drift: activation={d.get("expectedMainSha")} live={main}')
          if parent!=main: raise SystemExit(f'activation parent must equal live main: parent={parent} live={main}')
          PY
          test -z "$(git ls-remote --heads origin "$PUBLICATION_BRANCH")"
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=all&head=${GITHUB_REPOSITORY_OWNER}:${PUBLICATION_BRANCH}&per_page=100" > prior-prs.json
          python - <<'PY'
          import json
          if json.load(open('prior-prs.json')): raise SystemExit('publication PR identity already exists')
          PY

      - name: Fetch and verify exact reviewed generated-package artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_REVIEW_RUN" > source-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID" > source-artifact.json
          python - <<'PY'
          import json, os
          r=json.load(open('source-run.json')); a=json.load(open('source-artifact.json'))
          if r.get('id')!=int(os.environ['SOURCE_REVIEW_RUN']) or r.get('head_sha')!=os.environ['SOURCE_REVIEW_HEAD'] or r.get('run_attempt')!=1 or r.get('status')!='completed' or r.get('conclusion')!='success': raise SystemExit('source review run drift')
          if a.get('id')!=int(os.environ['SOURCE_ARTIFACT_ID']) or a.get('name')!='avps-v2-recovery4-ordinal45-generated-execution-package-review' or a.get('digest')!=os.environ['SOURCE_ARTIFACT_DIGEST'] or a.get('expired'): raise SystemExit('source artifact drift')
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" > reviewed.zip
          echo "${SOURCE_ARTIFACT_DIGEST#sha256:}  reviewed.zip" | sha256sum -c -
          mkdir reviewed
          unzip -q reviewed.zip -d reviewed
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('reviewed/generated-package')
          exact={
            'avps-v2-postconsumption-recovery4-science.yml':'24290edce579b5cf1774cee61d2c7a4433f730f18c9c99d2e2144efedf163b1f',
            'runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py':'e0c95d9ca15a78868bef13cb8375460de156075c07647298a2ad355c32d6d3ed',
            'runtime-avps-v2-recovery4-ordinal45-v1/executor.py':'37f1f52fa2381c3bc40580ffc16f45efd8503d9242c22d2d72eb28a27c3882f5',
            'runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py':'3287fb59344c223eb871befb05bef141fe79c74fec45f096c29a4c05e29845c2',
            'runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json':'3a3e09f1a9dda5435e455fbc9a508a924c080f7f265cdd7c29de912449bacc93',
          }
          for rel,expected in exact.items():
              p=root/rel
              got=hashlib.sha256(p.read_bytes()).hexdigest()
              if got!=expected: raise SystemExit(f'byte drift {rel}: {got}')
          m=json.load(open(root/'manifest.json'))
          if m.get('scientificOrdinal')!=45 or m.get('dispatchCreated') or m.get('scientificRuntime') or m.get('resultsOpened') or m.get('newMappingAuthorized'): raise SystemExit('generated manifest boundary drift')
          PY

      - name: Create exact-byte publication branch and PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(git rev-parse origin/main)"
          git checkout --detach "$MAIN_SHA"
          git switch -c "$PUBLICATION_BRANCH"
          mkdir -p .github/workflows runtime-avps-v2-recovery4-ordinal45-v1 review/avps-v2-recovery4-ordinal45-execution-publication-v1
          cp reviewed/generated-package/avps-v2-postconsumption-recovery4-science.yml .github/workflows/avps-v2-postconsumption-recovery4-science.yml
          cp reviewed/generated-package/runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py
          cp reviewed/generated-package/runtime-avps-v2-recovery4-ordinal45-v1/executor.py runtime-avps-v2-recovery4-ordinal45-v1/executor.py
          cp reviewed/generated-package/runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py
          cp reviewed/generated-package/runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json
          python - <<'PY'
          import json, os, subprocess
          d=json.load(open('review/avps-v2-recovery4-ordinal45-execution-publication-gate-v1/activate.json'))
          receipt={
            'schemaVersion':1,
            'status':'PUBLISHED_EXACT_REVIEWED_AVPS_V2_RECOVERY4_ORDINAL45_EXECUTION_BYTES_NOT_DISPATCHED',
            'sourceReviewRunId':33372058737,
            'sourceReviewHead':'eb0ff26cbea7485ace9fe9bf6b1cc1a3c9d60489',
            'sourceArtifactId':9750420831,
            'sourceArtifactDigest':'sha256:f1c37d44636797ebcffa5eafe467ded0b9243e5b2e9fdbe66f7fd995986d75dd',
            'authorizationHead':'6e095b4b1603c90dcee0943295909b30cd1b374d',
            'scientificOrdinal':45,
            'baseMainSha':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),
            'dispatchCreated':False,'solverExecution':False,'resultsOpened':False,
            'levelBOpeningAuthorized':False,'protectedHoldoutOpeningAuthorized':False,
            'productionAuthorized':False,'taylorOrJerusalemUsed':False,'newMappingAuthorized':False,
          }
          open('review/avps-v2-recovery4-ordinal45-execution-publication-v1/publication-receipt.json','w').write(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          git add -- .github/workflows/avps-v2-postconsumption-recovery4-science.yml runtime-avps-v2-recovery4-ordinal45-v1 review/avps-v2-recovery4-ordinal45-execution-publication-v1/publication-receipt.json
          test "$(git diff --cached --name-only | wc -l)" = 6
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish reviewed AVPS Recovery4 ordinal45 execution bytes'
          git push origin "$PUBLICATION_BRANCH"
          gh pr create --base main --head "$PUBLICATION_BRANCH" --draft \
            --title 'Publish reviewed AVPS Recovery4 ordinal45 execution bytes' \
            --body 'Exact-byte publication only from reviewed artifact 9750420831 / run 33372058737. Publishes the Recovery4 ordinal45 science workflow and runtime adapter/executor/aggregator/contract plus provenance receipt. No dispatch, consumed marker, solver execution, result opening, richer Level-B admission, protected holdout, Taylor/Jerusalem use, or production transition occurs in this PR.'
