name: Review AVPS Recovery4 ordinal45 final dispatch choreography v1

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v1.yml
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1.yml

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v1-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      INFRA_BASE: de3fafa052ff1d5b2f33ec0d4347c884d560d8b6
      INFRA_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-infrastructure-v11
      INFRA_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v1.yml
      PUBLISHER_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1
      PUBLISHER_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1.yml
      CONTROL_MERGE: de3fafa052ff1d5b2f33ec0d4347c884d560d8b6
      CONTROL_REVIEW_BLOB: 9ee6d8df8c0f62870ac8ef3771efe34a7557bd7b
      CONTROL_HEAD: b1a0bfaaf66e69aeac86e8f879c9cddf38aa096d
      CONTROL_DEDICATED_RUN: '33520021246'
      CONTROL_DEDICATED_ARTIFACT: '9805807163'
      CONTROL_DEDICATED_DIGEST: sha256:5dc88b304f0b4693e4732210166ac5f7b550bf2240e6d4f2513dc689e5030000
      CONTROL_GENERIC_RUN: '33520020974'
      CONTROL_ACCEPT_COMMENT: '5496051102'
      POST_MERGE_GENERIC_RUN: '33524288794'
      PR832_HEAD: 98b8ed4c1c5d62550ec6834e18caa2b24aec1cae
      PR832_TREE: a0fc27187c6d0b7bbe8ea4955ab562db5ec7dfc8
      PR832_WORKFLOW_BLOB: 4cd012b625ae3e180d6c19de2196776163a8a53f
      PR832_DEFECT_COMMENT: '5498713878'
      PR835: '835'
      PR835_HEAD: 1837762b30191c80ba896c9549023a812e2b26f6
      PR835_TREE: 95f2c7816e0b02d76f2c7732baf90b30f5100089
      PR835_WORKFLOW_BLOB: 517cac61c530ea4bafcd48a2086efb002152e474
      PR835_DEDICATED_RUN: '33550873988'
      PR835_DEDICATED_JOB: '99999705962'
      PR835_ARTIFACT: '9817616228'
      PR835_ARTIFACT_DIGEST: sha256:1daa889abf839a4a181b0c5e6bab355e1e8358f1a332591049bcf7de68cf9221
      PR835_GENERIC_RUN: '33550873965'
      PR835_DEFECT_COMMENT: '5499484473'
      AUTH_HEAD: 6e095b4b1603c90dcee0943295909b30cd1b374d
      AUTH_PARENT: 5685d5c313071014a94c816ee26b129f1f17a7fc
      ALLOCATION_MARKER: ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_AUTHORIZATION_ALLOCATED_REVIEWED_NOT_DISPATCHED commit=6e095b4b1603c90dcee0943295909b30cd1b374d parent=5685d5c313071014a94c816ee26b129f1f17a7fc pr=774
      CONSUMED_MARKER: ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_DISPATCH_CONSUMED
      DISPATCH_BRANCH: dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-ordinal-45
      CANDIDATE_SEED_SHA256: ddded6b2d170ca2fac8d498bdba2887446c16995df0880d948fb2be00870b3de
      CANDIDATE_ROWS_SHA256: c439de417520b330c037e2628df02b6955f652563300aa5ef30477abf7661a98
      SCIENCE_WORKFLOW: .github/workflows/avps-v2-postconsumption-recovery4-science.yml
      SCIENCE_WORKFLOW_BLOB: 2d210b3a161f6889352d600fb9222c974e728034
      RUNTIME_ADAPTER: runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py
      RUNTIME_ADAPTER_BLOB: e4b690c2969fd01ecde5b08f554e47ad50b40914
      EXECUTOR: runtime-avps-v2-recovery4-ordinal45-v1/executor.py
      EXECUTOR_BLOB: 7dc38e31c19701b1a1ceef300d75105cff179290
      AGGREGATOR: runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py
      AGGREGATOR_BLOB: 6afc8b0d21c2b5553c251dc9ca5524c795ed2646
      RUNTIME_CONTRACT: runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json
      RUNTIME_CONTRACT_BLOB: 2d5f71d80b5e573b86775c2806b80dcc1fbe02f4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Bind exact mode, immutable predecessors, and current closed state
        id: mode
        shell: bash
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "${{ github.event.action }}" = opened
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test "$(git rev-parse HEAD^)" = "$EVENT_BASE"
          test "$(git rev-list --count "$EVENT_BASE"..HEAD)" = 1
          git diff --name-only "$EVENT_BASE"...HEAD > changed.txt
          test "$(wc -l < changed.txt)" = 1
          CHANGED=$(cat changed.txt)
          if [ "$CHANGED" = "$INFRA_PATH" ]; then
            test "$EVENT_BASE" = "$INFRA_BASE"
            test "$EVENT_BRANCH" = "$INFRA_BRANCH"
            test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$INFRA_BASE"
            echo mode=infra >> "$GITHUB_OUTPUT"
          elif [ "$CHANGED" = "$PUBLISHER_PATH" ]; then
            test "$EVENT_BRANCH" = "$PUBLISHER_BRANCH"
            test "$(git rev-parse "$EVENT_BASE:$INFRA_PATH")" = "$(git rev-parse "HEAD:$INFRA_PATH")"
            git merge-base --is-ancestor "$CONTROL_MERGE" "$EVENT_BASE"
            echo mode=publisher >> "$GITHUB_OUTPUT"
          else
            echo "unexpected review path: $CHANGED" >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > target-pr.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR835" > pr835.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR835_DEDICATED_RUN" > pr835-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$PR835_DEDICATED_JOB" > pr835-job.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PR835_ARTIFACT" > pr835-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR835_GENERIC_RUN" > pr835-generic.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CONTROL_DEDICATED_RUN" > control-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CONTROL_DEDICATED_ARTIFACT" > control-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CONTROL_GENERIC_RUN" > control-generic.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$POST_MERGE_GENERIC_RUN" > postmerge-generic.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > issue60-pages.json
          python - <<'PY'
          import json,os
          p=json.load(open('target-pr.json'))
          if p.get('state')!='open' or p.get('merged_at') is not None: raise SystemExit('target PR must be open/unmerged')
          if p['head']['sha']!=os.environ['EVENT_HEAD'] or p['base']['sha']!=os.environ['EVENT_BASE']: raise SystemExit('target PR identity drift')
          p835=json.load(open('pr835.json'))
          if p835.get('state')!='closed' or p835.get('merged_at') is not None or p835['head']['sha']!=os.environ['PR835_HEAD'] or p835['base']['sha']!=os.environ['INFRA_BASE']: raise SystemExit('PR835 immutable rejected identity drift')
          r=json.load(open('pr835-run.json')); j=json.load(open('pr835-job.json')); a=json.load(open('pr835-artifact.json')); g=json.load(open('pr835-generic.json'))
          if r['id']!=int(os.environ['PR835_DEDICATED_RUN']) or r['head_sha']!=os.environ['PR835_HEAD'] or r['run_attempt']!=1 or r['conclusion']!='success': raise SystemExit('PR835 dedicated evidence drift')
          if j['id']!=int(os.environ['PR835_DEDICATED_JOB']) or j['run_id']!=int(os.environ['PR835_DEDICATED_RUN']) or j.get('conclusion')!='success': raise SystemExit('PR835 job evidence drift')
          if a['id']!=int(os.environ['PR835_ARTIFACT']) or a.get('digest')!=os.environ['PR835_ARTIFACT_DIGEST'] or a.get('expired'): raise SystemExit('PR835 artifact evidence drift')
          if g['id']!=int(os.environ['PR835_GENERIC_RUN']) or g['head_sha']!=os.environ['PR835_HEAD'] or g['run_attempt']!=1 or g['conclusion']!='success': raise SystemExit('PR835 generic evidence drift')
          cr=json.load(open('control-run.json')); ca=json.load(open('control-artifact.json')); cg=json.load(open('control-generic.json')); pm=json.load(open('postmerge-generic.json'))
          if cr['head_sha']!=os.environ['CONTROL_HEAD'] or cr['run_attempt']!=1 or cr['conclusion']!='success': raise SystemExit('V7 dedicated drift')
          if ca.get('digest')!=os.environ['CONTROL_DEDICATED_DIGEST'] or ca.get('expired'): raise SystemExit('V7 artifact drift')
          if cg['head_sha']!=os.environ['CONTROL_HEAD'] or cg['run_attempt']!=1 or cg['conclusion']!='success': raise SystemExit('V7 generic drift')
          if pm['head_sha']!=os.environ['CONTROL_MERGE'] or pm['run_attempt']!=1 or pm['conclusion']!='success': raise SystemExit('V7 postmerge drift')
          comments=[c for page in json.load(open('issue60-pages.json')) for c in page]
          def exact(cid,prefix):
              hits=[c for c in comments if int(c.get('id') or 0)==int(cid)]
              if len(hits)!=1 or not str(hits[0].get('body') or '').startswith(prefix): raise SystemExit(f'ledger checkpoint drift {cid}')
              return str(hits[0].get('body') or '')
          exact(os.environ['CONTROL_ACCEPT_COMMENT'],'INDEPENDENT_AUDIT::ACCEPT_AVPS_ORDINAL45_DISPATCH_CONSUMPTION_CONTROL_V7')
          d832=exact(os.environ['PR832_DEFECT_COMMENT'],'INDEPENDENT_AUDIT::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_DISPATCH_CHOREOGRAPHY_REVIEW_INFRA_V9_PR832_PRE_FENCE_MUTATION_SURFACE_UNBOUND')
          d835=exact(os.environ['PR835_DEFECT_COMMENT'],'COORDINATOR::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_DISPATCH_CHOREOGRAPHY_REVIEW_INFRA_V10_PR835_GLOBAL_JOB_AND_MUTATION_INVENTORY_STRUCTURAL_BYPASS')
          if 'QUARANTINE_DOWNSTREAM=false' not in d832 or 'QUARANTINE_DOWNSTREAM=false' not in d835: raise SystemExit('predecessor quarantine classification drift')
          for c in comments:
              if int(c.get('id') or 0)<=int(os.environ['PR835_DEFECT_COMMENT']): continue
              b=str(c.get('body') or '')
              if 'AVPS' in b and ('CONFIRMED_DEFECT' in b or 'QUARANTINE_DOWNSTREAM=true' in b or 'FAIL_CLOSED' in b or 'BLOCKER' in b): raise SystemExit(f'newer AVPS blocker/defect exists: {c.get("id")}')
          PY
          test "$(git rev-parse "$CONTROL_MERGE:.github/workflows/avps-v2-recovery4-ordinal45-dispatch-consumption-control-v7-review.yml")" = "$CONTROL_REVIEW_BLOB"
          test "$(git rev-parse "HEAD:$SCIENCE_WORKFLOW")" = "$SCIENCE_WORKFLOW_BLOB"
          test "$(git rev-parse "HEAD:$RUNTIME_ADAPTER")" = "$RUNTIME_ADAPTER_BLOB"
          test "$(git rev-parse "HEAD:$EXECUTOR")" = "$EXECUTOR_BLOB"
          test "$(git rev-parse "HEAD:$AGGREGATOR")" = "$AGGREGATOR_BLOB"
          test "$(git rev-parse "HEAD:$RUNTIME_CONTRACT")" = "$RUNTIME_CONTRACT_BLOB"
          test "$(git rev-parse "$PR832_HEAD^{tree}")" = "$PR832_TREE"
          test "$(git rev-parse "$PR832_HEAD:$INFRA_PATH")" = "$PR832_WORKFLOW_BLOB"
          test "$(git rev-parse "$PR835_HEAD^{tree}")" = "$PR835_TREE"
          test "$(git rev-parse "$PR835_HEAD:$INFRA_PATH")" = "$PR835_WORKFLOW_BLOB"

      - name: Replay accepted PR832 runtime guard and build exact closed-world publisher bytes
        shell: bash
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -x /usr/bin/python3
          test -x /usr/bin/gh
          test "$(command -v gh)" = /usr/bin/gh
          git show "$PR832_HEAD:$INFRA_PATH" > pr832-review.yml
          git show "$PR835_HEAD:$INFRA_PATH" > pr835-review.yml
          python - <<'PY'
          import hashlib,json,os,textwrap
          from pathlib import Path

          def extract_python(raw,name):
              anchor=f'      - name: {name}\n'
              a=raw.index(anchor)
              p=raw.index("          python - <<'PY'\n",a)+len("          python - <<'PY'\n")
              e=raw.index("\n          PY",p)
              return textwrap.dedent(raw[p:e])+"\n"

          raw832=Path('pr832-review.yml').read_text()
          semantic=extract_python(raw832,'Execute semantic publisher guard and whole-step runtime proof')
          old_mode=os.environ.get('MODE'); os.environ['MODE']='infra'
          ns832={}; exec(semantic,ns832)
          if old_mode is None: os.environ.pop('MODE',None)
          else: os.environ['MODE']=old_mode
          canonical_header=ns832['canonical_header']; canonical_step=ns832['canonical_step']

          raw835=Path('pr835-review.yml').read_text()
          proof=extract_python(raw835,'Prove full pre-fence sequence and global mutation inventory')
          old_mode=os.environ.get('MODE'); os.environ['MODE']='infra'
          ns835={}; exec(proof,ns835)
          if old_mode is None: os.environ.pop('MODE',None)
          else: os.environ['MODE']=old_mode
          canonical_checkout=ns835['canonical_checkout']
          canonical_prefence=ns835['canonical_prefence'].replace('KNOWN_DEFECT=5498713878','KNOWN_DEFECT=5499484473')

          protected_body=textwrap.dedent(r'''
          # BEGIN_CANONICAL_AVPS_ORDINAL45_FENCED_DISPATCH_V1
          import json,os,subprocess,time
          from pathlib import Path
          REPO=os.environ['GITHUB_REPOSITORY']
          AUTH_HEAD='6e095b4b1603c90dcee0943295909b30cd1b374d'
          DISPATCH_BRANCH='dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-ordinal-45'
          CONSUMED_MARKER='ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_DISPATCH_CONSUMED'
          SCIENCE_WORKFLOW='avps-v2-postconsumption-recovery4-science.yml'
          EXECUTION_KEY='aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4:numerical:45'
          def gh(args):
              cp=subprocess.run(['/usr/bin/gh','api','--hostname','github.com',*args],text=True,capture_output=True)
              if cp.returncode!=0: raise SystemExit(f'GitHub API failure args={args!r} rc={cp.returncode} stderr={cp.stderr.strip()}')
              return cp
          begin=int(os.environ['FENCE_BEGIN']); token=os.environ['FENCE_TOKEN']
          ref=gh(['--method','POST',f'repos/{REPO}/git/refs','-f',f'ref=refs/heads/{DISPATCH_BRANCH}','-f',f'sha={AUTH_HEAD}'])
          r=json.loads(ref.stdout)
          if r.get('ref')!=f'refs/heads/{DISPATCH_BRANCH}' or r.get('object',{}).get('sha')!=AUTH_HEAD: raise SystemExit('dispatch ref creation response drift')
          consumed=f'{CONSUMED_MARKER} | authorization={AUTH_HEAD} | dispatch={DISPATCH_BRANCH}'
          c=gh(['--method','POST',f'repos/{REPO}/issues/60/comments','-f',f'body={consumed}'])
          consumed_id=int(json.loads(c.stdout)['id'])
          gh(['--method','POST',f'repos/{REPO}/actions/workflows/{SCIENCE_WORKFLOW}/dispatches','-f','ref=main','-f',f'inputs[dispatch_ref]={DISPATCH_BRANCH}'])
          science_run=None
          endpoint=f'repos/{REPO}/actions/workflows/{SCIENCE_WORKFLOW}/runs?event=workflow_dispatch&per_page=100'
          for _ in range(90):
              cp=subprocess.run(['/usr/bin/gh','api','--hostname','github.com','--paginate','--slurp',endpoint],text=True,capture_output=True)
              if cp.returncode!=0: raise SystemExit(f'science-run enumeration failed: {cp.stderr.strip()}')
              pages=json.loads(cp.stdout); runs=[r for p in pages for r in p.get('workflow_runs',[])]
              if len(runs)==1:
                  science_run=runs[0]; break
              if len(runs)>1: raise SystemExit(f'science workflow_dispatch cardinality drift: {[r.get("id") for r in runs]}')
              time.sleep(2)
          if science_run is None: raise SystemExit('exact dispatched science run not observed')
          if science_run.get('run_attempt')!=1 or science_run.get('event')!='workflow_dispatch' or science_run.get('head_branch')!='main' or science_run.get('path')!=f'.github/workflows/{SCIENCE_WORKFLOW}': raise SystemExit('science run identity drift')
          if science_run.get('status') not in {'queued','pending','waiting','requested'}: raise SystemExit(f'science run escaped bootstrap concurrency lock before BEGIN binding: {science_run.get("status")}')
          science_id=int(science_run['id'])
          final_begin=f'WRITE_QUIET_BEGIN | AVPS_V2_RECOVERY4_ORDINAL45_FINAL_DISPATCH_V1 | token={token} | authorization={AUTH_HEAD} | dispatch={DISPATCH_BRANCH} | expected_science_workflow={SCIENCE_WORKFLOW} | science_run={science_id} | execution_key={EXECUTION_KEY} | guard=repository-global-candidate-seed-recheck'
          p=gh(['--method','PATCH',f'repos/{REPO}/issues/comments/{begin}','-f',f'body={final_begin}'])
          if int(json.loads(p.stdout).get('id') or 0)!=begin: raise SystemExit('same-BEGIN PATCH identity drift')
          Path('publisher-dispatch-receipt.json').write_text(json.dumps({'schemaVersion':1,'beginCommentId':begin,'consumedCommentId':consumed_id,'scienceRunId':science_id,'dispatchBranch':DISPATCH_BRANCH,'authorizationHead':AUTH_HEAD},sort_keys=True,indent=2)+'\n')
          # END_CANONICAL_AVPS_ORDINAL45_FENCED_DISPATCH_V1
          ''').strip()+"\n"
          protected_step=(
              '      - name: Protected dispatch consumption and same-BEGIN science binding\n'
              '        shell: /usr/bin/python3 -I -S {0}\n'
              '        env:\n'
              '          GH_TOKEN: ${{ github.token }}\n'
              '        run: |\n'+textwrap.indent(protected_body,'          ')
          )

          monitor_body=textwrap.dedent(r'''
          # BEGIN_CANONICAL_AVPS_ORDINAL45_FENCE_MONITOR_V1
          import json,os,subprocess,time
          REPO=os.environ['GITHUB_REPOSITORY']
          AUTH_HEAD='6e095b4b1603c90dcee0943295909b30cd1b374d'
          DISPATCH_BRANCH='dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-ordinal-45'
          CONSUMED_MARKER='ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_DISPATCH_CONSUMED'
          SCIENCE_WORKFLOW='avps-v2-postconsumption-recovery4-science.yml'
          EXECUTION_KEY='aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4:numerical:45'
          def gh_pages(endpoint):
              cp=subprocess.run(['/usr/bin/gh','api','--hostname','github.com','--paginate','--slurp',endpoint],text=True,capture_output=True)
              if cp.returncode!=0: raise SystemExit(f'GitHub API failure endpoint={endpoint} rc={cp.returncode} stderr={cp.stderr.strip()}')
              return json.loads(cp.stdout)
          comments=[c for p in gh_pages(f'repos/{REPO}/issues/60/comments?per_page=100') for c in p]
          closed=set(); begins=[]
          for c in comments:
              body=str(c.get('body') or '').strip(); first=body.splitlines()[0] if body else ''; fields={}
              for tok in first.replace('|',' ').split():
                  if '=' in tok:
                      k,v=tok.split('=',1); fields[k]=v
              if first.startswith('WRITE_QUIET_END'):
                  vals=[]
                  for key in ('begin','beginComment','begin_comment'):
                      if key in fields:
                          if not fields[key].isdigit(): raise SystemExit('non-numeric END alias')
                          vals.append(int(fields[key]))
                  if len(set(vals))>1: raise SystemExit('conflicting END aliases')
                  if vals: closed.add(vals[0])
              elif first.startswith('WRITE_QUIET_BEGIN'): begins.append((int(c['id']),fields))
          unmatched=[x for x in begins if x[0] not in closed]
          matching=[x for x in unmatched if x[1].get('token','').startswith('AVPS_V2_RECOVERY4_ORDINAL45_FINAL_DISPATCH_V1_') and x[1].get('authorization')==AUTH_HEAD and x[1].get('dispatch')==DISPATCH_BRANCH and x[1].get('expected_science_workflow')==SCIENCE_WORKFLOW and x[1].get('execution_key')==EXECUTION_KEY and x[1].get('guard')=='repository-global-candidate-seed-recheck' and str(x[1].get('science_run','')).isdigit()]
          if len(matching)!=1 or len(unmatched)!=1: raise SystemExit(f'exact bound unmatched BEGIN required, unmatched={unmatched}')
          begin,fields=matching[0]; token=fields['token']; science_id=int(fields['science_run'])
          consumed=[c for c in comments if str(c.get('body') or '').strip().startswith(CONSUMED_MARKER)]
          if len(consumed)!=1 or int(consumed[0]['id'])<=begin: raise SystemExit('exact post-BEGIN consumed marker required')
          conclusion=None
          for _ in range(180):
              pages=gh_pages(f'repos/{REPO}/actions/runs/{science_id}/jobs?per_page=100')
              jobs=[j for p in pages for j in (p.get('jobs',[]) if isinstance(p,dict) else [])]
              pre=[j for j in jobs if j.get('name')=='preflight']
              if len(pre)==1 and pre[0].get('status')=='completed': conclusion=str(pre[0].get('conclusion') or 'failure'); break
              time.sleep(5)
          if conclusion is None: conclusion='failure'
          comments=[c for p in gh_pages(f'repos/{REPO}/issues/60/comments?per_page=100') for c in p]
          allowed={begin,int(consumed[0]['id'])}
          unexpected=[int(c['id']) for c in comments if int(c['id'])>begin and int(c['id']) not in allowed]
          if unexpected: conclusion='failure'
          end_body=f'WRITE_QUIET_END | AVPS_V2_RECOVERY4_ORDINAL45_FINAL_DISPATCH_V1 | begin={begin} | token={token} | authorization={AUTH_HEAD} | dispatch={DISPATCH_BRANCH} | science_run={science_id} | guard=repository-global-candidate-seed-recheck | step_conclusion={conclusion}'
