name: Review AVPS Recovery4 ordinal45 final dispatch choreography v1

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v1.yml
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1.yml

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v1-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      INFRA_BASE: de3fafa052ff1d5b2f33ec0d4347c884d560d8b6
      INFRA_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-infrastructure-v15
      INFRA_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v1.yml
      PUBLISHER_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1
      PUBLISHER_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1.yml
      CONTROL_MERGE: de3fafa052ff1d5b2f33ec0d4347c884d560d8b6
      CONTROL_REVIEW_BLOB: 9ee6d8df8c0f62870ac8ef3771efe34a7557bd7b
      AUTH_HEAD: 6e095b4b1603c90dcee0943295909b30cd1b374d
      AUTH_PARENT: 5685d5c313071014a94c816ee26b129f1f17a7fc
      ALLOCATION_MARKER: ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_AUTHORIZATION_ALLOCATED_REVIEWED_NOT_DISPATCHED commit=6e095b4b1603c90dcee0943295909b30cd1b374d parent=5685d5c313071014a94c816ee26b129f1f17a7fc pr=774
      CONSUMED_MARKER: ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_DISPATCH_CONSUMED
      DISPATCH_BRANCH: dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-ordinal-45
      CANDIDATE_SEED_SHA256: ddded6b2d170ca2fac8d498bdba2887446c16995df0880d948fb2be00870b3de
      CANDIDATE_ROWS_SHA256: c439de417520b330c037e2628df02b6955f652563300aa5ef30477abf7661a98
      SCIENCE_WORKFLOW: .github/workflows/avps-v2-postconsumption-recovery4-science.yml
      SCIENCE_WORKFLOW_BLOB: 2d210b3a161f6889352d600fb9222c974e728034
      RUNTIME_ADAPTER: runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py
      RUNTIME_ADAPTER_BLOB: e4b690c2969fd01ecde5b08f554e47ad50b40914
      EXECUTOR: runtime-avps-v2-recovery4-ordinal45-v1/executor.py
      EXECUTOR_BLOB: 7dc38e31c19701b1a1ceef300d75105cff179290
      AGGREGATOR: runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py
      AGGREGATOR_BLOB: 6afc8b0d21c2b5553c251dc9ca5524c795ed2646
      RUNTIME_CONTRACT: runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json
      RUNTIME_CONTRACT_BLOB: 2d5f71d80b5e573b86775c2806b80dcc1fbe02f4
      PR832_HEAD: 98b8ed4c1c5d62550ec6834e18caa2b24aec1cae
      PR835_HEAD: 1837762b30191c80ba896c9549023a812e2b26f6
      PR840: '840'
      PR840_HEAD: aa7285da223190220f122671671b6bcddad9ac2f
      PR840_TREE: 63e598616bb99b4138f4b48986183c515b703bbc
      PR840_WORKFLOW_BLOB: ac2abc4ecca91978959c1225d54e496731b9eec9
      PR840_DEDICATED_RUN: '33556711330'
      PR840_DEDICATED_JOB: '100019202536'
      PR840_GENERIC_RUN: '33556711348'
      PR840_DEFECT_BROAD: '5500205108'
      PR840_DEFECT_NARROW: '5500205256'
      PR842: '842'
      PR842_HEAD: f9078f6dad760a7e41f3a44025b80abcf7d8e38d
      PR842_TREE: c1e2e91d1e1dd7db6bb88493c6e3d1bdf0285c90
      PR842_WORKFLOW_BLOB: 2b7eec4f93d37e92265698e1c09f389462ed28aa
      PR842_DEDICATED_RUN: '33557786476'
      PR842_DEDICATED_JOB: '100022727639'
      PR842_GENERIC_RUN: '33557786570'
      PR842_DEFECT_COMMENT: '5500293944'
      PR843: '843'
      PR843_HEAD: b3073c4207e44e6740b9be6624ebb62b8527cdb6
      PR843_TREE: 206ac45db3cb094be3991e38d2e564ffe8f92433
      PR843_WORKFLOW_BLOB: 697c0446f6f254920489d81c53b474e667c0795b
      PR843_DEDICATED_RUN: '33558590062'
      PR843_DEDICATED_JOB: '100025370885'
      PR843_GENERIC_RUN: '33558589976'
      PR843_DEFECT_COMMENT: '5500425080'
      PR844: '844'
      PR844_HEAD: 843cd63ce817ff9c30b02c89fc3e1df1f7c14494
      PR844_TREE: 8f427502445afd36a33593f8a88ff17a653a08f3
      PR844_WORKFLOW_BLOB: c9f93e2ef3935d73f6e7dfb510bb0e46f5010c7e
      PR844_DEDICATED_RUN: '33559379908'
      PR844_DEDICATED_JOB: '100027919112'
      PR844_GENERIC_RUN: '33559379943'
      PR844_DEFECT_COMMENT: '5500494933'
      PR840_DEFECT_COMMENT: '5500494933'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Bind exact V15 mode, complete replay environment, and predecessor ledger
        id: mode
        shell: bash
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "${{ github.event.action }}" = opened
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test "$(git rev-parse HEAD^)" = "$EVENT_BASE"
          test "$(git rev-list --count "$EVENT_BASE"..HEAD)" = 1
          git diff --name-only "$EVENT_BASE"...HEAD > changed.txt
          test "$(wc -l < changed.txt)" = 1
          CHANGED=$(cat changed.txt)
          if [ "$CHANGED" = "$INFRA_PATH" ]; then
            test "$EVENT_BASE" = "$INFRA_BASE"
            test "$EVENT_BRANCH" = "$INFRA_BRANCH"
            test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$INFRA_BASE"
            echo mode=infra >> "$GITHUB_OUTPUT"
          elif [ "$CHANGED" = "$PUBLISHER_PATH" ]; then
            test "$EVENT_BRANCH" = "$PUBLISHER_BRANCH"
            test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EVENT_BASE"
            test "$(git rev-parse "$EVENT_BASE:$INFRA_PATH")" = "$(git rev-parse "HEAD:$INFRA_PATH")"
            echo mode=publisher >> "$GITHUB_OUTPUT"
          else
            echo "unexpected review path: $CHANGED" >&2
            exit 1
          fi
          test -n "$PR832_HEAD" && test -n "$PR835_HEAD" && test -n "$PR840_HEAD" && test -n "$PR842_HEAD" && test -n "$PR843_HEAD" && test -n "$PR844_HEAD"
          if git ls-remote --exit-code --heads origin "$DISPATCH_BRANCH" >/dev/null 2>&1; then echo 'ordinal45 dispatch ref already exists' >&2; exit 1; fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > target-pr.json
          for n in 840 842 843 844; do gh api "repos/$GITHUB_REPOSITORY/pulls/$n" > "pr$n.json"; done
          for n in 840 842 843 844; do
            eval "rid=\$PR${n}_DEDICATED_RUN"; eval "jid=\$PR${n}_DEDICATED_JOB"; eval "gid=\$PR${n}_GENERIC_RUN"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$rid" > "pr$n-run.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$jid" > "pr$n-job.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$gid" > "pr$n-generic.json"
          done
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > issue60-pages.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/avps-v2-postconsumption-recovery4-science.yml/runs?event=workflow_dispatch&per_page=100" > science-runs.json
          python - <<'PY'
          import json,os
          def load(p): return json.load(open(p))
          target=load('target-pr.json')
          if target.get('state')!='open' or target.get('merged_at') is not None: raise SystemExit('target PR must be open/unmerged')
          if target['head']['sha']!=os.environ['EVENT_HEAD'] or target['base']['sha']!=os.environ['EVENT_BASE']: raise SystemExit('target PR identity drift')
          for n in ('840','842','843','844'):
              p=load('pr'+n+'.json'); head=os.environ['PR'+n+'_HEAD']
              if p.get('state')!='closed' or p.get('merged_at') is not None or p['head']['sha']!=head or p['base']['sha']!=os.environ['INFRA_BASE']: raise SystemExit('PR'+n+' immutable identity drift')
              r=load('pr'+n+'-run.json'); j=load('pr'+n+'-job.json'); g=load('pr'+n+'-generic.json')
              er=int(os.environ['PR'+n+'_DEDICATED_RUN']); ej=int(os.environ['PR'+n+'_DEDICATED_JOB']); eg=int(os.environ['PR'+n+'_GENERIC_RUN'])
              if r['id']!=er or r['head_sha']!=head or r['run_attempt']!=1 or r['conclusion']!='failure': raise SystemExit('PR'+n+' dedicated evidence drift')
              if j['id']!=ej or j['run_id']!=er or j.get('conclusion')!='failure': raise SystemExit('PR'+n+' job evidence drift')
              if g['id']!=eg or g['head_sha']!=head or g['run_attempt']!=1: raise SystemExit('PR'+n+' generic identity drift')
              if n!='844' and g.get('conclusion')!='success': raise SystemExit('PR'+n+' generic terminal evidence drift')
          comments=[c for page in load('issue60-pages.json') for c in page]
          def exact(cid,prefix,tokens):
              hits=[c for c in comments if int(c.get('id') or 0)==int(cid)]
              if len(hits)!=1: raise SystemExit(f'ledger cardinality drift {cid}')
              c=hits[0]; b=str(c.get('body') or '')
              if not b.startswith(prefix): raise SystemExit(f'ledger prefix drift {cid}')
              u=c.get('user') or {}
              if u.get('login')!='search-maker' or int(u.get('id') or 0)!=304153003 or c.get('author_association')!='OWNER': raise SystemExit(f'ledger actor drift {cid}')
              for token in tokens:
                  if token not in b: raise SystemExit(f'ledger token drift {cid}: {token}')
              if 'QUARANTINE_DOWNSTREAM=false' not in b: raise SystemExit(f'quarantine classification drift {cid}')
          base=os.environ['INFRA_BASE']
          h840=os.environ['PR840_HEAD']; t840=os.environ['PR840_TREE']; wb840=os.environ['PR840_WORKFLOW_BLOB']
          common840=['pr=840',f'head={h840}',f'base={base}',f'tree={t840}',f'workflow_blob={wb840}',f'dedicated_run={os.environ["PR840_DEDICATED_RUN"]}','33556711330','100019202536',f'generic_run={os.environ["PR840_GENERIC_RUN"]}']
          exact(os.environ['PR840_DEFECT_BROAD'],'COORDINATOR::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_DISPATCH_CHOREOGRAPHY_REVIEW_INFRA_V11_PR840_CANONICAL_VALIDATOR_AND_FROZEN_SCIENCE_BINDING_INCOMPATIBLE',common840+['dedicated_conclusion=FAILURE','generic_conclusion=SUCCESS'])
          exact(os.environ['PR840_DEFECT_NARROW'],'COORDINATOR::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_DISPATCH_CHOREOGRAPHY_REVIEW_INFRA_V11_PR840_YAML_AMPERSAND_FALSE_POSITIVE',common840+['conclusion=FAILURE','generic_conclusion=SUCCESS'])
          exact(os.environ['PR842_DEFECT_COMMENT'],'INDEPENDENT_AUDIT::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_DISPATCH_CHOREOGRAPHY_REVIEW_INFRA_V12_PR842_STALE_PREDECESSOR_GOVERNANCE_BASELINE',['pr=842',f'head={os.environ["PR842_HEAD"]}',f'base={base}',f'tree={os.environ["PR842_TREE"]}',f'workflow_blob={os.environ["PR842_WORKFLOW_BLOB"]}',f'dedicated_run={os.environ["PR842_DEDICATED_RUN"]}',f'dedicated_job={os.environ["PR842_DEDICATED_JOB"]}','dedicated_conclusion=FAILURE',f'generic_run={os.environ["PR842_GENERIC_RUN"]}','generic_status_at_decision=IN_PROGRESS'])
          exact(os.environ['PR843_DEFECT_COMMENT'],'COORDINATOR::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_DISPATCH_CHOREOGRAPHY_REVIEW_INFRA_V13_PR843_OUTER_ACTIONS_EXPRESSION_SUBSTITUTION_IN_REVIEW_ASSERTIONS',['pr=843',f'head={os.environ["PR843_HEAD"]}',f'base={base}',f'tree={os.environ["PR843_TREE"]}',f'workflow_blob={os.environ["PR843_WORKFLOW_BLOB"]}',f'dedicated_run={os.environ["PR843_DEDICATED_RUN"]}',f'dedicated_job={os.environ["PR843_DEDICATED_JOB"]}','dedicated_conclusion=FAILURE',f'generic_run={os.environ["PR843_GENERIC_RUN"]}','generic_conclusion=SUCCESS'])
          exact(os.environ['PR844_DEFECT_COMMENT'],'COORDINATOR::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_DISPATCH_CHOREOGRAPHY_REVIEW_INFRA_V14_PR844_EXTRACTED_V13_ENVIRONMENT_DEPENDENCY_UNBOUND',['pr=844',f'head={os.environ["PR844_HEAD"]}',f'base={base}',f'tree={os.environ["PR844_TREE"]}',f'workflow_blob={os.environ["PR844_WORKFLOW_BLOB"]}',f'dedicated_run={os.environ["PR844_DEDICATED_RUN"]}',f'dedicated_job={os.environ["PR844_DEDICATED_JOB"]}','dedicated_conclusion=FAILURE',f'generic_run={os.environ["PR844_GENERIC_RUN"]}','generic_status_at_decision=IN_PROGRESS'])
          cutoff=int(os.environ['PR844_DEFECT_COMMENT'])
          for c in comments:
              cid=int(c.get('id') or 0); b=str(c.get('body') or '')
              if cid<=cutoff: continue
              if 'AVPS' in b and ('CONFIRMED_DEFECT' in b or 'QUARANTINE_DOWNSTREAM=true' in b or 'FAIL_CLOSED' in b or 'BLOCKER' in b): raise SystemExit(f'newer AVPS blocker/defect exists: {cid}')
          bodies=[str(c.get('body') or '').strip() for c in comments]
          if sum(b==os.environ['ALLOCATION_MARKER'] for b in bodies)!=1: raise SystemExit('allocation marker cardinality drift')
          if any(b.startswith(os.environ['CONSUMED_MARKER']) for b in bodies): raise SystemExit('consumed marker already exists')
          closed=set(); begins=[]
          for c in comments:
              body=str(c.get('body') or '').strip(); first=body.splitlines()[0] if body else ''; fields={}
              for token in first.replace('|',' ').split():
                  if '=' in token:
                      k,v=token.split('=',1); fields.setdefault(k,[]).append(v)
              if first.startswith('WRITE_QUIET_END'):
                  vals=[]
                  for key in ('begin','beginComment','begin_comment'):
                      for v in fields.get(key,[]):
                          if not v.isdigit(): raise SystemExit('non-numeric WRITE_QUIET_END alias')
                          vals.append(int(v))
                  if len(set(vals))>1: raise SystemExit('conflicting WRITE_QUIET_END aliases')
                  if vals: closed.add(vals[0])
              elif first.startswith('WRITE_QUIET_BEGIN'): begins.append(int(c['id']))
          unmatched=[x for x in begins if x not in closed]
          if unmatched: raise SystemExit(f'unmatched WRITE_QUIET_BEGIN blocks review: {unmatched}')
          runs=[r for page in load('science-runs.json') for r in page.get('workflow_runs',[])]
          if runs: raise SystemExit(f'prior ordinal45 science workflow_dispatch exists: {[r.get("id") for r in runs]}')
          PY
          test "$(git rev-parse "$PR840_HEAD^{tree}")" = "$PR840_TREE"
          test "$(git rev-parse "$PR840_HEAD:$INFRA_PATH")" = "$PR840_WORKFLOW_BLOB"
          test "$(git rev-parse "$PR842_HEAD^{tree}")" = "$PR842_TREE"
          test "$(git rev-parse "$PR842_HEAD:$INFRA_PATH")" = "$PR842_WORKFLOW_BLOB"
          test "$(git rev-parse "$PR843_HEAD^{tree}")" = "$PR843_TREE"
          test "$(git rev-parse "$PR843_HEAD:$INFRA_PATH")" = "$PR843_WORKFLOW_BLOB"
          test "$(git rev-parse "$PR844_HEAD^{tree}")" = "$PR844_TREE"
          test "$(git rev-parse "$PR844_HEAD:$INFRA_PATH")" = "$PR844_WORKFLOW_BLOB"
          test "$(git rev-parse "HEAD:$SCIENCE_WORKFLOW")" = "$SCIENCE_WORKFLOW_BLOB"
          test "$(git rev-parse "HEAD:$RUNTIME_ADAPTER")" = "$RUNTIME_ADAPTER_BLOB"
          test "$(git rev-parse "HEAD:$EXECUTOR")" = "$EXECUTOR_BLOB"
          test "$(git rev-parse "HEAD:$AGGREGATOR")" = "$AGGREGATOR_BLOB"
          test "$(git rev-parse "HEAD:$RUNTIME_CONTRACT")" = "$RUNTIME_CONTRACT_BLOB"

      - name: Replay exact V14 rebuild under complete immutable V13 environment
        shell: bash
        env:
          REVIEW_MODE: ${{ steps.mode.outputs.mode }}
          MODE: infra
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git show "$PR844_HEAD:$INFRA_PATH" > pr844-review.yml
          python - <<'PY'
          from pathlib import Path
          raw=Path('pr844-review.yml').read_text()
          name='Replay exact V13 rebuild at runtime and apply sole V14 cutoff'
          anchor=f'      - name: {name}\n'
          if raw.count(anchor)!=1: raise SystemExit('V14 rebuild step anchor drift')
          a=raw.index(anchor); r=raw.index('        run: |\n',a)+len('        run: |\n')
          candidates=[x for x in (raw.find('\n      - name:',r),raw.find('\n      - uses:',r)) if x!=-1]
          e=min(candidates)
          lines=raw[r:e].splitlines()
          if not lines or any(line and not line.startswith('          ') for line in lines): raise SystemExit('V14 rebuild block indentation drift')
          Path('v14-rebuild.sh').write_text('\n'.join(line[10:] if line.startswith('          ') else '' for line in lines)+'\n')
          PY
          bash v14-rebuild.sh
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path('canonical-final-publisher.yml'); raw=p.read_text()
          old='KNOWN_DEFECT=5500425080'; new='KNOWN_DEFECT=5500494933'
          if raw.count(old)!=1 or new in raw: raise SystemExit('V15 governance cutoff source cardinality drift')
          patched=raw.replace(old,new,1); p.write_text(patched)
          digest=hashlib.sha256(patched.encode()).hexdigest(); Path('canonical-final-publisher.sha256').write_text(digest+'\n')
          gh_token_expr='${'+'{ github.token }}'; needs_expr='${'+'{ needs.bootstrap-lock.result }}'
          if gh_token_expr not in patched or needs_expr not in patched: raise SystemExit('literal Actions expressions missing after complete-env runtime replay')
          if 'AVPS_V2_RECOVERY4_ORDINAL45_SNAPSHOT_' not in patched or 'AVPS_V2_RECOVERY4_ORDINAL45_FINAL_DISPATCH_V1_' in patched: raise SystemExit('frozen science fence token drift')
          if '    if: always()\n' not in patched: raise SystemExit('fail-closed monitor cleanup missing')
          if '  queue: max\n' not in patched or '  cancel-in-progress: false\n' not in patched: raise SystemExit('publisher serialization drift')
          contract=json.load(open('publisher-closed-world-contract.json'))
          if contract.get('wholeWorkflowByteBound') is not True or contract.get('publisherCompleteExecutableSurfaceClosedWorld',True) is not True: raise SystemExit('closed-world contract drift')
          contract['knownDefectBound']=5500494933
          contract['predecessorDefectComments']=[5500205108,5500205256,5500293944,5500425080,5500494933]
          contract['status']='PASS_EXACT_WHOLE_PUBLISHER_CLOSED_WORLD_BYTES_FROZEN_SCIENCE_AND_V15_COMPLETE_REPLAY_ENVIRONMENT'
          contract['completeV13StaticReplayEnvironmentBound']=True
          contract['canonicalPublisherSha256']=digest
          Path('publisher-closed-world-contract.json').write_text(json.dumps(contract,sort_keys=True,indent=2)+'\n')
          patch={'schemaVersion':1,'sourceV14Head':os.environ['PR844_HEAD'],'oldKnownDefect':5500425080,'newKnownDefect':5500494933,'replacementCount':1,'allOtherV14CanonicalBytesPreserved':True,'completeV13StaticReplayEnvironmentBound':True,'canonicalPublisherSha256':digest}
          Path('v15-governance-patch.json').write_text(json.dumps(patch,sort_keys=True,indent=2)+'\n')
          if os.environ['REVIEW_MODE']=='publisher':
              actual=Path(os.environ['PUBLISHER_PATH']).read_text()
              if actual!=patched: raise SystemExit('publisher whole-workflow byte identity differs from V15 canonical reviewed bytes')
          PY

      - name: Replay exact V14 fresh repository-global review at runtime
        shell: bash
        env:
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git show "$PR844_HEAD:$INFRA_PATH" > pr844-review.yml
          python - <<'PY'
          from pathlib import Path
          raw=Path('pr844-review.yml').read_text()
          name='Replay exact V13 fresh repository-global review at runtime'
          anchor=f'      - name: {name}\n'
          if raw.count(anchor)!=1: raise SystemExit('V14 global-review step anchor drift')
          a=raw.index(anchor); r=raw.index('        run: |\n',a)+len('        run: |\n')
          candidates=[x for x in (raw.find('\n      - name:',r),raw.find('\n      - uses:',r)) if x!=-1]
          e=min(candidates)
          lines=raw[r:e].splitlines()
          if not lines or any(line and not line.startswith('          ') for line in lines): raise SystemExit('V14 global-review block indentation drift')
          Path('v14-global-review.sh').write_text('\n'.join(line[10:] if line.startswith('          ') else '' for line in lines)+'\n')
          PY
          bash v14-global-review.sh

      - name: Write zero-runtime V15 review receipt
        shell: bash
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          out={
            'schemaVersion':11,
            'status':'PASS_AVPS_V2_RECOVERY4_ORDINAL45_FINAL_DISPATCH_CHOREOGRAPHY_REVIEW_V15_ZERO_RUNTIME',
            'mode':os.environ['MODE'],'headSha':os.environ['EVENT_HEAD'],'baseSha':os.environ['EVENT_BASE'],
