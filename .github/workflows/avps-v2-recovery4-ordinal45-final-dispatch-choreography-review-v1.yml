name: Review AVPS Recovery4 ordinal45 final dispatch choreography v1

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v1.yml
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1.yml

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v1-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      INFRA_BASE: de3fafa052ff1d5b2f33ec0d4347c884d560d8b6
      INFRA_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-infrastructure-v7
      INFRA_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v1.yml
      PUBLISHER_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1
      PUBLISHER_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1.yml
      PUBLISHER_CONCURRENCY_GROUP: avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1
      PUBLISHER_WORKFLOW_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1.yml
      CONTROL_MERGE: de3fafa052ff1d5b2f33ec0d4347c884d560d8b6
      CONTROL_REVIEW_BLOB: 9ee6d8df8c0f62870ac8ef3771efe34a7557bd7b
      CONTROL_PR: '823'
      CONTROL_HEAD: b1a0bfaaf66e69aeac86e8f879c9cddf38aa096d
      CONTROL_DEDICATED_RUN: '33520021246'
      CONTROL_DEDICATED_ARTIFACT: '9805807163'
      CONTROL_DEDICATED_DIGEST: sha256:5dc88b304f0b4693e4732210166ac5f7b550bf2240e6d4f2513dc689e5030000
      CONTROL_GENERIC_RUN: '33520020974'
      CONTROL_ACCEPT_COMMENT: '5496051102'
      POST_MERGE_GENERIC_RUN: '33524288794'
      REJECTED_RUNTIME_PR: '829'
      REJECTED_RUNTIME_HEAD: 99dc928b9441ce435b2eb1493c28b581615842b4
      REJECTED_RUNTIME_TREE: b0adcd75c6c2dc4e0edb2068460f1c539f2b365c
      REJECTED_RUNTIME_WORKFLOW_BLOB: c4bcad885398ff9c8b115b631b34d3082ec40ad6
      REJECTED_RUNTIME_RUN: '33541053150'
      REJECTED_RUNTIME_JOB: '99967102541'
      REJECTED_RUNTIME_ARTIFACT: '9814227967'
      REJECTED_RUNTIME_DIGEST: sha256:27808085c1957cd7cdc1631d7b9871eb71f8bb70595df65b320f6145206de0cf
      REJECTED_RUNTIME_GENERIC_RUN: '33541053190'
      REJECTED_RUNTIME_DEFECT_COMMENT: '5498261949'
      AUTH_HEAD: 6e095b4b1603c90dcee0943295909b30cd1b374d
      AUTH_PARENT: 5685d5c313071014a94c816ee26b129f1f17a7fc
      AUTH_PR: '774'
      ALLOCATION_MARKER: ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_AUTHORIZATION_ALLOCATED_REVIEWED_NOT_DISPATCHED commit=6e095b4b1603c90dcee0943295909b30cd1b374d parent=5685d5c313071014a94c816ee26b129f1f17a7fc pr=774
      CONSUMED_MARKER: ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_DISPATCH_CONSUMED
      DISPATCH_BRANCH: dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-ordinal-45
      EXECUTION_KEY: aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4:numerical:45
      CANDIDATE_SEED_SHA256: ddded6b2d170ca2fac8d498bdba2887446c16995df0880d948fb2be00870b3de
      CANDIDATE_ROWS_SHA256: c439de417520b330c037e2628df02b6955f652563300aa5ef30477abf7661a98
      SCIENCE_WORKFLOW: .github/workflows/avps-v2-postconsumption-recovery4-science.yml
      SCIENCE_WORKFLOW_BLOB: 2d210b3a161f6889352d600fb9222c974e728034
      RUNTIME_ADAPTER: runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py
      RUNTIME_ADAPTER_BLOB: e4b690c2969fd01ecde5b08f554e47ad50b40914
      EXECUTOR: runtime-avps-v2-recovery4-ordinal45-v1/executor.py
      EXECUTOR_BLOB: 7dc38e31c19701b1a1ceef300d75105cff179290
      AGGREGATOR: runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py
      AGGREGATOR_BLOB: 6afc8b0d21c2b5553c251dc9ca5524c795ed2646
      RUNTIME_CONTRACT: runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json
      RUNTIME_CONTRACT_BLOB: 2d5f71d80b5e573b86775c2806b80dcc1fbe02f4
      SCIENCE_CONCURRENCY_GROUP: avps-v2-postconsumption-recovery4-ordinal-45-science
      PUBLISHER_ACCEPT_PREFIX: INDEPENDENT_AUDIT::ACCEPT_AVPS_ORDINAL45_FINAL_DISPATCH_PUBLISHER_V1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Bind exact review mode and direct-child identity
        id: mode
        shell: bash
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "${{ github.event.action }}" = opened
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test "$(git rev-parse HEAD^)" = "$EVENT_BASE"
          test "$(git rev-list --count "$EVENT_BASE"..HEAD)" = 1
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EVENT_BASE"
          git diff --name-only "$EVENT_BASE"...HEAD > changed.txt
          test "$(wc -l < changed.txt)" = 1
          CHANGED=$(cat changed.txt)
          if [ "$CHANGED" = "$INFRA_PATH" ]; then
            test "$EVENT_BASE" = "$INFRA_BASE"
            test "$EVENT_BRANCH" = "$INFRA_BRANCH"
            echo mode=infra >> "$GITHUB_OUTPUT"
          elif [ "$CHANGED" = "$PUBLISHER_PATH" ]; then
            test "$EVENT_BRANCH" = "$PUBLISHER_BRANCH"
            git merge-base --is-ancestor "$CONTROL_MERGE" "$EVENT_BASE"
            echo mode=publisher >> "$GITHUB_OUTPUT"
          else
            echo "unexpected review path: $CHANGED" >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > pr.json
          python - <<'PY'
          import json,os
          p=json.load(open('pr.json'))
          if p.get('state')!='open' or p.get('merged_at') is not None: raise SystemExit('review target must be open/unmerged')
          if p['head']['sha']!=os.environ['EVENT_HEAD'] or p['base']['sha']!=os.environ['EVENT_BASE']: raise SystemExit('review target identity drift')
          PY

      - name: Bind accepted V7 control and terminal rejected PR829 evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$CONTROL_MERGE" HEAD || test "${{ steps.mode.outputs.mode }}" = infra
          test "$(git rev-parse "$CONTROL_MERGE:.github/workflows/avps-v2-recovery4-ordinal45-dispatch-consumption-control-v7-review.yml")" = "$CONTROL_REVIEW_BLOB"
          test "$(git rev-parse "HEAD:$SCIENCE_WORKFLOW")" = "$SCIENCE_WORKFLOW_BLOB"
          test "$(git rev-parse "HEAD:$RUNTIME_ADAPTER")" = "$RUNTIME_ADAPTER_BLOB"
          test "$(git rev-parse "HEAD:$EXECUTOR")" = "$EXECUTOR_BLOB"
          test "$(git rev-parse "HEAD:$AGGREGATOR")" = "$AGGREGATOR_BLOB"
          test "$(git rev-parse "HEAD:$RUNTIME_CONTRACT")" = "$RUNTIME_CONTRACT_BLOB"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CONTROL_DEDICATED_RUN" > control-dedicated.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CONTROL_DEDICATED_ARTIFACT" > control-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CONTROL_GENERIC_RUN" > control-generic.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$POST_MERGE_GENERIC_RUN" > post-merge-generic.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/$REJECTED_RUNTIME_PR" > rejected-runtime-pr.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REJECTED_RUNTIME_RUN" > rejected-runtime-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$REJECTED_RUNTIME_JOB" > rejected-runtime-job.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$REJECTED_RUNTIME_ARTIFACT" > rejected-runtime-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REJECTED_RUNTIME_GENERIC_RUN" > rejected-runtime-generic.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > issue60-pages.json
          python - <<'PY'
          import json,os
          d=json.load(open('control-dedicated.json')); a=json.load(open('control-artifact.json')); g=json.load(open('control-generic.json')); pm=json.load(open('post-merge-generic.json'))
          rp=json.load(open('rejected-runtime-pr.json')); rr=json.load(open('rejected-runtime-run.json')); rj=json.load(open('rejected-runtime-job.json')); ra=json.load(open('rejected-runtime-artifact.json')); rg=json.load(open('rejected-runtime-generic.json'))
          if d['id']!=int(os.environ['CONTROL_DEDICATED_RUN']) or d['head_sha']!=os.environ['CONTROL_HEAD'] or d['run_attempt']!=1 or d['conclusion']!='success': raise SystemExit('V7 dedicated review drift')
          if a['id']!=int(os.environ['CONTROL_DEDICATED_ARTIFACT']) or a.get('digest')!=os.environ['CONTROL_DEDICATED_DIGEST'] or a.get('expired'): raise SystemExit('V7 artifact drift')
          if g['id']!=int(os.environ['CONTROL_GENERIC_RUN']) or g['head_sha']!=os.environ['CONTROL_HEAD'] or g['run_attempt']!=1 or g['conclusion']!='success': raise SystemExit('V7 generic review drift')
          if pm['id']!=int(os.environ['POST_MERGE_GENERIC_RUN']) or pm['head_sha']!=os.environ['CONTROL_MERGE'] or pm['run_attempt']!=1 or pm['conclusion']!='success': raise SystemExit('V7 post-merge generic drift')
          if rp.get('state')!='closed' or rp.get('merged_at') is not None or rp['head']['sha']!=os.environ['REJECTED_RUNTIME_HEAD'] or rp['base']['sha']!=os.environ['INFRA_BASE']: raise SystemExit('PR829 must remain closed/unmerged on exact base/head')
          if rr['id']!=int(os.environ['REJECTED_RUNTIME_RUN']) or rr['head_sha']!=os.environ['REJECTED_RUNTIME_HEAD'] or rr['run_attempt']!=1 or rr['conclusion']!='success': raise SystemExit('PR829 dedicated terminal evidence drift')
          if rj['id']!=int(os.environ['REJECTED_RUNTIME_JOB']) or rj['run_id']!=int(os.environ['REJECTED_RUNTIME_RUN']) or rj.get('conclusion')!='success': raise SystemExit('PR829 dedicated job evidence drift')
          if ra['id']!=int(os.environ['REJECTED_RUNTIME_ARTIFACT']) or ra.get('digest')!=os.environ['REJECTED_RUNTIME_DIGEST'] or ra.get('expired'): raise SystemExit('PR829 artifact drift')
          if rg['id']!=int(os.environ['REJECTED_RUNTIME_GENERIC_RUN']) or rg['head_sha']!=os.environ['REJECTED_RUNTIME_HEAD'] or rg['run_attempt']!=1 or rg['conclusion']!='success': raise SystemExit('PR829 generic evidence drift')
          pages=json.load(open('issue60-pages.json')); comments=[c for page in pages for c in page]
          def exact_comment(cid,prefix):
              hit=[c for c in comments if int(c.get('id') or 0)==int(cid)]
              if len(hit)!=1 or not str(hit[0].get('body') or '').startswith(prefix): raise SystemExit(f'ledger checkpoint drift: {cid}')
          exact_comment(os.environ['CONTROL_ACCEPT_COMMENT'],'INDEPENDENT_AUDIT::ACCEPT_AVPS_ORDINAL45_DISPATCH_CONSUMPTION_CONTROL_V7')
          exact_comment(os.environ['REJECTED_RUNTIME_DEFECT_COMMENT'],'INDEPENDENT_AUDIT::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_DISPATCH_CHOREOGRAPHY_REVIEW_INFRA_V6_PR829_RUNTIME_PRELUDE_HIJACK_UNPROVEN')
          PY

      - name: Prove reviewer infrastructure is solver-free and non-authorizing
        if: steps.mode.outputs.mode == 'infra'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v1.yml').read_text()
          required=(
            'permissions:\n  contents: read\n  actions: read\n  issues: read\n  pull-requests: read',
            'BEGIN_CANONICAL_PUBLISHER_BOOTSTRAP_GUARD_STEP_V1',
            "'publisherBootstrapEntireStepByteBound':True",
            "'publisherBootstrapAbsolutePythonAndGh':True",
            "'publisherBootstrapHostilePreludeFixturesRejected':True",
            'queue: max','bootstrap-lock','monitor-fence',
          )
          for token in required:
              if token not in s: raise SystemExit(f'missing reviewer contract token: {token}')
          for line in s.splitlines():
              stripped=line.strip()
              if stripped.startswith('gh api --method POST ') or stripped.startswith('gh api --method PATCH ') or stripped.startswith('uvspec ') or stripped.startswith('libRadtran '):
                  raise SystemExit(f'reviewer contains executable mutation/runtime command: {stripped}')
          PY

      - name: Execute semantic publisher guard and whole-step runtime proof
        shell: bash
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,re,textwrap,types
          from pathlib import Path
          from unittest import mock

          guard=textwrap.dedent(r'''
          # BEGIN_PUBLISHER_RUN_CARDINALITY_GUARD_V1
          ACTIVE_PUBLISHER_STATUSES={'queued','in_progress','pending','waiting','requested'}
          TERMINAL_PUBLISHER_STATUSES={'completed'}
          class PublisherRunGuardError(RuntimeError): pass
          def _require(condition,message):
              if not condition: raise PublisherRunGuardError(message)
          def normalize_publisher_run_pages(pages):
              _require(isinstance(pages,list) and len(pages)>0,'publisher run pagination/API drift: pages')
              runs=[]; totals=set()
              for page in pages:
                  _require(isinstance(page,dict),'publisher run pagination/API drift: page')
                  _require(isinstance(page.get('total_count'),int) and page['total_count']>=0,'publisher run pagination/API drift: total_count')
                  _require(isinstance(page.get('workflow_runs'),list),'publisher run pagination/API drift: workflow_runs')
                  totals.add(page['total_count']); runs.extend(page['workflow_runs'])
              _require(len(totals)==1,'publisher run pagination/API drift: inconsistent total_count')
              total=next(iter(totals)); _require(total==len(runs),f'publisher run pagination/API drift: expected_total={total} enumerated={len(runs)}')
              ids=[]; normalized=[]
              for run in runs:
                  _require(isinstance(run,dict),'publisher run pagination/API drift: run object')
                  rid=run.get('id'); _require(isinstance(rid,int) and rid>0,'publisher run pagination/API drift: run id'); ids.append(rid)
                  normalized.append((rid,run.get('status'),run.get('run_attempt'),run.get('event'),run.get('run_number'),run.get('head_sha'),run.get('head_branch'),run.get('path'),run.get('conclusion')))
              _require(len(ids)==len(set(ids)),'publisher run pagination/API drift: duplicate run id')
              return tuple(sorted(normalized))
          def validate_publisher_run_pages(pages,expected):
              normalized=normalize_publisher_run_pages(pages); flat=[]
              for page in pages: flat.extend(page['workflow_runs'])
              self_runs=[r for r in flat if r.get('id')==expected['run_id']]; _require(len(self_runs)==1,'publisher current-run identity cardinality drift')
              cur=self_runs[0]
              _require(cur.get('run_attempt')==1 and expected['run_attempt']==1,'publisher current run attempt drift')
              _require(cur.get('event')=='workflow_dispatch' and expected['event']=='workflow_dispatch','publisher current run event drift')
              _require(cur.get('run_number')==expected['run_number'],'publisher current run number drift')
              _require(cur.get('head_sha')==expected['head_sha'],'publisher current run head drift')
              _require(cur.get('head_branch')==expected['head_branch'],'publisher current run ref drift')
              _require(cur.get('path')==expected['workflow_path'],'publisher current run workflow drift')
              _require(cur.get('status')=='in_progress','publisher current run must be in_progress while guard executes')
              for run in flat:
                  if run.get('id')==expected['run_id']: continue
                  status=run.get('status')
                  if status in ACTIVE_PUBLISHER_STATUSES: raise PublisherRunGuardError(f"competing final publisher workflow_dispatch exists: run_id={run.get('id')} status={status}")
                  _require(status in TERMINAL_PUBLISHER_STATUSES,f"publisher run status/API drift: run_id={run.get('id')} status={status}")
              return {'currentRunId':expected['run_id'],'enumeratedRunCount':len(flat),'normalized':normalized}
          def run_publisher_guard_fixtures():
              expected={'run_id':1001,'run_attempt':1,'event':'workflow_dispatch','run_number':7,'head_sha':'abc123','head_branch':'main','workflow_path':'.github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1.yml'}
              current={'id':1001,'status':'in_progress','run_attempt':1,'event':'workflow_dispatch','run_number':7,'head_sha':'abc123','head_branch':'main','path':expected['workflow_path'],'conclusion':None}
              def pages(runs): return [{'total_count':len(runs),'workflow_runs':runs}]
              validate_publisher_run_pages(pages([current]),expected)
              for status in ('queued','in_progress','pending','waiting','requested'):
                  competitor={'id':1002,'status':status,'run_attempt':1,'event':'workflow_dispatch','run_number':8,'head_sha':'other','head_branch':'main','path':expected['workflow_path'],'conclusion':None}
                  try: validate_publisher_run_pages(pages([current,competitor]),expected)
                  except PublisherRunGuardError as e: _require(str(e)==f'competing final publisher workflow_dispatch exists: run_id=1002 status={status}',f'active competitor blocker drift: {e}')
                  else: raise PublisherRunGuardError(f'active competitor fixture unexpectedly passed: {status}')
              completed={'id':900,'status':'completed','run_attempt':1,'event':'workflow_dispatch','run_number':6,'head_sha':'old','head_branch':'main','path':expected['workflow_path'],'conclusion':'cancelled'}
              validate_publisher_run_pages(pages([completed,current]),expected)
              wrong=dict(current); wrong['head_sha']='drift'
              try: validate_publisher_run_pages(pages([wrong]),expected)
              except PublisherRunGuardError as e: _require(str(e)=='publisher current run head drift',f'head drift blocker mismatch: {e}')
              else: raise PublisherRunGuardError('head drift fixture unexpectedly passed')
              wrong_attempt=dict(current); wrong_attempt['run_attempt']=2
              try: validate_publisher_run_pages(pages([wrong_attempt]),expected)
              except PublisherRunGuardError as e: _require(str(e)=='publisher current run attempt drift',f'attempt drift blocker mismatch: {e}')
              else: raise PublisherRunGuardError('attempt drift fixture unexpectedly passed')
              duplicate=dict(current)
              try: validate_publisher_run_pages(pages([current,duplicate]),expected)
              except PublisherRunGuardError as e: _require('duplicate run id' in str(e),'duplicate self fixture blocker mismatch')
              else: raise PublisherRunGuardError('duplicate self fixture unexpectedly passed')
              return True
          # END_PUBLISHER_RUN_CARDINALITY_GUARD_V1
          ''').strip()+"\n"

          runtime=textwrap.dedent(r'''
          # BEGIN_PUBLISHER_RUNTIME_WIRING_V2
          import json,os,subprocess,time
          PUBLISHER_WORKFLOW_PATH='.github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1.yml'
          def _runtime_expected_from_github_env():
              required=('GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','GITHUB_EVENT_NAME','GITHUB_RUN_NUMBER','GITHUB_SHA','GITHUB_REF','GITHUB_REF_NAME','GITHUB_WORKFLOW_REF','GITHUB_REPOSITORY')
              missing=[k for k in required if not os.environ.get(k)]; _require(not missing,f'publisher runtime GITHUB_* identity missing: {missing}')
              _require(os.environ['GITHUB_EVENT_NAME']=='workflow_dispatch','publisher runtime event must be workflow_dispatch')
              _require(os.environ['GITHUB_RUN_ATTEMPT']=='1','publisher runtime attempt must be 1')
              _require(os.environ['GITHUB_REF']==f"refs/heads/{os.environ['GITHUB_REF_NAME']}",'publisher runtime GITHUB_REF/GITHUB_REF_NAME drift')
              _require(os.environ['GITHUB_REF_NAME']=='main','publisher runtime ref must be main')
              expected_workflow_ref=f"{os.environ['GITHUB_REPOSITORY']}/{PUBLISHER_WORKFLOW_PATH}@{os.environ['GITHUB_REF']}"
              _require(os.environ['GITHUB_WORKFLOW_REF']==expected_workflow_ref,'publisher runtime workflow_ref drift')
              return {'run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'event':os.environ['GITHUB_EVENT_NAME'],'run_number':int(os.environ['GITHUB_RUN_NUMBER']),'head_sha':os.environ['GITHUB_SHA'],'head_branch':os.environ['GITHUB_REF_NAME'],'workflow_path':PUBLISHER_WORKFLOW_PATH}
          def _real_actions_workflow_pages():
              endpoint=f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1.yml/runs?event=workflow_dispatch&per_page=100"
              cp=subprocess.run(['/usr/bin/gh','api','--hostname','github.com','--paginate','--slurp',endpoint],capture_output=True,text=True,check=False)
              _require(cp.returncode==0,f'publisher run API failure: rc={cp.returncode} stderr={cp.stderr.strip()}')
              try: pages=json.loads(cp.stdout)
              except Exception as e: raise PublisherRunGuardError(f'publisher run API JSON drift: {e}')
              normalize_publisher_run_pages(pages); return pages
          def run_real_publisher_runtime_guard():
              expected=_runtime_expected_from_github_env()
              for attempt in range(1,4):
                  pages_a=_real_actions_workflow_pages(); pages_b=_real_actions_workflow_pages()
                  if normalize_publisher_run_pages(pages_a)!=normalize_publisher_run_pages(pages_b):
                      if attempt==3: raise PublisherRunGuardError('publisher run complete-enumeration metadata changed across three fresh attempts')
                      time.sleep(attempt*5); continue
                  result=validate_publisher_run_pages(pages_b,expected); result['stableEnumerationAttempt']=attempt; result['expectedRunNumber']=expected['run_number']; result['workflowRef']=os.environ['GITHUB_WORKFLOW_REF']; return result
              raise PublisherRunGuardError('publisher run complete-enumeration metadata changed')
          RUNTIME_GUARD_RESULT=run_real_publisher_runtime_guard()
          with open('publisher-runtime-guard.json','w') as f: json.dump(RUNTIME_GUARD_RESULT,f,sort_keys=True,indent=2); f.write('\n')
          # END_PUBLISHER_RUNTIME_WIRING_V2
          ''').strip()+"\n"

          canonical_body=guard+runtime
          token_expr='$'+'{{ github.token }}'
          canonical_step=(
              '      - name: Canonical publisher runtime identity and cardinality guard\n'
              '        shell: /usr/bin/python3 -I -S {0}\n'
              '        env:\n'
              f'          GH_TOKEN: {token_expr}\n'
              '        run: |\n'+textwrap.indent(canonical_body,'          ')
          )
