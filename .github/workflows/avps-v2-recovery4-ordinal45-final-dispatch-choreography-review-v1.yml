name: Review AVPS Recovery4 ordinal45 final dispatch choreography v1

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v1.yml
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1.yml

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v1-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      INFRA_BASE: de3fafa052ff1d5b2f33ec0d4347c884d560d8b6
      INFRA_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-infrastructure-v13
      INFRA_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v1.yml
      PUBLISHER_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1
      PUBLISHER_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1.yml
      CONTROL_MERGE: de3fafa052ff1d5b2f33ec0d4347c884d560d8b6
      CONTROL_REVIEW_BLOB: 9ee6d8df8c0f62870ac8ef3771efe34a7557bd7b
      AUTH_HEAD: 6e095b4b1603c90dcee0943295909b30cd1b374d
      AUTH_PARENT: 5685d5c313071014a94c816ee26b129f1f17a7fc
      ALLOCATION_MARKER: ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_AUTHORIZATION_ALLOCATED_REVIEWED_NOT_DISPATCHED commit=6e095b4b1603c90dcee0943295909b30cd1b374d parent=5685d5c313071014a94c816ee26b129f1f17a7fc pr=774
      CONSUMED_MARKER: ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_DISPATCH_CONSUMED
      DISPATCH_BRANCH: dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-ordinal-45
      CANDIDATE_SEED_SHA256: ddded6b2d170ca2fac8d498bdba2887446c16995df0880d948fb2be00870b3de
      CANDIDATE_ROWS_SHA256: c439de417520b330c037e2628df02b6955f652563300aa5ef30477abf7661a98
      SCIENCE_WORKFLOW: .github/workflows/avps-v2-postconsumption-recovery4-science.yml
      SCIENCE_WORKFLOW_BLOB: 2d210b3a161f6889352d600fb9222c974e728034
      RUNTIME_ADAPTER: runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py
      RUNTIME_ADAPTER_BLOB: e4b690c2969fd01ecde5b08f554e47ad50b40914
      EXECUTOR: runtime-avps-v2-recovery4-ordinal45-v1/executor.py
      EXECUTOR_BLOB: 7dc38e31c19701b1a1ceef300d75105cff179290
      AGGREGATOR: runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py
      AGGREGATOR_BLOB: 6afc8b0d21c2b5553c251dc9ca5524c795ed2646
      RUNTIME_CONTRACT: runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json
      RUNTIME_CONTRACT_BLOB: 2d5f71d80b5e573b86775c2806b80dcc1fbe02f4
      PR832_HEAD: 98b8ed4c1c5d62550ec6834e18caa2b24aec1cae
      PR835_HEAD: 1837762b30191c80ba896c9549023a812e2b26f6
      PR840: '840'
      PR840_HEAD: aa7285da223190220f122671671b6bcddad9ac2f
      PR840_TREE: 63e598616bb99b4138f4b48986183c515b703bbc
      PR840_WORKFLOW_BLOB: ac2abc4ecca91978959c1225d54e496731b9eec9
      PR840_DEDICATED_RUN: '33556711330'
      PR840_DEDICATED_JOB: '100019202536'
      PR840_GENERIC_RUN: '33556711348'
      PR840_DEFECT_BROAD: '5500205108'
      PR840_DEFECT_NARROW: '5500205256'
      PR842: '842'
      PR842_HEAD: f9078f6dad760a7e41f3a44025b80abcf7d8e38d
      PR842_TREE: c1e2e91d1e1dd7db6bb88493c6e3d1bdf0285c90
      PR842_WORKFLOW_BLOB: 2b7eec4f93d37e92265698e1c09f389462ed28aa
      PR842_DEDICATED_RUN: '33557786476'
      PR842_DEDICATED_JOB: '100022727639'
      PR842_GENERIC_RUN: '33557786570'
      PR842_DEFECT_COMMENT: '5500293944'
      PR840_DEFECT_COMMENT: '5500293944'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Bind exact V13 mode and immutable predecessor ledger
        id: mode
        shell: bash
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "${{ github.event.action }}" = opened
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test "$(git rev-parse HEAD^)" = "$EVENT_BASE"
          test "$(git rev-list --count "$EVENT_BASE"..HEAD)" = 1
          git diff --name-only "$EVENT_BASE"...HEAD > changed.txt
          test "$(wc -l < changed.txt)" = 1
          CHANGED=$(cat changed.txt)
          if [ "$CHANGED" = "$INFRA_PATH" ]; then
            test "$EVENT_BASE" = "$INFRA_BASE"
            test "$EVENT_BRANCH" = "$INFRA_BRANCH"
            test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$INFRA_BASE"
            echo mode=infra >> "$GITHUB_OUTPUT"
          elif [ "$CHANGED" = "$PUBLISHER_PATH" ]; then
            test "$EVENT_BRANCH" = "$PUBLISHER_BRANCH"
            test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EVENT_BASE"
            test "$(git rev-parse "$EVENT_BASE:$INFRA_PATH")" = "$(git rev-parse "HEAD:$INFRA_PATH")"
            echo mode=publisher >> "$GITHUB_OUTPUT"
          else
            echo "unexpected review path: $CHANGED" >&2
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "$DISPATCH_BRANCH" >/dev/null 2>&1; then echo 'ordinal45 dispatch ref already exists' >&2; exit 1; fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > target-pr.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR840" > pr840.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR842" > pr842.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR840_DEDICATED_RUN" > pr840-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$PR840_DEDICATED_JOB" > pr840-job.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR840_GENERIC_RUN" > pr840-generic.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR842_DEDICATED_RUN" > pr842-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$PR842_DEDICATED_JOB" > pr842-job.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR842_GENERIC_RUN" > pr842-generic.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > issue60-pages.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/avps-v2-postconsumption-recovery4-science.yml/runs?event=workflow_dispatch&per_page=100" > science-runs.json
          python - <<'PY'
          import json,os
          def load(p): return json.load(open(p))
          target=load('target-pr.json')
          if target.get('state')!='open' or target.get('merged_at') is not None: raise SystemExit('target PR must be open/unmerged')
          if target['head']['sha']!=os.environ['EVENT_HEAD'] or target['base']['sha']!=os.environ['EVENT_BASE']: raise SystemExit('target PR identity drift')
          p840=load('pr840.json'); p842=load('pr842.json')
          if p840.get('state')!='closed' or p840.get('merged_at') is not None or p840['head']['sha']!=os.environ['PR840_HEAD'] or p840['base']['sha']!=os.environ['INFRA_BASE']: raise SystemExit('PR840 immutable identity drift')
          if p842.get('state')!='closed' or p842.get('merged_at') is not None or p842['head']['sha']!=os.environ['PR842_HEAD'] or p842['base']['sha']!=os.environ['INFRA_BASE']: raise SystemExit('PR842 immutable identity drift')
          for prefix,run_path,job_path,generic_path,head in [
            ('PR840','pr840-run.json','pr840-job.json','pr840-generic.json',os.environ['PR840_HEAD']),
            ('PR842','pr842-run.json','pr842-job.json','pr842-generic.json',os.environ['PR842_HEAD'])]:
              r=load(run_path); j=load(job_path); g=load(generic_path)
              er=int(os.environ[prefix+'_DEDICATED_RUN']); ej=int(os.environ[prefix+'_DEDICATED_JOB']); eg=int(os.environ[prefix+'_GENERIC_RUN'])
              if r['id']!=er or r['head_sha']!=head or r['run_attempt']!=1 or r['conclusion']!='failure': raise SystemExit(prefix+' dedicated evidence drift')
              if j['id']!=ej or j['run_id']!=er or j.get('conclusion')!='failure': raise SystemExit(prefix+' job evidence drift')
              if g['id']!=eg or g['head_sha']!=head or g['run_attempt']!=1 or g['conclusion']!='success': raise SystemExit(prefix+' generic evidence drift')
          comments=[c for page in load('issue60-pages.json') for c in page]
          def exact(cid,prefix,tokens):
              hits=[c for c in comments if int(c.get('id') or 0)==int(cid)]
              if len(hits)!=1: raise SystemExit(f'ledger cardinality drift {cid}')
              c=hits[0]; b=str(c.get('body') or '')
              if not b.startswith(prefix): raise SystemExit(f'ledger prefix drift {cid}')
              u=c.get('user') or {}
              if u.get('login')!='search-maker' or int(u.get('id') or 0)!=304153003 or c.get('author_association')!='OWNER': raise SystemExit(f'ledger actor drift {cid}')
              for token in tokens:
                  if token not in b: raise SystemExit(f'ledger token drift {cid}: {token}')
              if 'QUARANTINE_DOWNSTREAM=false' not in b: raise SystemExit(f'quarantine classification drift {cid}')
              return b
          base=os.environ['INFRA_BASE']; h840=os.environ['PR840_HEAD']; t840=os.environ['PR840_TREE']; wb840=os.environ['PR840_WORKFLOW_BLOB']
          common840=[f'pr=840',f'head={h840}',f'base={base}',f'tree={t840}',f'workflow_blob={wb840}',f'dedicated_run={os.environ["PR840_DEDICATED_RUN"]}',f'33556711330',f'100019202536',f'generic_run={os.environ["PR840_GENERIC_RUN"]}']
          exact(os.environ['PR840_DEFECT_BROAD'],'COORDINATOR::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_DISPATCH_CHOREOGRAPHY_REVIEW_INFRA_V11_PR840_CANONICAL_VALIDATOR_AND_FROZEN_SCIENCE_BINDING_INCOMPATIBLE',common840+['dedicated_conclusion=FAILURE','generic_conclusion=SUCCESS'])
          exact(os.environ['PR840_DEFECT_NARROW'],'COORDINATOR::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_DISPATCH_CHOREOGRAPHY_REVIEW_INFRA_V11_PR840_YAML_AMPERSAND_FALSE_POSITIVE',common840+['conclusion=FAILURE','generic_conclusion=SUCCESS'])
          h842=os.environ['PR842_HEAD']; t842=os.environ['PR842_TREE']; wb842=os.environ['PR842_WORKFLOW_BLOB']
          exact(os.environ['PR842_DEFECT_COMMENT'],'INDEPENDENT_AUDIT::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_DISPATCH_CHOREOGRAPHY_REVIEW_INFRA_V12_PR842_STALE_PREDECESSOR_GOVERNANCE_BASELINE',[f'pr=842',f'head={h842}',f'base={base}',f'tree={t842}',f'workflow_blob={wb842}',f'dedicated_run={os.environ["PR842_DEDICATED_RUN"]}',f'dedicated_job={os.environ["PR842_DEDICATED_JOB"]}','dedicated_conclusion=FAILURE',f'generic_run={os.environ["PR842_GENERIC_RUN"]}','generic_status_at_decision=IN_PROGRESS'])
          cutoff=int(os.environ['PR842_DEFECT_COMMENT'])
          for c in comments:
              cid=int(c.get('id') or 0); b=str(c.get('body') or '')
              if cid<=cutoff: continue
              if 'AVPS' in b and ('CONFIRMED_DEFECT' in b or 'QUARANTINE_DOWNSTREAM=true' in b or 'FAIL_CLOSED' in b or 'BLOCKER' in b): raise SystemExit(f'newer AVPS blocker/defect exists: {cid}')
          bodies=[str(c.get('body') or '').strip() for c in comments]
          if sum(b==os.environ['ALLOCATION_MARKER'] for b in bodies)!=1: raise SystemExit('allocation marker cardinality drift')
          if any(b.startswith(os.environ['CONSUMED_MARKER']) for b in bodies): raise SystemExit('consumed marker already exists')
          closed=set(); begins=[]
          for c in comments:
              body=str(c.get('body') or '').strip(); first=body.splitlines()[0] if body else ''; fields={}
              for token in first.replace('|',' ').split():
                  if '=' in token:
                      k,v=token.split('=',1); fields.setdefault(k,[]).append(v)
              if first.startswith('WRITE_QUIET_END'):
                  vals=[]
                  for key in ('begin','beginComment','begin_comment'):
                      for v in fields.get(key,[]):
                          if not v.isdigit(): raise SystemExit('non-numeric WRITE_QUIET_END alias')
                          vals.append(int(v))
                  if len(set(vals))>1: raise SystemExit('conflicting WRITE_QUIET_END aliases')
                  if vals: closed.add(vals[0])
              elif first.startswith('WRITE_QUIET_BEGIN'): begins.append(int(c['id']))
          unmatched=[x for x in begins if x not in closed]
          if unmatched: raise SystemExit(f'unmatched WRITE_QUIET_BEGIN blocks review: {unmatched}')
          runs=[r for page in load('science-runs.json') for r in page.get('workflow_runs',[])]
          if runs: raise SystemExit(f'prior ordinal45 science workflow_dispatch exists: {[r.get("id") for r in runs]}')
          PY
          test "$(git rev-parse "$PR840_HEAD^{tree}")" = "$PR840_TREE"
          test "$(git rev-parse "$PR840_HEAD:$INFRA_PATH")" = "$PR840_WORKFLOW_BLOB"
          test "$(git rev-parse "$PR842_HEAD^{tree}")" = "$PR842_TREE"
          test "$(git rev-parse "$PR842_HEAD:$INFRA_PATH")" = "$PR842_WORKFLOW_BLOB"
          test "$(git rev-parse "HEAD:$SCIENCE_WORKFLOW")" = "$SCIENCE_WORKFLOW_BLOB"
          test "$(git rev-parse "HEAD:$RUNTIME_ADAPTER")" = "$RUNTIME_ADAPTER_BLOB"
          test "$(git rev-parse "HEAD:$EXECUTOR")" = "$EXECUTOR_BLOB"
          test "$(git rev-parse "HEAD:$AGGREGATOR")" = "$AGGREGATOR_BLOB"
          test "$(git rev-parse "HEAD:$RUNTIME_CONTRACT")" = "$RUNTIME_CONTRACT_BLOB"

      - name: Rebuild exact V12 publisher and apply sole V13 governance cutoff
        shell: bash
        env:
          REVIEW_MODE: ${{ steps.mode.outputs.mode }}
          MODE: infra
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git show "$PR842_HEAD:$INFRA_PATH" > pr842-review.yml
          python - <<'PY'
          from pathlib import Path
          raw=Path('pr842-review.yml').read_text()
          name='Replay accepted runtime and pre-fence proofs, then build exact frozen-science-compatible publisher'
          anchor=f'      - name: {name}\n'
          a=raw.index(anchor); r=raw.index('        run: |\n',a)+len('        run: |\n')
          candidates=[x for x in (raw.find('\n      - name:',r),raw.find('\n      - uses:',r)) if x!=-1]
          e=min(candidates)
          lines=raw[r:e].splitlines()
          if not lines or any(line and not line.startswith('          ') for line in lines): raise SystemExit('V12 generator block indentation drift')
          body='\n'.join(line[10:] if line.startswith('          ') else '' for line in lines)+'\n'
          Path('v12-generator.sh').write_text(body)
          PY
          bash v12-generator.sh
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path('canonical-final-publisher.yml')
          raw=p.read_text()
          old='KNOWN_DEFECT=5500205108'; new='KNOWN_DEFECT=5500293944'
          if raw.count(old)!=1 or new in raw: raise SystemExit('V13 governance cutoff source cardinality drift')
          patched=raw.replace(old,new,1)
          p.write_text(patched)
          digest=hashlib.sha256(patched.encode()).hexdigest()
          Path('canonical-final-publisher.sha256').write_text(digest+'\n')
          if 'AVPS_V2_RECOVERY4_ORDINAL45_SNAPSHOT_' not in patched: raise SystemExit('frozen SNAPSHOT token missing')
          if 'AVPS_V2_RECOVERY4_ORDINAL45_FINAL_DISPATCH_V1_' in patched: raise SystemExit('stale fence token present')
          if '${{ github.token }}' not in patched or '${{ needs.bootstrap-lock.result }}' not in patched: raise SystemExit('literal Actions expressions missing')
          if '    if: always()\n' not in patched: raise SystemExit('fail-closed monitor cleanup missing')
          if '  queue: max\n' not in patched or '  cancel-in-progress: false\n' not in patched: raise SystemExit('publisher serialization drift')
          v12=json.load(open('publisher-closed-world-contract.json'))
          if v12.get('wholeWorkflowByteBound') is not True or v12.get('publisherCompleteExecutableSurfaceClosedWorld',True) is not True: raise SystemExit('V12 closed-world contract drift')
          v12['knownDefectBound']=5500293944
          v12['predecessorDefectComments']=[5500205108,5500205256,5500293944]
          v12['status']='PASS_EXACT_WHOLE_PUBLISHER_CLOSED_WORLD_BYTES_FROZEN_SCIENCE_AND_V13_GOVERNANCE_CUTOFF'
          v12['canonicalPublisherSha256']=digest
          Path('publisher-closed-world-contract.json').write_text(json.dumps(v12,sort_keys=True,indent=2)+'\n')
          patch={'schemaVersion':1,'oldKnownDefect':5500205108,'newKnownDefect':5500293944,'replacementCount':1,'allOtherV12CanonicalBytesPreserved':True,'canonicalPublisherSha256':digest}
          Path('v13-governance-patch.json').write_text(json.dumps(patch,sort_keys=True,indent=2)+'\n')
          if os.environ['REVIEW_MODE']=='publisher':
              actual=Path(os.environ['PUBLISHER_PATH']).read_text()
              if actual!=patched: raise SystemExit('publisher whole-workflow byte identity differs from V13 canonical reviewed bytes')
          PY

      - name: Fresh read-only one-use and repository-global state review
        shell: bash
        env:
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git show "$PR842_HEAD:$INFRA_PATH" > pr842-review.yml
          python - <<'PY'
          from pathlib import Path
          raw=Path('pr842-review.yml').read_text()
          name='Fresh read-only one-use and repository-global state review'
          anchor=f'      - name: {name}\n'
          a=raw.index(anchor); r=raw.index('        run: |\n',a)+len('        run: |\n')
          candidates=[x for x in (raw.find('\n      - name:',r),raw.find('\n      - uses:',r)) if x!=-1]
          e=min(candidates)
          lines=raw[r:e].splitlines()
          if not lines or any(line and not line.startswith('          ') for line in lines): raise SystemExit('V12 global-review block indentation drift')
          body='\n'.join(line[10:] if line.startswith('          ') else '' for line in lines)+'\n'
          body=body.replace('${{ github.event.pull_request.head.ref }}','$EVENT_BRANCH').replace('${{ github.event.pull_request.head.sha }}','$EVENT_HEAD')
          Path('v12-global-review.sh').write_text(body)
          PY
          bash v12-global-review.sh

      - name: Write zero-runtime V13 review receipt
        shell: bash
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          out={
            'schemaVersion':9,
            'status':'PASS_AVPS_V2_RECOVERY4_ORDINAL45_FINAL_DISPATCH_CHOREOGRAPHY_REVIEW_V13_ZERO_RUNTIME',
            'mode':os.environ['MODE'],'headSha':os.environ['EVENT_HEAD'],'baseSha':os.environ['EVENT_BASE'],
            'reviewerBlob':subprocess.check_output(['git','hash-object',os.environ['INFRA_PATH']],text=True).strip(),
            'changedPath':Path('changed.txt').read_text().strip(),
            'pr840BroadDefectComment':5500205108,'pr840NarrowDefectComment':5500205256,'pr842RejectedDefectComment':5500293944,
            'pr840Head':os.environ['PR840_HEAD'],'pr842Head':os.environ['PR842_HEAD'],
            'scientificOrdinal':45,'candidateSeedCanonicalSha256':os.environ['CANDIDATE_SEED_SHA256'],'candidateRowsCanonicalSha256':os.environ['CANDIDATE_ROWS_SHA256'],
            'caseCount':360,'commonRandomNumberGroupCount':72,'statesPerGroup':5,'photonHistoriesPerCase':20000000,
            'publisherWholeWorkflowByteBound':True,'publisherCompleteExecutableSurfaceClosedWorld':True,
            'frozenScienceFenceTokenPrefix':'AVPS_V2_RECOVERY4_ORDINAL45_SNAPSHOT_','sameBeginPatchRequired':True,
            'newerBlockerCutoff':5500293944,'onlyExactBoundPredecessorDefectsSuppressed':True,
            'boundedReadOnlyRepositoryGlobalRetryMaxAttempts':3,
            'canonicalPublisherSha256':Path('canonical-final-publisher.sha256').read_text().strip(),
            'dispatchCreated':False,'consumedMarkerCreated':False,'workflowDispatchPerformed':False,'solverExecutionPerformed':False,
            'resultOpeningAuthorized':False,'levelBAdmissionAuthorized':False,'holdoutOpened':False,'productionAuthorized':False,
            'taylorOrJerusalemUsed':False,'newMappingAuthorized':False
          }
          if os.environ['MODE']=='publisher': out['publisherBlob']=subprocess.check_output(['git','hash-object',os.environ['PUBLISHER_PATH']],text=True).strip()
          Path('review-receipt.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n')
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v13
          path: |
            changed.txt
            review-receipt.json
            canonical-final-publisher.yml
            canonical-final-publisher.sha256
            publisher-closed-world-contract.json
            closed-world-hostile-fixtures.json
            v13-governance-patch.json
            tracked-seed-scan.json
            repository-global-seed-scan.json
            repository-global-scan-success-attempt.txt
            final-global-scan-attempts/
          if-no-files-found: error
          compression-level: 0
