name: Review AVPS Recovery4 ordinal45 final dispatch choreography v1

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v1.yml
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1.yml

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v1-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      INFRA_BASE: de3fafa052ff1d5b2f33ec0d4347c884d560d8b6
      INFRA_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-infrastructure-v2
      INFRA_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v1.yml
      PUBLISHER_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1
      PUBLISHER_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1.yml
      CONTROL_MERGE: de3fafa052ff1d5b2f33ec0d4347c884d560d8b6
      CONTROL_REVIEW_BLOB: 9ee6d8df8c0f62870ac8ef3771efe34a7557bd7b
      CONTROL_PR: '823'
      CONTROL_HEAD: b1a0bfaaf66e69aeac86e8f879c9cddf38aa096d
      CONTROL_DEDICATED_RUN: '33520021246'
      CONTROL_DEDICATED_ARTIFACT: '9805807163'
      CONTROL_DEDICATED_DIGEST: sha256:5dc88b304f0b4693e4732210166ac5f7b550bf2240e6d4f2513dc689e5030000
      CONTROL_GENERIC_RUN: '33520020974'
      CONTROL_ACCEPT_COMMENT: '5496051102'
      POST_MERGE_GENERIC_RUN: '33524288794'
      AUTH_HEAD: 6e095b4b1603c90dcee0943295909b30cd1b374d
      AUTH_PARENT: 5685d5c313071014a94c816ee26b129f1f17a7fc
      AUTH_PR: '774'
      ALLOCATION_MARKER: ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_AUTHORIZATION_ALLOCATED_REVIEWED_NOT_DISPATCHED commit=6e095b4b1603c90dcee0943295909b30cd1b374d parent=5685d5c313071014a94c816ee26b129f1f17a7fc pr=774
      CONSUMED_MARKER: ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_DISPATCH_CONSUMED
      DISPATCH_BRANCH: dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-ordinal-45
      EXECUTION_KEY: aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4:numerical:45
      CANDIDATE_SEED_SHA256: ddded6b2d170ca2fac8d498bdba2887446c16995df0880d948fb2be00870b3de
      CANDIDATE_ROWS_SHA256: c439de417520b330c037e2628df02b6955f652563300aa5ef30477abf7661a98
      SCIENCE_WORKFLOW: .github/workflows/avps-v2-postconsumption-recovery4-science.yml
      SCIENCE_WORKFLOW_BLOB: 2d210b3a161f6889352d600fb9222c974e728034
      RUNTIME_ADAPTER: runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py
      RUNTIME_ADAPTER_BLOB: e4b690c2969fd01ecde5b08f554e47ad50b40914
      EXECUTOR: runtime-avps-v2-recovery4-ordinal45-v1/executor.py
      EXECUTOR_BLOB: 7dc38e31c19701b1a1ceef300d75105cff179290
      AGGREGATOR: runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py
      AGGREGATOR_BLOB: 6afc8b0d21c2b5553c251dc9ca5524c795ed2646
      RUNTIME_CONTRACT: runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json
      RUNTIME_CONTRACT_BLOB: 2d5f71d80b5e573b86775c2806b80dcc1fbe02f4
      SCIENCE_CONCURRENCY_GROUP: avps-v2-postconsumption-recovery4-ordinal-45-science
      PUBLISHER_ACCEPT_PREFIX: INDEPENDENT_AUDIT::ACCEPT_AVPS_ORDINAL45_FINAL_DISPATCH_PUBLISHER_V1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Bind exact review mode and direct-child identity
        id: mode
        shell: bash
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "${{ github.event.action }}" = opened
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test "$(git rev-parse HEAD^)" = "$EVENT_BASE"
          test "$(git rev-list --count "$EVENT_BASE"..HEAD)" = 1
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EVENT_BASE"
          git diff --name-only "$EVENT_BASE"...HEAD > changed.txt
          test "$(wc -l < changed.txt)" = 1
          CHANGED=$(cat changed.txt)
          if [ "$CHANGED" = "$INFRA_PATH" ]; then
            test "$EVENT_BASE" = "$INFRA_BASE"
            test "$EVENT_BRANCH" = "$INFRA_BRANCH"
            echo mode=infra >> "$GITHUB_OUTPUT"
          elif [ "$CHANGED" = "$PUBLISHER_PATH" ]; then
            test "$EVENT_BRANCH" = "$PUBLISHER_BRANCH"
            git merge-base --is-ancestor "$CONTROL_MERGE" "$EVENT_BASE"
            echo mode=publisher >> "$GITHUB_OUTPUT"
          else
            echo "unexpected review path: $CHANGED" >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > pr.json
          python - <<'PY'
          import json,os
          p=json.load(open('pr.json'))
          if p.get('state')!='open' or p.get('merged_at') is not None:
              raise SystemExit('review target must be open/unmerged')
          if p['head']['sha']!=os.environ['EVENT_HEAD'] or p['base']['sha']!=os.environ['EVENT_BASE']:
              raise SystemExit('review target identity drift')
          PY

      - name: Bind accepted control and frozen Recovery4 bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$CONTROL_MERGE" HEAD || test "${{ steps.mode.outputs.mode }}" = infra
          test "$(git rev-parse "$CONTROL_MERGE:.github/workflows/avps-v2-recovery4-ordinal45-dispatch-consumption-control-v7-review.yml")" = "$CONTROL_REVIEW_BLOB"
          test "$(git rev-parse "HEAD:$SCIENCE_WORKFLOW")" = "$SCIENCE_WORKFLOW_BLOB"
          test "$(git rev-parse "HEAD:$RUNTIME_ADAPTER")" = "$RUNTIME_ADAPTER_BLOB"
          test "$(git rev-parse "HEAD:$EXECUTOR")" = "$EXECUTOR_BLOB"
          test "$(git rev-parse "HEAD:$AGGREGATOR")" = "$AGGREGATOR_BLOB"
          test "$(git rev-parse "HEAD:$RUNTIME_CONTRACT")" = "$RUNTIME_CONTRACT_BLOB"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CONTROL_DEDICATED_RUN" > control-dedicated.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CONTROL_DEDICATED_ARTIFACT" > control-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CONTROL_GENERIC_RUN" > control-generic.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$POST_MERGE_GENERIC_RUN" > post-merge-generic.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > issue60-pages.json
          python - <<'PY'
          import json,os
          d=json.load(open('control-dedicated.json')); a=json.load(open('control-artifact.json')); g=json.load(open('control-generic.json')); p=json.load(open('post-merge-generic.json'))
          if d['id']!=int(os.environ['CONTROL_DEDICATED_RUN']) or d['head_sha']!=os.environ['CONTROL_HEAD'] or d['run_attempt']!=1 or d['conclusion']!='success': raise SystemExit('v7 dedicated review drift')
          if a['id']!=int(os.environ['CONTROL_DEDICATED_ARTIFACT']) or a.get('digest')!=os.environ['CONTROL_DEDICATED_DIGEST'] or a.get('expired'): raise SystemExit('v7 artifact drift')
          if g['id']!=int(os.environ['CONTROL_GENERIC_RUN']) or g['head_sha']!=os.environ['CONTROL_HEAD'] or g['run_attempt']!=1 or g['conclusion']!='success': raise SystemExit('v7 generic review drift')
          if p['id']!=int(os.environ['POST_MERGE_GENERIC_RUN']) or p['head_sha']!=os.environ['CONTROL_MERGE'] or p['run_attempt']!=1 or p['conclusion']!='success': raise SystemExit('v7 post-merge generic drift')
          pages=json.load(open('issue60-pages.json')); comments=[c for page in pages for c in page]
          hit=[c for c in comments if int(c.get('id') or 0)==int(os.environ['CONTROL_ACCEPT_COMMENT'])]
          if len(hit)!=1 or not str(hit[0].get('body') or '').startswith('INDEPENDENT_AUDIT::ACCEPT_AVPS_ORDINAL45_DISPATCH_CONSUMPTION_CONTROL_V7'):
              raise SystemExit('v7 Independent Audit acceptance drift')
          PY

      - name: Prove reviewer infrastructure is solver-free and non-authorizing
        if: steps.mode.outputs.mode == 'infra'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v1.yml')
          s=p.read_text()
          required=(
            'permissions:\n  contents: read\n  actions: read\n  issues: read\n  pull-requests: read',
            'SCIENCE_CONCURRENCY_GROUP: avps-v2-postconsumption-recovery4-ordinal-45-science',
            'PUBLISHER_ACCEPT_PREFIX: INDEPENDENT_AUDIT::ACCEPT_AVPS_ORDINAL45_FINAL_DISPATCH_PUBLISHER_V1',
            "'sameCommentScienceRunBindingRequired':True",
            'bootstrap-lock',
            'monitor-fence',
          )
          for token in required:
              if token not in s: raise SystemExit(f'missing reviewer contract token: {token}')
          for line in s.splitlines():
              stripped=line.strip()
              if stripped.startswith('gh api --method POST ') or stripped.startswith('gh api --method PATCH ') or stripped.startswith('uvspec ') or stripped.startswith('libRadtran '):
                  raise SystemExit(f'reviewer contains executable mutation/runtime command: {stripped}')
          PY

      - name: Review exact final publisher choreography
        if: steps.mode.outputs.mode == 'publisher'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1.yml').read_text()
          required=(
            'name: AVPS v2 Recovery4 ordinal45 final one-use dispatch publisher v1',
            'workflow_dispatch:',
            'bootstrap-lock:',
            'monitor-fence:',
            'concurrency:\n      group: avps-v2-postconsumption-recovery4-ordinal-45-science\n      cancel-in-progress: false',
            'needs: bootstrap-lock',
            'WRITE_QUIET_BEGIN',
            'science_run=PENDING',
            'gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$FENCE_BEGIN"',
            'science_run=$SCIENCE_RUN',
            'Fresh repository-global candidate-seed recheck and one-use guard',
            'WRITE_QUIET_END',
            'INDEPENDENT_AUDIT::ACCEPT_AVPS_ORDINAL45_FINAL_DISPATCH_PUBLISHER_V1',
            'repository_global_seed_scan.py',
            'latestConsumedOrDispatchedScientificOrdinal',
            'maxObservedScientificOrdinal',
            'ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_DISPATCH_CONSUMED',
            'actions/workflows/avps-v2-postconsumption-recovery4-science.yml/dispatches',
          )
          for token in required:
              if token not in s: raise SystemExit(f'missing final-publisher invariant: {token}')
          if s.count('group: avps-v2-postconsumption-recovery4-ordinal-45-science') != 1:
              raise SystemExit('science concurrency lock must occur exactly once in publisher')
          begin=s.find('WRITE_QUIET_BEGIN')
          ref=s.find('git/refs',begin)
          consumed=s.find('ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_DISPATCH_CONSUMED',begin)
          dispatch=s.find('actions/workflows/avps-v2-postconsumption-recovery4-science.yml/dispatches',begin)
          patch=s.find('issues/comments/$FENCE_BEGIN',dispatch)
          exact=s.find('science_run=$SCIENCE_RUN',patch)
          if min(begin,ref,consumed,dispatch,patch,exact)<0 or not (begin<ref and begin<consumed and ref<dispatch and consumed<dispatch and dispatch<patch and patch<exact):
              raise SystemExit('BEGIN/bootstrap/dispatch/same-comment-binding causal order drift')
          for bad in ('newMappingAuthorized=true','resultOpeningAuthorized=true','Taylor','Jerusalem','gh run rerun','rerun-failed-jobs'):
              if bad in s: raise SystemExit(f'forbidden final-publisher token: {bad}')
          PY
          test "$(git diff --name-only HEAD^...HEAD)" = "$PUBLISHER_PATH"
          test "$(git hash-object "$SCIENCE_WORKFLOW")" = "$SCIENCE_WORKFLOW_BLOB"

      - name: Fresh read-only one-use and repository-global state review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$DISPATCH_BRANCH" >/dev/null 2>&1; then echo 'ordinal45 dispatch ref already exists' >&2; exit 1; fi
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > final-issue60-pages.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/avps-v2-postconsumption-recovery4-science.yml/runs?event=workflow_dispatch&per_page=100" > final-science-runs.json
          python - <<'PY'
          import json,os
          pages=json.load(open('final-issue60-pages.json')); comments=[c for p in pages for c in p]
          bodies=[str(c.get('body') or '').strip() for c in comments]
          if sum(b==os.environ['ALLOCATION_MARKER'] for b in bodies)!=1: raise SystemExit('ordinal45 allocation marker cardinality drift')
          if sum(b.startswith(os.environ['CONSUMED_MARKER']) for b in bodies)!=0: raise SystemExit('ordinal45 consumed marker already exists')
          pages=json.load(open('final-science-runs.json')); runs=[r for p in pages for r in p.get('workflow_runs',[])]
          if runs: raise SystemExit(f'ordinal45 science workflow_dispatch already exists: {[r.get("id") for r in runs]}')
          closed=set(); begins=[]
          for c in comments:
              body=str(c.get('body') or '').strip(); first=body.splitlines()[0] if body else ''
              fields={}
              for token in first.replace('|',' ').split():
                  if '=' in token:
                      k,v=token.split('=',1); fields.setdefault(k,[]).append(v)
              if first.startswith('WRITE_QUIET_END'):
                  vals=[]
                  for key in ('begin','beginComment','begin_comment'):
                      for v in fields.get(key,[]):
                          if not v.isdigit(): raise SystemExit(f'non-numeric WRITE_QUIET_END alias: {v!r}')
                          vals.append(int(v))
                  if len(set(vals))>1: raise SystemExit(f'conflicting WRITE_QUIET_END aliases: {vals}')
                  if vals: closed.add(vals[0])
              elif first.startswith('WRITE_QUIET_BEGIN'):
                  begins.append(int(c['id']))
          unmatched=[x for x in begins if x not in closed]
          if unmatched: raise SystemExit(f'unmatched WRITE_QUIET_BEGIN blocks review: {unmatched}')
          PY
          git ls-files -z > tracked-files.nul
          git show "$AUTH_HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-authorization-control-v1/authorization.json" > authorization.json
          python review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-science-transport-v1/native_authorization_seed_transport.py \
            --repo-root . --authorization-head "$AUTH_HEAD" --authorization-parent "$AUTH_PARENT" \
            --authorization-ledger-path review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-seed-global-control-v1/seed_ledger.py \
            --authorization-ledger-blob 16af5c68ae7e3cfc0cfbef4c8e2022517bf2ae91 \
            --candidate-seed-sha256 "$CANDIDATE_SEED_SHA256" --candidate-rows-sha256 "$CANDIDATE_ROWS_SHA256" \
            --historical-head e627a689ada0493a8a5b9cdafc4aba0198fbabec \
            --historical-ledger-path review/aerosol-vertical-profile-sensitivity-v2-postconsumption-seed-freshness-v1/seed_ledger.py \
            --historical-ledger-blob 491d1b6653bea0fcc5275269723a76aa1af52300 \
            --work-root candidate-transport --output-ledger candidate-seed-ledger.json --output-context candidate-context.json
          printf '{"schemaVersion":2,"requiredTrackedSelfLedgerPaths":[],"futureEvidenceSelfLedgerPaths":[]}\n' > empty-self-ledger.json
          python review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/tracked_tree_seed_scan.py --repo-root . --file-list tracked-files.nul --candidate-seed-ledger candidate-seed-ledger.json --allow-self-ledger-json empty-self-ledger.json --output tracked-seed-scan.json
          python review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/repository_global_seed_scan.py --repository "$GITHUB_REPOSITORY" --issue-number 60 --candidate-seed-ledger candidate-seed-ledger.json --current-run-id "$GITHUB_RUN_ID" --audit-mode authorization-recheck --expected-branch-name "${{ github.event.pull_request.head.ref }}" --expected-repo-head "${{ github.event.pull_request.head.sha }}" --output repository-global-seed-scan.json
          python - <<'PY'
          import json
          t=json.load(open('tracked-seed-scan.json')); g=json.load(open('repository-global-seed-scan.json'))
          if t.get('trackedTreeExternalCollisionCount')!=0: raise SystemExit('tracked candidate seed collision')
          if g.get('repositoryGlobalCollisionCount',g.get('collisionCount'))!=0: raise SystemExit('repository-global candidate seed collision')
          PY

      - name: Write zero-runtime review receipt
        shell: bash
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          changed=Path('changed.txt').read_text().strip()
          out={
            'schemaVersion':1,
            'status':'PASS_AVPS_V2_RECOVERY4_ORDINAL45_FINAL_DISPATCH_CHOREOGRAPHY_REVIEW_ZERO_RUNTIME',
            'mode':os.environ['MODE'],
            'headSha':os.environ['EVENT_HEAD'],
            'baseSha':os.environ['EVENT_BASE'],
            'changedPath':changed,
            'controlMerge':os.environ['CONTROL_MERGE'],
            'controlAcceptanceComment':int(os.environ['CONTROL_ACCEPT_COMMENT']),
            'scientificOrdinal':45,
            'candidateSeedCanonicalSha256':os.environ['CANDIDATE_SEED_SHA256'],
            'candidateRowsCanonicalSha256':os.environ['CANDIDATE_ROWS_SHA256'],
            'caseCount':360,
            'commonRandomNumberGroupCount':72,
            'statesPerGroup':5,
            'photonHistoriesPerCase':20000000,
            'dispatchCreated':False,
            'consumedMarkerCreated':False,
            'workflowDispatchPerformed':False,
            'solverExecutionPerformed':False,
            'resultOpeningAuthorized':False,
            'levelBAdmissionAuthorized':False,
            'holdoutOpened':False,
            'productionAuthorized':False,
            'taylorOrJerusalemUsed':False,
            'newMappingAuthorized':False,
            'sameCommentScienceRunBindingRequired':True,
            'publisherMustHoldScienceConcurrencyUntilBinding':True,
          }
          if os.environ['MODE']=='publisher':
              out['publisherBlob']=subprocess.check_output(['git','hash-object',os.environ['PUBLISHER_PATH']],text=True).strip()
          Path('review-receipt.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v1
          path: |
            changed.txt
            review-receipt.json
            tracked-seed-scan.json
            repository-global-seed-scan.json
          if-no-files-found: error
          compression-level: 0
