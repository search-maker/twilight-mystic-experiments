name: Review AVPS Recovery4 ordinal45 final dispatch choreography v1

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v1.yml
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1.yml

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v1-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      INFRA_BASE: de3fafa052ff1d5b2f33ec0d4347c884d560d8b6
      INFRA_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-infrastructure-v10
      INFRA_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v1.yml
      PUBLISHER_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1
      PUBLISHER_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1.yml
      CONTROL_MERGE: de3fafa052ff1d5b2f33ec0d4347c884d560d8b6
      CONTROL_REVIEW_BLOB: 9ee6d8df8c0f62870ac8ef3771efe34a7557bd7b
      CONTROL_HEAD: b1a0bfaaf66e69aeac86e8f879c9cddf38aa096d
      CONTROL_DEDICATED_RUN: '33520021246'
      CONTROL_DEDICATED_ARTIFACT: '9805807163'
      CONTROL_DEDICATED_DIGEST: sha256:5dc88b304f0b4693e4732210166ac5f7b550bf2240e6d4f2513dc689e5030000
      CONTROL_GENERIC_RUN: '33520020974'
      CONTROL_ACCEPT_COMMENT: '5496051102'
      POST_MERGE_GENERIC_RUN: '33524288794'
      REJECTED_PREFENCE_PR: '832'
      REJECTED_PREFENCE_HEAD: 98b8ed4c1c5d62550ec6834e18caa2b24aec1cae
      REJECTED_PREFENCE_TREE: a0fc27187c6d0b7bbe8ea4955ab562db5ec7dfc8
      REJECTED_PREFENCE_WORKFLOW_BLOB: 4cd012b625ae3e180d6c19de2196776163a8a53f
      REJECTED_PREFENCE_RUN: '33544454737'
      REJECTED_PREFENCE_JOB: '99978397284'
      REJECTED_PREFENCE_ARTIFACT: '9815192498'
      REJECTED_PREFENCE_DIGEST: sha256:fa657b6a3ab69ded4d7e3a180195a41ae3816e4bfa9e8fce48c02dbd8a123302
      REJECTED_PREFENCE_GENERIC_RUN: '33544454539'
      REJECTED_PREFENCE_DEFECT_COMMENT: '5498713878'
      AUTH_HEAD: 6e095b4b1603c90dcee0943295909b30cd1b374d
      AUTH_PARENT: 5685d5c313071014a94c816ee26b129f1f17a7fc
      ALLOCATION_MARKER: ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_AUTHORIZATION_ALLOCATED_REVIEWED_NOT_DISPATCHED commit=6e095b4b1603c90dcee0943295909b30cd1b374d parent=5685d5c313071014a94c816ee26b129f1f17a7fc pr=774
      CONSUMED_MARKER: ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_DISPATCH_CONSUMED
      DISPATCH_BRANCH: dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-ordinal-45
      CANDIDATE_SEED_SHA256: ddded6b2d170ca2fac8d498bdba2887446c16995df0880d948fb2be00870b3de
      CANDIDATE_ROWS_SHA256: c439de417520b330c037e2628df02b6955f652563300aa5ef30477abf7661a98
      SCIENCE_WORKFLOW: .github/workflows/avps-v2-postconsumption-recovery4-science.yml
      SCIENCE_WORKFLOW_BLOB: 2d210b3a161f6889352d600fb9222c974e728034
      RUNTIME_ADAPTER: runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py
      RUNTIME_ADAPTER_BLOB: e4b690c2969fd01ecde5b08f554e47ad50b40914
      EXECUTOR: runtime-avps-v2-recovery4-ordinal45-v1/executor.py
      EXECUTOR_BLOB: 7dc38e31c19701b1a1ceef300d75105cff179290
      AGGREGATOR: runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py
      AGGREGATOR_BLOB: 6afc8b0d21c2b5553c251dc9ca5524c795ed2646
      RUNTIME_CONTRACT: runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json
      RUNTIME_CONTRACT_BLOB: 2d5f71d80b5e573b86775c2806b80dcc1fbe02f4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Bind exact review mode and direct-child identity
        id: mode
        shell: bash
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "${{ github.event.action }}" = opened
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test "$(git rev-parse HEAD^)" = "$EVENT_BASE"
          test "$(git rev-list --count "$EVENT_BASE"..HEAD)" = 1
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EVENT_BASE"
          git diff --name-only "$EVENT_BASE"...HEAD > changed.txt
          test "$(wc -l < changed.txt)" = 1
          CHANGED=$(cat changed.txt)
          if [ "$CHANGED" = "$INFRA_PATH" ]; then
            test "$EVENT_BASE" = "$INFRA_BASE"
            test "$EVENT_BRANCH" = "$INFRA_BRANCH"
            echo mode=infra >> "$GITHUB_OUTPUT"
          elif [ "$CHANGED" = "$PUBLISHER_PATH" ]; then
            test "$EVENT_BRANCH" = "$PUBLISHER_BRANCH"
            test "$(git rev-parse "$EVENT_BASE:$INFRA_PATH")" = "$(git rev-parse "HEAD:$INFRA_PATH")"
            git merge-base --is-ancestor "$CONTROL_MERGE" "$EVENT_BASE"
            echo mode=publisher >> "$GITHUB_OUTPUT"
          else
            echo "unexpected review path: $CHANGED" >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > pr.json
          python - <<'PY'
          import json,os
          p=json.load(open('pr.json'))
          if p.get('state')!='open' or p.get('merged_at') is not None: raise SystemExit('review target must be open/unmerged')
          if p['head']['sha']!=os.environ['EVENT_HEAD'] or p['base']['sha']!=os.environ['EVENT_BASE']: raise SystemExit('review target identity drift')
          PY

      - name: Bind accepted V7 control and exact rejected PR832 evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse "$CONTROL_MERGE:.github/workflows/avps-v2-recovery4-ordinal45-dispatch-consumption-control-v7-review.yml")" = "$CONTROL_REVIEW_BLOB"
          test "$(git rev-parse "HEAD:$SCIENCE_WORKFLOW")" = "$SCIENCE_WORKFLOW_BLOB"
          test "$(git rev-parse "HEAD:$RUNTIME_ADAPTER")" = "$RUNTIME_ADAPTER_BLOB"
          test "$(git rev-parse "HEAD:$EXECUTOR")" = "$EXECUTOR_BLOB"
          test "$(git rev-parse "HEAD:$AGGREGATOR")" = "$AGGREGATOR_BLOB"
          test "$(git rev-parse "HEAD:$RUNTIME_CONTRACT")" = "$RUNTIME_CONTRACT_BLOB"
          test "$(git rev-parse "$REJECTED_PREFENCE_HEAD^{tree}")" = "$REJECTED_PREFENCE_TREE"
          test "$(git rev-parse "$REJECTED_PREFENCE_HEAD:$INFRA_PATH")" = "$REJECTED_PREFENCE_WORKFLOW_BLOB"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CONTROL_DEDICATED_RUN" > control-dedicated.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CONTROL_DEDICATED_ARTIFACT" > control-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CONTROL_GENERIC_RUN" > control-generic.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$POST_MERGE_GENERIC_RUN" > post-merge-generic.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/$REJECTED_PREFENCE_PR" > rejected-pr.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REJECTED_PREFENCE_RUN" > rejected-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$REJECTED_PREFENCE_JOB" > rejected-job.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$REJECTED_PREFENCE_ARTIFACT" > rejected-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REJECTED_PREFENCE_GENERIC_RUN" > rejected-generic.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > issue60-pages.json
          python - <<'PY'
          import json,os
          d=json.load(open('control-dedicated.json')); a=json.load(open('control-artifact.json')); g=json.load(open('control-generic.json')); pm=json.load(open('post-merge-generic.json'))
          rp=json.load(open('rejected-pr.json')); rr=json.load(open('rejected-run.json')); rj=json.load(open('rejected-job.json')); ra=json.load(open('rejected-artifact.json')); rg=json.load(open('rejected-generic.json'))
          if d['id']!=int(os.environ['CONTROL_DEDICATED_RUN']) or d['head_sha']!=os.environ['CONTROL_HEAD'] or d['run_attempt']!=1 or d['conclusion']!='success': raise SystemExit('V7 dedicated evidence drift')
          if a['id']!=int(os.environ['CONTROL_DEDICATED_ARTIFACT']) or a.get('digest')!=os.environ['CONTROL_DEDICATED_DIGEST'] or a.get('expired'): raise SystemExit('V7 artifact drift')
          if g['id']!=int(os.environ['CONTROL_GENERIC_RUN']) or g['head_sha']!=os.environ['CONTROL_HEAD'] or g['run_attempt']!=1 or g['conclusion']!='success': raise SystemExit('V7 generic evidence drift')
          if pm['id']!=int(os.environ['POST_MERGE_GENERIC_RUN']) or pm['head_sha']!=os.environ['CONTROL_MERGE'] or pm['run_attempt']!=1 or pm['conclusion']!='success': raise SystemExit('V7 post-merge evidence drift')
          if rp.get('state')!='closed' or rp.get('merged_at') is not None or rp['head']['sha']!=os.environ['REJECTED_PREFENCE_HEAD'] or rp['base']['sha']!=os.environ['INFRA_BASE']: raise SystemExit('PR832 must remain exact closed/unmerged evidence')
          if rr['id']!=int(os.environ['REJECTED_PREFENCE_RUN']) or rr['head_sha']!=os.environ['REJECTED_PREFENCE_HEAD'] or rr['run_attempt']!=1 or rr['conclusion']!='success': raise SystemExit('PR832 dedicated evidence drift')
          if rj['id']!=int(os.environ['REJECTED_PREFENCE_JOB']) or rj['run_id']!=int(os.environ['REJECTED_PREFENCE_RUN']) or rj.get('conclusion')!='success': raise SystemExit('PR832 job evidence drift')
          if ra['id']!=int(os.environ['REJECTED_PREFENCE_ARTIFACT']) or ra.get('digest')!=os.environ['REJECTED_PREFENCE_DIGEST'] or ra.get('expired'): raise SystemExit('PR832 artifact drift')
          if rg['id']!=int(os.environ['REJECTED_PREFENCE_GENERIC_RUN']) or rg['head_sha']!=os.environ['REJECTED_PREFENCE_HEAD'] or rg['run_attempt']!=1 or rg['conclusion']!='success': raise SystemExit('PR832 generic evidence drift')
          pages=json.load(open('issue60-pages.json')); comments=[c for page in pages for c in page]
          def exact(cid,prefix):
              hit=[c for c in comments if int(c.get('id') or 0)==int(cid)]
              if len(hit)!=1 or not str(hit[0].get('body') or '').startswith(prefix): raise SystemExit(f'ledger checkpoint drift: {cid}')
              return str(hit[0].get('body') or '')
          exact(os.environ['CONTROL_ACCEPT_COMMENT'],'INDEPENDENT_AUDIT::ACCEPT_AVPS_ORDINAL45_DISPATCH_CONSUMPTION_CONTROL_V7')
          defect=exact(os.environ['REJECTED_PREFENCE_DEFECT_COMMENT'],'INDEPENDENT_AUDIT::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_DISPATCH_CHOREOGRAPHY_REVIEW_INFRA_V9_PR832_PRE_FENCE_MUTATION_SURFACE_UNBOUND')
          if 'QUARANTINE_DOWNSTREAM=false' not in defect: raise SystemExit('PR832 quarantine classification drift')
          for c in comments:
              if int(c.get('id') or 0)<=int(os.environ['REJECTED_PREFENCE_DEFECT_COMMENT']): continue
              b=str(c.get('body') or '')
              if 'AVPS' in b and ('CONFIRMED_DEFECT' in b or 'QUARANTINE_DOWNSTREAM=true' in b or 'FAIL_CLOSED' in b or 'BLOCKER' in b): raise SystemExit(f'newer AVPS blocker/defect exists: {c.get("id")}')
          PY

      - name: Replay immutable PR832 runtime and choreography protections
        shell: bash
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          git show "$REJECTED_PREFENCE_HEAD:$INFRA_PATH" > predecessor-review.yml
          test "$(git hash-object predecessor-review.yml)" = "$REJECTED_PREFENCE_WORKFLOW_BLOB"
          python - <<'PY'
          from pathlib import Path
          import textwrap
          raw=Path('predecessor-review.yml').read_text()
          def extract(name):
              anchor=f'      - name: {name}\n'
              a=raw.index(anchor)
              p=raw.index("          python - <<'PY'\n",a)+len("          python - <<'PY'\n")
              e=raw.index("\n          PY",p)
              return textwrap.dedent(raw[p:e])+"\n"
          Path('predecessor-semantic.py').write_text(extract('Execute semantic publisher guard and whole-step runtime proof'))
          Path('predecessor-choreography.py').write_text(extract('Review exact final publisher choreography'))
          PY
          MODE="$MODE" PUBLISHER_PATH="$PUBLISHER_PATH" python predecessor-semantic.py
          if [ "$MODE" = publisher ]; then
            PUBLISHER_PATH="$PUBLISHER_PATH" python predecessor-choreography.py
            test "$(git diff --name-only HEAD^...HEAD)" = "$PUBLISHER_PATH"
            test "$(git hash-object "$SCIENCE_WORKFLOW")" = "$SCIENCE_WORKFLOW_BLOB"
          fi

      - name: Prove full pre-fence sequence and global mutation inventory
        shell: bash
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,re,textwrap
          from pathlib import Path

          class ContractError(RuntimeError): pass
          def req(ok,msg):
              if not ok: raise ContractError(msg)

          token_expr='$'+'{{ github.token }}'
          sha_expr='$'+'{{ github.sha }}'
          canonical_checkout=(
              '      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1\n'
              '        with:\n'
              f'          ref: {sha_expr}\n'
              '          fetch-depth: 0\n'
              '          persist-credentials: false\n\n'
          )
          prefence_body=textwrap.dedent(r'''
          # BEGIN_CANONICAL_AVPS_ORDINAL45_PREFENCE_V1
          import json,os,subprocess,time
          from pathlib import Path
          REPO=os.environ['GITHUB_REPOSITORY']
          AUTH_HEAD='6e095b4b1603c90dcee0943295909b30cd1b374d'
          AUTH_PARENT='5685d5c313071014a94c816ee26b129f1f17a7fc'
          ALLOCATION_MARKER='ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_AUTHORIZATION_ALLOCATED_REVIEWED_NOT_DISPATCHED commit=6e095b4b1603c90dcee0943295909b30cd1b374d parent=5685d5c313071014a94c816ee26b129f1f17a7fc pr=774'
          CONSUMED_MARKER='ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_DISPATCH_CONSUMED'
          DISPATCH_BRANCH='dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-ordinal-45'
          SEED_SHA='ddded6b2d170ca2fac8d498bdba2887446c16995df0880d948fb2be00870b3de'
          ROWS_SHA='c439de417520b330c037e2628df02b6955f652563300aa5ef30477abf7661a98'
          KNOWN_DEFECT=5498713878
          def run(cmd,**kw):
              cp=subprocess.run(cmd,text=True,capture_output=True,**kw)
              if cp.returncode!=0: raise SystemExit(f'command failed rc={cp.returncode} cmd={cmd!r} stderr={cp.stderr.strip()}')
              return cp
          def gh_pages(endpoint):
              cp=run(['/usr/bin/gh','api','--hostname','github.com','--paginate','--slurp',endpoint])
              try: pages=json.loads(cp.stdout)
              except Exception as e: raise SystemExit(f'GitHub API JSON drift: {e}')
              if not isinstance(pages,list): raise SystemExit('GitHub API pagination drift')
              return pages
          def state_check():
              ref=subprocess.run(['/usr/bin/git','ls-remote','--exit-code','--heads','origin',DISPATCH_BRANCH],text=True,capture_output=True)
              if ref.returncode==0: raise SystemExit('ordinal45 dispatch ref already exists')
              if ref.returncode not in (0,2): raise SystemExit(f'dispatch ref read failure: {ref.stderr.strip()}')
              comments=[c for p in gh_pages(f'repos/{REPO}/issues/60/comments?per_page=100') for c in p]
              bodies=[str(c.get('body') or '').strip() for c in comments]
              if sum(b==ALLOCATION_MARKER for b in bodies)!=1: raise SystemExit('ordinal45 allocation marker cardinality drift')
              if any(b.startswith(CONSUMED_MARKER) for b in bodies): raise SystemExit('ordinal45 consumed marker already exists')
              runs=[r for p in gh_pages(f'repos/{REPO}/actions/workflows/avps-v2-postconsumption-recovery4-science.yml/runs?event=workflow_dispatch&per_page=100') for r in p.get('workflow_runs',[])]
              if runs: raise SystemExit(f'ordinal45 science workflow_dispatch already exists: {[r.get("id") for r in runs]}')
              closed=set(); begins=[]
              for c in comments:
                  body=str(c.get('body') or '').strip(); first=body.splitlines()[0] if body else ''; fields={}
                  for tok in first.replace('|',' ').split():
                      if '=' in tok:
                          k,v=tok.split('=',1); fields.setdefault(k,[]).append(v)
                  if first.startswith('WRITE_QUIET_END'):
                      vals=[]
                      for key in ('begin','beginComment','begin_comment'):
                          for v in fields.get(key,[]):
                              if not v.isdigit(): raise SystemExit(f'non-numeric WRITE_QUIET_END alias: {v!r}')
                              vals.append(int(v))
                      if len(set(vals))>1: raise SystemExit(f'conflicting WRITE_QUIET_END aliases: {vals}')
                      if vals: closed.add(vals[0])
                  elif first.startswith('WRITE_QUIET_BEGIN'): begins.append(int(c['id']))
                  if int(c.get('id') or 0)>KNOWN_DEFECT:
                      b=str(c.get('body') or '')
                      if 'AVPS' in b and ('CONFIRMED_DEFECT' in b or 'QUARANTINE_DOWNSTREAM=true' in b or 'FAIL_CLOSED' in b or 'BLOCKER' in b): raise SystemExit(f'newer AVPS blocker/defect exists: {c.get("id")}')
              unmatched=[x for x in begins if x not in closed]
              if unmatched: raise SystemExit(f'unmatched WRITE_QUIET_BEGIN blocks publisher: {unmatched}')
          state_check()
          Path('tracked-files.nul').write_bytes(run(['/usr/bin/git','ls-files','-z']).stdout.encode())
          Path('authorization.json').write_text(run(['/usr/bin/git','show',AUTH_HEAD+':review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-authorization-control-v1/authorization.json']).stdout)
          run(['/usr/bin/python3','review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-science-transport-v1/native_authorization_seed_transport.py','--repo-root','.','--authorization-head',AUTH_HEAD,'--authorization-parent',AUTH_PARENT,'--authorization-ledger-path','review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-seed-global-control-v1/seed_ledger.py','--authorization-ledger-blob','16af5c68ae7e3cfc0cfbef4c8e2022517bf2ae91','--candidate-seed-sha256',SEED_SHA,'--candidate-rows-sha256',ROWS_SHA,'--historical-head','e627a689ada0493a8a5b9cdafc4aba0198fbabec','--historical-ledger-path','review/aerosol-vertical-profile-sensitivity-v2-postconsumption-seed-freshness-v1/seed_ledger.py','--historical-ledger-blob','491d1b6653bea0fcc5275269723a76aa1af52300','--work-root','candidate-transport','--output-ledger','candidate-seed-ledger.json','--output-context','candidate-context.json'])
          Path('empty-self-ledger.json').write_text('{"schemaVersion":2,"requiredTrackedSelfLedgerPaths":[],"futureEvidenceSelfLedgerPaths":[]}\n')
          run(['/usr/bin/python3','review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/tracked_tree_seed_scan.py','--repo-root','.','--file-list','tracked-files.nul','--candidate-seed-ledger','candidate-seed-ledger.json','--allow-self-ledger-json','empty-self-ledger.json','--output','tracked-seed-scan.json'])
          if json.load(open('tracked-seed-scan.json')).get('trackedTreeExternalCollisionCount')!=0: raise SystemExit('tracked candidate seed collision')
          Path('publisher-global-scan-attempts').mkdir(exist_ok=True)
          success=False
          for n in range(1,4):
              out=f'publisher-global-scan-attempts/report-{n}.json'
              cp=subprocess.run(['/usr/bin/python3','review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/repository_global_seed_scan.py','--repository',REPO,'--issue-number','60','--candidate-seed-ledger','candidate-seed-ledger.json','--current-run-id',os.environ['GITHUB_RUN_ID'],'--audit-mode','authorization-recheck','--expected-branch-name','main','--expected-repo-head',os.environ['GITHUB_SHA'],'--output',out],text=True,capture_output=True)
              Path(f'publisher-global-scan-attempts/stdout-{n}.txt').write_text(cp.stdout)
              Path(f'publisher-global-scan-attempts/stderr-{n}.txt').write_text(cp.stderr)
              if cp.returncode==0:
                  Path('repository-global-seed-scan.json').write_text(Path(out).read_text()); Path('repository-global-scan-success-attempt.txt').write_text(str(n)+'\n'); success=True; break
              if 'snapshot-fenced repository-global metadata changed between two complete enumerations' not in cp.stderr: raise SystemExit(f'non-retryable repository-global scan failure attempt={n}: {cp.stderr.strip()}')
              if n==3: break
              time.sleep(n*5)
          if not success: raise SystemExit('repository-global scan remained unstable across three fresh complete attempts')
          g=json.load(open('repository-global-seed-scan.json'))
          if g.get('repositoryGlobalCollisionCount',g.get('collisionCount'))!=0: raise SystemExit('repository-global candidate seed collision')
          if g.get('repositoryGlobalDoubleEnumerationStable') is not True: raise SystemExit('repository-global enumeration not stable')
          if g.get('auditedBranchHeadMatchesRepositoryHead') is not True: raise SystemExit('audited branch/head mismatch')
          if int(g.get('repositoryGlobalPostFenceCandidateSeedCollisionCount',0) or 0)!=0: raise SystemExit('post-fence candidate-seed collision')
          state_check()
          token='AVPS_V2_RECOVERY4_ORDINAL45_FINAL_DISPATCH_V1_'+os.environ['GITHUB_RUN_ID']
          body=f'WRITE_QUIET_BEGIN | AVPS_V2_RECOVERY4_ORDINAL45_FINAL_DISPATCH_V1 | token={token} | authorization={AUTH_HEAD} | dispatch={DISPATCH_BRANCH} | science_run=PENDING | guard=repository-global-seed-scan.json'
          cp=run(['/usr/bin/gh','api','--hostname','github.com','--method','POST',f'repos/{REPO}/issues/60/comments','-f',f'body={body}'])
