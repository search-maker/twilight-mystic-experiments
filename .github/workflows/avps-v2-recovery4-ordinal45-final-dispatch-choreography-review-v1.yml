name: Review AVPS Recovery4 ordinal45 final dispatch choreography v1

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v1.yml
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1.yml

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v1-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      INFRA_BASE: de3fafa052ff1d5b2f33ec0d4347c884d560d8b6
      INFRA_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-infrastructure-v5
      INFRA_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v1.yml
      PUBLISHER_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1
      PUBLISHER_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1.yml
      PUBLISHER_CONCURRENCY_GROUP: avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1
      PUBLISHER_WORKFLOW_NAME: avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1.yml
      PUBLISHER_WORKFLOW_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1.yml
      CONTROL_MERGE: de3fafa052ff1d5b2f33ec0d4347c884d560d8b6
      CONTROL_REVIEW_BLOB: 9ee6d8df8c0f62870ac8ef3771efe34a7557bd7b
      CONTROL_PR: '823'
      CONTROL_HEAD: b1a0bfaaf66e69aeac86e8f879c9cddf38aa096d
      CONTROL_DEDICATED_RUN: '33520021246'
      CONTROL_DEDICATED_ARTIFACT: '9805807163'
      CONTROL_DEDICATED_DIGEST: sha256:5dc88b304f0b4693e4732210166ac5f7b550bf2240e6d4f2513dc689e5030000
      CONTROL_GENERIC_RUN: '33520020974'
      CONTROL_ACCEPT_COMMENT: '5496051102'
      POST_MERGE_GENERIC_RUN: '33524288794'
      PRIOR_INFRA_PR: '825'
      PRIOR_INFRA_HEAD: 67402170f5c80899873e8a994ded21e33e1c47a1
      PRIOR_INFRA_RUN: '33526728439'
      PRIOR_DEFECT_COMMENT: '5496552137'
      SUPERSEDED_INFRA_PR: '826'
      SUPERSEDED_INFRA_HEAD: d3224a01cf8b878e5b311ef41b59677f6a5b63f9
      SUPERSEDED_INFRA_RUN: '33528175095'
      SUPERSEDED_INFRA_GENERIC_RUN: '33528174986'
      SUPERSEDED_DEFECT_COMMENT: '5496913048'
      AUTH_HEAD: 6e095b4b1603c90dcee0943295909b30cd1b374d
      AUTH_PARENT: 5685d5c313071014a94c816ee26b129f1f17a7fc
      AUTH_PR: '774'
      ALLOCATION_MARKER: ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_AUTHORIZATION_ALLOCATED_REVIEWED_NOT_DISPATCHED commit=6e095b4b1603c90dcee0943295909b30cd1b374d parent=5685d5c313071014a94c816ee26b129f1f17a7fc pr=774
      CONSUMED_MARKER: ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_DISPATCH_CONSUMED
      DISPATCH_BRANCH: dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-ordinal-45
      EXECUTION_KEY: aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4:numerical:45
      CANDIDATE_SEED_SHA256: ddded6b2d170ca2fac8d498bdba2887446c16995df0880d948fb2be00870b3de
      CANDIDATE_ROWS_SHA256: c439de417520b330c037e2628df02b6955f652563300aa5ef30477abf7661a98
      SCIENCE_WORKFLOW: .github/workflows/avps-v2-postconsumption-recovery4-science.yml
      SCIENCE_WORKFLOW_BLOB: 2d210b3a161f6889352d600fb9222c974e728034
      RUNTIME_ADAPTER: runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py
      RUNTIME_ADAPTER_BLOB: e4b690c2969fd01ecde5b08f554e47ad50b40914
      EXECUTOR: runtime-avps-v2-recovery4-ordinal45-v1/executor.py
      EXECUTOR_BLOB: 7dc38e31c19701b1a1ceef300d75105cff179290
      AGGREGATOR: runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py
      AGGREGATOR_BLOB: 6afc8b0d21c2b5553c251dc9ca5524c795ed2646
      RUNTIME_CONTRACT: runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json
      RUNTIME_CONTRACT_BLOB: 2d5f71d80b5e573b86775c2806b80dcc1fbe02f4
      SCIENCE_CONCURRENCY_GROUP: avps-v2-postconsumption-recovery4-ordinal-45-science
      PUBLISHER_ACCEPT_PREFIX: INDEPENDENT_AUDIT::ACCEPT_AVPS_ORDINAL45_FINAL_DISPATCH_PUBLISHER_V1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Bind exact review mode and direct-child identity
        id: mode
        shell: bash
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "${{ github.event.action }}" = opened
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test "$(git rev-parse HEAD^)" = "$EVENT_BASE"
          test "$(git rev-list --count "$EVENT_BASE"..HEAD)" = 1
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EVENT_BASE"
          git diff --name-only "$EVENT_BASE"...HEAD > changed.txt
          test "$(wc -l < changed.txt)" = 1
          CHANGED=$(cat changed.txt)
          if [ "$CHANGED" = "$INFRA_PATH" ]; then
            test "$EVENT_BASE" = "$INFRA_BASE"
            test "$EVENT_BRANCH" = "$INFRA_BRANCH"
            echo mode=infra >> "$GITHUB_OUTPUT"
          elif [ "$CHANGED" = "$PUBLISHER_PATH" ]; then
            test "$EVENT_BRANCH" = "$PUBLISHER_BRANCH"
            git merge-base --is-ancestor "$CONTROL_MERGE" "$EVENT_BASE"
            echo mode=publisher >> "$GITHUB_OUTPUT"
          else
            echo "unexpected review path: $CHANGED" >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > pr.json
          python - <<'PY'
          import json,os
          p=json.load(open('pr.json'))
          if p.get('state')!='open' or p.get('merged_at') is not None:
              raise SystemExit('review target must be open/unmerged')
          if p['head']['sha']!=os.environ['EVENT_HEAD'] or p['base']['sha']!=os.environ['EVENT_BASE']:
              raise SystemExit('review target identity drift')
          PY

      - name: Bind accepted control and both superseded choreography defects
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$CONTROL_MERGE" HEAD || test "${{ steps.mode.outputs.mode }}" = infra
          test "$(git rev-parse "$CONTROL_MERGE:.github/workflows/avps-v2-recovery4-ordinal45-dispatch-consumption-control-v7-review.yml")" = "$CONTROL_REVIEW_BLOB"
          test "$(git rev-parse "HEAD:$SCIENCE_WORKFLOW")" = "$SCIENCE_WORKFLOW_BLOB"
          test "$(git rev-parse "HEAD:$RUNTIME_ADAPTER")" = "$RUNTIME_ADAPTER_BLOB"
          test "$(git rev-parse "HEAD:$EXECUTOR")" = "$EXECUTOR_BLOB"
          test "$(git rev-parse "HEAD:$AGGREGATOR")" = "$AGGREGATOR_BLOB"
          test "$(git rev-parse "HEAD:$RUNTIME_CONTRACT")" = "$RUNTIME_CONTRACT_BLOB"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CONTROL_DEDICATED_RUN" > control-dedicated.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CONTROL_DEDICATED_ARTIFACT" > control-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CONTROL_GENERIC_RUN" > control-generic.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$POST_MERGE_GENERIC_RUN" > post-merge-generic.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PRIOR_INFRA_PR" > prior-pr.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/$SUPERSEDED_INFRA_PR" > superseded-pr.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SUPERSEDED_INFRA_RUN" > superseded-dedicated.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SUPERSEDED_INFRA_GENERIC_RUN" > superseded-generic.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > issue60-pages.json
          python - <<'PY'
          import json,os
          d=json.load(open('control-dedicated.json')); a=json.load(open('control-artifact.json')); g=json.load(open('control-generic.json')); p=json.load(open('post-merge-generic.json'))
          prior=json.load(open('prior-pr.json')); old=json.load(open('superseded-pr.json')); sd=json.load(open('superseded-dedicated.json')); sg=json.load(open('superseded-generic.json'))
          if d['id']!=int(os.environ['CONTROL_DEDICATED_RUN']) or d['head_sha']!=os.environ['CONTROL_HEAD'] or d['run_attempt']!=1 or d['conclusion']!='success': raise SystemExit('v7 dedicated review drift')
          if a['id']!=int(os.environ['CONTROL_DEDICATED_ARTIFACT']) or a.get('digest')!=os.environ['CONTROL_DEDICATED_DIGEST'] or a.get('expired'): raise SystemExit('v7 artifact drift')
          if g['id']!=int(os.environ['CONTROL_GENERIC_RUN']) or g['head_sha']!=os.environ['CONTROL_HEAD'] or g['run_attempt']!=1 or g['conclusion']!='success': raise SystemExit('v7 generic review drift')
          if p['id']!=int(os.environ['POST_MERGE_GENERIC_RUN']) or p['head_sha']!=os.environ['CONTROL_MERGE'] or p['run_attempt']!=1 or p['conclusion']!='success': raise SystemExit('v7 post-merge generic drift')
          if prior.get('number')!=int(os.environ['PRIOR_INFRA_PR']) or prior.get('state')!='closed' or prior.get('merged_at') is not None or prior['head']['sha']!=os.environ['PRIOR_INFRA_HEAD']:
              raise SystemExit('superseded PR825 identity/state drift')
          if old.get('number')!=int(os.environ['SUPERSEDED_INFRA_PR']) or old.get('state')!='closed' or old.get('merged_at') is not None or old['head']['sha']!=os.environ['SUPERSEDED_INFRA_HEAD']:
              raise SystemExit('superseded PR826 identity/state drift')
          if sd['id']!=int(os.environ['SUPERSEDED_INFRA_RUN']) or sd['head_sha']!=os.environ['SUPERSEDED_INFRA_HEAD'] or sd['run_attempt']!=1 or sd['conclusion']!='success':
              raise SystemExit('PR826 dedicated evidence drift')
          if sg['id']!=int(os.environ['SUPERSEDED_INFRA_GENERIC_RUN']) or sg['head_sha']!=os.environ['SUPERSEDED_INFRA_HEAD'] or sg['run_attempt']!=1 or sg['conclusion']!='success':
              raise SystemExit('PR826 generic evidence drift')
          pages=json.load(open('issue60-pages.json')); comments=[c for page in pages for c in page]
          hit=[c for c in comments if int(c.get('id') or 0)==int(os.environ['CONTROL_ACCEPT_COMMENT'])]
          if len(hit)!=1 or not str(hit[0].get('body') or '').startswith('INDEPENDENT_AUDIT::ACCEPT_AVPS_ORDINAL45_DISPATCH_CONSUMPTION_CONTROL_V7'):
              raise SystemExit('v7 Independent Audit acceptance drift')
          defect1=[c for c in comments if int(c.get('id') or 0)==int(os.environ['PRIOR_DEFECT_COMMENT'])]
          if len(defect1)!=1 or 'DUPLICATE_PUBLISHER_CONCURRENCY_RACE' not in str(defect1[0].get('body') or ''):
              raise SystemExit('PR825 concurrency-defect checkpoint drift')
          defect2=[c for c in comments if int(c.get('id') or 0)==int(os.environ['SUPERSEDED_DEFECT_COMMENT'])]
          if len(defect2)!=1 or not str(defect2[0].get('body') or '').startswith('INDEPENDENT_AUDIT::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_DISPATCH_CHOREOGRAPHY_REVIEW_INFRA_V4_PR826_SELF_RUN_CARDINALITY_UNPROVEN'):
              raise SystemExit('PR826 self-run-cardinality defect checkpoint drift')
          PY

      - name: Prove reviewer infrastructure is solver-free and non-authorizing
        if: steps.mode.outputs.mode == 'infra'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v1.yml')
          s=p.read_text()
          required=(
            'permissions:\n  contents: read\n  actions: read\n  issues: read\n  pull-requests: read',
            'SCIENCE_CONCURRENCY_GROUP: avps-v2-postconsumption-recovery4-ordinal-45-science',
            'PUBLISHER_CONCURRENCY_GROUP: avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1',
            'PUBLISHER_ACCEPT_PREFIX: INDEPENDENT_AUDIT::ACCEPT_AVPS_ORDINAL45_FINAL_DISPATCH_PUBLISHER_V1',
            "'sameCommentScienceRunBindingRequired':True",
            "'publisherWorkflowSerializationRequired':True",
            "'publisherRunCardinalitySemanticProofExecuted':True",
            'bootstrap-lock',
            'monitor-fence',
            'bounded read-only retry after complete-enumeration instability',
            'queue: max',
            '# BEGIN_PUBLISHER_RUN_CARDINALITY_GUARD_V1',
            '# END_PUBLISHER_RUN_CARDINALITY_GUARD_V1',
          )
          for token in required:
              if token not in s: raise SystemExit(f'missing reviewer contract token: {token}')
          for line in s.splitlines():
              stripped=line.strip()
              if stripped.startswith('gh api --method POST ') or stripped.startswith('gh api --method PATCH ') or stripped.startswith('uvspec ') or stripped.startswith('libRadtran '):
                  raise SystemExit(f'reviewer contains executable mutation/runtime command: {stripped}')
          PY

      - name: Execute semantic publisher self-run cardinality guard proof
        shell: bash
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,os,textwrap
          from pathlib import Path
          canonical=textwrap.dedent(r'''
          # BEGIN_PUBLISHER_RUN_CARDINALITY_GUARD_V1
          ACTIVE_PUBLISHER_STATUSES={'queued','in_progress','pending','waiting','requested'}
          TERMINAL_PUBLISHER_STATUSES={'completed'}
          class PublisherRunGuardError(RuntimeError):
              pass
          def _require(condition,message):
              if not condition:
                  raise PublisherRunGuardError(message)
          def normalize_publisher_run_pages(pages):
              _require(isinstance(pages,list) and len(pages)>0,'publisher run pagination/API drift: pages')
              runs=[]; totals=set()
              for page in pages:
                  _require(isinstance(page,dict),'publisher run pagination/API drift: page')
                  _require(isinstance(page.get('total_count'),int) and page['total_count']>=0,'publisher run pagination/API drift: total_count')
                  _require(isinstance(page.get('workflow_runs'),list),'publisher run pagination/API drift: workflow_runs')
                  totals.add(page['total_count']); runs.extend(page['workflow_runs'])
              _require(len(totals)==1,'publisher run pagination/API drift: inconsistent total_count')
              total=next(iter(totals))
              _require(total==len(runs),f'publisher run pagination/API drift: expected_total={total} enumerated={len(runs)}')
              ids=[]
              normalized=[]
              for run in runs:
                  _require(isinstance(run,dict),'publisher run pagination/API drift: run object')
                  rid=run.get('id'); _require(isinstance(rid,int) and rid>0,'publisher run pagination/API drift: run id')
                  ids.append(rid)
                  normalized.append((rid,run.get('status'),run.get('run_attempt'),run.get('event'),run.get('head_sha'),run.get('head_branch'),run.get('path'),run.get('conclusion')))
              _require(len(ids)==len(set(ids)),'publisher run pagination/API drift: duplicate run id')
              return tuple(sorted(normalized))
          def validate_publisher_run_pages(pages,expected):
              normalized=normalize_publisher_run_pages(pages)
              flat=[]
              for page in pages: flat.extend(page['workflow_runs'])
              self_runs=[r for r in flat if r.get('id')==expected['run_id']]
              _require(len(self_runs)==1,'publisher current-run identity cardinality drift')
              cur=self_runs[0]
              _require(cur.get('run_attempt')==1 and expected['run_attempt']==1,'publisher current run attempt drift')
              _require(cur.get('event')=='workflow_dispatch' and expected['event']=='workflow_dispatch','publisher current run event drift')
              _require(cur.get('head_sha')==expected['head_sha'],'publisher current run head drift')
              _require(cur.get('head_branch')==expected['head_branch'],'publisher current run ref drift')
              _require(cur.get('path')==expected['workflow_path'],'publisher current run workflow drift')
              _require(cur.get('status')=='in_progress','publisher current run must be in_progress while guard executes')
              for run in flat:
                  if run.get('id')==expected['run_id']:
                      continue
                  status=run.get('status')
                  if status in ACTIVE_PUBLISHER_STATUSES:
                      raise PublisherRunGuardError(f"competing final publisher workflow_dispatch exists: run_id={run.get('id')} status={status}")
                  _require(status in TERMINAL_PUBLISHER_STATUSES,f"publisher run status/API drift: run_id={run.get('id')} status={status}")
              return {'currentRunId':expected['run_id'],'enumeratedRunCount':len(flat),'normalized':normalized}
          def run_publisher_guard_fixtures():
              expected={'run_id':1001,'run_attempt':1,'event':'workflow_dispatch','head_sha':'abc123','head_branch':'main','workflow_path':'.github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1.yml'}
              current={'id':1001,'status':'in_progress','run_attempt':1,'event':'workflow_dispatch','head_sha':'abc123','head_branch':'main','path':expected['workflow_path'],'conclusion':None}
              def pages(runs): return [{'total_count':len(runs),'workflow_runs':runs}]
              validate_publisher_run_pages(pages([current]),expected)
              for status in ('queued','in_progress','pending','waiting','requested'):
                  competitor={'id':1002,'status':status,'run_attempt':1,'event':'workflow_dispatch','head_sha':'other','head_branch':'main','path':expected['workflow_path'],'conclusion':None}
                  try: validate_publisher_run_pages(pages([current,competitor]),expected)
                  except PublisherRunGuardError as e:
                      _require(str(e)==f'competing final publisher workflow_dispatch exists: run_id=1002 status={status}',f'active competitor blocker drift: {e}')
                  else: raise PublisherRunGuardError(f'active competitor fixture unexpectedly passed: {status}')
              completed={'id':900,'status':'completed','run_attempt':1,'event':'workflow_dispatch','head_sha':'old','head_branch':'main','path':expected['workflow_path'],'conclusion':'cancelled'}
              validate_publisher_run_pages(pages([completed,current]),expected)
              wrong=dict(current); wrong['head_sha']='drift'
              try: validate_publisher_run_pages(pages([wrong]),expected)
              except PublisherRunGuardError as e: _require(str(e)=='publisher current run head drift',f'head drift blocker mismatch: {e}')
              else: raise PublisherRunGuardError('head drift fixture unexpectedly passed')
              duplicate=dict(current)
              try: validate_publisher_run_pages(pages([current,duplicate]),expected)
              except PublisherRunGuardError as e: _require('duplicate run id' in str(e),'duplicate self fixture blocker mismatch')
              else: raise PublisherRunGuardError('duplicate self fixture unexpectedly passed')
              return True
          # END_PUBLISHER_RUN_CARDINALITY_GUARD_V1
          ''').strip()+"\n"
          ns={}; exec(canonical,ns); ns['run_publisher_guard_fixtures']()
          Path('publisher-cardinality-guard-canonical.sha256').write_text(hashlib.sha256(canonical.encode()).hexdigest()+"\n")
          Path('publisher-cardinality-fixtures.json').write_text('{"currentOnly":"PASS","activeCompetitorQueuedInProgressPendingWaitingRequested":"FAIL_EXACT_BLOCKER","completedHistory":"PASS","identityDrift":"FAIL_CLOSED","duplicateSelf":"FAIL_CLOSED"}\n')
          if os.environ['MODE']=='publisher':
              raw=Path(os.environ['PUBLISHER_PATH']).read_text()
              begin='# BEGIN_PUBLISHER_RUN_CARDINALITY_GUARD_V1'; end='# END_PUBLISHER_RUN_CARDINALITY_GUARD_V1'
              _start=raw.find(begin); _end=raw.find(end,_start)
              if _start<0 or _end<0: raise SystemExit('publisher cardinality guard markers missing')
              line_start=raw.rfind('\n',0,_start)+1; line_end=raw.find('\n',_end)
              if line_end<0: line_end=len(raw)
              extracted=textwrap.dedent(raw[line_start:line_end+1]).strip()+"\n"
              if extracted!=canonical: raise SystemExit('publisher cardinality guard source differs from semantically proved canonical source')
              pns={}; exec(extracted,pns); pns['run_publisher_guard_fixtures']()
          PY

      - name: Review exact final publisher choreography
        if: steps.mode.outputs.mode == 'publisher'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1.yml').read_text()
          required=(
            'name: AVPS v2 Recovery4 ordinal45 final one-use dispatch publisher v1',
            'workflow_dispatch:',
            'concurrency:\n  group: avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1\n  cancel-in-progress: false\n  queue: max',
            'bootstrap-lock:',
            'monitor-fence:',
            'concurrency:\n      group: avps-v2-postconsumption-recovery4-ordinal-45-science\n      cancel-in-progress: false',
            'needs: bootstrap-lock',
            'WRITE_QUIET_BEGIN',
            'science_run=PENDING',
            'gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$FENCE_BEGIN"',
            'science_run=$SCIENCE_RUN',
            'Fresh repository-global candidate-seed recheck and one-use guard',
            'WRITE_QUIET_END',
            'INDEPENDENT_AUDIT::ACCEPT_AVPS_ORDINAL45_FINAL_DISPATCH_PUBLISHER_V1',
            'repository_global_seed_scan.py',
            'bounded read-only retry after complete-enumeration instability',
            'latestConsumedOrDispatchedScientificOrdinal',
            'maxObservedScientificOrdinal',
            'ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_DISPATCH_CONSUMED',
            'actions/workflows/avps-v2-postconsumption-recovery4-science.yml/dispatches',
            'actions/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1.yml/runs?event=workflow_dispatch&per_page=100',
            'publisher-runs-a.json',
            'publisher-runs-b.json',
            'GITHUB_RUN_ID',
            'GITHUB_RUN_ATTEMPT',
            'GITHUB_SHA',
            'GITHUB_REF',
            'publisher run complete-enumeration metadata changed',
            'competing final publisher workflow_dispatch exists',
            'run_publisher_guard_fixtures()',
          )
          for token in required:
              if token not in s: raise SystemExit(f'missing final-publisher invariant: {token}')
          if s.count('group: avps-v2-postconsumption-recovery4-ordinal-45-science') != 1:
              raise SystemExit('science concurrency lock must occur exactly once in publisher')
          if s.count('group: avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1') != 1:
              raise SystemExit('publisher workflow concurrency group must occur exactly once')
          jobs=s.find('\njobs:')
          publisher_lock=s.find('concurrency:\n  group: avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1\n  cancel-in-progress: false\n  queue: max')
          publisher_scan=s.find('actions/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1.yml/runs?event=workflow_dispatch&per_page=100')
          publisher_guard=s.find('competing final publisher workflow_dispatch exists',publisher_scan)
          begin=s.find('WRITE_QUIET_BEGIN')
          ref=s.find('git/refs',begin)
          consumed=s.find('ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_DISPATCH_CONSUMED',begin)
          dispatch=s.find('actions/workflows/avps-v2-postconsumption-recovery4-science.yml/dispatches',begin)
          patch=s.find('issues/comments/$FENCE_BEGIN',dispatch)
          exact=s.find('science_run=$SCIENCE_RUN',patch)
          if min(jobs,publisher_lock,publisher_scan,publisher_guard,begin,ref,consumed,dispatch,patch,exact)<0:
              raise SystemExit('publisher serialization or dispatch choreography token missing')
          if not (publisher_lock<jobs and publisher_scan<publisher_guard<begin and begin<ref and begin<consumed and ref<dispatch and consumed<dispatch and dispatch<patch and patch<exact):
              raise SystemExit('publisher serialization/cardinality/BEGIN/bootstrap/dispatch/same-comment-binding causal order drift')
          for bad in ('newMappingAuthorized=true','resultOpeningAuthorized=true','Taylor','Jerusalem','gh run rerun','rerun-failed-jobs','cancel-in-progress: true'):
              if bad in s: raise SystemExit(f'forbidden final-publisher token: {bad}')
          PY
          test "$(git diff --name-only HEAD^...HEAD)" = "$PUBLISHER_PATH"
          test "$(git hash-object "$SCIENCE_WORKFLOW")" = "$SCIENCE_WORKFLOW_BLOB"

      - name: Fresh read-only one-use and repository-global state review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$DISPATCH_BRANCH" >/dev/null 2>&1; then echo 'ordinal45 dispatch ref already exists' >&2; exit 1; fi
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > final-issue60-pages.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/avps-v2-postconsumption-recovery4-science.yml/runs?event=workflow_dispatch&per_page=100" > final-science-runs.json
          python - <<'PY'
          import json,os
          pages=json.load(open('final-issue60-pages.json')); comments=[c for p in pages for c in p]
          bodies=[str(c.get('body') or '').strip() for c in comments]
          if sum(b==os.environ['ALLOCATION_MARKER'] for b in bodies)!=1: raise SystemExit('ordinal45 allocation marker cardinality drift')
          if sum(b.startswith(os.environ['CONSUMED_MARKER']) for b in bodies)!=0: raise SystemExit('ordinal45 consumed marker already exists')
          pages=json.load(open('final-science-runs.json')); runs=[r for p in pages for r in p.get('workflow_runs',[])]
          if runs: raise SystemExit(f'ordinal45 science workflow_dispatch already exists: {[r.get("id") for r in runs]}')
          closed=set(); begins=[]
          for c in comments:
              body=str(c.get('body') or '').strip(); first=body.splitlines()[0] if body else ''
              fields={}
              for token in first.replace('|',' ').split():
                  if '=' in token:
                      k,v=token.split('=',1); fields.setdefault(k,[]).append(v)
              if first.startswith('WRITE_QUIET_END'):
                  vals=[]
                  for key in ('begin','beginComment','begin_comment'):
                      for v in fields.get(key,[]):
                          if not v.isdigit(): raise SystemExit(f'non-numeric WRITE_QUIET_END alias: {v!r}')
                          vals.append(int(v))
                  if len(set(vals))>1: raise SystemExit(f'conflicting WRITE_QUIET_END aliases: {vals}')
                  if vals: closed.add(vals[0])
              elif first.startswith('WRITE_QUIET_BEGIN'):
                  begins.append(int(c['id']))
          unmatched=[x for x in begins if x not in closed]
          if unmatched: raise SystemExit(f'unmatched WRITE_QUIET_BEGIN blocks review: {unmatched}')
          PY
          git ls-files -z > tracked-files.nul
          git show "$AUTH_HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-authorization-control-v1/authorization.json" > authorization.json
          python review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-science-transport-v1/native_authorization_seed_transport.py \
            --repo-root . --authorization-head "$AUTH_HEAD" --authorization-parent "$AUTH_PARENT" \
            --authorization-ledger-path review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-seed-global-control-v1/seed_ledger.py \
            --authorization-ledger-blob 16af5c68ae7e3cfc0cfbef4c8e2022517bf2ae91 \
            --candidate-seed-sha256 "$CANDIDATE_SEED_SHA256" --candidate-rows-sha256 "$CANDIDATE_ROWS_SHA256" \
            --historical-head e627a689ada0493a8a5b9cdafc4aba0198fbabec \
            --historical-ledger-path review/aerosol-vertical-profile-sensitivity-v2-postconsumption-seed-freshness-v1/seed_ledger.py \
            --historical-ledger-blob 491d1b6653bea0fcc5275269723a76aa1af52300 \
            --work-root candidate-transport --output-ledger candidate-seed-ledger.json --output-context candidate-context.json
          printf '{"schemaVersion":2,"requiredTrackedSelfLedgerPaths":[],"futureEvidenceSelfLedgerPaths":[]}\n' > empty-self-ledger.json
          python review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/tracked_tree_seed_scan.py --repo-root . --file-list tracked-files.nul --candidate-seed-ledger candidate-seed-ledger.json --allow-self-ledger-json empty-self-ledger.json --output tracked-seed-scan.json
          python - <<'PY'
          import json
          t=json.load(open('tracked-seed-scan.json'))
          if t.get('trackedTreeExternalCollisionCount')!=0: raise SystemExit('tracked candidate seed collision')
          PY
          rm -rf final-global-scan-attempts
          mkdir -p final-global-scan-attempts
          success=0
          for n in 1 2 3; do
            out="final-global-scan-attempts/report-$n.json"
            stdout="final-global-scan-attempts/stdout-$n.txt"
            stderr="final-global-scan-attempts/stderr-$n.txt"
            set +e
            python review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/repository_global_seed_scan.py \
              --repository "$GITHUB_REPOSITORY" --issue-number 60 --candidate-seed-ledger candidate-seed-ledger.json \
              --current-run-id "$GITHUB_RUN_ID" --audit-mode authorization-recheck \
              --expected-branch-name "${{ github.event.pull_request.head.ref }}" --expected-repo-head "${{ github.event.pull_request.head.sha }}" \
              --output "$out" >"$stdout" 2>"$stderr"
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              cp "$out" repository-global-seed-scan.json
              printf '%s\n' "$n" > repository-global-scan-success-attempt.txt
              success=1
              break
            fi
            cat "$stderr" >&2
            if ! grep -Fq 'snapshot-fenced repository-global metadata changed between two complete enumerations' "$stderr"; then
              echo "non-retryable repository-global scan failure on attempt $n" >&2
              exit "$rc"
            fi
            echo "bounded read-only retry after complete-enumeration instability: attempt=$n" >&2
            test "$n" -lt 3 || break
            sleep $((n*5))
          done
          test "$success" = 1 || { echo 'repository-global scan remained unstable across three fresh complete attempts' >&2; exit 1; }
          python - <<'PY'
          import json
          g=json.load(open('repository-global-seed-scan.json'))
          if g.get('repositoryGlobalCollisionCount',g.get('collisionCount'))!=0: raise SystemExit('repository-global candidate seed collision')
          if g.get('repositoryGlobalDoubleEnumerationStable') is not True: raise SystemExit('final repository-global enumeration not stable')
          if g.get('auditedBranchHeadMatchesRepositoryHead') is not True: raise SystemExit('audited branch/head mismatch')
          if int(g.get('repositoryGlobalPostFenceCandidateSeedCollisionCount',0) or 0)!=0: raise SystemExit('post-fence candidate-seed collision')
          PY

      - name: Write zero-runtime review receipt
        shell: bash
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
