name: Review AVPS Recovery4 ordinal45 final dispatch choreography v16

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v16.yml
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1.yml

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v16-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      INFRA_BASE: de3fafa052ff1d5b2f33ec0d4347c884d560d8b6
      INFRA_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-infrastructure-v16
      INFRA_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v16.yml
      V15_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v1.yml
      PUBLISHER_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1
      PUBLISHER_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1.yml
      PR845_HEAD: e461c26ec78e9832ff43859bf63baf49464628b1
      PR845_TREE: 7a951d416a3419153c8dd5ec28286ed26cd7e346
      PR845_WORKFLOW_BLOB: 021167e7de63b68f92683503dac832aacc40675a
      PR845_DEDICATED_RUN: '33560139809'
      PR845_DEDICATED_JOB: '100030384614'
      PR845_GENERIC_RUN: '33560139813'
      PR845_ARTIFACT: '9821218710'
      PR845_ARTIFACT_DIGEST: sha256:fe3d0f62611a84f2e86e9b8695cfbf63a90819f4be7e012dd2ddeff9e6159eb4
      PR845_CANONICAL_SHA256: da768723a4e830374cb8bf5da79e452551cf7f7716e62764516323a80572e800
      PR845_DEFECT_COMMENT: '5500881319'
      PR845_BACKUP_DEFECT_COMMENT: '5500921469'
      ALLOCATION_MARKER: ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_AUTHORIZATION_ALLOCATED_REVIEWED_NOT_DISPATCHED commit=6e095b4b1603c90dcee0943295909b30cd1b374d parent=5685d5c313071014a94c816ee26b129f1f17a7fc pr=774
      CONSUMED_MARKER: ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_DISPATCH_CONSUMED
      DISPATCH_BRANCH: dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-ordinal-45
      SCIENCE_WORKFLOW: .github/workflows/avps-v2-postconsumption-recovery4-science.yml
      SCIENCE_WORKFLOW_BLOB: 2d210b3a161f6889352d600fb9222c974e728034
      RUNTIME_ADAPTER: runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py
      RUNTIME_ADAPTER_BLOB: e4b690c2969fd01ecde5b08f554e47ad50b40914
      EXECUTOR: runtime-avps-v2-recovery4-ordinal45-v1/executor.py
      EXECUTOR_BLOB: 7dc38e31c19701b1a1ceef300d75105cff179290
      AGGREGATOR: runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py
      AGGREGATOR_BLOB: 6afc8b0d21c2b5553c251dc9ca5524c795ed2646
      RUNTIME_CONTRACT: runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json
      RUNTIME_CONTRACT_BLOB: 2d5f71d80b5e573b86775c2806b80dcc1fbe02f4
      CANDIDATE_SEED_SHA256: ddded6b2d170ca2fac8d498bdba2887446c16995df0880d948fb2be00870b3de
      CANDIDATE_ROWS_SHA256: c439de417520b330c037e2628df02b6955f652563300aa5ef30477abf7661a98
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Bind exact V16 identity, V15 substrate, both defects, and live fence
        id: mode
        shell: bash
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "${{ github.event.action }}" = opened
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test "$(git rev-parse HEAD^)" = "$EVENT_BASE"
          test "$(git rev-list --count "$EVENT_BASE"..HEAD)" = 1
          mapfile -t CHANGED < <(git diff --name-only "$EVENT_BASE"...HEAD)
          test "${#CHANGED[@]}" = 1
          if [ "${CHANGED[0]}" = "$INFRA_PATH" ]; then
            test "$EVENT_BASE" = "$INFRA_BASE"
            test "$EVENT_BRANCH" = "$INFRA_BRANCH"
            test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$INFRA_BASE"
            echo mode=infra >> "$GITHUB_OUTPUT"
          elif [ "${CHANGED[0]}" = "$PUBLISHER_PATH" ]; then
            test "$EVENT_BRANCH" = "$PUBLISHER_BRANCH"
            test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EVENT_BASE"
            test "$(git rev-parse "$EVENT_BASE:$INFRA_PATH")" = "$(git rev-parse "HEAD:$INFRA_PATH")"
            echo mode=publisher >> "$GITHUB_OUTPUT"
          else
            echo "unexpected changed path: ${CHANGED[0]}" >&2; exit 1
          fi
          if git ls-remote --exit-code --heads origin "$DISPATCH_BRANCH" >/dev/null 2>&1; then echo 'dispatch ref exists' >&2; exit 1; fi
          git fetch --no-tags origin "$PR845_HEAD"
          test "$(git rev-parse "$PR845_HEAD^{tree}")" = "$PR845_TREE"
          test "$(git rev-parse "$PR845_HEAD:$V15_PATH")" = "$PR845_WORKFLOW_BLOB"
          gh api "repos/$GITHUB_REPOSITORY/pulls/845" > pr845.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR845_DEDICATED_RUN" > pr845-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$PR845_DEDICATED_JOB" > pr845-job.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR845_GENERIC_RUN" > pr845-generic.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PR845_ARTIFACT" > pr845-artifact.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > issue60-pages.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/avps-v2-postconsumption-recovery4-science.yml/runs?event=workflow_dispatch&per_page=100" > science-runs.json
          python - <<'PY'
          import json,os
          def load(p): return json.load(open(p))
          p=load('pr845.json'); r=load('pr845-run.json'); j=load('pr845-job.json'); g=load('pr845-generic.json'); a=load('pr845-artifact.json')
          if p.get('state')!='closed' or p.get('merged_at') is not None or p['head']['sha']!=os.environ['PR845_HEAD'] or p['base']['sha']!=os.environ['INFRA_BASE']: raise SystemExit('PR845 identity drift')
          if r['id']!=int(os.environ['PR845_DEDICATED_RUN']) or r['head_sha']!=os.environ['PR845_HEAD'] or r['run_attempt']!=1 or r.get('conclusion')!='success': raise SystemExit('PR845 dedicated drift')
          if j['id']!=int(os.environ['PR845_DEDICATED_JOB']) or j['run_id']!=r['id'] or j.get('conclusion')!='success': raise SystemExit('PR845 job drift')
          if g['id']!=int(os.environ['PR845_GENERIC_RUN']) or g['head_sha']!=os.environ['PR845_HEAD'] or g['run_attempt']!=1 or g.get('conclusion')!='success': raise SystemExit('PR845 generic drift')
          if a['id']!=int(os.environ['PR845_ARTIFACT']) or a.get('expired') is True or a.get('digest')!=os.environ['PR845_ARTIFACT_DIGEST']: raise SystemExit('PR845 artifact drift')
          comments=[c for page in load('issue60-pages.json') for c in page]
          def bind(cid,prefix,tokens):
              hits=[c for c in comments if int(c.get('id') or 0)==cid]
              if len(hits)!=1: raise SystemExit(f'comment cardinality drift {cid}')
              c=hits[0]; b=str(c.get('body') or ''); u=c.get('user') or {}
              if not b.startswith(prefix) or u.get('login')!='search-maker' or int(u.get('id') or 0)!=304153003 or c.get('author_association')!='OWNER': raise SystemExit(f'comment identity drift {cid}')
              for t in tokens:
                  if t not in b: raise SystemExit(f'comment token drift {cid}: {t}')
          common=['pr=845',f'head={os.environ["PR845_HEAD"]}',f'base={os.environ["INFRA_BASE"]}',f'tree={os.environ["PR845_TREE"]}',f'workflow_blob={os.environ["PR845_WORKFLOW_BLOB"]}',f'dedicated_run={os.environ["PR845_DEDICATED_RUN"]}',f'dedicated_job={os.environ["PR845_DEDICATED_JOB"]}','dedicated_conclusion=SUCCESS',f'artifact={os.environ["PR845_ARTIFACT"]}',f'artifact_digest={os.environ["PR845_ARTIFACT_DIGEST"]}',f'generic_run={os.environ["PR845_GENERIC_RUN"]}','generic_conclusion=SUCCESS','QUARANTINE_DOWNSTREAM=false']
          bind(int(os.environ['PR845_DEFECT_COMMENT']),'INDEPENDENT_AUDIT::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_DISPATCH_CHOREOGRAPHY_REVIEW_INFRA_V15_PR845_LIVE_GOVERNANCE_CLASSIFIER_INCOMPLETE',common)
          bind(int(os.environ['PR845_BACKUP_DEFECT_COMMENT']),'BACKUP_INDEPENDENT_AUDIT::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_DISPATCH_CHOREOGRAPHY_REVIEW_INFRA_V15_PR845_LIVE_GOVERNANCE_CLASSIFIER_INCOMPLETE',common+[f'primary_same_defect={os.environ["PR845_DEFECT_COMMENT"]}'])
          markers=('CONFIRMED_DEFECT','MATERIAL_RISK','QUARANTINE_DOWNSTREAM=true','FAIL_CLOSED','FAIL-CLOSED','BLOCKER')
          cutoff=int(os.environ['PR845_BACKUP_DEFECT_COMMENT'])
          for c in comments:
              cid=int(c.get('id') or 0); b=str(c.get('body') or '')
              if cid>cutoff and 'AVPS' in b and any(m in b for m in markers): raise SystemExit(f'newer AVPS blocker/risk exists: {cid}')
          bodies=[str(c.get('body') or '').strip() for c in comments]
          if sum(b==os.environ['ALLOCATION_MARKER'] for b in bodies)!=1: raise SystemExit('allocation marker drift')
          if any(b.startswith(os.environ['CONSUMED_MARKER']) for b in bodies): raise SystemExit('consumed marker exists')
          closed=set(); begins=[]
          for c in comments:
              body=str(c.get('body') or '').strip(); first=body.splitlines()[0] if body else ''; fields={}
              for tok in first.replace('|',' ').split():
                  if '=' in tok:
                      k,v=tok.split('=',1); fields.setdefault(k,[]).append(v)
              if first.startswith('WRITE_QUIET_END'):
                  vals=[]
                  for key in ('begin','beginComment','begin_comment'):
                      for v in fields.get(key,[]):
                          if not v.isdigit(): raise SystemExit('non-numeric END alias')
                          vals.append(int(v))
                  if len(set(vals))>1: raise SystemExit('conflicting END aliases')
                  if vals: closed.add(vals[0])
              elif first.startswith('WRITE_QUIET_BEGIN'): begins.append(int(c['id']))
          unmatched=[x for x in begins if x not in closed]
          if unmatched: raise SystemExit(f'unmatched WRITE_QUIET_BEGIN: {unmatched}')
          runs=[r for page in load('science-runs.json') for r in page.get('workflow_runs',[])]
          if runs: raise SystemExit(f'prior ordinal45 science run exists: {[r.get("id") for r in runs]}')
          PY
          test "$(git rev-parse "HEAD:$SCIENCE_WORKFLOW")" = "$SCIENCE_WORKFLOW_BLOB"
          test "$(git rev-parse "HEAD:$RUNTIME_ADAPTER")" = "$RUNTIME_ADAPTER_BLOB"
          test "$(git rev-parse "HEAD:$EXECUTOR")" = "$EXECUTOR_BLOB"
          test "$(git rev-parse "HEAD:$AGGREGATOR")" = "$AGGREGATOR_BLOB"
          test "$(git rev-parse "HEAD:$RUNTIME_CONTRACT")" = "$RUNTIME_CONTRACT_BLOB"

      - name: Download exact clean V15 review artifact
        uses: actions/download-artifact@v4
        with:
          name: avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v15
          path: v15-artifact
          repository: ${{ github.repository }}
          run-id: 33560139809
          github-token: ${{ github.token }}

      - name: Patch only V15 cutoff and live governance classifier
        shell: bash
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          cp v15-artifact/canonical-final-publisher.yml canonical-final-publisher.yml
          cp v15-artifact/publisher-closed-world-contract.json publisher-closed-world-contract.json
          cp v15-artifact/closed-world-hostile-fixtures.json closed-world-hostile-fixtures.json
          test "$(sha256sum canonical-final-publisher.yml | cut -d' ' -f1)" = "$PR845_CANONICAL_SHA256"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path('canonical-final-publisher.yml'); raw=p.read_text()
          old_d='KNOWN_DEFECT=5500494933'; new_d='KNOWN_DEFECT=5500921469'
          old_c="('CONFIRMED_DEFECT' in b or 'QUARANTINE_DOWNSTREAM=true' in b or 'FAIL_CLOSED' in b or 'BLOCKER' in b)"
          new_c="('CONFIRMED_DEFECT' in b or 'MATERIAL_RISK' in b or 'QUARANTINE_DOWNSTREAM=true' in b or 'FAIL_CLOSED' in b or 'FAIL-CLOSED' in b or 'BLOCKER' in b)"
          if raw.count(old_d)!=1 or raw.count(old_c)!=1 or new_d in raw or new_c in raw: raise SystemExit('V16 patch source cardinality drift')
          patched=raw.replace(old_d,new_d,1).replace(old_c,new_c,1); p.write_text(patched)
          markers=['CONFIRMED_DEFECT','MATERIAL_RISK','QUARANTINE_DOWNSTREAM=true','FAIL_CLOSED','FAIL-CLOSED','BLOCKER']
          def blocks(cid,body): return cid>5500921469 and 'AVPS' in body and any(m in body for m in markers)
          hostile={}
          for m in markers:
              if not blocks(5500921470,f'INDEPENDENT_AUDIT::{m} AVPS_ORDINAL45_SYNTHETIC'): raise SystemExit(f'classifier missed {m}')
              hostile[m]='REJECTED'
          if blocks(5500921469,'INDEPENDENT_AUDIT::MATERIAL_RISK AVPS_BOUND'): raise SystemExit('bound cutoff rejected')
          if blocks(5500921470,'INDEPENDENT_AUDIT::ACCEPT AVPS_SYNTHETIC'): raise SystemExit('benign AVPS rejected')
          if blocks(5500921470,'INDEPENDENT_AUDIT::MATERIAL_RISK ARM_SYNTHETIC'): raise SystemExit('non-AVPS rejected')
          digest=hashlib.sha256(patched.encode()).hexdigest(); Path('canonical-final-publisher.sha256').write_text(digest+'\n')
          contract=json.load(open('publisher-closed-world-contract.json'))
          if contract.get('wholeWorkflowByteBound') is not True or contract.get('publisherCompleteExecutableSurfaceClosedWorld',True) is not True: raise SystemExit('V15 closed-world contract drift')
          contract.update({'knownDefectBound':5500921469,'liveGovernanceBlockingMarkers':markers,'reviewerAndPublisherClassifierSemanticsAligned':True,'canonicalPublisherSha256':digest,'status':'PASS_V16_NORMALIZED_LIVE_GOVERNANCE_CLASSIFIER'})
          Path('publisher-closed-world-contract.json').write_text(json.dumps(contract,sort_keys=True,indent=2)+'\n')
          Path('v16-classifier-fixtures.json').write_text(json.dumps({'schemaVersion':1,'markers':markers,'hostile':hostile,'boundCutoffAllowed':True,'benignAvpsAllowed':True,'nonAvpsLaneAllowed':True},sort_keys=True,indent=2)+'\n')
          Path('v16-patch.json').write_text(json.dumps({'schemaVersion':1,'sourceV15Head':os.environ['PR845_HEAD'],'sourceCanonicalSha256':os.environ['PR845_CANONICAL_SHA256'],'oldKnownDefect':5500494933,'newKnownDefect':5500921469,'cutoffReplacementCount':1,'classifierReplacementCount':1,'allOtherV15CanonicalBytesPreserved':True,'canonicalPublisherSha256':digest},sort_keys=True,indent=2)+'\n')
          if os.environ['MODE']=='publisher':
              if Path(os.environ['PUBLISHER_PATH']).read_text()!=patched: raise SystemExit('publisher differs from exact V16 canonical bytes')
          PY

      - name: Replay exact V15 repository-global scan with bound V16 cutoff
        shell: bash
        env:
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git show "$PR845_HEAD:$V15_PATH" > pr845-review.yml
          python - <<'PY'
          import ast
          from pathlib import Path
          raw=Path('pr845-review.yml').read_text()
          env_start=raw.index('    env:\n')+len('    env:\n'); env_end=raw.index('    steps:\n',env_start)
          exports=[]
          for line in raw[env_start:env_end].splitlines():
              if not line.startswith('      ') or ': ' not in line: continue
              k,v=line.strip().split(': ',1)
              if v.startswith(("'",'"')):
                  try: v=ast.literal_eval(v)
                  except Exception: raise SystemExit(f'V15 static env parse drift {k}')
              exports.append((k,v))
          out=[]
          for k,v in exports:
              if k=='PR840_DEFECT_COMMENT': v='5500921469'
              out.append(f"export {k}={v!r}")
          Path('v15-static-env.sh').write_text('\n'.join(out)+'\n')
          name='Replay exact V14 fresh repository-global review at runtime'; anchor=f'      - name: {name}\n'
          if raw.count(anchor)!=1: raise SystemExit('V15 global-review anchor drift')
          a=raw.index(anchor); r=raw.index('        run: |\n',a)+len('        run: |\n')
          ends=[x for x in (raw.find('\n      - name:',r),raw.find('\n      - uses:',r)) if x!=-1]
          if not ends: raise SystemExit('V15 global-review end anchor missing')
          lines=raw[r:min(ends)].splitlines()
          if any(line and not line.startswith('          ') for line in lines): raise SystemExit('V15 global-review indentation drift')
          Path('v15-global-review.sh').write_text('\n'.join(line[10:] if line.startswith('          ') else '' for line in lines)+'\n')
          PY
          source v15-static-env.sh
          export EVENT_BRANCH EVENT_HEAD GH_TOKEN GITHUB_TOKEN
          bash v15-global-review.sh

      - name: Fresh normalized Issue60 recheck after global scan and write receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.mode.outputs.mode }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > final-comments.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/avps-v2-postconsumption-recovery4-science.yml/runs?event=workflow_dispatch&per_page=100" > final-runs.json
          if git ls-remote --exit-code --heads origin "$DISPATCH_BRANCH" >/dev/null 2>&1; then echo 'dispatch ref appeared' >&2; exit 1; fi
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          comments=[c for p in json.load(open('final-comments.json')) for c in p]
          markers=['CONFIRMED_DEFECT','MATERIAL_RISK','QUARANTINE_DOWNSTREAM=true','FAIL_CLOSED','FAIL-CLOSED','BLOCKER']; cutoff=5500921469
          for c in comments:
              if int(c.get('id') or 0)>cutoff and 'AVPS' in str(c.get('body') or '') and any(m in str(c.get('body') or '') for m in markers): raise SystemExit(f'newer AVPS blocker/risk after scan: {c.get("id")}')
          bodies=[str(c.get('body') or '').strip() for c in comments]
          if sum(b==os.environ['ALLOCATION_MARKER'] for b in bodies)!=1 or any(b.startswith(os.environ['CONSUMED_MARKER']) for b in bodies): raise SystemExit('allocation/consumed drift after scan')
          closed=set(); begins=[]
          for c in comments:
              body=str(c.get('body') or '').strip(); first=body.splitlines()[0] if body else ''; fields={}
              for tok in first.replace('|',' ').split():
                  if '=' in tok:
                      k,v=tok.split('=',1); fields.setdefault(k,[]).append(v)
              if first.startswith('WRITE_QUIET_END'):
                  vals=[int(v) for k in ('begin','beginComment','begin_comment') for v in fields.get(k,[]) if v.isdigit()]
                  rawvals=[v for k in ('begin','beginComment','begin_comment') for v in fields.get(k,[])]
                  if len(vals)!=len(rawvals) or len(set(vals))>1: raise SystemExit('invalid/conflicting END alias')
                  if vals: closed.add(vals[0])
              elif first.startswith('WRITE_QUIET_BEGIN'): begins.append(int(c['id']))
          if [x for x in begins if x not in closed]: raise SystemExit('unmatched WRITE_QUIET_BEGIN after scan')
          runs=[r for p in json.load(open('final-runs.json')) for r in p.get('workflow_runs',[])]
          if runs: raise SystemExit('science workflow_dispatch appeared during review')
          scan=json.load(open('repository-global-seed-scan.json'))
          if scan.get('repositoryGlobalCollisionCount',scan.get('collisionCount'))!=0 or scan.get('repositoryGlobalDoubleEnumerationStable') is not True or scan.get('auditedBranchHeadMatchesRepositoryHead') is not True: raise SystemExit('repository-global scan contract failed')
          receipt={'schemaVersion':12,'status':'PASS_AVPS_V2_RECOVERY4_ORDINAL45_FINAL_DISPATCH_CHOREOGRAPHY_REVIEW_V16_ZERO_RUNTIME','mode':os.environ['MODE'],'headSha':os.environ['EVENT_HEAD'],'baseSha':os.environ['EVENT_BASE'],'reviewerBlob':subprocess.check_output(['git','hash-object',os.environ['INFRA_PATH']],text=True).strip(),'pr845PrimaryDefect':5500881319,'pr845BackupDefect':5500921469,'v15Artifact':9821218710,'newerBlockerCutoff':cutoff,'liveGovernanceBlockingMarkers':markers,'reviewerAndPublisherClassifierSemanticsAligned':True,'scientificOrdinal':45,'candidateSeedCanonicalSha256':os.environ['CANDIDATE_SEED_SHA256'],'candidateRowsCanonicalSha256':os.environ['CANDIDATE_ROWS_SHA256'],'caseCount':360,'commonRandomNumberGroupCount':72,'statesPerGroup':5,'photonHistoriesPerCase':20000000,'canonicalPublisherSha256':Path('canonical-final-publisher.sha256').read_text().strip(),'dispatchCreated':False,'consumedMarkerCreated':False,'workflowDispatchPerformed':False,'solverExecutionPerformed':False,'resultOpeningAuthorized':False,'levelBAdmissionAuthorized':False,'holdoutOpened':False,'productionAuthorized':False,'taylorOrJerusalemUsed':False,'newMappingAuthorized':False}
          Path('review-receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v16
          path: |
            review-receipt.json
            canonical-final-publisher.yml
            canonical-final-publisher.sha256
            publisher-closed-world-contract.json
            closed-world-hostile-fixtures.json
