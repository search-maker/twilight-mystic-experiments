          if os.environ['MODE']=='publisher' and Path(os.environ['PUBLISHER_PATH']).read_text()!=patched: raise SystemExit('publisher differs from exact V19 canonical bytes')
          PY

      - name: Replay exact V15 repository-global scan with bound V19 cutoff
        shell: bash
        env:
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
