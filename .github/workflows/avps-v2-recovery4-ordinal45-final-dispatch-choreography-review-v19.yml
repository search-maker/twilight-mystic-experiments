    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Bind exact V19 identity, rejected V18 evidence, and live fence
        id: mode
        shell: bash
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "${{ github.event.action }}" = opened
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test "$(git rev-parse HEAD^)" = "$EVENT_BASE"
          test "$(git rev-list --count "$EVENT_BASE"..HEAD)" = 1
          mapfile -t CHANGED < <(git diff --name-only "$EVENT_BASE"...HEAD)
          test "${#CHANGED[@]}" = 1
          if [ "${CHANGED[0]}" = "$INFRA_PATH" ]; then
            test "$EVENT_BASE" = "$INFRA_BASE"
            test "$EVENT_BRANCH" = "$INFRA_BRANCH"
            test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$INFRA_BASE"
            echo mode=infra >> "$GITHUB_OUTPUT"
          elif [ "${CHANGED[0]}" = "$PUBLISHER_PATH" ]; then
            test "$EVENT_BRANCH" = "$PUBLISHER_BRANCH"
            test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EVENT_BASE"
            test "$(git rev-parse "$EVENT_BASE:$INFRA_PATH")" = "$(git rev-parse "HEAD:$INFRA_PATH")"
            echo mode=publisher >> "$GITHUB_OUTPUT"
          else
            echo "unexpected changed path: ${CHANGED[0]}" >&2; exit 1
          fi
          cat > v19-classifier-core.py <<'PYCORE'
          import re

          _KEYS=('DIRECTIVE','STATUS','STATE','DISPOSITION','ADMISSIBILITY','CLASSIFICATION')
          _EMPH=('**','__','~~','*','_')
          _PUNCT=':=|\u2013\u2014-'

          def _strip_presentation(line):
              s=str(line or '').strip()
              if not s:
                  return ''
              while True:
                  old=s
                  s=re.sub(r'^\s*>\s?', '', s, count=1)
                  s=re.sub(r'^\s*(?:[-+*]|\d+[.)])\s+', '', s, count=1)
                  s=re.sub(r'^\s{0,3}#{1,6}\s+', '', s, count=1)
                  s=s.strip()
                  if s==old:
                      break
              for mark in _EMPH:
                  if len(s)>2*len(mark) and s.startswith(mark) and s.endswith(mark):
                      s=s[len(mark):-len(mark)].strip()
                      break
              return s

          def _key_and_rest(s):
              for mark in _EMPH + ('',):
                  if mark and not s.startswith(mark):
                      continue
                  core=s[len(mark):] if mark else s
                  m=re.match(r'^(DIRECTIVE|STATUS|STATE|DISPOSITION|ADMISSIBILITY|CLASSIFICATION)',core,re.I)
                  if not m:
                      continue
                  key=m.group(1).upper(); rest=core[m.end():]
                  if not mark and rest and (rest[0].isalnum() or rest[0]=='_'):
                      continue
                  closed=not bool(mark)
                  for _ in range(6):
                      changed=False
                      if mark and not closed and rest.startswith(mark):
                          rest=rest[len(mark):].lstrip(); closed=True; changed=True
                      if rest and rest[0] in _PUNCT:
                          rest=rest[1:].lstrip(); changed=True
                      if mark and not closed and rest.startswith(mark):
                          rest=rest[len(mark):].lstrip(); closed=True; changed=True
                      if not changed:
                          break
                  if mark and not closed:
                      continue
                  if rest and rest[0].isalnum() and not rest[0].isspace():
                      # after recognized key/markup/punctuation, the value may begin immediately;
                      # this is allowed because the key boundary was supplied by markup/punctuation.
                      pass
                  return key,rest.strip()
              return None

          def _structured_line(line):
              s=_strip_presentation(line)
              if not s:
                  return None
              parsed=_key_and_rest(s)
              if parsed is None:
                  return None
              key,rest=parsed
              return key + ((' ' + rest) if rest else '')

          def avps_governance_blocker(body):
              u=str(body or '').upper()
              if 'AVPS' not in u:
                  return False
              if any(m in u for m in ('CONFIRMED_DEFECT','MATERIAL_RISK','QUARANTINE_DOWNSTREAM=TRUE','FAIL_CLOSED','FAIL-CLOSED','BLOCKER')):
                  return True
              raw=[x for x in str(body or '').splitlines() if x.strip()]
              if not raw:
                  return False
              surfaces=[_strip_presentation(raw[0])]
              for line in raw[1:]:
                  parsed=_structured_line(line)
                  if parsed is not None:
                      surfaces.append(parsed)
              for line in surfaces:
                  x=line.upper()
                  if re.search(r'NOT[\s_-]+ADMISSIBLE',x) or re.search(r'DO[\s_-]+NOT[\s_-]+USE',x):
                      return True
                  if re.search(r'COORDINATOR[\s_-]+RECOVERY',x):
                      return True
                  if re.search(r'SUPERSEDING[\s_-]+DIRECTIVE',x):
                      return True
                  if re.search(r'(?<![A-Z0-9_])CLOSED(?![A-Z0-9_])',x):
                      return True
              return False
          PYCORE
          if git ls-remote --exit-code --heads origin "$DISPATCH_BRANCH" >/dev/null 2>&1; then echo 'dispatch ref exists' >&2; exit 1; fi
          git fetch --no-tags origin "$PR852_HEAD"
          test "$(git rev-parse "$PR852_HEAD^{tree}")" = "$PR852_TREE"
          test "$(git rev-parse "$PR852_HEAD:.github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v18.yml")" = "$PR852_WORKFLOW_BLOB"
          gh api "repos/$GITHUB_REPOSITORY/pulls/852" > pr852.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR852_DEDICATED_RUN" > pr852-run.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$PR852_DEDICATED_RUN/jobs?per_page=100" > pr852-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR852_GENERIC_RUN" > pr852-generic.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > issue60-pages.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/avps-v2-postconsumption-recovery4-science.yml/runs?event=workflow_dispatch&per_page=100" > science-runs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/33560139809/artifacts?per_page=100" > v15-artifacts.json
          python - <<'PY'
          import importlib.util,json,os
          spec=importlib.util.spec_from_file_location('v19c','v19-classifier-core.py'); mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          load=lambda p: json.load(open(p))
          p=load('pr852.json'); r=load('pr852-run.json'); g=load('pr852-generic.json')
          jobs=[j for page in load('pr852-jobs.json') for j in page.get('jobs',[])]
          if p.get('state')!='closed' or p.get('merged_at') is not None or p['head']['sha']!=os.environ['PR852_HEAD'] or p['base']['sha']!=os.environ['INFRA_BASE']: raise SystemExit('PR852 identity drift')
          if r['id']!=int(os.environ['PR852_DEDICATED_RUN']) or r['head_sha']!=os.environ['PR852_HEAD'] or r['run_attempt']!=1 or r.get('conclusion')!='failure': raise SystemExit('PR852 dedicated drift')
          exact=[j for j in jobs if int(j.get('id') or 0)==int(os.environ['PR852_DEDICATED_JOB'])]
          if len(exact)!=1 or exact[0].get('run_id')!=r['id'] or exact[0].get('conclusion')!='failure': raise SystemExit('PR852 job drift')
          step={s.get('name'):s.get('conclusion') for s in exact[0].get('steps',[])}
          if step.get('Bind exact V18 identity, rejected V17 evidence, and normalized live fence')!='success': raise SystemExit('PR852 bind-step drift')
          if step.get('Download exact clean V15 review artifact')!='success': raise SystemExit('PR852 artifact-step drift')
          if step.get('Build exact V18 publisher with markdown-normalized classifier')!='failure': raise SystemExit('PR852 deterministic classifier failure drift')
          if step.get('Replay exact V15 repository-global scan with bound V18 cutoff')!='skipped' or step.get('Fresh normalized Issue60 recheck after global scan and write receipt')!='skipped': raise SystemExit('PR852 post-failure step drift')
          if g['id']!=int(os.environ['PR852_GENERIC_RUN']) or g['head_sha']!=os.environ['PR852_HEAD'] or g['run_attempt']!=1: raise SystemExit('PR852 generic identity drift')
          comments=[c for page in load('issue60-pages.json') for c in page]
          hits=[c for c in comments if int(c.get('id') or 0)==int(os.environ['PR852_DEFECT'])]
          if len(hits)!=1: raise SystemExit('PR852 defect comment cardinality drift')
          c=hits[0]; b=str(c.get('body') or ''); u=c.get('user') or {}
          prefix='COORDINATOR::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_DISPATCH_CHOREOGRAPHY_REVIEW_INFRA_V18_PR852_KEY_ONLY_EMPHASIS_NORMALIZATION_MISSED'
          tokens=['pr=852',f'head={os.environ["PR852_HEAD"]}',f'base={os.environ["INFRA_BASE"]}',f'tree={os.environ["PR852_TREE"]}',f'workflow_blob={os.environ["PR852_WORKFLOW_BLOB"]}',f'dedicated_run={os.environ["PR852_DEDICATED_RUN"]}',f'dedicated_job={os.environ["PR852_DEDICATED_JOB"]}','dedicated_attempt=1','dedicated_conclusion=FAILURE',f'generic_run={os.environ["PR852_GENERIC_RUN"]}','generic_status_at_decision=IN_PROGRESS','QUARANTINE_DOWNSTREAM=false','NON_AUTHORIZING=true']
          if not b.startswith(prefix) or u.get('login')!='search-maker' or int(u.get('id') or 0)!=304153003 or c.get('author_association')!='OWNER': raise SystemExit('PR852 defect comment identity drift')
          for t in tokens:
              if t not in b: raise SystemExit(f'PR852 defect token drift: {t}')
          cutoff=int(os.environ['PR852_DEFECT'])
          for c in comments:
              if int(c.get('id') or 0)>cutoff and mod.avps_governance_blocker(c.get('body')): raise SystemExit(f'newer normalized AVPS blocker exists: {c.get("id")}')
          bodies=[str(c.get('body') or '').strip() for c in comments]
          if sum(b==os.environ['ALLOCATION_MARKER'] for b in bodies)!=1: raise SystemExit('allocation marker drift')
          if any(b.startswith(os.environ['CONSUMED_MARKER']) for b in bodies): raise SystemExit('consumed marker exists')
          closed=set(); begins=[]
          for c in comments:
              body=str(c.get('body') or '').strip(); first=body.splitlines()[0] if body else ''; fields={}
              for tok in first.replace('|',' ').split():
                  if '=' in tok:
                      k,v=tok.split('=',1); fields.setdefault(k,[]).append(v)
              if first.startswith('WRITE_QUIET_END'):
                  vals=[]; rawvals=[]
                  for key in ('begin','beginComment','begin_comment'):
                      for v in fields.get(key,[]):
                          rawvals.append(v)
                          if v.isdigit(): vals.append(int(v))
                  if len(vals)!=len(rawvals) or len(set(vals))>1: raise SystemExit('invalid/conflicting END alias')
                  if vals: closed.add(vals[0])
              elif first.startswith('WRITE_QUIET_BEGIN'): begins.append(int(c['id']))
          if [x for x in begins if x not in closed]: raise SystemExit('unmatched WRITE_QUIET_BEGIN')
          runs=[x for page in load('science-runs.json') for x in page.get('workflow_runs',[])]
          if runs: raise SystemExit('prior ordinal45 science run exists')
          arts=load('v15-artifacts.json').get('artifacts',[])
          hits=[a for a in arts if int(a.get('id') or 0)==int(os.environ['PR845_ARTIFACT'])]
          if len(hits)!=1 or hits[0].get('name')!=os.environ['PR845_ARTIFACT_NAME'] or hits[0].get('digest')!=os.environ['PR845_ARTIFACT_DIGEST'] or hits[0].get('expired') is True: raise SystemExit('V15 artifact identity drift')
          PY
          test "$(git rev-parse "HEAD:$SCIENCE_WORKFLOW")" = "$SCIENCE_WORKFLOW_BLOB"
          test "$(git rev-parse "HEAD:$RUNTIME_ADAPTER")" = "$RUNTIME_ADAPTER_BLOB"
          test "$(git rev-parse "HEAD:$EXECUTOR")" = "$EXECUTOR_BLOB"
          test "$(git rev-parse "HEAD:$AGGREGATOR")" = "$AGGREGATOR_BLOB"
          test "$(git rev-parse "HEAD:$RUNTIME_CONTRACT")" = "$RUNTIME_CONTRACT_BLOB"

      - name: Download exact clean V15 review artifact
        uses: actions/download-artifact@v4
        with:
          name: avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v15
          path: v15-artifact
          repository: ${{ github.repository }}
          run-id: 33560139809
          github-token: ${{ github.token }}

      - name: Build exact V19 publisher with key-emphasis-safe classifier
        shell: bash
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          cp v15-artifact/canonical-final-publisher.yml canonical-final-publisher.yml
          cp v15-artifact/publisher-closed-world-contract.json publisher-closed-world-contract.json
          cp v15-artifact/closed-world-hostile-fixtures.json closed-world-hostile-fixtures.json
          test "$(sha256sum canonical-final-publisher.yml | cut -d' ' -f1)" = "$PR845_CANONICAL_SHA256"
          python - <<'PY'
          import hashlib,importlib.util,json,os
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('v19c','v19-classifier-core.py'); mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          p=Path('canonical-final-publisher.yml'); raw=p.read_text()
          old_d='KNOWN_DEFECT=5500494933'; new_d='KNOWN_DEFECT=5501505154'
          old_c="('CONFIRMED_DEFECT' in b or 'QUARANTINE_DOWNSTREAM=true' in b or 'FAIL_CLOSED' in b or 'BLOCKER' in b)"
          anchor='          def state_check():\n'
          if raw.count(old_d)!=1 or raw.count(old_c)!=1 or raw.count(anchor)!=1: raise SystemExit('V19 patch source cardinality drift')
          core=Path('v19-classifier-core.py').read_text().strip('\n')
          helper='\n'.join(('          '+line if line else '') for line in core.splitlines())+'\n'
          patched=raw.replace(old_d,new_d,1).replace(anchor,helper+anchor,1).replace(old_c,'avps_governance_blocker(b)',1)
          if patched.count('KNOWN_DEFECT=5501505154')!=1 or patched.count('def avps_governance_blocker(body):')!=1 or patched.count('avps_governance_blocker(b)')!=1: raise SystemExit('V19 canonical insertion drift')
          fatal=[
            'INDEPENDENT_AUDIT::CONFIRMED_DEFECT AVPS_ORDINAL45_SYNTHETIC',
            'INDEPENDENT_AUDIT::MATERIAL_RISK AVPS_ORDINAL45_SYNTHETIC',
            'AVPS_ORDINAL45 QUARANTINE_DOWNSTREAM=true',
            'AVPS_ORDINAL45_FAIL_CLOSED',
            'AVPS_ORDINAL45_FAIL-CLOSED',
            'AVPS_ORDINAL45_BLOCKER',
            'AVPS_ORDINAL45_TRANSITION\nSTATUS: NOT_ADMISSIBLE',
            'AVPS_ORDINAL45_TRANSITION\n**STATUS**: NOT_ADMISSIBLE',
            'AVPS_ORDINAL45_TRANSITION\n__STATUS__: NOT_ADMISSIBLE',
            'AVPS_ORDINAL45_TRANSITION\n*STATUS*: NOT_ADMISSIBLE',
            'AVPS_ORDINAL45_TRANSITION\n_STATUS_: NOT_ADMISSIBLE',
            'AVPS_ORDINAL45_TRANSITION\n~~STATUS~~: NOT_ADMISSIBLE',
            'AVPS_ORDINAL45_TRANSITION\n**STATUS:** NOT_ADMISSIBLE',
            'AVPS_ORDINAL45_TRANSITION\n__STATUS:__ NOT_ADMISSIBLE',
            'AVPS_ORDINAL45_TRANSITION\n- **STATUS:** NOT_ADMISSIBLE',
            'AVPS_ORDINAL45_TRANSITION\n1. _STATUS_: NOT_ADMISSIBLE',
            'AVPS_ORDINAL45_TRANSITION\n> ### **STATUS:** NOT_ADMISSIBLE',
            'AVPS_ORDINAL45_TRANSITION\n> ADMISSIBILITY: NOT_ADMISSIBLE',
            'AVPS_ORDINAL45_TRANSITION\n- **DISPOSITION:** DO-NOT-USE',
            'AVPS_ORDINAL45_TRANSITION\n### STATE: CLOSED',
            'AVPS_ORDINAL45_TRANSITION\n> __ADMISSIBILITY__: CLOSED',
            'AVPS_ORDINAL45_TRANSITION\n**CLASSIFICATION:** SUPERSEDING-DIRECTIVE',
            'AVPS_ORDINAL45_TRANSITION\n> _CLASSIFICATION_: COORDINATOR_RECOVERY']
          for body in fatal:
              if not mod.avps_governance_blocker(body): raise SystemExit(f'classifier missed fatal fixture: {body}')
          benign=[
            'INDEPENDENT_AUDIT::ACCEPT_AVPS_ORDINAL45_SYNTHETIC',
            'INDEPENDENT_AUDIT::ACCEPT_AVPS_CLOSED_WORLD_PROOF',
            'INDEPENDENT_AUDIT::ACCEPT_AVPS_ORDINAL45_SYNTHETIC\nHistorical predecessor PR852 CLOSED/UNMERGED only.',
            'ARM_SYNTHETIC DO NOT USE',
            'AVPS_ORDINAL45_TRANSITION_ELIGIBLE\nHistorical text: no newer NOT_ADMISSIBLE / DO NOT USE / CLOSED / coordinator-recovery or superseding classification.',
            'AVPS_ORDINAL45_TRANSITION_ELIGIBLE\n- Historical note: **STATUS:** NOT_ADMISSIBLE appeared only in predecessor evidence.',
            'AVPS_ORDINAL45_TRANSITION_ELIGIBLE\n> Narrative quote: _STATUS_: CLOSED was a prior example.',
