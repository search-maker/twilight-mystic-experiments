          digest=hashlib.sha256(patched.encode()).hexdigest(); core_digest=hashlib.sha256(core.encode()).hexdigest()
          p.write_text(patched); Path('canonical-final-publisher.sha256').write_text(digest+'\n'); Path('v19-classifier.sha256').write_text(core_digest+'\n')
