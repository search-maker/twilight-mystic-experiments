name: Review AVPS Recovery4 ordinal45 final dispatch choreography v19

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v19.yml
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1.yml

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v19-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      INFRA_BASE: de3fafa052ff1d5b2f33ec0d4347c884d560d8b6
      INFRA_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-infrastructure-v19
      INFRA_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v19.yml
      V15_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v1.yml
      PUBLISHER_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1
      PUBLISHER_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1.yml
      PR852_HEAD: a9fac46b79ca5cb3de27534067a14ce13fd230f5
      PR852_TREE: 50809944254aa2a76d3490f0319ba569d2b32eca
      PR852_WORKFLOW_BLOB: 9141e0086a0d1446e3d2f404d9794a4c26b47437
      PR852_DEDICATED_RUN: '33568238884'
      PR852_DEDICATED_JOB: '100056234726'
      PR852_GENERIC_RUN: '33568238846'
      PR852_DEFECT: '5501505154'
      PR845_HEAD: e461c26ec78e9832ff43859bf63baf49464628b1
      PR845_ARTIFACT: '9821218710'
      PR845_ARTIFACT_NAME: avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v15
      PR845_ARTIFACT_DIGEST: sha256:fe3d0f62611a84f2e86e9b8695cfbf63a90819f4be7e012dd2ddeff9e6159eb4
      PR845_CANONICAL_SHA256: da768723a4e830374cb8bf5da79e452551cf7f7716e62764516323a80572e800
      ALLOCATION_MARKER: ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_AUTHORIZATION_ALLOCATED_REVIEWED_NOT_DISPATCHED commit=6e095b4b1603c90dcee0943295909b30cd1b374d parent=5685d5c313071014a94c816ee26b129f1f17a7fc pr=774
      CONSUMED_MARKER: ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_DISPATCH_CONSUMED
      DISPATCH_BRANCH: dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-ordinal-45
      SCIENCE_WORKFLOW: .github/workflows/avps-v2-postconsumption-recovery4-science.yml
      SCIENCE_WORKFLOW_BLOB: 2d210b3a161f6889352d600fb9222c974e728034
      RUNTIME_ADAPTER: runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py
      RUNTIME_ADAPTER_BLOB: e4b690c2969fd01ecde5b08f554e47ad50b40914
      EXECUTOR: runtime-avps-v2-recovery4-ordinal45-v1/executor.py
      EXECUTOR_BLOB: 7dc38e31c19701b1a1ceef300d75105cff179290
      AGGREGATOR: runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py
      AGGREGATOR_BLOB: 6afc8b0d21c2b5553c251dc9ca5524c795ed2646
