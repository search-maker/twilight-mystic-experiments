          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "${{ github.event.action }}" = opened
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test "$(git rev-parse HEAD^)" = "$EVENT_BASE"
          test "$(git rev-list --count "$EVENT_BASE"..HEAD)" = 1
          mapfile -t C < <(git diff --name-only "$EVENT_BASE"...HEAD)
          test "${#C[@]}" = 1
          if [ "${C[0]}" = "$INFRA_PATH" ]; then
            test "$EVENT_BASE" = "$INFRA_BASE"
            test "$EVENT_BRANCH" = "$INFRA_BRANCH"
            test "$(git ls-remote origin refs/heads/main|cut -f1)" = "$INFRA_BASE"
            echo mode=infra >> "$GITHUB_OUTPUT"
          elif [ "${C[0]}" = "$PUBLISHER_PATH" ]; then
            test "$EVENT_BRANCH" = "$PUBLISHER_BRANCH"
            test "$(git ls-remote origin refs/heads/main|cut -f1)" = "$EVENT_BASE"
            test "$(git rev-parse "$EVENT_BASE:$INFRA_PATH")" = "$(git rev-parse "HEAD:$INFRA_PATH")"
            echo mode=publisher >> "$GITHUB_OUTPUT"
          else
            exit 1
          fi
          git fetch --no-tags origin "$PR853_HEAD" "$PR863_HEAD"
          test "$(git rev-parse "$PR863_HEAD^{tree}")" = "$PR863_TREE"
          test "$(git rev-parse "$PR863_HEAD:.github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v22.yml")" = "$PR863_BLOB"
          if git ls-remote --exit-code --heads origin "$DISPATCH_BRANCH" >/dev/null 2>&1; then exit 1; fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/863" > p.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR863_RUN" > r.json
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$PR863_JOB" > j.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR863_GENERIC" > g.json
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$PR863_GENERIC_JOB" > gj.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR863_RUN/artifacts?per_page=100" > a.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > c.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/avps-v2-postconsumption-recovery4-science.yml/runs?event=workflow_dispatch&per_page=100" > s.json
