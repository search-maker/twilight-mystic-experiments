          C=[x for q in z('c.json') for x in q]
          h=[x for x in C if int(x.get('id') or 0)==int(os.environ['V22_BACKUP_DEFECT'])]
          if len(h)!=1:raise SystemExit('V22 defect cardinality')
          b=str(h[0].get('body') or '')
          if not b.startswith('BACKUP_INDEPENDENT_AUDIT::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_DISPATCH_CHOREOGRAPHY_REVIEW_INFRA_V22_PR863_BENIGN_FIRSTLINE_CLOSED_WORLD_OVERBLOCK'):raise SystemExit('V22 defect prefix')
          if (h[0].get('user') or {}).get('login')!='search-maker' or int((h[0].get('user') or {}).get('id') or 0)!=304153003 or h[0].get('author_association')!='OWNER':raise SystemExit('V22 defect actor')
          tokens=(
            'pr=863',f'head={os.environ["PR863_HEAD"]}',f'base={os.environ["INFRA_BASE"]}',f'tree={os.environ["PR863_TREE"]}',f'reviewer_blob={os.environ["PR863_BLOB"]}',
            f'dedicated_run={os.environ["PR863_RUN"]}',f'dedicated_job={os.environ["PR863_JOB"]}','dedicated_attempt=1','dedicated_conclusion=SUCCESS',
            f'artifact={os.environ["PR863_ARTIFACT"]}',f'artifact_digest={os.environ["PR863_ARTIFACT_DIGEST"]}',f'generic_run={os.environ["PR863_GENERIC"]}',f'generic_job={os.environ["PR863_GENERIC_JOB"]}',
            'generic_attempt=1','generic_conclusion=SUCCESS','QUARANTINE_DOWNSTREAM=false','NON_AUTHORIZING=true','NO_DISPATCH=true','NO_CONSUMED=true','NO_SCIENCE=true')
          for t in tokens:
            if t not in b:raise SystemExit('V22 defect token '+t)
          bodies=[str(x.get('body') or '').strip() for x in C]
          if sum(x==os.environ['ALLOCATION_MARKER'] for x in bodies)!=1 or any(x.startswith(os.environ['CONSUMED_MARKER']) for x in bodies):raise SystemExit('allocation/consumed drift')
          ends=set();beg=[]
          for x in C:
            first=str(x.get('body') or '').strip().splitlines(); first=first[0] if first else ''; fields={}
            for tok in first.replace('|',' ').split():
              if '=' in tok:
                k,v=tok.split('=',1); fields.setdefault(k,[]).append(v)
            if first.startswith('WRITE_QUIET_END'):
              vals=[];raw=[]
