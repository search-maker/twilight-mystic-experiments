          import json,os
          z=lambda p:json.load(open(p))
          p,r,j,g,gj=z('p.json'),z('r.json'),z('j.json'),z('g.json'),z('gj.json')
          if p.get('state')!='closed' or p.get('merged_at') is not None or p['head']['sha']!=os.environ['PR863_HEAD'] or p['base']['sha']!=os.environ['INFRA_BASE']:raise SystemExit('PR863 drift')
          if r['id']!=int(os.environ['PR863_RUN']) or r['head_sha']!=os.environ['PR863_HEAD'] or r['run_attempt']!=1 or r['conclusion']!='success':raise SystemExit('V22 dedicated drift')
          if j['id']!=int(os.environ['PR863_JOB']) or j['run_id']!=r['id'] or j['conclusion']!='success':raise SystemExit('V22 job drift')
