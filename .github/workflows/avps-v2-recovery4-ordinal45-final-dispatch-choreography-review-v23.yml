      PR863_JOB: '100084123613'
      PR863_GENERIC: '33577350115'
      PR863_GENERIC_JOB: '100084123498'
      PR863_ARTIFACT: '9827324743'
      PR863_ARTIFACT_NAME: avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v22
      PR863_ARTIFACT_DIGEST: sha256:9f31e55472fec84f4293e71158eb0a6db076e453567786a41483c27825045e4a
      V22_BACKUP_DEFECT: '5502816535'
