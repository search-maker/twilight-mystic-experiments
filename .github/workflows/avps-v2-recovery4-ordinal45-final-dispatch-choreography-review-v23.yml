name: Review AVPS Recovery4 ordinal45 final dispatch choreography v23

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v23.yml
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1.yml

permissions: {contents: read, actions: read, issues: read, pull-requests: read}
concurrency:
  group: avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v23-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

