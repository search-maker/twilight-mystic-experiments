          for k in ('dispatchCreated','consumedMarkerCreated','workflowDispatchPerformed','solverExecutionPerformed','resultOpeningAuthorized','levelBAdmissionAuthorized','holdoutOpened','productionAuthorized','taylorOrJerusalemUsed','newMappingAuthorized'):
            if R.get(k) is not False:raise SystemExit('V22 authority drift '+k)
          got=hashlib.sha256(Path('old.py').read_text().strip('\n').encode()).hexdigest()
          if got!=Path('v22/v22-classifier.sha256').read_text().strip():raise SystemExit('V22 classifier digest drift')
          PY
          cat > v23-classifier-core.py <<'PY'
