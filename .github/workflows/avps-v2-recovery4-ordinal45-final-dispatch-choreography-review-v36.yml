name: Review AVPS Recovery4 ordinal45 final dispatch choreography v36

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v36.yml
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1.yml

permissions: {contents: read, actions: read, issues: read, pull-requests: read}
concurrency:
  group: avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v36-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      INFRA_BASE: de3fafa052ff1d5b2f33ec0d4347c884d560d8b6
      INFRA_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-infrastructure-v36
      INFRA_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v36.yml
      PUBLISHER_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1
      PUBLISHER_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1.yml
      PR888_HEAD: b7fa9a0af9b2f889e2db2544963ce98a77a00ca2
      PR888_TREE: 1fe43cdacd9094fa9a4bcfdcc969b79636938158
      PR888_BLOB: 590b1daea145d6519ed5b1b494a4e8364a099ff8
      PR888_RUN: '33619542044'
      PR888_JOB: '100213132005'
      PR888_GENERIC: '33619541946'
      PR888_GENERIC_JOB: '100213131848'
      V35_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v35.yml
      V35_DEFECT: '5508214692'
      V35_RISK: '5508235083'
      LIVE_CUTOFF: '5508235083'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}

      - name: Bind V36 identity, rejected V35 evidence, and exact-only live fence
        id: mode
        shell: bash
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "${{ github.event.action }}" = opened
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test "$(git rev-parse HEAD^)" = "$EVENT_BASE"
          test "$(git rev-list --count "$EVENT_BASE"..HEAD)" = 1
          mapfile -t C < <(git diff --name-only "$EVENT_BASE"...HEAD)
          test "${#C[@]}" = 1
          if [ "${C[0]}" = "$INFRA_PATH" ]; then
            test "$EVENT_BASE" = "$INFRA_BASE"
            test "$EVENT_BRANCH" = "$INFRA_BRANCH"
            test "$(git ls-remote origin refs/heads/main|cut -f1)" = "$INFRA_BASE"
            echo mode=infra >> "$GITHUB_OUTPUT"
          elif [ "${C[0]}" = "$PUBLISHER_PATH" ]; then
            test "$EVENT_BRANCH" = "$PUBLISHER_BRANCH"
            test "$(git ls-remote origin refs/heads/main|cut -f1)" = "$EVENT_BASE"
            test "$(git rev-parse "$EVENT_BASE:$INFRA_PATH")" = "$(git rev-parse "HEAD:$INFRA_PATH")"
            echo mode=publisher >> "$GITHUB_OUTPUT"
          else
            exit 1
          fi
          git fetch --no-tags origin "$PR888_HEAD"
          test "$(git rev-parse "$PR888_HEAD^{tree}")" = "$PR888_TREE"
          test "$(git rev-parse "$PR888_HEAD:$V35_PATH")" = "$PR888_BLOB"
          git show "$PR888_HEAD:$V35_PATH" > v35.yml
          python - <<'PY'
          from pathlib import Path
          import shlex
          raw=Path('v35.yml').read_text();lines=raw.splitlines();a=lines.index('    env:')+1;e=lines.index('    steps:');out=[]
          for line in lines[a:e]:
            if not line.startswith('      ') or ':' not in line: continue
            k,v=line.strip().split(':',1);v=v.strip()
            if len(v)>=2 and v[0]==v[-1] and v[0] in "'\"": v=v[1:-1]
            if k in {'INFRA_BRANCH','INFRA_PATH','LIVE_CUTOFF'}: continue
            out.append('export '+k+'='+shlex.quote(v))
          Path('v35-inherited-env.sh').write_text('\n'.join(out)+'\n')
          PY
          source v35-inherited-env.sh
          gh api "repos/$GITHUB_REPOSITORY/pulls/888" > p35.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR888_RUN" > r35.json
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$PR888_JOB" > j35.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR888_GENERIC" > g35.json
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$PR888_GENERIC_JOB" > gj35.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR888_RUN/artifacts?per_page=100" > a35.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > c.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/avps-v2-postconsumption-recovery4-science.yml/runs?event=workflow_dispatch&per_page=100" > s.json
          python - <<'PY'
          import json,os
          z=lambda p:json.load(open(p));p,r,j,g,gj=z('p35.json'),z('r35.json'),z('j35.json'),z('g35.json'),z('gj35.json')
          if p.get('state')!='closed' or p.get('merged_at') is not None or p['head']['sha']!=os.environ['PR888_HEAD'] or p['base']['sha']!=os.environ['INFRA_BASE']:raise SystemExit('PR888 drift')
          if r['id']!=int(os.environ['PR888_RUN']) or r['head_sha']!=os.environ['PR888_HEAD'] or r['run_attempt']!=1 or r['conclusion']!='failure':raise SystemExit('V35 dedicated drift')
          if j['id']!=int(os.environ['PR888_JOB']) or j['run_id']!=r['id'] or j['conclusion']!='failure':raise SystemExit('V35 job drift')
          st={x.get('name'):x.get('conclusion') for x in j.get('steps',[])}
          exp={'Bind V35 identity, rejected V34 and V32 evidence, and exact-only live fence':'success','Run actions/download-artifact@v4':'success','Replay exact V32 build and bind complete V35 predecessor ledger':'success','Replay exact V32 global scan with corrected cardinality and complete V35 replay environment':'failure','Run actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a':'skipped'}
          for k,v in exp.items():
            if st.get(k)!=v:raise SystemExit('V35 step drift '+k)
          if g['id']!=int(os.environ['PR888_GENERIC']) or g['head_sha']!=os.environ['PR888_HEAD'] or g['run_attempt']!=1 or g['conclusion']!='success':raise SystemExit('V35 generic drift')
          if gj['id']!=int(os.environ['PR888_GENERIC_JOB']) or gj['run_id']!=g['id'] or gj['conclusion']!='success':raise SystemExit('V35 generic job drift')
          if z('a35.json').get('artifacts'):raise SystemExit('V35 unexpected artifact')
          C=[x for q in z('c.json') for x in q]
          expected={
            5507972995:'COORDINATOR::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_DISPATCH_CHOREOGRAPHY_REVIEW_INFRA_V32_PR886_REPOSITORY_GLOBAL_REPLAY_ATTEMPT1_FAILURE',
            5508005095:'COORDINATOR::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_DISPATCH_CHOREOGRAPHY_REVIEW_INFRA_V32_PR886_GLOBAL_REPLAY_ENVIRONMENT_MISSING_V24_CLASSIFIER_SHA',
            5508005691:'INDEPENDENT_AUDIT::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_DISPATCH_CHOREOGRAPHY_REVIEW_INFRA_V32_PR886_DEDICATED_ATTEMPT1_GLOBAL_REPLAY_FAILURE',
            5508022840:'COORDINATOR::ROOT_CAUSE_REFINEMENT_CORRECTION AVPS_ORDINAL45_FINAL_DISPATCH_CHOREOGRAPHY_REVIEW_INFRA_V32_V24_CLASSIFIER_SHA_LINEAGE_SEMANTICS',
            5508037828:'COORDINATOR::MATERIAL_RISK AVPS_ORDINAL45_FINAL_DISPATCH_CHOREOGRAPHY_REVIEW_INFRA_V32_RECURSIVE_REPLAY_HISTORICAL_INFRA_PATH_DEPENDENCIES',
            5508102035:'COORDINATOR::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_DISPATCH_CHOREOGRAPHY_REVIEW_INFRA_V34_PR887_V32_CUTOFF_CARDINALITY_PRECONDITION_ATTEMPT1_FAILURE',
            int(os.environ['V35_DEFECT']):'COORDINATOR::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_DISPATCH_CHOREOGRAPHY_REVIEW_INFRA_V35_PR888_REPOSITORY_GLOBAL_SCAN_STALE_PREEXISTING_FILE_PRECONDITION_ATTEMPT1_FAILURE',
            int(os.environ['V35_RISK']):'COORDINATOR::MATERIAL_RISK AVPS_ORDINAL45_FINAL_DISPATCH_CHOREOGRAPHY_REVIEW_INFRA_V35_HISTORICAL_ENV_SOURCE_OVERWRITES_LIVE_CUTOFF',
          }
          for cid,pref in expected.items():
            hits=[x for x in C if int(x.get('id') or 0)==cid]
            if len(hits)!=1 or not str(hits[0].get('body') or '').startswith(pref):raise SystemExit('predecessor decision binding '+str(cid))
            u=hits[0].get('user') or {};b=str(hits[0].get('body') or '')
            if u.get('login')!='search-maker' or int(u.get('id') or 0)!=304153003 or hits[0].get('author_association')!='OWNER' or 'QUARANTINE_DOWNSTREAM=false' not in b:raise SystemExit('predecessor identity '+str(cid))
          base=int(os.environ['LIVE_CUTOFF']);fatal=('CONFIRMED_DEFECT','MATERIAL_RISK','QUARANTINE_DOWNSTREAM=true','FAIL_CLOSED','FAIL-CLOSED','BLOCKER','NOT_ADMISSIBLE','DO NOT USE')
          for x in C:
            b=str(x.get('body') or '')
            if int(x.get('id') or 0)>base and 'AVPS' in b.upper() and any(t.upper() in b.upper() for t in fatal):raise SystemExit('newer unbound AVPS blocker '+str(x.get('id')))
          bodies=[str(x.get('body') or '').strip() for x in C]
          if sum(x==os.environ['ALLOCATION_MARKER'] for x in bodies)!=1 or any(x.startswith(os.environ['CONSUMED_MARKER']) for x in bodies):raise SystemExit('allocation/consumed drift')
          ends=set();beg=[]
          for x in C:
            first=str(x.get('body') or '').strip().splitlines();first=first[0] if first else '';fields={}
            for tok in first.replace('|',' ').split():
              if '=' in tok:
                k,v=tok.split('=',1);fields.setdefault(k,[]).append(v)
            if first.startswith('WRITE_QUIET_END'):
              vals=[];raw=[]
              for k in ('begin','beginComment','begin_comment'):
                for v in fields.get(k,[]):raw.append(v);vals.append(int(v)) if v.isdigit() else None
              if len(vals)!=len(raw) or len(set(vals))>1:raise SystemExit('invalid END')
              if vals:ends.add(vals[0])
            elif first.startswith('WRITE_QUIET_BEGIN'):beg.append(int(x['id']))
          if [x for x in beg if x not in ends]:raise SystemExit('unmatched fence')
          if [x for q in z('s.json') for x in q.get('workflow_runs',[])]:raise SystemExit('science exists')
          PY
          test "$(git rev-parse "HEAD:$SCIENCE_WORKFLOW")" = "$SCIENCE_WORKFLOW_BLOB"
          test "$(git rev-parse "HEAD:$RUNTIME_ADAPTER")" = "$RUNTIME_ADAPTER_BLOB"
          test "$(git rev-parse "HEAD:$EXECUTOR")" = "$EXECUTOR_BLOB"
          test "$(git rev-parse "HEAD:$AGGREGATOR")" = "$AGGREGATOR_BLOB"
          test "$(git rev-parse "HEAD:$RUNTIME_CONTRACT")" = "$RUNTIME_CONTRACT_BLOB"

      - uses: actions/download-artifact@v4
        with: {name: avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v25, path: v25, repository: '${{ github.repository }}', run-id: 33579241722, github-token: '${{ github.token }}'}

      - name: Replay exact V35 build and bind V36 predecessor ledger
        shell: bash
        env: {MODE: '${{ steps.mode.outputs.mode }}'}
        run: |
          set -euo pipefail
          CURRENT_LIVE_CUTOFF="$LIVE_CUTOFF"; export CURRENT_LIVE_CUTOFF
          git show "$PR888_HEAD:$V35_PATH" > v35.yml
          python - <<'PY'
          from pathlib import Path
          import shlex
          raw=Path('v35.yml').read_text();lines=raw.splitlines();a=lines.index('    env:')+1;e=lines.index('    steps:');out=[]
          for line in lines[a:e]:
            if not line.startswith('      ') or ':' not in line: continue
            k,v=line.strip().split(':',1);v=v.strip()
            if len(v)>=2 and v[0]==v[-1] and v[0] in "'\"":v=v[1:-1]
            if k in {'INFRA_BRANCH','INFRA_PATH'}: continue
            out.append('export '+k+'='+shlex.quote(v))
          Path('v35-env.sh').write_text('\n'.join(out)+'\n')
          name='Replay exact V32 build and bind complete V35 predecessor ledger';a=raw.index(f'      - name: {name}\n');s=raw.index('        run: |\n',a)+len('        run: |\n');e=min(x for x in (raw.find('\n      - name:',s),raw.find('\n      - uses:',s)) if x!=-1);L=raw[s:e].splitlines();assert all((not x) or x.startswith('          ') for x in L);Path('v35-build.sh').write_text('\n'.join(y[10:] if y.startswith('          ') else '' for y in L)+'\n')
          PY
          source v35-env.sh
          export INFRA_BRANCH="review/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-infrastructure-v36"
          export INFRA_PATH=".github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v36.yml"
          bash v35-build.sh
          export LIVE_CUTOFF="$CURRENT_LIVE_CUTOFF"
          test "$LIVE_CUTOFF" = '5508235083'
          python - <<'PY'
          import hashlib,importlib.util,json,os,re
          from pathlib import Path
          p=Path('canonical-final-publisher.yml');raw=p.read_text();old=Path('v35-classifier-core.py').read_text().strip('\n')
          m=re.findall(r'^B=\{([0-9,]+)\}$',old,re.M)
          if len(m)!=1:raise SystemExit('V35 helper ledger shape drift')
          vals=[int(x) for x in m[0].split(',') if x]
          ids=[int(os.environ['V35_DEFECT']),int(os.environ['V35_RISK'])]
          if 5508102035 not in vals or any(i in vals for i in ids):raise SystemExit('V35 helper ledger content drift')
          newvals=vals+ids;oldb='B={'+m[0]+'}';newb='B={'+','.join(map(str,newvals))+'}';new=old.replace(oldb,newb,1)
          oh='\n'.join(('          '+x if x else '') for x in old.splitlines())+'\n';nh='\n'.join(('          '+x if x else '') for x in new.splitlines())+'\n'
          if raw.count(oh)!=1 or raw.count('KNOWN_DEFECT=5508102035')!=1:raise SystemExit('V36 canonical patch drift')
          cutoff=int(os.environ['LIVE_CUTOFF']);out=raw.replace(oh,nh,1).replace('KNOWN_DEFECT=5508102035','KNOWN_DEFECT='+str(cutoff),1);p.write_text(out)
          Path('v36-classifier-core.py').write_text(new+'\n');cd=hashlib.sha256(new.encode()).hexdigest();d=hashlib.sha256(out.encode()).hexdigest();Path('v36-classifier.sha256').write_text(cd+'\n');Path('canonical-final-publisher.sha256').write_text(d+'\n')
          sp=importlib.util.spec_from_file_location('c','v36-classifier-core.py');mod=importlib.util.module_from_spec(sp);sp.loader.exec_module(mod)
          for i in ids:
            if mod.avps_governance_blocker('CONFIRMED_DEFECT AVPS_X',i):raise SystemExit('bound predecessor not suppressed '+str(i))
          if not mod.avps_governance_blocker('confirmed_defect avps_x',cutoff+1):raise SystemExit('fresh blocker fail-open')
          q=json.load(open('publisher-closed-world-contract.json'));q.update({'liveGovernanceClassifier':'structured-firstline-closure-v36','classifierSourceSha256':cd,'exactSuppressedPredecessorIds':sorted(mod.B),'newerBlockerBaseline':cutoff,'canonicalPublisherSha256':d,'v35StaleGlobalScanResidueRepair':True,'v35HistoricalEnvLiveCutoffRebindRepair':True});Path('publisher-closed-world-contract.json').write_text(json.dumps(q,sort_keys=True,indent=2)+'\n')
          if os.environ['MODE']=='publisher' and Path(os.environ['PUBLISHER_PATH']).read_text()!=out:raise SystemExit('publisher byte mismatch')
          PY

      - name: Replay exact V35 global scan with stale-residue deletion and current-cutoff rebind
        shell: bash
        env:
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          MODE: ${{ steps.mode.outputs.mode }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          CURRENT_LIVE_CUTOFF="$LIVE_CUTOFF"; export CURRENT_LIVE_CUTOFF
          git show "$PR888_HEAD:$V35_PATH" > v35.yml
          python - <<'PY'
          from pathlib import Path
          import shlex
          raw=Path('v35.yml').read_text();lines=raw.splitlines();a=lines.index('    env:')+1;e=lines.index('    steps:');out=[]
          for line in lines[a:e]:
            if not line.startswith('      ') or ':' not in line: continue
            k,v=line.strip().split(':',1);v=v.strip()
            if len(v)>=2 and v[0]==v[-1] and v[0] in "'\"":v=v[1:-1]
            if k in {'INFRA_BRANCH','INFRA_PATH'}: continue
            out.append('export '+k+'='+shlex.quote(v))
          Path('v35-env.sh').write_text('\n'.join(out)+'\n')
          name='Replay exact V32 global scan with corrected cardinality and complete V35 replay environment';a=raw.index(f'      - name: {name}\n');s=raw.index('        run: |\n',a)+len('        run: |\n');e=min(x for x in (raw.find('\n      - name:',s),raw.find('\n      - uses:',s)) if x!=-1);L=raw[s:e].splitlines();assert all((not x) or x.startswith('          ') for x in L);x='\n'.join(y[10:] if y.startswith('          ') else '' for y in L)+'\n'
          old="if Path('repository-global-seed-scan.json').exists():raise SystemExit('repository-global scan unexpectedly preseeded')"
          new="scan=Path('repository-global-seed-scan.json');stale=None\nif scan.exists():\n    stale=hashlib.sha256(scan.read_bytes()).hexdigest();scan.unlink()\nif scan.exists():raise SystemExit('stale repository-global scan deletion failed')"
          if x.count(old)!=1:raise SystemExit('V35 stale-scan precondition drift')
          x=x.replace(old,new,1)
          oldp="'repositoryGlobalScanPreseeded':False"
          newp="'repositoryGlobalScanPreseeded':False,'staleBuildLineageScanPresent':stale is not None,'staleBuildLineageScanSha256':stale,'staleBuildLineageScanDeletedBeforeFreshScan':True"
          if x.count(oldp)!=1:raise SystemExit('V35 replay proof shape drift')
