          fresh=hashlib.sha256(test.read_bytes()).hexdigest()
          q=json.load(open('v35-replay-environment-proof.json'))
          if q.get('staleBuildLineageScanDeletedBeforeFreshScan') is not True:raise SystemExit('stale scan deletion proof missing')
          q.update({'successor':'v36','currentLiveCutoff':int(os.environ['LIVE_CUTOFF']),'historicalEnvLiveCutoffRebound':True,'freshRepositoryGlobalScanLifecyclePhase':'post-inherited-global-scan','freshRepositoryGlobalScanSha256':fresh})
