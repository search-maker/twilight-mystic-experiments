          Path('v36-global.sh').write_text(x)
          PY
          source v35-env.sh
          export INFRA_BRANCH="review/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-infrastructure-v36"
          export INFRA_PATH=".github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v36.yml"
          export LIVE_CUTOFF="$CURRENT_LIVE_CUTOFF"
          test "$LIVE_CUTOFF" = '5508235083'
          source() { builtin source "$@"; export LIVE_CUTOFF="$CURRENT_LIVE_CUTOFF"; test "$LIVE_CUTOFF" = "$CURRENT_LIVE_CUTOFF"; }
          export -f source
          bash v36-global.sh
          export LIVE_CUTOFF="$CURRENT_LIVE_CUTOFF"
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          test=Path('repository-global-seed-scan.json')
