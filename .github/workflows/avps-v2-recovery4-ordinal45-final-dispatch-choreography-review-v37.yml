            int(os.environ['V35_DEFECT']):'COORDINATOR::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_DISPATCH_CHOREOGRAPHY_REVIEW_INFRA_V35_PR888_REPOSITORY_GLOBAL_SCAN_STALE_PREEXISTING_FILE_PRECONDITION_ATTEMPT1_FAILURE',
            int(os.environ['V35_RISK']):'COORDINATOR::MATERIAL_RISK AVPS_ORDINAL45_FINAL_DISPATCH_CHOREOGRAPHY_REVIEW_INFRA_V35_HISTORICAL_ENV_SOURCE_OVERWRITES_LIVE_CUTOFF',
            int(os.environ['V36_DEFECT']):'COORDINATOR::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_DISPATCH_CHOREOGRAPHY_REVIEW_INFRA_V36_PR889_BIND_ENV_MISSING_NESTED_V32_STATIC_ENV_ATTEMPT1_FAILURE',
          }
          for cid,pref in expected.items():
              hits=[x for x in C if int(x.get('id') or 0)==cid]
              if len(hits)!=1 or not str(hits[0].get('body') or '').startswith(pref): raise SystemExit('predecessor decision binding '+str(cid))
              u=hits[0].get('user') or {}; b=str(hits[0].get('body') or '')
              if u.get('login')!='search-maker' or int(u.get('id') or 0)!=304153003 or hits[0].get('author_association')!='OWNER' or 'QUARANTINE_DOWNSTREAM=false' not in b: raise SystemExit('predecessor identity '+str(cid))
          base=int(os.environ['LIVE_CUTOFF']); fatal=('CONFIRMED_DEFECT','MATERIAL_RISK','QUARANTINE_DOWNSTREAM=true','FAIL_CLOSED','FAIL-CLOSED','BLOCKER','NOT_ADMISSIBLE','DO NOT USE')
          for x in C:
              b=str(x.get('body') or '')
              if int(x.get('id') or 0)>base and 'AVPS' in b.upper() and any(t.upper() in b.upper() for t in fatal): raise SystemExit('newer unbound AVPS blocker '+str(x.get('id')))
          bodies=[str(x.get('body') or '').strip() for x in C]
          if sum(x==os.environ['ALLOCATION_MARKER'] for x in bodies)!=1 or any(x.startswith(os.environ['CONSUMED_MARKER']) for x in bodies): raise SystemExit('allocation/consumed drift')
          ends=set(); beg=[]
          for x in C:
              first=str(x.get('body') or '').strip().splitlines(); first=first[0] if first else ''; fields={}
              for tok in first.replace('|',' ').split():
                  if '=' in tok:
                      k,v=tok.split('=',1); fields.setdefault(k,[]).append(v)
              if first.startswith('WRITE_QUIET_END'):
                  vals=[]; raw=[]
                  for k in ('begin','beginComment','begin_comment'):
                      for v in fields.get(k,[]): raw.append(v); vals.append(int(v)) if v.isdigit() else None
                  if len(vals)!=len(raw) or len(set(vals))>1: raise SystemExit('invalid END')
                  if vals: ends.add(vals[0])
              elif first.startswith('WRITE_QUIET_BEGIN'): beg.append(int(x['id']))
          if [x for x in beg if x not in ends]: raise SystemExit('unmatched fence')
          if [x for q in z('s.json') for x in q.get('workflow_runs',[])]: raise SystemExit('science exists')
          PY
          test "$(git rev-parse "HEAD:$SCIENCE_WORKFLOW")" = "$SCIENCE_WORKFLOW_BLOB"
          test "$(git rev-parse "HEAD:$RUNTIME_ADAPTER")" = "$RUNTIME_ADAPTER_BLOB"
          test "$(git rev-parse "HEAD:$EXECUTOR")" = "$EXECUTOR_BLOB"
          test "$(git rev-parse "HEAD:$AGGREGATOR")" = "$AGGREGATOR_BLOB"
          test "$(git rev-parse "HEAD:$RUNTIME_CONTRACT")" = "$RUNTIME_CONTRACT_BLOB"

      - uses: actions/download-artifact@v4
        with: {name: avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v25, path: v25, repository: '${{ github.repository }}', run-id: 33579241722, github-token: '${{ github.token }}'}

