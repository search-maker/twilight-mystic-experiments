              k,v=line.strip().split(':',1); v=v.strip()
              if len(v)>=2 and v[0]==v[-1] and v[0] in "'\"": v=v[1:-1]
              if k in {'INFRA_BRANCH','INFRA_PATH','LIVE_CUTOFF'}: continue
              out.append('export '+k+'='+shlex.quote(v))
          Path('v35-inherited-env.sh').write_text('\n'.join(out)+'\n')
          PY
          source v35-inherited-env.sh
          git fetch --no-tags origin "$PR886_HEAD"
          test "$(git rev-parse "$PR886_HEAD:$V32_PATH")" = "$PR886_BLOB"
          git show "$PR886_HEAD:$V32_PATH" > v32.yml
          python - <<'PY'
          from pathlib import Path
          import shlex
          raw=Path('v32.yml').read_text(); lines=raw.splitlines(); a=lines.index('    env:')+1; e=lines.index('    steps:'); out=[]
          for line in lines[a:e]:
              if not line.startswith('      ') or ':' not in line: continue
              k,v=line.strip().split(':',1); v=v.strip()
              if len(v)>=2 and v[0]==v[-1] and v[0] in "'\"": v=v[1:-1]
              if k in {'INFRA_BRANCH','INFRA_PATH','LIVE_CUTOFF'}: continue
              out.append('export '+k+'='+shlex.quote(v))
          Path('v32-static-env.sh').write_text('\n'.join(out)+'\n')
          PY
          source v32-static-env.sh
          export INFRA_BRANCH="review/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-infrastructure-v37"
          export INFRA_PATH=".github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v37.yml"
          export LIVE_CUTOFF='5509304642'
          test -n "$ALLOCATION_MARKER"
          test -n "$CONSUMED_MARKER"
          test -n "$SCIENCE_WORKFLOW"
          test -n "$RUNTIME_ADAPTER"
          if git ls-remote --exit-code --heads origin "$DISPATCH_BRANCH" >/dev/null 2>&1; then exit 1; fi

          gh api "repos/$GITHUB_REPOSITORY/pulls/889" > p36.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR889_RUN" > r36.json
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$PR889_JOB" > j36.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR889_GENERIC" > g36.json
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$PR889_GENERIC_JOB" > gj36.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR889_RUN/artifacts?per_page=100" > a36.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > c.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/avps-v2-postconsumption-recovery4-science.yml/runs?event=workflow_dispatch&per_page=100" > s.json
          python - <<'PY'
          import json,os
          z=lambda p:json.load(open(p)); p,r,j,g,gj=z('p36.json'),z('r36.json'),z('j36.json'),z('g36.json'),z('gj36.json')
