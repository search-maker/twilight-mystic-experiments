name: Review AVPS Recovery4 ordinal45 final dispatch choreography v37

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v37.yml
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1.yml

permissions: {contents: read, actions: read, issues: read, pull-requests: read}
concurrency:
  group: avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v37-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      INFRA_BASE: de3fafa052ff1d5b2f33ec0d4347c884d560d8b6
      INFRA_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-infrastructure-v37
      INFRA_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v37.yml
      PUBLISHER_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1
      PUBLISHER_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1.yml
      PR889_HEAD: 7ed827dc585c8583ae24b2567be2ea01f890703d
      PR889_TREE: cb913fde7450953c78d58eae14968c3605a9c1a0
      PR889_BLOB: 4eba809a620932739df7e682fa0c6c5c92241a30
      PR889_RUN: '33624080289'
      PR889_JOB: '100227610482'
      PR889_GENERIC: '33624080205'
      PR889_GENERIC_JOB: '100227610990'
      V36_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v36.yml
      V36_DEFECT: '5509304642'
      V35_DEFECT: '5508214692'
      V35_RISK: '5508235083'
      LIVE_CUTOFF: '5509304642'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}

      - name: Bind V37 identity, rejected V36 evidence, nested V32 static env, and exact-only live fence
        id: mode
        shell: bash
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "${{ github.event.action }}" = opened
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test "$(git rev-parse HEAD^)" = "$EVENT_BASE"
          test "$(git rev-list --count "$EVENT_BASE"..HEAD)" = 1
          mapfile -t C < <(git diff --name-only "$EVENT_BASE"...HEAD)
          test "${#C[@]}" = 1
          if [ "${C[0]}" = "$INFRA_PATH" ]; then
            test "$EVENT_BASE" = "$INFRA_BASE"
            test "$EVENT_BRANCH" = "$INFRA_BRANCH"
            test "$(git ls-remote origin refs/heads/main|cut -f1)" = "$INFRA_BASE"
            echo mode=infra >> "$GITHUB_OUTPUT"
