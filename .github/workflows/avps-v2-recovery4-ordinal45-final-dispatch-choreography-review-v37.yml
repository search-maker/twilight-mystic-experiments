          Path('v36-build.sh').write_text(x)
          PY
          bash v36-build.sh
          export LIVE_CUTOFF="$CURRENT_LIVE_CUTOFF"
          test "$LIVE_CUTOFF" = '5509304642'
          python - <<'PY'
          import hashlib,importlib.util,json,os,re
