          newvals=vals+[did]; oldb='B={'+m[0]+'}'; newb='B={'+','.join(map(str,newvals))+'}'; new=old.replace(oldb,newb,1)
          oh='\n'.join(('          '+x if x else '') for x in old.splitlines())+'\n'; nh='\n'.join(('          '+x if x else '') for x in new.splitlines())+'\n'
          if raw.count(oh)!=1: raise SystemExit('V37 embedded helper patch drift')
          out=raw.replace(oh,nh,1); p.write_text(out)
          Path('v37-classifier-core.py').write_text(new+'\n'); cd=hashlib.sha256(new.encode()).hexdigest(); d=hashlib.sha256(out.encode()).hexdigest(); Path('v37-classifier.sha256').write_text(cd+'\n'); Path('canonical-final-publisher.sha256').write_text(d+'\n')
          sp=importlib.util.spec_from_file_location('c','v37-classifier-core.py'); mod=importlib.util.module_from_spec(sp); sp.loader.exec_module(mod)
