          if not mod.avps_governance_blocker('confirmed_defect avps_x',int(os.environ['LIVE_CUTOFF'])+1): raise SystemExit('fresh blocker fail-open')
          q=json.load(open('publisher-closed-world-contract.json')); q.update({'liveGovernanceClassifier':'structured-firstline-closure-v37','classifierSourceSha256':cd,'exactSuppressedPredecessorIds':sorted(mod.B),'newerBlockerBaseline':int(os.environ['LIVE_CUTOFF']),'canonicalPublisherSha256':d,'v36NestedV32StaticBindEnvRepair':True}); Path('publisher-closed-world-contract.json').write_text(json.dumps(q,sort_keys=True,indent=2)+'\n')
          if os.environ['MODE']=='publisher' and Path(os.environ['PUBLISHER_PATH']).read_text()!=out: raise SystemExit('publisher byte mismatch')
