          git show "$PR889_HEAD:$V36_PATH" > v36.yml
          python - <<'PY'
          from pathlib import Path
          raw=Path('v36.yml').read_text()
          name='Replay exact V35 build and bind V36 predecessor ledger'; a=raw.index(f'      - name: {name}\n'); s=raw.index('        run: |\n',a)+len('        run: |\n'); e=min(x for x in (raw.find('\n      - name:',s),raw.find('\n      - uses:',s)) if x!=-1); L=raw[s:e].splitlines(); assert all((not x) or x.startswith('          ') for x in L); x='\n'.join(y[10:] if y.startswith('          ') else '' for y in L)+'\n'
          oldb='export INFRA_BRANCH="review/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-infrastructure-v36"'; newb='export INFRA_BRANCH="review/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-infrastructure-v37"'
          oldp='export INFRA_PATH=".github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v36.yml"'; newp='export INFRA_PATH=".github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v37.yml"'
          oldc="test \"$LIVE_CUTOFF\" = '5508235083'"; newc="test \"$LIVE_CUTOFF\" = '5509304642'"
