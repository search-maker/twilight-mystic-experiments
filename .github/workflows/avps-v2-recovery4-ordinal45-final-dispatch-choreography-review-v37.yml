          git show "$PR889_HEAD:$V36_PATH" > v36.yml
          python - <<'PY'
          from pathlib import Path
          import shlex
          def env_from(src,dst,skip={'INFRA_BRANCH','INFRA_PATH','LIVE_CUTOFF'}):
              raw=Path(src).read_text(); lines=raw.splitlines(); a=lines.index('    env:')+1; e=lines.index('    steps:'); out=[]
              for line in lines[a:e]:
                  if not line.startswith('      ') or ':' not in line: continue
                  k,v=line.strip().split(':',1); v=v.strip()
                  if len(v)>=2 and v[0]==v[-1] and v[0] in "'\"": v=v[1:-1]
                  if k in skip: continue
                  out.append('export '+k+'='+shlex.quote(v))
              Path(dst).write_text('\n'.join(out)+'\n')
          env_from('v36.yml','v36-inherited-env.sh')
          PY
          source v36-inherited-env.sh
          git fetch --no-tags origin "$PR888_HEAD"
          test "$(git rev-parse "$PR888_HEAD:$V35_PATH")" = "$PR888_BLOB"
          git show "$PR888_HEAD:$V35_PATH" > v35.yml
          python - <<'PY'
          from pathlib import Path
          import shlex
