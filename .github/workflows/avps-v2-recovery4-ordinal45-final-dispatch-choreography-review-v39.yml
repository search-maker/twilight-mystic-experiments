          x=x.replace(marker,extra+marker,1); Path('v38-build-replay.sh').write_text(x)
          PY
          bash v38-build-replay.sh

      - name: Replay exact V38 global scan with exact V35 self-path materialization
        shell: bash
        env: {EVENT_BRANCH: '${{ github.event.pull_request.head.ref }}', EVENT_HEAD: '${{ github.event.pull_request.head.sha }}', GH_TOKEN: '${{ github.token }}', GITHUB_TOKEN: '${{ github.token }}', MODE: '${{ steps.mode.outputs.mode }}', EVENT_BASE: '${{ github.event.pull_request.base.sha }}'}
        run: |
