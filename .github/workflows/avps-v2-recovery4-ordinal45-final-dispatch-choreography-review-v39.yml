          if x.count(b38)!=1 or x.count(p38)!=1 or x.count("'5510140594'")!=1: raise SystemExit('V38 bind successor patch cardinality drift')
          x=x.replace(b38,b39).replace(p38,p39).replace("'5510140594'","'5511003079'")
