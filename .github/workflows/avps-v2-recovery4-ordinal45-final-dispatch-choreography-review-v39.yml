          b38='review/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-infrastructure-v38'; b39='review/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-infrastructure-v39'; p38='.github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v38.yml'; p39='.github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v39.yml'
          if x.count(b38)!=2 or x.count(p38)!=2 or x.count("'5510140594'")!=3: raise SystemExit('V38 build successor patch cardinality drift')
