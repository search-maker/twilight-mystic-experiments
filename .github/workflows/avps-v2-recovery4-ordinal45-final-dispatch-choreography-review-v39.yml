          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR891_GENERIC/jobs?per_page=100" > gj38s.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR891_RUN/artifacts?per_page=100" > a38.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > c39.json
          python - <<'PY'
          import json,os
          z=lambda p:json.load(open(p)); p,r,g=z('p38.json'),z('r38.json'),z('g38.json'); js=z('j38s.json').get('jobs',[]); gjs=z('gj38s.json').get('jobs',[])
          if p.get('state')!='closed' or p.get('merged_at') is not None or p['head']['sha']!=os.environ['PR891_HEAD'] or p['base']['sha']!=os.environ['INFRA_BASE']: raise SystemExit('PR891 drift')
          if r['id']!=int(os.environ['PR891_RUN']) or r['head_sha']!=os.environ['PR891_HEAD'] or r['run_attempt']!=1 or r['conclusion']!='failure': raise SystemExit('V38 dedicated drift')
