          for cid,pref in expected.items():
              h=[x for x in C if int(x.get('id') or 0)==cid]
              if len(h)!=1 or not str(h[0].get('body') or '').startswith(pref): raise SystemExit('V38 decision binding '+str(cid))
              u=h[0].get('user') or {}; b=str(h[0].get('body') or '')
              if u.get('login')!='search-maker' or int(u.get('id') or 0)!=304153003 or h[0].get('author_association')!='OWNER' or 'QUARANTINE_DOWNSTREAM=false' not in b: raise SystemExit('V38 decision identity '+str(cid))
          PY

      - uses: actions/download-artifact@v4
        with: {name: avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v25, path: v25, repository: '${{ github.repository }}', run-id: 33579241722, github-token: '${{ github.token }}'}

      - name: Replay exact V38 build and bind V39 predecessor ledger
        shell: bash
        env: {MODE: '${{ steps.mode.outputs.mode }}'}
        run: |
