name: Review AVPS Recovery4 ordinal45 final publisher governance v44

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v44.yml
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v2.yml

permissions: {contents: read, actions: read, issues: read, pull-requests: read}
concurrency:
  group: avps-v2-recovery4-ordinal45-final-publisher-governance-v44-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      MAIN_EXPECTED: 52cbcb69029360d938f66b79da5150bdcaed6231
      INFRA_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-infrastructure-v44
      INFRA_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v44.yml
      PUBLISHER_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v2
      PUBLISHER_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v2.yml
      OLD_PUBLISHER_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1.yml
      OLD_PUBLISHER_HEAD: 8ef4f0f38a13918741869cb1d0c738bd2b042dd7
      OLD_PUBLISHER_TREE: c9d815ccc85989404aa63b9506cff8ff63bde29a
      OLD_PUBLISHER_BLOB: aef2b1ac6b8e5e22a04660721aafa8a70e3817dc
      OLD_PUBLISHER_SHA256: c965793b6e3bf2b8446a2fb972bb1f6ab52a07e4d2b7596063895b5522fb3659
      PR896_HEAD: a640a397691ea1db1ec9e3b8059ee541b173f6ce
      PR896_BASE: de3fafa052ff1d5b2f33ec0d4347c884d560d8b6
      PR896_MERGE: 52cbcb69029360d938f66b79da5150bdcaed6231
      V43_ACCEPTANCE: '5514175096'
      V43_ARTIFACT: '9860273794'
      V43_ARTIFACT_DIGEST: sha256:904257cf05208f374d42e91dac1796fa8f0a7e7fb59ee33e1009aee323fd9135
      PR897_RUN: '33709033446'
      PR897_JOB: '100504373055'
      PR897_GENERIC: '33709033447'
      PR897_GENERIC_JOB: '100504372822'
      PR897_DEFECT: '5519755183'
      V44_CORRECTION: '5519768362'
      LIVE_CUTOFF: '5519768362'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}

      - name: Bind merged V43 acceptance and rejected publisher attempt
        id: mode
        shell: bash
        env:
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$EVENT_ACTION" = opened
          test "$EVENT_BASE" = "$MAIN_EXPECTED"
          if [ "$EVENT_BRANCH" = "$INFRA_BRANCH" ]; then
            MODE=reviewer; EXPECT_PATH="$INFRA_PATH"
          elif [ "$EVENT_BRANCH" = "$PUBLISHER_BRANCH" ]; then
            MODE=publisher; EXPECT_PATH="$PUBLISHER_PATH"
          else
            echo 'unexpected V44 branch' >&2; exit 1
          fi
          set -- $(git rev-list --parents -n1 "$EVENT_HEAD")
          test "$#" -eq 2
          test "$2" = "$MAIN_EXPECTED"
          test "$(git diff --name-status "$MAIN_EXPECTED" "$EVENT_HEAD")" = "A	$EXPECT_PATH"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          git fetch --no-tags origin "$OLD_PUBLISHER_HEAD" "$PR896_HEAD"
          test "$(git rev-parse "$OLD_PUBLISHER_HEAD^{tree}")" = "$OLD_PUBLISHER_TREE"
          test "$(git rev-parse "$OLD_PUBLISHER_HEAD:$OLD_PUBLISHER_PATH")" = "$OLD_PUBLISHER_BLOB"
          git show "$OLD_PUBLISHER_HEAD:$OLD_PUBLISHER_PATH" > rejected-publisher.yml
          test "$(sha256sum rejected-publisher.yml | awk '{print $1}')" = "$OLD_PUBLISHER_SHA256"
          gh api "repos/$GITHUB_REPOSITORY/pulls/896" > pr896.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/897" > pr897.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR897_RUN" > r897.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR897_RUN/jobs?per_page=100" > j897.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR897_GENERIC" > g897.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR897_GENERIC/jobs?per_page=100" > gj897.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR897_RUN/artifacts?per_page=100" > a897.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$V43_ARTIFACT" > a43.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > comments.json
          python - <<'PY'
          import json,os
          z=lambda p:json.load(open(p))
          p=z('pr896.json')
          if p.get('state')!='closed' or p.get('merged_at') is None or p['head']['sha']!=os.environ['PR896_HEAD'] or p['base']['sha']!=os.environ['PR896_BASE'] or p.get('merge_commit_sha')!=os.environ['PR896_MERGE']:
              raise SystemExit('PR896 merged identity drift')
          p=z('pr897.json')
          if p.get('state')!='closed' or p.get('merged_at') is not None or p['head']['sha']!=os.environ['OLD_PUBLISHER_HEAD'] or p['base']['sha']!=os.environ['MAIN_EXPECTED']:
              raise SystemExit('PR897 rejected identity drift')
          r=z('r897.json'); g=z('g897.json')
          if r['id']!=int(os.environ['PR897_RUN']) or r['head_sha']!=os.environ['OLD_PUBLISHER_HEAD'] or r['run_attempt']!=1 or r.get('conclusion')!='failure':
              raise SystemExit('PR897 dedicated drift')
          jobs=z('j897.json').get('jobs',[]); h=[x for x in jobs if int(x.get('id') or 0)==int(os.environ['PR897_JOB'])]
          if len(h)!=1 or h[0].get('conclusion')!='failure': raise SystemExit('PR897 dedicated job drift')
          st={x.get('name'):x.get('conclusion') for x in h[0].get('steps',[])}
          if st.get('Replay exact V41 bind with wrapper-aware Actions guard and bind rejected V42 evidence')!='failure': raise SystemExit('PR897 first invalid step drift')
          if g['id']!=int(os.environ['PR897_GENERIC']) or g['head_sha']!=os.environ['OLD_PUBLISHER_HEAD'] or g['run_attempt']!=1 or g.get('conclusion')!='success':
              raise SystemExit('PR897 generic drift')
          gj=z('gj897.json').get('jobs',[]); q=[x for x in gj if int(x.get('id') or 0)==int(os.environ['PR897_GENERIC_JOB'])]
          if len(q)!=1 or q[0].get('conclusion')!='success': raise SystemExit('PR897 generic job drift')
          if z('a897.json').get('artifacts'): raise SystemExit('PR897 unexpectedly has dedicated artifact')
          a=z('a43.json')
          if int(a.get('id') or 0)!=int(os.environ['V43_ARTIFACT']) or a.get('digest')!=os.environ['V43_ARTIFACT_DIGEST'] or a.get('expired') is not False:
              raise SystemExit('accepted V43 artifact drift')
          C=[x for page in z('comments.json') for x in page]
          expected={
              int(os.environ['V43_ACCEPTANCE']):'INDEPENDENT_AUDIT::ACCEPT_AVPS_ORDINAL45_FINAL_DISPATCH_CHOREOGRAPHY_REVIEW_INFRA_V43',
              int(os.environ['PR897_DEFECT']):'COORDINATOR::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_DISPATCH_PUBLISHER_V1_PR897_STALE_POST_ACCEPTANCE_GOVERNANCE_BASELINE',
              int(os.environ['V44_CORRECTION']):'COORDINATOR::SUPERSEDING_CORRECTION AVPS_ORDINAL45_FINAL_DISPATCH_REVIEW_INFRA_V44_EXPLICIT_BLOCKER_SURFACE_ONLY'}
          for cid,pref in expected.items():
              h=[x for x in C if int(x.get('id') or 0)==cid]
              if len(h)!=1 or not str(h[0].get('body') or '').startswith(pref): raise SystemExit('Issue60 binding '+str(cid))
              u=h[0].get('user') or {}
              if u.get('login')!='search-maker' or int(u.get('id') or 0)!=304153003 or h[0].get('author_association')!='OWNER': raise SystemExit('Issue60 author identity '+str(cid))
          PY

      - name: Build corrected publisher by bounded reversible governance patch
        shell: bash
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,re,textwrap
          from pathlib import Path
          old=Path('rejected-publisher.yml').read_text()
          if hashlib.sha256(old.encode()).hexdigest()!=os.environ['OLD_PUBLISHER_SHA256']: raise SystemExit('old publisher byte drift')
          new=old
          changes=[]
          def exact_replace(before,after,count,label):
              global new
              n=new.count(before)
              if n!=count: raise SystemExit(f'{label} cardinality drift: {n} != {count}')
              new=new.replace(before,after)
              changes.append({'label':label,'count':count,'before':before,'after':after})
          exact_replace('avps-v2-recovery4-ordinal45-final-dispatch-publisher-v1.yml','avps-v2-recovery4-ordinal45-final-dispatch-publisher-v2.yml',3,'publisher workflow path identity')
          exact_replace('KNOWN_DEFECT=5513956928','KNOWN_DEFECT='+os.environ['LIVE_CUTOFF'],1,'governance cutoff')
          m=re.findall(r'^          B=\{([0-9,]+)\}$',new,re.M)
          if len(m)!=1: raise SystemExit('publisher suppression ledger shape drift')
          vals=[int(x) for x in m[0].split(',') if x]
          add=[int(os.environ['V43_ACCEPTANCE']),int(os.environ['PR897_DEFECT']),int(os.environ['V44_CORRECTION'])]
          if len(vals)!=38 or len(set(vals))!=38 or any(x in vals for x in add): raise SystemExit('publisher predecessor ledger drift')
          vals2=vals+add
          exact_replace('          B={'+m[0]+'}','          B={'+','.join(map(str,vals2))+'}',1,'exact suppression ledger')
          broad="              if any(x in u for x in ('CONFIRMED_DEFECT','MATERIAL_RISK','QUARANTINE_DOWNSTREAM=TRUE','FAIL_CLOSED','FAIL-CLOSED','BLOCKER')):return True"
          narrow="              if any(x in u for x in ('CONFIRMED_DEFECT','MATERIAL_RISK','QUARANTINE_DOWNSTREAM=TRUE','FAIL_CLOSED','FAIL-CLOSED')):return True"
          exact_replace(broad,narrow,1,'remove narrative BLOCKER substring fatality')
          first_old="              ok=bool(re.fullmatch(r'AVPS(?:_[A-Z0-9]+)*_(?:CLOSED|NOT_ADMISSIBLE|DO_NOT_USE|COORDINATOR_RECOVERY|SUPERSEDING_DIRECTIVE)',h))"
          first_new="              ok=bool(re.fullmatch(r'AVPS(?:_[A-Z0-9]+)*_(?:CLOSED|NOT_ADMISSIBLE|DO_NOT_USE|COORDINATOR_RECOVERY|SUPERSEDING_DIRECTIVE|BLOCKER)',h))"
          exact_replace(first_old,first_new,1,'explicit AVPS blocker state')
          surf_old="                  if re.search(r'NOT[\\s_-]+ADMISSIBLE',x) or re.search(r'DO[\\s_-]+NOT[\\s_-]+USE',x) or re.search(r'COORDINATOR[\\s_-]+RECOVERY',x) or re.search(r'SUPERSEDING[\\s_-]+DIRECTIVE',x) or re.search(r'(?<![A-Z0-9_])CLOSED(?![A-Z0-9_])',x):return True"
          surf_new="                  if re.search(r'NOT[\\s_-]+ADMISSIBLE',x) or re.search(r'DO[\\s_-]+NOT[\\s_-]+USE',x) or re.search(r'COORDINATOR[\\s_-]+RECOVERY',x) or re.search(r'SUPERSEDING[\\s_-]+DIRECTIVE',x) or re.search(r'(?<![A-Z0-9_])CLOSED(?![A-Z0-9_])',x) or re.search(r'(?<![A-Z0-9_])BLOCKER(?![A-Z0-9_])',x):return True"
          exact_replace(surf_old,surf_new,1,'structured BLOCKER surface')
          # Reversibility proves every byte outside the bounded patch remains identical.
          reverted=new
          for c in reversed(changes):
              if reverted.count(c['after'])!=c['count']: raise SystemExit('reverse patch cardinality '+c['label'])
              reverted=reverted.replace(c['after'],c['before'])
          if reverted!=old or hashlib.sha256(reverted.encode()).hexdigest()!=os.environ['OLD_PUBLISHER_SHA256']:
              raise SystemExit('bounded patch reverse-equivalence failure')
          Path('canonical-final-publisher-v2.yml').write_text(new)
          newsha=hashlib.sha256(new.encode()).hexdigest(); Path('canonical-final-publisher-v2.sha256').write_text(newsha+'\n')
          # Extract and execute the exact corrected classifier embedded in the publisher.
          a=new.index('          import re\n          B={')+10
          b=new.index('          def state_check():',a)
          core=textwrap.dedent(new[a:b])
          ns={}; exec(core,ns)
          B=ns['B']; f=ns['avps_governance_blocker']
          if len(B)!=41 or sorted(B)!=sorted(vals2): raise SystemExit('corrected executable suppression ledger mismatch')
          C=[x for page in json.load(open('comments.json')) for x in page]
          byid={int(x['id']):str(x.get('body') or '') for x in C}
          for cid in add:
              if f(byid[cid],cid): raise SystemExit('exact-bound governance evidence classified blocking '+str(cid))
          cutoff=int(os.environ['LIVE_CUTOFF'])
          if f('INDEPENDENT_AUDIT::ACCEPT_AVPS_TEST\nAny later defect/blocker/risk/directive supersedes.',cutoff+1): raise SystemExit('incidental blocker prose false positive persists')
          fatal=[
              'AVPS_TEST_BLOCKER',
              'STATUS: BLOCKER\nAVPS test',
              '**STATUS: BLOCKER**\nAVPS test',
              'CONFIRMED_DEFECT AVPS_TEST',
              'MATERIAL_RISK AVPS_TEST',
              'FAIL_CLOSED AVPS_TEST',
              'QUARANTINE_DOWNSTREAM=TRUE AVPS_TEST']
          for body in fatal:
              if not f(body,cutoff+1): raise SystemExit('required unbound fatal form accepted: '+body.splitlines()[0])
          if not f('AVPS '+('x'*131073),cutoff+1): raise SystemExit('oversized governance fixture did not fail closed')
          benign=['AVPS review clean','INDEPENDENT_AUDIT::ACCEPT_AVPS_TEST\nNo material issue found.']
          for body in benign:
              if f(body,cutoff+1): raise SystemExit('benign governance history blocked')
          # Fresh live scan after the correction; only later unbound governance can stop publication.
          for c in C:
              cid=int(c.get('id') or 0)
              if cid>cutoff and f(str(c.get('body') or ''),cid): raise SystemExit('newer unbound AVPS blocker '+str(cid))
          # WRITE_QUIET and protected-state invariants remain outside the patch and are rechecked here.
          closed=set(); begins=[]
          for c in C:
              body=str(c.get('body') or '').strip(); first=body.splitlines()[0] if body else ''; fields={}
              for tok in first.replace('|',' ').split():
                  if '=' in tok:
                      k,v=tok.split('=',1); fields.setdefault(k,[]).append(v)
              if first.startswith('WRITE_QUIET_END'):
                  ids=[]
                  for key in ('begin','beginComment','begin_comment'):
                      for v in fields.get(key,[]):
                          if not v.isdigit(): raise SystemExit('non-numeric WRITE_QUIET_END alias')
                          ids.append(int(v))
                  if len(set(ids))>1: raise SystemExit('conflicting WRITE_QUIET_END aliases')
                  if ids: closed.add(ids[0])
              elif first.startswith('WRITE_QUIET_BEGIN'): begins.append(int(c['id']))
          unmatched=[x for x in begins if x not in closed]
          if unmatched: raise SystemExit('unmatched WRITE_QUIET_BEGIN '+repr(unmatched))
          manifest={'schemaVersion':1,'sourceHead':os.environ['OLD_PUBLISHER_HEAD'],'sourceBlob':os.environ['OLD_PUBLISHER_BLOB'],'sourceSha256':os.environ['OLD_PUBLISHER_SHA256'],'correctedSha256':newsha,'liveCutoff':cutoff,'exactSuppressedIds':sorted(B),'patches':changes,'reverseEquivalentToSource':True,'runtimeScienceControlsOtherwiseByteIdentical':True}
          Path('v44-publisher-patch-manifest.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\n')
          fixtures={'schemaVersion':1,'incidentalAcceptanceBlockerProseNonBlocking':True,'exactBoundEvidenceNonBlocking':add,'explicitBlockerSurfacesFatal':True,'laterConfirmedDefectFatal':True,'oversizedFailClosed':True,'benignHistoryNonBlocking':True}
          Path('v44-governance-fixtures.json').write_text(json.dumps(fixtures,sort_keys=True,indent=2)+'\n')
          if os.environ['MODE']=='publisher':
              actual=Path(os.environ['PUBLISHER_PATH']).read_text()
              if actual!=new: raise SystemExit('publisher v2 byte mismatch')
          PY

      - name: Recheck protected state and write zero-runtime receipt
        shell: bash
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-ordinal-45 >/dev/null 2>&1; then
            echo 'ordinal45 dispatch ref exists' >&2; exit 1
          fi
          rc=$?; test "$rc" -eq 2
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > comments-final.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/avps-v2-postconsumption-recovery4-science.yml/runs?event=workflow_dispatch&per_page=100" > science-runs.json
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          C=[x for page in json.load(open('comments-final.json')) for x in page]
          consumed='ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_DISPATCH_CONSUMED'
          if any(str(c.get('body') or '').strip().startswith(consumed) for c in C): raise SystemExit('consumed marker exists')
          runs=[]
          for page in json.load(open('science-runs.json')):
              if not isinstance(page,dict): raise SystemExit('science run pagination drift')
              runs.extend(page.get('workflow_runs',[]))
          if runs: raise SystemExit('science workflow_dispatch already exists')
          sha=Path('canonical-final-publisher-v2.sha256').read_text().strip()
          if sha!=hashlib.sha256(Path('canonical-final-publisher-v2.yml').read_bytes()).hexdigest(): raise SystemExit('corrected publisher hash drift')
          r={'schemaVersion':1,'status':'PASS_AVPS_V2_RECOVERY4_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V44_ZERO_RUNTIME','headSha':os.environ['EVENT_HEAD'],'baseSha':os.environ['EVENT_BASE'],'rejectedPublisherHead':os.environ['OLD_PUBLISHER_HEAD'],'rejectedPublisherBlob':os.environ['OLD_PUBLISHER_BLOB'],'rejectedPublisherSha256':os.environ['OLD_PUBLISHER_SHA256'],'rejectedDedicatedRun':int(os.environ['PR897_RUN']),'rejectedDedicatedJob':int(os.environ['PR897_JOB']),'rejectedGenericRun':int(os.environ['PR897_GENERIC']),'rejectedGenericJob':int(os.environ['PR897_GENERIC_JOB']),'v43Acceptance':int(os.environ['V43_ACCEPTANCE']),'pr897Defect':int(os.environ['PR897_DEFECT']),'v44Correction':int(os.environ['V44_CORRECTION']),'liveCutoff':int(os.environ['LIVE_CUTOFF']),'correctedPublisherSha256':sha,'dispatchCreated':False,'consumedMarkerCreated':False,'workflowDispatchPerformed':False,'solverExecutionPerformed':False,'resultOpeningAuthorized':False,'levelBAdmissionAuthorized':False,'holdoutOpened':False,'productionAuthorized':False,'taylorOrJerusalemUsed':False,'newMappingAuthorized':False}
          Path('review-receipt-v44.json').write_text(json.dumps(r,sort_keys=True,indent=2)+'\n')
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: avps-v2-recovery4-ordinal45-final-publisher-governance-review-v44
          path: |
            review-receipt-v44.json
            canonical-final-publisher-v2.yml
            canonical-final-publisher-v2.sha256
            v44-publisher-patch-manifest.json
            v44-governance-fixtures.json
          if-no-files-found: error
          compression-level: 0
