name: Review AVPS Recovery4 ordinal45 final publisher governance v47

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v47.yml
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v2.yml

permissions: {contents: read, actions: read, issues: read, pull-requests: read}
concurrency:
  group: avps-v2-recovery4-ordinal45-final-publisher-governance-v47-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      MAIN_EXPECTED: 52cbcb69029360d938f66b79da5150bdcaed6231
      INFRA_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-infrastructure-v47
      INFRA_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v47.yml
      PUBLISHER_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v2
      PUBLISHER_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v2.yml
      V46_PR: '900'
      V46_HEAD: e8c33a74c3e48c682d9e4d089d2e572757fa98b9
      V46_BASE: 52cbcb69029360d938f66b79da5150bdcaed6231
      V46_TREE: 06e3de5790c9407df6537b195cd41e72a51742d0
      V46_BLOB: cb69169866d9db7a2ef02efa9611e9d64cb1cd1d
      V46_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v46.yml
      V46_RUN: '33712217989'
      V46_JOB: '100513956099'
      V46_GENERIC: '33712217910'
      V46_GENERIC_JOB: '100513955657'
      V46_ARTIFACT: '9877295012'
      V46_ARTIFACT_NAME: avps-v2-recovery4-ordinal45-final-publisher-governance-review-v46
      V46_ARTIFACT_DIGEST: sha256:6fb47577b7a51704e7cc1d9315d5ccac01aa5974a148b89c9e7ffec248261ade
      V46_PUBLISHER_SHA256: 525ebf4ac5221cb2a2edab2cc48c571ed731385427d6d1635f7090290a568c8d
      V46_LEDGER_CARDINALITY: '44'
      V46_LIVE_CUTOFF: '5519909561'
      V46_BACKUP_ACCEPT: '5520058172'
      V46_PRIMARY_DEFECT: '5520060861'
      V46_BACKUP_DEFECT: '5520079122'
      LIVE_CUTOFF: '5520079122'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}

      - name: Bind rejected V46 evidence and download exact artifact
        id: mode
        shell: bash
        env:
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$EVENT_ACTION" = opened
          test "$EVENT_BASE" = "$MAIN_EXPECTED"
          if [ "$EVENT_BRANCH" = "$INFRA_BRANCH" ]; then
            MODE=reviewer; EXPECT_PATH="$INFRA_PATH"
          elif [ "$EVENT_BRANCH" = "$PUBLISHER_BRANCH" ]; then
            MODE=publisher; EXPECT_PATH="$PUBLISHER_PATH"
          else
            echo 'unexpected V47 branch' >&2; exit 1
          fi
          set -- $(git rev-list --parents -n1 "$EVENT_HEAD")
          test "$#" -eq 2
          test "$2" = "$MAIN_EXPECTED"
          test "$(git diff --name-status "$MAIN_EXPECTED" "$EVENT_HEAD")" = "A	$EXPECT_PATH"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

          git fetch --no-tags origin "$V46_HEAD"
          test "$(git rev-parse "$V46_HEAD^{tree}")" = "$V46_TREE"
          test "$(git rev-parse "$V46_HEAD:$V46_PATH")" = "$V46_BLOB"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$V46_PR" > pr900.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V46_RUN" > r900.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V46_RUN/jobs?per_page=100" > j900.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V46_GENERIC" > g900.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V46_GENERIC/jobs?per_page=100" > gj900.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V46_RUN/artifacts?per_page=100" > a900.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > comments.json
          python - <<'PY'
          import json,os
          z=lambda p:json.load(open(p))
          p=z('pr900.json')
          if p.get('state')!='closed' or p.get('merged_at') is not None or p['head']['sha']!=os.environ['V46_HEAD'] or p['base']['sha']!=os.environ['V46_BASE']:
              raise SystemExit('PR900 rejected identity drift')
          r=z('r900.json'); g=z('g900.json')
          if r['id']!=int(os.environ['V46_RUN']) or r['head_sha']!=os.environ['V46_HEAD'] or r['run_attempt']!=1 or r.get('conclusion')!='success': raise SystemExit('V46 dedicated drift')
          jobs=z('j900.json').get('jobs',[]); h=[x for x in jobs if int(x.get('id') or 0)==int(os.environ['V46_JOB'])]
          if len(h)!=1 or h[0].get('conclusion')!='success': raise SystemExit('V46 dedicated job drift')
          if g['id']!=int(os.environ['V46_GENERIC']) or g['head_sha']!=os.environ['V46_HEAD'] or g['run_attempt']!=1 or g.get('conclusion')!='success': raise SystemExit('V46 generic drift')
          gj=z('gj900.json').get('jobs',[]); q=[x for x in gj if int(x.get('id') or 0)==int(os.environ['V46_GENERIC_JOB'])]
          if len(q)!=1 or q[0].get('conclusion')!='success': raise SystemExit('V46 generic job drift')
          arts=z('a900.json').get('artifacts',[])
          h=[a for a in arts if int(a.get('id') or 0)==int(os.environ['V46_ARTIFACT'])]
          if len(h)!=1 or h[0].get('name')!=os.environ['V46_ARTIFACT_NAME'] or h[0].get('digest')!=os.environ['V46_ARTIFACT_DIGEST'] or h[0].get('expired') is not False:
              raise SystemExit('V46 artifact identity drift')
          C=[x for page in z('comments.json') for x in page]
          expected={
            int(os.environ['V46_BACKUP_ACCEPT']):'BACKUP_INDEPENDENT_AUDIT::ACCEPT_AVPS_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V46',
            int(os.environ['V46_PRIMARY_DEFECT']):'INDEPENDENT_AUDIT::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V46_PR900_EXPLICIT_FIRST_LINE_BLOCKER_SURFACE_MISSING',
            int(os.environ['V46_BACKUP_DEFECT']):'BACKUP_INDEPENDENT_AUDIT::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V46_PR900_EXPLICIT_FIRST_LINE_BLOCKER_SURFACE_MISSING'}
          for cid,pref in expected.items():
              h=[x for x in C if int(x.get('id') or 0)==cid]
              if len(h)!=1 or not str(h[0].get('body') or '').startswith(pref): raise SystemExit('Issue60 binding '+str(cid))
              u=h[0].get('user') or {}
              if u.get('login')!='search-maker' or int(u.get('id') or 0)!=304153003 or h[0].get('author_association')!='OWNER': raise SystemExit('Issue60 author identity '+str(cid))
          PY
          rm -rf v46-artifact
          mkdir v46-artifact
          gh run download "$V46_RUN" -n "$V46_ARTIFACT_NAME" -D v46-artifact
          test "$(sha256sum v46-artifact/canonical-final-publisher-v2.yml | awk '{print $1}')" = "$V46_PUBLISHER_SHA256"

      - name: Build V47 canonical publisher with bounded first-line BLOCKER patch
        shell: bash
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,re,textwrap
          from pathlib import Path
          source=Path('v46-artifact/canonical-final-publisher-v2.yml').read_text()
          if hashlib.sha256(source.encode()).hexdigest()!=os.environ['V46_PUBLISHER_SHA256']: raise SystemExit('V46 canonical publisher drift')
          new=source; changes=[]
          def exact_replace(before,after,count,label):
              global new
              n=new.count(before)
              if n!=count: raise SystemExit(f'{label} cardinality drift: {n} != {count}')
              new=new.replace(before,after)
              changes.append({'label':label,'count':count,'before':before,'after':after})

          exact_replace('KNOWN_DEFECT='+os.environ['V46_LIVE_CUTOFF'],'KNOWN_DEFECT='+os.environ['LIVE_CUTOFF'],1,'governance cutoff')
          m=re.findall(r'^          B=\{([0-9,]+)\}$',new,re.M)
          if len(m)!=1: raise SystemExit('publisher suppression ledger shape drift')
          vals=[int(x) for x in m[0].split(',') if x]
          add=[int(os.environ['V46_BACKUP_ACCEPT']),int(os.environ['V46_PRIMARY_DEFECT']),int(os.environ['V46_BACKUP_DEFECT'])]
          if len(vals)!=int(os.environ['V46_LEDGER_CARDINALITY']) or len(set(vals))!=len(vals) or any(x in vals for x in add): raise SystemExit('V46 predecessor ledger drift')
          vals2=vals+add
          exact_replace('          B={'+m[0]+'}','          B={'+','.join(map(str,vals2))+'}',1,'exact suppression ledger')
          first_old="              ok=bool(re.fullmatch(r'AVPS(?:_[A-Z0-9]+)*_(?:CLOSED|NOT_ADMISSIBLE|DO_NOT_USE|COORDINATOR_RECOVERY|SUPERSEDING_DIRECTIVE|BLOCKER)',h))"
          first_new="              ok=bool(re.fullmatch(r'(?:BLOCKER|AVPS(?:_[A-Z0-9]+)*_(?:CLOSED|NOT_ADMISSIBLE|DO_NOT_USE|COORDINATOR_RECOVERY|SUPERSEDING_DIRECTIVE|BLOCKER))',h))"
          exact_replace(first_old,first_new,1,'explicit normalized first-line BLOCKER')

          reverted=new
          for c in reversed(changes):
              if reverted.count(c['after'])!=c['count']: raise SystemExit('reverse patch cardinality '+c['label'])
              reverted=reverted.replace(c['after'],c['before'])
          if reverted!=source or hashlib.sha256(reverted.encode()).hexdigest()!=os.environ['V46_PUBLISHER_SHA256']: raise SystemExit('bounded patch reverse-equivalence failure')

          Path('canonical-final-publisher-v2.yml').write_text(new)
          newsha=hashlib.sha256(new.encode()).hexdigest(); Path('canonical-final-publisher-v2.sha256').write_text(newsha+'\n')
          a=new.index('          import re\n          B={')
          b=new.index('          def state_check():',a)
          core=textwrap.dedent(new[a:b])
          if not core.startswith('import re\nB={'): raise SystemExit('classifier extraction indentation drift')
          ns={}; exec(core,ns)
          B=ns['B']; f=ns['avps_governance_blocker']
          if len(B)!=len(vals2) or sorted(B)!=sorted(vals2) or len(B)!=len(set(B)): raise SystemExit('V47 executable suppression ledger mismatch')

          C=[x for page in json.load(open('comments.json')) for x in page]
          byid={int(x['id']):str(x.get('body') or '') for x in C}
          for cid in add:
              if f(byid[cid],cid): raise SystemExit('exact-bound V46 governance evidence classified blocking '+str(cid))
          cutoff=int(os.environ['LIVE_CUTOFF'])
          fatal=[
            'BLOCKER | AVPS_TEST',
            '**BLOCKER** | AVPS_TEST',
            '### BLOCKER | AVPS_TEST',
            '- BLOCKER | AVPS_TEST',
            '> BLOCKER | AVPS_TEST',
            '_BLOCKER_ | AVPS_TEST',
            '**BLOCKER**\nAVPS_TEST',
            'STATUS: BLOCKER\nAVPS_TEST',
            '**STATUS: BLOCKER**\nAVPS_TEST',
            'DIRECTIVE: BLOCKER\nAVPS_TEST',
            'CONFIRMED_DEFECT AVPS_TEST',
            'MATERIAL_RISK AVPS_TEST',
            'FAIL_CLOSED AVPS_TEST',
            'FAIL-CLOSED AVPS_TEST',
            'QUARANTINE_DOWNSTREAM=TRUE AVPS_TEST']
          for body in fatal:
              if not f(body,cutoff+1): raise SystemExit('required unbound fatal form accepted: '+body.splitlines()[0])
          benign=[
            'INDEPENDENT_AUDIT::ACCEPT_AVPS_TEST\nAny later defect/blocker/risk/directive supersedes.',
            'AVPS review clean; the word blocker appears only in narrative history.',
            'AVPS historical note: previous blocker prose was resolved.']
          for body in benign:
              if f(body,cutoff+1): raise SystemExit('incidental narrative blocker prose false positive')
          if not f('AVPS '+('x'*131073),cutoff+1): raise SystemExit('oversized governance fixture did not fail closed')
          for c in C:
              cid=int(c.get('id') or 0)
              if cid>cutoff and f(str(c.get('body') or ''),cid): raise SystemExit('newer unbound AVPS blocker '+str(cid))

          closed=set(); begins=[]
          for c in C:
              body=str(c.get('body') or '').strip(); first=body.splitlines()[0] if body else ''; fields={}
              for tok in first.replace('|',' ').split():
                  if '=' in tok:
                      k,v=tok.split('=',1); fields.setdefault(k,[]).append(v)
              if first.startswith('WRITE_QUIET_END'):
                  ids=[]
                  for key in ('begin','beginComment','begin_comment'):
                      for v in fields.get(key,[]):
                          if not v.isdigit(): raise SystemExit('non-numeric WRITE_QUIET_END alias')
                          ids.append(int(v))
                  if len(set(ids))>1: raise SystemExit('conflicting WRITE_QUIET_END aliases')
                  if ids: closed.add(ids[0])
              elif first.startswith('WRITE_QUIET_BEGIN'): begins.append(int(c['id']))
          unmatched=[x for x in begins if x not in closed]
          if unmatched: raise SystemExit('unmatched WRITE_QUIET_BEGIN '+repr(unmatched))

          manifest={'schemaVersion':1,'sourceArtifact':int(os.environ['V46_ARTIFACT']),'sourceSha256':os.environ['V46_PUBLISHER_SHA256'],'correctedSha256':newsha,'liveCutoff':cutoff,'exactSuppressedIds':sorted(B),'patches':changes,'reverseEquivalentToV46':True,'runtimeScienceControlsOtherwiseByteIdentical':True,'firstLineBlockerSurfaceAddedOnly':True}
          Path('v47-publisher-patch-manifest.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\n')
          fixtures={'schemaVersion':1,'bareFirstLineBlockerFatal':True,'markdownFirstLineBlockerFatal':True,'headingListQuoteFirstLineBlockerFatal':True,'keyEmphasisFirstLineBlockerFatal':True,'structuredBlockerFatal':True,'laterConfirmedDefectFatal':True,'materialRiskFatal':True,'failClosedFatal':True,'quarantineTrueFatal':True,'incidentalNarrativeBlockerNonBlocking':True,'classifierExecSucceeded':True,'suppressionLedgerCardinality':len(B)}
          Path('v47-governance-fixtures.json').write_text(json.dumps(fixtures,sort_keys=True,indent=2)+'\n')
          if os.environ['MODE']=='publisher':
              actual=Path(os.environ['PUBLISHER_PATH']).read_text()
              if actual!=new: raise SystemExit('publisher v2 byte mismatch')
          PY

      - name: Recheck protected state and write zero-runtime receipt
        shell: bash
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref_status_gate() {
            local x="$1"
            if [ "$x" -eq 0 ]; then return 1; fi
            test "$x" -eq 2
          }
          rm -f fixture-after-present fixture-after-transport fixture-after-absent
          set +e
          ( set -e; ref_status_gate 0; touch fixture-after-present ); fixture_present_rc=$?
          ( set -e; ref_status_gate 128; touch fixture-after-transport ); fixture_transport_rc=$?
          ( set -e; ref_status_gate 2; touch fixture-after-absent ); fixture_absent_rc=$?
          set -e
          test "$fixture_present_rc" -ne 0
          test "$fixture_transport_rc" -ne 0
          test "$fixture_absent_rc" -eq 0
          test ! -e fixture-after-present
          test ! -e fixture-after-transport
          test -e fixture-after-absent
          rm -f fixture-after-absent

          set +e
          git ls-remote --exit-code --heads origin dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-ordinal-45 >/dev/null 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo 'ordinal45 dispatch ref exists' >&2; exit 1
          fi
          test "$rc" -eq 2

          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > comments-final.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/avps-v2-postconsumption-recovery4-science.yml/runs?event=workflow_dispatch&per_page=100" > science-runs.json
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          C=[x for page in json.load(open('comments-final.json')) for x in page]
          consumed='ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_DISPATCH_CONSUMED'
          if any(str(c.get('body') or '').strip().startswith(consumed) for c in C): raise SystemExit('consumed marker exists')
          runs=[]
          for page in json.load(open('science-runs.json')):
              if not isinstance(page,dict): raise SystemExit('science run pagination drift')
              runs.extend(page.get('workflow_runs',[]))
          if runs: raise SystemExit('science workflow_dispatch already exists')
          sha=Path('canonical-final-publisher-v2.sha256').read_text().strip()
          if sha!=hashlib.sha256(Path('canonical-final-publisher-v2.yml').read_bytes()).hexdigest(): raise SystemExit('corrected publisher hash drift')
          manifest=json.load(open('v47-publisher-patch-manifest.json'))
          r={'schemaVersion':1,'status':'PASS_AVPS_V2_RECOVERY4_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V47_ZERO_RUNTIME','headSha':os.environ['EVENT_HEAD'],'baseSha':os.environ['EVENT_BASE'],'rejectedV46Head':os.environ['V46_HEAD'],'v46DedicatedRun':int(os.environ['V46_RUN']),'v46DedicatedJob':int(os.environ['V46_JOB']),'v46GenericRun':int(os.environ['V46_GENERIC']),'v46GenericJob':int(os.environ['V46_GENERIC_JOB']),'v46Artifact':int(os.environ['V46_ARTIFACT']),'v46ArtifactDigest':os.environ['V46_ARTIFACT_DIGEST'],'v46BackupAcceptance':int(os.environ['V46_BACKUP_ACCEPT']),'v46PrimaryDefect':int(os.environ['V46_PRIMARY_DEFECT']),'v46BackupDefect':int(os.environ['V46_BACKUP_DEFECT']),'liveCutoff':int(os.environ['LIVE_CUTOFF']),'correctedPublisherSha256':sha,'suppressionLedgerCardinality':len(manifest['exactSuppressedIds']),'dispatchRefStatusCapturePreserved':True,'firstLineBlockerSurfaceCorrected':True,'dispatchCreated':False,'consumedMarkerCreated':False,'workflowDispatchPerformed':False,'solverExecutionPerformed':False,'resultOpeningAuthorized':False,'levelBAdmissionAuthorized':False,'holdoutOpened':False,'productionAuthorized':False,'taylorOrJerusalemUsed':False,'newMappingAuthorized':False}
          Path('review-receipt-v47.json').write_text(json.dumps(r,sort_keys=True,indent=2)+'\n')
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: avps-v2-recovery4-ordinal45-final-publisher-governance-review-v47
          path: |
            review-receipt-v47.json
            canonical-final-publisher-v2.yml
            canonical-final-publisher-v2.sha256
            v47-publisher-patch-manifest.json
            v47-governance-fixtures.json
          if-no-files-found: error
          compression-level: 0
