name: Review AVPS Recovery4 ordinal45 final publisher governance v48

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v48.yml
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v2.yml

permissions: {contents: read, actions: read, issues: read, pull-requests: read}
concurrency:
  group: avps-v2-recovery4-ordinal45-final-publisher-governance-v48-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      MAIN_EXPECTED: 52cbcb69029360d938f66b79da5150bdcaed6231
      INFRA_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-infrastructure-v48
      INFRA_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v48.yml
      PUBLISHER_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v2
      PUBLISHER_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v2.yml
      V47_PR: '901'
      V47_HEAD: 769a5560328884ff59599d23157745c87a027645
      V47_BASE: 52cbcb69029360d938f66b79da5150bdcaed6231
      V47_TREE: 0ef06fa1aab5b0d98033a53e884c287c29f34032
      V47_BLOB: 6fe583201e3052d3ab722964ee2ee406bdcac0df
      V47_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v47.yml
      V47_RUN: '33713500653'
      V47_JOB: '100517747248'
      V47_GENERIC: '33713500527'
      V47_GENERIC_JOB: '100517747044'
      V47_ARTIFACT: '9877699897'
      V47_ARTIFACT_NAME: avps-v2-recovery4-ordinal45-final-publisher-governance-review-v47
      V47_ARTIFACT_DIGEST: sha256:025e1d4183b0e08e51a4bffec31440020af4b6bbe8cd0b97098c2b34c0ab5603
      V47_PUBLISHER_SHA256: 25497f0cad3876f708025606270ddae5106ed298576a7e3bdc1543e6a3a99539
      V47_LEDGER_CARDINALITY: '47'
      V47_PRIMARY_DEFECT: '5520612269'
      V47_BACKUP_DEFECT: '5520658727'
      LIVE_CUTOFF: '5520658727'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}

      - name: Bind rejected V47 evidence and download exact artifact
        id: mode
        shell: bash
        env:
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$EVENT_ACTION" = opened
          test "$EVENT_BASE" = "$MAIN_EXPECTED"
          if [ "$EVENT_BRANCH" = "$INFRA_BRANCH" ]; then
            MODE=reviewer; EXPECT_PATH="$INFRA_PATH"
          elif [ "$EVENT_BRANCH" = "$PUBLISHER_BRANCH" ]; then
            MODE=publisher; EXPECT_PATH="$PUBLISHER_PATH"
          else
            echo 'unexpected V48 branch' >&2; exit 1
          fi
          set -- $(git rev-list --parents -n1 "$EVENT_HEAD")
          test "$#" -eq 2
          test "$2" = "$MAIN_EXPECTED"
          test "$(git diff --name-status "$MAIN_EXPECTED" "$EVENT_HEAD")" = "A	$EXPECT_PATH"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

          git fetch --no-tags origin "$V47_HEAD"
          test "$(git rev-parse "$V47_HEAD^{tree}")" = "$V47_TREE"
          test "$(git rev-parse "$V47_HEAD:$V47_PATH")" = "$V47_BLOB"
          set -- $(git rev-list --parents -n1 "$V47_HEAD")
          test "$#" -eq 2
          test "$2" = "$V47_BASE"

          gh api "repos/$GITHUB_REPOSITORY/pulls/$V47_PR" > pr901.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V47_RUN" > r901.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V47_RUN/jobs?per_page=100" > j901.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V47_GENERIC" > g901.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V47_GENERIC/jobs?per_page=100" > gj901.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V47_RUN/artifacts?per_page=100" > a901.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > comments.json
          python - <<'PY'
          import json,os,re
          z=lambda p:json.load(open(p))
          p=z('pr901.json')
          if p.get('state')!='closed' or p.get('merged_at') is not None or p['head']['sha']!=os.environ['V47_HEAD'] or p['base']['sha']!=os.environ['V47_BASE']:
              raise SystemExit('PR901 rejected identity drift')
          r=z('r901.json'); g=z('g901.json')
          if r['id']!=int(os.environ['V47_RUN']) or r['head_sha']!=os.environ['V47_HEAD'] or r['run_attempt']!=1 or r.get('conclusion')!='success': raise SystemExit('V47 dedicated drift')
          jobs=z('j901.json').get('jobs',[]); h=[x for x in jobs if int(x.get('id') or 0)==int(os.environ['V47_JOB'])]
          if len(h)!=1 or h[0].get('conclusion')!='success': raise SystemExit('V47 dedicated job drift')
          if g['id']!=int(os.environ['V47_GENERIC']) or g['head_sha']!=os.environ['V47_HEAD'] or g['run_attempt']!=1 or g.get('conclusion')!='success': raise SystemExit('V47 generic drift')
          gj=z('gj901.json').get('jobs',[]); q=[x for x in gj if int(x.get('id') or 0)==int(os.environ['V47_GENERIC_JOB'])]
          if len(q)!=1 or q[0].get('conclusion')!='success': raise SystemExit('V47 generic job drift')
          arts=z('a901.json').get('artifacts',[])
          h=[a for a in arts if int(a.get('id') or 0)==int(os.environ['V47_ARTIFACT'])]
          if len(h)!=1 or h[0].get('name')!=os.environ['V47_ARTIFACT_NAME'] or h[0].get('digest')!=os.environ['V47_ARTIFACT_DIGEST'] or h[0].get('expired') is not False:
              raise SystemExit('V47 artifact identity drift')
          C=[x for page in z('comments.json') for x in page]
          expected={
            int(os.environ['V47_PRIMARY_DEFECT']):'INDEPENDENT_AUDIT::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V47_PR901_REVIEW_RECEIPT_EXACT_SUPPRESSION_LEDGER_NOT_BOUND',
            int(os.environ['V47_BACKUP_DEFECT']):'BACKUP_INDEPENDENT_AUDIT::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V47_PR901_REVIEW_RECEIPT_EXACT_SUPPRESSION_LEDGER_NOT_BOUND'}
          for cid,pref in expected.items():
              h=[x for x in C if int(x.get('id') or 0)==cid]
              if len(h)!=1 or not str(h[0].get('body') or '').startswith(pref): raise SystemExit('Issue60 binding '+str(cid))
              u=h[0].get('user') or {}
              if u.get('login')!='search-maker' or int(u.get('id') or 0)!=304153003 or h[0].get('author_association')!='OWNER': raise SystemExit('Issue60 author identity '+str(cid))

          cutoff=int(os.environ['LIVE_CUTOFF'])
          def normalized_first(body):
              s=(body or '').strip(); first=s.splitlines()[0].strip() if s else ''
              for _ in range(4):
                  old=first
                  first=re.sub(r'^(?:#{1,6}|[-*+]|>)\s*','',first).strip()
                  first=re.sub(r'^(?:\*\*|__|\*|_|`)+|(?:\*\*|__|\*|_|`)+$','',first).strip()
                  if first==old: break
              return first.upper()
          def blocking(body):
              s=(body or '').strip(); f=normalized_first(s)
              if len(s)>131072: return True
              if re.match(r'^(?:BLOCKER(?:\s|\||:|$)|STATUS\s*:\s*BLOCKER|DIRECTIVE\s*:\s*BLOCKER)',f): return True
              if re.match(r'^(?:INDEPENDENT_AUDIT::|BACKUP_INDEPENDENT_AUDIT::)?CONFIRMED_DEFECT\b',f): return True
              if re.match(r'^MATERIAL_RISK\b',f) or re.match(r'^FAIL[_-]CLOSED\b',f): return True
              if re.search(r'\bQUARANTINE_DOWNSTREAM\s*=\s*TRUE\b',f): return True
              return False
          for c in C:
              cid=int(c.get('id') or 0)
              if cid>cutoff and blocking(str(c.get('body') or '')):
                  raise SystemExit('newer unbound AVPS governance blocker '+str(cid))

          closed=set(); begins=[]
          for c in C:
              body=str(c.get('body') or '').strip(); first=body.splitlines()[0] if body else ''; fields={}
              for tok in first.replace('|',' ').split():
                  if '=' in tok:
                      k,v=tok.split('=',1); fields.setdefault(k,[]).append(v)
              if first.startswith('WRITE_QUIET_END'):
                  ids=[]
                  for key in ('begin','beginComment','begin_comment'):
                      for v in fields.get(key,[]):
                          if not v.isdigit(): raise SystemExit('non-numeric WRITE_QUIET_END alias')
                          ids.append(int(v))
                  if len(set(ids))>1: raise SystemExit('conflicting WRITE_QUIET_END aliases')
                  if ids: closed.add(ids[0])
              elif first.startswith('WRITE_QUIET_BEGIN'): begins.append(int(c['id']))
          unmatched=[x for x in begins if x not in closed]
          if unmatched: raise SystemExit('unmatched WRITE_QUIET_BEGIN '+repr(unmatched))
          PY

          rm -rf v47-artifact
          mkdir v47-artifact
          gh run download "$V47_RUN" -n "$V47_ARTIFACT_NAME" -D v47-artifact
          test "$(sha256sum v47-artifact/canonical-final-publisher-v2.yml | awk '{print $1}')" = "$V47_PUBLISHER_SHA256"

      - name: Repair receipt exact suppression-ledger proof only
        shell: bash
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,re,textwrap
          from pathlib import Path
          root=Path('v47-artifact')
          required=['canonical-final-publisher-v2.yml','canonical-final-publisher-v2.sha256','v47-publisher-patch-manifest.json','v47-governance-fixtures.json','review-receipt-v47.json']
          for name in required:
              if not (root/name).is_file(): raise SystemExit('missing V47 artifact member '+name)
          pub=(root/'canonical-final-publisher-v2.yml').read_bytes()
          sha=hashlib.sha256(pub).hexdigest()
          if sha!=os.environ['V47_PUBLISHER_SHA256']: raise SystemExit('V47 canonical publisher byte drift')
          if (root/'canonical-final-publisher-v2.sha256').read_text().strip()!=sha: raise SystemExit('V47 publisher sha file drift')
          source=pub.decode()
          m=re.findall(r'^          B=\{([0-9,]+)\}$',source,re.M)
          if len(m)!=1: raise SystemExit('V47 executable suppression ledger shape drift')
          parsed=[int(x) for x in m[0].split(',') if x]
          if len(parsed)!=int(os.environ['V47_LEDGER_CARDINALITY']) or parsed!=sorted(parsed) or len(set(parsed))!=len(parsed):
              raise SystemExit('V47 executable suppression ledger cardinality/order drift')
          a=source.index('          import re\n          B={')
          b=source.index('          def state_check():',a)
          core=textwrap.dedent(source[a:b])
          ns={}; exec(core,ns)
          executable=sorted(int(x) for x in ns['B'])
          if executable!=parsed: raise SystemExit('parsed ledger != executable classifier B')
          manifest=json.load(open(root/'v47-publisher-patch-manifest.json'))
          mids=manifest.get('exactSuppressedIds')
          if mids!=executable: raise SystemExit('V47 manifest != executable classifier B')
          old=json.load(open(root/'review-receipt-v47.json'))
          if int(old.get('suppressionLedgerCardinality') or -1)!=len(executable): raise SystemExit('V47 receipt cardinality drift')
          if 'exactSuppressedIds' in old: raise SystemExit('V47 receipt unexpectedly already binds exactSuppressedIds')

          corrected=dict(old)
          corrected.update({
            'schemaVersion':1,
            'status':'PASS_AVPS_V2_RECOVERY4_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V48_ZERO_RUNTIME',
            'headSha':os.environ['EVENT_HEAD'],
            'baseSha':os.environ['EVENT_BASE'],
            'rejectedV47Head':os.environ['V47_HEAD'],
            'v47DedicatedRun':int(os.environ['V47_RUN']),
            'v47DedicatedJob':int(os.environ['V47_JOB']),
            'v47GenericRun':int(os.environ['V47_GENERIC']),
            'v47GenericJob':int(os.environ['V47_GENERIC_JOB']),
            'v47Artifact':int(os.environ['V47_ARTIFACT']),
            'v47ArtifactDigest':os.environ['V47_ARTIFACT_DIGEST'],
            'v47PrimaryDefect':int(os.environ['V47_PRIMARY_DEFECT']),
            'v47BackupDefect':int(os.environ['V47_BACKUP_DEFECT']),
            'liveCutoff':int(os.environ['LIVE_CUTOFF']),
            'correctedPublisherSha256':sha,
            'canonicalPublisherBytePreserved':True,
            'proofMetadataOnlyCorrection':True,
            'suppressionLedgerCardinality':len(executable),
            'exactSuppressedIds':executable,
            'dispatchCreated':False,
            'consumedMarkerCreated':False,
            'workflowDispatchPerformed':False,
            'solverExecutionPerformed':False,
            'resultOpeningAuthorized':False,
            'levelBAdmissionAuthorized':False,
            'holdoutOpened':False,
            'productionAuthorized':False,
            'taylorOrJerusalemUsed':False,
            'newMappingAuthorized':False})
          if corrected['exactSuppressedIds']!=manifest['exactSuppressedIds'] or corrected['exactSuppressedIds']!=executable:
              raise SystemExit('receipt == manifest == executable classifier B equality failure')
          Path('canonical-final-publisher-v2.yml').write_bytes(pub)
          Path('canonical-final-publisher-v2.sha256').write_text(sha+'\n')
          Path('v47-publisher-patch-manifest.json').write_bytes((root/'v47-publisher-patch-manifest.json').read_bytes())
          Path('v47-governance-fixtures.json').write_bytes((root/'v47-governance-fixtures.json').read_bytes())
          Path('review-receipt-v48.json').write_text(json.dumps(corrected,sort_keys=True,indent=2)+'\n')
          if os.environ['MODE']=='publisher':
              actual=Path(os.environ['PUBLISHER_PATH']).read_bytes()
              if actual!=pub: raise SystemExit('publisher v2 byte mismatch')
          PY

      - name: Recheck protected state and receipt equality
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set +e
          git ls-remote --exit-code --heads origin dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-ordinal-45 >/dev/null 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then echo 'ordinal45 dispatch ref exists' >&2; exit 1; fi
          test "$rc" -eq 2
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > comments-final.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/avps-v2-postconsumption-recovery4-science.yml/runs?event=workflow_dispatch&per_page=100" > science-runs.json
          python - <<'PY'
          import hashlib,json,os,re,textwrap
          from pathlib import Path
          C=[x for page in json.load(open('comments-final.json')) for x in page]
          consumed='ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_DISPATCH_CONSUMED'
          if any(str(c.get('body') or '').strip().startswith(consumed) for c in C): raise SystemExit('consumed marker exists')
          runs=[]
          for page in json.load(open('science-runs.json')):
              if not isinstance(page,dict): raise SystemExit('science run pagination drift')
              runs.extend(page.get('workflow_runs',[]))
          if runs: raise SystemExit('science workflow_dispatch already exists')
          pub=Path('canonical-final-publisher-v2.yml').read_text()
          sha=hashlib.sha256(pub.encode()).hexdigest()
          if sha!=os.environ['V47_PUBLISHER_SHA256']: raise SystemExit('canonical publisher changed during V48')
          m=re.findall(r'^          B=\{([0-9,]+)\}$',pub,re.M)
          if len(m)!=1: raise SystemExit('final publisher suppression ledger shape drift')
          ids=[int(x) for x in m[0].split(',') if x]
          manifest=json.load(open('v47-publisher-patch-manifest.json'))
          receipt=json.load(open('review-receipt-v48.json'))
          if receipt.get('exactSuppressedIds')!=manifest.get('exactSuppressedIds') or receipt.get('exactSuppressedIds')!=ids:
              raise SystemExit('final receipt exactSuppressedIds equality failure')
          if receipt.get('suppressionLedgerCardinality')!=len(ids): raise SystemExit('final receipt cardinality mismatch')
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: avps-v2-recovery4-ordinal45-final-publisher-governance-review-v48
          path: |
            review-receipt-v48.json
            canonical-final-publisher-v2.yml
            canonical-final-publisher-v2.sha256
            v47-publisher-patch-manifest.json
            v47-governance-fixtures.json
          if-no-files-found: error
