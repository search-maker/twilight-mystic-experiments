name: Review AVPS Recovery4 ordinal45 final publisher governance v49

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v49.yml
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v2.yml

permissions: {contents: read, actions: read, issues: read, pull-requests: read}
concurrency:
  group: avps-v2-recovery4-ordinal45-final-publisher-governance-v49-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      MAIN_EXPECTED: 52cbcb69029360d938f66b79da5150bdcaed6231
      INFRA_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-infrastructure-v49
      INFRA_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v49.yml
      PUBLISHER_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v2
      PUBLISHER_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v2.yml
      V48_PR: '902'
      V48_HEAD: 142072868520fc1df9170678ec491e79cc3d0506
      V48_BASE: 52cbcb69029360d938f66b79da5150bdcaed6231
      V48_TREE: 7c1e4fd10e41448b6ba7a055a4f581daa1a30a75
      V48_BLOB: 43d80c8a5542a1be4e4d24e72fc050ae0794a218
      V48_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v48.yml
      V48_RUN: '33717218616'
      V48_JOB: '100528837188'
      V48_GENERIC: '33717218516'
      V48_GENERIC_JOB: '100528836889'
      V48_ARTIFACT: '9878945380'
      V48_ARTIFACT_NAME: avps-v2-recovery4-ordinal45-final-publisher-governance-review-v48
      V48_ARTIFACT_DIGEST: sha256:a78cb2df4868e59d2fc7ddbc2798dab0cf2a6aca37fa57aea969023db6681261
      V48_PUBLISHER_SHA256: 25497f0cad3876f708025606270ddae5106ed298576a7e3bdc1543e6a3a99539
      OLD_KNOWN_DEFECT: '5520079122'
      V47_PRIMARY_DEFECT: '5520612269'
      V47_BACKUP_DEFECT: '5520658727'
      V48_BACKUP_DEFECT: '5520822717'
      V48_PRIMARY_DEFECT: '5520836467'
      LIVE_CUTOFF: '5520836467'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}

      - name: Bind rejected V48 evidence and download exact artifact
        id: mode
        shell: bash
        env:
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$EVENT_ACTION" = opened
          test "$EVENT_BASE" = "$MAIN_EXPECTED"
          if [ "$EVENT_BRANCH" = "$INFRA_BRANCH" ]; then
            MODE=reviewer; EXPECT_PATH="$INFRA_PATH"
          elif [ "$EVENT_BRANCH" = "$PUBLISHER_BRANCH" ]; then
            MODE=publisher; EXPECT_PATH="$PUBLISHER_PATH"
          else
            echo 'unexpected V49 branch' >&2; exit 1
          fi
          set -- $(git rev-list --parents -n1 "$EVENT_HEAD")
          test "$#" -eq 2
          test "$2" = "$MAIN_EXPECTED"
          test "$(git diff --name-status "$MAIN_EXPECTED" "$EVENT_HEAD")" = "A	$EXPECT_PATH"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

          git fetch --no-tags origin "$V48_HEAD"
          test "$(git rev-parse "$V48_HEAD^{tree}")" = "$V48_TREE"
          test "$(git rev-parse "$V48_HEAD:$V48_PATH")" = "$V48_BLOB"
          set -- $(git rev-list --parents -n1 "$V48_HEAD")
          test "$#" -eq 2
          test "$2" = "$V48_BASE"

          gh api "repos/$GITHUB_REPOSITORY/pulls/$V48_PR" > pr902.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V48_RUN" > r902.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V48_RUN/jobs?per_page=100" > j902.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V48_GENERIC" > g902.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V48_GENERIC/jobs?per_page=100" > gj902.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V48_RUN/artifacts?per_page=100" > a902.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > comments.json
          python - <<'PY'
          import json,os,re
          z=lambda p:json.load(open(p))
          p=z('pr902.json')
          if p.get('state')!='closed' or p.get('merged_at') is not None or p['head']['sha']!=os.environ['V48_HEAD'] or p['base']['sha']!=os.environ['V48_BASE']:
              raise SystemExit('PR902 rejected identity drift')
          r=z('r902.json'); g=z('g902.json')
          if r['id']!=int(os.environ['V48_RUN']) or r['head_sha']!=os.environ['V48_HEAD'] or r['run_attempt']!=1 or r.get('conclusion')!='success': raise SystemExit('V48 dedicated drift')
          jobs=z('j902.json').get('jobs',[]); h=[x for x in jobs if int(x.get('id') or 0)==int(os.environ['V48_JOB'])]
          if len(h)!=1 or h[0].get('conclusion')!='success': raise SystemExit('V48 dedicated job drift')
          if g['id']!=int(os.environ['V48_GENERIC']) or g['head_sha']!=os.environ['V48_HEAD'] or g['run_attempt']!=1 or g.get('conclusion')!='success': raise SystemExit('V48 generic drift')
          gj=z('gj902.json').get('jobs',[]); q=[x for x in gj if int(x.get('id') or 0)==int(os.environ['V48_GENERIC_JOB'])]
          if len(q)!=1 or q[0].get('conclusion')!='success': raise SystemExit('V48 generic job drift')
          arts=z('a902.json').get('artifacts',[])
          h=[a for a in arts if int(a.get('id') or 0)==int(os.environ['V48_ARTIFACT'])]
          if len(h)!=1 or h[0].get('name')!=os.environ['V48_ARTIFACT_NAME'] or h[0].get('digest')!=os.environ['V48_ARTIFACT_DIGEST'] or h[0].get('expired') is not False:
              raise SystemExit('V48 artifact identity drift')
          C=[x for page in z('comments.json') for x in page]
          expected={
            int(os.environ['V47_PRIMARY_DEFECT']):'INDEPENDENT_AUDIT::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V47_PR901_REVIEW_RECEIPT_EXACT_SUPPRESSION_LEDGER_NOT_BOUND',
            int(os.environ['V47_BACKUP_DEFECT']):'BACKUP_INDEPENDENT_AUDIT::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V47_PR901_REVIEW_RECEIPT_EXACT_SUPPRESSION_LEDGER_NOT_BOUND',
            int(os.environ['V48_BACKUP_DEFECT']):'BACKUP_INDEPENDENT_AUDIT::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V48_PR902_CANONICAL_PUBLISHER_SELF_BLOCKS_ON_BOUND_V47_DEFECTS',
            int(os.environ['V48_PRIMARY_DEFECT']):'INDEPENDENT_AUDIT::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V48_PR902_CANONICAL_PUBLISHER_SELF_BLOCKS_ON_BOUND_V47_DEFECTS'}
          for cid,pref in expected.items():
              h=[x for x in C if int(x.get('id') or 0)==cid]
              if len(h)!=1 or not str(h[0].get('body') or '').startswith(pref): raise SystemExit('Issue60 binding '+str(cid))
              u=h[0].get('user') or {}
              if u.get('login')!='search-maker' or int(u.get('id') or 0)!=304153003 or h[0].get('author_association')!='OWNER': raise SystemExit('Issue60 author identity '+str(cid))

          cutoff=int(os.environ['LIVE_CUTOFF'])
          def normalized_first(body):
              s=(body or '').strip(); first=s.splitlines()[0].strip() if s else ''
              for _ in range(4):
                  old=first
                  first=re.sub(r'^(?:#{1,6}|[-*+]|>)\s*','',first).strip()
                  first=re.sub(r'^(?:\*\*|__|\*|_|`)+|(?:\*\*|__|\*|_|`)+$','',first).strip()
                  if first==old: break
              return first.upper()
          def blocking(body):
              s=(body or '').strip(); f=normalized_first(s)
              if len(s)>131072: return True
              if re.match(r'^(?:BLOCKER(?:\s|\||:|$)|STATUS\s*:\s*BLOCKER|DIRECTIVE\s*:\s*BLOCKER)',f): return True
              if re.match(r'^(?:INDEPENDENT_AUDIT::|BACKUP_INDEPENDENT_AUDIT::)?CONFIRMED_DEFECT\b',f): return True
              if re.match(r'^MATERIAL_RISK\b',f) or re.match(r'^FAIL[_-]CLOSED\b',f): return True
              if re.search(r'\bQUARANTINE_DOWNSTREAM\s*=\s*TRUE\b',f): return True
              return False
          for c in C:
              cid=int(c.get('id') or 0)
              if cid>cutoff and blocking(str(c.get('body') or '')):
                  raise SystemExit('newer unbound AVPS governance blocker '+str(cid))

          closed=set(); begins=[]
          for c in C:
              body=str(c.get('body') or '').strip(); first=body.splitlines()[0] if body else ''; fields={}
              for tok in first.replace('|',' ').split():
                  if '=' in tok:
                      k,v=tok.split('=',1); fields.setdefault(k,[]).append(v)
              if first.startswith('WRITE_QUIET_END'):
                  ids=[]
                  for key in ('begin','beginComment','begin_comment'):
                      for v in fields.get(key,[]):
                          if not v.isdigit(): raise SystemExit('non-numeric WRITE_QUIET_END alias')
                          ids.append(int(v))
                  if len(set(ids))>1: raise SystemExit('conflicting WRITE_QUIET_END aliases')
                  if ids: closed.add(ids[0])
              elif first.startswith('WRITE_QUIET_BEGIN'): begins.append(int(c['id']))
          unmatched=[x for x in begins if x not in closed]
          if unmatched: raise SystemExit('unmatched WRITE_QUIET_BEGIN '+repr(unmatched))
          PY

          rm -rf v48-artifact
          mkdir v48-artifact
          gh run download "$V48_RUN" -n "$V48_ARTIFACT_NAME" -D v48-artifact
          test "$(sha256sum v48-artifact/canonical-final-publisher-v2.yml | awk '{print $1}')" = "$V48_PUBLISHER_SHA256"

      - name: Advance canonical publisher own governance ledger exactly
        shell: bash
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,re,textwrap
          from pathlib import Path
          root=Path('v48-artifact')
          required=['canonical-final-publisher-v2.yml','canonical-final-publisher-v2.sha256','v47-publisher-patch-manifest.json','v47-governance-fixtures.json','review-receipt-v48.json']
          for name in required:
              if not (root/name).is_file(): raise SystemExit('missing V48 artifact member '+name)
          old=(root/'canonical-final-publisher-v2.yml').read_bytes()
          oldsha=hashlib.sha256(old).hexdigest()
          if oldsha!=os.environ['V48_PUBLISHER_SHA256']: raise SystemExit('V48 canonical publisher byte drift')
          if (root/'canonical-final-publisher-v2.sha256').read_text().strip()!=oldsha: raise SystemExit('V48 publisher sha file drift')
          source=old.decode()
          old_known=int(os.environ['OLD_KNOWN_DEFECT'])
          if len(re.findall(r'^\s*KNOWN_DEFECT='+re.escape(str(old_known))+r'\s*$',source,re.M))!=1:
              raise SystemExit('old canonical KNOWN_DEFECT shape drift')
          m=re.findall(r'^          B=\{([0-9,]+)\}$',source,re.M)
          if len(m)!=1: raise SystemExit('old canonical suppression ledger shape drift')
          old_ids=[int(x) for x in m[0].split(',') if x]
          if len(old_ids)!=47 or old_ids!=sorted(old_ids) or len(set(old_ids))!=len(old_ids):
              raise SystemExit('old canonical suppression ledger cardinality/order drift')
          a=source.index('          import re\n          B={')
          b=source.index('          def state_check():',a)
          old_core=textwrap.dedent(source[a:b]); old_ns={}; exec(old_core,old_ns)
          if sorted(int(x) for x in old_ns['B'])!=old_ids: raise SystemExit('old parsed ledger != executable B')
          old_manifest=json.load(open(root/'v47-publisher-patch-manifest.json'))
          old_receipt=json.load(open(root/'review-receipt-v48.json'))
          if old_manifest.get('exactSuppressedIds')!=old_ids or old_receipt.get('exactSuppressedIds')!=old_ids:
              raise SystemExit('V48 exact-set equality drift')

          add=[int(os.environ[x]) for x in ('V47_PRIMARY_DEFECT','V47_BACKUP_DEFECT','V48_BACKUP_DEFECT','V48_PRIMARY_DEFECT')]
          if len(set(add))!=4 or any(x in old_ids for x in add): raise SystemExit('successor evidence ledger collision')
          new_ids=sorted(old_ids+add)
          new_known=int(os.environ['LIVE_CUTOFF'])
          if new_known!=max(add): raise SystemExit('successor cutoff mismatch')
          old_b='          B={'+','.join(map(str,old_ids))+'}'
          new_b='          B={'+','.join(map(str,new_ids))+'}'
          if source.count(old_b)!=1: raise SystemExit('old B literal multiplicity drift')
          known_pat=re.compile(r'^(\s*)KNOWN_DEFECT='+re.escape(str(old_known))+r'\s*$',re.M)
          new_source,n=known_pat.subn(lambda m:m.group(1)+'KNOWN_DEFECT='+str(new_known),source,count=1)
          if n!=1: raise SystemExit('KNOWN_DEFECT replacement failed')
          new_source=new_source.replace(old_b,new_b,1)
          if new_source==source: raise SystemExit('canonical publisher patch empty')

          reverse=new_source.replace(new_b,old_b,1)
          reverse=re.sub(r'^(\s*)KNOWN_DEFECT='+re.escape(str(new_known))+r'\s*$',lambda m:m.group(1)+'KNOWN_DEFECT='+str(old_known),reverse,count=1,flags=re.M)
          if reverse.encode()!=old: raise SystemExit('reverse patch does not reproduce exact V48 publisher bytes')

          m2=re.findall(r'^          B=\{([0-9,]+)\}$',new_source,re.M)
          if len(m2)!=1: raise SystemExit('new canonical suppression ledger shape drift')
          parsed=[int(x) for x in m2[0].split(',') if x]
          if parsed!=new_ids: raise SystemExit('new parsed suppression ledger mismatch')
          a2=new_source.index('          import re\n          B={'); b2=new_source.index('          def state_check():',a2)
          core=textwrap.dedent(new_source[a2:b2]); ns={}; exec(core,ns)
          executable=sorted(int(x) for x in ns['B'])
          if executable!=new_ids: raise SystemExit('new executable suppression ledger mismatch')
          blocker=ns.get('avps_governance_blocker')
          if not callable(blocker): raise SystemExit('canonical publisher classifier missing')

          comments=json.load(open('comments.json'))
          C=[x for page in comments for x in page]
          bound={cid:[x for x in C if int(x.get('id') or 0)==cid] for cid in add}
          for cid,h in bound.items():
              if len(h)!=1: raise SystemExit('bound predecessor comment missing '+str(cid))
              body=str(h[0].get('body') or '')
              if not blocker(body): raise SystemExit('bound predecessor defect no longer classified fatal '+str(cid))
              if cid not in executable or cid>new_known: raise SystemExit('bound predecessor defect not suppressed by exact canonical ledger '+str(cid))

          fresh=new_known+1
          fatal=[
            'CONFIRMED_DEFECT AVPS_TEST',
            'MATERIAL_RISK AVPS_TEST',
            'BLOCKER | AVPS_TEST',
            '**BLOCKER** | AVPS_TEST',
            'STATUS: BLOCKER | AVPS_TEST',
            'DIRECTIVE: BLOCKER | AVPS_TEST',
            'FAIL_CLOSED AVPS_TEST',
            'FAIL-CLOSED AVPS_TEST',
            'QUARANTINE_DOWNSTREAM=TRUE AVPS_TEST']
          for body in fatal:
              if not blocker(body): raise SystemExit('fresh governance fixture failed '+body)
              if fresh in executable or fresh<=new_known: raise SystemExit('fresh governance fixture accidentally suppressed')
          benign='AVPS historical note: the word blocker appears here only as incidental narrative prose.'
          if blocker(benign): raise SystemExit('incidental narrative blocker prose overblocked')

          final=new_source.encode(); sha=hashlib.sha256(final).hexdigest()
          manifest=dict(old_manifest)
          manifest.update({
            'schemaVersion':1,
            'sourcePublisherSha256':oldsha,
            'correctedPublisherSha256':sha,
            'oldKnownDefect':old_known,
            'knownDefect':new_known,
            'addedExactSuppressedIds':add,
            'exactSuppressedIds':executable,
            'suppressionLedgerCardinality':len(executable),
            'boundedCanonicalGovernancePatchOnly':True,
            'reversePatchReproducesExactV48Publisher':True})
          fixtures={
            'schemaVersion':1,
            'boundPredecessorDefectsNonblockingByExactId':[int(x) for x in add],
            'freshSyntheticId':fresh,
            'freshFatalFirstLines':fatal,
            'incidentalNarrativeNonblocking':benign,
            'actualCanonicalClassifierExecuted':True,
            'canonicalNotDeadOnArrivalAgainstBoundLedger':True}
          receipt={
            'schemaVersion':1,
            'status':'PASS_AVPS_V2_RECOVERY4_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V49_ZERO_RUNTIME',
            'headSha':os.environ['EVENT_HEAD'],
            'baseSha':os.environ['EVENT_BASE'],
            'rejectedV48Head':os.environ['V48_HEAD'],
            'v48DedicatedRun':int(os.environ['V48_RUN']),
            'v48DedicatedJob':int(os.environ['V48_JOB']),
            'v48GenericRun':int(os.environ['V48_GENERIC']),
            'v48GenericJob':int(os.environ['V48_GENERIC_JOB']),
            'v48Artifact':int(os.environ['V48_ARTIFACT']),
            'v48ArtifactDigest':os.environ['V48_ARTIFACT_DIGEST'],
            'v47PrimaryDefect':int(os.environ['V47_PRIMARY_DEFECT']),
            'v47BackupDefect':int(os.environ['V47_BACKUP_DEFECT']),
            'v48BackupDefect':int(os.environ['V48_BACKUP_DEFECT']),
            'v48PrimaryDefect':int(os.environ['V48_PRIMARY_DEFECT']),
            'liveCutoff':new_known,
            'sourcePublisherSha256':oldsha,
            'correctedPublisherSha256':sha,
            'suppressionLedgerCardinality':len(executable),
            'exactSuppressedIds':executable,
            'canonicalPublisherGovernanceLedgerAdvanced':True,
            'canonicalNotDeadOnArrivalAgainstBoundLedger':True,
            'v46DispatchRefRcSemanticsPreservedByExactReversePatch':True,
            'runtimeScienceControlsPreservedByExactReversePatch':True,
            'dispatchCreated':False,
            'consumedMarkerCreated':False,
            'workflowDispatchPerformed':False,
            'solverExecutionPerformed':False,
            'resultOpeningAuthorized':False,
            'levelBAdmissionAuthorized':False,
            'holdoutOpened':False,
            'productionAuthorized':False,
            'taylorOrJerusalemUsed':False,
            'newMappingAuthorized':False}
          if receipt['exactSuppressedIds']!=manifest['exactSuppressedIds'] or receipt['exactSuppressedIds']!=executable:
              raise SystemExit('receipt == manifest == executable B equality failure')
          Path('canonical-final-publisher-v2.yml').write_bytes(final)
          Path('canonical-final-publisher-v2.sha256').write_text(sha+'\n')
          Path('v49-publisher-patch-manifest.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\n')
          Path('v49-governance-fixtures.json').write_text(json.dumps(fixtures,sort_keys=True,indent=2)+'\n')
          Path('review-receipt-v49.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          if os.environ['MODE']=='publisher':
              actual=Path(os.environ['PUBLISHER_PATH']).read_bytes()
              if actual!=final: raise SystemExit('publisher v2 byte mismatch')
          PY

      - name: Recheck actual candidate governance and protected state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set +e
          git ls-remote --exit-code --heads origin dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-ordinal-45 >/dev/null 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then echo 'ordinal45 dispatch ref exists' >&2; exit 1; fi
          test "$rc" -eq 2
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > comments-final.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/avps-v2-postconsumption-recovery4-science.yml/runs?event=workflow_dispatch&per_page=100" > science-runs.json
          python - <<'PY'
          import hashlib,json,re,textwrap
          from pathlib import Path
          C=[x for page in json.load(open('comments-final.json')) for x in page]
          consumed='ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_DISPATCH_CONSUMED'
          if any(str(c.get('body') or '').strip().startswith(consumed) for c in C): raise SystemExit('consumed marker exists')
          runs=[]
          for page in json.load(open('science-runs.json')):
              if not isinstance(page,dict): raise SystemExit('science run pagination drift')
              runs.extend(page.get('workflow_runs',[]))
          if runs: raise SystemExit('science workflow_dispatch already exists')
          pub=Path('canonical-final-publisher-v2.yml').read_text()
          m=re.findall(r'^          B=\{([0-9,]+)\}$',pub,re.M)
          if len(m)!=1: raise SystemExit('final publisher suppression ledger shape drift')
          ids=[int(x) for x in m[0].split(',') if x]
          km=re.findall(r'^\s*KNOWN_DEFECT=(\d+)\s*$',pub,re.M)
          if len(km)!=1: raise SystemExit('final publisher KNOWN_DEFECT shape drift')
          known=int(km[0])
          a=pub.index('          import re\n          B={'); b=pub.index('          def state_check():',a)
          ns={}; exec(textwrap.dedent(pub[a:b]),ns)
          executable=sorted(int(x) for x in ns['B'])
          blocker=ns['avps_governance_blocker']
          if executable!=ids: raise SystemExit('final executable B drift')
          for c in C:
              cid=int(c.get('id') or 0)
              if cid>known and cid not in executable and blocker(str(c.get('body') or '')):
                  raise SystemExit('newer unbound AVPS governance blocker '+str(cid))
          closed=set(); begins=[]
          for c in C:
              body=str(c.get('body') or '').strip(); first=body.splitlines()[0] if body else ''; fields={}
              for tok in first.replace('|',' ').split():
                  if '=' in tok:
                      k,v=tok.split('=',1); fields.setdefault(k,[]).append(v)
              if first.startswith('WRITE_QUIET_END'):
                  vals=[]
                  for key in ('begin','beginComment','begin_comment'):
                      for v in fields.get(key,[]):
                          if not v.isdigit(): raise SystemExit('non-numeric WRITE_QUIET_END alias')
                          vals.append(int(v))
                  if len(set(vals))>1: raise SystemExit('conflicting WRITE_QUIET_END aliases')
                  if vals: closed.add(vals[0])
              elif first.startswith('WRITE_QUIET_BEGIN'): begins.append(int(c['id']))
          if [x for x in begins if x not in closed]: raise SystemExit('unmatched WRITE_QUIET_BEGIN')
          manifest=json.load(open('v49-publisher-patch-manifest.json'))
          receipt=json.load(open('review-receipt-v49.json'))
