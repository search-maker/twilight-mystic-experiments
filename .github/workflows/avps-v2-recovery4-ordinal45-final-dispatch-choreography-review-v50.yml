name: Review AVPS Recovery4 ordinal45 final publisher governance v50

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v50.yml
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v2.yml

permissions: {contents: read, actions: read, issues: read, pull-requests: read}
concurrency:
  group: avps-v2-recovery4-ordinal45-final-publisher-governance-v50-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      MAIN_EXPECTED: 52cbcb69029360d938f66b79da5150bdcaed6231
      INFRA_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-infrastructure-v50
      INFRA_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v50.yml
      PUBLISHER_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v2
      PUBLISHER_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v2.yml
      V49_PR: '903'
      V49_HEAD: 1f39440559c92c7028ba6e2e99f3be825f355e80
      V49_BASE: 52cbcb69029360d938f66b79da5150bdcaed6231
      V49_TREE: d58a17e5c21b1d72efb7d3645140eb8a4b321165
      V49_BLOB: 32a2a02bd1b7c8e194d2ab2db1478dad8128fc5b
      V49_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v49.yml
      V49_RUN: '33720975782'
      V49_JOB: '100539871606'
      V49_GENERIC: '33720975626'
      V49_GENERIC_JOB: '100539871108'
      V49_ARTIFACT: '9880211336'
      V49_ARTIFACT_NAME: avps-v2-recovery4-ordinal45-final-publisher-governance-review-v49
      V49_ARTIFACT_DIGEST: sha256:b47cae5eb2e3b03cc95839bfd4751bac768a51cf66600d5340d4487c821702a0
      V49_PUBLISHER_SHA256: 111ff09ac0b5e9d63c3822c92240c89bef2bd1072297945f1bc4c1f9ebd6c451
      V49_BACKUP_DEFECT: '5521344906'
      V49_PRIMARY_DEFECT: '5521365531'
      LIVE_CUTOFF: '5521365531'
      V48_RUN: '33717218616'
      V48_ARTIFACT: '9878945380'
      V48_ARTIFACT_NAME: avps-v2-recovery4-ordinal45-final-publisher-governance-review-v48
      V48_ARTIFACT_DIGEST: sha256:a78cb2df4868e59d2fc7ddbc2798dab0cf2a6aca37fa57aea969023db6681261
      V48_PUBLISHER_SHA256: 25497f0cad3876f708025606270ddae5106ed298576a7e3bdc1543e6a3a99539
      V48_KNOWN_DEFECT: '5520079122'
      V49_KNOWN_DEFECT: '5520836467'
      V49_ADDED_IDS: 5520612269,5520658727,5520822717,5520836467
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}

      - name: Bind rejected V49 evidence and exact V48 source artifact
        id: mode
        shell: bash
        env:
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$EVENT_ACTION" = opened
          test "$EVENT_BASE" = "$MAIN_EXPECTED"
          if [ "$EVENT_BRANCH" = "$INFRA_BRANCH" ]; then
            MODE=reviewer; EXPECT_PATH="$INFRA_PATH"
          elif [ "$EVENT_BRANCH" = "$PUBLISHER_BRANCH" ]; then
            MODE=publisher; EXPECT_PATH="$PUBLISHER_PATH"
          else
            echo 'unexpected V50 branch' >&2; exit 1
          fi
          set -- $(git rev-list --parents -n1 "$EVENT_HEAD")
          test "$#" -eq 2
          test "$2" = "$MAIN_EXPECTED"
          test "$(git diff --name-status "$MAIN_EXPECTED" "$EVENT_HEAD")" = "A	$EXPECT_PATH"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

          git fetch --no-tags origin "$V49_HEAD"
          test "$(git rev-parse "$V49_HEAD^{tree}")" = "$V49_TREE"
          test "$(git rev-parse "$V49_HEAD:$V49_PATH")" = "$V49_BLOB"
          set -- $(git rev-list --parents -n1 "$V49_HEAD")
          test "$#" -eq 2
          test "$2" = "$V49_BASE"

          gh api "repos/$GITHUB_REPOSITORY/pulls/$V49_PR" > pr903.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V49_RUN" > r903.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V49_RUN/jobs?per_page=100" > j903.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V49_GENERIC" > g903.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V49_GENERIC/jobs?per_page=100" > gj903.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V49_RUN/artifacts?per_page=100" > a903.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V48_RUN/artifacts?per_page=100" > a902.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > comments.json
          python - <<'PY'
          import json,os,re
          z=lambda p:json.load(open(p))
          p=z('pr903.json')
          if p.get('state')!='closed' or p.get('merged_at') is not None or p['head']['sha']!=os.environ['V49_HEAD'] or p['base']['sha']!=os.environ['V49_BASE']:
              raise SystemExit('PR903 rejected identity drift')
          r=z('r903.json'); g=z('g903.json')
          if r['id']!=int(os.environ['V49_RUN']) or r['head_sha']!=os.environ['V49_HEAD'] or r['run_attempt']!=1 or r.get('conclusion')!='success': raise SystemExit('V49 dedicated drift')
          h=[x for x in z('j903.json').get('jobs',[]) if int(x.get('id') or 0)==int(os.environ['V49_JOB'])]
          if len(h)!=1 or h[0].get('conclusion')!='success': raise SystemExit('V49 dedicated job drift')
          if g['id']!=int(os.environ['V49_GENERIC']) or g['head_sha']!=os.environ['V49_HEAD'] or g['run_attempt']!=1 or g.get('conclusion')!='success': raise SystemExit('V49 generic drift')
          h=[x for x in z('gj903.json').get('jobs',[]) if int(x.get('id') or 0)==int(os.environ['V49_GENERIC_JOB'])]
          if len(h)!=1 or h[0].get('conclusion')!='success': raise SystemExit('V49 generic job drift')
          h=[a for a in z('a903.json').get('artifacts',[]) if int(a.get('id') or 0)==int(os.environ['V49_ARTIFACT'])]
          if len(h)!=1 or h[0].get('name')!=os.environ['V49_ARTIFACT_NAME'] or h[0].get('digest')!=os.environ['V49_ARTIFACT_DIGEST'] or h[0].get('expired') is not False:
              raise SystemExit('V49 artifact identity drift')
          h=[a for a in z('a902.json').get('artifacts',[]) if int(a.get('id') or 0)==int(os.environ['V48_ARTIFACT'])]
          if len(h)!=1 or h[0].get('name')!=os.environ['V48_ARTIFACT_NAME'] or h[0].get('digest')!=os.environ['V48_ARTIFACT_DIGEST'] or h[0].get('expired') is not False:
              raise SystemExit('V48 artifact identity drift')
          C=[x for page in z('comments.json') for x in page]
          expected={
            int(os.environ['V49_BACKUP_DEFECT']):'BACKUP_INDEPENDENT_AUDIT::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V49_PR903_PATCH_MANIFEST_DOES_NOT_DESCRIBE_V49_PATCH',
            int(os.environ['V49_PRIMARY_DEFECT']):'INDEPENDENT_AUDIT::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V49_PR903_PATCH_MANIFEST_DOES_NOT_DESCRIBE_V49_PATCH'}
          for cid,pref in expected.items():
              q=[x for x in C if int(x.get('id') or 0)==cid]
              if len(q)!=1 or not str(q[0].get('body') or '').startswith(pref): raise SystemExit('Issue60 binding '+str(cid))
              u=q[0].get('user') or {}
              if u.get('login')!='search-maker' or int(u.get('id') or 0)!=304153003 or q[0].get('author_association')!='OWNER': raise SystemExit('Issue60 author identity '+str(cid))

          cutoff=int(os.environ['LIVE_CUTOFF'])
          bound=set(expected)
          def normalized_first(body):
              s=(body or '').strip(); first=s.splitlines()[0].strip() if s else ''
              for _ in range(4):
                  old=first
                  first=re.sub(r'^(?:#{1,6}|[-*+]|>)\s*','',first).strip()
                  first=re.sub(r'^(?:\*\*|__|\*|_|`)+|(?:\*\*|__|\*|_|`)+$','',first).strip()
                  if first==old: break
              return first.upper()
          def blocking(body):
              s=(body or '').strip(); f=normalized_first(s)
              if len(s)>131072: return True
              if re.match(r'^(?:BLOCKER(?:\s|\||:|$)|STATUS\s*:\s*BLOCKER|DIRECTIVE\s*:\s*BLOCKER)',f): return True
              if re.match(r'^(?:INDEPENDENT_AUDIT::|BACKUP_INDEPENDENT_AUDIT::)?CONFIRMED_DEFECT\b',f): return True
              if re.match(r'^MATERIAL_RISK\b',f) or re.match(r'^FAIL[_-]CLOSED\b',f): return True
              if re.search(r'\bQUARANTINE_DOWNSTREAM\s*=\s*TRUE\b',f): return True
              return False
          for c in C:
              cid=int(c.get('id') or 0)
              if cid>cutoff and cid not in bound and blocking(str(c.get('body') or '')):
                  raise SystemExit('newer unbound AVPS governance blocker '+str(cid))

          closed=set(); begins=[]
          for c in C:
              body=str(c.get('body') or '').strip(); first=body.splitlines()[0] if body else ''; fields={}
              for tok in first.replace('|',' ').split():
                  if '=' in tok:
                      k,v=tok.split('=',1); fields.setdefault(k,[]).append(v)
              if first.startswith('WRITE_QUIET_END'):
                  vals=[]
                  for key in ('begin','beginComment','begin_comment'):
                      for v in fields.get(key,[]):
                          if not v.isdigit(): raise SystemExit('non-numeric WRITE_QUIET_END alias')
                          vals.append(int(v))
                  if len(set(vals))>1: raise SystemExit('conflicting WRITE_QUIET_END aliases')
                  if vals: closed.add(vals[0])
              elif first.startswith('WRITE_QUIET_BEGIN'): begins.append(int(c['id']))
          if [x for x in begins if x not in closed]: raise SystemExit('unmatched WRITE_QUIET_BEGIN')
          PY

          rm -rf v49-artifact v48-artifact
          mkdir v49-artifact v48-artifact
          gh run download "$V49_RUN" -n "$V49_ARTIFACT_NAME" -D v49-artifact
          gh run download "$V48_RUN" -n "$V48_ARTIFACT_NAME" -D v48-artifact
          test "$(sha256sum v49-artifact/canonical-final-publisher-v2.yml | awk '{print $1}')" = "$V49_PUBLISHER_SHA256"
          test "$(sha256sum v48-artifact/canonical-final-publisher-v2.yml | awk '{print $1}')" = "$V48_PUBLISHER_SHA256"

      - name: Regenerate truthful materialized V49 patch manifest only
        shell: bash
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,re,textwrap
          from pathlib import Path
          old=Path('v48-artifact/canonical-final-publisher-v2.yml').read_bytes()
          new=Path('v49-artifact/canonical-final-publisher-v2.yml').read_bytes()
          if hashlib.sha256(old).hexdigest()!=os.environ['V48_PUBLISHER_SHA256']: raise SystemExit('V48 publisher drift')
          if hashlib.sha256(new).hexdigest()!=os.environ['V49_PUBLISHER_SHA256']: raise SystemExit('V49 publisher drift')
          oldtxt=old.decode(); newtxt=new.decode()
          old_known=int(os.environ['V48_KNOWN_DEFECT']); new_known=int(os.environ['V49_KNOWN_DEFECT'])
          if new_known!=5520836467: raise SystemExit('V49 known defect identity drift')
          old_k='KNOWN_DEFECT='+str(old_known); new_k='KNOWN_DEFECT='+str(new_known)
          if oldtxt.count(old_k)!=1 or newtxt.count(new_k)!=1: raise SystemExit('KNOWN_DEFECT shape drift')
          mo=re.findall(r'^          B=\{([0-9,]+)\}$',oldtxt,re.M)
          mn=re.findall(r'^          B=\{([0-9,]+)\}$',newtxt,re.M)
          if len(mo)!=1 or len(mn)!=1: raise SystemExit('suppression ledger shape drift')
          old_ids=[int(x) for x in mo[0].split(',') if x]
          new_ids=[int(x) for x in mn[0].split(',') if x]
          if len(old_ids)!=47 or len(new_ids)!=51 or old_ids!=sorted(old_ids) or new_ids!=sorted(new_ids): raise SystemExit('ledger cardinality/order drift')
          added=[int(x) for x in os.environ['V49_ADDED_IDS'].split(',')]
          if sorted(set(new_ids)-set(old_ids))!=sorted(added) or set(old_ids)-set(new_ids): raise SystemExit('V49 ledger delta drift')
          old_b='          B={'+','.join(map(str,old_ids))+'}'
          new_b='          B={'+','.join(map(str,new_ids))+'}'
          candidate=oldtxt.replace(old_k,new_k,1).replace(old_b,new_b,1).encode()
          if candidate!=new: raise SystemExit('V48->V49 differs by more than exact two governance patches')

          patches=[
            {'id':'known-defect-cutoff','before':old_k,'after':new_k,'expectedBeforeCount':1,'expectedAfterCount':1},
            {'id':'exact-suppression-ledger','before':old_b,'after':new_b,'expectedBeforeCount':1,'expectedAfterCount':1}]
          manifest={
            'schemaVersion':2,
            'transition':'AVPS_V48_TO_V49_CANONICAL_PUBLISHER',
            'sourceArtifact':int(os.environ['V48_ARTIFACT']),
            'sourceArtifactDigest':os.environ['V48_ARTIFACT_DIGEST'],
            'sourcePublisherSha256':os.environ['V48_PUBLISHER_SHA256'],
            'correctedArtifact':int(os.environ['V49_ARTIFACT']),
            'correctedArtifactDigest':os.environ['V49_ARTIFACT_DIGEST'],
            'correctedPublisherSha256':os.environ['V49_PUBLISHER_SHA256'],
            'liveCutoff':new_known,
            'oldKnownDefect':old_known,
            'knownDefect':new_known,
            'addedExactSuppressedIds':added,
            'exactSuppressedIds':new_ids,
            'suppressionLedgerCardinality':len(new_ids),
            'patches':patches,
            'materializedManifestForwardReplayRequired':True,
            'materializedManifestReverseReplayRequired':True,
            'boundedCanonicalGovernancePatchOnly':True}
          Path('v50-publisher-patch-manifest.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\n')

          def apply(data, direction):
              txt=data.decode()
              seq=manifest['patches'] if direction=='forward' else list(reversed(manifest['patches']))
              for p in seq:
                  before=p['before'] if direction=='forward' else p['after']
                  after=p['after'] if direction=='forward' else p['before']
                  if txt.count(before)!=1: raise SystemExit(direction+' manifest literal multiplicity '+p['id'])
                  txt=txt.replace(before,after,1)
              return txt.encode()
          materialized=json.loads(Path('v50-publisher-patch-manifest.json').read_text())
          if materialized!=manifest: raise SystemExit('materialized manifest drift')
          manifest=materialized
          if apply(old,'forward')!=new: raise SystemExit('materialized manifest forward replay failed')
          if apply(new,'reverse')!=old: raise SystemExit('materialized manifest reverse replay failed')

          a=newtxt.index('          import re\n          B={'); b=newtxt.index('          def state_check():',a)
          ns={}; exec(textwrap.dedent(newtxt[a:b]),ns)
          executable=sorted(int(x) for x in ns['B'])
          if executable!=new_ids: raise SystemExit('V49 executable B drift')
          blocker=ns.get('avps_governance_blocker')
          if not callable(blocker): raise SystemExit('V49 canonical classifier missing')
          fatal=['CONFIRMED_DEFECT AVPS_TEST','MATERIAL_RISK AVPS_TEST','BLOCKER | AVPS_TEST','**BLOCKER** | AVPS_TEST','STATUS: BLOCKER | AVPS_TEST','DIRECTIVE: BLOCKER | AVPS_TEST','FAIL_CLOSED AVPS_TEST','FAIL-CLOSED AVPS_TEST','QUARANTINE_DOWNSTREAM=TRUE AVPS_TEST']
          for body in fatal:
              if not blocker(body): raise SystemExit('canonical governance fixture failed '+body)
          benign='AVPS historical note: the word blocker appears here only as incidental narrative prose.'
          if blocker(benign): raise SystemExit('incidental narrative blocker prose overblocked')

          old_receipt=json.load(open('v49-artifact/review-receipt-v49.json'))
          if old_receipt.get('exactSuppressedIds')!=new_ids: raise SystemExit('V49 receipt executable ledger drift')
          receipt=dict(old_receipt)
          receipt.update({
            'status':'PASS_AVPS_V2_RECOVERY4_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V50_ZERO_RUNTIME',
            'headSha':os.environ['EVENT_HEAD'],
            'baseSha':os.environ['EVENT_BASE'],
            'rejectedV49Head':os.environ['V49_HEAD'],
            'v49DedicatedRun':int(os.environ['V49_RUN']),
            'v49DedicatedJob':int(os.environ['V49_JOB']),
            'v49GenericRun':int(os.environ['V49_GENERIC']),
            'v49GenericJob':int(os.environ['V49_GENERIC_JOB']),
            'v49Artifact':int(os.environ['V49_ARTIFACT']),
            'v49ArtifactDigest':os.environ['V49_ARTIFACT_DIGEST'],
            'v49BackupDefect':int(os.environ['V49_BACKUP_DEFECT']),
            'v49PrimaryDefect':int(os.environ['V49_PRIMARY_DEFECT']),
            'truthfulMaterializedPatchManifestRegenerated':True,
            'materializedManifestForwardReplayExact':True,
            'materializedManifestReverseReplayExact':True,
            'canonicalPublisherBytesUnchangedFromV49':True,
            'correctedPublisherSha256':os.environ['V49_PUBLISHER_SHA256'],
            'liveCutoff':new_known,
            'exactSuppressedIds':new_ids,
            'suppressionLedgerCardinality':len(new_ids),
            'dispatchCreated':False,
            'consumedMarkerCreated':False,
            'workflowDispatchPerformed':False,
            'solverExecutionPerformed':False,
            'resultOpeningAuthorized':False,
            'levelBAdmissionAuthorized':False,
            'holdoutOpened':False,
            'productionAuthorized':False,
            'taylorOrJerusalemUsed':False,
            'newMappingAuthorized':False})
          if receipt['exactSuppressedIds']!=manifest['exactSuppressedIds'] or receipt['exactSuppressedIds']!=executable:
              raise SystemExit('receipt == manifest == executable B equality failure')
          Path('canonical-final-publisher-v2.yml').write_bytes(new)
          Path('canonical-final-publisher-v2.sha256').write_text(os.environ['V49_PUBLISHER_SHA256']+'\n')
          Path('review-receipt-v50.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          Path('v50-governance-fixtures.json').write_text(json.dumps({'schemaVersion':1,'actualCanonicalClassifierExecuted':True,'freshFatalFirstLines':fatal,'incidentalNarrativeNonblocking':benign,'canonicalPublisherBytesUnchangedFromV49':True},sort_keys=True,indent=2)+'\n')
          if os.environ['MODE']=='publisher':
              if Path(os.environ['PUBLISHER_PATH']).read_bytes()!=new: raise SystemExit('publisher v2 byte mismatch')
          PY

      - name: Recheck protected state and materialized manifest replay
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set +e
          git ls-remote --exit-code --heads origin dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-ordinal-45 >/dev/null 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then echo 'ordinal45 dispatch ref exists' >&2; exit 1; fi
          test "$rc" -eq 2
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > comments-final.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/avps-v2-postconsumption-recovery4-science.yml/runs?event=workflow_dispatch&per_page=100" > science-runs.json
          python - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          C=[x for page in json.load(open('comments-final.json')) for x in page]
          if any(str(c.get('body') or '').strip().startswith('ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_DISPATCH_CONSUMED') for c in C): raise SystemExit('consumed marker exists')
          runs=[]
          for page in json.load(open('science-runs.json')):
              if not isinstance(page,dict): raise SystemExit('science run pagination drift')
              runs.extend(page.get('workflow_runs',[]))
          if runs: raise SystemExit('science workflow_dispatch already exists')
          manifest=json.load(open('v50-publisher-patch-manifest.json'))
          receipt=json.load(open('review-receipt-v50.json'))
          pub=Path('canonical-final-publisher-v2.yml').read_bytes()
          if hashlib.sha256(pub).hexdigest()!=os.environ['V49_PUBLISHER_SHA256']: raise SystemExit('canonical V49 bytes changed')
          if receipt.get('exactSuppressedIds')!=manifest.get('exactSuppressedIds'): raise SystemExit('receipt/manifest ledger mismatch')
          if receipt.get('suppressionLedgerCardinality')!=len(receipt.get('exactSuppressedIds') or []): raise SystemExit('receipt cardinality mismatch')
          for key in ('dispatchCreated','consumedMarkerCreated','workflowDispatchPerformed','solverExecutionPerformed','resultOpeningAuthorized','levelBAdmissionAuthorized','holdoutOpened','productionAuthorized','taylorOrJerusalemUsed','newMappingAuthorized'):
              if receipt.get(key) is not False: raise SystemExit('authority flag drift '+key)

          closed=set(); begins=[]
          for c in C:
              body=str(c.get('body') or '').strip(); first=body.splitlines()[0] if body else ''; fields={}
              for tok in first.replace('|',' ').split():
                  if '=' in tok:
                      k,v=tok.split('=',1); fields.setdefault(k,[]).append(v)
              if first.startswith('WRITE_QUIET_END'):
                  vals=[]
                  for key in ('begin','beginComment','begin_comment'):
                      for v in fields.get(key,[]):
                          if not v.isdigit(): raise SystemExit('non-numeric WRITE_QUIET_END alias')
                          vals.append(int(v))
                  if len(set(vals))>1: raise SystemExit('conflicting WRITE_QUIET_END aliases')
                  if vals: closed.add(vals[0])
              elif first.startswith('WRITE_QUIET_BEGIN'): begins.append(int(c['id']))
          if [x for x in begins if x not in closed]: raise SystemExit('unmatched WRITE_QUIET_BEGIN')

          cutoff=int(os.environ['LIVE_CUTOFF'])
          bound={int(os.environ['V49_BACKUP_DEFECT']),int(os.environ['V49_PRIMARY_DEFECT'])}
          def norm(body):
              s=(body or '').strip(); f=s.splitlines()[0].strip() if s else ''
              for _ in range(4):
                  old=f; f=re.sub(r'^(?:#{1,6}|[-*+]|>)\s*','',f).strip(); f=re.sub(r'^(?:\*\*|__|\*|_|`)+|(?:\*\*|__|\*|_|`)+$','',f).strip()
                  if f==old: break
              return f.upper()
          def blocking(body):
              s=(body or '').strip(); f=norm(s)
