name: Review AVPS Recovery4 ordinal45 final publisher governance v51

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v51.yml
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v2.yml

permissions: {contents: read, actions: read, issues: read, pull-requests: read}
concurrency:
  group: avps-v2-recovery4-ordinal45-final-publisher-governance-v51-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      MAIN_EXPECTED: 52cbcb69029360d938f66b79da5150bdcaed6231
      INFRA_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-infrastructure-v51
      INFRA_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v51.yml
      PUBLISHER_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v2
      PUBLISHER_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v2.yml
      V50_PR: '904'
      V50_HEAD: 78d8b78323a9e4767c1db02b337434bb87e5bea7
      V50_BASE: 52cbcb69029360d938f66b79da5150bdcaed6231
      V50_TREE: 4d57b8df196629ef6748b39ceee60f20c75f50a8
      V50_BLOB: 65d621b63fd6e3c8d9fd25c51d6f0e1d7031e0b2
      V50_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v50.yml
      V50_RUN: '33722812438'
      V50_JOB: '100545332967'
      V50_GENERIC: '33722812354'
      V50_GENERIC_JOB: '100545332810'
      V50_ARTIFACT: '9880841232'
      V50_ARTIFACT_NAME: avps-v2-recovery4-ordinal45-final-publisher-governance-review-v50
      V50_ARTIFACT_DIGEST: sha256:4a8a1cafc573ac7815707933d09480cb4bf3bda0cfc5b6d4364b59616db17f14
      V50_PUBLISHER_SHA256: 111ff09ac0b5e9d63c3822c92240c89bef2bd1072297945f1bc4c1f9ebd6c451
      V51_PUBLISHER_SHA256_EXPECTED: fa48facb7bd39021d9545d534dba474bcc6206d5b243722f9c84054bf32f25c6
      V49_BACKUP_DEFECT: '5521344906'
      V49_PRIMARY_DEFECT: '5521365531'
      V50_PRIMARY_DEFECT: '5522010191'
      OLD_KNOWN_DEFECT: '5520836467'
      NEW_KNOWN_DEFECT: '5522010191'
      ADDED_IDS: 5521344906,5521365531,5522010191
      LIVE_CUTOFF: '5522010191'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}

      - name: Bind rejected V50 evidence and exact source artifact
        id: mode
        shell: bash
        env:
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$EVENT_ACTION" = opened
          test "$EVENT_BASE" = "$MAIN_EXPECTED"
          if [ "$EVENT_BRANCH" = "$INFRA_BRANCH" ]; then
            MODE=reviewer; EXPECT_PATH="$INFRA_PATH"
          elif [ "$EVENT_BRANCH" = "$PUBLISHER_BRANCH" ]; then
            MODE=publisher; EXPECT_PATH="$PUBLISHER_PATH"
          else
            echo 'unexpected V51 branch' >&2; exit 1
          fi
          set -- $(git rev-list --parents -n1 "$EVENT_HEAD")
          test "$#" -eq 2
          test "$2" = "$MAIN_EXPECTED"
          test "$(git diff --name-status "$MAIN_EXPECTED" "$EVENT_HEAD")" = "A	$EXPECT_PATH"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

          git fetch --no-tags origin "$V50_HEAD"
          test "$(git rev-parse "$V50_HEAD^{tree}")" = "$V50_TREE"
          test "$(git rev-parse "$V50_HEAD:$V50_PATH")" = "$V50_BLOB"
          set -- $(git rev-list --parents -n1 "$V50_HEAD")
          test "$#" -eq 2
          test "$2" = "$V50_BASE"

          gh api "repos/$GITHUB_REPOSITORY/pulls/$V50_PR" > pr904.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V50_RUN" > r904.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V50_RUN/jobs?per_page=100" > j904.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V50_GENERIC" > g904.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V50_GENERIC/jobs?per_page=100" > gj904.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V50_RUN/artifacts?per_page=100" > a904.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > comments.json
          python - <<'PY'
          import json,os,re
          z=lambda p:json.load(open(p))
          p=z('pr904.json')
          if p.get('state')!='closed' or p.get('merged_at') is not None or p['head']['sha']!=os.environ['V50_HEAD'] or p['base']['sha']!=os.environ['V50_BASE']:
              raise SystemExit('PR904 rejected identity drift')
          r=z('r904.json'); g=z('g904.json')
          if r['id']!=int(os.environ['V50_RUN']) or r['head_sha']!=os.environ['V50_HEAD'] or r['run_attempt']!=1 or r.get('conclusion')!='success': raise SystemExit('V50 dedicated drift')
          h=[x for x in z('j904.json').get('jobs',[]) if int(x.get('id') or 0)==int(os.environ['V50_JOB'])]
          if len(h)!=1 or h[0].get('conclusion')!='success': raise SystemExit('V50 dedicated job drift')
          if g['id']!=int(os.environ['V50_GENERIC']) or g['head_sha']!=os.environ['V50_HEAD'] or g['run_attempt']!=1 or g.get('conclusion')!='success': raise SystemExit('V50 generic drift')
          h=[x for x in z('gj904.json').get('jobs',[]) if int(x.get('id') or 0)==int(os.environ['V50_GENERIC_JOB'])]
          if len(h)!=1 or h[0].get('conclusion')!='success': raise SystemExit('V50 generic job drift')
          h=[a for a in z('a904.json').get('artifacts',[]) if int(a.get('id') or 0)==int(os.environ['V50_ARTIFACT'])]
          if len(h)!=1 or h[0].get('name')!=os.environ['V50_ARTIFACT_NAME'] or h[0].get('digest')!=os.environ['V50_ARTIFACT_DIGEST'] or h[0].get('expired') is not False:
              raise SystemExit('V50 artifact identity drift')
          C=[x for page in z('comments.json') for x in page]
          expected={
            int(os.environ['V49_BACKUP_DEFECT']):'BACKUP_INDEPENDENT_AUDIT::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V49_PR903_PATCH_MANIFEST_DOES_NOT_DESCRIBE_V49_PATCH',
            int(os.environ['V49_PRIMARY_DEFECT']):'INDEPENDENT_AUDIT::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V49_PR903_PATCH_MANIFEST_DOES_NOT_DESCRIBE_V49_PATCH',
            int(os.environ['V50_PRIMARY_DEFECT']):'INDEPENDENT_AUDIT::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V50_PR904_CANONICAL_PUBLISHER_SELF_BLOCKS_ON_BOUND_V49_DEFECTS'}
          for cid,pref in expected.items():
              q=[x for x in C if int(x.get('id') or 0)==cid]
              if len(q)!=1 or not str(q[0].get('body') or '').startswith(pref): raise SystemExit('Issue60 binding '+str(cid))
              u=q[0].get('user') or {}
              if u.get('login')!='search-maker' or int(u.get('id') or 0)!=304153003 or q[0].get('author_association')!='OWNER': raise SystemExit('Issue60 author identity '+str(cid))
          cutoff=int(os.environ['LIVE_CUTOFF'])
          bound=set(expected)
          def normalized_first(body):
              s=(body or '').strip(); first=s.splitlines()[0].strip() if s else ''
              for _ in range(4):
                  old=first
                  first=re.sub(r'^(?:#{1,6}|[-*+]|>)\s*','',first).strip()
                  first=re.sub(r'^(?:\*\*|__|\*|_|`)+|(?:\*\*|__|\*|_|`)+$','',first).strip()
                  if first==old: break
              return first.upper()
          def blocking(body):
              s=(body or '').strip(); f=normalized_first(s)
              if len(s)>131072: return True
              if re.match(r'^(?:BLOCKER(?:\s|\||:|$)|STATUS\s*:\s*BLOCKER|DIRECTIVE\s*:\s*BLOCKER)',f): return True
              if re.match(r'^(?:INDEPENDENT_AUDIT::|BACKUP_INDEPENDENT_AUDIT::)?CONFIRMED_DEFECT\b',f): return True
              if re.match(r'^MATERIAL_RISK\b',f) or re.match(r'^FAIL[_-]CLOSED\b',f): return True
              if re.search(r'\bQUARANTINE_DOWNSTREAM\s*=\s*TRUE\b',f): return True
              return False
          for c in C:
              cid=int(c.get('id') or 0)
              if cid>cutoff and cid not in bound and blocking(str(c.get('body') or '')):
                  raise SystemExit('newer unbound AVPS governance blocker '+str(cid))
          closed=set(); begins=[]
          for c in C:
              body=str(c.get('body') or '').strip(); first=body.splitlines()[0] if body else ''; fields={}
              for tok in first.replace('|',' ').split():
                  if '=' in tok:
                      k,v=tok.split('=',1); fields.setdefault(k,[]).append(v)
              if first.startswith('WRITE_QUIET_END'):
                  vals=[]
                  for key in ('begin','beginComment','begin_comment'):
                      for v in fields.get(key,[]):
                          if not v.isdigit(): raise SystemExit('non-numeric WRITE_QUIET_END alias')
                          vals.append(int(v))
                  if len(set(vals))>1: raise SystemExit('conflicting WRITE_QUIET_END aliases')
                  if vals: closed.add(vals[0])
              elif first.startswith('WRITE_QUIET_BEGIN'): begins.append(int(c['id']))
          if [x for x in begins if x not in closed]: raise SystemExit('unmatched WRITE_QUIET_BEGIN')
          PY

          rm -rf v50-artifact
          mkdir v50-artifact
          gh run download "$V50_RUN" -n "$V50_ARTIFACT_NAME" -D v50-artifact
          test "$(sha256sum v50-artifact/canonical-final-publisher-v2.yml | awk '{print $1}')" = "$V50_PUBLISHER_SHA256"

      - name: Advance canonical own governance ledger only
        shell: bash
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,re,textwrap
          from pathlib import Path
          old=Path('v50-artifact/canonical-final-publisher-v2.yml').read_bytes()
          if hashlib.sha256(old).hexdigest()!=os.environ['V50_PUBLISHER_SHA256']: raise SystemExit('V50 publisher drift')
          oldtxt=old.decode()
          old_known=int(os.environ['OLD_KNOWN_DEFECT']); new_known=int(os.environ['NEW_KNOWN_DEFECT'])
          if old_known!=5520836467 or new_known!=int(os.environ['V50_PRIMARY_DEFECT']): raise SystemExit('known defect identity drift')
          old_k='KNOWN_DEFECT='+str(old_known); new_k='KNOWN_DEFECT='+str(new_known)
          if oldtxt.count(old_k)!=1: raise SystemExit('old KNOWN_DEFECT shape drift')
          mo=re.findall(r'^          B=\{([0-9,]+)\}$',oldtxt,re.M)
          if len(mo)!=1: raise SystemExit('old suppression ledger shape drift')
          old_ids=[int(x) for x in mo[0].split(',') if x]
          if len(old_ids)!=51 or old_ids!=sorted(old_ids) or len(set(old_ids))!=51: raise SystemExit('V50 ledger cardinality/order drift')
          source_receipt=json.load(open('v50-artifact/review-receipt-v50.json'))
          source_manifest=json.load(open('v50-artifact/v50-publisher-patch-manifest.json'))
          if source_receipt.get('exactSuppressedIds')!=old_ids or source_manifest.get('exactSuppressedIds')!=old_ids:
              raise SystemExit('V50 source receipt/manifest/executable ledger drift')
          added=[int(x) for x in os.environ['ADDED_IDS'].split(',')]
          if added!=[int(os.environ['V49_BACKUP_DEFECT']),int(os.environ['V49_PRIMARY_DEFECT']),int(os.environ['V50_PRIMARY_DEFECT'])]:
              raise SystemExit('V51 added-ID identity drift')
          if any(x in old_ids for x in added): raise SystemExit('V51 added ID already suppressed')
          new_ids=sorted(old_ids+added)
          if len(new_ids)!=54 or len(set(new_ids))!=54: raise SystemExit('V51 final ledger cardinality drift')
          old_b='          B={'+','.join(map(str,old_ids))+'}'
          new_b='          B={'+','.join(map(str,new_ids))+'}'
          newtxt=oldtxt.replace(old_k,new_k,1).replace(old_b,new_b,1)
          if newtxt==oldtxt: raise SystemExit('V51 patch unexpectedly empty')
          new=newtxt.encode()
          new_sha=hashlib.sha256(new).hexdigest()
          if new_sha!=os.environ['V51_PUBLISHER_SHA256_EXPECTED']: raise SystemExit('V51 canonical SHA drift '+new_sha)
          reverse=newtxt.replace(new_k,old_k,1).replace(new_b,old_b,1).encode()
          if reverse!=old: raise SystemExit('V51 bounded reverse equivalence failed')
          patches=[
            {'id':'canonical-known-defect-cutoff','before':old_k,'after':new_k,'expectedBeforeCount':1,'expectedAfterCount':1},
            {'id':'canonical-exact-suppression-ledger','before':old_b,'after':new_b,'expectedBeforeCount':1,'expectedAfterCount':1}]
          manifest={
            'schemaVersion':2,
            'transition':'AVPS_V50_TO_V51_CANONICAL_PUBLISHER',
            'sourceArtifact':int(os.environ['V50_ARTIFACT']),
            'sourceArtifactDigest':os.environ['V50_ARTIFACT_DIGEST'],
            'sourcePublisherSha256':os.environ['V50_PUBLISHER_SHA256'],
            'correctedPublisherSha256':new_sha,
            'liveCutoff':new_known,
            'oldKnownDefect':old_known,
            'knownDefect':new_known,
            'addedExactSuppressedIds':added,
            'exactSuppressedIds':new_ids,
            'suppressionLedgerCardinality':len(new_ids),
            'patches':patches,
            'materializedManifestForwardReplayRequired':True,
            'materializedManifestReverseReplayRequired':True,
            'boundedCanonicalGovernancePatchOnly':True}
          Path('v51-publisher-patch-manifest.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\n')
          materialized=json.loads(Path('v51-publisher-patch-manifest.json').read_text())
          if materialized!=manifest: raise SystemExit('materialized V51 manifest drift')
          def apply(data,direction):
              txt=data.decode(); seq=materialized['patches'] if direction=='forward' else list(reversed(materialized['patches']))
              for p in seq:
                  before=p['before'] if direction=='forward' else p['after']
                  after=p['after'] if direction=='forward' else p['before']
                  if txt.count(before)!=1: raise SystemExit(direction+' manifest multiplicity '+p['id'])
                  txt=txt.replace(before,after,1)
              return txt.encode()
          if apply(old,'forward')!=new: raise SystemExit('V51 materialized forward replay failed')
          if apply(new,'reverse')!=old: raise SystemExit('V51 materialized reverse replay failed')

          a=newtxt.index('          import re\n          B={'); b=newtxt.index('          def state_check():',a)
          ns={}; exec(textwrap.dedent(newtxt[a:b]),ns)
          executable=sorted(int(x) for x in ns['B'])
          if executable!=new_ids: raise SystemExit('V51 executable B drift')
          blocker=ns.get('avps_governance_blocker')
          if not callable(blocker): raise SystemExit('V51 canonical classifier missing')
          comments=[x for page in json.load(open('comments.json')) for x in page]
          for cid in added:
              q=[x for x in comments if int(x.get('id') or 0)==cid]
              if len(q)!=1: raise SystemExit('bound defect cardinality '+str(cid))
              body=str(q[0].get('body') or '')
              if not blocker(body,None): raise SystemExit('bound defect is not intrinsically blocking '+str(cid))
              if blocker(body,cid): raise SystemExit('exact-ID suppression failed '+str(cid))
              if not blocker(body,new_known+1000000+cid%997): raise SystemExit('nonmatching-ID suppression leak '+str(cid))
          fatal=['CONFIRMED_DEFECT AVPS_TEST','MATERIAL_RISK AVPS_TEST','BLOCKER | AVPS_TEST','**BLOCKER** | AVPS_TEST','STATUS: BLOCKER | AVPS_TEST','DIRECTIVE: BLOCKER | AVPS_TEST','FAIL_CLOSED AVPS_TEST','FAIL-CLOSED AVPS_TEST','QUARANTINE_DOWNSTREAM=TRUE AVPS_TEST']
          for body in fatal:
              if not blocker(body,new_known+1): raise SystemExit('fresh unbound governance fixture failed '+body)
          benign='AVPS historical note: the word blocker appears here only as incidental narrative prose.'
          if blocker(benign,new_known+1): raise SystemExit('incidental narrative blocker prose overblocked')

          receipt=dict(source_receipt)
          receipt.update({
            'status':'PASS_AVPS_V2_RECOVERY4_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V51_ZERO_RUNTIME',
            'headSha':os.environ['EVENT_HEAD'],
            'baseSha':os.environ['EVENT_BASE'],
            'rejectedV50Head':os.environ['V50_HEAD'],
            'v50DedicatedRun':int(os.environ['V50_RUN']),
            'v50DedicatedJob':int(os.environ['V50_JOB']),
            'v50GenericRun':int(os.environ['V50_GENERIC']),
            'v50GenericJob':int(os.environ['V50_GENERIC_JOB']),
            'v50Artifact':int(os.environ['V50_ARTIFACT']),
            'v50ArtifactDigest':os.environ['V50_ARTIFACT_DIGEST'],
            'v50PrimaryDefect':int(os.environ['V50_PRIMARY_DEFECT']),
            'v49BackupDefect':int(os.environ['V49_BACKUP_DEFECT']),
            'v49PrimaryDefect':int(os.environ['V49_PRIMARY_DEFECT']),
            'sourcePublisherSha256':os.environ['V50_PUBLISHER_SHA256'],
            'correctedPublisherSha256':new_sha,
            'canonicalPublisherGovernanceLedgerAdvanced':True,
            'canonicalNotDeadOnArrivalAgainstBoundLedger':True,
            'materializedManifestForwardReplayExact':True,
            'materializedManifestReverseReplayExact':True,
            'runtimeScienceControlsPreservedByExactReversePatch':True,
            'v46DispatchRefRcSemanticsPreservedByExactReversePatch':True,
            'liveCutoff':new_known,
            'exactSuppressedIds':new_ids,
            'suppressionLedgerCardinality':len(new_ids),
            'dispatchCreated':False,
            'consumedMarkerCreated':False,
            'workflowDispatchPerformed':False,
            'solverExecutionPerformed':False,
            'resultOpeningAuthorized':False,
            'levelBAdmissionAuthorized':False,
            'holdoutOpened':False,
            'productionAuthorized':False,
            'taylorOrJerusalemUsed':False,
            'newMappingAuthorized':False})
          if receipt['exactSuppressedIds']!=manifest['exactSuppressedIds'] or receipt['exactSuppressedIds']!=executable:
              raise SystemExit('V51 receipt == manifest == executable B equality failure')
          Path('canonical-final-publisher-v2.yml').write_bytes(new)
          Path('canonical-final-publisher-v2.sha256').write_text(new_sha+'\n')
          Path('review-receipt-v51.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          Path('v51-governance-fixtures.json').write_text(json.dumps({'schemaVersion':1,'actualCanonicalClassifierExecuted':True,'boundDefectIds':added,'freshFatalFirstLines':fatal,'incidentalNarrativeNonblocking':benign,'exactIdSuppressionOnly':True},sort_keys=True,indent=2)+'\n')
          if os.environ['MODE']=='publisher' and Path(os.environ['PUBLISHER_PATH']).read_bytes()!=new:
              raise SystemExit('publisher v2 byte mismatch')
          PY

      - name: Recheck protected state and V51 canonical ledger
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set +e
          git ls-remote --exit-code --heads origin dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-ordinal-45 >/dev/null 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then echo 'ordinal45 dispatch ref exists' >&2; exit 1; fi
          test "$rc" -eq 2
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > comments-final.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/avps-v2-postconsumption-recovery4-science.yml/runs?event=workflow_dispatch&per_page=100" > science-runs.json
          python - <<'PY'
          import hashlib,json,os,re,textwrap
          from pathlib import Path
          C=[x for page in json.load(open('comments-final.json')) for x in page]
          if any(str(c.get('body') or '').strip().startswith('ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_DISPATCH_CONSUMED') for c in C): raise SystemExit('consumed marker exists')
          runs=[]
          for page in json.load(open('science-runs.json')):
              if not isinstance(page,dict): raise SystemExit('science run pagination drift')
              runs.extend(page.get('workflow_runs',[]))
          if runs: raise SystemExit('science workflow_dispatch already exists')
          manifest=json.load(open('v51-publisher-patch-manifest.json'))
          receipt=json.load(open('review-receipt-v51.json'))
          pub=Path('canonical-final-publisher-v2.yml').read_bytes()
          if hashlib.sha256(pub).hexdigest()!=os.environ['V51_PUBLISHER_SHA256_EXPECTED']: raise SystemExit('canonical V51 SHA drift')
          if receipt.get('exactSuppressedIds')!=manifest.get('exactSuppressedIds'): raise SystemExit('V51 receipt/manifest ledger mismatch')
          if receipt.get('suppressionLedgerCardinality')!=54: raise SystemExit('V51 receipt cardinality mismatch')
          for key in ('dispatchCreated','consumedMarkerCreated','workflowDispatchPerformed','solverExecutionPerformed','resultOpeningAuthorized','levelBAdmissionAuthorized','holdoutOpened','productionAuthorized','taylorOrJerusalemUsed','newMappingAuthorized'):
              if receipt.get(key) is not False: raise SystemExit('authority flag drift '+key)
          closed=set(); begins=[]
          for c in C:
              body=str(c.get('body') or '').strip(); first=body.splitlines()[0] if body else ''; fields={}
              for tok in first.replace('|',' ').split():
                  if '=' in tok:
                      k,v=tok.split('=',1); fields.setdefault(k,[]).append(v)
              if first.startswith('WRITE_QUIET_END'):
                  vals=[]
                  for key in ('begin','beginComment','begin_comment'):
                      for v in fields.get(key,[]):
                          if not v.isdigit(): raise SystemExit('non-numeric WRITE_QUIET_END alias')
                          vals.append(int(v))
                  if len(set(vals))>1: raise SystemExit('conflicting WRITE_QUIET_END aliases')
                  if vals: closed.add(vals[0])
              elif first.startswith('WRITE_QUIET_BEGIN'): begins.append(int(c['id']))
          if [x for x in begins if x not in closed]: raise SystemExit('unmatched WRITE_QUIET_BEGIN')
          txt=pub.decode(); a=txt.index('          import re\n          B={'); b=txt.index('          def state_check():',a)
          ns={}; exec(textwrap.dedent(txt[a:b]),ns)
          blocker=ns['avps_governance_blocker']; B=set(int(x) for x in ns['B'])
          if sorted(B)!=manifest['exactSuppressedIds']: raise SystemExit('final executable B drift')
          cutoff=int(os.environ['LIVE_CUTOFF'])
          for c in C:
              cid=int(c.get('id') or 0)
              if cid>cutoff and blocker(str(c.get('body') or ''),cid): raise SystemExit('newer unbound AVPS governance blocker '+str(cid))
