name: Review AVPS Recovery4 ordinal45 final publisher governance v52

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v52.yml
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v2.yml

permissions: {contents: read, actions: read, issues: read, pull-requests: read}
concurrency:
  group: avps-v2-recovery4-ordinal45-final-publisher-governance-v52-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      MAIN_EXPECTED: 52cbcb69029360d938f66b79da5150bdcaed6231
      INFRA_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-infrastructure-v52
      INFRA_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v52.yml
      PUBLISHER_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v2
      PUBLISHER_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v2.yml

      V51_PR: '905'
      V51_HEAD: 7f4a1bec550083ff25524ef4cad61e2cb75a3560
      V51_BASE: 52cbcb69029360d938f66b79da5150bdcaed6231
      V51_TREE: 9783f770637fc21f501636d06d5c420046783b71
      V51_BLOB: b011ec6cf01b5352c82161584641f3cbe6c8b8a2
      V51_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v51.yml
      V51_RUN: '33732253150'
      V51_JOB: '100574652014'
      V51_GENERIC: '33732253136'
      V51_GENERIC_JOB: '100574652365'
      V51_ARTIFACT: '9884307308'
      V51_ARTIFACT_NAME: avps-v2-recovery4-ordinal45-final-publisher-governance-review-v51
      V51_ARTIFACT_DIGEST: sha256:d10e8a3df0f3e11f7959c32abdd4e3e273389c8a649f0b7d8906556ee548bdd0

      V50_PUBLISHER_SHA256: 111ff09ac0b5e9d63c3822c92240c89bef2bd1072297945f1bc4c1f9ebd6c451
      V51_PUBLISHER_SHA256: fa48facb7bd39021d9545d534dba474bcc6206d5b243722f9c84054bf32f25c6
      V49_BACKUP_DEFECT: '5521344906'
      V49_PRIMARY_DEFECT: '5521365531'
      V50_PRIMARY_DEFECT: '5522010191'
      V51_BACKUP_DEFECT: '5522870555'
      V51_PRIMARY_DEFECT: '5522885559'
      LIVE_CUTOFF: '5522885559'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}

      - name: Bind rejected V51 evidence and exact immutable artifact
        id: mode
        shell: bash
        env:
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$EVENT_ACTION" = opened
          test "$EVENT_BASE" = "$MAIN_EXPECTED"
          if [ "$EVENT_BRANCH" = "$INFRA_BRANCH" ]; then
            MODE=reviewer; EXPECT_PATH="$INFRA_PATH"
          elif [ "$EVENT_BRANCH" = "$PUBLISHER_BRANCH" ]; then
            MODE=publisher; EXPECT_PATH="$PUBLISHER_PATH"
          else
            echo 'unexpected V52 branch' >&2; exit 1
          fi
          set -- $(git rev-list --parents -n1 "$EVENT_HEAD")
          test "$#" -eq 2
          test "$2" = "$MAIN_EXPECTED"
          test "$(git diff --name-status "$MAIN_EXPECTED" "$EVENT_HEAD")" = "A	$EXPECT_PATH"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

          git fetch --no-tags origin "$V51_HEAD"
          test "$(git rev-parse "$V51_HEAD^{tree}")" = "$V51_TREE"
          test "$(git rev-parse "$V51_HEAD:$V51_PATH")" = "$V51_BLOB"
          set -- $(git rev-list --parents -n1 "$V51_HEAD")
          test "$#" -eq 2
          test "$2" = "$V51_BASE"

          gh api "repos/$GITHUB_REPOSITORY/pulls/$V51_PR" > pr905.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V51_RUN" > r905.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V51_RUN/jobs?per_page=100" > j905.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V51_GENERIC" > g905.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V51_GENERIC/jobs?per_page=100" > gj905.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V51_RUN/artifacts?per_page=100" > a905.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > comments.json

          python - <<'PY'
          import json,os,re
          z=lambda p:json.load(open(p))
          p=z('pr905.json')
          if p.get('state')!='closed' or p.get('merged_at') is not None or p['head']['sha']!=os.environ['V51_HEAD'] or p['base']['sha']!=os.environ['V51_BASE']:
              raise SystemExit('PR905 rejected identity drift')
          r=z('r905.json'); g=z('g905.json')
          if r['id']!=int(os.environ['V51_RUN']) or r['head_sha']!=os.environ['V51_HEAD'] or r['run_attempt']!=1 or r.get('conclusion')!='success':
              raise SystemExit('V51 dedicated drift')
          h=[x for x in z('j905.json').get('jobs',[]) if int(x.get('id') or 0)==int(os.environ['V51_JOB'])]
          if len(h)!=1 or h[0].get('conclusion')!='success': raise SystemExit('V51 dedicated job drift')
          if g['id']!=int(os.environ['V51_GENERIC']) or g['head_sha']!=os.environ['V51_HEAD'] or g['run_attempt']!=1 or g.get('conclusion')!='success':
              raise SystemExit('V51 generic drift')
          h=[x for x in z('gj905.json').get('jobs',[]) if int(x.get('id') or 0)==int(os.environ['V51_GENERIC_JOB'])]
          if len(h)!=1 or h[0].get('conclusion')!='success': raise SystemExit('V51 generic job drift')
          h=[a for a in z('a905.json').get('artifacts',[]) if int(a.get('id') or 0)==int(os.environ['V51_ARTIFACT'])]
          if len(h)!=1 or h[0].get('name')!=os.environ['V51_ARTIFACT_NAME'] or h[0].get('digest')!=os.environ['V51_ARTIFACT_DIGEST'] or h[0].get('expired') is not False:
              raise SystemExit('V51 artifact identity drift')

          C=[x for page in z('comments.json') for x in page]
          expected={
            int(os.environ['V51_BACKUP_DEFECT']):'BACKUP_INDEPENDENT_AUDIT::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V51_PR905_REVIEW_RECEIPT_STALE_CANONICAL_BYTES_UNCHANGED_FROM_V49_ASSERTION',
            int(os.environ['V51_PRIMARY_DEFECT']):'INDEPENDENT_AUDIT::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V51_PR905_REVIEW_RECEIPT_STALE_CANONICAL_BYTES_UNCHANGED_FROM_V49_ASSERTION'}
          for cid,pref in expected.items():
              q=[x for x in C if int(x.get('id') or 0)==cid]
              if len(q)!=1 or not str(q[0].get('body') or '').startswith(pref):
                  raise SystemExit('Issue60 V51 defect binding '+str(cid))
              u=q[0].get('user') or {}
              if u.get('login')!='search-maker' or int(u.get('id') or 0)!=304153003 or q[0].get('author_association')!='OWNER':
                  raise SystemExit('Issue60 author identity '+str(cid))

          cutoff=int(os.environ['LIVE_CUTOFF'])
          def normalized_first(body):
              s=(body or '').strip(); first=s.splitlines()[0].strip() if s else ''
              for _ in range(4):
                  old=first
                  first=re.sub(r'^(?:#{1,6}|[-*+]|>)\s*','',first).strip()
                  first=re.sub(r'^(?:\*\*|__|\*|_|`)+|(?:\*\*|__|\*|_|`)+$','',first).strip()
                  if first==old: break
              return first.upper()
          def blocking(body):
              s=(body or '').strip(); f=normalized_first(s)
              if len(s)>131072: return True
              if re.match(r'^(?:BLOCKER(?:\s|\||:|$)|STATUS\s*:\s*BLOCKER|DIRECTIVE\s*:\s*BLOCKER)',f): return True
              if re.match(r'^(?:INDEPENDENT_AUDIT::|BACKUP_INDEPENDENT_AUDIT::)?CONFIRMED_DEFECT\b',f): return True
              if re.match(r'^MATERIAL_RISK\b',f) or re.match(r'^FAIL[_-]CLOSED\b',f): return True
              if re.search(r'\bQUARANTINE_DOWNSTREAM\s*=\s*TRUE\b',f): return True
              return False
          for c in C:
              cid=int(c.get('id') or 0)
              if cid>cutoff and blocking(str(c.get('body') or '')):
                  raise SystemExit('newer unbound AVPS governance blocker '+str(cid))

          closed=set(); begins=[]
          for c in C:
              body=str(c.get('body') or '').strip(); first=body.splitlines()[0] if body else ''; fields={}
              for tok in first.replace('|',' ').split():
                  if '=' in tok:
                      k,v=tok.split('=',1); fields.setdefault(k,[]).append(v)
              if first.startswith('WRITE_QUIET_END'):
                  vals=[]
                  for key in ('begin','beginComment','begin_comment'):
                      for v in fields.get(key,[]):
                          if not v.isdigit(): raise SystemExit('non-numeric WRITE_QUIET_END alias')
                          vals.append(int(v))
                  if len(set(vals))>1: raise SystemExit('conflicting WRITE_QUIET_END aliases')
                  if vals: closed.add(vals[0])
              elif first.startswith('WRITE_QUIET_BEGIN'): begins.append(int(c['id']))
          if [x for x in begins if x not in closed]: raise SystemExit('unmatched WRITE_QUIET_BEGIN')
          PY

          rm -rf v51-artifact
          mkdir v51-artifact
          gh run download "$V51_RUN" -n "$V51_ARTIFACT_NAME" -D v51-artifact
          test "$(sha256sum v51-artifact/canonical-final-publisher-v2.yml | awk '{print $1}')" = "$V51_PUBLISHER_SHA256"
          test "$(tr -d '\r\n' < v51-artifact/canonical-final-publisher-v2.sha256)" = "$V51_PUBLISHER_SHA256"

      - name: Regenerate truthful receipt only, preserving V51 canonical bytes
        shell: bash
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,re,textwrap
          from pathlib import Path

          source_receipt=json.load(open('v51-artifact/review-receipt-v51.json'))
          source_manifest=json.load(open('v51-artifact/v51-publisher-patch-manifest.json'))
          pub=Path('v51-artifact/canonical-final-publisher-v2.yml').read_bytes()
          pub_sha=hashlib.sha256(pub).hexdigest()
          if pub_sha!=os.environ['V51_PUBLISHER_SHA256']: raise SystemExit('V51 canonical publisher drift')
          if source_manifest.get('sourcePublisherSha256')!=os.environ['V50_PUBLISHER_SHA256']:
              raise SystemExit('V51 manifest source SHA semantics drift')
          if source_manifest.get('correctedPublisherSha256')!=os.environ['V51_PUBLISHER_SHA256']:
              raise SystemExit('V51 manifest corrected SHA semantics drift')
          if source_receipt.get('sourcePublisherSha256')!=os.environ['V50_PUBLISHER_SHA256']:
              raise SystemExit('V51 receipt source SHA semantics drift')
          if source_receipt.get('correctedPublisherSha256')!=os.environ['V51_PUBLISHER_SHA256']:
              raise SystemExit('V51 receipt corrected SHA semantics drift')
          if source_receipt.get('canonicalPublisherBytesUnchangedFromV49') is not True:
              raise SystemExit('V51 stale assertion defect not reproduced exactly')

          txt=pub.decode()
          if txt.count('KNOWN_DEFECT=5522010191')!=1: raise SystemExit('V51 canonical known-defect cutoff drift')
          mo=re.findall(r'^          B=\{([0-9,]+)\}$',txt,re.M)
          if len(mo)!=1: raise SystemExit('V51 executable suppression ledger shape drift')
          executable_ids=[int(x) for x in mo[0].split(',') if x]
          if len(executable_ids)!=54 or executable_ids!=sorted(executable_ids) or len(set(executable_ids))!=54:
              raise SystemExit('V51 executable suppression ledger cardinality/order drift')
          if source_manifest.get('exactSuppressedIds')!=executable_ids or source_receipt.get('exactSuppressedIds')!=executable_ids:
              raise SystemExit('V51 receipt/manifest/executable B mismatch')
          for required in (int(os.environ['V49_BACKUP_DEFECT']),int(os.environ['V49_PRIMARY_DEFECT']),int(os.environ['V50_PRIMARY_DEFECT'])):
              if required not in executable_ids: raise SystemExit('V51 canonical bound predecessor missing '+str(required))

          a=txt.index('          import re\n          B={'); b=txt.index('          def state_check():',a)
          ns={}; exec(textwrap.dedent(txt[a:b]),ns)
          blocker=ns.get('avps_governance_blocker')
          if not callable(blocker): raise SystemExit('V51 canonical classifier missing')
          fatal=['CONFIRMED_DEFECT AVPS_TEST','MATERIAL_RISK AVPS_TEST','BLOCKER | AVPS_TEST','**BLOCKER** | AVPS_TEST','STATUS: BLOCKER | AVPS_TEST','DIRECTIVE: BLOCKER | AVPS_TEST','FAIL_CLOSED AVPS_TEST','FAIL-CLOSED AVPS_TEST','QUARANTINE_DOWNSTREAM=TRUE AVPS_TEST']
          for body in fatal:
              if not blocker(body,int(os.environ['V51_PRIMARY_DEFECT'])+1): raise SystemExit('V51 canonical fresh governance fixture failed '+body)
          benign='AVPS historical note: the word blocker appears here only as incidental narrative prose.'
          if blocker(benign,int(os.environ['V51_PRIMARY_DEFECT'])+1): raise SystemExit('V51 canonical incidental prose overblocked')

          receipt=dict(source_receipt)
          receipt.pop('canonicalPublisherBytesUnchangedFromV49',None)
          receipt.update({
            'status':'PASS_AVPS_V2_RECOVERY4_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V52_ZERO_RUNTIME',
            'headSha':os.environ['EVENT_HEAD'],
            'baseSha':os.environ['EVENT_BASE'],
            'rejectedV51Head':os.environ['V51_HEAD'],
            'v51DedicatedRun':int(os.environ['V51_RUN']),
            'v51DedicatedJob':int(os.environ['V51_JOB']),
            'v51GenericRun':int(os.environ['V51_GENERIC']),
            'v51GenericJob':int(os.environ['V51_GENERIC_JOB']),
            'v51Artifact':int(os.environ['V51_ARTIFACT']),
            'v51ArtifactDigest':os.environ['V51_ARTIFACT_DIGEST'],
            'v51BackupDefect':int(os.environ['V51_BACKUP_DEFECT']),
            'v51PrimaryDefect':int(os.environ['V51_PRIMARY_DEFECT']),
            'sourceV51CanonicalPublisherSha256':os.environ['V51_PUBLISHER_SHA256'],
            'canonicalPublisherBytesUnchangedFromV51':True,
            'staleCanonicalPublisherBytesUnchangedFromV49AssertionRemoved':True,
            'sourceCorrectedShaSemanticConsistencyValidated':True,
            'canonicalPublisherGovernanceSemanticsPreserved':True,
            'materializedV51ManifestPreserved':True,
            'runtimeScienceControlsPreservedByByteExactCanonicalIdentity':True,
            'v46DispatchRefRcSemanticsPreservedByByteExactCanonicalIdentity':True,
            'liveCutoff':int(os.environ['V51_PRIMARY_DEFECT']),
            'dispatchCreated':False,
            'consumedMarkerCreated':False,
            'workflowDispatchPerformed':False,
            'solverExecutionPerformed':False,
            'resultOpeningAuthorized':False,
            'levelBAdmissionAuthorized':False,
            'holdoutOpened':False,
            'productionAuthorized':False,
            'taylorOrJerusalemUsed':False,
            'newMappingAuthorized':False})
          if 'canonicalPublisherBytesUnchangedFromV49' in receipt:
              raise SystemExit('stale V49 canonical-byte assertion survived')
          if receipt.get('sourcePublisherSha256')==receipt.get('correctedPublisherSha256'):
              raise SystemExit('source/corrected SHA semantics collapsed')
          if receipt.get('sourcePublisherSha256')!=source_manifest.get('sourcePublisherSha256') or receipt.get('correctedPublisherSha256')!=source_manifest.get('correctedPublisherSha256'):
              raise SystemExit('V52 receipt source/corrected SHA consistency failure')
          if receipt.get('exactSuppressedIds')!=source_manifest.get('exactSuppressedIds') or receipt.get('exactSuppressedIds')!=executable_ids:
              raise SystemExit('V52 receipt == V51 manifest == executable B equality failure')
          if receipt.get('suppressionLedgerCardinality')!=54:
              raise SystemExit('V52 receipt cardinality drift')

          Path('canonical-final-publisher-v2.yml').write_bytes(pub)
          Path('canonical-final-publisher-v2.sha256').write_text(pub_sha+'\n')
          Path('v51-publisher-patch-manifest.json').write_bytes(Path('v51-artifact/v51-publisher-patch-manifest.json').read_bytes())
          Path('review-receipt-v52.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          Path('v52-governance-fixtures.json').write_text(json.dumps({
            'schemaVersion':1,
            'sourceV51Artifact':int(os.environ['V51_ARTIFACT']),
            'canonicalPublisherSha256':pub_sha,
            'canonicalPublisherBytesUnchangedFromV51':True,
            'v51MaterializedManifestPreserved':True,
            'staleCanonicalPublisherBytesUnchangedFromV49AssertionRemoved':True,
            'sourceCorrectedShaSemanticConsistencyValidated':True,
            'actualCanonicalClassifierExecuted':True,
            'freshFatalFirstLines':fatal,
            'incidentalNarrativeNonblocking':benign,
            'zeroRuntimeOnly':True},sort_keys=True,indent=2)+'\n')

          if hashlib.sha256(Path('canonical-final-publisher-v2.yml').read_bytes()).hexdigest()!=os.environ['V51_PUBLISHER_SHA256']:
              raise SystemExit('V52 canonical output bytes changed')
          if Path('v51-publisher-patch-manifest.json').read_bytes()!=Path('v51-artifact/v51-publisher-patch-manifest.json').read_bytes():
              raise SystemExit('V52 materialized V51 manifest bytes changed')
          if os.environ['MODE']=='publisher' and Path(os.environ['PUBLISHER_PATH']).read_bytes()!=pub:
              raise SystemExit('publisher v2 byte mismatch')
          PY

      - name: Recheck protected state and corrected V52 receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set +e
          git ls-remote --exit-code --heads origin dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-ordinal-45 >/dev/null 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then echo 'ordinal45 dispatch ref exists' >&2; exit 1; fi
          test "$rc" -eq 2

          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > comments-final.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/avps-v2-postconsumption-recovery4-science.yml/runs?event=workflow_dispatch&per_page=100" > science-runs.json

          python - <<'PY'
          import hashlib,json,os,re,textwrap
          from pathlib import Path
          C=[x for page in json.load(open('comments-final.json')) for x in page]
          if any(str(c.get('body') or '').strip().startswith('ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_DISPATCH_CONSUMED') for c in C):
              raise SystemExit('consumed marker exists')
          runs=[]
          for page in json.load(open('science-runs.json')):
              if not isinstance(page,dict): raise SystemExit('science run pagination drift')
              runs.extend(page.get('workflow_runs',[]))
          if runs: raise SystemExit('science workflow_dispatch already exists')

          manifest=json.load(open('v51-publisher-patch-manifest.json'))
          receipt=json.load(open('review-receipt-v52.json'))
          pub=Path('canonical-final-publisher-v2.yml').read_bytes()
          if hashlib.sha256(pub).hexdigest()!=os.environ['V51_PUBLISHER_SHA256']:
              raise SystemExit('canonical V51 bytes drift in V52')
          if receipt.get('sourcePublisherSha256')!=os.environ['V50_PUBLISHER_SHA256'] or receipt.get('correctedPublisherSha256')!=os.environ['V51_PUBLISHER_SHA256']:
              raise SystemExit('V52 final source/corrected SHA semantics drift')
          if 'canonicalPublisherBytesUnchangedFromV49' in receipt:
              raise SystemExit('V52 stale V49 canonical-byte assertion present')
          if receipt.get('canonicalPublisherBytesUnchangedFromV51') is not True:
              raise SystemExit('V52 V51 byte-preservation assertion missing')
          if receipt.get('exactSuppressedIds')!=manifest.get('exactSuppressedIds') or receipt.get('suppressionLedgerCardinality')!=54:
              raise SystemExit('V52 final receipt/manifest ledger drift')
          for key in ('dispatchCreated','consumedMarkerCreated','workflowDispatchPerformed','solverExecutionPerformed','resultOpeningAuthorized','levelBAdmissionAuthorized','holdoutOpened','productionAuthorized','taylorOrJerusalemUsed','newMappingAuthorized'):
              if receipt.get(key) is not False: raise SystemExit('authority flag drift '+key)

          closed=set(); begins=[]
          for c in C:
              body=str(c.get('body') or '').strip(); first=body.splitlines()[0] if body else ''; fields={}
              for tok in first.replace('|',' ').split():
                  if '=' in tok:
                      k,v=tok.split('=',1); fields.setdefault(k,[]).append(v)
              if first.startswith('WRITE_QUIET_END'):
                  vals=[]
                  for key in ('begin','beginComment','begin_comment'):
                      for v in fields.get(key,[]):
                          if not v.isdigit(): raise SystemExit('non-numeric WRITE_QUIET_END alias')
                          vals.append(int(v))
                  if len(set(vals))>1: raise SystemExit('conflicting WRITE_QUIET_END aliases')
                  if vals: closed.add(vals[0])
              elif first.startswith('WRITE_QUIET_BEGIN'): begins.append(int(c['id']))
          if [x for x in begins if x not in closed]: raise SystemExit('unmatched WRITE_QUIET_BEGIN')

          txt=pub.decode(); a=txt.index('          import re\n          B={'); b=txt.index('          def state_check():',a)
          ns={}; exec(textwrap.dedent(txt[a:b]),ns)
          blocker=ns['avps_governance_blocker']; B=sorted(int(x) for x in ns['B'])
          if B!=manifest['exactSuppressedIds']: raise SystemExit('final executable B drift')
          cutoff=int(os.environ['LIVE_CUTOFF'])
          for c in C:
              cid=int(c.get('id') or 0)
              if cid>cutoff and blocker(str(c.get('body') or ''),cid):
                  raise SystemExit('newer unbound AVPS governance blocker '+str(cid))
          for cid in (int(os.environ['V51_BACKUP_DEFECT']),int(os.environ['V51_PRIMARY_DEFECT'])):
              q=[x for x in C if int(x.get('id') or 0)==cid]
              if len(q)!=1: raise SystemExit('V51 defect cardinality drift '+str(cid))
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: avps-v2-recovery4-ordinal45-final-publisher-governance-review-v52
          path: |
            review-receipt-v52.json
            canonical-final-publisher-v2.yml
            canonical-final-publisher-v2.sha256
            v51-publisher-patch-manifest.json
            v52-governance-fixtures.json
          if-no-files-found: error
