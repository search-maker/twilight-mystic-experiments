name: Review AVPS Recovery4 ordinal45 final publisher governance v53

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v53.yml
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v2.yml

permissions: {contents: read, actions: read, issues: read, pull-requests: read}
concurrency:
  group: avps-v2-recovery4-ordinal45-final-publisher-governance-v53-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      MAIN_EXPECTED: 52cbcb69029360d938f66b79da5150bdcaed6231
      INFRA_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-infrastructure-v53
      INFRA_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v53.yml
      PUBLISHER_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v2
      PUBLISHER_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v2.yml

      V52_PR: '906'
      V52_HEAD: bb17550479195f2821023246e59a66e1669d6dcc
      V52_BASE: 52cbcb69029360d938f66b79da5150bdcaed6231
      V52_TREE: 1eb74ad1335510a931614dbe0d217c30f147be6f
      V52_BLOB: fe8c2ad5be8adb3f0a07e441769b7e657013323d
      V52_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v52.yml
      V52_RUN: '33734267328'
      V52_JOB: '100581037051'
      V52_GENERIC: '33734267256'
      V52_GENERIC_JOB: '100581036618'
      V52_ARTIFACT: '9885096229'
      V52_ARTIFACT_NAME: avps-v2-recovery4-ordinal45-final-publisher-governance-review-v52
      V52_ARTIFACT_DIGEST: sha256:c85c490172594955c255e94c65bd717a67855d3ee3e28d004ca1b4ec4b62e567
      V52_PUBLISHER_SHA256: fa48facb7bd39021d9545d534dba474bcc6206d5b243722f9c84054bf32f25c6
      V53_PUBLISHER_SHA256_EXPECTED: 5787100711aaa9ada532f65b3558e8e32c6514be8f89a36c8860e6a06401640f

      V51_BACKUP_DEFECT: '5522870555'
      V51_PRIMARY_DEFECT: '5522885559'
      V52_PRIMARY_DEFECT: '5523086427'
      V52_BACKUP_DEFECT: '5523089709'
      OLD_KNOWN_DEFECT: '5522010191'
      NEW_KNOWN_DEFECT: '5523089709'
      ADDED_IDS: 5522870555,5522885559,5523086427,5523089709
      LIVE_CUTOFF: '5523089709'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}

      - name: Bind rejected V52 evidence and exact source artifact
        id: mode
        shell: bash
        env:
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$EVENT_ACTION" = opened
          test "$EVENT_BASE" = "$MAIN_EXPECTED"
          if [ "$EVENT_BRANCH" = "$INFRA_BRANCH" ]; then
            MODE=reviewer; EXPECT_PATH="$INFRA_PATH"
          elif [ "$EVENT_BRANCH" = "$PUBLISHER_BRANCH" ]; then
            MODE=publisher; EXPECT_PATH="$PUBLISHER_PATH"
          else
            echo 'unexpected V53 branch' >&2; exit 1
          fi
          set -- $(git rev-list --parents -n1 "$EVENT_HEAD")
          test "$#" -eq 2
          test "$2" = "$MAIN_EXPECTED"
          test "$(git diff --name-status "$MAIN_EXPECTED" "$EVENT_HEAD")" = "A\t$EXPECT_PATH"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

          git fetch --no-tags origin "$V52_HEAD"
          test "$(git rev-parse "$V52_HEAD^{tree}")" = "$V52_TREE"
          test "$(git rev-parse "$V52_HEAD:$V52_PATH")" = "$V52_BLOB"
          set -- $(git rev-list --parents -n1 "$V52_HEAD")
          test "$#" -eq 2
          test "$2" = "$V52_BASE"

          gh api "repos/$GITHUB_REPOSITORY/pulls/$V52_PR" > pr906.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V52_RUN" > r906.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V52_RUN/jobs?per_page=100" > j906.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V52_GENERIC" > g906.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V52_GENERIC/jobs?per_page=100" > gj906.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V52_RUN/artifacts?per_page=100" > a906.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > comments.json

          python - <<'PY'
          import json,os,re
          z=lambda p:json.load(open(p))
          p=z('pr906.json')
          if p.get('state')!='closed' or p.get('merged_at') is not None or p['head']['sha']!=os.environ['V52_HEAD'] or p['base']['sha']!=os.environ['V52_BASE']:
              raise SystemExit('PR906 rejected identity drift')
          r=z('r906.json'); g=z('g906.json')
          if r['id']!=int(os.environ['V52_RUN']) or r['head_sha']!=os.environ['V52_HEAD'] or r['run_attempt']!=1 or r.get('conclusion')!='success': raise SystemExit('V52 dedicated drift')
          h=[x for x in z('j906.json').get('jobs',[]) if int(x.get('id') or 0)==int(os.environ['V52_JOB'])]
          if len(h)!=1 or h[0].get('conclusion')!='success': raise SystemExit('V52 dedicated job drift')
          if g['id']!=int(os.environ['V52_GENERIC']) or g['head_sha']!=os.environ['V52_HEAD'] or g['run_attempt']!=1 or g.get('conclusion')!='success': raise SystemExit('V52 generic drift')
          h=[x for x in z('gj906.json').get('jobs',[]) if int(x.get('id') or 0)==int(os.environ['V52_GENERIC_JOB'])]
          if len(h)!=1 or h[0].get('conclusion')!='success': raise SystemExit('V52 generic job drift')
          h=[a for a in z('a906.json').get('artifacts',[]) if int(a.get('id') or 0)==int(os.environ['V52_ARTIFACT'])]
          if len(h)!=1 or h[0].get('name')!=os.environ['V52_ARTIFACT_NAME'] or h[0].get('digest')!=os.environ['V52_ARTIFACT_DIGEST'] or h[0].get('expired') is not False:
              raise SystemExit('V52 artifact identity drift')

          C=[x for page in z('comments.json') for x in page]
          expected={
            int(os.environ['V51_BACKUP_DEFECT']):'BACKUP_INDEPENDENT_AUDIT::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V51_PR905_REVIEW_RECEIPT_STALE_CANONICAL_BYTES_UNCHANGED_FROM_V49_ASSERTION',
            int(os.environ['V51_PRIMARY_DEFECT']):'INDEPENDENT_AUDIT::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V51_PR905_REVIEW_RECEIPT_STALE_CANONICAL_BYTES_UNCHANGED_FROM_V49_ASSERTION',
            int(os.environ['V52_PRIMARY_DEFECT']):'INDEPENDENT_AUDIT::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V52_PR906_CANONICAL_PUBLISHER_SELF_BLOCKS_ON_BOUND_V51_DEFECTS',
            int(os.environ['V52_BACKUP_DEFECT']):'BACKUP_INDEPENDENT_AUDIT::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V52_PR906_CANONICAL_PUBLISHER_SELF_BLOCKS_ON_BOUND_V51_DEFECTS'}
          for cid,pref in expected.items():
              q=[x for x in C if int(x.get('id') or 0)==cid]
              if len(q)!=1 or not str(q[0].get('body') or '').startswith(pref): raise SystemExit('Issue60 binding '+str(cid))
              u=q[0].get('user') or {}
              if u.get('login')!='search-maker' or int(u.get('id') or 0)!=304153003 or q[0].get('author_association')!='OWNER': raise SystemExit('Issue60 author identity '+str(cid))

          cutoff=int(os.environ['LIVE_CUTOFF'])
          def normalized_first(body):
              s=(body or '').strip(); first=s.splitlines()[0].strip() if s else ''
              for _ in range(4):
                  old=first
                  first=re.sub(r'^(?:#{1,6}|[-*+]|>)\s*','',first).strip()
                  first=re.sub(r'^(?:\*\*|__|\*|_|`)+|(?:\*\*|__|\*|_|`)+$','',first).strip()
                  if first==old: break
              return first.upper()
          def blocking(body):
              s=(body or '').strip(); f=normalized_first(s)
              if len(s)>131072: return True
              if re.match(r'^(?:BLOCKER(?:\s|\||:|$)|STATUS\s*:\s*BLOCKER|DIRECTIVE\s*:\s*BLOCKER)',f): return True
              if re.match(r'^(?:INDEPENDENT_AUDIT::|BACKUP_INDEPENDENT_AUDIT::)?CONFIRMED_DEFECT\b',f): return True
              if re.match(r'^MATERIAL_RISK\b',f) or re.match(r'^FAIL[_-]CLOSED\b',f): return True
              if re.search(r'\bQUARANTINE_DOWNSTREAM\s*=\s*TRUE\b',f): return True
              return False
          for c in C:
              cid=int(c.get('id') or 0)
              if cid>cutoff and blocking(str(c.get('body') or '')): raise SystemExit('newer unbound AVPS governance blocker '+str(cid))

          closed=set(); begins=[]
          for c in C:
              body=str(c.get('body') or '').strip(); first=body.splitlines()[0] if body else ''; fields={}
              for tok in first.replace('|',' ').split():
                  if '=' in tok:
                      k,v=tok.split('=',1); fields.setdefault(k,[]).append(v)
              if first.startswith('WRITE_QUIET_END'):
                  vals=[]
                  for key in ('begin','beginComment','begin_comment'):
                      for v in fields.get(key,[]):
                          if not v.isdigit(): raise SystemExit('non-numeric WRITE_QUIET_END alias')
                          vals.append(int(v))
                  if len(set(vals))>1: raise SystemExit('conflicting WRITE_QUIET_END aliases')
                  if vals: closed.add(vals[0])
              elif first.startswith('WRITE_QUIET_BEGIN'): begins.append(int(c['id']))
          if [x for x in begins if x not in closed]: raise SystemExit('unmatched WRITE_QUIET_BEGIN')
          PY

          rm -rf v52-artifact
          mkdir v52-artifact
          gh run download "$V52_RUN" -n "$V52_ARTIFACT_NAME" -D v52-artifact
          test "$(sha256sum v52-artifact/canonical-final-publisher-v2.yml | awk '{print $1}')" = "$V52_PUBLISHER_SHA256"
          test "$(tr -d '\r\n' < v52-artifact/canonical-final-publisher-v2.sha256)" = "$V52_PUBLISHER_SHA256"

      - name: Advance canonical own governance ledger and preserve truthful receipt semantics
        shell: bash
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,re,textwrap
          from pathlib import Path
          old=Path('v52-artifact/canonical-final-publisher-v2.yml').read_bytes()
          if hashlib.sha256(old).hexdigest()!=os.environ['V52_PUBLISHER_SHA256']: raise SystemExit('V52 publisher drift')
          source_receipt=json.load(open('v52-artifact/review-receipt-v52.json'))
          source_manifest=json.load(open('v52-artifact/v51-publisher-patch-manifest.json'))
          if 'canonicalPublisherBytesUnchangedFromV49' in source_receipt: raise SystemExit('V52 truthful receipt regression')
          if source_receipt.get('canonicalPublisherBytesUnchangedFromV51') is not True: raise SystemExit('V52 V51 byte identity receipt drift')
          if source_receipt.get('sourceV51CanonicalPublisherSha256')!=os.environ['V52_PUBLISHER_SHA256']: raise SystemExit('V52 source V51 SHA drift')
          if source_receipt.get('correctedPublisherSha256')!=os.environ['V52_PUBLISHER_SHA256']: raise SystemExit('V52 corrected SHA drift')

          oldtxt=old.decode(); old_known=int(os.environ['OLD_KNOWN_DEFECT']); new_known=int(os.environ['NEW_KNOWN_DEFECT'])
          if new_known!=int(os.environ['V52_BACKUP_DEFECT']): raise SystemExit('V53 known defect identity drift')
          old_k='KNOWN_DEFECT='+str(old_known); new_k='KNOWN_DEFECT='+str(new_known)
          if oldtxt.count(old_k)!=1: raise SystemExit('old KNOWN_DEFECT shape drift')
          mo=re.findall(r'^          B=\{([0-9,]+)\}$',oldtxt,re.M)
          if len(mo)!=1: raise SystemExit('old suppression ledger shape drift')
          old_ids=[int(x) for x in mo[0].split(',') if x]
          if len(old_ids)!=54 or old_ids!=sorted(old_ids) or len(set(old_ids))!=54: raise SystemExit('V52 canonical ledger cardinality/order drift')
          if source_receipt.get('exactSuppressedIds')!=old_ids or source_receipt.get('suppressionLedgerCardinality')!=54: raise SystemExit('V52 receipt/executable B drift')
          if source_manifest.get('exactSuppressedIds')!=old_ids: raise SystemExit('V52 preserved V51 manifest/executable B drift')

          added=[int(x) for x in os.environ['ADDED_IDS'].split(',')]
          expected_added=[int(os.environ['V51_BACKUP_DEFECT']),int(os.environ['V51_PRIMARY_DEFECT']),int(os.environ['V52_PRIMARY_DEFECT']),int(os.environ['V52_BACKUP_DEFECT'])]
          if added!=expected_added: raise SystemExit('V53 added-ID identity drift')
          if any(x in old_ids for x in added): raise SystemExit('V53 added ID already suppressed')
          new_ids=sorted(old_ids+added)
          if len(new_ids)!=58 or len(set(new_ids))!=58: raise SystemExit('V53 final ledger cardinality drift')
          old_b='          B={'+','.join(map(str,old_ids))+'}'
          new_b='          B={'+','.join(map(str,new_ids))+'}'
          newtxt=oldtxt.replace(old_k,new_k,1).replace(old_b,new_b,1)
          if newtxt==oldtxt: raise SystemExit('V53 patch unexpectedly empty')
          new=newtxt.encode(); new_sha=hashlib.sha256(new).hexdigest()
          if new_sha!=os.environ['V53_PUBLISHER_SHA256_EXPECTED']: raise SystemExit('V53 canonical SHA drift '+new_sha)
          if newtxt.replace(new_k,old_k,1).replace(new_b,old_b,1).encode()!=old: raise SystemExit('V53 bounded reverse equivalence failed')

          patches=[
            {'id':'canonical-known-defect-cutoff','before':old_k,'after':new_k,'expectedBeforeCount':1,'expectedAfterCount':1},
            {'id':'canonical-exact-suppression-ledger','before':old_b,'after':new_b,'expectedBeforeCount':1,'expectedAfterCount':1}]
          manifest={
            'schemaVersion':2,
            'transition':'AVPS_V52_TO_V53_CANONICAL_PUBLISHER',
            'sourceArtifact':int(os.environ['V52_ARTIFACT']),
            'sourceArtifactDigest':os.environ['V52_ARTIFACT_DIGEST'],
            'sourcePublisherSha256':os.environ['V52_PUBLISHER_SHA256'],
            'correctedPublisherSha256':new_sha,
            'liveCutoff':new_known,
            'oldKnownDefect':old_known,
            'knownDefect':new_known,
            'addedExactSuppressedIds':added,
            'exactSuppressedIds':new_ids,
            'suppressionLedgerCardinality':len(new_ids),
            'patches':patches,
            'materializedManifestForwardReplayRequired':True,
            'materializedManifestReverseReplayRequired':True,
            'boundedCanonicalGovernancePatchOnly':True}
          Path('v53-publisher-patch-manifest.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\n')
          materialized=json.loads(Path('v53-publisher-patch-manifest.json').read_text())
          if materialized!=manifest: raise SystemExit('materialized V53 manifest drift')
          def apply(data,direction):
              txt=data.decode(); seq=materialized['patches'] if direction=='forward' else list(reversed(materialized['patches']))
              for p in seq:
                  before=p['before'] if direction=='forward' else p['after']
                  after=p['after'] if direction=='forward' else p['before']
                  if txt.count(before)!=1: raise SystemExit(direction+' manifest multiplicity '+p['id'])
                  txt=txt.replace(before,after,1)
              return txt.encode()
          if apply(old,'forward')!=new: raise SystemExit('V53 materialized forward replay failed')
          if apply(new,'reverse')!=old: raise SystemExit('V53 materialized reverse replay failed')

          a=newtxt.index('          import re\n          B={'); b=newtxt.index('          def state_check():',a)
          ns={}; exec(textwrap.dedent(newtxt[a:b]),ns)
          executable=sorted(int(x) for x in ns['B'])
          if executable!=new_ids: raise SystemExit('V53 executable B drift')
          blocker=ns.get('avps_governance_blocker')
          if not callable(blocker): raise SystemExit('V53 canonical classifier missing')
          comments=[x for page in json.load(open('comments.json')) for x in page]
          for cid in added:
              q=[x for x in comments if int(x.get('id') or 0)==cid]
              if len(q)!=1: raise SystemExit('bound defect cardinality '+str(cid))
              body=str(q[0].get('body') or '')
              if not blocker(body,None): raise SystemExit('bound defect is not intrinsically blocking '+str(cid))
              if blocker(body,cid): raise SystemExit('exact-ID suppression failed '+str(cid))
              if not blocker(body,new_known+1000000+cid%997): raise SystemExit('nonmatching-ID suppression leak '+str(cid))
          fatal=['CONFIRMED_DEFECT AVPS_TEST','MATERIAL_RISK AVPS_TEST','BLOCKER | AVPS_TEST','**BLOCKER** | AVPS_TEST','STATUS: BLOCKER | AVPS_TEST','DIRECTIVE: BLOCKER | AVPS_TEST','FAIL_CLOSED AVPS_TEST','FAIL-CLOSED AVPS_TEST','QUARANTINE_DOWNSTREAM=TRUE AVPS_TEST']
          for body in fatal:
              if not blocker(body,new_known+1): raise SystemExit('fresh unbound governance fixture failed '+body)
          benign='AVPS historical note: the word blocker appears here only as incidental narrative prose.'
          if blocker(benign,new_known+1): raise SystemExit('incidental narrative blocker prose overblocked')

          receipt=dict(source_receipt)
          receipt.pop('canonicalPublisherBytesUnchangedFromV51',None)
          receipt.update({
            'status':'PASS_AVPS_V2_RECOVERY4_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V53_ZERO_RUNTIME',
            'headSha':os.environ['EVENT_HEAD'],
            'baseSha':os.environ['EVENT_BASE'],
            'rejectedV52Head':os.environ['V52_HEAD'],
            'v52DedicatedRun':int(os.environ['V52_RUN']),
            'v52DedicatedJob':int(os.environ['V52_JOB']),
            'v52GenericRun':int(os.environ['V52_GENERIC']),
            'v52GenericJob':int(os.environ['V52_GENERIC_JOB']),
            'v52Artifact':int(os.environ['V52_ARTIFACT']),
            'v52ArtifactDigest':os.environ['V52_ARTIFACT_DIGEST'],
            'v51BackupDefect':int(os.environ['V51_BACKUP_DEFECT']),
            'v51PrimaryDefect':int(os.environ['V51_PRIMARY_DEFECT']),
            'v52PrimaryDefect':int(os.environ['V52_PRIMARY_DEFECT']),
            'v52BackupDefect':int(os.environ['V52_BACKUP_DEFECT']),
            'sourcePublisherSha256':os.environ['V52_PUBLISHER_SHA256'],
            'sourceV52CanonicalPublisherSha256':os.environ['V52_PUBLISHER_SHA256'],
            'correctedPublisherSha256':new_sha,
            'canonicalPublisherBytesChangedFromV52GovernanceOnly':True,
            'canonicalPublisherGovernanceLedgerAdvanced':True,
            'canonicalNotDeadOnArrivalAgainstBoundLedger':True,
            'v52TruthfulReceiptRepairPreserved':True,
            'staleCanonicalPublisherBytesUnchangedFromV49AssertionRemoved':True,
            'materializedManifestForwardReplayExact':True,
            'materializedManifestReverseReplayExact':True,
            'runtimeScienceControlsPreservedByExactReversePatch':True,
            'v46DispatchRefRcSemanticsPreservedByExactReversePatch':True,
            'liveCutoff':new_known,
            'exactSuppressedIds':new_ids,
            'suppressionLedgerCardinality':len(new_ids),
            'dispatchCreated':False,
            'consumedMarkerCreated':False,
            'workflowDispatchPerformed':False,
            'solverExecutionPerformed':False,
            'resultOpeningAuthorized':False,
            'levelBAdmissionAuthorized':False,
            'holdoutOpened':False,
            'productionAuthorized':False,
            'taylorOrJerusalemUsed':False,
            'newMappingAuthorized':False})
          if 'canonicalPublisherBytesUnchangedFromV49' in receipt or 'canonicalPublisherBytesUnchangedFromV51' in receipt: raise SystemExit('stale canonical byte-identity assertion survived')
          if receipt['exactSuppressedIds']!=manifest['exactSuppressedIds'] or receipt['exactSuppressedIds']!=executable: raise SystemExit('V53 receipt == manifest == executable B equality failure')
          Path('canonical-final-publisher-v2.yml').write_bytes(new)
          Path('canonical-final-publisher-v2.sha256').write_text(new_sha+'\n')
          Path('review-receipt-v53.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          Path('v53-governance-fixtures.json').write_text(json.dumps({'schemaVersion':1,'actualCanonicalClassifierExecuted':True,'boundDefectIds':added,'freshFatalFirstLines':fatal,'incidentalNarrativeNonblocking':benign,'exactIdSuppressionOnly':True,'v52TruthfulReceiptRepairPreserved':True},sort_keys=True,indent=2)+'\n')
          if os.environ['MODE']=='publisher' and Path(os.environ['PUBLISHER_PATH']).read_bytes()!=new: raise SystemExit('publisher v2 byte mismatch')
          PY

      - name: Recheck protected state and V53 canonical ledger
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set +e
          git ls-remote --exit-code --heads origin dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-ordinal-45 >/dev/null 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then echo 'ordinal45 dispatch ref exists' >&2; exit 1; fi
          test "$rc" -eq 2

          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > comments-final.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/avps-v2-postconsumption-recovery4-science.yml/runs?event=workflow_dispatch&per_page=100" > science-runs.json
          python - <<'PY'
          import hashlib,json,os,textwrap
          from pathlib import Path
          C=[x for page in json.load(open('comments-final.json')) for x in page]
          if any(str(c.get('body') or '').strip().startswith('ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_DISPATCH_CONSUMED') for c in C): raise SystemExit('consumed marker exists')
          runs=[]
          for page in json.load(open('science-runs.json')):
              if not isinstance(page,dict): raise SystemExit('science run pagination drift')
              runs.extend(page.get('workflow_runs',[]))
          if runs: raise SystemExit('science workflow_dispatch already exists')

          manifest=json.load(open('v53-publisher-patch-manifest.json'))
          receipt=json.load(open('review-receipt-v53.json'))
          pub=Path('canonical-final-publisher-v2.yml').read_bytes()
          if hashlib.sha256(pub).hexdigest()!=os.environ['V53_PUBLISHER_SHA256_EXPECTED']: raise SystemExit('canonical V53 SHA drift')
          if receipt.get('sourcePublisherSha256')!=os.environ['V52_PUBLISHER_SHA256'] or receipt.get('correctedPublisherSha256')!=os.environ['V53_PUBLISHER_SHA256_EXPECTED']: raise SystemExit('V53 source/corrected SHA semantics drift')
          if 'canonicalPublisherBytesUnchangedFromV49' in receipt or 'canonicalPublisherBytesUnchangedFromV51' in receipt: raise SystemExit('stale byte-identity assertion present')
