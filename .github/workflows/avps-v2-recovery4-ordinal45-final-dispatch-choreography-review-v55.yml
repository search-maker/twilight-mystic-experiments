name: Review AVPS Recovery4 ordinal45 final publisher governance v55

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v55.yml
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v2.yml

permissions: {contents: read, actions: read, issues: read, pull-requests: read}
concurrency:
  group: avps-v2-recovery4-ordinal45-final-publisher-governance-v55-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      MAIN_EXPECTED: 52cbcb69029360d938f66b79da5150bdcaed6231
      INFRA_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-infrastructure-v55
      INFRA_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v55.yml
      PUBLISHER_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v2
      PUBLISHER_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v2.yml

      V54_PR: '908'
      V54_HEAD: 56b0495b4234750156459f692f19af4e43bcc0cc
      V54_BASE: 52cbcb69029360d938f66b79da5150bdcaed6231
      V54_TREE: c6b6f29b0ed711ed8d1b7ed9d3f03114b48f9a0a
      V54_BLOB: f0cdc861d86bf1c33f90e56f1e4ad09a29b3c8b3
      V54_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v54.yml
      V54_RUN: '33740359415'
      V54_JOB: '100600589676'
      V54_GENERIC: '33740359393'
      V54_GENERIC_JOB: '100600586436'
      V54_ARTIFACT: '9887459715'
      V54_ARTIFACT_NAME: avps-v2-recovery4-ordinal45-final-publisher-governance-review-v54
      V54_ARTIFACT_DIGEST: sha256:368f7d1620b966a5932b3f865c3cce8266c8e0b36bfdf21da34173ec9edc79c3
      V54_PUBLISHER_SHA256: 5787100711aaa9ada532f65b3558e8e32c6514be8f89a36c8860e6a06401640f
      V54_SOURCE_SHA256: fa48facb7bd39021d9545d534dba474bcc6206d5b243722f9c84054bf32f25c6
      V54_DEFECT: '5523917209'
      V53_DEFECT: '5523701714'
      LIVE_CUTOFF: '5523917209'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}

      - name: Bind rejected V54 evidence and exact artifact
        id: mode
        shell: bash
        env:
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$EVENT_ACTION" = opened
          test "$EVENT_BASE" = "$MAIN_EXPECTED"
          if [ "$EVENT_BRANCH" = "$INFRA_BRANCH" ]; then
            MODE=reviewer; EXPECT_PATH="$INFRA_PATH"
          elif [ "$EVENT_BRANCH" = "$PUBLISHER_BRANCH" ]; then
            MODE=publisher; EXPECT_PATH="$PUBLISHER_PATH"
          else
            echo 'unexpected V55 branch' >&2; exit 1
          fi
          set -- $(git rev-list --parents -n1 "$EVENT_HEAD")
          test "$#" -eq 2
          test "$2" = "$MAIN_EXPECTED"
          expected_status=$(printf 'A\t%s' "$EXPECT_PATH")
          test "$(git diff --name-status "$MAIN_EXPECTED" "$EVENT_HEAD")" = "$expected_status"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

          git fetch --no-tags origin "$V54_HEAD"
          test "$(git rev-parse "$V54_HEAD^{tree}")" = "$V54_TREE"
          test "$(git rev-parse "$V54_HEAD:$V54_PATH")" = "$V54_BLOB"
          set -- $(git rev-list --parents -n1 "$V54_HEAD")
          test "$#" -eq 2
          test "$2" = "$V54_BASE"

          gh api "repos/$GITHUB_REPOSITORY/pulls/$V54_PR" > pr908.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V54_RUN" > r908.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V54_RUN/jobs?per_page=100" > j908.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V54_GENERIC" > g908.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V54_GENERIC/jobs?per_page=100" > gj908.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V54_RUN/artifacts?per_page=100" > a908.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > comments.json

          python - <<'PY'
          import json,os
          z=lambda p:json.load(open(p))
          p=z('pr908.json')
          if p.get('state')!='closed' or p.get('merged_at') is not None or p['head']['sha']!=os.environ['V54_HEAD'] or p['base']['sha']!=os.environ['V54_BASE']:
              raise SystemExit('PR908 rejected identity drift')
          r=z('r908.json'); g=z('g908.json')
          if r['id']!=int(os.environ['V54_RUN']) or r['head_sha']!=os.environ['V54_HEAD'] or r['run_attempt']!=1 or r.get('conclusion')!='success':
              raise SystemExit('V54 dedicated drift')
          h=[x for x in z('j908.json').get('jobs',[]) if int(x.get('id') or 0)==int(os.environ['V54_JOB'])]
          if len(h)!=1 or h[0].get('conclusion')!='success': raise SystemExit('V54 dedicated job drift')
          if g['id']!=int(os.environ['V54_GENERIC']) or g['head_sha']!=os.environ['V54_HEAD'] or g['run_attempt']!=1 or g.get('conclusion')!='success':
              raise SystemExit('V54 generic drift')
          h=[x for x in z('gj908.json').get('jobs',[]) if int(x.get('id') or 0)==int(os.environ['V54_GENERIC_JOB'])]
          if len(h)!=1 or h[0].get('conclusion')!='success': raise SystemExit('V54 generic job drift')
          h=[a for a in z('a908.json').get('artifacts',[]) if int(a.get('id') or 0)==int(os.environ['V54_ARTIFACT'])]
          if len(h)!=1 or h[0].get('name')!=os.environ['V54_ARTIFACT_NAME'] or h[0].get('digest')!=os.environ['V54_ARTIFACT_DIGEST'] or h[0].get('expired') is not False:
              raise SystemExit('V54 artifact identity drift')
          C=[x for page in z('comments.json') for x in page]
          expected={
            int(os.environ['V53_DEFECT']):'COORDINATOR::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V53_PR907_NAME_STATUS_TAB_LITERAL_HARNESS',
            int(os.environ['V54_DEFECT']):'BACKUP_INDEPENDENT_AUDIT::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V54_PR908_REVIEW_RECEIPT_STALE_BYTE_EXACT_CANONICAL_IDENTITY_ASSERTIONS'}
          for cid,pref in expected.items():
              q=[x for x in C if int(x.get('id') or 0)==cid]
              if len(q)!=1 or not str(q[0].get('body') or '').startswith(pref): raise SystemExit('Issue60 binding '+str(cid))
              u=q[0].get('user') or {}
              if u.get('login')!='search-maker' or int(u.get('id') or 0)!=304153003 or q[0].get('author_association')!='OWNER': raise SystemExit('Issue60 author identity '+str(cid))
          PY

          rm -rf v54-artifact
          mkdir v54-artifact
          gh run download "$V54_RUN" -n "$V54_ARTIFACT_NAME" -D v54-artifact
          test "$(sha256sum v54-artifact/canonical-final-publisher-v2.yml | awk '{print $1}')" = "$V54_PUBLISHER_SHA256"
          find v54-artifact -type f -printf '%P\n' | sort > artifact-files.txt
          cat > expected-files.txt <<'FILES'
          canonical-final-publisher-v2.sha256
          canonical-final-publisher-v2.yml
          review-receipt-v54.json
          v54-governance-fixtures.json
          v54-publisher-patch-manifest.json
          FILES
          sort -o expected-files.txt expected-files.txt
          diff -u expected-files.txt artifact-files.txt

      - name: Repair only contradictory V54 receipt provenance
        shell: bash
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,re,textwrap
          from pathlib import Path
          root=Path('v54-artifact')
          pub=(root/'canonical-final-publisher-v2.yml').read_bytes()
          pub_sha=hashlib.sha256(pub).hexdigest()
          if pub_sha!=os.environ['V54_PUBLISHER_SHA256']: raise SystemExit('V54 canonical SHA drift')
          if (root/'canonical-final-publisher-v2.sha256').read_text().strip()!=pub_sha: raise SystemExit('V54 canonical sha file drift')
          manifest=json.loads((root/'v54-publisher-patch-manifest.json').read_text())
          receipt=json.loads((root/'review-receipt-v54.json').read_text())
          fixtures=json.loads((root/'v54-governance-fixtures.json').read_text())

          source_sha=os.environ['V54_SOURCE_SHA256']; corrected_sha=os.environ['V54_PUBLISHER_SHA256']
          if source_sha==corrected_sha: raise SystemExit('expected changed canonical identity')
          if manifest.get('sourcePublisherSha256')!=source_sha or manifest.get('correctedPublisherSha256')!=corrected_sha:
              raise SystemExit('V54 manifest source/corrected SHA drift')
          if receipt.get('sourcePublisherSha256')!=source_sha or receipt.get('correctedPublisherSha256')!=corrected_sha:
              raise SystemExit('V54 receipt source/corrected SHA drift')

          bad=('runtimeScienceControlsPreservedByByteExactCanonicalIdentity','v46DispatchRefRcSemanticsPreservedByByteExactCanonicalIdentity')
          for k in bad:
              if receipt.get(k) is not True: raise SystemExit('V54 defect field not present as expected '+k)
          if receipt.get('runtimeScienceControlsPreservedByExactReversePatch') is not True or receipt.get('v46DispatchRefRcSemanticsPreservedByExactReversePatch') is not True:
              raise SystemExit('truthful reverse-patch preservation fields missing')

          def apply(data,direction):
              txt=data.decode(); seq=manifest['patches'] if direction=='forward' else list(reversed(manifest['patches']))
              for p in seq:
                  before=p['before'] if direction=='forward' else p['after']
                  after=p['after'] if direction=='forward' else p['before']
                  if txt.count(before)!=1: raise SystemExit(direction+' manifest multiplicity '+str(p.get('id')))
                  txt=txt.replace(before,after,1)
              return txt.encode()
          source=apply(pub,'reverse')
          if hashlib.sha256(source).hexdigest()!=source_sha: raise SystemExit('materialized reverse replay source SHA drift')
          if apply(source,'forward')!=pub: raise SystemExit('materialized forward replay canonical drift')

          txt=pub.decode(); a=txt.index('          import re\n          B={'); b=txt.index('          def state_check():',a)
          ns={}; exec(textwrap.dedent(txt[a:b]),ns)
          B=sorted(int(x) for x in ns['B'])
          if receipt.get('exactSuppressedIds')!=manifest.get('exactSuppressedIds') or receipt.get('exactSuppressedIds')!=B:
              raise SystemExit('V54 receipt == manifest == executable B drift')
          if fixtures.get('actualCanonicalClassifierExecuted') is not True: raise SystemExit('V54 classifier fixture provenance drift')

          corrected=dict(receipt)
          for k in bad: corrected.pop(k,None)
          corrected.update({
            'status':'PASS_AVPS_V2_RECOVERY4_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V55_ZERO_RUNTIME',
            'headSha':os.environ['EVENT_HEAD'],
            'baseSha':os.environ['EVENT_BASE'],
            'rejectedV54Head':os.environ['V54_HEAD'],
            'v54DedicatedRun':int(os.environ['V54_RUN']),
            'v54DedicatedJob':int(os.environ['V54_JOB']),
            'v54GenericRun':int(os.environ['V54_GENERIC']),
            'v54GenericJob':int(os.environ['V54_GENERIC_JOB']),
            'v54Artifact':int(os.environ['V54_ARTIFACT']),
            'v54ArtifactDigest':os.environ['V54_ARTIFACT_DIGEST'],
            'v54BackupReceiptDefect':int(os.environ['V54_DEFECT']),
            'canonicalPublisherBytesUnchangedFromV54':True,
            'v54ReceiptContradictoryByteExactCanonicalIdentityAssertionsRemoved':True,
            'runtimeScienceControlsPreservedByExactReversePatch':True,
            'v46DispatchRefRcSemanticsPreservedByExactReversePatch':True,
            'materializedManifestForwardReplayExact':True,
            'materializedManifestReverseReplayExact':True,
            'reviewLiveCutoff':int(os.environ['LIVE_CUTOFF'])})

          if source_sha!=corrected_sha:
              offenders=[k for k,v in corrected.items() if k.endswith('ByByteExactCanonicalIdentity') and v is True]
              if offenders: raise SystemExit('changed canonical SHA coexists with byte-exact identity claim '+','.join(sorted(offenders)))
          for k in ('runtimeScienceControlsPreservedByExactReversePatch','v46DispatchRefRcSemanticsPreservedByExactReversePatch','materializedManifestForwardReplayExact','materializedManifestReverseReplayExact'):
              if corrected.get(k) is not True: raise SystemExit('required exact reverse-patch proof missing '+k)
          for key in ('dispatchCreated','consumedMarkerCreated','workflowDispatchPerformed','solverExecutionPerformed','resultOpeningAuthorized','levelBAdmissionAuthorized','holdoutOpened','productionAuthorized','taylorOrJerusalemUsed','newMappingAuthorized'):
              if corrected.get(key) is not False: raise SystemExit('authority flag drift '+key)

          Path('canonical-final-publisher-v2.yml').write_bytes(pub)
          Path('canonical-final-publisher-v2.sha256').write_text(pub_sha+'\n')
          Path('v54-publisher-patch-manifest.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\n')
          Path('review-receipt-v55.json').write_text(json.dumps(corrected,sort_keys=True,indent=2)+'\n')
          Path('v55-governance-fixtures.json').write_text(json.dumps({
            'schemaVersion':1,
            'sourceSha256':source_sha,
            'correctedSha256':corrected_sha,
            'sourceAndCorrectedShaDiffer':True,
            'staleByteExactCanonicalIdentityClaimsRemoved':list(bad),
            'changedShaCannotCoexistWithByteExactIdentityTrue':True,
            'actualMaterializedReverseReplayProved':True,
            'actualMaterializedForwardReplayProved':True,
            'runtimeScienceControlsPreservedByExactReversePatch':True,
            'v46DispatchRefRcSemanticsPreservedByExactReversePatch':True,
            'canonicalPublisherBytesUnchangedFromV54':True},sort_keys=True,indent=2)+'\n')

          if os.environ.get('MODE')=='publisher':
              p=Path(os.environ['PUBLISHER_PATH'])
              if not p.exists() or p.read_bytes()!=pub: raise SystemExit('publisher v2 byte mismatch')
          PY

      - name: Recheck protected state and V55 corrected receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set +e
          git ls-remote --exit-code --heads origin dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-ordinal-45 >/dev/null 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then echo 'ordinal45 dispatch ref exists' >&2; exit 1; fi
          test "$rc" -eq 2

          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > comments-final.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/avps-v2-postconsumption-recovery4-science.yml/runs?event=workflow_dispatch&per_page=100" > science-runs.json
          python - <<'PY'
          import hashlib,json,os,textwrap
          from pathlib import Path
          C=[x for page in json.load(open('comments-final.json')) for x in page]
          if any(str(c.get('body') or '').strip().startswith('ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_DISPATCH_CONSUMED') for c in C): raise SystemExit('consumed marker exists')
          runs=[]
          for page in json.load(open('science-runs.json')):
              if not isinstance(page,dict): raise SystemExit('science run pagination drift')
              runs.extend(page.get('workflow_runs',[]))
          if runs: raise SystemExit('science workflow_dispatch already exists')

          closed=set(); begins=[]
          for c in C:
              body=str(c.get('body') or '').strip(); first=body.splitlines()[0] if body else ''; fields={}
              for tok in first.replace('|',' ').split():
                  if '=' in tok:
                      k,v=tok.split('=',1); fields.setdefault(k,[]).append(v)
              if first.startswith('WRITE_QUIET_END'):
                  vals=[]
                  for key in ('begin','beginComment','begin_comment'):
                      for v in fields.get(key,[]):
                          if not v.isdigit(): raise SystemExit('non-numeric WRITE_QUIET_END alias')
                          vals.append(int(v))
                  if len(set(vals))>1: raise SystemExit('conflicting WRITE_QUIET_END aliases')
                  if vals: closed.add(vals[0])
              elif first.startswith('WRITE_QUIET_BEGIN'): begins.append(int(c['id']))
          if [x for x in begins if x not in closed]: raise SystemExit('unmatched WRITE_QUIET_BEGIN')

          pub=Path('canonical-final-publisher-v2.yml').read_bytes(); receipt=json.load(open('review-receipt-v55.json')); manifest=json.load(open('v54-publisher-patch-manifest.json'))
          if hashlib.sha256(pub).hexdigest()!=os.environ['V54_PUBLISHER_SHA256']: raise SystemExit('V55 preserved canonical SHA drift')
          if receipt.get('canonicalPublisherBytesUnchangedFromV54') is not True: raise SystemExit('V55 canonical preservation receipt drift')
          if receipt.get('sourcePublisherSha256')==receipt.get('correctedPublisherSha256'): raise SystemExit('V55 source/corrected SHA unexpectedly equal')
          offenders=[k for k,v in receipt.items() if k.endswith('ByByteExactCanonicalIdentity') and v is True]
          if offenders: raise SystemExit('V55 stale byte-exact identity claim '+','.join(sorted(offenders)))
          if receipt.get('runtimeScienceControlsPreservedByExactReversePatch') is not True or receipt.get('v46DispatchRefRcSemanticsPreservedByExactReversePatch') is not True:
              raise SystemExit('V55 truthful reverse-patch proof missing')

          txt=pub.decode(); a=txt.index('          import re\n          B={'); b=txt.index('          def state_check():',a)
          ns={}; exec(textwrap.dedent(txt[a:b]),ns)
          blocker=ns['avps_governance_blocker']; B=sorted(int(x) for x in ns['B'])
          if B!=manifest['exactSuppressedIds'] or B!=receipt['exactSuppressedIds']: raise SystemExit('V55 executable ledger drift')
          cutoff=int(os.environ['LIVE_CUTOFF'])
          for c in C:
              cid=int(c.get('id') or 0)
              if cid>cutoff and blocker(str(c.get('body') or ''),cid): raise SystemExit('newer unbound AVPS governance blocker '+str(cid))
          for key in ('dispatchCreated','consumedMarkerCreated','workflowDispatchPerformed','solverExecutionPerformed','resultOpeningAuthorized','levelBAdmissionAuthorized','holdoutOpened','productionAuthorized','taylorOrJerusalemUsed','newMappingAuthorized'):
              if receipt.get(key) is not False: raise SystemExit('authority flag drift '+key)
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: avps-v2-recovery4-ordinal45-final-publisher-governance-review-v55
          path: |
            review-receipt-v55.json
            canonical-final-publisher-v2.yml
            canonical-final-publisher-v2.sha256
            v54-publisher-patch-manifest.json
            v55-governance-fixtures.json
          if-no-files-found: error
