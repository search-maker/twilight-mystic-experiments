name: Review AVPS Recovery4 ordinal45 final publisher governance v56

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v56.yml
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v2.yml

permissions: {contents: read, actions: read, issues: read, pull-requests: read}
concurrency:
  group: avps-v2-recovery4-ordinal45-final-publisher-governance-v56-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      MAIN_EXPECTED: 52cbcb69029360d938f66b79da5150bdcaed6231
      INFRA_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-infrastructure-v56
      INFRA_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v56.yml
      PUBLISHER_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v2
      PUBLISHER_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v2.yml

      V55_PR: '909'
      V55_HEAD: bf303eda8df0f7dd437a0cd2fcabe8ef69873ac8
      V55_BASE: 52cbcb69029360d938f66b79da5150bdcaed6231
      V55_TREE: 252f3f9cb475a949fa7b278991a7cac10f087787
      V55_BLOB: 8550e1f0d7b90bde173ea0edebb5066b3a676ae0
      V55_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v55.yml
      V55_RUN: '33745529028'
      V55_JOB: '100616997430'
      V55_GENERIC: '33745528884'
      V55_GENERIC_JOB: '100616996921'
      V55_ARTIFACT: '9889452196'
      V55_ARTIFACT_NAME: avps-v2-recovery4-ordinal45-final-publisher-governance-review-v55
      V55_ARTIFACT_DIGEST: sha256:fdf78f36ee683b6ca550a97f549cf6e5ac329cab66e1c67c305242c88772d601
      V55_SOURCE_PUBLISHER_SHA256: 5787100711aaa9ada532f65b3558e8e32c6514be8f89a36c8860e6a06401640f
      OLD_KNOWN_DEFECT: '5523089709'
      V54_DEFECT: '5523917209'
      V55_CANDIDATE_NOTICE: '5524504808'
      V55_DEFECT: '5524514032'
      NEW_KNOWN_DEFECT: '5524514032'
      LIVE_CUTOFF: '5524514032'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}

      - name: Bind rejected V55 evidence and exact source artifact
        id: mode
        shell: bash
        env:
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$EVENT_ACTION" = opened
          test "$EVENT_BASE" = "$MAIN_EXPECTED"
          if [ "$EVENT_BRANCH" = "$INFRA_BRANCH" ]; then
            MODE=reviewer; EXPECT_PATH="$INFRA_PATH"
          elif [ "$EVENT_BRANCH" = "$PUBLISHER_BRANCH" ]; then
            MODE=publisher; EXPECT_PATH="$PUBLISHER_PATH"
          else
            echo 'unexpected V56 branch' >&2; exit 1
          fi
          set -- $(git rev-list --parents -n1 "$EVENT_HEAD")
          test "$#" -eq 2
          test "$2" = "$MAIN_EXPECTED"
          expected_status=$(printf 'A\t%s' "$EXPECT_PATH")
          test "$(git diff --name-status "$MAIN_EXPECTED" "$EVENT_HEAD")" = "$expected_status"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

          git fetch --no-tags origin "$V55_HEAD"
          test "$(git rev-parse "$V55_HEAD^{tree}")" = "$V55_TREE"
          test "$(git rev-parse "$V55_HEAD:$V55_PATH")" = "$V55_BLOB"
          set -- $(git rev-list --parents -n1 "$V55_HEAD")
          test "$#" -eq 2
          test "$2" = "$V55_BASE"

          gh api "repos/$GITHUB_REPOSITORY/pulls/$V55_PR" > pr909.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V55_RUN" > r909.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V55_RUN/jobs?per_page=100" > j909.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V55_GENERIC" > g909.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V55_GENERIC/jobs?per_page=100" > gj909.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V55_RUN/artifacts?per_page=100" > a909.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > comments.json

          python - <<'PY'
          import json,os
          z=lambda p:json.load(open(p))
          p=z('pr909.json')
          if p.get('state')!='closed' or p.get('merged_at') is not None or p['head']['sha']!=os.environ['V55_HEAD'] or p['base']['sha']!=os.environ['V55_BASE']:
              raise SystemExit('PR909 rejected identity drift')
          r=z('r909.json'); g=z('g909.json')
          if r['id']!=int(os.environ['V55_RUN']) or r['head_sha']!=os.environ['V55_HEAD'] or r['run_attempt']!=1 or r.get('conclusion')!='success':
              raise SystemExit('V55 dedicated drift')
          h=[x for x in z('j909.json').get('jobs',[]) if int(x.get('id') or 0)==int(os.environ['V55_JOB'])]
          if len(h)!=1 or h[0].get('conclusion')!='success': raise SystemExit('V55 dedicated job drift')
          if g['id']!=int(os.environ['V55_GENERIC']) or g['head_sha']!=os.environ['V55_HEAD'] or g['run_attempt']!=1 or g.get('conclusion')!='success':
              raise SystemExit('V55 generic drift')
          h=[x for x in z('gj909.json').get('jobs',[]) if int(x.get('id') or 0)==int(os.environ['V55_GENERIC_JOB'])]
          if len(h)!=1 or h[0].get('conclusion')!='success': raise SystemExit('V55 generic job drift')
          h=[a for a in z('a909.json').get('artifacts',[]) if int(a.get('id') or 0)==int(os.environ['V55_ARTIFACT'])]
          if len(h)!=1 or h[0].get('name')!=os.environ['V55_ARTIFACT_NAME'] or h[0].get('digest')!=os.environ['V55_ARTIFACT_DIGEST'] or h[0].get('expired') is not False:
              raise SystemExit('V55 artifact identity drift')
          C=[x for page in z('comments.json') for x in page]
          expected={
            int(os.environ['V54_DEFECT']):'BACKUP_INDEPENDENT_AUDIT::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V54_PR908_REVIEW_RECEIPT_STALE_BYTE_EXACT_CANONICAL_IDENTITY_ASSERTIONS',
            int(os.environ['V55_CANDIDATE_NOTICE']):'COORDINATOR::V55_INDEPENDENT_AUDIT_CANDIDATE',
            int(os.environ['V55_DEFECT']):'BACKUP_INDEPENDENT_AUDIT::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V55_PR909_CANONICAL_PUBLISHER_SELF_BLOCKS_ON_BOUND_V54_DEFECT'}
          for cid,pref in expected.items():
              q=[x for x in C if int(x.get('id') or 0)==cid]
              if len(q)!=1 or not str(q[0].get('body') or '').startswith(pref): raise SystemExit('Issue60 binding '+str(cid))
              u=q[0].get('user') or {}
              if u.get('login')!='search-maker' or int(u.get('id') or 0)!=304153003 or q[0].get('author_association')!='OWNER': raise SystemExit('Issue60 author identity '+str(cid))
          PY

          rm -rf v55-artifact
          mkdir v55-artifact
          gh run download "$V55_RUN" -n "$V55_ARTIFACT_NAME" -D v55-artifact
          test "$(sha256sum v55-artifact/canonical-final-publisher-v2.yml | awk '{print $1}')" = "$V55_SOURCE_PUBLISHER_SHA256"
          test "$(tr -d '\r\n' < v55-artifact/canonical-final-publisher-v2.sha256)" = "$V55_SOURCE_PUBLISHER_SHA256"
          find v55-artifact -type f -printf '%P\n' | sort > artifact-files.txt
          cat > expected-files.txt <<'FILES'
          canonical-final-publisher-v2.sha256
          canonical-final-publisher-v2.yml
          review-receipt-v55.json
          v54-publisher-patch-manifest.json
          v55-governance-fixtures.json
          FILES
          sort -o expected-files.txt expected-files.txt
          diff -u expected-files.txt artifact-files.txt

      - name: Advance canonical own cutoff and suppression ledger only
        shell: bash
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,re,textwrap
          from pathlib import Path
          root=Path('v55-artifact')
          old=(root/'canonical-final-publisher-v2.yml').read_bytes()
          if hashlib.sha256(old).hexdigest()!=os.environ['V55_SOURCE_PUBLISHER_SHA256']: raise SystemExit('V55 source canonical drift')
          receipt=json.loads((root/'review-receipt-v55.json').read_text())
          old_manifest=json.loads((root/'v54-publisher-patch-manifest.json').read_text())
          fixtures=json.loads((root/'v55-governance-fixtures.json').read_text())
          if receipt.get('v54ReceiptContradictoryByteExactCanonicalIdentityAssertionsRemoved') is not True: raise SystemExit('V55 receipt repair missing')
          if receipt.get('canonicalPublisherBytesUnchangedFromV54') is not True: raise SystemExit('V55 source-byte identity claim drift')
          offenders=[k for k,v in receipt.items() if k.endswith('ByByteExactCanonicalIdentity') and v is True]
          if offenders: raise SystemExit('V55 stale byte-exact identity claim '+','.join(sorted(offenders)))
          if receipt.get('runtimeScienceControlsPreservedByExactReversePatch') is not True or receipt.get('v46DispatchRefRcSemanticsPreservedByExactReversePatch') is not True:
              raise SystemExit('V55 reverse-patch proof drift')
          if fixtures.get('changedShaCannotCoexistWithByteExactIdentityTrue') is not True: raise SystemExit('V55 consistency fixture drift')

          oldtxt=old.decode(); old_known=int(os.environ['OLD_KNOWN_DEFECT']); new_known=int(os.environ['NEW_KNOWN_DEFECT'])
          if new_known!=int(os.environ['V55_DEFECT']): raise SystemExit('V56 cutoff must bind V55 controlling defect')
          old_k='KNOWN_DEFECT='+str(old_known); new_k='KNOWN_DEFECT='+str(new_known)
          if oldtxt.count(old_k)!=1: raise SystemExit('old KNOWN_DEFECT shape drift')
          mo=re.findall(r'^          B=\{([0-9,]+)\}$',oldtxt,re.M)
          if len(mo)!=1: raise SystemExit('old suppression ledger shape drift')
          old_ids=[int(x) for x in mo[0].split(',') if x]
          if old_ids!=sorted(old_ids) or len(old_ids)!=58 or len(set(old_ids))!=58: raise SystemExit('V55 canonical B58 drift')
          if receipt.get('exactSuppressedIds')!=old_ids or receipt.get('suppressionLedgerCardinality')!=58: raise SystemExit('V55 receipt/executable B drift')
          if old_manifest.get('exactSuppressedIds')!=old_ids: raise SystemExit('V55 materialized V54 manifest/executable B drift')

          added=[int(os.environ['V54_DEFECT']),int(os.environ['V55_DEFECT'])]
          if any(x in old_ids for x in added): raise SystemExit('V56 added ID already suppressed')
          new_ids=sorted(old_ids+added)
          if len(new_ids)!=60 or len(set(new_ids))!=60: raise SystemExit('V56 final B60 drift')
          old_b='          B={'+','.join(map(str,old_ids))+'}'
          new_b='          B={'+','.join(map(str,new_ids))+'}'
          newtxt=oldtxt.replace(old_k,new_k,1).replace(old_b,new_b,1)
          if newtxt==oldtxt: raise SystemExit('V56 patch unexpectedly empty')
          new=newtxt.encode(); new_sha=hashlib.sha256(new).hexdigest()
          if newtxt.replace(new_k,old_k,1).replace(new_b,old_b,1).encode()!=old: raise SystemExit('V56 bounded reverse equivalence failed')

          manifest={
            'schemaVersion':2,
            'transition':'AVPS_V55_TO_V56_CANONICAL_PUBLISHER',
            'sourceArtifact':int(os.environ['V55_ARTIFACT']),
            'sourceArtifactDigest':os.environ['V55_ARTIFACT_DIGEST'],
            'sourcePublisherSha256':os.environ['V55_SOURCE_PUBLISHER_SHA256'],
            'correctedPublisherSha256':new_sha,
            'liveCutoff':new_known,
            'oldKnownDefect':old_known,
            'knownDefect':new_known,
            'addedExactSuppressedIds':added,
            'exactSuppressedIds':new_ids,
            'suppressionLedgerCardinality':len(new_ids),
            'patches':[
              {'id':'canonical-known-defect-cutoff','before':old_k,'after':new_k,'expectedBeforeCount':1,'expectedAfterCount':1},
              {'id':'canonical-exact-suppression-ledger','before':old_b,'after':new_b,'expectedBeforeCount':1,'expectedAfterCount':1}],
            'materializedManifestForwardReplayRequired':True,
            'materializedManifestReverseReplayRequired':True,
            'boundedCanonicalGovernancePatchOnly':True}
          Path('v56-publisher-patch-manifest.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\n')
          materialized=json.loads(Path('v56-publisher-patch-manifest.json').read_text())
          if materialized!=manifest: raise SystemExit('materialized V56 manifest drift')
          def apply(data,direction):
              txt=data.decode(); seq=materialized['patches'] if direction=='forward' else list(reversed(materialized['patches']))
              for p in seq:
                  before=p['before'] if direction=='forward' else p['after']; after=p['after'] if direction=='forward' else p['before']
                  if txt.count(before)!=1: raise SystemExit(direction+' manifest multiplicity '+p['id'])
                  txt=txt.replace(before,after,1)
              return txt.encode()
          if apply(old,'forward')!=new: raise SystemExit('V56 materialized forward replay failed')
          if apply(new,'reverse')!=old: raise SystemExit('V56 materialized reverse replay failed')

          a=newtxt.index('          import re\n          B={'); b=newtxt.index('          def state_check():',a)
          ns={}; exec(textwrap.dedent(newtxt[a:b]),ns)
          executable=sorted(int(x) for x in ns['B']); blocker=ns.get('avps_governance_blocker')
          if executable!=new_ids or not callable(blocker): raise SystemExit('V56 executable classifier/ledger drift')
          comments=[x for page in json.load(open('comments.json')) for x in page]
          byid={int(x.get('id') or 0):x for x in comments}
          for cid in added:
              body=str(byid[cid].get('body') or '')
              if not blocker(body,None): raise SystemExit('bound defect not intrinsically blocking '+str(cid))
              if blocker(body,cid): raise SystemExit('bound defect exact suppression failed '+str(cid))
              if not blocker(body,new_known+1000000+cid%997): raise SystemExit('bound defect nonmatching suppression leak '+str(cid))
          notice=str(byid[int(os.environ['V55_CANDIDATE_NOTICE'])].get('body') or '')
          if blocker(notice,int(os.environ['V55_CANDIDATE_NOTICE'])): raise SystemExit('non-authorizing V55 candidate notice overblocked')
          for c in comments:
              cid=int(c.get('id') or 0)
              if old_known < cid <= new_known and blocker(str(c.get('body') or ''),cid):
                  raise SystemExit('V56 canonical still dead-on-arrival on bound/predecessor comment '+str(cid))
          for body in ('CONFIRMED_DEFECT AVPS_TEST','MATERIAL_RISK AVPS_TEST','BLOCKER | AVPS_TEST','**BLOCKER** | AVPS_TEST','STATUS: BLOCKER | AVPS_TEST','DIRECTIVE: BLOCKER | AVPS_TEST','FAIL_CLOSED AVPS_TEST','FAIL-CLOSED AVPS_TEST','QUARANTINE_DOWNSTREAM=TRUE AVPS_TEST'):
              if not blocker(body,new_known+1): raise SystemExit('fresh unbound governance fixture failed '+body)
          if blocker('AVPS historical note: the word blocker appears here only as incidental narrative prose.',new_known+1): raise SystemExit('incidental narrative prose overblocked')

          out=dict(receipt)
          out.pop('canonicalPublisherBytesUnchangedFromV54',None)
          out.update({
            'status':'PASS_AVPS_V2_RECOVERY4_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V56_ZERO_RUNTIME',
            'headSha':os.environ['EVENT_HEAD'],
            'baseSha':os.environ['EVENT_BASE'],
            'rejectedV55Head':os.environ['V55_HEAD'],
            'v55DedicatedRun':int(os.environ['V55_RUN']),
            'v55DedicatedJob':int(os.environ['V55_JOB']),
            'v55GenericRun':int(os.environ['V55_GENERIC']),
            'v55GenericJob':int(os.environ['V55_GENERIC_JOB']),
            'v55Artifact':int(os.environ['V55_ARTIFACT']),
            'v55ArtifactDigest':os.environ['V55_ARTIFACT_DIGEST'],
            'v54BackupReceiptDefect':int(os.environ['V54_DEFECT']),
            'v55BackupCanonicalSelfBlockDefect':int(os.environ['V55_DEFECT']),
            'sourcePublisherSha256':os.environ['V55_SOURCE_PUBLISHER_SHA256'],
            'sourceV55CanonicalPublisherSha256':os.environ['V55_SOURCE_PUBLISHER_SHA256'],
            'correctedPublisherSha256':new_sha,
            'canonicalPublisherBytesChangedFromV55GovernanceOnly':True,
            'canonicalPublisherGovernanceLedgerAdvanced':True,
            'canonicalNotDeadOnArrivalAgainstBoundLedger':True,
            'v55ReceiptContradictionRepairPreserved':True,
            'v55NonAuthorizingCandidateNoticeNotSuppressedAsDefect':True,
            'materializedManifestForwardReplayExact':True,
            'materializedManifestReverseReplayExact':True,
            'runtimeScienceControlsPreservedByExactReversePatch':True,
            'v46DispatchRefRcSemanticsPreservedByExactReversePatch':True,
            'liveCutoff':new_known,
            'reviewLiveCutoff':int(os.environ['LIVE_CUTOFF']),
            'exactSuppressedIds':new_ids,
            'suppressionLedgerCardinality':len(new_ids),
            'dispatchCreated':False,
            'consumedMarkerCreated':False,
            'workflowDispatchPerformed':False,
            'solverExecutionPerformed':False,
            'resultOpeningAuthorized':False,
            'levelBAdmissionAuthorized':False,
            'holdoutOpened':False,
            'productionAuthorized':False,
            'taylorOrJerusalemUsed':False,
            'newMappingAuthorized':False})
          offenders=[k for k,v in out.items() if k.endswith('ByByteExactCanonicalIdentity') and v is True]
          if offenders: raise SystemExit('V56 stale byte-exact identity claim '+','.join(sorted(offenders)))
          if out['exactSuppressedIds']!=manifest['exactSuppressedIds'] or out['exactSuppressedIds']!=executable: raise SystemExit('V56 receipt == manifest == executable B drift')

          Path('canonical-final-publisher-v2.yml').write_bytes(new)
          Path('canonical-final-publisher-v2.sha256').write_text(new_sha+'\n')
          Path('review-receipt-v56.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n')
          Path('v56-governance-fixtures.json').write_text(json.dumps({
            'schemaVersion':1,
            'sourcePublisherSha256':os.environ['V55_SOURCE_PUBLISHER_SHA256'],
            'correctedPublisherSha256':new_sha,
            'canonicalOwnKnownDefectAdvancedFrom':old_known,
            'canonicalOwnKnownDefectAdvancedTo':new_known,
            'addedExactSuppressedIds':added,
            'suppressionLedgerCardinality':len(new_ids),
            'boundV54DefectSuppressedByExactId':True,
            'boundV55DefectSuppressedByExactId':True,
            'nonAuthorizingV55CandidateNoticeRemainsBenign':True,
            'actualCanonicalNotDeadOnArrivalAcrossPredecessorWindow':True,
            'freshLaterUnboundGovernanceFixturesRemainFatal':True,
            'materializedManifestForwardReplayExact':True,
            'materializedManifestReverseReplayExact':True,
            'runtimeScienceControlsPreservedByExactReversePatch':True,
            'v46DispatchRefRcSemanticsPreservedByExactReversePatch':True},sort_keys=True,indent=2)+'\n')
          if os.environ.get('MODE')=='publisher':
              p=Path(os.environ['PUBLISHER_PATH'])
              if not p.exists() or p.read_bytes()!=new: raise SystemExit('publisher v2 byte mismatch')
          PY

      - name: Recheck protected state and actual corrected canonical lifecycle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set +e
          git ls-remote --exit-code --heads origin dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-ordinal-45 >/dev/null 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then echo 'ordinal45 dispatch ref exists' >&2; exit 1; fi
          test "$rc" -eq 2

          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > comments-final.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/avps-v2-postconsumption-recovery4-science.yml/runs?event=workflow_dispatch&per_page=100" > science-runs.json
          python - <<'PY'
          import hashlib,json,os,textwrap
          from pathlib import Path
          C=[x for page in json.load(open('comments-final.json')) for x in page]
          if any(str(c.get('body') or '').strip().startswith('ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_DISPATCH_CONSUMED') for c in C): raise SystemExit('consumed marker exists')
          runs=[]
          for page in json.load(open('science-runs.json')):
              if not isinstance(page,dict): raise SystemExit('science run pagination drift')
              runs.extend(page.get('workflow_runs',[]))
          if runs: raise SystemExit('science workflow_dispatch already exists')

          closed=set(); begins=[]
          for c in C:
              body=str(c.get('body') or '').strip(); first=body.splitlines()[0] if body else ''; fields={}
              for tok in first.replace('|',' ').split():
                  if '=' in tok:
                      k,v=tok.split('=',1); fields.setdefault(k,[]).append(v)
              if first.startswith('WRITE_QUIET_END'):
                  vals=[]
                  for key in ('begin','beginComment','begin_comment'):
                      for v in fields.get(key,[]):
                          if not v.isdigit(): raise SystemExit('non-numeric WRITE_QUIET_END alias')
                          vals.append(int(v))
                  if len(set(vals))>1: raise SystemExit('conflicting WRITE_QUIET_END aliases')
                  if vals: closed.add(vals[0])
              elif first.startswith('WRITE_QUIET_BEGIN'): begins.append(int(c['id']))
          if [x for x in begins if x not in closed]: raise SystemExit('unmatched WRITE_QUIET_BEGIN')

          pub=Path('canonical-final-publisher-v2.yml').read_bytes(); receipt=json.load(open('review-receipt-v56.json')); manifest=json.load(open('v56-publisher-patch-manifest.json'))
          sha=hashlib.sha256(pub).hexdigest()
          if sha!=receipt['correctedPublisherSha256'] or sha!=manifest['correctedPublisherSha256']: raise SystemExit('V56 canonical SHA receipt/manifest drift')
          if receipt.get('sourcePublisherSha256')!=os.environ['V55_SOURCE_PUBLISHER_SHA256']: raise SystemExit('V56 source SHA drift')
          if receipt.get('canonicalNotDeadOnArrivalAgainstBoundLedger') is not True: raise SystemExit('V56 dead-on-arrival proof missing')
          offenders=[k for k,v in receipt.items() if k.endswith('ByByteExactCanonicalIdentity') and v is True]
          if offenders: raise SystemExit('V56 byte-exact identity contradiction '+','.join(sorted(offenders)))

          txt=pub.decode(); a=txt.index('          import re\n          B={'); b=txt.index('          def state_check():',a)
          ns={}; exec(textwrap.dedent(txt[a:b]),ns)
          B=sorted(int(x) for x in ns['B']); blocker=ns['avps_governance_blocker']
          if B!=manifest['exactSuppressedIds'] or B!=receipt['exactSuppressedIds'] or len(B)!=60: raise SystemExit('V56 executable ledger drift')
          if 'KNOWN_DEFECT='+os.environ['NEW_KNOWN_DEFECT'] not in txt: raise SystemExit('V56 canonical own cutoff drift')
          byid={int(c.get('id') or 0):c for c in C}
          for cid in (int(os.environ['V54_DEFECT']),int(os.environ['V55_DEFECT'])):
