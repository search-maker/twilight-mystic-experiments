name: Review AVPS Recovery4 ordinal45 final publisher governance v61

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v61.yml
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v2.yml

permissions: {contents: read, actions: read, issues: read, pull-requests: read}
concurrency:
  group: avps-v2-recovery4-ordinal45-final-publisher-governance-v61-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      MAIN_EXPECTED: 52cbcb69029360d938f66b79da5150bdcaed6231
      INFRA_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-infrastructure-v61
      INFRA_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v61.yml
      PUBLISHER_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v2
      PUBLISHER_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v2.yml

      V60_PR: '914'
      V60_HEAD: 0272ec5bb1e46aa1392dddc55bbbf5f368c1ab3b
      V60_BASE: 52cbcb69029360d938f66b79da5150bdcaed6231
      V60_TREE: 88269e21683b406fd30282ef82a01ce9b88b33b0
      V60_BLOB: ebedce7ec8dbb833bcf4b6b9828274d93c5b5677
      V60_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v60.yml
      V60_RUN: '33750360682'
      V60_JOB: '100632272056'
      V60_GENERIC: '33750360491'
      V60_GENERIC_JOB: '100632271601'
      V60_DEFECT: '5525146537'

      V55_RUN: '33745529028'
      V55_ARTIFACT: '9889452196'
      V55_ARTIFACT_NAME: avps-v2-recovery4-ordinal45-final-publisher-governance-review-v55
      V55_ARTIFACT_DIGEST: sha256:fdf78f36ee683b6ca550a97f549cf6e5ac329cab66e1c67c305242c88772d601
      V55_SOURCE_PUBLISHER_SHA256: 5787100711aaa9ada532f65b3558e8e32c6514be8f89a36c8860e6a06401640f
      V61_EXPECTED_PUBLISHER_SHA256: 729346cae2c9a74e6b7a3efa9f4a678f0b4666ad1b577bbad990563835287769
      OLD_KNOWN_DEFECT: '5523089709'
      V53_DEFECT: '5523701714'
      V54_DEFECT: '5523917209'
      V55_CANDIDATE_NOTICE: '5524504808'
      V55_DEFECT: '5524514032'
      V56_DEFECT: '5524611145'
      V57_DEFECT: '5524704649'
      V58_DEFECT: '5524808744'
      V59_DEFECT: '5524958566'
      NEW_KNOWN_DEFECT: '5525146537'
      LIVE_CUTOFF: '5525146537'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}

      - name: Bind rejected V60 evidence and exact V55 source artifact
        id: mode
        shell: bash
        env:
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$EVENT_ACTION" = opened
          test "$EVENT_BASE" = "$MAIN_EXPECTED"
          if [ "$EVENT_BRANCH" = "$INFRA_BRANCH" ]; then
            MODE=reviewer; EXPECT_PATH="$INFRA_PATH"
          elif [ "$EVENT_BRANCH" = "$PUBLISHER_BRANCH" ]; then
            MODE=publisher; EXPECT_PATH="$PUBLISHER_PATH"
          else
            echo 'unexpected V61 branch' >&2; exit 1
          fi
          set -- $(git rev-list --parents -n1 "$EVENT_HEAD")
          test "$#" -eq 2
          test "$2" = "$MAIN_EXPECTED"
          expected_status=$(printf 'A\t%s' "$EXPECT_PATH")
          test "$(git diff --name-status "$MAIN_EXPECTED" "$EVENT_HEAD")" = "$expected_status"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

          git fetch --no-tags origin "$V60_HEAD"
          test "$(git rev-parse "$V60_HEAD^{tree}")" = "$V60_TREE"
          test "$(git rev-parse "$V60_HEAD:$V60_PATH")" = "$V60_BLOB"
          set -- $(git rev-list --parents -n1 "$V60_HEAD")
          test "$#" -eq 2
          test "$2" = "$V60_BASE"

          gh api "repos/$GITHUB_REPOSITORY/pulls/$V60_PR" > pr914.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V60_RUN" > r914.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V60_RUN/jobs?per_page=100" > j914.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V60_GENERIC" > g914.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V60_GENERIC/jobs?per_page=100" > gj914.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V60_RUN/artifacts?per_page=100" > a914.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V55_RUN/artifacts?per_page=100" > a55.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > comments.json

          python - <<'PY'
          import json,os
          z=lambda p:json.load(open(p))
          p=z('pr914.json')
          if p.get('state')!='closed' or p.get('merged_at') is not None or p['head']['sha']!=os.environ['V60_HEAD'] or p['base']['sha']!=os.environ['V60_BASE']:
              raise SystemExit('PR914 rejected identity drift')
          r=z('r914.json'); g=z('g914.json')
          if r['id']!=int(os.environ['V60_RUN']) or r['head_sha']!=os.environ['V60_HEAD'] or r['run_attempt']!=1 or r.get('conclusion')!='failure':
              raise SystemExit('V60 dedicated drift')
          h=[x for x in z('j914.json').get('jobs',[]) if int(x.get('id') or 0)==int(os.environ['V60_JOB'])]
          if len(h)!=1 or h[0].get('conclusion')!='failure': raise SystemExit('V60 dedicated job drift')
          steps=h[0].get('steps',[])
          if len(steps)!=1 or steps[0].get('name')!='Set up job' or steps[0].get('conclusion')!='failure': raise SystemExit('V60 template-failure shape drift')
          if z('a914.json').get('artifacts') not in ([],None): raise SystemExit('V60 artifact count drift')
          if g['id']!=int(os.environ['V60_GENERIC']) or g['head_sha']!=os.environ['V60_HEAD'] or g['run_attempt']!=1 or g.get('conclusion')!='success':
              raise SystemExit('V60 generic drift')
          h=[x for x in z('gj914.json').get('jobs',[]) if int(x.get('id') or 0)==int(os.environ['V60_GENERIC_JOB'])]
          if len(h)!=1 or h[0].get('conclusion')!='success': raise SystemExit('V60 generic job drift')
          aa=[x for x in z('a55.json').get('artifacts',[]) if int(x.get('id') or 0)==int(os.environ['V55_ARTIFACT'])]
          if len(aa)!=1 or aa[0].get('name')!=os.environ['V55_ARTIFACT_NAME'] or aa[0].get('expired') is True or aa[0].get('digest')!=os.environ['V55_ARTIFACT_DIGEST']:
              raise SystemExit('V55 source artifact identity drift')
          C=[x for page in z('comments.json') for x in page]
          expected={
            int(os.environ['V53_DEFECT']):'COORDINATOR::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V53_PR907_NAME_STATUS_LITERAL_BACKSLASH_T_MISMATCH',
            int(os.environ['V54_DEFECT']):'BACKUP_INDEPENDENT_AUDIT::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V54_PR908_REVIEW_RECEIPT_STALE_BYTE_EXACT_CANONICAL_IDENTITY_ASSERTIONS',
            int(os.environ['V55_CANDIDATE_NOTICE']):'COORDINATOR::V55_INDEPENDENT_AUDIT_CANDIDATE',
            int(os.environ['V55_DEFECT']):'BACKUP_INDEPENDENT_AUDIT::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V55_PR909_CANONICAL_PUBLISHER_SELF_BLOCKS_ON_BOUND_V54_DEFECT',
            int(os.environ['V56_DEFECT']):'COORDINATOR::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V56_PR910_NONAUTHORIZING_CANDIDATE_NOTICE_BENIGN_CLASSIFIER_FIXTURE_INVALID',
            int(os.environ['V57_DEFECT']):'COORDINATOR::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V57_PR911_STATE_CHECK_SOURCE_SLICE_TERMINATOR_LOOKUP_INVALID',
            int(os.environ['V58_DEFECT']):'COORDINATOR::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V58_PR912_STRUCTURAL_AST_EXPECTS_NONEXISTENT_LTE_CONTINUE_GUARD',
            int(os.environ['V59_DEFECT']):'COORDINATOR::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V59_PR913_OMITTED_BOUND_V53_DEFECT_5523701714',
            int(os.environ['V60_DEFECT']):'COORDINATOR::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V60_PR914_INVALID_CHECKOUT_ACTION_PIN'}
          for cid,pref in expected.items():
              q=[x for x in C if int(x.get('id') or 0)==cid]
              if len(q)!=1 or not str(q[0].get('body') or '').startswith(pref): raise SystemExit('Issue60 binding '+str(cid))
              u=q[0].get('user') or {}
              if u.get('login')!='search-maker' or int(u.get('id') or 0)!=304153003 or q[0].get('author_association')!='OWNER': raise SystemExit('Issue60 author identity '+str(cid))
          v60=[x for x in C if int(x.get('id') or 0)==int(os.environ['V60_DEFECT'])][0]
          body=str(v60.get('body') or '')
          if 'actions/checkout@3d3c42e5aac5ba80582576410c181273ba90b1' not in body or 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' not in body:
              raise SystemExit('V60 exact action-pin defect evidence drift')
          PY

          rm -rf v55-artifact
          mkdir v55-artifact
          gh run download "$V55_RUN" -n "$V55_ARTIFACT_NAME" -D v55-artifact
          test "$(sha256sum v55-artifact/canonical-final-publisher-v2.yml | awk '{print $1}')" = "$V55_SOURCE_PUBLISHER_SHA256"
          test "$(tr -d '\r\n' < v55-artifact/canonical-final-publisher-v2.sha256)" = "$V55_SOURCE_PUBLISHER_SHA256"

      - name: Advance canonical cutoff with complete predecessor ledger and executable live-candidate AST proof
        shell: bash
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast,hashlib,json,os,re,textwrap
          from pathlib import Path
          root=Path('v55-artifact')
          old=(root/'canonical-final-publisher-v2.yml').read_bytes()
          if hashlib.sha256(old).hexdigest()!=os.environ['V55_SOURCE_PUBLISHER_SHA256']: raise SystemExit('V55 source canonical drift')
          receipt=json.loads((root/'review-receipt-v55.json').read_text())
          old_manifest=json.loads((root/'v54-publisher-patch-manifest.json').read_text())
          fixtures=json.loads((root/'v55-governance-fixtures.json').read_text())
          if receipt.get('v54ReceiptContradictoryByteExactCanonicalIdentityAssertionsRemoved') is not True: raise SystemExit('V55 receipt repair missing')
          if receipt.get('canonicalPublisherBytesUnchangedFromV54') is not True: raise SystemExit('V55 source-byte identity claim drift')
          if [k for k,v in receipt.items() if k.endswith('ByByteExactCanonicalIdentity') and v is True]: raise SystemExit('V55 stale byte-exact identity claim')
          if receipt.get('runtimeScienceControlsPreservedByExactReversePatch') is not True or receipt.get('v46DispatchRefRcSemanticsPreservedByExactReversePatch') is not True: raise SystemExit('V55 reverse-patch proof drift')
          if fixtures.get('changedShaCannotCoexistWithByteExactIdentityTrue') is not True: raise SystemExit('V55 consistency fixture drift')

          oldtxt=old.decode(); old_known=int(os.environ['OLD_KNOWN_DEFECT']); new_known=int(os.environ['NEW_KNOWN_DEFECT'])
          if new_known!=int(os.environ['V60_DEFECT']): raise SystemExit('V61 cutoff must bind V60 controlling defect')
          old_k='KNOWN_DEFECT='+str(old_known); new_k='KNOWN_DEFECT='+str(new_known)
          if oldtxt.count(old_k)!=1: raise SystemExit('old KNOWN_DEFECT shape drift')
          mo=re.findall(r'^          B=\{([0-9,]+)\}$',oldtxt,re.M)
          if len(mo)!=1: raise SystemExit('old suppression ledger shape drift')
          old_ids=[int(x) for x in mo[0].split(',') if x]
          if old_ids!=sorted(old_ids) or len(old_ids)!=58 or len(set(old_ids))!=58: raise SystemExit('V55 canonical B58 drift')
          if receipt.get('exactSuppressedIds')!=old_ids or receipt.get('suppressionLedgerCardinality')!=58 or old_manifest.get('exactSuppressedIds')!=old_ids:
              raise SystemExit('V55 receipt/manifest/executable B drift')

          notice_id=int(os.environ['V55_CANDIDATE_NOTICE'])
          added=[int(os.environ[x]) for x in ('V53_DEFECT','V54_DEFECT','V55_DEFECT','V56_DEFECT','V57_DEFECT','V58_DEFECT','V59_DEFECT','V60_DEFECT')]
          if notice_id in added: raise SystemExit('historical candidate notice must not enter B')
          if any(x in old_ids for x in added): raise SystemExit('V61 added ID already suppressed')
          if added!=sorted(added) or len(set(added))!=8: raise SystemExit('V61 bounded predecessor additions drift')
          new_ids=sorted(old_ids+added)
          if len(new_ids)!=66 or len(set(new_ids))!=66: raise SystemExit('V61 final B66 drift')
          old_b='          B={'+','.join(map(str,old_ids))+'}'
          new_b='          B={'+','.join(map(str,new_ids))+'}'
          newtxt=oldtxt.replace(old_k,new_k,1).replace(old_b,new_b,1)
          new=newtxt.encode(); new_sha=hashlib.sha256(new).hexdigest()
          if new_sha!=os.environ['V61_EXPECTED_PUBLISHER_SHA256']: raise SystemExit('V61 corrected canonical SHA drift')
          if newtxt.replace(new_k,old_k,1).replace(new_b,old_b,1).encode()!=old: raise SystemExit('V61 bounded reverse equivalence failed')

          manifest={
            'schemaVersion':2,'transition':'AVPS_V55_TO_V61_CANONICAL_PUBLISHER',
            'sourceArtifact':int(os.environ['V55_ARTIFACT']),'sourceArtifactDigest':os.environ['V55_ARTIFACT_DIGEST'],
            'sourcePublisherSha256':os.environ['V55_SOURCE_PUBLISHER_SHA256'],'correctedPublisherSha256':new_sha,
            'liveCutoff':new_known,'oldKnownDefect':old_known,'knownDefect':new_known,
            'addedExactSuppressedIds':added,'exactSuppressedIds':new_ids,'suppressionLedgerCardinality':len(new_ids),
            'patches':[
              {'id':'canonical-known-defect-cutoff','before':old_k,'after':new_k,'expectedBeforeCount':1,'expectedAfterCount':1},
              {'id':'canonical-exact-suppression-ledger','before':old_b,'after':new_b,'expectedBeforeCount':1,'expectedAfterCount':1}],
            'materializedManifestForwardReplayRequired':True,'materializedManifestReverseReplayRequired':True,'boundedCanonicalGovernancePatchOnly':True}
          Path('v61-publisher-patch-manifest.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\n')
          materialized=json.loads(Path('v61-publisher-patch-manifest.json').read_text())
          if materialized!=manifest: raise SystemExit('materialized V61 manifest drift')
          def apply(data,direction):
              txt=data.decode(); seq=materialized['patches'] if direction=='forward' else list(reversed(materialized['patches']))
              for p in seq:
                  before=p['before'] if direction=='forward' else p['after']; after=p['after'] if direction=='forward' else p['before']
                  if txt.count(before)!=1: raise SystemExit(direction+' manifest multiplicity '+p['id'])
                  txt=txt.replace(before,after,1)
              return txt.encode()
          if apply(old,'forward')!=new or apply(new,'reverse')!=old: raise SystemExit('V61 materialized replay failed')

          a=newtxt.index('          import re\n          B={'); b=newtxt.index('          def state_check():',a)
          ns={}; exec(textwrap.dedent(newtxt[a:b]),ns)
          executable=sorted(int(x) for x in ns['B']); blocker=ns.get('avps_governance_blocker')
          if executable!=new_ids or not callable(blocker): raise SystemExit('V61 executable classifier/ledger drift')

          lines=newtxt.splitlines(); starts=[i for i,line in enumerate(lines) if line=='          def state_check():']
          if len(starts)!=1: raise SystemExit('actual canonical state_check definition cardinality drift')
          si=starts[0]; end=len(lines)
          for j in range(si+1,len(lines)):
              line=lines[j]
              if line.strip() and not line.startswith('              '): end=j; break
          fn=ast.parse(textwrap.dedent('\n'.join(lines[si:end])+'\n')).body[0]
          def is_live_guard(node):
              if not isinstance(node,ast.If): return False
              t=node.test
              if not (isinstance(t,ast.Compare) and len(t.ops)==1 and isinstance(t.ops[0],ast.Gt) and len(t.comparators)==1 and isinstance(t.comparators[0],ast.Name) and t.comparators[0].id=='KNOWN_DEFECT'): return False
              left=t.left
              if not (isinstance(left,ast.Call) and isinstance(left.func,ast.Name) and left.func.id=='int' and len(left.args)==1): return False
              arg=left.args[0]
              if not (isinstance(arg,ast.BoolOp) and isinstance(arg.op,ast.Or) and len(arg.values)==2): return False
              get,zero=arg.values
              if not (isinstance(get,ast.Call) and isinstance(get.func,ast.Attribute) and isinstance(get.func.value,ast.Name) and get.func.value.id=='c' and get.func.attr=='get' and len(get.args)==1 and isinstance(get.args[0],ast.Constant) and get.args[0].value=='id'): return False
              if not (isinstance(zero,ast.Constant) and zero.value==0): return False
              calls=[x for stmt in node.body for x in ast.walk(stmt) if isinstance(x,ast.Call) and isinstance(x.func,ast.Name) and x.func.id=='avps_governance_blocker']
              return len(calls)==1
          if len([node for node in ast.walk(fn) if is_live_guard(node)])!=1: raise SystemExit('actual state_check > KNOWN_DEFECT blocker-guard cardinality drift')

          comments=[x for page in json.load(open('comments.json')) for x in page]; byid={int(x.get('id') or 0):x for x in comments}
          for cid in added:
              body=str(byid[cid].get('body') or '')
              if not blocker(body,None): raise SystemExit('bound defect not intrinsically blocking '+str(cid))
              if blocker(body,cid): raise SystemExit('bound defect exact suppression failed '+str(cid))
              if not blocker(body,new_known+1000000+cid%997): raise SystemExit('bound defect nonmatching suppression leak '+str(cid))
          if notice_id>new_known: raise SystemExit('V55 candidate notice is not pre-cutoff')
          for c in comments:
              cid=int(c.get('id') or 0)
              if old_known < cid <= new_known and cid!=notice_id and blocker(str(c.get('body') or ''),cid):
                  raise SystemExit('V61 canonical still dead-on-arrival on bound/predecessor comment '+str(cid))
          for body in ('CONFIRMED_DEFECT AVPS_TEST','MATERIAL_RISK AVPS_TEST','BLOCKER | AVPS_TEST','**BLOCKER** | AVPS_TEST','STATUS: BLOCKER | AVPS_TEST','DIRECTIVE: BLOCKER | AVPS_TEST','FAIL_CLOSED AVPS_TEST','FAIL-CLOSED AVPS_TEST','QUARANTINE_DOWNSTREAM=TRUE AVPS_TEST'):
              if not blocker(body,new_known+1): raise SystemExit('fresh unbound governance fixture failed '+body)
          if blocker('AVPS historical note: the word blocker appears here only as incidental narrative prose.',new_known+1): raise SystemExit('incidental narrative prose overblocked')

          out=dict(receipt); out.pop('canonicalPublisherBytesUnchangedFromV54',None)
          out.update({
            'status':'PASS_AVPS_V2_RECOVERY4_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V61_ZERO_RUNTIME',
            'headSha':os.environ['EVENT_HEAD'],'baseSha':os.environ['EVENT_BASE'],
            'rejectedV60Head':os.environ['V60_HEAD'],'v60DedicatedRun':int(os.environ['V60_RUN']),'v60DedicatedJob':int(os.environ['V60_JOB']),
            'v60DedicatedConclusion':'FAILURE','v60GenericRun':int(os.environ['V60_GENERIC']),'v60GenericJob':int(os.environ['V60_GENERIC_JOB']),'v60GenericConclusion':'SUCCESS',
            'v60DedicatedArtifactCount':0,'v60CoordinatorInvalidCheckoutPinDefect':int(os.environ['V60_DEFECT']),
            'v60InvalidCheckoutPinCorrected':True,'sourcePublisherSha256':os.environ['V55_SOURCE_PUBLISHER_SHA256'],
            'correctedPublisherSha256':new_sha,'canonicalPublisherGovernanceLedgerAdvanced':True,'canonicalNotDeadOnArrivalAgainstBoundLedger':True,
            'v55ReceiptContradictionRepairPreserved':True,'stateCheckCutoffSemanticsProvedByExecutableLiveCandidateAst':True,
            'materializedManifestForwardReplayExact':True,'materializedManifestReverseReplayExact':True,
            'runtimeScienceControlsPreservedByExactReversePatch':True,'v46DispatchRefRcSemanticsPreservedByExactReversePatch':True,
            'liveCutoff':new_known,'reviewLiveCutoff':int(os.environ['LIVE_CUTOFF']),'exactSuppressedIds':new_ids,'suppressionLedgerCardinality':len(new_ids),
            'dispatchCreated':False,'consumedMarkerCreated':False,'workflowDispatchPerformed':False,'solverExecutionPerformed':False,
            'resultOpeningAuthorized':False,'levelBAdmissionAuthorized':False,'holdoutOpened':False,'productionAuthorized':False,
            'taylorOrJerusalemUsed':False,'newMappingAuthorized':False})
          if [k for k,v in out.items() if k.endswith('ByByteExactCanonicalIdentity') and v is True]: raise SystemExit('V61 stale byte-exact identity claim')
          if out['exactSuppressedIds']!=manifest['exactSuppressedIds'] or out['exactSuppressedIds']!=executable: raise SystemExit('V61 receipt == manifest == executable B drift')

          Path('canonical-final-publisher-v2.yml').write_bytes(new)
          Path('canonical-final-publisher-v2.sha256').write_text(new_sha+'\n')
          Path('review-receipt-v61.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n')
          Path('v61-governance-fixtures.json').write_text(json.dumps({
            'schemaVersion':1,'sourcePublisherSha256':os.environ['V55_SOURCE_PUBLISHER_SHA256'],'correctedPublisherSha256':new_sha,
            'canonicalOwnKnownDefectAdvancedFrom':old_known,'canonicalOwnKnownDefectAdvancedTo':new_known,'addedExactSuppressedIds':added,
            'suppressionLedgerCardinality':len(new_ids),'v60InvalidCheckoutPinCorrected':True,'actualCanonicalNotDeadOnArrivalAcrossPredecessorWindow':True,
            'freshLaterUnboundGovernanceFixturesRemainFatal':True,'materializedManifestForwardReplayExact':True,'materializedManifestReverseReplayExact':True,
            'runtimeScienceControlsPreservedByExactReversePatch':True,'v46DispatchRefRcSemanticsPreservedByExactReversePatch':True},sort_keys=True,indent=2)+'\n')
          if os.environ.get('MODE')=='publisher':
              p=Path(os.environ['PUBLISHER_PATH'])
              if not p.exists() or p.read_bytes()!=new: raise SystemExit('publisher v2 byte mismatch')
          PY

      - name: Recheck protected state and actual corrected canonical lifecycle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          set +e
