          test "$#" -eq 2
          test "$2" = "$P917_BASE"
          test "$(git rev-parse "$V62_MERGE:$V62_PATH")" = "$V62_BLOB"
          git show "$V62_MERGE:$V62_PATH" > v62-workflow.yml
          grep -Fq 'MAIN_EXPECTED: 52cbcb69029360d938f66b79da5150bdcaed6231' v62-workflow.yml

          gh api "repos/$GITHUB_REPOSITORY/pulls/$V62_PR" > pr916.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V62_DEDICATED_RUN" > v62d.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V62_DEDICATED_RUN/jobs?per_page=100" > v62dj.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V62_GENERIC_RUN" > v62g.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V62_GENERIC_RUN/jobs?per_page=100" > v62gj.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V62_DEDICATED_RUN/artifacts?per_page=100" > v62a.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V62_POSTMERGE_RUN" > v62pm.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/$P917_PR" > pr917.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$P917_DEDICATED_RUN" > p917d.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$P917_DEDICATED_RUN/jobs?per_page=100" > p917dj.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$P917_DEDICATED_RUN/artifacts?per_page=100" > p917a.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$P917_GENERIC_RUN" > p917g.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$P917_GENERIC_RUN/jobs?per_page=100" > p917gj.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > comments.json

          python - <<'PY'
          import json,os
          z=lambda p:json.load(open(p))
          C=[x for page in z('comments.json') for x in page]
          def owner_comment(cid,prefix):
              q=[x for x in C if int(x.get('id') or 0)==int(cid)]
              if len(q)!=1 or not str(q[0].get('body') or '').startswith(prefix): raise SystemExit('Issue60 binding '+str(cid))
              u=q[0].get('user') or {}
              if u.get('login')!='search-maker' or int(u.get('id') or 0)!=304153003 or q[0].get('author_association')!='OWNER': raise SystemExit('Issue60 author identity '+str(cid))
              return q[0]
          p=z('pr916.json')
          if p.get('state')!='closed' or p.get('merged_at') is None or p.get('merge_commit_sha')!=os.environ['V62_MERGE'] or p['head']['sha']!=os.environ['V62_HEAD'] or p['base']['sha']!=os.environ['V62_BASE'] or p.get('draft') is not False: raise SystemExit('PR916 accepted merge identity drift')
          d=z('v62d.json'); g=z('v62g.json')
          if d['head_sha']!=os.environ['V62_HEAD'] or d['run_attempt']!=1 or d.get('conclusion')!='success': raise SystemExit('V62 dedicated drift')
          if g['head_sha']!=os.environ['V62_HEAD'] or g['run_attempt']!=1 or g.get('conclusion')!='success': raise SystemExit('V62 generic drift')
          if not any(int(x.get('id') or 0)==int(os.environ['V62_DEDICATED_JOB']) and x.get('conclusion')=='success' for x in z('v62dj.json').get('jobs',[])): raise SystemExit('V62 dedicated job drift')
          if not any(int(x.get('id') or 0)==int(os.environ['V62_GENERIC_JOB']) and x.get('conclusion')=='success' for x in z('v62gj.json').get('jobs',[])): raise SystemExit('V62 generic job drift')
          aa=[x for x in z('v62a.json').get('artifacts',[]) if int(x.get('id') or 0)==int(os.environ['V62_ARTIFACT'])]
          if len(aa)!=1 or aa[0].get('name')!=os.environ['V62_ARTIFACT_NAME'] or aa[0].get('expired') is True or aa[0].get('digest')!=os.environ['V62_ARTIFACT_DIGEST']: raise SystemExit('V62 artifact identity drift')
          pm=z('v62pm.json')
          if pm.get('head_sha')!=os.environ['V62_MERGE'] or pm.get('run_attempt')!=1 or pm.get('conclusion')!='success': raise SystemExit('V62 postmerge contract drift')
          owner_comment(os.environ['V62_PRIMARY_ACCEPT'],'INDEPENDENT_AUDIT::ACCEPT')
          owner_comment(os.environ['V62_BACKUP_ACCEPT'],'BACKUP_INDEPENDENT_AUDIT::ACCEPT')

          p=z('pr917.json')
          if p.get('state')!='closed' or p.get('merged_at') is not None or p['head']['sha']!=os.environ['P917_HEAD'] or p['base']['sha']!=os.environ['P917_BASE'] or p.get('draft') is not False: raise SystemExit('PR917 rejected identity drift')
          d=z('p917d.json'); g=z('p917g.json')
          if d['head_sha']!=os.environ['P917_HEAD'] or d['run_attempt']!=1 or d.get('conclusion')!='failure': raise SystemExit('PR917 dedicated drift')
          if g['head_sha']!=os.environ['P917_HEAD'] or g['run_attempt']!=1 or g.get('conclusion')!='success': raise SystemExit('PR917 generic drift')
          jobs=z('p917dj.json').get('jobs',[]); h=[x for x in jobs if int(x.get('id') or 0)==int(os.environ['P917_DEDICATED_JOB'])]
          if len(h)!=1 or h[0].get('conclusion')!='failure': raise SystemExit('PR917 dedicated job drift')
          steps=h[0].get('steps',[])
          required=[('Set up job','success'),('Run actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1','success'),('Run actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065','success'),('Bind rejected V60/V61 evidence and exact V55 source artifact','failure')]
          if [(x.get('name'),x.get('conclusion')) for x in steps[:4]]!=required: raise SystemExit('PR917 first-invalid-step shape drift')
          if z('p917a.json').get('artifacts') not in ([],None): raise SystemExit('PR917 dedicated artifact count drift')
          if not any(int(x.get('id') or 0)==int(os.environ['P917_GENERIC_JOB']) and x.get('conclusion')=='success' for x in z('p917gj.json').get('jobs',[])): raise SystemExit('PR917 generic job drift')
          body=str(owner_comment(os.environ['P917_DEFECT'],'COORDINATOR::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_PUBLISHER_V2_PR917_POSTMERGE_BASE_BINDING_SELF_INVALIDATION').get('body') or '')
          if os.environ['P917_BASE'] not in body or '52cbcb69029360d938f66b79da5150bdcaed6231' not in body: raise SystemExit('PR917 exact base-binding defect evidence drift')
          PY

          rm -rf v62-artifact
          mkdir v62-artifact
          gh run download "$V62_DEDICATED_RUN" -n "$V62_ARTIFACT_NAME" -D v62-artifact
          test "$(sha256sum v62-artifact/canonical-final-publisher-v2.yml | awk '{print $1}')" = "$V62_SOURCE_PUBLISHER_SHA256"
          test "$(tr -d '\r\n' < v62-artifact/canonical-final-publisher-v2.sha256)" = "$V62_SOURCE_PUBLISHER_SHA256"

      - name: Advance canonical cutoff only for PR917 defect and prove exact lifecycle
        shell: bash
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast,hashlib,json,os,re,textwrap
          from pathlib import Path
          root=Path('v62-artifact')
          old=(root/'canonical-final-publisher-v2.yml').read_bytes()
          if hashlib.sha256(old).hexdigest()!=os.environ['V62_SOURCE_PUBLISHER_SHA256']: raise SystemExit('V62 source canonical drift')
          receipt=json.loads((root/'review-receipt-v62.json').read_text())
          manifest62=json.loads((root/'v62-publisher-patch-manifest.json').read_text())
          if receipt.get('correctedPublisherSha256')!=os.environ['V62_SOURCE_PUBLISHER_SHA256'] or receipt.get('suppressionLedgerCardinality')!=67: raise SystemExit('V62 source receipt drift')
          if receipt.get('runtimeScienceControlsPreservedByExactReversePatch') is not True or receipt.get('v46DispatchRefRcSemanticsPreservedByExactReversePatch') is not True: raise SystemExit('V62 source preservation proof drift')
          for key in ('dispatchCreated','consumedMarkerCreated','workflowDispatchPerformed','solverExecutionPerformed','resultOpeningAuthorized','levelBAdmissionAuthorized','holdoutOpened','productionAuthorized','taylorOrJerusalemUsed','newMappingAuthorized'):
              if receipt.get(key) is not False: raise SystemExit('V62 source authority flag drift '+key)

          oldtxt=old.decode(); old_known=int(os.environ['V62_OLD_KNOWN_DEFECT']); new_known=int(os.environ['P917_DEFECT'])
          old_k='KNOWN_DEFECT='+str(old_known); new_k='KNOWN_DEFECT='+str(new_known)
          if oldtxt.count(old_k)!=1: raise SystemExit('V62 KNOWN_DEFECT shape drift')
          mo=re.findall(r'^          B=\{([0-9,]+)\}$',oldtxt,re.M)
          if len(mo)!=1: raise SystemExit('V62 suppression ledger shape drift')
          old_ids=[int(x) for x in mo[0].split(',') if x]
          if old_ids!=sorted(old_ids) or len(old_ids)!=67 or len(set(old_ids))!=67: raise SystemExit('V62 canonical B67 drift')
          if receipt.get('exactSuppressedIds')!=old_ids or manifest62.get('exactSuppressedIds')!=old_ids: raise SystemExit('V62 receipt/manifest/executable B drift')
          added=[new_known]
          if new_known in old_ids: raise SystemExit('PR917 defect already suppressed')
          new_ids=sorted(old_ids+added)
          if len(new_ids)!=68 or len(set(new_ids))!=68: raise SystemExit('V63 final B68 drift')
          old_b='          B={'+','.join(map(str,old_ids))+'}'; new_b='          B={'+','.join(map(str,new_ids))+'}'
          newtxt=oldtxt.replace(old_k,new_k,1).replace(old_b,new_b,1); new=newtxt.encode(); new_sha=hashlib.sha256(new).hexdigest()
          if new_sha!=os.environ['V63_EXPECTED_PUBLISHER_SHA256']: raise SystemExit('V63 corrected canonical SHA drift')
          if newtxt.replace(new_k,old_k,1).replace(new_b,old_b,1).encode()!=old: raise SystemExit('V63 bounded reverse equivalence failed')
          manifest={'schemaVersion':2,'transition':'AVPS_V62_TO_V63_CANONICAL_PUBLISHER','sourceArtifact':int(os.environ['V62_ARTIFACT']),'sourceArtifactDigest':os.environ['V62_ARTIFACT_DIGEST'],'sourcePublisherSha256':os.environ['V62_SOURCE_PUBLISHER_SHA256'],'correctedPublisherSha256':new_sha,'liveCutoff':new_known,'oldKnownDefect':old_known,'knownDefect':new_known,'addedExactSuppressedIds':added,'exactSuppressedIds':new_ids,'suppressionLedgerCardinality':68,'patches':[{'id':'canonical-known-defect-cutoff','before':old_k,'after':new_k,'expectedBeforeCount':1,'expectedAfterCount':1},{'id':'canonical-exact-suppression-ledger','before':old_b,'after':new_b,'expectedBeforeCount':1,'expectedAfterCount':1}],'materializedManifestForwardReplayRequired':True,'materializedManifestReverseReplayRequired':True,'boundedCanonicalGovernancePatchOnly':True}
          Path('v63-publisher-patch-manifest.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\n')
          materialized=json.loads(Path('v63-publisher-patch-manifest.json').read_text())
          if materialized!=manifest: raise SystemExit('materialized V63 manifest drift')
          def apply(data,direction):
              txt=data.decode(); seq=materialized['patches'] if direction=='forward' else list(reversed(materialized['patches']))
              for p in seq:
                  before=p['before'] if direction=='forward' else p['after']; after=p['after'] if direction=='forward' else p['before']
                  if txt.count(before)!=1: raise SystemExit(direction+' manifest multiplicity '+p['id'])
                  txt=txt.replace(before,after,1)
              return txt.encode()
          if apply(old,'forward')!=new or apply(new,'reverse')!=old: raise SystemExit('V63 materialized replay failed')

          a=newtxt.index('          import re\n          B={'); b=newtxt.index('          def state_check():',a)
          ns={}; exec(textwrap.dedent(newtxt[a:b]),ns); executable=sorted(int(x) for x in ns['B']); blocker=ns.get('avps_governance_blocker')
          if executable!=new_ids or not callable(blocker): raise SystemExit('V63 executable classifier/ledger drift')
          lines=newtxt.splitlines(); starts=[i for i,line in enumerate(lines) if line=='          def state_check():']
          if len(starts)!=1: raise SystemExit('actual canonical state_check definition cardinality drift')
          si=starts[0]; end=len(lines)
          for j in range(si+1,len(lines)):
              line=lines[j]
              if line.strip() and not line.startswith('              '): end=j; break
          fn=ast.parse(textwrap.dedent('\n'.join(lines[si:end])+'\n')).body[0]
          def live_guard(node):
              if not isinstance(node,ast.If): return False
              return any(isinstance(x,ast.Call) and isinstance(x.func,ast.Name) and x.func.id=='avps_governance_blocker' for x in ast.walk(node)) and any(isinstance(x,ast.Name) and x.id=='KNOWN_DEFECT' for x in ast.walk(node.test))
          if len([node for node in ast.walk(fn) if live_guard(node)])!=1: raise SystemExit('actual state_check live blocker guard drift')

          comments=[x for page in json.load(open('comments.json')) for x in page]; byid={int(x.get('id') or 0):x for x in comments}
          defect_body=str(byid[new_known].get('body') or '')
          if not blocker(defect_body,None): raise SystemExit('PR917 defect not intrinsically blocking')
          if blocker(defect_body,new_known): raise SystemExit('PR917 exact suppression failed')
          if not blocker(defect_body,new_known+1000001): raise SystemExit('PR917 nonmatching suppression leak')
          for c in comments:
              cid=int(c.get('id') or 0)
              if old_known < cid <= new_known and blocker(str(c.get('body') or ''),cid): raise SystemExit('V63 canonical dead-on-arrival in predecessor window '+str(cid))
          for body in ('CONFIRMED_DEFECT AVPS_TEST','MATERIAL_RISK AVPS_TEST','BLOCKER | AVPS_TEST','**BLOCKER** | AVPS_TEST','STATUS: BLOCKER | AVPS_TEST','DIRECTIVE: BLOCKER | AVPS_TEST','FAIL_CLOSED AVPS_TEST','FAIL-CLOSED AVPS_TEST','QUARANTINE_DOWNSTREAM=TRUE AVPS_TEST'):
              if not blocker(body,new_known+1): raise SystemExit('fresh unbound governance fixture failed '+body)
          if blocker('AVPS historical note: the word blocker appears here only as incidental narrative prose.',new_known+1): raise SystemExit('incidental narrative prose overblocked')

          out=dict(receipt)
          out.update({'status':'PASS_AVPS_V2_RECOVERY4_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V63_ZERO_RUNTIME','headSha':os.environ['EVENT_HEAD'],'baseSha':os.environ['EVENT_BASE'],'sourceV62PublisherSha256':os.environ['V62_SOURCE_PUBLISHER_SHA256'],'sourcePublisherSha256':os.environ['V62_SOURCE_PUBLISHER_SHA256'],'correctedPublisherSha256':new_sha,'rejectedPublisherV2Head':os.environ['P917_HEAD'],'publisherV2DedicatedRun':int(os.environ['P917_DEDICATED_RUN']),'publisherV2DedicatedJob':int(os.environ['P917_DEDICATED_JOB']),'publisherV2DedicatedConclusion':'FAILURE','publisherV2GenericRun':int(os.environ['P917_GENERIC_RUN']),'publisherV2GenericJob':int(os.environ['P917_GENERIC_JOB']),'publisherV2GenericConclusion':'SUCCESS','publisherV2DedicatedArtifactCount':0,'publisherV2PostmergeBaseBindingDefect':new_known,'postmergeAwarePublisherBaseBindingCorrected':True,'canonicalPublisherGovernanceLedgerAdvanced':True,'canonicalNotDeadOnArrivalAgainstBoundLedger':True,'materializedManifestForwardReplayExact':True,'materializedManifestReverseReplayExact':True,'runtimeScienceControlsPreservedByExactReversePatch':True,'v46DispatchRefRcSemanticsPreservedByExactReversePatch':True,'liveCutoff':new_known,'reviewLiveCutoff':new_known,'exactSuppressedIds':new_ids,'suppressionLedgerCardinality':68,'dispatchCreated':False,'consumedMarkerCreated':False,'workflowDispatchPerformed':False,'solverExecutionPerformed':False,'resultOpeningAuthorized':False,'levelBAdmissionAuthorized':False,'holdoutOpened':False,'productionAuthorized':False,'taylorOrJerusalemUsed':False,'newMappingAuthorized':False})
          if [k for k,v in out.items() if k.endswith('ByByteExactCanonicalIdentity') and v is True]: raise SystemExit('V63 stale byte-exact identity claim')
          if out['exactSuppressedIds']!=manifest['exactSuppressedIds'] or out['exactSuppressedIds']!=executable: raise SystemExit('V63 receipt == manifest == executable B drift')
          Path('canonical-final-publisher-v2.yml').write_bytes(new)
          Path('canonical-final-publisher-v2.sha256').write_text(new_sha+'\n')
          Path('review-receipt-v63.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n')
          Path('v63-governance-fixtures.json').write_text(json.dumps({'schemaVersion':1,'sourcePublisherSha256':os.environ['V62_SOURCE_PUBLISHER_SHA256'],'correctedPublisherSha256':new_sha,'canonicalOwnKnownDefectAdvancedFrom':old_known,'canonicalOwnKnownDefectAdvancedTo':new_known,'addedExactSuppressedIds':added,'suppressionLedgerCardinality':68,'postmergeAwarePublisherBaseBindingCorrected':True,'actualCanonicalNotDeadOnArrivalAcrossPredecessorWindow':True,'freshLaterUnboundGovernanceFixturesRemainFatal':True,'materializedManifestForwardReplayExact':True,'materializedManifestReverseReplayExact':True,'runtimeScienceControlsPreservedByExactReversePatch':True,'v46DispatchRefRcSemanticsPreservedByExactReversePatch':True},sort_keys=True,indent=2)+'\n')
