          git fetch --no-tags origin "$V62_HEAD" "$P917_HEAD"
          test "$(git rev-parse "$V62_HEAD^{tree}")" = "$V62_TREE"
          test "$(git rev-parse "$V62_HEAD:$V62_PATH")" = "$V62_BLOB"
          set -- $(git rev-list --parents -n1 "$V62_HEAD")
          test "$#" -eq 2
          test "$2" = "$V62_BASE"
          test "$(git rev-parse "$P917_HEAD^{tree}")" = "$P917_TREE"
          test "$(git rev-parse "$P917_HEAD:$P917_PATH")" = "$P917_BLOB"
