name: Review AVPS Recovery4 ordinal45 final publisher governance v63

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v63.yml
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v3.yml

permissions: {contents: read, actions: read, issues: read, pull-requests: read}
concurrency:
  group: avps-v2-recovery4-ordinal45-final-publisher-governance-v63-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      REVIEWER_BASE_EXPECTED: 3d0f97a88bcd4923c19ec6f7e471aaa78c61656a
      INFRA_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-infrastructure-v63
      INFRA_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v63.yml
      PUBLISHER_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v3
      PUBLISHER_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v3.yml

      V62_PR: '916'
      V62_HEAD: b9057e296ec4f4ab9ae1e036bd8384d70a553483
      V62_BASE: 52cbcb69029360d938f66b79da5150bdcaed6231
      V62_TREE: 0b09bbfcf81e124777dd8c5163ea55d29ef40968
      V62_BLOB: 18875e439dac060d3b5b2dd7254351aaca80d547
      V62_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v62.yml
      V62_MERGE: 3d0f97a88bcd4923c19ec6f7e471aaa78c61656a
      V62_DEDICATED_RUN: '33756471674'
      V62_DEDICATED_JOB: '100651998803'
      V62_GENERIC_RUN: '33756471571'
      V62_GENERIC_JOB: '100651997095'
      V62_ARTIFACT: '9893645587'
      V62_ARTIFACT_NAME: avps-v2-recovery4-ordinal45-final-publisher-governance-review-v62
      V62_ARTIFACT_DIGEST: sha256:64b0e3b6c8065f54d0c1684aeed4a499bcbe40a23e4b48dfacdf4c60ab196a05
      V62_SOURCE_PUBLISHER_SHA256: f7509267f398ba1cc12ca450fc380feba36936e66e4d5e184a63dc6503f3e651
      V62_PRIMARY_ACCEPT: '5526651476'
      V62_BACKUP_ACCEPT: '5526651809'
      V62_POSTMERGE_RUN: '33767302658'
      V62_OLD_KNOWN_DEFECT: '5525310047'

      P917_PR: '917'
      P917_HEAD: 725e185ca2fce6930d159ec9dd0c695dd7f66d82
      P917_BASE: 3d0f97a88bcd4923c19ec6f7e471aaa78c61656a
      P917_TREE: e6de89a8f32825e2477904aff6160fa78bae82c6
      P917_BLOB: 87604021a5e48ea0a0d1c61b53871bf8530af97d
      P917_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v2.yml
      P917_DEDICATED_RUN: '33768984684'
      P917_DEDICATED_JOB: '100694029391'
      P917_GENERIC_RUN: '33768984813'
      P917_GENERIC_JOB: '100694030864'
      P917_DEFECT: '5527665281'

      V63_EXPECTED_PUBLISHER_SHA256: e806cc2b0a193f9af9d8d5ab3ad5069df3a3e99113e458a6d248ddde6cdf67da
