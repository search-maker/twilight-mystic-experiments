          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V66_DEDICATED_RUN/jobs?per_page=100" > v66dj.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V66_GENERIC_RUN" > v66g.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V66_GENERIC_RUN/jobs?per_page=100" > v66gj.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V66_DEDICATED_RUN/artifacts?per_page=100" > v66a.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/$V63_PR" > pr918.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V63_DEDICATED_RUN" > v63d.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V63_DEDICATED_RUN/jobs?per_page=100" > v63dj.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V63_GENERIC_RUN" > v63g.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V63_GENERIC_RUN/jobs?per_page=100" > v63gj.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V63_DEDICATED_RUN/artifacts?per_page=100" > v63a.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > comments.json

