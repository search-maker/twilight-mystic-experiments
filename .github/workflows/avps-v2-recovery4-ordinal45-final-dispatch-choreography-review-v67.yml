          old_ids=[int(x) for x in mo[0].split(',') if x]
          if old_ids!=sorted(old_ids) or len(old_ids)!=68 or len(set(old_ids))!=68: raise SystemExit('V63 canonical B68 drift')
          if receipt.get('exactSuppressedIds')!=old_ids or manifest63.get('exactSuppressedIds')!=old_ids: raise SystemExit('V63 receipt/manifest/executable B drift')
          added=[primary,backup]
          if any(x in old_ids for x in added) or primary>=backup: raise SystemExit('V67 defect ledger input drift')
          new_ids=sorted(old_ids+added)
          if len(new_ids)!=70 or len(set(new_ids))!=70: raise SystemExit('V67 final B70 drift')
          old_b='          B={'+','.join(map(str,old_ids))+'}'; new_b='          B={'+','.join(map(str,new_ids))+'}'
          old_file=os.environ['OLD_PUBLISHER_FILENAME']; new_file=os.environ['NEW_PUBLISHER_FILENAME']
          if oldtxt.count(old_file)!=3 or oldtxt.count(new_file)!=0: raise SystemExit('V63 publisher path identity shape drift')
          newtxt=oldtxt.replace(old_file,new_file).replace(old_k,new_k,1).replace(old_b,new_b,1)
          new=newtxt.encode(); new_sha=hashlib.sha256(new).hexdigest()
          if new_sha!=os.environ['EXPECTED_PUBLISHER_SHA256']: raise SystemExit('V67 intended canonical SHA drift')
          if newtxt.count(old_file)!=0 or newtxt.count(new_file)!=3: raise SystemExit('V67 publisher v3 identity multiplicity drift')
          expected_path='.github/workflows/'+new_file
          if f"PUBLISHER_WORKFLOW_PATH='{expected_path}'" not in newtxt: raise SystemExit('V67 publisher workflow path constant drift')
          endpoint=f"actions/workflows/{new_file}/runs?event=workflow_dispatch&per_page=100"
          if newtxt.count(endpoint)!=1: raise SystemExit('V67 publisher v3 run-inventory endpoint drift')

          manifest={'schemaVersion':6,'transition':'AVPS_V63_TO_V67_CANONICAL_PUBLISHER_V3_SELF_IDENTITY_WITH_V66_BIND_PROOF_FIX','sourceArtifact':int(os.environ['V63_ARTIFACT']),'sourceArtifactDigest':os.environ['V63_ARTIFACT_DIGEST'],'sourcePublisherSha256':os.environ['V63_SOURCE_PUBLISHER_SHA256'],'correctedPublisherSha256':new_sha,'liveCutoff':new_known,'oldKnownDefect':old_known,'knownDefect':new_known,'addedExactSuppressedIds':added,'exactSuppressedIds':new_ids,'suppressionLedgerCardinality':70,'publisherWorkflowFilenameBefore':old_file,'publisherWorkflowFilenameAfter':new_file,'patches':[{'id':'publisher-v3-runtime-self-identity','before':old_file,'after':new_file,'expectedBeforeCount':3,'expectedAfterCount':3},{'id':'canonical-known-defect-cutoff','before':old_k,'after':new_k,'expectedBeforeCount':1,'expectedAfterCount':1},{'id':'canonical-exact-suppression-ledger','before':old_b,'after':new_b,'expectedBeforeCount':1,'expectedAfterCount':1}],'materializedManifestForwardReplayRequired':True,'materializedManifestReverseReplayRequired':True,'boundedPathIdentityAndGovernancePatchOnly':True,'v66BindingProofOnlyCorrection':True}
          Path('v67-publisher-patch-manifest.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\n')
          materialized=json.loads(Path('v67-publisher-patch-manifest.json').read_text())
          if materialized!=manifest: raise SystemExit('materialized V67 manifest drift')
          def apply(data,direction):
