              for p in seq:
                  before=p['before'] if direction=='forward' else p['after']; after=p['after'] if direction=='forward' else p['before']
                  count=txt.count(before); expected=p['expectedBeforeCount'] if direction=='forward' else p['expectedAfterCount']
                  if count!=expected: raise SystemExit(direction+' manifest multiplicity '+p['id']+' got='+str(count)+' expected='+str(expected))
                  txt=txt.replace(before,after)
              return txt.encode()
          if apply(old,'forward')!=new or apply(new,'reverse')!=old: raise SystemExit('V67 materialized replay failed')

          a=newtxt.index('          import re\n          B={'); b=newtxt.index('          def state_check():',a)
          ns={}; exec(textwrap.dedent(newtxt[a:b]),ns); executable=sorted(int(x) for x in ns['B']); blocker=ns.get('avps_governance_blocker')
          if executable!=new_ids or not callable(blocker): raise SystemExit('V67 executable classifier/ledger drift')
          comments=[x for page in json.load(open('comments.json')) for x in page]; byid={int(x.get('id') or 0):x for x in comments}
          for cid in added:
