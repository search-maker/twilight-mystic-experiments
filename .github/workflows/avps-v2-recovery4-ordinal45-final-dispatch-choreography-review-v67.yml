          primary=owner_comment(os.environ['V63_PRIMARY_DEFECT'],'INDEPENDENT_AUDIT::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V63_PR918_PUBLISHER_V3_RUNTIME_IDENTITY_PATH_SELF_INVALIDATION')
          backup=owner_comment(os.environ['V63_BACKUP_DEFECT'],'BACKUP_INDEPENDENT_AUDIT::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V63_PR918_PUBLISHER_V3_CANONICAL_RUNTIME_PATH_IDENTITY_MISMATCH')
          for c in (primary,backup):
              body=str(c.get('body') or '')
              if os.environ['V63_SOURCE_PUBLISHER_SHA256'] not in body or 'publisher-v2.yml' not in body or 'publisher-v3.yml' not in body: raise SystemExit('V63 exact path-identity defect evidence drift')
          PY

          rm -rf v63-artifact
          mkdir v63-artifact
          gh run download "$V63_DEDICATED_RUN" -n "$V63_ARTIFACT_NAME" -D v63-artifact
          test "$(sha256sum v63-artifact/canonical-final-publisher-v2.yml | awk '{print $1}')" = "$V63_SOURCE_PUBLISHER_SHA256"
          test "$(tr -d '\r\n' < v63-artifact/canonical-final-publisher-v2.sha256)" = "$V63_SOURCE_PUBLISHER_SHA256"

      - name: Preserve intended canonical bytes and validate publisher v3 identity with isolated fixture
        shell: bash
        env:
