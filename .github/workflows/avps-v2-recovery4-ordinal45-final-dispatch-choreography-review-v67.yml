          if runtime.get('PUBLISHER_WORKFLOW_PATH')!=expected_path: raise SystemExit('V67 executable publisher path drift')
          if runtime['run_publisher_guard_fixtures']() is not True: raise SystemExit('V67 publisher guard fixtures failed')
          keys=('GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','GITHUB_EVENT_NAME','GITHUB_RUN_NUMBER','GITHUB_SHA','GITHUB_REF','GITHUB_REF_NAME','GITHUB_WORKFLOW_REF','GITHUB_REPOSITORY')
          saved={k:os.environ.get(k) for k in keys}
          try:
              os.environ.update({'GITHUB_RUN_ID':'1001','GITHUB_RUN_ATTEMPT':'1','GITHUB_EVENT_NAME':'workflow_dispatch','GITHUB_RUN_NUMBER':'7','GITHUB_SHA':'abc123','GITHUB_REF':'refs/heads/main','GITHUB_REF_NAME':'main','GITHUB_REPOSITORY':'search-maker/twilight-mystic-experiments','GITHUB_WORKFLOW_REF':'search-maker/twilight-mystic-experiments/'+expected_path+'@refs/heads/main'})
