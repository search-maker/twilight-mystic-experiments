          if steps.get('Bind immutable V65 failure and exact V63 source artifact')!='failure': raise SystemExit('V66 first failing step drift')
          if int(z('v66a.json').get('total_count') or 0)!=0 or z('v66a.json').get('artifacts'): raise SystemExit('V66 dedicated artifact unexpectedly exists')
