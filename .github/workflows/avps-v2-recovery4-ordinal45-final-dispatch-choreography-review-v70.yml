name: Review AVPS Recovery4 ordinal45 final publisher governance v70

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v70.yml
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v3.yml

permissions: {contents: read, actions: read, issues: read, pull-requests: read}
concurrency:
  group: avps-v2-recovery4-ordinal45-final-publisher-governance-v70-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      REVIEWER_BASE_EXPECTED: 868753d269d2641911b485e57cbc8c360b438da9
      INFRA_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-infrastructure-v70
      INFRA_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v70.yml
      PUBLISHER_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v3-v70
      PUBLISHER_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v3.yml

      V67_DEDICATED_RUN: '33775662821'
      V67_ARTIFACT: '9901458948'
      V67_ARTIFACT_NAME: avps-v2-recovery4-ordinal45-final-publisher-governance-review-v67
      V67_ARTIFACT_DIGEST: sha256:e80e11ec84e3bdeefbba4547b0e4de7abc6b087c84351b03d4081a5fca90cf86
      V67_CANONICAL_SHA256: 11e56b376ce5da3cb87f9d6cb741405bbc48c6bb58f47546b487d935ebe485a1
      V67_CANDIDATE_NOTICE: '5528455600'
      V67_PRIMARY_ACCEPT: '5528575634'
      V67_BACKUP_ACCEPT: '5528609190'
      P923_DEFECT: '5529215910'
      P924_DEFECT: '5529323586'

      P925_PR: '925'
      P925_HEAD: 0378113b326ae2b14753fbdd8367d2c40870850f
      P925_BASE: 868753d269d2641911b485e57cbc8c360b438da9
      P925_TREE: 9c761799ffe859de94f4bb9809efdd16c2822ffd
      P925_BLOB: 681c7ae74bb94cc5fa057038b62e88f75186fe58
      P925_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v69.yml
      P925_DEDICATED_RUN: '33783295020'
      P925_DEDICATED_JOB: '100741918133'
      P925_GENERIC_RUN: '33783294983'
      P925_GENERIC_JOB: '100741917777'
      P925_DEFECT: '5529420535'

      SOURCE_KNOWN_DEFECT: '5527905971'
      NEW_KNOWN_DEFECT: '5529420535'
      SOURCE_LEDGER_CARDINALITY: '70'
      NEW_LEDGER_CARDINALITY: '74'
      DISPATCH_BRANCH: dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-ordinal-45
      CONSUMED_MARKER: ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_DISPATCH_CONSUMED
      SCIENCE_WORKFLOW: avps-v2-postconsumption-recovery4-science.yml

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}

      - name: Bind immutable V69 failure and exact V67 source artifact
        id: mode
        shell: bash
        env:
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$EVENT_ACTION" = opened
          if [ "$EVENT_BRANCH" = "$INFRA_BRANCH" ]; then
            MODE=reviewer; EXPECT_PATH="$INFRA_PATH"; DIFF_BASE="$REVIEWER_BASE_EXPECTED"
            test "$EVENT_BASE" = "$REVIEWER_BASE_EXPECTED"
          elif [ "$EVENT_BRANCH" = "$PUBLISHER_BRANCH" ]; then
            MODE=publisher; EXPECT_PATH="$PUBLISHER_PATH"; DIFF_BASE="$EVENT_BASE"
            set -- $(git rev-list --parents -n1 "$EVENT_BASE")
            test "$#" -eq 3
            test "$2" = "$REVIEWER_BASE_EXPECTED"
            REVIEWER_HEAD="$3"
            set -- $(git rev-list --parents -n1 "$REVIEWER_HEAD")
            test "$#" -eq 2
            test "$2" = "$REVIEWER_BASE_EXPECTED"
            expected_reviewer_status=$(printf 'A\t%s' "$INFRA_PATH")
            test "$(git diff --name-status "$REVIEWER_BASE_EXPECTED" "$REVIEWER_HEAD")" = "$expected_reviewer_status"
            test "$(git rev-parse "$EVENT_BASE:$INFRA_PATH")" = "$(git rev-parse "$REVIEWER_HEAD:$INFRA_PATH")"
          else
            echo 'unexpected V70 branch' >&2; exit 1
          fi
          set -- $(git rev-list --parents -n1 "$EVENT_HEAD")
          test "$#" -eq 2
          test "$2" = "$DIFF_BASE"
          expected_status=$(printf 'A\t%s' "$EXPECT_PATH")
          test "$(git diff --name-status "$DIFF_BASE" "$EVENT_HEAD")" = "$expected_status"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

          git fetch --no-tags origin 8beed30b3d0d3d3c1656cc2d7a4de9bc6666e97e "$P925_HEAD"
          git show 8beed30b3d0d3d3c1656cc2d7a4de9bc6666e97e:"$PUBLISHER_PATH" > source-publisher-v3.yml
          test "$(sha256sum source-publisher-v3.yml | awk '{print $1}')" = "$V67_CANONICAL_SHA256"
          test "$(git rev-parse "$P925_HEAD^{tree}")" = "$P925_TREE"
          test "$(git rev-parse "$P925_HEAD:$P925_PATH")" = "$P925_BLOB"
          set -- $(git rev-list --parents -n1 "$P925_HEAD")
          test "$#" -eq 2
          test "$2" = "$P925_BASE"
          test "$(git diff --name-only "$P925_BASE" "$P925_HEAD")" = "$P925_PATH"

          gh api "repos/$GITHUB_REPOSITORY/pulls/$P925_PR" > p925.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$P925_DEDICATED_RUN" > p925d.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$P925_DEDICATED_RUN/jobs?per_page=100" > p925dj.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$P925_GENERIC_RUN" > p925g.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$P925_GENERIC_RUN/jobs?per_page=100" > p925gj.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$P925_DEDICATED_RUN/artifacts?per_page=100" > p925a.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V67_DEDICATED_RUN/artifacts?per_page=100" > v67a.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > comments.json
          gh run view "$P925_DEDICATED_RUN" --log > p925-dedicated.log

          python - <<'PY'
          import json,os
          z=lambda p:json.load(open(p))
          C=[x for page in z('comments.json') for x in page]
          def owner_comment(cid,prefix):
              q=[x for x in C if int(x.get('id') or 0)==int(cid)]
              if len(q)!=1 or not str(q[0].get('body') or '').startswith(prefix): raise SystemExit('Issue60 binding '+str(cid))
              u=q[0].get('user') or {}
              if u.get('login')!='search-maker' or int(u.get('id') or 0)!=304153003 or q[0].get('author_association')!='OWNER': raise SystemExit('Issue60 author identity '+str(cid))
              return q[0]
          p=z('p925.json')
          if p.get('state')!='closed' or p.get('merged_at') is not None or p['head']['sha']!=os.environ['P925_HEAD'] or p['base']['sha']!=os.environ['P925_BASE'] or p.get('draft') is not False: raise SystemExit('PR925 rejected identity drift')
          d=z('p925d.json'); g=z('p925g.json')
          if d['head_sha']!=os.environ['P925_HEAD'] or d['run_attempt']!=1 or d.get('conclusion')!='failure': raise SystemExit('PR925 dedicated drift')
          if g['head_sha']!=os.environ['P925_HEAD'] or g['run_attempt']!=1 or g.get('conclusion')!='success': raise SystemExit('PR925 generic drift')
          dj=[x for x in z('p925dj.json').get('jobs',[]) if int(x.get('id') or 0)==int(os.environ['P925_DEDICATED_JOB'])]
          gj=[x for x in z('p925gj.json').get('jobs',[]) if int(x.get('id') or 0)==int(os.environ['P925_GENERIC_JOB'])]
          if len(dj)!=1 or dj[0].get('conclusion')!='failure': raise SystemExit('PR925 dedicated job drift')
          if len(gj)!=1 or gj[0].get('conclusion')!='success': raise SystemExit('PR925 generic job drift')
          ds={x.get('name'):x.get('conclusion') for x in dj[0].get('steps',[])}
          if ds.get('Bind immutable V68 failure and exact V67 source artifact')!='success': raise SystemExit('PR925 predecessor bind did not pass')
          if ds.get('Regenerate exact V69 canonical and prove live governance')!='failure': raise SystemExit('PR925 dedicated first invalid step drift')
          if int(z('p925a.json').get('total_count') or 0)!=0 or z('p925a.json').get('artifacts'): raise SystemExit('PR925 dedicated artifact unexpectedly exists')
          aa=[x for x in z('v67a.json').get('artifacts',[]) if int(x.get('id') or 0)==int(os.environ['V67_ARTIFACT'])]
          if len(aa)!=1 or aa[0].get('name')!=os.environ['V67_ARTIFACT_NAME'] or aa[0].get('expired') is True or aa[0].get('digest')!=os.environ['V67_ARTIFACT_DIGEST']: raise SystemExit('V67 source artifact drift')
          owner_comment(os.environ['V67_CANDIDATE_NOTICE'],'CANDIDATE_NOTICE::AVPS_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V67_PR922_BOTH_ATTEMPT1_GATES_TERMINAL_SUCCESS_NON_AUTHORIZING')
          owner_comment(os.environ['V67_PRIMARY_ACCEPT'],'INDEPENDENT_AUDIT::ACCEPT_AVPS_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V67_PR922')
          owner_comment(os.environ['V67_BACKUP_ACCEPT'],'BACKUP_INDEPENDENT_AUDIT::ACCEPT_AVPS_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V67_PR922')
          owner_comment(os.environ['P923_DEFECT'],'ATMOSPHERE_IMPLEMENTATION_DEFECT::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_PUBLISHER_V3_PR923_V67_CANONICAL_CANDIDATE_NOTICE_SELF_BLOCK')
          owner_comment(os.environ['P924_DEFECT'],'ATMOSPHERE_IMPLEMENTATION_DEFECT::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V68_PR924_HARNESS_IDENTITY_CARDINALITY')
          owner_comment(os.environ['P925_DEFECT'],'ATMOSPHERE_IMPLEMENTATION_DEFECT::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V69_PR925_BRITTLE_LITERAL_PATH_CARDINALITY')
          PY
          grep -Fq 'publisher-v3 exact identity surface cardinality drift' p925-dedicated.log

          rm -rf v67-artifact
          mkdir v67-artifact
          gh run download "$V67_DEDICATED_RUN" -n "$V67_ARTIFACT_NAME" -D v67-artifact
          test "$(sha256sum v67-artifact/canonical-final-publisher-v3.yml | awk '{print $1}')" = "$V67_CANONICAL_SHA256"
          cmp -s source-publisher-v3.yml v67-artifact/canonical-final-publisher-v3.yml

      - name: Regenerate exact V70 canonical and prove semantic publisher identity
        shell: bash
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,re,subprocess,textwrap
          from pathlib import Path
          source=Path('source-publisher-v3.yml').read_bytes()
          if hashlib.sha256(source).hexdigest()!=os.environ['V67_CANONICAL_SHA256']: raise SystemExit('V70 source SHA drift')
          src=source.decode()
          old_known=int(os.environ['SOURCE_KNOWN_DEFECT']); new_known=int(os.environ['NEW_KNOWN_DEFECT'])
          additions=[int(os.environ['V67_CANDIDATE_NOTICE']),int(os.environ['P923_DEFECT']),int(os.environ['P924_DEFECT']),int(os.environ['P925_DEFECT'])]
          old_line=f'          KNOWN_DEFECT={old_known}'
          if src.count(old_line)!=1: raise SystemExit('V70 source KNOWN_DEFECT cardinality drift')
          m=re.search(r'(?m)^          B=\{([0-9,]+)\}$',src)
          if not m: raise SystemExit('V70 source executable B line missing')
          old_ids=[int(x) for x in m.group(1).split(',') if x]
          if old_ids!=sorted(set(old_ids)) or len(old_ids)!=int(os.environ['SOURCE_LEDGER_CARDINALITY']): raise SystemExit('V70 source B70 drift')
          if any(x in old_ids for x in additions): raise SystemExit('V70 additions already present')
          new_ids=sorted(old_ids+additions)
          if len(new_ids)!=int(os.environ['NEW_LEDGER_CARDINALITY']): raise SystemExit('V70 B74 cardinality drift')
          corrected=src.replace(old_line,f'          KNOWN_DEFECT={new_known}').replace(m.group(0),'          B={'+','.join(map(str,new_ids))+'}')
          src_lines=src.splitlines(keepends=True); dst_lines=corrected.splitlines(keepends=True)
          if len(src_lines)!=len(dst_lines): raise SystemExit('V70 line-count drift')
          if len([1 for a,b in zip(src_lines,dst_lines) if a!=b])!=2: raise SystemExit('V70 must alter exactly cutoff and B lines')
          out=corrected.encode(); sha=hashlib.sha256(out).hexdigest()
          Path('canonical-final-publisher-v3.yml').write_bytes(out)
          Path('canonical-final-publisher-v3.sha256').write_text(sha+'\n')
          manifest={'schemaVersion':70,'sourcePublisherSha256':hashlib.sha256(source).hexdigest(),'correctedPublisherSha256':sha,'sourceKnownDefect':old_known,'correctedKnownDefect':new_known,'sourceSuppressionLedgerCardinality':len(old_ids),'correctedSuppressionLedgerCardinality':len(new_ids),'exactAddedSuppressedIds':additions,'exactSuppressedIds':new_ids,'transformations':[{'kind':'knownDefect','old':old_known,'new':new_known},{'kind':'suppressionLedgerAdd','ids':additions}]}
          Path('v70-publisher-patch-manifest.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\n')
          material=json.load(open('v70-publisher-patch-manifest.json'))
          def replay(raw,reverse=False):
              t=raw.decode(); a=material['exactAddedSuppressedIds']
              if reverse:
                  frm=material['correctedKnownDefect']; to=material['sourceKnownDefect']; expected=material['exactSuppressedIds']; target=[x for x in expected if x not in a]
              else:
                  frm=material['sourceKnownDefect']; to=material['correctedKnownDefect']; expected=[x for x in material['exactSuppressedIds'] if x not in a]; target=material['exactSuppressedIds']
              k=f'          KNOWN_DEFECT={frm}'
              if t.count(k)!=1: raise SystemExit('materialized replay cutoff drift')
              mm=re.search(r'(?m)^          B=\{([0-9,]+)\}$',t)
              if not mm: raise SystemExit('materialized replay B missing')
              ids=[int(x) for x in mm.group(1).split(',') if x]
              if ids!=expected: raise SystemExit('materialized replay source ledger mismatch')
              return t.replace(k,f'          KNOWN_DEFECT={to}').replace(mm.group(0),'          B={'+','.join(map(str,target))+'}').encode()
          if replay(source)!=out: raise SystemExit('V70 materialized forward replay mismatch')
          if replay(out,True)!=source: raise SystemExit('V70 materialized reverse replay mismatch')

          a=corrected.index('          import re\n          B={'); b=corrected.index('          def state_check():',a)
          ns={}; exec(textwrap.dedent(corrected[a:b]),ns)
          B=sorted(int(x) for x in ns['B']); blocker=ns['avps_governance_blocker']
          if B!=new_ids: raise SystemExit('V70 executable B != materialized B')
          if f'          KNOWN_DEFECT={new_known}' not in corrected: raise SystemExit('V70 executable cutoff drift')

          v3='.github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v3.yml'
          semantic_anchors={
            'fixture': "'workflow_path':'.github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v3.yml'",
            'assignment': "PUBLISHER_WORKFLOW_PATH='.github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v3.yml'",
            'inventory': 'actions/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v3.yml/runs?event=workflow_dispatch&per_page=100',
            'workflowRefConstruction': 'expected_workflow_ref=f"{os.environ[\'GITHUB_REPOSITORY\']}/{PUBLISHER_WORKFLOW_PATH}@{os.environ[\'GITHUB_REF\']}"',
            'expectedWorkflowPathReturn': "'workflow_path':PUBLISHER_WORKFLOW_PATH",
          }
          for name,anchor in semantic_anchors.items():
              if corrected.count(anchor)!=1: raise SystemExit('publisher-v3 semantic identity anchor drift '+name)
          if 'avps-v2-recovery4-ordinal45-final-dispatch-publisher-v2.yml' in corrected: raise SystemExit('publisher-v2 identity residue')
          if corrected.count('RUNTIME_GUARD_RESULT=run_real_publisher_runtime_guard()')!=1: raise SystemExit('runtime guard eager wiring drift')

          def gh_pages(endpoint):
              cp=subprocess.run(['/usr/bin/gh','api','--hostname','github.com','--paginate','--slurp',endpoint],capture_output=True,text=True)
              if cp.returncode!=0: raise SystemExit('gh api failure '+cp.stderr.strip())
              x=json.loads(cp.stdout)
              if not isinstance(x,list): raise SystemExit('pagination shape drift')
              return x
          C=[c for page in gh_pages(f"repos/{os.environ['GITHUB_REPOSITORY']}/issues/60/comments?per_page=100") for c in page]
          byid={int(c.get('id') or 0):c for c in C}
          bound=[int(os.environ[k]) for k in ('V67_CANDIDATE_NOTICE','P923_DEFECT','P924_DEFECT','P925_DEFECT')]
          for cid in bound:
              if cid not in byid: raise SystemExit('bound Issue60 comment disappeared '+str(cid))
              body=str(byid[cid].get('body') or '')
              if blocker(body,cid): raise SystemExit('exact predecessor suppression failed '+str(cid))
              if not blocker(body,new_known+1000000+cid): raise SystemExit('bound predecessor not intrinsically fatal '+str(cid))
          fixtures={}
          for name,body in {'freshConfirmedDefect':'CONFIRMED_DEFECT AVPS_X','freshMaterialRisk':'MATERIAL_RISK AVPS_X','freshFailClosed':'FAIL_CLOSED AVPS_X','freshDirectiveBlocker':'DIRECTIVE: BLOCKER AVPS_X','incidentalBlocker':'AVPS narrative mentions blocker only'}.items(): fixtures[name]=bool(blocker(body,new_known+4000000))
          if not all(fixtures[k] for k in ('freshConfirmedDefect','freshMaterialRisk','freshFailClosed','freshDirectiveBlocker')) or fixtures['incidentalBlocker']: raise SystemExit('V70 classifier adversarial fixture drift')
          for c in C:
              cid=int(c.get('id') or 0)
              if cid>new_known and blocker(str(c.get('body') or ''),cid): raise SystemExit('newer unbound AVPS governance blocker '+str(cid))

          closed=set(); begins=[]
          for c in C:
              body=str(c.get('body') or '').strip(); first=body.splitlines()[0] if body else ''; fields={}
              for tok in first.replace('|',' ').split():
                  if '=' in tok:
                      k,v=tok.split('=',1); fields.setdefault(k,[]).append(v)
              if first.startswith('WRITE_QUIET_END'):
                  vals=[]
                  for key in ('begin','beginComment','begin_comment'):
                      for v in fields.get(key,[]):
                          if not v.isdigit(): raise SystemExit('non-numeric WRITE_QUIET_END alias')
                          vals.append(int(v))
                  if len(set(vals))>1: raise SystemExit('conflicting WRITE_QUIET_END aliases')
                  if vals: closed.add(vals[0])
              elif first.startswith('WRITE_QUIET_BEGIN'): begins.append(int(c['id']))
          if [x for x in begins if x not in closed]: raise SystemExit('unmatched WRITE_QUIET_BEGIN')
          if any(str(c.get('body') or '').strip().startswith(os.environ['CONSUMED_MARKER']) for c in C): raise SystemExit('ordinal45 consumed marker exists')
          ref=subprocess.run(['/usr/bin/git','ls-remote','--exit-code','--heads','origin',os.environ['DISPATCH_BRANCH']],capture_output=True,text=True)
          if ref.returncode==0: raise SystemExit('ordinal45 dispatch ref exists')
          if ref.returncode!=2: raise SystemExit('dispatch ref read failure rc='+str(ref.returncode))
          science=[r for page in gh_pages(f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/{os.environ['SCIENCE_WORKFLOW']}/runs?event=workflow_dispatch&per_page=100") for r in page.get('workflow_runs',[])]
          if science: raise SystemExit('ordinal45 science workflow_dispatch already exists '+repr([r.get('id') for r in science]))

          receipt={'schemaVersion':70,'mode':os.environ['MODE'],'sourcePublisherSha256':material['sourcePublisherSha256'],'correctedPublisherSha256':sha,'sourceKnownDefect':old_known,'knownDefect':new_known,'exactSuppressedIds':new_ids,'exactAddedSuppressedIds':additions,'materializedForwardReplayExact':True,'materializedReverseReplayExact':True,'publisherV3SemanticIdentityAnchors':semantic_anchors,'runtimeScienceControlsPreservedByExactReversePatch':True,'v46DispatchRefRcSemanticsPreservedByExactReversePatch':True,'dispatchCreated':False,'consumedMarkerCreated':False,'workflowDispatchPerformed':False,'solverExecutionPerformed':False,'resultOpeningAuthorized':False,'levelBAdmissionAuthorized':False,'holdoutOpened':False,'productionAuthorized':False,'taylorOrJerusalemUsed':False,'newMappingAuthorized':False}
          Path('review-receipt-v70.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          Path('v70-governance-fixtures.json').write_text(json.dumps({'classifierFixtures':fixtures,'boundPredecessorsIntrinsicFatalAndExactSuppressed':True,'publisherV3SemanticIdentityAnchorsExact':True},sort_keys=True,indent=2)+'\n')
          if json.load(open('review-receipt-v70.json'))['exactSuppressedIds']!=json.load(open('v70-publisher-patch-manifest.json'))['exactSuppressedIds'] or new_ids!=B: raise SystemExit('receipt==manifest==executable B mismatch')
          if os.environ['MODE']=='publisher':
              installed=Path(os.environ['PUBLISHER_PATH']).read_bytes()
              if installed!=out: raise SystemExit('future publisher file is not byte-exact V70 canonical')
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: avps-v2-recovery4-ordinal45-final-publisher-governance-review-v70
          path: |
            review-receipt-v70.json
            canonical-final-publisher-v3.yml
            canonical-final-publisher-v3.sha256
            v70-publisher-patch-manifest.json
            v70-governance-fixtures.json
          if-no-files-found: error
