name: Review AVPS Recovery4 ordinal45 final publisher governance v71

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v71.yml
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v3.yml

permissions: {contents: read, actions: read, issues: read, pull-requests: read}
concurrency:
  group: avps-v2-recovery4-ordinal45-final-publisher-governance-v71-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      REVIEWER_BASE_EXPECTED: 868753d269d2641911b485e57cbc8c360b438da9
      INFRA_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-infrastructure-v71
      INFRA_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v71.yml
      PUBLISHER_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v3-v71
      PUBLISHER_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v3.yml

      P926_PR: '926'
      P926_HEAD: 49c6fb469392e2b2c6cdbc421d7c1a2a4c12e6d8
      P926_BASE: 868753d269d2641911b485e57cbc8c360b438da9
      P926_TREE: 9a23c969abb0212c2271b42a86efb10be37044a5
      P926_BLOB: b0f1c39b19436ec93aa43f5a3f8287b94004a550
      P926_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-choreography-review-v70.yml
      P926_DEDICATED_RUN: '33783922946'
      P926_DEDICATED_JOB: '100743993145'
      P926_GENERIC_RUN: '33783922871'
      P926_GENERIC_JOB: '100743992732'
      P926_ARTIFACT: '9904668161'
      P926_ARTIFACT_NAME: avps-v2-recovery4-ordinal45-final-publisher-governance-review-v70
      P926_ARTIFACT_DIGEST: sha256:0b9eb6ad8ad9e5be4c5b7fa586eb9f526b1594dd779ca680a8f92386d0020afb
      V70_CANDIDATE_NOTICE: '5529574679'
      V70_BACKUP_ACCEPT: '5529617598'
      V70_PRIMARY_DEFECT: '5529629185'

      SOURCE_CANONICAL_SHA256: 47b54043975a9f63184c5135c991991e2a63cdbaabd366270009259c497305f3
      EXPECTED_CANONICAL_SHA256: 9b61da35e7eee5e2db057e17ac2f81cbc5bfa006fab5142feada3095f62f83d8
      SOURCE_KNOWN_DEFECT: '5529420535'
      NEW_KNOWN_DEFECT: '5529629185'
      SOURCE_LEDGER_CARDINALITY: '74'
      NEW_LEDGER_CARDINALITY: '76'
      DISPATCH_BRANCH: dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-ordinal-45
      CONSUMED_MARKER: ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_DISPATCH_CONSUMED
      SCIENCE_WORKFLOW: avps-v2-postconsumption-recovery4-science.yml

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}

      - name: Bind rejected V70 evidence and exact V70 artifact
        id: mode
        shell: bash
        env:
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$EVENT_ACTION" = opened
          if [ "$EVENT_BRANCH" = "$INFRA_BRANCH" ]; then
            MODE=reviewer; EXPECT_PATH="$INFRA_PATH"; DIFF_BASE="$REVIEWER_BASE_EXPECTED"
            test "$EVENT_BASE" = "$REVIEWER_BASE_EXPECTED"
          elif [ "$EVENT_BRANCH" = "$PUBLISHER_BRANCH" ]; then
            MODE=publisher; EXPECT_PATH="$PUBLISHER_PATH"; DIFF_BASE="$EVENT_BASE"
            set -- $(git rev-list --parents -n1 "$EVENT_BASE")
            test "$#" -eq 3
            test "$2" = "$REVIEWER_BASE_EXPECTED"
            REVIEWER_HEAD="$3"
            set -- $(git rev-list --parents -n1 "$REVIEWER_HEAD")
            test "$#" -eq 2
            test "$2" = "$REVIEWER_BASE_EXPECTED"
            expected_reviewer_status=$(printf 'A\t%s' "$INFRA_PATH")
            test "$(git diff --name-status "$REVIEWER_BASE_EXPECTED" "$REVIEWER_HEAD")" = "$expected_reviewer_status"
            test "$(git rev-parse "$EVENT_BASE:$INFRA_PATH")" = "$(git rev-parse "$REVIEWER_HEAD:$INFRA_PATH")"
          else
            echo 'unexpected V71 branch' >&2; exit 1
          fi
          set -- $(git rev-list --parents -n1 "$EVENT_HEAD")
          test "$#" -eq 2
          test "$2" = "$DIFF_BASE"
          expected_status=$(printf 'A\t%s' "$EXPECT_PATH")
          test "$(git diff --name-status "$DIFF_BASE" "$EVENT_HEAD")" = "$expected_status"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

          git fetch --no-tags origin "$P926_HEAD"
          test "$(git rev-parse "$P926_HEAD^{tree}")" = "$P926_TREE"
          test "$(git rev-parse "$P926_HEAD:$P926_PATH")" = "$P926_BLOB"
          set -- $(git rev-list --parents -n1 "$P926_HEAD")
          test "$#" -eq 2
          test "$2" = "$P926_BASE"
          test "$(git diff --name-only "$P926_BASE" "$P926_HEAD")" = "$P926_PATH"

          gh api "repos/$GITHUB_REPOSITORY/pulls/$P926_PR" > p926.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$P926_DEDICATED_RUN" > p926d.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$P926_DEDICATED_RUN/jobs?per_page=100" > p926dj.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$P926_GENERIC_RUN" > p926g.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$P926_GENERIC_RUN/jobs?per_page=100" > p926gj.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$P926_DEDICATED_RUN/artifacts?per_page=100" > p926a.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > comments.json

          python - <<'PY'
          import json,os
          z=lambda p:json.load(open(p))
          C=[x for page in z('comments.json') for x in page]
          def owner_comment(cid,prefix):
              q=[x for x in C if int(x.get('id') or 0)==int(cid)]
              if len(q)!=1 or not str(q[0].get('body') or '').startswith(prefix): raise SystemExit('Issue60 binding '+str(cid))
              u=q[0].get('user') or {}
              if u.get('login')!='search-maker' or int(u.get('id') or 0)!=304153003 or q[0].get('author_association')!='OWNER': raise SystemExit('Issue60 author identity '+str(cid))
              return q[0]
          p=z('p926.json')
          if p.get('state')!='closed' or p.get('merged_at') is not None or p['head']['sha']!=os.environ['P926_HEAD'] or p['base']['sha']!=os.environ['P926_BASE'] or p.get('draft') is not False: raise SystemExit('PR926 rejected identity drift')
          d=z('p926d.json'); g=z('p926g.json')
          if d['head_sha']!=os.environ['P926_HEAD'] or d['run_attempt']!=1 or d.get('conclusion')!='success': raise SystemExit('PR926 dedicated drift')
          if g['head_sha']!=os.environ['P926_HEAD'] or g['run_attempt']!=1 or g.get('conclusion')!='success': raise SystemExit('PR926 generic drift')
          dj=[x for x in z('p926dj.json').get('jobs',[]) if int(x.get('id') or 0)==int(os.environ['P926_DEDICATED_JOB'])]
          gj=[x for x in z('p926gj.json').get('jobs',[]) if int(x.get('id') or 0)==int(os.environ['P926_GENERIC_JOB'])]
          if len(dj)!=1 or dj[0].get('conclusion')!='success': raise SystemExit('PR926 dedicated job drift')
          if len(gj)!=1 or gj[0].get('conclusion')!='success': raise SystemExit('PR926 generic job drift')
          aa=[x for x in z('p926a.json').get('artifacts',[]) if int(x.get('id') or 0)==int(os.environ['P926_ARTIFACT'])]
          if len(aa)!=1 or aa[0].get('name')!=os.environ['P926_ARTIFACT_NAME'] or aa[0].get('expired') is True or aa[0].get('digest')!=os.environ['P926_ARTIFACT_DIGEST']: raise SystemExit('V70 artifact drift')
          owner_comment(os.environ['V70_CANDIDATE_NOTICE'],'CANDIDATE_NOTICE::AVPS_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V70_PR926_BOTH_ATTEMPT1_GATES_TERMINAL_SUCCESS_NON_AUTHORIZING')
          owner_comment(os.environ['V70_BACKUP_ACCEPT'],'BACKUP_INDEPENDENT_AUDIT::ACCEPT_AVPS_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V70_PR926')
          owner_comment(os.environ['V70_PRIMARY_DEFECT'],'INDEPENDENT_AUDIT::CONFIRMED_DEFECT AVPS_ORDINAL45_FINAL_PUBLISHER_GOVERNANCE_REVIEW_V70_PR926_FRESH_BACKUP_ACCEPTANCE_SELF_BLOCK')
          PY

          rm -rf v70-artifact
          mkdir v70-artifact
          gh run download "$P926_DEDICATED_RUN" -n "$P926_ARTIFACT_NAME" -D v70-artifact
          test "$(sha256sum v70-artifact/canonical-final-publisher-v3.yml | awk '{print $1}')" = "$SOURCE_CANONICAL_SHA256"

      - name: Regenerate exact V71 canonical and prove live governance
        shell: bash
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,re,subprocess,textwrap
          from pathlib import Path
          source=Path('v70-artifact/canonical-final-publisher-v3.yml').read_bytes()
          if hashlib.sha256(source).hexdigest()!=os.environ['SOURCE_CANONICAL_SHA256']: raise SystemExit('V71 source SHA drift')
          src=source.decode()
          old_known=int(os.environ['SOURCE_KNOWN_DEFECT']); new_known=int(os.environ['NEW_KNOWN_DEFECT'])
          additions=[int(os.environ['V70_BACKUP_ACCEPT']),int(os.environ['V70_PRIMARY_DEFECT'])]
          old_line=f'          KNOWN_DEFECT={old_known}'
          if src.count(old_line)!=1: raise SystemExit('V71 source KNOWN_DEFECT cardinality drift')
          m=re.search(r'(?m)^          B=\{([0-9,]+)\}$',src)
          if not m: raise SystemExit('V71 source executable B line missing')
          old_ids=[int(x) for x in m.group(1).split(',') if x]
          if old_ids!=sorted(set(old_ids)) or len(old_ids)!=int(os.environ['SOURCE_LEDGER_CARDINALITY']): raise SystemExit('V71 source B74 drift')
          if any(x in old_ids for x in additions): raise SystemExit('V71 additions already present')
          if int(os.environ['V70_CANDIDATE_NOTICE']) in old_ids: raise SystemExit('nonblocking V70 candidate must not be suppressed')
          new_ids=sorted(old_ids+additions)
          if len(new_ids)!=int(os.environ['NEW_LEDGER_CARDINALITY']): raise SystemExit('V71 B76 cardinality drift')
          corrected=src.replace(old_line,f'          KNOWN_DEFECT={new_known}').replace(m.group(0),'          B={'+','.join(map(str,new_ids))+'}')
          src_lines=src.splitlines(keepends=True); dst_lines=corrected.splitlines(keepends=True)
          if len(src_lines)!=len(dst_lines) or len([1 for a,b in zip(src_lines,dst_lines) if a!=b])!=2: raise SystemExit('V71 must alter exactly cutoff and B lines')
          out=corrected.encode(); sha=hashlib.sha256(out).hexdigest()
          if sha!=os.environ['EXPECTED_CANONICAL_SHA256']: raise SystemExit('V71 canonical SHA drift '+sha)
          Path('canonical-final-publisher-v3.yml').write_bytes(out)
          Path('canonical-final-publisher-v3.sha256').write_text(sha+'\n')
          manifest={'schemaVersion':71,'sourcePublisherSha256':hashlib.sha256(source).hexdigest(),'correctedPublisherSha256':sha,'sourceKnownDefect':old_known,'correctedKnownDefect':new_known,'sourceSuppressionLedgerCardinality':len(old_ids),'correctedSuppressionLedgerCardinality':len(new_ids),'exactAddedSuppressedIds':additions,'exactSuppressedIds':new_ids,'transformations':[{'kind':'knownDefect','old':old_known,'new':new_known},{'kind':'suppressionLedgerAdd','ids':additions}]}
          Path('v71-publisher-patch-manifest.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\n')
          material=json.load(open('v71-publisher-patch-manifest.json'))
          def replay(raw,reverse=False):
              t=raw.decode(); a=material['exactAddedSuppressedIds']
              if reverse:
                  frm=material['correctedKnownDefect']; to=material['sourceKnownDefect']; expected=material['exactSuppressedIds']; target=[x for x in expected if x not in a]
              else:
                  frm=material['sourceKnownDefect']; to=material['correctedKnownDefect']; expected=[x for x in material['exactSuppressedIds'] if x not in a]; target=material['exactSuppressedIds']
              k=f'          KNOWN_DEFECT={frm}'
              if t.count(k)!=1: raise SystemExit('materialized replay cutoff drift')
              mm=re.search(r'(?m)^          B=\{([0-9,]+)\}$',t)
              if not mm: raise SystemExit('materialized replay B missing')
              ids=[int(x) for x in mm.group(1).split(',') if x]
              if ids!=expected: raise SystemExit('materialized replay source ledger mismatch')
              return t.replace(k,f'          KNOWN_DEFECT={to}').replace(mm.group(0),'          B={'+','.join(map(str,target))+'}').encode()
          if replay(source)!=out: raise SystemExit('V71 materialized forward replay mismatch')
          if replay(out,True)!=source: raise SystemExit('V71 materialized reverse replay mismatch')

          a=corrected.index('          import re\n          B={'); b=corrected.index('          def state_check():',a)
          ns={}; exec(textwrap.dedent(corrected[a:b]),ns)
          B=sorted(int(x) for x in ns['B']); blocker=ns['avps_governance_blocker']
          if B!=new_ids: raise SystemExit('V71 executable B != materialized B')
          if f'          KNOWN_DEFECT={new_known}' not in corrected: raise SystemExit('V71 executable cutoff drift')

          v3='.github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v3.yml'
          semantic_anchors={
            'fixture': "'workflow_path':'.github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v3.yml'",
            'assignment': "PUBLISHER_WORKFLOW_PATH='.github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v3.yml'",
            'inventory': 'actions/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v3.yml/runs?event=workflow_dispatch&per_page=100',
            'workflowRefConstruction': 'expected_workflow_ref=f"{os.environ[\'GITHUB_REPOSITORY\']}/{PUBLISHER_WORKFLOW_PATH}@{os.environ[\'GITHUB_REF\']}"',
            'expectedWorkflowPathReturn': "'workflow_path':PUBLISHER_WORKFLOW_PATH",
          }
          for name,anchor in semantic_anchors.items():
              if corrected.count(anchor)!=1: raise SystemExit('publisher-v3 semantic identity anchor drift '+name)
          if 'avps-v2-recovery4-ordinal45-final-dispatch-publisher-v2.yml' in corrected: raise SystemExit('publisher-v2 identity residue')
          if corrected.count('RUNTIME_GUARD_RESULT=run_real_publisher_runtime_guard()')!=1: raise SystemExit('runtime guard eager wiring drift')

          def gh_pages(endpoint):
              cp=subprocess.run(['/usr/bin/gh','api','--hostname','github.com','--paginate','--slurp',endpoint],capture_output=True,text=True)
              if cp.returncode!=0: raise SystemExit('gh api failure '+cp.stderr.strip())
              x=json.loads(cp.stdout)
              if not isinstance(x,list): raise SystemExit('pagination shape drift')
              return x
          C=[c for page in gh_pages(f"repos/{os.environ['GITHUB_REPOSITORY']}/issues/60/comments?per_page=100") for c in page]
          byid={int(c.get('id') or 0):c for c in C}
          for cid in additions:
              if cid not in byid: raise SystemExit('bound V70 decision disappeared '+str(cid))
              body=str(byid[cid].get('body') or '')
              if blocker(body,cid): raise SystemExit('exact V70 decision suppression failed '+str(cid))
              if not blocker(body,new_known+1000000+cid): raise SystemExit('bound V70 decision not intrinsically fatal '+str(cid))
          notice=int(os.environ['V70_CANDIDATE_NOTICE'])
          if notice not in byid: raise SystemExit('V70 candidate disappeared')
          if blocker(str(byid[notice].get('body') or ''),notice): raise SystemExit('V70 candidate unexpectedly blocking')

          fixtures={}
          for name,body in {'freshHardDefect':'CONFIRMED_DEFECT AVPS_X','freshRisk':'MATERIAL_RISK AVPS_X','freshClosed':'FAIL_CLOSED AVPS_X','freshDirective':'DIRECTIVE: BLOCKER AVPS_X','incidental':'AVPS narrative mentions blocker only'}.items(): fixtures[name]=bool(blocker(body,new_known+4000000))
          if not all(fixtures[k] for k in ('freshHardDefect','freshRisk','freshClosed','freshDirective')) or fixtures['incidental']: raise SystemExit('V71 classifier adversarial fixture drift')
          for c in C:
              cid=int(c.get('id') or 0)
              if cid>new_known and blocker(str(c.get('body') or ''),cid): raise SystemExit('newer unbound AVPS governance blocker '+str(cid))

          closed=set(); begins=[]
          for c in C:
              body=str(c.get('body') or '').strip(); first=body.splitlines()[0] if body else ''; fields={}
              for tok in first.replace('|',' ').split():
                  if '=' in tok:
                      k,v=tok.split('=',1); fields.setdefault(k,[]).append(v)
              if first.startswith('WRITE_QUIET_END'):
                  vals=[]
                  for key in ('begin','beginComment','begin_comment'):
                      for v in fields.get(key,[]):
                          if not v.isdigit(): raise SystemExit('non-numeric WRITE_QUIET_END alias')
                          vals.append(int(v))
                  if len(set(vals))>1: raise SystemExit('conflicting WRITE_QUIET_END aliases')
                  if vals: closed.add(vals[0])
              elif first.startswith('WRITE_QUIET_BEGIN'): begins.append(int(c['id']))
          if [x for x in begins if x not in closed]: raise SystemExit('unmatched WRITE_QUIET_BEGIN')
          if any(str(c.get('body') or '').strip().startswith(os.environ['CONSUMED_MARKER']) for c in C): raise SystemExit('ordinal45 consumed marker exists')
          ref=subprocess.run(['/usr/bin/git','ls-remote','--exit-code','--heads','origin',os.environ['DISPATCH_BRANCH']],capture_output=True,text=True)
          if ref.returncode==0: raise SystemExit('ordinal45 dispatch ref exists')
          if ref.returncode!=2: raise SystemExit('dispatch ref read failure rc='+str(ref.returncode))
          science=[r for page in gh_pages(f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/{os.environ['SCIENCE_WORKFLOW']}/runs?event=workflow_dispatch&per_page=100") for r in page.get('workflow_runs',[])]
          if science: raise SystemExit('ordinal45 science workflow_dispatch already exists '+repr([r.get('id') for r in science]))

          receipt={'schemaVersion':71,'mode':os.environ['MODE'],'sourcePublisherSha256':material['sourcePublisherSha256'],'correctedPublisherSha256':sha,'sourceKnownDefect':old_known,'knownDefect':new_known,'exactSuppressedIds':new_ids,'exactAddedSuppressedIds':additions,'materializedForwardReplayExact':True,'materializedReverseReplayExact':True,'publisherV3SemanticIdentityAnchors':semantic_anchors,'runtimeScienceControlsPreservedByExactReversePatch':True,'v46DispatchRefRcSemanticsPreservedByExactReversePatch':True,'dispatchCreated':False,'consumedMarkerCreated':False,'workflowDispatchPerformed':False,'solverExecutionPerformed':False,'resultOpeningAuthorized':False,'levelBAdmissionAuthorized':False,'holdoutOpened':False,'productionAuthorized':False,'taylorOrJerusalemUsed':False,'newMappingAuthorized':False}
          Path('review-receipt-v71.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          Path('v71-governance-fixtures.json').write_text(json.dumps({'classifierFixtures':fixtures,'boundV70DecisionsIntrinsicFatalAndExactSuppressed':True,'v70CandidateNoticeRemainsUnsuppressedNonblocking':True,'publisherV3SemanticIdentityAnchorsExact':True},sort_keys=True,indent=2)+'\n')
          if json.load(open('review-receipt-v71.json'))['exactSuppressedIds']!=json.load(open('v71-publisher-patch-manifest.json'))['exactSuppressedIds'] or new_ids!=B: raise SystemExit('receipt==manifest==executable B mismatch')
          if os.environ['MODE']=='publisher':
              installed=Path(os.environ['PUBLISHER_PATH']).read_bytes()
              if installed!=out: raise SystemExit('future publisher file is not byte-exact V71 canonical')
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: avps-v2-recovery4-ordinal45-final-publisher-governance-review-v71
          path: |
            review-receipt-v71.json
            canonical-final-publisher-v3.yml
            canonical-final-publisher-v3.sha256
            v71-publisher-patch-manifest.json
            v71-governance-fixtures.json
          if-no-files-found: error
