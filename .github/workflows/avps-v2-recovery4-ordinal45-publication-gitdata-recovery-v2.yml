name: Review fresh atomic Git-data recovery for corrected AVPS ordinal45 publication

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery4-ordinal45-publication-gitdata-recovery-v2.yml

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: avps-r4-o45-publication-gitdata-recovery-v2-${{ github.sha }}
  cancel-in-progress: false

env:
  REVIEW_BASE: ada2b2accab359d157dd08f02f2c1f56f9d266e9
  REVIEW_BASE_TREE: 21eb1ff4e0ac808d2128d7b8f3c73fc8aa3d1acb
  PRE_PROBE_MAIN: dcfba1da47ea25beb044047d9da45747a730e2b2
  TRANSIENT_HISTORY_COUNT: '6'
  REVIEW_BRANCH: review/avps-v2-recovery4-ordinal45-publication-gitdata-recovery-v2
  SELF: .github/workflows/avps-v2-recovery4-ordinal45-publication-gitdata-recovery-v2.yml
  TARGET_BRANCH: review/avps-v2-recovery4-ordinal45-execution-publication-v2
  SOURCE_HEAD: b5a68159aa09bb3f91cb050a7e1bb266f866c9f4
  SOURCE_RUN: '33377879606'
  SOURCE_ARTIFACT: '9752564112'
  SOURCE_DIGEST: sha256:e5ed2a26e917f3ee095c749d107c0ad16ac31c3ac9513da6717a5e66965557b5
  SOURCE_ACCEPTANCE_REVIEW: '5065401797'
  FAILED_MATERIALIZER_RUN: '33383354413'
  FAILED_MATERIALIZER_JOB: '99460402901'
  STALE_RECOVERY_HEAD: 12e5eb9b3b89777e3c412ac2e1da444a59753a94
  STALE_RECOVERY_RUN: '33383593215'
  SCIENCE_BLOB: df0763b61ce89063de6992bb984dc854024a1aad
  CONTRACT_BLOB: 2d5f71d80b5e573b86775c2806b80dcc1fbe02f4
  ADAPTER_BLOB: e4b690c2969fd01ecde5b08f554e47ad50b40914
  EXECUTOR_BLOB: 7dc38e31c19701b1a1ceef300d75105cff179290
  AGGREGATOR_BLOB: 6afc8b0d21c2b5553c251dc9ca5524c795ed2646

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact one-file zero-runtime fresh recovery-review scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "${{ github.event.pull_request.draft }}" = true
          test "${{ github.event.pull_request.base.sha }}" = "$REVIEW_BASE"
          test "${{ github.event.pull_request.head.ref }}" = "$REVIEW_BRANCH"
          test "${{ github.event.pull_request.head.repo.full_name }}" = "$GITHUB_REPOSITORY"
          test "$(git rev-parse HEAD^)" = "$REVIEW_BASE"
          test "$(git diff --name-only "$REVIEW_BASE"...HEAD)" = "$SELF"
          git diff --check "$REVIEW_BASE"...HEAD

      - name: Bind current restored content and preserve six-commit transient history
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$REVIEW_BASE^{tree}")" = "$REVIEW_BASE_TREE"
          test "$(git rev-parse "$PRE_PROBE_MAIN^{tree}")" = "$REVIEW_BASE_TREE"
          git merge-base --is-ancestor "$PRE_PROBE_MAIN" "$REVIEW_BASE"
          test "$(git rev-list --count "$PRE_PROBE_MAIN..$REVIEW_BASE")" = "$TRANSIENT_HISTORY_COUNT"
          test -z "$(git diff --name-only "$PRE_PROBE_MAIN" "$REVIEW_BASE")"
          git rev-list --reverse "$PRE_PROBE_MAIN..$REVIEW_BASE" > transient-history.txt
          test "$(wc -l < transient-history.txt)" = "$TRANSIENT_HISTORY_COUNT"

      - name: Verify corrected source acceptance and preserve both failed transport attempts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > source-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT" > source-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/777/reviews/$SOURCE_ACCEPTANCE_REVIEW" > source-acceptance.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_MATERIALIZER_RUN" > failed-materializer-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$FAILED_MATERIALIZER_JOB" > failed-materializer-job.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STALE_RECOVERY_RUN" > stale-recovery-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STALE_RECOVERY_RUN/jobs" > stale-recovery-jobs.json
          python - <<'PY'
          import json, os
          s=json.load(open('source-run.json')); a=json.load(open('source-artifact.json')); v=json.load(open('source-acceptance.json'))
          fr=json.load(open('failed-materializer-run.json')); fj=json.load(open('failed-materializer-job.json'))
          sr=json.load(open('stale-recovery-run.json')); sj=json.load(open('stale-recovery-jobs.json'))
          if (s.get('id'),s.get('head_sha'),s.get('run_attempt'),s.get('status'),s.get('conclusion')) != (int(os.environ['SOURCE_RUN']),os.environ['SOURCE_HEAD'],1,'completed','success'): raise SystemExit('corrected source run drift')
          if a.get('id')!=int(os.environ['SOURCE_ARTIFACT']) or a.get('digest')!=os.environ['SOURCE_DIGEST'] or a.get('expired'): raise SystemExit('corrected artifact drift')
          if v.get('id')!=int(os.environ['SOURCE_ACCEPTANCE_REVIEW']) or v.get('commit_id')!=os.environ['SOURCE_HEAD'] or not str(v.get('body') or '').startswith('INDEPENDENT_AUDIT::ACCEPT_CORRECTED_HEAD'): raise SystemExit('corrected-head independent acceptance drift')
          if (fr.get('id'),fr.get('run_attempt'),fr.get('status'),fr.get('conclusion')) != (int(os.environ['FAILED_MATERIALIZER_RUN']),1,'completed','failure'): raise SystemExit('failed materializer run drift')
          if (fj.get('id'),fj.get('run_id'),fj.get('status'),fj.get('conclusion')) != (int(os.environ['FAILED_MATERIALIZER_JOB']),int(os.environ['FAILED_MATERIALIZER_RUN']),'completed','failure'): raise SystemExit('failed materializer job drift')
          if (sr.get('id'),sr.get('head_sha'),sr.get('run_attempt'),sr.get('status'),sr.get('conclusion')) != (int(os.environ['STALE_RECOVERY_RUN']),os.environ['STALE_RECOVERY_HEAD'],1,'completed','failure'): raise SystemExit('stale recovery run drift')
          if sj.get('total_count') != 0: raise SystemExit('stale recovery unexpectedly had jobs')
          PY

      - name: Verify exact source blobs, target absence, and deterministic atomic publication tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > path-blobs.tsv <<EOF
          .github/workflows/avps-v2-postconsumption-recovery4-science.yml	$SCIENCE_BLOB
          runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py	$AGGREGATOR_BLOB
          runtime-avps-v2-recovery4-ordinal45-v1/executor.py	$EXECUTOR_BLOB
          runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py	$ADAPTER_BLOB
          runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json	$CONTRACT_BLOB
          EOF
          while IFS=$'\t' read -r path blob; do
            test "$(git cat-file -t "$blob")" = blob
            test "$(git rev-parse "$SOURCE_HEAD:$path")" = "$blob"
            if git cat-file -e "$REVIEW_BASE:$path" 2>/dev/null; then
              echo "target path already exists on recovery base: $path" >&2
              exit 1
            fi
          done < path-blobs.tsv
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$TARGET_BRANCH" > target-ref.json 2>target-ref.err; then
            echo 'target publication branch unexpectedly exists' >&2
            exit 1
          fi
          grep -Eq 'HTTP 404|Not Found' target-ref.err
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=all&head=${GITHUB_REPOSITORY_OWNER}:${TARGET_BRANCH}&per_page=100" > target-prs.json
          python - <<'PY'
          import json
          if json.load(open('target-prs.json')): raise SystemExit('target publication PR identity already exists')
          PY
          export GIT_INDEX_FILE="$RUNNER_TEMP/avps-r4-o45-publication-v2.index"
          rm -f "$GIT_INDEX_FILE"
          git read-tree "$REVIEW_BASE"
          while IFS=$'\t' read -r path blob; do
            git update-index --add --cacheinfo "100644,$blob,$path"
          done < path-blobs.tsv
          PLANNED_TREE=$(git write-tree)
          git diff --name-only "$REVIEW_BASE^{tree}" "$PLANNED_TREE" | sort > planned-changed.txt
          cut -f1 path-blobs.tsv | sort > expected-changed.txt
          diff -u expected-changed.txt planned-changed.txt
          git ls-tree -r "$PLANNED_TREE" > planned-tree-ls.txt
          python - "$PLANNED_TREE" <<'PY'
          import json, os, sys
          from pathlib import Path
          rows=[]
          for line in Path('path-blobs.tsv').read_text().splitlines():
              path,blob=line.split('\t'); rows.append({'path':path,'mode':'100644','type':'blob','sha':blob})
          receipt={
            'schemaVersion':2,
            'status':'PASS_AVPS_V2_RECOVERY4_ORDINAL45_ATOMIC_GITDATA_PUBLICATION_TRANSPORT_REVIEW_V2_ZERO_RUNTIME',
            'baseCommit':os.environ['REVIEW_BASE'],
            'baseTree':os.environ['REVIEW_BASE_TREE'],
            'preProbeMain':os.environ['PRE_PROBE_MAIN'],
            'transientHistoryCommitCount':int(os.environ['TRANSIENT_HISTORY_COUNT']),
            'restoredTreeEqualsPreProbeTree':True,
            'targetBranch':os.environ['TARGET_BRANCH'],
            'plannedTreeSha':sys.argv[1],
            'treeElements':rows,
            'sourceHead':os.environ['SOURCE_HEAD'],
            'sourceRun':int(os.environ['SOURCE_RUN']),
            'sourceArtifact':int(os.environ['SOURCE_ARTIFACT']),
            'sourceArtifactDigest':os.environ['SOURCE_DIGEST'],
            'sourceAcceptanceReview':int(os.environ['SOURCE_ACCEPTANCE_REVIEW']),
            'failedMaterializerRun':int(os.environ['FAILED_MATERIALIZER_RUN']),
            'failedMaterializerJob':int(os.environ['FAILED_MATERIALIZER_JOB']),
            'staleRecoveryHead':os.environ['STALE_RECOVERY_HEAD'],
            'staleRecoveryRun':int(os.environ['STALE_RECOVERY_RUN']),
            'failedOrStaleAttemptsReusable':False,
            'publicationBranchCreated':False,
            'publicationPrCreated':False,
            'dispatchCreated':False,
            'candidateSeedsConsumed':False,
            'scientificRuntime':False,
            'solverExecuted':False,
            'resultsOpened':False,
            'levelBOpeningAuthorized':False,
            'protectedHoldoutOpeningAuthorized':False,
            'productionAuthorized':False,
            'taylorOrJerusalemUsed':False,
            'newMappingAuthorized':False
          }
          Path('transport-review-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY

      - name: Prove review remains transport-only and zero-runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/avps-v2-recovery4-ordinal45-publication-gitdata-recovery-v2.yml').read_text()
          forbidden=('workflow_'+'dispatch:','command -v '+'uvspec','rte_solver '+'mystic','mc_photons '+'20000000')
          for token in forbidden:
              if token in p: raise SystemExit(f'recovery review contains prohibited scientific-runtime token: {token}')
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: avps-v2-recovery4-ordinal45-atomic-gitdata-publication-transport-review-v2
          path: |
            transient-history.txt
            path-blobs.tsv
            planned-changed.txt
            planned-tree-ls.txt
            transport-review-receipt.json
          if-no-files-found: error
          compression-level: 0
