name: Review/materialize AVPS Recovery4 ordinal45 publication

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths: [.github/workflows/avps-v2-recovery4-ordinal45-publication-materializer-v1.yml]
  push:
    branches: [transport-trigger/avps-v2-recovery4-ordinal45-publication-v1]
    paths: [transport-triggers/avps-v2-recovery4-ordinal45-publication-v1.txt]

concurrency:
  group: avps-r4-o45-publication-materializer-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

env:
  REVIEW_BASE: 1c6cad3c8f2d87684cefe32bffac2db4b46b28e7
  SELF: .github/workflows/avps-v2-recovery4-ordinal45-publication-materializer-v1.yml
  GENERATOR: .github/recovery-templates/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-successor-infrastructure-v1/generate.py
  GENERATOR_BLOB: 052c98516e987126618044863866b697f191459c
  SOURCE_BRANCH: review/avps-v2-recovery4-ordinal45-execution-package-v1
  SOURCE_HEAD: eb0ff26cbea7485ace9fe9bf6b1cc1a3c9d60489
  IDENTITY: review/avps-v2-recovery4-ordinal45-execution-package-v1/execution-identity.review.json
  IDENTITY_BLOB: 5b599b682cd37e635fca04b4501d9863880e515e
  SOURCE_RUN: '33372058737'
  SOURCE_ARTIFACT: '9750420831'
  SOURCE_DIGEST: sha256:f1c37d44636797ebcffa5eafe467ded0b9243e5b2e9fdbe66f7fd995986d75dd
  ACTIVATION_BRANCH: transport-trigger/avps-v2-recovery4-ordinal45-publication-v1
  ACTIVATION_MARKER: transport-triggers/avps-v2-recovery4-ordinal45-publication-v1.txt
  ACTIVATION_TEXT: AVPS_V2_RECOVERY4_ORDINAL45_PUBLICATION_MATERIALIZER_V1
  TARGET: publication/avps-v2-recovery4-ordinal45-execution-package-v1
  GENERATED: generated-avps-v2-recovery4-successor-infrastructure
  ALLOCATION_COMMENT: '5475321839'

jobs:
  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions: {contents: read, actions: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - name: Review exact zero-runtime transport
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "${{ github.event.pull_request.base.sha }}" = "$REVIEW_BASE"
          test "${{ github.event.pull_request.head.ref }}" = review/avps-v2-recovery4-ordinal45-publication-materializer-v1
          test "$(git rev-parse HEAD:$GENERATOR)" = "$GENERATOR_BLOB"
          test "$(git diff --name-only "$REVIEW_BASE"...HEAD)" = "$SELF"
          git fetch origin "refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"
          test "$(git rev-parse origin/$SOURCE_BRANCH)" = "$SOURCE_HEAD"
          test "$(git rev-parse $SOURCE_HEAD:$IDENTITY)" = "$IDENTITY_BLOB"
          git show "$SOURCE_HEAD:$IDENTITY" > identity.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT" > artifact.json
          python - <<'PY'
          import json,os
          r=json.load(open('run.json')); a=json.load(open('artifact.json'))
          if (r['id'],r['head_sha'],r['run_attempt'],r['status'],r['conclusion'])!=(int(os.environ['SOURCE_RUN']),os.environ['SOURCE_HEAD'],1,'completed','success'): raise SystemExit('source run drift')
          if a['id']!=int(os.environ['SOURCE_ARTIFACT']) or a.get('digest')!=os.environ['SOURCE_DIGEST'] or a.get('expired'): raise SystemExit('source artifact drift')
          PY
          rm -rf "$GENERATED"
          python "$GENERATOR" --identity identity.json --output "$GENERATED" >/dev/null
          python - <<'PY'
          import hashlib,json,subprocess,os
          from pathlib import Path
          root=Path(os.environ['GENERATED']); m=json.load(open(root/'manifest.json'))
          required={'status':'GENERATED_AVPS_V2_RECOVERY4_SUCCESSOR_INFRASTRUCTURE_ZERO_RUNTIME_RESULTS_CLOSED','scientificOrdinal':45,'caseCount':360,'groupCount':72,'statesPerGroup':5,'photonHistoriesPerCase':20000000,'dispatchCreated':False,'scientificRuntime':False,'solverExecution':False,'resultsOpened':False,'levelBOpeningAuthorized':False,'protectedHoldoutOpeningAuthorized':False,'productionAuthorized':False,'taylorOrJerusalemUsed':False,'newMappingAuthorized':False}
          for k,v in required.items():
              if m.get(k)!=v: raise SystemExit(f'manifest drift {k}')
          exp={'avps-v2-postconsumption-recovery4-science.yml':('24290edce579b5cf1774cee61d2c7a4433f730f18c9c99d2e2144efedf163b1f','b620f9e554378ec363ec1cc3da860432b7615218'),'runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json':('3a3e09f1a9dda5435e455fbc9a508a924c080f7f265cdd7c29de912449bacc93','2d5f71d80b5e573b86775c2806b80dcc1fbe02f4'),'runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py':('e0c95d9ca15a78868bef13cb8375460de156075c07647298a2ad355c32d6d3ed','e4b690c2969fd01ecde5b08f554e47ad50b40914'),'runtime-avps-v2-recovery4-ordinal45-v1/executor.py':('37f1f52fa2381c3bc40580ffc16f45efd8503d9242c22d2d72eb28a27c3882f5','7dc38e31c19701b1a1ceef300d75105cff179290'),'runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py':('3287fb59344c223eb871befb05bef141fe79c74fec45f096c29a4c05e29845c2','6afc8b0d21c2b5553c251dc9ca5524c795ed2646')}
          if set(m['outputs'])!=set(exp): raise SystemExit('output set drift')
          for rel,(sha,blob) in exp.items():
              p=root/rel
              if hashlib.sha256(p.read_bytes()).hexdigest()!=sha or subprocess.check_output(['git','hash-object',str(p)],text=True).strip()!=blob: raise SystemExit(f'byte drift {rel}')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: {name: avps-r4-o45-publication-materializer-review, path: run.json, if-no-files-found: error, compression-level: 0}

  materialize:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions: {contents: write, issues: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: true}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - name: Materialize exact reviewed direct-child publication
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = "$ACTIVATION_BRANCH"
          test "$(cat "$ACTIVATION_MARKER")" = "$ACTIVATION_TEXT"
          git fetch origin main "$SOURCE_BRANCH"
          PARENT=$(git rev-parse origin/main)
          test "$(git rev-parse HEAD^)" = "$PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = "$ACTIVATION_MARKER"
          test "$(git rev-parse HEAD:$GENERATOR)" = "$GENERATOR_BLOB"
          test "$(git rev-parse origin/$SOURCE_BRANCH)" = "$SOURCE_HEAD"
          test "$(git rev-parse $SOURCE_HEAD:$IDENTITY)" = "$IDENTITY_BLOB"
          if git ls-remote --exit-code --heads origin "$TARGET" >/dev/null 2>&1; then echo target-exists >&2; exit 1; fi
          git show "$SOURCE_HEAD:$IDENTITY" > identity.json
          rm -rf "$GENERATED"
          python "$GENERATOR" --identity identity.json --output "$GENERATED" >/dev/null
          python - <<'PY'
          import hashlib,subprocess,os
          from pathlib import Path
          root=Path(os.environ['GENERATED'])
          exp={'avps-v2-postconsumption-recovery4-science.yml':('24290edce579b5cf1774cee61d2c7a4433f730f18c9c99d2e2144efedf163b1f','b620f9e554378ec363ec1cc3da860432b7615218'),'runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json':('3a3e09f1a9dda5435e455fbc9a508a924c080f7f265cdd7c29de912449bacc93','2d5f71d80b5e573b86775c2806b80dcc1fbe02f4'),'runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py':('e0c95d9ca15a78868bef13cb8375460de156075c07647298a2ad355c32d6d3ed','e4b690c2969fd01ecde5b08f554e47ad50b40914'),'runtime-avps-v2-recovery4-ordinal45-v1/executor.py':('37f1f52fa2381c3bc40580ffc16f45efd8503d9242c22d2d72eb28a27c3882f5','7dc38e31c19701b1a1ceef300d75105cff179290'),'runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py':('3287fb59344c223eb871befb05bef141fe79c74fec45f096c29a4c05e29845c2','6afc8b0d21c2b5553c251dc9ca5524c795ed2646')}
          for rel,(sha,blob) in exp.items():
              p=root/rel
              if hashlib.sha256(p.read_bytes()).hexdigest()!=sha or subprocess.check_output(['git','hash-object',str(p)],text=True).strip()!=blob: raise SystemExit(f'byte drift {rel}')
          PY
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > issue60.json
          python - <<'PY'
          import json,re
          pages=json.load(open('issue60.json')); cs=[c for p in pages for c in p]; opens={}
          for c in cs:
              i=int(c.get('id') or 0); b=str(c.get('body') or '').strip(); first=b.splitlines()[0] if b else ''
              if first.startswith('WRITE_QUIET_BEGIN '): opens[i]=first
              elif first.startswith('WRITE_QUIET_END '):
                  m=re.search(r'\b(?:begin|beginComment|begin_comment)=(\d+)\b',first)
                  if m: opens.pop(int(m.group(1)),None)
          if opens: raise SystemExit(f'unmatched WRITE_QUIET_BEGIN {sorted(opens)}')
          PY
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$PARENT"
          git switch --detach "$PARENT" && git switch -c "$TARGET"
          mkdir -p .github/workflows
          cp "$GENERATED/avps-v2-postconsumption-recovery4-science.yml" .github/workflows/avps-v2-postconsumption-recovery4-science.yml
          cp -R "$GENERATED/runtime-avps-v2-recovery4-ordinal45-v1" ./runtime-avps-v2-recovery4-ordinal45-v1
          rm -rf runtime-avps-v2-recovery4-ordinal45-v1/__pycache__
          git add .github/workflows/avps-v2-postconsumption-recovery4-science.yml runtime-avps-v2-recovery4-ordinal45-v1
          test "$(git diff --cached --name-only | wc -l)" = 5
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Publish AVPS Recovery4 ordinal45 execution package'
          test "$(git rev-parse HEAD^)" = "$PARENT"
          git fetch origin main && test "$(git rev-parse origin/main)" = "$PARENT"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > issue60-final.json
          python - <<'PY'
          import json,re
          pages=json.load(open('issue60-final.json')); cs=[c for p in pages for c in p]; opens={}
          for c in cs:
              i=int(c.get('id') or 0); b=str(c.get('body') or '').strip(); first=b.splitlines()[0] if b else ''
              if first.startswith('WRITE_QUIET_BEGIN '): opens[i]=first
              elif first.startswith('WRITE_QUIET_END '):
                  m=re.search(r'\b(?:begin|beginComment|begin_comment)=(\d+)\b',first)
                  if m: opens.pop(int(m.group(1)),None)
          if opens: raise SystemExit(f'unmatched WRITE_QUIET_BEGIN {sorted(opens)}')
          PY
          if git ls-remote --exit-code --heads origin "$TARGET" >/dev/null 2>&1; then exit 1; fi
          git push origin "HEAD:refs/heads/$TARGET"
