name: Review/materialize AVPS Recovery4 ordinal45 publication v2

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery4-ordinal45-publication-materializer-v2.yml
  push:
    branches: [transport-trigger/avps-v2-recovery4-ordinal45-publication-v2]
    paths:
      - transport-triggers/avps-v2-recovery4-ordinal45-publication-v2.txt

concurrency:
  group: avps-r4-o45-publication-materializer-v2-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

env:
  REVIEW_BASE: 1c6cad3c8f2d87684cefe32bffac2db4b46b28e7
  SELF: .github/workflows/avps-v2-recovery4-ordinal45-publication-materializer-v2.yml
  SOURCE_BRANCH: review/avps-v2-recovery4-ordinal45-execution-package-v1
  SOURCE_HEAD: eb0ff26cbea7485ace9fe9bf6b1cc1a3c9d60489
  SOURCE_RUN: '33372058737'
  ARTIFACT_ID: '9750420831'
  ARTIFACT_NAME: avps-v2-recovery4-ordinal45-generated-execution-package-review
  ARTIFACT_DIGEST: sha256:f1c37d44636797ebcffa5eafe467ded0b9243e5b2e9fdbe66f7fd995986d75dd
  TARGET: publication/avps-v2-recovery4-ordinal45-execution-package-v1
  ACTIVATION_BRANCH: transport-trigger/avps-v2-recovery4-ordinal45-publication-v2
  ACTIVATION_MARKER: transport-triggers/avps-v2-recovery4-ordinal45-publication-v2.txt
  ACTIVATION_TEXT: AVPS_V2_RECOVERY4_ORDINAL45_PUBLICATION_MATERIALIZER_V2
  ALLOCATION_MARKER: ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_AUTHORIZATION_ALLOCATED_REVIEWED_NOT_DISPATCHED commit=6e095b4b1603c90dcee0943295909b30cd1b374d parent=5685d5c313071014a94c816ee26b129f1f17a7fc pr=774
  CONSUMED_PREFIX: ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_DISPATCH_CONSUMED

jobs:
  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify exact reviewed artifact bytes, zero runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "${{ github.event.pull_request.base.sha }}" = "$REVIEW_BASE"
          test "${{ github.event.pull_request.head.ref }}" = review/avps-v2-recovery4-ordinal45-publication-materializer-v1
          test "$(git diff --name-only "$REVIEW_BASE"...HEAD)" = "$SELF"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > source-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts" > source-artifacts.json
          python - <<'PY'
          import json, os
          r=json.load(open('source-run.json'))
          if (r['id'],r['head_branch'],r['head_sha'],r['run_attempt'],r['status'],r['conclusion']) != (int(os.environ['SOURCE_RUN']),os.environ['SOURCE_BRANCH'],os.environ['SOURCE_HEAD'],1,'completed','success'):
              raise SystemExit('source run drift')
          rows=json.load(open('source-artifacts.json'))['artifacts']
          hits=[a for a in rows if a['id']==int(os.environ['ARTIFACT_ID']) and a['name']==os.environ['ARTIFACT_NAME']]
          if len(hits)!=1 or hits[0].get('digest')!=os.environ['ARTIFACT_DIGEST'] or hits[0].get('expired'):
              raise SystemExit('source artifact drift')
          PY
          rm -rf source-artifact
          gh run download "$SOURCE_RUN" -n "$ARTIFACT_NAME" -D source-artifact
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          root=Path('source-artifact/generated-package')
          expected={
            'avps-v2-postconsumption-recovery4-science.yml':('24290edce579b5cf1774cee61d2c7a4433f730f18c9c99d2e2144efedf163b1f','b620f9e554378ec363ec1cc3da860432b7615218'),
            'runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json':('3a3e09f1a9dda5435e455fbc9a508a924c080f7f265cdd7c29de912449bacc93','2d5f71d80b5e573b86775c2806b80dcc1fbe02f4'),
            'runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py':('e0c95d9ca15a78868bef13cb8375460de156075c07647298a2ad355c32d6d3ed','e4b690c2969fd01ecde5b08f554e47ad50b40914'),
            'runtime-avps-v2-recovery4-ordinal45-v1/executor.py':('37f1f52fa2381c3bc40580ffc16f45efd8503d9242c22d2d72eb28a27c3882f5','7dc38e31c19701b1a1ceef300d75105cff179290'),
            'runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py':('3287fb59344c223eb871befb05bef141fe79c74fec45f096c29a4c05e29845c2','6afc8b0d21c2b5553c251dc9ca5524c795ed2646')}
          m=json.load(open(root/'manifest.json'))
          required={'status':'GENERATED_AVPS_V2_RECOVERY4_SUCCESSOR_INFRASTRUCTURE_ZERO_RUNTIME_RESULTS_CLOSED','scientificOrdinal':45,'caseCount':360,'groupCount':72,'statesPerGroup':5,'photonHistoriesPerCase':20000000,'dispatchCreated':False,'scientificRuntime':False,'solverExecution':False,'resultsOpened':False,'levelBOpeningAuthorized':False,'protectedHoldoutOpeningAuthorized':False,'productionAuthorized':False,'taylorOrJerusalemUsed':False,'newMappingAuthorized':False}
          for k,v in required.items():
              if m.get(k)!=v: raise SystemExit(f'manifest drift: {k}')
          if set(m.get('outputs',{})) != set(expected): raise SystemExit('manifest output set drift')
          for rel,(sha,blob) in expected.items():
              p=root/rel
              if hashlib.sha256(p.read_bytes()).hexdigest()!=sha: raise SystemExit(f'sha drift: {rel}')
              got=subprocess.check_output(['git','hash-object',str(p)],text=True).strip()
              if got!=blob: raise SystemExit(f'blob drift: {rel}')
          PY

  materialize:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Materialize exact reviewed five-file publication child
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = "$ACTIVATION_BRANCH"
          test "$(cat "$ACTIVATION_MARKER")" = "$ACTIVATION_TEXT"
          git fetch origin main
          PARENT=$(git rev-parse origin/main)
          test "$(git rev-parse HEAD^)" = "$PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = "$ACTIVATION_MARKER"
          if git ls-remote --exit-code --heads origin "$TARGET" >/dev/null 2>&1; then echo target-exists >&2; exit 1; fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > source-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts" > source-artifacts.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > issue60.json
          python - <<'PY'
          import json, os, re
          r=json.load(open('source-run.json'))
          if (r['id'],r['head_sha'],r['run_attempt'],r['status'],r['conclusion']) != (int(os.environ['SOURCE_RUN']),os.environ['SOURCE_HEAD'],1,'completed','success'): raise SystemExit('source run drift')
          rows=json.load(open('source-artifacts.json'))['artifacts']; hits=[a for a in rows if a['id']==int(os.environ['ARTIFACT_ID'])]
          if len(hits)!=1 or hits[0]['name']!=os.environ['ARTIFACT_NAME'] or hits[0].get('digest')!=os.environ['ARTIFACT_DIGEST'] or hits[0].get('expired'): raise SystemExit('source artifact drift')
          pages=json.load(open('issue60.json')); cs=[c for p in pages for c in p]; bodies=[str(c.get('body') or '').strip() for c in cs]
          if sum(b==os.environ['ALLOCATION_MARKER'] for b in bodies)!=1: raise SystemExit('allocation marker drift')
          if any(b.startswith(os.environ['CONSUMED_PREFIX']) for b in bodies): raise SystemExit('ordinal45 already consumed')
          opens={}
          for c,b in zip(cs,bodies):
              first=b.splitlines()[0] if b else ''
              if first.startswith('WRITE_QUIET_BEGIN '): opens[int(c['id'])]=first
              elif first.startswith('WRITE_QUIET_END '):
                  m=re.search(r'\b(?:begin|beginComment|begin_comment)=(\d+)\b',first)
                  if m: opens.pop(int(m.group(1)),None)
          if opens: raise SystemExit(f'unmatched WRITE_QUIET_BEGIN: {sorted(opens)}')
          PY
          rm -rf source-artifact
          gh run download "$SOURCE_RUN" -n "$ARTIFACT_NAME" -D source-artifact
          python - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          root=Path('source-artifact/generated-package')
          expected={
            'avps-v2-postconsumption-recovery4-science.yml':('24290edce579b5cf1774cee61d2c7a4433f730f18c9c99d2e2144efedf163b1f','b620f9e554378ec363ec1cc3da860432b7615218'),
            'runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json':('3a3e09f1a9dda5435e455fbc9a508a924c080f7f265cdd7c29de912449bacc93','2d5f71d80b5e573b86775c2806b80dcc1fbe02f4'),
            'runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py':('e0c95d9ca15a78868bef13cb8375460de156075c07647298a2ad355c32d6d3ed','e4b690c2969fd01ecde5b08f554e47ad50b40914'),
            'runtime-avps-v2-recovery4-ordinal45-v1/executor.py':('37f1f52fa2381c3bc40580ffc16f45efd8503d9242c22d2d72eb28a27c3882f5','7dc38e31c19701b1a1ceef300d75105cff179290'),
            'runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py':('3287fb59344c223eb871befb05bef141fe79c74fec45f096c29a4c05e29845c2','6afc8b0d21c2b5553c251dc9ca5524c795ed2646')}
          for rel,(sha,blob) in expected.items():
              p=root/rel
              if hashlib.sha256(p.read_bytes()).hexdigest()!=sha or subprocess.check_output(['git','hash-object',str(p)],text=True).strip()!=blob: raise SystemExit(f'byte drift: {rel}')
          PY
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$PARENT"
          git switch --detach "$PARENT"
          git switch -c "$TARGET"
          mkdir -p .github/workflows
          cp source-artifact/generated-package/avps-v2-postconsumption-recovery4-science.yml .github/workflows/avps-v2-postconsumption-recovery4-science.yml
          cp -R source-artifact/generated-package/runtime-avps-v2-recovery4-ordinal45-v1 ./runtime-avps-v2-recovery4-ordinal45-v1
          git add .github/workflows/avps-v2-postconsumption-recovery4-science.yml runtime-avps-v2-recovery4-ordinal45-v1
          test "$(git diff --cached --name-only | wc -l)" = 5
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Publish exact reviewed AVPS Recovery4 ordinal45 execution package'
          test "$(git rev-parse HEAD^)" = "$PARENT"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > issue60-final.json
          python - <<'PY'
          import json,re
          pages=json.load(open('issue60-final.json')); cs=[c for p in pages for c in p]; opens={}
          for c in cs:
              b=str(c.get('body') or '').strip(); first=b.splitlines()[0] if b else ''
              if first.startswith('WRITE_QUIET_BEGIN '): opens[int(c['id'])]=first
              elif first.startswith('WRITE_QUIET_END '):
                  m=re.search(r'\b(?:begin|beginComment|begin_comment)=(\d+)\b',first)
                  if m: opens.pop(int(m.group(1)),None)
          if opens: raise SystemExit(f'unmatched WRITE_QUIET_BEGIN: {sorted(opens)}')
          PY
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$PARENT"
          if git ls-remote --exit-code --heads origin "$TARGET" >/dev/null 2>&1; then exit 1; fi
          git push origin "HEAD:refs/heads/$TARGET"
