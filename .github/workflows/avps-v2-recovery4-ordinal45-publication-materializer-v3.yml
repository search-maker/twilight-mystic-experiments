name: Review/materialize corrected AVPS Recovery4 ordinal45 publication v3

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery4-ordinal45-publication-materializer-v3.yml
      - .github/workflows/avps-v2-postconsumption-recovery4-science.yml
      - runtime-avps-v2-recovery4-ordinal45-v1/**
  push:
    branches: [transport-trigger/avps-v2-recovery4-ordinal45-publication-v3]
    paths:
      - transport-triggers/avps-v2-recovery4-ordinal45-publication-v3.txt

concurrency:
  group: avps-r4-o45-corrected-publication-v3-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

env:
  REVIEW_BASE: 1c6cad3c8f2d87684cefe32bffac2db4b46b28e7
  SELF: .github/workflows/avps-v2-recovery4-ordinal45-publication-materializer-v3.yml
  MATERIALIZER_REVIEW_BRANCH: review/avps-v2-recovery4-ordinal45-publication-materializer-v3
  SOURCE_PR: '777'
  SOURCE_ACCEPTANCE_REVIEW: '5065401797'
  SOURCE_BRANCH: review/avps-v2-recovery4-ordinal45-execution-package-v1
  SOURCE_HEAD: b5a68159aa09bb3f91cb050a7e1bb266f866c9f4
  SOURCE_RUN: '33377879606'
  SOURCE_JOB: '99443361616'
  ARTIFACT_ID: '9752564112'
  ARTIFACT_NAME: avps-v2-recovery4-ordinal45-generated-execution-package-review
  ARTIFACT_DIGEST: sha256:e5ed2a26e917f3ee095c749d107c0ad16ac31c3ac9513da6717a5e66965557b5
  AUTHORIZATION_HEAD: 6e095b4b1603c90dcee0943295909b30cd1b374d
  ALLOCATION_MARKER: ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_AUTHORIZATION_ALLOCATED_REVIEWED_NOT_DISPATCHED commit=6e095b4b1603c90dcee0943295909b30cd1b374d parent=5685d5c313071014a94c816ee26b129f1f17a7fc pr=774
  CONSUMED_PREFIX: ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_DISPATCH_CONSUMED
  PUBLICATION_BRANCH: review/avps-v2-recovery4-ordinal45-execution-publication-v2
  ACTIVATION_BRANCH: transport-trigger/avps-v2-recovery4-ordinal45-publication-v3
  ACTIVATION_MARKER: transport-triggers/avps-v2-recovery4-ordinal45-publication-v3.txt
  ACTIVATION_TEXT: AVPS_V2_RECOVERY4_ORDINAL45_CORRECTED_PUBLICATION_MATERIALIZER_V3

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  review-materializer:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'review/avps-v2-recovery4-ordinal45-publication-materializer-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind one-file zero-runtime review scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "${{ github.event.pull_request.base.sha }}" = "$REVIEW_BASE"
          test "${{ github.event.pull_request.head.ref }}" = "$MATERIALIZER_REVIEW_BRANCH"
          test "$(git merge-base "$REVIEW_BASE" HEAD)" = "$REVIEW_BASE"
          test "$(git diff --name-only "$REVIEW_BASE"...HEAD)" = "$SELF"
          git diff --check "$REVIEW_BASE"...HEAD
      - name: Verify accepted corrected source artifact and exact five bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > source-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$SOURCE_JOB" > source-job.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > source-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/$SOURCE_PR/reviews/$SOURCE_ACCEPTANCE_REVIEW" > source-acceptance.json
          python - <<'PY'
          import json, os
          r=json.load(open('source-run.json')); j=json.load(open('source-job.json')); a=json.load(open('source-artifact.json')); v=json.load(open('source-acceptance.json'))
          if (r.get('id'),r.get('head_branch'),r.get('head_sha'),r.get('run_attempt'),r.get('status'),r.get('conclusion')) != (int(os.environ['SOURCE_RUN']),os.environ['SOURCE_BRANCH'],os.environ['SOURCE_HEAD'],1,'completed','success'): raise SystemExit('corrected source run drift')
          if (j.get('id'),j.get('run_id'),j.get('head_sha'),j.get('run_attempt'),j.get('status'),j.get('conclusion')) != (int(os.environ['SOURCE_JOB']),int(os.environ['SOURCE_RUN']),os.environ['SOURCE_HEAD'],1,'completed','success'): raise SystemExit('corrected source job drift')
          if a.get('id')!=int(os.environ['ARTIFACT_ID']) or a.get('name')!=os.environ['ARTIFACT_NAME'] or a.get('digest')!=os.environ['ARTIFACT_DIGEST'] or a.get('expired'): raise SystemExit('corrected source artifact drift')
          if v.get('id')!=int(os.environ['SOURCE_ACCEPTANCE_REVIEW']) or v.get('commit_id')!=os.environ['SOURCE_HEAD'] or v.get('state')!='COMMENTED' or not str(v.get('body') or '').startswith('INDEPENDENT_AUDIT::ACCEPT_CORRECTED_HEAD'): raise SystemExit('independent corrected-head acceptance missing/drifted')
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > reviewed.zip
          echo "${ARTIFACT_DIGEST#sha256:}  reviewed.zip" | sha256sum -c -
          rm -rf reviewed && mkdir reviewed && unzip -q reviewed.zip -d reviewed
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          root=Path('reviewed/generated-package')
          expected={
            'avps-v2-postconsumption-recovery4-science.yml':('405959b98955198d41f9130f5170ca3e260015bd1c2265cd73e300030a77e4a8','df0763b61ce89063de6992bb984dc854024a1aad'),
            'runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json':('3a3e09f1a9dda5435e455fbc9a508a924c080f7f265cdd7c29de912449bacc93','2d5f71d80b5e573b86775c2806b80dcc1fbe02f4'),
            'runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py':('e0c95d9ca15a78868bef13cb8375460de156075c07647298a2ad355c32d6d3ed','e4b690c2969fd01ecde5b08f554e47ad50b40914'),
            'runtime-avps-v2-recovery4-ordinal45-v1/executor.py':('37f1f52fa2381c3bc40580ffc16f45efd8503d9242c22d2d72eb28a27c3882f5','7dc38e31c19701b1a1ceef300d75105cff179290'),
            'runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py':('3287fb59344c223eb871befb05bef141fe79c74fec45f096c29a4c05e29845c2','6afc8b0d21c2b5553c251dc9ca5524c795ed2646')}
          m=json.load(open(root/'manifest.json'))
          required={'status':'GENERATED_AVPS_V2_RECOVERY4_SUCCESSOR_INFRASTRUCTURE_ZERO_RUNTIME_RESULTS_CLOSED','scientificOrdinal':45,'caseCount':360,'groupCount':72,'statesPerGroup':5,'photonHistoriesPerCase':20000000,'candidateSeedCanonicalSha256':'ddded6b2d170ca2fac8d498bdba2887446c16995df0880d948fb2be00870b3de','candidateRowsCanonicalSha256':'c439de417520b330c037e2628df02b6955f652563300aa5ef30477abf7661a98','temporalFencePreScanBindingCorrected':True,'preScanFenceBindingRequired':True,'snapshotReleaseUsesPreflightBoundBeginOnly':True,'independentLateBeginSearchRemoved':True,'frozenScienceChanged':False,'dispatchCreated':False,'scientificRuntime':False,'solverExecution':False,'resultsOpened':False,'levelBOpeningAuthorized':False,'protectedHoldoutOpeningAuthorized':False,'productionAuthorized':False,'taylorOrJerusalemUsed':False,'newMappingAuthorized':False}
          for k,v in required.items():
              if m.get(k)!=v: raise SystemExit(f'manifest drift: {k}')
          if set(m.get('outputs',{}))!=set(expected): raise SystemExit('output set drift')
          for rel,(sha,blob) in expected.items():
              p=root/rel
              if hashlib.sha256(p.read_bytes()).hexdigest()!=sha: raise SystemExit(f'sha drift: {rel}')
              if subprocess.check_output(['git','hash-object',str(p)],text=True).strip()!=blob: raise SystemExit(f'blob drift: {rel}')
          wf=(root/'avps-v2-postconsumption-recovery4-science.yml').read_text()
          if wf.count('needs: [preflight, snapshot-fence-release]')!=4: raise SystemExit('solver shard release barrier drift')
          if wf.index('pre-scan-fence-binding.json')>=wf.index('repository_global_seed_scan.py'): raise SystemExit('pre-scan fence binding ordering drift')
          snap=wf[wf.index('  snapshot-fence-release:\n'):wf.index('  cases-dep2:\n')]
          if 'WRITE_QUIET_BEGIN' in snap: raise SystemExit('late BEGIN search returned')
          if 'execution-guard.json' not in snap or 'writeQuietBeginCommentId' not in snap: raise SystemExit('snapshot release not guard-bound')
          if '24290edce579b5cf1774cee61d2c7a4433f730f18c9c99d2e2144efedf163b1f' in wf: raise SystemExit('old defective science workflow identity leaked')
          PY
      - name: Prove this review gate cannot invoke scientific runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/avps-v2-recovery4-ordinal45-publication-materializer-v3.yml').read_text()
          review=p[p.index('  review-materializer:'):p.index('  review-published-bytes:')]
          for token in ('workflow_'+'dispatch:','command -v '+'uvspec','rte_solver '+'mystic','mc_photons '+'20000000'):
              if token in review: raise SystemExit(f'review gate contains prohibited scientific-runtime token: {token}')
          PY

  review-published-bytes:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'review/avps-v2-recovery4-ordinal45-execution-publication-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify direct-child Draft exact-byte publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "${{ github.event.pull_request.draft }}" = true
          test "${{ github.event.pull_request.head.repo.full_name }}" = "$GITHUB_REPOSITORY"
          test "${{ github.event.pull_request.base.ref }}" = main
          git fetch origin main --quiet
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
          git diff --name-only HEAD^ HEAD | sort > changed.txt
          cat > expected.txt <<'EOF'
          .github/workflows/avps-v2-postconsumption-recovery4-science.yml
          runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py
          runtime-avps-v2-recovery4-ordinal45-v1/executor.py
          runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py
          runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json
          EOF
          diff -u expected.txt changed.txt
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > reviewed.zip
          echo "${ARTIFACT_DIGEST#sha256:}  reviewed.zip" | sha256sum -c -
          rm -rf reviewed && mkdir reviewed && unzip -q reviewed.zip -d reviewed
          cmp reviewed/generated-package/avps-v2-postconsumption-recovery4-science.yml .github/workflows/avps-v2-postconsumption-recovery4-science.yml
          cmp reviewed/generated-package/runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py
          cmp reviewed/generated-package/runtime-avps-v2-recovery4-ordinal45-v1/executor.py runtime-avps-v2-recovery4-ordinal45-v1/executor.py
          cmp reviewed/generated-package/runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py
          cmp reviewed/generated-package/runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected={'.github/workflows/avps-v2-postconsumption-recovery4-science.yml':'405959b98955198d41f9130f5170ca3e260015bd1c2265cd73e300030a77e4a8','runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py':'e0c95d9ca15a78868bef13cb8375460de156075c07647298a2ad355c32d6d3ed','runtime-avps-v2-recovery4-ordinal45-v1/executor.py':'37f1f52fa2381c3bc40580ffc16f45efd8503d9242c22d2d72eb28a27c3882f5','runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py':'3287fb59344c223eb871befb05bef141fe79c74fec45f096c29a4c05e29845c2','runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json':'3a3e09f1a9dda5435e455fbc9a508a924c080f7f265cdd7c29de912449bacc93'}
          for p,h in expected.items():
              if hashlib.sha256(Path(p).read_bytes()).hexdigest()!=h: raise SystemExit(f'published byte drift: {p}')
          PY

  materialize:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      issues: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Materialize only exact independently accepted corrected bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = "$ACTIVATION_BRANCH"
          test "$(cat "$ACTIVATION_MARKER")" = "$ACTIVATION_TEXT"
          git fetch origin main --quiet
          PARENT=$(git rev-parse origin/main)
          test "$(git rev-parse HEAD^)" = "$PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = "$ACTIVATION_MARKER"
          test -z "$(git ls-remote --heads origin "$PUBLICATION_BRANCH")"
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=all&head=${GITHUB_REPOSITORY_OWNER}:${PUBLICATION_BRANCH}&per_page=100" > prior-prs.json
          python - <<'PY'
          import json
          if json.load(open('prior-prs.json')): raise SystemExit('corrected publication PR identity already exists')
          PY
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > issue60.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > source-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > source-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/$SOURCE_PR/reviews/$SOURCE_ACCEPTANCE_REVIEW" > source-acceptance.json
          python - <<'PY'
          import json,os,re
          pages=json.load(open('issue60.json')); cs=[c for p in pages for c in p]; bodies=[str(c.get('body') or '').strip() for c in cs]
          if sum(b==os.environ['ALLOCATION_MARKER'] for b in bodies)!=1: raise SystemExit('allocation marker drift')
          if any(b.startswith(os.environ['CONSUMED_PREFIX']) for b in bodies): raise SystemExit('ordinal45 already consumed')
          opens={}
          for c,b in zip(cs,bodies):
              first=b.splitlines()[0] if b else ''
              if first.startswith('WRITE_QUIET_BEGIN '): opens[int(c['id'])]=first
              elif first.startswith('WRITE_QUIET_END '):
                  m=re.search(r'\b(?:begin|beginComment|begin_comment)=(\d+)\b',first)
                  if m: opens.pop(int(m.group(1)),None)
          if opens: raise SystemExit(f'unmatched WRITE_QUIET_BEGIN: {sorted(opens)}')
          r=json.load(open('source-run.json')); a=json.load(open('source-artifact.json')); v=json.load(open('source-acceptance.json'))
          if (r.get('id'),r.get('head_sha'),r.get('run_attempt'),r.get('status'),r.get('conclusion'))!=(int(os.environ['SOURCE_RUN']),os.environ['SOURCE_HEAD'],1,'completed','success'): raise SystemExit('source review drift')
          if a.get('id')!=int(os.environ['ARTIFACT_ID']) or a.get('digest')!=os.environ['ARTIFACT_DIGEST'] or a.get('expired'): raise SystemExit('source artifact drift')
          if v.get('id')!=int(os.environ['SOURCE_ACCEPTANCE_REVIEW']) or v.get('commit_id')!=os.environ['SOURCE_HEAD'] or not str(v.get('body') or '').startswith('INDEPENDENT_AUDIT::ACCEPT_CORRECTED_HEAD'): raise SystemExit('corrected-head acceptance drift')
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > reviewed.zip
          echo "${ARTIFACT_DIGEST#sha256:}  reviewed.zip" | sha256sum -c -
          rm -rf reviewed && mkdir reviewed && unzip -q reviewed.zip -d reviewed
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root=Path('reviewed/generated-package')
          expected={'avps-v2-postconsumption-recovery4-science.yml':'405959b98955198d41f9130f5170ca3e260015bd1c2265cd73e300030a77e4a8','runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py':'e0c95d9ca15a78868bef13cb8375460de156075c07647298a2ad355c32d6d3ed','runtime-avps-v2-recovery4-ordinal45-v1/executor.py':'37f1f52fa2381c3bc40580ffc16f45efd8503d9242c22d2d72eb28a27c3882f5','runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py':'3287fb59344c223eb871befb05bef141fe79c74fec45f096c29a4c05e29845c2','runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json':'3a3e09f1a9dda5435e455fbc9a508a924c080f7f265cdd7c29de912449bacc93'}
          for p,h in expected.items():
              if hashlib.sha256((root/p).read_bytes()).hexdigest()!=h: raise SystemExit(f'corrected source byte drift: {p}')
          PY
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "$PARENT"
          git switch --detach "$PARENT"
          git switch -c "$PUBLICATION_BRANCH"
          mkdir -p .github/workflows runtime-avps-v2-recovery4-ordinal45-v1
          cp reviewed/generated-package/avps-v2-postconsumption-recovery4-science.yml .github/workflows/avps-v2-postconsumption-recovery4-science.yml
          cp reviewed/generated-package/runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py
          cp reviewed/generated-package/runtime-avps-v2-recovery4-ordinal45-v1/executor.py runtime-avps-v2-recovery4-ordinal45-v1/executor.py
          cp reviewed/generated-package/runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py
          cp reviewed/generated-package/runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json
          git add .github/workflows/avps-v2-postconsumption-recovery4-science.yml runtime-avps-v2-recovery4-ordinal45-v1
          test "$(git diff --cached --name-only | wc -l)" = 5
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Publish independently accepted corrected AVPS Recovery4 ordinal45 execution bytes'
          test "$(git rev-parse HEAD^)" = "$PARENT"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > issue60-final.json
          python - <<'PY'
          import json,re
          pages=json.load(open('issue60-final.json')); opens={}
          for c in [c for p in pages for c in p]:
              b=str(c.get('body') or '').strip(); first=b.splitlines()[0] if b else ''
              if first.startswith('WRITE_QUIET_BEGIN '): opens[int(c['id'])]=first
              elif first.startswith('WRITE_QUIET_END '):
                  m=re.search(r'\b(?:begin|beginComment|begin_comment)=(\d+)\b',first)
                  if m: opens.pop(int(m.group(1)),None)
          if opens: raise SystemExit(f'unmatched WRITE_QUIET_BEGIN before publication push: {sorted(opens)}')
          PY
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "$PARENT"
          test -z "$(git ls-remote --heads origin "$PUBLICATION_BRANCH")"
          git push origin "HEAD:refs/heads/$PUBLICATION_BRANCH"
          gh pr create --base main --head "$PUBLICATION_BRANCH" --draft --title 'Review exact corrected AVPS Recovery4 ordinal45 execution bytes' --body 'Exact-byte publication review only. Source PR #777 corrected head b5a68159aa09bb3f91cb050a7e1bb266f866c9f4, review run 33377879606, artifact 9752564112 sha256:e5ed2a26e917f3ee095c749d107c0ad16ac31c3ac9513da6717a5e66965557b5, independent acceptance review 5065401797. No dispatch, consumed marker, solver, result opening, Level-B/holdout/production authorization, Taylor/Jerusalem use, or richer mapping authorization.'
