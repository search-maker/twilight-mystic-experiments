name: Review AVPS Recovery4 ordinal45 publication materializer v4
run-name: AVPS ordinal45 publication v4 activation comment ${{ github.event.comment.id }}

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: write
  issues: read
  pull-requests: write

concurrency:
  group: avps-v2-recovery4-ordinal45-publication-materializer-v4
  cancel-in-progress: false

env:
  CONTROL_ISSUE: '60'
  TRUSTED_ACCEPTANCE_LOGIN: search-maker
  TRUSTED_ACCEPTANCE_USER_ID: '304153003'
  TRUSTED_ACCEPTANCE_ASSOCIATION: OWNER
  ACTIVATION_BRANCH: transport-trigger/avps-v2-recovery4-ordinal45-publication-v4
  ACTIVATION_MARKER: transport-triggers/avps-v2-recovery4-ordinal45-publication-v4.txt
  ACTIVATION_TEXT: AVPS_V2_RECOVERY4_ORDINAL45_CORRECTED_PUBLICATION_MATERIALIZER_V4
  ACTIVATION_REVIEW_PREFIX: INDEPENDENT_AUDIT::ACCEPT_AVPS_ORDINAL45_PUBLICATION_V4_ACTIVATION_IDENTITY
  ACTIVATION_WORKFLOW_FILE: avps-v2-recovery4-ordinal45-publication-materializer-v4.yml
  PUBLICATION_BRANCH: review/avps-v2-recovery4-ordinal45-execution-publication-v3
  PUBLICATION_PARENT: b86c2142253c31dec3415bd1426210b1e73512f9
  AUTH_PR: '774'
  AUTH_HEAD: 6e095b4b1603c90dcee0943295909b30cd1b374d
  ALLOCATION_PREFIX: ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_AUTHORIZATION_ALLOCATED_REVIEWED_NOT_DISPATCHED
  CONSUMED_PREFIX: ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_DISPATCH_CONSUMED
  DISPATCH_BRANCH: dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-ordinal-45
  SOURCE_PR: '798'
  SOURCE_HEAD: c0910978a6d9ca754695a6289a9cc3021d2d4db7
  SOURCE_RUN: '33425490171'
  SOURCE_ARTIFACT: '9770550740'
  SOURCE_DIGEST: sha256:cc5eedecc5b23d8ca484830f6b0a7f04f35aa3ddc773ffdc9309197a5670c4ca
  SOURCE_AUDIT_REVIEW: '5069881778'
  SOURCE_AUDIT_TOKEN: INDEPENDENT_AUDIT::ACCEPT_AVPS_ORDINAL45_DURABLE_END_SOURCE_CORRECTION_V4
  WORKFLOW_PATH: .github/workflows/avps-v2-postconsumption-recovery4-science.yml
  WORKFLOW_SHA256: fb9c499380af491a15d3a40d14e5bc36cf581b4679d8d046023d9a272d492fb9
  WORKFLOW_BLOB: 2d210b3a161f6889352d600fb9222c974e728034
  RUNTIME_DIR: runtime-avps-v2-recovery4-ordinal45-v1
  ADAPTER_SHA256: e0c95d9ca15a78868bef13cb8375460de156075c07647298a2ad355c32d6d3ed
  ADAPTER_BLOB: e4b690c2969fd01ecde5b08f554e47ad50b40914
  EXECUTOR_SHA256: 37f1f52fa2381c3bc40580ffc16f45efd8503d9242c22d2d72eb28a27c3882f5
  EXECUTOR_BLOB: 7dc38e31c19701b1a1ceef300d75105cff179290
  AGGREGATOR_SHA256: 3287fb59344c223eb871befb05bef141fe79c74fec45f096c29a4c05e29845c2
  AGGREGATOR_BLOB: 6afc8b0d21c2b5553c251dc9ca5524c795ed2646
  CONTRACT_SHA256: 3a3e09f1a9dda5435e455fbc9a508a924c080f7f265cdd7c29de912449bacc93
  CONTRACT_BLOB: 2d5f71d80b5e573b86775c2806b80dcc1fbe02f4

jobs:
  materialize:
    if: >-
      github.event.issue.number == 60 &&
      github.event.comment.user.login == 'search-maker' &&
      github.event.comment.user.id == 304153003 &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'INDEPENDENT_AUDIT::ACCEPT_AVPS_ORDINAL45_PUBLICATION_V4_ACTIVATION_IDENTITY')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prove acceptance event and unreferenced one-marker activation object
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_COMMENT_ID: ${{ github.event.comment.id }}
          EVENT_COMMENT_BODY: ${{ github.event.comment.body }}
          EVENT_COMMENT_CREATED: ${{ github.event.comment.created_at }}
          EVENT_COMMENT_UPDATED: ${{ github.event.comment.updated_at }}
          EVENT_COMMENT_LOGIN: ${{ github.event.comment.user.login }}
          EVENT_COMMENT_USER_ID: ${{ github.event.comment.user.id }}
          EVENT_COMMENT_AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = issue_comment
          test "$EVENT_ACTION" = created
          test "$EVENT_ISSUE" = "$CONTROL_ISSUE"
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$EVENT_COMMENT_LOGIN" = "$TRUSTED_ACCEPTANCE_LOGIN"
          test "$EVENT_COMMENT_USER_ID" = "$TRUSTED_ACCEPTANCE_USER_ID"
          test "$EVENT_COMMENT_AUTHOR_ASSOCIATION" = "$TRUSTED_ACCEPTANCE_ASSOCIATION"
          python - <<'PY'
          import os,re
          body=os.environ['EVENT_COMMENT_BODY'].strip()
          prefix=os.environ['ACTIVATION_REVIEW_PREFIX']
          if not body.startswith(prefix): raise SystemExit('wrong activation acceptance prefix')
          vals={}
          for key in ('activation_commit','parent','tree'):
              found=re.findall(r'(?:^|\s)'+re.escape(key)+r'=([0-9a-f]{40})(?:\s|$)', body)
              if len(found)!=1: raise SystemExit(f'{key} missing/ambiguous: {found}')
              vals[key]=found[0]
          for k,v in vals.items(): open('/tmp/'+k.replace('_','-'),'w').write(v+'\n')
          PY
          activation_commit="$(cat /tmp/activation-commit)"
          activation_parent="$(cat /tmp/parent)"
          activation_tree="$(cat /tmp/tree)"
          live_main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          test "$activation_parent" = "$live_main"
          printf '%s\n' "$live_main" > /tmp/live-main
          gh api "repos/$GITHUB_REPOSITORY/git/commits/$activation_commit" > /tmp/activation-commit.json
          gh api "repos/$GITHUB_REPOSITORY/compare/$activation_parent...$activation_commit" > /tmp/activation-compare.json
          gh api "repos/$GITHUB_REPOSITORY/git/trees/$activation_tree?recursive=1" > /tmp/activation-tree.json
          python - <<'PY'
          import json,os
          commit=json.load(open('/tmp/activation-commit.json'))
          parent=open('/tmp/parent').read().strip()
          tree=open('/tmp/tree').read().strip()
          if [p.get('sha') for p in commit.get('parents',[])] != [parent]: raise SystemExit('activation commit is not sole-parent direct child of live main')
          if (commit.get('tree') or {}).get('sha') != tree: raise SystemExit('activation tree token drift')
          comp=json.load(open('/tmp/activation-compare.json'))
          if comp.get('ahead_by') != 1 or comp.get('behind_by') != 0 or comp.get('total_commits') != 1: raise SystemExit('activation compare is not exact one-commit direct child')
          files=comp.get('files',[])
          if len(files)!=1 or files[0].get('filename') != os.environ['ACTIVATION_MARKER']: raise SystemExit('activation changed-file scope drift')
          entries=[e for e in json.load(open('/tmp/activation-tree.json')).get('tree',[]) if e.get('path')==os.environ['ACTIVATION_MARKER']]
          if len(entries)!=1 or entries[0].get('type')!='blob': raise SystemExit('activation marker blob missing/ambiguous')
          open('/tmp/activation-marker-blob','w').write(entries[0]['sha']+'\n')
          PY
          marker_blob="$(cat /tmp/activation-marker-blob)"
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/$marker_blob" > /tmp/activation-marker.json
          python - <<'PY'
          import base64,json,os
          obj=json.load(open('/tmp/activation-marker.json'))
          if obj.get('encoding')!='base64': raise SystemExit('activation marker encoding drift')
          text=base64.b64decode(obj.get('content','')).decode()
          if text != os.environ['ACTIVATION_TEXT']+'\n': raise SystemExit(f'activation marker text drift: {text!r}')
          PY
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$ACTIVATION_BRANCH" >/dev/null 2>&1; then echo 'activation branch already exists before accepted activation event' >&2; exit 1; fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$PUBLICATION_BRANCH" >/dev/null 2>&1; then echo 'publication branch already exists' >&2; exit 1; fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$DISPATCH_BRANCH" >/dev/null 2>&1; then echo 'dispatch branch already exists' >&2; exit 1; fi
          printf '%s\n' "$EVENT_COMMENT_ID" > /tmp/activation-review-id
          printf '%s\n' "$EVENT_COMMENT_CREATED" > /tmp/activation-review-created-at
          printf '%s\n' "$EVENT_COMMENT_UPDATED" > /tmp/activation-review-updated-at
          printf '%s\n' "$EVENT_COMMENT_LOGIN" > /tmp/activation-review-login
          printf '%s\n' "$EVENT_COMMENT_USER_ID" > /tmp/activation-review-user-id
          printf '%s\n' "$EVENT_COMMENT_AUTHOR_ASSOCIATION" > /tmp/activation-review-author-association

      - name: Fresh governance and source recheck, then create activation ref only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_COMMENT_ID: ${{ github.event.comment.id }}
          EVENT_COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$CONTROL_ISSUE/comments?per_page=100" > /tmp/issue60.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/$AUTH_PR" > /tmp/auth-pr.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > /tmp/source-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT" > /tmp/source-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/$SOURCE_PR/reviews/$SOURCE_AUDIT_REVIEW" > /tmp/source-review.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/$ACTIVATION_WORKFLOW_FILE/runs?event=issue_comment&per_page=100" > /tmp/activation-runs.json
          python - <<'PY'
          import json,os,re
          pages=json.load(open('/tmp/issue60.json')); comments=[c for page in pages for c in page]
          begins={}; closed=set()
          for c in comments:
              first=((c.get('body') or '').splitlines() or [''])[0].strip()
              if first.startswith('WRITE_QUIET_BEGIN'): begins[int(c['id'])]=first
              elif first.startswith('WRITE_QUIET_END'):
                  vals=[]
                  for key in ('begin','beginComment','begin_comment'):
                      m=re.search(r'(?:^|[ |])'+re.escape(key)+r'=([^ |]+)',first)
                      if m: vals.append(m.group(1))
                  if not vals: continue
                  if any(not v.isdigit() for v in vals) or len(set(vals))!=1: raise SystemExit(f'conflicting/non-numeric WRITE_QUIET_END aliases in {c["id"]}: {vals}')
                  closed.add(int(vals[0]))
          unmatched=sorted(set(begins)-closed)
          if unmatched: raise SystemExit(f'unmatched WRITE_QUIET_BEGIN before activation ref creation: {unmatched}')
          bodies=[(c.get('body') or '').strip() for c in comments]
          if sum(b.startswith(os.environ['ALLOCATION_PREFIX']) for b in bodies)!=1: raise SystemExit('allocation marker cardinality drift')
          if any(b.startswith(os.environ['CONSUMED_PREFIX']) for b in bodies): raise SystemExit('consumed marker already exists')
          def trusted(c):
              u=c.get('user') or {}
              return (u.get('login')==os.environ['TRUSTED_ACCEPTANCE_LOGIN'] and str(u.get('id'))==os.environ['TRUSTED_ACCEPTANCE_USER_ID'] and c.get('author_association')==os.environ['TRUSTED_ACCEPTANCE_ASSOCIATION'])
          matching=[c for c in comments if (c.get('body') or '').strip().startswith(os.environ['ACTIVATION_REVIEW_PREFIX'])]
          accepted=[c for c in matching if trusted(c)]
          if len(accepted)!=1: raise SystemExit(f'trusted activation acceptance global cardinality must be exactly one, got {len(accepted)}; untrusted matching comments ignored={len(matching)-len(accepted)}')
          a=accepted[0]
          if int(a['id'])!=int(os.environ['EVENT_COMMENT_ID']) or (a.get('body') or '').strip()!=os.environ['EVENT_COMMENT_BODY'].strip(): raise SystemExit('current acceptance event is not the unique durable trusted acceptance')
          if not trusted(a): raise SystemExit('durable acceptance author trust drift')
          if str(a.get('created_at'))!=open('/tmp/activation-review-created-at').read().strip() or str(a.get('updated_at'))!=open('/tmp/activation-review-updated-at').read().strip(): raise SystemExit('activation acceptance timestamp drift')
          if (a.get('user') or {}).get('login')!=open('/tmp/activation-review-login').read().strip() or str((a.get('user') or {}).get('id'))!=open('/tmp/activation-review-user-id').read().strip() or a.get('author_association')!=open('/tmp/activation-review-author-association').read().strip(): raise SystemExit('activation acceptance author identity drift')
          acceptance_id=int(a['id'])
          blockers=('INDEPENDENT_AUDIT::CONFIRMED_DEFECT','INDEPENDENT_AUDIT::MATERIAL_RISK','NOT_ADMISSIBLE','DO NOT USE','FAIL-CLOSED')
          for c in comments:
              if int(c['id'])<=acceptance_id: continue
              body=c.get('body') or ''; first=(body.splitlines() or [''])[0].upper()
              relevant=any(x in body.upper() for x in ('AVPS','ORDINAL45','RECOVERY4','PUBLICATION'))
              if relevant and any(tok in first for tok in blockers): raise SystemExit(f'newer blocking AVPS directive after activation acceptance: {c["id"]} {first}')
          p=json.load(open('/tmp/auth-pr.json'))
          if p['number']!=int(os.environ['AUTH_PR']) or p['state']!='open' or not p['draft'] or p.get('merged_at') is not None or p['head']['sha']!=os.environ['AUTH_HEAD']: raise SystemExit('authorization PR/head drift')
          r=json.load(open('/tmp/source-run.json'))
          if (r['id'],r['head_sha'],r['run_attempt'],r['status'],r['conclusion'])!=(int(os.environ['SOURCE_RUN']),os.environ['SOURCE_HEAD'],1,'completed','success'): raise SystemExit('source run drift')
          art=json.load(open('/tmp/source-artifact.json'))
          if art['id']!=int(os.environ['SOURCE_ARTIFACT']) or art.get('digest')!=os.environ['SOURCE_DIGEST'] or art.get('expired'): raise SystemExit('source artifact drift')
          v=json.load(open('/tmp/source-review.json'))
          if v.get('id')!=int(os.environ['SOURCE_AUDIT_REVIEW']) or v.get('commit_id')!=os.environ['SOURCE_HEAD'] or not str(v.get('body') or '').startswith(os.environ['SOURCE_AUDIT_TOKEN']): raise SystemExit('independent source acceptance drift')
          title=f"AVPS ordinal45 publication v4 activation comment {os.environ['EVENT_COMMENT_ID']}"
          runs=[r for page in json.load(open('/tmp/activation-runs.json')) for r in page.get('workflow_runs',[]) if r.get('display_title')==title]
          if len(runs)!=1: raise SystemExit(f'activation workflow-run identity is not unique; count={len(runs)}')
          rr=runs[0]
          if rr.get('id')!=int(os.environ['GITHUB_RUN_ID']) or rr.get('event')!='issue_comment' or rr.get('run_attempt')!=1: raise SystemExit('activation workflow current-run identity mismatch')
          PY
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" = "$(cat /tmp/live-main)"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$ACTIVATION_BRANCH" >/dev/null 2>&1; then echo 'activation branch appeared before governed creation' >&2; exit 1; fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$PUBLICATION_BRANCH" >/dev/null 2>&1; then echo 'publication branch appeared before governed activation' >&2; exit 1; fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$DISPATCH_BRANCH" >/dev/null 2>&1; then echo 'dispatch branch appeared before governed activation' >&2; exit 1; fi
          activation_commit="$(cat /tmp/activation-commit)"
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$ACTIVATION_BRANCH" -f sha="$activation_commit" > /tmp/activation-ref-created.json
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$ACTIVATION_BRANCH" --jq .object.sha)" = "$activation_commit"
          printf '%s\n' "$GITHUB_RUN_ID" > /tmp/activation-run-id

      - name: Download and verify exact corrected five-byte payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/pubsrc
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT/zip" > /tmp/source.zip
          unzip -q /tmp/source.zip -d /tmp/pubsrc
          root=/tmp/pubsrc/publication-payload
          check() { test -f "$1"; test "$(sha256sum "$1" | awk '{print $1}')" = "$2"; test "$(git hash-object "$1")" = "$3"; }
          check "$root/avps-v2-postconsumption-recovery4-science.yml" "$WORKFLOW_SHA256" "$WORKFLOW_BLOB"
          check "$root/$RUNTIME_DIR/runtime_adapter.py" "$ADAPTER_SHA256" "$ADAPTER_BLOB"
          check "$root/$RUNTIME_DIR/executor.py" "$EXECUTOR_SHA256" "$EXECUTOR_BLOB"
          check "$root/$RUNTIME_DIR/aggregator.py" "$AGGREGATOR_SHA256" "$AGGREGATOR_BLOB"
          check "$root/$RUNTIME_DIR/runtime_contract.json" "$CONTRACT_SHA256" "$CONTRACT_BLOB"

      - name: Construct and verify unreferenced exact-five direct-child publication commit
        id: build
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/pubsrc/publication-payload
          git cat-file -e "$PUBLICATION_PARENT^{commit}"
          export GIT_INDEX_FILE=/tmp/publication.index; rm -f "$GIT_INDEX_FILE"; git read-tree "$PUBLICATION_PARENT^{tree}"
          put() { local src="$1" dst="$2" expected="$3" blob; blob="$(git hash-object -w "$src")"; test "$blob" = "$expected"; git update-index --add --cacheinfo 100644,"$blob","$dst"; }
          put "$root/avps-v2-postconsumption-recovery4-science.yml" "$WORKFLOW_PATH" "$WORKFLOW_BLOB"
          put "$root/$RUNTIME_DIR/runtime_adapter.py" "$RUNTIME_DIR/runtime_adapter.py" "$ADAPTER_BLOB"
          put "$root/$RUNTIME_DIR/executor.py" "$RUNTIME_DIR/executor.py" "$EXECUTOR_BLOB"
          put "$root/$RUNTIME_DIR/aggregator.py" "$RUNTIME_DIR/aggregator.py" "$AGGREGATOR_BLOB"
          put "$root/$RUNTIME_DIR/runtime_contract.json" "$RUNTIME_DIR/runtime_contract.json" "$CONTRACT_BLOB"
          tree="$(git write-tree)"
          export GIT_AUTHOR_NAME='AVPS governed publisher' GIT_AUTHOR_EMAIL='304153003+search-maker@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          export GIT_AUTHOR_DATE='2026-08-31T18:36:10Z' GIT_COMMITTER_DATE='2026-08-31T18:36:10Z'
          commit="$(printf '%s\n' 'Publish exact corrected AVPS Recovery4 ordinal45 execution bytes v3' | git commit-tree "$tree" -p "$PUBLICATION_PARENT")"
          mapfile -t parents < <(git cat-file -p "$commit" | sed -n 's/^parent //p'); test "${#parents[@]}" = 1; test "${parents[0]}" = "$PUBLICATION_PARENT"
          mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r "$PUBLICATION_PARENT" "$commit" | sort)
          expected=("$WORKFLOW_PATH" "$RUNTIME_DIR/aggregator.py" "$RUNTIME_DIR/executor.py" "$RUNTIME_DIR/runtime_adapter.py" "$RUNTIME_DIR/runtime_contract.json"); mapfile -t expected < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" = 5; test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected[@]}")"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"; echo "tree=$tree" >> "$GITHUB_OUTPUT"; printf '%s\n' "$commit" > /tmp/publication-commit; printf '%s\n' "$tree" > /tmp/publication-tree

      - name: Final live governance and activation-history recheck, then publish target ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.build.outputs.commit }}
          EVENT_COMMENT_ID: ${{ github.event.comment.id }}
          EVENT_COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" = "$(cat /tmp/live-main)"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$CONTROL_ISSUE/comments?per_page=100" > /tmp/issue60-final.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/$AUTH_PR" > /tmp/auth-pr-final.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/$ACTIVATION_WORKFLOW_FILE/runs?event=issue_comment&per_page=100" > /tmp/activation-runs-final.json
          python - <<'PY'
          import json,os,re
          pages=json.load(open('/tmp/issue60-final.json')); comments=[c for p in pages for c in p]; begins={}; closed=set()
          for c in comments:
              first=((c.get('body') or '').splitlines() or [''])[0].strip()
              if first.startswith('WRITE_QUIET_BEGIN'): begins[int(c['id'])]=first
              elif first.startswith('WRITE_QUIET_END'):
                  vals=[]
                  for k in ('begin','beginComment','begin_comment'):
                      m=re.search(r'(?:^|[ |])'+re.escape(k)+r'=([^ |]+)',first)
                      if m: vals.append(m.group(1))
                  if not vals: continue
                  if any(not v.isdigit() for v in vals) or len(set(vals))!=1: raise SystemExit(f'bad END aliases at {c["id"]}: {vals}')
                  closed.add(int(vals[0]))
          u=sorted(set(begins)-closed)
          if u: raise SystemExit(f'unmatched WRITE_QUIET_BEGIN before publication mutation: {u}')
          bodies=[(c.get('body') or '').strip() for c in comments]
          if sum(b.startswith(os.environ['ALLOCATION_PREFIX']) for b in bodies)!=1: raise SystemExit('allocation marker cardinality drift at final recheck')
          if any(b.startswith(os.environ['CONSUMED_PREFIX']) for b in bodies): raise SystemExit('consumed marker appeared before publication mutation')
          def trusted(c):
              u=c.get('user') or {}
              return (u.get('login')==os.environ['TRUSTED_ACCEPTANCE_LOGIN'] and str(u.get('id'))==os.environ['TRUSTED_ACCEPTANCE_USER_ID'] and c.get('author_association')==os.environ['TRUSTED_ACCEPTANCE_ASSOCIATION'])
          matching=[c for c in comments if (c.get('body') or '').strip().startswith(os.environ['ACTIVATION_REVIEW_PREFIX'])]
          accepted=[c for c in matching if trusted(c)]
          if len(accepted)!=1 or int(accepted[0]['id'])!=int(os.environ['EVENT_COMMENT_ID']) or (accepted[0].get('body') or '').strip()!=os.environ['EVENT_COMMENT_BODY'].strip(): raise SystemExit(f'trusted activation acceptance changed/duplicated at final recheck; trusted={len(accepted)} untrusted_matching={len(matching)-len(accepted)}')
          if not trusted(accepted[0]): raise SystemExit('trusted acceptance author drift at final recheck')
          if str(accepted[0].get('created_at'))!=open('/tmp/activation-review-created-at').read().strip() or str(accepted[0].get('updated_at'))!=open('/tmp/activation-review-updated-at').read().strip(): raise SystemExit('activation acceptance timestamp mutation detected at final recheck')
          if (accepted[0].get('user') or {}).get('login')!=open('/tmp/activation-review-login').read().strip() or str((accepted[0].get('user') or {}).get('id'))!=open('/tmp/activation-review-user-id').read().strip() or accepted[0].get('author_association')!=open('/tmp/activation-review-author-association').read().strip(): raise SystemExit('activation acceptance author identity mutation detected at final recheck')
          acceptance_id=int(accepted[0]['id'])
          blockers=('INDEPENDENT_AUDIT::CONFIRMED_DEFECT','INDEPENDENT_AUDIT::MATERIAL_RISK','NOT_ADMISSIBLE','DO NOT USE','FAIL-CLOSED')
          for c in comments:
              if int(c['id'])<=acceptance_id: continue
              body=c.get('body') or ''; first=(body.splitlines() or [''])[0].upper()
              relevant=any(x in body.upper() for x in ('AVPS','ORDINAL45','RECOVERY4','PUBLICATION'))
              if relevant and any(tok in first for tok in blockers): raise SystemExit(f'newer blocking AVPS directive at final recheck: {c["id"]} {first}')
          p=json.load(open('/tmp/auth-pr-final.json'))
          if p['number']!=int(os.environ['AUTH_PR']) or p['state']!='open' or not p['draft'] or p.get('merged_at') is not None or p['head']['sha']!=os.environ['AUTH_HEAD']: raise SystemExit('authorization PR/head drift at final recheck')
          title=f"AVPS ordinal45 publication v4 activation comment {os.environ['EVENT_COMMENT_ID']}"
          runs=[r for page in json.load(open('/tmp/activation-runs-final.json')) for r in page.get('workflow_runs',[]) if r.get('display_title')==title]
          if len(runs)!=1: raise SystemExit(f'activation workflow-run history drift at final recheck; count={len(runs)}')
          rr=runs[0]
          if rr.get('id')!=int(os.environ['GITHUB_RUN_ID']) or rr.get('event')!='issue_comment' or rr.get('run_attempt')!=1: raise SystemExit('activation workflow current-run identity drift at final recheck')
          PY
          activation_commit="$(cat /tmp/activation-commit)"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$ACTIVATION_BRANCH" --jq .object.sha)" = "$activation_commit"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$PUBLICATION_BRANCH" >/dev/null 2>&1; then echo 'publication branch appeared during run' >&2; exit 1; fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$DISPATCH_BRANCH" >/dev/null 2>&1; then echo 'dispatch branch appeared during run' >&2; exit 1; fi
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$COMMIT:refs/heads/$PUBLICATION_BRANCH"

      - name: Fresh post-publication governance recheck, then create Draft PR only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.build.outputs.commit }}
          EVENT_COMMENT_ID: ${{ github.event.comment.id }}
          EVENT_COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$CONTROL_ISSUE/comments?per_page=100" > /tmp/issue60-pr.json
          python - <<'PY'
          import json,os,re
          pages=json.load(open('/tmp/issue60-pr.json')); comments=[c for p in pages for c in p]; begins={}; closed=set()
          for c in comments:
              first=((c.get('body') or '').splitlines() or [''])[0].strip()
              if first.startswith('WRITE_QUIET_BEGIN'): begins[int(c['id'])]=first
              elif first.startswith('WRITE_QUIET_END'):
                  vals=[]
                  for k in ('begin','beginComment','begin_comment'):
                      m=re.search(r'(?:^|[ |])'+re.escape(k)+r'=([^ |]+)',first)
                      if m: vals.append(m.group(1))
                  if not vals: continue
                  if any(not v.isdigit() for v in vals) or len(set(vals))!=1: raise SystemExit(f'bad END aliases at PR-create recheck {c["id"]}: {vals}')
                  closed.add(int(vals[0]))
          u=sorted(set(begins)-closed)
          if u: raise SystemExit(f'unmatched WRITE_QUIET_BEGIN before PR creation: {u}')
          def trusted(c):
              u=c.get('user') or {}
              return (u.get('login')==os.environ['TRUSTED_ACCEPTANCE_LOGIN'] and str(u.get('id'))==os.environ['TRUSTED_ACCEPTANCE_USER_ID'] and c.get('author_association')==os.environ['TRUSTED_ACCEPTANCE_ASSOCIATION'])
          matching=[c for c in comments if (c.get('body') or '').strip().startswith(os.environ['ACTIVATION_REVIEW_PREFIX'])]
          accepted=[c for c in matching if trusted(c)]
          if len(accepted)!=1 or int(accepted[0]['id'])!=int(os.environ['EVENT_COMMENT_ID']) or (accepted[0].get('body') or '').strip()!=os.environ['EVENT_COMMENT_BODY'].strip(): raise SystemExit(f'trusted activation acceptance drift before PR creation; trusted={len(accepted)} untrusted_matching={len(matching)-len(accepted)}')
          if not trusted(accepted[0]): raise SystemExit('trusted acceptance author drift before PR creation')
          if (accepted[0].get('user') or {}).get('login')!=open('/tmp/activation-review-login').read().strip() or str((accepted[0].get('user') or {}).get('id'))!=open('/tmp/activation-review-user-id').read().strip() or accepted[0].get('author_association')!=open('/tmp/activation-review-author-association').read().strip(): raise SystemExit('activation acceptance author identity mutation before PR creation')
          blockers=('INDEPENDENT_AUDIT::CONFIRMED_DEFECT','INDEPENDENT_AUDIT::MATERIAL_RISK','NOT_ADMISSIBLE','DO NOT USE','FAIL-CLOSED')
          acceptance_id=int(accepted[0]['id'])
          for c in comments:
              if int(c['id'])<=acceptance_id: continue
              body=c.get('body') or ''; first=(body.splitlines() or [''])[0].upper()
              relevant=any(x in body.upper() for x in ('AVPS','ORDINAL45','RECOVERY4','PUBLICATION'))
              if relevant and any(tok in first for tok in blockers): raise SystemExit(f'newer blocking AVPS directive before PR creation: {c["id"]} {first}')
          PY
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" = "$(cat /tmp/live-main)"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$ACTIVATION_BRANCH" --jq .object.sha)" = "$(cat /tmp/activation-commit)"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$PUBLICATION_BRANCH" --jq .object.sha)" = "$COMMIT"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$DISPATCH_BRANCH" >/dev/null 2>&1; then echo 'dispatch branch appeared before PR creation' >&2; exit 1; fi
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$PUBLICATION_BRANCH" --draft --title 'Publish exact corrected AVPS Recovery4 ordinal45 execution bytes v3' --body "Exact-five publication carrier only. Direct-child publication commit: \`$COMMIT\`; frozen parent: \`$PUBLICATION_PARENT\`. Source artifact: \`$SOURCE_ARTIFACT\` / \`$SOURCE_DIGEST\`. Activation acceptance comment: \`$EVENT_COMMENT_ID\`. No dispatch/consumption/solver/result/Level-B/holdout/production/Taylor/Jerusalem/newMapping. Require fresh publication-mode gate + generic CI + independent audit before merge."

      - name: Emit materializer receipt
        if: always()
        shell: bash
        run: |
          printf 'schema=AVPS_V2_RECOVERY4_ORDINAL45_PUBLICATION_MATERIALIZER_V4\nactivation=%s\nactivationTree=%s\nactivationReview=%s\nactivationReviewCreatedAt=%s\nactivationReviewUpdatedAt=%s\nactivationReviewLogin=%s\nactivationReviewUserId=%s\nactivationReviewAuthorAssociation=%s\nactivationRun=%s\nrun=%s\nattempt=%s\nsourceArtifact=%s\npublicationParent=%s\npublicationCommit=%s\npublicationTree=%s\nsolverExecuted=false\nscienceDispatched=false\nresultOpened=false\n' "$(cat /tmp/activation-commit 2>/dev/null || true)" "$(cat /tmp/tree 2>/dev/null || true)" "$(cat /tmp/activation-review-id 2>/dev/null || true)" "$(cat /tmp/activation-review-created-at 2>/dev/null || true)" "$(cat /tmp/activation-review-updated-at 2>/dev/null || true)" "$(cat /tmp/activation-review-login 2>/dev/null || true)" "$(cat /tmp/activation-review-user-id 2>/dev/null || true)" "$(cat /tmp/activation-review-author-association 2>/dev/null || true)" "$(cat /tmp/activation-run-id 2>/dev/null || true)" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$SOURCE_ARTIFACT" "$PUBLICATION_PARENT" "$(cat /tmp/publication-commit 2>/dev/null || true)" "$(cat /tmp/publication-tree 2>/dev/null || true)" > materializer-v4-receipt.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: avps-v2-recovery4-ordinal45-publication-materializer-v4-${{ github.run_id }}
          path: materializer-v4-receipt.txt
          if-no-files-found: error