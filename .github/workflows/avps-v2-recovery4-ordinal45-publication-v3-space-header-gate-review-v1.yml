name: Review AVPS ordinal45 publication-v3 space-header gate correction

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery4-ordinal45-publication-v3-space-header-gate-review-v1.yml
      - .github/workflows/avps-v2-recovery4-ordinal45-execution-publication-v3-review.yml

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SELF: .github/workflows/avps-v2-recovery4-ordinal45-publication-v3-space-header-gate-review-v1.yml
      TARGET: .github/workflows/avps-v2-recovery4-ordinal45-execution-publication-v3-review.yml
      INFRA_BRANCH: review/avps-v2-recovery4-ordinal45-publication-v3-space-header-gate-review-v1
      INFRA_BASE: 5f42fd0e3bb6007b74b05619aac2fd9e0f9ef8b7
      APPLY_BRANCH: review/avps-v2-recovery4-ordinal45-publication-v3-space-header-gate-apply-v1
      TARGET_OLD_BLOB: 015cb24a6bcc2613ec16622be2f7d5f0cd9db654
      FAILED_PUBLICATION_REVIEW_RUN: '33473418717'
      FAILED_PUBLICATION_REVIEW_JOB: '99747621781'
      DEFECT_COMMENT: '5489553909'
      LEGACY_BEGIN_COMMENT: '5471141095'
      LEGACY_END_COMMENT: '5471174859'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact review-only scope
        shell: bash
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          if [ "$BRANCH" = "$INFRA_BRANCH" ]; then
            test "$BASE_SHA" = "$INFRA_BASE"
            test "$(git rev-parse HEAD^)" = "$INFRA_BASE"
            test "$(git diff --name-only "$INFRA_BASE"...HEAD)" = "$SELF"
            test "$(git rev-parse "$INFRA_BASE:$TARGET")" = "$TARGET_OLD_BLOB"
            echo MODE=infra >> "$GITHUB_ENV"
          elif [ "$BRANCH" = "$APPLY_BRANCH" ]; then
            test "$(git rev-parse HEAD^)" = "$BASE_SHA"
            test "$(git diff --name-only "$BASE_SHA"...HEAD)" = "$TARGET"
            test "$(git rev-parse "$BASE_SHA:$TARGET")" = "$TARGET_OLD_BLOB"
            test -n "$(git show "$BASE_SHA:$SELF")"
            echo MODE=apply >> "$GITHUB_ENV"
          else
            echo unexpected-branch >&2
            exit 1
          fi
          echo HEAD_SHA="$HEAD_SHA" >> "$GITHUB_ENV"
          echo BASE_SHA="$BASE_SHA" >> "$GITHUB_ENV"

      - name: Generate exact corrected publication-v3 gate deterministically
        shell: bash
        run: |
          set -euo pipefail
          git show "$BASE_SHA:$TARGET" > old-gate.yml
          python - <<'PY'
          from pathlib import Path
          old=Path('old-gate.yml').read_text()
          old_block="""          active={}
          for c in cs:
              first=(str(c.get('body') or '').splitlines() or [''])[0].strip()
              if first.startswith('WRITE_QUIET_BEGIN'):
                  active[int(c['id'])]=1
              elif first.startswith('WRITE_QUIET_END'):
                  f={}
                  for part in first.split('|')[1:]:
                      if '=' in part:
                          k,val=part.split('=',1); f[k.strip()]=val.strip()
                  ids=[]
                  for k in ('begin','beginComment','begin_comment'):
                      if k in f:
                          if not f[k].isdigit(): raise SystemExit('bad END id')
                          ids.append(int(f[k]))
                  if len(set(ids))>1: raise SystemExit('conflicting END aliases')
                  if ids: active.pop(ids[0],None)
          if active: raise SystemExit('unmatched WRITE_QUIET')
          """
          new_block="""          active={}
          end_id_re=re.compile(r'(?:^|[|\\s])(begin|beginComment|begin_comment)=([^\\s|]+)')
          for c in cs:
              first=(str(c.get('body') or '').splitlines() or [''])[0].strip()
              if first.startswith('WRITE_QUIET_BEGIN'):
                  active[int(c['id'])]=1
              elif first.startswith('WRITE_QUIET_END'):
                  pairs=end_id_re.findall(first)
                  ids=[]; by_key={}
                  for k,val in pairs:
                      if not val.isdigit(): raise SystemExit('bad END id')
                      ident=int(val)
                      if k in by_key and by_key[k]!=ident: raise SystemExit('conflicting repeated END alias')
                      by_key[k]=ident; ids.append(ident)
                  if len(set(ids))>1: raise SystemExit('conflicting END aliases')
                  if ids: active.pop(ids[0],None)
          if active: raise SystemExit('unmatched WRITE_QUIET')
          """
          if old.count(old_block)!=1:
              raise SystemExit(f'old parser block cardinality={old.count(old_block)}')
          if '          import json, os\n' not in old:
              raise SystemExit('import anchor drift')
          corrected=old.replace('          import json, os\n','          import json, os, re\n',1).replace(old_block,new_block,1)
          Path('corrected-gate.yml').write_text(corrected)
          PY
          cp corrected-gate.yml corrected-gate.second.yml
          cmp corrected-gate.yml corrected-gate.second.yml
          test "$(git hash-object old-gate.yml)" = "$TARGET_OLD_BLOB"
          if [ "$MODE" = apply ]; then
            cmp corrected-gate.yml "$TARGET"
          fi

      - name: Exercise exact first-line parser compatibility and fail-closed semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          end_id_re=re.compile(r'(?:^|[|\s])(begin|beginComment|begin_comment)=([^\s|]+)')
          def active_after(comments):
              active={}
              for cid,body in comments:
                  first=(str(body or '').splitlines() or [''])[0].strip()
                  if first.startswith('WRITE_QUIET_BEGIN'):
                      active[int(cid)]=1
                  elif first.startswith('WRITE_QUIET_END'):
                      pairs=end_id_re.findall(first)
                      ids=[]; by_key={}
                      for k,val in pairs:
                          if not val.isdigit(): raise ValueError('bad END id')
                          ident=int(val)
                          if k in by_key and by_key[k]!=ident: raise ValueError('conflicting repeated END alias')
                          by_key[k]=ident; ids.append(ident)
                      if len(set(ids))>1: raise ValueError('conflicting END aliases')
                      if ids: active.pop(ids[0],None)
              return active
          fixtures=[
            ([(1,'WRITE_QUIET_BEGIN | X'),(2,'WRITE_QUIET_END | X | begin=1')],{}),
            ([(3,'WRITE_QUIET_BEGIN | X'),(4,'WRITE_QUIET_END | X | beginComment=3')],{}),
            ([(5,'WRITE_QUIET_BEGIN | X'),(6,'WRITE_QUIET_END | X | begin_comment=5')],{}),
            ([(5471141095,'WRITE_QUIET_BEGIN token=AVPS_V2_RECOVERY3_ORDINAL44_SNAPSHOT_33333805393 authorization=x'),(5471174859,'WRITE_QUIET_END begin=5471141095 token=AVPS_V2_RECOVERY3_ORDINAL44_SNAPSHOT_33333805393 science_run=33334396129')],{}),
            ([(7,'WRITE_QUIET_BEGIN | X'),(8,'WRITE_QUIET_END | X | begin=7\nLater prose mentions beginComment=999 and begin_comment=1000')],{}),
            ([(9,'WRITE_QUIET_BEGIN | X')],{9:1}),
          ]
          for comments,want in fixtures:
              got=active_after(comments)
              if got!=want: raise SystemExit(f'fixture mismatch got={got} want={want}')
          bad=[
            [(10,'WRITE_QUIET_BEGIN | X'),(11,'WRITE_QUIET_END | X | begin=10 | beginComment=12')],
            [(13,'WRITE_QUIET_BEGIN | X'),(14,'WRITE_QUIET_END | X | begin=abc')],
            [(15,'WRITE_QUIET_BEGIN | X'),(16,'WRITE_QUIET_END | X | begin=15 | begin=17')],
          ]
          for comments in bad:
              try: active_after(comments)
              except ValueError: pass
              else: raise SystemExit('fail-closed fixture unexpectedly passed')
          PY
          grep -F "import json, os, re" corrected-gate.yml
          grep -F "end_id_re=re.compile(r'(?:^|[|\\s])(begin|beginComment|begin_comment)=([^\\s|]+)')" corrected-gate.yml
          grep -F "SOURCE_ARTIFACT: '9770550740'" corrected-gate.yml
          grep -F "AUTH_PR: '774'" corrected-gate.yml
          grep -F "CONSUMED_PREFIX: ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_DISPATCH_CONSUMED" corrected-gate.yml
          grep -F "WF_BLOB: 2d210b3a161f6889352d600fb9222c974e728034" corrected-gate.yml

      - name: Prove review package is zero-runtime and correction is parser-only
        shell: bash
        run: |
          set -euo pipefail
          git diff --no-index -- old-gate.yml corrected-gate.yml > parser.patch || test "$?" = 1
          python - <<'PY'
          from pathlib import Path
          p=Path('parser.patch').read_text()
          required=['import json, os, re','end_id_re=re.compile','pairs=end_id_re.findall(first)','conflicting repeated END alias']
          for x in required:
              if x not in p: raise SystemExit('missing parser correction token: '+x)
          forbidden=['SOURCE_ARTIFACT:', 'AUTH_PR:', 'WF_BLOB:', 'ADAPTER_BLOB:', 'EXECUTOR_BLOB:', 'AGGREGATOR_BLOB:', 'CONTRACT_BLOB:', 'photonsPerCase']
          for x in forbidden:
              if x in p: raise SystemExit('non-parser contract drift: '+x)
          self_text=Path(__import__('os').environ['SELF']).read_text()
          for x in ['workflow_'+'dispatch:', 'uv'+'spec', 'libRad'+'tran']:
              if x in self_text: raise SystemExit('forbidden review-runtime token: '+x)
          PY

      - name: Emit review receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir out
          cp corrected-gate.yml out/corrected-publication-v3-review-gate.yml
          cp parser.patch out/parser.patch
          OLD_SHA=$(sha256sum old-gate.yml | awk '{print $1}')
          NEW_SHA=$(sha256sum corrected-gate.yml | awk '{print $1}')
          NEW_BLOB=$(git hash-object corrected-gate.yml)
          printf '{"schemaVersion":1,"status":"PASS_AVPS_ORDINAL45_PUBLICATION_V3_SPACE_HEADER_GATE_CORRECTION_ZERO_RUNTIME","mode":"%s","head":"%s","base":"%s","failedRun":33473418717,"failedJob":99747621781,"defectComment":5489553909,"legacyBeginComment":5471141095,"legacyEndComment":5471174859,"oldSha256":"%s","correctedSha256":"%s","correctedGitBlob":"%s","dispatchCreated":false,"seedConsumption":false,"solverExecution":false,"resultsOpened":false,"levelBOpeningAuthorized":false,"holdoutOpened":false,"productionAuthorized":false,"newMappingAuthorized":false,"taylorOrJerusalemUsed":false}\n' "$MODE" "$HEAD_SHA" "$BASE_SHA" "$OLD_SHA" "$NEW_SHA" "$NEW_BLOB" > out/receipt.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: avps-ordinal45-publication-v3-space-header-gate-correction-review
          path: out/
          if-no-files-found: error
          compression-level: 0
