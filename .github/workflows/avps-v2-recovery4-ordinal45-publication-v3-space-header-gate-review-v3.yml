name: Review AVPS ordinal45 publication-v3 space-header gate correction v3

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery4-ordinal45-publication-v3-space-header-gate-review-v3.yml
      - .github/workflows/avps-v2-recovery4-ordinal45-execution-publication-v3-review.yml

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SELF: .github/workflows/avps-v2-recovery4-ordinal45-publication-v3-space-header-gate-review-v3.yml
      TARGET: .github/workflows/avps-v2-recovery4-ordinal45-execution-publication-v3-review.yml
      INFRA_BRANCH: review/avps-v2-recovery4-ordinal45-publication-v3-space-header-gate-review-v3
      INFRA_BASE: 5f42fd0e3bb6007b74b05619aac2fd9e0f9ef8b7
      APPLY_BRANCH: review/avps-v2-recovery4-ordinal45-publication-v3-space-header-gate-apply-v3
      TARGET_OLD_BLOB: 015cb24a6bcc2613ec16622be2f7d5f0cd9db654
      FAILED_PUBLICATION_REVIEW_RUN: '33473418717'
      FAILED_PUBLICATION_REVIEW_JOB: '99747621781'
      DEFECT_COMMENT: '5489553909'
      LEGACY_BEGIN_COMMENT: '5471141095'
      LEGACY_END_COMMENT: '5471174859'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact review-only scope
        shell: bash
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          if [ "$BRANCH" = "$INFRA_BRANCH" ]; then
            test "$BASE_SHA" = "$INFRA_BASE"
            test "$(git rev-parse HEAD^)" = "$INFRA_BASE"
            test "$(git diff --name-only "$INFRA_BASE"...HEAD)" = "$SELF"
            test "$(git rev-parse "$INFRA_BASE:$TARGET")" = "$TARGET_OLD_BLOB"
            echo MODE=infra >> "$GITHUB_ENV"
          elif [ "$BRANCH" = "$APPLY_BRANCH" ]; then
            test "$(git rev-parse HEAD^)" = "$BASE_SHA"
            test "$(git diff --name-only "$BASE_SHA"...HEAD)" = "$TARGET"
            test "$(git rev-parse "$BASE_SHA:$TARGET")" = "$TARGET_OLD_BLOB"
            test -n "$(git show "$BASE_SHA:$SELF")"
            echo MODE=apply >> "$GITHUB_ENV"
          else
            echo unexpected-branch >&2
            exit 1
          fi
          echo HEAD_SHA="$HEAD_SHA" >> "$GITHUB_ENV"
          echo BASE_SHA="$BASE_SHA" >> "$GITHUB_ENV"

      - name: Generate exact parser-only corrected gate from frozen blob
        shell: bash
        run: |
          set -euo pipefail
          git show "$BASE_SHA:$TARGET" > old-gate.yml
          test "$(git hash-object old-gate.yml)" = "$TARGET_OLD_BLOB"
          python - <<'PY'
          from pathlib import Path
          old=Path('old-gate.yml').read_text()
          lines=old.splitlines(keepends=True)
          s=lambda i: lines[i].strip()
          starts=[i for i in range(len(lines)-2) if s(i)=='active={}' and s(i+1)=='for c in cs:' and "CONSUMED_PREFIX" in s(i-1)]
          if len(starts)!=1: raise SystemExit(f'parser start cardinality={len(starts)}')
          start=starts[0]
          ends=[i for i in range(start+1,len(lines)) if s(i)=="if active: raise SystemExit('unmatched WRITE_QUIET')"]
          if len(ends)!=1: raise SystemExit(f'parser end cardinality={len(ends)}')
          end=ends[0]
          py_starts=[i for i in range(0,start) if s(i)=="python - <<'PY'"]
          if not py_starts: raise SystemExit('python block start missing')
          py_start=py_starts[-1]
          imports=[i for i in range(py_start+1,start) if s(i)=='import json, os']
          if len(imports)!=1: raise SystemExit(f'import cardinality={len(imports)}')
          imp=imports[0]
          indent=lines[start][:len(lines[start])-len(lines[start].lstrip())]
          if not indent or any((lines[i][:len(lines[i])-len(lines[i].lstrip())] != indent) for i in (start,start+1,end)):
              raise SystemExit('parser indentation drift')
          newline='\r\n' if lines[start].endswith('\r\n') else '\n'
          body=[
            'active={}',
            "end_id_re=re.compile(r'(?:^|[|\\s])(begin|beginComment|begin_comment)=([^\\s|]+)')",
            'for c in cs:',
            "    first=(str(c.get('body') or '').splitlines() or [''])[0].strip()",
            "    if first.startswith('WRITE_QUIET_BEGIN'):",
            "        active[int(c['id'])]=1",
            "    elif first.startswith('WRITE_QUIET_END'):",
            '        pairs=end_id_re.findall(first)',
            '        ids=[]; by_key={}',
            '        for k,val in pairs:',
            "            if not val.isdigit(): raise SystemExit('bad END id')",
            '            ident=int(val)',
            "            if k in by_key and by_key[k]!=ident: raise SystemExit('conflicting repeated END alias')",
            '            by_key[k]=ident; ids.append(ident)',
            "        if len(set(ids))>1: raise SystemExit('conflicting END aliases')",
            '        if ids: active.pop(ids[0],None)',
            "if active: raise SystemExit('unmatched WRITE_QUIET')",
          ]
          replacement=[indent+x+newline for x in body]
          out=lines[:]
          old_import=out[imp]
          prefix=old_import[:len(old_import)-len(old_import.lstrip())]
          suffix='\r\n' if old_import.endswith('\r\n') else '\n'
          out[imp]=prefix+'import json, os, re'+suffix
          out=out[:start]+replacement+out[end+1:]
          corrected=''.join(out)
          if corrected==old: raise SystemExit('no correction produced')
          Path('corrected-gate.yml').write_text(corrected)
          Path('transform.json').write_text(__import__('json').dumps({'parserStartLine':start+1,'parserEndLine':end+1,'importLine':imp+1,'oldBlob':'015cb24a6bcc2613ec16622be2f7d5f0cd9db654'},sort_keys=True)+'\n')
          PY
          cp corrected-gate.yml corrected-gate.second.yml
          cmp corrected-gate.yml corrected-gate.second.yml
          if [ "$MODE" = apply ]; then cmp corrected-gate.yml "$TARGET"; fi

      - name: Exercise first-line legacy and modern fence grammar
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          end_id_re=re.compile(r'(?:^|[|\s])(begin|beginComment|begin_comment)=([^\s|]+)')
          def active_after(comments):
              active={}
              for cid,body in comments:
                  first=(str(body or '').splitlines() or [''])[0].strip()
                  if first.startswith('WRITE_QUIET_BEGIN'):
                      active[int(cid)]=1
                  elif first.startswith('WRITE_QUIET_END'):
                      pairs=end_id_re.findall(first)
                      ids=[]; by_key={}
                      for k,val in pairs:
                          if not val.isdigit(): raise ValueError('bad END id')
                          ident=int(val)
                          if k in by_key and by_key[k]!=ident: raise ValueError('conflicting repeated END alias')
                          by_key[k]=ident; ids.append(ident)
                      if len(set(ids))>1: raise ValueError('conflicting END aliases')
                      if ids: active.pop(ids[0],None)
              return active
          good=[
            ([(1,'WRITE_QUIET_BEGIN | X'),(2,'WRITE_QUIET_END | X | begin=1')],{}),
            ([(3,'WRITE_QUIET_BEGIN | X'),(4,'WRITE_QUIET_END | X | beginComment=3')],{}),
            ([(5,'WRITE_QUIET_BEGIN | X'),(6,'WRITE_QUIET_END | X | begin_comment=5')],{}),
            ([(5471141095,'WRITE_QUIET_BEGIN token=AVPS_V2_RECOVERY3_ORDINAL44_SNAPSHOT_33333805393 authorization=x'),(5471174859,'WRITE_QUIET_END begin=5471141095 token=AVPS_V2_RECOVERY3_ORDINAL44_SNAPSHOT_33333805393 science_run=33334396129')],{}),
            ([(7,'WRITE_QUIET_BEGIN | X'),(8,'WRITE_QUIET_END | X | begin=7\nLater beginComment=999 begin_comment=1000')],{}),
            ([(9,'WRITE_QUIET_BEGIN | X')],{9:1}),
          ]
          for comments,want in good:
              got=active_after(comments)
              if got!=want: raise SystemExit(f'fixture mismatch got={got} want={want}')
          bad=[
            [(10,'WRITE_QUIET_BEGIN | X'),(11,'WRITE_QUIET_END | X | begin=10 | beginComment=12')],
            [(13,'WRITE_QUIET_BEGIN | X'),(14,'WRITE_QUIET_END | X | begin=abc')],
            [(15,'WRITE_QUIET_BEGIN | X'),(16,'WRITE_QUIET_END begin=15 begin=17')],
          ]
          for comments in bad:
              try: active_after(comments)
              except ValueError: pass
              else: raise SystemExit('fail-closed fixture unexpectedly passed')
          PY

      - name: Prove frozen governance and exact-five bindings did not drift
        shell: bash
        run: |
          set -euo pipefail
          for token in \
            "SOURCE_ARTIFACT: '9770550740'" \
            "SOURCE_HEAD: c0910978a6d9ca754695a6289a9cc3021d2d4db7" \
            "AUTH_PR: '774'" \
            "AUTH_HEAD: 6e095b4b1603c90dcee0943295909b30cd1b374d" \
            "CONSUMED_PREFIX: ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_DISPATCH_CONSUMED" \
            "WF_BLOB: 2d210b3a161f6889352d600fb9222c974e728034" \
            "ADAPTER_BLOB: e4b690c2969fd01ecde5b08f554e47ad50b40914" \
            "EXECUTOR_BLOB: 7dc38e31c19701b1a1ceef300d75105cff179290" \
            "AGGREGATOR_BLOB: 6afc8b0d21c2b5553c251dc9ca5524c795ed2646" \
            "CONTRACT_BLOB: 2d5f71d80b5e573b86775c2806b80dcc1fbe02f4"; do
            grep -F "$token" old-gate.yml >/dev/null
            grep -F "$token" corrected-gate.yml >/dev/null
          done
          grep -F "import json, os, re" corrected-gate.yml >/dev/null
          grep -F "end_id_re=re.compile(r'(?:^|[|\\s])(begin|beginComment|begin_comment)=([^\\s|]+)')" corrected-gate.yml >/dev/null
          python - <<'PY'
          from pathlib import Path
          import difflib
          old=Path('old-gate.yml').read_text().splitlines()
          new=Path('corrected-gate.yml').read_text().splitlines()
          patch='\n'.join(difflib.unified_diff(old,new,fromfile='old',tofile='corrected',n=0))+'\n'
          Path('parser.patch').write_text(patch)
          required=['+          import json, os, re', '+          end_id_re=re.compile', '+                  pairs=end_id_re.findall(first)', "+                          if k in by_key and by_key[k]!=ident: raise SystemExit('conflicting repeated END alias')"]
          for x in required:
              if x not in patch: raise SystemExit('missing correction diff: '+x)
          protected=['9770550740','c0910978a6d9ca754695a6289a9cc3021d2d4db7','6e095b4b1603c90dcee0943295909b30cd1b374d','2d210b3a161f6889352d600fb9222c974e728034','e4b690c2969fd01ecde5b08f554e47ad50b40914','7dc38e31c19701b1a1ceef300d75105cff179290','6afc8b0d21c2b5553c251dc9ca5524c795ed2646','2d5f71d80b5e573b86775c2806b80dcc1fbe02f4']
          for x in protected:
              if any((line.startswith('+') or line.startswith('-')) and x in line for line in patch.splitlines()): raise SystemExit('protected binding changed: '+x)
          PY

      - name: Prove reviewer itself is zero-runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path(__import__('os').environ['SELF']).read_text()
          for x in ['workflow_'+'dispatch:', 'uv'+'spec', 'libRad'+'tran', 'micro'+'mamba']:
              if x in p: raise SystemExit('forbidden reviewer token: '+x)
          PY

      - name: Emit deterministic review receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir out
          cp corrected-gate.yml parser.patch transform.json out/
          OLD_SHA=$(sha256sum old-gate.yml | awk '{print $1}')
          NEW_SHA=$(sha256sum corrected-gate.yml | awk '{print $1}')
          NEW_BLOB=$(git hash-object corrected-gate.yml)
          printf '{"schemaVersion":1,"status":"PASS_AVPS_ORDINAL45_PUBLICATION_V3_SPACE_HEADER_GATE_CORRECTION_V3_ZERO_RUNTIME","mode":"%s","head":"%s","base":"%s","failedRun":33473418717,"failedJob":99747621781,"defectComment":5489553909,"legacyBeginComment":5471141095,"legacyEndComment":5471174859,"oldGitBlob":"015cb24a6bcc2613ec16622be2f7d5f0cd9db654","oldSha256":"%s","correctedSha256":"%s","correctedGitBlob":"%s","dispatchCreated":false,"seedConsumption":false,"solverExecution":false,"resultsOpened":false,"levelBOpeningAuthorized":false,"holdoutOpened":false,"productionAuthorized":false,"newMappingAuthorized":false,"taylorOrJerusalemUsed":false}\n' "$MODE" "$HEAD_SHA" "$BASE_SHA" "$OLD_SHA" "$NEW_SHA" "$NEW_BLOB" > out/receipt.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: avps-ordinal45-publication-v3-space-header-gate-correction-review-v3
          path: out/
          if-no-files-found: error
          compression-level: 0
