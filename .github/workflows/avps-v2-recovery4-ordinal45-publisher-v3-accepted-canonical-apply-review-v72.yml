name: Review AVPS Recovery4 ordinal45 publisher v3 accepted-canonical apply v72

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery4-ordinal45-publisher-v3-accepted-canonical-apply-review-v72.yml
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v3.yml

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: avps-v2-recovery4-ordinal45-publisher-v3-accepted-canonical-apply-v72-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      INFRA_BASE: e749d042bfe8d99a8b2590945baf8c084e19953b
      INFRA_BRANCH: review/avps-v2-recovery4-ordinal45-publisher-v3-accepted-canonical-apply-review-v72
      INFRA_PATH: .github/workflows/avps-v2-recovery4-ordinal45-publisher-v3-accepted-canonical-apply-review-v72.yml
      APPLY_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v3-v72
      TARGET_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v3.yml
      SOURCE_PUBLISHER_BLOB: c444306cd5f7e3e44182062d565ccc770345f00d
      SOURCE_PUBLISHER_SHA256: 9b61da35e7eee5e2db057e17ac2f81cbc5bfa006fab5142feada3095f62f83d8
      ACCEPTED_CANONICAL_BLOB: 516d535d4980fe2802e1e69c552054702fac5b37
      ACCEPTED_CANONICAL_SHA256: 3ada0a15f1c5d381c8dee8a81f79ee93ce9bf658701f5b80e804f384cf66edad
      PR939: '939'
      PR939_HEAD: 48702f0335359d3a05603c71a2137328825bb51b
      PR939_MERGE: e749d042bfe8d99a8b2590945baf8c084e19953b
      PR939_DEDICATED_RUN: '33824358209'
      PR939_DEDICATED_JOB: '100873715883'
      PR939_GENERIC_RUN: '33824358038'
      PR939_GENERIC_JOB: '100873715534'
      PR939_ARTIFACT: '9919395953'
      PR939_ARTIFACT_NAME: avps-v2-recovery4-ordinal45-publisher-v3-final-premutation-guard-correction-review-v7
      PR939_ARTIFACT_DIGEST: sha256:5e09101209a65748d3dafe5cd3051cc66ad2580da8c5fa7ac07316242994a72b
      BACKUP_ACCEPT: '5534409038'
      PRIMARY_ACCEPT: '5534840528'
      POSTMERGE_RUN: '33833497234'
      POSTMERGE_JOB: '100901195513'
      DISPATCH_BRANCH: dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-ordinal-45
      SCIENCE_WORKFLOW: avps-v2-postconsumption-recovery4-science.yml
      PUBLISHER_WORKFLOW: avps-v2-recovery4-ordinal45-final-dispatch-publisher-v3.yml

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Bind exact infra or apply identity
        id: mode
        shell: bash
        env:
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$EVENT_ACTION" = opened
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          set -- $(git rev-list --parents -n1 "$EVENT_HEAD")
          test "$#" -eq 2
          test "$2" = "$EVENT_BASE"
          if [ "$EVENT_BRANCH" = "$INFRA_BRANCH" ]; then
            MODE=infra
            test "$EVENT_BASE" = "$INFRA_BASE"
            expected=$(printf 'A\t%s' "$INFRA_PATH")
            test "$(git diff --name-status "$EVENT_BASE"...HEAD)" = "$expected"
            test "$(git rev-parse "$EVENT_BASE:$TARGET_PATH")" = "$SOURCE_PUBLISHER_BLOB"
          elif [ "$EVENT_BRANCH" = "$APPLY_BRANCH" ]; then
            MODE=apply
            set -- $(git rev-list --parents -n1 "$EVENT_BASE")
            test "$#" -eq 3
            test "$2" = "$INFRA_BASE"
            INFRA_HEAD="$3"
            set -- $(git rev-list --parents -n1 "$INFRA_HEAD")
            test "$#" -eq 2
            test "$2" = "$INFRA_BASE"
            expected_infra=$(printf 'A\t%s' "$INFRA_PATH")
            test "$(git diff --name-status "$INFRA_BASE" "$INFRA_HEAD")" = "$expected_infra"
            test "$(git rev-parse "$EVENT_BASE:$INFRA_PATH")" = "$(git rev-parse "$INFRA_HEAD:$INFRA_PATH")"
            test "$(git rev-parse "$EVENT_BASE:$TARGET_PATH")" = "$SOURCE_PUBLISHER_BLOB"
            expected=$(printf 'M\t%s' "$TARGET_PATH")
            test "$(git diff --name-status "$EVENT_BASE"...HEAD)" = "$expected"
          else
            echo unexpected-v72-branch >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > pr-live.json
          python - <<'PY'
          import json,os
          p=json.load(open('pr-live.json'))
          if p.get('state')!='open' or p.get('draft') is not False or p.get('merged_at') is not None:
              raise SystemExit('V72 PR must remain open/non-Draft/unmerged')
          if p['head']['sha']!=os.environ['EVENT_HEAD'] or p['base']['sha']!=os.environ['EVENT_BASE']:
              raise SystemExit('V72 PR identity drift')
          PY
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "EVENT_HEAD=$EVENT_HEAD" >> "$GITHUB_ENV"
          echo "EVENT_BASE=$EVENT_BASE" >> "$GITHUB_ENV"

      - name: Bind accepted PR939 bytes, audits, artifact, merge and postmerge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p v72
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR939" > v72/pr939.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR939_DEDICATED_RUN" > v72/pr939-d.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR939_DEDICATED_RUN/jobs?per_page=100" > v72/pr939-dj.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR939_GENERIC_RUN" > v72/pr939-g.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR939_GENERIC_RUN/jobs?per_page=100" > v72/pr939-gj.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR939_DEDICATED_RUN/artifacts?per_page=100" > v72/pr939-artifacts.json
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$BACKUP_ACCEPT" > v72/backup-accept.json
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$PRIMARY_ACCEPT" > v72/primary-accept.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$POSTMERGE_RUN" > v72/postmerge.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$POSTMERGE_RUN/jobs?per_page=100" > v72/postmerge-jobs.json
          gh run download "$PR939_DEDICATED_RUN" --repo "$GITHUB_REPOSITORY" --name "$PR939_ARTIFACT_NAME" --dir v72/pr939-artifact
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          z=lambda p:json.load(open(p))
          p=z('v72/pr939.json')
          if p.get('state')!='closed' or p.get('merged_at') is None or p['head']['sha']!=os.environ['PR939_HEAD'] or p.get('merge_commit_sha')!=os.environ['PR939_MERGE']:
              raise SystemExit('PR939 merged identity drift')
          d=z('v72/pr939-d.json'); g=z('v72/pr939-g.json')
          for r,key in ((d,'PR939_DEDICATED_RUN'),(g,'PR939_GENERIC_RUN')):
              if r.get('id')!=int(os.environ[key]) or r.get('head_sha')!=os.environ['PR939_HEAD'] or r.get('run_attempt')!=1 or r.get('status')!='completed' or r.get('conclusion')!='success':
                  raise SystemExit('PR939 attempt1 run drift '+key)
          for fn,key in (('v72/pr939-dj.json','PR939_DEDICATED_JOB'),('v72/pr939-gj.json','PR939_GENERIC_JOB')):
              jobs=z(fn).get('jobs',[])
              if not any(int(j.get('id') or 0)==int(os.environ[key]) and j.get('conclusion')=='success' for j in jobs):
                  raise SystemExit('PR939 job drift '+key)
          arts=z('v72/pr939-artifacts.json').get('artifacts',[])
          aa=[a for a in arts if int(a.get('id') or 0)==int(os.environ['PR939_ARTIFACT'])]
          if len(aa)!=1 or aa[0].get('name')!=os.environ['PR939_ARTIFACT_NAME'] or aa[0].get('digest')!=os.environ['PR939_ARTIFACT_DIGEST'] or aa[0].get('expired') is True:
              raise SystemExit('PR939 artifact drift')
          for fn,cid,prefix in (
              ('v72/backup-accept.json','BACKUP_ACCEPT','BACKUP_INDEPENDENT_AUDIT::ACCEPT_AVPS_ORDINAL45_PUBLISHER_V3_FINAL_PREMUTATION_GUARD_CORRECTION_REVIEW_V7_PR939'),
              ('v72/primary-accept.json','PRIMARY_ACCEPT','INDEPENDENT_AUDIT::ACCEPT_AVPS_ORDINAL45_PUBLISHER_V3_FINAL_PREMUTATION_GUARD_CORRECTION_REVIEW_V7_PR939')):
              c=z(fn); u=c.get('user') or {}
              if int(c.get('id') or 0)!=int(os.environ[cid]) or not str(c.get('body') or '').startswith(prefix) or u.get('login')!='search-maker' or int(u.get('id') or 0)!=304153003 or c.get('author_association')!='OWNER':
                  raise SystemExit('PR939 acceptance binding drift '+cid)
          pm=z('v72/postmerge.json')
          if pm.get('id')!=int(os.environ['POSTMERGE_RUN']) or pm.get('head_sha')!=os.environ['PR939_MERGE'] or pm.get('event')!='push' or pm.get('run_attempt')!=1 or pm.get('status')!='completed' or pm.get('conclusion')!='success':
              raise SystemExit('PR939 postmerge run drift')
          jobs=z('v72/postmerge-jobs.json').get('jobs',[])
          if not any(int(j.get('id') or 0)==int(os.environ['POSTMERGE_JOB']) and j.get('conclusion')=='success' for j in jobs):
              raise SystemExit('PR939 postmerge job drift')
          files=list(Path('v72/pr939-artifact').rglob('canonical-corrected-publisher-v3.yml'))
          if len(files)!=1: raise SystemExit('accepted canonical multiplicity drift')
          b=files[0].read_bytes()
          if hashlib.sha256(b).hexdigest()!=os.environ['ACCEPTED_CANONICAL_SHA256']:
              raise SystemExit('accepted canonical SHA drift')
          blob=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          if blob!=os.environ['ACCEPTED_CANONICAL_BLOB']:
              raise SystemExit('accepted canonical blob drift')
          Path('v72/accepted-canonical.yml').write_bytes(b)
          PY
          git show "$EVENT_BASE:$TARGET_PATH" > v72/source-publisher.yml
          test "$(git hash-object v72/source-publisher.yml)" = "$SOURCE_PUBLISHER_BLOB"
          test "$(sha256sum v72/source-publisher.yml | awk '{print $1}')" = "$SOURCE_PUBLISHER_SHA256"
          if [ "${{ steps.mode.outputs.mode }}" = apply ]; then
            cmp v72/accepted-canonical.yml "$TARGET_PATH"
            test "$(git hash-object "$TARGET_PATH")" = "$ACCEPTED_CANONICAL_BLOB"
            test "$(sha256sum "$TARGET_PATH" | awk '{print $1}')" = "$ACCEPTED_CANONICAL_SHA256"
          fi

      - name: Fresh fail-closed governance and one-use absence boundary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EVENT_BASE"
          set +e
          git ls-remote --exit-code --heads origin "$DISPATCH_BRANCH" >v72/dispatch-ref.txt 2>v72/dispatch-ref.err
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then echo 'ordinal45 dispatch ref exists' >&2; exit 1; fi
          if [ "$rc" -ne 2 ]; then echo "dispatch ref read failure rc=$rc" >&2; cat v72/dispatch-ref.err >&2; exit 1; fi
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > v72/issue60-pages.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/$PUBLISHER_WORKFLOW/runs?event=workflow_dispatch&per_page=100" > v72/publisher-runs.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/$SCIENCE_WORKFLOW/runs?event=workflow_dispatch&per_page=100" > v72/science-runs.json
          python - <<'PY'
          import json,os,re,textwrap
          from pathlib import Path
          comments=[c for page in json.load(open('v72/issue60-pages.json')) for c in page]
          active={}
          end_id_re=re.compile(r'(?:^|[|\s])(begin|beginComment|begin_comment)=([^\s|]+)')
          for c in comments:
              first=(str(c.get('body') or '').splitlines() or [''])[0].strip()
              if first.startswith('WRITE_QUIET_BEGIN'):
                  active[int(c['id'])]=1
              elif first.startswith('WRITE_QUIET_END'):
                  pairs=end_id_re.findall(first); ids=[]; by_key={}
                  for k,val in pairs:
                      if not val.isdigit(): raise SystemExit('bad WRITE_QUIET_END id')
                      ident=int(val)
                      if k in by_key and by_key[k]!=ident: raise SystemExit('conflicting repeated WRITE_QUIET_END alias')
                      by_key[k]=ident; ids.append(ident)
                  if len(set(ids))>1: raise SystemExit('conflicting WRITE_QUIET_END aliases')
                  if ids: active.pop(ids[0],None)
          if active: raise SystemExit('unmatched WRITE_QUIET '+repr(sorted(active)))
          txt=Path('v72/accepted-canonical.yml').read_text()
          a=txt.index('          import re\n          B={'); b=txt.index('          def state_check():',a)
          ns={}; exec(textwrap.dedent(txt[a:b]),ns)
          blocker=ns['avps_governance_blocker']
          km=re.search(r'(?m)^          KNOWN_DEFECT=([0-9]+)$',txt)
          if not km: raise SystemExit('accepted canonical KNOWN_DEFECT missing')
          cutoff=int(km.group(1))
          for c in comments:
              if int(c.get('id') or 0)>cutoff and blocker(str(c.get('body') or ''),None):
                  raise SystemExit('newer unbound adverse AVPS governance '+str(c.get('id')))
          def flatten(path):
              pages=json.load(open(path)); runs=[]
              if not isinstance(pages,list): raise SystemExit('workflow run pagination drift')
              for p in pages:
                  if not isinstance(p,dict) or not isinstance(p.get('workflow_runs'),list): raise SystemExit('workflow run page drift')
                  runs.extend(p['workflow_runs'])
              return runs
          if flatten('v72/publisher-runs.json'): raise SystemExit('publisher workflow_dispatch already exists')
          if flatten('v72/science-runs.json'): raise SystemExit('Recovery4 science workflow_dispatch already exists')
          PY

      - name: Prove review-only authority boundary and emit receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          mode='${{ steps.mode.outputs.mode }}'
          receipt={
            'schemaVersion':72,
            'status':'PASS_AVPS_RECOVERY4_ORDINAL45_PUBLISHER_V3_ACCEPTED_CANONICAL_APPLY_REVIEW_V72_ZERO_RUNTIME',
            'mode':mode,
            'baseSha':os.environ['EVENT_BASE'],
            'headSha':os.environ['EVENT_HEAD'],
            'targetPath':os.environ['TARGET_PATH'],
            'sourcePublisherBlob':os.environ['SOURCE_PUBLISHER_BLOB'],
            'sourcePublisherSha256':os.environ['SOURCE_PUBLISHER_SHA256'],
            'acceptedCanonicalBlob':os.environ['ACCEPTED_CANONICAL_BLOB'],
            'acceptedCanonicalSha256':os.environ['ACCEPTED_CANONICAL_SHA256'],
            'acceptedReviewPr':int(os.environ['PR939']),
            'acceptedReviewHead':os.environ['PR939_HEAD'],
            'acceptedReviewMerge':os.environ['PR939_MERGE'],
            'backupAcceptComment':int(os.environ['BACKUP_ACCEPT']),
            'primaryAcceptComment':int(os.environ['PRIMARY_ACCEPT']),
            'postmergeRun':int(os.environ['POSTMERGE_RUN']),
            'writeQuietEntered':False,
            'publisherInvoked':False,
            'dispatchCreated':False,
            'consumedMarkerCreated':False,
            'workflowDispatchPerformed':False,
            'solverExecutionPerformed':False,
            'scientificExecutionPerformed':False,
            'resultOpeningAuthorized':False,
            'levelBAdmissionAuthorized':False,
            'holdoutOpened':False,
            'productionAuthorized':False,
            'taylorOrJerusalemUsed':False,
            'newMappingAuthorized':False,
            'requiresSeparatePrimaryAndBackupAcceptanceBeforeApplyMerge':True,
            'requiresSeparatePrimaryAndBackupAcceptanceBeforePublisherInvocation':True,
          }
          open('v72/review-receipt.json','w').write(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          PY
          test -z "$(git status --porcelain --untracked-files=no)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: avps-v2-recovery4-ordinal45-publisher-v3-accepted-canonical-apply-review-v72
          path: |
            v72/accepted-canonical.yml
            v72/review-receipt.json
            v72/pr939.json
            v72/pr939-artifacts.json
            v72/backup-accept.json
            v72/primary-accept.json
            v72/postmerge.json
            v72/issue60-pages.json
          if-no-files-found: error
          compression-level: 0
