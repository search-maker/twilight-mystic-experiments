name: Review AVPS Recovery4 ordinal45 publisher v3 accepted-canonical apply v73

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery4-ordinal45-publisher-v3-accepted-canonical-apply-review-v73.yml
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v3.yml

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: avps-v2-recovery4-ordinal45-publisher-v3-accepted-canonical-apply-v73-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      INFRA_BASE: e749d042bfe8d99a8b2590945baf8c084e19953b
      INFRA_BRANCH: review/avps-v2-recovery4-ordinal45-publisher-v3-accepted-canonical-apply-review-v73
      INFRA_PATH: .github/workflows/avps-v2-recovery4-ordinal45-publisher-v3-accepted-canonical-apply-review-v73.yml
      APPLY_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v3-v73
      TARGET_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v3.yml
      SOURCE_PUBLISHER_BLOB: c444306cd5f7e3e44182062d565ccc770345f00d
      SOURCE_PUBLISHER_SHA256: 9b61da35e7eee5e2db057e17ac2f81cbc5bfa006fab5142feada3095f62f83d8
      ACCEPTED_CANONICAL_BLOB: 516d535d4980fe2802e1e69c552054702fac5b37
      ACCEPTED_CANONICAL_SHA256: 3ada0a15f1c5d381c8dee8a81f79ee93ce9bf658701f5b80e804f384cf66edad
      PR939: '939'
      PR939_HEAD: 48702f0335359d3a05603c71a2137328825bb51b
      PR939_MERGE: e749d042bfe8d99a8b2590945baf8c084e19953b
      PR939_DEDICATED_RUN: '33824358209'
      PR939_DEDICATED_JOB: '100873715883'
      PR939_GENERIC_RUN: '33824358038'
      PR939_GENERIC_JOB: '100873715534'
      PR939_ARTIFACT: '9919395953'
      PR939_ARTIFACT_NAME: avps-v2-recovery4-ordinal45-publisher-v3-final-premutation-guard-correction-review-v7
      PR939_ARTIFACT_DIGEST: sha256:5e09101209a65748d3dafe5cd3051cc66ad2580da8c5fa7ac07316242994a72b
      PR939_BACKUP_ACCEPT: '5534409038'
      PR939_PRIMARY_ACCEPT: '5534840528'
      PR939_POSTMERGE_RUN: '33833497234'
      PR939_POSTMERGE_JOB: '100901195513'
      REJECTED_PR: '941'
      REJECTED_HEAD: 1392b081069423d64e5ea03724b0b312f4e2d0e5
      REJECTED_PATH: .github/workflows/avps-v2-recovery4-ordinal45-publisher-v3-accepted-canonical-apply-review-v72.yml
      REJECTED_BLOB: d767a642f1dd86a09a5d5577e8abaa70a059e0fb
      REJECTED_DEDICATED_RUN: '33833982008'
      REJECTED_DEDICATED_JOB: '100902601580'
      REJECTED_GENERIC_RUN: '33833981971'
      REJECTED_GENERIC_JOB: '100902601476'
      REJECTED_ARTIFACT: '9922646712'
      REJECTED_ARTIFACT_NAME: avps-v2-recovery4-ordinal45-publisher-v3-accepted-canonical-apply-review-v72
      REJECTED_ARTIFACT_DIGEST: sha256:52967b3f96f69508b81a131c9e389a292ffb89dfac570238ed49dc7d762a8b56
      REJECTED_BACKUP_DEFECT: '5535719336'
      REJECTED_PRIMARY_DEFECT: '5535788817'
      SELF_ARTIFACT_NAME: avps-v2-recovery4-ordinal45-publisher-v3-accepted-canonical-apply-review-v73
      DISPATCH_BRANCH: dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-ordinal-45
      SCIENCE_WORKFLOW: avps-v2-postconsumption-recovery4-science.yml
      PUBLISHER_WORKFLOW: avps-v2-recovery4-ordinal45-final-dispatch-publisher-v3.yml
      POSTMERGE_WORKFLOW_PATH: .github/workflows/contract.yml

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Bind exact infra or apply identity
        id: mode
        shell: bash
        env:
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$EVENT_ACTION" = opened
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          set -- $(git rev-list --parents -n1 "$EVENT_HEAD")
          test "$#" -eq 2
          test "$2" = "$EVENT_BASE"
          if [ "$EVENT_BRANCH" = "$INFRA_BRANCH" ]; then
            MODE=infra
            test "$EVENT_BASE" = "$INFRA_BASE"
            expected=$(printf 'A\t%s' "$INFRA_PATH")
            test "$(git diff --name-status "$EVENT_BASE"...HEAD)" = "$expected"
            test "$(git rev-parse "$EVENT_BASE:$TARGET_PATH")" = "$SOURCE_PUBLISHER_BLOB"
          elif [ "$EVENT_BRANCH" = "$APPLY_BRANCH" ]; then
            MODE=apply
            set -- $(git rev-list --parents -n1 "$EVENT_BASE")
            test "$#" -eq 3
            test "$2" = "$INFRA_BASE"
            INFRA_HEAD="$3"
            set -- $(git rev-list --parents -n1 "$INFRA_HEAD")
            test "$#" -eq 2
            test "$2" = "$INFRA_BASE"
            expected_infra=$(printf 'A\t%s' "$INFRA_PATH")
            test "$(git diff --name-status "$INFRA_BASE" "$INFRA_HEAD")" = "$expected_infra"
            test "$(git rev-parse "$EVENT_BASE:$INFRA_PATH")" = "$(git rev-parse "$INFRA_HEAD:$INFRA_PATH")"
            test "$(git rev-parse "$EVENT_BASE:$TARGET_PATH")" = "$SOURCE_PUBLISHER_BLOB"
            expected=$(printf 'M\t%s' "$TARGET_PATH")
            test "$(git diff --name-status "$EVENT_BASE"...HEAD)" = "$expected"
            echo "INFRA_HEAD=$INFRA_HEAD" >> "$GITHUB_ENV"
          else
            echo unexpected-v73-branch >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > pr-live.json
          python - <<'PY'
          import json,os
          p=json.load(open('pr-live.json'))
          if p.get('state')!='open' or p.get('draft') is not False or p.get('merged_at') is not None:
              raise SystemExit('V73 PR must remain open/non-Draft/unmerged')
          if p['head']['sha']!=os.environ['EVENT_HEAD'] or p['base']['sha']!=os.environ['EVENT_BASE']:
              raise SystemExit('V73 PR identity drift')
          PY
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "EVENT_HEAD=$EVENT_HEAD" >> "$GITHUB_ENV"
          echo "EVENT_BASE=$EVENT_BASE" >> "$GITHUB_ENV"

      - name: Bind accepted PR939 bytes audits artifact merge and postmerge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p v73
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR939" > v73/pr939.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR939_DEDICATED_RUN" > v73/pr939-d.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR939_DEDICATED_RUN/jobs?per_page=100" > v73/pr939-dj.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR939_GENERIC_RUN" > v73/pr939-g.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR939_GENERIC_RUN/jobs?per_page=100" > v73/pr939-gj.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR939_DEDICATED_RUN/artifacts?per_page=100" > v73/pr939-artifacts.json
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$PR939_BACKUP_ACCEPT" > v73/pr939-backup-accept.json
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$PR939_PRIMARY_ACCEPT" > v73/pr939-primary-accept.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR939_POSTMERGE_RUN" > v73/pr939-postmerge.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR939_POSTMERGE_RUN/jobs?per_page=100" > v73/pr939-postmerge-jobs.json
          gh run download "$PR939_DEDICATED_RUN" --repo "$GITHUB_REPOSITORY" --name "$PR939_ARTIFACT_NAME" --dir v73/pr939-artifact
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          z=lambda p:json.load(open(p))
          p=z('v73/pr939.json')
          if p.get('state')!='closed' or p.get('merged_at') is None or p['head']['sha']!=os.environ['PR939_HEAD'] or p.get('merge_commit_sha')!=os.environ['PR939_MERGE']:
              raise SystemExit('PR939 merged identity drift')
          for fn,key,jobfn,jobkey in (
              ('v73/pr939-d.json','PR939_DEDICATED_RUN','v73/pr939-dj.json','PR939_DEDICATED_JOB'),
              ('v73/pr939-g.json','PR939_GENERIC_RUN','v73/pr939-gj.json','PR939_GENERIC_JOB')):
              r=z(fn)
              if r.get('id')!=int(os.environ[key]) or r.get('head_sha')!=os.environ['PR939_HEAD'] or r.get('run_attempt')!=1 or r.get('status')!='completed' or r.get('conclusion')!='success':
                  raise SystemExit('PR939 attempt1 run drift '+key)
              jobs=z(jobfn).get('jobs',[])
              if not any(int(j.get('id') or 0)==int(os.environ[jobkey]) and j.get('conclusion')=='success' for j in jobs):
                  raise SystemExit('PR939 job drift '+jobkey)
          arts=z('v73/pr939-artifacts.json').get('artifacts',[])
          aa=[a for a in arts if int(a.get('id') or 0)==int(os.environ['PR939_ARTIFACT'])]
          if len(aa)!=1 or aa[0].get('name')!=os.environ['PR939_ARTIFACT_NAME'] or aa[0].get('digest')!=os.environ['PR939_ARTIFACT_DIGEST'] or aa[0].get('expired') is True:
              raise SystemExit('PR939 artifact drift')
          for fn,cid,prefix in (
              ('v73/pr939-backup-accept.json','PR939_BACKUP_ACCEPT','BACKUP_INDEPENDENT_AUDIT::ACCEPT_AVPS_ORDINAL45_PUBLISHER_V3_FINAL_PREMUTATION_GUARD_CORRECTION_REVIEW_V7_PR939'),
              ('v73/pr939-primary-accept.json','PR939_PRIMARY_ACCEPT','INDEPENDENT_AUDIT::ACCEPT_AVPS_ORDINAL45_PUBLISHER_V3_FINAL_PREMUTATION_GUARD_CORRECTION_REVIEW_V7_PR939')):
              c=z(fn); u=c.get('user') or {}
              if int(c.get('id') or 0)!=int(os.environ[cid]) or not str(c.get('body') or '').startswith(prefix) or u.get('login')!='search-maker' or int(u.get('id') or 0)!=304153003 or c.get('author_association')!='OWNER':
                  raise SystemExit('PR939 acceptance binding drift '+cid)
          pm=z('v73/pr939-postmerge.json')
          if pm.get('id')!=int(os.environ['PR939_POSTMERGE_RUN']) or pm.get('head_sha')!=os.environ['PR939_MERGE'] or pm.get('event')!='push' or pm.get('run_attempt')!=1 or pm.get('status')!='completed' or pm.get('conclusion')!='success':
              raise SystemExit('PR939 postmerge run drift')
          jobs=z('v73/pr939-postmerge-jobs.json').get('jobs',[])
          if not any(int(j.get('id') or 0)==int(os.environ['PR939_POSTMERGE_JOB']) and j.get('conclusion')=='success' for j in jobs):
              raise SystemExit('PR939 postmerge job drift')
          files=list(Path('v73/pr939-artifact').rglob('canonical-corrected-publisher-v3.yml'))
          if len(files)!=1: raise SystemExit('accepted canonical multiplicity drift')
          b=files[0].read_bytes()
          if hashlib.sha256(b).hexdigest()!=os.environ['ACCEPTED_CANONICAL_SHA256']:
              raise SystemExit('accepted canonical SHA drift')
          blob=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          if blob!=os.environ['ACCEPTED_CANONICAL_BLOB']:
              raise SystemExit('accepted canonical blob drift')
          Path('v73/accepted-canonical.yml').write_bytes(b)
          PY
          git show "$EVENT_BASE:$TARGET_PATH" > v73/source-publisher.yml
          test "$(git hash-object v73/source-publisher.yml)" = "$SOURCE_PUBLISHER_BLOB"
          test "$(sha256sum v73/source-publisher.yml | awk '{print $1}')" = "$SOURCE_PUBLISHER_SHA256"
          if [ "${{ steps.mode.outputs.mode }}" = apply ]; then
            cmp v73/accepted-canonical.yml "$TARGET_PATH"
            test "$(git hash-object "$TARGET_PATH")" = "$ACCEPTED_CANONICAL_BLOB"
            test "$(sha256sum "$TARGET_PATH" | awk '{print $1}')" = "$ACCEPTED_CANONICAL_SHA256"
          fi

      - name: Bind rejected PR941 immutable evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$REJECTED_PR" > v73/rejected-pr941.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REJECTED_DEDICATED_RUN" > v73/rejected-d.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REJECTED_DEDICATED_RUN/jobs?per_page=100" > v73/rejected-dj.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REJECTED_GENERIC_RUN" > v73/rejected-g.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REJECTED_GENERIC_RUN/jobs?per_page=100" > v73/rejected-gj.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REJECTED_DEDICATED_RUN/artifacts?per_page=100" > v73/rejected-artifacts.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/$REJECTED_PR/files?per_page=100" > v73/rejected-files.json
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$REJECTED_BACKUP_DEFECT" > v73/rejected-backup-defect.json
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$REJECTED_PRIMARY_DEFECT" > v73/rejected-primary-defect.json
          python - <<'PY'
          import json,os
          z=lambda p:json.load(open(p))
          p=z('v73/rejected-pr941.json')
          if p.get('state')!='closed' or p.get('merged_at') is not None or p['head']['sha']!=os.environ['REJECTED_HEAD'] or p['base']['sha']!=os.environ['INFRA_BASE']:
              raise SystemExit('PR941 rejected identity drift')
          for fn,key,jobfn,jobkey in (
              ('v73/rejected-d.json','REJECTED_DEDICATED_RUN','v73/rejected-dj.json','REJECTED_DEDICATED_JOB'),
              ('v73/rejected-g.json','REJECTED_GENERIC_RUN','v73/rejected-gj.json','REJECTED_GENERIC_JOB')):
              r=z(fn)
              if r.get('id')!=int(os.environ[key]) or r.get('head_sha')!=os.environ['REJECTED_HEAD'] or r.get('run_attempt')!=1 or r.get('status')!='completed' or r.get('conclusion')!='success':
                  raise SystemExit('PR941 immutable run drift '+key)
              jobs=z(jobfn).get('jobs',[])
              if not any(int(j.get('id') or 0)==int(os.environ[jobkey]) and j.get('conclusion')=='success' for j in jobs):
                  raise SystemExit('PR941 immutable job drift '+jobkey)
          arts=z('v73/rejected-artifacts.json').get('artifacts',[])
          aa=[a for a in arts if int(a.get('id') or 0)==int(os.environ['REJECTED_ARTIFACT'])]
          if len(aa)!=1 or aa[0].get('name')!=os.environ['REJECTED_ARTIFACT_NAME'] or aa[0].get('digest')!=os.environ['REJECTED_ARTIFACT_DIGEST'] or aa[0].get('expired') is True:
              raise SystemExit('PR941 immutable artifact drift')
          files=z('v73/rejected-files.json')
          if len(files)!=1 or files[0].get('filename')!=os.environ['REJECTED_PATH'] or files[0].get('status')!='added' or files[0].get('sha')!=os.environ['REJECTED_BLOB']:
              raise SystemExit('PR941 immutable file/blob drift')
          for fn,cid,prefix in (
              ('v73/rejected-backup-defect.json','REJECTED_BACKUP_DEFECT','BACKUP_INDEPENDENT_AUDIT::CONFIRMED_DEFECT_AVPS_RECOVERY4_ORDINAL45_PUBLISHER_V3_ACCEPTED_CANONICAL_APPLY_REVIEW_V72_PR941_APPLY_PREDECESSOR_IDENTITY_UNDERBOUND'),
              ('v73/rejected-primary-defect.json','REJECTED_PRIMARY_DEFECT','INDEPENDENT_AUDIT::CONFIRMED_DEFECT_AVPS_RECOVERY4_ORDINAL45_PUBLISHER_V3_ACCEPTED_CANONICAL_APPLY_REVIEW_V72_PR941_APPLY_PREDECESSOR_IDENTITY_UNDERBOUND')):
              c=z(fn); u=c.get('user') or {}
              if int(c.get('id') or 0)!=int(os.environ[cid]) or not str(c.get('body') or '').startswith(prefix) or u.get('login')!='search-maker' or int(u.get('id') or 0)!=304153003 or c.get('author_association')!='OWNER':
                  raise SystemExit('PR941 defect binding drift '+cid)
          PY

      - name: Fresh fail-closed governance and one-use absence boundary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EVENT_BASE"
          set +e
          git ls-remote --exit-code --heads origin "$DISPATCH_BRANCH" >v73/dispatch-ref.txt 2>v73/dispatch-ref.err
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then echo 'ordinal45 dispatch ref exists' >&2; exit 1; fi
          if [ "$rc" -ne 2 ]; then echo "dispatch ref read failure rc=$rc" >&2; cat v73/dispatch-ref.err >&2; exit 1; fi
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > v73/issue60-pages.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/$PUBLISHER_WORKFLOW/runs?event=workflow_dispatch&per_page=100" > v73/publisher-runs.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/$SCIENCE_WORKFLOW/runs?event=workflow_dispatch&per_page=100" > v73/science-runs.json
          python - <<'PY'
          import json,os,re,textwrap
          from pathlib import Path
          comments=[c for page in json.load(open('v73/issue60-pages.json')) for c in page]
          active={}
          end_id_re=re.compile(r'(?:^|[|\s])(begin|beginComment|begin_comment)=([^\s|]+)')
          for c in comments:
              first=(str(c.get('body') or '').splitlines() or [''])[0].strip()
              if first.startswith('WRITE_QUIET_BEGIN'):
                  active[int(c['id'])]=1
              elif first.startswith('WRITE_QUIET_END'):
                  pairs=end_id_re.findall(first); ids=[]; by_key={}
                  for k,val in pairs:
                      if not val.isdigit(): raise SystemExit('bad WRITE_QUIET_END id')
                      ident=int(val)
                      if k in by_key and by_key[k]!=ident: raise SystemExit('conflicting repeated WRITE_QUIET_END alias')
                      by_key[k]=ident; ids.append(ident)
                  if len(set(ids))>1: raise SystemExit('conflicting WRITE_QUIET_END aliases')
                  if ids: active.pop(ids[0],None)
          if active: raise SystemExit('unmatched WRITE_QUIET '+repr(sorted(active)))
          txt=Path('v73/accepted-canonical.yml').read_text()
          a=txt.index('          import re\n          B={'); b=txt.index('          def state_check():',a)
          ns={}; exec(textwrap.dedent(txt[a:b]),ns)
          blocker=ns['avps_governance_blocker']
          km=re.search(r'(?m)^          KNOWN_DEFECT=([0-9]+)$',txt)
          if not km: raise SystemExit('accepted canonical KNOWN_DEFECT missing')
          cutoff=int(km.group(1))
          bound={int(os.environ['REJECTED_BACKUP_DEFECT']),int(os.environ['REJECTED_PRIMARY_DEFECT'])}
          for c in comments:
              cid=int(c.get('id') or 0)
              if cid in bound: continue
              if cid>cutoff and blocker(str(c.get('body') or ''),None):
                  raise SystemExit('newer unbound adverse AVPS governance '+str(cid))
          def flatten(path):
              pages=json.load(open(path)); runs=[]
              if not isinstance(pages,list): raise SystemExit('workflow run pagination drift')
              for p in pages:
                  if not isinstance(p,dict) or not isinstance(p.get('workflow_runs'),list): raise SystemExit('workflow run page drift')
                  runs.extend(p['workflow_runs'])
              return runs
          if flatten('v73/publisher-runs.json'): raise SystemExit('publisher workflow_dispatch already exists')
          if flatten('v73/science-runs.json'): raise SystemExit('Recovery4 science workflow_dispatch already exists')
          PY

      - name: Bind exact accepted successor merge provenance in apply mode
        if: steps.mode.outputs.mode == 'apply'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H "Accept: application/vnd.github+json" "repos/$GITHUB_REPOSITORY/commits/$INFRA_HEAD/pulls" > v73/infra-prs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$EVENT_BASE&event=push&per_page=100" > v73/postmerge-runs.json
          python - <<'PY'
          import json,os,re,subprocess
          z=lambda p:json.load(open(p))
          prs=z('v73/infra-prs.json')
          matches=[p for p in prs if
              p.get('state')=='closed' and p.get('draft') is False and p.get('merged_at') is not None and
              (p.get('head') or {}).get('sha')==os.environ['INFRA_HEAD'] and
              (p.get('base') or {}).get('sha')==os.environ['INFRA_BASE'] and
              p.get('merge_commit_sha')==os.environ['EVENT_BASE']]
          if len(matches)!=1: raise SystemExit('accepted successor merged-PR identity not unique')
          p=matches[0]; pr=int(p['number'])
          if pr==int(os.environ['REJECTED_PR']): raise SystemExit('rejected PR941 cannot be successor')
          open('v73/infra-pr-number.txt','w').write(str(pr)+'\n')
          comments=[c for page in z('v73/issue60-pages.json') for c in page]
          blob=subprocess.check_output(['git','rev-parse',os.environ['INFRA_HEAD']+':'+os.environ['INFRA_PATH']],text=True).strip()
          prefixes={
            'backup':f'BACKUP_INDEPENDENT_AUDIT::ACCEPT_AVPS_RECOVERY4_ORDINAL45_PUBLISHER_V3_ACCEPTED_CANONICAL_APPLY_REVIEW_V73_PR{pr}',
            'primary':f'INDEPENDENT_AUDIT::ACCEPT_AVPS_RECOVERY4_ORDINAL45_PUBLISHER_V3_ACCEPTED_CANONICAL_APPLY_REVIEW_V73_PR{pr}'}
          found={}
          def field(body,key):
              m=re.search(r'(?m)^'+re.escape(key)+r'=([^\s]+)$',body)
              return m.group(1) if m else None
          for role,prefix in prefixes.items():
              ms=[]
              for c in comments:
                  body=str(c.get('body') or '')
                  u=c.get('user') or {}
                  if not body.startswith(prefix): continue
                  if u.get('login')!='search-maker' or int(u.get('id') or 0)!=304153003 or c.get('author_association')!='OWNER': continue
                  if field(body,'pr')!=str(pr) or field(body,'head')!=os.environ['INFRA_HEAD'] or field(body,'base_main')!=os.environ['INFRA_BASE'] or field(body,'reviewer_blob')!=blob:
                      continue
                  ms.append(c)
              if len(ms)!=1: raise SystemExit(role+' successor acceptance missing/nonunique')
              found[role]=ms[0]
          keys=('dedicated_run','dedicated_job','generic_run','generic_job','artifact','artifact_digest')
          vals={}
          for k in keys:
              b=field(str(found['backup'].get('body') or ''),k)
              pval=field(str(found['primary'].get('body') or ''),k)
              if not b or b!=pval: raise SystemExit('auditor evidence disagreement '+k)
              vals[k]=b
          open('v73/accepted-successor-evidence.json','w').write(json.dumps({
              'pr':pr,'head':os.environ['INFRA_HEAD'],'base':os.environ['INFRA_BASE'],'merge':os.environ['EVENT_BASE'],
              'reviewerBlob':blob,'backupAccept':int(found['backup']['id']),'primaryAccept':int(found['primary']['id']),**vals
          },sort_keys=True,indent=2)+'\n')
          runs=z('v73/postmerge-runs.json').get('workflow_runs',[])
          pm=[r for r in runs if r.get('path')==os.environ['POSTMERGE_WORKFLOW_PATH'] and r.get('head_sha')==os.environ['EVENT_BASE'] and r.get('event')=='push' and r.get('run_attempt')==1 and r.get('status')=='completed' and r.get('conclusion')=='success']
          if len(pm)!=1: raise SystemExit('successor postmerge attempt1 contract missing/nonunique')
          open('v73/postmerge-run-id.txt','w').write(str(pm[0]['id'])+'\n')
          PY
          INFRA_PR=$(cat v73/infra-pr-number.txt)
          gh api "repos/$GITHUB_REPOSITORY/pulls/$INFRA_PR/files?per_page=100" > v73/infra-pr-files.json
          python - <<'PY'
          import json,os
          files=json.load(open('v73/infra-pr-files.json'))
          if len(files)!=1 or files[0].get('filename')!=os.environ['INFRA_PATH'] or files[0].get('status')!='added':
              raise SystemExit('accepted successor PR file scope drift')
          PY
          EVIDENCE=$(cat v73/accepted-successor-evidence.json)
          DEDICATED_RUN=$(python -c 'import json,sys; print(json.load(sys.stdin)["dedicated_run"])' <<<"$EVIDENCE")
          DEDICATED_JOB=$(python -c 'import json,sys; print(json.load(sys.stdin)["dedicated_job"])' <<<"$EVIDENCE")
          GENERIC_RUN=$(python -c 'import json,sys; print(json.load(sys.stdin)["generic_run"])' <<<"$EVIDENCE")
          GENERIC_JOB=$(python -c 'import json,sys; print(json.load(sys.stdin)["generic_job"])' <<<"$EVIDENCE")
          ARTIFACT=$(python -c 'import json,sys; print(json.load(sys.stdin)["artifact"])' <<<"$EVIDENCE")
          ARTIFACT_DIGEST=$(python -c 'import json,sys; print(json.load(sys.stdin)["artifact_digest"])' <<<"$EVIDENCE")
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEDICATED_RUN" > v73/successor-d.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEDICATED_RUN/jobs?per_page=100" > v73/successor-dj.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GENERIC_RUN" > v73/successor-g.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GENERIC_RUN/jobs?per_page=100" > v73/successor-gj.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEDICATED_RUN/artifacts?per_page=100" > v73/successor-artifacts.json
          DEDICATED_RUN="$DEDICATED_RUN" DEDICATED_JOB="$DEDICATED_JOB" GENERIC_RUN="$GENERIC_RUN" GENERIC_JOB="$GENERIC_JOB" ARTIFACT="$ARTIFACT" ARTIFACT_DIGEST="$ARTIFACT_DIGEST" python - <<'PY'
          import json,os
          z=lambda p:json.load(open(p))
          for fn,key,jobfn,jobkey,expected_path in (
              ('v73/successor-d.json','DEDICATED_RUN','v73/successor-dj.json','DEDICATED_JOB',os.environ['INFRA_PATH']),
              ('v73/successor-g.json','GENERIC_RUN','v73/successor-gj.json','GENERIC_JOB',os.environ['POSTMERGE_WORKFLOW_PATH'])):
              r=z(fn)
              if r.get('id')!=int(os.environ[key]) or r.get('head_sha')!=os.environ['INFRA_HEAD'] or r.get('path')!=expected_path or r.get('run_attempt')!=1 or r.get('status')!='completed' or r.get('conclusion')!='success':
                  raise SystemExit('accepted successor attempt1 run drift '+key)
              jobs=z(jobfn).get('jobs',[])
              if not any(int(j.get('id') or 0)==int(os.environ[jobkey]) and j.get('conclusion')=='success' for j in jobs):
                  raise SystemExit('accepted successor job drift '+jobkey)
          arts=z('v73/successor-artifacts.json').get('artifacts',[])
          aa=[a for a in arts if int(a.get('id') or 0)==int(os.environ['ARTIFACT'])]
          if len(aa)!=1 or aa[0].get('name')!=os.environ['SELF_ARTIFACT_NAME'] or aa[0].get('digest')!=os.environ['ARTIFACT_DIGEST'] or aa[0].get('expired') is True:
              raise SystemExit('accepted successor artifact drift')
          PY

