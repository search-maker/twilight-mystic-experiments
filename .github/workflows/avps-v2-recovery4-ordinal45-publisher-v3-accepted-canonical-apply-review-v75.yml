name: Review AVPS Recovery4 ordinal45 publisher v3 accepted-canonical apply v75

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery4-ordinal45-publisher-v3-accepted-canonical-apply-review-v75.yml
      - .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v3.yml

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: avps-v2-recovery4-ordinal45-publisher-v3-accepted-canonical-apply-v75-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      INFRA_BASE: e749d042bfe8d99a8b2590945baf8c084e19953b
      INFRA_BRANCH: review/avps-v2-recovery4-ordinal45-publisher-v3-accepted-canonical-apply-review-v75
      INFRA_PATH: .github/workflows/avps-v2-recovery4-ordinal45-publisher-v3-accepted-canonical-apply-review-v75.yml
      APPLY_BRANCH: review/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v3-v75
      TARGET_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v3.yml
      REPO_OWNER: search-maker
      SOURCE_PUBLISHER_BLOB: c444306cd5f7e3e44182062d565ccc770345f00d
      SOURCE_PUBLISHER_SHA256: 9b61da35e7eee5e2db057e17ac2f81cbc5bfa006fab5142feada3095f62f83d8
      ACCEPTED_CANONICAL_BLOB: 516d535d4980fe2802e1e69c552054702fac5b37
      ACCEPTED_CANONICAL_SHA256: 3ada0a15f1c5d381c8dee8a81f79ee93ce9bf658701f5b80e804f384cf66edad
      PR939: '939'
      PR939_HEAD: 48702f0335359d3a05603c71a2137328825bb51b
      PR939_MERGE: e749d042bfe8d99a8b2590945baf8c084e19953b
      PR939_DEDICATED_RUN: '33824358209'
      PR939_DEDICATED_JOB: '100873715883'
      PR939_GENERIC_RUN: '33824358038'
      PR939_GENERIC_JOB: '100873715534'
      PR939_ARTIFACT: '9919395953'
      PR939_ARTIFACT_NAME: avps-v2-recovery4-ordinal45-publisher-v3-final-premutation-guard-correction-review-v7
      PR939_ARTIFACT_DIGEST: sha256:5e09101209a65748d3dafe5cd3051cc66ad2580da8c5fa7ac07316242994a72b
      PR939_BACKUP_ACCEPT: '5534409038'
      PR939_PRIMARY_ACCEPT: '5534840528'
      PR939_POSTMERGE_RUN: '33833497234'
      PR939_POSTMERGE_JOB: '100901195513'
      PR941: '941'
      PR941_HEAD: 1392b081069423d64e5ea03724b0b312f4e2d0e5
      PR941_PATH: .github/workflows/avps-v2-recovery4-ordinal45-publisher-v3-accepted-canonical-apply-review-v72.yml
      PR941_BLOB: d767a642f1dd86a09a5d5577e8abaa70a059e0fb
      PR941_DEDICATED_RUN: '33833982008'
      PR941_GENERIC_RUN: '33833981971'
      PR941_ARTIFACT: '9922646712'
      PR941_ARTIFACT_DIGEST: sha256:52967b3f96f69508b81a131c9e389a292ffb89dfac570238ed49dc7d762a8b56
      PR941_NOTICE: '5535375905'
      PR941_BACKUP_DEFECT: '5535719336'
      PR941_PRIMARY_DEFECT: '5535788817'
      PR942: '942'
      PR942_HEAD: 522d30548f7fd904087df8c4c0931e6d57fcaf16
      PR942_PATH: .github/workflows/avps-v2-recovery4-ordinal45-publisher-v3-accepted-canonical-apply-review-v73.yml
      PR942_BLOB: 43ad0c5ac839f84c61a489baf4b5711df423e8ae
      PR942_DEDICATED_RUN: '33841004370'
      PR942_GENERIC_RUN: '33841004255'
      PR943: '943'
      PR943_HEAD: 62c8a2e50755a33363e3c54a6b060897cb3b5cc3
      PR943_PATH: .github/workflows/avps-v2-recovery4-ordinal45-publisher-v3-accepted-canonical-apply-review-v74.yml
      PR943_BLOB: fe2b5ccf9d174c94e7f07cce6c6c43354a076535
      PR943_DEDICATED_RUN: '33841619934'
      PR943_DEDICATED_JOB: '100924908034'
      PR943_GENERIC_RUN: '33841619813'
      PR943_GENERIC_JOB: '100924907794'
      PR943_ARTIFACT: '9925100614'
      PR943_ARTIFACT_NAME: avps-v2-recovery4-ordinal45-publisher-v3-accepted-canonical-apply-review-v74
      PR943_ARTIFACT_DIGEST: sha256:33adabf25e52ec28d810fdc306171e3016e88898ff9b36a87518a8eb1585c04f
      PR943_NOTICE: '5536302693'
      PR943_PRIMARY_DEFECT: '5536652498'
      PR943_BACKUP_DEFECT: '5536676219'
      SELF_ARTIFACT_NAME: avps-v2-recovery4-ordinal45-publisher-v3-accepted-canonical-apply-review-v75
      DISPATCH_BRANCH: dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-ordinal-45
      SCIENCE_WORKFLOW: avps-v2-postconsumption-recovery4-science.yml
      PUBLISHER_WORKFLOW: avps-v2-recovery4-ordinal45-final-dispatch-publisher-v3.yml
      POSTMERGE_WORKFLOW_PATH: .github/workflows/contract.yml

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Bind exact infra or apply event identity
        id: mode
        shell: bash
        env:
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$EVENT_ACTION" = opened
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          set -- $(git rev-list --parents -n1 "$EVENT_HEAD")
          test "$#" -eq 2
          test "$2" = "$EVENT_BASE"
          if [ "$EVENT_BRANCH" = "$INFRA_BRANCH" ]; then
            MODE=infra
            test "$EVENT_BASE" = "$INFRA_BASE"
            test "$(git diff --name-status "$EVENT_BASE"...HEAD)" = "$(printf 'A\t%s' "$INFRA_PATH")"
            test "$(git rev-parse "$EVENT_BASE:$TARGET_PATH")" = "$SOURCE_PUBLISHER_BLOB"
          elif [ "$EVENT_BRANCH" = "$APPLY_BRANCH" ]; then
            MODE=apply
            test "$(git rev-parse "$EVENT_BASE:$TARGET_PATH")" = "$SOURCE_PUBLISHER_BLOB"
            test "$(git diff --name-status "$EVENT_BASE"...HEAD)" = "$(printf 'M\t%s' "$TARGET_PATH")"
          else
            echo unexpected-v75-branch >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > pr-live.json
          EVENT_HEAD="$EVENT_HEAD" EVENT_BASE="$EVENT_BASE" python - <<'PY'
          import json,os
          p=json.load(open('pr-live.json'))
          if p.get('state')!='open' or p.get('draft') is not False or p.get('merged_at') is not None:
              raise SystemExit('V75 event PR must be open/non-Draft/unmerged')
          if p['head']['sha']!=os.environ['EVENT_HEAD'] or p['base']['sha']!=os.environ['EVENT_BASE']:
              raise SystemExit('V75 event PR identity drift')
          PY
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "EVENT_HEAD=$EVENT_HEAD" >> "$GITHUB_ENV"
          echo "EVENT_BASE=$EVENT_BASE" >> "$GITHUB_ENV"
          echo "EVENT_PR=$PR_NUMBER" >> "$GITHUB_ENV"

      - name: Bind static singleton reviewer branch identity before merge-parent inspection
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p v75
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls?state=all&head=$REPO_OWNER:$INFRA_BRANCH&base=main&per_page=100" > v75/infra-branch-pr-pages.json
          python - <<'PY'
          import json,os,subprocess
          pages=json.load(open('v75/infra-branch-pr-pages.json'))
          prs=[]
          for page in pages:
              if not isinstance(page,list): raise SystemExit('reviewer branch PR pagination drift')
              prs.extend(page)
          matches=[p for p in prs if (p.get('head') or {}).get('ref')==os.environ['INFRA_BRANCH'] and (p.get('base') or {}).get('ref')=='main']
          if len(matches)!=1: raise SystemExit('reviewer branch identity reused/missing: '+str(len(matches)))
          p=matches[0]
          mode='${{ steps.mode.outputs.mode }}'
          if mode=='infra':
              if int(p['number'])!=int(os.environ['EVENT_PR']) or p.get('state')!='open' or p.get('draft') is not False or p.get('merged_at') is not None:
                  raise SystemExit('infra singleton PR state drift')
              if (p.get('head') or {}).get('sha')!=os.environ['EVENT_HEAD'] or (p.get('base') or {}).get('sha')!=os.environ['INFRA_BASE']:
                  raise SystemExit('infra singleton PR identity drift')
              head=os.environ['EVENT_HEAD']; merge=''
          else:
              if p.get('state')!='closed' or p.get('draft') is not False or p.get('merged_at') is None:
                  raise SystemExit('accepted reviewer singleton is not merged')
              if (p.get('base') or {}).get('sha')!=os.environ['INFRA_BASE']:
                  raise SystemExit('accepted reviewer base drift')
              head=(p.get('head') or {}).get('sha') or ''
              merge=p.get('merge_commit_sha') or ''
              if not head or not merge or merge!=os.environ['EVENT_BASE']:
                  raise SystemExit('apply base is not singleton reviewer merge')
              parents=subprocess.check_output(['git','rev-list','--parents','-n1',merge],text=True).split()
              if len(parents)!=3 or parents[1]!=os.environ['INFRA_BASE'] or parents[2]!=head:
                  raise SystemExit('reviewer merge is not exact normal two-parent topology')
              hp=subprocess.check_output(['git','rev-list','--parents','-n1',head],text=True).split()
              if len(hp)!=2 or hp[1]!=os.environ['INFRA_BASE']:
                  raise SystemExit('reviewer head is not sole-parent direct child')
              diff=subprocess.check_output(['git','diff','--name-status',os.environ['INFRA_BASE'],head],text=True).strip()
              if diff!='A\t'+os.environ['INFRA_PATH']:
                  raise SystemExit('reviewer head file scope drift')
              hb=subprocess.check_output(['git','rev-parse',head+':'+os.environ['INFRA_PATH']],text=True).strip()
              mb=subprocess.check_output(['git','rev-parse',merge+':'+os.environ['INFRA_PATH']],text=True).strip()
              if hb!=mb: raise SystemExit('merge reviewer blob differs from exact reviewer head')
          blob=subprocess.check_output(['git','rev-parse',head+':'+os.environ['INFRA_PATH']],text=True).strip()
          open('v75/reviewer-identity.env','w').write('INFRA_PR='+str(p['number'])+'\nINFRA_HEAD='+head+'\nINFRA_BLOB='+blob+'\nINFRA_MERGE='+merge+'\n')
          PY
          cat v75/reviewer-identity.env >> "$GITHUB_ENV"

      - name: Bind accepted PR939 canonical bytes audits merge and postmerge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR939" > v75/pr939.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR939_DEDICATED_RUN" > v75/pr939-d.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR939_DEDICATED_RUN/jobs?per_page=100" > v75/pr939-dj.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR939_GENERIC_RUN" > v75/pr939-g.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR939_GENERIC_RUN/jobs?per_page=100" > v75/pr939-gj.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR939_DEDICATED_RUN/artifacts?per_page=100" > v75/pr939-artifacts.json
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$PR939_BACKUP_ACCEPT" > v75/pr939-backup.json
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$PR939_PRIMARY_ACCEPT" > v75/pr939-primary.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR939_POSTMERGE_RUN" > v75/pr939-postmerge.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR939_POSTMERGE_RUN/jobs?per_page=100" > v75/pr939-postmerge-jobs.json
          gh run download "$PR939_DEDICATED_RUN" --repo "$GITHUB_REPOSITORY" --name "$PR939_ARTIFACT_NAME" --dir v75/pr939-artifact
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          z=lambda p:json.load(open(p))
          p=z('v75/pr939.json')
          if p.get('state')!='closed' or p.get('merged_at') is None or (p.get('head') or {}).get('sha')!=os.environ['PR939_HEAD'] or p.get('merge_commit_sha')!=os.environ['PR939_MERGE']:
              raise SystemExit('PR939 merged identity drift')
          for fn,key,jfn,jkey in (('v75/pr939-d.json','PR939_DEDICATED_RUN','v75/pr939-dj.json','PR939_DEDICATED_JOB'),('v75/pr939-g.json','PR939_GENERIC_RUN','v75/pr939-gj.json','PR939_GENERIC_JOB')):
              r=z(fn); jobs=z(jfn).get('jobs',[])
              if r.get('id')!=int(os.environ[key]) or r.get('head_sha')!=os.environ['PR939_HEAD'] or r.get('run_attempt')!=1 or r.get('status')!='completed' or r.get('conclusion')!='success': raise SystemExit('PR939 run drift '+key)
              if not any(int(j.get('id') or 0)==int(os.environ[jkey]) and j.get('conclusion')=='success' for j in jobs): raise SystemExit('PR939 job drift '+jkey)
          aa=[a for a in z('v75/pr939-artifacts.json').get('artifacts',[]) if int(a.get('id') or 0)==int(os.environ['PR939_ARTIFACT'])]
          if len(aa)!=1 or aa[0].get('name')!=os.environ['PR939_ARTIFACT_NAME'] or aa[0].get('digest')!=os.environ['PR939_ARTIFACT_DIGEST'] or aa[0].get('expired') is True: raise SystemExit('PR939 artifact drift')
          for fn,cid,prefix in (('v75/pr939-backup.json','PR939_BACKUP_ACCEPT','BACKUP_INDEPENDENT_AUDIT::ACCEPT_AVPS_ORDINAL45_PUBLISHER_V3_FINAL_PREMUTATION_GUARD_CORRECTION_REVIEW_V7_PR939'),('v75/pr939-primary.json','PR939_PRIMARY_ACCEPT','INDEPENDENT_AUDIT::ACCEPT_AVPS_ORDINAL45_PUBLISHER_V3_FINAL_PREMUTATION_GUARD_CORRECTION_REVIEW_V7_PR939')):
              c=z(fn); u=c.get('user') or {}
              if int(c.get('id') or 0)!=int(os.environ[cid]) or not str(c.get('body') or '').startswith(prefix) or u.get('login')!='search-maker' or int(u.get('id') or 0)!=304153003 or c.get('author_association')!='OWNER': raise SystemExit('PR939 acceptance drift '+cid)
          pm=z('v75/pr939-postmerge.json'); jobs=z('v75/pr939-postmerge-jobs.json').get('jobs',[])
          if pm.get('id')!=int(os.environ['PR939_POSTMERGE_RUN']) or pm.get('head_sha')!=os.environ['PR939_MERGE'] or pm.get('event')!='push' or pm.get('run_attempt')!=1 or pm.get('status')!='completed' or pm.get('conclusion')!='success': raise SystemExit('PR939 postmerge drift')
          if not any(int(j.get('id') or 0)==int(os.environ['PR939_POSTMERGE_JOB']) and j.get('conclusion')=='success' for j in jobs): raise SystemExit('PR939 postmerge job drift')
          files=list(Path('v75/pr939-artifact').rglob('canonical-corrected-publisher-v3.yml'))
          if len(files)!=1: raise SystemExit('canonical multiplicity drift')
          b=files[0].read_bytes()
          if hashlib.sha256(b).hexdigest()!=os.environ['ACCEPTED_CANONICAL_SHA256']: raise SystemExit('canonical sha drift')
          blob=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          if blob!=os.environ['ACCEPTED_CANONICAL_BLOB']: raise SystemExit('canonical blob drift')
          Path('v75/accepted-canonical.yml').write_bytes(b)
          PY
          git show "$EVENT_BASE:$TARGET_PATH" > v75/source-publisher.yml
          test "$(git hash-object v75/source-publisher.yml)" = "$SOURCE_PUBLISHER_BLOB"
          test "$(sha256sum v75/source-publisher.yml | awk '{print $1}')" = "$SOURCE_PUBLISHER_SHA256"
          if [ "${{ steps.mode.outputs.mode }}" = apply ]; then
            cmp v75/accepted-canonical.yml "$TARGET_PATH"
            test "$(git hash-object "$TARGET_PATH")" = "$ACCEPTED_CANONICAL_BLOB"
            test "$(sha256sum "$TARGET_PATH" | awk '{print $1}')" = "$ACCEPTED_CANONICAL_SHA256"
          fi

      - name: Bind immutable rejected predecessor evidence through PR943 defects
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for pr in "$PR941" "$PR942" "$PR943"; do gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" > "v75/pr-$pr.json"; gh api "repos/$GITHUB_REPOSITORY/pulls/$pr/files?per_page=100" > "v75/pr-$pr-files.json"; done
          for run in "$PR941_DEDICATED_RUN" "$PR941_GENERIC_RUN" "$PR942_DEDICATED_RUN" "$PR942_GENERIC_RUN" "$PR943_DEDICATED_RUN" "$PR943_GENERIC_RUN"; do gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" > "v75/run-$run.json"; done
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR941_DEDICATED_RUN/artifacts?per_page=100" > v75/pr941-artifacts.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR943_DEDICATED_RUN/artifacts?per_page=100" > v75/pr943-artifacts.json
          for cid in "$PR941_NOTICE" "$PR941_BACKUP_DEFECT" "$PR941_PRIMARY_DEFECT" "$PR943_NOTICE" "$PR943_PRIMARY_DEFECT" "$PR943_BACKUP_DEFECT"; do gh api "repos/$GITHUB_REPOSITORY/issues/comments/$cid" > "v75/comment-$cid.json"; done
          python - <<'PY'
          import json,os
          z=lambda p:json.load(open(p))
          specs=[('PR941','PR941_HEAD','PR941_PATH','PR941_BLOB'),('PR942','PR942_HEAD','PR942_PATH','PR942_BLOB'),('PR943','PR943_HEAD','PR943_PATH','PR943_BLOB')]
          for pk,hk,pathk,bk in specs:
              pr=os.environ[pk]; p=z('v75/pr-'+pr+'.json'); files=z('v75/pr-'+pr+'-files.json')
              if p.get('state')!='closed' or p.get('merged_at') is not None or (p.get('head') or {}).get('sha')!=os.environ[hk] or (p.get('base') or {}).get('sha')!=os.environ['INFRA_BASE']: raise SystemExit(pk+' rejected identity drift')
              if len(files)!=1 or files[0].get('filename')!=os.environ[pathk] or files[0].get('status')!='added' or files[0].get('sha')!=os.environ[bk]: raise SystemExit(pk+' rejected file/blob drift')
          expected=[('PR941_DEDICATED_RUN','PR941_HEAD','success'),('PR941_GENERIC_RUN','PR941_HEAD','success'),('PR942_DEDICATED_RUN','PR942_HEAD','failure'),('PR942_GENERIC_RUN','PR942_HEAD','success'),('PR943_DEDICATED_RUN','PR943_HEAD','success'),('PR943_GENERIC_RUN','PR943_HEAD','success')]
          for rk,hk,conc in expected:
              r=z('v75/run-'+os.environ[rk]+'.json')
              if r.get('id')!=int(os.environ[rk]) or r.get('head_sha')!=os.environ[hk] or r.get('run_attempt')!=1 or r.get('status')!='completed' or r.get('conclusion')!=conc: raise SystemExit(rk+' immutable attempt1 drift')
          for fn,aid,digest in [('v75/pr941-artifacts.json','PR941_ARTIFACT','PR941_ARTIFACT_DIGEST'),('v75/pr943-artifacts.json','PR943_ARTIFACT','PR943_ARTIFACT_DIGEST')]:
              aa=[a for a in z(fn).get('artifacts',[]) if int(a.get('id') or 0)==int(os.environ[aid])]
              if len(aa)!=1 or aa[0].get('digest')!=os.environ[digest] or aa[0].get('expired') is True: raise SystemExit(aid+' artifact drift')
          checks=[
            ('PR941_NOTICE','CANDIDATE_NOTICE::AVPS_RECOVERY4_ORDINAL45_PUBLISHER_V3_ACCEPTED_CANONICAL_APPLY_REVIEW_V72_PR941_NON_AUTHORIZING'),
            ('PR941_BACKUP_DEFECT','BACKUP_INDEPENDENT_AUDIT::CONFIRMED_DEFECT_AVPS_RECOVERY4_ORDINAL45_PUBLISHER_V3_ACCEPTED_CANONICAL_APPLY_REVIEW_V72_PR941_APPLY_PREDECESSOR_IDENTITY_UNDERBOUND'),
            ('PR941_PRIMARY_DEFECT','INDEPENDENT_AUDIT::CONFIRMED_DEFECT_AVPS_RECOVERY4_ORDINAL45_PUBLISHER_V3_ACCEPTED_CANONICAL_APPLY_REVIEW_V72_PR941_APPLY_PREDECESSOR_IDENTITY_UNDERBOUND'),
            ('PR943_NOTICE','CANDIDATE_NOTICE::AVPS_RECOVERY4_ORDINAL45_PUBLISHER_V3_ACCEPTED_CANONICAL_APPLY_REVIEW_V74_PR943_NON_AUTHORIZING'),
            ('PR943_PRIMARY_DEFECT','INDEPENDENT_AUDIT::CONFIRMED_DEFECT_AVPS_RECOVERY4_ORDINAL45_PUBLISHER_V3_ACCEPTED_CANONICAL_APPLY_REVIEW_V74_PR943_APPLY_EXACT_REVIEWER_HEAD_UNDERBOUND'),
            ('PR943_BACKUP_DEFECT','BACKUP_INDEPENDENT_AUDIT::CONFIRMED_DEFECT_AVPS_RECOVERY4_ORDINAL45_PUBLISHER_V3_ACCEPTED_CANONICAL_APPLY_REVIEW_V74_PR943_EXACT_REVIEWER_HEAD_NOT_IMMUTABLY_BOUND')]
          for key,prefix in checks:
              c=z('v75/comment-'+os.environ[key]+'.json'); u=c.get('user') or {}
              if int(c.get('id') or 0)!=int(os.environ[key]) or not str(c.get('body') or '').startswith(prefix) or u.get('login')!='search-maker' or int(u.get('id') or 0)!=304153003 or c.get('author_association')!='OWNER': raise SystemExit(key+' comment binding drift')
          PY

      - name: Fresh fail-closed governance and one-use absence boundary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EVENT_BASE"
          set +e
          git ls-remote --exit-code --heads origin "$DISPATCH_BRANCH" >v75/dispatch-ref.txt 2>v75/dispatch-ref.err
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then echo ordinal45-dispatch-ref-exists >&2; exit 1; fi
          if [ "$rc" -ne 2 ]; then echo "dispatch-ref-read-failure-rc=$rc" >&2; cat v75/dispatch-ref.err >&2; exit 1; fi
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > v75/issue60-pages.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/$PUBLISHER_WORKFLOW/runs?event=workflow_dispatch&per_page=100" > v75/publisher-runs.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/$SCIENCE_WORKFLOW/runs?event=workflow_dispatch&per_page=100" > v75/science-runs.json
          python - <<'PY'
          import json,os,re,textwrap
          from pathlib import Path
          comments=[c for page in json.load(open('v75/issue60-pages.json')) for c in page]
          active={}; er=re.compile(r'(?:^|[|\s])(begin|beginComment|begin_comment)=([^\s|]+)')
          for c in comments:
              first=(str(c.get('body') or '').splitlines() or [''])[0].strip()
              if first.startswith('WRITE_QUIET_BEGIN'): active[int(c['id'])]=1
              elif first.startswith('WRITE_QUIET_END'):
                  pairs=er.findall(first); ids=[]; by={}
                  for k,val in pairs:
                      if not val.isdigit(): raise SystemExit('bad WRITE_QUIET_END id')
                      ident=int(val)
                      if k in by and by[k]!=ident: raise SystemExit('conflicting repeated WRITE_QUIET_END alias')
                      by[k]=ident; ids.append(ident)
                  if len(set(ids))>1: raise SystemExit('conflicting WRITE_QUIET_END aliases')
                  if ids: active.pop(ids[0],None)
          if active: raise SystemExit('unmatched WRITE_QUIET '+repr(sorted(active)))
          txt=Path('v75/accepted-canonical.yml').read_text()
          a=txt.index('          import re\n          B={'); b=txt.index('          def state_check():',a)
          ns={}; exec(textwrap.dedent(txt[a:b]),ns); blocker=ns['avps_governance_blocker']
          km=re.search(r'(?m)^          KNOWN_DEFECT=([0-9]+)$',txt)
          if not km: raise SystemExit('canonical KNOWN_DEFECT missing')
          cutoff=int(km.group(1))
          bound={int(os.environ[x]) for x in ('PR941_NOTICE','PR941_BACKUP_DEFECT','PR941_PRIMARY_DEFECT','PR943_NOTICE','PR943_PRIMARY_DEFECT','PR943_BACKUP_DEFECT')}
          for c in comments:
              cid=int(c.get('id') or 0)
              if cid in bound: continue
              if cid>cutoff and blocker(str(c.get('body') or ''),None): raise SystemExit('newer unbound adverse AVPS governance '+str(cid))
          def flat(path):
              pages=json.load(open(path)); out=[]
              for p in pages:
                  if not isinstance(p,dict) or not isinstance(p.get('workflow_runs'),list): raise SystemExit('workflow inventory pagination drift')
                  out.extend(p['workflow_runs'])
              return out
          if flat('v75/publisher-runs.json'): raise SystemExit('publisher workflow_dispatch already exists')
          if flat('v75/science-runs.json'): raise SystemExit('science workflow_dispatch already exists')
          PY

      - name: Bind exact accepted V75 reviewer evidence in apply mode
        if: steps.mode.outputs.mode == 'apply'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$EVENT_BASE&event=push&per_page=100" > v75/postmerge-runs.json
          python - <<'PY'
          import json,os,re
          comments=[c for page in json.load(open('v75/issue60-pages.json')) for c in page]
          prefixes={
            'backup':f'BACKUP_INDEPENDENT_AUDIT::ACCEPT_AVPS_RECOVERY4_ORDINAL45_PUBLISHER_V3_ACCEPTED_CANONICAL_APPLY_REVIEW_V75_PR{os.environ["INFRA_PR"]}',
            'primary':f'INDEPENDENT_AUDIT::ACCEPT_AVPS_RECOVERY4_ORDINAL45_PUBLISHER_V3_ACCEPTED_CANONICAL_APPLY_REVIEW_V75_PR{os.environ["INFRA_PR"]}'}
          def field(body,key):
              m=re.search(r'(?m)^'+re.escape(key)+r'=([^\s]+)$',body); return m.group(1) if m else None
          found={}
          for role,prefix in prefixes.items():
              ms=[]
              for c in comments:
                  body=str(c.get('body') or ''); u=c.get('user') or {}
                  if not body.startswith(prefix): continue
                  if u.get('login')!='search-maker' or int(u.get('id') or 0)!=304153003 or c.get('author_association')!='OWNER': continue
                  if field(body,'pr')!=os.environ['INFRA_PR'] or field(body,'head')!=os.environ['INFRA_HEAD'] or field(body,'base_main')!=os.environ['INFRA_BASE'] or field(body,'reviewer_blob')!=os.environ['INFRA_BLOB']: continue
                  ms.append(c)
              if len(ms)!=1: raise SystemExit(role+' V75 acceptance missing/nonunique')
              found[role]=ms[0]
          vals={}
          for k in ('dedicated_run','dedicated_job','generic_run','generic_job','artifact','artifact_digest'):
              a=field(str(found['backup'].get('body') or ''),k); b=field(str(found['primary'].get('body') or ''),k)
              if not a or a!=b: raise SystemExit('V75 auditor evidence disagreement '+k)
              vals[k]=a
          json.dump(vals,open('v75/v75-evidence.json','w'),sort_keys=True,indent=2)
          runs=json.load(open('v75/postmerge-runs.json')).get('workflow_runs',[])
          pm=[r for r in runs if r.get('path')==os.environ['POSTMERGE_WORKFLOW_PATH'] and r.get('head_sha')==os.environ['EVENT_BASE'] and r.get('event')=='push' and r.get('run_attempt')==1 and r.get('status')=='completed' and r.get('conclusion')=='success']
          if len(pm)!=1: raise SystemExit('V75 postmerge attempt1 contract missing/nonunique')
          open('v75/v75-postmerge-id.txt','w').write(str(pm[0]['id'])+'\n')
          PY
          D=$(python -c 'import json; x=json.load(open("v75/v75-evidence.json")); print(x["dedicated_run"])')
          DJ=$(python -c 'import json; x=json.load(open("v75/v75-evidence.json")); print(x["dedicated_job"])')
          G=$(python -c 'import json; x=json.load(open("v75/v75-evidence.json")); print(x["generic_run"])')
          GJ=$(python -c 'import json; x=json.load(open("v75/v75-evidence.json")); print(x["generic_job"])')
          A=$(python -c 'import json; x=json.load(open("v75/v75-evidence.json")); print(x["artifact"])')
          AD=$(python -c 'import json; x=json.load(open("v75/v75-evidence.json")); print(x["artifact_digest"])')
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$D" > v75/v75-d.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$D/jobs?per_page=100" > v75/v75-dj.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$G" > v75/v75-g.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$G/jobs?per_page=100" > v75/v75-gj.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$D/artifacts?per_page=100" > v75/v75-artifacts.json
          D="$D" DJ="$DJ" G="$G" GJ="$GJ" A="$A" AD="$AD" python - <<'PY'
          import json,os
          z=lambda p:json.load(open(p))
          for fn,rk,jfn,jk,path in [('v75/v75-d.json','D','v75/v75-dj.json','DJ',os.environ['INFRA_PATH']),('v75/v75-g.json','G','v75/v75-gj.json','GJ',os.environ['POSTMERGE_WORKFLOW_PATH'])]:
              r=z(fn); jobs=z(jfn).get('jobs',[])
              if r.get('id')!=int(os.environ[rk]) or r.get('head_sha')!=os.environ['INFRA_HEAD'] or r.get('path')!=path or r.get('run_attempt')!=1 or r.get('status')!='completed' or r.get('conclusion')!='success': raise SystemExit('V75 accepted attempt1 run drift '+rk)
              if not any(int(j.get('id') or 0)==int(os.environ[jk]) and j.get('conclusion')=='success' for j in jobs): raise SystemExit('V75 accepted job drift '+jk)
          aa=[x for x in z('v75/v75-artifacts.json').get('artifacts',[]) if int(x.get('id') or 0)==int(os.environ['A'])]
          if len(aa)!=1 or aa[0].get('name')!=os.environ['SELF_ARTIFACT_NAME'] or aa[0].get('digest')!=os.environ['AD'] or aa[0].get('expired') is True: raise SystemExit('V75 accepted artifact drift')
          PY

