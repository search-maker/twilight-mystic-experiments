name: Review AVPS Recovery4 ordinal45 publisher v3 final pre-mutation guard correction v6

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery4-ordinal45-publisher-v3-final-premutation-dispatch-ref-correction-review-v6.yml

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: avps-v2-recovery4-ordinal45-publisher-v3-final-premutation-guard-v6-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_BASE: 91727a1c051c6ba52523f4642f29c138020c44b5
      EXPECTED_BRANCH: review/avps-v2-recovery4-ordinal45-publisher-v3-final-premutation-dispatch-ref-correction-v6
      REVIEW_PATH: .github/workflows/avps-v2-recovery4-ordinal45-publisher-v3-final-premutation-dispatch-ref-correction-review-v6.yml
      PUBLISHER_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v3.yml
      SOURCE_PUBLISHER_BLOB: c444306cd5f7e3e44182062d565ccc770345f00d
      SOURCE_PUBLISHER_SHA256: 9b61da35e7eee5e2db057e17ac2f81cbc5bfa006fab5142feada3095f62f83d8
      SOURCE_KNOWN_DEFECT: '5529629185'
      SOURCE_LEDGER_CARDINALITY: '76'
      NEW_KNOWN_DEFECT: '5534122162'
      PR933: '933'
      PR933_HEAD: 830c4cfaf944e50042960b6f926413fd90999fe7
      PR933_BACKUP_DEFECT: '5533495162'
      PR933_PRIMARY_DEFECT: '5533522910'
      PR935: '935'
      PR935_HEAD: 3681e641eb9fb79e5d771d8fc5116683ad408791
      PR935_DEDICATED_RUN: '33818588551'
      PR935_DEDICATED_JOB: '100856056016'
      PR935_GENERIC_RUN: '33818588718'
      PR935_GENERIC_JOB: '100856056838'
      PR935_ARTIFACT: '9917745211'
      PR935_ARTIFACT_DIGEST: sha256:87b40efc591bf2e115b2239f7f0c7a500845297fb5064abf4b55bea24c53847c
      PR935_PRIMARY_DEFECT: '5533978285'
      PR935_BACKUP_DEFECT: '5533983483'
      PR936: '936'
      PR936_HEAD: b954332224337f81383237260a504125d3c71192
      PR936_DEDICATED_RUN: '33823068616'
      PR936_DEDICATED_JOB: '100869740726'
      PR936_GENERIC_RUN: '33823068454'
      PR936_GENERIC_JOB: '100869740256'
      PR936_OWNER_DEFECT: '5534074575'
      PR937: '937'
      PR937_HEAD: e54a3b47851095990d6f97a29b74dbfaf57dff3f
      PR937_MERGE_PREVIEW: e18a8c9da6dbe93f2ee16fdd2b3212aca1558813
      PR937_DEDICATED_RUN: '33823442273'
      PR937_DEDICATED_JOB: '100870894076'
      PR937_GENERIC_RUN: '33823442366'
      PR937_GENERIC_JOB: '100870894064'
      PR937_OWNER_DEFECT: '5534122162'
      AUTH_HEAD: 6e095b4b1603c90dcee0943295909b30cd1b374d
      DISPATCH_BRANCH: dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-ordinal-45
      CONSUMED_MARKER: ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_DISPATCH_CONSUMED
      SCIENCE_WORKFLOW: avps-v2-postconsumption-recovery4-science.yml

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Bind fresh direct-child zero-runtime correction-review identity
        shell: bash
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "${{ github.event.action }}" = opened
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$EVENT_BASE" = "$EXPECTED_BASE"
          test "$EVENT_BRANCH" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          test "$(git rev-list --count "$EXPECTED_BASE"..HEAD)" = 1
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_BASE"
          test "$(git ls-remote origin refs/heads/$EXPECTED_BRANCH | cut -f1)" = "$EVENT_HEAD"
          git diff --name-status "$EXPECTED_BASE"...HEAD > changed.txt
          expected_status=$(printf 'A\t%s' "$REVIEW_PATH")
          test "$(cat changed.txt)" = "$expected_status"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > pr-live.json
          python - <<'PY'
          import json,os
          p=json.load(open('pr-live.json'))
          if p.get('state')!='open' or p.get('draft') is not False or p.get('merged_at') is not None:
              raise SystemExit('correction-review PR must remain open/non-Draft/unmerged')
          if p['head']['sha']!=os.environ['EVENT_HEAD'] or p['base']['sha']!=os.environ['EVENT_BASE']:
              raise SystemExit('correction-review PR identity drift')
          PY

      - name: Bind exact installed publisher and immutable rejected evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p correction-review
          test "$(git rev-parse "$EXPECTED_BASE:$PUBLISHER_PATH")" = "$SOURCE_PUBLISHER_BLOB"
          git show "$EXPECTED_BASE:$PUBLISHER_PATH" > correction-review/source-publisher-v3.yml
          test "$(sha256sum correction-review/source-publisher-v3.yml | cut -d' ' -f1)" = "$SOURCE_PUBLISHER_SHA256"
          for p in "$PR933" "$PR935" "$PR936" "$PR937"; do gh api "repos/$GITHUB_REPOSITORY/pulls/$p" > "correction-review/pr$p.json"; done
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR935_DEDICATED_RUN" > correction-review/pr935-dedicated-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR935_DEDICATED_RUN/jobs?per_page=100" > correction-review/pr935-dedicated-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR935_GENERIC_RUN" > correction-review/pr935-generic-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR935_GENERIC_RUN/jobs?per_page=100" > correction-review/pr935-generic-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PR935_ARTIFACT" > correction-review/pr935-artifact.json
          for p in 936 937; do
            dvar="PR${p}_DEDICATED_RUN"; gvar="PR${p}_GENERIC_RUN"
            d="${!dvar}"; g="${!gvar}"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$d" > "correction-review/pr${p}-dedicated-run.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$d/jobs?per_page=100" > "correction-review/pr${p}-dedicated-jobs.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$d/artifacts?per_page=100" > "correction-review/pr${p}-dedicated-artifacts.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$g" > "correction-review/pr${p}-generic-run.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$g/jobs?per_page=100" > "correction-review/pr${p}-generic-jobs.json"
          done
          for cid in "$PR933_BACKUP_DEFECT" "$PR933_PRIMARY_DEFECT" "$PR935_PRIMARY_DEFECT" "$PR935_BACKUP_DEFECT" "$PR936_OWNER_DEFECT" "$PR937_OWNER_DEFECT"; do
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/$cid" > "correction-review/comment-$cid.json"
          done
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > correction-review/issue60-pages.json
          python - <<'PY'
          import json,os
          def z(p): return json.load(open(p))
          for pr,head in [(933,'PR933_HEAD'),(935,'PR935_HEAD'),(936,'PR936_HEAD'),(937,'PR937_HEAD')]:
              p=z(f'correction-review/pr{pr}.json')
              if p.get('state')!='closed' or p.get('merged_at') is not None or p['head']['sha']!=os.environ[head] or p['base']['sha']!=os.environ['EXPECTED_BASE']:
                  raise SystemExit(f'PR{pr} immutable rejection identity drift')
          p937=z('correction-review/pr937.json')
          if p937.get('merge_commit_sha')!=os.environ['PR937_MERGE_PREVIEW'] or p937['head']['sha']==p937.get('merge_commit_sha'):
              raise SystemExit('PR937 head versus pull-request merge-preview identity evidence drift')
          runs=[
              ('pr935-dedicated-run.json','PR935_DEDICATED_RUN','PR935_HEAD','success'),('pr935-generic-run.json','PR935_GENERIC_RUN','PR935_HEAD','success'),
              ('pr936-dedicated-run.json','PR936_DEDICATED_RUN','PR936_HEAD','failure'),('pr936-generic-run.json','PR936_GENERIC_RUN','PR936_HEAD','success'),
              ('pr937-dedicated-run.json','PR937_DEDICATED_RUN','PR937_HEAD','failure'),('pr937-generic-run.json','PR937_GENERIC_RUN','PR937_HEAD','success')]
          for fn,key,head,conclusion in runs:
              r=z('correction-review/'+fn)
              if r.get('id')!=int(os.environ[key]) or r.get('head_sha')!=os.environ[head] or r.get('run_attempt')!=1 or r.get('status')!='completed' or r.get('conclusion')!=conclusion:
                  raise SystemExit('immutable attempt1 run drift '+key)
          jobs=[
              ('pr935-dedicated-jobs.json','PR935_DEDICATED_JOB','success'),('pr935-generic-jobs.json','PR935_GENERIC_JOB','success'),
              ('pr936-dedicated-jobs.json','PR936_DEDICATED_JOB','failure'),('pr936-generic-jobs.json','PR936_GENERIC_JOB','success'),
              ('pr937-dedicated-jobs.json','PR937_DEDICATED_JOB','failure'),('pr937-generic-jobs.json','PR937_GENERIC_JOB','success')]
          for fn,key,conclusion in jobs:
              js=z('correction-review/'+fn).get('jobs',[])
              if not any(int(j.get('id') or 0)==int(os.environ[key]) and j.get('conclusion')==conclusion for j in js):
                  raise SystemExit('immutable job drift '+key)
          a=z('correction-review/pr935-artifact.json')
          if a.get('id')!=int(os.environ['PR935_ARTIFACT']) or a.get('digest')!=os.environ['PR935_ARTIFACT_DIGEST'] or a.get('expired') is True:
              raise SystemExit('PR935 artifact identity drift')
          for pr in (936,937):
              if int(z(f'correction-review/pr{pr}-dedicated-artifacts.json').get('total_count') or 0)!=0:
                  raise SystemExit(f'PR{pr} failed dedicated run unexpectedly has artifacts')
          expected={
            int(os.environ['PR933_BACKUP_DEFECT']):('PR933','DISPATCH_REF_READ_RC_FAIL_OPEN'),
            int(os.environ['PR933_PRIMARY_DEFECT']):('PR933','DISPATCH_REF_READ_RC_FAIL_OPEN'),
            int(os.environ['PR935_PRIMARY_DEFECT']):('PR935','INSTALLED_PUBLISHER_FINAL_DISPATCH_REF_READ_RC_FAIL_OPEN'),
            int(os.environ['PR935_BACKUP_DEFECT']):('PR935','FINAL_PREMUTATION_DISPATCH_REF_RC_FAIL_OPEN'),
            int(os.environ['PR936_OWNER_DEFECT']):('PR936','DEFECT_EVIDENCE_BINDING_ROOT_TOKEN_MISMATCH'),
            int(os.environ['PR937_OWNER_DEFECT']):('PR937','PULL_REQUEST_MERGE_REF_HEAD_BINDING_MISMATCH')}
          for cid,(pr,root) in expected.items():
              c=z(f'correction-review/comment-{cid}.json'); body=str(c.get('body') or '').upper()
              if int(c.get('id') or 0)!=cid or c.get('user',{}).get('login')!='search-maker' or c.get('author_association')!='OWNER' or 'CONFIRMED_DEFECT' not in body or pr not in body or root not in body:
                  raise SystemExit('defect evidence drift '+str(cid))
          primary=str(z('correction-review/comment-'+os.environ['PR935_PRIMARY_DEFECT']+'.json').get('body') or '').upper()
          backup=str(z('correction-review/comment-'+os.environ['PR935_BACKUP_DEFECT']+'.json').get('body') or '').upper()
          semantic=('FINAL PRE-MUTATION','DISPATCH-REF','RC=2','FAIL')
          if not all(x in primary for x in semantic) or not all(x in backup for x in semantic):
              raise SystemExit('PR935 independent defect semantic binding drift')
          PY

      - name: Generate exact corrected publisher substrate and materialized reversible patch proof
        shell: bash
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,re,textwrap
          from pathlib import Path
          old=Path('correction-review/source-publisher-v3.yml').read_bytes(); oldtxt=old.decode()
          if hashlib.sha256(old).hexdigest()!=os.environ['SOURCE_PUBLISHER_SHA256']: raise SystemExit('source publisher SHA drift')
          old_known=int(os.environ['SOURCE_KNOWN_DEFECT']); new_known=int(os.environ['NEW_KNOWN_DEFECT'])
          old_k='KNOWN_DEFECT='+str(old_known); new_k='KNOWN_DEFECT='+str(new_known)
          if oldtxt.count(old_k)!=1: raise SystemExit('source KNOWN_DEFECT shape drift')
          mo=re.findall(r'^          B=\{([0-9,]+)\}$',oldtxt,re.M)
          if len(mo)!=1: raise SystemExit('source suppression-ledger shape drift')
          old_ids=[int(x) for x in mo[0].split(',') if x]
          if old_ids!=sorted(old_ids) or len(old_ids)!=int(os.environ['SOURCE_LEDGER_CARDINALITY']) or len(set(old_ids))!=len(old_ids): raise SystemExit('source suppression-ledger cardinality/order drift')
          added=[int(os.environ[x]) for x in ('PR933_BACKUP_DEFECT','PR933_PRIMARY_DEFECT','PR935_PRIMARY_DEFECT','PR935_BACKUP_DEFECT','PR936_OWNER_DEFECT','PR937_OWNER_DEFECT')]
          if len(set(added))!=6 or any(x<=old_known or x in old_ids for x in added) or max(added)!=new_known: raise SystemExit('exact new defect-ledger inputs drift')
          new_ids=sorted(old_ids+added)
          if len(new_ids)!=len(old_ids)+6 or len(set(new_ids))!=len(new_ids): raise SystemExit('corrected ledger cardinality drift')
          old_b='          B={'+','.join(map(str,old_ids))+'}'; new_b='          B={'+','.join(map(str,new_ids))+'}'
          bad="          if subprocess.run(['/usr/bin/git','ls-remote','--exit-code','--heads','origin',DISPATCH_BRANCH],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0: raise SystemExit('dispatch ref exists immediately before fenced mutation')"
          good="""          dispatch_ref_check=subprocess.run(['/usr/bin/git','ls-remote','--exit-code','--heads','origin',DISPATCH_BRANCH],text=True,capture_output=True)
          if dispatch_ref_check.returncode==0: raise SystemExit('dispatch ref exists immediately before fenced mutation')
          if dispatch_ref_check.returncode!=2: raise SystemExit(f'dispatch ref read failure immediately before fenced mutation: rc={dispatch_ref_check.returncode} stderr={dispatch_ref_check.stderr.strip()}')"""
          if oldtxt.count(bad)!=1 or oldtxt.count(good)!=0: raise SystemExit('source final pre-mutation guard shape drift')
          newtxt=oldtxt.replace(bad,good,1).replace(old_k,new_k,1).replace(old_b,new_b,1)
          new=newtxt.encode(); new_sha=hashlib.sha256(new).hexdigest()
          patches=[
            {'id':'final-premutation-dispatch-ref-exact-rc2','before':bad,'after':good,'expectedBeforeCount':1,'expectedAfterCount':1},
            {'id':'governance-known-defect-cutoff','before':old_k,'after':new_k,'expectedBeforeCount':1,'expectedAfterCount':1},
            {'id':'exact-suppression-ledger','before':old_b,'after':new_b,'expectedBeforeCount':1,'expectedAfterCount':1}]
          manifest={'schemaVersion':1,'transition':'AVPS_RECOVERY4_ORDINAL45_PUBLISHER_V3_FINAL_PREMUTATION_DISPATCH_REF_FAIL_CLOSED_CORRECTION_V6','sourcePublisherBlob':os.environ['SOURCE_PUBLISHER_BLOB'],'sourcePublisherSha256':os.environ['SOURCE_PUBLISHER_SHA256'],'correctedPublisherSha256':new_sha,'oldKnownDefect':old_known,'knownDefect':new_known,'sourceSuppressionLedgerCardinality':len(old_ids),'suppressionLedgerCardinality':len(new_ids),'addedExactSuppressedIds':added,'exactSuppressedIds':new_ids,'patches':patches,'finalPremutationDispatchRefAbsentOnlyOnRc2':True,'finalPremutationDispatchRefPresentRc0Fatal':True,'finalPremutationDispatchRefUnexpectedRcFatal':True,'materializedForwardReplayRequired':True,'materializedReverseReplayRequired':True,'publisherRuntimeScienceFenceSemanticsOtherwisePreservedByExactReversePatch':True}
          def apply(data,direction):
              txt=data.decode(); seq=patches if direction=='forward' else list(reversed(patches))
              for p in seq:
                  before=p['before'] if direction=='forward' else p['after']; after=p['after'] if direction=='forward' else p['before']; expected=p['expectedBeforeCount'] if direction=='forward' else p['expectedAfterCount']
                  if txt.count(before)!=expected: raise SystemExit(f'{direction} patch multiplicity drift {p["id"]}')
                  txt=txt.replace(before,after)
              return txt.encode()
          if apply(old,'forward')!=new or apply(new,'reverse')!=old: raise SystemExit('materialized forward/reverse replay failed')
          fenced=newtxt.index('          # BEGIN_CANONICAL_AVPS_ORDINAL45_FENCED_DISPATCH_V2')
          guard=newtxt.index('          dispatch_ref_check=subprocess.run(',fenced)
          create=newtxt.index("ref=json.loads(api(['--method','POST',f'repos/{REPO}/git/refs'",fenced)
          if not fenced < guard < create: raise SystemExit('corrected guard must precede dispatch-ref mutation')
          block=newtxt[guard:create]
          required=("dispatch_ref_check.returncode==0","dispatch_ref_check.returncode!=2","dispatch ref read failure immediately before fenced mutation")
          if any(x not in block for x in required): raise SystemExit('corrected final pre-mutation rc semantics drift')
          if bad in newtxt or newtxt.count(good)!=1: raise SystemExit('fail-open guard residue or multiplicity drift')
          a=newtxt.index('          import re\n          B={'); b=newtxt.index('          def state_check():',a)
          ns={}; exec(textwrap.dedent(newtxt[a:b]),ns)
          executable=sorted(int(x) for x in ns['B']); blocker=ns['avps_governance_blocker']
          if executable!=new_ids: raise SystemExit('receipt/manifest/executable ledger drift')
          comments=[c for p in json.load(open('correction-review/issue60-pages.json')) for c in p]
          byid={int(c.get('id') or 0):c for c in comments}
          for cid in added:
              body=str(byid[cid].get('body') or '')
              if not blocker(body,None): raise SystemExit('bound defect not intrinsically fatal '+str(cid))
              if blocker(body,cid): raise SystemExit('exact bound-defect suppression failed '+str(cid))
          for c in comments:
              cid=int(c.get('id') or 0)
              if old_known < cid <= new_known and cid not in added and blocker(str(c.get('body') or ''),cid): raise SystemExit('non-defect predecessor-window comment unexpectedly requires suppression '+str(cid))
          git_blob_sha=hashlib.sha1(b'blob '+str(len(new)).encode()+b'\0'+new).hexdigest()
          Path('correction-review/canonical-corrected-publisher-v3.yml').write_bytes(new)
          Path('correction-review/canonical-corrected-publisher-v3.sha256').write_text(new_sha+'\n')
          Path('correction-review/canonical-corrected-publisher-v3.gitblob').write_text(git_blob_sha+'\n')
          Path('correction-review/patch-manifest.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\n')
          receipt=dict(manifest)
          receipt.update({'status':'PASS_AVPS_RECOVERY4_ORDINAL45_PUBLISHER_V3_FINAL_PREMUTATION_GUARD_CORRECTION_REVIEW_V6_ZERO_RUNTIME','baseSha':os.environ['EXPECTED_BASE'],'reviewHead':os.environ['EVENT_HEAD'],'publisherPath':os.environ['PUBLISHER_PATH'],'correctedPublisherGitBlob':git_blob_sha,'rejectedEligibilityPr':int(os.environ['PR935']),'rejectedEligibilityHead':os.environ['PR935_HEAD'],'rejectedCorrectionReviewV4Pr':int(os.environ['PR936']),'rejectedCorrectionReviewV4Head':os.environ['PR936_HEAD'],'rejectedCorrectionReviewV5Pr':int(os.environ['PR937']),'rejectedCorrectionReviewV5Head':os.environ['PR937_HEAD'],'primaryDefectComment':int(os.environ['PR935_PRIMARY_DEFECT']),'backupDefectComment':int(os.environ['PR935_BACKUP_DEFECT']),'v4HarnessDefectComment':int(os.environ['PR936_OWNER_DEFECT']),'v5HarnessDefectComment':int(os.environ['PR937_OWNER_DEFECT']),'writeQuietEntered':False,'publisherInvoked':False,'dispatchCreated':False,'consumedMarkerCreated':False,'workflowDispatchPerformed':False,'scientificExecutionPerformed':False,'solverExecutionPerformed':False,'resultOpeningAuthorized':False,'levelBAdmissionAuthorized':False,'holdoutOpened':False,'productionAuthorized':False,'taylorOrJerusalemUsed':False,'newMappingAuthorized':False,'requiresSeparatePrimaryAndBackupAcceptanceBeforePublication':True})
          Path('correction-review/review-receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          PY

      - name: Fresh final live fail-closed boundary and non-authority proof
        shell: bash
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_BASE"
          test "$(git ls-remote origin refs/heads/$EXPECTED_BRANCH | cut -f1)" = "$EVENT_HEAD"
          set +e
          git ls-remote --exit-code --heads origin "$DISPATCH_BRANCH" >/dev/null 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then echo 'ordinal45 dispatch ref already exists' >&2; exit 1; fi
          if [ "$rc" -ne 2 ]; then echo "dispatch-ref live read failed closed rc=$rc" >&2; exit 1; fi
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > correction-review/final-issue60-pages.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/$SCIENCE_WORKFLOW/runs?event=workflow_dispatch&per_page=100" > correction-review/final-science-run-pages.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v3.yml/runs?event=workflow_dispatch&per_page=100" > correction-review/final-publisher-run-pages.json
          python - <<'PY'
          import json,os,re
          comments=[c for p in json.load(open('correction-review/final-issue60-pages.json')) for c in p]
          if any(str(c.get('body') or '').strip().startswith(os.environ['CONSUMED_MARKER']) for c in comments): raise SystemExit('consumed marker exists')
          opens={}
          for c in comments:
              cid=int(c.get('id') or 0); first=(str(c.get('body') or '').strip().splitlines() or [''])[0].strip()
              if first.startswith('WRITE_QUIET_BEGIN'): opens[cid]=first
              elif first.startswith('WRITE_QUIET_END'):
                  vals=[]
                  for key in ('begin','beginComment','begin_comment'): vals += re.findall(r'(?<![A-Za-z0-9_])'+re.escape(key)+r'=(\d+)(?![A-Za-z0-9_])',first)
                  if vals:
                      if len(set(vals))!=1: raise SystemExit('conflicting END aliases')
                      opens.pop(int(vals[0]),None)
