name: Review AVPS Recovery4 ordinal45 publisher v3 invocation eligibility v1

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery4-ordinal45-publisher-v3-invocation-eligibility-review-v1.yml

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: avps-v2-recovery4-ordinal45-publisher-v3-invocation-eligibility-v1-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_BASE: 91727a1c051c6ba52523f4642f29c138020c44b5
      EXPECTED_BRANCH: review/avps-v2-recovery4-ordinal45-publisher-v3-invocation-eligibility-v1
      EXPECTED_REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
      REVIEW_PATH: .github/workflows/avps-v2-recovery4-ordinal45-publisher-v3-invocation-eligibility-review-v1.yml
      PUBLISHER_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v3.yml
      PUBLISHER_BLOB: c444306cd5f7e3e44182062d565ccc770345f00d
      PUBLISHER_SHA256: 9b61da35e7eee5e2db057e17ac2f81cbc5bfa006fab5142feada3095f62f83d8
      PUBLISHER_PR: '928'
      PUBLISHER_HEAD: bbbd4c495b1139e1ca2e50495b8f5b91de9dd762
      PUBLISHER_MERGE: 91727a1c051c6ba52523f4642f29c138020c44b5
      PUBLISHER_DEDICATED_RUN: '33789235041'
      PUBLISHER_GENERIC_RUN: '33789235185'
      PUBLISHER_ARTIFACT: '9906644809'
      PUBLISHER_ARTIFACT_DIGEST: sha256:43aae85e13ee1ae4e6aabab014509e93a26d7ec57a393ad60f69a3216aad5497
      PUBLISHER_POSTMERGE_RUN: '33791300571'
      PUBLISHER_BACKUP_ACCEPT: '5530302793'
      PUBLISHER_PRIMARY_ACCEPT: '5530343349'
      AUTH_BRANCH: authorization/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-ordinal-45
      AUTH_HEAD: 6e095b4b1603c90dcee0943295909b30cd1b374d
      AUTH_PARENT: 5685d5c313071014a94c816ee26b129f1f17a7fc
      AUTH_PR: '774'
      AUTHORIZATION_BLOB: 96ee8299d00bd72cdb73de4583670730ce89c73b
      DISPATCH_BRANCH: dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-ordinal-45
      EXECUTION_KEY: aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4:numerical:45
      ALLOCATION_MARKER: ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_AUTHORIZATION_ALLOCATED_REVIEWED_NOT_DISPATCHED commit=6e095b4b1603c90dcee0943295909b30cd1b374d parent=5685d5c313071014a94c816ee26b129f1f17a7fc pr=774
      CONSUMED_MARKER: ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_DISPATCH_CONSUMED
      CANDIDATE_SEED_SHA256: ddded6b2d170ca2fac8d498bdba2887446c16995df0880d948fb2be00870b3de
      CANDIDATE_ROWS_SHA256: c439de417520b330c037e2628df02b6955f652563300aa5ef30477abf7661a98
      AUTH_SEED_LEDGER_PATH: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-seed-global-control-v1/seed_ledger.py
      AUTH_SEED_LEDGER_BLOB: 16af5c68ae7e3cfc0cfbef4c8e2022517bf2ae91
      NATIVE_SEED_HELPER_PATH: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-science-transport-v1/native_authorization_seed_transport.py
      NATIVE_SEED_HELPER_BLOB: 2df2c3fd1ffa78e16f44e6825d67b3e82e903c1e
      HISTORICAL_AUTH_BRANCH: authorization/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery1-ordinal-42
      HISTORICAL_HEAD: e627a689ada0493a8a5b9cdafc4aba0198fbabec
      HISTORICAL_SEED_LEDGER_PATH: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-seed-freshness-v1/seed_ledger.py
      HISTORICAL_SEED_LEDGER_BLOB: 491d1b6653bea0fcc5275269723a76aa1af52300
      SCIENCE_WORKFLOW: .github/workflows/avps-v2-postconsumption-recovery4-science.yml
      SCIENCE_WORKFLOW_BLOB: 2d210b3a161f6889352d600fb9222c974e728034
      RUNTIME_ADAPTER_PATH: runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py
      RUNTIME_ADAPTER_BLOB: e4b690c2969fd01ecde5b08f554e47ad50b40914
      EXECUTOR_PATH: runtime-avps-v2-recovery4-ordinal45-v1/executor.py
      EXECUTOR_BLOB: 7dc38e31c19701b1a1ceef300d75105cff179290
      AGGREGATOR_PATH: runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py
      AGGREGATOR_BLOB: 6afc8b0d21c2b5553c251dc9ca5524c795ed2646
      RUNTIME_CONTRACT_PATH: runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json
      RUNTIME_CONTRACT_BLOB: 2d5f71d80b5e573b86775c2806b80dcc1fbe02f4
      GOVERNANCE_CUTOFF_COMMENT: '5530343349'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Bind fresh direct-child non-authorizing review identity
        shell: bash
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "${{ github.event.action }}" = opened
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$EVENT_BASE" = "$EXPECTED_BASE"
          test "$EVENT_BRANCH" = "$EXPECTED_BRANCH"
          test "$EVENT_HEAD" = "$EXPECTED_REVIEW_HEAD"
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          test "$(git rev-list --count "$EXPECTED_BASE"..HEAD)" = 1
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_BASE"
          test "$(git ls-remote origin refs/heads/$EXPECTED_BRANCH | cut -f1)" = "$EXPECTED_REVIEW_HEAD"
          git diff --name-only "$EXPECTED_BASE"...HEAD > changed.txt
          test "$(wc -l < changed.txt)" = 1
          grep -Fx "$REVIEW_PATH" changed.txt
          if git diff --name-only "$EXPECTED_BASE"...HEAD | grep -E '^(experiments|runtime-|scientific-tools|src)/'; then
            echo 'scientific/runtime source changed by invocation-eligibility review' >&2
            exit 1
          fi
          test -z "$(command -v uvspec || true)"
          if grep -nE '(^|[^A-Za-z_])workflow_dispatch:|uvspec|libRadtran|MYSTIC' "$REVIEW_PATH"; then
            echo 'review workflow contains prohibited execution surface' >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > pr.json
          python - <<'PY'
          import json,os
          p=json.load(open('pr.json'))
          if p.get('state')!='open' or p.get('draft') is not False or p.get('merged_at') is not None:
              raise SystemExit('review PR must remain non-Draft/open/unmerged')
          if p['head']['sha']!=os.environ['EVENT_HEAD'] or p['base']['sha']!=os.environ['EVENT_BASE']:
              raise SystemExit('review PR identity drift')
          PY

      - name: Bind installed accepted publisher and postmerge proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p invocation-eligibility
          test "$(git rev-parse "$EXPECTED_BASE:$PUBLISHER_PATH")" = "$PUBLISHER_BLOB"
          git show "$EXPECTED_BASE:$PUBLISHER_PATH" > invocation-eligibility/publisher.yml
          test "$(sha256sum invocation-eligibility/publisher.yml | cut -d' ' -f1)" = "$PUBLISHER_SHA256"
          for pair in \
            "$SCIENCE_WORKFLOW:$SCIENCE_WORKFLOW_BLOB" \
            "$RUNTIME_ADAPTER_PATH:$RUNTIME_ADAPTER_BLOB" \
            "$EXECUTOR_PATH:$EXECUTOR_BLOB" \
            "$AGGREGATOR_PATH:$AGGREGATOR_BLOB" \
            "$RUNTIME_CONTRACT_PATH:$RUNTIME_CONTRACT_BLOB"; do
            path="${pair%:*}"; blob="${pair##*:}"
            test "$(git rev-parse "$EXPECTED_BASE:$path")" = "$blob"
          done
          python - <<'PY'
          import os
          from pathlib import Path
          text=Path('invocation-eligibility/publisher.yml').read_text()
          required=[
            ".github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v3.yml",
            "group: avps-v2-postconsumption-recovery4-ordinal-45-science",
            "WRITE_QUIET_BEGIN | AVPS_V2_RECOVERY4_ORDINAL45_SNAPSHOT_V1",
            "science_run=PENDING",
            "final_begin=f'WRITE_QUIET_BEGIN | AVPS_V2_RECOVERY4_ORDINAL45_SNAPSHOT_V1",
            "issues/comments/{begin}",
            "end_body=f'WRITE_QUIET_END | AVPS_V2_RECOVERY4_ORDINAL45_SNAPSHOT_V1",
            os.environ['DISPATCH_BRANCH'], os.environ['CONSUMED_MARKER'],
            os.environ['SCIENCE_WORKFLOW'].split('/')[-1], os.environ['EXECUTION_KEY'],
            os.environ['AUTH_HEAD'], os.environ['CANDIDATE_SEED_SHA256'], os.environ['CANDIDATE_ROWS_SHA256']]
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit(f'accepted publisher choreography token drift: {missing}')
          if text.index('science_run=PENDING') >= text.index("final_begin=f'WRITE_QUIET_BEGIN"):
              raise SystemExit('same-BEGIN pending-to-exact-science-run ordering drift')
          if text.index("final_begin=f'WRITE_QUIET_BEGIN") >= text.index("end_body=f'WRITE_QUIET_END"):
              raise SystemExit('same-BEGIN/END release ordering drift')
          PY
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PUBLISHER_PR" > invocation-eligibility/publisher-pr.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PUBLISHER_DEDICATED_RUN" > invocation-eligibility/publisher-dedicated-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PUBLISHER_GENERIC_RUN" > invocation-eligibility/publisher-generic-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PUBLISHER_ARTIFACT" > invocation-eligibility/publisher-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PUBLISHER_POSTMERGE_RUN" > invocation-eligibility/publisher-postmerge-run.json
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$PUBLISHER_BACKUP_ACCEPT" > invocation-eligibility/backup-accept.json
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$PUBLISHER_PRIMARY_ACCEPT" > invocation-eligibility/primary-accept.json
          python - <<'PY'
          import json,os
          pr=json.load(open('invocation-eligibility/publisher-pr.json'))
          if pr.get('number')!=928 or pr.get('state')!='closed' or not pr.get('merged_at') or pr.get('merge_commit_sha')!=os.environ['PUBLISHER_MERGE'] or pr['head']['sha']!=os.environ['PUBLISHER_HEAD']:
              raise SystemExit('publisher merge proof drift')
          for path,key in [('publisher-dedicated-run.json','PUBLISHER_DEDICATED_RUN'),('publisher-generic-run.json','PUBLISHER_GENERIC_RUN')]:
              r=json.load(open('invocation-eligibility/'+path))
              if r['id']!=int(os.environ[key]) or r.get('head_sha')!=os.environ['PUBLISHER_HEAD'] or r.get('run_attempt')!=1 or r.get('status')!='completed' or r.get('conclusion')!='success':
                  raise SystemExit(f'publisher attempt1 proof drift: {key}')
          a=json.load(open('invocation-eligibility/publisher-artifact.json'))
          if a['id']!=int(os.environ['PUBLISHER_ARTIFACT']) or a.get('digest')!=os.environ['PUBLISHER_ARTIFACT_DIGEST'] or a.get('expired'):
              raise SystemExit('publisher artifact proof drift')
          post=json.load(open('invocation-eligibility/publisher-postmerge-run.json'))
          if post['id']!=int(os.environ['PUBLISHER_POSTMERGE_RUN']) or post.get('head_sha')!=os.environ['EXPECTED_BASE'] or post.get('run_attempt')!=1 or post.get('status')!='completed' or post.get('conclusion')!='success':
              raise SystemExit('publisher postmerge proof drift')
          for fn,cid in [('backup-accept.json',int(os.environ['PUBLISHER_BACKUP_ACCEPT'])),('primary-accept.json',int(os.environ['PUBLISHER_PRIMARY_ACCEPT']))]:
              c=json.load(open('invocation-eligibility/'+fn)); body=str(c.get('body') or '').upper()
              if int(c.get('id') or 0)!=cid or c.get('user',{}).get('login')!='search-maker' or c.get('author_association')!='OWNER' or 'ACCEPT' not in body or 'PR928' not in body or os.environ['PUBLISHER_HEAD'].upper() not in body:
                  raise SystemExit(f'publisher independent acceptance drift: {cid}')
          PY

      - name: Fresh live governance and one-use absence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_BASE"
          git fetch origin "refs/heads/$AUTH_BRANCH:refs/remotes/origin/$AUTH_BRANCH"
          test "$(git rev-parse origin/$AUTH_BRANCH)" = "$AUTH_HEAD"
          test "$(git rev-parse "$AUTH_HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-authorization-control-v1/authorization.json")" = "$AUTHORIZATION_BLOB"
          if git ls-remote --exit-code --heads origin "$DISPATCH_BRANCH" >/dev/null 2>&1; then
            echo 'ordinal45 dispatch ref already exists' >&2; exit 1
          fi
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > invocation-eligibility/issue60-pages.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v3.yml/runs?event=workflow_dispatch&per_page=100" > invocation-eligibility/publisher-run-pages.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/avps-v2-postconsumption-recovery4-science.yml/runs?event=workflow_dispatch&per_page=100" > invocation-eligibility/science-run-pages.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/$AUTH_PR" > invocation-eligibility/authorization-pr.json
          python - <<'PY'
          import json,os,re
          pages=json.load(open('invocation-eligibility/issue60-pages.json')); comments=[c for p in pages for c in p]
          bodies=[str(c.get('body') or '').strip() for c in comments]
          if sum(b==os.environ['ALLOCATION_MARKER'] for b in bodies)!=1: raise SystemExit('allocation marker cardinality drift')
          if sum(b.startswith(os.environ['CONSUMED_MARKER']) for b in bodies)!=0: raise SystemExit('ordinal45 already consumed')
          opens={}; aliases=('begin','beginComment','begin_comment')
          for c in comments:
              cid=int(c.get('id') or 0); body=str(c.get('body') or '').strip(); first=(body.splitlines() or [''])[0].strip()
              if first.startswith('WRITE_QUIET_BEGIN'): opens[cid]=first
              elif first.startswith('WRITE_QUIET_END'):
                  vals=[]
                  for key in aliases: vals += re.findall(r'(?<![A-Za-z0-9_])'+re.escape(key)+r'=(\d+)(?![A-Za-z0-9_])',first)
                  if vals:
                      if len(set(vals))!=1: raise SystemExit(f'conflicting WRITE_QUIET_END aliases at {cid}: {vals}')
                      opens.pop(int(vals[0]),None)
          if opens: raise SystemExit(f'unmatched WRITE_QUIET_BEGIN: {sorted(opens)}')
          cutoff=int(os.environ['GOVERNANCE_CUTOFF_COMMENT'])
          fatal=('CONFIRMED_DEFECT','COORDINATOR::CONFIRMED_DEFECT','BLOCKER','NOT_ADMISSIBLE','DO NOT USE','QUARANTINE_DOWNSTREAM=TRUE','HALT')
          for c in comments:
              cid=int(c.get('id') or 0)
              if cid<=cutoff: continue
              body=str(c.get('body') or ''); up=body.upper()
              relevant=('AVPS' in up or 'ORDINAL45' in up or 'AEROSOL_VERTICAL_PROFILE' in up)
              if relevant and any(tok in up for tok in fatal):
                  raise SystemExit(f'newer potentially controlling AVPS blocker/refusal: {cid}')
          for fn in ('publisher-run-pages.json','science-run-pages.json'):
              p=json.load(open('invocation-eligibility/'+fn)); runs=[r for page in p for r in page.get('workflow_runs',[])]
              if runs: raise SystemExit(f'protected workflow_dispatch already exists in {fn}: {[r.get("id") for r in runs]}')
          pr=json.load(open('invocation-eligibility/authorization-pr.json'))
          if pr.get('number')!=774 or pr.get('state')!='open' or pr.get('draft') is not True or pr.get('merged_at') is not None or pr['head']['sha']!=os.environ['AUTH_HEAD']:
              raise SystemExit('authorization PR state drift')
          PY

      - name: Build frozen candidate ledger and tracked-tree proof
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z > invocation-eligibility/tracked-files.nul
          test "$(git rev-parse HEAD:$NATIVE_SEED_HELPER_PATH)" = "$NATIVE_SEED_HELPER_BLOB"
          git fetch origin "refs/heads/$HISTORICAL_AUTH_BRANCH:refs/remotes/origin/$HISTORICAL_AUTH_BRANCH"
          test "$(git rev-parse origin/$HISTORICAL_AUTH_BRANCH)" = "$HISTORICAL_HEAD"
          python "$NATIVE_SEED_HELPER_PATH" \
            --repo-root . \
            --authorization-head "$AUTH_HEAD" \
            --authorization-parent "$AUTH_PARENT" \
            --authorization-ledger-path "$AUTH_SEED_LEDGER_PATH" \
            --authorization-ledger-blob "$AUTH_SEED_LEDGER_BLOB" \
            --candidate-seed-sha256 "$CANDIDATE_SEED_SHA256" \
            --candidate-rows-sha256 "$CANDIDATE_ROWS_SHA256" \
            --historical-head "$HISTORICAL_HEAD" \
            --historical-ledger-path "$HISTORICAL_SEED_LEDGER_PATH" \
            --historical-ledger-blob "$HISTORICAL_SEED_LEDGER_BLOB" \
            --work-root invocation-eligibility/native-seed-transport \
            --output-ledger invocation-eligibility/candidate-seed-ledger.json \
            --output-context invocation-eligibility/native-seed-context.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.load(open('invocation-eligibility/candidate-seed-ledger.json'))
          seeds=[int(v) for v in x.get('candidateSeeds',[])]; rows=x.get('candidateRows',[])
          if x.get('candidateSeedCanonicalSha256')!=os.environ['CANDIDATE_SEED_SHA256'] or x.get('candidateRowsCanonicalSha256')!=os.environ['CANDIDATE_ROWS_SHA256'] or len(seeds)!=72 or len(set(seeds))!=72 or len(rows)!=72:
              raise SystemExit('candidate ledger drift')
          Path('invocation-eligibility/empty-self-ledger-policy.json').write_text(json.dumps({'schemaVersion':2,'requiredTrackedSelfLedgerPaths':[],'futureEvidenceSelfLedgerPaths':[]},indent=2,sort_keys=True)+'\n')
          PY
          python review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/tracked_tree_seed_scan.py \
            --repo-root . --file-list invocation-eligibility/tracked-files.nul \
            --candidate-seed-ledger invocation-eligibility/candidate-seed-ledger.json \
            --allow-self-ledger-json invocation-eligibility/empty-self-ledger-policy.json \
            --output invocation-eligibility/tracked-seed-scan.json
          python - <<'PY'
          import json
          x=json.load(open('invocation-eligibility/tracked-seed-scan.json'))
          if x.get('trackedTreeExternalCollisionCount')!=0: raise SystemExit('tracked candidate-seed collision')
          PY

      - name: Fresh repository-global seed collision proof
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p invocation-eligibility/global-scan-attempts
          success=0
          for n in 1 2 3; do
            out="invocation-eligibility/global-scan-attempts/report-$n.json"
            stdout="invocation-eligibility/global-scan-attempts/stdout-$n.txt"
            stderr="invocation-eligibility/global-scan-attempts/stderr-$n.txt"
            set +e
            python review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/repository_global_seed_scan.py \
              --repository "$GITHUB_REPOSITORY" --issue-number 60 \
              --candidate-seed-ledger invocation-eligibility/candidate-seed-ledger.json \
              --current-run-id "$GITHUB_RUN_ID" --audit-mode authorization-recheck \
              --expected-branch-name "$EXPECTED_BRANCH" --expected-repo-head "$EXPECTED_REVIEW_HEAD" \
              --output "$out" >"$stdout" 2>"$stderr"
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then cp "$out" invocation-eligibility/repository-global-seed-scan.json; printf '%s\n' "$n" > invocation-eligibility/global-scan-success-attempt.txt; success=1; break; fi
            cat "$stderr" >&2
            if ! grep -Fq 'snapshot-fenced repository-global metadata changed between two complete enumerations' "$stderr"; then exit "$rc"; fi
            test "$n" -lt 3 || break
            sleep $((n*5))
          done
          test "$success" = 1 || { echo 'repository-global scan remained unstable' >&2; exit 1; }
          python - <<'PY'
          import json
          x=json.load(open('invocation-eligibility/repository-global-seed-scan.json'))
          if x.get('repositoryGlobalCollisionCount',x.get('collisionCount'))!=0: raise SystemExit('repository-global candidate-seed collision')
          if x.get('repositoryGlobalDoubleEnumerationStable') is not True: raise SystemExit('repository-global enumeration unstable')
          if x.get('auditedBranchHeadMatchesRepositoryHead') is not True: raise SystemExit('audited branch/head mismatch')
          if int(x.get('repositoryGlobalPostFenceCandidateSeedCollisionCount',0) or 0)!=0: raise SystemExit('post-fence seed collision')
          PY

      - name: Final live ordinal governance and immutable proposal receipt
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_BASE"
          test "$(git ls-remote origin refs/heads/$EXPECTED_BRANCH | cut -f1)" = "$EXPECTED_REVIEW_HEAD"
          test "$(git ls-remote origin refs/heads/$AUTH_BRANCH | cut -f1)" = "$AUTH_HEAD"
          if git ls-remote --exit-code --heads origin "$DISPATCH_BRANCH" >/dev/null 2>&1; then echo 'dispatch ref appeared during review' >&2; exit 1; fi
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > invocation-eligibility/final-issue60-pages.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v3.yml/runs?event=workflow_dispatch&per_page=100" > invocation-eligibility/final-publisher-run-pages.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/avps-v2-postconsumption-recovery4-science.yml/runs?event=workflow_dispatch&per_page=100" > invocation-eligibility/final-science-run-pages.json
          PYTHONPATH=experiments/aerosol-vertical-profile-sensitivity-v1 python - <<'PY'
          import json,os,re
          from pathlib import Path
          import preauthorization_surface, global_ordinal
