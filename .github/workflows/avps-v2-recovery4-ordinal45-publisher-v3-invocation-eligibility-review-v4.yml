      - name: Fresh repository-global seed collision proof
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p invocation-eligibility/global-scan-attempts
          success=0
          for n in 1 2 3; do
            out="invocation-eligibility/global-scan-attempts/report-$n.json"
            stdout="invocation-eligibility/global-scan-attempts/stdout-$n.txt"
            stderr="invocation-eligibility/global-scan-attempts/stderr-$n.txt"
            set +e
            python review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/repository_global_seed_scan.py \
              --repository "$GITHUB_REPOSITORY" --issue-number 60 \
              --candidate-seed-ledger invocation-eligibility/candidate-seed-ledger.json \
              --current-run-id "$GITHUB_RUN_ID" --audit-mode authorization-recheck \
              --expected-branch-name "$EXPECTED_BRANCH" --expected-repo-head "$EXPECTED_REVIEW_HEAD" \
              --output "$out" >"$stdout" 2>"$stderr"
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then cp "$out" invocation-eligibility/repository-global-seed-scan.json; printf '%s\n' "$n" > invocation-eligibility/global-scan-success-attempt.txt; success=1; break; fi
            cat "$stderr" >&2
            if ! grep -Fq 'snapshot-fenced repository-global metadata changed between two complete enumerations' "$stderr"; then exit "$rc"; fi
            test "$n" -lt 3 || break
            sleep $((n*5))
          done
          test "$success" = 1 || { echo 'repository-global scan remained unstable' >&2; exit 1; }
          python - <<'PY'
          import json
          x=json.load(open('invocation-eligibility/repository-global-seed-scan.json'))
          if x.get('repositoryGlobalCollisionCount',x.get('collisionCount'))!=0: raise SystemExit('repository-global candidate-seed collision')
          if x.get('repositoryGlobalDoubleEnumerationStable') is not True: raise SystemExit('repository-global enumeration unstable')
          if x.get('auditedBranchHeadMatchesRepositoryHead') is not True: raise SystemExit('audited branch/head mismatch')
          if int(x.get('repositoryGlobalPostFenceCandidateSeedCollisionCount',0) or 0)!=0: raise SystemExit('post-fence seed collision')
          PY

      - name: Final live ordinal governance and immutable non-authorizing receipt
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_BASE"
          test "$(git ls-remote origin refs/heads/$EXPECTED_BRANCH | cut -f1)" = "$EXPECTED_REVIEW_HEAD"
          test "$(git ls-remote origin refs/heads/$AUTH_BRANCH | cut -f1)" = "$AUTH_HEAD"
          set +e
          git ls-remote --exit-code --heads origin "$DISPATCH_BRANCH" >/dev/null 2>&1
          dispatch_ref_rc=$?
          set -e
          if [ "$dispatch_ref_rc" -eq 0 ]; then
            echo 'dispatch ref appeared during review' >&2
            exit 1
          elif [ "$dispatch_ref_rc" -ne 2 ]; then
            echo "dispatch ref absence read failed closed during final review: rc=$dispatch_ref_rc" >&2
            exit 1
          fi
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > invocation-eligibility/final-issue60-pages.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v3.yml/runs?event=workflow_dispatch&per_page=100" > invocation-eligibility/final-publisher-dispatch-pages.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/avps-v2-postconsumption-recovery4-science.yml/runs?event=workflow_dispatch&per_page=100" > invocation-eligibility/final-science-dispatch-pages.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs?event=workflow_dispatch&per_page=100" > invocation-eligibility/final-global-dispatch-pages.json
          PYTHONPATH=experiments/aerosol-vertical-profile-sensitivity-v1 python - <<'PY'
          import json,os,re
          from pathlib import Path
          import preauthorization_surface, global_ordinal
          root='invocation-eligibility/'
          pages=json.load(open(root+'final-issue60-pages.json'))
          if not isinstance(pages,list) or not pages or any(not isinstance(p,list) for p in pages): raise SystemExit('final issue60 pagination/API drift')
          comments=[c for p in pages for c in p]
          ids=[c.get('id') for c in comments]
          if any(not isinstance(x,int) for x in ids) or len(ids)!=len(set(ids)): raise SystemExit('final issue60 duplicate/invalid ids')
          bodies=[str(c.get('body') or '').strip() for c in comments]
          if sum(b==os.environ['ALLOCATION_MARKER'] for b in bodies)!=1: raise SystemExit('final allocation marker drift')
          if sum(b.startswith(os.environ['CONSUMED_MARKER']) for b in bodies)!=0: raise SystemExit('consumed marker appeared during review')
          opens={}; aliases=('begin','beginComment','begin_comment')
          for c in comments:
              cid=int(c.get('id') or 0); first=(str(c.get('body') or '').strip().splitlines() or [''])[0].strip()
              if first.startswith('WRITE_QUIET_BEGIN'): opens[cid]=first
              elif first.startswith('WRITE_QUIET_END'):
                  vals=[]
                  for key in aliases: vals += re.findall(r'(?<![A-Za-z0-9_])'+re.escape(key)+r'=(\d+)(?![A-Za-z0-9_])',first)
                  if vals:
                      if len(set(vals))!=1: raise SystemExit(f'conflicting final END aliases: {cid}')
                      opens.pop(int(vals[0]),None)
          if opens: raise SystemExit(f'final unmatched WRITE_QUIET_BEGIN: {sorted(opens)}')
          cutoff=int(os.environ['GOVERNANCE_CUTOFF_COMMENT'])
          fatal=('CONFIRMED_DEFECT','COORDINATOR::CONFIRMED_DEFECT','BLOCKER','NOT_ADMISSIBLE','DO NOT USE','QUARANTINE_DOWNSTREAM=TRUE','HALT')
          for c in comments:
              cid=int(c.get('id') or 0)
              if cid<=cutoff: continue
              up=str(c.get('body') or '').upper(); relevant=('AVPS' in up or 'ORDINAL45' in up or 'AEROSOL_VERTICAL_PROFILE' in up)
              if relevant and any(tok in up for tok in fatal): raise SystemExit(f'final newer AVPS blocker/refusal: {cid}')
          def complete_runs(fn):
              ps=json.load(open(root+fn))
              if not isinstance(ps,list) or not ps or any(not isinstance(p,dict) for p in ps): raise SystemExit(f'{fn} pagination/API drift')
              totals={p.get('total_count') for p in ps}
              if len(totals)!=1 or any(not isinstance(x,int) or x<0 for x in totals): raise SystemExit(f'{fn} total_count drift')
              runs=[]
              for p in ps:
                  if not isinstance(p.get('workflow_runs'),list): raise SystemExit(f'{fn} workflow_runs drift')
                  runs.extend(p['workflow_runs'])
              if len(runs)!=next(iter(totals)): raise SystemExit(f'{fn} incomplete pagination')
              rids=[r.get('id') for r in runs]
              if any(not isinstance(x,int) for x in rids) or len(rids)!=len(set(rids)): raise SystemExit(f'{fn} duplicate/invalid run ids')
              return runs
          if complete_runs('final-publisher-dispatch-pages.json'): raise SystemExit('final publisher workflow_dispatch exists')
          if complete_runs('final-science-dispatch-pages.json'): raise SystemExit('final Recovery4 science workflow_dispatch exists')
          global_runs=complete_runs('final-global-dispatch-pages.json')
          protected={os.environ['PUBLISHER_PATH'],os.environ['SCIENCE_WORKFLOW']}
          if [r.get('id') for r in global_runs if r.get('path') in protected]: raise SystemExit('final protected workflow_dispatch found globally')
          payload=preauthorization_surface.collect(os.environ['GITHUB_REPOSITORY'],os.environ['GITHUB_TOKEN'])
          latest=preauthorization_surface.latest_consumed_or_dispatched_ordinal(payload)
          observations=global_ordinal.authoritative_global_ordinal_observations(payload,current_run_id=int(os.environ['GITHUB_RUN_ID']))
          ordinals=sorted({int(row['ordinal']) for row in observations})
          if latest!=44: raise SystemExit(f'latest consumed/dispatched ordinal drift: {latest}')
          if not ordinals or max(ordinals)!=45: raise SystemExit(f'global ordinal surface drift: {ordinals[-10:]}')
          proposal={
            'schemaVersion':1,
            'status':'PASS_AVPS_V2_RECOVERY4_ORDINAL45_PUBLISHER_V3_INVOCATION_ELIGIBILITY_PROPOSAL_V4_ZERO_RUNTIME',
            'scientificOrdinal':45,
            'executionKey':os.environ['EXECUTION_KEY'],
            'authorizationHead':os.environ['AUTH_HEAD'],
            'authorizationParent':os.environ['AUTH_PARENT'],
            'authorizationPr':int(os.environ['AUTH_PR']),
            'currentMain':os.environ['EXPECTED_BASE'],
            'reviewHead':os.environ['EXPECTED_REVIEW_HEAD'],
            'publisherPath':os.environ['PUBLISHER_PATH'],
            'publisherBlob':os.environ['PUBLISHER_BLOB'],
            'publisherSha256':os.environ['PUBLISHER_SHA256'],
            'publisherPr':int(os.environ['PUBLISHER_PR']),
            'publisherHead':os.environ['PUBLISHER_HEAD'],
            'publisherParent':os.environ['PUBLISHER_PARENT'],
            'publisherMerge':os.environ['PUBLISHER_MERGE'],
            'publisherDedicatedRun':int(os.environ['PUBLISHER_DEDICATED_RUN']),
            'publisherDedicatedJob':int(os.environ['PUBLISHER_DEDICATED_JOB']),
            'publisherGenericRun':int(os.environ['PUBLISHER_GENERIC_RUN']),
            'publisherGenericJob':int(os.environ['PUBLISHER_GENERIC_JOB']),
            'publisherArtifact':int(os.environ['PUBLISHER_ARTIFACT']),
            'publisherArtifactDigest':os.environ['PUBLISHER_ARTIFACT_DIGEST'],
            'publisherCandidateComment':int(os.environ['PUBLISHER_CANDIDATE']),
            'publisherBackupAcceptanceComment':int(os.environ['PUBLISHER_BACKUP_ACCEPT']),
            'publisherPrimaryAcceptanceComment':int(os.environ['PUBLISHER_PRIMARY_ACCEPT']),
            'publisherPostmergeRun':int(os.environ['PUBLISHER_POSTMERGE_RUN']),
            'publisherPostmergeJob':int(os.environ['PUBLISHER_POSTMERGE_JOB']),
            'dispatchBranch':os.environ['DISPATCH_BRANCH'],
            'candidateSeedCanonicalSha256':os.environ['CANDIDATE_SEED_SHA256'],
            'candidateRowsCanonicalSha256':os.environ['CANDIDATE_ROWS_SHA256'],
            'caseCount':360,'commonRandomNumberGroupCount':72,'statesPerGroup':5,'photonHistoriesPerCase':20000000,
            'latestConsumedOrDispatchedScientificOrdinal':latest,
            'maxObservedScientificOrdinal':max(ordinals),
            'dispatchRefAbsenceRequiresExactRc2':True,
            'workflowDispatchInventoryUsesCompletePagination':True,
            'workflowDispatchInventoryRequiresTotalCountMatch':True,
            'workflowDispatchInventoryRejectsDuplicateRunIds':True,
            'publisherApplyMergedAndPostmergeVerified':True,
            'publisherInvocationAuthorized':False,
            'writeQuietEntered':False,
            'publisherInvoked':False,
            'dispatchCreated':False,
            'consumedMarkerCreated':False,
            'workflowDispatchPerformed':False,
            'scientificExecutionPerformed':False,
            'solverExecutionPerformed':False,
            'resultOpeningAuthorized':False,
            'levelBAdmissionAuthorized':False,
            'holdoutOpened':False,
            'productionAuthorized':False,
            'taylorOrJerusalemUsed':False,
            'newMappingAuthorized':False,
            'requiresSeparatePrimaryAndBackupAcceptanceBeforeProtectedTransition':True,
            'requiresFreshIssue60MainGlobalScanImmediatelyBeforeInvocation':True
          }
          Path(root+'invocation-eligibility.proposed.json').write_text(json.dumps(proposal,indent=2,sort_keys=True)+'\n')
          receipt=dict(proposal)
          receipt['status']='PASS_AVPS_V2_RECOVERY4_ORDINAL45_PUBLISHER_V3_INVOCATION_ELIGIBILITY_REVIEW_V4_ZERO_RUNTIME'
          Path(root+'review-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          test -z "$(git status --porcelain --untracked-files=no)"

