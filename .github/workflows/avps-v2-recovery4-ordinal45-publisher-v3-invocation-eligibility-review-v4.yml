name: Review AVPS Recovery4 ordinal45 publisher v3 invocation eligibility v4

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery4-ordinal45-publisher-v3-invocation-eligibility-review-v4.yml

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: avps-v2-recovery4-ordinal45-publisher-v3-invocation-eligibility-v4-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_BASE: acd10663a9c16ff0c6e9f02a35167dd41894f224
      EXPECTED_BRANCH: review/avps-v2-recovery4-ordinal45-publisher-v3-invocation-eligibility-v4
      EXPECTED_REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
      REVIEW_PATH: .github/workflows/avps-v2-recovery4-ordinal45-publisher-v3-invocation-eligibility-review-v4.yml
      PUBLISHER_PATH: .github/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v3.yml
      PUBLISHER_BLOB: 516d535d4980fe2802e1e69c552054702fac5b37
      PUBLISHER_SHA256: 3ada0a15f1c5d381c8dee8a81f79ee93ce9bf658701f5b80e804f384cf66edad
      SOURCE_PUBLISHER_BLOB: c444306cd5f7e3e44182062d565ccc770345f00d
      SOURCE_PUBLISHER_SHA256: 9b61da35e7eee5e2db057e17ac2f81cbc5bfa006fab5142feada3095f62f83d8
      PUBLISHER_PR: '948'
      PUBLISHER_HEAD: 97117f567188ffb8e73760c1de269ed8dd6e7eb6
      PUBLISHER_PARENT: 285b1af12df710328b7ff9c2be511ea9ae34268a
      PUBLISHER_MERGE: acd10663a9c16ff0c6e9f02a35167dd41894f224
      PUBLISHER_DEDICATED_RUN: '33890668584'
      PUBLISHER_DEDICATED_JOB: '101081258445'
      PUBLISHER_DEDICATED_WORKFLOW: .github/workflows/avps-v2-recovery4-ordinal45-publisher-v3-accepted-canonical-apply-review-v76.yml
      PUBLISHER_GENERIC_RUN: '33890668612'
      PUBLISHER_GENERIC_JOB: '101081259021'
      PUBLISHER_ARTIFACT: '9943698233'
      PUBLISHER_ARTIFACT_NAME: avps-v2-recovery4-ordinal45-publisher-v3-accepted-canonical-apply-review-v76
      PUBLISHER_ARTIFACT_DIGEST: sha256:527adf3c6e1d8fc0fa7502cc255938d3b30b36913accc61cd06421a9dbdbfd07
      PUBLISHER_CANDIDATE: '5542962912'
      PUBLISHER_BACKUP_ACCEPT: '5543776278'
      PUBLISHER_PRIMARY_ACCEPT: '5543925561'
      PUBLISHER_POSTMERGE_RUN: '33902389490'
      PUBLISHER_POSTMERGE_JOB: '101119247704'
      AUTH_BRANCH: authorization/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-ordinal-45
      AUTH_HEAD: 6e095b4b1603c90dcee0943295909b30cd1b374d
      AUTH_PARENT: 5685d5c313071014a94c816ee26b129f1f17a7fc
      AUTH_PR: '774'
      AUTHORIZATION_BLOB: 96ee8299d00bd72cdb73de4583670730ce89c73b
      DISPATCH_BRANCH: dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-ordinal-45
      EXECUTION_KEY: aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4:numerical:45
      ALLOCATION_MARKER: ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_AUTHORIZATION_ALLOCATED_REVIEWED_NOT_DISPATCHED commit=6e095b4b1603c90dcee0943295909b30cd1b374d parent=5685d5c313071014a94c816ee26b129f1f17a7fc pr=774
      CONSUMED_MARKER: ORDINAL45_AVPS_V2_POSTCONSUMPTION_RECOVERY4_DISPATCH_CONSUMED
      CANDIDATE_SEED_SHA256: ddded6b2d170ca2fac8d498bdba2887446c16995df0880d948fb2be00870b3de
      CANDIDATE_ROWS_SHA256: c439de417520b330c037e2628df02b6955f652563300aa5ef30477abf7661a98
      AUTH_SEED_LEDGER_PATH: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-seed-global-control-v1/seed_ledger.py
      AUTH_SEED_LEDGER_BLOB: 16af5c68ae7e3cfc0cfbef4c8e2022517bf2ae91
      NATIVE_SEED_HELPER_PATH: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-science-transport-v1/native_authorization_seed_transport.py
      NATIVE_SEED_HELPER_BLOB: 2df2c3fd1ffa78e16f44e6825d67b3e82e903c1e
      HISTORICAL_AUTH_BRANCH: authorization/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery1-ordinal-42
      HISTORICAL_HEAD: e627a689ada0493a8a5b9cdafc4aba0198fbabec
      HISTORICAL_SEED_LEDGER_PATH: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-seed-freshness-v1/seed_ledger.py
      HISTORICAL_SEED_LEDGER_BLOB: 491d1b6653bea0fcc5275269723a76aa1af52300
      SCIENCE_WORKFLOW: .github/workflows/avps-v2-postconsumption-recovery4-science.yml
      SCIENCE_WORKFLOW_BLOB: 2d210b3a161f6889352d600fb9222c974e728034
      RUNTIME_ADAPTER_PATH: runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py
      RUNTIME_ADAPTER_BLOB: e4b690c2969fd01ecde5b08f554e47ad50b40914
      EXECUTOR_PATH: runtime-avps-v2-recovery4-ordinal45-v1/executor.py
      EXECUTOR_BLOB: 7dc38e31c19701b1a1ceef300d75105cff179290
      AGGREGATOR_PATH: runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py
      AGGREGATOR_BLOB: 6afc8b0d21c2b5553c251dc9ca5524c795ed2646
      RUNTIME_CONTRACT_PATH: runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json
      RUNTIME_CONTRACT_BLOB: 2d5f71d80b5e573b86775c2806b80dcc1fbe02f4
      GOVERNANCE_CUTOFF_COMMENT: '5543925561'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Bind fresh direct-child non-authorizing review identity
        shell: bash
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "${{ github.event.action }}" = opened
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$EVENT_BASE" = "$EXPECTED_BASE"
          test "$EVENT_BRANCH" = "$EXPECTED_BRANCH"
          test "$EVENT_HEAD" = "$EXPECTED_REVIEW_HEAD"
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          test "$(git rev-list --count "$EXPECTED_BASE"..HEAD)" = 1
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_BASE"
          test "$(git ls-remote origin refs/heads/$EXPECTED_BRANCH | cut -f1)" = "$EXPECTED_REVIEW_HEAD"
          git diff --name-only "$EXPECTED_BASE"...HEAD > changed.txt
          test "$(wc -l < changed.txt)" = 1
          grep -Fx "$REVIEW_PATH" changed.txt
          if git diff --name-only "$EXPECTED_BASE"...HEAD | grep -E '^(experiments|runtime-|scientific-tools|src)/'; then
            echo 'scientific/runtime source changed by invocation-eligibility review' >&2
            exit 1
          fi
          python - <<'PY'
          import os
          from pathlib import Path
          text=Path(os.environ['REVIEW_PATH']).read_text()
          forbidden=['workflow_'+'dispatch:','uv'+'spec','lib'+'Radtran','MYS'+'TIC']
          hits=[token for token in forbidden if token in text]
          if hits: raise SystemExit(f'review workflow contains prohibited execution surface: {hits}')
          PY
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > pr-live.json
          python - <<'PY'
          import json,os
          p=json.load(open('pr-live.json'))
          if p.get('state')!='open' or p.get('draft') is not False or p.get('merged_at') is not None:
              raise SystemExit('review PR must remain non-Draft/open/unmerged')
          if p['head']['sha']!=os.environ['EVENT_HEAD'] or p['base']['sha']!=os.environ['EVENT_BASE']:
              raise SystemExit('review PR identity drift')
          PY

      - name: Bind exact installed canonical publisher and PR948 accepted apply lineage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p invocation-eligibility
          test "$(git rev-parse "$EXPECTED_BASE:$PUBLISHER_PATH")" = "$PUBLISHER_BLOB"
          git show "$EXPECTED_BASE:$PUBLISHER_PATH" > invocation-eligibility/publisher.yml
          test "$(sha256sum invocation-eligibility/publisher.yml | cut -d' ' -f1)" = "$PUBLISHER_SHA256"
          test "$(git rev-parse "$PUBLISHER_PARENT:$PUBLISHER_PATH")" = "$SOURCE_PUBLISHER_BLOB"
          git show "$PUBLISHER_PARENT:$PUBLISHER_PATH" > invocation-eligibility/source-publisher.yml
          test "$(sha256sum invocation-eligibility/source-publisher.yml | cut -d' ' -f1)" = "$SOURCE_PUBLISHER_SHA256"
          set -- $(git rev-list --parents -n1 "$PUBLISHER_MERGE")
          test "$#" -eq 3
          test "$2" = "$PUBLISHER_PARENT"
          test "$3" = "$PUBLISHER_HEAD"
          test "$(git diff --name-status "$PUBLISHER_PARENT" "$PUBLISHER_MERGE")" = "$(printf 'M\t%s' "$PUBLISHER_PATH")"
          for pair in \
            "$SCIENCE_WORKFLOW:$SCIENCE_WORKFLOW_BLOB" \
            "$RUNTIME_ADAPTER_PATH:$RUNTIME_ADAPTER_BLOB" \
            "$EXECUTOR_PATH:$EXECUTOR_BLOB" \
            "$AGGREGATOR_PATH:$AGGREGATOR_BLOB" \
            "$RUNTIME_CONTRACT_PATH:$RUNTIME_CONTRACT_BLOB"; do
            path="${pair%:*}"; blob="${pair##*:}"
            test "$(git rev-parse "$EXPECTED_BASE:$path")" = "$blob"
          done
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PUBLISHER_PR" > invocation-eligibility/publisher-pr.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PUBLISHER_DEDICATED_RUN" > invocation-eligibility/publisher-dedicated-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PUBLISHER_DEDICATED_RUN/jobs?per_page=100" > invocation-eligibility/publisher-dedicated-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PUBLISHER_GENERIC_RUN" > invocation-eligibility/publisher-generic-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PUBLISHER_GENERIC_RUN/jobs?per_page=100" > invocation-eligibility/publisher-generic-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PUBLISHER_ARTIFACT" > invocation-eligibility/publisher-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$PUBLISHER_CANDIDATE" > invocation-eligibility/publisher-candidate.json
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$PUBLISHER_BACKUP_ACCEPT" > invocation-eligibility/publisher-backup-accept.json
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$PUBLISHER_PRIMARY_ACCEPT" > invocation-eligibility/publisher-primary-accept.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PUBLISHER_POSTMERGE_RUN" > invocation-eligibility/publisher-postmerge-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PUBLISHER_POSTMERGE_RUN/jobs?per_page=100" > invocation-eligibility/publisher-postmerge-jobs.json
          python - <<'PY'
          import json,os
          root='invocation-eligibility/'
          pr=json.load(open(root+'publisher-pr.json'))
          if pr.get('number')!=int(os.environ['PUBLISHER_PR']) or pr.get('state')!='closed' or not pr.get('merged_at'):
              raise SystemExit('PR948 merge state drift')
          if pr.get('merge_commit_sha')!=os.environ['PUBLISHER_MERGE'] or pr['head']['sha']!=os.environ['PUBLISHER_HEAD'] or pr['base']['sha']!=os.environ['PUBLISHER_PARENT']:
              raise SystemExit('PR948 exact merge identity drift')
          checks=[
            ('publisher-dedicated-run.json','PUBLISHER_DEDICATED_RUN','PUBLISHER_HEAD','pull_request','PUBLISHER_DEDICATED_WORKFLOW'),
            ('publisher-generic-run.json','PUBLISHER_GENERIC_RUN','PUBLISHER_HEAD','pull_request',None),
            ('publisher-postmerge-run.json','PUBLISHER_POSTMERGE_RUN','PUBLISHER_MERGE','push',None)]
          for fn,idkey,headkey,event,pathkey in checks:
              r=json.load(open(root+fn))
              if r.get('id')!=int(os.environ[idkey]) or r.get('head_sha')!=os.environ[headkey] or r.get('run_attempt')!=1 or r.get('status')!='completed' or r.get('conclusion')!='success' or r.get('event')!=event:
                  raise SystemExit(f'run proof drift: {fn}')
              if pathkey and r.get('path')!=os.environ[pathkey]: raise SystemExit(f'workflow path drift: {fn}')
          for fn,key in [('publisher-dedicated-jobs.json','PUBLISHER_DEDICATED_JOB'),('publisher-generic-jobs.json','PUBLISHER_GENERIC_JOB'),('publisher-postmerge-jobs.json','PUBLISHER_POSTMERGE_JOB')]:
              x=json.load(open(root+fn)); matches=[j for j in x.get('jobs',[]) if j.get('id')==int(os.environ[key])]
              if len(matches)!=1 or matches[0].get('status')!='completed' or matches[0].get('conclusion')!='success':
                  raise SystemExit(f'exact job proof drift: {key}')
          a=json.load(open(root+'publisher-artifact.json'))
          if a.get('id')!=int(os.environ['PUBLISHER_ARTIFACT']) or a.get('name')!=os.environ['PUBLISHER_ARTIFACT_NAME'] or a.get('digest')!=os.environ['PUBLISHER_ARTIFACT_DIGEST'] or a.get('expired'):
              raise SystemExit('publisher artifact proof drift')
          c=json.load(open(root+'publisher-candidate.json')); body=str(c.get('body') or '').upper()
          required=('NON_AUTHORIZING','PR948',os.environ['PUBLISHER_HEAD'].upper(),os.environ['PUBLISHER_SHA256'].upper())
          if c.get('id')!=int(os.environ['PUBLISHER_CANDIDATE']) or c.get('user',{}).get('login')!='search-maker' or c.get('author_association')!='OWNER' or any(t not in body for t in required):
              raise SystemExit('publisher candidate notice drift')
          for fn,key,label in [('publisher-backup-accept.json','PUBLISHER_BACKUP_ACCEPT','BACKUP'),('publisher-primary-accept.json','PUBLISHER_PRIMARY_ACCEPT','PRIMARY')]:
              c=json.load(open(root+fn)); body=str(c.get('body') or '').upper()
              if c.get('id')!=int(os.environ[key]) or c.get('user',{}).get('login')!='search-maker' or c.get('author_association')!='OWNER' or 'ACCEPT' not in body or 'PR948' not in body or os.environ['PUBLISHER_HEAD'].upper() not in body or label not in body:
                  raise SystemExit(f'independent acceptance drift: {key}')
          PY

      - name: Fresh live governance one-use and complete workflow-dispatch absence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_BASE"
          git fetch origin "refs/heads/$AUTH_BRANCH:refs/remotes/origin/$AUTH_BRANCH"
          test "$(git rev-parse origin/$AUTH_BRANCH)" = "$AUTH_HEAD"
          test "$(git rev-parse "$AUTH_HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-authorization-control-v1/authorization.json")" = "$AUTHORIZATION_BLOB"
          set +e
          git ls-remote --exit-code --heads origin "$DISPATCH_BRANCH" >/dev/null 2>&1
          dispatch_ref_rc=$?
          set -e
          if [ "$dispatch_ref_rc" -eq 0 ]; then
            echo 'ordinal45 dispatch ref already exists' >&2
            exit 1
          elif [ "$dispatch_ref_rc" -ne 2 ]; then
            echo "dispatch ref absence read failed closed: rc=$dispatch_ref_rc" >&2
            exit 1
          fi
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > invocation-eligibility/issue60-pages.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/avps-v2-recovery4-ordinal45-final-dispatch-publisher-v3.yml/runs?event=workflow_dispatch&per_page=100" > invocation-eligibility/publisher-dispatch-pages.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/avps-v2-postconsumption-recovery4-science.yml/runs?event=workflow_dispatch&per_page=100" > invocation-eligibility/science-dispatch-pages.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs?event=workflow_dispatch&per_page=100" > invocation-eligibility/global-dispatch-pages.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/$AUTH_PR" > invocation-eligibility/authorization-pr.json
          python - <<'PY'
          import json,os,re
          root='invocation-eligibility/'
          pages=json.load(open(root+'issue60-pages.json'))
          if not isinstance(pages,list) or not pages or any(not isinstance(p,list) for p in pages): raise SystemExit('issue60 pagination/API drift')
          comments=[c for p in pages for c in p]
          ids=[c.get('id') for c in comments]
          if any(not isinstance(x,int) for x in ids) or len(ids)!=len(set(ids)): raise SystemExit('issue60 pagination duplicate/invalid ids')
          bodies=[str(c.get('body') or '').strip() for c in comments]
          if sum(b==os.environ['ALLOCATION_MARKER'] for b in bodies)!=1: raise SystemExit('allocation marker cardinality drift')
          if sum(b.startswith(os.environ['CONSUMED_MARKER']) for b in bodies)!=0: raise SystemExit('ordinal45 already consumed')
          cutoff=int(os.environ['GOVERNANCE_CUTOFF_COMMENT'])
          if sum(int(c.get('id') or 0)==cutoff for c in comments)!=1: raise SystemExit('governance cutoff comment missing/duplicated')
          opens={}; aliases=('begin','beginComment','begin_comment')
          for c in comments:
              cid=int(c.get('id') or 0); first=(str(c.get('body') or '').strip().splitlines() or [''])[0].strip()
              if first.startswith('WRITE_QUIET_BEGIN'): opens[cid]=first
              elif first.startswith('WRITE_QUIET_END'):
                  vals=[]
                  for key in aliases: vals += re.findall(r'(?<![A-Za-z0-9_])'+re.escape(key)+r'=(\d+)(?![A-Za-z0-9_])',first)
                  if vals:
                      if len(set(vals))!=1: raise SystemExit(f'conflicting WRITE_QUIET_END aliases at {cid}: {vals}')
                      opens.pop(int(vals[0]),None)
          if opens: raise SystemExit(f'unmatched WRITE_QUIET_BEGIN: {sorted(opens)}')
          fatal=('CONFIRMED_DEFECT','COORDINATOR::CONFIRMED_DEFECT','BLOCKER','NOT_ADMISSIBLE','DO NOT USE','QUARANTINE_DOWNSTREAM=TRUE','HALT')
          for c in comments:
              cid=int(c.get('id') or 0)
              if cid<=cutoff: continue
              up=str(c.get('body') or '').upper(); relevant=('AVPS' in up or 'ORDINAL45' in up or 'AEROSOL_VERTICAL_PROFILE' in up)
              if relevant and any(tok in up for tok in fatal): raise SystemExit(f'newer potentially controlling AVPS blocker/refusal: {cid}')
          def complete_runs(fn):
              ps=json.load(open(root+fn))
              if not isinstance(ps,list) or not ps or any(not isinstance(p,dict) for p in ps): raise SystemExit(f'{fn} pagination/API drift')
              totals={p.get('total_count') for p in ps}
              if len(totals)!=1 or any(not isinstance(x,int) or x<0 for x in totals): raise SystemExit(f'{fn} total_count drift')
              runs=[]
              for p in ps:
                  if not isinstance(p.get('workflow_runs'),list): raise SystemExit(f'{fn} workflow_runs drift')
                  runs.extend(p['workflow_runs'])
              if len(runs)!=next(iter(totals)): raise SystemExit(f'{fn} incomplete pagination: total={next(iter(totals))} enumerated={len(runs)}')
              rids=[r.get('id') for r in runs]
              if any(not isinstance(x,int) for x in rids) or len(rids)!=len(set(rids)): raise SystemExit(f'{fn} duplicate/invalid run ids')
              return runs
          if complete_runs('publisher-dispatch-pages.json'): raise SystemExit('publisher workflow_dispatch already exists')
          if complete_runs('science-dispatch-pages.json'): raise SystemExit('Recovery4 science workflow_dispatch already exists')
          global_runs=complete_runs('global-dispatch-pages.json')
          protected={os.environ['PUBLISHER_PATH'],os.environ['SCIENCE_WORKFLOW']}
          hits=[r.get('id') for r in global_runs if r.get('path') in protected]
          if hits: raise SystemExit(f'protected workflow_dispatch found in repository-global inventory: {hits}')
          pr=json.load(open(root+'authorization-pr.json'))
          if pr.get('number')!=int(os.environ['AUTH_PR']) or pr.get('state')!='open' or pr.get('draft') is not True or pr.get('merged_at') is not None or pr['head']['sha']!=os.environ['AUTH_HEAD']:
              raise SystemExit('authorization PR state drift')
          PY

      - name: Build frozen candidate ledger and tracked-tree proof
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z > invocation-eligibility/tracked-files.nul
          test "$(git rev-parse HEAD:$NATIVE_SEED_HELPER_PATH)" = "$NATIVE_SEED_HELPER_BLOB"
          git fetch origin "refs/heads/$HISTORICAL_AUTH_BRANCH:refs/remotes/origin/$HISTORICAL_AUTH_BRANCH"
          test "$(git rev-parse origin/$HISTORICAL_AUTH_BRANCH)" = "$HISTORICAL_HEAD"
          python "$NATIVE_SEED_HELPER_PATH" \
            --repo-root . \
            --authorization-head "$AUTH_HEAD" \
            --authorization-parent "$AUTH_PARENT" \
            --authorization-ledger-path "$AUTH_SEED_LEDGER_PATH" \
            --authorization-ledger-blob "$AUTH_SEED_LEDGER_BLOB" \
            --candidate-seed-sha256 "$CANDIDATE_SEED_SHA256" \
            --candidate-rows-sha256 "$CANDIDATE_ROWS_SHA256" \
            --historical-head "$HISTORICAL_HEAD" \
            --historical-ledger-path "$HISTORICAL_SEED_LEDGER_PATH" \
            --historical-ledger-blob "$HISTORICAL_SEED_LEDGER_BLOB" \
            --work-root invocation-eligibility/native-seed-transport \
            --output-ledger invocation-eligibility/candidate-seed-ledger.json \
            --output-context invocation-eligibility/native-seed-context.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.load(open('invocation-eligibility/candidate-seed-ledger.json'))
          seeds=[int(v) for v in x.get('candidateSeeds',[])]; rows=x.get('candidateRows',[])
          if x.get('candidateSeedCanonicalSha256')!=os.environ['CANDIDATE_SEED_SHA256'] or x.get('candidateRowsCanonicalSha256')!=os.environ['CANDIDATE_ROWS_SHA256'] or len(seeds)!=72 or len(set(seeds))!=72 or len(rows)!=72:
              raise SystemExit('candidate ledger drift')
          Path('invocation-eligibility/empty-self-ledger-policy.json').write_text(json.dumps({'schemaVersion':2,'requiredTrackedSelfLedgerPaths':[],'futureEvidenceSelfLedgerPaths':[]},indent=2,sort_keys=True)+'\n')
          PY
          python review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/tracked_tree_seed_scan.py \
            --repo-root . --file-list invocation-eligibility/tracked-files.nul \
            --candidate-seed-ledger invocation-eligibility/candidate-seed-ledger.json \
