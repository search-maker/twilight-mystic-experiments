name: Review AVPS Recovery4 ordinal45 durable-END source correction v2

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery4-ordinal45-source-correction-v2-review.yml

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

jobs:
  zero-runtime-source-correction-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_BRANCH: review/avps-v2-recovery4-ordinal45-source-correction-v2
      EXPECTED_BASE: 389992d893e7920d4e4989b119be4e15114f2ec8
      SELF_PATH: .github/workflows/avps-v2-recovery4-ordinal45-source-correction-v2-review.yml
      SOURCE_PR: '777'
      SOURCE_HEAD: b5a68159aa09bb3f91cb050a7e1bb266f866c9f4
      SOURCE_RUN: '33377879606'
      SOURCE_ARTIFACT: '9752564112'
      SOURCE_ARTIFACT_NAME: avps-v2-recovery4-ordinal45-generated-execution-package-review
      SOURCE_DIGEST: sha256:e5ed2a26e917f3ee095c749d107c0ad16ac31c3ac9513da6717a5e66965557b5
      SOURCE_ACCEPTANCE_REVIEW: '5065401797'
      OLD_WORKFLOW_SHA256: 405959b98955198d41f9130f5170ca3e260015bd1c2265cd73e300030a77e4a8
      OLD_WORKFLOW_BLOB: df0763b61ce89063de6992bb984dc854024a1aad
      NEW_WORKFLOW_SHA256: efada7eddec0293e4e816223e8d30ba467b5c46b4cdbb058e32fd66fd2643731
      NEW_WORKFLOW_BLOB: dcaa9c9a62475e52e517912246c58338d3147e97
      ADAPTER_SHA256: e0c95d9ca15a78868bef13cb8375460de156075c07647298a2ad355c32d6d3ed
      ADAPTER_BLOB: e4b690c2969fd01ecde5b08f554e47ad50b40914
      EXECUTOR_SHA256: 37f1f52fa2381c3bc40580ffc16f45efd8503d9242c22d2d72eb28a27c3882f5
      EXECUTOR_BLOB: 7dc38e31c19701b1a1ceef300d75105cff179290
      AGGREGATOR_SHA256: 3287fb59344c223eb871befb05bef141fe79c74fec45f096c29a4c05e29845c2
      AGGREGATOR_BLOB: 6afc8b0d21c2b5553c251dc9ca5524c795ed2646
      CONTRACT_SHA256: 3a3e09f1a9dda5435e455fbc9a508a924c080f7f265cdd7c29de912449bacc93
      CONTRACT_BLOB: 2d5f71d80b5e573b86775c2806b80dcc1fbe02f4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Bind exact fresh one-file zero-runtime review identity
        shell: bash
        env:
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$EVENT_BASE_REF" = main
          test "$EVENT_BRANCH" = "$EXPECTED_BRANCH"
          test "$EVENT_BASE" = "$EXPECTED_BASE"
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          mapfile -t PARENTS < <(git cat-file -p HEAD | sed -n 's/^parent //p')
          test "${#PARENTS[@]}" = 1
          test "${PARENTS[0]}" = "$EXPECTED_BASE"
          git diff --name-only "$EXPECTED_BASE"...HEAD | sort > changed.txt
          printf '%s\n' "$SELF_PATH" > expected.txt
          diff -u expected.txt changed.txt

      - name: Fetch and bind immutable accepted corrected-source artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source
          gh api "repos/$GITHUB_REPOSITORY/pulls/$SOURCE_PR" > source-pr.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > source-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT" > source-artifact.json
          gh run download "$SOURCE_RUN" -n "$SOURCE_ARTIFACT_NAME" -D source
          python - <<'PY'
          import json, os
          p=json.load(open('source-pr.json'))
          if p['number']!=int(os.environ['SOURCE_PR']) or p['head']['sha']!=os.environ['SOURCE_HEAD']:
              raise SystemExit('source PR identity drift')
          r=json.load(open('source-run.json'))
          if r['id']!=int(os.environ['SOURCE_RUN']) or r['head_sha']!=os.environ['SOURCE_HEAD'] or r['run_attempt']!=1 or r['status']!='completed' or r['conclusion']!='success':
              raise SystemExit('source review run drift')
          a=json.load(open('source-artifact.json'))
          if a['id']!=int(os.environ['SOURCE_ARTIFACT']) or a.get('digest')!=os.environ['SOURCE_DIGEST'] or a.get('expired'):
              raise SystemExit('source artifact metadata drift')
          if a.get('workflow_run',{}).get('id')!=int(os.environ['SOURCE_RUN']) or a.get('workflow_run',{}).get('head_sha')!=os.environ['SOURCE_HEAD']:
              raise SystemExit('source artifact/run binding drift')
          PY
          test -s source/generated-package/avps-v2-postconsumption-recovery4-science.yml
          test -s source/generated-package/runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py
          test -s source/generated-package/runtime-avps-v2-recovery4-ordinal45-v1/executor.py
          test -s source/generated-package/runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py
          test -s source/generated-package/runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json

      - name: Verify exact old five-byte source identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, os, subprocess
          from pathlib import Path
          files={
            'source/generated-package/avps-v2-postconsumption-recovery4-science.yml':('OLD_WORKFLOW_SHA256','OLD_WORKFLOW_BLOB'),
            'source/generated-package/runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py':('ADAPTER_SHA256','ADAPTER_BLOB'),
            'source/generated-package/runtime-avps-v2-recovery4-ordinal45-v1/executor.py':('EXECUTOR_SHA256','EXECUTOR_BLOB'),
            'source/generated-package/runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py':('AGGREGATOR_SHA256','AGGREGATOR_BLOB'),
            'source/generated-package/runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json':('CONTRACT_SHA256','CONTRACT_BLOB'),
          }
          for path,(sha_key,blob_key) in files.items():
              b=Path(path).read_bytes()
              sha=hashlib.sha256(b).hexdigest()
              blob=subprocess.check_output(['git','hash-object',path],text=True).strip()
              if sha!=os.environ[sha_key] or blob!=os.environ[blob_key]:
                  raise SystemExit(f'old source byte drift: {path} sha={sha} blob={blob}')
          PY

      - name: Apply only durable WRITE_QUIET END alias compatibility correction
        shell: bash
        run: |
          set -euo pipefail
          rm -rf corrected-publication
          mkdir -p corrected-publication/.github/workflows corrected-publication/runtime-avps-v2-recovery4-ordinal45-v1
          cp source/generated-package/runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py corrected-publication/runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py
          cp source/generated-package/runtime-avps-v2-recovery4-ordinal45-v1/executor.py corrected-publication/runtime-avps-v2-recovery4-ordinal45-v1/executor.py
          cp source/generated-package/runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py corrected-publication/runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py
          cp source/generated-package/runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json corrected-publication/runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json
          python - <<'PY'
          from pathlib import Path
          src=Path('source/generated-package/avps-v2-postconsumption-recovery4-science.yml')
          dst=Path('corrected-publication/.github/workflows/avps-v2-postconsumption-recovery4-science.yml')
          text=src.read_text()
          old="              if first.startswith('WRITE_QUIET_END') and f.get('begin','').isdigit(): closed.add(int(f['begin']))\n"
          new="""              if first.startswith('WRITE_QUIET_END'):\n                  end_ids=[]\n                  for key in ('begin','beginComment','begin_comment'):\n                      if key in f:\n                          if not f[key].isdigit(): raise SystemExit(f'non-numeric WRITE_QUIET_END {key}: {f[key]!r}')\n                          end_ids.append(int(f[key]))\n                  distinct=set(end_ids)\n                  if len(distinct)>1: raise SystemExit(f'conflicting WRITE_QUIET_END begin ids: {sorted(distinct)}')\n                  if distinct: closed.add(next(iter(distinct)))\n"""
          if text.count(old)!=1:
              raise SystemExit(f'legacy pre-scan parser occurrence drift: {text.count(old)}')
          corrected=text.replace(old,new,1)
          if corrected.count(old)!=0:
              raise SystemExit('legacy pre-scan parser survived correction')
          dst.write_text(corrected)
          if corrected.count(new)!=1 or corrected.replace(new,old,1)!=text:
              raise SystemExit('correction changed bytes outside exact parser replacement')
          PY
          cmp source/generated-package/runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py corrected-publication/runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py
          cmp source/generated-package/runtime-avps-v2-recovery4-ordinal45-v1/executor.py corrected-publication/runtime-avps-v2-recovery4-ordinal45-v1/executor.py
          cmp source/generated-package/runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py corrected-publication/runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py
          cmp source/generated-package/runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json corrected-publication/runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json

      - name: Verify durable END semantics and exact corrected byte identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          wf=Path('corrected-publication/.github/workflows/avps-v2-postconsumption-recovery4-science.yml')
          b=wf.read_bytes(); text=b.decode()
          sha=hashlib.sha256(b).hexdigest(); blob=subprocess.check_output(['git','hash-object',str(wf)],text=True).strip()
          if sha!=os.environ['NEW_WORKFLOW_SHA256'] or blob!=os.environ['NEW_WORKFLOW_BLOB']:
              raise SystemExit(f'corrected workflow identity drift sha={sha} blob={blob}')
          for token in ("('begin','beginComment','begin_comment')", 'conflicting WRITE_QUIET_END begin ids', 'non-numeric WRITE_QUIET_END'):
              if token not in text: raise SystemExit(f'missing durable-END token: {token}')
          def fields(first):
              out={}
              for token in first.replace('|',' ').split():
                  if '=' in token:
                      k,v=token.split('=',1); out[k]=v
              return out
          def end_begin_id(body):
              first=body.strip().splitlines()[0] if body.strip() else ''
              if not first.startswith('WRITE_QUIET_END'): return None
              f=fields(first); vals=[]
              for key in ('begin','beginComment','begin_comment'):
                  if key in f:
                      if not f[key].isdigit(): raise ValueError('non-numeric')
                      vals.append(int(f[key]))
              distinct=set(vals)
              if len(distinct)>1: raise ValueError('conflicting')
              return next(iter(distinct)) if distinct else None
          assert end_begin_id('WRITE_QUIET_END begin=101')==101
          assert end_begin_id('WRITE_QUIET_END beginComment=102')==102
          assert end_begin_id('WRITE_QUIET_END begin_comment=103')==103
          assert end_begin_id('WRITE_QUIET_END begin=104 beginComment=104')==104
          assert end_begin_id('WRITE_QUIET_END token=x\nhistorical begin=999') is None
          try: end_begin_id('WRITE_QUIET_END begin=105 beginComment=106')
          except ValueError: pass
          else: raise SystemExit('conflicting durable END aliases were not refused')
          try: end_begin_id('WRITE_QUIET_END beginComment=oops')
          except ValueError: pass
          else: raise SystemExit('non-numeric durable END alias was not refused')
          expected={
            'runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py':('ADAPTER_SHA256','ADAPTER_BLOB'),
            'runtime-avps-v2-recovery4-ordinal45-v1/executor.py':('EXECUTOR_SHA256','EXECUTOR_BLOB'),
            'runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py':('AGGREGATOR_SHA256','AGGREGATOR_BLOB'),
            'runtime-avps-v2-recovery4-ordinal45-v1/runtime_contract.json':('CONTRACT_SHA256','CONTRACT_BLOB'),
          }
          outputs={'.github/workflows/avps-v2-postconsumption-recovery4-science.yml':{'sha256':sha,'gitBlobSha1':blob,'size':len(b)}}
          for rel,(sha_key,blob_key) in expected.items():
              p=Path('corrected-publication')/rel; data=p.read_bytes()
              got_sha=hashlib.sha256(data).hexdigest(); got_blob=subprocess.check_output(['git','hash-object',str(p)],text=True).strip()
              if got_sha!=os.environ[sha_key] or got_blob!=os.environ[blob_key]: raise SystemExit(f'unchanged runtime drift: {rel}')
              outputs[rel]={'sha256':got_sha,'gitBlobSha1':got_blob,'size':len(data)}
          receipt={
            'schemaVersion':1,
            'status':'PASS_AVPS_V2_RECOVERY4_ORDINAL45_DURABLE_END_SOURCE_CORRECTION_ZERO_RUNTIME',
            'sourcePr':777,'sourceHead':os.environ['SOURCE_HEAD'],'sourceRun':int(os.environ['SOURCE_RUN']),
            'sourceArtifact':int(os.environ['SOURCE_ARTIFACT']),'sourceArtifactDigest':os.environ['SOURCE_DIGEST'],
            'sourceAcceptanceReview':int(os.environ['SOURCE_ACCEPTANCE_REVIEW']),
            'defectAuditReview':5069721234,
            'oldScienceWorkflowSha256':os.environ['OLD_WORKFLOW_SHA256'],'oldScienceWorkflowBlob':os.environ['OLD_WORKFLOW_BLOB'],
            'correctedScienceWorkflowSha256':sha,'correctedScienceWorkflowBlob':blob,
            'correction':'first-line WRITE_QUIET_END binding parser accepts begin, beginComment, begin_comment; conflicting/non-numeric aliases fail closed',
            'outputs':outputs,
            'scientificOrdinal':45,'caseCount':360,'commonRandomNumberGroupCount':72,'statesPerGroup':5,'photonHistoriesPerCase':20000000,
            'candidateSeedCanonicalSha256':'ddded6b2d170ca2fac8d498bdba2887446c16995df0880d948fb2be00870b3de',
            'candidateRowsCanonicalSha256':'c439de417520b330c037e2628df02b6955f652563300aa5ef30477abf7661a98',
            'frozenScienceChanged':False,'dispatchCreated':False,'seedConsumption':False,'solverExecution':False,
            'resultsOpened':False,'levelBOpeningAuthorized':False,'holdoutOpened':False,'productionAuthorized':False,
            'taylorOrJerusalemUsed':False,'newMappingAuthorized':False,'githubRerun':False,
          }
          Path('source-correction-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          python -m py_compile \
            corrected-publication/runtime-avps-v2-recovery4-ordinal45-v1/runtime_adapter.py \
            corrected-publication/runtime-avps-v2-recovery4-ordinal45-v1/executor.py \
            corrected-publication/runtime-avps-v2-recovery4-ordinal45-v1/aggregator.py
          test -z "$(git status --porcelain --untracked-files=no)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: avps-v2-recovery4-ordinal45-durable-end-source-correction-v2
          path: |
            changed.txt
            source-correction-receipt.json
            corrected-publication/
          if-no-files-found: error
          compression-level: 0
