name: Review AVPS v2 recovery4 live preauthorization v1

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery4-preauthorization-v1-review.yml

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: avps-v2-recovery4-preauthorization-v1-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  protected-zero-runtime-preauthorization:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      EXPECTED_BRANCH: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-preauthorization-v1
      FENCE_TOKEN: AVPS_V2_RECOVERY4_PREAUTH_GLOBAL_SCAN_V1
      CONTROL_MAIN: 79f66fcaac3c7dab9e882670ac50ea2601df892c
      CONTROL_RUN: '33352358740'
      CONTROL_ARTIFACT: '9744246112'
      CONTROL_ARTIFACT_NAME: vertical-profile-v2-postconsumption-recovery4-seed-global-control-proof
      CONTROL_DIGEST: sha256:581ada9f8056d1ee73bb9bc2d81e1abdb7a9bac391e7ad889490e80af5038e27
      CANDIDATE_SEED_SHA256: ddded6b2d170ca2fac8d498bdba2887446c16995df0880d948fb2be00870b3de
      CANDIDATE_ROWS_SHA256: c439de417520b330c037e2628df02b6955f652563300aa5ef30477abf7661a98
      GLOBAL_SCANNER_BLOB: 4c6d704fa24228284780bcb1dd7c52537b4c5b0d
      R8_FRESHNESS_BLOB: 732f803b5261e7986582dd7e0d69a66f70432b1e
      R8_ORDINAL_BLOB: 7ca8efd17ae9e7ec2baa32fe935e5173ca6d173f

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Bind exact one-file review identity and immutable Recovery4 control proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_MAIN: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "${{ github.event.action }}" = opened
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$PR_BRANCH" = "$EXPECTED_BRANCH"
          test "${{ github.event.pull_request.base.ref }}" = main
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          test "$(git rev-parse HEAD^)" = "$BASE_MAIN"
          test "$(git rev-list --count "$BASE_MAIN"..HEAD)" = 1
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_MAIN"
          test "$BASE_MAIN" = "$CONTROL_MAIN"
          test -z "$(command -v uvspec || true)"
          test "$(git rev-parse HEAD:experiments/aerosol-family-challenge-v2/repository_global_seed_scan.py)" = "$GLOBAL_SCANNER_BLOB"
          test "$(git rev-parse HEAD:experiments/aerosol-family-challenge-v2-r8/execution-candidate/freshness.py)" = "$R8_FRESHNESS_BLOB"
          test "$(git rev-parse HEAD:experiments/aerosol-family-challenge-v2-r8/execution-candidate/preauthorization_ordinal.py)" = "$R8_ORDINAL_BLOB"
          test "$(git diff --name-only "$BASE_MAIN"...HEAD)" = .github/workflows/avps-v2-recovery4-preauthorization-v1-review.yml

          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > current-pr.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CONTROL_RUN" > control-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CONTROL_ARTIFACT" > control-artifact.json
          python - <<'PY'
          import json,os
          pr=json.load(open('current-pr.json'))
          if pr.get('state')!='open' or pr.get('draft') is not True or pr.get('merged_at') is not None: raise SystemExit('preauthorization PR must remain Draft/open/unmerged')
          if pr['head']['sha']!=os.environ['PR_HEAD'] or pr['base']['sha']!=os.environ['BASE_MAIN']: raise SystemExit('preauthorization PR identity drift')
          r=json.load(open('control-run.json'))
          if r.get('id')!=int(os.environ['CONTROL_RUN']) or r.get('head_sha')!=os.environ['CONTROL_MAIN'] or r.get('run_attempt')!=1 or r.get('status')!='completed' or r.get('conclusion')!='success': raise SystemExit('Recovery4 control run drift')
          a=json.load(open('control-artifact.json'))
          if a.get('id')!=int(os.environ['CONTROL_ARTIFACT']) or a.get('name')!=os.environ['CONTROL_ARTIFACT_NAME'] or a.get('digest')!=os.environ['CONTROL_DIGEST'] or a.get('expired') is not False: raise SystemExit('Recovery4 control artifact drift')
          PY

      - name: Require exact active WRITE_QUIET fence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BASE_MAIN: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > issue60-pages.json
          python - <<'PY'
          import json,os
          rows=[r for page in json.load(open('issue60-pages.json')) for r in page]
          wanted=f"WRITE_QUIET_BEGIN | {os.environ['FENCE_TOKEN']} | branch={os.environ['EXPECTED_BRANCH']} | head={os.environ['PR_HEAD']} | baseHead={os.environ['BASE_MAIN']}"
          matches=[r for r in rows if str(r.get('body') or '').startswith(wanted)]
          if len(matches)!=1: raise SystemExit(f'exact Recovery4 preauthorization WRITE_QUIET_BEGIN required once; found {len(matches)}')
          begin_id=int(matches[0]['id'])
          if any(str(r.get('body') or '').startswith(f"WRITE_QUIET_END | {os.environ['FENCE_TOKEN']}") for r in rows if int(r.get('id') or 0)>begin_id): raise SystemExit('preauthorization fence already ended before protected scan')
          PY

      - name: Require repository-wide workflow quiescence and cooldown
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for n in $(seq 1 60); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=in_progress&per_page=100" > active.json
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=queued&per_page=100" > queued.json
            if python - <<'PY'
          import json,os
          me=int(os.environ['GITHUB_RUN_ID'])
          active=[r for r in json.load(open('active.json')).get('workflow_runs',[]) if int(r.get('id') or 0)!=me]
          queued=[r for r in json.load(open('queued.json')).get('workflow_runs',[]) if int(r.get('id') or 0)!=me]
          raise SystemExit(0 if not active and not queued else 1)
          PY
            then sleep 5; break; fi
            test "$n" -lt 60 || { echo 'repository workflows did not quiesce' >&2; exit 1; }
            sleep 10
          done

      - name: Download and bind exact result-closed candidate ledger
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf control-proof preauthorization-evidence
          mkdir -p control-proof preauthorization-evidence
          for i in 1 2 3; do
            if gh run download "$CONTROL_RUN" -n "$CONTROL_ARTIFACT_NAME" -D control-proof; then break; fi
            test "$i" -lt 3 || exit 1
            sleep $((i*5))
          done
          python - <<'PY'
           import hashlib,json,os
            from pathlib import Path
            ledger=json.load(open('control-proof/candidate-seed-ledger.json'))
            proof=json.load(open('control-proof/recovery4-seed-global-proof.json'))
            dyn=json.load(open('control-proof/dynamic-global-ordinal.json'))
            if proof.get('status')!='PASS_RECOVERY4_CANDIDATE_SEEDS_GLOBALLY_FRESH_DYNAMIC_ORDINAL_DERIVED_NOT_ALLOCATED': raise SystemExit('control proof status drift')
            if proof.get('repositoryGlobalCollisionCount')!=0 or proof.get('repositoryGlobalDoubleEnumerationStable') is not True: raise SystemExit('control global freshness drift')
            if proof.get('candidateSeedCanonicalSha256')!=os.environ['CANDIDATE_SEED_SHA256'] or proof.get('candidateRowsCanonicalSha256')!=os.environ['CANDIDATE_ROWS_SHA256']: raise SystemExit('control candidate hash drift')
            for k in ('authorizationCreated','dispatchCreated','scientificOrdinalAllocated','scientificRuntime','solverExecution','resultsOpened','levelBOpeningAuthorized','protectedHoldoutOpeningAuthorized','productionAuthorized','taylorOrJerusalemUsed','newMappingAuthorized'):
                if proof.get(k) is not False: raise SystemExit(f'control closed boundary drift: {k}')
            if dyn.get('status')!='PASS_RECOVERY4_DYNAMIC_GLOBAL_ORDINAL_NOT_ALLOCATED' or dyn.get('scientificOrdinalAllocated') is not False: raise SystemExit('dynamic ordinal proof drift')
            seeds=ledger.get('candidateSeeds'); rows=ledger.get('candidateRows')
            canon=lambda x: hashlib.sha256(json.dumps(x,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
            if not isinstance(seeds,list) or len(seeds)!=72 or len(set(int(x) for x in seeds))!=72: raise SystemExit('candidate seed cardinality drift')
            if not isinstance(rows,list) or len(rows)!=72: raise SystemExit('candidate row cardinality drift')
            if canon(seeds)!=os.environ['CANDIDATE_SEED_SHA256'] or canon(rows)!=os.environ['CANDIDATE_ROWS_SHA256']: raise SystemExit('candidate ledger canonical drift')
            Path('preauthorization-evidence/control-dynamic-ordinal.json').write_text(json.dumps(dyn,indent=2,sort_keys=True)+'\n')
            Path('preauthorization-evidence/candidate-seed-ledger.json').write_text(json.dumps(ledger,indent=2,sort_keys=True)+'\n')
            PY

      - name: Tracked-tree candidate seed literal scan
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          seeds={int(x) for x in json.load(open('preauthorization-evidence/candidate-seed-ledger.json'))['candidateSeeds']}
          pat=re.compile(rb'(?<![0-9_])[0-9_]{7,20}(?![0-9_])')
          collisions=[]
          for raw in subprocess.check_output(['git','ls-files','-z']).split(b'\0'):
            if not raw: continue
            p=Path(raw.decode())
            try: data=p.read_bytes()
            except OSError: continue
            hits={int(t.replace(b'_',bt'')) for t in pat.findall(data) if t.replace(b_',bt'').isdigit() and int(t.replace(b'_',bt'')) in seeds}
            if hits: collisions.append({'path':str(p),'seeds':sorted(hits)})
          Path('preauthorization-evidence/tracked-seed-scan.json').write_text(json.dumps({'schemaVersion':1,'candidateSeedCount':72,'collisionCount':len(collisions),'collisions':collisions},indent=2,sort_keys=True)+'\n')
            if collisions: raise SystemExit(f'tracked-tree candidate seed collision: {collisions[:5]}')
          PY

      - name: Protected two-pass repository-global seed and ordinal preauthorization
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BASE_MAIN: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,importlib.util,json,os,re,sys
          from pathlib import Path
          root=Path('.')
          def load(name,path):
              s=importlib.util.spec_from_file_location(name,path); m=importlib.util.module_from_spec(s); sys.modules[name]=m; s.loader.exec_module(m); return m
          scanner=load('avps_r4_preauth_scanner',root/'experiments/aerosol-family-challenge-v2/repository_global_seed_scan.py')
          freshness=load('avps_r4_preauth_freshness',root/'experiments/aerosol-family-challenge-v2-r8/execution-candidate/freshness.py'); sys.modules['freshness']=freshness
          ordinal=load('avps_r4_preauth_ordinal',root/'experiments/aerosol-family-challenge-v2-r8/execution-candidate/preauthorization_ordinal.py')
          ledger=json.load(open('preauthorization-evidence/candidate-seed-ledger.json'))
          control=json.load(open('preauthorization-evidence/control-dynamic-ordinal.json'))
          seeds={int(x) for x in ledger['test'] if False}
          seeds={int(x) for x in ledger['candidateSeeds']}
          context,stable_sha,fence,post_counts=scanner.collect_stable(os.environ['GITHUB_REPOSITORY'],60,os.environ['GITHUB_TOKEN'],int(os.environ['GITHUB_RUN_ID']),seeds,'authorization-recheck')
          seed_report=scanner.evaluate_context(context,seeds,int(os.environ['GITHUB_RUN_ID']),stable_double_enumeration_passed=True,stable_context_sha256_value=stable_sha,audit_mode='authorization-recheck',expected_branch_name=os.environ['EXPECTED_BRANCH'],expected_repo_head=os.environ['PR_HEAD'],snapshot_fence=fence,post_fence_arrival_counts=post_counts)
          if seed_report.get('repositoryGlobalCollisionCount')!=0 or seed_report.get('repositoryGlobalDoubleEnumerationStable') is not True or seed_report.get('auditedBranchHeadMatchesRepositoryHead') is not True or seed_report.get('repositoryGlobalPostFenceCandidateSeedCollisionCount')!=0: raise SystemExit('repository-global Recovery4 seed preauthorization failed')
          obs=ordinal.authoritative_global_ordinal_observations(context,current_run_id=int(os.environ['GITHUB_RUN_ID']))
          consumed=sorted({int(r['ordinal']) for r in obs if r.get('reason')=='exact-consumed-marker'})
          for required in (41,42,43,44):
              if required not in consumed: raise SystemExit(f'consumed ordinal {required} not authoritatively observed')
          occupied=sorted({int(r['ordinal']) for r in obs})
          if not occupied or max(occupied)<44: raise SystemExit('global ordinal surface regressed')
          next_ordinal=max(occupied)+1
          if next_ordinal!=int(control['nextAvailableScientificOrdinal']) or max(occupied)!=int(control['latestPriorConsumedOrDispatchedScientificOrdinal']): raise SystemExit('global successor ordinal changed since frozen control proof')
          stage='aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4'
          auth=f'authorization/{stage}-ordinal-{next_ordinal}'; dispatch=f'dispatch/{stage}-ordinal-{next_ordinal}'
          branches={str(r.get('name') or '') for r in context.get('branches',[])}
          if auth in branches or dispatch in branches: raise SystemExit('Recovery4 successor authorization/dispatch branch already exists')
          prefix=f'ORDINAL{next_ordinal}_'
          if any(str(r.get('body') or '').strip().upper().startswith(prefix) for r in context.get('issue60Comments',[])): raise SystemExit('Issue #60 already contains successor-ordinal marker')
          canon=lambda v: hashlib.sha256(json.dumps(v,sort_keys=True,separators=(',',':'),ensure_ascii=False,allow_nan=False).encode()).hexdigest()
          report={'schemaVersion':1,'stageId':stage+'-preauthorization-v1','status':'PASS_POSTCONSUMPTION_RECOVERY4_PREAUTHORIZATION_SURFACE_CLEAN_NOT_ALLOCATED','auditedHead':os.environ['PR_HEAD'],'baseMain':os.environ['BASE_MAIN'],'consumedScientificOrdinalsRequired':[41,42,43,44],'consumedOrdinalsObserved':consumed,'occupiedScientificOrdinalsObserved':occupied,'occupiedMaxScientificOrdinal':max(occupied),"nextAvailableScientificOrdinal":next_ordinal,'authorizationBranch':auth,'dispatchBranch':dispatch,'ordinalObservationCount':len(obs),'ordinalObservationsCanonicalSha256':canon(obs),'candidateSeedCount':72,'candidateSeedCanonicalSha256':os.environ['CANDIDATE_SEED_SHA256'],'candidateRowsCanonicalSha256':os.environ['CANDIDATE_ROWS_SHA256'],'authorizationTimeSeedRecheck':seed_report,'scientificOrdinalAllocated':False,'authorizationCreated':False,'dispatchCreated':False,'candidateSeedsAppliedToCases':False,'scientificExecutionAuthorized':False,'solverExecutionAuthorized':False,'resultOpeningAuthorized':False,'scientificRuntimeSetupPerformed':False,'taylorOrJerusalemUsed':False,'levelBAuthorized':False,'protectedHoldoutOpened':False,'productionAuthorized':False,'newMappingAuthorized':False,'githubRerunAllowed':False,'separateAuthorizationReviewRequired':True,'nextOrdinalHardCoded':False}
          report['contentSha256']=canon(report)
          Path('preauthorization-evidence/repository-global-seed-scan.json').write_text(json.dumps(seed_report,indent=2,sort_keys=True)+'\n')
          Path('preauthorization-evidence/global-ordinal-observations.json').write_text(json.dumps(obs,indent=2,sort_keys=True)+'\n')
          Path('preauthorization-evidence/preauthorization.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          PY

      - name: Final branch and global ordinal verification
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util,json,os,sys
          from pathlib import Path
          def load(name,path):
              s=importlib.util.spec_from_file_location(name,path); m=importlib.util.module_from_spec(s); sys.modules[name]=m; s.loader.exec_module(m); return m
          scanner=load('avps_r4_preauth_scanner_final',Path('experiments/aerosol-family-challenge-v2/repository_global_seed_scan.py'))
          freshness=load('avps_r4_preauth_freshness_final',Path('experiments/aerosol-family-challenge-v2-r8/execution-candidate/freshness.py')); sys.modules['freshness']=freshness
          ordinal=load('avps_r4_preauth_ordinal_final',Path('experiments/aerosol-family-challenge-v2-r8/execution-candidate/preauthorization_ordinal.py'))
          report=json.load(open('preauthorization-evidence/preauthorization.json'))
          payload=scanner.collect(os.environ['GITHUB_REPOSITORY'],60,os.environ['GITHUB_TOKEN'])
          obs=ordinal.authoritative_global_ordinal_observations(payload,current_run_id=int(os.environ['GITHUB_RUN_ID']))
          occupied=sorted({int(r['ordinal']) for r in obs})
          if max(occupied)!=report['occupiedMaxScientificOrdinal'] or max(occupied)+1!=report['nextAvailableScientificOrdinal']: raise SystemExit('global ordinal surface changed before proof completion')
          if scanner.final_expected_branch_head(os.environ['GITHUB_REPOSITORY'],os.environ['EXPECTED_BRANCH'],os.environ['GITHUB_TOKEN'])!=os.environ['PR_HEAD']: raise SystemExit('preauthorization branch moved before proof completion')
          for k in ('scientificOrdinalAllocated','authorizationCreated','dispatchCreated','candidateSeedsAppliedToCases','scientificExecutionAuthorized','solverExecutionAuthorized','resultOpeningAuthorized','scientificRuntimeSetupPerformed','taylorOrJerusalemUsed','levelBAuthorized','protectedHoldoutOpened','productionAuthorized','newMappingAuthorized'):
              if report.get(k) is not False: raise SystemExit(f'closed boundary drift: {k}')
          PY

      - name: Prove zero-runtime review surface
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(command -v uvspec || true)"
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/avps-v2-recovery4-preauthorization-v1-review.yml').read_text()
          forbidden=('rte_solver '+'mystic','mc_photons '+'Œ	Ë	ÝÛÜšÙ›Ý×ÉÊÉÙ\Ü]Ú‰ÊBˆ›ÜˆÚÙ[ˆ[ˆ›Ü˜šY[Ž‚ˆYˆÚÙ[ˆ[ˆ^ˆ˜Z\ÙHÞ\Ý[Q^]
‰Ù›Ü˜šY[ˆØÚY[YšXËÜ[[YHÚÙ[ˆ[ˆ™X]]Üš^˜][ÛˆØ]NˆÝÚÙ[ŸIÊBˆBˆ\Ý^ˆ‰
Ú]Ý]\ÈK\Ü˜Ù[Z[ˆK][˜XÚÙYYš[\Ï[›ÊH‚‚ˆH\Ù\ÎˆXÝ[ÛœËÝ\ØYX\Y˜XÝÙ˜™XNLØÍÍØXYMM™MØÌXÍNÍYY˜Í˜LHÈËŒŒBˆÚ]‚ˆ˜[YNˆ]œË]Œ‹\™XÛÝ™\žM\™X]]Üš^˜][Û‹]ŒK\›ÛÙ‚ˆ]ˆ™X]]Üš^˜][Û‹Y]šY[˜ÙKÂˆY‹[›ËYš[\ËY›Ý[™ˆ\œ›Ü‚ˆÛÛ\™\ÜÚ[Û‹[]™[ˆ