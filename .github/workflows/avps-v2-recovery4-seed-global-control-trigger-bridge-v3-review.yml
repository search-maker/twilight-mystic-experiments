name: Review AVPS v2 recovery4 seed/global control trigger bridge v3

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery4-seed-global-control-trigger-bridge-v3.yml
      - .github/workflows/avps-v2-recovery4-seed-global-control-trigger-bridge-v3-review.yml
      - review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-seed-global-control-trigger-bridge-v3/**

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: review-avps-v2-recovery4-seed-global-control-trigger-bridge-v3-${{ github.event.pull_request.number }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_BASE: f5bd81b7706c9cc56592667709a6aa725a5f48ba
      EXPECTED_BRANCH: review/avps-v2-recovery4-seed-global-control-trigger-bridge-v3
      CONTROL_WORKFLOW: avps-v2-recovery4-seed-global-control-v1.yml
      CONTROL_BLOB: 875bd21758a0ac0a2e2aed57bfc428df4e1e9578
      BRIDGE_WORKFLOW: .github/workflows/avps-v2-recovery4-seed-global-control-trigger-bridge-v3.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact three-file zero-runtime correction scope
        shell: bash
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$PR_BRANCH" = "$EXPECTED_BRANCH"
          test "$PR_BASE" = "$EXPECTED_BASE"
          test "${{ github.event.pull_request.base.ref }}" = main
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE"
          git diff --name-only "$EXPECTED_BASE...HEAD" | sort > changed-paths.txt
          cat > expected-paths.txt <<'EOF'
          .github/workflows/avps-v2-recovery4-seed-global-control-trigger-bridge-v3-review.yml
          .github/workflows/avps-v2-recovery4-seed-global-control-trigger-bridge-v3.yml
          review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-seed-global-control-trigger-bridge-v3/PROTOCOL.md
          EOF
          sort -o expected-paths.txt expected-paths.txt
          diff -u expected-paths.txt changed-paths.txt
          test "$(git hash-object .github/workflows/$CONTROL_WORKFLOW)" = "$CONTROL_BLOB"

      - name: Prove header-only historical fence compatibility and fail-closed semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          text=Path('.github/workflows/avps-v2-recovery4-seed-global-control-trigger-bridge-v3.yml').read_text()
          required=(
            'control-trigger/aerosol-vertical-profile-sensitivity-v2-recovery4-seed-global-control-v3',
            'control-triggers/avps-v2-recovery4-seed-global-control-v3.txt',
            'AVPS_V2_RECOVERY4_SEED_GLOBAL_CONTROL_TRIGGER_V3',
            'CONTROL_WORKFLOW: avps-v2-recovery4-seed-global-control-v1.yml',
            'CONTROL_BLOB: 875bd21758a0ac0a2e2aed57bfc428df4e1e9578',
            "header=text.splitlines()[0].strip()",
            "for key in ('begin','beginComment','begin_comment'):",
            'conflicting WRITE_QUIET_END header begin ids',
            'unexpected unmatched WRITE_QUIET set',
            'final unexpected unmatched WRITE_QUIET set',
            'Final live recheck immediately before control dispatch',
            'actions/workflows/$CONTROL_WORKFLOW/dispatches',
            'persist-credentials: false',
          )
          for token in required:
              if token not in text: raise SystemExit(f'missing bridge-v3 invariant: {token}')
          if text.count("header=text.splitlines()[0].strip()") != 2: raise SystemExit('both scans must be header-only')
          if text.count('--method POST') != 1: raise SystemExit('bridge-v3 must have exactly one POST')
          if 'workflow_dispatch:' in text: raise SystemExit('bridge-v3 itself must not expose workflow_dispatch')
          if not re.search(r'on:\s*\n\s*push:', text): raise SystemExit('bridge-v3 must be push-triggered only')
          forbidden=('contents: write','issues: write','git/refs','DISPATCH_CONSUMED','mc_photons','rte_solver','uvspec ','mystic','ddded6b2d170ca2fac8d498bdba2887446c16995df0880d948fb2be00870b3de')
          low=text.lower()
          for token in forbidden:
              if token.lower() in low: raise SystemExit(f'forbidden science/allocation token in bridge-v3: {token}')

          def closed_begin_id(body):
              body=str(body or '').strip()
              if not body.startswith('WRITE_QUIET_END'): return None
              header=body.splitlines()[0].strip()
              ids=set()
              for key in ('begin','beginComment','begin_comment'):
                  ids.update(int(x) for x in re.findall(rf'\b{re.escape(key)}=(\d+)\b',header))
              if len(ids)>1: raise ValueError(f'conflicting WRITE_QUIET_END header begin ids: {sorted(ids)}')
              return next(iter(ids),None)
          for key,value in [('begin',101),('beginComment',102),('begin_comment',103)]:
              if closed_begin_id(f'WRITE_QUIET_END | X | {key}={value}') != value: raise SystemExit(f'{key} header fixture failed')
          noisy='WRITE_QUIET_END | X | begin=101\nHistorical prose: beginComment=202 and begin_comment=303 are unrelated references.'
          if closed_begin_id(noisy)!=101: raise SystemExit('body-noise fixture must preserve authoritative header binding')
          if closed_begin_id('ordinary text begin=101') is not None: raise SystemExit('ordinary text must not close a fence')
          try:
              closed_begin_id('WRITE_QUIET_END | X | begin=1 | beginComment=2\nbody begin_comment=3')
          except ValueError:
              pass
          else:
              raise SystemExit('conflicting header identifiers must fail closed')
          comments=[
            {'id':101,'body':'WRITE_QUIET_BEGIN | A'},
            {'id':102,'body':'WRITE_QUIET_BEGIN | B'},
            {'id':103,'body':'WRITE_QUIET_BEGIN | C'},
            {'id':104,'body':'WRITE_QUIET_BEGIN | D'},
            {'id':201,'body':'WRITE_QUIET_END | A | begin=101\nbody beginComment=999'},
            {'id':202,'body':'WRITE_QUIET_END | B | beginComment=102\nbody begin=998'},
            {'id':203,'body':'WRITE_QUIET_END | C | begin_comment=103\nbody begin=997'},
          ]
          open_begins={}
          for c in comments:
              body=c['body']
              if body.startswith('WRITE_QUIET_BEGIN'): open_begins[c['id']]=body
              elif body.startswith('WRITE_QUIET_END'):
                  closed=closed_begin_id(body)
                  if closed is not None: open_begins.pop(closed,None)
          if set(open_begins)!={104}: raise SystemExit(f'fixture failed to preserve genuine unmatched BEGIN: {open_begins}')
          PY

      - name: Rebind frozen target control and prove it remains undispatched
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE"
          test "$(git show origin/main:.github/workflows/$CONTROL_WORKFLOW | git hash-object --stdin)" = "$CONTROL_BLOB"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/$CONTROL_WORKFLOW/runs?event=workflow_dispatch&per_page=100" --jq '.workflow_runs[].id' > prior-control-run-ids.txt
          test ! -s prior-control-run-ids.txt

      - name: Emit zero-runtime correction review receipt
        shell: bash
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          out={'schemaVersion':1,'stageId':'aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-seed-global-control-trigger-bridge-v3','status':'PASS_AVPS_V2_RECOVERY4_TRIGGER_BRIDGE_V3_ZERO_RUNTIME_HEADER_ONLY_FENCE_COMPATIBILITY_REVIEW','reviewHead':os.environ['PR_HEAD'],'reviewBase':os.environ['EXPECTED_BASE'],'controlWorkflow':os.environ['CONTROL_WORKFLOW'],'controlBlob':os.environ['CONTROL_BLOB'],'bridgeSha256':hashlib.sha256(Path(os.environ['BRIDGE_WORKFLOW']).read_bytes()).hexdigest(),'recognizedHistoricalEndKeys':['begin','beginComment','begin_comment'],'headerOnlyBinding':True,'laterBodyReferencesIgnored':True,'genuineUnmatchedBeginRefused':True,'candidateSeedsApplied':False,'scientificOrdinalAllocated':False,'authorizationCreated':False,'dispatchCreated':False,'controlWorkflowDispatchRequested':False,'scientificRuntime':False,'solverExecution':False,'resultsOpened':False,'levelBAdmission':False,'holdout':False,'production':False,'taylorOrJerusalemUsed':False,'newMappingAuthorized':False}
          Path('bridge-v3-review-receipt.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: avps-v2-recovery4-seed-global-control-trigger-bridge-v3-review
          path: |
            changed-paths.txt
            bridge-v3-review-receipt.json
            prior-control-run-ids.txt
          if-no-files-found: error
          compression-level: 0
