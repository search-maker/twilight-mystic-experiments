name: Review AVPS v2 recovery4 seed/global control

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery4-seed-global-control-v1-review.yml
      - .github/workflows/avps-v2-recovery4-seed-global-control-v1.yml
      - review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-seed-global-control-v1/**

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_BRANCH: review/avps-v2-recovery4-seed-global-control-v1
      EXPECTED_MAIN: 5eea53a226cc91d0ec6f63475d74fcf761e8019b
      ORDINAL42_AUTH_HEAD: e627a689ada0493a8a5b9cdafc4aba0198fbabec
      EXPECTED_SEED_CANONICAL: ddded6b2d170ca2fac8d498bdba2887446c16995df0880d948fb2be00870b3de
      EXPECTED_ROWS_CANONICAL: c439de417520b330c037e2628df02b6955f652563300aa5ef30477abf7661a98
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Bind exact review-only scope
        shell: bash
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$PR_BRANCH" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          test "${{ github.event.pull_request.base.ref }}" = main
          test "${{ github.event.pull_request.base.sha }}" = "$EXPECTED_MAIN"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git diff --name-only "$EXPECTED_MAIN...HEAD" | sort > changed.txt
          cat > expected.txt <<'PATHS'
          .github/workflows/avps-v2-recovery4-seed-global-control-v1-review.yml
          .github/workflows/avps-v2-recovery4-seed-global-control-v1.yml
          review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-seed-global-control-v1/PROTOCOL.md
          review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-seed-global-control-v1/repository_global_seed_scan.py
          review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-seed-global-control-v1/seed_ledger.py
          PATHS
          sort -o expected.txt expected.txt
          diff -u expected.txt changed.txt

      - name: Validate deterministic real candidate ledger without global scan
        shell: bash
        run: |
          set -euo pipefail
          ORDINAL42_WORKTREE="$RUNNER_TEMP/avps-ordinal42-auth-native"
          git worktree add --detach "$ORDINAL42_WORKTREE" "$ORDINAL42_AUTH_HEAD"
          export AVPS_ORDINAL42_LEDGER_PATH="$ORDINAL42_WORKTREE/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-seed-freshness-v1/seed_ledger.py"
          python -m py_compile review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-seed-global-control-v1/*.py
          python - <<'PY'
          import importlib.util,json,os,sys
          from pathlib import Path
          p=Path('review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-seed-global-control-v1/seed_ledger.py')
          spec=importlib.util.spec_from_file_location('r4seed',p); m=importlib.util.module_from_spec(spec); sys.modules[spec.name]=m; spec.loader.exec_module(m)
          x=m.validate_ledger()
          if x['candidateSeedCount']!=72 or len(set(x['candidateSeeds']))!=72: raise SystemExit('candidate cardinality drift')
          if x['candidateSeedCanonicalSha256']!=os.environ['EXPECTED_SEED_CANONICAL']: raise SystemExit('seed canonical drift')
          if x['candidateRowsCanonicalSha256']!=os.environ['EXPECTED_ROWS_CANONICAL']: raise SystemExit('row canonical drift')
          for n in (41,42,43,44):
              if x[f'overlapWithConsumedOrdinal{n}SeedCount']!=0: raise SystemExit(f'consumed ordinal{n} overlap')
          if x['allCollisionCountersZero'] is not True: raise SystemExit('unexpected collision counter')
          for key in ('candidateSeedFreshnessProven','candidateSeedsAppliedToCases','scientificOrdinalAllocated','authorizationCreated','dispatchCreated','scientificRuntimeSetupPerformed','scientificExecutionPerformed','solverExecutionAuthorized','resultOpeningAuthorized','levelBOpeningAuthorized','protectedHoldoutOpeningAuthorized','productionAuthorized','taylorOrJerusalemFitAuthorized','newMappingAuthorized'):
              if x[key] is not False: raise SystemExit(f'review crossed boundary: {key}')
          Path('candidate-review.json').write_text(json.dumps(x,indent=2,sort_keys=True)+'\n')
          PY
          git worktree remove --force "$ORDINAL42_WORKTREE"

      - name: Prove manual global control is zero-runtime and ordinal-dynamic
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/avps-v2-recovery4-seed-global-control-v1.yml')
          text=p.read_text()
          for token in ('rte_solver','mc_photons','aerosol_set_tau_at_wvl','setup-micromamba','rubin-libradtran'):
              if token in text: raise SystemExit(f'solver/science token leaked into global control: {token}')
          for required in ('workflow_dispatch:','derive_next_global_ordinal','latest_consumed_or_dispatched_ordinal','WRITE_QUIET_BEGIN | AVPS_V2_RECOVERY4_SEED_GLOBAL_CONTROL_V1','repository_global_seed_scan.py','candidate-seed-ledger.json'):
              if required not in text: raise SystemExit(f'missing control invariant: {required}')
          if 'nextAvailableScientificOrdinal: 45' in text or 'scientificOrdinal: 45' in text or 'ORDINAL45' in text:
              raise SystemExit('successor ordinal hard-coded')
          PY

      - name: Freeze review receipt
        shell: bash
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.load(open('candidate-review.json'))
          receipt={'schemaVersion':1,'status':'PASS_AVPS_V2_RECOVERY4_SEED_GLOBAL_CONTROL_LOCAL_REVIEW_GLOBAL_SCAN_NOT_RUN','headSha':os.environ['PR_HEAD'],'candidateSeedCount':72,'candidateSeedCanonicalSha256':x['candidateSeedCanonicalSha256'],'candidateRowsCanonicalSha256':x['candidateRowsCanonicalSha256'],'repositoryGlobalScanPerformed':False,'scientificOrdinalDerived':False,'scientificOrdinalAllocated':False,'authorizationCreated':False,'dispatchCreated':False,'scientificRuntime':False,'resultsOpened':False,'levelBAdmission':False,'holdout':False,'production':False,'taylorOrJerusalemUsed':False,'newMappingAuthorized':False}
          Path('review-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: avps-v2-recovery4-seed-global-control-v1-review
          path: |
            changed.txt
            candidate-review.json
            review-receipt.json
          if-no-files-found: error
          compression-level: 0
