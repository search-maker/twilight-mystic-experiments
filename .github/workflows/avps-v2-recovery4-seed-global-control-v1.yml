name: AVPS v2 recovery4 seed/global control

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact current main SHA reviewed for the fenced control run
        required: true
        type: string
      fence_begin_comment_id:
        description: Exact Issue 60 WRITE_QUIET_BEGIN comment id
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: avps-v2-recovery4-seed-global-control-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPECTED_MAIN: ${{ inputs.expected_main_sha }}
      FENCE_BEGIN_COMMENT_ID: ${{ inputs.fence_begin_comment_id }}
      ORDINAL42_AUTH_HEAD: e627a689ada0493a8a5b9cdafc4aba0198fbabec
      CONTROL_DIR: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-seed-global-control-v1
      EXPECTED_SEED_CANONICAL: ddded6b2d170ca2fac8d498bdba2887446c16995df0880d948fb2be00870b3de
      EXPECTED_ROWS_CANONICAL: c439de417520b330c037e2628df02b6955f652563300aa5ef30477abf7661a98
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_main_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Bind exact attempt-1 main and active Issue60 fence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = main
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$FENCE_BEGIN_COMMENT_ID" -gt 0
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$FENCE_BEGIN_COMMENT_ID" > fence-begin.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > issue60-pages.json
          python - <<'PY'
          import json,os
          begin=json.load(open('fence-begin.json'))
          expected=f"WRITE_QUIET_BEGIN | AVPS_V2_RECOVERY4_SEED_GLOBAL_CONTROL_V1 | main={os.environ['EXPECTED_MAIN']}"
          body=str(begin.get('body') or '').strip()
          if not body.startswith(expected): raise SystemExit('exact recovery4 global-control fence BEGIN mismatch')
          pages=json.load(open('issue60-pages.json')); comments=[c for p in pages for c in p]
          begin_id=int(os.environ['FENCE_BEGIN_COMMENT_ID'])
          if sum(int(c.get('id') or 0)==begin_id for c in comments)!=1: raise SystemExit('fence BEGIN cardinality drift')
          end_prefix=f"WRITE_QUIET_END | AVPS_V2_RECOVERY4_SEED_GLOBAL_CONTROL_V1 | begin={begin_id}"
          if any(str(c.get('body') or '').strip().startswith(end_prefix) for c in comments): raise SystemExit('fence already closed before control run')
          PY
          mkdir -p control-evidence
          git ls-files -z > control-evidence/tracked-files.nul

      - name: Require repository workflow quiescence except this control run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" > workflow-runs-pages.json
          python - <<'PY'
          import json,os
          pages=json.load(open('workflow-runs-pages.json'))
          rows=[r for page in pages for r in page.get('workflow_runs',[])]
          self_id=int(os.environ['GITHUB_RUN_ID'])
          active=[(int(r.get('id') or 0),str(r.get('status') or ''),str(r.get('name') or '')) for r in rows if int(r.get('id') or 0)!=self_id and str(r.get('status') or '') in {'queued','in_progress','waiting','requested','pending'}]
          if active: raise SystemExit(f'repository workflows not quiescent: {active[:20]}')
          PY

      - name: Prepare native ordinal42 worktree and deterministic recovery4 candidate ledger
        shell: bash
        run: |
          set -euo pipefail
          ORDINAL42_WORKTREE="$RUNNER_TEMP/avps-ordinal42-auth-native"
          git worktree add --detach "$ORDINAL42_WORKTREE" "$ORDINAL42_AUTH_HEAD"
          echo "AVPS_ORDINAL42_LEDGER_PATH=$ORDINAL42_WORKTREE/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-seed-freshness-v1/seed_ledger.py" >> "$GITHUB_ENV"
          export AVPS_ORDINAL42_LEDGER_PATH="$ORDINAL42_WORKTREE/review/aerosol-vertical-profile-sensitivity-v2-postconsumption-seed-freshness-v1/seed_ledger.py"
          python - <<'PY'
          import importlib.util,json,os,sys
          from pathlib import Path
          p=Path(os.environ['CONTROL_DIR'])/'seed_ledger.py'
          spec=importlib.util.spec_from_file_location('r4seed',p); m=importlib.util.module_from_spec(spec); sys.modules[spec.name]=m; spec.loader.exec_module(m)
          x=m.validate_ledger()
          if x['candidateSeedCanonicalSha256']!=os.environ['EXPECTED_SEED_CANONICAL'] or x['candidateRowsCanonicalSha256']!=os.environ['EXPECTED_ROWS_CANONICAL']: raise SystemExit('candidate identity drift')
          if x['candidateSeedCount']!=72 or len(set(x['candidateSeeds']))!=72: raise SystemExit('candidate cardinality drift')
          for n in (41,42,43,44):
              if x[f'overlapWithConsumedOrdinal{n}SeedCount']!=0: raise SystemExit(f'candidate overlap with consumed ordinal {n}')
          Path('control-evidence/candidate-seed-ledger.json').write_text(json.dumps(x,indent=2,sort_keys=True)+'\n')
          Path('control-evidence/empty-self-ledger-policy.json').write_text(json.dumps({'schemaVersion':2,'requiredTrackedSelfLedgerPaths':[],'futureEvidenceSelfLedgerPaths':[]},indent=2,sort_keys=True)+'\n')
          PY

      - name: Scan exact tracked tree for recovery4 candidate literals
        shell: bash
        run: |
          set -euo pipefail
          python review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/tracked_tree_seed_scan.py \
            --repo-root . \
            --file-list control-evidence/tracked-files.nul \
            --candidate-seed-ledger control-evidence/candidate-seed-ledger.json \
            --allow-self-ledger-json control-evidence/empty-self-ledger-policy.json \
            --output control-evidence/tracked-seed-scan.json
          python - <<'PY'
          import json
          x=json.load(open('control-evidence/tracked-seed-scan.json'))
          if x['candidateSeedCount']!=72 or x['trackedTreeExternalCollisionCount']!=0 or x['selfLedgerHitCount']!=0 or x['exactHeadTrackedTreeByteScanPassed'] is not True: raise SystemExit('tracked-tree scan failed')
          PY

      - name: Two-pass repository-global recovery4 seed scan
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python "$CONTROL_DIR/repository_global_seed_scan.py" \
            --repository "$GITHUB_REPOSITORY" \
            --issue-number 60 \
            --candidate-seed-ledger control-evidence/candidate-seed-ledger.json \
            --current-run-id "$GITHUB_RUN_ID" \
            --audit-mode review-freeze \
            --expected-branch-name main \
            --expected-repo-head "$EXPECTED_MAIN" \
            --output control-evidence/repository-global-seed-scan.json

      - name: Dynamically derive next unused global scientific ordinal
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PYTHONPATH=experiments/aerosol-vertical-profile-sensitivity-v1 python - <<'PY'
          import json,os
          from pathlib import Path
          import preauthorization_surface
          scan=json.load(open('control-evidence/repository-global-seed-scan.json'))
          if scan.get('repositoryGlobalCollisionCount')!=0 or scan.get('repositoryGlobalDoubleEnumerationStable') is not True or scan.get('auditedBranchHeadMatchesRepositoryHead') is not True: raise SystemExit('repository-global seed proof did not pass')
          payload=preauthorization_surface.collect(os.environ['GITHUB_REPOSITORY'],os.environ['GITHUB_TOKEN'])
          latest=preauthorization_surface.latest_consumed_or_dispatched_ordinal(payload)
          if not isinstance(latest,int) or latest < 44: raise SystemExit(f'global latest consumed/dispatch ordinal behind consumed AVPS44: {latest}')
          candidate,observations=preauthorization_surface.derive_next_global_ordinal(payload,latest,current_run_id=int(os.environ['GITHUB_RUN_ID']))
          if not isinstance(candidate,int) or candidate <= latest: raise SystemExit('derived successor ordinal is not strictly newer than global latest')
          out={'schemaVersion':1,'status':'PASS_RECOVERY4_DYNAMIC_GLOBAL_ORDINAL_NOT_ALLOCATED','latestPriorConsumedOrDispatchedScientificOrdinal':latest,'nextAvailableScientificOrdinal':candidate,'globalOrdinalObservationCount':len(observations),'scientificOrdinalAllocated':False,'authorizationCreated':False,'dispatchCreated':False}
          Path('control-evidence/global-ordinal-observations.json').write_text(json.dumps(observations,indent=2,sort_keys=True)+'\n')
          Path('control-evidence/dynamic-global-ordinal.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY

      - name: Freeze result-closed recovery4 seed/global proof
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          ledger=json.load(open('control-evidence/candidate-seed-ledger.json'))
          scan=json.load(open('control-evidence/repository-global-seed-scan.json'))
          ordinal=json.load(open('control-evidence/dynamic-global-ordinal.json'))
          proof={'schemaVersion':1,'stageId':'aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-seed-global-control-v1','status':'PASS_RECOVERY4_CANDIDATE_SEEDS_GLOBALLY_FRESH_DYNAMIC_ORDINAL_DERIVED_NOT_ALLOCATED','exactMainSha':os.environ['EXPECTED_MAIN'],'runId':int(os.environ['GITHUB_RUN_ID']),'runAttempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'fenceBeginCommentId':int(os.environ['FENCE_BEGIN_COMMENT_ID']),'candidateSeedCount':ledger['candidateSeedCount'],'candidateSeedCanonicalSha256':ledger['candidateSeedCanonicalSha256'],'candidateRowsCanonicalSha256':ledger['candidateRowsCanonicalSha256'],'repositoryGlobalCollisionCount':scan['repositoryGlobalCollisionCount'],'repositoryGlobalDoubleEnumerationStable':scan['repositoryGlobalDoubleEnumerationStable'],'latestPriorConsumedOrDispatchedScientificOrdinal':ordinal['latestPriorConsumedOrDispatchedScientificOrdinal'],'nextAvailableScientificOrdinal':ordinal['nextAvailableScientificOrdinal'],'candidateSeedsAppliedToCases':False,'scientificOrdinalAllocated':False,'authorizationCreated':False,'dispatchCreated':False,'scientificRuntime':False,'solverExecution':False,'resultsOpened':False,'levelBOpeningAuthorized':False,'protectedHoldoutOpeningAuthorized':False,'productionAuthorized':False,'taylorOrJerusalemUsed':False,'newMappingAuthorized':False}
          proof['proofSha256']=hashlib.sha256(json.dumps(proof,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
          Path('control-evidence/recovery4-seed-global-proof.json').write_text(json.dumps(proof,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vertical-profile-v2-postconsumption-recovery4-seed-global-control-proof
          path: control-evidence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Cleanup historical worktree
        if: always()
        shell: bash
        run: git worktree remove --force "$RUNNER_TEMP/avps-ordinal42-auth-native" || true
