name: Review AVPS v2 recovery4 successor infrastructure

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/avps-v2-recovery4-successor-infrastructure-review.yml
      - .github/recovery-templates/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-successor-infrastructure-v1/**

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  zero-runtime-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Bind exact additive review scope and unchanged frozen sources
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git diff --name-only "$BASE_SHA"...HEAD | sort > changed.txt
          cat > expected.txt <<'EOF'
          .github/recovery-templates/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-successor-infrastructure-v1/PROTOCOL.md
          .github/recovery-templates/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-successor-infrastructure-v1/generate.py
          .github/recovery-templates/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-successor-infrastructure-v1/test_successor_infrastructure.py
          .github/workflows/avps-v2-recovery4-successor-infrastructure-review.yml
          EOF
          sort -o expected.txt expected.txt
          diff -u expected.txt changed.txt
          test "$(git rev-parse HEAD:.github/workflows/avps-v2-postconsumption-recovery3-science.yml)" = ddc2bb954cf07c4c7f314c3d551a8aee44381c73
          test "$(git rev-parse HEAD:runtime-avps-v2-recovery3-ordinal44-v1/runtime_adapter.py)" = 9fce4f704040d7849b59ed96577d02e5aeecd455
          test "$(git rev-parse HEAD:runtime-avps-v2-recovery3-ordinal44-v1/executor.py)" = 643c0d5b499747a8529a2a58c659ee24a7fd2a60
          test "$(git rev-parse HEAD:runtime-avps-v2-recovery3-ordinal44-v1/aggregator.py)" = abe8522d7e3562eef9f2c807911871916627fa96
          test "$(git rev-parse HEAD:review/aerosol-vertical-profile-sensitivity-v2-control-v1/adapter.py)" = c245eac2fe5b5d026e46ec4253bc377c5fde97ec

      - name: Compile generator and zero-runtime fixture
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            .github/recovery-templates/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-successor-infrastructure-v1/generate.py \
            .github/recovery-templates/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-successor-infrastructure-v1/test_successor_infrastructure.py

      - name: Execute synthetic future-identity routing/refusal review only
        shell: bash
        run: |
          set -euo pipefail
          python .github/recovery-templates/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery4-successor-infrastructure-v1/test_successor_infrastructure.py
          python - <<'PY'
          import json
          r=json.load(open('avps-recovery4-successor-infrastructure-review-receipt.json'))
          if r.get('status')!='PASS_AVPS_V2_RECOVERY4_SUCCESSOR_INFRASTRUCTURE_ZERO_RUNTIME_REVIEW': raise SystemExit('review status drift')
          for k in ('scientificRuntime','solverExecution','resultsOpened','levelBOpeningAuthorized','protectedHoldoutOpeningAuthorized','productionAuthorized','taylorOrJerusalemUsed','newMappingAuthorized'):
              if r.get(k) is not False: raise SystemExit(f'closed boundary drift: {k}')
          if (r.get('caseCount'),r.get('groupCount'),r.get('statesPerGroup'),r.get('photonHistoriesPerCase'))!=(360,72,5,20_000_000): raise SystemExit('frozen science cardinality drift')
          if r.get('matrixShardCounts')!={'2':90,'4':90,'6':90,'8':90}: raise SystemExit('matrix shard drift')
          PY

      - name: Prove review workflow itself cannot execute AVPS science
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/avps-v2-recovery4-successor-infrastructure-review.yml').read_text()
          forbidden=(
              'workflow_'+'dispatch:',
              'setup-'+'micromamba',
              'gh run '+'download',
              'curl '+'-L',
              'command -v '+'uvspec',
              'rte_solver '+'mystic',
              'mc_photons '+'20000000',
          )
          for token in forbidden:
              if token in p: raise SystemExit(f'review workflow contains scientific runtime token: {token}')
          PY
          test -z "$(git status --porcelain --untracked-files=no)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: avps-v2-recovery4-successor-infrastructure-zero-runtime-review
          path: |
            changed.txt
            avps-recovery4-successor-infrastructure-review-receipt.json
          if-no-files-found: error
          compression-level: 0
