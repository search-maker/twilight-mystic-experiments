name: AVPS V71 accepted publisher byte transfer 2

on:
  push:
    branches:
      - prep/avps-v71-publisher-byte-transfer-2
    paths:
      - .github/workflows/avps-v71-publisher-byte-transfer-2.yml

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prep/avps-v71-publisher-byte-transfer-2
          fetch-depth: 1
      - name: Verify and publish accepted bytes to temporary non-workflow path
        shell: bash
        env:
          SOURCE_URL: https://sdmntprnortheu.oaiusercontent.com/files/00000000-5aec-81f4-98a9-599612f07475/raw?se=2026-09-03T18%3A15%3A33Z&sp=r&sv=2026-02-06&sr=b&scid=49ead71b-1a00-56c3-a3d4-91aa406ec2bc&skoid=6658dbdd-f305-4d30-8f6b-d62218202cb9&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-03T15%3A23%3A48Z&ske=2026-09-04T15%3A23%3A48Z&sks=b&skv=2026-02-06&sig=YycbGhDVzb/SNIt/CkamWInp62gYuB1xJgaS1JvGJzg%3D
          EXPECT_SHA256: 9b61da35e7eee5e2db057e17ac2f81cbc5bfa006fab5142feada3095f62f83d8
          EXPECT_BLOB: c444306cd5f7e3e44182062d565ccc770345f00d
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = prep/avps-v71-publisher-byte-transfer-2
          curl --fail --location --silent --show-error "$SOURCE_URL" --output "$RUNNER_TEMP/source.zip"
          mkdir "$RUNNER_TEMP/unpacked"
          unzip -q "$RUNNER_TEMP/source.zip" canonical-final-publisher-v3.yml -d "$RUNNER_TEMP/unpacked"
          src="$RUNNER_TEMP/unpacked/canonical-final-publisher-v3.yml"
          test "$(sha256sum "$src" | awk '{print $1}')" = "$EXPECT_SHA256"
          test "$(git hash-object "$src")" = "$EXPECT_BLOB"
          mkdir -p transfer
          cp "$src" transfer/accepted-avps-v71-final-publisher-v3.yml
          test "$(git hash-object transfer/accepted-avps-v71-final-publisher-v3.yml)" = "$EXPECT_BLOB"
          git config user.name 'search-maker'
          git config user.email '304153003+search-maker@users.noreply.github.com'
          git add transfer/accepted-avps-v71-final-publisher-v3.yml
          git commit -m 'Stage exact accepted AVPS V71 publisher bytes'
          git push origin HEAD:refs/heads/prep/avps-v71-publisher-byte-transfer-2
