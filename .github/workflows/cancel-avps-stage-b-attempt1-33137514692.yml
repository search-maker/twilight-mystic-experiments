name: Cancel failed AVPS Stage B attempt 1
run-name: Cancel AVPS Stage B failed run 33137514692

on:
  push:
    branches:
      - control/cancel-avps-stage-b-attempt1-33137514692

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Bind exact failed run and cancel only that run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN: '33137514692'
          TARGET_HEAD: '79b95f0ee0fafeb07f3785da91e63598035d4ac1'
          TARGET_BRANCH: 'status/avps-v1-stage-b-science-recovery-ordinal-40'
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = control/cancel-avps-stage-b-attempt1-33137514692
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN}" > target-run.json
          python - <<'PY'
          import json, os
          r=json.load(open('target-run.json'))
          checks={
            'id': int(os.environ['TARGET_RUN']),
            'head_sha': os.environ['TARGET_HEAD'],
            'head_branch': os.environ['TARGET_BRANCH'],
            'event': 'workflow_dispatch',
            'run_attempt': 1,
            'path': '.github/workflows/avps-v1-science.yml',
          }
          for k,v in checks.items():
              if r.get(k) != v:
                  raise SystemExit(f'target run identity drift: {k}={r.get(k)!r} expected {v!r}')
          if r.get('status') not in ('queued','in_progress'):
              raise SystemExit(f'target run is not cancellable active state: {r.get("status")}/{r.get("conclusion")}')
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN}/cancel"
          echo 'EXACT_FAILED_AVPS_STAGE_B_RUN_CANCEL_REQUEST_ACCEPTED'
