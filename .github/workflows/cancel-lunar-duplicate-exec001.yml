name: Cancel accidental duplicate lunar exec001 run

on:
  push:
    branches:
      - control/cancel-lunar-duplicate-exec001

permissions:
  actions: write
  contents: read

jobs:
  cancel-duplicate-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel only duplicate run 33295670685
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DUPLICATE_RUN_ID: '33295670685'
          AUTHORIZED_RUN_ID: '33295634887'
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$DUPLICATE_RUN_ID" != "$AUTHORIZED_RUN_ID"
          response="$(curl --fail-with-body --silent --show-error --location \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$DUPLICATE_RUN_ID/cancel" \
            -w '%{http_code}')"
          test "$response" = 202 || { echo "unexpected cancel HTTP status: $response" >&2; exit 1; }
          echo "cancel accepted for duplicate run $DUPLICATE_RUN_ID; authorized run $AUTHORIZED_RUN_ID untouched"
