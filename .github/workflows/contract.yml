name: Corrected spectral convergence contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: corrected-spectral-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  non-scientific-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - name: Run unit and artifact-audit tests
        run: python -m unittest discover -s tests -v
      - name: Run estimator-pilot review package checks
        run: python review/full-spectrum-estimator-pilot-v2/run_review_checks.py
      - name: Print exact future authorization proposal
        run: python experiment/runner.py --print-proposal
      - name: Prove scientific execution remains unauthorized
        shell: bash
        run: |
          if python experiment/runner.py --verify-only; then
            echo "Disabled authorization unexpectedly passed" >&2
            exit 1
          fi

  jerusalem-bright-stars-2026:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_URL: https://starsvisibility.pages.dev/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Probe live StarsVisibility calculation source
        run: |
          node --input-type=module - <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage();
            const response = await page.goto(process.env.TARGET_URL, { waitUntil: 'domcontentloaded', timeout: 120000 });
            if (!response?.ok()) throw new Error(`HTTP ${response?.status()}`);
            const source = await page.evaluate(() => globalThis.eval('APP_SCRIPT_SOURCE'));
            console.log(`APP_SCRIPT_SOURCE_LENGTH=${source.length}`);
            for (const term of ['selectionMagnitude', 'threeStarMagnitudeBasis !==', 'effectiveMagnitudeForSelection', 'qualifyingObjectAt']) {
              const index = source.indexOf(term);
              console.log(`\n===== ${term} @ ${index} =====`);
              console.log(index >= 0 ? source.slice(Math.max(0, index - 1200), Math.min(source.length, index + 2600)) : 'NOT FOUND');
            }
          } finally {
            await browser.close();
          }
          NODE
