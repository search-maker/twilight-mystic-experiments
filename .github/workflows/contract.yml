name: Corrected spectral convergence contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: corrected-spectral-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  non-scientific-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - name: Run unit and artifact-audit tests
        run: python -m unittest discover -s tests -v
      - name: Run estimator-pilot review package checks
        run: python review/full-spectrum-estimator-pilot-v2/run_review_checks.py
      - name: Print exact future authorization proposal
        run: python experiment/runner.py --print-proposal
      - name: Prove scientific execution remains unauthorized
        shell: bash
        run: |
          if python experiment/runner.py --verify-only; then
            echo "Disabled authorization unexpectedly passed" >&2
            exit 1
          fi

  jerusalem-bright-stars-2026:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET_URL: https://starsvisibility.pages.dev/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run Jerusalem annual bright-star report
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/jerusalem-bright-stars-live-qa.mjs')
          s = p.read_text()
          wait_old = "await page.waitForSelector('#annualYear', { timeout: 30_000 });"
          wait_new = "await page.waitForSelector('#annualYear', { state: 'attached', timeout: 30_000 });"
          if wait_old in s:
              s = s.replace(wait_old, wait_new, 1)

          helper_old = '''function replaceAtLeastOnce(source, needle, replacement, label) {
            const count = countOccurrences(source, needle);
            if (count < 1) throw new Error(`${label}: expected at least one match, found ${count}`);
            return source.split(needle).join(replacement);
          }'''
          helper_new = r'''function replaceAtLeastOnce(source, needle, replacement, label) {
            const count = countOccurrences(source, needle);
            if (count >= 1) return source.split(needle).join(replacement);
            const escapeRegex = value => value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const flexiblePattern = needle.trim().split(/\s+/).map(escapeRegex).join('\\s+');
            const flexibleRegex = new RegExp(flexiblePattern, 'g');
            const flexibleMatches = source.match(flexibleRegex) || [];
            if (flexibleMatches.length < 1) throw new Error(`${label}: expected at least one exact or whitespace-flexible match, found 0`);
            return source.replace(flexibleRegex, replacement);
          }'''
          if helper_old not in s:
              raise SystemExit('replaceAtLeastOnce helper anchor missing')
          s = s.replace(helper_old, helper_new, 1)
          p.write_text(s)
          PY
          node --check scripts/jerusalem-bright-stars-live-qa.mjs
          node scripts/jerusalem-bright-stars-live-qa.mjs
      - name: Upload Jerusalem report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jerusalem-bright-stars-2026
          path: qa-artifacts/
          if-no-files-found: warn
