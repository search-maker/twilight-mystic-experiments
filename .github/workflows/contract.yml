name: Corrected spectral convergence contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: corrected-spectral-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  non-scientific-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - name: Run unit and artifact-audit tests
        run: python -m unittest discover -s tests -v
      - name: Run estimator-pilot review package checks
        run: python review/full-spectrum-estimator-pilot-v2/run_review_checks.py
      - name: Print exact future authorization proposal
        run: python experiment/runner.py --print-proposal
      - name: Prove scientific execution remains unauthorized
        shell: bash
        run: |
          if python experiment/runner.py --verify-only; then
            echo "Disabled authorization unexpectedly passed" >&2
            exit 1
          fi

  jerusalem-bright-stars-2026:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET_URL: https://starsvisibility.pages.dev/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Adapt QA harness to deployed calculator source
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/jerusalem-bright-stars-live-qa.mjs')
          s = p.read_text()
          s = s.replace(
              "await page.waitForSelector('#annualYear', { timeout: 30_000 });",
              "await page.waitForSelector('#annualYear', { state: 'attached', timeout: 30_000 });",
              1,
          )
          replacements = {
              "'            if (threeStarMagnitudeBasis !== \"known-exclusions\"'": "'            if (magnitudeBasis !== \"known-exclusions\"'",
              "'                && (!Number.isFinite(selectionMagnitude) || selectionMagnitude < threeStarMagnitudeThreshold - 1e-10)) return null;'": "'                && (!Number.isFinite(selectionMagnitude) || selectionMagnitude < magnitudeThreshold - 1e-10)) return null;'",
              "'            if (threeStarMagnitudeBasis !== \"known-exclusions\") {'": "'            if (magnitudeBasis !== \"known-exclusions\") {'",
              "'                if (selectionMagnitude > threeStarMagnitudeThreshold + 1e-10) return null;'": "'                if (selectionMagnitude > magnitudeThreshold + 1e-10) return null;'",
              "'              } else if (selectionMagnitude < threeStarMagnitudeThreshold - 1e-10) return null;'": "'              } else if (selectionMagnitude < magnitudeThreshold - 1e-10) return null;'",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'QA source compatibility anchor missing: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          node --check scripts/jerusalem-bright-stars-live-qa.mjs
      - name: Run Jerusalem annual bright-star report
        run: node scripts/jerusalem-bright-stars-live-qa.mjs
      - name: Upload Jerusalem report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jerusalem-bright-stars-2026
          path: qa-artifacts/
          if-no-files-found: warn
