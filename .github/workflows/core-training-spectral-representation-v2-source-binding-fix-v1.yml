name: Level-B core training spectral representation v2 source binding fix v1
run-name: Level-B core training spectral representation v2 source binding fix v1

on:
  pull_request:
    paths:
      - review/core-training-spectral-representation-v2-source-binding-fix-v1/**
      - .github/workflows/core-training-spectral-representation-v2-source-binding-fix-v1.yml
  push:
    branches:
      - postprocess/core-training-spectral-representation-v2-source-binding-fix-v1
    paths:
      - review/core-training-spectral-representation-v2-source-binding-fix-v1/activation.json

permissions:
  contents: read
  actions: read

env:
  DIR: review/core-training-spectral-representation-v2-source-binding-fix-v1
  PROTOCOL: review/core-training-spectral-representation-v2-source-binding-fix-v1/protocol-v1.json
  ANALYZER: review/core-training-spectral-representation-v2-source-binding-fix-v1/analyze_source_binding_fix_v1.py
  ACTIVATION: review/core-training-spectral-representation-v2-source-binding-fix-v1/activation.json

jobs:
  review:
    if: github.event_name == 'pull_request' && github.head_ref == 'review/core-training-spectral-representation-v2-source-binding-fix-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - name: Refuse wrong correction-review context or scientific execution surface
        env:
          EXPECTED_BASE_SHA: a2621bba6ffc7ac477387995dce953cffb2782cb
          ACTUAL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_HEAD_REF" = review/core-training-spectral-representation-v2-source-binding-fix-v1
          test "$GITHUB_BASE_REF" = main
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$ACTUAL_BASE_SHA" = "$EXPECTED_BASE_SHA"
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/core-training-spectral-representation-v2-source-binding-fix-v1.yml').read_text(encoding='utf-8').lower()
          forbidden=('workflow_'+'dispatch','uv'+'spec','librad'+'tran','mc_'+'photons','mc_'+'vroom','--allow-'+'execution')
          found=[x for x in forbidden if x in text]
          if found: raise SystemExit(f'forbidden scientific-execution surface: {found}')
          PY
      - name: Validate mechanical source-binding correction and synthetic parser refusals
        run: |
          set -euo pipefail
          python "$ANALYZER" validate --protocol "$PROTOCOL"
          (cd "$DIR" && python -m unittest -v test_source_binding_fix_v1.py)
          test "$(git rev-parse HEAD:review/core-training-spectral-representation-v2/protocol-v2.json)" = 678dc545436e1d8d77504b165d011f68b0040d8c
          test "$(git rev-parse HEAD:review/core-training-spectral-representation-v2/analyze_v2.py)" = a82188dab1377c1af33ce0c4c23fa0a382f2978f
      - name: Bind exact failed v2 execution without downloading training artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/31770243803" > failed-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/31770243803/artifacts" > failed-artifacts.json
          python - <<'PY'
          import json
          r=json.load(open('failed-run.json'))
          expected=(31770243803,'a2a860f54485d2dc33a6f448a2b9e4fd01fe652e',1,'push','completed','failure')
          got=(r.get('id'),r.get('head_sha'),r.get('run_attempt'),r.get('event'),r.get('status'),r.get('conclusion'))
          assert got==expected,(got,expected)
          a=json.load(open('failed-artifacts.json'))
          assert a.get('total_count')==0,a
          PY
          gh run view 31770243803 --repo "$GITHUB_REPOSITORY" --log-failed > failed.log
          grep -F 'prepared geometry inputs missing' failed.log

  analyze:
    if: github.event_name == 'push' && github.ref_name == 'postprocess/core-training-spectral-representation-v2-source-binding-fix-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - name: Install frozen numerical dependency
        run: python -m pip install --disable-pip-version-check numpy==2.1.0
      - name: Refuse wrong activation, retry, moved main, or duplicate activation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF_NAME" = postprocess/core-training-spectral-representation-v2-source-binding-fix-v1
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git cat-file -p "$GITHUB_SHA" | grep -c '^parent ')" = 1
          SOURCE_SHA="$(git rev-parse "$GITHUB_SHA^")"
          LIVE_MAIN="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)"
          test "$SOURCE_SHA" = "$LIVE_MAIN"
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")
          test "${#CHANGED[@]}" = 1
          test "${CHANGED[0]}" = "$ACTIVATION"
          python - <<'PY'
          import json,os,subprocess
          a=json.load(open(os.environ['ACTIVATION']))
          parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          expected={
            'schemaVersion':1,
            'status':'AUTHORIZED_TRAINING_ONLY_SPECTRAL_REPRESENTATION_V2_SOURCE_BINDING_FIX_V1',
            'sourceMainSha':parent,
            'correctionProtocolId':'level-b-v1-core-training-spectral-representation-v2-source-binding-fix-v1',
            'baseRepresentationProtocolId':'level-b-v1-core-training-spectral-representation-v2',
            'priorFailedActivationCommitSha':'a2a860f54485d2dc33a6f448a2b9e4fd01fe652e',
            'protectedHoldoutOpeningAuthorized':False,
            'modelFittingAuthorized':False,
            'newScientificExecutionAuthorized':False,
          }
          stale={k:(a.get(k),v) for k,v in expected.items() if a.get(k)!=v}
          if stale: raise SystemExit(f'activation drift: {stale}')
          PY
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=${GITHUB_REF_NAME}&event=push&per_page=100" > activation-runs.json
          python - <<'PY'
          import json,os
          runs=json.load(open('activation-runs.json')).get('workflow_runs',[])
          hits=[r for r in runs if r.get('head_sha')==os.environ['GITHUB_SHA'] and r.get('head_branch')==os.environ['GITHUB_REF_NAME'] and r.get('event')=='push']
          if len(hits)!=1 or int(hits[0].get('id') or 0)!=int(os.environ['GITHUB_RUN_ID']): raise SystemExit(f'activation identity count drift: {[r.get("id") for r in hits]}')
          PY
      - name: Re-prove correction protocol and parser tests
        run: |
          set -euo pipefail
          python "$ANALYZER" validate --protocol "$PROTOCOL"
          (cd "$DIR" && python -m unittest -v test_source_binding_fix_v1.py)
      - name: Execute corrected training-only ten-component representation freeze
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python "$ANALYZER" execute --repo-root . --protocol "$PROTOCOL" --output representation-output
      - name: Independently verify unchanged v2 representation boundaries
        run: |
          python - <<'PY'
          import json, math, numpy as np
          from pathlib import Path
          d=json.loads(Path('representation-output/training-representation-dataset-v2.json').read_text())
          r=json.loads(Path('representation-output/spectral-representation-result-v2.json').read_text())
          z=np.load('representation-output/spectral-representation-v2.npz')
          assert d['geometryCount']==44 and d['sourceCaseArtifactCount']==138 and len(d['records'])==44
          assert d['representationFeatureCount']==13 and d['nullspacePcaComponentCount']==10
          assert d['holdoutValuesRead'] is False and d['protectedHoldoutRecordCount']==0 and d['scientificSolverExecutionPerformed'] is False
          assert r['resolvedNullspacePcaComponentCount']==10 and r['totalRepresentationFeatureCount']==13
          assert len(r['resolvedPcaIndices'])==10 and r['resolvedPcaIndices']==sorted(r['resolvedPcaIndices'])
          assert r['holdoutValuesRead'] is False and r['modelFittingAuthorized'] is False and r['stage2Authorized'] is False
          for rec in d['records']:
              assert len(rec['nullspacePcaCoefficients'])==10
              for s in rec['nullspacePcaCoefficients']:
                  assert math.isfinite(s['mean']) and math.isfinite(s['sampleStd']) and math.isfinite(s['standardError'])
                  assert s['relativeStandardError'] is None or math.isfinite(s['relativeStandardError'])
          W=z['integration_weights']; C=z['selected_nullspace_pca_components']; idx=z['resolved_pca_indices'].tolist()
          assert W.shape==(3,8001) and C.shape==(10,8001) and len(idx)==10 and idx==sorted(idx)
          assert float(np.max(np.abs(W@C.T))) < 1e-9
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: level-b-core-training-spectral-representation-v2-source-binding-fix-v1-${{ github.sha }}
          path: representation-output/*
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
