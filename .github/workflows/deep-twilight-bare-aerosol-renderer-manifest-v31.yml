name: Deep twilight bare-aerosol renderer manifest v31

on:
  push:
    branches:
      - review/deep-twilight-bare-aerosol-renderer-manifest-v31
    paths:
      - .github/workflows/deep-twilight-bare-aerosol-renderer-manifest-v31.yml
      - review/deep-twilight-bare-aerosol-renderer-manifest-v31/build_renderer_manifest_v31.py

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  exact-renderer-manifest-v31:
    if: github.run_attempt == 1 && github.event.before == 'f8f18ac1f2a7eafb658c04da264519f45a4a5c13'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN: fe6e063c568394ae7b4e90222de270d3f2460455
      EXPECTED_CONTROL_COMMENT: '5558516906'
      V2_RUN: '34012593281'
      V2_HEAD: a95df9984d27cfb9c1c1915b72e97ce794ad93f5
      V2_ARTIFACT: '9982923548'
      V2_DIGEST: sha256:bbad4ef455636f55510176b9d0df2f509fabdd78675a9504d45354375e01ceaf
      V24B_RUN: '34022960361'
      V24B_HEAD: 303268d8ab1b72b116a60dd79f7488c65fdfead0
      V24B_ARTIFACT: '9986109317'
      V24B_DIGEST: sha256:91e04c13a2edd0522e9f10f9c02c88ce2ef6c958faf90a2b4687322121a8e16b
      V30_RUN: '34026327352'
      V30_HEAD: e6fcb5d0ff9653dc4c973e64799119e63e3a446b
      V30_ARTIFACT: '9987171191'
      V30_DIGEST: sha256:64e0a182ec437052002e6a02b753fc922cbd7f1c33a1a7cc27dd578168e5e70e

    steps:
      - uses: actions/checkout@v4

      - name: Fresh fail-closed control fence
        shell: bash
        run: |
          set -euo pipefail
          OUT=deep-twilight-bare-aerosol-renderer-manifest-v31-output
          mkdir -p "$OUT"
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          out=Path('deep-twilight-bare-aerosol-renderer-manifest-v31-output')
          repo=os.environ['GITHUB_REPOSITORY']; me=int(os.environ['GITHUB_RUN_ID'])
          def gh(path):
              return json.loads(subprocess.run(['gh','api',path],text=True,capture_output=True,check=True).stdout)
          issue=gh(f'repos/{repo}/issues/60'); main=gh(f'repos/{repo}/branches/main')
          if main['commit']['sha'] != os.environ['EXPECTED_MAIN']: raise SystemExit('main moved')
          count=int(issue['comments']); pages=(count+99)//100; latest=None; markers=[]
          rx=re.compile(r'^\s*WRITE_QUIET_(BEGIN|END)\b')
          for page in range(1,pages+1):
              for c in gh(f'repos/{repo}/issues/60/comments?per_page=100&page={page}'):
                  latest=int(c['id']); fenced=False
                  for raw in str(c.get('body','')).splitlines():
                      line=raw.rstrip('\r')
                      if line.lstrip().startswith('```'):
                          fenced=not fenced; continue
                      if fenced or line.lstrip().startswith('>'): continue
                      m=rx.match(line)
                      if m: markers.append((int(c['id']),m.group(1),line.strip()))
          markers.sort(); terminal=markers[-1][1] if markers else 'NONE'
          if str(latest) != os.environ['EXPECTED_CONTROL_COMMENT']: raise SystemExit(f'Issue #60 advanced: {latest}')
          if terminal == 'BEGIN': raise SystemExit('unmatched WRITE_QUIET_BEGIN')
          blockers=[]; needles=('reptran','recovery4','ordinal45','avps','level-b','level b','lowalt')
          for status in ('in_progress','queued'):
              for r in gh(f'repos/{repo}/actions/runs?status={status}&per_page=100').get('workflow_runs',[]):
                  if int(r['id']) == me: continue
                  text=(str(r.get('name',''))+' '+str(r.get('head_branch',''))).lower()
                  if any(n in text for n in needles):
                      blockers.append({'status':status,'id':r['id'],'name':r.get('name'),'branch':r.get('head_branch'),'head':r.get('head_sha')})
          record={'main':main['commit']['sha'],'issueCommentCount':count,'latestCommentId':latest,'writeQuietTerminalState':terminal,'v1Contention':blockers}
          (out/'control-preflight.json').write_text(json.dumps(record,indent=2,sort_keys=True)+'\n')
          if blockers: raise SystemExit('real V1 contention')
          PY

      - name: Byte-bind immutable V2 V24B V30 predecessors
        shell: bash
        run: |
          set -euo pipefail
          OUT=deep-twilight-bare-aerosol-renderer-manifest-v31-output
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          out=Path('deep-twilight-bare-aerosol-renderer-manifest-v31-output')
          repo=os.environ['GITHUB_REPOSITORY']
          def gh(path): return json.loads(subprocess.run(['gh','api',path],text=True,capture_output=True,check=True).stdout)
          for stem in ('V2','V24B','V30'):
              run=gh(f"repos/{repo}/actions/runs/{os.environ[stem+'_RUN']}")
              art=gh(f"repos/{repo}/actions/artifacts/{os.environ[stem+'_ARTIFACT']}")
              if run.get('head_sha') != os.environ[stem+'_HEAD'] or run.get('conclusion') != 'success' or run.get('run_attempt') != 1:
                  raise SystemExit(stem+' run identity mismatch')
              if str(art.get('id')) != os.environ[stem+'_ARTIFACT'] or art.get('digest') != os.environ[stem+'_DIGEST'] or art.get('expired'):
                  raise SystemExit(stem+' artifact identity mismatch')
              (out/(stem.lower()+'-run.json')).write_text(json.dumps(run,indent=2,sort_keys=True)+'\n')
              (out/(stem.lower()+'-artifact.json')).write_text(json.dumps(art,indent=2,sort_keys=True)+'\n')
          PY
          for stem in V2 V24B V30; do
            run_var="${stem}_RUN"; art_var="${stem}_ARTIFACT"; dig_var="${stem}_DIGEST"
            art="${!art_var}"; dig="${!dig_var}"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$art/zip" > "$OUT/${stem,,}.zip"
            test "sha256:$(sha256sum "$OUT/${stem,,}.zip" | awk '{print $1}')" = "$dig"
            mkdir "$OUT/${stem,,}"
            unzip -q "$OUT/${stem,,}.zip" -d "$OUT/${stem,,}"
          done

      - name: Build exact raw-bit-preserving renderer manifest
        shell: bash
        run: |
          set -euo pipefail
          OUT=deep-twilight-bare-aerosol-renderer-manifest-v31-output
          python review/deep-twilight-bare-aerosol-renderer-manifest-v31/build_renderer_manifest_v31.py \
            --v2 "$OUT/v2/mystic-entry-raw-v2.json" \
            --v24b "$OUT/v24b/entry-to-scatter-summary.json" \
            --v30 "$OUT/v30/decision-v30.json" \
            --v30-raw "$OUT/v30/final-selector-raw-v30.json" \
            --output-dir "$OUT/render"

      - name: Deterministic translation and raw-authority regressions
        shell: bash
        run: |
          set -euo pipefail
          OUT=deep-twilight-bare-aerosol-renderer-manifest-v31-output
          python - <<'PY'
          import copy, hashlib, json, subprocess, sys
          from pathlib import Path
          out=Path('deep-twilight-bare-aerosol-renderer-manifest-v31-output')
          manifest=json.loads((out/'render/renderer-manifest-v31.json').read_text())
          hg=json.loads((out/'render/hg1-reference-report-v31.json').read_text())
          assert manifest['status']=='PASS_EXACT_BARE_AEROSOL_RENDERER_MANIFEST'
          assert manifest['sourceRuntime']['finalAerosolSelector']==2
          assert manifest['sourceRuntime']['phaseModel']=='HG1'
          assert manifest['translation']['deltaScaleAllExactPositiveZero'] is True
          assert manifest['translation']['deltaTransformReducesToRawBitIdentity'] is True
          assert manifest['translation']['signedZeroPreserved'] is True
          assert manifest['translation']['epsilonSubstitutionUsed'] is False
          assert len(manifest['layers'])==49
          assert sum(x['tauZeroEncoding']=='-0' for x in manifest['layers'])==3
          assert sum(x['tauZeroEncoding']=='+0' for x in manifest['layers'])==0
          assert all(x['tauRawWord']==x['tauEffectiveRawWord'] and x['ssaRawWord']==x['ssaEffectiveRawWord'] for x in manifest['layers'])
          assert manifest['capturedAodExactRational']=={'numerator':659707006899,'denominator':4398046511104}
          assert hg['status']=='PASS_DETERMINISTIC_HG1_ANALYTIC_REFERENCES'
          assert manifest['rendererParityAuthorized'] is False and manifest['korkinGateAuthorized'] is False and manifest['deepScienceAuthorized'] is False
          # Raw-bit authority regression: corrupt audit-only decoded values; manifest bytes must remain unchanged.
          v2=json.loads((out/'v2/mystic-entry-raw-v2.json').read_text())
          for name in ('dt_s','om_s','g1_s','g2_s','f_s','ds_s'):
              row=v2['tables'][name]['rows'][1]
              if 'decodedFloat32AuditOnly' in row: row['decodedFloat32AuditOnly']=[12345.0]*49
          v2_mut=out/'v2-audit-only-mutated.json'; v2_mut.write_text(json.dumps(v2,sort_keys=True)+'\n')
          alt=out/'render-audit-only-mutated'
          subprocess.run([sys.executable,'review/deep-twilight-bare-aerosol-renderer-manifest-v31/build_renderer_manifest_v31.py','--v2',str(v2_mut),'--v24b',str(out/'v24b/entry-to-scatter-summary.json'),'--v30',str(out/'v30/decision-v30.json'),'--v30-raw',str(out/'v30/final-selector-raw-v30.json'),'--output-dir',str(alt)],check=True)
          a=(out/'render/renderer-manifest-v31.json').read_bytes(); b=(alt/'renderer-manifest-v31.json').read_bytes()
          if a != b: raise SystemExit('audit-only decode changed authoritative manifest')
          # Fail-closed selector regression: a tabulated-selector claim must not be silently rendered as HG1.
          bad=json.loads((out/'v30/decision-v30.json').read_text()); bad['finalSelector']=1; bad['selectedPhaseSemantics']='TABULATED_AER'
          badp=out/'v30-bad-selector.json'; badp.write_text(json.dumps(bad,sort_keys=True)+'\n')
          proc=subprocess.run([sys.executable,'review/deep-twilight-bare-aerosol-renderer-manifest-v31/build_renderer_manifest_v31.py','--v2',str(out/'v2/mystic-entry-raw-v2.json'),'--v24b',str(out/'v24b/entry-to-scatter-summary.json'),'--v30',str(badp),'--v30-raw',str(out/'v30/final-selector-raw-v30.json'),'--output-dir',str(out/'should-not-exist')],capture_output=True,text=True)
          if proc.returncode == 0: raise SystemExit('selector mismatch failed open')
          report={'status':'PASS_TRANSLATION_REGRESSIONS','authoritativeManifestSha256':hashlib.sha256(a).hexdigest(),'auditOnlyMutationInvariant':True,'selectorMismatchFailsClosed':True,'negativeZeroTauCount':3,'epsilonSubstitutionUsed':False}
          (out/'translation-regression-report.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: deep-twilight-bare-aerosol-renderer-manifest-v31
          path: deep-twilight-bare-aerosol-renderer-manifest-v31-output
          if-no-files-found: error
          retention-days: 90

      - name: Enforce non-authorizing manifest boundary
        shell: bash
        run: |
          set -euo pipefail
          OUT=deep-twilight-bare-aerosol-renderer-manifest-v31-output
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('deep-twilight-bare-aerosol-renderer-manifest-v31-output')
          m=json.loads((p/'render/renderer-manifest-v31.json').read_text())
          r=json.loads((p/'translation-regression-report.json').read_text())
          assert m['status']=='PASS_EXACT_BARE_AEROSOL_RENDERER_MANIFEST'
          assert r['status']=='PASS_TRANSLATION_REGRESSIONS'
          assert m['rendererParityAuthorized'] is False
          assert m['korkinGateAuthorized'] is False
          assert m['deepScienceAuthorized'] is False
          assert m['levelBChanged'] is False
          assert m['protectedResultOpened'] is False
          assert m['taylorOrJerusalemUsed'] is False
          PY
