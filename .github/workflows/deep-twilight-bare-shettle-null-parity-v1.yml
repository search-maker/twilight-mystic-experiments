name: Deep twilight bare Shettle NULL parity v1

on:
  pull_request:
    paths:
      - review/deep-twilight-bare-shettle-null-parity-v1/**
      - .github/workflows/deep-twilight-bare-shettle-null-parity-v1.yml

permissions:
  contents: read
  pull-requests: read

env:
  FROZEN_BASE: 9ae60a3283046fb977bfb2fb88b1c90ef583cc2d
  EXPECTED_UVSPEC_SHA256: 2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3
  EXPECTED_BASE_DATA_SHA256: ad30b49177e9c84e46497d69faf0c75e466996b0d0003f1de210289ae9f847d7

jobs:
  null-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind zero-science review identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_HEAD_REF" = review/deep-twilight-bare-shettle-null-parity-v1
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "$FROZEN_BASE"
          mapfile -t changed < <(git diff --name-only "$FROZEN_BASE"...HEAD | sort)
          printf '%s\n' "${changed[@]}"
          expected=(
            .github/workflows/deep-twilight-bare-shettle-null-parity-v1.yml
            review/deep-twilight-bare-shettle-null-parity-v1/PROTOCOL.md
            review/deep-twilight-bare-shettle-null-parity-v1/probe.py
          )
          test "${#changed[@]}" = "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: deep-twilight-bare-shettle-null-parity-v1
          create-args: -c conda-forge python=3.12.4 rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Verify exact installed runtime and parser controls
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          mkdir -p evidence
          python -m py_compile review/deep-twilight-bare-shettle-null-parity-v1/probe.py
          python experiments/mystic-batch-v1/runtime_probe.py \
            --uvspec "$(command -v uvspec)" \
            --data-dir "$CONDA_PREFIX/share/libRadtran/data" \
            --atmosphere "$CONDA_PREFIX/share/libRadtran/data/atmmod/afglus.dat" \
            --runtime-lock experiments/mystic-batch-v1/runtime-lock.micromamba.json \
            --skip-help \
            --output evidence/runtime-report.json
          python - <<'PY'
          import json, os
          x=json.load(open('evidence/runtime-report.json'))
          if x['uvspecSha256'] != os.environ['EXPECTED_UVSPEC_SHA256']: raise SystemExit('uvspec SHA drift')
          if x['libRadtranDataTreeSha256'] != os.environ['EXPECTED_BASE_DATA_SHA256']: raise SystemExit('base data-tree drift')
          if x['scientificSolverExecuted'] is not False or x['syntaxCheckExecuted'] is not False: raise SystemExit('runtime probe boundary crossed')
          PY
          python - <<'PY'
          import importlib.util, tempfile
          from pathlib import Path
          p=Path('review/deep-twilight-bare-shettle-null-parity-v1/probe.py')
          s=importlib.util.spec_from_file_location('probe',p); m=importlib.util.module_from_spec(s); s.loader.exec_module(m)
          rows=[]
          for i in range(49):
              rows.append(f'{i:5d} | {48-i:9.4f} | 1e-3 |  {0.001 if i==48 else 0.0:.6f}  0.000000 {0.700 if i==48 else 0.000:.3f} | 0 0 0 | 0 0 0 | 0')
          sample='*** optical_properties()\n'+'\n'.join(rows)+'\n  sum | -nan | 0 |  0.001000  0.000000 -nan | 0 0 -nan | 0 0 -nan | 0\n*** last solver call: 0\n'
          with tempfile.TemporaryDirectory() as td:
              f=Path(td)/'v.err'; f.write_text(sample); x=m.parse_optical_properties(f)
              assert x['layerCount']==49 and abs(x['sumLine']['aerosolTauPrinted']-0.001)<1e-12
              assert x['rows'][0]['aerosolTauPrintInterval'][0] == 0.0
              assert x['rows'][0]['aerosolTauPrintInterval'][1] == 1e-6
          print('parser/printed-zero control: PASS')
          PY

      - name: Freeze exact nine NULL inputs
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          python review/deep-twilight-bare-shettle-null-parity-v1/probe.py prepare \
            --data-dir "$CONDA_PREFIX/share/libRadtran/data" \
            --repo-root "$GITHUB_WORKSPACE" \
            --output inputs > evidence/prepare.json
          cp inputs/input-manifest.json inputs/*.inp evidence/
          test "$(find inputs -name '*.inp' | wc -l)" = 9
          for f in inputs/*.inp; do
            grep -Fx 'rte_solver null' "$f"
            grep -Fx 'aerosol_default' "$f"
            ! grep -Eiq 'OPAC|aerosol_species|rte_solver[[:space:]]+(disort|mystic|montecarlo|twostr|sdisort|fdisort|sos)' "$f"
          done
          grep -Fx 'aerosol_set_tau_at_wvl 550 0.150000' inputs/w550-f1.inp
          grep -Fx 'aerosol_set_tau_at_wvl 550 15.000000' inputs/w550-f100.inp
          grep -Fx 'aerosol_set_tau_at_wvl 550 1500.000000' inputs/w550-f10000.inp

      - name: Execute nine NULL-only optical-property probes
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          : > evidence/execution-status.csv
          echo 'caseId,exitCode' >> evidence/execution-status.csv
          failed=0
          for f in inputs/*.inp; do
            name=$(basename "$f" .inp)
            set +e
            timeout 180 uvspec < "$f" > "evidence/$name.out" 2> "evidence/$name.verbose.err"
            rc=$?
            set -e
            echo "$name,$rc" >> evidence/execution-status.csv
            if [ "$rc" -ne 0 ]; then failed=1; fi
          done
          if [ "$failed" -eq 0 ]; then
            python review/deep-twilight-bare-shettle-null-parity-v1/probe.py freeze \
              --evidence evidence --manifest inputs/input-manifest.json > evidence/freeze.json
          else
            python - <<'PY'
          import hashlib, json
          from pathlib import Path
          status=Path('evidence/execution-status.csv').read_text()
          report={
            'schemaVersion':1,
            'stageId':'deep-twilight-bare-shettle-null-parity-v1',
            'status':'AMPLIFICATION_PARITY_CAPABILITY_UNRESOLVED',
            'reason':'ONE_OR_MORE_FIXED_NULL_ARMS_NONZERO_EXIT',
            'executionStatusCsvSha256':hashlib.sha256(status.encode()).hexdigest(),
            'scientificRadiativeTransferSolved':False,
            'mysticExecuted':False,
            'scientificOrdinalAllocated':False,
            'deepRadianceOpened':False,
            'rendererAuthorized':False,
            'eradiateRadianceAuthorized':False,
            'levelBV1Changed':False,
            'taylorOrJerusalemUsed':False,
            'productionAuthorized':False,
            'next':'Do not add or adapt amplification scales; use only the separately preregistered post-redistribution diagnostic serializer path.'
          }
          Path('evidence/parity-report.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          PY
          fi

      - name: Enforce claim boundary
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          x=json.load(open('evidence/parity-report.json'))
          if x['status'] not in {'PASS_BARE_SHETTLE_FIXED_AMPLIFICATION_PARITY','AMPLIFICATION_PARITY_CAPABILITY_UNRESOLVED'}:
              raise SystemExit('unexpected capability status')
          for k in ('scientificRadiativeTransferSolved','mysticExecuted','scientificOrdinalAllocated','deepRadianceOpened','rendererAuthorized','eradiateRadianceAuthorized','levelBV1Changed','taylorOrJerusalemUsed','productionAuthorized'):
              if x.get(k) is not False: raise SystemExit(f'claim boundary crossed: {k}')
          print(x['status'])
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: deep-twilight-bare-shettle-null-parity-v1
          path: evidence/
          if-no-files-found: error
          compression-level: 0
