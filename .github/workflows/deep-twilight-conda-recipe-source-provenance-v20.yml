name: Deep twilight exact conda recipe/source provenance v20

on:
  push:
    branches:
      - review/deep-twilight-conda-recipe-source-provenance-v20
    paths:
      - ".github/workflows/deep-twilight-conda-recipe-source-provenance-v20.yml"

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  exact-conda-recipe-source-v20:
    if: >-
      github.run_attempt == 1 &&
      github.event.before == 'fe6e063c568394ae7b4e90222de270d3f2460455'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN: fe6e063c568394ae7b4e90222de270d3f2460455
      UVSPEC_SHA256: 2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3
      EXACT_PACKAGE: rubin-libradtran=2.0.6=py312pl5321he9373c2_1
      V19_RUN: '34016108921'
      V19_HEAD: 7da3f6547eec4aa45aff40d69194e495602488f4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Freeze provenance-only V20 scope and fail closed on real V1 contention
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/review/deep-twilight-conda-recipe-source-provenance-v20"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "${{ github.event.before }}" = "$EXPECTED_MAIN"
          OUT=deep-twilight-conda-recipe-source-provenance-v20-output
          mkdir -p "$OUT"
          cat > "$OUT/PROTOCOL.txt" <<'EOF'
          DEEP TWILIGHT EXACT CONDA RECIPE/SOURCE PROVENANCE V20
          STATIC PROVENANCE ONLY / NO UVSPEC EXECUTION / NO RNG / NO MYSTIC BODY / NO PHOTONS

          V19 established that the installed environment itself does not ship libRadtran C source, while the pinned
          executable remains hash-bound and exposes exact installed headers/static symbols. V20 follows the exact conda
          package identity back to its immutable package archive and embedded build recipe. It verifies the downloaded
          conda package archive against the exact conda-meta SHA-256, extracts info/recipe bytes, records all source URLs,
          source hashes, revisions, patches and build scripts, then makes at most one direct result-blind retrieval of a
          recipe-declared HTTP(S) source archive when an exact SHA-256 is present.

          A retrieved source archive is authoritative for this lane ONLY if its raw SHA-256 equals the recipe-declared
          SHA-256. A mismatch is evidence of source-serving drift and MUST NOT be extracted or used for semantics.
          If the recipe-declared source hash matches, V20 hashes and excerpts only the exact files that govern MYSTIC
          optical-property translation (mystic.c and related call-path sources). No post-result source substitution.

          This is provenance recovery, not science. No protected result, Taylor/Jerusalem, Level-B change, epsilon,
          seed/ordinal/identity consumption, or solver execution. NEVER rerun/retry/resume; successors use fresh heads.
          EOF
          gh api "repos/$GITHUB_REPOSITORY/issues/60" > "$OUT/issue60-preflight.json"
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$OUT/main-preflight.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V19_RUN" > "$OUT/v19-run.json"
          python - <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          root=Path('deep-twilight-conda-recipe-source-provenance-v20-output')
          main=json.loads((root/'main-preflight.json').read_text()); v19=json.loads((root/'v19-run.json').read_text())
          if main['commit']['sha'] != os.environ['EXPECTED_MAIN']: raise SystemExit('main changed; fail closed')
          if v19.get('head_sha') != os.environ['V19_HEAD'] or v19.get('conclusion')!='success' or v19.get('run_attempt')!=1:
              raise SystemExit('V19 exact predecessor identity mismatch')
          repo=os.environ['GITHUB_REPOSITORY']; current=int(os.environ['GITHUB_RUN_ID']); blockers=[]
          needles=('reptran','recovery4','ordinal45','avps','level-b','level b','lowalt')
          for status in ('in_progress','queued'):
              p=subprocess.run(['gh','api',f'repos/{repo}/actions/runs?status={status}&per_page=100'],text=True,capture_output=True,check=True)
              for r in json.loads(p.stdout).get('workflow_runs',[]):
                  if int(r['id'])==current: continue
                  text=(str(r.get('name',''))+' '+str(r.get('head_branch',''))).lower()
                  if any(n in text for n in needles): blockers.append((status,r['id'],r.get('name'),r.get('head_branch')))
          if blockers: print('actual V1 contention detected:',blockers); sys.exit(43)
          PY

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: deep-twilight-conda-recipe-source-provenance-v20
          create-args: >-
            -c conda-forge
            python=3.12.4
            pyyaml
            conda-package-handling
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Bind installed package metadata and retrieve exact conda archive once
        shell: bash -el {0}
        run: |
          set -euo pipefail
          OUT=deep-twilight-conda-recipe-source-provenance-v20-output
          UVSPEC="$(command -v uvspec)"
          test "$(sha256sum "$UVSPEC" | awk '{print $1}')" = "$UVSPEC_SHA256"
          META="$CONDA_PREFIX/conda-meta/rubin-libradtran-2.0.6-py312pl5321he9373c2_1.json"
          test -f "$META"
          cp "$META" "$OUT/exact-conda-meta.json"
          micromamba list --explicit > "$OUT/runtime-package-explicit.txt"
          python - <<'PY'
          from pathlib import Path
          import json,os
          root=Path('deep-twilight-conda-recipe-source-provenance-v20-output')
          meta=json.loads((root/'exact-conda-meta.json').read_text())
          rec={k:meta.get(k) for k in ('name','version','build','build_number','subdir','channel','url','fn','md5','sha256')}
          if rec['name']!='rubin-libradtran' or rec['version']!='2.0.6' or rec['build']!='py312pl5321he9373c2_1': raise SystemExit('unexpected exact package metadata')
          if not isinstance(rec.get('url'),str) or not rec['url'].startswith(('https://','http://')): raise SystemExit('exact package URL absent')
          if not isinstance(rec.get('sha256'),str) or len(rec['sha256'])!=64: raise SystemExit('exact package SHA-256 absent')
          (root/'exact-package-origin.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n')
          (root/'package-url.txt').write_text(rec['url']+'\n')
          (root/'package-sha256-expected.txt').write_text(rec['sha256']+'\n')
          PY
          PKGURL="$(cat "$OUT/package-url.txt")"
          PKGFILE="$OUT/$(basename "${PKGURL%%\?*}")"
          curl -L --fail --silent --show-error "$PKGURL" -o "$PKGFILE"
          ACTUAL="$(sha256sum "$PKGFILE" | awk '{print $1}')"
          EXPECTED="$(cat "$OUT/package-sha256-expected.txt")"
          printf '%s  %s\n' "$ACTUAL" "$(basename "$PKGFILE")" > "$OUT/package-archive-sha256.txt"
          test "$ACTUAL" = "$EXPECTED"
          printf '%s\n' "$PKGFILE" > "$OUT/package-archive-path.txt"

      - name: Extract exact embedded recipe and freeze source specification
        shell: bash -el {0}
        run: |
          set -euo pipefail
          OUT=deep-twilight-conda-recipe-source-provenance-v20-output
          PKGFILE="$(cat "$OUT/package-archive-path.txt")"
          mkdir -p "$OUT/extracted-package"
          python - <<'PY'
          from conda_package_handling.api import extract
          from pathlib import Path
          root=Path('deep-twilight-conda-recipe-source-provenance-v20-output')
          pkg=Path((root/'package-archive-path.txt').read_text().strip())
          dest=root/'extracted-package'
          extract(str(pkg),dest_dir=str(dest))
          PY
          find "$OUT/extracted-package/info" -type f -printf '%P\n' 2>/dev/null | LC_ALL=C sort > "$OUT/info-files.txt" || true
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,re,yaml
          root=Path('deep-twilight-conda-recipe-source-provenance-v20-output'); info=root/'extracted-package'/'info'
          hashes={}
          if info.exists():
              for p in sorted(info.rglob('*')):
                  if p.is_file(): hashes[str(p.relative_to(info))]=hashlib.sha256(p.read_bytes()).hexdigest()
          (root/'info-file-sha256.json').write_text(json.dumps(hashes,indent=2,sort_keys=True)+'\n')
          recipe=info/'recipe'
          candidates=[]
          if recipe.exists():
              for p in sorted(recipe.rglob('*')):
                  if p.is_file():
                      try: txt=p.read_text(errors='strict')
                      except Exception: continue
                      rel=str(p.relative_to(recipe));
                      if re.search(r'(^|\n)\s*(source|url|sha256|md5|git_url|git_rev|git_tag|patches)\s*:',txt,re.M) or rel.endswith(('meta.yaml','build.sh','conda_build_config.yaml')):
                          candidates.append({'path':rel,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'text':txt})
          (root/'recipe-provenance-files.json').write_text(json.dumps([{k:v for k,v in x.items() if k!='text'} for x in candidates],indent=2,sort_keys=True)+'\n')
          (root/'recipe-provenance-text.txt').write_text('\n\n'.join(f'===== {x["path"]} =====\n{x["text"]}' for x in candidates)+'\n')
          # Prefer rendered meta.yaml; parse YAML when possible, otherwise retain exact bytes and regex a simple source mapping.
          metas=[x for x in candidates if x['path'].endswith('meta.yaml')]
          spec={'parseMode':'none','url':None,'sha256':None,'md5':None,'git_url':None,'git_rev':None,'patches':[]}
          if metas:
              txt=metas[0]['text']
              try:
                  obj=yaml.safe_load(txt); src=obj.get('source') if isinstance(obj,dict) else None
                  if isinstance(src,list): src=src[0] if src else None
                  if isinstance(src,dict):
                      spec.update({k:src.get(k) for k in ('url','sha256','md5','git_url','git_rev')})
                      spec['patches']=src.get('patches') or []
                      if isinstance(spec['url'],list): spec['url']=spec['url'][0] if spec['url'] else None
                      spec['parseMode']='yaml'
              except Exception:
                  pass
              if spec['parseMode']=='none':
                  m=re.search(r'(?ms)^source:\s*\n(?P<body>(?:^[ \t]+.*\n?)+)',txt)
                  body=m.group('body') if m else ''
                  for k in ('url','sha256','md5','git_url','git_rev'):
                      q=re.search(rf'(?m)^\s+{k}:\s*["\']?([^"\'\n#]+)',body)
                      if q: spec[k]=q.group(1).strip()
                  spec['parseMode']='regex'
          (root/'recipe-source-spec.json').write_text(json.dumps(spec,indent=2,sort_keys=True)+'\n')
          PY

      - name: Retrieve recipe-declared source once when exact HTTP SHA-256 exists
        shell: bash -el {0}
        run: |
          set -euo pipefail
          OUT=deep-twilight-conda-recipe-source-provenance-v20-output
          python - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('deep-twilight-conda-recipe-source-provenance-v20-output'); spec=json.loads((root/'recipe-source-spec.json').read_text())
          url=spec.get('url'); sha=spec.get('sha256')
          eligible=isinstance(url,str) and url.startswith(('https://','http://')) and isinstance(sha,str) and bool(re.fullmatch(r'[0-9a-fA-F]{64}',sha))
          (root/'source-retrieval-eligibility.json').write_text(json.dumps({'eligible':eligible,'url':url,'expectedSha256':sha},indent=2,sort_keys=True)+'\n')
          PY
          ELIGIBLE="$(python -c 'import json; print(str(json.load(open("deep-twilight-conda-recipe-source-provenance-v20-output/source-retrieval-eligibility.json"))["eligible"]).lower())')"
          if test "$ELIGIBLE" != true; then
            printf '%s\n' 'SOURCE_RETRIEVAL_NOT_ELIGIBLE_NO_EXACT_HTTP_SHA256' > "$OUT/source-retrieval-status.txt"
            exit 0
          fi
          SRCURL="$(python -c 'import json; print(json.load(open("deep-twilight-conda-recipe-source-provenance-v20-output/source-retrieval-eligibility.json"))["url"])')"
          EXPECTED="$(python -c 'import json; print(json.load(open("deep-twilight-conda-recipe-source-provenance-v20-output/source-retrieval-eligibility.json"))["expectedSha256"])')"
          SRC="$OUT/declared-source-$(basename "${SRCURL%%\?*}")"
          set +e
          curl -L --fail --silent --show-error "$SRCURL" -o "$SRC"
          RC=$?
          set -e
          if test "$RC" -ne 0; then
            printf 'SOURCE_HTTP_FETCH_FAILED rc=%s\n' "$RC" > "$OUT/source-retrieval-status.txt"
            exit 0
          fi
          ACTUAL="$(sha256sum "$SRC" | awk '{print $1}')"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED" "$ACTUAL" > "$OUT/source-archive-sha256.txt"
          if test "$ACTUAL" != "$EXPECTED"; then
            printf '%s\n' 'SOURCE_SHA256_MISMATCH_FAIL_CLOSED_NO_EXTRACTION' > "$OUT/source-retrieval-status.txt"
            exit 0
          fi
          printf '%s\n' 'SOURCE_SHA256_MATCH_AUTHORITATIVE_RECIPE_BYTES' > "$OUT/source-retrieval-status.txt"
          mkdir -p "$OUT/declared-source-extracted"
          tar -xf "$SRC" -C "$OUT/declared-source-extracted"
          find "$OUT/declared-source-extracted" -type f -printf '%P\n' | LC_ALL=C sort > "$OUT/declared-source-files.txt"
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,re
          root=Path('deep-twilight-conda-recipe-source-provenance-v20-output'); src=root/'declared-source-extracted'
          names={'mystic.c','uvspec.c','solve_rte.c','rte_solver.c','mystic.h'}
          terms=re.compile(r'(int\s+mystic\s*\(|convert_caoth_mystic|sc_HG2_mu|mu_scatter|delta_scale_hg|delta_scale\s*\(|get_phase_matrix_caoth|get_phase_matrix_total|\bf_s\b|\bds_s\b)')
          hits=[]; files=[]
          for p in sorted(src.rglob('*')):
              if not p.is_file(): continue
              try: data=p.read_bytes(); text=data.decode('utf-8')
              except Exception: continue
              if p.name in names or terms.search(text):
                  rec={'path':str(p.relative_to(src)),'sha256':hashlib.sha256(data).hexdigest(),'size':len(data)}; files.append(rec)
                  lines=text.splitlines()
                  for i,line in enumerate(lines):
                      if terms.search(line):
                          a=max(0,i-10); b=min(len(lines),i+11)
                          hits.append(f'===== {rec["path"]}:{i+1} =====\n'+'\n'.join(f'{j+1:05d}: {lines[j]}' for j in range(a,b)))
          (root/'governing-source-file-hashes.json').write_text(json.dumps(files,indent=2,sort_keys=True)+'\n')
          (root/'governing-source-target-context.txt').write_text('\n\n'.join(hits[:5000])+'\n')
          PY

      - name: Build bounded provenance disposition
        shell: bash -el {0}
        run: |
          set -euo pipefail
          OUT=deep-twilight-conda-recipe-source-provenance-v20-output
          python - <<'PY'
          from pathlib import Path
          import json,os,hashlib
          root=Path('deep-twilight-conda-recipe-source-provenance-v20-output')
          origin=json.loads((root/'exact-package-origin.json').read_text()); spec=json.loads((root/'recipe-source-spec.json').read_text()); status=(root/'source-retrieval-status.txt').read_text().strip()
          gov=[]
          if (root/'governing-source-file-hashes.json').exists(): gov=json.loads((root/'governing-source-file-hashes.json').read_text())
          facts={
            'exactCondaArchiveSha256Verified':True,
            'recipeSourceSpec':spec,
            'sourceRetrievalStatus':status,
            'authoritativeSourceRecovered':status.startswith('SOURCE_SHA256_MATCH'),
            'governingSourceFileCount':len(gov),
            'uvspecExecuted':False,'rngInitialized':False,'seedConsumed':False,'mysticBodyExecuted':False,'photonTraced':False,
            'protectedResultOpened':False,'levelBChanged':False,'taylorOrJerusalemUsed':False,'epsilonSubstitutionUsed':False,
          }
          recipe=(root/'recipe-provenance-text.txt').read_text(errors='replace'); ctx=(root/'governing-source-target-context.txt').read_text(errors='replace') if (root/'governing-source-target-context.txt').exists() else ''
          (root/'V20_READOUT.json').write_text(json.dumps({'facts':facts,'packageOrigin':origin,'governingFiles':gov},indent=2,sort_keys=True)+'\n')
          body=['DEEP_TWILIGHT::EXACT_CONDA_RECIPE_SOURCE_PROVENANCE_V20_READOUT','',f'fence_main={os.environ["EXPECTED_MAIN"]}',f'branch={os.environ["GITHUB_REF_NAME"]}',f'head={os.environ["GITHUB_SHA"]}',f'run={os.environ["GITHUB_RUN_ID"]} attempt1',f'package={os.environ["EXACT_PACKAGE"]}',f'uvspec_sha256={os.environ["UVSPEC_SHA256"]}','STATIC_PROVENANCE_ONLY=true; uvspecExecuted=false; rngInitialized=false; seedConsumed=false; mysticBodyExecuted=false; photonTraced=false','protectedResultOpened=false; levelBChanged=false; Taylor/Jerusalem=false; epsilonSubstitution=false','','Mechanical disposition:','```json',json.dumps(facts,indent=2,sort_keys=True),'```','','Exact conda package origin:','```json',json.dumps(origin,indent=2,sort_keys=True),'```','','Exact embedded recipe/source specification:','```text',recipe[:30000],'```']
          if gov:
              body += ['','Recipe-hash-matched governing source files:','```json',json.dumps(gov,indent=2,sort_keys=True)[:16000],'```','','Bounded governing source contexts:','```text',ctx[:30000],'```']
          body += ['','CLAIM_BOUNDARY: only a recipe-declared source archive whose raw SHA-256 equals the exact embedded recipe SHA-256 is treated as governing source. Mismatched/currently-served bytes remain non-authoritative. No result-dependent substitution, no renderer-parity promotion from provenance alone, and no Level-B change.']
          (root/'ISSUE_COMMENT.md').write_text('\n'.join(body)+'\n')
          manifest={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.iterdir()) if p.is_file()}
          (root/'evidence-sha256.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          PY

      - name: Upload immutable V20 provenance evidence
        uses: actions/upload-artifact@v4
        with:
          name: deep-twilight-conda-recipe-source-provenance-v20
          path: deep-twilight-conda-recipe-source-provenance-v20-output/
          if-no-files-found: error
          retention-days: 90

      - name: Fresh control and contention guard before checkpoint
        shell: bash
        run: |
          set -euo pipefail
          OUT=deep-twilight-conda-recipe-source-provenance-v20-output
          gh api "repos/$GITHUB_REPOSITORY/issues/60" > "$OUT/issue60-precomment.json"
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$OUT/main-precomment.json"
          python - <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          root=Path('deep-twilight-conda-recipe-source-provenance-v20-output'); main=json.loads((root/'main-precomment.json').read_text())
          if main['commit']['sha'] != os.environ['EXPECTED_MAIN']: raise SystemExit('main changed; fail closed')
          repo=os.environ['GITHUB_REPOSITORY']; current=int(os.environ['GITHUB_RUN_ID']); blockers=[]; needles=('reptran','recovery4','ordinal45','avps','level-b','level b','lowalt')
          for status in ('in_progress','queued'):
              p=subprocess.run(['gh','api',f'repos/{repo}/actions/runs?status={status}&per_page=100'],text=True,capture_output=True,check=True)
              for r in json.loads(p.stdout).get('workflow_runs',[]):
                  if int(r['id'])==current: continue
                  text=(str(r.get('name',''))+' '+str(r.get('head_branch',''))).lower()
                  if any(n in text for n in needles): blockers.append((status,r['id'],r.get('name'),r.get('head_branch')))
          if blockers: print('actual V1 contention before checkpoint:',blockers); sys.exit(44)
          PY

      - name: Persist bounded V20 checkpoint to Issue 60
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 60 --repo "$GITHUB_REPOSITORY" --body-file deep-twilight-conda-recipe-source-provenance-v20-output/ISSUE_COMMENT.md
