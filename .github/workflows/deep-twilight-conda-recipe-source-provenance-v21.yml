name: Deep twilight robust exact conda recipe/source provenance v21

on:
  push:
    branches:
      - review/deep-twilight-conda-recipe-source-provenance-v21
    paths:
      - ".github/workflows/deep-twilight-conda-recipe-source-provenance-v21.yml"

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  exact-conda-recipe-source-v21:
    if: >-
      github.run_attempt == 1 &&
      github.event.before == 'fe6e063c568394ae7b4e90222de270d3f2460455'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN: fe6e063c568394ae7b4e90222de270d3f2460455
      UVSPEC_SHA256: 2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3
      EXACT_PACKAGE: rubin-libradtran=2.0.6=py312pl5321he9373c2_1
      V19_RUN: '34016108921'
      V19_HEAD: 7da3f6547eec4aa45aff40d69194e495602488f4
      V20_RUN: '34016261936'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Freeze corrected V21 provenance scope and fail closed on real V1 contention
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/review/deep-twilight-conda-recipe-source-provenance-v21"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "${{ github.event.before }}" = "$EXPECTED_MAIN"
          OUT=deep-twilight-conda-recipe-source-provenance-v21-output
          mkdir -p "$OUT"
          cat > "$OUT/PROTOCOL.txt" <<'EOF'
          DEEP TWILIGHT ROBUST EXACT CONDA RECIPE/SOURCE PROVENANCE V21
          STATIC PROVENANCE ONLY / NO UVSPEC EXECUTION / NO RNG / NO MYSTIC BODY / NO PHOTONS

          V20 attempt1 is consumed terminal FAILURE after it had already verified/extracted the exact conda package;
          its source-retrieval stage failed before evidence upload. V21 is a fresh successor, not a rerun. It keeps the
          exact same provenance question but makes all remote-source outcomes explicit evidence states rather than job
          failures: HTTP failure, SHA mismatch, archive-format failure, or exact SHA match.

          The exact conda package archive remains authority only after conda-meta SHA-256 verification. Embedded recipe
          bytes are hashed. A recipe-declared source archive is authoritative only if its raw SHA-256 equals the embedded
          recipe-declared SHA-256. On mismatch, it is never extracted or used for semantics. On exact match, extraction
          is read-only and only target governing source files/contexts are hashed and recorded.

          No protected result, Taylor/Jerusalem, Level-B change, epsilon, science identity, seed, solver or photon.
          NEVER rerun/retry/resume; any successor uses a fresh branch/head.
          EOF
          gh api "repos/$GITHUB_REPOSITORY/issues/60" > "$OUT/issue60-preflight.json"
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$OUT/main-preflight.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V19_RUN" > "$OUT/v19-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V20_RUN" > "$OUT/v20-run.json"
          python - <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          root=Path('deep-twilight-conda-recipe-source-provenance-v21-output')
          main=json.loads((root/'main-preflight.json').read_text()); v19=json.loads((root/'v19-run.json').read_text()); v20=json.loads((root/'v20-run.json').read_text())
          if main['commit']['sha'] != os.environ['EXPECTED_MAIN']: raise SystemExit('main changed; fail closed')
          if v19.get('head_sha') != os.environ['V19_HEAD'] or v19.get('conclusion')!='success' or v19.get('run_attempt')!=1: raise SystemExit('V19 identity mismatch')
          if v20.get('conclusion')!='failure' or v20.get('run_attempt')!=1: raise SystemExit('V20 consumed-failure identity mismatch')
          repo=os.environ['GITHUB_REPOSITORY']; current=int(os.environ['GITHUB_RUN_ID']); blockers=[]; needles=('reptran','recovery4','ordinal45','avps','level-b','level b','lowalt')
          for status in ('in_progress','queued'):
              p=subprocess.run(['gh','api',f'repos/{repo}/actions/runs?status={status}&per_page=100'],text=True,capture_output=True,check=True)
              for r in json.loads(p.stdout).get('workflow_runs',[]):
                  if int(r['id'])==current: continue
                  text=(str(r.get('name',''))+' '+str(r.get('head_branch',''))).lower()
                  if any(n in text for n in needles): blockers.append((status,r['id'],r.get('name'),r.get('head_branch')))
          if blockers: print('actual V1 contention detected:',blockers); sys.exit(43)
          PY

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: deep-twilight-conda-recipe-source-provenance-v21
          create-args: >-
            -c conda-forge
            python=3.12.4
            pyyaml
            conda-package-handling
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Recover exact conda archive, embedded recipe, and remote-source disposition
        shell: bash -el {0}
        run: |
          set -euo pipefail
          OUT=deep-twilight-conda-recipe-source-provenance-v21-output
          UVSPEC="$(command -v uvspec)"
          test "$(sha256sum "$UVSPEC" | awk '{print $1}')" = "$UVSPEC_SHA256"
          META="$CONDA_PREFIX/conda-meta/rubin-libradtran-2.0.6-py312pl5321he9373c2_1.json"
          test -f "$META"
          cp "$META" "$OUT/exact-conda-meta.json"
          micromamba list --explicit > "$OUT/runtime-package-explicit.txt"
          python - <<'PY'
          from conda_package_handling.api import extract
          from pathlib import Path
          import urllib.request,urllib.error,hashlib,json,re,yaml,tarfile,zipfile,shutil,os,traceback
          root=Path('deep-twilight-conda-recipe-source-provenance-v21-output')
          meta=json.loads((root/'exact-conda-meta.json').read_text())
          origin={k:meta.get(k) for k in ('name','version','build','build_number','subdir','channel','url','fn','md5','sha256')}
          if origin['name']!='rubin-libradtran' or origin['version']!='2.0.6' or origin['build']!='py312pl5321he9373c2_1': raise SystemExit('unexpected package identity')
          if not isinstance(origin.get('url'),str) or not origin['url'].startswith(('https://','http://')): raise SystemExit('package URL absent')
          if not isinstance(origin.get('sha256'),str) or not re.fullmatch(r'[0-9a-fA-F]{64}',origin['sha256']): raise SystemExit('package SHA256 absent')
          (root/'exact-package-origin.json').write_text(json.dumps(origin,indent=2,sort_keys=True)+'\n')
          pkg=root/Path(origin.get('fn') or origin['url'].split('/')[-1]).name
          with urllib.request.urlopen(origin['url'],timeout=30) as r, pkg.open('wb') as f: shutil.copyfileobj(r,f)
          package_actual=hashlib.sha256(pkg.read_bytes()).hexdigest()
          (root/'package-archive-sha256.json').write_text(json.dumps({'expected':origin['sha256'],'actual':package_actual,'match':package_actual.lower()==origin['sha256'].lower()},indent=2,sort_keys=True)+'\n')
          if package_actual.lower()!=origin['sha256'].lower(): raise SystemExit('exact conda archive SHA256 mismatch')
          dest=root/'extracted-package'; dest.mkdir()
          extract(str(pkg),dest_dir=str(dest))
          info=dest/'info'; recipe=info/'recipe'
          info_hashes={}
          if info.exists():
              for p in sorted(info.rglob('*')):
                  if p.is_file(): info_hashes[str(p.relative_to(info))]=hashlib.sha256(p.read_bytes()).hexdigest()
          (root/'info-file-sha256.json').write_text(json.dumps(info_hashes,indent=2,sort_keys=True)+'\n')
          recipe_files=[]
          if recipe.exists():
              for p in sorted(recipe.rglob('*')):
                  if p.is_file():
                      try: txt=p.read_text(errors='strict')
                      except Exception: continue
                      recipe_files.append({'path':str(p.relative_to(recipe)),'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'text':txt})
          (root/'recipe-file-hashes.json').write_text(json.dumps([{k:v for k,v in x.items() if k!='text'} for x in recipe_files],indent=2,sort_keys=True)+'\n')
          (root/'recipe-exact-text.txt').write_text('\n\n'.join(f'===== {x["path"]} =====\n{x["text"]}' for x in recipe_files)+'\n')
          spec={'parseMode':'none','url':None,'sha256':None,'md5':None,'git_url':None,'git_rev':None,'patches':[]}
          metas=[x for x in recipe_files if x['path'].endswith('meta.yaml')]
          if metas:
              txt=metas[0]['text']
              try:
                  obj=yaml.safe_load(txt); src=obj.get('source') if isinstance(obj,dict) else None
                  if isinstance(src,list): src=src[0] if src else None
                  if isinstance(src,dict):
                      for k in ('url','sha256','md5','git_url','git_rev'): spec[k]=src.get(k)
                      spec['patches']=src.get('patches') or []
                      if isinstance(spec['url'],list): spec['url']=spec['url'][0] if spec['url'] else None
                      spec['parseMode']='yaml'
              except Exception: pass
              if spec['parseMode']=='none':
                  m=re.search(r'(?ms)^source:\s*\n(?P<body>(?:^[ \t]+.*\n?)+)',txt); body=m.group('body') if m else ''
                  for k in ('url','sha256','md5','git_url','git_rev'):
                      q=re.search(rf'(?m)^\s+{k}:\s*["\']?([^"\'\n#]+)',body)
                      if q: spec[k]=q.group(1).strip()
                  spec['parseMode']='regex'
          (root/'recipe-source-spec.json').write_text(json.dumps(spec,indent=2,sort_keys=True)+'\n')
          remote={'attempted':False,'status':'NO_EXACT_HTTP_SHA256','url':spec.get('url'),'expectedSha256':spec.get('sha256'),'actualSha256':None,'httpStatus':None,'error':None,'authoritative':False,'archiveFormat':None,'extracted':False}
          url=spec.get('url'); expected=spec.get('sha256')
          if isinstance(url,str) and url.startswith(('https://','http://')) and isinstance(expected,str) and re.fullmatch(r'[0-9a-fA-F]{64}',expected):
              remote['attempted']=True
              src=root/'recipe-declared-source.bin'
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'deep-twilight-provenance-v21/1.0'})
                  with urllib.request.urlopen(req,timeout=30) as r, src.open('wb') as f:
                      remote['httpStatus']=getattr(r,'status',None); shutil.copyfileobj(r,f)
                  actual=hashlib.sha256(src.read_bytes()).hexdigest(); remote['actualSha256']=actual
                  if actual.lower()!=expected.lower():
                      remote['status']='SOURCE_SHA256_MISMATCH_FAIL_CLOSED'; remote['authoritative']=False
                  else:
                      remote['status']='SOURCE_SHA256_MATCH'; remote['authoritative']=True
                      ext=root/'governing-source'; ext.mkdir()
                      try:
                          if tarfile.is_tarfile(src):
                              remote['archiveFormat']='tar';
                              with tarfile.open(src,'r:*') as tf: tf.extractall(ext,filter='data')
                          elif zipfile.is_zipfile(src):
                              remote['archiveFormat']='zip';
                              with zipfile.ZipFile(src) as zf: zf.extractall(ext)
                          else:
                              remote['archiveFormat']='unknown'; raise ValueError('recipe-hash-matched source has unsupported archive format')
                          remote['extracted']=True
                      except Exception as e:
                          remote['status']='SOURCE_SHA256_MATCH_ARCHIVE_EXTRACTION_FAILED'; remote['error']=repr(e); remote['extracted']=False
              except Exception as e:
                  remote['status']='SOURCE_HTTP_FETCH_FAILED'; remote['error']=repr(e)
          (root/'remote-source-disposition.json').write_text(json.dumps(remote,indent=2,sort_keys=True)+'\n')
          gov=[]; contexts=[]
          if remote['authoritative'] and remote['extracted']:
              srcroot=root/'governing-source'; terms=re.compile(r'(int\s+mystic\s*\(|convert_caoth_mystic|sc_HG2_mu|mu_scatter|delta_scale_hg|delta_scale\s*\(|get_phase_matrix_caoth|get_phase_matrix_total|\bf_s\b|\bds_s\b)')
              for p in sorted(srcroot.rglob('*')):
                  if not p.is_file(): continue
                  try: data=p.read_bytes(); txt=data.decode('utf-8')
                  except Exception: continue
                  if p.name in {'mystic.c','mystic.h','uvspec.c','solve_rte.c','rte_solver.c'} or terms.search(txt):
                      rec={'path':str(p.relative_to(srcroot)),'sha256':hashlib.sha256(data).hexdigest(),'size':len(data)}; gov.append(rec)
                      lines=txt.splitlines()
                      for i,line in enumerate(lines):
                          if terms.search(line):
                              a=max(0,i-10); b=min(len(lines),i+11)
                              contexts.append(f'===== {rec["path"]}:{i+1} =====\n'+'\n'.join(f'{j+1:05d}: {lines[j]}' for j in range(a,b)))
          (root/'governing-source-file-hashes.json').write_text(json.dumps(gov,indent=2,sort_keys=True)+'\n')
          (root/'governing-source-target-context.txt').write_text('\n\n'.join(contexts[:5000])+'\n')
          PY

      - name: Build bounded V21 provenance readout
        shell: bash -el {0}
        run: |
          set -euo pipefail
          OUT=deep-twilight-conda-recipe-source-provenance-v21-output
          python - <<'PY'
          from pathlib import Path
          import json,os,hashlib
          root=Path('deep-twilight-conda-recipe-source-provenance-v21-output')
          origin=json.loads((root/'exact-package-origin.json').read_text()); spec=json.loads((root/'recipe-source-spec.json').read_text()); remote=json.loads((root/'remote-source-disposition.json').read_text()); gov=json.loads((root/'governing-source-file-hashes.json').read_text())
          facts={'exactCondaArchiveSha256Verified':True,'recipeSourceSpec':spec,'remoteSourceDisposition':remote,'authoritativeSourceRecovered':bool(remote.get('authoritative') and remote.get('extracted')),'governingSourceFileCount':len(gov),'uvspecExecuted':False,'rngInitialized':False,'seedConsumed':False,'mysticBodyExecuted':False,'photonTraced':False,'protectedResultOpened':False,'levelBChanged':False,'taylorOrJerusalemUsed':False,'epsilonSubstitutionUsed':False}
          recipe=(root/'recipe-exact-text.txt').read_text(errors='replace'); ctx=(root/'governing-source-target-context.txt').read_text(errors='replace')
          (root/'V21_READOUT.json').write_text(json.dumps({'facts':facts,'packageOrigin':origin,'governingFiles':gov},indent=2,sort_keys=True)+'\n')
          body=['DEEP_TWILIGHT::ROBUST_EXACT_CONDA_RECIPE_SOURCE_PROVENANCE_V21_READOUT','',f'fence_main={os.environ["EXPECTED_MAIN"]}',f'branch={os.environ["GITHUB_REF_NAME"]}',f'head={os.environ["GITHUB_SHA"]}',f'run={os.environ["GITHUB_RUN_ID"]} attempt1',f'package={os.environ["EXACT_PACKAGE"]}',f'uvspec_sha256={os.environ["UVSPEC_SHA256"]}','STATIC_PROVENANCE_ONLY=true; uvspecExecuted=false; rngInitialized=false; seedConsumed=false; mysticBodyExecuted=false; photonTraced=false','protectedResultOpened=false; levelBChanged=false; Taylor/Jerusalem=false; epsilonSubstitution=false','','Mechanical disposition:','```json',json.dumps(facts,indent=2,sort_keys=True)[:20000],'```','','Exact conda package origin:','```json',json.dumps(origin,indent=2,sort_keys=True),'```','','Exact embedded recipe text (bounded):','```text',recipe[:30000],'```']
          if gov: body += ['','Recipe-hash-matched governing source files:','```json',json.dumps(gov,indent=2,sort_keys=True)[:18000],'```','','Bounded governing source contexts:','```text',ctx[:30000],'```']
          body += ['','CLAIM_BOUNDARY: exact conda archive hash + embedded recipe bytes are authoritative package provenance. Remote source bytes are authoritative only on exact recipe SHA-256 match. Any fetch error or hash mismatch remains fail-closed and is not substituted. Provenance alone does not authorize renderer parity or alter Level-B.']
          (root/'ISSUE_COMMENT.md').write_text('\n'.join(body)+'\n')
          manifest={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.iterdir()) if p.is_file()}
          (root/'evidence-sha256.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          PY

      - name: Upload immutable V21 provenance evidence
        uses: actions/upload-artifact@v4
        with:
          name: deep-twilight-conda-recipe-source-provenance-v21
          path: deep-twilight-conda-recipe-source-provenance-v21-output/
          if-no-files-found: error
          retention-days: 90

      - name: Fresh control and contention guard before checkpoint
        shell: bash
        run: |
          set -euo pipefail
          OUT=deep-twilight-conda-recipe-source-provenance-v21-output
          gh api "repos/$GITHUB_REPOSITORY/issues/60" > "$OUT/issue60-precomment.json"
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$OUT/main-precomment.json"
          python - <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          root=Path('deep-twilight-conda-recipe-source-provenance-v21-output'); main=json.loads((root/'main-precomment.json').read_text())
          if main['commit']['sha'] != os.environ['EXPECTED_MAIN']: raise SystemExit('main changed; fail closed')
          repo=os.environ['GITHUB_REPOSITORY']; current=int(os.environ['GITHUB_RUN_ID']); blockers=[]; needles=('reptran','recovery4','ordinal45','avps','level-b','level b','lowalt')
          for status in ('in_progress','queued'):
              p=subprocess.run(['gh','api',f'repos/{repo}/actions/runs?status={status}&per_page=100'],text=True,capture_output=True,check=True)
              for r in json.loads(p.stdout).get('workflow_runs',[]):
                  if int(r['id'])==current: continue
                  text=(str(r.get('name',''))+' '+str(r.get('head_branch',''))).lower()
                  if any(n in text for n in needles): blockers.append((status,r['id'],r.get('name'),r.get('head_branch')))
          if blockers: print('actual V1 contention before checkpoint:',blockers); sys.exit(44)
          PY

      - name: Persist bounded V21 checkpoint to Issue 60
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 60 --repo "$GITHUB_REPOSITORY" --body-file deep-twilight-conda-recipe-source-provenance-v21-output/ISSUE_COMMENT.md
