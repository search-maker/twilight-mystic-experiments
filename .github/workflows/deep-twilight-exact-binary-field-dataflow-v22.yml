name: Deep twilight exact binary optical-field dataflow v22

on:
  push:
    branches:
      - review/deep-twilight-exact-binary-field-dataflow-v22
    paths:
      - ".github/workflows/deep-twilight-exact-binary-field-dataflow-v22.yml"

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  exact-binary-field-dataflow-v22:
    if: >-
      github.run_attempt == 1 &&
      github.event.before == 'fe6e063c568394ae7b4e90222de270d3f2460455'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN: fe6e063c568394ae7b4e90222de270d3f2460455
      UVSPEC_SHA256: 2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3
      EXACT_PACKAGE: rubin-libradtran=2.0.6=py312pl5321he9373c2_1
      V19_RUN: '34016108921'
      V19_HEAD: 7da3f6547eec4aa45aff40d69194e495602488f4
      V21_RUN: '34016370082'
      V21_HEAD: 7f4b5f51da63f750a57662e3c9631947cff83540

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Freeze V22 scope and fail closed on live contention or WRITE_QUIET
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/review/deep-twilight-exact-binary-field-dataflow-v22"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "${{ github.event.before }}" = "$EXPECTED_MAIN"
          OUT=deep-twilight-exact-binary-field-dataflow-v22-output
          mkdir -p "$OUT"
          cat > "$OUT/PROTOCOL.txt" <<'EOF'
          DEEP TWILIGHT EXACT BINARY OPTICAL-FIELD DATAFLOW V22
          STATIC / RESULT-BLIND / NO UVSPEC EXECUTION / NO RNG / NO MYSTIC BODY / NO PHOTONS

          V21 established that the recipe-declared libRadtran-2.0.6 source archive is not recoverable from the current
          upstream URL at the exact recipe SHA-256, so current upstream source bytes are not semantic authority. V19
          established that the exact installed binary lacks usable target DWARF/source-line semantics. V22 therefore
          uses only the exact installed conda package, exact installed headers, and exact pinned uvspec machine code.

          Goal: preserve exact ABI/callsite evidence needed to connect the post-redistribution optical arrays entering
          MYSTIC to the downstream phase/delta code paths. This run may prove mechanical call/dataflow facts only.
          Symbol or field names alone never authorize renderer semantics. In particular f_s/ds_s remain fail-closed
          unless exact header ABI plus exact instruction dataflow jointly prove their role.

          No protected result, Taylor/Jerusalem, Level-B mutation, science identity, seed, solver execution, photon,
          or epsilon substitution. NEVER rerun/retry/resume; any correction is a fresh successor branch/head.
          EOF

          gh api "repos/$GITHUB_REPOSITORY/issues/60" > "$OUT/issue60-preflight.json"
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$OUT/main-preflight.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V19_RUN" > "$OUT/v19-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V21_RUN" > "$OUT/v21-run.json"

          python - <<'PY'
          import json, os, subprocess, sys, base64, re
          from pathlib import Path
          root=Path('deep-twilight-exact-binary-field-dataflow-v22-output')
          main=json.loads((root/'main-preflight.json').read_text())
          v19=json.loads((root/'v19-run.json').read_text())
          v21=json.loads((root/'v21-run.json').read_text())
          if main['commit']['sha'] != os.environ['EXPECTED_MAIN']:
              raise SystemExit('main changed; fail closed')
          if v19.get('head_sha') != os.environ['V19_HEAD'] or v19.get('conclusion') != 'success' or v19.get('run_attempt') != 1:
              raise SystemExit('V19 exact predecessor identity mismatch')
          if v21.get('head_sha') != os.environ['V21_HEAD'] or v21.get('conclusion') != 'success' or v21.get('run_attempt') != 1:
              raise SystemExit('V21 exact predecessor identity mismatch')

          repo=os.environ['GITHUB_REPOSITORY']
          current=int(os.environ['GITHUB_RUN_ID'])
          needles=('reptran','recovery4','ordinal45','avps','level-b','level b','lowalt')
          blockers=[]
          for status in ('in_progress','queued'):
              p=subprocess.run(['gh','api',f'repos/{repo}/actions/runs?status={status}&per_page=100'],text=True,capture_output=True,check=True)
              for r in json.loads(p.stdout).get('workflow_runs',[]):
                  if int(r['id']) == current:
                      continue
                  text=(str(r.get('name',''))+' '+str(r.get('head_branch',''))).lower()
                  if any(n in text for n in needles):
                      blockers.append({'status':status,'id':r.get('id'),'name':r.get('name'),'branch':r.get('head_branch')})
          (root/'v1-contention.json').write_text(json.dumps(blockers,indent=2,sort_keys=True)+'\n')
          if blockers:
              print('actual V1 contention detected:', blockers)
              sys.exit(43)

          issue=json.loads((root/'issue60-preflight.json').read_text())
          count=int(issue.get('comments',0))
          pages=(count+99)//100
          markers=[]
          fenced=False
          marker_re=re.compile(r'^\s*WRITE_QUIET_(BEGIN|END)\b')
          for page in range(1,pages+1):
              p=subprocess.run(['gh','api',f'repos/{repo}/issues/60/comments?per_page=100&page={page}'],text=True,capture_output=True,check=True)
              for c in json.loads(p.stdout):
                  fenced=False
                  for raw in str(c.get('body','')).splitlines():
                      line=raw.rstrip('\r')
                      if line.lstrip().startswith('```'):
                          fenced=not fenced
                          continue
                      if fenced or line.lstrip().startswith('>'):
                          continue
                      m=marker_re.match(line)
                      if m:
                          markers.append({'id':int(c['id']),'kind':m.group(1),'line':line.strip()})
          markers.sort(key=lambda x:x['id'])
          state='NONE' if not markers else markers[-1]['kind']
          (root/'write-quiet-markers.json').write_text(json.dumps({'markers':markers,'terminalState':state},indent=2,sort_keys=True)+'\n')
          if state == 'BEGIN':
              raise SystemExit('unmatched WRITE_QUIET_BEGIN; fail closed')
          PY

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: deep-twilight-exact-binary-field-dataflow-v22
          create-args: >-
            -c conda-forge
            python=3.12.4
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Bind exact package and preserve installed-header ABI evidence
        shell: bash -el {0}
        run: |
          set -euo pipefail
          OUT=deep-twilight-exact-binary-field-dataflow-v22-output
          UVSPEC="$(command -v uvspec)"
          test "$(sha256sum "$UVSPEC" | awk '{print $1}')" = "$UVSPEC_SHA256"
          sha256sum "$UVSPEC" > "$OUT/uvspec-sha256.txt"
          micromamba list --explicit > "$OUT/runtime-package-explicit.txt"
          micromamba list --json > "$OUT/runtime-package-list.json"
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          root=Path('deep-twilight-exact-binary-field-dataflow-v22-output')
          inc=Path(os.environ['CONDA_PREFIX'])/'include/libRadtran'
          terms=[
            'mystic','convert_caoth_mystic','get_phase_matrix_total','get_phase_matrix_caoth',
            'mu_scatter','sc_HG2_mu','delta_scale_hg','delta_scale',
            'dt_s','om_s','g1_s','g2_s','f_s','ff_s','ds_s','ssa_s'
          ]
          hits={t:[] for t in terms}; blocks=[]; hashes={}
          for p in sorted(inc.rglob('*')):
              if not p.is_file(): continue
              try:
                  data=p.read_bytes(); text=data.decode('utf-8')
              except Exception:
                  continue
              rel=str(p.relative_to(inc)); hashes[rel]=hashlib.sha256(data).hexdigest()
              lines=text.splitlines()
              for term in terms:
                  for i,line in enumerate(lines):
                      if term in line:
                          hits[term].append({'file':rel,'line':i+1,'text':line})
                          a=max(0,i-14); b=min(len(lines),i+15)
                          blocks.append(f'===== {term} :: {rel}:{i+1} =====\n'+'\n'.join(f'{j+1:05d}: {lines[j]}' for j in range(a,b)))
          (root/'installed-header-hit-index.json').write_text(json.dumps(hits,indent=2,sort_keys=True)+'\n')
          (root/'installed-header-target-context.txt').write_text('\n\n'.join(blocks)+'\n')
          (root/'installed-header-sha256.json').write_text(json.dumps(hashes,indent=2,sort_keys=True)+'\n')
          PY

      - name: Preserve exact pinned-binary target bodies and callsite dataflow windows
        shell: bash -el {0}
        run: |
          set -euo pipefail
          OUT=deep-twilight-exact-binary-field-dataflow-v22-output
          UVSPEC="$(command -v uvspec)"
          nm -an "$UVSPEC" > "$OUT/uvspec-nm-an.txt"
          readelf -Ws "$UVSPEC" > "$OUT/uvspec-readelf-symbols.txt"
          objdump -drwC -Mintel "$UVSPEC" > "$OUT/uvspec-objdump-full.txt"
          for sym in solve_rte convert_caoth_mystic mystic get_phase_matrix_total get_phase_matrix_caoth mu_scatter sc_HG2_mu delta_scale_hg delta_scale; do
            objdump -drwC -Mintel --disassemble="$sym" "$UVSPEC" > "$OUT/disasm-$sym.txt" || true
          done
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re
          root=Path('deep-twilight-exact-binary-field-dataflow-v22-output')
          lines=(root/'uvspec-objdump-full.txt').read_text(errors='replace').splitlines()
          label_re=re.compile(r'^\s*([0-9a-f]+) <([^>]+)>:$')
          call_re=re.compile(r'\bcall\w*\s+[^<]*<([^>]+)>')
          wanted={
            ('solve_rte','convert_caoth_mystic'),
            ('solve_rte','mystic'),
            ('mystic','get_phase_matrix_total'),
            ('get_phase_matrix_total','get_phase_matrix_caoth'),
            ('mu_scatter','sc_HG2_mu'),
          }
          caller='UNKNOWN'; sites=[]
          argwrite_re=re.compile(r'\b(?:mov|lea|xor|and|or|add|sub|push)\b.*(?:\brdi\b|\brsi\b|\brdx\b|\brcx\b|\br8\b|\br9\b|\[rsp(?:[+\-][^\]]+)?\]|\[rbp(?:[+\-][^\]]+)?\])',re.I)
          for i,line in enumerate(lines):
              lm=label_re.match(line)
              if lm:
                  caller=lm.group(2).split('@')[0]
              cm=call_re.search(line)
              if not cm:
                  continue
              callee=cm.group(1).split('@')[0]
              keep=(caller,callee) in wanted or callee in ('delta_scale_hg','delta_scale')
              if not keep:
                  continue
              a=max(0,i-160); b=min(len(lines),i+41)
              pre=lines[a:i]
              argwrites=[x.strip() for x in pre if argwrite_re.search(x)]
              sites.append({
                'caller':caller,'callee':callee,'lineIndex':i+1,'instruction':line.strip(),
                'contextStart':a+1,'contextEnd':b,'candidateAbiWritesLast160':argwrites[-80:],
                'context':lines[a:b]
              })
          (root/'target-callsite-index.json').write_text(json.dumps([{k:v for k,v in s.items() if k!='context'} for s in sites],indent=2,sort_keys=True)+'\n')
          with (root/'target-callsite-context.txt').open('w') as f:
              for n,s in enumerate(sites,1):
                  f.write(f'===== CALLSITE {n}: {s["caller"]} -> {s["callee"]} =====\n')
                  f.write('\n'.join(s['context'])+'\n\n')
          body_hash={}
          for p in sorted(root.glob('disasm-*.txt')):
              body_hash[p.name]=hashlib.sha256(p.read_bytes()).hexdigest()
          (root/'target-disassembly-sha256.json').write_text(json.dumps(body_hash,indent=2,sort_keys=True)+'\n')
          PY

      - name: Produce mechanical fail-closed field-dataflow classification
        shell: bash -el {0}
        run: |
          set -euo pipefail
          OUT=deep-twilight-exact-binary-field-dataflow-v22-output
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('deep-twilight-exact-binary-field-dataflow-v22-output')
          hdr=json.loads((root/'installed-header-hit-index.json').read_text())
          calls=json.loads((root/'target-callsite-index.json').read_text())
          edges={(x['caller'],x['callee']) for x in calls}
          facts={
            'exactHeaderMysticHits':len(hdr.get('mystic',[])),
            'exactHeaderConvertCaothMysticHits':len(hdr.get('convert_caoth_mystic',[])),
            'exactHeaderFsHits':len(hdr.get('f_s',[])),
            'exactHeaderDsHits':len(hdr.get('ds_s',[])),
            'solveRteCallsConvertCaothMystic':('solve_rte','convert_caoth_mystic') in edges,
            'solveRteCallsMystic':('solve_rte','mystic') in edges,
            'mysticCallsGetPhaseMatrixTotal':('mystic','get_phase_matrix_total') in edges,
            'getPhaseMatrixTotalCallsGetPhaseMatrixCaoth':('get_phase_matrix_total','get_phase_matrix_caoth') in edges,
            'muScatterCallsScHG2':('mu_scatter','sc_HG2_mu') in edges,
            'deltaScaleCallsiteCount':sum(1 for x in calls if x['callee'] in ('delta_scale','delta_scale_hg')),
            'fEntrySemanticStatus':'FAIL_CLOSED_PENDING_EXACT_FIELD_DATAFLOW_INTERPRETATION',
            'dsEntrySemanticStatus':'FAIL_CLOSED_PENDING_EXACT_FIELD_DATAFLOW_INTERPRETATION',
            'rendererParityAuthorized':False,
            'shallowKorkinGateAuthorized':False,
            'deepScienceAuthorized':False,
          }
          (root/'mechanical-summary.json').write_text(json.dumps(facts,indent=2,sort_keys=True)+'\n')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: deep-twilight-exact-binary-field-dataflow-v22
          path: deep-twilight-exact-binary-field-dataflow-v22-output
          if-no-files-found: error
          compression-level: 6

      - name: Post bounded Issue 60 readout
        shell: bash
        run: |
          set -euo pipefail
          OUT=deep-twilight-exact-binary-field-dataflow-v22-output
          SUMMARY="$(cat "$OUT/mechanical-summary.json")"
          BODY=$(cat <<EOF
          DEEP_TWILIGHT::EXACT_BINARY_FIELD_DATAFLOW_V22_READOUT

          fence_main=$EXPECTED_MAIN
          branch=$GITHUB_REF_NAME
          head=$GITHUB_SHA
          run=$GITHUB_RUN_ID attempt1
          package=$EXACT_PACKAGE
          uvspec_sha256=$UVSPEC_SHA256
          STATIC_ONLY=true; uvspecExecuted=false; rngInitialized=false; seedConsumed=false; mysticBodyExecuted=false; photonTraced=false
          protectedResultOpened=false; levelBChanged=false; Taylor/Jerusalem=false; epsilonSubstitution=false

          Mechanical classification:
          \`\`\`json
          $SUMMARY
          \`\`\`

          Evidence artifact preserves exact installed-header contexts, exact target function disassemblies, exact target callsite windows, candidate SysV ABI register/stack writes, and hashes. V21 source-SHA mismatch remains fail-closed; no current-upstream source substitution is used. Names alone are not semantic authority. f_s/ds_s remain fail-closed until exact evidence is interpreted into an entry-to-internal dataflow proof. No renderer parity, Korkin gate, deep science, or Level-B authority is created here.
          EOF
          )
          gh api "repos/$GITHUB_REPOSITORY/issues/60/comments" -f body="$BODY"
