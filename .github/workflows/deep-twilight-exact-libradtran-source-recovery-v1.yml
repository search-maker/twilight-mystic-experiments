name: Deep twilight exact libRadtran source recovery v1

on:
  push:
    branches:
      - review/deep-twilight-exact-libradtran-source-recovery-v1
    paths:
      - ".github/workflows/deep-twilight-exact-libradtran-source-recovery-v1.yml"

permissions:
  contents: read

jobs:
  exact-source-recovery:
    if: >-
      github.run_attempt == 1 &&
      github.event.before == 'fe6e063c568394ae7b4e90222de270d3f2460455'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Freeze exact source-provenance contract
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/review/deep-twilight-exact-libradtran-source-recovery-v1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "${{ github.event.before }}" = "fe6e063c568394ae7b4e90222de270d3f2460455"
          OUT=deep-twilight-exact-libradtran-source-recovery-v1-output
          mkdir -p "$OUT"
          cat > "$OUT/PROTOCOL.txt" <<'EOF'
          DEEP TWILIGHT EXACT LIBRADTRAN SOURCE RECOVERY V1
          POST_V1 / NONBLOCKING / ZERO-SCIENCE / SOURCE-ONLY

          Target binary package already frozen elsewhere:
          rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          uvspec SHA256 2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3

          Exact conda-forge feedstock rebuild commit for build-number 1:
          d6f1997b2f486541136f514188c650fdd370f8e2
          Its recipe declares source URL http://www.libradtran.org/download/libRadtran-2.0.6.tar.gz
          and source SHA256 999e47f4af4b5df6f85a6887fc105fc8f6e1a7cee89a3124f69ac8d8912c8e85.
          The recipe has no patch list; build.sh replaces only config.sub/config.guess, removes dependency files,
          configures/builds/tests/installs, and does not rewrite MYSTIC/solve_rte sources.

          This workflow downloads that exact upstream source archive, requires the declared SHA256 byte-for-byte,
          persists the exact governing MYSTIC and solve_rte source files plus focused excerpts and hashes,
          and performs no uvspec/MYSTIC execution, no seed allocation, no photon tracing, no protected-result opening,
          no Taylor/Jerusalem fitting, no epsilon substitution, and no Level-B mutation.
          EOF

      - name: Fetch and verify exact build-1 feedstock recipe
        shell: bash
        run: |
          set -euo pipefail
          OUT=deep-twilight-exact-libradtran-source-recovery-v1-output
          FEED=d6f1997b2f486541136f514188c650fdd370f8e2
          curl -fL --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/conda-forge/rubin-libradtran-feedstock/$FEED/recipe/meta.yaml" \
            -o "$OUT/feedstock-meta.yaml"
          curl -fL --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/conda-forge/rubin-libradtran-feedstock/$FEED/recipe/build.sh" \
            -o "$OUT/feedstock-build.sh"
          grep -F '{% set version = "2.0.6" %}' "$OUT/feedstock-meta.yaml"
          grep -F 'sha256: 999e47f4af4b5df6f85a6887fc105fc8f6e1a7cee89a3124f69ac8d8912c8e85' "$OUT/feedstock-meta.yaml"
          grep -F 'number: 1' "$OUT/feedstock-meta.yaml"
          if grep -Eq '^[[:space:]]*(patches|patch):' "$OUT/feedstock-meta.yaml"; then
            echo 'unexpected feedstock patch declaration' >&2
            exit 1
          fi
          if grep -E 'mystic\.(c|h)|solve_rte\.c' "$OUT/feedstock-build.sh"; then
            echo 'build.sh unexpectedly rewrites governing MYSTIC/solve_rte source' >&2
            exit 1
          fi
          sha256sum "$OUT/feedstock-meta.yaml" "$OUT/feedstock-build.sh" > "$OUT/feedstock-files-sha256.txt"

      - name: Download exact upstream source archive and require recipe hash
        shell: bash
        run: |
          set -euo pipefail
          OUT=deep-twilight-exact-libradtran-source-recovery-v1-output
          URL=https://www.libradtran.org/download/libRadtran-2.0.6.tar.gz
          ARCHIVE="$OUT/libRadtran-2.0.6.tar.gz"
          curl -fL --retry 3 --retry-all-errors --retry-delay 3 "$URL" -o "$ARCHIVE"
          actual="$(sha256sum "$ARCHIVE" | awk '{print $1}')"
          printf '%s  %s\n' "$actual" "libRadtran-2.0.6.tar.gz" > "$OUT/upstream-archive-sha256.txt"
          test "$actual" = "999e47f4af4b5df6f85a6887fc105fc8f6e1a7cee89a3124f69ac8d8912c8e85"
          tar -tzf "$ARCHIVE" > "$OUT/upstream-archive-members.txt"
          grep -E '/libsrc_c/mystic\.h$' "$OUT/upstream-archive-members.txt"
          grep -E '/libsrc_c/mystic\.c$' "$OUT/upstream-archive-members.txt"
          grep -E '/src/solve_rte\.c$' "$OUT/upstream-archive-members.txt"

      - name: Extract exact governing source files and focused ABI/call excerpts
        shell: bash
        run: |
          set -euo pipefail
          OUT=deep-twilight-exact-libradtran-source-recovery-v1-output
          SRC="$OUT/src"
          mkdir -p "$SRC"
          ARCHIVE="$OUT/libRadtran-2.0.6.tar.gz"
          ROOT="$(tar -tzf "$ARCHIVE" | head -n1 | cut -d/ -f1)"
          test -n "$ROOT"
          tar -xzf "$ARCHIVE" -C "$SRC" \
            "$ROOT/libsrc_c/mystic.h" \
            "$ROOT/libsrc_c/mystic.c" \
            "$ROOT/src/solve_rte.c"
          sha256sum \
            "$SRC/$ROOT/libsrc_c/mystic.h" \
            "$SRC/$ROOT/libsrc_c/mystic.c" \
            "$SRC/$ROOT/src/solve_rte.c" \
            > "$OUT/governing-source-files-sha256.txt"
          python - <<'PY'
          import json, re
          from pathlib import Path

          out = Path('deep-twilight-exact-libradtran-source-recovery-v1-output')
          srcroot = out / 'src'
          roots = [p for p in srcroot.iterdir() if p.is_dir()]
          if len(roots) != 1:
              raise SystemExit(f'unexpected extracted roots: {roots}')
          root = roots[0]
          mystic_h = (root / 'libsrc_c/mystic.h').read_text(errors='replace')
          mystic_c = (root / 'libsrc_c/mystic.c').read_text(errors='replace')
          solve = (root / 'src/solve_rte.c').read_text(errors='replace')

          def excerpt(text, pattern, before=8, after=80):
              lines = text.splitlines()
              rx = re.compile(pattern)
              hits = [i for i, line in enumerate(lines) if rx.search(line)]
              blocks = []
              for i in hits:
                  lo = max(0, i-before)
                  hi = min(len(lines), i+after)
                  blocks.append('\n'.join(f'{j+1}: {lines[j]}' for j in range(lo, hi)))
              return hits, '\n\n===== NEXT HIT =====\n\n'.join(blocks)

          h_hits, h_text = excerpt(mystic_h, r'\bint\s+mystic\s*\(', 4, 140)
          c_hits, c_text = excerpt(mystic_c, r'\bint\s+mystic\s*\(', 4, 140)
          call_hits, call_text = excerpt(solve, r'\bmystic\s*\(', 20, 180)
          (out / 'mystic-h-prototype-excerpts.txt').write_text(h_text + '\n')
          (out / 'mystic-c-definition-excerpts.txt').write_text(c_text + '\n')
          (out / 'solve-rte-mystic-call-excerpts.txt').write_text(call_text + '\n')
          if not h_hits or not c_hits or not call_hits:
              raise SystemExit(f'missing governing source evidence h={h_hits} c={c_hits} call={call_hits}')

          # Preserve an explicit machine-readable first-argument prefix without pretending
          # to parse all C declarators semantically. This is evidence, not a science result.
          first_header = h_text.split('===== NEXT HIT =====', 1)[0]
          (out / 'source-recovery-index.json').write_text(json.dumps({
              'schemaVersion': 1,
              'upstreamArchiveSha256': '999e47f4af4b5df6f85a6887fc105fc8f6e1a7cee89a3124f69ac8d8912c8e85',
              'feedstockCommit': 'd6f1997b2f486541136f514188c650fdd370f8e2',
              'feedstockBuildNumber': 1,
              'mysticHeaderPrototypeHitCount': len(h_hits),
              'mysticCDefinitionHitCount': len(c_hits),
              'solveRteMysticCallHitCount': len(call_hits),
              'headerPrototypeExcerptPath': 'mystic-h-prototype-excerpts.txt',
              'definitionExcerptPath': 'mystic-c-definition-excerpts.txt',
              'callExcerptPath': 'solve-rte-mystic-call-excerpts.txt',
              'firstHeaderExcerptContainsNlyr': 'nlyr' in first_header,
              'firstHeaderExcerptContainsNCaoth': 'n_caoth' in first_header,
              'firstHeaderExcerptContainsDtS': 'dt_s' in first_header,
              'firstHeaderExcerptContainsOmS': 'om_s' in first_header,
              'firstHeaderExcerptContainsG1S': 'g1_s' in first_header,
              'firstHeaderExcerptContainsG2S': 'g2_s' in first_header,
              'uvspecExecuted': False,
              'mysticExecuted': False,
              'randomSeedAllocated': False,
              'photonTraced': False,
          }, indent=2, sort_keys=True) + '\n')
          PY
          rm -f "$OUT/libRadtran-2.0.6.tar.gz"

      - name: Write source-provenance decision
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          OUT=deep-twilight-exact-libradtran-source-recovery-v1-output
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('deep-twilight-exact-libradtran-source-recovery-v1-output')
          def text(name):
              p = root / name
              return p.read_text(errors='replace') if p.exists() else ''
          archive_hash_ok = '999e47f4af4b5df6f85a6887fc105fc8f6e1a7cee89a3124f69ac8d8912c8e85' in text('upstream-archive-sha256.txt')
          index_path = root / 'source-recovery-index.json'
          index = json.loads(index_path.read_text()) if index_path.exists() else {}
          governing_hashes = text('governing-source-files-sha256.txt')
          complete = bool(archive_hash_ok and index and governing_hashes.strip())
          decision = {
              'schemaVersion': 1,
              'stageId': 'deep-twilight-exact-libradtran-source-recovery-v1',
              'status': 'PASS_EXACT_GOVERNING_SOURCE_RECOVERED' if complete else 'FAIL_EXACT_GOVERNING_SOURCE_RECOVERY_INCOMPLETE',
              'feedstockCommit': 'd6f1997b2f486541136f514188c650fdd370f8e2',
              'feedstockBuildNumber': 1,
              'upstreamArchiveSha256Expected': '999e47f4af4b5df6f85a6887fc105fc8f6e1a7cee89a3124f69ac8d8912c8e85',
              'archiveHashVerified': archive_hash_ok,
              'governingSourceFileHashesPresent': bool(governing_hashes.strip()),
              'uvspecExecuted': False,
              'mysticExecuted': False,
              'photonTraced': False,
              'randomSeedAllocated': False,
              'protectedResultOpened': False,
              'levelBChanged': False,
              'taylorOrJerusalemUsed': False,
              'epsilonSubstitutionUsed': False,
              'githubRerunPermitted': False,
              'claimBoundary': 'exact upstream governing-source recovery for pinned conda build; no runtime optical array capture or science claim',
          }
          (root / 'decision.json').write_text(json.dumps(decision, indent=2, sort_keys=True) + '\n')
          print(json.dumps(decision, sort_keys=True))
          PY

      - name: Upload exact source-provenance evidence regardless of outcome
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-twilight-exact-libradtran-source-recovery-v1
          path: deep-twilight-exact-libradtran-source-recovery-v1-output
          if-no-files-found: error
          retention-days: 90

      - name: Enforce source-only decision
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT=deep-twilight-exact-libradtran-source-recovery-v1-output
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('deep-twilight-exact-libradtran-source-recovery-v1-output')
          d = json.loads((root / 'decision.json').read_text())
          assert d['status'] == 'PASS_EXACT_GOVERNING_SOURCE_RECOVERED'
          assert d['archiveHashVerified'] is True
          assert d['governingSourceFileHashesPresent'] is True
          assert d['uvspecExecuted'] is False
          assert d['mysticExecuted'] is False
          assert d['photonTraced'] is False
          assert d['randomSeedAllocated'] is False
          assert d['protectedResultOpened'] is False
          assert d['levelBChanged'] is False
          assert d['taylorOrJerusalemUsed'] is False
          assert d['epsilonSubstitutionUsed'] is False
          assert d['githubRerunPermitted'] is False
          PY
          test ! -e randomseed
          test ! -e "$OUT/randomseed"
