name: Deep twilight molecular-only component identity v14

on:
  push:
    branches:
      - review/deep-twilight-molecular-only-component-identity-v14
    paths:
      - ".github/workflows/deep-twilight-molecular-only-component-identity-v14.yml"

permissions:
  contents: read
  actions: read

jobs:
  molecular-only-component-identity-v14:
    if: >-
      github.run_attempt == 1 &&
      github.event.before == 'fe6e063c568394ae7b4e90222de270d3f2460455'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      FRESH_SETUP_SEED: '1926407831'
      UVSPEC_SHA256: '2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3'
      BASELINE_RUN: '34012593281'
      BASELINE_ARTIFACT_ID: '9982923548'
      BASELINE_ARTIFACT_DIGEST: 'sha256:bbad4ef455636f55510176b9d0df2f509fabdd78675a9504d45354375e01ceaf'
      BASELINE_CAPTURE_SHA256: 'f005ed18491a0c9b7827857c0bb2fc775c5e77eb2a69f02121f56814a628bec6'
      V13_RUN: '34014483370'
      V13_ARTIFACT_ID: '9983476605'
      V13_ARTIFACT_DIGEST: 'sha256:3a40dbbda8e39fe782681a429e4473d54fd0e623b01525d131ddd5c66e1fe0a8'
      V13_HELPER_SHA256: '650e40ca624380832c677445d2185e57ed70e37b5d1aa92eadc90b06105cc99b'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Freeze orthogonal component-identity gate and fresh identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/review/deep-twilight-molecular-only-component-identity-v14"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "${{ github.event.before }}" = "fe6e063c568394ae7b4e90222de270d3f2460455"
          OUT=deep-twilight-molecular-only-component-identity-v14-output
          mkdir -p "$OUT"
          cat > "$OUT/PROTOCOL.txt" <<'EOF'
          DEEP TWILIGHT EXACT-RUNTIME MOLECULAR-ONLY COMPONENT IDENTITY V14
          POST_V1 / SETUP-ONLY / NO MYSTIC BODY / NO PHOTON TRACE

          Motivation: V13 correctly rejected the preregistered hypothesis that doubling aerosol_set_tau_at_wvl
          uniformly doubles each aerosol-layer optical depth. V14 does not retune that failed hypothesis.
          It uses an orthogonal structural contrast: remove aerosol_default and aerosol_set_tau_at_wvl entirely.

          Immutable reference: run 34012593281 artifact 9982923548, AFGL-US + aerosol_default + AOD550=0.150000,
          550 nm CRS, exact pinned rubin-libradtran runtime, n_caoth=2.

          Probe: same AFGL-US/solar source/CRS/wavelength/geometry/MYSTIC setup but NO aerosol directives at all.
          Fresh setup-only seed 1926407831 is consumed/non-reusable once uvspec initializes its RNG.
          GDB must stop at the first instruction of mystic(); no MYSTIC-body instruction and no photon trace.

          Result-blind structural PASS condition frozen before execution:
          - probe nlyr=49 and n_caoth=1;
          - probe threed and zprof raw payloads equal the immutable reference exactly;
          - for each solver-ready table dt_s, om_s, g1_s, g2_s, f_s, ds_s, the sole probe row 0 raw bytes
            equal reference row 0 raw bytes exactly.
          If any condition fails, component identity remains unresolved. No alternative row selection is permitted.

          A PASS proves for this exact frozen 550-nm runtime state that reference row0 is the molecular-only
          component and reference row1 is the component introduced by aerosol_default. It does NOT prove a
          uniform AOD scaling law, does not finish phase/delta-scaling translation to an independent renderer,
          does not authorize deep science, and does not alter validated Level-B 2.0-10.5 deg.

          Exact zeros remain raw IEEE-754 outcomes; no epsilon substitution. Never rerun/retry/resume this attempt.
          EOF

          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          mapfile -t seed_commits < <(git log --all -S"$FRESH_SETUP_SEED" --format='%H' | sort -u)
          for c in "${seed_commits[@]:-}"; do
            [ -z "$c" ] && continue
            test "$c" = "$GITHUB_SHA" || { echo "seed already appears in repository history at $c"; exit 41; }
          done
          if gh api --paginate "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" --jq '.[].body' | grep -Fq "$FRESH_SETUP_SEED"; then
            echo "seed already appears in authoritative Issue #60 history"; exit 42
          fi
          python - <<'PY'
          import json, os, subprocess, sys
          repo=os.environ['GITHUB_REPOSITORY']; current=int(os.environ['GITHUB_RUN_ID'])
          blockers=[]; needles=('reptran','recovery4','ordinal45','avps','level-b','level b','lowalt')
          for status in ('in_progress','queued'):
              p=subprocess.run(['gh','api',f'repos/{repo}/actions/runs?status={status}&per_page=100'],text=True,capture_output=True,check=True)
              for r in json.loads(p.stdout).get('workflow_runs',[]):
                  if int(r['id'])==current: continue
                  name=(str(r.get('name',''))+' '+str(r.get('head_branch',''))).lower()
                  if any(n in name for n in needles): blockers.append((status,r['id'],r.get('name'),r.get('head_branch')))
          if blockers: print('actual V1 contention detected:',blockers); sys.exit(43)
          print('no actual queued/in-progress V1 contention')
          PY

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: deep-twilight-molecular-only-component-identity-v14
          create-args: >-
            -c conda-forge
            python=3.12.4
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Bind exact runtime, reference capture, and immutable V13 helper
        shell: bash -el {0}
        run: |
          set -euo pipefail
          OUT=deep-twilight-molecular-only-component-identity-v14-output
          micromamba list --explicit > "$OUT/runtime-package-explicit-before.txt"
          micromamba list --json > "$OUT/runtime-package-list-before.json"
          UVSPEC="$(command -v uvspec)"
          test "$(sha256sum "$UVSPEC" | awk '{print $1}')" = "$UVSPEC_SHA256"
          file "$UVSPEC" | tee "$OUT/uvspec-file.txt" | grep -Eq 'x86-64|x86_64'

          meta="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BASELINE_RUN/artifacts" --jq ".artifacts[] | select(.id==$BASELINE_ARTIFACT_ID) | [.name,.digest] | @tsv")"
          test "$meta" = $'deep-twilight-mystic-entry-optprop-capture-v2\t'"$BASELINE_ARTIFACT_DIGEST"
          mkdir -p baseline
          gh run download "$BASELINE_RUN" --repo "$GITHUB_REPOSITORY" --name deep-twilight-mystic-entry-optprop-capture-v2 --dir baseline
          BASE_RAW="$(find baseline -type f -name 'mystic-entry-raw-v2.json' -print -quit)"
          test -n "$BASE_RAW"; test "$(sha256sum "$BASE_RAW" | awk '{print $1}')" = "$BASELINE_CAPTURE_SHA256"
          printf '%s\n' "$BASE_RAW" > "$OUT/baseline-raw-path.txt"

          v13meta="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V13_RUN/artifacts" --jq ".artifacts[] | select(.id==$V13_ARTIFACT_ID) | [.name,.digest] | @tsv")"
          test "$v13meta" = $'deep-twilight-aod-runtime-semantic-probe-v13\t'"$V13_ARTIFACT_DIGEST"
          mkdir -p v13src
          gh run download "$V13_RUN" --repo "$GITHUB_REPOSITORY" --name deep-twilight-aod-runtime-semantic-probe-v13 --dir v13src
          V13_HELPER="$(find v13src -type f -name 'capture_mystic_entry_v2.py' -print -quit)"
          test -n "$V13_HELPER"; test "$(sha256sum "$V13_HELPER" | awk '{print $1}')" = "$V13_HELPER_SHA256"
          cp "$V13_HELPER" "$OUT/v13-helper-immutable.py"
          cp "$V13_HELPER" "$OUT/capture_mystic_entry_v2.py"

      - name: Materialize narrowly patched molecular-only capture helper
        shell: bash
        run: |
          set -euo pipefail
          OUT=deep-twilight-molecular-only-component-identity-v14-output
          python - <<'PY'
          from pathlib import Path
          p=Path('deep-twilight-molecular-only-component-identity-v14-output/capture_mystic_entry_v2.py')
          s=p.read_text()
          replacements=[
            ('STAGE_ID = "deep-twilight-aod-runtime-semantic-probe-v13"','STAGE_ID = "deep-twilight-molecular-only-component-identity-v14"'),
            ('EXPECTED_SEED = 1427365903','EXPECTED_SEED = 1926407831'),
            ('EXPECTED_BARE_N_CAOTH = 2','EXPECTED_BARE_N_CAOTH = 1'),
            ('        "aerosol_default",\n',''),
            ('        f"aerosol_set_tau_at_wvl 550 {EXPECTED_AOD550:.6f}",\n',''),
            ('        "aerosol_default": 1,\n',''),
            ('        "aerosol_set_tau_at_wvl 550 0.300000": 1,\n',''),
            ('        raise gdb.GdbError(f"bare aerosol_default expected n_caoth={EXPECTED_BARE_N_CAOTH}, got {n_caoth}")','        raise gdb.GdbError(f"molecular-only expected n_caoth={EXPECTED_BARE_N_CAOTH}, got {n_caoth}")'),
            ('    aerosol_dt_values = dt_capture["rows"][1]["decodedFloat32AuditOnly"]\n    finite_aerosol_dt = [float(value) for value in aerosol_dt_values if not isinstance(value, str)]\n',''),
            ('        "aerosolRowIndexCandidate": 1,\n        "aerosolDtFloat64SumAuditOnly": sum(finite_aerosol_dt),\n','        "aerosolRowIndexCandidate": None,\n        "aerosolDtFloat64SumAuditOnly": None,\n'),
            ('lossless final pre-MYSTIC dt_s/om_s/g1_s/g2_s/f_s/ds_s plus threed/zprof ABI capture for frozen bare aerosol_default state; semantic row translation remains a separate parity gate; no photon/science result','lossless final pre-MYSTIC molecular-only dt_s/om_s/g1_s/g2_s/f_s/ds_s plus threed/zprof ABI capture; component identity is evaluated separately; no photon/science result'),
          ]
          for old,new in replacements:
              count=s.count(old)
              if count!=1: raise SystemExit(f'expected exactly one occurrence for patch fragment; got {count}: {old!r}')
              s=s.replace(old,new)
          p.write_text(s)
          PY
          python -m py_compile "$OUT/capture_mystic_entry_v2.py"
          python - <<'PY'
          import difflib,hashlib,json
          from pathlib import Path
          root=Path('deep-twilight-molecular-only-component-identity-v14-output')
          a=(root/'v13-helper-immutable.py').read_text().splitlines(); b=(root/'capture_mystic_entry_v2.py').read_text().splitlines()
          changes=[x for x in difflib.ndiff(a,b) if x.startswith('- ') or x.startswith('+ ')]
          (root/'v14-helper-patch.diff').write_text('\n'.join(changes)+'\n')
          (root/'v14-helper-manifest.json').write_text(json.dumps({'sourceHelperSha256':hashlib.sha256((root/'v13-helper-immutable.py').read_bytes()).hexdigest(),'v14HelperSha256':hashlib.sha256((root/'capture_mystic_entry_v2.py').read_bytes()).hexdigest(),'changedLineRecords':changes},indent=2,sort_keys=True)+'\n')
          PY

      - name: Create isolated debugger environment
        shell: bash -el {0}
        run: |
          set -euo pipefail
          OUT=deep-twilight-molecular-only-component-identity-v14-output
          GDB_PREFIX="$RUNNER_TEMP/deep-twilight-gdb-tools-molecular-v14"
          micromamba create -y -p "$GDB_PREFIX" -c conda-forge python=3.12.4 gdb=17.2
          micromamba list -p "$GDB_PREFIX" --explicit > "$OUT/gdb-package-explicit.txt"
          "$GDB_PREFIX/bin/gdb" --version > "$OUT/gdb-version.txt"
          printf '%s\n' "$GDB_PREFIX" > "$OUT/gdb-prefix.txt"

      - name: Fresh control and contention guard immediately before target runtime
        shell: bash
        run: |
          set -euo pipefail
          OUT=deep-twilight-molecular-only-component-identity-v14-output
          gh api "repos/$GITHUB_REPOSITORY/issues/60" > "$OUT/issue60-preprobe.json"
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$OUT/main-preprobe.json"
          python - <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          root=Path('deep-twilight-molecular-only-component-identity-v14-output')
          main=json.loads((root/'main-preprobe.json').read_text()); issue=json.loads((root/'issue60-preprobe.json').read_text())
          if main['commit']['sha']!='fe6e063c568394ae7b4e90222de270d3f2460455': raise SystemExit('main changed; fail closed')
          repo=os.environ['GITHUB_REPOSITORY']; current=int(os.environ['GITHUB_RUN_ID']); blockers=[]
          needles=('reptran','recovery4','ordinal45','avps','level-b','level b','lowalt')
          for status in ('in_progress','queued'):
              p=subprocess.run(['gh','api',f'repos/{repo}/actions/runs?status={status}&per_page=100'],text=True,capture_output=True,check=True)
              for r in json.loads(p.stdout).get('workflow_runs',[]):
                  if int(r['id'])==current: continue
                  name=(str(r.get('name',''))+' '+str(r.get('head_branch',''))).lower()
                  if any(n in name for n in needles): blockers.append((status,r['id'],r.get('name'),r.get('head_branch')))
          if blockers: print('actual V1 contention:',blockers); sys.exit(44)
          print('issue60 comments',issue['comments'],'main',main['commit']['sha'],'no actual V1 contention')
          PY

      - name: Execute setup-only molecular-only capture and kill at MYSTIC entry
        id: probe
        shell: bash -el {0}
        run: |
          set -uo pipefail
          OUT=deep-twilight-molecular-only-component-identity-v14-output
          PROBE="$OUT/probe"; mkdir -p "$PROBE"
          DATA_DIR="$CONDA_PREFIX/share/libRadtran/data"; GDB_PREFIX="$(cat "$OUT/gdb-prefix.txt")"
          set +e
          python "$OUT/capture_mystic_entry_v2.py" --uvspec "$(command -v uvspec)" --gdb "$GDB_PREFIX/bin/gdb" --data-dir "$DATA_DIR" --atmosphere "$DATA_DIR/atmmod/afglus.dat" --solar-flux "$DATA_DIR/solar_flux/atlas_plus_modtran" --output-dir "$PROBE" --package-explicit "$OUT/runtime-package-explicit-before.txt" --package-json "$OUT/runtime-package-list-before.json" > "$OUT/probe-command-stdout.txt" 2> "$OUT/probe-command-stderr.txt"
          status=$?
          set -e
          printf '%s\n' "$status" > "$OUT/probe-command-exit-code.txt"; echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if [ -f "$PROBE/randomseed" ]; then cp "$PROBE/randomseed" "$OUT/randomseed-consumed-evidence.txt"; fi

      - name: Prove exact runtime unchanged
        if: always()
        shell: bash -el {0}
        run: |
          set -euo pipefail
          OUT=deep-twilight-molecular-only-component-identity-v14-output
          micromamba list --explicit > "$OUT/runtime-package-explicit-after.txt"
          micromamba list --json > "$OUT/runtime-package-list-after.json"
          cmp "$OUT/runtime-package-explicit-before.txt" "$OUT/runtime-package-explicit-after.txt"
          cmp "$OUT/runtime-package-list-before.json" "$OUT/runtime-package-list-after.json"
          test "$(sha256sum "$(command -v uvspec)" | awk '{print $1}')" = "$UVSPEC_SHA256"

      - name: Evaluate preregistered molecular-only structural identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT=deep-twilight-molecular-only-component-identity-v14-output
          BASE_RAW="$(cat "$OUT/baseline-raw-path.txt")"
          PROBE_RAW="$(find "$OUT/probe" -type f -name 'mystic-entry-raw-v2.json' -print -quit)"
          test -n "$PROBE_RAW"
          python - "$BASE_RAW" "$PROBE_RAW" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          bp=Path(sys.argv[1]); pp=Path(sys.argv[2]); b=json.loads(bp.read_text()); p=json.loads(pp.read_text())
          errors=[]
          if b.get('status')!='EXACT_MYSTIC_ENTRY_RAW_OPTICAL_STATE_CAPTURED' or b.get('nCaoth')!=2: errors.append('reference shape/status')
          if p.get('status')!='EXACT_MYSTIC_ENTRY_RAW_OPTICAL_STATE_CAPTURED': errors.append('probe status')
          if not p.get('stoppedAtExactMysticEntry') or p.get('mysticBodyExecuted') or p.get('photonTraced'): errors.append('execution boundary')
          if b.get('nlyr')!=49 or p.get('nlyr')!=49 or p.get('nCaoth')!=1: errors.append('molecular-only shape')
          threed_equal=b['threed']['rawBytesHex']==p['threed']['rawBytesHex']; zprof_equal=b['zprof']['rawBytesHex']==p['zprof']['rawBytesHex']
          if not threed_equal: errors.append('threed changed')
          if not zprof_equal: errors.append('zprof changed')
          table_equal={}
          for name in ('dt_s','om_s','g1_s','g2_s','f_s','ds_s'):
              ok=(len(p['tables'][name]['rows'])==1 and b['tables'][name]['rows'][0]['rawBytesHex']==p['tables'][name]['rows'][0]['rawBytesHex'])
              table_equal[name]=ok
              if not ok: errors.append(f'{name} molecular row0 mismatch')
          decision={
            'schemaVersion':14,
            'status':'PASS_EXACT_RUNTIME_COMPONENT0_MOLECULAR_IDENTITY' if not errors else 'FAIL_EXACT_RUNTIME_MOLECULAR_IDENTITY_GATE',
            'referenceRun':34012593281,'referenceArtifactId':9982923548,'referenceCaptureSha256':hashlib.sha256(bp.read_bytes()).hexdigest(),
            'probeCaptureSha256':hashlib.sha256(pp.read_bytes()).hexdigest(),'freshSetupSeed':1926407831,'freshSetupSeedReusable':False,
            'referenceNCaoth':b.get('nCaoth'),'probeNCaoth':p.get('nCaoth'),'nlyr':p.get('nlyr'),
            'threedRawIdentical':threed_equal,'zprofRawIdentical':zprof_equal,'component0RawEqualityByTable':table_equal,
            'identityConclusion':'reference row0 is molecular-only; reference row1 is introduced by aerosol_default' if not errors else 'UNRESOLVED',
            'mysticBodyExecuted':False,'photonTraced':False,'scientificExecutionPerformed':False,'protectedResultOpened':False,'levelBChanged':False,'taylorOrJerusalemUsed':False,'epsilonSubstitutionUsed':False,
            'errors':errors,'claimBoundary':'exact frozen 550-nm runtime component identity only; no uniform AOD scaling claim and no renderer/deep-science authorization'}
          Path('deep-twilight-molecular-only-component-identity-v14-output/decision-v14.json').write_text(json.dumps(decision,indent=2,sort_keys=True)+'\n')
          print(json.dumps(decision,sort_keys=True))
          PY

      - name: Upload immutable V14 evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-twilight-molecular-only-component-identity-v14
          path: deep-twilight-molecular-only-component-identity-v14-output
          if-no-files-found: error
          retention-days: 90

      - name: Enforce molecular-only identity decision
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.probe.outputs.exit_code }}" = "0"
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('deep-twilight-molecular-only-component-identity-v14-output/decision-v14.json').read_text())
          assert d['status']=='PASS_EXACT_RUNTIME_COMPONENT0_MOLECULAR_IDENTITY', d
          assert d['probeNCaoth']==1 and all(d['component0RawEqualityByTable'].values())
          assert d['mysticBodyExecuted'] is False and d['photonTraced'] is False and d['epsilonSubstitutionUsed'] is False
          PY
