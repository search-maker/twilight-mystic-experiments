name: Deep twilight exact MYSTIC static ABI probe v2

on:
  push:
    branches:
      - review/deep-twilight-mystic-entry-abi-static-v2
    paths:
      - ".github/workflows/deep-twilight-mystic-entry-abi-static-v2.yml"

permissions:
  contents: read

jobs:
  exact-static-abi-probe:
    if: >-
      github.run_attempt == 1 &&
      github.event.before == 'fe6e063c568394ae7b4e90222de270d3f2460455'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Freeze v1 terminal evidence and zero-execution boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/review/deep-twilight-mystic-entry-abi-static-v2"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "${{ github.event.before }}" = "fe6e063c568394ae7b4e90222de270d3f2460455"
          mkdir -p deep-twilight-mystic-static-abi-v2-output
          cat > deep-twilight-mystic-static-abi-v2-output/PROTOCOL.txt <<'EOF'
          DEEP TWILIGHT MYSTIC STATIC ABI PROBE V2
          POST_V1 / NONBLOCKING / ZERO-SCIENCE / STATIC-ONLY
          Predecessor run 34011919740 attempt 1 is immutable terminal FAILURE and must never be rerun/retried/resumed.
          Predecessor stopped at exact symbol mystic before body execution but raw SysV register interpretation failed: rsi lower32=4025766496, not plausible n_caoth.
          Predecessor setup generated default randomseed file value 1788672559 before the breakpoint; that value is conservatively treated as consumed/non-reusable even though no photon was traced.
          This V2 probe MUST NOT execute uvspec at all. It only inspects the exact pinned ELF/DWARF/static disassembly to recover the binary's actual ABI evidence.
          It allocates no MYSTIC seed, traces no photon, opens no protected result, changes no Level-B science, and performs no Taylor/Jerusalem fitting.
          EOF

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: deep-twilight-mystic-entry-abi-static-v2
          create-args: >-
            -c conda-forge
            python=3.12.4
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Freeze exact target binary identity without executing it
        shell: bash -el {0}
        run: |
          set -euo pipefail
          OUT=deep-twilight-mystic-static-abi-v2-output
          UVSPEC="$(command -v uvspec)"
          printf '%s\n' "$UVSPEC" > "$OUT/uvspec-path.txt"
          sha256sum "$UVSPEC" | tee "$OUT/uvspec-sha256.txt"
          test "$(sha256sum "$UVSPEC" | awk '{print $1}')" = "2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3"
          file "$UVSPEC" | tee "$OUT/uvspec-file.txt"
          file "$UVSPEC" | grep -Eq 'x86-64|x86_64'
          micromamba list --explicit > "$OUT/runtime-package-explicit.txt"
          micromamba list --json > "$OUT/runtime-package-list.json"
          nm -an "$UVSPEC" > "$OUT/uvspec-nm.txt"
          test "$(awk '$3=="mystic" {print $1}' "$OUT/uvspec-nm.txt" | sort -u | wc -l)" -eq 1
          readelf -h -S -Ws "$UVSPEC" > "$OUT/uvspec-readelf-headers-symbols.txt"
          objdump -d -Mintel --disassemble=mystic "$UVSPEC" > "$OUT/mystic-objdump-intel.txt"
          test ! -e randomseed
          test ! -e "$OUT/randomseed"

      - name: Create isolated debugger environment
        shell: bash -el {0}
        run: |
          set -euo pipefail
          OUT=deep-twilight-mystic-static-abi-v2-output
          GDB_PREFIX="$RUNNER_TEMP/deep-twilight-gdb-tools-static-v2"
          micromamba create -y -p "$GDB_PREFIX" -c conda-forge python=3.12.4 gdb=17.2
          micromamba list -p "$GDB_PREFIX" --explicit > "$OUT/gdb-package-explicit.txt"
          micromamba list -p "$GDB_PREFIX" --json > "$OUT/gdb-package-list.json"
          "$GDB_PREFIX/bin/gdb" --version > "$OUT/gdb-version.txt"
          printf '%s\n' "$GDB_PREFIX" > "$OUT/gdb-prefix.txt"

      - name: Extract exact DWARF function type and entry disassembly statically
        shell: bash -el {0}
        run: |
          set -euo pipefail
          OUT=deep-twilight-mystic-static-abi-v2-output
          UVSPEC="$(cat "$OUT/uvspec-path.txt")"
          GDB_PREFIX="$(cat "$OUT/gdb-prefix.txt")"
          cat > "$OUT/static-abi.gdb" <<EOF
          set pagination off
          set confirm off
          set debuginfod enabled off
          file $UVSPEC
          echo === WHATIS_MYSTIC ===\n
          whatis mystic
          echo === PTYPE_MYSTIC ===\n
          ptype mystic
          echo === INFO_ADDRESS_MYSTIC ===\n
          info address mystic
          echo === INFO_LINE_MYSTIC ===\n
          info line mystic
          echo === DISASSEMBLE_MYSTIC_ENTRY ===\n
          disassemble /r mystic,mystic+256
          echo === END_STATIC_ABI ===\n
          quit
          EOF
          "$GDB_PREFIX/bin/gdb" -q -nx --batch -x "$OUT/static-abi.gdb" > "$OUT/gdb-static-abi-stdout.txt" 2> "$OUT/gdb-static-abi-stderr.txt"
          test -s "$OUT/gdb-static-abi-stdout.txt"
          grep -F '=== WHATIS_MYSTIC ===' "$OUT/gdb-static-abi-stdout.txt"
          grep -F '=== PTYPE_MYSTIC ===' "$OUT/gdb-static-abi-stdout.txt"
          grep -F '=== DISASSEMBLE_MYSTIC_ENTRY ===' "$OUT/gdb-static-abi-stdout.txt"
          grep -F '=== END_STATIC_ABI ===' "$OUT/gdb-static-abi-stdout.txt"
          test ! -e randomseed
          test ! -e "$OUT/randomseed"

      - name: Extract DWARF DIE neighborhood and static call-site context
        shell: bash -el {0}
        run: |
          set -euo pipefail
          OUT=deep-twilight-mystic-static-abi-v2-output
          UVSPEC="$(cat "$OUT/uvspec-path.txt")"
          readelf --debug-dump=info "$UVSPEC" > "$OUT/uvspec-dwarf-info-full.txt"
          python - <<'PY'
          from pathlib import Path
          root = Path('deep-twilight-mystic-static-abi-v2-output')
          lines = (root / 'uvspec-dwarf-info-full.txt').read_text(errors='replace').splitlines()
          hits = [i for i, line in enumerate(lines) if 'DW_AT_name' in line and 'mystic' in line]
          with (root / 'mystic-dwarf-neighborhoods.txt').open('w') as out:
              for i in hits:
                  lo = max(0, i - 35)
                  hi = min(len(lines), i + 140)
                  out.write(f'===== hit line {i+1} =====\n')
                  out.write('\n'.join(lines[lo:hi]))
                  out.write('\n')
          if not hits:
              raise SystemExit('no DWARF mystic name hit')
          PY
          objdump -d -Mintel "$UVSPEC" > "$OUT/uvspec-objdump-intel-full.txt"
          python - <<'PY'
          from pathlib import Path
          root = Path('deep-twilight-mystic-static-abi-v2-output')
          lines = (root / 'uvspec-objdump-intel-full.txt').read_text(errors='replace').splitlines()
          hits = [i for i, line in enumerate(lines) if 'call' in line and '<mystic>' in line]
          with (root / 'mystic-call-sites.txt').open('w') as out:
              for i in hits:
                  lo = max(0, i - 80)
                  hi = min(len(lines), i + 30)
                  out.write(f'===== call-site line {i+1} =====\n')
                  out.write('\n'.join(lines[lo:hi]))
                  out.write('\n')
          if not hits:
              raise SystemExit('no direct static call to <mystic> found')
          PY
          rm "$OUT/uvspec-dwarf-info-full.txt" "$OUT/uvspec-objdump-intel-full.txt"
          test ! -e randomseed
          test ! -e "$OUT/randomseed"

      - name: Write static-only decision record
        shell: bash
        run: |
          set -euo pipefail
          OUT=deep-twilight-mystic-static-abi-v2-output
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('deep-twilight-mystic-static-abi-v2-output')
          abi = (root / 'gdb-static-abi-stdout.txt').read_bytes()
          dwarf = (root / 'mystic-dwarf-neighborhoods.txt').read_bytes()
          calls = (root / 'mystic-call-sites.txt').read_bytes()
          decision = {
              'schemaVersion': 1,
              'stageId': 'deep-twilight-mystic-entry-abi-static-v2',
              'status': 'PASS_STATIC_EXACT_BINARY_ABI_EVIDENCE_CAPTURED',
              'predecessorRun': 34011919740,
              'predecessorAttempt': 1,
              'predecessorRerunPermitted': False,
              'predecessorImplicitRandomseed': 1788672559,
              'predecessorImplicitRandomseedReusable': False,
              'uvspecSha256': '2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3',
              'uvspecExecuted': False,
              'mysticExecuted': False,
              'photonTraced': False,
              'randomSeedAllocated': False,
              'protectedResultOpened': False,
              'levelBChanged': False,
              'taylorOrJerusalemUsed': False,
              'epsilonSubstitutionUsed': False,
              'githubRerunPermitted': False,
              'gdbAbiSha256': hashlib.sha256(abi).hexdigest(),
              'dwarfNeighborhoodsSha256': hashlib.sha256(dwarf).hexdigest(),
              'callSitesSha256': hashlib.sha256(calls).hexdigest(),
              'claimBoundary': 'static exact-binary ABI/provenance evidence only; no runtime array capture or science claim',
          }
          (root / 'decision.json').write_text(json.dumps(decision, indent=2, sort_keys=True) + '\n')
          PY
          test ! -e randomseed
          test ! -e "$OUT/randomseed"

      - name: Upload static ABI evidence
        uses: actions/upload-artifact@v4
        with:
          name: deep-twilight-mystic-entry-abi-static-v2
          path: deep-twilight-mystic-static-abi-v2-output
          if-no-files-found: error
          retention-days: 90

      - name: Enforce zero-execution static decision
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('deep-twilight-mystic-static-abi-v2-output')
          d = json.loads((root / 'decision.json').read_text())
          assert d['status'] == 'PASS_STATIC_EXACT_BINARY_ABI_EVIDENCE_CAPTURED'
          assert d['uvspecExecuted'] is False
          assert d['mysticExecuted'] is False
          assert d['photonTraced'] is False
          assert d['randomSeedAllocated'] is False
          assert d['predecessorImplicitRandomseedReusable'] is False
          assert d['protectedResultOpened'] is False
          assert d['levelBChanged'] is False
          assert d['taylorOrJerusalemUsed'] is False
          assert d['epsilonSubstitutionUsed'] is False
          assert d['githubRerunPermitted'] is False
          PY
          test ! -e randomseed
          test ! -e deep-twilight-mystic-static-abi-v2-output/randomseed
