name: Deep twilight exact MYSTIC static ABI probe v3

on:
  push:
    branches:
      - review/deep-twilight-mystic-entry-abi-static-v3
    paths:
      - ".github/workflows/deep-twilight-mystic-entry-abi-static-v3.yml"

permissions:
  contents: read

jobs:
  exact-static-abi-probe:
    if: >-
      github.run_attempt == 1 &&
      github.event.before == 'fe6e063c568394ae7b4e90222de270d3f2460455'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Freeze predecessor evidence and zero-execution boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/review/deep-twilight-mystic-entry-abi-static-v3"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "${{ github.event.before }}" = "fe6e063c568394ae7b4e90222de270d3f2460455"
          OUT=deep-twilight-mystic-static-abi-v3-output
          mkdir -p "$OUT"
          cat > "$OUT/PROTOCOL.txt" <<'EOF'
          DEEP TWILIGHT MYSTIC STATIC ABI PROBE V3
          POST_V1 / NONBLOCKING / ZERO-SCIENCE / STATIC-ONLY

          Immutable predecessors; NEVER GitHub Re-run/retry/resume:
          - Runtime-entry V1 run 34011919740 attempt 1: terminal FAILURE after stopping at exact symbol mystic before body execution; raw register assumption for n_caoth was disproved. Setup generated default randomseed 1788672559 before entry. Treat 1788672559 as consumed/non-reusable although no photon was traced.
          - Static V2 run 34012057330 attempt 1: terminal FAILURE only because an auxiliary naive readelf DW_AT_name text search was made fatal after the primary GDB static ABI extraction had succeeded. No uvspec execution and no seed allocation occurred. Its runner-local GDB ABI stdout was not persisted because artifact upload was incorrectly downstream of the auxiliary failure.

          V3 MUST NOT execute uvspec. It only interrogates the exact pinned uvspec ELF with static tooling/GDB `file` commands. Auxiliary DWARF/call-site searches are evidence-only and non-fatal. The artifact upload is unconditional (`if: always()`) so the primary GDB evidence survives even if later checks fail.

          No MYSTIC execution, no photons, no random seed allocation, no protected result opening, no Level-B mutation, no Taylor/Jerusalem fitting, no epsilon substitution.
          EOF

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: deep-twilight-mystic-entry-abi-static-v3
          create-args: >-
            -c conda-forge
            python=3.12.4
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Freeze exact target binary identity without executing it
        shell: bash -el {0}
        run: |
          set -euo pipefail
          OUT=deep-twilight-mystic-static-abi-v3-output
          UVSPEC="$(command -v uvspec)"
          printf '%s\n' "$UVSPEC" > "$OUT/uvspec-path.txt"
          sha256sum "$UVSPEC" | tee "$OUT/uvspec-sha256.txt"
          test "$(sha256sum "$UVSPEC" | awk '{print $1}')" = "2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3"
          file "$UVSPEC" | tee "$OUT/uvspec-file.txt"
          file "$UVSPEC" | grep -Eq 'x86-64|x86_64'
          micromamba list --explicit > "$OUT/runtime-package-explicit.txt"
          micromamba list --json > "$OUT/runtime-package-list.json"
          nm -an "$UVSPEC" > "$OUT/uvspec-nm.txt"
          test "$(awk '$3=="mystic" {print $1}' "$OUT/uvspec-nm.txt" | sort -u | wc -l)" -eq 1
          readelf -h -S -Ws "$UVSPEC" > "$OUT/uvspec-readelf-headers-symbols.txt"
          objdump -d -Mintel --disassemble=mystic "$UVSPEC" > "$OUT/mystic-objdump-intel.txt"
          test ! -e randomseed
          test ! -e "$OUT/randomseed"

      - name: Create isolated debugger environment
        shell: bash -el {0}
        run: |
          set -euo pipefail
          OUT=deep-twilight-mystic-static-abi-v3-output
          GDB_PREFIX="$RUNNER_TEMP/deep-twilight-gdb-tools-static-v3"
          micromamba create -y -p "$GDB_PREFIX" -c conda-forge python=3.12.4 gdb=17.2
          micromamba list -p "$GDB_PREFIX" --explicit > "$OUT/gdb-package-explicit.txt"
          micromamba list -p "$GDB_PREFIX" --json > "$OUT/gdb-package-list.json"
          "$GDB_PREFIX/bin/gdb" --version > "$OUT/gdb-version.txt"
          printf '%s\n' "$GDB_PREFIX" > "$OUT/gdb-prefix.txt"

      - name: Persist exact-binary GDB type and entry evidence
        id: primary
        shell: bash -el {0}
        run: |
          set -uo pipefail
          OUT=deep-twilight-mystic-static-abi-v3-output
          UVSPEC="$(cat "$OUT/uvspec-path.txt")"
          GDB_PREFIX="$(cat "$OUT/gdb-prefix.txt")"
          cat > "$OUT/static-abi.gdb" <<EOF
          set pagination off
          set confirm off
          set debuginfod enabled off
          file $UVSPEC
          echo === WHATIS_MYSTIC ===\n
          whatis mystic
          echo === PTYPE_MYSTIC ===\n
          ptype mystic
          echo === INFO_ADDRESS_MYSTIC ===\n
          info address mystic
          echo === INFO_LINE_MYSTIC ===\n
          info line mystic
          echo === INFO_FUNCTIONS_EXACT_MYSTIC ===\n
          info functions ^mystic$
          echo === DISASSEMBLE_MYSTIC_ENTRY ===\n
          disassemble /r mystic,mystic+320
          echo === END_STATIC_ABI ===\n
          quit
          EOF
          set +e
          "$GDB_PREFIX/bin/gdb" -q -nx --batch -x "$OUT/static-abi.gdb" > "$OUT/gdb-static-abi-stdout.txt" 2> "$OUT/gdb-static-abi-stderr.txt"
          status=$?
          set -e
          printf '%s\n' "$status" > "$OUT/gdb-static-abi-exit-code.txt"
          echo "gdb_exit_code=$status" >> "$GITHUB_OUTPUT"
          cat "$OUT/gdb-static-abi-stdout.txt"
          if [ -s "$OUT/gdb-static-abi-stderr.txt" ]; then
            echo '=== GDB STDERR (audit) ==='
            cat "$OUT/gdb-static-abi-stderr.txt"
          fi
          test ! -e randomseed
          test ! -e "$OUT/randomseed"
          exit "$status"

      - name: Collect auxiliary DWARF and call-site evidence non-fatally
        if: always()
        shell: bash -el {0}
        run: |
          set -uo pipefail
          OUT=deep-twilight-mystic-static-abi-v3-output
          UVSPEC="$(cat "$OUT/uvspec-path.txt" 2>/dev/null || true)"
          : > "$OUT/auxiliary-status.txt"
          if [ -n "$UVSPEC" ] && [ -f "$UVSPEC" ]; then
            readelf --debug-dump=info "$UVSPEC" > "$OUT/uvspec-dwarf-info-full.txt" 2> "$OUT/readelf-dwarf-stderr.txt" || true
            python - <<'PY' || true
          from pathlib import Path
          root = Path('deep-twilight-mystic-static-abi-v3-output')
          source = root / 'uvspec-dwarf-info-full.txt'
          lines = source.read_text(errors='replace').splitlines() if source.exists() else []
          hits = [i for i, line in enumerate(lines) if 'mystic' in line.lower()]
          (root / 'dwarf-mystic-hit-count.txt').write_text(f'{len(hits)}\n')
          with (root / 'mystic-dwarf-neighborhoods.txt').open('w') as out:
              for i in hits[:50]:
                  lo = max(0, i - 35)
                  hi = min(len(lines), i + 140)
                  out.write(f'===== hit line {i+1} =====\n')
                  out.write('\n'.join(lines[lo:hi]))
                  out.write('\n')
          PY
            objdump -d -Mintel "$UVSPEC" > "$OUT/uvspec-objdump-intel-full.txt" 2> "$OUT/objdump-full-stderr.txt" || true
            python - <<'PY' || true
          from pathlib import Path
          root = Path('deep-twilight-mystic-static-abi-v3-output')
          source = root / 'uvspec-objdump-intel-full.txt'
          lines = source.read_text(errors='replace').splitlines() if source.exists() else []
          hits = [i for i, line in enumerate(lines) if 'call' in line and 'mystic' in line.lower()]
          (root / 'mystic-call-site-hit-count.txt').write_text(f'{len(hits)}\n')
          with (root / 'mystic-call-sites.txt').open('w') as out:
              for i in hits[:50]:
                  lo = max(0, i - 100)
                  hi = min(len(lines), i + 40)
                  out.write(f'===== call-site line {i+1} =====\n')
                  out.write('\n'.join(lines[lo:hi]))
                  out.write('\n')
          PY
            rm -f "$OUT/uvspec-dwarf-info-full.txt" "$OUT/uvspec-objdump-intel-full.txt"
            printf 'auxiliary_searches=completed_non_authorizing_non_fatal\n' >> "$OUT/auxiliary-status.txt"
          else
            printf 'auxiliary_searches=skipped_missing_uvspec_path\n' >> "$OUT/auxiliary-status.txt"
          fi
          test ! -e randomseed
          test ! -e "$OUT/randomseed"

      - name: Write static-only decision record
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          OUT=deep-twilight-mystic-static-abi-v3-output
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('deep-twilight-mystic-static-abi-v3-output')
          def raw(name):
              p = root / name
              return p.read_bytes() if p.exists() else b''
          def text(name):
              p = root / name
              return p.read_text(errors='replace') if p.exists() else ''
          gdb_exit_text = text('gdb-static-abi-exit-code.txt').strip()
          gdb_exit = int(gdb_exit_text) if gdb_exit_text.isdigit() else None
          stdout = text('gdb-static-abi-stdout.txt')
          primary_complete = (
              gdb_exit == 0 and
              '=== WHATIS_MYSTIC ===' in stdout and
              '=== PTYPE_MYSTIC ===' in stdout and
              '=== INFO_ADDRESS_MYSTIC ===' in stdout and
              '=== DISASSEMBLE_MYSTIC_ENTRY ===' in stdout and
              '=== END_STATIC_ABI ===' in stdout and
              'No symbol "mystic"' not in stdout and
              "No symbol 'mystic'" not in stdout
          )
          decision = {
              'schemaVersion': 1,
              'stageId': 'deep-twilight-mystic-entry-abi-static-v3',
              'status': 'PASS_STATIC_EXACT_BINARY_ABI_EVIDENCE_CAPTURED' if primary_complete else 'FAIL_STATIC_EXACT_BINARY_ABI_EVIDENCE_INCOMPLETE',
              'predecessorRuntimeRun': 34011919740,
              'predecessorStaticRun': 34012057330,
              'predecessorAttempts': 1,
              'predecessorRerunPermitted': False,
              'predecessorImplicitRandomseed': 1788672559,
              'predecessorImplicitRandomseedReusable': False,
              'uvspecSha256Expected': '2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3',
              'uvspecExecuted': False,
              'mysticExecuted': False,
              'photonTraced': False,
              'randomSeedAllocated': False,
              'protectedResultOpened': False,
              'levelBChanged': False,
              'taylorOrJerusalemUsed': False,
              'epsilonSubstitutionUsed': False,
              'githubRerunPermitted': False,
              'gdbExitCode': gdb_exit,
              'primaryGdbEvidenceComplete': primary_complete,
              'gdbAbiSha256': hashlib.sha256(raw('gdb-static-abi-stdout.txt')).hexdigest(),
              'objdumpMysticSha256': hashlib.sha256(raw('mystic-objdump-intel.txt')).hexdigest(),
              'auxiliaryDwarfMysticHitCount': text('dwarf-mystic-hit-count.txt').strip() or None,
              'auxiliaryCallSiteHitCount': text('mystic-call-site-hit-count.txt').strip() or None,
              'claimBoundary': 'static exact-binary ABI/provenance evidence only; no runtime array capture or science claim',
          }
          (root / 'decision.json').write_text(json.dumps(decision, indent=2, sort_keys=True) + '\n')
          print(json.dumps(decision, sort_keys=True))
          PY

      - name: Upload complete static ABI evidence regardless of outcome
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-twilight-mystic-entry-abi-static-v3
          path: deep-twilight-mystic-static-abi-v3-output
          if-no-files-found: error
          retention-days: 90

      - name: Enforce zero-execution primary decision
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT=deep-twilight-mystic-static-abi-v3-output
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('deep-twilight-mystic-static-abi-v3-output')
          d = json.loads((root / 'decision.json').read_text())
          assert d['status'] == 'PASS_STATIC_EXACT_BINARY_ABI_EVIDENCE_CAPTURED'
          assert d['primaryGdbEvidenceComplete'] is True
          assert d['gdbExitCode'] == 0
          assert d['uvspecExecuted'] is False
          assert d['mysticExecuted'] is False
          assert d['photonTraced'] is False
          assert d['randomSeedAllocated'] is False
          assert d['predecessorImplicitRandomseedReusable'] is False
          assert d['protectedResultOpened'] is False
          assert d['levelBChanged'] is False
          assert d['taylorOrJerusalemUsed'] is False
          assert d['epsilonSubstitutionUsed'] is False
          assert d['githubRerunPermitted'] is False
          PY
          test ! -e randomseed
          test ! -e "$OUT/randomseed"
