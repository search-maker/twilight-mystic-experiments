name: Deep twilight corrected MYSTIC-entry optical-state capture v2

on:
  push:
    branches:
      - review/deep-twilight-mystic-entry-optprop-capture-v2
    paths:
      - ".github/workflows/deep-twilight-mystic-entry-optprop-capture-v2.yml"

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  exact-entry-capture-v2:
    if: >-
      github.run_attempt == 1 &&
      github.event.before == '5f2905312f901501fcb5d0eb159d7eac858aeff0'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Freeze corrected ABI and seed-consumption contract
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/review/deep-twilight-mystic-entry-optprop-capture-v2"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "${{ github.event.before }}" = "5f2905312f901501fcb5d0eb159d7eac858aeff0"
          OUT=deep-twilight-mystic-entry-optprop-capture-v2-output
          mkdir -p "$OUT"
          python -m py_compile review/deep-twilight-mystic-entry-optprop-capture-v2/capture_mystic_entry_v2.py
          cat > "$OUT/PROTOCOL.txt" <<'EOF'
          DEEP TWILIGHT MYSTIC ENTRY OPTICAL STATE CAPTURE V2
          POST_V1 / NONBLOCKING / SETUP-ONLY / NO PHOTON TRACE

          Frozen target runtime:
          - rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          - uvspec SHA256 2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3
          - AFGL-US, aerosol_default, aerosol_set_tau_at_wvl 550 0.150000, 550 nm CRS
          - fresh explicit setup-only seed 1173101368; external pre-dispatch repository search found no prior occurrence.
            This seed becomes CONSUMED/NON-REUSABLE as soon as uvspec initializes the RNG, even though the debugger
            kills the process at the first MYSTIC instruction before any photon can be traced.

          Immutable predecessors; NEVER rerun/retry/resume:
          - runtime V1 run 34011919740 attempt1: exact-entry stop succeeded but old ABI assumption was wrong;
            its implicit setup seed 1788672559 is permanently consumed/non-reusable; zero MYSTIC-body instructions/photon traces.
          - static V2 run 34012057330 attempt1: auxiliary evidence-persistence defect only; zero uvspec execution.
          - static V3 run 34012173125 attempt1: primary static exact-binary ABI evidence PASS; zero uvspec execution.
          - exact-source-recovery V1 run 34012311118 attempt1: official server currently returns a 2.0.6 tarball with
            SHA256 64930cc40b6e4a37aa220520974d330fc1563796f466a649b2238131f2d69840, which DOES NOT equal the conda
            feedstock's frozen historical source SHA256 999e47f4af4b5df6f85a6887fc105fc8f6e1a7cee89a3124f69ac8d8912c8e85.
            Therefore that tarball is not accepted as exact historical source provenance and the failed run is immutable.

          Corrected ABI evidence:
          - exact pinned binary prologue stores rdi/rsi as pointer width, edx as 32-bit, rcx/r8/r9 as pointers,
            and loads the first spilled pointer from entry rsp+8.
          - the currently served official 2.0.6 source (non-authoritative for historical byte provenance because of the
            hash mismatch above) independently corroborates the semantic prefix:
              int *nlyr, int *threed, int n_caoth, float **dt_s, float **om_s,
              float **g1_s, float **g2_s, float **f_s, float **ds_s, ...
            and places float *zprof at the stack slot corresponding to entry rsp+0x58.
          - V2 therefore captures raw native float32 bits for dt_s/om_s/g1_s/g2_s/f_s/ds_s, raw threed int32,
            and raw zprof float32 at exact MYSTIC entry. Raw bits are authoritative; decimal decodes are audit-only.
          - semantic row translation / independent-renderer parity remains a separate gate. No result from this stage
            may alter Level-B 2.0-10.5 deg or be treated as protected validation/science output.

          Forbidden here: Taylor/Jerusalem tuning, epsilon-for-zero, protected result opening, photon tracing,
          MYSTIC-body execution, Level-B mutation, GitHub rerun/retry/resume, or seed reuse.
          EOF
          grep -F 'EXPECTED_SEED = 1173101368' review/deep-twilight-mystic-entry-optprop-capture-v2/capture_mystic_entry_v2.py
          grep -F 'aerosol_set_tau_at_wvl 550 {EXPECTED_AOD550:.6f}' review/deep-twilight-mystic-entry-optprop-capture-v2/capture_mystic_entry_v2.py

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: deep-twilight-mystic-entry-optprop-capture-v2
          create-args: >-
            -c conda-forge
            python=3.12.4
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Freeze exact target runtime identity
        shell: bash -el {0}
        run: |
          set -euo pipefail
          OUT=deep-twilight-mystic-entry-optprop-capture-v2-output
          micromamba list --explicit > "$OUT/runtime-package-explicit-before.txt"
          micromamba list --json > "$OUT/runtime-package-list-before.json"
          UVSPEC="$(command -v uvspec)"
          sha256sum "$UVSPEC" | tee "$OUT/uvspec-sha256.txt"
          test "$(sha256sum "$UVSPEC" | awk '{print $1}')" = "2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3"
          file "$UVSPEC" | tee "$OUT/uvspec-file-preflight.txt"
          file "$UVSPEC" | grep -Eq 'x86-64|x86_64'
          nm -an "$UVSPEC" > "$OUT/uvspec-nm-preflight.txt"
          test "$(awk '$3=="mystic" {print $1}' "$OUT/uvspec-nm-preflight.txt" | sort -u | wc -l)" -eq 1
          objdump -d -Mintel --disassemble=mystic "$UVSPEC" > "$OUT/mystic-prologue-preflight.txt"
          grep -F 'mov    QWORD PTR [rsp+0x60],rdi' "$OUT/mystic-prologue-preflight.txt"
          grep -F 'mov    QWORD PTR [rsp+0x208],rsi' "$OUT/mystic-prologue-preflight.txt"
          grep -F 'mov    DWORD PTR [rsp+0x78],edx' "$OUT/mystic-prologue-preflight.txt"
          grep -F 'mov    QWORD PTR [rsp+0x188],rcx' "$OUT/mystic-prologue-preflight.txt"
          grep -F 'mov    QWORD PTR [rsp+0x198],r8' "$OUT/mystic-prologue-preflight.txt"
          grep -F 'mov    QWORD PTR [rsp+0x1a0],r9' "$OUT/mystic-prologue-preflight.txt"
          grep -F 'mov    rax,QWORD PTR [rsp+0x400]' "$OUT/mystic-prologue-preflight.txt"
          test ! -e randomseed
          test ! -e "$OUT/randomseed"

      - name: Create isolated debugger environment
        shell: bash -el {0}
        run: |
          set -euo pipefail
          OUT=deep-twilight-mystic-entry-optprop-capture-v2-output
          GDB_PREFIX="$RUNNER_TEMP/deep-twilight-gdb-tools-entry-v2"
          micromamba create -y -p "$GDB_PREFIX" -c conda-forge python=3.12.4 gdb=17.2
          micromamba list -p "$GDB_PREFIX" --explicit > "$OUT/gdb-package-explicit.txt"
          micromamba list -p "$GDB_PREFIX" --json > "$OUT/gdb-package-list.json"
          "$GDB_PREFIX/bin/gdb" --version > "$OUT/gdb-version-preflight.txt"
          printf '%s\n' "$GDB_PREFIX" > "$OUT/gdb-prefix.txt"

      - name: Capture exact raw pre-MYSTIC optical state and kill at entry
        id: capture
        shell: bash -el {0}
        run: |
          set -uo pipefail
          OUT=deep-twilight-mystic-entry-optprop-capture-v2-output
          DATA_DIR="$CONDA_PREFIX/share/libRadtran/data"
          GDB_PREFIX="$(cat "$OUT/gdb-prefix.txt")"
          set +e
          python review/deep-twilight-mystic-entry-optprop-capture-v2/capture_mystic_entry_v2.py \
            --uvspec "$(command -v uvspec)" \
            --gdb "$GDB_PREFIX/bin/gdb" \
            --data-dir "$DATA_DIR" \
            --atmosphere "$DATA_DIR/atmmod/afglus.dat" \
            --solar-flux "$DATA_DIR/solar_flux/atlas_plus_modtran" \
            --output-dir "$OUT" \
            --package-explicit "$OUT/runtime-package-explicit-before.txt" \
            --package-json "$OUT/runtime-package-list-before.json" \
            > "$OUT/capture-command-stdout.txt" \
            2> "$OUT/capture-command-stderr.txt"
          status=$?
          set -e
          printf '%s\n' "$status" > "$OUT/capture-command-exit-code.txt"
          echo "capture_exit_code=$status" >> "$GITHUB_OUTPUT"
          if [ -f "$OUT/randomseed" ]; then
            cp "$OUT/randomseed" "$OUT/randomseed-consumed-evidence.txt"
          fi

      - name: Prove target environment remained unchanged
        if: always()
        shell: bash -el {0}
        run: |
          set -euo pipefail
          OUT=deep-twilight-mystic-entry-optprop-capture-v2-output
          micromamba list --explicit > "$OUT/runtime-package-explicit-after.txt"
          micromamba list --json > "$OUT/runtime-package-list-after.json"
          cmp "$OUT/runtime-package-explicit-before.txt" "$OUT/runtime-package-explicit-after.txt"
          cmp "$OUT/runtime-package-list-before.json" "$OUT/runtime-package-list-after.json"
          test "$(sha256sum "$(command -v uvspec)" | awk '{print $1}')" = "2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3"

      - name: Write fail-closed run decision
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          OUT=deep-twilight-mystic-entry-optprop-capture-v2-output
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('deep-twilight-mystic-entry-optprop-capture-v2-output')
          def text(name):
              p = root / name
              return p.read_text(errors='replace') if p.exists() else ''
          exit_text = text('capture-command-exit-code.txt').strip()
          exit_code = int(exit_text) if exit_text.isdigit() else None
          summary_path = root / 'capture-summary-v2.json'
          capture_path = root / 'mystic-entry-raw-v2.json'
          summary = json.loads(summary_path.read_text()) if summary_path.exists() else {}
          capture = json.loads(capture_path.read_text()) if capture_path.exists() else {}
          seed_line = text('randomseed-consumed-evidence.txt').splitlines()[0].strip() if text('randomseed-consumed-evidence.txt').splitlines() else None
          complete = (
              exit_code == 0 and
              summary.get('status') == 'PASS_EXACT_MYSTIC_ENTRY_RAW_OPTICAL_STATE_ACCESSIBLE' and
              capture.get('status') == 'EXACT_MYSTIC_ENTRY_RAW_OPTICAL_STATE_CAPTURED' and
              capture.get('stoppedAtExactMysticEntry') is True and
              capture.get('mysticBodyExecuted') is False and
              capture.get('photonTraced') is False and
              capture.get('nCaoth') == 2 and
              seed_line == '1173101368'
          )
          decision = {
              'schemaVersion': 2,
              'stageId': 'deep-twilight-mystic-entry-optprop-capture-v2',
              'status': 'PASS_EXACT_PREMYSTIC_OPTICAL_STATE_CAPTURED' if complete else 'FAIL_EXACT_PREMYSTIC_OPTICAL_STATE_CAPTURE_INCOMPLETE',
              'captureExitCode': exit_code,
              'freshSeed': 1173101368,
              'freshSeedConsumed': True,
              'freshSeedReusable': False,
              'predecessorV1ImplicitSeed': 1788672559,
              'predecessorV1ImplicitSeedReusable': False,
              'mysticBodyExecuted': False,
              'photonTraced': False,
              'scientificExecutionPerformed': False,
              'protectedResultOpened': False,
              'levelBChanged': False,
              'taylorOrJerusalemUsed': False,
              'epsilonSubstitutionUsed': False,
              'githubRerunPermitted': False,
              'historicalExactSourceRecovered': False,
              'historicalSourceExpectedSha256': '999e47f4af4b5df6f85a6887fc105fc8f6e1a7cee89a3124f69ac8d8912c8e85',
              'currentlyServedArchiveObservedSha256': '64930cc40b6e4a37aa220520974d330fc1563796f466a649b2238131f2d69840',
              'claimBoundary': 'lossless exact pinned-runtime optical ABI state only; independent-renderer semantic parity remains unpassed and no deep science claim is authorized',
          }
          (root / 'decision-v2.json').write_text(json.dumps(decision, indent=2, sort_keys=True) + '\n')
          print(json.dumps(decision, sort_keys=True))
          PY

      - name: Upload complete immutable capture evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-twilight-mystic-entry-optprop-capture-v2
          path: deep-twilight-mystic-entry-optprop-capture-v2-output
          if-no-files-found: error
          retention-days: 90

      - name: Enforce setup-only exact-state decision
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT=deep-twilight-mystic-entry-optprop-capture-v2-output
          test "${{ steps.capture.outputs.capture_exit_code }}" = "0"
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('deep-twilight-mystic-entry-optprop-capture-v2-output')
          d = json.loads((root / 'decision-v2.json').read_text())
          s = json.loads((root / 'capture-summary-v2.json').read_text())
          c = json.loads((root / 'mystic-entry-raw-v2.json').read_text())
          assert d['status'] == 'PASS_EXACT_PREMYSTIC_OPTICAL_STATE_CAPTURED'
          assert d['freshSeed'] == 1173101368
          assert d['freshSeedConsumed'] is True
          assert d['freshSeedReusable'] is False
          assert d['predecessorV1ImplicitSeedReusable'] is False
          assert d['mysticBodyExecuted'] is False
          assert d['photonTraced'] is False
          assert d['scientificExecutionPerformed'] is False
          assert d['protectedResultOpened'] is False
          assert d['levelBChanged'] is False
          assert d['taylorOrJerusalemUsed'] is False
          assert d['epsilonSubstitutionUsed'] is False
          assert d['githubRerunPermitted'] is False
          assert s['status'] == 'PASS_EXACT_MYSTIC_ENTRY_RAW_OPTICAL_STATE_ACCESSIBLE'
          assert s['randomSeed'] == 1173101368
          assert s['randomSeedConsumed'] is True
          assert s['mysticBodyExecuted'] is False
          assert s['photonTraced'] is False
          assert c['status'] == 'EXACT_MYSTIC_ENTRY_RAW_OPTICAL_STATE_CAPTURED'
          assert c['rawBitsAuthoritative'] is True
          assert c['decodedValuesAuditOnly'] is True
          assert c['verbosePrintedZerosAuthoritative'] is False
          assert c['nCaoth'] == 2
          assert set(c['tables']) == {'dt_s','om_s','g1_s','g2_s','f_s','ds_s'}
          assert len(c['zprof']['uint32Words']) == c['nlyr'] + 1
          assert len(c['threed']['int32ValuesAuditOnly']) == c['nlyr']
          for table in c['tables'].values():
              assert len(table['rows']) == c['nCaoth']
              for row in table['rows']:
                  assert len(row['uint32Words']) == c['nlyr']
                  assert len(bytes.fromhex(row['rawBytesHex'])) == 4 * c['nlyr']
          PY
