name: Deep twilight exact pinned MYSTIC semantic ABI audit v3

on:
  push:
    branches:
      - review/deep-twilight-mystic-entry-phase-capture-v3
    paths:
      - ".github/workflows/deep-twilight-mystic-entry-phase-semantic-audit-v3.yml"

permissions:
  contents: read

jobs:
  exact-pinned-semantic-audit:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Freeze zero-runtime semantic-audit boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/review/deep-twilight-mystic-entry-phase-capture-v3"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          OUT=deep-twilight-mystic-entry-phase-semantic-audit-v3-output
          mkdir -p "$OUT"
          cat > "$OUT/PROTOCOL.txt" <<'EOF'
          DEEP TWILIGHT EXACT PINNED MYSTIC SEMANTIC ABI AUDIT V3
          POST_V1 / NONBLOCKING / STATIC PACKAGE INSPECTION ONLY

          Purpose:
          - inspect the exact pinned rubin-libradtran package for installed headers/source fragments,
            exported/static symbols, and exact binary evidence that can resolve the semantics of
            dt_s/om_s/g1_s/g2_s/f_s/ds_s and any full phase-function payload before independent rendering.
          - this stage MUST NOT execute uvspec, initialize an RNG, consume a seed, enter MYSTIC,
            trace a photon, open protected results, alter Level-B, or infer rounded printed zero as physical zero.

          Frozen target runtime:
          - rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          - uvspec SHA256 2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3

          Provenance boundary:
          - exact installed package bytes are authoritative for this audit.
          - the currently served upstream 2.0.6 source archive is NOT accepted as historical byte provenance.
          - absence of installed semantic text is a fail-closed routing result, not permission to guess semantics.
          EOF

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: deep-twilight-mystic-entry-phase-semantic-audit-v3
          create-args: >-
            -c conda-forge
            python=3.12.4
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Capture exact package and binary static evidence
        shell: bash -el {0}
        run: |
          set -euo pipefail
          OUT=deep-twilight-mystic-entry-phase-semantic-audit-v3-output
          UVSPEC="$(command -v uvspec)"
          test "$(sha256sum "$UVSPEC" | awk '{print $1}')" = "2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3"
          micromamba list --explicit > "$OUT/runtime-package-explicit.txt"
          micromamba list --json > "$OUT/runtime-package-list.json"
          printf '%s\n' "$CONDA_PREFIX" > "$OUT/conda-prefix.txt"
          sha256sum "$UVSPEC" > "$OUT/uvspec-sha256.txt"
          file "$UVSPEC" > "$OUT/uvspec-file.txt"
          find "$CONDA_PREFIX" -type f -printf '%P\n' | LC_ALL=C sort > "$OUT/package-file-manifest.txt"
          nm -an "$UVSPEC" > "$OUT/uvspec-nm.txt"
          readelf -h -Ws "$UVSPEC" > "$OUT/uvspec-readelf.txt"
          objdump -d -Mintel --disassemble=mystic "$UVSPEC" > "$OUT/mystic-disassembly.txt"
          strings -a "$UVSPEC" | LC_ALL=C sort -u > "$OUT/uvspec-strings-sorted.txt"

          : > "$OUT/semantic-text-hits.txt"
          for root in "$CONDA_PREFIX/include" "$CONDA_PREFIX/share"; do
            if [ -d "$root" ]; then
              grep -R -n -I -E '(^|[^A-Za-z0-9_])(mystic|dt_s|om_s|g1_s|g2_s|f_s|ds_s|phase[_ -]?function|Henyey|delta[-_ ]?scal)' "$root" \
                >> "$OUT/semantic-text-hits.txt" 2>/dev/null || true
            fi
          done

          : > "$OUT/phase-symbols.txt"
          grep -E -i 'mystic|phase|henyey|hg|delta|scat' "$OUT/uvspec-nm.txt" > "$OUT/phase-symbols.txt" || true

          python - <<'PY'
          import hashlib, json, re
          from pathlib import Path

          root = Path('deep-twilight-mystic-entry-phase-semantic-audit-v3-output')
          def sha(name):
              p = root / name
              return hashlib.sha256(p.read_bytes()).hexdigest()
          hits = (root / 'semantic-text-hits.txt').read_text(errors='replace').splitlines()
          manifest = (root / 'package-file-manifest.txt').read_text(errors='replace').splitlines()
          exact_names = ('dt_s','om_s','g1_s','g2_s','f_s','ds_s')
          hit_counts = {name: sum(name in line for line in hits) for name in exact_names}
          candidate_headers = sorted({line.split(':',1)[0] for line in hits if '.h:' in line or '/include/' in line})
          result = {
              'schemaVersion': 3,
              'stageId': 'deep-twilight-mystic-entry-phase-semantic-audit-v3',
              'status': 'STATIC_EXACT_PACKAGE_SEMANTIC_AUDIT_COMPLETE',
              'targetPackage': 'rubin-libradtran=2.0.6=py312pl5321he9373c2_1',
              'uvspecSha256': '2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3',
              'uvspecExecuted': False,
              'rngInitialized': False,
              'seedConsumed': False,
              'mysticBodyExecuted': False,
              'photonTraced': False,
              'scientificExecutionPerformed': False,
              'protectedResultOpened': False,
              'levelBChanged': False,
              'taylorOrJerusalemUsed': False,
              'epsilonSubstitutionUsed': False,
              'githubRerunPermitted': False,
              'semanticTextLineCount': len(hits),
              'semanticIdentifierHitCounts': hit_counts,
              'candidateHeaderPaths': candidate_headers,
              'packageFileCount': len(manifest),
              'evidenceSha256': {
                  name: sha(name) for name in (
                      'runtime-package-explicit.txt',
                      'runtime-package-list.json',
                      'package-file-manifest.txt',
                      'uvspec-nm.txt',
                      'uvspec-readelf.txt',
                      'mystic-disassembly.txt',
                      'semantic-text-hits.txt',
                      'phase-symbols.txt',
                  )
              },
              'claimBoundary': 'static exact-package semantic evidence only; no independent-renderer translation is authorized until semantics are proved',
          }
          (root / 'decision-v3.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print(json.dumps(result, sort_keys=True))
          PY

      - name: Upload immutable semantic audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: deep-twilight-mystic-entry-phase-semantic-audit-v3
          path: deep-twilight-mystic-entry-phase-semantic-audit-v3-output
          if-no-files-found: error
          retention-days: 90

      - name: Enforce static-only contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('deep-twilight-mystic-entry-phase-semantic-audit-v3-output/decision-v3.json').read_text())
          assert d['status'] == 'STATIC_EXACT_PACKAGE_SEMANTIC_AUDIT_COMPLETE'
          assert d['uvspecExecuted'] is False
          assert d['rngInitialized'] is False
          assert d['seedConsumed'] is False
          assert d['mysticBodyExecuted'] is False
          assert d['photonTraced'] is False
          assert d['scientificExecutionPerformed'] is False
          assert d['protectedResultOpened'] is False
          assert d['levelBChanged'] is False
          assert d['taylorOrJerusalemUsed'] is False
          assert d['epsilonSubstitutionUsed'] is False
          assert d['githubRerunPermitted'] is False
          PY
