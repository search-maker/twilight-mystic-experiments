name: Deep twilight immutable semantic-audit readout v4

on:
  push:
    branches:
      - review/deep-twilight-mystic-entry-phase-semantic-readout-v4
    paths:
      - ".github/workflows/deep-twilight-mystic-entry-phase-semantic-readout-v4.yml"

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  immutable-readout:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: "34012999858"
      SOURCE_HEAD: "d73cdc047ba4cb2838497edc984be0c734373814"
      SOURCE_ARTIFACT: "9983046132"
      SOURCE_DIGEST: "7e1e9db84bea0138f3ad0449f966a61b53afcd4c96db9b4f192a278967515758"
    steps:
      - uses: actions/checkout@v4

      - name: Freeze immutable readout boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/review/deep-twilight-mystic-entry-phase-semantic-readout-v4"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          cat > PROTOCOL.txt <<'EOF'
          DEEP TWILIGHT IMMUTABLE SEMANTIC AUDIT READOUT V4
          STATIC ARTIFACT READOUT ONLY / NO UVSPEC / NO RNG / NO SOLVER / NO SCIENCE

          Source is frozen immutable run 34012999858 attempt1 SUCCESS, head
          d73cdc047ba4cb2838497edc984be0c734373814, artifact 9983046132, GitHub digest
          sha256:7e1e9db84bea0138f3ad0449f966a61b53afcd4c96db9b4f192a278967515758.

          This stage may only download and summarize that public static-package audit artifact.
          It may not run libRadtran, consume a seed, open protected results, alter Level-B,
          use Taylor/Jerusalem, substitute epsilon, or infer unproved optical semantics.
          EOF

      - name: Download and verify frozen artifact metadata and bytes
        shell: bash
        run: |
          set -euo pipefail
          meta="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT}")"
          test "$(jq -r .workflow_run.id <<<"$meta")" = "$SOURCE_RUN"
          test "$(jq -r .workflow_run.head_sha <<<"$meta")" = "$SOURCE_HEAD"
          test "$(jq -r .digest <<<"$meta")" = "sha256:${SOURCE_DIGEST}"
          test "$(jq -r .expired <<<"$meta")" = "false"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT}/zip" > source-artifact.zip
          actual="$(sha256sum source-artifact.zip | awk '{print $1}')"
          test "$actual" = "$SOURCE_DIGEST"
          mkdir artifact
          unzip -q source-artifact.zip -d artifact
          test -f artifact/decision-v3.json
          test -f artifact/semantic-text-hits.txt
          test -f artifact/phase-symbols.txt

      - name: Construct bounded exact semantic readout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, re
          from pathlib import Path

          root = Path('artifact')
          d = json.loads((root / 'decision-v3.json').read_text())
          required_false = [
              'uvspecExecuted','rngInitialized','seedConsumed','mysticBodyExecuted','photonTraced',
              'scientificExecutionPerformed','protectedResultOpened','levelBChanged',
              'taylorOrJerusalemUsed','epsilonSubstitutionUsed','githubRerunPermitted',
          ]
          assert d['status'] == 'STATIC_EXACT_PACKAGE_SEMANTIC_AUDIT_COMPLETE'
          assert d['targetPackage'] == 'rubin-libradtran=2.0.6=py312pl5321he9373c2_1'
          assert d['uvspecSha256'] == '2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3'
          for key in required_false:
              assert d[key] is False, (key, d[key])

          raw_hits = (root / 'semantic-text-hits.txt').read_text(errors='replace').splitlines()
          target = re.compile(r'(^|[^A-Za-z0-9_])(dt_s|om_s|g1_s|g2_s|f_s|ds_s)([^A-Za-z0-9_]|$)')
          exact_hits = [line for line in raw_hits if target.search(line)]
          # Bound the public ledger payload. Preserve exact lines for the first 80 identifier hits;
          # the immutable artifact remains the authority for any remainder.
          shown = exact_hits[:80]
          phase_lines = (root / 'phase-symbols.txt').read_text(errors='replace').splitlines()
          phase_shown = phase_lines[:80]

          def fenced(lines):
              if not lines:
                  return '(none)'
              return '```text\n' + '\n'.join(lines) + '\n```'

          body = f'''DEEP_TWILIGHT::EXACT_PACKAGE_SEMANTIC_AUDIT_V3_READOUT

source_run=34012999858
source_head=d73cdc047ba4cb2838497edc984be0c734373814
source_artifact=9983046132
source_artifact_digest=sha256:7e1e9db84bea0138f3ad0449f966a61b53afcd4c96db9b4f192a278967515758
source_status={d["status"]}
target_package={d["targetPackage"]}
uvspec_sha256={d["uvspecSha256"]}
package_file_count={d["packageFileCount"]}
semantic_text_line_count={d["semanticTextLineCount"]}
semantic_identifier_hit_counts={json.dumps(d["semanticIdentifierHitCounts"], sort_keys=True)}
candidate_header_paths={json.dumps(d["candidateHeaderPaths"], sort_keys=True)}
exact_target_identifier_hits_total={len(exact_hits)}
exact_target_identifier_hits_shown={len(shown)}
phase_symbol_lines_total={len(phase_lines)}
phase_symbol_lines_shown={len(phase_shown)}

STATIC_ONLY=true
uvspecExecuted=false
rngInitialized=false
seedConsumed=false
mysticBodyExecuted=false
photonTraced=false
scientificExecutionPerformed=false
protectedResultOpened=false
levelBChanged=false
taylorOrJerusalemUsed=false
epsilonSubstitutionUsed=false

Exact installed-text hits for dt_s/om_s/g1_s/g2_s/f_s/ds_s (bounded readout; artifact authoritative):
{fenced(shown)}

Exact binary symbol-filter readout (bounded; artifact authoritative):
{fenced(phase_shown)}

CLAIM_BOUNDARY: this is a readout of immutable static exact-package evidence only. It does not itself prove renderer translation semantics. Any absent or ambiguous semantic mapping remains fail-closed and must be resolved by an independently frozen exact-runtime route; no guessing from rounded output or mismatched source archives.
'''
          Path('issue-comment.md').write_text(body)
          summary = {
              'sourceDecisionSha256': hashlib.sha256((root/'decision-v3.json').read_bytes()).hexdigest(),
              'semanticHitsSha256': hashlib.sha256((root/'semantic-text-hits.txt').read_bytes()).hexdigest(),
              'phaseSymbolsSha256': hashlib.sha256((root/'phase-symbols.txt').read_bytes()).hexdigest(),
              'targetIdentifierHits': len(exact_hits),
              'shownTargetIdentifierHits': len(shown),
          }
          Path('readout-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True)+'\n')
          print(json.dumps(summary, sort_keys=True))
          PY

      - name: Publish bounded readout to authoritative control ledger
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/issues/60/comments" \
            --method POST \
            -f body="$(cat issue-comment.md)" \
            > posted-comment.json
          jq -e '.id and .html_url' posted-comment.json

      - name: Preserve readout receipt
        uses: actions/upload-artifact@v4
        with:
          name: deep-twilight-mystic-entry-phase-semantic-readout-v4
          path: |
            PROTOCOL.txt
            readout-summary.json
            posted-comment.json
          if-no-files-found: error
          retention-days: 90
