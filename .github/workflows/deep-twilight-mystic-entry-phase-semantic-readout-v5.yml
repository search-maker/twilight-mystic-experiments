name: Deep twilight immutable semantic-audit readout v5

on:
  push:
    branches:
      - review/deep-twilight-mystic-entry-phase-semantic-readout-v5
    paths:
      - ".github/workflows/deep-twilight-mystic-entry-phase-semantic-readout-v5.yml"

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  immutable-readout:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: "34012999858"
      SOURCE_HEAD: "d73cdc047ba4cb2838497edc984be0c734373814"
      SOURCE_ARTIFACT: "9983046132"
      SOURCE_DIGEST: "7e1e9db84bea0138f3ad0449f966a61b53afcd4c96db9b4f192a278967515758"
    steps:
      - uses: actions/checkout@v4

      - name: Freeze immutable readout boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/review/deep-twilight-mystic-entry-phase-semantic-readout-v5"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          printf '%s\n' \
            'DEEP TWILIGHT IMMUTABLE SEMANTIC AUDIT READOUT V5' \
            'STATIC ARTIFACT READOUT ONLY / NO UVSPEC / NO RNG / NO SOLVER / NO SCIENCE' \
            'source run 34012999858 attempt1; head d73cdc047ba4cb2838497edc984be0c734373814' \
            'artifact 9983046132; digest sha256:7e1e9db84bea0138f3ad0449f966a61b53afcd4c96db9b4f192a278967515758' \
            'No libRadtran execution, seed consumption, protected result opening, Level-B change, Taylor/Jerusalem use, epsilon, or semantic guessing.' \
            > PROTOCOL.txt

      - name: Download frozen immutable artifact
        shell: bash
        run: |
          set -euo pipefail
          meta="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT}")"
          test "$(jq -r .workflow_run.id <<<"$meta")" = "$SOURCE_RUN"
          test "$(jq -r .workflow_run.head_sha <<<"$meta")" = "$SOURCE_HEAD"
          test "$(jq -r .digest <<<"$meta")" = "sha256:${SOURCE_DIGEST}"
          test "$(jq -r .expired <<<"$meta")" = "false"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT}/zip" > source-artifact.zip
          mkdir artifact
          unzip -q source-artifact.zip -d artifact
          test -f artifact/decision-v3.json
          test -f artifact/semantic-text-hits.txt
          test -f artifact/phase-symbols.txt

      - name: Construct bounded exact readout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path
          root = Path('artifact')
          d = json.loads((root / 'decision-v3.json').read_text())
          assert d['status'] == 'STATIC_EXACT_PACKAGE_SEMANTIC_AUDIT_COMPLETE'
          assert d['targetPackage'] == 'rubin-libradtran=2.0.6=py312pl5321he9373c2_1'
          assert d['uvspecSha256'] == '2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3'
          for key in ['uvspecExecuted','rngInitialized','seedConsumed','mysticBodyExecuted','photonTraced','scientificExecutionPerformed','protectedResultOpened','levelBChanged','taylorOrJerusalemUsed','epsilonSubstitutionUsed','githubRerunPermitted']:
              assert d[key] is False, (key, d[key])
          raw_hits = (root / 'semantic-text-hits.txt').read_text(errors='replace').splitlines()
          target = re.compile(r'(^|[^A-Za-z0-9_])(dt_s|om_s|g1_s|g2_s|f_s|ds_s)([^A-Za-z0-9_]|$)')
          exact_hits = [line for line in raw_hits if target.search(line)]
          shown = exact_hits[:80]
          phase_lines = (root / 'phase-symbols.txt').read_text(errors='replace').splitlines()
          phase_shown = phase_lines[:80]
          lines = []
          lines.append('DEEP_TWILIGHT::EXACT_PACKAGE_SEMANTIC_AUDIT_V3_READOUT')
          lines.append('')
          lines.append('source_run=34012999858')
          lines.append('source_head=d73cdc047ba4cb2838497edc984be0c734373814')
          lines.append('source_artifact=9983046132')
          lines.append('source_artifact_digest=sha256:7e1e9db84bea0138f3ad0449f966a61b53afcd4c96db9b4f192a278967515758')
          lines.append('source_status=' + d['status'])
          lines.append('target_package=' + d['targetPackage'])
          lines.append('uvspec_sha256=' + d['uvspecSha256'])
          lines.append('package_file_count=' + str(d['packageFileCount']))
          lines.append('semantic_text_line_count=' + str(d['semanticTextLineCount']))
          lines.append('semantic_identifier_hit_counts=' + json.dumps(d['semanticIdentifierHitCounts'], sort_keys=True))
          lines.append('candidate_header_paths=' + json.dumps(d['candidateHeaderPaths'], sort_keys=True))
          lines.append('exact_target_identifier_hits_total=' + str(len(exact_hits)))
          lines.append('exact_target_identifier_hits_shown=' + str(len(shown)))
          lines.append('phase_symbol_lines_total=' + str(len(phase_lines)))
          lines.append('phase_symbol_lines_shown=' + str(len(phase_shown)))
          lines.append('')
          lines.extend(['STATIC_ONLY=true','uvspecExecuted=false','rngInitialized=false','seedConsumed=false','mysticBodyExecuted=false','photonTraced=false','scientificExecutionPerformed=false','protectedResultOpened=false','levelBChanged=false','taylorOrJerusalemUsed=false','epsilonSubstitutionUsed=false'])
          lines.append('')
          lines.append('Exact installed-text hits for dt_s/om_s/g1_s/g2_s/f_s/ds_s (bounded readout; artifact authoritative):')
          if shown:
              lines.append('```text')
              lines.extend(shown)
              lines.append('```')
          else:
              lines.append('(none)')
          lines.append('')
          lines.append('Exact binary symbol-filter readout (bounded; artifact authoritative):')
          if phase_shown:
              lines.append('```text')
              lines.extend(phase_shown)
              lines.append('```')
          else:
              lines.append('(none)')
          lines.append('')
          lines.append('CLAIM_BOUNDARY: immutable static exact-package evidence only. This readout does not itself prove renderer translation semantics. Any absent or ambiguous mapping remains fail-closed and must use an independently frozen exact-runtime route; no guessing from rounded output or mismatched source archives.')
          Path('issue-comment.md').write_text('\n'.join(lines) + '\n')
          summary = {
              'sourceDecisionSha256': hashlib.sha256((root / 'decision-v3.json').read_bytes()).hexdigest(),
              'semanticHitsSha256': hashlib.sha256((root / 'semantic-text-hits.txt').read_bytes()).hexdigest(),
              'phaseSymbolsSha256': hashlib.sha256((root / 'phase-symbols.txt').read_bytes()).hexdigest(),
              'targetIdentifierHits': len(exact_hits),
              'shownTargetIdentifierHits': len(shown),
          }
          Path('readout-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, sort_keys=True))
          PY

      - name: Publish bounded readout to Issue 60
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/issues/60/comments" --method POST -f body="$(cat issue-comment.md)" > posted-comment.json
          jq -e '.id and .html_url' posted-comment.json

      - name: Preserve readout receipt
        uses: actions/upload-artifact@v4
        with:
          name: deep-twilight-mystic-entry-phase-semantic-readout-v5
          path: |
            PROTOCOL.txt
            readout-summary.json
            posted-comment.json
          if-no-files-found: error
          retention-days: 90
