name: Deep twilight exact pinned MYSTIC scalar parameter semantics v7

on:
  push:
    branches:
      - review/deep-twilight-mystic-parameter-semantics-v7
    paths:
      - ".github/workflows/deep-twilight-mystic-parameter-semantics-v7.yml"

permissions:
  contents: read
  issues: write

jobs:
  exact-parameter-semantics:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Freeze static-only semantic boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/review/deep-twilight-mystic-parameter-semantics-v7"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          printf '%s\n' \
            'DEEP TWILIGHT EXACT PINNED MYSTIC SCALAR PARAMETER SEMANTICS V7' \
            'STATIC INSTALLED HEADERS + BINARY DISASSEMBLY ONLY' \
            'NO UVSPEC / NO RNG / NO SEED / NO SOLVER / NO SCIENCE / NO PROTECTED RESULT' \
            'target rubin-libradtran=2.0.6=py312pl5321he9373c2_1' \
            'target uvspec SHA256 2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3' \
            'Goal: resolve dt_s/om_s/g1_s/g2_s/f_s/ds_s meaning and double-HG/delta-scaling interfaces without guessing from mismatched source.' \
            > PROTOCOL.txt

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: deep-twilight-mystic-parameter-semantics-v7
          create-args: >-
            -c conda-forge
            python=3.12.4
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Capture exact declarations and implementation ABI evidence
        shell: bash -el {0}
        run: |
          set -euo pipefail
          OUT=parameter-semantics-v7
          mkdir -p "$OUT"
          UVSPEC="$(command -v uvspec)"
          test "$(sha256sum "$UVSPEC" | awk '{print $1}')" = "2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3"
          H="$CONDA_PREFIX/include/libRadtran/mystic.h"
          P="$CONDA_PREFIX/include/libRadtran/phasetable.h"
          T="$CONDA_PREFIX/include/libRadtran/twostrebe.h"
          V="$CONDA_PREFIX/include/libRadtran/vroom.h"
          test -f "$H"; test -f "$P"; test -f "$T"; test -f "$V"
          sha256sum "$H" "$P" "$T" "$V" > "$OUT/header-sha256.txt"
          nl -ba "$H" | sed -n '1028,1110p' > "$OUT/mystic-optprop-struct-context.txt"
          nl -ba "$H" | sed -n '1135,1165p' > "$OUT/mystic-delta-settings-context.txt"
          nl -ba "$H" | sed -n '1428,1500p' > "$OUT/mystic-entry-optprop-context.txt"
          grep -R -n -I -E 'sc_HG2_mu|sc_HG_mu|create_phase_from_HG|create_iphase_from_HG|delta_scale_hg|delta_scale\(' "$CONDA_PREFIX/include/libRadtran" > "$OUT/exact-function-prototypes.txt" || true
          nl -ba "$P" | grep -E -C 10 'create_phase_from_HG|create_iphase_from_HG|phase_function|iphase|HG' > "$OUT/phasetable-target-context.txt" || true
          nl -ba "$T" > "$OUT/twostrebe-header.txt"
          # Exact locked-binary disassembly is static evidence only; no program execution.
          objdump -d -Mintel --disassemble=sc_HG2_mu "$UVSPEC" > "$OUT/sc_HG2_mu-disassembly.txt"
          objdump -d -Mintel --disassemble=sc_HG_mu "$UVSPEC" > "$OUT/sc_HG_mu-disassembly.txt"
          objdump -d -Mintel --disassemble=delta_scale_hg "$UVSPEC" > "$OUT/delta_scale_hg-disassembly.txt"
          objdump -d -Mintel --disassemble=create_phase_from_HG "$UVSPEC" > "$OUT/create_phase_from_HG-disassembly.txt"
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('parameter-semantics-v7')
          files = [p.name for p in root.iterdir() if p.is_file()]
          evidence = {name: hashlib.sha256((root/name).read_bytes()).hexdigest() for name in sorted(files)}
          d = {
            'schemaVersion': 7,
            'status': 'STATIC_EXACT_PINNED_PARAMETER_SEMANTICS_CAPTURED',
            'targetPackage': 'rubin-libradtran=2.0.6=py312pl5321he9373c2_1',
            'uvspecSha256': '2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3',
            'uvspecExecuted': False,
            'rngInitialized': False,
            'seedConsumed': False,
            'mysticBodyExecuted': False,
            'photonTraced': False,
            'scientificExecutionPerformed': False,
            'protectedResultOpened': False,
            'levelBChanged': False,
            'taylorOrJerusalemUsed': False,
            'epsilonSubstitutionUsed': False,
            'evidenceSha256': evidence,
          }
          (root/'decision-v7.json').write_text(json.dumps(d, indent=2, sort_keys=True)+'\n')
          PY

      - name: Publish bounded exact semantic evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('parameter-semantics-v7')
          d = json.loads((root/'decision-v7.json').read_text())
          assert d['status'] == 'STATIC_EXACT_PINNED_PARAMETER_SEMANTICS_CAPTURED'
          for key in ['uvspecExecuted','rngInitialized','seedConsumed','mysticBodyExecuted','photonTraced','scientificExecutionPerformed','protectedResultOpened','levelBChanged','taylorOrJerusalemUsed','epsilonSubstitutionUsed']:
              assert d[key] is False
          blocks = [
            ('mystic.h optical-property structure context','mystic-optprop-struct-context.txt',100),
            ('mystic.h delta-setting context','mystic-delta-settings-context.txt',60),
            ('mystic.h MYSTIC-entry optical-property context','mystic-entry-optprop-context.txt',90),
            ('exact installed function prototypes','exact-function-prototypes.txt',120),
            ('phasetable targeted context','phasetable-target-context.txt',160),
            ('twostrebe.h exact header','twostrebe-header.txt',120),
          ]
          lines = [
            'DEEP_TWILIGHT::EXACT_PINNED_MYSTIC_PARAMETER_SEMANTICS_V7', '',
            'status=' + d['status'],
            'target_package=' + d['targetPackage'],
            'uvspec_sha256=' + d['uvspecSha256'],
            'evidence_sha256=' + json.dumps(d['evidenceSha256'], sort_keys=True),
            'STATIC_ONLY=true; uvspecExecuted=false; rngInitialized=false; seedConsumed=false; mysticBodyExecuted=false; photonTraced=false; scientificExecutionPerformed=false; protectedResultOpened=false; levelBChanged=false; taylorOrJerusalemUsed=false; epsilonSubstitutionUsed=false',
            ''
          ]
          for title, name, lim in blocks:
              rows = (root/name).read_text(errors='replace').splitlines()
              shown = rows[:lim]
              lines.append(f'{title} (shown {len(shown)}/{len(rows)} lines):')
              lines.append('```text')
              lines.extend(shown)
              lines.append('```')
              lines.append('')
          lines.append('CLAIM_BOUNDARY: exact installed headers and exact locked-binary disassembly only. Translation may use only semantics explicit in this evidence or subsequently proven by a separately frozen exact-runtime equivalence test. No mismatched-source guessing, no epsilon-for-zero, no renderer/science authorization.')
          Path('issue-comment.md').write_text('\n'.join(lines)+'\n')
          PY
          gh api "/repos/${GITHUB_REPOSITORY}/issues/60/comments" --method POST -f body="$(cat issue-comment.md)" > posted-comment.json
          jq -e '.id and .html_url' posted-comment.json

      - name: Preserve semantic evidence
        uses: actions/upload-artifact@v4
        with:
          name: deep-twilight-mystic-parameter-semantics-v7
          path: |
            PROTOCOL.txt
            parameter-semantics-v7/
            posted-comment.json
          if-no-files-found: error
          retention-days: 90
