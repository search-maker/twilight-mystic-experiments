name: Deep twilight exact pinned MYSTIC header semantic context v6

on:
  push:
    branches:
      - review/deep-twilight-mystic-semantic-header-context-v6
    paths:
      - ".github/workflows/deep-twilight-mystic-semantic-header-context-v6.yml"

permissions:
  contents: read
  issues: write

jobs:
  exact-header-context:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Freeze zero-runtime semantic-context boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/review/deep-twilight-mystic-semantic-header-context-v6"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          printf '%s\n' \
            'DEEP TWILIGHT EXACT PINNED MYSTIC HEADER SEMANTIC CONTEXT V6' \
            'STATIC INSTALLED-HEADER INSPECTION ONLY / NO UVSPEC / NO RNG / NO SOLVER / NO SCIENCE' \
            'target rubin-libradtran=2.0.6=py312pl5321he9373c2_1' \
            'target uvspec SHA256 2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3' \
            'Known exact-runtime capture: Issue 60 comment 5557030881; static semantic readout: 5557094699.' \
            'No semantic inference is allowed beyond exact installed header text. Ambiguity remains fail-closed.' \
            > PROTOCOL.txt

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: deep-twilight-mystic-semantic-header-context-v6
          create-args: >-
            -c conda-forge
            python=3.12.4
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Extract exact installed semantic contexts
        shell: bash -el {0}
        run: |
          set -euo pipefail
          OUT=semantic-context-v6
          mkdir -p "$OUT"
          UVSPEC="$(command -v uvspec)"
          test "$(sha256sum "$UVSPEC" | awk '{print $1}')" = "2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3"
          H="$CONDA_PREFIX/include/libRadtran/mystic.h"
          P="$CONDA_PREFIX/include/libRadtran/phasetable.h"
          test -f "$H"
          test -f "$P"
          sha256sum "$H" "$P" > "$OUT/header-sha256.txt"
          nl -ba "$H" | sed -n '1420,1525p' > "$OUT/mystic-entry-context.txt"
          nl -ba "$H" | grep -E -i -C 8 'dt_s|om_s|g1_s|g2_s|f_s|ds_s|delta_scale_hg|sc_HG2_mu|create_phase_from_HG|create_iphase_from_HG|get_phase_matrix_caoth|mu_scatter' > "$OUT/mystic-key-contexts.txt" || true
          nl -ba "$P" > "$OUT/phasetable-header.txt"
          grep -R -n -I -E 'delta_scale_hg|delta_scale\(|create_phase_from_HG|create_iphase_from_HG|sc_HG2_mu|get_phase_matrix_caoth|mu_scatter|Henyey|two[-_ ]?term|g1|g2|truncat|delta[-_ ]?scal' "$CONDA_PREFIX/include/libRadtran" > "$OUT/include-phase-semantic-hits.txt" || true
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path('semantic-context-v6')
          files = ['header-sha256.txt','mystic-entry-context.txt','mystic-key-contexts.txt','phasetable-header.txt','include-phase-semantic-hits.txt']
          evidence = {name: hashlib.sha256((root/name).read_bytes()).hexdigest() for name in files}
          d = {
              'schemaVersion': 6,
              'status': 'STATIC_EXACT_PINNED_HEADER_CONTEXT_CAPTURED',
              'targetPackage': 'rubin-libradtran=2.0.6=py312pl5321he9373c2_1',
              'uvspecSha256': '2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3',
              'uvspecExecuted': False,
              'rngInitialized': False,
              'seedConsumed': False,
              'mysticBodyExecuted': False,
              'photonTraced': False,
              'scientificExecutionPerformed': False,
              'protectedResultOpened': False,
              'levelBChanged': False,
              'taylorOrJerusalemUsed': False,
              'epsilonSubstitutionUsed': False,
              'evidenceSha256': evidence,
          }
          (root/'decision-v6.json').write_text(json.dumps(d, indent=2, sort_keys=True)+'\n')
          PY

      - name: Construct bounded control-ledger readout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('semantic-context-v6')
          d = json.loads((root/'decision-v6.json').read_text())
          assert d['status'] == 'STATIC_EXACT_PINNED_HEADER_CONTEXT_CAPTURED'
          for key in ['uvspecExecuted','rngInitialized','seedConsumed','mysticBodyExecuted','photonTraced','scientificExecutionPerformed','protectedResultOpened','levelBChanged','taylorOrJerusalemUsed','epsilonSubstitutionUsed']:
              assert d[key] is False
          def bounded(name, limit):
              rows = (root/name).read_text(errors='replace').splitlines()
              return rows[:limit], len(rows)
          entry, entry_total = bounded('mystic-entry-context.txt', 120)
          key, key_total = bounded('mystic-key-contexts.txt', 180)
          phase, phase_total = bounded('phasetable-header.txt', 180)
          hits, hits_total = bounded('include-phase-semantic-hits.txt', 180)
          lines = []
          lines.append('DEEP_TWILIGHT::EXACT_PINNED_MYSTIC_HEADER_SEMANTIC_CONTEXT_V6')
          lines.append('')
          lines.append('status=' + d['status'])
          lines.append('target_package=' + d['targetPackage'])
          lines.append('uvspec_sha256=' + d['uvspecSha256'])
          lines.append('header_evidence_sha256=' + json.dumps(d['evidenceSha256'], sort_keys=True))
          lines.append('STATIC_ONLY=true; uvspecExecuted=false; rngInitialized=false; seedConsumed=false; mysticBodyExecuted=false; photonTraced=false; scientificExecutionPerformed=false; protectedResultOpened=false; levelBChanged=false; taylorOrJerusalemUsed=false; epsilonSubstitutionUsed=false')
          lines.append('')
          for title, rows, total in [
              ('Exact mystic.h entry context', entry, entry_total),
              ('Exact mystic.h key semantic contexts', key, key_total),
              ('Exact phasetable.h', phase, phase_total),
              ('Exact installed include phase/parameter hits', hits, hits_total),
          ]:
              lines.append(title + f' (shown {len(rows)}/{total} lines):')
              lines.append('```text')
              lines.extend(rows)
              lines.append('```')
              lines.append('')
          lines.append('CLAIM_BOUNDARY: exact installed-package header text only. These snippets may establish declared parameter/structure semantics where explicit; anything not explicit remains unproved and fail-closed. No mismatch-source inference, no rounded-zero inference, and no renderer/science authorization is created by this readout.')
          Path('issue-comment.md').write_text('\n'.join(lines)+'\n')
          PY

      - name: Publish material semantic context to Issue 60
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/issues/60/comments" --method POST -f body="$(cat issue-comment.md)" > posted-comment.json
          jq -e '.id and .html_url' posted-comment.json

      - name: Preserve immutable context evidence
        uses: actions/upload-artifact@v4
        with:
          name: deep-twilight-mystic-semantic-header-context-v6
          path: |
            PROTOCOL.txt
            semantic-context-v6/
            posted-comment.json
          if-no-files-found: error
          retention-days: 90
