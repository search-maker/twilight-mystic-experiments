name: Deep twilight no-aerosol row identity v15

on:
  push:
    branches:
      - review/deep-twilight-noaerosol-row-identity-v15
    paths:
      - ".github/workflows/deep-twilight-noaerosol-row-identity-v15.yml"

permissions:
  contents: read
  actions: read

jobs:
  noaerosol-row-identity-v15:
    if: >-
      github.run_attempt == 1 &&
      github.event.before == 'fe6e063c568394ae7b4e90222de270d3f2460455'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      FRESH_SETUP_SEED: '2039186745'
      UVSPEC_SHA256: '2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3'
      BASELINE_RUN: '34012593281'
      BASELINE_ARTIFACT_ID: '9982923548'
      BASELINE_ARTIFACT_DIGEST: 'sha256:bbad4ef455636f55510176b9d0df2f509fabdd78675a9504d45354375e01ceaf'
      BASELINE_CAPTURE_SHA256: 'f005ed18491a0c9b7827857c0bb2fc775c5e77eb2a69f02121f56814a628bec6'
      V14_RUN: '34014710613'
      V14_ARTIFACT_ID: '9983542772'
      V14_ARTIFACT_DIGEST: 'sha256:ed389986981b0db7a281d69b05214365a0d79f6b669c3007ed3d9f1db9e80b19'
      V14_HELPER_SHA256: '6b419e094e397ec565b57aa23ff2e16eeedf6636670bab717c8a66098fa9d2fa'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Freeze V15 no-aerosol row-identity gate and fresh identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/review/deep-twilight-noaerosol-row-identity-v15"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "${{ github.event.before }}" = "fe6e063c568394ae7b4e90222de270d3f2460455"
          OUT=deep-twilight-noaerosol-row-identity-v15-output
          mkdir -p "$OUT"
          cat > "$OUT/PROTOCOL.txt" <<'EOF'
          DEEP TWILIGHT EXACT-RUNTIME NO-AEROSOL ROW IDENTITY V15
          POST_V1 / SETUP-ONLY / NO MYSTIC BODY / NO PHOTON TRACE

          V14 established, before optical capture, that this pinned runtime retains n_caoth=2 even when
          aerosol_default and aerosol_set_tau_at_wvl are absent. V15 is the narrow result-blind successor:
          capture that same no-aerosol two-row state rather than assuming the second slot disappears.

          Immutable aerosol-default reference: run 34012593281 artifact 9982923548, AFGL-US + aerosol_default
          + AOD550=0.150000, 550-nm CRS, n_caoth=2. Probe: identical AFGL-US/550-nm CRS/geometry/runtime with
          NO aerosol directives. Fresh setup-only seed 2039186745 becomes CONSUMED/NON-REUSABLE once uvspec
          initializes its RNG. GDB must stop at the first instruction of mystic(); no MYSTIC-body instruction
          may execute and no photon may be traced.

          Preregistered PASS, frozen before execution and without post-result row selection:
          1. probe nlyr=49 and n_caoth=2; threed and zprof raw payloads equal reference exactly;
          2. probe row0 raw bytes equal reference row0 exactly for dt_s, om_s, g1_s, g2_s, f_s, ds_s;
          3. every probe row1 dt_s float32 word is an exact signed zero (magnitude bits all zero), while the
             immutable aerosol-default reference row1 dt_s contains at least one nonzero word.
          Other probe row1 optical tables are diagnostic only.

          PASS proves only for this exact frozen 550-nm runtime state that row0 is invariant molecular-state
          input and row1 is the optical-depth slot activated by aerosol_default. It does NOT revive the rejected
          uniform AOD-scaling law, does not finish phase/delta-scaling translation, does not authorize deep science,
          and does not alter Level-B 2.0-10.5 deg. Exact signed zeros remain estimator/runtime state; no epsilon.
          NEVER rerun/retry/resume this attempt.
          EOF

          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          mapfile -t seed_commits < <(git log --all -S"$FRESH_SETUP_SEED" --format='%H' | sort -u)
          for c in "${seed_commits[@]:-}"; do
            [ -z "$c" ] && continue
            test "$c" = "$GITHUB_SHA" || { echo "seed already appears in repository history at $c"; exit 41; }
          done
          if gh api --paginate "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" --jq '.[].body' | grep -Fq "$FRESH_SETUP_SEED"; then
            echo "seed already appears in authoritative Issue #60 history"; exit 42
          fi
          python - <<'PY'
          import json, os, subprocess, sys
          repo=os.environ['GITHUB_REPOSITORY']; current=int(os.environ['GITHUB_RUN_ID'])
          blockers=[]; needles=('reptran','recovery4','ordinal45','avps','level-b','level b','lowalt')
          for status in ('in_progress','queued'):
              p=subprocess.run(['gh','api',f'repos/{repo}/actions/runs?status={status}&per_page=100'],text=True,capture_output=True,check=True)
              for r in json.loads(p.stdout).get('workflow_runs',[]):
                  if int(r['id'])==current: continue
                  name=(str(r.get('name',''))+' '+str(r.get('head_branch',''))).lower()
                  if any(n in name for n in needles): blockers.append((status,r['id'],r.get('name'),r.get('head_branch')))
          if blockers: print('actual V1 contention detected:',blockers); sys.exit(43)
          print('no actual queued/in-progress V1 contention')
          PY

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: deep-twilight-noaerosol-row-identity-v15
          create-args: >-
            -c conda-forge
            python=3.12.4
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Bind exact runtime, reference capture, and immutable V14 helper
        shell: bash -el {0}
        run: |
          set -euo pipefail
          OUT=deep-twilight-noaerosol-row-identity-v15-output
          micromamba list --explicit > "$OUT/runtime-package-explicit-before.txt"
          micromamba list --json > "$OUT/runtime-package-list-before.json"
          UVSPEC="$(command -v uvspec)"
          test "$(sha256sum "$UVSPEC" | awk '{print $1}')" = "$UVSPEC_SHA256"
          file "$UVSPEC" | tee "$OUT/uvspec-file.txt" | grep -Eq 'x86-64|x86_64'

          meta="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BASELINE_RUN/artifacts" --jq ".artifacts[] | select(.id==$BASELINE_ARTIFACT_ID) | [.name,.digest] | @tsv")"
          test "$meta" = $'deep-twilight-mystic-entry-optprop-capture-v2\t'"$BASELINE_ARTIFACT_DIGEST"
          mkdir -p baseline
          gh run download "$BASELINE_RUN" --repo "$GITHUB_REPOSITORY" --name deep-twilight-mystic-entry-optprop-capture-v2 --dir baseline
          BASE_RAW="$(find baseline -type f -name 'mystic-entry-raw-v2.json' -print -quit)"
          test -n "$BASE_RAW"; test "$(sha256sum "$BASE_RAW" | awk '{print $1}')" = "$BASELINE_CAPTURE_SHA256"
          printf '%s\n' "$BASE_RAW" > "$OUT/baseline-raw-path.txt"

          v14meta="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V14_RUN/artifacts" --jq ".artifacts[] | select(.id==$V14_ARTIFACT_ID) | [.name,.digest] | @tsv")"
          test "$v14meta" = $'deep-twilight-molecular-only-component-identity-v14\t'"$V14_ARTIFACT_DIGEST"
          mkdir -p v14src
          gh run download "$V14_RUN" --repo "$GITHUB_REPOSITORY" --name deep-twilight-molecular-only-component-identity-v14 --dir v14src
          V14_HELPER="$(find v14src -type f -name 'capture_mystic_entry_v2.py' -print -quit)"
          test -n "$V14_HELPER"; test "$(sha256sum "$V14_HELPER" | awk '{print $1}')" = "$V14_HELPER_SHA256"
          cp "$V14_HELPER" "$OUT/v14-helper-immutable.py"
          cp "$V14_HELPER" "$OUT/capture_mystic_entry_v2.py"

      - name: Materialize narrow V15 capture helper
        shell: bash
        run: |
          set -euo pipefail
          OUT=deep-twilight-noaerosol-row-identity-v15-output
          python - <<'PY'
          from pathlib import Path
          p=Path('deep-twilight-noaerosol-row-identity-v15-output/capture_mystic_entry_v2.py')
          s=p.read_text()
          replacements=[
            ('STAGE_ID = "deep-twilight-molecular-only-component-identity-v14"','STAGE_ID = "deep-twilight-noaerosol-row-identity-v15"'),
            ('EXPECTED_SEED = 1926407831','EXPECTED_SEED = 2039186745'),
            ('EXPECTED_BARE_N_CAOTH = 1','EXPECTED_BARE_N_CAOTH = 2'),
            ('molecular-only expected n_caoth={EXPECTED_BARE_N_CAOTH}','no-aerosol expected n_caoth={EXPECTED_BARE_N_CAOTH}'),
          ]
          for old,new in replacements:
              count=s.count(old)
              if count!=1: raise SystemExit(f'expected one patch occurrence, got {count}: {old!r}')
              s=s.replace(old,new)
          if 'aerosol_default' in s or 'aerosol_set_tau_at_wvl' in s:
              raise SystemExit('V15 helper must contain no aerosol directives')
          p.write_text(s)
          PY
          python -m py_compile "$OUT/capture_mystic_entry_v2.py"
          python - <<'PY'
          import difflib,hashlib,json
          from pathlib import Path
          root=Path('deep-twilight-noaerosol-row-identity-v15-output')
          a=(root/'v14-helper-immutable.py').read_text().splitlines(); b=(root/'capture_mystic_entry_v2.py').read_text().splitlines()
          changes=[x for x in difflib.ndiff(a,b) if x.startswith('- ') or x.startswith('+ ')]
          if len(changes)!=8: raise SystemExit(f'unexpected V15 helper patch surface {len(changes)}')
          (root/'v15-helper-patch.diff').write_text('\n'.join(changes)+'\n')
          (root/'v15-helper-manifest.json').write_text(json.dumps({'sourceV14Run':34014710613,'sourceV14ArtifactId':9983542772,'sourceHelperSha256':hashlib.sha256((root/'v14-helper-immutable.py').read_bytes()).hexdigest(),'v15HelperSha256':hashlib.sha256((root/'capture_mystic_entry_v2.py').read_bytes()).hexdigest(),'changedLineRecords':changes},indent=2,sort_keys=True)+'\n')
          PY

      - name: Create isolated debugger environment
        shell: bash -el {0}
        run: |
          set -euo pipefail
          OUT=deep-twilight-noaerosol-row-identity-v15-output
          GDB_PREFIX="$RUNNER_TEMP/deep-twilight-gdb-tools-noaero-v15"
          micromamba create -y -p "$GDB_PREFIX" -c conda-forge python=3.12.4 gdb=17.2
          micromamba list -p "$GDB_PREFIX" --explicit > "$OUT/gdb-package-explicit.txt"
          "$GDB_PREFIX/bin/gdb" --version > "$OUT/gdb-version.txt"
          printf '%s\n' "$GDB_PREFIX" > "$OUT/gdb-prefix.txt"

      - name: Fresh control and contention guard immediately before target runtime
        shell: bash
        run: |
          set -euo pipefail
          OUT=deep-twilight-noaerosol-row-identity-v15-output
          gh api "repos/$GITHUB_REPOSITORY/issues/60" > "$OUT/issue60-preprobe.json"
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$OUT/main-preprobe.json"
          python - <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          root=Path('deep-twilight-noaerosol-row-identity-v15-output')
          main=json.loads((root/'main-preprobe.json').read_text()); issue=json.loads((root/'issue60-preprobe.json').read_text())
          if main['commit']['sha']!='fe6e063c568394ae7b4e90222de270d3f2460455': raise SystemExit('main changed; fail closed')
          repo=os.environ['GITHUB_REPOSITORY']; current=int(os.environ['GITHUB_RUN_ID']); blockers=[]
          needles=('reptran','recovery4','ordinal45','avps','level-b','level b','lowalt')
          for status in ('in_progress','queued'):
              p=subprocess.run(['gh','api',f'repos/{repo}/actions/runs?status={status}&per_page=100'],text=True,capture_output=True,check=True)
              for r in json.loads(p.stdout).get('workflow_runs',[]):
                  if int(r['id'])==current: continue
                  name=(str(r.get('name',''))+' '+str(r.get('head_branch',''))).lower()
                  if any(n in name for n in needles): blockers.append((status,r['id'],r.get('name'),r.get('head_branch')))
          if blockers: print('actual V1 contention:',blockers); sys.exit(44)
          print('issue60 comments',issue['comments'],'main',main['commit']['sha'],'no actual V1 contention')
          PY

      - name: Execute setup-only no-aerosol capture and kill at MYSTIC entry
        id: probe
        shell: bash -el {0}
        run: |
          set -uo pipefail
          OUT=deep-twilight-noaerosol-row-identity-v15-output
          PROBE="$OUT/probe"; mkdir -p "$PROBE"
          DATA_DIR="$CONDA_PREFIX/share/libRadtran/data"; GDB_PREFIX="$(cat "$OUT/gdb-prefix.txt")"
          set +e
          python "$OUT/capture_mystic_entry_v2.py" --uvspec "$(command -v uvspec)" --gdb "$GDB_PREFIX/bin/gdb" --data-dir "$DATA_DIR" --atmosphere "$DATA_DIR/atmmod/afglus.dat" --solar-flux "$DATA_DIR/solar_flux/atlas_plus_modtran" --output-dir "$PROBE" --package-explicit "$OUT/runtime-package-explicit-before.txt" --package-json "$OUT/runtime-package-list-before.json" > "$OUT/probe-command-stdout.txt" 2> "$OUT/probe-command-stderr.txt"
          status=$?
          set -e
          printf '%s\n' "$status" > "$OUT/probe-command-exit-code.txt"; echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if [ -f "$PROBE/randomseed" ]; then cp "$PROBE/randomseed" "$OUT/randomseed-consumed-evidence.txt"; fi

      - name: Prove exact runtime unchanged
        if: always()
        shell: bash -el {0}
        run: |
          set -euo pipefail
          OUT=deep-twilight-noaerosol-row-identity-v15-output
          micromamba list --explicit > "$OUT/runtime-package-explicit-after.txt"
          micromamba list --json > "$OUT/runtime-package-list-after.json"
          cmp "$OUT/runtime-package-explicit-before.txt" "$OUT/runtime-package-explicit-after.txt"
          cmp "$OUT/runtime-package-list-before.json" "$OUT/runtime-package-list-after.json"
          test "$(sha256sum "$(command -v uvspec)" | awk '{print $1}')" = "$UVSPEC_SHA256"

      - name: Evaluate preregistered no-aerosol row identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT=deep-twilight-noaerosol-row-identity-v15-output
          BASE_RAW="$(cat "$OUT/baseline-raw-path.txt")"
          PROBE_RAW="$(find "$OUT/probe" -type f -name 'mystic-entry-raw-v2.json' -print -quit)"
          test -n "$PROBE_RAW"
          python - "$BASE_RAW" "$PROBE_RAW" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          bp=Path(sys.argv[1]); pp=Path(sys.argv[2]); b=json.loads(bp.read_text()); p=json.loads(pp.read_text())
          errors=[]
          if b.get('status')!='EXACT_MYSTIC_ENTRY_RAW_OPTICAL_STATE_CAPTURED' or b.get('nCaoth')!=2: errors.append('reference shape/status')
          if p.get('status')!='EXACT_MYSTIC_ENTRY_RAW_OPTICAL_STATE_CAPTURED': errors.append('probe status')
          if not p.get('stoppedAtExactMysticEntry') or p.get('mysticBodyExecuted') or p.get('photonTraced'): errors.append('execution boundary')
          if b.get('nlyr')!=49 or p.get('nlyr')!=49 or p.get('nCaoth')!=2: errors.append('no-aerosol shape')
          threed_equal=b['threed']['rawBytesHex']==p['threed']['rawBytesHex']; zprof_equal=b['zprof']['rawBytesHex']==p['zprof']['rawBytesHex']
          if not threed_equal: errors.append('threed changed')
          if not zprof_equal: errors.append('zprof changed')
          row0_equal={}
          for name in ('dt_s','om_s','g1_s','g2_s','f_s','ds_s'):
              ok=(len(p['tables'][name]['rows'])==2 and b['tables'][name]['rows'][0]['rawBytesHex']==p['tables'][name]['rows'][0]['rawBytesHex'])
              row0_equal[name]=ok
              if not ok: errors.append(f'{name} row0 mismatch')
          def words(row): return [int(x,16) for x in row['uint32Words']]
          probe_row1_dt=words(p['tables']['dt_s']['rows'][1]); base_row1_dt=words(b['tables']['dt_s']['rows'][1])
          probe_row1_all_signed_zero=all((w & 0x7fffffff)==0 for w in probe_row1_dt)
          base_row1_has_nonzero=any((w & 0x7fffffff)!=0 for w in base_row1_dt)
          if not probe_row1_all_signed_zero: errors.append('no-aerosol row1 dt has nonzero magnitude word')
          if not base_row1_has_nonzero: errors.append('reference aerosol row1 dt lacks nonzero word')
          diag={}
          for name in ('om_s','g1_s','g2_s','f_s','ds_s'):
              diag[name]=b['tables'][name]['rows'][1]['rawBytesHex']==p['tables'][name]['rows'][1]['rawBytesHex']
          decision={
            'schemaVersion':15,'status':'PASS_EXACT_RUNTIME_NOAEROSOL_ROW_IDENTITY' if not errors else 'FAIL_EXACT_RUNTIME_NOAEROSOL_ROW_IDENTITY',
            'referenceRun':34012593281,'referenceArtifactId':9982923548,'v14PredecessorRun':34014710613,
            'referenceCaptureSha256':hashlib.sha256(bp.read_bytes()).hexdigest(),'probeCaptureSha256':hashlib.sha256(pp.read_bytes()).hexdigest(),
            'freshSetupSeed':2039186745,'freshSetupSeedReusable':False,'referenceNCaoth':b.get('nCaoth'),'probeNCaoth':p.get('nCaoth'),'nlyr':p.get('nlyr'),
            'threedRawIdentical':threed_equal,'zprofRawIdentical':zprof_equal,'row0RawEqualityByTable':row0_equal,
            'probeRow1DtAllExactSignedZero':probe_row1_all_signed_zero,'probeRow1DtZeroWordCount':sum((w & 0x7fffffff)==0 for w in probe_row1_dt),
            'referenceRow1DtHasNonzero':base_row1_has_nonzero,'referenceRow1DtNonzeroWordCount':sum((w & 0x7fffffff)!=0 for w in base_row1_dt),
            'row1OtherTablesRawEqualToReferenceDiagnosticOnly':diag,
            'identityConclusion':'row0 invariant molecular-state input; row1 optical-depth slot activated by aerosol_default' if not errors else 'UNRESOLVED',
            'mysticBodyExecuted':False,'photonTraced':False,'scientificExecutionPerformed':False,'protectedResultOpened':False,'levelBChanged':False,'taylorOrJerusalemUsed':False,'epsilonSubstitutionUsed':False,
            'errors':errors,'claimBoundary':'exact frozen 550-nm runtime row identity only; rejected uniform AOD scaling remains rejected; renderer/deep-science gates remain separate'}
          Path('deep-twilight-noaerosol-row-identity-v15-output/decision-v15.json').write_text(json.dumps(decision,indent=2,sort_keys=True)+'\n')
          print(json.dumps(decision,sort_keys=True))
          PY

      - name: Upload immutable V15 evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-twilight-noaerosol-row-identity-v15
          path: deep-twilight-noaerosol-row-identity-v15-output
          if-no-files-found: error
          retention-days: 90

      - name: Enforce no-aerosol row-identity decision
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.probe.outputs.exit_code }}" = "0"
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('deep-twilight-noaerosol-row-identity-v15-output/decision-v15.json').read_text())
          assert d['status']=='PASS_EXACT_RUNTIME_NOAEROSOL_ROW_IDENTITY', d
          assert d['probeNCaoth']==2 and all(d['row0RawEqualityByTable'].values())
          assert d['probeRow1DtAllExactSignedZero'] is True and d['referenceRow1DtHasNonzero'] is True
          assert d['mysticBodyExecuted'] is False and d['photonTraced'] is False and d['epsilonSubstitutionUsed'] is False
          PY
