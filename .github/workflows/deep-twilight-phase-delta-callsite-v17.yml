name: Deep twilight phase-delta exact callsite v17

on:
  push:
    branches:
      - review/deep-twilight-phase-delta-callsite-v17
    paths:
      - ".github/workflows/deep-twilight-phase-delta-callsite-v17.yml"

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  phase-delta-callsite-v17:
    if: >-
      github.run_attempt == 1 &&
      github.event.before == 'fe6e063c568394ae7b4e90222de270d3f2460455'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN: fe6e063c568394ae7b4e90222de270d3f2460455
      UVSPEC_SHA256: 2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3
      EXACT_PACKAGE: rubin-libradtran=2.0.6=py312pl5321he9373c2_1
      V16_RUN: '34015702975'
      V16_HEAD: ce87c95f6e9be0cbe821237977d54e49f3ae4b6b
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Freeze V17 scope and fail closed on real V1 contention
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/review/deep-twilight-phase-delta-callsite-v17"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "${{ github.event.before }}" = "$EXPECTED_MAIN"
          OUT=deep-twilight-phase-delta-callsite-v17-output
          mkdir -p "$OUT"
          cat > "$OUT/PROTOCOL.txt" <<'EOF'
          DEEP TWILIGHT PHASE/DELTA EXACT CALLSITE V17
          POST_V1 / STATIC ONLY / NO UVSPEC EXECUTION / NO RNG / NO MYSTIC BODY / NO PHOTONS

          V15 established exact component identity for the frozen 550-nm runtime: row0 invariant molecular state,
          row1 aerosol optical-depth slot. V16 established exact installed MYSTIC entry declarations and pinned-binary
          call edges mystic->get_phase_matrix_total->get_phase_matrix_caoth and mu_scatter->sc_HG2_mu, with
          sc_HG2_mu(g1,g2,ff) declared in the exact installed header.

          V17 is the narrow result-blind static successor. It captures all installed libRadtran header contexts and
          exact pinned-binary callsite instruction slices for convert_caoth_mystic, sc_HG2_mu, delta_scale_hg,
          delta_scale, get_phase_matrix_caoth, get_phase_matrix_total and mu_scatter. It also records DWARF availability.

          PASS is not a numerical result. The purpose is to distinguish what is mechanically established from what
          remains ambiguous for renderer translation. No name-based semantic guessing is allowed. A mapping may be
          promoted only when exact header/DWARF ABI and exact callsite flow support it. Ambiguous f_s/ds_s remains
          fail-closed. No uniform AOD-scaling shortcut may be revived.

          No protected result, no Taylor/Jerusalem, no Level-B change, no epsilon substitution. NEVER rerun/retry/resume.
          EOF
          gh api "repos/$GITHUB_REPOSITORY/issues/60" > "$OUT/issue60-preflight.json"
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$OUT/main-preflight.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V16_RUN" > "$OUT/v16-run.json"
          python - <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          root=Path('deep-twilight-phase-delta-callsite-v17-output')
          main=json.loads((root/'main-preflight.json').read_text())
          v16=json.loads((root/'v16-run.json').read_text())
          if main['commit']['sha'] != os.environ['EXPECTED_MAIN']: raise SystemExit('main changed; fail closed')
          if v16.get('head_sha') != os.environ['V16_HEAD'] or v16.get('conclusion') != 'success' or v16.get('run_attempt') != 1:
              raise SystemExit('V16 exact predecessor identity is not terminal attempt-1 SUCCESS')
          repo=os.environ['GITHUB_REPOSITORY']; current=int(os.environ['GITHUB_RUN_ID']); blockers=[]
          needles=('reptran','recovery4','ordinal45','avps','level-b','level b','lowalt')
          for status in ('in_progress','queued'):
              p=subprocess.run(['gh','api',f'repos/{repo}/actions/runs?status={status}&per_page=100'],text=True,capture_output=True,check=True)
              for r in json.loads(p.stdout).get('workflow_runs',[]):
                  if int(r['id'])==current: continue
                  name=(str(r.get('name',''))+' '+str(r.get('head_branch',''))).lower()
                  if any(n in name for n in needles): blockers.append((status,r['id'],r.get('name'),r.get('head_branch')))
          if blockers: print('actual V1 contention detected:',blockers); sys.exit(43)
          print('V16 predecessor bound; no actual queued/in-progress V1 contention')
          PY

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: deep-twilight-phase-delta-callsite-v17
          create-args: >-
            -c conda-forge
            python=3.12.4
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Bind exact package and collect all installed header contexts
        shell: bash -el {0}
        run: |
          set -euo pipefail
          OUT=deep-twilight-phase-delta-callsite-v17-output
          UVSPEC="$(command -v uvspec)"
          test "$(sha256sum "$UVSPEC" | awk '{print $1}')" = "$UVSPEC_SHA256"
          micromamba list --explicit > "$OUT/runtime-package-explicit.txt"
          micromamba list --json > "$OUT/runtime-package-list.json"
          sha256sum "$UVSPEC" > "$OUT/uvspec-sha256.txt"
          python - <<'PY'
          from pathlib import Path
          import json,os,re,hashlib
          inc=Path(os.environ['CONDA_PREFIX'])/'include/libRadtran'
          root=Path('deep-twilight-phase-delta-callsite-v17-output')
          terms=['convert_caoth_mystic','sc_HG2_mu','delta_scale_hg','delta_scale','get_phase_matrix_caoth','get_phase_matrix_total','mu_scatter','dt_s','om_s','g1_s','g2_s','f_s','ds_s']
          index={t:[] for t in terms}; blocks=[]; file_hashes={}
          for p in sorted(inc.rglob('*')):
              if not p.is_file(): continue
              try: text=p.read_text(errors='strict')
              except Exception: continue
              rel=str(p.relative_to(inc)); lines=text.splitlines()
              file_hashes[rel]=hashlib.sha256(p.read_bytes()).hexdigest()
              for term in terms:
                  for i,line in enumerate(lines):
                      if term in line:
                          index[term].append({'file':rel,'line':i+1,'text':line})
                          a=max(0,i-10); b=min(len(lines),i+11)
                          blocks.append(f'===== {term} :: {rel}:{i+1} =====\n'+'\n'.join(f'{j+1:05d}: {lines[j]}' for j in range(a,b)))
          (root/'installed-header-hit-index.json').write_text(json.dumps(index,indent=2,sort_keys=True)+'\n')
          (root/'installed-header-target-context.txt').write_text('\n\n'.join(blocks)+'\n')
          (root/'installed-header-sha256.json').write_text(json.dumps(file_hashes,indent=2,sort_keys=True)+'\n')
          # Separate bounded semantic vocabulary scan; this is evidence, not automatic interpretation.
          pat=re.compile(r'(Henyey|double.?HG|HG2|delta.?scal|asymmetr|forward.?fraction|phase.?function|delta.?fraction)',re.I)
          sem=[]
          for p in sorted(inc.rglob('*')):
              if not p.is_file(): continue
              try: lines=p.read_text(errors='strict').splitlines()
              except Exception: continue
              rel=str(p.relative_to(inc))
              for i,line in enumerate(lines):
                  if pat.search(line): sem.append(f'{rel}:{i+1}: {line}')
          (root/'installed-header-phase-delta-vocabulary.txt').write_text('\n'.join(sem[:4000])+'\n')
          PY

      - name: Extract exact pinned-binary callsites and function bodies
        shell: bash -el {0}
        run: |
          set -euo pipefail
          OUT=deep-twilight-phase-delta-callsite-v17-output
          UVSPEC="$(command -v uvspec)"
          readelf -S "$UVSPEC" > "$OUT/uvspec-readelf-sections.txt"
          readelf -Ws "$UVSPEC" > "$OUT/uvspec-readelf-symbols.txt"
          nm -an "$UVSPEC" > "$OUT/uvspec-nm-an.txt"
          objdump -drwC -Mintel "$UVSPEC" > "$OUT/uvspec-objdump-full.txt"
          for sym in mystic convert_caoth_mystic sc_HG_mu sc_HG2_mu delta_scale_hg delta_scale get_phase_matrix_caoth get_phase_matrix_total mu_scatter; do
            objdump -drwC -Mintel --disassemble="$sym" "$UVSPEC" > "$OUT/disasm-$sym.txt" || true
          done
          if readelf -S "$UVSPEC" | grep -Eq '\.debug_info|\.debug_line'; then
            printf '%s\n' 'DWARF_PRESENT' > "$OUT/dwarf-status.txt"
            readelf --debug-dump=info "$UVSPEC" > "$OUT/uvspec-debug-info.txt" || true
            readelf --debug-dump=decodedline "$UVSPEC" > "$OUT/uvspec-debug-lines.txt" || true
          else
            printf '%s\n' 'NO_DWARF_DEBUG_SECTIONS' > "$OUT/dwarf-status.txt"
            : > "$OUT/uvspec-debug-info.txt"
          fi
          python - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('deep-twilight-phase-delta-callsite-v17-output')
          lines=(root/'uvspec-objdump-full.txt').read_text(errors='replace').splitlines()
          targets=['convert_caoth_mystic','sc_HG2_mu','delta_scale_hg','delta_scale','get_phase_matrix_caoth','get_phase_matrix_total','mu_scatter']
          label_re=re.compile(r'^\s*([0-9a-f]+) <([^>]+)>:$')
          call_re=re.compile(r'\bcall\w*\s+[^<]*<([^>]+)>')
          caller='UNKNOWN'; sites=[]
          for i,line in enumerate(lines):
              lm=label_re.match(line)
              if lm: caller=lm.group(2)
              cm=call_re.search(line)
              if cm and any(t==cm.group(1).split('@')[0] or t in cm.group(1) for t in targets):
                  a=max(0,i-48); b=min(len(lines),i+49)
                  sites.append({'caller':caller,'callee':cm.group(1),'lineIndex':i+1,'instruction':line.strip(),'context':lines[a:b]})
          serial=[{k:v for k,v in s.items() if k!='context'} for s in sites]
          (root/'target-callsite-index.json').write_text(json.dumps(serial,indent=2,sort_keys=True)+'\n')
          with (root/'target-callsite-context.txt').open('w') as f:
              for n,s in enumerate(sites,1):
                  f.write(f'===== CALLSITE {n}: {s["caller"]} -> {s["callee"]} =====\n')
                  f.write('\n'.join(s['context'])+'\n\n')
          # If DWARF exists, retain bounded target-name neighborhoods from exact DIE readout.
          dbg=(root/'uvspec-debug-info.txt').read_text(errors='replace').splitlines()
          dw=[]
          for i,line in enumerate(dbg):
              if any(t in line for t in targets):
                  a=max(0,i-30); b=min(len(dbg),i+60)
                  dw.extend([f'===== DWARF target near line {i+1} =====',*dbg[a:b],''])
          (root/'target-dwarf-context.txt').write_text('\n'.join(dw[:12000])+'\n')
          PY

      - name: Produce fail-closed semantic classification
        shell: bash -el {0}
        run: |
          set -euo pipefail
          OUT=deep-twilight-phase-delta-callsite-v17-output
          python - <<'PY'
          from pathlib import Path
          import json,os,re,hashlib
          root=Path('deep-twilight-phase-delta-callsite-v17-output')
          hdr=json.loads((root/'installed-header-hit-index.json').read_text())
          calls=json.loads((root/'target-callsite-index.json').read_text())
          dwarf=(root/'dwarf-status.txt').read_text().strip()
          hg2=(root/'disasm-sc_HG2_mu.txt').read_text(errors='replace')
          mus=(root/'disasm-mu_scatter.txt').read_text(errors='replace')
          # Mechanical facts only. These booleans deliberately require multiple exact evidence channels.
          hg2_decl=any('sc_HG2_mu' in x['text'] and 'g1' in x['text'] and 'g2' in x['text'] and 'ff' in x['text'] for x in hdr.get('sc_HG2_mu',[]))
          mu_calls_hg2=any(c['caller']=='mu_scatter' and 'sc_HG2_mu' in c['callee'] for c in calls)
          delta_callers=[c for c in calls if 'delta_scale' in c['callee']]
          convert_callers=[c for c in calls if 'convert_caoth_mystic' in c['callee']]
          facts={
            'exactScHG2PrototypeNamesG1G2Ff':hg2_decl,
            'exactMuScatterCallsScHG2':mu_calls_hg2,
            'deltaScaleCallsites':delta_callers,
            'convertCaothMysticCallsites':convert_callers,
            'dwarfStatus':dwarf,
            'scHG2DisassemblyNonempty':len(hg2.strip())>0,
            'muScatterDisassemblyNonempty':len(mus.strip())>0,
            'fEntrySemanticStatus':'UNRESOLVED_UNLESS_EXACT_CALLFLOW_CONNECTS_ENTRY_F_TO_SC_HG2_FF',
            'dsEntrySemanticStatus':'UNRESOLVED_UNLESS_EXACT_CALLFLOW_CONNECTS_ENTRY_DS_TO_DELTA_SCALE',
            'rendererParityAuthorized':False,
          }
          (root/'SEMANTIC_CLASSIFICATION.json').write_text(json.dumps(facts,indent=2,sort_keys=True)+'\n')
          # Bounded exact evidence for Issue #60. Keep disassembly as evidence; do not translate it into unstated physics.
          contexts=(root/'target-callsite-context.txt').read_text(errors='replace')
          hg2_lines=hg2.splitlines()
          body=[
            'DEEP_TWILIGHT::PHASE_DELTA_EXACT_CALLSITE_V17_READOUT','',
            f'fence_main={os.environ["EXPECTED_MAIN"]}',f'branch={os.environ["GITHUB_REF_NAME"]}',f'head={os.environ["GITHUB_SHA"]}',f'run={os.environ["GITHUB_RUN_ID"]} attempt1',
            f'package={os.environ["EXACT_PACKAGE"]}',f'uvspec_sha256={os.environ["UVSPEC_SHA256"]}',
            'STATIC_ONLY=true','uvspecExecuted=false; rngInitialized=false; seedConsumed=false; mysticBodyExecuted=false; photonTraced=false',
            'protectedResultOpened=false; levelBChanged=false; Taylor/Jerusalem=false; epsilonSubstitution=false','',
            'Mechanical semantic classification:','```json',json.dumps(facts,indent=2,sort_keys=True)[:16000],'```','',
            'Exact sc_HG2_mu function body (pinned binary):','```text','\n'.join(hg2_lines[:220]),'```','',
            'Bounded target callsite contexts (pinned binary):','```text',contexts[:30000],'```','',
            'CLAIM_BOUNDARY: exact installed-header/DWARF-if-present + exact pinned-binary static evidence only. V17 does not execute uvspec or MYSTIC and does not itself authorize renderer parity. f_s/ds_s stay fail-closed unless the exact dataflow actually connects them to a proved semantic role. No name-only inference and no uniform-AOD shortcut.'
          ]
          (root/'ISSUE_COMMENT.md').write_text('\n'.join(body)+'\n')
          manifest={}
          for p in sorted(root.iterdir()):
              if p.is_file(): manifest[p.name]=hashlib.sha256(p.read_bytes()).hexdigest()
          (root/'evidence-sha256.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          PY

      - name: Upload immutable V17 static evidence
        uses: actions/upload-artifact@v4
        with:
          name: deep-twilight-phase-delta-callsite-v17
          path: deep-twilight-phase-delta-callsite-v17-output/
          if-no-files-found: error
          retention-days: 90

      - name: Fresh control and contention guard before checkpoint
        shell: bash
        run: |
          set -euo pipefail
          OUT=deep-twilight-phase-delta-callsite-v17-output
          gh api "repos/$GITHUB_REPOSITORY/issues/60" > "$OUT/issue60-precomment.json"
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$OUT/main-precomment.json"
          python - <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          root=Path('deep-twilight-phase-delta-callsite-v17-output')
          main=json.loads((root/'main-precomment.json').read_text())
          if main['commit']['sha'] != os.environ['EXPECTED_MAIN']: raise SystemExit('main changed; fail closed')
          repo=os.environ['GITHUB_REPOSITORY']; current=int(os.environ['GITHUB_RUN_ID']); blockers=[]
          needles=('reptran','recovery4','ordinal45','avps','level-b','level b','lowalt')
          for status in ('in_progress','queued'):
              p=subprocess.run(['gh','api',f'repos/{repo}/actions/runs?status={status}&per_page=100'],text=True,capture_output=True,check=True)
              for r in json.loads(p.stdout).get('workflow_runs',[]):
                  if int(r['id'])==current: continue
                  name=(str(r.get('name',''))+' '+str(r.get('head_branch',''))).lower()
                  if any(n in name for n in needles): blockers.append((status,r['id'],r.get('name'),r.get('head_branch')))
          if blockers: print('actual V1 contention before checkpoint:',blockers); sys.exit(44)
          PY

      - name: Persist bounded V17 checkpoint to Issue 60
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 60 --repo "$GITHUB_REPOSITORY" --body-file deep-twilight-phase-delta-callsite-v17-output/ISSUE_COMMENT.md
