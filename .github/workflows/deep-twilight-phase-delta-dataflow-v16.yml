name: Deep twilight phase-delta exact-static dataflow v16

on:
  push:
    branches:
      - review/deep-twilight-phase-delta-dataflow-v16
    paths:
      - ".github/workflows/deep-twilight-phase-delta-dataflow-v16.yml"

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  phase-delta-dataflow-v16:
    if: >-
      github.run_attempt == 1 &&
      github.event.before == 'fe6e063c568394ae7b4e90222de270d3f2460455'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN: fe6e063c568394ae7b4e90222de270d3f2460455
      UVSPEC_SHA256: 2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3
      EXACT_PACKAGE: rubin-libradtran=2.0.6=py312pl5321he9373c2_1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Freeze exact-static V16 scope and fail closed on real V1 contention
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/review/deep-twilight-phase-delta-dataflow-v16"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "${{ github.event.before }}" = "$EXPECTED_MAIN"
          OUT=deep-twilight-phase-delta-dataflow-v16-output
          mkdir -p "$OUT"
          cat > "$OUT/PROTOCOL.txt" <<'EOF'
          DEEP TWILIGHT PHASE/DELTA EXACT-STATIC DATAFLOW V16
          POST_V1 / STATIC ONLY / NO UVSPEC EXECUTION / NO RNG / NO MYSTIC BODY / NO PHOTONS

          Frozen target: exact installed rubin-libradtran 2.0.6 build-1 runtime whose uvspec SHA-256 is
          2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3.

          Purpose: resolve the next V15 closure gate without guessing from a mismatched historical source archive:
          capture exact installed-header context and exact pinned-binary static dataflow for MYSTIC entry
          dt_s/om_s/g1_s/g2_s/f_s/ds_s, especially double-HG forward-fraction versus delta-scaling roles.

          Allowed claims are static provenance only. Parameter names, declarations, comments, symbol/call edges and
          machine instructions may be reported exactly. Semantic translation is NOT considered proved merely because
          a symbol name looks suggestive. Any ambiguous mapping remains fail-closed for renderer parity.

          No protected result may be opened. No Taylor/Jerusalem input. No Level-B change. No epsilon substitution.
          This workflow must never be Re-run/retried/resumed; any successor requires a fresh branch/head/attempt.
          EOF
          gh api "repos/$GITHUB_REPOSITORY/issues/60" > "$OUT/issue60-prefreeze.json"
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$OUT/main-prefreeze.json"
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          root=Path('deep-twilight-phase-delta-dataflow-v16-output')
          main=json.loads((root/'main-prefreeze.json').read_text())
          if main['commit']['sha'] != os.environ['EXPECTED_MAIN']:
              raise SystemExit('main changed; fail closed')
          repo=os.environ['GITHUB_REPOSITORY']; current=int(os.environ['GITHUB_RUN_ID'])
          blockers=[]; needles=('reptran','recovery4','ordinal45','avps','level-b','level b','lowalt')
          for status in ('in_progress','queued'):
              p=subprocess.run(['gh','api',f'repos/{repo}/actions/runs?status={status}&per_page=100'],text=True,capture_output=True,check=True)
              for r in json.loads(p.stdout).get('workflow_runs',[]):
                  if int(r['id']) == current: continue
                  name=(str(r.get('name',''))+' '+str(r.get('head_branch',''))).lower()
                  if any(n in name for n in needles): blockers.append((status,r['id'],r.get('name'),r.get('head_branch')))
          if blockers:
              print('actual V1 contention detected:', blockers)
              sys.exit(43)
          print('no actual queued/in-progress V1 contention')
          PY

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: deep-twilight-phase-delta-dataflow-v16
          create-args: >-
            -c conda-forge
            python=3.12.4
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Bind exact package and capture installed header semantics
        shell: bash -el {0}
        run: |
          set -euo pipefail
          OUT=deep-twilight-phase-delta-dataflow-v16-output
          micromamba list --explicit > "$OUT/runtime-package-explicit.txt"
          micromamba list --json > "$OUT/runtime-package-list.json"
          UVSPEC="$(command -v uvspec)"
          test "$(sha256sum "$UVSPEC" | awk '{print $1}')" = "$UVSPEC_SHA256"
          HEADER="$CONDA_PREFIX/include/libRadtran/mystic.h"
          test -f "$HEADER"
          sha256sum "$UVSPEC" "$HEADER" > "$OUT/target-sha256.txt"
          cp "$HEADER" "$OUT/mystic.h.exact-installed"
          python - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('deep-twilight-phase-delta-dataflow-v16-output')
          h=Path(__import__('os').environ['CONDA_PREFIX'])/'include/libRadtran/mystic.h'
          lines=h.read_text(errors='strict').splitlines()
          needles=['dt_s','om_s','g1_s','g2_s','f_s','ds_s','sc_HG2_mu','delta_scale_hg','delta_scale','convert_caoth_mystic','get_phase_matrix_caoth','mu_scatter']
          hits={}
          blocks=[]
          for needle in needles:
              idx=[i for i,s in enumerate(lines) if needle in s]
              hits[needle]=[i+1 for i in idx]
              for i in idx:
                  a=max(0,i-8); b=min(len(lines),i+9)
                  blocks.append(f'===== {needle} @ line {i+1} =====\n'+ '\n'.join(f'{j+1:05d}: {lines[j]}' for j in range(a,b)))
          (root/'mystic-header-target-context.txt').write_text('\n\n'.join(blocks)+'\n')
          (root/'mystic-header-hit-index.json').write_text(json.dumps(hits,indent=2,sort_keys=True)+'\n')
          # Bounded semantic vocabulary scan from the exact installed header only.
          pat=re.compile(r'(Henyey|HG2|delta[-_ ]?scal|asymmetr|phase|g1|g2|fraction|forward)',re.I)
          sem=[f'{i+1:05d}: {s}' for i,s in enumerate(lines) if pat.search(s)]
          (root/'mystic-header-phase-delta-lines.txt').write_text('\n'.join(sem[:1000])+'\n')
          PY

      - name: Capture exact binary symbols, call edges, and target disassembly
        shell: bash -el {0}
        run: |
          set -euo pipefail
          OUT=deep-twilight-phase-delta-dataflow-v16-output
          UVSPEC="$(command -v uvspec)"
          command -v nm >/dev/null; command -v objdump >/dev/null; command -v readelf >/dev/null
          readelf -S "$UVSPEC" > "$OUT/uvspec-readelf-sections.txt"
          readelf -Ws "$UVSPEC" > "$OUT/uvspec-readelf-symbols.txt"
          nm -an "$UVSPEC" > "$OUT/uvspec-nm-an.txt"
          objdump -drwC -Mintel "$UVSPEC" > "$OUT/uvspec-objdump-full.txt"
          for sym in mystic convert_caoth_mystic sc_HG2_mu delta_scale_hg delta_scale get_phase_matrix_caoth get_phase_matrix_total mu_scatter; do
            objdump -drwC -Mintel --disassemble="$sym" "$UVSPEC" > "$OUT/disasm-$sym.txt" || true
          done
          if readelf -S "$UVSPEC" | grep -Eq '\.debug_info|\.debug_line'; then
            readelf --debug-dump=info "$UVSPEC" > "$OUT/uvspec-debug-info.txt" || true
            readelf --debug-dump=decodedline "$UVSPEC" > "$OUT/uvspec-debug-lines.txt" || true
          else
            printf '%s\n' 'NO_DWARF_DEBUG_SECTIONS' > "$OUT/uvspec-debug-info.txt"
          fi
          python - <<'PY'
          from pathlib import Path
          import json,re,hashlib
          root=Path('deep-twilight-phase-delta-dataflow-v16-output')
          targets=['convert_caoth_mystic','sc_HG2_mu','delta_scale_hg','delta_scale','get_phase_matrix_caoth','get_phase_matrix_total','mu_scatter']
          call_re=re.compile(r'\bcall\b.*<([^>]+)>')
          edges=[]
          for src in ['mystic','convert_caoth_mystic','get_phase_matrix_caoth','get_phase_matrix_total','mu_scatter']:
              p=root/f'disasm-{src}.txt'
              if not p.exists(): continue
              for line in p.read_text(errors='replace').splitlines():
                  m=call_re.search(line)
                  if m and any(t in m.group(1) for t in targets):
                      edges.append({'from':src,'to':m.group(1),'instruction':line.strip()})
          (root/'target-call-edges.json').write_text(json.dumps(edges,indent=2,sort_keys=True)+'\n')
          manifest={}
          for p in sorted(root.iterdir()):
              if p.is_file(): manifest[p.name]=hashlib.sha256(p.read_bytes()).hexdigest()
          (root/'evidence-sha256.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          PY

      - name: Build bounded exact-static readout
        shell: bash -el {0}
        run: |
          set -euo pipefail
          OUT=deep-twilight-phase-delta-dataflow-v16-output
          python - <<'PY'
          from pathlib import Path
          import json,os,re,hashlib
          root=Path('deep-twilight-phase-delta-dataflow-v16-output')
          hits=json.loads((root/'mystic-header-hit-index.json').read_text())
          ctx=(root/'mystic-header-target-context.txt').read_text()
          edges=json.loads((root/'target-call-edges.json').read_text())
          # Keep only small exact excerpts that are useful for the human semantic review.
          exact=[]
          for key in ('sc_HG2_mu','delta_scale_hg','delta_scale','convert_caoth_mystic','dt_s','om_s','g1_s','g2_s','f_s','ds_s'):
              marker=f'===== {key} @ line '
              pos=ctx.find(marker)
              if pos>=0:
                  end=ctx.find('\n\n=====',pos+len(marker))
                  if end<0: end=min(len(ctx),pos+4000)
                  exact.append(ctx[pos:end])
          summary={
            'stage':'DEEP_TWILIGHT_PHASE_DELTA_DATAFLOW_V16',
            'staticOnly':True,
            'uvspecExecuted':False,
            'rngInitialized':False,
            'seedConsumed':False,
            'mysticBodyExecuted':False,
            'photonTraced':False,
            'protectedResultOpened':False,
            'levelBChanged':False,
            'taylorOrJerusalemUsed':False,
            'epsilonSubstitutionUsed':False,
            'package':os.environ['EXACT_PACKAGE'],
            'uvspecSha256':os.environ['UVSPEC_SHA256'],
            'headerHitLines':hits,
            'targetCallEdges':edges,
            'claimBoundary':'exact installed-header and pinned-binary static evidence only; renderer semantics remain fail-closed where not explicit',
          }
          (root/'STATIC_READOUT.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          body=[
            'DEEP_TWILIGHT::PHASE_DELTA_EXACT_STATIC_DATAFLOW_V16_READOUT',
            '',
            f'fence_main={os.environ["EXPECTED_MAIN"]}',
            f'branch={os.environ["GITHUB_REF_NAME"]}',
            f'head={os.environ["GITHUB_SHA"]}',
            f'run={os.environ["GITHUB_RUN_ID"]} attempt1',
            f'package={os.environ["EXACT_PACKAGE"]}',
            f'uvspec_sha256={os.environ["UVSPEC_SHA256"]}',
            'STATIC_ONLY=true',
            'uvspecExecuted=false; rngInitialized=false; seedConsumed=false; mysticBodyExecuted=false; photonTraced=false',
            'protectedResultOpened=false; levelBChanged=false; Taylor/Jerusalem=false; epsilonSubstitution=false',
            '',
            'Exact installed-header hit index:',
            '```json', json.dumps(hits,sort_keys=True), '```',
            '',
            'Pinned-binary target call edges found:',
            '```json', json.dumps(edges,sort_keys=True)[:12000], '```',
            '',
            'Bounded exact installed-header excerpts:',
            '```text', '\n\n'.join(exact)[:24000], '```',
            '',
            'CLAIM_BOUNDARY: this is exact installed-header + pinned-binary static evidence only. Symbol names are not silently promoted into renderer semantics. Any ambiguous f_s/ds_s or phase/delta mapping remains fail-closed; no uniform-AOD shortcut is revived.',
          ]
          (root/'ISSUE_COMMENT.md').write_text('\n'.join(body)+'\n')
          PY

      - name: Upload immutable static evidence
        uses: actions/upload-artifact@v4
        with:
          name: deep-twilight-phase-delta-dataflow-v16
          path: deep-twilight-phase-delta-dataflow-v16-output/
          if-no-files-found: error
          retention-days: 90

      - name: Fresh control guard before material checkpoint
        shell: bash
        run: |
          set -euo pipefail
          OUT=deep-twilight-phase-delta-dataflow-v16-output
          gh api "repos/$GITHUB_REPOSITORY/issues/60" > "$OUT/issue60-precomment.json"
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$OUT/main-precomment.json"
          python - <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          root=Path('deep-twilight-phase-delta-dataflow-v16-output')
          main=json.loads((root/'main-precomment.json').read_text())
          if main['commit']['sha'] != os.environ['EXPECTED_MAIN']: raise SystemExit('main changed; skip checkpoint')
          repo=os.environ['GITHUB_REPOSITORY']; current=int(os.environ['GITHUB_RUN_ID']); blockers=[]
          needles=('reptran','recovery4','ordinal45','avps','level-b','level b','lowalt')
          for status in ('in_progress','queued'):
              p=subprocess.run(['gh','api',f'repos/{repo}/actions/runs?status={status}&per_page=100'],text=True,capture_output=True,check=True)
              for r in json.loads(p.stdout).get('workflow_runs',[]):
                  if int(r['id'])==current: continue
                  name=(str(r.get('name',''))+' '+str(r.get('head_branch',''))).lower()
                  if any(n in name for n in needles): blockers.append((status,r['id'],r.get('name'),r.get('head_branch')))
          if blockers: print('actual V1 contention before checkpoint:',blockers); sys.exit(44)
          PY

      - name: Persist bounded material checkpoint to Issue 60
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 60 --repo "$GITHUB_REPOSITORY" --body-file deep-twilight-phase-delta-dataflow-v16-output/ISSUE_COMMENT.md
