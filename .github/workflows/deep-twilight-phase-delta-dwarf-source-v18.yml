name: Deep twilight phase-delta DWARF/source v18

on:
  push:
    branches:
      - review/deep-twilight-phase-delta-dwarf-source-v18
    paths:
      - ".github/workflows/deep-twilight-phase-delta-dwarf-source-v18.yml"

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  phase-delta-dwarf-source-v18:
    if: >-
      github.run_attempt == 1 &&
      github.event.before == 'fe6e063c568394ae7b4e90222de270d3f2460455'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN: fe6e063c568394ae7b4e90222de270d3f2460455
      UVSPEC_SHA256: 2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3
      EXACT_PACKAGE: rubin-libradtran=2.0.6=py312pl5321he9373c2_1
      V17_RUN: '34015854943'
      V17_HEAD: 8205e7f5d99e77b2bb89b700ab696d6d2b19154a
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Freeze exact-static V18 scope and fail closed on real V1 contention
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/review/deep-twilight-phase-delta-dwarf-source-v18"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "${{ github.event.before }}" = "$EXPECTED_MAIN"
          OUT=deep-twilight-phase-delta-dwarf-source-v18-output
          mkdir -p "$OUT"
          cat > "$OUT/PROTOCOL.txt" <<'EOF'
          DEEP TWILIGHT PHASE/DELTA DWARF + PACKAGE-SOURCE V18
          STATIC ONLY / NO UVSPEC EXECUTION / NO RNG / NO MYSTIC BODY / NO PHOTONS

          Frozen predecessor: V17 run 34015854943 attempt1 SUCCESS at head
          8205e7f5d99e77b2bb89b700ab696d6d2b19154a. V17 proved exact sc_HG2_mu(g1,g2,ff),
          exact mu_scatter->sc_HG2_mu call edge, exact solve_rte->convert_caoth_mystic call edge,
          and DWARF presence, but deliberately left entry f_s/ds_s semantics unresolved.

          V18 uses only exact package contents and exact pinned-binary DWARF/static metadata. It searches the extracted
          conda package (including info/recipe) for any shipped C/source fragments, resolves DWARF subprogram/formal/local
          names and declaration files, enumerates structure members relevant to g1/g2/f/ff/ds/delta, and records exact
          address-to-line mappings for the target call graph.

          Semantics may be promoted only where exact evidence composes: declaration/field identity + DWARF identity +
          exact binary call/dataflow. Source-like names alone are not sufficient. Missing historical source bytes remain
          a provenance residual, not a license to guess. f_s/ds_s remain fail-closed if composition is incomplete.

          No protected result, no Taylor/Jerusalem, no Level-B change, no epsilon substitution. NEVER rerun/retry/resume.
          EOF
          gh api "repos/$GITHUB_REPOSITORY/issues/60" > "$OUT/issue60-preflight.json"
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$OUT/main-preflight.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V17_RUN" > "$OUT/v17-run.json"
          python - <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          root=Path('deep-twilight-phase-delta-dwarf-source-v18-output')
          main=json.loads((root/'main-preflight.json').read_text()); v17=json.loads((root/'v17-run.json').read_text())
          if main['commit']['sha'] != os.environ['EXPECTED_MAIN']: raise SystemExit('main changed; fail closed')
          if v17.get('head_sha') != os.environ['V17_HEAD'] or v17.get('conclusion') != 'success' or v17.get('run_attempt') != 1:
              raise SystemExit('V17 predecessor identity mismatch')
          repo=os.environ['GITHUB_REPOSITORY']; current=int(os.environ['GITHUB_RUN_ID']); blockers=[]
          needles=('reptran','recovery4','ordinal45','avps','level-b','level b','lowalt')
          for status in ('in_progress','queued'):
              p=subprocess.run(['gh','api',f'repos/{repo}/actions/runs?status={status}&per_page=100'],text=True,capture_output=True,check=True)
              for r in json.loads(p.stdout).get('workflow_runs',[]):
                  if int(r['id'])==current: continue
                  name=(str(r.get('name',''))+' '+str(r.get('head_branch',''))).lower()
                  if any(n in name for n in needles): blockers.append((status,r['id'],r.get('name'),r.get('head_branch')))
          if blockers: print('actual V1 contention detected:',blockers); sys.exit(43)
          PY

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: deep-twilight-phase-delta-dwarf-source-v18
          create-args: >-
            -c conda-forge
            python=3.12.4
            pyelftools
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Bind exact package and inventory shipped source/recipe bytes
        shell: bash -el {0}
        run: |
          set -euo pipefail
          OUT=deep-twilight-phase-delta-dwarf-source-v18-output
          UVSPEC="$(command -v uvspec)"
          test "$(sha256sum "$UVSPEC" | awk '{print $1}')" = "$UVSPEC_SHA256"
          micromamba list --explicit > "$OUT/runtime-package-explicit.txt"
          PKGDIR="$MAMBA_ROOT_PREFIX/pkgs/rubin-libradtran-2.0.6-py312pl5321he9373c2_1"
          test -d "$PKGDIR"
          printf '%s\n' "$PKGDIR" > "$OUT/extracted-package-dir.txt"
          find "$PKGDIR" -type f -printf '%P\n' | LC_ALL=C sort > "$OUT/extracted-package-files.txt"
          find "$PKGDIR" -type f \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.h' -o -path '*/info/recipe/*' \) -printf '%P\n' | LC_ALL=C sort > "$OUT/source-recipe-candidates.txt"
          python - <<'PY'
          from pathlib import Path
          import os,json,re,hashlib
          root=Path('deep-twilight-phase-delta-dwarf-source-v18-output')
          pkg=Path(os.environ['MAMBA_ROOT_PREFIX'])/'pkgs'/'rubin-libradtran-2.0.6-py312pl5321he9373c2_1'
          cand=[]; contexts=[]
          terms=re.compile(r'(convert_caoth_mystic|sc_HG2_mu|delta_scale_hg|delta_scale|mu_scatter|dt_s|om_s|g1_s|g2_s|f_s|ds_s|Henyey|double.?HG|delta.?scal)',re.I)
          for rel in (root/'source-recipe-candidates.txt').read_text().splitlines():
              p=pkg/rel
              try: data=p.read_bytes(); text=data.decode('utf-8')
              except Exception: continue
              rec={'path':rel,'sha256':hashlib.sha256(data).hexdigest(),'size':len(data)}; cand.append(rec)
              lines=text.splitlines()
              for i,line in enumerate(lines):
                  if terms.search(line):
                      a=max(0,i-8); b=min(len(lines),i+9)
                      contexts.append(f'===== {rel}:{i+1} =====\n'+'\n'.join(f'{j+1:05d}: {lines[j]}' for j in range(a,b)))
          (root/'source-recipe-candidate-hashes.json').write_text(json.dumps(cand,indent=2,sort_keys=True)+'\n')
          (root/'source-recipe-target-context.txt').write_text('\n\n'.join(contexts[:4000])+'\n')
          exact_c=[x for x in cand if x['path'].lower().endswith(('.c','.cc','.cpp'))]
          (root/'shipped-c-source-status.json').write_text(json.dumps({'cSourceFiles':exact_c,'cSourceCount':len(exact_c)},indent=2,sort_keys=True)+'\n')
          PY

      - name: Recover exact DWARF subprogram, variable, type and source-line metadata
        shell: bash -el {0}
        run: |
          set -euo pipefail
          OUT=deep-twilight-phase-delta-dwarf-source-v18-output
          UVSPEC="$(command -v uvspec)"
          python - <<'PY'
          from elftools.elf.elffile import ELFFile
          from elftools.dwarf.descriptions import describe_form_class, describe_DWARF_expr
          from pathlib import Path
          import json,os,re
          root=Path('deep-twilight-phase-delta-dwarf-source-v18-output')
          path=Path(os.popen('command -v uvspec').read().strip())
          targets={'mystic','convert_caoth_mystic','sc_HG_mu','sc_HG2_mu','delta_scale_hg','delta_scale','get_phase_matrix_caoth','get_phase_matrix_total','mu_scatter','solve_rte'}
          member_pat=re.compile(r'^(g1|g2|f|ff|ds|dscale|delta|delta_scale|phase|phase_function|asymmetry|asymmetry_parameter)$',re.I)
          def dec(v):
              if isinstance(v,bytes): return v.decode('utf-8','replace')
              if isinstance(v,(int,str,float,bool)) or v is None: return v
              return repr(v)
          def attr(die,name):
              a=die.attributes.get(name)
              return None if a is None else dec(a.value)
          def type_name(die, dwarf):
              a=die.attributes.get('DW_AT_type')
              if not a: return None
              try:
                  t=dwarf.get_DIE_from_refaddr(a.value + die.cu.cu_offset if a.form.startswith('DW_FORM_ref') and a.form!='DW_FORM_ref_addr' else a.value)
              except Exception:
                  try: t=die.get_DIE_from_attribute('DW_AT_type')
                  except Exception: return None
              seen=0; parts=[]
              while t is not None and seen<8:
                  n=attr(t,'DW_AT_name')
                  if n: parts.append(n); break
                  if t.tag=='DW_TAG_pointer_type': parts.append('*')
                  try: t=t.get_DIE_from_attribute('DW_AT_type')
                  except Exception: break
                  seen+=1
              return ' '.join(reversed(parts)) if parts else None
          funcs=[]; structures=[]; source_files=set()
          with path.open('rb') as fh:
              elf=ELFFile(fh); dwarf=elf.get_dwarf_info()
              for cu in dwarf.iter_CUs():
                  lp=dwarf.line_program_for_CU(cu)
                  file_entries=[]
                  dirs=[]
                  if lp:
                      dirs=[dec(x) for x in lp['include_directory']]
                      file_entries=list(lp['file_entry'])
                  def decl_path(die):
                      idx=attr(die,'DW_AT_decl_file')
                      if not isinstance(idx,int) or idx<=0 or idx>len(file_entries): return None
                      fe=file_entries[idx-1]; name=dec(fe.name); di=getattr(fe,'dir_index',0)
                      if di and di<=len(dirs): return dirs[di-1].rstrip('/')+'/'+name
                      return name
                  for die in cu.iter_DIEs():
                      if die.tag=='DW_TAG_subprogram':
                          name=attr(die,'DW_AT_name'); link=attr(die,'DW_AT_linkage_name')
                          if name in targets or link in targets:
                              children=[]
                              for ch in die.iter_children():
                                  if ch.tag in ('DW_TAG_formal_parameter','DW_TAG_variable'):
                                      loc=attr(ch,'DW_AT_location')
                                      children.append({'tag':ch.tag,'name':attr(ch,'DW_AT_name'),'type':type_name(ch,dwarf),'location':loc,'declFile':decl_path(ch),'declLine':attr(ch,'DW_AT_decl_line')})
                              rec={'name':name,'linkageName':link,'declFile':decl_path(die),'declLine':attr(die,'DW_AT_decl_line'),'lowPc':attr(die,'DW_AT_low_pc'),'highPc':attr(die,'DW_AT_high_pc'),'frameBase':attr(die,'DW_AT_frame_base'),'children':children}
                              funcs.append(rec)
                              if rec['declFile']: source_files.add(rec['declFile'])
                      elif die.tag in ('DW_TAG_structure_type','DW_TAG_typedef'):
                          name=attr(die,'DW_AT_name'); members=[]
                          for ch in die.iter_children():
                              if ch.tag=='DW_TAG_member':
                                  mn=attr(ch,'DW_AT_name')
                                  if mn and member_pat.search(mn): members.append({'name':mn,'type':type_name(ch,dwarf),'dataMemberLocation':attr(ch,'DW_AT_data_member_location'),'declFile':decl_path(ch),'declLine':attr(ch,'DW_AT_decl_line')})
                          if members:
                              structures.append({'tag':die.tag,'name':name,'declFile':decl_path(die),'declLine':attr(die,'DW_AT_decl_line'),'members':members})
                              if decl_path(die): source_files.add(decl_path(die))
          (root/'dwarf-target-subprograms.json').write_text(json.dumps(funcs,indent=2,sort_keys=True)+'\n')
          (root/'dwarf-relevant-structures.json').write_text(json.dumps(structures,indent=2,sort_keys=True)+'\n')
          (root/'dwarf-target-source-files.txt').write_text('\n'.join(sorted(source_files))+'\n')
          PY
          for addr in 0x7b220 0xb7885 0x169a10 0x16d3ee 0x143120 0x1476a0 0x16cea0 0x16e6c0; do
            printf '===== %s =====\n' "$addr" >> "$OUT/addr2line-targets.txt"
            addr2line -f -C -i -e "$UVSPEC" "$addr" >> "$OUT/addr2line-targets.txt" || true
          done
          if command -v gdb >/dev/null 2>&1; then
            {
              echo 'set pagination off'
              echo 'set print pretty on'
              echo "file $UVSPEC"
              for sym in mystic convert_caoth_mystic sc_HG2_mu delta_scale_hg delta_scale get_phase_matrix_caoth get_phase_matrix_total mu_scatter solve_rte; do
                echo "ptype $sym"
                echo "info scope $sym"
              done
            } > "$OUT/gdb-static-commands.txt"
            gdb -q -nx -batch -x "$OUT/gdb-static-commands.txt" > "$OUT/gdb-static-types-scopes.txt" 2>&1 || true
          else
            echo NO_GDB > "$OUT/gdb-static-types-scopes.txt"
          fi

      - name: Compose exact evidence and bounded semantic disposition
        shell: bash -el {0}
        run: |
          set -euo pipefail
          OUT=deep-twilight-phase-delta-dwarf-source-v18-output
          python - <<'PY'
          from pathlib import Path
          import json,os,hashlib,re
          root=Path('deep-twilight-phase-delta-dwarf-source-v18-output')
          funcs=json.loads((root/'dwarf-target-subprograms.json').read_text())
          structs=json.loads((root/'dwarf-relevant-structures.json').read_text())
          source=json.loads((root/'shipped-c-source-status.json').read_text())
          gdb=(root/'gdb-static-types-scopes.txt').read_text(errors='replace')
          addr=(root/'addr2line-targets.txt').read_text(errors='replace')
          recipe=(root/'source-recipe-target-context.txt').read_text(errors='replace')
          def fn(name): return [x for x in funcs if x.get('name')==name or x.get('linkageName')==name]
          hg2=fn('sc_HG2_mu'); mu=fn('mu_scatter'); conv=fn('convert_caoth_mystic'); myst=fn('mystic')
          hg2_params=[]
          if hg2: hg2_params=[x.get('name') for x in hg2[0]['children'] if x['tag']=='DW_TAG_formal_parameter']
          myst_params=[]
          if myst: myst_params=[x.get('name') for x in myst[0]['children'] if x['tag']=='DW_TAG_formal_parameter']
          facts={
            'shippedExactCSourceCount':source['cSourceCount'],
            'dwarfScHG2FormalNames':hg2_params,
            'dwarfMysticFormalNames':myst_params,
            'dwarfConvertCaothMysticFound':bool(conv),
            'dwarfMuScatterFound':bool(mu),
            'relevantStructureCount':len(structs),
            'exactScHG2G1G2FfDwarfMatch':hg2_params[:3]==['g1','g2','ff'],
            'mysticEntryNamesIncludeFAndDs':('f_s' in myst_params and 'ds_s' in myst_params),
            'fEntrySemanticStatus':'FAIL_CLOSED_PENDING_EXACT_ENTRY_TO_INTERNAL_FF_DATAFLOW',
            'dsEntrySemanticStatus':'FAIL_CLOSED_PENDING_EXACT_ENTRY_TO_INTERNAL_DELTA_DATAFLOW',
            'rendererParityAuthorized':False,
          }
          # Names/DWARF alone never authorize parity; preserve that hard boundary explicitly.
          report={'facts':facts,'functions':funcs,'relevantStructures':structs,'targetAddr2line':addr,'gdbStaticExcerpt':gdb[:24000],'recipeSourceExcerpt':recipe[:16000]}
          (root/'V18_READOUT.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          body=[
            'DEEP_TWILIGHT::PHASE_DELTA_DWARF_SOURCE_V18_READOUT','',
            f'fence_main={os.environ["EXPECTED_MAIN"]}',f'branch={os.environ["GITHUB_REF_NAME"]}',f'head={os.environ["GITHUB_SHA"]}',f'run={os.environ["GITHUB_RUN_ID"]} attempt1',
            f'package={os.environ["EXACT_PACKAGE"]}',f'uvspec_sha256={os.environ["UVSPEC_SHA256"]}',
            'STATIC_ONLY=true; uvspecExecuted=false; rngInitialized=false; seedConsumed=false; mysticBodyExecuted=false; photonTraced=false',
            'protectedResultOpened=false; levelBChanged=false; Taylor/Jerusalem=false; epsilonSubstitution=false','',
            'Mechanical disposition:','```json',json.dumps(facts,indent=2,sort_keys=True),'```','',
            'Exact DWARF target subprograms/formals/locals:','```json',json.dumps(funcs,indent=2,sort_keys=True)[:30000],'```','',
            'Exact DWARF relevant structures/members:','```json',json.dumps(structs,indent=2,sort_keys=True)[:24000],'```','',
            'Exact target address-to-line map:','```text',addr[:12000],'```','',
            'Exact-package shipped C-source status:','```json',json.dumps(source,indent=2,sort_keys=True),'```','',
            'CLAIM_BOUNDARY: exact package bytes + exact DWARF/static metadata only. Formal/member names strengthen provenance but are not alone sufficient to claim renderer semantics. f_s/ds_s remain fail-closed until an exact entry-to-internal dataflow proof composes with the V17 sc_HG2 behavior/call graph. No uniform AOD shortcut.'
          ]
          (root/'ISSUE_COMMENT.md').write_text('\n'.join(body)+'\n')
          manifest={}
          for p in sorted(root.iterdir()):
              if p.is_file(): manifest[p.name]=hashlib.sha256(p.read_bytes()).hexdigest()
          (root/'evidence-sha256.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          PY

      - name: Upload immutable V18 static evidence
        uses: actions/upload-artifact@v4
        with:
          name: deep-twilight-phase-delta-dwarf-source-v18
          path: deep-twilight-phase-delta-dwarf-source-v18-output/
          if-no-files-found: error
          retention-days: 90

      - name: Fresh control and contention guard before checkpoint
        shell: bash
        run: |
          set -euo pipefail
          OUT=deep-twilight-phase-delta-dwarf-source-v18-output
          gh api "repos/$GITHUB_REPOSITORY/issues/60" > "$OUT/issue60-precomment.json"
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$OUT/main-precomment.json"
          python - <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          root=Path('deep-twilight-phase-delta-dwarf-source-v18-output')
          main=json.loads((root/'main-precomment.json').read_text())
          if main['commit']['sha'] != os.environ['EXPECTED_MAIN']: raise SystemExit('main changed; fail closed')
          repo=os.environ['GITHUB_REPOSITORY']; current=int(os.environ['GITHUB_RUN_ID']); blockers=[]
          needles=('reptran','recovery4','ordinal45','avps','level-b','level b','lowalt')
          for status in ('in_progress','queued'):
              p=subprocess.run(['gh','api',f'repos/{repo}/actions/runs?status={status}&per_page=100'],text=True,capture_output=True,check=True)
              for r in json.loads(p.stdout).get('workflow_runs',[]):
                  if int(r['id'])==current: continue
                  name=(str(r.get('name',''))+' '+str(r.get('head_branch',''))).lower()
                  if any(n in name for n in needles): blockers.append((status,r['id'],r.get('name'),r.get('head_branch')))
          if blockers: print('actual V1 contention before checkpoint:',blockers); sys.exit(44)
          PY

      - name: Persist bounded V18 checkpoint to Issue 60
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 60 --repo "$GITHUB_REPOSITORY" --body-file deep-twilight-phase-delta-dwarf-source-v18-output/ISSUE_COMMENT.md
