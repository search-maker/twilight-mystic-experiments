name: Deep twilight phase-delta DWARF/source v19

on:
  push:
    branches:
      - review/deep-twilight-phase-delta-dwarf-source-v19
    paths:
      - ".github/workflows/deep-twilight-phase-delta-dwarf-source-v19.yml"

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  phase-delta-dwarf-source-v19:
    if: >-
      github.run_attempt == 1 &&
      github.event.before == 'fe6e063c568394ae7b4e90222de270d3f2460455'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN: fe6e063c568394ae7b4e90222de270d3f2460455
      UVSPEC_SHA256: 2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3
      EXACT_PACKAGE: rubin-libradtran=2.0.6=py312pl5321he9373c2_1
      V17_RUN: '34015854943'
      V17_HEAD: 8205e7f5d99e77b2bb89b700ab696d6d2b19154a
      V18_RUN: '34015998877'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Freeze corrected V19 scope and fail closed on real V1 contention
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/review/deep-twilight-phase-delta-dwarf-source-v19"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "${{ github.event.before }}" = "$EXPECTED_MAIN"
          OUT=deep-twilight-phase-delta-dwarf-source-v19-output
          mkdir -p "$OUT"
          cat > "$OUT/PROTOCOL.txt" <<'EOF'
          DEEP TWILIGHT PHASE/DELTA DWARF + SOURCE-INVENTORY V19
          STATIC ONLY / NO UVSPEC EXECUTION / NO RNG / NO MYSTIC BODY / NO PHOTONS

          V17 is the exact successful predecessor. V18 attempt1 is consumed terminal FAILURE caused in its package
          inventory stage by treating one guessed micromamba package-cache directory as mandatory. V19 removes only
          that implementation assumption: package-cache recipe/source discovery is optional and enumerated dynamically;
          the exact installed prefix + exact pinned binary are the required authority for this static audit.

          V19 resolves target DWARF formal/local names, declaration files/lines, relevant structure members and exact
          address-to-line mappings, and inventories any source/recipe bytes actually shipped in the installed prefix or
          discoverable extracted package directory. No name-only semantic promotion is allowed. f_s/ds_s remain
          fail-closed unless exact evidence composes entry identity through internal dataflow.

          No protected result, no Taylor/Jerusalem, no Level-B change, no epsilon substitution. NEVER rerun/retry/resume.
          EOF
          gh api "repos/$GITHUB_REPOSITORY/issues/60" > "$OUT/issue60-preflight.json"
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$OUT/main-preflight.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V17_RUN" > "$OUT/v17-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V18_RUN" > "$OUT/v18-run.json"
          python - <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          root=Path('deep-twilight-phase-delta-dwarf-source-v19-output')
          main=json.loads((root/'main-preflight.json').read_text()); v17=json.loads((root/'v17-run.json').read_text()); v18=json.loads((root/'v18-run.json').read_text())
          if main['commit']['sha'] != os.environ['EXPECTED_MAIN']: raise SystemExit('main changed; fail closed')
          if v17.get('head_sha') != os.environ['V17_HEAD'] or v17.get('conclusion')!='success' or v17.get('run_attempt')!=1: raise SystemExit('V17 identity mismatch')
          if v18.get('conclusion')!='failure' or v18.get('run_attempt')!=1: raise SystemExit('V18 consumed-failure identity mismatch')
          repo=os.environ['GITHUB_REPOSITORY']; current=int(os.environ['GITHUB_RUN_ID']); blockers=[]
          needles=('reptran','recovery4','ordinal45','avps','level-b','level b','lowalt')
          for status in ('in_progress','queued'):
              p=subprocess.run(['gh','api',f'repos/{repo}/actions/runs?status={status}&per_page=100'],text=True,capture_output=True,check=True)
              for r in json.loads(p.stdout).get('workflow_runs',[]):
                  if int(r['id'])==current: continue
                  text=(str(r.get('name',''))+' '+str(r.get('head_branch',''))).lower()
                  if any(n in text for n in needles): blockers.append((status,r['id'],r.get('name'),r.get('head_branch')))
          if blockers: print('actual V1 contention detected:',blockers); sys.exit(43)
          PY

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: deep-twilight-phase-delta-dwarf-source-v19
          create-args: >-
            -c conda-forge
            python=3.12.4
            pyelftools
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Bind exact package and inventory available source/recipe bytes without cache assumptions
        shell: bash -el {0}
        run: |
          set -euo pipefail
          OUT=deep-twilight-phase-delta-dwarf-source-v19-output
          UVSPEC="$(command -v uvspec)"
          test "$(sha256sum "$UVSPEC" | awk '{print $1}')" = "$UVSPEC_SHA256"
          micromamba list --explicit > "$OUT/runtime-package-explicit.txt"
          micromamba list --json > "$OUT/runtime-package-list.json"
          sha256sum "$UVSPEC" > "$OUT/uvspec-sha256.txt"
          printf '%s\n' "$CONDA_PREFIX" > "$OUT/conda-prefix.txt"
          find "$CONDA_PREFIX" -type f \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.h' \) -printf '%P\n' | LC_ALL=C sort > "$OUT/installed-source-header-files.txt"
          : > "$OUT/extracted-package-dirs.txt"
          if test -d "$MAMBA_ROOT_PREFIX/pkgs"; then
            find "$MAMBA_ROOT_PREFIX/pkgs" -mindepth 1 -maxdepth 1 -type d -name 'rubin-libradtran-2.0.6-*' -print | LC_ALL=C sort > "$OUT/extracted-package-dirs.txt" || true
          fi
          python - <<'PY'
          from pathlib import Path
          import os,json,re,hashlib
          root=Path('deep-twilight-phase-delta-dwarf-source-v19-output')
          roots=[Path(os.environ['CONDA_PREFIX'])]
          for s in (root/'extracted-package-dirs.txt').read_text().splitlines():
              p=Path(s)
              if p.is_dir() and p not in roots: roots.append(p)
          pat=re.compile(r'(convert_caoth_mystic|sc_HG2_mu|delta_scale_hg|delta_scale|mu_scatter|dt_s|om_s|g1_s|g2_s|f_s|ds_s|Henyey|double.?HG|delta.?scal)',re.I)
          files=[]; contexts=[]; cfiles=[]
          for base in roots:
              for p in base.rglob('*'):
                  if not p.is_file(): continue
                  rel=f'{base.name}/{p.relative_to(base)}'
                  is_recipe='info/recipe/' in rel.replace('\\','/')
                  if not (p.suffix.lower() in {'.c','.cc','.cpp','.h'} or is_recipe): continue
                  try: data=p.read_bytes(); text=data.decode('utf-8')
                  except Exception: continue
                  rec={'path':rel,'sha256':hashlib.sha256(data).hexdigest(),'size':len(data)}; files.append(rec)
                  if p.suffix.lower() in {'.c','.cc','.cpp'}: cfiles.append(rec)
                  lines=text.splitlines()
                  for i,line in enumerate(lines):
                      if pat.search(line):
                          a=max(0,i-8); b=min(len(lines),i+9)
                          contexts.append(f'===== {rel}:{i+1} =====\n'+'\n'.join(f'{j+1:05d}: {lines[j]}' for j in range(a,b)))
          (root/'source-recipe-file-hashes.json').write_text(json.dumps(files,indent=2,sort_keys=True)+'\n')
          (root/'source-recipe-target-context.txt').write_text('\n\n'.join(contexts[:5000])+'\n')
          (root/'shipped-c-source-status.json').write_text(json.dumps({'cSourceFiles':cfiles,'cSourceCount':len(cfiles),'searchedRoots':[str(x) for x in roots]},indent=2,sort_keys=True)+'\n')
          PY

      - name: Recover exact DWARF semantics and source-line topology
        shell: bash -el {0}
        run: |
          set -euo pipefail
          OUT=deep-twilight-phase-delta-dwarf-source-v19-output
          UVSPEC="$(command -v uvspec)"
          python - <<'PY'
          from elftools.elf.elffile import ELFFile
          from pathlib import Path
          import json,os,re
          root=Path('deep-twilight-phase-delta-dwarf-source-v19-output')
          uv=Path(os.popen('command -v uvspec').read().strip())
          targets={'mystic','convert_caoth_mystic','sc_HG_mu','sc_HG2_mu','delta_scale_hg','delta_scale','get_phase_matrix_caoth','get_phase_matrix_total','mu_scatter','solve_rte'}
          member_pat=re.compile(r'(^(g1|g2|f|ff|ds|dscale|delta)$|asym|phase|forward)',re.I)
          def dec(v):
              if isinstance(v,bytes): return v.decode('utf-8','replace')
              if isinstance(v,(int,str,float,bool)) or v is None: return v
              return repr(v)
          def direct(die,key):
              a=die.attributes.get(key); return None if a is None else dec(a.value)
          def inherited(die,key):
              cur=die; seen=set()
              for _ in range(6):
                  a=cur.attributes.get(key)
                  if a is not None: return dec(a.value)
                  nxt=None
                  for rk in ('DW_AT_abstract_origin','DW_AT_specification'):
                      if rk in cur.attributes:
                          try: nxt=cur.get_DIE_from_attribute(rk); break
                          except Exception: pass
                  if nxt is None or nxt.offset in seen: break
                  seen.add(nxt.offset); cur=nxt
              return None
          def tname(die):
              try: t=die.get_DIE_from_attribute('DW_AT_type')
              except Exception: return None
              parts=[]; seen=set()
              for _ in range(10):
                  if t is None or t.offset in seen: break
                  seen.add(t.offset); n=inherited(t,'DW_AT_name')
                  if n: parts.append(n); break
                  if t.tag=='DW_TAG_pointer_type': parts.append('*')
                  try: t=t.get_DIE_from_attribute('DW_AT_type')
                  except Exception: break
              return ' '.join(reversed(parts)) if parts else None
          funcs=[]; structs=[]; src=set()
          with uv.open('rb') as fh:
              dwarf=ELFFile(fh).get_dwarf_info()
              for cu in dwarf.iter_CUs():
                  lp=dwarf.line_program_for_CU(cu); entries=[]; dirs=[]
                  if lp:
                      entries=list(lp['file_entry']); dirs=[dec(x) for x in lp['include_directory']]
                  def dpath(die):
                      idx=inherited(die,'DW_AT_decl_file')
                      if not isinstance(idx,int) or idx<1 or idx>len(entries): return None
                      fe=entries[idx-1]; name=dec(fe.name); di=getattr(fe,'dir_index',0)
                      if di and di<=len(dirs): return dirs[di-1].rstrip('/')+'/'+name
                      return name
                  for die in cu.iter_DIEs():
                      if die.tag=='DW_TAG_subprogram':
                          name=inherited(die,'DW_AT_name'); link=inherited(die,'DW_AT_linkage_name')
                          if name in targets or link in targets:
                              kids=[]
                              for ch in die.iter_children():
                                  if ch.tag in ('DW_TAG_formal_parameter','DW_TAG_variable'):
                                      kids.append({'tag':ch.tag,'name':inherited(ch,'DW_AT_name'),'type':tname(ch),'location':direct(ch,'DW_AT_location'),'declFile':dpath(ch),'declLine':inherited(ch,'DW_AT_decl_line')})
                              rec={'name':name,'linkageName':link,'declFile':dpath(die),'declLine':inherited(die,'DW_AT_decl_line'),'lowPc':direct(die,'DW_AT_low_pc'),'highPc':direct(die,'DW_AT_high_pc'),'children':kids}
                              funcs.append(rec)
                              if rec['declFile']: src.add(rec['declFile'])
                      elif die.tag=='DW_TAG_structure_type':
                          name=inherited(die,'DW_AT_name'); mem=[]
                          for ch in die.iter_children():
                              if ch.tag!='DW_TAG_member': continue
                              mn=inherited(ch,'DW_AT_name')
                              if mn and member_pat.search(mn): mem.append({'name':mn,'type':tname(ch),'offset':direct(ch,'DW_AT_data_member_location'),'declFile':dpath(ch),'declLine':inherited(ch,'DW_AT_decl_line')})
                          if mem:
                              rec={'name':name,'declFile':dpath(die),'declLine':inherited(die,'DW_AT_decl_line'),'members':mem}; structs.append(rec)
                              if rec['declFile']: src.add(rec['declFile'])
          (root/'dwarf-target-subprograms.json').write_text(json.dumps(funcs,indent=2,sort_keys=True)+'\n')
          (root/'dwarf-relevant-structures.json').write_text(json.dumps(structs,indent=2,sort_keys=True)+'\n')
          (root/'dwarf-target-source-files.txt').write_text('\n'.join(sorted(src))+'\n')
          PY
          : > "$OUT/addr2line-targets.txt"
          for addr in 0x7b220 0xb7885 0x169a10 0x16d3ee 0x143120 0x1476a0 0x16cea0 0x16e6c0; do
            printf '===== %s =====\n' "$addr" >> "$OUT/addr2line-targets.txt"
            addr2line -f -C -i -e "$UVSPEC" "$addr" >> "$OUT/addr2line-targets.txt" || true
          done
          if command -v gdb >/dev/null 2>&1; then
            {
              echo 'set pagination off'; echo 'set print pretty on'; echo "file $UVSPEC"
              for sym in mystic convert_caoth_mystic sc_HG2_mu delta_scale_hg delta_scale get_phase_matrix_caoth get_phase_matrix_total mu_scatter solve_rte; do
                echo "ptype $sym"; echo "info scope $sym"
              done
            } > "$OUT/gdb-static-commands.txt"
            gdb -q -nx -batch -x "$OUT/gdb-static-commands.txt" > "$OUT/gdb-static-types-scopes.txt" 2>&1 || true
          else
            echo NO_GDB > "$OUT/gdb-static-types-scopes.txt"
          fi

      - name: Compose exact evidence and fail-closed V19 disposition
        shell: bash -el {0}
        run: |
          set -euo pipefail
          OUT=deep-twilight-phase-delta-dwarf-source-v19-output
          python - <<'PY'
          from pathlib import Path
          import json,os,hashlib
          root=Path('deep-twilight-phase-delta-dwarf-source-v19-output')
          funcs=json.loads((root/'dwarf-target-subprograms.json').read_text()); structs=json.loads((root/'dwarf-relevant-structures.json').read_text()); source=json.loads((root/'shipped-c-source-status.json').read_text())
          def allfn(name): return [x for x in funcs if x.get('name')==name or x.get('linkageName')==name]
          def params(name):
              xs=allfn(name)
              for x in xs:
                  p=[c.get('name') for c in x['children'] if c['tag']=='DW_TAG_formal_parameter']
                  if p: return p
              return []
          hg=params('sc_HG2_mu'); my=params('mystic'); cv=params('convert_caoth_mystic'); mu=params('mu_scatter')
          relevant=[s for s in structs if any(m.get('name') in ('g1','g2','f','ff','ds','dscale','delta') for m in s['members'])]
          facts={
            'shippedExactCSourceCount':source['cSourceCount'],
            'dwarfScHG2FormalNames':hg,
            'dwarfMysticFormalNames':my,
            'dwarfConvertCaothMysticFormalNames':cv,
            'dwarfMuScatterFormalNames':mu,
            'relevantStructureCount':len(relevant),
            'exactScHG2G1G2FfDwarfMatch':hg[:3]==['g1','g2','ff'],
            'mysticEntryNamesIncludeFAndDs':('f_s' in my and 'ds_s' in my),
            'fEntrySemanticStatus':'FAIL_CLOSED_PENDING_EXACT_ENTRY_TO_INTERNAL_FF_DATAFLOW',
            'dsEntrySemanticStatus':'FAIL_CLOSED_PENDING_EXACT_ENTRY_TO_INTERNAL_DELTA_DATAFLOW',
            'rendererParityAuthorized':False
          }
          addr=(root/'addr2line-targets.txt').read_text(errors='replace'); gdb=(root/'gdb-static-types-scopes.txt').read_text(errors='replace'); ctx=(root/'source-recipe-target-context.txt').read_text(errors='replace')
          report={'facts':facts,'functions':funcs,'relevantStructures':relevant,'sourceInventory':source,'addr2line':addr,'gdbStatic':gdb,'sourceRecipeContexts':ctx}
          (root/'V19_READOUT.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          body=['DEEP_TWILIGHT::PHASE_DELTA_DWARF_SOURCE_V19_READOUT','',f'fence_main={os.environ["EXPECTED_MAIN"]}',f'branch={os.environ["GITHUB_REF_NAME"]}',f'head={os.environ["GITHUB_SHA"]}',f'run={os.environ["GITHUB_RUN_ID"]} attempt1',f'package={os.environ["EXACT_PACKAGE"]}',f'uvspec_sha256={os.environ["UVSPEC_SHA256"]}','STATIC_ONLY=true; uvspecExecuted=false; rngInitialized=false; seedConsumed=false; mysticBodyExecuted=false; photonTraced=false','protectedResultOpened=false; levelBChanged=false; Taylor/Jerusalem=false; epsilonSubstitution=false','','Mechanical disposition:','```json',json.dumps(facts,indent=2,sort_keys=True),'```','','Exact DWARF target subprograms:','```json',json.dumps(funcs,indent=2,sort_keys=True)[:32000],'```','','Exact DWARF relevant structure members:','```json',json.dumps(relevant,indent=2,sort_keys=True)[:28000],'```','','Exact target address-to-line map:','```text',addr[:12000],'```','','Source/recipe inventory status:','```json',json.dumps(source,indent=2,sort_keys=True)[:12000],'```','','CLAIM_BOUNDARY: V19 uses exact installed package bytes and exact pinned-binary DWARF/static metadata only. V18 is consumed and was not rerun. Names are provenance evidence, not standalone physics semantics. f_s/ds_s remain fail-closed until exact entry-to-internal dataflow is proved; no uniform-AOD shortcut and no Level-B change.']
          (root/'ISSUE_COMMENT.md').write_text('\n'.join(body)+'\n')
          manifest={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.iterdir()) if p.is_file()}
          (root/'evidence-sha256.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          PY

      - name: Upload immutable V19 evidence
        uses: actions/upload-artifact@v4
        with:
          name: deep-twilight-phase-delta-dwarf-source-v19
          path: deep-twilight-phase-delta-dwarf-source-v19-output/
          if-no-files-found: error
          retention-days: 90

      - name: Fresh control and contention guard before checkpoint
        shell: bash
        run: |
          set -euo pipefail
          OUT=deep-twilight-phase-delta-dwarf-source-v19-output
          gh api "repos/$GITHUB_REPOSITORY/issues/60" > "$OUT/issue60-precomment.json"
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$OUT/main-precomment.json"
          python - <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          root=Path('deep-twilight-phase-delta-dwarf-source-v19-output'); main=json.loads((root/'main-precomment.json').read_text())
          if main['commit']['sha'] != os.environ['EXPECTED_MAIN']: raise SystemExit('main changed; fail closed')
          repo=os.environ['GITHUB_REPOSITORY']; current=int(os.environ['GITHUB_RUN_ID']); blockers=[]; needles=('reptran','recovery4','ordinal45','avps','level-b','level b','lowalt')
          for status in ('in_progress','queued'):
              p=subprocess.run(['gh','api',f'repos/{repo}/actions/runs?status={status}&per_page=100'],text=True,capture_output=True,check=True)
              for r in json.loads(p.stdout).get('workflow_runs',[]):
                  if int(r['id'])==current: continue
                  text=(str(r.get('name',''))+' '+str(r.get('head_branch',''))).lower()
                  if any(n in text for n in needles): blockers.append((status,r['id'],r.get('name'),r.get('head_branch')))
          if blockers: print('actual V1 contention before checkpoint:',blockers); sys.exit(44)
          PY

      - name: Persist bounded V19 checkpoint to Issue 60
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 60 --repo "$GITHUB_REPOSITORY" --body-file deep-twilight-phase-delta-dwarf-source-v19-output/ISSUE_COMMENT.md
