name: Deep twilight phase/delta entry-to-scatter closure v24b

on:
  push:
    branches:
      - review/deep-twilight-phase-delta-entry-to-scatter-v24b
    paths:
      - .github/workflows/deep-twilight-phase-delta-entry-to-scatter-v24b.yml

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  exact-entry-to-scatter-v24b:
    if: github.run_attempt == 1 && github.event.before == 'fe6e063c568394ae7b4e90222de270d3f2460455'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN: fe6e063c568394ae7b4e90222de270d3f2460455
      EXPECTED_CONTROL_COMMENT: '5557823594'
      V23_RUN: '34019998318'
      V23_HEAD: baf1bf7b6551d178979b980c9ee07ef34466e68d
      V23_ARTIFACT: '9985161010'
      V23_DIGEST: sha256:aa5a344cf12b80dce234fa3aa07d021e2f737a39bf366c520b70d3a4c66b6ce5

    steps:
      - uses: actions/checkout@v4

      - name: Fresh fail-closed fence
        shell: bash
        run: |
          set -euo pipefail
          OUT=deep-twilight-phase-delta-entry-to-scatter-v24b-output
          mkdir -p "$OUT"
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$OUT/main.json"
          gh api "repos/$GITHUB_REPOSITORY/issues/60" > "$OUT/issue60.json"
          gh api "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=1&page=1053" > "$OUT/latest.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V23_RUN" > "$OUT/v23-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$V23_ARTIFACT" > "$OUT/v23-artifact.json"
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          p=Path('deep-twilight-phase-delta-entry-to-scatter-v24b-output')
          main=json.loads((p/'main.json').read_text())
          latest=json.loads((p/'latest.json').read_text())
          run=json.loads((p/'v23-run.json').read_text())
          art=json.loads((p/'v23-artifact.json').read_text())
          assert main['commit']['sha']==os.environ['EXPECTED_MAIN']
          assert latest and str(latest[-1]['id'])==os.environ['EXPECTED_CONTROL_COMMENT']
          assert run['head_sha']==os.environ['V23_HEAD'] and run['conclusion']=='success' and run['run_attempt']==1
          assert str(art['id'])==os.environ['V23_ARTIFACT'] and art['digest']==os.environ['V23_DIGEST'] and not art['expired']
          repo=os.environ['GITHUB_REPOSITORY']; me=int(os.environ['GITHUB_RUN_ID'])
          needles=('reptran','recovery4','ordinal45','avps','level-b','level b','lowalt')
          blockers=[]
          for status in ('in_progress','queued'):
              data=json.loads(subprocess.run(['gh','api',f'repos/{repo}/actions/runs?status={status}&per_page=100'],capture_output=True,text=True,check=True).stdout)
              for r in data['workflow_runs']:
                  if int(r['id'])==me: continue
                  t=(str(r.get('name',''))+' '+str(r.get('head_branch',''))).lower()
                  if any(n in t for n in needles): blockers.append({'id':r['id'],'status':status,'name':r.get('name')})
          (p/'v1-contention.json').write_text(json.dumps(blockers,indent=2)+'\n')
          if blockers: raise SystemExit('real V1 contention')
          PY

      - name: Download immutable V23 artifact
        shell: bash
        run: |
          set -euo pipefail
          OUT=deep-twilight-phase-delta-entry-to-scatter-v24b-output
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$V23_ARTIFACT/zip" > "$OUT/v23.zip"
          test "sha256:$(sha256sum "$OUT/v23.zip" | cut -d' ' -f1)" = "$V23_DIGEST"
          mkdir "$OUT/v23"
          unzip -q "$OUT/v23.zip" -d "$OUT/v23"

      - name: Exact binary semantic proof
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          p=Path('deep-twilight-phase-delta-entry-to-scatter-v24b-output')
          full=(p/'v23/v22/uvspec-objdump-full.txt').read_text(errors='replace')
          hdr=(p/'v23/v22/installed-header-target-context.txt').read_text(errors='replace')
          def win(addr,b=0,a=20):
              lines=full.splitlines(); key=addr+':'
              i=next(i for i,x in enumerate(lines) if x.strip().startswith(key))
              return '\n'.join(lines[max(0,i-b):i+a+1])+'\n'
          def need(text, *parts):
              for x in parts:
                  if x not in text: raise SystemExit('missing exact evidence: '+x)
          need(hdr,'float**                     dt_s,','float**                     om_s,','float**                     g1_s,','float**                     g2_s,','float**                     f_s,','float**                     ds_s,','double sc_HG2_mu (double g1, double g2, double ff);')
          c1=win('ab82d',0,5); c2=win('ae670',0,5)
          need(c1,'[rbx+0xc38]','[rbx+0xc30]','[rbx+0xc28]','<mystic>')
          need(c2,'[rbx+0xc38]','[rbx+0xc30]','[rbx+0xc28]','<mystic>')
          ms=win('18b8e5',0,31)
          need(ms,'18b923:','push   QWORD PTR [rsp+0x1f0]','18b92a:','mov    r9,QWORD PTR [rsp+0x1f0]','18b932:','mov    r8,QWORD PTR [rsp+0x1e8]','18b93a:','mov    rcx,QWORD PTR [rsp+0x1e0]','18b942:','mov    rdx,QWORD PTR [rsp+0x1d8]','18b94a:','mov    rsi,QWORD PTR [rsp+0x1c8]','18b959:','<setup_profiles1D.constprop.0>')
          pro=win('157cf0',0,34)
          need(pro,'mov    r12,rsi','mov    rbp,rdx','[rsp+0x100]','[rsp+0x88],rax','[rsp+0x60],rcx','[rsp+0x78],r8','[rsp+0x80],r9')
          ds=win('15819f',0,27)
          need(ds,'[rsp+0x88]','[rbp+rax*8+0x0]','[r12+rax*8]','mulss  xmm0,DWORD PTR [r13+rdx*1+0x0]','[r10+rax*8]','subsd  xmm1,xmm2','mulsd  xmm0,xmm1')
          cp=win('158ca9',0,70)
          need(cp,'[r15+0xd0]','[rsp+0x60]','[r15+0xd8]','[r15+0xe0]','[rsp+0x78]','[rsp+0x80]')
          g1=win('16ce20',0,8); ph=win('16d228',0,12)
          need(g1,'[rdi+0xd0]'); need(ph,'[rax+0xe0]','[rax+0xd8]')
          need(full,'addr32 call 169a10 <sc_HG2_mu>')
          summary={
            'mysticEntryAbi':{'dt_s':'arg4_rcx','om_s':'arg5_r8','g1_s':'arg6_r9','g2_s':'arg7_stack1','f_s':'arg8_stack2','ds_s':'arg9_stack3'},
            'setupProfilesMapping':{'dt_s':'rsi->r12','om_s':'rdx->rbp','g1_s':'rcx->slot60','g2_s':'r8->slot78','f_s':'r9->slot80','ds_s':'stack1->slot88'},
            'deltaSemanticStatus':'PASS_EXACT_BINARY',
            'deltaScatteringFormula':'dt_s*om_s*(1-ds_s)',
            'derivedTransportFormula':'tau_eff=dt_s*(1-om_s*ds_s); ssa_eff=om_s*(1-ds_s)/(1-om_s*ds_s) when denominator!=0',
            'phaseStorageStatus':'PASS_EXACT_BINARY_STORAGE',
            'phaseStorage':{'g1_s':'profile+0xd0','g2_s':'profile+0xd8','f_s':'profile+0xe0'},
            'hg2Prototype':'sc_HG2_mu(g1,g2,ff)',
            'frozenStateHG2BranchSelectionProved':False,
            'falseMysticSetLiteralRspInferenceRejected':True,
            'exactZeroPolicy':'raw IEEE-754 signed zeros preserved; no epsilon',
            'rendererParityAuthorized':False,'korkinGateAuthorized':False,'levelBChanged':False
          }
          evidence='\n---CALL1---\n'+c1+'\n---CALL2---\n'+c2+'\n---MYSTIC_SETUP---\n'+ms+'\n---SETUP_PROLOGUE---\n'+pro+'\n---DS---\n'+ds+'\n---PHASE_COPY---\n'+cp+'\n---G1---\n'+g1+'\n---PHASE---\n'+ph
          (p/'entry-to-scatter-summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          (p/'exact-selected-disassembly.txt').write_text(evidence)
          (p/'exact-selected-disassembly-sha256.txt').write_text(hashlib.sha256(evidence.encode()).hexdigest()+'\n')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: deep-twilight-phase-delta-entry-to-scatter-v24b
          path: deep-twilight-phase-delta-entry-to-scatter-v24b-output
          if-no-files-found: error

      - name: Fresh terminal fence and material checkpoint
        shell: bash
        run: |
          set -euo pipefail
          OUT=deep-twilight-phase-delta-entry-to-scatter-v24b-output
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" = "$EXPECTED_MAIN"
          test "$(gh api "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=1&page=1053" --jq '.[-1].id')" = "$EXPECTED_CONTROL_COMMENT"
          python - <<'PY'
          import json, os, subprocess
          repo=os.environ['GITHUB_REPOSITORY']; me=int(os.environ['GITHUB_RUN_ID']); needles=('reptran','recovery4','ordinal45','avps','level-b','level b','lowalt')
          for status in ('in_progress','queued'):
              d=json.loads(subprocess.run(['gh','api',f'repos/{repo}/actions/runs?status={status}&per_page=100'],capture_output=True,text=True,check=True).stdout)
              for r in d['workflow_runs']:
                  if int(r['id'])==me: continue
                  t=(str(r.get('name',''))+' '+str(r.get('head_branch',''))).lower()
                  if any(n in t for n in needles): raise SystemExit('V1 contention appeared')
          PY
          SUMMARY="$(cat "$OUT/entry-to-scatter-summary.json")"
          EVSHA="$(cat "$OUT/exact-selected-disassembly-sha256.txt")"
          BODY=$(cat <<EOF
          DEEP_TWILIGHT::PHASE_DELTA_ENTRY_TO_SCATTER_V24B_READOUT

          fence_main=$EXPECTED_MAIN
          branch=$GITHUB_REF_NAME
          head=$GITHUB_SHA
          run=$GITHUB_RUN_ID attempt1
          predecessor_v23_run=$V23_RUN head=$V23_HEAD artifact=$V23_ARTIFACT digest=$V23_DIGEST
          STATIC_ONLY=true; uvspecExecuted=false; rngInitialized=false; seedConsumed=false; mysticBodyExecuted=false; photonTraced=false
          protectedResultOpened=false; levelBChanged=false; Taylor/Jerusalem=false; epsilonSubstitution=false
          exact_selected_disassembly_sha256=$EVSHA

          Exact mechanical closure:
          \`\`\`json
          $SUMMARY
          \`\`\`

          Material conclusion: exact pinned-binary arithmetic closes ds_s semantics as the delta-removal fraction in non-delta scattering optical depth: dt_s*om_s*(1-ds_s). The deterministic transport translation is tau_eff=dt_s*(1-om_s*ds_s), with ssa_eff=om_s*(1-ds_s)/(1-om_s*ds_s) when the denominator is nonzero. Exact signed zeros remain exact; no epsilon substitution.

          g1_s/g2_s/f_s are now mechanically bound into internal profile slots d0/d8/e0 and downstream fallback reads are proved. The installed HG2 sampler signature is sc_HG2_mu(g1,g2,ff), but V24B deliberately leaves frozen-state HG2 branch selection unproved; renderer parity and the Korkin gate therefore remain fail-closed. The earlier literal-rsp inference near mystic_set is explicitly rejected.
          EOF
          )
          gh api "repos/$GITHUB_REPOSITORY/issues/60/comments" -f body="$BODY"
