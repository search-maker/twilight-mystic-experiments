name: Deep twilight phase/delta pre-RNG watch v22

on:
  push:
    branches:
      - review/deep-twilight-phase-delta-prerng-watch-v22
    paths:
      - ".github/workflows/deep-twilight-phase-delta-prerng-watch-v22.yml"

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  prerng-watch-v22:
    if: >-
      github.run_attempt == 1 &&
      github.event.before == 'fe6e063c568394ae7b4e90222de270d3f2460455'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN: fe6e063c568394ae7b4e90222de270d3f2460455
      FRESH_SETUP_SEED: '1648293751'
      UVSPEC_SHA256: '2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3'
      BASELINE_RUN: '34012593281'
      BASELINE_ARTIFACT_ID: '9982923548'
      BASELINE_ARTIFACT_DIGEST: 'sha256:bbad4ef455636f55510176b9d0df2f509fabdd78675a9504d45354375e01ceaf'
      BASELINE_CAPTURE_SHA256: 'f005ed18491a0c9b7827857c0bb2fc775c5e77eb2a69f02121f56814a628bec6'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Freeze contract, fresh seed, and live control fence
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/review/deep-twilight-phase-delta-prerng-watch-v22"
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "${{ github.event.before }}" = "$EXPECTED_MAIN"
          OUT=deep-twilight-phase-delta-prerng-watch-v22-output
          mkdir -p "$OUT"
          cat > "$OUT/PROTOCOL.txt" <<'EOF'
          DEEP TWILIGHT PHASE/DELTA PRE-RNG READ-WATCH PROBE V22
          Exact pinned runtime; result-blind; non-authorizing.
          Follow exact MYSTIC-entry aerosol-row f_s[0] and ds_s[0] words into the deterministic
          MYSTIC prefix. Hardware read-watchpoints must record their first actual consumers before
          the first post-entry uvspec_random instruction executes. Fresh setup seed 1648293751 is
          consumed/non-reusable once RNG state is initialized. PASS proves dataflow only; it does
          not assign renderer semantics, authorize parity/science, change Level-B 2.0-10.5 deg,
          revive uniform AOD scaling, open protected results, tune Taylor/Jerusalem, or use epsilon.
          NEVER rerun/retry/resume this attempt.
          EOF
          cat > "$OUT/guard.py" <<'PY'
          import json,os,re,subprocess,sys
          repo=os.environ['GITHUB_REPOSITORY']; expected=os.environ['EXPECTED_MAIN']; selfid=int(os.environ['GITHUB_RUN_ID'])
          main=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/branches/main'],text=True))
          if main['commit']['sha']!=expected: raise SystemExit('main changed; fail closed')
          pages=json.loads(subprocess.check_output(['gh','api','--paginate','--slurp',f'repos/{repo}/issues/60/comments?per_page=100'],text=True))
          comments=[c for p in pages for c in p]
          def ended(body):
              body=str(body or '').strip()
              if not body.startswith('WRITE_QUIET_END'): return None
              h=body.splitlines()[0]; ids=set()
              for k in ('begin','beginComment','begin_comment'):
                  ids.update(int(x) for x in re.findall(rf'\b{re.escape(k)}=(\d+)\b',h))
              if len(ids)>1: raise SystemExit('conflicting WRITE_QUIET_END ids')
              return next(iter(ids),None)
          opens={}
          for c in comments:
              cid=int(c.get('id') or 0); b=str(c.get('body') or '').strip()
              if b.startswith('WRITE_QUIET_BEGIN'): opens[cid]=b
              elif b.startswith('WRITE_QUIET_END'):
                  x=ended(b)
                  if x is not None: opens.pop(x,None)
          if opens: raise SystemExit(f'unmatched WRITE_QUIET: {sorted(opens)}')
          needles=('reptran','recovery4','ordinal45','avps','level-b','level b','lowalt'); blockers=[]
          for st in ('in_progress','queued'):
              runs=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs?status={st}&per_page=100'],text=True)).get('workflow_runs',[])
              for r in runs:
                  if int(r['id'])==selfid: continue
                  name=(str(r.get('name',''))+' '+str(r.get('head_branch',''))).lower()
                  if any(n in name for n in needles): blockers.append((st,r['id'],r.get('name'),r.get('head_branch')))
          if blockers: raise SystemExit(f'actual V1 contention: {blockers}')
          print(json.dumps({'main':expected,'issue60Comments':len(comments),'openWriteQuiet':[],'v1Blockers':[]}))
          PY
          python "$OUT/guard.py" | tee "$OUT/preflight-guard.json"
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          mapfile -t seed_commits < <(git log --all -S"$FRESH_SETUP_SEED" --format='%H' | sort -u)
          for c in "${seed_commits[@]:-}"; do
            [ -z "$c" ] && continue
            test "$c" = "$GITHUB_SHA" || { echo "seed already in repository history: $c"; exit 41; }
          done
          if gh api --paginate "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" --jq '.[].body' | grep -Fq "$FRESH_SETUP_SEED"; then
            echo 'seed already in Issue #60'; exit 42
          fi

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: deep-twilight-phase-delta-prerng-watch-v22
          create-args: >-
            -c conda-forge
            python=3.12.4
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Bind exact runtime and immutable baseline
        shell: bash -el {0}
        run: |
          set -euo pipefail
          OUT=deep-twilight-phase-delta-prerng-watch-v22-output
          UVSPEC="$(command -v uvspec)"
          test "$(sha256sum "$UVSPEC" | awk '{print $1}')" = "$UVSPEC_SHA256"
          micromamba list --explicit > "$OUT/runtime-package-explicit.txt"
          nm -an "$UVSPEC" > "$OUT/uvspec-nm.txt"
          test "$(awk '$3==\"mystic\" {print $1}' "$OUT/uvspec-nm.txt" | sort -u | wc -l)" -eq 1
          test "$(awk '$3==\"uvspec_random\" {print $1}' "$OUT/uvspec-nm.txt" | sort -u | wc -l)" -eq 1
          meta="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BASELINE_RUN/artifacts" --jq ".artifacts[] | select(.id==$BASELINE_ARTIFACT_ID) | [.name,.digest] | @tsv")"
          test "$meta" = $'deep-twilight-mystic-entry-optprop-capture-v2\t'"$BASELINE_ARTIFACT_DIGEST"
          mkdir -p baseline
          gh run download "$BASELINE_RUN" --repo "$GITHUB_REPOSITORY" --name deep-twilight-mystic-entry-optprop-capture-v2 --dir baseline
          BASE_RAW="$(find baseline -type f -name mystic-entry-raw-v2.json -print -quit)"
          test -n "$BASE_RAW"
          test "$(sha256sum "$BASE_RAW" | awk '{print $1}')" = "$BASELINE_CAPTURE_SHA256"
          python - "$BASE_RAW" <<'PY'
          import json,sys
          c=json.load(open(sys.argv[1])); assert c['nlyr']==49 and c['nCaoth']==2
          f=c['tables']['f_s']['rows'][1]['uint32Words']; ds=c['tables']['ds_s']['rows'][1]['uint32Words']
          assert set(f)=={'0x3f800000'} and len(f)==49
          assert set(ds)=={'0x00000000'} and len(ds)==49
          PY
          cp "$BASE_RAW" "$OUT/baseline-mystic-entry-raw-v2.json"

      - name: Build isolated debugger harness
        shell: bash -el {0}
        run: |
          set -euo pipefail
          OUT=deep-twilight-phase-delta-prerng-watch-v22-output
          GDB_PREFIX="$RUNNER_TEMP/deep-twilight-gdb-v22"
          micromamba create -y -p "$GDB_PREFIX" -c conda-forge python=3.12.4 gdb=17.2
          "$GDB_PREFIX/bin/gdb" --version > "$OUT/gdb-version.txt"
          printf '%s\n' "$GDB_PREFIX" > "$OUT/gdb-prefix.txt"
          cat > "$OUT/watch_v22.py" <<'PY'
          import gdb,json,struct
          from pathlib import Path
          S={'events':{},'randomReached':False,'entry':{},'status':'ARMED'}; OUT=None
          def reg(n): return int(gdb.parse_and_eval('$'+n))
          def read(a,n): return bytes(gdb.selected_inferior().read_memory(a,n))
          def u64(a): return struct.unpack('<Q',read(a,8))[0]
          def u32(a): return struct.unpack('<I',read(a,4))[0]
          def dump():
              if OUT: Path(OUT).write_text(json.dumps(S,indent=2,sort_keys=True)+'\n')
          class RW(gdb.Breakpoint):
              def __init__(self,label,addr):
                  self.label=label; self.addr=addr
                  super().__init__(f'*(unsigned int*)0x{addr:x}',type=gdb.BP_WATCHPOINT,wp_class=gdb.WP_READ,internal=False)
              def stop(self):
                  if self.label not in S['events']:
                      S['events'][self.label]={'pcHex':f"0x{reg('pc'):x}",'function':gdb.selected_frame().name(),'instruction':gdb.execute('x/i $pc',to_string=True).strip(),'backtrace':gdb.execute('bt 10',to_string=True)}
                      self.enabled=False; dump()
                  return False
          class RS(gdb.Breakpoint):
              def __init__(self): super().__init__('uvspec_random',type=gdb.BP_BREAKPOINT,internal=False)
              def stop(self):
                  S['randomReached']=True; S['randomPcHex']=f"0x{reg('pc'):x}"; S['status']='STOPPED_AT_FIRST_POST_ENTRY_UVSPEC_RANDOM'; dump(); return True
          def install(path):
              global OUT; OUT=path
              pc=reg('pc'); sym=int(gdb.parse_and_eval('(unsigned long)&mystic')); rsp=reg('rsp')
              if pc!=sym: raise gdb.GdbError('not exact mystic entry')
              nlyr=struct.unpack('<i',read(reg('rdi'),4))[0]; ncaoth=reg('rdx') & 0xffffffff
              if (nlyr,ncaoth)!=(49,2): raise gdb.GdbError(f'unexpected dimensions {(nlyr,ncaoth)}')
              ftab=u64(rsp+0x10); dstab=u64(rsp+0x18); fa=u64(ftab+8); da=u64(dstab+8)
              if u32(fa)!=0x3f800000 or u32(da)!=0: raise gdb.GdbError('entry raw-word mismatch')
              S['entry']={'nlyr':nlyr,'nCaoth':ncaoth,'fAddressHex':f'0x{fa:x}','dsAddressHex':f'0x{da:x}','fWord':'0x3f800000','dsWord':'0x00000000'}
              RW('f_s_row1_word0',fa); RW('ds_s_row1_word0',da); RS(); S['status']='WATCHPOINTS_INSTALLED'; dump()
          def finish():
              S['bothObservedBeforeRandom']=S['randomReached'] and all(k in S['events'] for k in ('f_s_row1_word0','ds_s_row1_word0'))
              S['status']='PASS_DATAFLOW_OBSERVED' if S['bothObservedBeforeRandom'] else 'FAIL_CLOSED_NOT_BOTH_OBSERVED_PRE_RNG'; dump()
          PY
          python -m py_compile "$OUT/watch_v22.py"

      - name: Fresh fence immediately before target runtime
        shell: bash
        run: |
          set -euo pipefail
          OUT=deep-twilight-phase-delta-prerng-watch-v22-output
          python "$OUT/guard.py" | tee "$OUT/preprobe-guard.json"

      - name: Execute deterministic MYSTIC prefix and stop before first post-entry RNG call
        shell: bash -el {0}
        run: |
          set -uo pipefail
          OUT=deep-twilight-phase-delta-prerng-watch-v22-output
          DATA_DIR="$CONDA_PREFIX/share/libRadtran/data"; GDB_PREFIX="$(cat "$OUT/gdb-prefix.txt")"
          cat > "$OUT/probe.inp" <<EOF
          data_files_path $DATA_DIR
          atmosphere_file $DATA_DIR/atmmod/afglus.dat
          source solar $DATA_DIR/solar_flux/atlas_plus_modtran
          mol_abs_param crs
          wavelength 550.0 550.0
          sza 80.000000
          phi0 0.000000
          albedo 0.150000
          aerosol_default
          aerosol_set_tau_at_wvl 550 0.150000
          rte_solver mystic
          mc_spherical 1D
          mc_photons 1
          mc_vroom off
          mc_std
          mc_randomseed $FRESH_SETUP_SEED
          mc_basename mc
          mc_spectral_is 550.0
          zout 0.000000
          umu -0.50000000
          phi 36.000000
          quiet
          EOF
          cat > "$OUT/probe.gdb" <<EOF
          set pagination off
          set confirm off
          set print thread-events off
          set debuginfod enabled off
          set breakpoint pending off
          set disable-randomization off
          break *mystic
          run < $GITHUB_WORKSPACE/$OUT/probe.inp
          python
          import sys
          sys.path.insert(0,'$GITHUB_WORKSPACE/$OUT')
          import watch_v22 as w
          w.install('$GITHUB_WORKSPACE/$OUT/watch-result-v22.json')
          end
          continue
          python w.finish()
          quit
          EOF
          set +e
          "$GDB_PREFIX/bin/gdb" -q -batch -x "$OUT/probe.gdb" --args "$(command -v uvspec)" > "$OUT/gdb-stdout.txt" 2> "$OUT/gdb-stderr.txt"
          printf '%s\n' "$?" > "$OUT/gdb-exit-code.txt"
          set -e
          if [ -f randomseed ]; then cp randomseed "$OUT/randomseed-consumed-evidence.txt"; fi

      - name: Classify immutable V22 outcome
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT=deep-twilight-phase-delta-prerng-watch-v22-output
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          r=Path('deep-twilight-phase-delta-prerng-watch-v22-output'); p=r/'watch-result-v22.json'
          w=json.loads(p.read_text()) if p.exists() else {}
          seed=(r/'randomseed-consumed-evidence.txt').read_text().splitlines()[0].strip() if (r/'randomseed-consumed-evidence.txt').exists() else None
          passed=w.get('status')=='PASS_DATAFLOW_OBSERVED' and seed==os.environ['FRESH_SETUP_SEED']
          d={'schemaVersion':22,'status':'PASS_EXACT_ENTRY_TO_PRERNG_DATAFLOW_OBSERVED' if passed else 'FAIL_CLOSED_PRERNG_DATAFLOW_INCOMPLETE','freshSetupSeed':int(os.environ['FRESH_SETUP_SEED']),'freshSetupSeedConsumed':seed==os.environ['FRESH_SETUP_SEED'],'freshSetupSeedReusable':False,'firstPostEntryUvspecRandomStoppedBeforeExecution':w.get('randomReached') is True,'bothEntryWordsObservedBeforeRandom':w.get('bothObservedBeforeRandom') is True,'mysticBodyDeterministicPrefixExecuted':bool(w),'radianceResultProduced':False,'protectedResultOpened':False,'levelBChanged':False,'taylorOrJerusalemUsed':False,'epsilonSubstitutionUsed':False,'uniformAodScalingAuthorized':False,'rendererParityAuthorized':False,'watchResultSha256':hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None,'claimBoundary':'exact frozen-state entry-to-pre-RNG read dataflow only; consumer semantics require exact context review before renderer translation parity'}
          (r/'decision-v22.json').write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          print(json.dumps(d,sort_keys=True))
          PY

      - name: Upload immutable V22 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-twilight-phase-delta-prerng-watch-v22
          path: deep-twilight-phase-delta-prerng-watch-v22-output/
          if-no-files-found: error
          retention-days: 90

      - name: Enforce completed guarded probe
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('deep-twilight-phase-delta-prerng-watch-v22-output/decision-v22.json'))
          if not d['freshSetupSeedConsumed']: raise SystemExit('seed-consumption evidence missing')
          if not d['firstPostEntryUvspecRandomStoppedBeforeExecution']: raise SystemExit('guarded random breakpoint not reached')
          PY
