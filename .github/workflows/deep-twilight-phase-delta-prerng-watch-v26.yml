name: Deep twilight phase/delta pre-RNG watch v26

on:
  push:
    branches:
      - review/deep-twilight-phase-delta-prerng-watch-v26
    paths:
      - ".github/workflows/deep-twilight-phase-delta-prerng-watch-v26.yml"

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  prerng-watch-v26:
    if: >-
      github.run_attempt == 1 &&
      github.event.before == 'fe6e063c568394ae7b4e90222de270d3f2460455'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN: fe6e063c568394ae7b4e90222de270d3f2460455
      FRESH_SETUP_SEED: '1706934872'
      UVSPEC_SHA256: '2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3'
      BASELINE_RUN: '34012593281'
      BASELINE_ARTIFACT_ID: '9982923548'
      BASELINE_ARTIFACT_DIGEST: 'sha256:bbad4ef455636f55510176b9d0df2f509fabdd78675a9504d45354375e01ceaf'
      BASELINE_CAPTURE_SHA256: 'f005ed18491a0c9b7827857c0bb2fc775c5e77eb2a69f02121f56814a628bec6'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Freeze contract, fresh seed, and live control fence
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/review/deep-twilight-phase-delta-prerng-watch-v26"
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "${{ github.event.before }}" = "$EXPECTED_MAIN"
          OUT=deep-twilight-phase-delta-prerng-watch-v26-output
          mkdir -p "$OUT"
          cat > "$OUT/PROTOCOL.txt" <<'PROTO'
          DEEP TWILIGHT PHASE/DELTA PRE-RNG READ-WATCH PROBE V26
          Exact pinned runtime; result-blind; non-authorizing.
          Narrow successor after consumed V24/V25 transport-only failures. Both predecessors failed
          before debugger execution while attempting cross-workflow artifact retrieval. V26 removes
          that non-scientific transport dependency. At exact MYSTIC entry it proves equivalence of
          the entire 49-word aerosol-row f_s and ds_s payloads to the frozen V2 baseline using raw-byte
          SHA-256 digests, then follows representative row1 words with hardware read-watchpoints.
          V22/V24/V25 are never rerun/retried/resumed.
          Follow representative exact MYSTIC-entry aerosol-component row1 f_s and ds_s uint32 words
          into the deterministic MYSTIC prefix. Hardware read-watchpoints must record their first
          actual consumers before the first post-entry uvspec_random instruction executes. Fresh
          setup seed 1706934872 is consumed/non-reusable once RNG state is initialized. PASS proves
          exact read dataflow only; it does not by itself assign renderer physics semantics, authorize
          translation parity or deep science, change validated Level-B 2.0-10.5 deg, revive uniform
          AOD scaling, open protected results, tune Taylor/Jerusalem, or substitute epsilon for zero.
          NEVER rerun/retry/resume this attempt.
          PROTO
          cat > "$OUT/guard.py" <<'PY'
          import json,os,re,subprocess
          repo=os.environ['GITHUB_REPOSITORY']; expected=os.environ['EXPECTED_MAIN']; selfid=int(os.environ['GITHUB_RUN_ID'])
          main=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/branches/main'],text=True))
          if main['commit']['sha']!=expected: raise SystemExit('main changed; fail closed')
          pages=json.loads(subprocess.check_output(['gh','api','--paginate','--slurp',f'repos/{repo}/issues/60/comments?per_page=100'],text=True))
          comments=[c for page in pages for c in page]
          def ended(body):
              body=str(body or '').strip()
              if not body.startswith('WRITE_QUIET_END'): return None
              h=body.splitlines()[0]; ids=set()
              for k in ('begin','beginComment','begin_comment'):
                  ids.update(int(x) for x in re.findall(rf'\b{re.escape(k)}=(\d+)\b',h))
              if len(ids)>1: raise SystemExit('conflicting WRITE_QUIET_END ids')
              return next(iter(ids),None)
          opens={}
          for c in comments:
              cid=int(c.get('id') or 0); b=str(c.get('body') or '').strip()
              if b.startswith('WRITE_QUIET_BEGIN'): opens[cid]=b
              elif b.startswith('WRITE_QUIET_END'):
                  x=ended(b)
                  if x is not None: opens.pop(x,None)
          if opens: raise SystemExit(f'unmatched WRITE_QUIET: {sorted(opens)}')
          needles=('reptran','recovery4','ordinal45','avps','level-b','level b','lowalt')
          blockers=[]
          for st in ('in_progress','queued'):
              runs=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs?status={st}&per_page=100'],text=True)).get('workflow_runs',[])
              for r in runs:
                  if int(r['id'])==selfid: continue
                  name=(str(r.get('name',''))+' '+str(r.get('head_branch',''))).lower()
                  if any(n in name for n in needles): blockers.append((st,r['id'],r.get('name'),r.get('head_branch')))
          if blockers: raise SystemExit(f'actual V1 contention: {blockers}')
          latest=comments[-1]['id'] if comments else None
          print(json.dumps({'main':expected,'issue60Comments':len(comments),'latestCommentId':latest,'openWriteQuiet':[],'v1Blockers':[]}))
          PY
          python "$OUT/guard.py" | tee "$OUT/preflight-guard.json"
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          mapfile -t seed_commits < <(git log --all -S"$FRESH_SETUP_SEED" --format='%H' | sort -u)
          for c in "${seed_commits[@]:-}"; do
            [ -z "$c" ] && continue
            test "$c" = "$GITHUB_SHA" || { echo "seed already in repository history: $c"; exit 41; }
          done
          if gh api --paginate "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" --jq '.[].body' | grep -Fq "$FRESH_SETUP_SEED"; then
            echo 'seed already in Issue #60'; exit 42
          fi

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: deep-twilight-phase-delta-prerng-watch-v26
          create-args: >-
            -c conda-forge
            python=3.12.4
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Bind exact runtime and freeze immutable baseline provenance
        shell: bash -el {0}
        run: |
          set -euo pipefail
          OUT=deep-twilight-phase-delta-prerng-watch-v26-output
          UVSPEC="$(command -v uvspec)"
          test "$(sha256sum "$UVSPEC" | awk '{print $1}')" = "$UVSPEC_SHA256"
          micromamba list --explicit > "$OUT/runtime-package-explicit.txt"
          nm -an "$UVSPEC" > "$OUT/uvspec-nm.txt"
          test "$(awk '$3==\"mystic\" {print $1}' "$OUT/uvspec-nm.txt" | sort -u | wc -l)" -eq 1
          test "$(awk '$3==\"uvspec_random\" {print $1}' "$OUT/uvspec-nm.txt" | sort -u | wc -l)" -eq 1
          cat > "$OUT/baseline-provenance.json" <<'JSON'
          {
            "baselineRun": 34012593281,
            "baselineArtifactId": 9982923548,
            "baselineArtifactDigest": "sha256:bbad4ef455636f55510176b9d0df2f509fabdd78675a9504d45354375e01ceaf",
            "baselineCaptureSha256": "f005ed18491a0c9b7827857c0bb2fc775c5e77eb2a69f02121f56814a628bec6",
            "fRow1PackedUint32LeSha256": "3d005be8a47ccd804feedf9feeadc6d6375f10a65bc986ebce0fb38612fa635f",
            "dsRow1PackedUint32LeSha256": "d904e1f1e028ba9058a128a6fd724f0f9892ae8fe49c8f7dc2613183f7f8bbca",
            "claim": "exact f_s/ds_s row1 equivalence only; full V2 capture remains separate frozen provenance"
          }
          JSON

      - name: Build isolated debugger harness
        shell: bash -el {0}
        run: |
          set -euo pipefail
          OUT=deep-twilight-phase-delta-prerng-watch-v26-output
          GDB_PREFIX="$RUNNER_TEMP/deep-twilight-gdb-v26"
          micromamba create -y -p "$GDB_PREFIX" -c conda-forge python=3.12.4 gdb=17.2
          "$GDB_PREFIX/bin/gdb" --version > "$OUT/gdb-version.txt"
          printf '%s\n' "$GDB_PREFIX" > "$OUT/gdb-prefix.txt"
          cat > "$OUT/watch_v26.py" <<'PY'
          import gdb,hashlib,json,struct
          from pathlib import Path
          S={'events':{},'randomReached':False,'entry':{},'status':'ARMED'}; OUT=None
          def reg(n): return int(gdb.parse_and_eval('$'+n))
          def read(a,n): return bytes(gdb.selected_inferior().read_memory(a,n))
          def u64(a): return struct.unpack('<Q',read(a,8))[0]
          def u32(a): return struct.unpack('<I',read(a,4))[0]
          def dump():
              if OUT: Path(OUT).write_text(json.dumps(S,indent=2,sort_keys=True)+'\n')
          class RW(gdb.Breakpoint):
              def __init__(self,label,addr):
                  self.label=label; self.addr=addr
                  super().__init__(f'*(unsigned int*)0x{addr:x}',type=gdb.BP_WATCHPOINT,wp_class=gdb.WP_READ,internal=False)
              def stop(self):
                  if self.label not in S['events']:
                      S['events'][self.label]={
                          'pcHex':f"0x{reg('pc'):x}",
                          'function':gdb.selected_frame().name(),
                          'instruction':gdb.execute('x/i $pc',to_string=True).strip(),
                          'backtrace':gdb.execute('bt 12',to_string=True)
                      }
                      self.enabled=False; dump()
                  return False
          class RS(gdb.Breakpoint):
              def __init__(self): super().__init__('uvspec_random',type=gdb.BP_BREAKPOINT,internal=False)
              def stop(self):
                  S['randomReached']=True
                  S['randomPcHex']=f"0x{reg('pc'):x}"
                  S['randomFunction']=gdb.selected_frame().name()
                  S['status']='STOPPED_AT_FIRST_POST_ENTRY_UVSPEC_RANDOM'
                  dump(); return True
          def install(path):
              global OUT; OUT=path
              pc=reg('pc'); sym=int(gdb.parse_and_eval('(unsigned long)&mystic')); rsp=reg('rsp')
              if pc!=sym: raise gdb.GdbError('not exact mystic entry')
              nlyr=struct.unpack('<i',read(reg('rdi'),4))[0]; ncaoth=reg('rdx') & 0xffffffff
              if (nlyr,ncaoth)!=(49,2): raise gdb.GdbError(f'unexpected dimensions {(nlyr,ncaoth)}')
              ftab=u64(rsp+0x10); dstab=u64(rsp+0x18)
              fa=u64(ftab+8); da=u64(dstab+8)
              fbytes=read(fa,49*4); dbytes=read(da,49*4)
              fsha=hashlib.sha256(fbytes).hexdigest(); dsha=hashlib.sha256(dbytes).hexdigest()
              if fsha!='3d005be8a47ccd804feedf9feeadc6d6375f10a65bc986ebce0fb38612fa635f': raise gdb.GdbError('f_s row1 baseline digest mismatch')
              if dsha!='d904e1f1e028ba9058a128a6fd724f0f9892ae8fe49c8f7dc2613183f7f8bbca': raise gdb.GdbError('ds_s row1 baseline digest mismatch')
              if u32(fa)!=0x3f800000 or u32(da)!=0: raise gdb.GdbError('entry raw-word mismatch')
              S['entry']={'nlyr':nlyr,'nCaoth':ncaoth,'fRowIndex':1,'dsRowIndex':1,'fAddressHex':f'0x{fa:x}','dsAddressHex':f'0x{da:x}','fWord':'0x3f800000','dsWord':'0x00000000','fRowSha256':fsha,'dsRowSha256':dsha,'fullRowBaselineEquivalent':True}
              RW('f_s_row1_word0',fa); RW('ds_s_row1_word0',da); RS()
              S['status']='WATCHPOINTS_INSTALLED'; dump()
          def finish():
              S['bothObservedBeforeRandom']=S['randomReached'] and all(k in S['events'] for k in ('f_s_row1_word0','ds_s_row1_word0'))
              S['status']='PASS_DATAFLOW_OBSERVED' if S['bothObservedBeforeRandom'] else 'FAIL_CLOSED_NOT_BOTH_OBSERVED_PRE_RNG'
              dump()
          PY
          python -m py_compile "$OUT/watch_v26.py"

      - name: Fresh fence immediately before target runtime
        shell: bash
        run: |
          set -euo pipefail
          OUT=deep-twilight-phase-delta-prerng-watch-v26-output
          python "$OUT/guard.py" | tee "$OUT/preprobe-guard.json"

      - name: Execute deterministic MYSTIC prefix and stop before first post-entry RNG call
        shell: bash -el {0}
        run: |
          set -uo pipefail
          OUT=deep-twilight-phase-delta-prerng-watch-v26-output
          DATA_DIR="$CONDA_PREFIX/share/libRadtran/data"
          GDB_PREFIX="$(cat "$OUT/gdb-prefix.txt")"
          cat > "$OUT/probe.inp" <<EOF
          data_files_path $DATA_DIR
          atmosphere_file $DATA_DIR/atmmod/afglus.dat
          source solar $DATA_DIR/solar_flux/atlas_plus_modtran
          mol_abs_param crs
          wavelength 550.0 550.0
          sza 80.000000
          phi0 0.000000
          albedo 0.150000
          aerosol_default
          aerosol_set_tau_at_wvl 550 0.150000
          rte_solver mystic
          mc_spherical 1D
          mc_photons 1
          mc_vroom off
          mc_std
          mc_randomseed $FRESH_SETUP_SEED
          mc_basename mc
          mc_spectral_is 550.0
          zout 0.000000
          umu -0.50000000
          phi 36.000000
          quiet
          EOF
          cat > "$OUT/probe.gdb" <<EOF
          set pagination off
          set confirm off
          set print thread-events off
          set debuginfod enabled off
          set breakpoint pending off
          set disable-randomization off
          break *mystic
          run < $GITHUB_WORKSPACE/$OUT/probe.inp
          python
          import sys
          sys.path.insert(0,'$GITHUB_WORKSPACE/$OUT')
          import watch_v26 as w
          w.install('$GITHUB_WORKSPACE/$OUT/watch-result-v26.json')
          end
          continue
          python w.finish()
          quit
          EOF
          set +e
          "$GDB_PREFIX/bin/gdb" -q -batch -x "$OUT/probe.gdb" --args "$(command -v uvspec)" > "$OUT/gdb-stdout.txt" 2> "$OUT/gdb-stderr.txt"
          printf '%s\n' "$?" > "$OUT/gdb-exit-code.txt"
          set -e
          if [ -f randomseed ]; then cp randomseed "$OUT/randomseed-consumed-evidence.txt"; fi

      - name: Classify immutable V26 outcome
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT=deep-twilight-phase-delta-prerng-watch-v26-output
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          r=Path('deep-twilight-phase-delta-prerng-watch-v26-output'); p=r/'watch-result-v26.json'
          w=json.loads(p.read_text()) if p.exists() else {}
          seed=(r/'randomseed-consumed-evidence.txt').read_text().splitlines()[0].strip() if (r/'randomseed-consumed-evidence.txt').exists() else None
          consumed=seed==os.environ['FRESH_SETUP_SEED']
          stopped=w.get('randomReached') is True
          both=w.get('bothObservedBeforeRandom') is True
          passed=w.get('status')=='PASS_DATAFLOW_OBSERVED' and consumed and stopped and both
          d={
            'schemaVersion':26,
            'status':'PASS_EXACT_ENTRY_TO_PRERNG_DATAFLOW_OBSERVED' if passed else 'FAIL_CLOSED_PRERNG_DATAFLOW_INCOMPLETE',
            'freshSetupSeed':int(os.environ['FRESH_SETUP_SEED']),
            'freshSetupSeedConsumed':consumed,
            'freshSetupSeedReusable':False,
            'firstPostEntryUvspecRandomStoppedBeforeExecution':stopped,
            'bothEntryWordsObservedBeforeRandom':both,
            'mysticBodyDeterministicPrefixExecuted':bool(w),
            'radianceResultProduced':False,
            'protectedResultOpened':False,
            'levelBChanged':False,
            'taylorOrJerusalemUsed':False,
            'epsilonSubstitutionUsed':False,
            'uniformAodScalingAuthorized':False,
            'rendererParityAuthorized':False,
            'watchResultSha256':hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None,
            'claimBoundary':'exact frozen-state f_s/ds_s row1 baseline equivalence plus entry-to-pre-RNG read dataflow only; exact consumer context review is still required before renderer translation parity'
          }
          (r/'decision-v26.json').write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          print(json.dumps(d,sort_keys=True))
          PY

      - name: Upload immutable V26 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-twilight-phase-delta-prerng-watch-v26
          path: deep-twilight-phase-delta-prerng-watch-v26-output/
          if-no-files-found: error
          retention-days: 90

      - name: Enforce completed guarded probe
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('deep-twilight-phase-delta-prerng-watch-v26-output/decision-v26.json'))
          if d['status'] != 'PASS_EXACT_ENTRY_TO_PRERNG_DATAFLOW_OBSERVED': raise SystemExit('exact pre-RNG dataflow gate did not pass')
          if not d['freshSetupSeedConsumed']: raise SystemExit('seed-consumption evidence missing')
          if not d['firstPostEntryUvspecRandomStoppedBeforeExecution']: raise SystemExit('guarded random breakpoint not reached')
          if not d['bothEntryWordsObservedBeforeRandom']: raise SystemExit('both entry words were not observed before RNG')
          PY
