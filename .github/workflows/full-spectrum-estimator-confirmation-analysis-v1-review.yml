name: Full-spectrum estimator confirmation analysis v1 review

on:
  pull_request:
    paths:
      - 'review/full-spectrum-estimator-confirmation-analysis-v1/**'
      - '.github/workflows/full-spectrum-estimator-confirmation-analysis-v1-review.yml'

permissions:
  contents: read
  actions: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - name: Compile frozen confirmation normalizer/analyzer and tests
        run: |
          python -m py_compile \
            review/full-spectrum-estimator-confirmation-analysis-v1/normalize_confirmation_results_v1.py \
            review/full-spectrum-estimator-confirmation-analysis-v1/analyze_confirmation_v1.py \
            review/full-spectrum-estimator-confirmation-analysis-v1/test_confirmation_analysis_v1.py
      - name: Rebuild and verify exact reviewed 24-case execution manifest identity
        run: |
          python review/full-spectrum-estimator-confirmation-v1/build_confirmation_execution_manifest_v1.py \
            --repository-root . \
            --preregistration review/full-spectrum-estimator-confirmation-v1/full-spectrum-estimator-confirmation-preregistration-v1.json \
            --pilot-manifest review/full-spectrum-estimator-pilot-v2/full-spectrum-estimator-pilot-execution-manifest-v4.json \
            --output /tmp/confirmation-execution-manifest-v1.json
          python - <<'PY'
          import json
          v=json.load(open('/tmp/confirmation-execution-manifest-v1.json'))
          if v.get('manifestSha256')!='9344ed18cfa93849d730cf080fe9f6c4c57f0cc5ea7b1be7ba9aa15d501c3fa8': raise SystemExit('confirmation execution manifest identity drift')
          if v.get('caseCount')!=24: raise SystemExit('confirmation execution case-count drift')
          PY
      - name: Run frozen confirmation analysis regressions
        run: python review/full-spectrum-estimator-confirmation-analysis-v1/test_confirmation_analysis_v1.py
      - name: Prove analysis package cannot execute science or open downstream gates
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('review/full-spectrum-estimator-confirmation-analysis-v1')
          contract=json.loads((root/'analysis-contract.v1.json').read_text())
          if contract['status']!='REVIEW_ONLY_FROZEN_BEFORE_ANY_CONFIRMATION_RESULT': raise SystemExit('analysis status drift')
          if any(contract['downstreamBoundary'].values()): raise SystemExit('analysis contract opened downstream authorization')
          workflow=Path('.github/workflows/full-spectrum-estimator-confirmation-analysis-v1-review.yml').read_text()
          for forbidden in ('\n  push:', '\n  workflow_dispatch:', '\n  schedule:', 'setup-micromamba', 'rubin-libradtran', 'command -v uvspec', '--allow-execution'):
              if forbidden in workflow: raise SystemExit(f'analysis review exposed runtime/trigger: {forbidden}')
          if '\n  pull_request:' not in workflow: raise SystemExit('analysis review is not PR-only')
          for path in (root/'normalize_confirmation_results_v1.py', root/'analyze_confirmation_v1.py'):
              text=path.read_text()
              for forbidden in ('subprocess.run(', 'subprocess.Popen(', 'os.system(', 'command -v uvspec', '--allow-execution'):
                  if forbidden in text: raise SystemExit(f'analysis source exposed execution primitive {forbidden}: {path}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: full-spectrum-estimator-confirmation-analysis-v1-review
          path: |
            /tmp/confirmation-execution-manifest-v1.json
            review/full-spectrum-estimator-confirmation-analysis-v1/analysis-contract.v1.json
          if-no-files-found: error
          retention-days: 90
