name: Full-spectrum estimator confirmation decision v1 review

on:
  pull_request:
    paths:
      - review/full-spectrum-estimator-confirmation-decision-v1/**
      - .github/workflows/full-spectrum-estimator-confirmation-decision-v1-review.yml

permissions:
  contents: read
  actions: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - name: Download and bind exact terminal confirmation analysis artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api repos/search-maker/twilight-mystic-experiments/actions/artifacts/9128583943/zip > /tmp/confirmation-analysis.zip
          echo "227e0fdba651ba8647846f9f3598fc4d4b40eb9ffd766d80874f584b91e59b76  /tmp/confirmation-analysis.zip" | sha256sum -c -
          mkdir -p /tmp/confirmation-analysis
          unzip -q /tmp/confirmation-analysis.zip -d /tmp/confirmation-analysis
          test -f /tmp/confirmation-analysis/confirmation-analysis-v1.json
      - name: Validate exact post-result decision and regression refusals
        shell: bash
        run: |
          python -m py_compile \
            review/full-spectrum-estimator-confirmation-decision-v1/validate_confirmation_decision_v1.py \
            review/full-spectrum-estimator-confirmation-decision-v1/test_confirmation_decision_v1.py \
            review/full-spectrum-estimator-confirmation-decision-v1/test_workflow_surface_v1.py
          python review/full-spectrum-estimator-confirmation-decision-v1/validate_confirmation_decision_v1.py \
            --analysis /tmp/confirmation-analysis/confirmation-analysis-v1.json \
            --decision review/full-spectrum-estimator-confirmation-decision-v1/full-spectrum-estimator-confirmation-decision-v1.json \
            --output /tmp/decision-review-result-v1.json
          python review/full-spectrum-estimator-confirmation-decision-v1/test_confirmation_decision_v1.py
      - name: Prove review package has exactly one PR-only trigger
        shell: bash
        run: |
          python review/full-spectrum-estimator-confirmation-decision-v1/test_workflow_surface_v1.py \
            --workflow .github/workflows/full-spectrum-estimator-confirmation-decision-v1-review.yml
      - uses: actions/upload-artifact@v4
        with:
          name: full-spectrum-estimator-confirmation-decision-v1-review
          path: /tmp/decision-review-result-v1.json
          if-no-files-found: error
          retention-days: 90
