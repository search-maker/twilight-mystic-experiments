name: Full-spectrum estimator confirmation v1 disabled execution package review

on:
  pull_request:
    paths:
      - 'review/full-spectrum-estimator-confirmation-v1/**'
      - '.github/workflows/full-spectrum-estimator-confirmation-v1-execution-package-review.yml'

permissions:
  contents: read

env:
  PACKAGE_DIR: review/full-spectrum-estimator-confirmation-v1

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - name: Compile disabled execution-package sources
        run: |
          python -m py_compile \
            "$PACKAGE_DIR/build_confirmation_execution_manifest_v1.py" \
            "$PACKAGE_DIR/render_confirmation_inputs_v1.py" \
            "$PACKAGE_DIR/executor_confirmation_v1.py" \
            "$PACKAGE_DIR/test_confirmation_execution_package_v1.py"
      - name: Build exact disabled confirmation execution manifest
        run: |
          mkdir -p confirmation-execution-review
          python "$PACKAGE_DIR/build_confirmation_execution_manifest_v1.py" \
            --repository-root . \
            --preregistration "$PACKAGE_DIR/full-spectrum-estimator-confirmation-preregistration-v1.json" \
            --pilot-manifest review/full-spectrum-estimator-pilot-v2/full-spectrum-estimator-pilot-execution-manifest-v4.json \
            --output confirmation-execution-review/execution-manifest-v1.json
      - name: Render all 24 confirmation input templates without execution
        run: |
          python "$PACKAGE_DIR/render_confirmation_inputs_v1.py" \
            --repository-root . \
            --execution-manifest confirmation-execution-review/execution-manifest-v1.json \
            --output-dir confirmation-execution-review/rendered-templates \
            --report confirmation-execution-review/render-report-v1.json
      - name: Run exact disabled-package regression
        run: python "$PACKAGE_DIR/test_confirmation_execution_package_v1.py" --repository-root .
      - name: Prove disabled package remains inert except for separately reviewed ordinal-17 trigger
        shell: bash
        run: |
          test ! -e .github/workflows/full-spectrum-estimator-confirmation-v1-execution.yml
          test ! -e .github/workflows/full-spectrum-estimator-confirmation-v1-ordinal17-execution.yml
          python - <<'PY'
          from pathlib import Path
          wfdir=Path('.github/workflows')
          expected={
            'full-spectrum-estimator-confirmation-v1-review.yml',
            'full-spectrum-estimator-confirmation-v1-execution-package-review.yml',
            'full-spectrum-estimator-confirmation-v1-preauthorization-review.yml',
            'full-spectrum-estimator-confirmation-v1-authorization-review-v1.yml',
            'full-spectrum-estimator-confirmation-v1-transport-review-v1.yml',
            'full-spectrum-estimator-confirmation-v1-ordinal17-execution-v1.yml',
          }
          paths=list(wfdir.glob('full-spectrum-estimator-confirmation-v1-*.yml'))
          if {p.name for p in paths}!=expected: raise SystemExit('confirmation workflow topology drift')
          execution=wfdir/'full-spectrum-estimator-confirmation-v1-ordinal17-execution-v1.yml'
          for path in paths:
              text=path.read_text()
              if path==execution:
                  if '\n  push:' not in text or '      - dispatch/full-spectrum-estimator-confirmation-v1-ordinal17' not in text: raise SystemExit('reviewed execution workflow trigger drift')
                  for forbidden in ('\n  workflow_'+'dispatch:', '\n  sche'+'dule:', '\n  pull_'+'request:'):
                      if forbidden in text: raise SystemExit(f'execution workflow has forbidden trigger: {forbidden.strip()}')
              else:
                  if '\n  pull_request:' not in text: raise SystemExit(f'non-execution confirmation workflow is not PR-only: {path}')
                  for forbidden in ('\n  pu'+'sh:', '\n  workflow_'+'dispatch:', '\n  sche'+'dule:'):
                      if forbidden in text: raise SystemExit(f'PR-only confirmation workflow has forbidden trigger: {path} {forbidden.strip()}')
          PY
      - name: Upload disabled execution review artifact
        uses: actions/upload-artifact@v4
        with:
          name: full-spectrum-estimator-confirmation-v1-disabled-execution-review
          path: confirmation-execution-review
          if-no-files-found: error
          retention-days: 90
