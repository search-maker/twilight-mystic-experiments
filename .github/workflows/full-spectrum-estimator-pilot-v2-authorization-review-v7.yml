name: Full-spectrum estimator pilot v2 authorization review v7

on:
  pull_request:
    types: [opened]
    paths:
      - "experiments/full-spectrum-estimator-pilot-v2/authorization.ordinal15.json"

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: full-spectrum-estimator-pilot-v2-authorization-review-v7-${{ github.ref }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - name: Prove authorization review is zero-runtime
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/full-spectrum-estimator-pilot-v2-authorization-review-v7.yml').read_text()
          forbidden=('setup-'+'micromamba','rubin-'+'libradtran','command -v '+'uvspec','--allow-'+'execution','workflow_'+'dispatch:','sche'+'dule:','repository_'+'dispatch:')
          found=[x for x in forbidden if x in text]
          if found: raise SystemExit(f'authorization review exposed scientific runtime: {found}')
          PY
      - name: Capture fresh repository-global ordinal-15 identity surface
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CURRENT_PR: ${{ github.event.pull_request.number }}
        run: |
          python experiments/full-spectrum-estimator-pilot-v2/candidate_v7.py surface \
            --repository "$GITHUB_REPOSITORY" \
            --current-pr "$CURRENT_PR" \
            --output freshness-v7.json
      - name: Build exact one-file authorization metadata
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_BRANCH: ${{ github.head_ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_STATE: ${{ github.event.pull_request.state }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          git fetch origin main
          LIVE_MAIN="$(git rev-parse origin/main)"
          mapfile -t PARENTS < <(git cat-file -p "$PR_HEAD_SHA" | sed -n 's/^parent //p')
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r "$PR_HEAD_SHA")
          LIVE_MAIN="$LIVE_MAIN" PARENT_COUNT="${#PARENTS[@]}" PARENT_SHA="${PARENTS[0]:-}" CHANGED_JSON="$(printf '%s\n' "${CHANGED[@]}" | python -c 'import json,sys; print(json.dumps([x.strip() for x in sys.stdin if x.strip()]))')" python - <<'PY'
          import json, os
          from pathlib import Path
          freshness=json.loads(Path('freshness-v7.json').read_text())
          value={
            'liveMain':os.environ['LIVE_MAIN'], 'headSha':os.environ['PR_HEAD_SHA'], 'parentSha':os.environ['PARENT_SHA'],
            'parentCount':int(os.environ['PARENT_COUNT']), 'changedPaths':json.loads(os.environ['CHANGED_JSON']),
            'eventName':os.environ['GITHUB_EVENT_NAME'], 'eventAction':os.environ['EVENT_ACTION'], 'runAttempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
            'scientificRuntimeSetupPerformed':False, 'scientificExecutionPerformed':False, 'freshness':freshness,
            'pr':{'number':int(os.environ['PR_NUMBER']),'state':os.environ['PR_STATE'],'draft':os.environ['PR_DRAFT'].lower()=='true','merged':os.environ['PR_MERGED'].lower()=='true','headBranch':os.environ['PR_HEAD_BRANCH'],'baseBranch':'main','headRepo':os.environ['PR_HEAD_REPO'],'baseRepo':os.environ['PR_BASE_REPO'],'headSha':os.environ['PR_HEAD_SHA']},
          }
          Path('authorization-context-v7.json').write_text(json.dumps(value,indent=2,sort_keys=True)+'\n')
          PY
      - name: Review exact ordinal-15 authorization child with zero scientific execution
        run: |
          python experiments/full-spectrum-estimator-pilot-v2/candidate_v7.py review \
            --authorization experiments/full-spectrum-estimator-pilot-v2/authorization.ordinal15.json \
            --context authorization-context-v7.json \
            --output authorization-review-v7.json
      - uses: actions/upload-artifact@v4
        with:
          name: full-spectrum-estimator-pilot-v2-authorization-review-v7
          path: |
            authorization-context-v7.json
            freshness-v7.json
            authorization-review-v7.json
            experiments/full-spectrum-estimator-pilot-v2/authorization.ordinal15.json
          if-no-files-found: error
          retention-days: 90
