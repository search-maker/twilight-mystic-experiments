name: Full-spectrum estimator pilot v2 postprocess analyzer v8 review

on:
  pull_request:
    paths:
      - '.github/workflows/full-spectrum-estimator-pilot-v2-ordinal16-postprocess-v8.yml'
      - '.github/workflows/full-spectrum-estimator-pilot-v2-postprocess-analyzer-v8-review.yml'
      - 'experiments/full-spectrum-estimator-pilot-v2/postprocess-analyzer-contract.ordinal16.v8.json'
      - 'review/full-spectrum-estimator-pilot-v2/analyze_full_spectrum_estimator_pilot_v7_compat.py'
      - 'review/full-spectrum-estimator-pilot-v2/test_postprocess_analyzer_v7_compat.py'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - name: Compile compatibility sources
        run: |
          python -m py_compile \
            review/full-spectrum-estimator-pilot-v2/analyze_full_spectrum_estimator_pilot_v7_compat.py \
            review/full-spectrum-estimator-pilot-v2/test_postprocess_analyzer_v7_compat.py
      - name: Run focused postprocess analyzer compatibility regressions
        run: python review/full-spectrum-estimator-pilot-v2/test_postprocess_analyzer_v7_compat.py
      - name: Prove replay workflow remains zero-solver
        shell: bash
        run: |
          workflow=.github/workflows/full-spectrum-estimator-pilot-v2-ordinal16-postprocess-v8.yml
          if grep -Eiq 'micromamba|libRadtran|uvspec|rte_solver|mc_photons|syntax check' "$workflow"; then
            echo 'postprocess v8 workflow contains a forbidden solver/runtime surface' >&2
            exit 1
          fi
