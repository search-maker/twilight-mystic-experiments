name: Full-spectrum estimator pilot v2 transport review v6

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/full-spectrum-estimator-pilot-v2-transport-review-v6.yml"
      - ".github/workflows/full-spectrum-estimator-pilot-v2-authorization-review-v6.yml"
      - ".github/workflows/full-spectrum-estimator-pilot-v2-ordinal14-execution-v6.yml"
      - "experiments/full-spectrum-estimator-pilot-v2/**"

permissions:
  contents: read

concurrency:
  group: full-spectrum-estimator-pilot-v2-transport-review-v6-${{ github.ref }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - name: Prove transport review has no scientific runtime surface
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/full-spectrum-estimator-pilot-v2-transport-review-v6.yml')
          text=p.read_text()
          forbidden=('setup-'+'micromamba','rubin-'+'libradtran','command -v '+'uvspec','--allow-'+'execution','workflow_'+'dispatch:','sche'+'dule:','repository_'+'dispatch:')
          found=[x for x in forbidden if x in text]
          if found: raise SystemExit(f'transport review exposed forbidden execution surface: {found}')
          PY
      - name: Run merged review-package checks
        run: python review/full-spectrum-estimator-pilot-v2/run_review_checks.py
      - name: Install review-only YAML dependency
        run: python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.2
      - name: Run disabled transport v6 checks
        run: python experiments/full-spectrum-estimator-pilot-v2/run_transport_checks.py --repository-root .
