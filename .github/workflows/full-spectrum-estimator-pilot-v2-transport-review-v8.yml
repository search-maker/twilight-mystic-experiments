name: Full-spectrum estimator pilot v2 transport review v8

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/full-spectrum-estimator-pilot-v2-transport-review-v8.yml"
      - ".github/workflows/full-spectrum-estimator-pilot-v2-authorization-review-v8.yml"
      - ".github/workflows/full-spectrum-estimator-pilot-v2-ordinal16-execution-v8.yml"
      - "experiments/full-spectrum-estimator-pilot-v2/executor.py"
      - "experiments/full-spectrum-estimator-pilot-v2/candidate_v8.py"
      - "experiments/full-spectrum-estimator-pilot-v2/run_transport_checks_v8.py"
      - "experiments/full-spectrum-estimator-pilot-v2/transport-contract.v8.json"
      - "experiments/full-spectrum-estimator-pilot-v2/authorization-template.ordinal16.json"

permissions:
  contents: read

concurrency:
  group: full-spectrum-estimator-pilot-v2-transport-review-v8-${{ github.ref }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - name: Prove transport review has no scientific runtime surface
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/full-spectrum-estimator-pilot-v2-transport-review-v8.yml').read_text()
          forbidden=('setup-'+'micromamba','rubin-'+'libradtran','command -v '+'uvspec','--allow-'+'execution','workflow_'+'dispatch:','sche'+'dule:','repository_'+'dispatch:')
          found=[x for x in forbidden if x in text]
          if found: raise SystemExit(f'transport review exposed forbidden execution surface: {found}')
          PY
      - name: Run merged scientific review-package checks
        run: python review/full-spectrum-estimator-pilot-v2/run_review_checks.py
      - name: Install review-only YAML dependency
        run: python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.2
      - name: Re-run legacy v6 transport regressions
        run: python experiments/full-spectrum-estimator-pilot-v2/run_transport_checks.py --repository-root .
      - name: Re-run ordinal-15 v7 transport regressions
        run: python experiments/full-spectrum-estimator-pilot-v2/run_transport_checks_v7.py --repository-root .
      - name: Run ordinal-16 executor-binding v8 regressions
        run: python experiments/full-spectrum-estimator-pilot-v2/run_transport_checks_v8.py --repository-root .
