name: full-spectrum precision-exhausted treatment v1 review
on:
  pull_request:
    paths:
      - review/full-spectrum-precision-exhausted-treatment-v1/**
      - review/full-spectrum-estimator-confirmation-decision-v1/**
      - review/full-spectrum-training-admission-readiness-v2/**
      - .github/workflows/full-spectrum-precision-exhausted-treatment-v1-review.yml
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - name: Bind exact training gate
        shell: bash
        run: |
          test "$(git rev-parse HEAD:review/full-spectrum-estimator-pilot-v2/full-spectrum-training-admission-complete-v1.json)" = c136f23f7df68b1481cb5ff939646198a3e336fe
      - name: Validate treatment protocol and mutation refusals
        shell: bash
        run: |
          python -m py_compile review/full-spectrum-precision-exhausted-treatment-v1/*.py
          python review/full-spectrum-precision-exhausted-treatment-v1/validate_precision_exhausted_treatment_v1.py \
            --protocol review/full-spectrum-precision-exhausted-treatment-v1/full-spectrum-precision-exhausted-treatment-protocol-v1.json \
            --decision review/full-spectrum-estimator-confirmation-decision-v1/full-spectrum-estimator-confirmation-decision-v1.json \
            --readiness review/full-spectrum-training-admission-readiness-v2/full-spectrum-training-admission-readiness-v2.json \
            --gate review/full-spectrum-estimator-pilot-v2/full-spectrum-training-admission-complete-v1.json \
            --screening review/full-spectrum-precision-exhausted-treatment-v1/test-fixtures/ordinal16-exhausted-geometry-screening-minimal.json \
            --confirmation review/full-spectrum-precision-exhausted-treatment-v1/test-fixtures/ordinal17-exhausted-geometry-confirmation-minimal.json \
            --output /tmp/precision-exhausted-treatment-review.json
          python review/full-spectrum-precision-exhausted-treatment-v1/test_precision_exhausted_treatment_v1.py
          python review/full-spectrum-precision-exhausted-treatment-v1/test_workflow_surface_v1.py --workflow .github/workflows/full-spectrum-precision-exhausted-treatment-v1-review.yml
      - uses: actions/upload-artifact@v4
        with:
          name: full-spectrum-precision-exhausted-treatment-v1-review
          path: /tmp/precision-exhausted-treatment-review.json
          if-no-files-found: error
          retention-days: 90
