name: Full-spectrum training admission readiness v2 review
on:
  pull_request:
    paths:
      - review/full-spectrum-training-admission-readiness-v2/**
      - review/full-spectrum-estimator-confirmation-decision-v1/**
      - .github/workflows/full-spectrum-training-admission-readiness-v2-review.yml
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - name: Bind current training gate and exact pilot screening artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD:review/full-spectrum-estimator-pilot-v2/full-spectrum-training-admission-complete-v1.json)" = c136f23f7df68b1481cb5ff939646198a3e336fe
          gh api repos/search-maker/twilight-mystic-experiments/actions/artifacts/9126300230/zip > /tmp/pilot-screening.zip
          echo "263505300e994364874b06b2137ad5fd6b1fa57f0a45629a1410f684a81c880b  /tmp/pilot-screening.zip" | sha256sum -c -
          mkdir -p /tmp/pilot-screening
          unzip -q /tmp/pilot-screening.zip -d /tmp/pilot-screening
          test -f /tmp/pilot-screening/screening-analysis-v8.json
      - name: Validate fail-closed readiness and mutation refusals
        shell: bash
        run: |
          python -m py_compile \
            review/full-spectrum-training-admission-readiness-v2/validate_training_admission_readiness_v2.py \
            review/full-spectrum-training-admission-readiness-v2/test_training_admission_readiness_v2.py \
            review/full-spectrum-training-admission-readiness-v2/test_workflow_surface_v2.py
          python review/full-spectrum-training-admission-readiness-v2/validate_training_admission_readiness_v2.py \
            --gate review/full-spectrum-estimator-pilot-v2/full-spectrum-training-admission-complete-v1.json \
            --decision review/full-spectrum-estimator-confirmation-decision-v1/full-spectrum-estimator-confirmation-decision-v1.json \
            --screening /tmp/pilot-screening/screening-analysis-v8.json \
            --readiness review/full-spectrum-training-admission-readiness-v2/full-spectrum-training-admission-readiness-v2.json \
            --output /tmp/training-readiness-v2-review.json
          python review/full-spectrum-training-admission-readiness-v2/test_training_admission_readiness_v2.py
          python review/full-spectrum-training-admission-readiness-v2/test_workflow_surface_v2.py \
            --workflow .github/workflows/full-spectrum-training-admission-readiness-v2-review.yml
      - uses: actions/upload-artifact@v4
        with:
          name: full-spectrum-training-admission-readiness-v2-review
          path: /tmp/training-readiness-v2-review.json
          if-no-files-found: error
          retention-days: 90
