name: Issue 117 Crawford generalized inverse math v1

on:
  push:
    branches:
      - review/issue117-crawford-generalized-inverse-math-v1

permissions:
  contents: read

jobs:
  candidate4-math:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APPLICATION_SHA: e0da52eb0a2d5bac333da6572f51df52ea7e676e
      CANDIDATE4_PROTOCOL_SHA: d31b44f7d4b67ad3adf4c5386517f625bf56d8da
      STARSVISIBILITY_READ_TOKEN: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind review-only Candidate 4 contract
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = review/issue117-crawford-generalized-inverse-math-v1
          python - <<'PY'
          import json,os
          c=json.load(open('review/issue117-crawford-generalized-inverse-math-v1/contract.review.json'))
          assert c['diagnosticId']=='issue117-crawford-generalized-inverse-math-v1'
          assert c['candidate4ProtocolHead']==os.environ['CANDIDATE4_PROTOCOL_SHA']
          assert c['applicationSha']==os.environ['APPLICATION_SHA']
          assert c['fieldFactor']==3.14
          assert c['generalizedInverse']['relativeThresholdTolerance']==1e-12
          assert c['generalizedInverse']['maxIterations']==160
          assert all(v is False for k,v in c['boundaries'].items() if k not in ('diagnosticOnly','syntheticMathematicalTestsOnly'))
          assert c['boundaries']['diagnosticOnly'] is True and c['boundaries']['syntheticMathematicalTestsOnly'] is True
          PY
          git fetch origin "$CANDIDATE4_PROTOCOL_SHA"
          test "$(git rev-parse "$CANDIDATE4_PROTOCOL_SHA:review/issue117-crawford-generalized-inverse-protocol-v1/PROTOCOL.md")" = "$(git rev-parse 'd31b44f7d4b67ad3adf4c5386517f625bf56d8da:review/issue117-crawford-generalized-inverse-protocol-v1/PROTOCOL.md')"
      - name: Require read-only application credential
        shell: bash
        run: test -n "${STARSVISIBILITY_READ_TOKEN:-}" || exit 78
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: search-maker/starsvisibility
          ref: ${{ env.APPLICATION_SHA }}
          token: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}
          path: app
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bind exact current-main threshold bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C app rev-parse HEAD)" = "$APPLICATION_SHA"
          test "$(git -C app rev-parse HEAD:scientific-tools/visibility-v3/human-threshold.mjs)" = bb4cd0ff02159ecffe276022cec9d292c7a434a3
          test "$(git -C app rev-parse HEAD:scientific-tools/visibility-v3/transient-equivalent-background-diagnostic-v1.json)" = b8474a3afc4c9974208e39b0f1e7eec9a3396f3c
      - name: Execute Candidate 4 generalized-inverse mathematical tests
        shell: bash
        env:
          APP_HUMAN_THRESHOLD: ${{ github.workspace }}/app/scientific-tools/visibility-v3/human-threshold.mjs
          REPORT_PATH: ${{ runner.temp }}/issue117-candidate4-generalized-inverse-math.json
        run: node review/issue117-crawford-generalized-inverse-math-v1/test.mjs
      - name: Validate result boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          p=os.path.join(os.environ['RUNNER_TEMP'],'issue117-candidate4-generalized-inverse-math.json')
          r=json.load(open(p))
          assert r['diagnosticId']=='issue117-crawford-generalized-inverse-math-v1'
          assert r['applicationSha']=='e0da52eb0a2d5bac333da6572f51df52ea7e676e'
          assert r['candidateProtocolHead']=='d31b44f7d4b67ad3adf4c5386517f625bf56d8da'
          assert r['fieldFactor']==3.14
          assert r['productionActivationAuthorized'] is False and r['semanticChangePerformed'] is False
          assert r['sameFieldIdentity']['probes']>0
          assert r['splitFieldSyntheticGrid']['beneficialViolations']==0
          assert r['splitFieldSyntheticGrid']['debtMonotonicityViolations']==0
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue117-crawford-generalized-inverse-math-v1
          path: ${{ runner.temp }}/issue117-candidate4-generalized-inverse-math.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
