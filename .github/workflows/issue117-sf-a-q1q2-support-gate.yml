name: Issue117 SF-A Q1 Q2 support gate

on:
  pull_request:
    paths:
      - '.github/workflows/issue117-sf-a-q1q2-support-gate.yml'
      - 'review/issue117-split-field-astronomy-shadow-protocol-v1/**'

permissions:
  contents: read

concurrency:
  group: issue117-sf-a-q1q2-support-${{ github.event.pull_request.number }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  support-only:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout exact shadow branch
        uses: actions/checkout@v4
        with:
          path: twilight
          persist-credentials: false

      - name: Checkout exact bound starsvisibility application
        uses: actions/checkout@v4
        with:
          repository: search-maker/starsvisibility
          ref: e0da52eb0a2d5bac333da6572f51df52ea7e676e
          path: twilight/external/starsvisibility
          persist-credentials: false

      - name: Verify immutable source identities
        working-directory: twilight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C external/starsvisibility rev-parse HEAD)" = "e0da52eb0a2d5bac333da6572f51df52ea7e676e"
          test "$(git -C external/starsvisibility hash-object scientific-tools/visibility-v3/validated-v3-sky-provider.mjs)" = "da8c5995559020865118220d939e58d89e6b98e4"
          test "$(git -C external/starsvisibility hash-object scientific-tools/visibility-v3/validated-v3-primary-runtime-v1.json)" = "5790ccb2c289de082a2851d96e4c3c660a1c4985"
          test "$(sha256sum external/starsvisibility/scientific-tools/visibility-v3/validated-v3-primary-runtime-v1.json | awk '{print $1}')" = "6a927bd702ebbf1b1913ebe51731f3b92f967f2ae95edf090280b8370ea091e4"

      - name: Execute support-only Q1 Q2 gate
        working-directory: twilight
        env:
          STARSVISIBILITY_ROOT: ${{ github.workspace }}/twilight/external/starsvisibility
        run: >-
          node review/issue117-split-field-astronomy-shadow-protocol-v1/sf-a-q1q2-support-gate.mjs
          review/issue117-split-field-astronomy-shadow-protocol-v1/SF_A_Q1_Q2_SUPPORT_GATE_RESULT.json

      - name: Assert no luminance or candidate output contract
        working-directory: twilight
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'review/issue117-split-field-astronomy-shadow-protocol-v1/SF_A_Q1_Q2_SUPPORT_GATE_RESULT.json';
          const x = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (!x.boundary?.noSkyLuminanceEvaluated || !x.boundary?.noAdaptationStateEvaluated || !x.boundary?.noCandidateThresholdEvaluated || !x.boundary?.noTaylorJerusalemUsed || !x.boundary?.noProtectedHoldoutOpened) process.exit(2);
          if (x.q1CompleteHistoryCounts.S1_WHOLE_CAP !== 222 || x.q1CompleteHistoryCounts.S2_ALF !== 222 || x.q1CompleteHistoryCounts.S3_UCHIDA_LOCAL !== 353) process.exit(3);
          NODE

      - name: Upload immutable support result
        uses: actions/upload-artifact@v4
        with:
          name: issue117-sf-a-q1q2-support-gate
          path: twilight/review/issue117-split-field-astronomy-shadow-protocol-v1/SF_A_Q1_Q2_SUPPORT_GATE_RESULT.json
          if-no-files-found: error
          retention-days: 90
