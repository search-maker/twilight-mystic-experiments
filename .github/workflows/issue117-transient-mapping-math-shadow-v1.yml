name: Issue 117 transient mapping math shadow v1

on:
  push:
    branches:
      - review/issue117-transient-mapping-math-shadow-v1

permissions:
  contents: read

jobs:
  math-shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APPLICATION_SHA: e0da52eb0a2d5bac333da6572f51df52ea7e676e
      PREREGISTERED_PROTOCOL_SHA: 23f96613d553610f9e75ddd4c8c08d0240c354c6
      STARSVISIBILITY_READ_TOKEN: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind review-only contract and preregistration
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = review/issue117-transient-mapping-math-shadow-v1
          python - <<'PY'
          import json,os
          c=json.load(open('review/issue117-transient-mapping-math-shadow-v1/contract.review.json'))
          assert c['diagnosticId']=='issue117-transient-mapping-math-shadow-v1'
          assert c['preregisteredCandidateProtocolHead']==os.environ['PREREGISTERED_PROTOCOL_SHA']
          assert c['applicationSha']==os.environ['APPLICATION_SHA']
          assert c['fieldFactor']==3.14
          assert c['candidate4ThresholdDerivedEquivalentBackgroundExecuted'] is False
          assert all(v is False for k,v in c['boundaries'].items() if k not in ('diagnosticOnly','syntheticMathematicalTestsOnly'))
          assert c['boundaries']['diagnosticOnly'] is True and c['boundaries']['syntheticMathematicalTestsOnly'] is True
          PY
          git fetch origin "$PREREGISTERED_PROTOCOL_SHA"
          test "$(git rev-parse "$PREREGISTERED_PROTOCOL_SHA:review/issue117-transient-mapping-shadow-protocol-v1/PROTOCOL.md")" = "$(git rev-parse '23f96613d553610f9e75ddd4c8c08d0240c354c6:review/issue117-transient-mapping-shadow-protocol-v1/PROTOCOL.md')"
      - name: Require read-only application credential
        shell: bash
        run: test -n "${STARSVISIBILITY_READ_TOKEN:-}" || exit 78
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: search-maker/starsvisibility
          ref: ${{ env.APPLICATION_SHA }}
          token: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}
          path: app
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bind exact frozen human-threshold and Eq34 diagnostic bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C app rev-parse HEAD)" = "$APPLICATION_SHA"
          test "$(git -C app rev-parse HEAD:scientific-tools/visibility-v3/human-threshold.mjs)" = bb4cd0ff02159ecffe276022cec9d292c7a434a3
          test "$(git -C app rev-parse HEAD:scientific-tools/visibility-v3/transient-equivalent-background-diagnostic-v1.json)" = b8474a3afc4c9974208e39b0f1e7eec9a3396f3c
          python - <<'PY'
          import json
          d=json.load(open('app/scientific-tools/visibility-v3/transient-equivalent-background-diagnostic-v1.json'))
          m=d['equilibriumThresholdMonotonicity']
          assert m['localThresholdMaximumBackgroundCdM2']==0.021567318651181808
          assert m['localThresholdMinimumBackgroundCdM2']==0.04705255275868123
          assert m['maxLocalNegativePenaltyMagnitude']==-0.02861304438952384
          PY
      - name: Execute preregistered mathematical shadow tests
        shell: bash
        env:
          APP_HUMAN_THRESHOLD: ${{ github.workspace }}/app/scientific-tools/visibility-v3/human-threshold.mjs
          REPORT_PATH: ${{ runner.temp }}/issue117-math-shadow-report.json
        run: node review/issue117-transient-mapping-math-shadow-v1/test.mjs
      - name: Validate diagnostic boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          p=os.path.join(os.environ['RUNNER_TEMP'],'issue117-math-shadow-report.json')
          r=json.load(open(p))
          assert r['diagnosticId']=='issue117-transient-mapping-math-shadow-v1'
          assert r['applicationSha']=='e0da52eb0a2d5bac333da6572f51df52ea7e676e'
          assert r['fieldFactor']==3.14
          assert r['productionActivationAuthorized'] is False
          assert r['transientSemanticChangePerformed'] is False
          g=r['syntheticGrid']
          assert g['candidate1BeneficialViolations']==0 and g['candidate2BeneficialViolations']==0 and g['candidate3BeneficialViolations']==0
          assert g['candidate1MonotonicViolations']>0
          assert g['candidate2MonotonicViolations']==0 and g['candidate3MonotonicViolations']==0
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue117-transient-mapping-math-shadow-v1
          path: ${{ runner.temp }}/issue117-math-shadow-report.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
