name: Jerusalem bright stars 2026 QA

on:
  push:
    branches:
      - qa/jerusalem-bright-stars-2026
    paths:
      - scripts/jerusalem-bright-stars-live-qa.mjs
      - .github/workflows/jerusalem-bright-stars-2026.yml

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET_URL: https://starsvisibility.pages.dev/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run Jerusalem annual bright-star report
        run: node scripts/jerusalem-bright-stars-live-qa.mjs

      - name: Upload Jerusalem report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jerusalem-bright-stars-2026
          path: qa-artifacts/
          if-no-files-found: warn
