name: Jerusalem exact-event mesopic sensitivity v1

on:
  push:
    branches:
      - review/jerusalem-exact-event-mesopic-v1

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require read-only starsvisibility credential
        shell: bash
        env:
          STARSVISIBILITY_READ_TOKEN: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}
        run: test -n "${STARSVISIBILITY_READ_TOKEN:-}" || exit 78

      - name: Check out exact current application snapshot
        uses: actions/checkout@v4
        with:
          repository: search-maker/starsvisibility
          ref: 80110c8cb4575c7be3c91b4817be5126c40b2b15
          token: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}
          path: app
          persist-credentials: false
          fetch-depth: 1

      - name: Check out exact mesopic review source
        uses: actions/checkout@v4
        with:
          repository: search-maker/starsvisibility
          ref: c1de484b9dfe5e91f569be02debea3c214d67d11
          token: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}
          path: mesopic-source
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.node-version
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install exact application tooling
        working-directory: app
        run: npm ci

      - name: Build exact application and hash-bound stellar assets
        working-directory: app
        run: npm run build:pages

      - name: Run exact-event mesopic sensitivity
        run: >-
          node review/jerusalem-exact-event-mesopic-v1/run.mjs
          --app-root app
          --mesopic-root mesopic-source
          --repo-root .
          --output diagnostic-output/jerusalem-exact-event-mesopic-v1.json

      - name: Assert no MYSTIC solver execution
        shell: bash
        run: |
          test ! -e diagnostic-output/uvspec.log
          test ! -e diagnostic-output/mc.rad.spc
          echo NO_MYSTIC_SOLVER_EXECUTION

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jerusalem-exact-event-mesopic-v1
          path: diagnostic-output/
          if-no-files-found: warn
          retention-days: 90
