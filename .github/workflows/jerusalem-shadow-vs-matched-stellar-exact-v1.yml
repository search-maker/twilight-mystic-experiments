name: Jerusalem exact shadow-vs-matched stellar isolation v1

on:
  push:
    branches:
      - review/jerusalem-shadow-vs-matched-stellar-exact-v1

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require read-only application credential
        shell: bash
        env:
          STARSVISIBILITY_READ_TOKEN: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}
        run: test -n "${STARSVISIBILITY_READ_TOKEN:-}" || exit 78

      - name: Check out exact frozen starsvisibility application
        uses: actions/checkout@v4
        with:
          repository: search-maker/starsvisibility
          ref: e2d5b761206b6223526f6f79fcb0af5f6de3ba06
          token: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}
          path: app
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.node-version
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install exact application tooling
        working-directory: app
        run: npm ci

      - name: Build exact application and hash-bound stellar assets
        working-directory: app
        run: npm run build:pages

      - name: Run exact same-geometry shadow-vs-matched stellar isolation
        run: >-
          node review/jerusalem-shadow-vs-matched-stellar-exact-v1/run.mjs
          --app-root app
          --output diagnostic-output/stellar-transport-isolation.json

      - name: Assert no MYSTIC solver lane was invoked
        shell: bash
        run: |
          test ! -e diagnostic-output/uvspec.log
          test ! -e diagnostic-output/mc.rad.spc
          echo "NO_MYSTIC_SOLVER_EXECUTION"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jerusalem-shadow-vs-matched-stellar-exact-v1
          path: diagnostic-output
          if-no-files-found: warn
          retention-days: 90
