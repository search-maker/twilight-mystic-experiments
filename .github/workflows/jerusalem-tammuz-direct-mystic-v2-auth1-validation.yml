name: Jerusalem Tammuz direct-MYSTIC v2 auth1 no-solver validation

on:
  push:
    branches:
      - 'validate/jerusalem-tammuz-direct-mystic-v2-auth1'
    paths:
      - '.github/workflows/jerusalem-tammuz-direct-mystic-v2-auth1-validation.yml'

permissions:
  contents: read
  actions: read

jobs:
  validate-auth1-no-solver:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AUTHORIZATION_REF: e83cc3a6bccf305cee77a567918f88dc5b54f5e3
      AUTHORIZATION_PARENT: 8260bdf10693dec6b42bba2e3483ef63816d8756
      EXECUTION_KEY: jerusalem-tammuz-direct-mystic-v2:diagnostic:1
      AUTHORIZATION_ORDINAL: '1'
      APPLICATION_SHA: e2d5b761206b6223526f6f79fcb0af5f6de3ba06
      PACKAGE: experiments/jerusalem-tammuz-direct-mystic-v2
      AUTHORIZATION: experiments/jerusalem-tammuz-direct-mystic-v2/authorization.scientific.json
      PROPOSAL: experiments/jerusalem-tammuz-direct-mystic-v1/manifest.proposal.json
      EVIDENCE: experiments/jerusalem-tammuz-direct-mystic-v1/level-b-event-evidence.json
      ANALYSIS_CONTRACT: experiments/jerusalem-tammuz-direct-mystic-v1/analysis-contract.json
      PROPOSAL_ADAPTER: experiments/mystic-batch-v1/cross_geometry_adapter.py
      EXECUTION_ADAPTER: experiments/jerusalem-tammuz-direct-mystic-v1/execution_adapter.py
      EXECUTION_WORKFLOW: .github/workflows/jerusalem-tammuz-direct-mystic-v2-execution.yml
      RUNTIME_LOCK: experiments/mystic-batch-v1/runtime-lock.micromamba.json
      PLAN: experiments/jerusalem-tammuz-direct-mystic-v2/execution_plan.py
      ANALYSIS_DRIVER: experiments/jerusalem-tammuz-direct-mystic-v1/analyze_direct_sky.py
      VISIBILITY_HELPER: experiments/jerusalem-tammuz-direct-mystic-v1/compute_sky_only_visibility.mjs
      DERIVED_CHANNELS: experiments/aerosol-family-challenge-v2/derived_channels.py
      HUMAN_THRESHOLD: scientific-tools/visibility-v3/human-threshold.mjs
      EXECUTOR: experiments/mystic-batch-v1/scientific_case_executor.py
      AGGREGATE: experiments/mystic-batch-v1/scientific_aggregate.py
      AUDIT: experiments/mystic-batch-v1/scientific_audit.py
      AUTHORIZATION_PROPOSAL_BUILDER: experiments/jerusalem-tammuz-direct-mystic-v2/authorization_proposal.py
    steps:
      - name: Check out validation child branch with full ancestry
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require read-only application credential
        env:
          STARSVISIBILITY_READ_TOKEN: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}
        run: test -n "${STARSVISIBILITY_READ_TOKEN:-}" || exit 78

      - name: Check out exact frozen starsvisibility application
        uses: actions/checkout@v4
        with:
          repository: search-maker/starsvisibility
          ref: ${{ env.APPLICATION_SHA }}
          token: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}
          path: app
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'

      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.node-version

      - name: Prove no libRadtran executable before auth validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-output
          if command -v uvspec >/dev/null 2>&1; then
            echo 'Unexpected uvspec before authorization validation' >&2
            exit 1
          fi
          echo 'TAMMUZ_AUTH1_NO_UVSPEC_BEFORE=PASS'

      - name: Detach to exact one-purpose authorization commit and prove one-file parent diff
        shell: bash
        run: |
          set -euo pipefail
          VALIDATOR_HEAD="$(git rev-parse HEAD)"
          echo "$VALIDATOR_HEAD" > validation-output/validator-head.txt
          git checkout --detach "$AUTHORIZATION_REF"
          test "$(git rev-parse HEAD)" = "$AUTHORIZATION_REF"
          test "$(git rev-parse HEAD^)" = "$AUTHORIZATION_PARENT"
          CHANGED="$(git diff --name-only HEAD^ HEAD)"
          test "$CHANGED" = "$AUTHORIZATION"
          python - <<'PY'
          import json, os
          from pathlib import Path
          a=json.loads(Path(os.environ['AUTHORIZATION']).read_text())
          assert a['authorized'] is True
          assert a['scientificExecution'] is True
          assert a['scientificDiagnostic'] is True
          assert a['executionKey']==os.environ['EXECUTION_KEY']
          assert a['authorizationOrdinal']==1
          assert a['consumed'] is False
          assert a['exactAuthorizationParentCommit']==os.environ['AUTHORIZATION_PARENT']
          assert a['exactAuthorizationCommit'] is None
          assert a['batchId']=='jerusalem-tammuz-three-star-direct-mystic-v1'
          assert a['proposalPath']=='experiments/jerusalem-tammuz-direct-mystic-v1/manifest.proposal.json'
          assert a['requiredSmokeRunId']==33011713466
          assert a['requiredSmokeAuditArtifactId']==9622825000
          assert a['requiredSmokeAuditArtifactDigest']=='sha256:bd13fae624385476c73094e8d3a0019d403689bbfba640248c0173f1451598de'
          print('TAMMUZ_AUTH1_ONE_FILE_COMMIT=PASS')
          PY

      - name: Run exact authorization guard against authorization commit only
        shell: bash
        run: |
          set -euo pipefail
          env GITHUB_ACTIONS=true GITHUB_EVENT_NAME=workflow_dispatch GITHUB_RUN_ATTEMPT=1 \
            python "$PACKAGE/execution_guard.py" \
            --repository-root . \
            --application-root app \
            --application-sha "$APPLICATION_SHA" \
            --authorization "$AUTHORIZATION" \
            --proposal "$PROPOSAL" \
            --evidence "$EVIDENCE" \
            --analysis-contract "$ANALYSIS_CONTRACT" \
            --proposal-adapter "$PROPOSAL_ADAPTER" \
            --execution-adapter "$EXECUTION_ADAPTER" \
            --execution-workflow "$EXECUTION_WORKFLOW" \
            --runtime-lock "$RUNTIME_LOCK" \
            --plan "$PLAN" \
            --analysis-driver "$ANALYSIS_DRIVER" \
            --visibility-helper "$VISIBILITY_HELPER" \
            --derived-channels "$DERIVED_CHANNELS" \
            --human-threshold "$HUMAN_THRESHOLD" \
            --executor "$EXECUTOR" \
            --aggregate "$AGGREGATE" \
            --audit "$AUDIT" \
            --authorization-proposal-builder "$AUTHORIZATION_PROPOSAL_BUILDER" \
            --authorization-ref "$AUTHORIZATION_REF" \
            --execution-key "$EXECUTION_KEY" \
            --authorization-ordinal "$AUTHORIZATION_ORDINAL" \
            --output validation-output/authorization-guard.json
          python - <<'PY'
          import json
          g=json.load(open('validation-output/authorization-guard.json'))
          assert g['status']=='AUTHORIZED_TAMMUZ_V2_AFTER_FORMAL_SMOKE_PASS'
          assert g['authorizationRef']=='e83cc3a6bccf305cee77a567918f88dc5b54f5e3'
          assert g['authorizationOrdinal']==1
          assert g['executionKey']=='jerusalem-tammuz-direct-mystic-v2:diagnostic:1'
          assert g['caseCount']==12
          assert g['configuredMcPhotonsSum']==240_000_000
          print('TAMMUZ_AUTH1_GUARD=PASS')
          PY

      - name: Refuse any prior matching actual Tammuz execution run before dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python experiments/mystic-batch-v1/duplicate_run_audit.py \
            --repository "${{ github.repository }}" \
            --workflow jerusalem-tammuz-direct-mystic-v2-execution.yml \
            --current-run-id "${{ github.run_id }}" \
            --execution-key "$EXECUTION_KEY" \
            --authorization-ref "$AUTHORIZATION_REF" \
            --authorization-ordinal "$AUTHORIZATION_ORDINAL" \
            --token "$GH_TOKEN" \
            --output validation-output/duplicate-run-audit.json
          python - <<'PY'
          import json
          d=json.load(open('validation-output/duplicate-run-audit.json'))
          assert d['status'] in ('NO_PRIOR_MATCHING_RUN','PASS','NO_DUPLICATE_RUN')
          print('TAMMUZ_AUTH1_DUPLICATE_AUDIT=PASS')
          PY

      - name: Freeze exact authorization plan without syntax or solver
        shell: bash
        run: |
          set -euo pipefail
          python "$PLAN" \
            --proposal "$PROPOSAL" \
            --guard-report validation-output/authorization-guard.json \
            --output validation-output/plan.json
          python - <<'PY'
          import json
          p=json.load(open('validation-output/plan.json'))
          assert p['caseCount']==12
          assert p['configuredMcPhotonsSum']==240_000_000
          assert p['maximumParallel']==6
          assert len(p['matrix']['include'])==12
          assert [x['ordinal'] for x in p['matrix']['include']]==list(range(1,13))
          assert {x['group_id'] for x in p['matrix']['include']}=={'tammuz-alkaid-hr5191','tammuz-alioth-hr4905','tammuz-regulus-hr3982'}
          assert sorted(x['method'] for x in p['matrix']['include'])==['alis']*6+['reference-vroom']*6
          print('TAMMUZ_AUTH1_PLAN_12_240M=PASS')
          PY

      - name: Prove authorization validation launched no syntax or MYSTIC solver
        shell: bash
        run: |
          set -euo pipefail
          if command -v uvspec >/dev/null 2>&1; then
            echo 'Unexpected uvspec after authorization validation' >&2
            exit 1
          fi
          test ! -e case-output
          test ! -e aggregate-output
          test ! -e audit-output
          echo 'TAMMUZ_AUTH1_NO_UVSPEC_NO_MYSTIC=PASS'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jerusalem-tammuz-direct-mystic-v2-auth1-validation-${{ github.run_id }}
          path: validation-output
          if-no-files-found: warn
          retention-days: 90
