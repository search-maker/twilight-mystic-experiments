name: Dispatch Jerusalem Tammuz direct-MYSTIC v2 exactly once

on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/jerusalem-tammuz-direct-mystic-v2-package-validation.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'review/jerusalem-tammuz-direct-mystic-v2-dispatch-once'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      AUTHORIZATION_REF: e83cc3a6bccf305cee77a567918f88dc5b54f5e3
      AUTHORIZATION_PARENT: 8260bdf10693dec6b42bba2e3483ef63816d8756
      EXECUTION_KEY: jerusalem-tammuz-direct-mystic-v2:diagnostic:1
      AUTHORIZATION_ORDINAL: '1'
      TARGET_WORKFLOW: jerusalem-tammuz-direct-mystic-v2-execution.yml
      TARGET_WORKFLOW_PATH: .github/workflows/jerusalem-tammuz-direct-mystic-v2-execution.yml
      EXPECTED_TARGET_WORKFLOW_SHA256: 10b446dd5ee7b948f57b6afadbaec6a6e4f5a76b37de994670e3f46795fd14f2
      AUTHORIZATION_PATH: experiments/jerusalem-tammuz-direct-mystic-v2/authorization.scientific.json
      EVIDENCE_DIGEST: sha256:42ed5920f88428c768bc25f7203de7ea48173fe541f857f9fedcc42efaec1008
      PACKAGE_VALIDATION_DIGEST: sha256:732223ef10df4cc393eacd2dc3d2770b3c9ac14c21f1cdd698939ff22cebd653
      SMOKE_AUDIT_DIGEST: sha256:bd13fae624385476c73094e8d3a0019d403689bbfba640248c0173f1451598de
    steps:
      - name: Verify exact one-purpose Tammuz authorization and exact target workflow on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${AUTHORIZATION_REF}" > /tmp/auth-commit.json
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github.raw+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${AUTHORIZATION_PATH}?ref=${AUTHORIZATION_REF}" > /tmp/auth.json
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github.raw+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${TARGET_WORKFLOW_PATH}?ref=main" > /tmp/target-workflow.yml
          python - <<'PY'
          import hashlib, json, os
          d=json.load(open('/tmp/auth-commit.json'))
          assert d['sha']==os.environ['AUTHORIZATION_REF']
          assert len(d['parents'])==1 and d['parents'][0]['sha']==os.environ['AUTHORIZATION_PARENT']
          assert [f['filename'] for f in d['files']]==[os.environ['AUTHORIZATION_PATH']]
          a=json.load(open('/tmp/auth.json'))
          required={
              'scientificPurpose':'jerusalem-tammuz-direct-mystic-v2',
              'laneId':'jerusalem-tammuz-direct-mystic-v2',
              'authorized':True,
              'scientificExecution':True,
              'scientificDiagnostic':True,
              'executionKey':os.environ['EXECUTION_KEY'],
              'authorizationOrdinal':1,
              'consumed':False,
              'exactAuthorizationParentCommit':os.environ['AUTHORIZATION_PARENT'],
              'exactAuthorizationCommit':None,
              'batchId':'jerusalem-tammuz-three-star-direct-mystic-v1',
              'requiredSmokeRunId':33011713466,
              'requiredSmokeAuditArtifactId':9622825000,
              'requiredSmokeAuditArtifactDigest':os.environ['SMOKE_AUDIT_DIGEST'],
          }
          stale={k:(a.get(k),v) for k,v in required.items() if a.get(k)!=v}
          assert not stale, stale
          assert a['proposalRawSha256']=='0e2857ae4fc244a54d6191fc8afe421247da7080849e065543f52fce6fa2cc46'
          assert a['levelBEvidenceRawSha256']=='7f6a9230678766fd2807bcdd163d3812311572ee09edf608abf5d4fa50272f7b'
          assert a['executionAdapterRawSha256']=='a9aaabe29e0f10520b0d1fdf44044554e58439d513aa2f58da4d2bd07fc72146'
          assert a['executionWorkflowRawSha256']==os.environ['EXPECTED_TARGET_WORKFLOW_SHA256']
          assert a['planRawSha256']=='f960757f26dbdd91257b4d3938c601d6d4a5d2dec0b97ca2e273767c3c94a132'
          workflow=open('/tmp/target-workflow.yml','rb').read()
          actual=hashlib.sha256(workflow).hexdigest()
          assert actual==os.environ['EXPECTED_TARGET_WORKFLOW_SHA256'], (actual, os.environ['EXPECTED_TARGET_WORKFLOW_SHA256'])
          print('ONE_PURPOSE_TAMMUZ_AUTH_AND_EXACT_MAIN_WORKFLOW_PASS')
          PY

      - name: Refuse any prior exact Tammuz target marker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/runs?event=workflow_dispatch&per_page=100" > /tmp/runs.json
          python - <<'PY'
          import json, os
          p=json.load(open('/tmp/runs.json')); runs=p.get('workflow_runs'); total=p.get('total_count')
          assert isinstance(runs,list) and isinstance(total,int)
          assert total <= len(runs), 'incomplete target-workflow run scan'
          marker=f"| key={os.environ['EXECUTION_KEY']} | auth={os.environ['AUTHORIZATION_REF']} | ordinal={os.environ['AUTHORIZATION_ORDINAL']}"
          matches=[r for r in runs if isinstance(r.get('display_title'),str) and r['display_title'].endswith(marker)]
          assert not matches, f'one-shot marker already exists: {[(r.get("id"),r.get("status"),r.get("conclusion")) for r in matches]}'
          print('NO_PRIOR_TAMMUZ_MARKER_PASS')
          PY

      - name: Dispatch Tammuz scientific workflow exactly once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/payload.json <<JSON
          {"ref":"main","inputs":{"authorization_ref":"${AUTHORIZATION_REF}","execution_key":"${EXECUTION_KEY}","authorization_ordinal":"${AUTHORIZATION_ORDINAL}"}}
          JSON
          code="$(curl -sS -o /tmp/response.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/dispatches" --data-binary @/tmp/payload.json)"
          test "$code" = 204 || { cat /tmp/response.txt >&2; echo "unexpected dispatch status $code" >&2; exit 1; }
          echo 'TAMMUZ_V2_DISPATCH_ACCEPTED'
