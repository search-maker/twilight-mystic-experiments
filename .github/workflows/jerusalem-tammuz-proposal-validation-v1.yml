name: Jerusalem Tammuz direct-MYSTIC proposal no-solver validation

on:
  push:
    branches:
      - 'review/jerusalem-tammuz-direct-mystic-proposal-validation-v1'
    paths:
      - '.github/workflows/jerusalem-tammuz-proposal-validation-v1.yml'
      - 'experiments/jerusalem-tammuz-direct-mystic-v1/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROPOSAL_SHA: abe11fa05e7b5008962e066507ca144926598fb8
      APPLICATION_SHA: e2d5b761206b6223526f6f79fcb0af5f6de3ba06
      EVIDENCE_RUN_ID: '33025015603'
      EVIDENCE_ARTIFACT_ID: '9628151845'
      EVIDENCE_DIGEST: sha256:42ed5920f88428c768bc25f7203de7ea48173fe541f857f9fedcc42efaec1008
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Bind validator to exact proposal parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$PROPOSAL_SHA"

      - name: Semantic proposal validation only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import math
          import os
          from pathlib import Path

          root = Path('experiments/jerusalem-tammuz-direct-mystic-v1')
          expected_files = {
              'README.md',
              'analysis-contract.json',
              'level-b-event-evidence.json',
              'manifest.proposal.json',
          }
          actual_files = {p.name for p in root.iterdir() if p.is_file()}
          assert actual_files == expected_files, (actual_files, expected_files)
          assert not any('authorization' in p.name.lower() for p in root.iterdir())

          manifest = json.loads((root / 'manifest.proposal.json').read_text())
          evidence = json.loads((root / 'level-b-event-evidence.json').read_text())
          analysis = json.loads((root / 'analysis-contract.json').read_text())

          def close(a, b, tol=1e-12):
              assert math.isclose(float(a), float(b), rel_tol=0.0, abs_tol=tol), (a, b)

          app_sha = os.environ['APPLICATION_SHA']
          run_id = int(os.environ['EVIDENCE_RUN_ID'])
          artifact_id = int(os.environ['EVIDENCE_ARTIFACT_ID'])
          digest = os.environ['EVIDENCE_DIGEST']

          assert manifest['schemaVersion'] == 1
          assert manifest['batchId'] == 'jerusalem-tammuz-three-star-direct-mystic-v1'
          assert manifest['mode'] == 'scientific-proposal'
          assert manifest['proposalOnly'] is True
          assert manifest['scientificExecution'] is False
          assert manifest['successDoesNotAuthorizeProduction'] is True
          assert manifest['adapterId'] == 'mystic-cross-geometry-v1'
          assert manifest['proposalBaseScienceSha'] == '225077416cc4e5a6c17f7fe4b8977cbcab87ec08'

          event = manifest['preregisteredEvent']
          assert event['civilDate'] == '2026-06-16'
          assert event['hebrewLabel'] == '1 Tammuz 5786'
          close(event['eventTimeMs'], 1781629701483.5, 1e-6)
          close(event['sunsetTimeMs'], 1781628380546, 1e-6)
          close(event['minutesAfterSunset'], 22.015625)
          close(event['sunDepressionDeg'], 4.8882245305886585)
          close(event['site']['observerElevationM'], 800)
          close(event['atmosphere']['aod550'], 0.18)
          assert event['threeStarSemantics']['requiredCount'] == 3
          assert event['threeStarSemantics']['stabilitySeconds'] == 60
          assert event['threeStarSemantics']['magnitudeBasis'] == 'effective'
          close(event['threeStarSemantics']['magnitudeThreshold'], 1.7)
          close(event['threeStarSemantics']['fieldFactorBaseline'], 3.14)
          assert event['threeStarSemantics']['defaultExclusions'] == ['Venus','Jupiter','Sirius','Mars']
          assert event['threeStarSemantics']['planetsCountTowardLevelBThreeStar'] is False

          source = event['sourceEvidence']
          assert source['applicationHeadSha'] == app_sha
          assert source['mergedMainSha'] == app_sha
          assert source['workflowRunId'] == run_id
          assert source['workflowHeadSha'] == 'a6cd5a3edab83f4c1e11164be37acd9d53baf533'
          assert source['artifactId'] == artifact_id
          assert source['artifactDigest'] == digest
          assert source['catalogBasis'] == 'LIVE_DATE_TRANSFORMED_LEVEL_B_DIRECT_CATALOG_HANDOFF'

          runtime = manifest['runtime']
          assert runtime['exactPackageSpec'] == 'rubin-libradtran=2.0.6=py312pl5321he9373c2_1'
          assert runtime['uvspecSha256'] == '2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3'
          assert runtime['runtimeLockRawSha256'] == '3b5fbec964642b04c73a6423b3355dbcc4ba5e84f9614f6d74420491bacc20c5'

          limits = manifest['limits']
          assert limits == {
              'maximumCases': 12,
              'maximumParallel': 6,
              'maximumConfiguredMcPhotonsSum': 240000000,
              'perCaseTimeoutSeconds': 900,
          }
          frozen = manifest['frozenInputs']
          assert frozen['wavelengthDomainNm'] == [380, 780]
          assert frozen['molecularAbsorption'] == 'crs'
          assert frozen['mcSpherical'] == '1D'
          close(frozen['alisSpectralImportanceSamplingNm'], 405.0)
          close(frozen['albedo'], 0.15)
          assert frozen['dataPaths']['atmosphere']['path'] == 'atmmod/afglus.dat'

          expected_geometry = {
              'tammuz-alkaid-hr5191': ('HR 5191', 71.09332700558907, 78.75404006373856, 2.2147784027078745, 2.386336708958328, 0.17155830625045382, False),
              'tammuz-alioth-hr4905': ('HR 4905', 65.83570230161766, 53.77036225185543, 2.1369373734402064, 2.2322564242413763, 0.09531905080116959, False),
              'tammuz-regulus-hr3982': ('HR 3982', 44.24794686376737, 46.8700290856782, 1.8286998273857202, 1.8294164183355677, 0.0007165909498474161, True),
          }
          geometries = manifest['geometries']
          assert len(geometries) == 3
          assert {g['geometryId'] for g in geometries} == set(expected_geometry)
          for g in geometries:
              catalog_id, alt, raz, app_v, lim_v, margin, completing = expected_geometry[g['geometryId']]
              assert g['target']['catalogId'] == catalog_id
              close(g['sunDepressionDeg'], 4.8882245305886585)
              close(g['targetAltitudeDeg'], alt)
              close(g['relativeAzimuthDeg'], raz)
              close(g['observerElevationM'], 800)
              close(g['aod550'], 0.18)
              close(g['levelBEventSample']['apparentVMagAtEye'], app_v)
              close(g['levelBEventSample']['limitingVMagnitude'], lim_v)
              close(g['levelBEventSample']['visibilityMarginMag'], margin)
              assert bool(g.get('completingStar', False)) is completing

          cases = manifest['cases']
          assert len(cases) == 12
          assert [c['ordinal'] for c in cases] == list(range(1, 13))
          assert len({c['caseId'] for c in cases}) == 12
          assert len({c['seed'] for c in cases}) == 12
          assert sum(c['photonHistories'] for c in cases) == 240000000
          assert all(c['photonHistories'] == 20000000 for c in cases)
          geometry_ids = set(expected_geometry)
          assert {c['groupId'] for c in cases} == geometry_ids
          for gid in geometry_ids:
              group = [c for c in cases if c['groupId'] == gid]
              assert len(group) == 4
              assert sorted(c['method'] for c in group) == ['alis','alis','reference-vroom','reference-vroom']
              for method in ('alis','reference-vroom'):
                  assert sorted(c['block'] for c in group if c['method'] == method) == [1,2]
          assert all(79301 <= c['seed'] <= 79422 for c in cases)
          assert manifest['proposalBoundary']['authorizationPresent'] is False
          assert manifest['proposalBoundary']['scientificExecutionAllowedByThisManifest'] is False
          assert manifest['proposalBoundary']['noMysticExecutionAtProposalStage'] is True
          assert manifest['proposalBoundary']['pandoraOpened'] is False

          assert evidence['applicationMainSha'] == app_sha
          assert evidence['source']['workflowRunId'] == run_id
          assert evidence['source']['artifactId'] == artifact_id
          assert evidence['source']['artifactDigest'] == digest
          assert evidence['source']['catalogBasis'] == 'LIVE_DATE_TRANSFORMED_LEVEL_B_DIRECT_CATALOG_HANDOFF'
          assert evidence['source']['rawCatalogCount'] == 9090
          assert evidence['source']['transformedCatalogCount'] == 7653
          close(evidence['event']['eventTimeMsFromThreeStarResult'], event['eventTimeMs'], 1e-6)
          close(evidence['event']['sunDepressionDeg'], event['sunDepressionDeg'])
          close(evidence['event']['aod550'], 0.18)
          close(evidence['event']['fieldFactor'], 3.14)
          assert len(evidence['stars']) == 3
          by_id = {s['catalogId']: s for s in evidence['stars']}
          assert set(by_id) == {'HR 5191','HR 4905','HR 3982'}
          for g in geometries:
              s = by_id[g['target']['catalogId']]
              close(s['eventGeometry']['targetAltitudeDeg'], g['targetAltitudeDeg'])
              close(s['eventGeometry']['relativeAzimuthDeg'], g['relativeAzimuthDeg'])
              close(s['stellar']['apparentVMagAtEye'], g['levelBEventSample']['apparentVMagAtEye'])
              close(s['visibility']['limitingVMagnitude'], g['levelBEventSample']['limitingVMagnitude'])
              close(s['visibility']['visibilityMarginMag'], g['levelBEventSample']['visibilityMarginMag'])
              spectral = s['skyChannels']['spectral']
              assert spectral['available'] is False
              assert spectral['reason'] == 'VALIDATED_V3_PRIMARY_PROVIDER_SPECTRAL_RUNTIME_NOT_IMPLEMENTED'
              samples = s['stabilitySamples']
              assert [x['offsetSeconds'] for x in samples] == [0,30,60]
              assert all(x['visibilityMarginMag'] >= 0 for x in samples)
          assert by_id['HR 3982']['completingStar'] is True

          assert analysis['analysisId'] == 'jerusalem-tammuz-direct-mystic-level-b-comparison-v1'
          assert analysis['status'] == 'PREREGISTERED_ANALYSIS_NO_EXECUTION'
          assert analysis['scientificExecution'] is False
          assert analysis['inputs']['applicationMainSha'] == app_sha
          assert analysis['inputs']['sourceEvidenceRunId'] == run_id
          assert analysis['inputs']['sourceEvidenceArtifactId'] == artifact_id
          assert analysis['inputs']['sourceEvidenceArtifactDigest'] == digest
          assert analysis['inputs']['humanThresholdGitBlobSha1'] == 'bb4cd0ff02159ecffe276022cec9d292c7a434a3'
          assert analysis['inputs']['derivedChannelsGitBlobSha1'] == 'ccfd04d4c21188966351f4257e92893d7ce340c7'
          assert analysis['methodRoles']['alis']['expectedOutputGrid'] == {'nodeCount':8001,'startNm':380.0,'stopNm':780.0,'stepNm':0.05}
          assert analysis['levelBComparison']['rawCatalogReconstructionAllowed'] is False
          assert analysis['levelBComparison']['fullSpectrumLevelBValidationClaimAllowed'] is False
          close(analysis['skyOnlyVisibilitySubstitution']['fieldFactor'], 3.14)
          close(analysis['structuralRequirements']['aod550'], 0.18)
          close(analysis['structuralRequirements']['observerElevationM'], 800)
          close(analysis['structuralRequirements']['surfaceAlbedo'], 0.15)
          assert analysis['structuralRequirements']['mcSpherical'] == '1D'
          assert analysis['structuralRequirements']['atmosphere'] == 'AFGLUS'
          assert analysis['structuralRequirements']['retryAllowed'] is False
          assert analysis['structuralRequirements']['resumeAllowed'] is False
          assert analysis['structuralRequirements']['rerunAllowed'] is False
          assert analysis['proposalGate']['authorizationMustRemainAbsentOrDisabled'] is True
          assert analysis['proposalGate']['scientificExecutionMustRemainFalse'] is True
          assert analysis['proposalGate']['noUvspecSyntaxInvocationAtProposalValidation'] is True
          assert analysis['proposalGate']['noMysticSolverInvocationAtProposalValidation'] is True
          assert analysis['claimBoundary']['pandoraOpened'] is False
          assert analysis['claimBoundary']['noParameterTuning'] is True

          for p in root.glob('*.json'):
              text = p.read_text()
              assert '"authorized": true' not in text
              assert '"scientificExecution": true' not in text

          print('TAMMUZ_PROPOSAL_VALIDATION=PASS')
          print('cases=12 photons=240000000 geometries=3 F=3.14 AOD550=0.18')
          print('source_run=33025015603 source_artifact=9628151845 transformed_rows=7653')
          PY

      - name: Prove no libRadtran solver is available or invoked
        shell: bash
        run: |
          set -euo pipefail
          if command -v uvspec >/dev/null 2>&1; then
            echo 'Unexpected uvspec on proposal-validation runner' >&2
            exit 1
          fi
          echo 'NO_UVSPEC_NO_MYSTIC_EXECUTION=PASS'
