name: Jerusalem Three-Star current UI audit

on:
  pull_request:
    paths:
      - '.github/workflows/jerusalem-three-star-current-ui-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APPLICATION_REPO: search-maker/starsvisibility
      APPLICATION_SHA: 80bb46110067567afbd92d5bb6b9316087e58e25
      STARSVISIBILITY_READ_TOKEN: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Require read-only application credential
        shell: bash
        run: test -n "${STARSVISIBILITY_READ_TOKEN:-}" || exit 78
      - name: Checkout exact starsvisibility main
        uses: actions/checkout@v4
        with:
          repository: search-maker/starsvisibility
          ref: ${{ env.APPLICATION_SHA }}
          token: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}
          path: app
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.node-version
      - name: Build exact deployed application
        working-directory: app
        shell: bash
        env:
          GITHUB_SHA: ${{ env.APPLICATION_SHA }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPLICATION_SHA"
          npm ci
          npm run build:pages
      - name: Audit catalog and exact deployed Three-Star controls/runtime
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jerusalem-three-star-ui-audit"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const html = fs.readFileSync('dist/index.html','utf8');
          const raw = JSON.parse(fs.readFileSync('dist/catalog/builtin-stars.json','utf8'));
          const stars = Array.isArray(raw) ? raw : (raw.stars || raw.catalog || raw.rows || []);
          const magnitudes = stars.map(s => Number(s.mag)).filter(Number.isFinite).sort((a,b)=>a-b);
          const tags = {};
          for (const id of ['threeStarCount','threeStarMagnitudeBasis','threeStarMagnitudeThreshold','visibilityEngineMode','observerElevationM']) {
            const re = new RegExp(`<(?:input|select)\\b[^>]*\\bid=["']${id}["'][^>]*>`, 'i');
            tags[id] = html.match(re)?.[0] || null;
          }
          const options = {};
          for (const id of ['threeStarMagnitudeBasis','visibilityEngineMode']) {
            const re = new RegExp(`<select\\b[^>]*\\bid=["']${id}["'][^>]*>([\\s\\S]*?)<\\/select>`, 'i');
            options[id] = html.match(re)?.[1] || null;
          }
          const summary = {
            applicationSha: process.env.APPLICATION_SHA,
            catalogCount: stars.length,
            finiteMagnitudeCount: magnitudes.length,
            magnitudeCounts: {
              lt3: magnitudes.filter(x=>x<3).length,
              gte3_lt3_5: magnitudes.filter(x=>x>=3 && x<3.5).length,
              gte3_lt4: magnitudes.filter(x=>x>=3 && x<4).length,
              gte3_lt4_5: magnitudes.filter(x=>x>=3 && x<4.5).length,
              gte3_lt5: magnitudes.filter(x=>x>=3 && x<5).length,
              gte3: magnitudes.filter(x=>x>=3).length,
            },
            first40EligibleAtOrFainterThan3: stars.filter(s=>Number(s.mag)>=3).sort((a,b)=>Number(a.mag)-Number(b.mag)).slice(0,40).map(s=>({name:s.name,mag:Number(s.mag),ra:s.raHours ?? s.ra,dec:s.decDeg ?? s.dec,hip:s.hip ?? null,hr:s.hr ?? null})),
            controlTags: tags,
            selectBodies: options,
            runtimeMarkers: {
              stableSimultaneous: html.includes('findStableSimultaneousVisibilityEvent'),
              stableSimultaneousQualifier: html.includes('findStableSimultaneousVisibilityEventWithQualifier'),
              laterFirstVisibleRouter: html.includes('__levelBSitewideRecomputeThreeStar({ lat, lon, startMs, endMs, stars, levelBInputs })'),
              consecutiveRuntime: html.includes('LEVEL-B-THREE-STAR-CONSECUTIVE-V1'),
              knownExclusionDefaultFour: html.includes('STARS-KNOWN-EXCLUSION-DEFAULT-FOUR-V1'),
            },
            claimBoundary: 'read-only current deployed UI/catalog audit; no science result',
          };
          const out = path.join(process.env.RUNNER_TEMP,'jerusalem-three-star-ui-audit','summary.json');
          fs.writeFileSync(out, JSON.stringify(summary,null,2)+'\n');
          console.log(JSON.stringify(summary,null,2));
          NODE
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jerusalem-three-star-current-ui-audit-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/jerusalem-three-star-ui-audit/summary.json
