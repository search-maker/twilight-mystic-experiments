name: Jerusalem Three-Star transient events v2

on:
  pull_request:
    paths:
      - '.github/workflows/jerusalem-three-star-transient-v2.yml'

permissions:
  contents: read

jobs:
  transient-event:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - label: tishrei-transient
            civil_date: '2025-09-23'
            hebrew_label: '1 Tishrei 5786'
          - label: nisan-transient
            civil_date: '2026-03-19'
            hebrew_label: '1 Nisan 5786'
          - label: tammuz-transient
            civil_date: '2026-06-16'
            hebrew_label: '1 Tammuz 5786'
    env:
      APPLICATION_REPO: search-maker/starsvisibility
      APPLICATION_SHA: 0ac8c551738354bdde320b50d6facac40d7acb9a
      STARSVISIBILITY_READ_TOKEN: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}
      CASE_LABEL: ${{ matrix.label }}
      CASE_DATE: ${{ matrix.civil_date }}
      HEBREW_LABEL: ${{ matrix.hebrew_label }}
      ENGINE_MODE: level-b-v3-crumey-blackwell-transient-experimental
      LATITUDE_DEG: '31.778'
      LONGITUDE_DEG: '35.235'
      OBSERVER_ELEVATION_M: '800'
      TIME_ZONE: Asia/Jerusalem
      MAGNITUDE_BASIS: effective
      MAGNITUDE_THRESHOLD: '1.7'
      REQUIRED_COUNT: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Require read-only application credential
        shell: bash
        run: test -n "${STARSVISIBILITY_READ_TOKEN:-}" || exit 78
      - name: Checkout exact starsvisibility PR109 head
        uses: actions/checkout@v4
        with:
          repository: search-maker/starsvisibility
          ref: ${{ env.APPLICATION_SHA }}
          token: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}
          path: app
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.node-version
      - name: Build exact application
        working-directory: app
        shell: bash
        env:
          GITHUB_SHA: ${{ env.APPLICATION_SHA }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPLICATION_SHA"
          npm ci
          npm run build:pages
          grep -q 'LEVEL-B-THREE-STAR-DIRECT-CATALOG-HANDOFF-V3' dist/work-in-progress/index.html
          grep -q 'LEVEL-B-THREE-STAR-CATALOG-ONLY-WORKER-BYPASS-V1' dist/work-in-progress/index.html
          grep -q "fieldFactor: 3.14" scientific-tools/visibility-v3/level-b-current-main-adapter.mjs
          grep -q 'INITIAL_CONTIGUOUS_COMMON_SKY_STELLAR_SUPPORT_ONLY_FAIL_CLOSED_AFTER_GAP_V2' scientific-tools/visibility-v3/level-b-current-main-adapter.mjs
      - name: Install Chromium
        working-directory: app
        shell: bash
        run: npx playwright install --with-deps chromium
      - name: Run frozen transient event
        shell: bash
        run: |
          set -euo pipefail
          cp review/jerusalem-three-star-exact-events-v2/run.mjs app/jerusalem-event-v2.mjs
          python3 -m http.server 4173 --bind 127.0.0.1 --directory app/dist > "$RUNNER_TEMP/jerusalem-transient-v2-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:4173/work-in-progress/ >/dev/null && break; sleep 0.2; done
          cd app
          node jerusalem-event-v2.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jerusalem-three-star-v2-${{ matrix.label }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: ${{ runner.temp }}/jerusalem-three-star-exact-events-v2/${{ matrix.label }}.json
