name: Jerusalem Tishrei direct-MYSTIC v2 package validation

on:
  pull_request:
    paths:
      - '.github/workflows/jerusalem-tishrei-direct-mystic-v2-package-validation.yml'
      - '.github/workflows/jerusalem-tishrei-direct-mystic-v2-execution.yml'
      - 'experiments/jerusalem-tishrei-direct-mystic-v2/**'
      - 'experiments/jerusalem-tishrei-direct-mystic-v1/manifest.proposal.json'
      - 'experiments/jerusalem-tishrei-direct-mystic-v1/level-b-event-evidence.json'
      - 'experiments/jerusalem-tishrei-direct-mystic-v1/analysis-contract.json'
      - 'experiments/jerusalem-tishrei-direct-mystic-v1/execution_adapter.py'
      - 'experiments/jerusalem-tishrei-direct-mystic-v1/execution_guard.py'
      - 'experiments/jerusalem-tishrei-direct-mystic-v1/authorization_proposal.py'
      - 'experiments/jerusalem-tishrei-direct-mystic-v1/validate_elevation_repair_v2.py'
      - 'experiments/mystic-batch-v1/cross_geometry_adapter.py'
      - 'experiments/mystic-batch-v1/cross_geometry_execution_adapter.py'
      - 'experiments/mystic-batch-v1/twilight_surrogate_tier1_execution_adapter.py'
      - 'experiments/mystic-batch-v1/scientific_case_executor.py'
      - 'experiments/mystic-batch-v1/scientific_aggregate.py'
      - 'experiments/mystic-batch-v1/scientific_audit.py'
      - 'experiments/mystic-batch-v1/duplicate_run_audit.py'
      - 'experiments/mystic-batch-v1/runtime_probe.py'

permissions:
  contents: read

jobs:
  validate-no-uvspec:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APPLICATION_SHA: e2d5b761206b6223526f6f79fcb0af5f6de3ba06
      PACKAGE: experiments/jerusalem-tishrei-direct-mystic-v2
      AUTHORIZATION: experiments/jerusalem-tishrei-direct-mystic-v2/authorization.scientific.json
      LANE_PREREG: experiments/jerusalem-tishrei-direct-mystic-v2/lane.preregistration.json
      PROPOSAL: experiments/jerusalem-tishrei-direct-mystic-v1/manifest.proposal.json
      EVIDENCE: experiments/jerusalem-tishrei-direct-mystic-v1/level-b-event-evidence.json
      ANALYSIS_CONTRACT: experiments/jerusalem-tishrei-direct-mystic-v1/analysis-contract.json
      PROPOSAL_ADAPTER: experiments/mystic-batch-v1/cross_geometry_adapter.py
      EXECUTION_ADAPTER: experiments/jerusalem-tishrei-direct-mystic-v1/execution_adapter.py
      EXECUTION_WORKFLOW: .github/workflows/jerusalem-tishrei-direct-mystic-v2-execution.yml
      RUNTIME_LOCK: experiments/mystic-batch-v1/runtime-lock.micromamba.json
      PLAN: experiments/jerusalem-tishrei-direct-mystic-v2/execution_plan.py
      ANALYSIS_DRIVER: experiments/jerusalem-tishrei-direct-mystic-v1/analyze_direct_sky.py
      VISIBILITY_HELPER: experiments/jerusalem-tishrei-direct-mystic-v1/compute_sky_only_visibility.mjs
      DERIVED_CHANNELS: experiments/aerosol-family-challenge-v2/derived_channels.py
      HUMAN_THRESHOLD: scientific-tools/visibility-v3/human-threshold.mjs
      EXECUTOR: experiments/mystic-batch-v1/scientific_case_executor.py
      AGGREGATE: experiments/mystic-batch-v1/scientific_aggregate.py
      AUDIT: experiments/mystic-batch-v1/scientific_audit.py
      AUTHORIZATION_PROPOSAL_BUILDER: experiments/jerusalem-tishrei-direct-mystic-v2/authorization_proposal.py
      EXPECTED_EXECUTION_KEY: jerusalem-tishrei-direct-mystic-v2:diagnostic:1
      EXPECTED_AUTHORIZATION_ORDINAL: '1'
    steps:
      - name: Check out exact PR head with full ancestry
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require read-only application credential
        shell: bash
        env:
          STARSVISIBILITY_READ_TOKEN: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}
        run: test -n "${STARSVISIBILITY_READ_TOKEN:-}" || exit 78
      - name: Check out exact frozen starsvisibility application
        uses: actions/checkout@v4
        with:
          repository: search-maker/starsvisibility
          ref: ${{ env.APPLICATION_SHA }}
          token: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}
          path: app
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.node-version
      - name: Compile v2 governance and verify source-science boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-output
          python -m py_compile "$PACKAGE/authorization_proposal.py" "$PACKAGE/execution_guard.py" "$PACKAGE/execution_plan.py" "$EXECUTION_ADAPTER"
          node --check "$VISIBILITY_HELPER"
          test "$(git -C app rev-parse HEAD)" = "$APPLICATION_SHA"
          python - <<'PY'
          import json, os
          from pathlib import Path
          lane=json.loads(Path(os.environ['LANE_PREREG']).read_text())
          proposal=json.loads(Path(os.environ['PROPOSAL']).read_text())
          evidence=json.loads(Path(os.environ['EVIDENCE']).read_text())
          contract=json.loads(Path(os.environ['ANALYSIS_CONTRACT']).read_text())
          smoke=json.loads(Path('experiments/jerusalem-tishrei-elevated-site-smoke-v2-recovery2/gate.smoke-recovery2.json').read_text())
          assert lane['laneId']=='jerusalem-tishrei-direct-mystic-v2'
          assert lane['status']=='PREREGISTERED_NO_EXECUTION' and lane['scientificExecution'] is False
          assert lane['futureAuthorization']['executionKey']==os.environ['EXPECTED_EXECUTION_KEY']
          assert lane['futureAuthorization']['authorizationOrdinal']==1
          assert lane['sourceScientificPayload']['caseCount']==12
          assert lane['sourceScientificPayload']['configuredPhotonHistoriesSum']==240_000_000
          assert lane['sourceScientificPayload']['fieldFactorBaseline']==3.14
          assert lane['sourceScientificPayload']['aod550']==0.22
          assert lane['sourceScientificPayload']['observerElevationM']==800
          assert lane['claimBoundary']['noParameterTuning'] is True
          assert lane['claimBoundary']['productionAuthorized'] is False
          assert lane['claimBoundary']['pandoraOpened'] is False
          assert proposal['preregisteredEvent']['threeStarSemantics']['fieldFactorBaseline']==3.14
          assert proposal['preregisteredEvent']['atmosphere']['aod550']==0.22
          assert len(proposal['geometries'])==3 and len(proposal['cases'])==12
          assert sum(c['photonHistories'] for c in proposal['cases'])==240_000_000
          assert {c['method'] for c in proposal['cases']}=={'reference-vroom','alis'}
          assert evidence['applicationMainSha']==os.environ['APPLICATION_SHA']
          assert evidence['event']['fieldFactor']==3.14 and evidence['event']['aod550']==0.22
          assert len(evidence['stars'])==3
          assert contract['skyOnlyVisibilitySubstitution']['fieldFactor']==3.14
          assert contract['skyOnlyVisibilitySubstitution']['noParameterTuning'] is True
          assert contract['methodRoles']['alis']['expectedOutputGrid']=={'nodeCount':8001,'startNm':380.0,'stopNm':780.0,'stepNm':0.05}
          assert contract['methodRoles']['referenceVroom']['forbiddenUse'].startswith('do not derive')
          assert contract['claimBoundary']['productionAuthorized'] is False
          assert contract['claimBoundary']['fullSpectrumLevelBValidated'] is False
          assert contract['claimBoundary']['pandoraOpened'] is False
          assert smoke['stageId']=='jerusalem-tishrei-elevated-site-smoke-v2-recovery2'
          assert smoke['consumed'] is True and smoke['enabled'] is False
          assert smoke['executionKey']=='jerusalem-tishrei-elevated-site-smoke-v2:infrastructure:3'
          assert smoke['smokeOrdinal']==3
          note=str(smoke['note'])
          assert '33011713466' in note and '9622825000' in note and 'bd13fae624385476c73094e8d3a0019d403689bbfba640248c0173f1451598de' in note
          adapter=Path(os.environ['EXECUTION_ADAPTER']).read_text()
          assert 'EXPECTED_AOD550 = 0.22' in adapter
          assert 'EXPECTED_OBSERVER_ELEVATION_M = 800.0' in adapter
          assert 'atm_z_grid' in adapter and 'zout 0.000000' in adapter
          print('V2_FROZEN_SOURCE_AND_SMOKE_BOUNDARY_PASS')
          PY
      - name: Refuse bundled source-science mutation in v2 lane changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" HEAD > validation-output/pr-changed-files.txt
          python - <<'PY'
          from pathlib import Path
          changed=[x.strip() for x in Path('validation-output/pr-changed-files.txt').read_text().splitlines() if x.strip()]
          allowed_prefixes=(
              'experiments/jerusalem-tishrei-direct-mystic-v2/',
              '.github/workflows/jerusalem-tishrei-direct-mystic-v2-',
          )
          bad=[p for p in changed if not p.startswith(allowed_prefixes)]
          assert not bad, f'v2 PR must not bundle source-science/dependency changes: {bad}'
          print('V2_PR_CHANGE_SCOPE_PASS', len(changed))
          PY
      - name: Classify v2 authorization lifecycle
        id: auth-state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          a=json.loads(Path(os.environ['AUTHORIZATION']).read_text())
          base={
              'stageId':'cross-geometry-pilot-v1',
              'scientificPurpose':'jerusalem-tishrei-direct-mystic-v2',
              'laneId':'jerusalem-tishrei-direct-mystic-v2',
              'successDoesNotAuthorizeProduction':True,
              'requiredSmokeRunId':33011713466,
              'requiredSmokeAuditArtifactId':9622825000,
              'requiredSmokeAuditArtifactDigest':'sha256:bd13fae624385476c73094e8d3a0019d403689bbfba640248c0173f1451598de',
          }
          stale={k:(a.get(k),v) for k,v in base.items() if a.get(k)!=v}
          assert not stale, stale
          pristine=(
              a.get('authorized') is False and a.get('scientificExecution') is False and
              a.get('scientificDiagnostic') is False and a.get('consumed') is False and
              a.get('authorizationOrdinal')==0 and a.get('executionKey') is None and
              a.get('exactAuthorizationParentCommit') is None and a.get('exactAuthorizationCommit') is None
          )
          enabled=(
              a.get('authorized') is True and a.get('scientificExecution') is True and
              a.get('scientificDiagnostic') is True and a.get('consumed') is False and
              a.get('authorizationOrdinal')==1 and a.get('executionKey')==os.environ['EXPECTED_EXECUTION_KEY'] and
              isinstance(a.get('exactAuthorizationParentCommit'),str) and len(a['exactAuthorizationParentCommit'])==40 and
              a.get('exactAuthorizationCommit') is None
          )
          consumed=(
              a.get('authorized') is False and a.get('scientificExecution') is False and
              a.get('scientificDiagnostic') is False and a.get('consumed') is True and
              a.get('authorizationOrdinal')==1 and a.get('executionKey')==os.environ['EXPECTED_EXECUTION_KEY']
          )
          if pristine: mode='preauth'
          elif enabled: mode='enabled'
          elif consumed: mode='consumed'
          else: raise SystemExit(f'unsupported/unsafe v2 authorization lifecycle: {a}')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f'mode={mode}\n')
          Path('validation-output/authorization-state.json').write_text(json.dumps({'mode':mode,'authorization':a},indent=2,sort_keys=True)+'\n')
          print('V2_AUTHORIZATION_LIFECYCLE_PASS', mode)
          PY
      - name: Build exact v2 authorization proposal only
        if: steps.auth-state.outputs.mode == 'preauth'
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          python "$AUTHORIZATION_PROPOSAL_BUILDER" --repository-root . --application-root app --output validation-output/authorization-proposal.json
          python - <<'PY'
          import json, os
          p=json.load(open('validation-output/authorization-proposal.json'))
          a=p['proposedAuthorization']
          assert p['status']=='V2_PROPOSAL_ONLY_NOT_AUTHORIZATION'
          assert p['executionAuthorizedByProposal'] is False
          assert p['requiredSmokeRunId']==33011713466
          assert a['authorized'] is True and a['scientificExecution'] is True and a['scientificDiagnostic'] is True
          assert a['scientificPurpose']=='jerusalem-tishrei-direct-mystic-v2'
          assert a['executionKey']==os.environ['EXPECTED_EXECUTION_KEY'] and a['authorizationOrdinal']==1
          assert a['requiredSmokeRunId']==33011713466 and a['requiredSmokeAuditArtifactId']==9622825000
          assert a['exactAuthorizationParentCommit']==p['sourceCommit'] and a['exactAuthorizationCommit'] is None
          for field in ('proposalRawSha256','executionAdapterRawSha256','executionWorkflowRawSha256','planRawSha256','lanePreregistrationRawSha256','v2ExecutionGuardRawSha256','smokeRecovery2GateRawSha256','elevationHelperRawSha256','duplicateRunAuditRawSha256','runtimeProbeRawSha256'):
              assert isinstance(a.get(field),str) and len(a[field])==64, field
          print('V2_AUTHORIZATION_PROPOSAL_ONLY_PASS')
          PY
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
      - name: Simulate one-purpose v2 authorization and validate exact guard plus plan
        if: steps.auth-state.outputs.mode == 'preauth'
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          python - <<'PY'
          import json, os
          p=json.load(open('validation-output/authorization-proposal.json'))
          with open(os.environ['AUTHORIZATION'],'w') as f:
              json.dump(p['proposedAuthorization'],f,indent=2,sort_keys=True)
              f.write('\n')
          PY
          test "$(git diff --name-only)" = "$AUTHORIZATION"
          git config user.name 'tishrei-v2-package-validation'
          git config user.email 'tishrei-v2-package-validation@invalid.local'
          git add "$AUTHORIZATION"
          git commit -m 'LOCAL TEST ONLY - v2 one-purpose scientific authorization'
          TEST_AUTH_SHA="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = "$AUTHORIZATION"
          env GITHUB_ACTIONS=true GITHUB_EVENT_NAME=workflow_dispatch GITHUB_RUN_ATTEMPT=1 \
            python "$PACKAGE/execution_guard.py" \
            --repository-root . --application-root app --application-sha "$APPLICATION_SHA" \
            --authorization "$AUTHORIZATION" --proposal "$PROPOSAL" --evidence "$EVIDENCE" \
            --analysis-contract "$ANALYSIS_CONTRACT" --proposal-adapter "$PROPOSAL_ADAPTER" \
            --execution-adapter "$EXECUTION_ADAPTER" --execution-workflow "$EXECUTION_WORKFLOW" \
            --runtime-lock "$RUNTIME_LOCK" --plan "$PLAN" --analysis-driver "$ANALYSIS_DRIVER" \
            --visibility-helper "$VISIBILITY_HELPER" --derived-channels "$DERIVED_CHANNELS" \
            --human-threshold "$HUMAN_THRESHOLD" --executor "$EXECUTOR" --aggregate "$AGGREGATE" \
            --audit "$AUDIT" --authorization-proposal-builder "$AUTHORIZATION_PROPOSAL_BUILDER" \
            --authorization-ref "$TEST_AUTH_SHA" --execution-key "$EXPECTED_EXECUTION_KEY" \
            --authorization-ordinal "$EXPECTED_AUTHORIZATION_ORDINAL" --output validation-output/guard-report.json
          python "$PLAN" --proposal "$PROPOSAL" --guard-report validation-output/guard-report.json --output validation-output/plan.json
          python - <<'PY'
          import json
          g=json.load(open('validation-output/guard-report.json'))
          p=json.load(open('validation-output/plan.json'))
          assert g['status']=='AUTHORIZED_V2_AFTER_FORMAL_SMOKE_PASS'
          assert g['laneId']=='jerusalem-tishrei-direct-mystic-v2'
          assert g['caseCount']==12 and g['configuredMcPhotonsSum']==240_000_000
          assert g['requiredSmokeRunId']==33011713466 and g['requiredSmokeAuditArtifactId']==9622825000
          assert p['scientificPurpose']=='jerusalem-tishrei-direct-mystic-v2'
          assert p['caseCount']==12 and p['configuredMcPhotonsSum']==240_000_000 and p['maximumParallel']==6
          assert len(p['matrix']['include'])==12
          print('V2_GUARD_AND_12_CASE_PLAN_PASS')
          PY
      - name: Validate real enabled one-purpose v2 authorization PR without execution
        if: steps.auth-state.outputs.mode == 'enabled'
        shell: bash
        run: |
          set -euo pipefail
          TEST_AUTH_SHA="$(git rev-parse HEAD)"
          test "$(git diff --name-only HEAD^ HEAD)" = "$AUTHORIZATION"
          env GITHUB_ACTIONS=true GITHUB_EVENT_NAME=workflow_dispatch GITHUB_RUN_ATTEMPT=1 \
            python "$PACKAGE/execution_guard.py" \
            --repository-root . --application-root app --application-sha "$APPLICATION_SHA" \
            --authorization "$AUTHORIZATION" --proposal "$PROPOSAL" --evidence "$EVIDENCE" \
            --analysis-contract "$ANALYSIS_CONTRACT" --proposal-adapter "$PROPOSAL_ADAPTER" \
            --execution-adapter "$EXECUTION_ADAPTER" --execution-workflow "$EXECUTION_WORKFLOW" \
            --runtime-lock "$RUNTIME_LOCK" --plan "$PLAN" --analysis-driver "$ANALYSIS_DRIVER" \
            --visibility-helper "$VISIBILITY_HELPER" --derived-channels "$DERIVED_CHANNELS" \
            --human-threshold "$HUMAN_THRESHOLD" --executor "$EXECUTOR" --aggregate "$AGGREGATE" \
            --audit "$AUDIT" --authorization-proposal-builder "$AUTHORIZATION_PROPOSAL_BUILDER" \
            --authorization-ref "$TEST_AUTH_SHA" --execution-key "$EXPECTED_EXECUTION_KEY" \
            --authorization-ordinal "$EXPECTED_AUTHORIZATION_ORDINAL" --output validation-output/guard-report.json
          python "$PLAN" --proposal "$PROPOSAL" --guard-report validation-output/guard-report.json --output validation-output/plan.json
          python - <<'PY'
          import json
          g=json.load(open('validation-output/guard-report.json'))
          p=json.load(open('validation-output/plan.json'))
          assert g['status']=='AUTHORIZED_V2_AFTER_FORMAL_SMOKE_PASS'
          assert p['caseCount']==12 and p['configuredMcPhotonsSum']==240_000_000
          print('REAL_V2_ONE_PURPOSE_AUTHORIZATION_PASS_NO_EXECUTION')
          PY
      - name: Validate consumed v2 archive and forbid reauthorization
        if: steps.auth-state.outputs.mode == 'consumed'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          a=json.loads(Path(os.environ['AUTHORIZATION']).read_text())
          note=str(a.get('note',''))
          assert a['consumed'] is True and a['authorized'] is False and a['scientificExecution'] is False
          assert a['executionKey']==os.environ['EXPECTED_EXECUTION_KEY'] and a['authorizationOrdinal']==1
          assert 'Consumed' in note or 'consumed' in note
          report={'schemaVersion':1,'status':'V2_CONSUMED_ARCHIVE_PASS_NO_REAUTHORIZATION','executionKey':a['executionKey'],'authorizationOrdinal':1,'consumed':True,'boundary':'historical scientific authorization; never reuse or rerun'}
          Path('validation-output/v2-consumed-archive.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report,sort_keys=True))
          PY
          set +e
          python "$AUTHORIZATION_PROPOSAL_BUILDER" --repository-root . --application-root app --output validation-output/forbidden-v2-reauthorization.json >validation-output/forbidden-v2-reauthorization.stdout 2>validation-output/forbidden-v2-reauthorization.stderr
          RC=$?
          set -e
          test "$RC" -ne 0
          echo 'V2_REAUTHORIZATION_REFUSED_PASS'
      - name: Prove no uvspec, syntax check, or scientific solver was launched
        shell: bash
        run: |
          set -euo pipefail
          test ! -e case-output
          test ! -e runtime-reports
          test ! -e aggregate-output
          test ! -e audit-output
          test ! -e analysis-output
          echo 'NO_UVSPEC_NO_SYNTAX_NO_SCIENTIFIC_SOLVER_EXECUTED'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jerusalem-tishrei-direct-mystic-v2-package-validation-${{ github.run_id }}
          path: validation-output
          if-no-files-found: warn
          retention-days: 90
