name: Dispatch Jerusalem Tishrei direct-MYSTIC v2 recovery1 exactly once

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/jerusalem-tishrei-direct-mystic-v2-recovery1-dispatch-once.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'review/jerusalem-tishrei-direct-mystic-v2-recovery1-dispatch-once'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      AUTHORIZATION_REF: 1a7c8277fe85fe7d1b4ab8b0bb8a73648f54cadb
      AUTHORIZATION_PARENT: 4e054dd0872fbdbab85349d9330238668735de1f
      EXECUTION_KEY: jerusalem-tishrei-direct-mystic-v2:diagnostic:2
      AUTHORIZATION_ORDINAL: '2'
      TARGET_WORKFLOW: jerusalem-tishrei-direct-mystic-v2-recovery1-execution.yml
      AUTHORIZATION_PATH: experiments/jerusalem-tishrei-direct-mystic-v2-recovery1/authorization.scientific.json
      SMOKE_AUDIT_DIGEST: sha256:bd13fae624385476c73094e8d3a0019d403689bbfba640248c0173f1451598de
      SOURCE_PREFLIGHT_DIGEST: sha256:d9aee0802ecc87ea101972e5248559cd7611ce8791e82e8f86016aca23711919
    steps:
      - name: Verify exact one-purpose recovery1 scientific authorization commit and content
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${AUTHORIZATION_REF}" > /tmp/auth-commit.json
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github.raw+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${AUTHORIZATION_PATH}?ref=${AUTHORIZATION_REF}" > /tmp/auth.json
          python - <<'PY'
          import json, os
          d=json.load(open('/tmp/auth-commit.json'))
          assert d['sha']==os.environ['AUTHORIZATION_REF']
          assert len(d['parents'])==1 and d['parents'][0]['sha']==os.environ['AUTHORIZATION_PARENT']
          assert [f['filename'] for f in d['files']]==[os.environ['AUTHORIZATION_PATH']]
          a=json.load(open('/tmp/auth.json'))
          required={
              'schemaVersion':1,
              'stageId':'cross-geometry-pilot-v1',
              'scientificPurpose':'jerusalem-tishrei-direct-mystic-v2-recovery1',
              'laneId':'jerusalem-tishrei-direct-mystic-v2-recovery1',
              'authorized':True,
              'scientificExecution':True,
              'scientificDiagnostic':True,
              'successDoesNotAuthorizeProduction':True,
              'executionKey':os.environ['EXECUTION_KEY'],
              'batchId':'jerusalem-tishrei-three-star-direct-mystic-v1',
              'authorizationOrdinal':2,
              'consumed':False,
              'exactAuthorizationParentCommit':os.environ['AUTHORIZATION_PARENT'],
              'exactAuthorizationCommit':None,
              'requiredSmokeRunId':33011713466,
              'requiredSmokeAuditArtifactId':9622825000,
              'requiredSmokeAuditArtifactDigest':os.environ['SMOKE_AUDIT_DIGEST'],
              'consumedSourceRunId':33014861225,
              'consumedSourcePreflightArtifactId':9624060978,
              'consumedSourcePreflightArtifactDigest':os.environ['SOURCE_PREFLIGHT_DIGEST'],
          }
          stale={k:(a.get(k),v) for k,v in required.items() if a.get(k)!=v}
          assert not stale, stale
          assert a['proposalRawSha256']=='18a26876102a870aac8ddf907e4742bd8425c86b1bbead9ea8a0570ce633943a'
          assert a['executionAdapterRawSha256']=='af9c4a71dda504814d4a10c3879712d84db2201829256f4876b197030fd8c67b'
          assert a['executionWorkflowRawSha256']=='661fd930d0183571d4088068667a32ccfb66bb1dfac1bcb84f0150b65c19e813'
          assert a['planRawSha256']=='a96817d8d1a5aa43b5f419779e2f4448cebbd0d9096e5ecc771c2e162b620598'
          assert a['recoveryExecutionGuardRawSha256']=='ce2bdb70e683b3bd75cdcd8dcc1210c2b14a8409091b304f552476944d14ad01'
          print('ONE_PURPOSE_TISHREI_V2_RECOVERY1_SCIENTIFIC_AUTHORIZATION_PASS')
          PY
      - name: Refuse if exact target one-shot marker already exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/runs?event=workflow_dispatch&per_page=100" > /tmp/target-runs.json
          python - <<'PY'
          import json, os
          p=json.load(open('/tmp/target-runs.json'))
          runs=p.get('workflow_runs')
          total=p.get('total_count')
          assert isinstance(runs,list) and isinstance(total,int)
          assert total <= len(runs), 'incomplete target workflow-run scan; refusing dispatch'
          marker=f"| key={os.environ['EXECUTION_KEY']} | auth={os.environ['AUTHORIZATION_REF']} | ordinal={os.environ['AUTHORIZATION_ORDINAL']}"
          matches=[r for r in runs if isinstance(r.get('display_title'),str) and r['display_title'].endswith(marker)]
          assert not matches, f'exact one-shot marker already exists: {[(r.get("id"),r.get("status"),r.get("conclusion")) for r in matches]}'
          print('NO_PRIOR_TISHREI_V2_RECOVERY1_ONE_SHOT_MARKER_PASS')
          PY
      - name: Dispatch exact Tishrei v2 recovery1 scientific workflow once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/payload.json <<JSON
          {
            "ref": "main",
            "inputs": {
              "authorization_ref": "${AUTHORIZATION_REF}",
              "execution_key": "${EXECUTION_KEY}",
              "authorization_ordinal": "${AUTHORIZATION_ORDINAL}"
            }
          }
          JSON
          code="$(curl -sS -o /tmp/dispatch-response.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/dispatches" \
            --data-binary @/tmp/payload.json)"
          if [ "$code" != 204 ]; then
            cat /tmp/dispatch-response.txt >&2
            echo "unexpected dispatch HTTP status: $code" >&2
            exit 1
          fi
          echo 'TISHREI_V2_RECOVERY1_SCIENTIFIC_WORKFLOW_DISPATCH_ACCEPTED'
