name: Jerusalem Tishrei direct-MYSTIC v2 recovery1 package validation

on:
  pull_request:
    paths:
      - '.github/workflows/jerusalem-tishrei-direct-mystic-v2-recovery1-*.yml'
      - 'experiments/jerusalem-tishrei-direct-mystic-v2-recovery1/**'
      - 'experiments/jerusalem-tishrei-direct-mystic-v2/authorization.scientific.json'
      - 'experiments/jerusalem-tishrei-direct-mystic-v2/lane.preregistration.json'
      - 'experiments/jerusalem-tishrei-direct-mystic-v2/execution_guard.py'
      - 'experiments/jerusalem-tishrei-direct-mystic-v2/authorization_proposal.py'
      - 'experiments/jerusalem-tishrei-direct-mystic-v2/execution_plan.py'
      - '.github/workflows/jerusalem-tishrei-direct-mystic-v2-execution.yml'
      - 'experiments/jerusalem-tishrei-direct-mystic-v1/**'
      - 'experiments/mystic-batch-v1/**'

permissions:
  contents: read

jobs:
  validate-no-uvspec:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APPLICATION_SHA: e2d5b761206b6223526f6f79fcb0af5f6de3ba06
      PACKAGE: experiments/jerusalem-tishrei-direct-mystic-v2-recovery1
      AUTHORIZATION: experiments/jerusalem-tishrei-direct-mystic-v2-recovery1/authorization.scientific.json
      LANE_PREREG: experiments/jerusalem-tishrei-direct-mystic-v2-recovery1/lane.preregistration.json
      SOURCE_V2_AUTH: experiments/jerusalem-tishrei-direct-mystic-v2/authorization.scientific.json
      PROPOSAL: experiments/jerusalem-tishrei-direct-mystic-v1/manifest.proposal.json
      EVIDENCE: experiments/jerusalem-tishrei-direct-mystic-v1/level-b-event-evidence.json
      ANALYSIS_CONTRACT: experiments/jerusalem-tishrei-direct-mystic-v1/analysis-contract.json
      PROPOSAL_ADAPTER: experiments/mystic-batch-v1/cross_geometry_adapter.py
      EXECUTION_ADAPTER: experiments/jerusalem-tishrei-direct-mystic-v1/execution_adapter.py
      EXECUTION_WORKFLOW: .github/workflows/jerusalem-tishrei-direct-mystic-v2-recovery1-execution.yml
      RUNTIME_LOCK: experiments/mystic-batch-v1/runtime-lock.micromamba.json
      PLAN: experiments/jerusalem-tishrei-direct-mystic-v2-recovery1/execution_plan.py
      ANALYSIS_DRIVER: experiments/jerusalem-tishrei-direct-mystic-v1/analyze_direct_sky.py
      VISIBILITY_HELPER: experiments/jerusalem-tishrei-direct-mystic-v1/compute_sky_only_visibility.mjs
      DERIVED_CHANNELS: experiments/aerosol-family-challenge-v2/derived_channels.py
      HUMAN_THRESHOLD: scientific-tools/visibility-v3/human-threshold.mjs
      EXECUTOR: experiments/mystic-batch-v1/scientific_case_executor.py
      AGGREGATE: experiments/mystic-batch-v1/scientific_aggregate.py
      AUDIT: experiments/mystic-batch-v1/scientific_audit.py
      AUTHORIZATION_PROPOSAL_BUILDER: experiments/jerusalem-tishrei-direct-mystic-v2-recovery1/authorization_proposal.py
      EXPECTED_EXECUTION_KEY: jerusalem-tishrei-direct-mystic-v2:diagnostic:2
      EXPECTED_AUTHORIZATION_ORDINAL: '2'
    steps:
      - name: Check out exact PR head with full ancestry
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require read-only application credential
        env:
          STARSVISIBILITY_READ_TOKEN: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}
        run: test -n "${STARSVISIBILITY_READ_TOKEN:-}" || exit 78
      - name: Check out exact frozen starsvisibility application
        uses: actions/checkout@v4
        with:
          repository: search-maker/starsvisibility
          ref: ${{ env.APPLICATION_SHA }}
          token: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}
          path: app
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.node-version

      - name: Verify recovery boundary and full-ancestry workflow without execution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-output
          python -m py_compile "$PACKAGE/authorization_proposal.py" "$PACKAGE/execution_guard.py" "$PACKAGE/execution_plan.py" "$EXECUTION_ADAPTER"
          node --check "$VISIBILITY_HELPER"
          test "$(git -C app rev-parse HEAD)" = "$APPLICATION_SHA"
          python - <<'PY'
          import json, os
          from pathlib import Path
          lane=json.loads(Path(os.environ['LANE_PREREG']).read_text())
          source=json.loads(Path(os.environ['SOURCE_V2_AUTH']).read_text())
          proposal=json.loads(Path(os.environ['PROPOSAL']).read_text())
          workflow=Path(os.environ['EXECUTION_WORKFLOW']).read_text()
          assert lane['laneId']=='jerusalem-tishrei-direct-mystic-v2-recovery1'
          assert lane['status']=='PREREGISTERED_RECOVERY_NO_EXECUTION'
          assert lane['futureAuthorization']['executionKey']==os.environ['EXPECTED_EXECUTION_KEY']
          assert lane['futureAuthorization']['authorizationOrdinal']==2
          assert lane['recoveryCorrection']['category']=='workflow-checkout-ancestry-only'
          assert 'fetch-depth 0' in lane['recoveryCorrection']['requiredChange']
          frozen=lane['sourceScientificPayload']
          assert frozen['caseCount']==12 and frozen['configuredPhotonHistoriesSum']==240_000_000
          assert frozen['fieldFactorBaseline']==3.14 and frozen['aod550']==0.22 and frozen['observerElevationM']==800
          assert source['consumed'] is True and source['authorized'] is False
          assert source['executionKey']=='jerusalem-tishrei-direct-mystic-v2:diagnostic:1'
          assert source['authorizationOrdinal']==1
          assert source['exactAuthorizationCommit']=='f2e6fd8dc39b93704edb57d16558f5b6fdf7f4fd'
          note=source['note'].lower()
          assert '33014861225' in note
          assert 'before duplicate-run audit, plan construction, syntax checks' in note
          assert 'mystic solver execution' in note
          assert 'zero scientific cases and zero configured photons executed' in note
          event=proposal['preregisteredEvent']
          assert event['threeStarSemantics']['fieldFactorBaseline']==3.14
          assert event['atmosphere']['aod550']==0.22
          assert len(proposal['cases'])==12
          assert sum(c['photonHistories'] for c in proposal['cases'])==240_000_000
          marker='- name: Check out exact one-purpose recovery1 scientific authorization commit'
          assert marker in workflow
          preflight_block=workflow.split(marker,1)[1].split('- name:',1)[0]
          assert 'fetch-depth: 0' in preflight_block
          run_line=next(line for line in workflow.splitlines() if line.startswith('run-name: '))
          assert run_line.startswith('run-name: MYSTIC batch v1 | key=')
          assert 'inputs.execution_key' in run_line
          assert 'inputs.authorization_ref' in run_line
          assert 'inputs.authorization_ordinal' in run_line
          print('RECOVERY1_BOUNDARY_AND_FULL_ANCESTRY_PASS')
          PY

      - name: Classify recovery1 authorization lifecycle
        id: auth-state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          a=json.loads(Path(os.environ['AUTHORIZATION']).read_text())
          pristine=(a.get('authorized') is False and a.get('scientificExecution') is False and a.get('scientificDiagnostic') is False and a.get('consumed') is False and a.get('authorizationOrdinal')==0 and a.get('executionKey') is None and a.get('exactAuthorizationParentCommit') is None and a.get('exactAuthorizationCommit') is None)
          enabled=(a.get('authorized') is True and a.get('scientificExecution') is True and a.get('scientificDiagnostic') is True and a.get('consumed') is False and a.get('authorizationOrdinal')==2 and a.get('executionKey')==os.environ['EXPECTED_EXECUTION_KEY'] and isinstance(a.get('exactAuthorizationParentCommit'),str) and len(a['exactAuthorizationParentCommit'])==40 and a.get('exactAuthorizationCommit') is None)
          consumed=(a.get('authorized') is False and a.get('scientificExecution') is False and a.get('scientificDiagnostic') is False and a.get('consumed') is True and a.get('authorizationOrdinal')==2 and a.get('executionKey')==os.environ['EXPECTED_EXECUTION_KEY'])
          if pristine: mode='preauth'
          elif enabled: mode='enabled'
          elif consumed: mode='consumed'
          else: raise SystemExit(f'unsupported recovery1 authorization state: {a}')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f'mode={mode}\n')
          Path('validation-output/authorization-state.json').write_text(json.dumps({'mode':mode,'authorization':a},indent=2,sort_keys=True)+'\n')
          print('RECOVERY1_AUTHORIZATION_LIFECYCLE_PASS',mode)
          PY

      - name: Build recovery1 authorization proposal only
        if: steps.auth-state.outputs.mode == 'preauth'
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          python "$AUTHORIZATION_PROPOSAL_BUILDER" --repository-root . --application-root app --output validation-output/authorization-proposal.json
          python - <<'PY'
          import json, os
          p=json.load(open('validation-output/authorization-proposal.json')); a=p['proposedAuthorization']
          assert p['status']=='RECOVERY1_PROPOSAL_ONLY_NOT_AUTHORIZATION'
          assert p['executionAuthorizedByProposal'] is False
          assert a['authorized'] is True and a['scientificExecution'] is True and a['scientificDiagnostic'] is True
          assert a['scientificPurpose']=='jerusalem-tishrei-direct-mystic-v2-recovery1'
          assert a['executionKey']==os.environ['EXPECTED_EXECUTION_KEY'] and a['authorizationOrdinal']==2
          assert a['consumedSourceRunId']==33014861225 and a['requiredSmokeRunId']==33011713466
          assert a['exactAuthorizationParentCommit']==p['sourceCommit'] and a['exactAuthorizationCommit'] is None
          print('RECOVERY1_AUTHORIZATION_PROPOSAL_PASS')
          PY
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git diff --name-only)"

      - name: Simulate one-purpose recovery1 authorization and validate guard plus exact plan
        if: steps.auth-state.outputs.mode == 'preauth'
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          python - <<'PY'
          import json, os
          p=json.load(open('validation-output/authorization-proposal.json'))
          with open(os.environ['AUTHORIZATION'],'w') as f:
              json.dump(p['proposedAuthorization'],f,indent=2,sort_keys=True); f.write('\n')
          PY
          test "$(git diff --name-only)" = "$AUTHORIZATION"
          git config user.name 'tishrei-recovery1-validation'
          git config user.email 'tishrei-recovery1-validation@invalid.local'
          git add "$AUTHORIZATION"
          git commit -m 'LOCAL TEST ONLY - recovery1 authorization'
          TEST_AUTH_SHA="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = "$AUTHORIZATION"
          env GITHUB_ACTIONS=true GITHUB_EVENT_NAME=workflow_dispatch GITHUB_RUN_ATTEMPT=1 \
            python "$PACKAGE/execution_guard.py" \
            --repository-root . --application-root app --application-sha "$APPLICATION_SHA" \
            --authorization "$AUTHORIZATION" --proposal "$PROPOSAL" --evidence "$EVIDENCE" --analysis-contract "$ANALYSIS_CONTRACT" \
            --proposal-adapter "$PROPOSAL_ADAPTER" --execution-adapter "$EXECUTION_ADAPTER" --execution-workflow "$EXECUTION_WORKFLOW" \
            --runtime-lock "$RUNTIME_LOCK" --plan "$PLAN" --analysis-driver "$ANALYSIS_DRIVER" --visibility-helper "$VISIBILITY_HELPER" \
            --derived-channels "$DERIVED_CHANNELS" --human-threshold "$HUMAN_THRESHOLD" --executor "$EXECUTOR" --aggregate "$AGGREGATE" \
            --audit "$AUDIT" --authorization-proposal-builder "$AUTHORIZATION_PROPOSAL_BUILDER" --authorization-ref "$TEST_AUTH_SHA" \
            --execution-key "$EXPECTED_EXECUTION_KEY" --authorization-ordinal "$EXPECTED_AUTHORIZATION_ORDINAL" --output validation-output/guard-report.json
          python "$PLAN" --proposal "$PROPOSAL" --guard-report validation-output/guard-report.json --output validation-output/plan.json
          python - <<'PY'
          import json
          g=json.load(open('validation-output/guard-report.json')); p=json.load(open('validation-output/plan.json'))
          assert g['status']=='AUTHORIZED_V2_RECOVERY1_AFTER_CONSUMED_PREFLIGHT_FAILURE'
          assert g['consumedSourceRunId']==33014861225
          assert g['caseCount']==12 and g['configuredMcPhotonsSum']==240_000_000
          assert p['caseCount']==12 and p['configuredMcPhotonsSum']==240_000_000 and len(p['matrix']['include'])==12
          print('RECOVERY1_GUARD_AND_PLAN_PASS_NO_SOLVER')
          PY

      - name: Validate real enabled recovery1 one-purpose authorization without execution
        if: steps.auth-state.outputs.mode == 'enabled'
        shell: bash
        run: |
          set -euo pipefail
          TEST_AUTH_SHA="$(git rev-parse HEAD)"
          test "$(git diff --name-only HEAD^ HEAD)" = "$AUTHORIZATION"
          env GITHUB_ACTIONS=true GITHUB_EVENT_NAME=workflow_dispatch GITHUB_RUN_ATTEMPT=1 \
            python "$PACKAGE/execution_guard.py" \
            --repository-root . --application-root app --application-sha "$APPLICATION_SHA" \
            --authorization "$AUTHORIZATION" --proposal "$PROPOSAL" --evidence "$EVIDENCE" --analysis-contract "$ANALYSIS_CONTRACT" \
            --proposal-adapter "$PROPOSAL_ADAPTER" --execution-adapter "$EXECUTION_ADAPTER" --execution-workflow "$EXECUTION_WORKFLOW" \
            --runtime-lock "$RUNTIME_LOCK" --plan "$PLAN" --analysis-driver "$ANALYSIS_DRIVER" --visibility-helper "$VISIBILITY_HELPER" \
            --derived-channels "$DERIVED_CHANNELS" --human-threshold "$HUMAN_THRESHOLD" --executor "$EXECUTOR" --aggregate "$AGGREGATE" \
            --audit "$AUDIT" --authorization-proposal-builder "$AUTHORIZATION_PROPOSAL_BUILDER" --authorization-ref "$TEST_AUTH_SHA" \
            --execution-key "$EXPECTED_EXECUTION_KEY" --authorization-ordinal "$EXPECTED_AUTHORIZATION_ORDINAL" --output validation-output/guard-report.json
          python "$PLAN" --proposal "$PROPOSAL" --guard-report validation-output/guard-report.json --output validation-output/plan.json
          python - <<'PY'
          import json
          g=json.load(open('validation-output/guard-report.json')); p=json.load(open('validation-output/plan.json'))
          assert g['status']=='AUTHORIZED_V2_RECOVERY1_AFTER_CONSUMED_PREFLIGHT_FAILURE'
          assert p['caseCount']==12 and p['configuredMcPhotonsSum']==240_000_000
          print('REAL_RECOVERY1_ONE_PURPOSE_AUTHORIZATION_PASS_NO_EXECUTION')
          PY

      - name: Validate consumed recovery1 archive and refuse reuse
        if: steps.auth-state.outputs.mode == 'consumed'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          a=json.loads(Path(os.environ['AUTHORIZATION']).read_text()); note=str(a.get('note','')).lower()
          assert a['consumed'] is True and a['authorized'] is False and a['authorizationOrdinal']==2
          assert a['executionKey']==os.environ['EXPECTED_EXECUTION_KEY'] and 'consumed' in note
          Path('validation-output/recovery1-consumed-archive.json').write_text(json.dumps({'status':'RECOVERY1_CONSUMED_ARCHIVE_PASS','executionKey':a['executionKey'],'ordinal':2},indent=2)+'\n')
          PY
          set +e
          python "$AUTHORIZATION_PROPOSAL_BUILDER" --repository-root . --application-root app --output validation-output/forbidden-reauthorization.json >/tmp/recovery-out 2>/tmp/recovery-err
          RC=$?
          set -e
          test "$RC" -ne 0
          echo 'RECOVERY1_REAUTHORIZATION_REFUSED_PASS'

      - name: Prove no uvspec or scientific solver was launched
        run: |
          set -euo pipefail
          test ! -e case-output
          test ! -e runtime-reports
          test ! -e aggregate-output
          test ! -e audit-output
          test ! -e analysis-output
          echo 'NO_UVSPEC_NO_SYNTAX_NO_SCIENTIFIC_SOLVER_EXECUTED'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jerusalem-tishrei-direct-mystic-v2-recovery1-package-validation-${{ github.run_id }}
          path: validation-output
          if-no-files-found: warn
          retention-days: 90
