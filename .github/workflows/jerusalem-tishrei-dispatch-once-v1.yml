name: Dispatch Jerusalem Tishrei direct-MYSTIC once

on:
  pull_request:
    types: [opened]
    paths:
      - '.github/workflows/jerusalem-tishrei-dispatch-once-v1.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'review/jerusalem-tishrei-dispatch-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      AUTHORIZATION_REF: 64e4515ebb2fb53c93490a6fe1370ceb7e782206
      EXECUTION_KEY: jerusalem-tishrei-direct-mystic-v1:diagnostic:1
      AUTHORIZATION_ORDINAL: '1'
      TARGET_WORKFLOW: jerusalem-tishrei-direct-mystic-v1-execution.yml
    steps:
      - name: Verify exact one-purpose authorization commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${AUTHORIZATION_REF}"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "$api" > /tmp/auth-commit.json
          python - <<'PY'
          import json, os
          d=json.load(open('/tmp/auth-commit.json'))
          assert d['sha']==os.environ['AUTHORIZATION_REF']
          assert len(d['parents'])==1
          assert d['parents'][0]['sha']=='4f4f1417691376fcef0ae4b32cdac9066cf1194c'
          assert [f['filename'] for f in d['files']]==['experiments/jerusalem-tishrei-direct-mystic-v1/authorization.cross-geometry.json']
          print('ONE_PURPOSE_AUTHORIZATION_COMMIT_PASS')
          PY
      - name: Dispatch exact scientific workflow once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/payload.json <<JSON
          {
            "ref": "main",
            "inputs": {
              "authorization_ref": "${AUTHORIZATION_REF}",
              "execution_key": "${EXECUTION_KEY}",
              "authorization_ordinal": "${AUTHORIZATION_ORDINAL}"
            }
          }
          JSON
          code="$(curl -sS -o /tmp/dispatch-response.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/dispatches" \
            --data-binary @/tmp/payload.json)"
          if [ "$code" != 204 ]; then
            cat /tmp/dispatch-response.txt >&2
            echo "unexpected dispatch HTTP status: $code" >&2
            exit 1
          fi
          echo 'SCIENTIFIC_WORKFLOW_DISPATCH_ACCEPTED'
