name: Jerusalem Tishrei elevation repair v2

on:
  pull_request:
    paths:
      - 'experiments/jerusalem-tishrei-direct-mystic-v1/execution_adapter.py'
      - 'experiments/jerusalem-tishrei-direct-mystic-v1/validate_elevation_repair_v2.py'
      - '.github/workflows/jerusalem-tishrei-elevation-repair-v2.yml'

permissions:
  contents: read

jobs:
  validate-no-uvspec:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: jerusalem-tishrei-elevation-repair-v2
          create-args: >-
            -c conda-forge
            python=3.12.4
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true
      - name: Validate repair code syntax and no-process test boundary
        shell: bash -el {0}
        run: |
          set -euo pipefail
          python -m py_compile \
            experiments/jerusalem-tishrei-direct-mystic-v1/execution_adapter.py \
            experiments/jerusalem-tishrei-direct-mystic-v1/validate_elevation_repair_v2.py
          ! grep -q 'subprocess' experiments/jerusalem-tishrei-direct-mystic-v1/validate_elevation_repair_v2.py
      - name: Validate all 12 rendered cases without uvspec or solver
        shell: bash -el {0}
        run: |
          set -euo pipefail
          DATA_DIR="$CONDA_PREFIX/share/libRadtran/data"
          test -s "$DATA_DIR/atmmod/afglus.dat"
          python experiments/jerusalem-tishrei-direct-mystic-v1/validate_elevation_repair_v2.py \
            --repository-root . \
            --data-dir "$DATA_DIR" \
            --output validation-output/elevation-repair-v2.json
      - name: Verify frozen scientific boundaries remain unchanged
        shell: bash -el {0}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('experiments/jerusalem-tishrei-direct-mystic-v1/manifest.proposal.json').read_text())
          assert len(p['cases']) == 12
          assert sum(c['photonHistories'] for c in p['cases']) == 240_000_000
          assert abs(p['preregisteredEvent']['sunDepressionDeg'] - 5.2416836635666755) < 1e-12
          assert abs(p['preregisteredEvent']['atmosphere']['aod550'] - 0.22) < 1e-12
          assert p['preregisteredEvent']['threeStarSemantics']['fieldFactorBaseline'] == 3.14
          assert all(g['observerElevationM'] == 800 for g in p['geometries'])
          a = json.loads(Path('experiments/jerusalem-tishrei-direct-mystic-v1/authorization.cross-geometry.json').read_text())
          assert a['authorized'] is False and a['scientificExecution'] is False and a['consumed'] is True
          assert a['authorizationOrdinal'] == 1
          assert a['executionKey'] == 'jerusalem-tishrei-direct-mystic-v1:diagnostic:1'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jerusalem-tishrei-elevation-repair-v2-${{ github.run_id }}
          path: validation-output/elevation-repair-v2.json
          if-no-files-found: warn
          retention-days: 90
