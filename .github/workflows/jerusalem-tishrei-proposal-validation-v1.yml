name: Jerusalem Tishrei direct-MYSTIC proposal validation

on:
  pull_request:
    paths:
      - '.github/workflows/jerusalem-tishrei-proposal-validation-v1.yml'

permissions:
  contents: read

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROPOSAL_SHA: 0b70dd5e0e17af2205a672ff11fe3e1f4e3fe589
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout exact proposal head
        uses: actions/checkout@v4
        with:
          repository: search-maker/twilight-mystic-experiments
          ref: ${{ env.PROPOSAL_SHA }}
          path: proposal
          persist-credentials: false
          fetch-depth: 1
      - name: Validate manifest, frozen event evidence, and analysis contract only
        shell: bash
        run: |
          set -euo pipefail
          cd proposal
          test "$(git rev-parse HEAD)" = "$PROPOSAL_SHA"
          test "$(git rev-parse HEAD:experiments/aerosol-family-challenge-v2/derived_channels.py)" = 'ccfd04d4c21188966351f4257e92893d7ce340c7'
          python3 - <<'PY'
          import importlib.util, json
          from pathlib import Path
          adapter_path=Path('experiments/mystic-batch-v1/cross_geometry_adapter.py')
          manifest_path=Path('experiments/jerusalem-tishrei-direct-mystic-v1/manifest.proposal.json')
          evidence_path=Path('experiments/jerusalem-tishrei-direct-mystic-v1/level-b-event-evidence.json')
          analysis_path=Path('experiments/jerusalem-tishrei-direct-mystic-v1/analysis-contract.json')
          derived_path=Path('experiments/aerosol-family-challenge-v2/derived_channels.py')
          spec=importlib.util.spec_from_file_location('adapter',adapter_path)
          adapter=importlib.util.module_from_spec(spec); spec.loader.exec_module(adapter)
          m=json.loads(manifest_path.read_text()); e=json.loads(evidence_path.read_text()); a=json.loads(analysis_path.read_text())
          adapter.validate_manifest(m)
          assert len(m['geometries'])==3
          assert len(m['cases'])==12
          assert sum(c['photonHistories'] for c in m['cases'])==240_000_000
          assert m['preregisteredEvent']['threeStarSemantics']['fieldFactorBaseline']==3.14
          assert m['preregisteredEvent']['sunDepressionDeg']==5.2416836635666755
          assert m['preregisteredEvent']['atmosphere']['aod550']==0.22
          geometry_by_id={g['target']['catalogId']:g for g in m['geometries']}
          expected_group_ids={g['geometryId'] for g in m['geometries']}
          signatures={group_id:[] for group_id in expected_group_ids}
          ids=set()
          for case in m['cases']:
              c,g=adapter.resolve_case(m,case['caseId']); inputs=adapter.normalized_inputs(m,c,g)
              assert inputs['observerElevationM']==800.0
              assert inputs['aod550']==0.22
              assert inputs['sunDepressionDeg']==5.2416836635666755
              assert inputs['albedo']==0.15
              assert inputs['mcSpherical']=='1D'
              assert inputs['molecularAbsorption']=='crs'
              assert inputs['wavelengthDomainNm']==[380,780]
              assert inputs['alisSpectralImportanceSamplingNm']==405.0
              assert inputs['atmosphere']=={'root':'libRadtranData','path':'atmmod/afglus.dat'}
              ids.add(inputs['groupId']); signatures[inputs['groupId']].append((inputs['method'],inputs['block']))
          assert ids==expected_group_ids=={'tishrei-antares-hr6134','tishrei-rasalhague-hr6556','tishrei-gamma-cyg-hr7796'}
          expected=[('alis',1),('alis',2),('reference-vroom',1),('reference-vroom',2)]
          for sig in signatures.values(): assert sorted(sig)==expected
          assert m['preregisteredEvent']['claimBoundary']['noParameterTuning'] is True
          assert m['scientificExecution'] is False and m['proposalOnly'] is True
          assert e['source']['workflowRunId']==32982830256
          assert e['source']['artifactId']==9612259358
          assert e['source']['artifactDigest']=='sha256:d43120ad60d2e4a502023cd187bbeffecd6364d4edc975c14c84432c3c8097c5'
          assert e['event']['sunDepressionDeg']==m['preregisteredEvent']['sunDepressionDeg']
          assert e['event']['aod550']==m['preregisteredEvent']['atmosphere']['aod550']
          assert e['event']['fieldFactor']==3.14
          assert len(e['stars'])==3
          for star in e['stars']:
              g=geometry_by_id[star['catalogId']]
              assert star['eventGeometry']['targetAltitudeDeg']==g['targetAltitudeDeg']
              assert star['eventGeometry']['relativeAzimuthDeg']==g['relativeAzimuthDeg']
              assert star['skyChannels']['photopic']['available'] is True
              assert star['skyChannels']['scotopic']['available'] is True
              assert star['skyChannels']['johnsonV']['available'] is True
              assert star['skyChannels']['spectral']['available'] is False
              assert star['skyChannels']['spectral']['reason']=='VALIDATED_V3_PRIMARY_PROVIDER_SPECTRAL_RUNTIME_NOT_IMPLEMENTED'
          assert e['comparisonBoundary']['fullSpectrumLevelBValidationClaimAllowed'] is False
          assert e['comparisonBoundary']['noParameterTuning'] is True
          assert a['analysisId']=='jerusalem-tishrei-direct-mystic-level-b-comparison-v1'
          assert a['status']=='PREREGISTERED_ANALYSIS_NO_EXECUTION' and a['scientificExecution'] is False
          assert a['inputs']['applicationMainSha']=='e2d5b761206b6223526f6f79fcb0af5f6de3ba06'
          assert a['inputs']['humanThresholdGitBlobSha1']=='bb4cd0ff02159ecffe276022cec9d292c7a434a3'
          assert a['inputs']['derivedChannelsGitBlobSha1']=='ccfd04d4c21188966351f4257e92893d7ce340c7'
          assert 'humanThresholdRawSha256' not in a['inputs'] and 'derivedChannelsRawSha256' not in a['inputs']
          assert a['methodRoles']['alis']['expectedOutputGrid']=={'nodeCount':8001,'startNm':380.0,'stopNm':780.0,'stepNm':0.05}
          assert a['methodRoles']['referenceVroom']['forbiddenUse'].startswith('do not derive')
          assert a['skyOnlyVisibilitySubstitution']['fieldFactor']==3.14 and a['skyOnlyVisibilitySubstitution']['branch']=='full'
          assert a['claimBoundary']['fullSpectrumLevelBValidated'] is False
          assert a['claimBoundary']['noParameterTuning'] is True
          assert 'RAW_NODE_COUNT = 8001' in derived_path.read_text()
          print(json.dumps({'status':'VALIDATED_COMPLETE_PROPOSAL_EVIDENCE_ANALYSIS_ONLY','proposalSha':'0b70dd5e0e17af2205a672ff11fe3e1f4e3fe589','caseCount':12,'geometryCount':3,'photonHistories':240_000_000,'solverExecuted':False,'syntaxExecuted':False},sort_keys=True))
          PY

# validation only; no syntax check, uvspec process, MYSTIC solver, or authorization
