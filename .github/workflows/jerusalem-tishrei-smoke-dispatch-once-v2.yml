name: Dispatch Jerusalem Tishrei elevated-site infrastructure smoke once

on:
  pull_request:
    types: [opened]
    paths:
      - '.github/workflows/jerusalem-tishrei-smoke-dispatch-once-v2.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'review/jerusalem-tishrei-smoke-dispatch-once-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      AUTHORIZATION_REF: 3ec2a7bdacb4f00e49f5756ba339338b1e86769c
      AUTHORIZATION_PARENT: 356a70045e68011a03af79d33421879a32e29119
      EXECUTION_KEY: jerusalem-tishrei-elevated-site-smoke-v2:infrastructure:1
      SMOKE_AUTHORIZATION_ORDINAL: '1'
      TARGET_WORKFLOW: jerusalem-tishrei-elevated-site-smoke-v2.yml
      AUTHORIZATION_PATH: experiments/jerusalem-tishrei-elevated-site-smoke-v2/authorization.smoke.json
    steps:
      - name: Verify exact one-purpose smoke authorization commit and content
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${AUTHORIZATION_REF}"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "$api" > /tmp/auth-commit.json
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github.raw+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${AUTHORIZATION_PATH}?ref=${AUTHORIZATION_REF}" > /tmp/auth.json
          python - <<'PY'
          import json, os
          d=json.load(open('/tmp/auth-commit.json'))
          assert d['sha']==os.environ['AUTHORIZATION_REF']
          assert len(d['parents'])==1 and d['parents'][0]['sha']==os.environ['AUTHORIZATION_PARENT']
          assert [f['filename'] for f in d['files']]==[os.environ['AUTHORIZATION_PATH']]
          a=json.load(open('/tmp/auth.json'))
          required={
            'stageId':'jerusalem-tishrei-elevated-site-smoke-v2',
            'authorized':True,
            'infrastructureExecution':True,
            'scientificExecution':False,
            'scientificDiagnostic':False,
            'scientificUseProhibited':True,
            'successDoesNotAuthorizeScientificExecution':True,
            'successDoesNotAuthorizeProduction':True,
            'executionKey':os.environ['EXECUTION_KEY'],
            'smokeAuthorizationOrdinal':1,
            'consumed':False,
            'exactAuthorizationParentCommit':os.environ['AUTHORIZATION_PARENT'],
            'exactAuthorizationCommit':None,
          }
          stale={k:(a.get(k),v) for k,v in required.items() if a.get(k)!=v}
          assert not stale, stale
          print('ONE_PURPOSE_SMOKE_AUTHORIZATION_PASS')
          PY
      - name: Dispatch exact infrastructure smoke workflow once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/payload.json <<JSON
          {
            "ref": "main",
            "inputs": {
              "authorization_ref": "${AUTHORIZATION_REF}",
              "execution_key": "${EXECUTION_KEY}",
              "smoke_authorization_ordinal": "${SMOKE_AUTHORIZATION_ORDINAL}"
            }
          }
          JSON
          code="$(curl -sS -o /tmp/dispatch-response.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/dispatches" \
            --data-binary @/tmp/payload.json)"
          if [ "$code" != 204 ]; then
            cat /tmp/dispatch-response.txt >&2
            echo "unexpected dispatch HTTP status: $code" >&2
            exit 1
          fi
          echo 'INFRASTRUCTURE_SMOKE_WORKFLOW_DISPATCH_ACCEPTED'
