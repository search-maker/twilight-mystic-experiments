name: Koomen ALIS importance screen ordinal55
run-name: Koomen ALIS importance Issue861 ordinal55 | ${{ github.event.pull_request.head.sha }}

on:
  pull_request:
    types: [synchronize]
    paths:
      - 'experiments/koomen-alis-importance-screen-v1/EXECUTE_ORDINAL55.txt'

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: koomen-alis-importance-screen-v1-ordinal55
  cancel-in-progress: false

env:
  PKG: experiments/koomen-alis-importance-screen-v1
  MANIFEST: experiments/koomen-alis-importance-screen-v1/manifest.json
  RUNNER: experiments/koomen-alis-importance-screen-v1/run_screen.py
  ANALYZER: experiments/koomen-alis-importance-screen-v1/analyze.py
  EXPECTED_BRANCH: science/koomen-alis-importance-screen-v1-ordinal55
  SOURCE_SHA: 7231bd873859cc8c36fe6749985e0ece193b5de7
  ORD47_HEAD: 2426335c652adacf442122c3a1bcdf9489a10298
  ORD54_HEAD: 4521b30c40fa74f4c48ea69cea2c31c4b1cf9269
  ORD54_RUN: '33574919931'
  ORD54_ANALYSIS_ARTIFACT: '9826652849'
  ORD54_ANALYSIS_DIGEST: sha256:c4e43c002cc7839f594aa3f316aa4ad149d7934cae317d5f6901cf94b2c27570
  ORD54_RESULT_COMMENT: '5502571158'
  HISTORICAL_ESTIMATOR_DECISION_PATH: review/full-spectrum-estimator-confirmation-decision-v1/full-spectrum-estimator-confirmation-decision-v1.json
  HISTORICAL_ESTIMATOR_DECISION_BLOB: 41f4a5e0ac7328107d956ba9dd9b316349a6a3d6
  CAMS_RUN_ID: '33039911540'
  CAMS_ARTIFACT_NAME: taylor-cams-priorcycle-split-extinction532-v2
  CAMS_PROFILE_SHA256: 6c3a3041b6718db415300323f23da0277752b6c9fc6c806e5eff7c493b060359

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      head: ${{ steps.guard.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - id: guard
        name: Verify frozen ordinal55 identity and predecessor evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_HEAD_REF" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git diff --name-only HEAD^ HEAD)" = "$PKG/EXECUTE_ORDINAL55.txt"
          PARENT="$(git rev-parse HEAD^)"
          test "$(cat "$PKG/EXECUTE_ORDINAL55.txt")" = "AUTHORIZED_EXECUTION_KEY=koomen-alis-importance-screen-v1:scientific:55 PARENT=$PARENT"

          gh api "repos/$GITHUB_REPOSITORY/issues/861/comments?per_page=100" --paginate --slurp > issue861-comments.json
          python - "$PARENT" <<'PY'
          import json,sys
          parent=sys.argv[1]
          pages=json.load(open('issue861-comments.json'))
          comments=[c for page in pages for c in page]
          token=f'KOOMEN861_ORDINAL55_PREREGISTERED_HEAD={parent}'
          hits=[c for c in comments if token in (c.get('body') or '')]
          if len(hits)!=1:
              raise SystemExit(f'expected one preregistration for {parent}, got {len(hits)}')
          print('PREREGISTRATION_PASS',hits[0]['id'])
          PY

          python -m json.tool "$MANIFEST" >/dev/null
          python -m py_compile "$RUNNER" "$ANALYZER"
          python - <<'PY'
          import json
          m=json.load(open('experiments/koomen-alis-importance-screen-v1/manifest.json'))
          assert m['stageId']=='koomen-alis-importance-screen-v1'
          assert m['executionKey']=='koomen-alis-importance-screen-v1:scientific:55'
          assert m['issue']==861 and m['row']==27
          assert m['importanceCentersNm']==[500.0,550.0,600.0]
          assert m['referenceImportanceCenterNm']==550.0
          assert [d['directionIndex'] for d in m['fixedDirections']]==[0,13,14,15,18]
          assert m['replicateSeedBases']==[1591000000,1592000000,1593000000,1594000000,1595000000,1596000000]
          assert m['photonsPerDirectionPerCaseCenter']==2000000
          assert m['maximumSolverCalls']==180 and m['maximumConfiguredPhotonHistories']==360000000
          assert m['method']=='mc_vroom_on' and m['mcEscapeExplicit']=='on'
          assert m['analysis']['primaryMethodConsistencyToleranceMag']==0.03
          assert m['operatorHierarchy']['primary']=='ciePhotopicQ'
          assert all(m['analysis'][k] is False for k in ('fitTaylor','fitAcceptance','fitFov','fitSpectralResponse','fitOffset','fitAtmosphere','fitAod','fitProfile','fitAnyParameter'))
          assert all(m['boundaries'][k] is False for k in ('TaylorResidualUsed','ordinal54Salvage','quadraticSurrogateRehabilitated','historicalAcceptanceInvented','exactHistoricalSpectralResponseClaimed','physicalKoomenCorrectionComputed','physicalSupportEnvelopeAuthorized','full81DirectionGridAuthorized','productionAuthorized'))
          print('FROZEN_SCREEN_MANIFEST_PASS')
          PY

          test "$(git rev-parse "$PARENT:$HISTORICAL_ESTIMATOR_DECISION_PATH")" = "$HISTORICAL_ESTIMATOR_DECISION_BLOB"
          python - <<'PY'
          import json,os,subprocess
          p=os.environ['HISTORICAL_ESTIMATOR_DECISION_PATH']
          x=json.loads(subprocess.check_output(['git','show','HEAD^:'+p],text=True))
          rows=x['frozenInterpretation']['candidateDecisions']
          centers=sorted({float(r['importanceCenterNm']) for r in rows})
          assert centers==[500.0,550.0,600.0]
          assert x['decisionSemantics']['globalImportanceCenterSelected'] is False
          print('INDEPENDENT_CENTER_BASIS_PASS',centers)
          PY

          git fetch --no-tags --depth=1 origin main
          if git grep -n -E '(^|[^0-9])(1591000000|1592000000|1593000000|1594000000|1595000000|1596000000)([^0-9]|$)' origin/main -- .; then
            echo 'candidate ordinal55 seed base already present on main' >&2
            exit 1
          fi

          gh api "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" --paginate --slurp > issue60-comments.json
          python - <<'PY'
          import json,re
          pages=json.load(open('issue60-comments.json'))
          comments=[c for page in pages for c in page]
          active={}
          pat=re.compile(r'(?:^|[|\s])(begin|beginComment|begin_comment)=([^\s|]+)')
          for c in comments:
              first=((c.get('body') or '').splitlines() or [''])[0].strip()
              if first.startswith('WRITE_QUIET_BEGIN'):
                  active[int(c['id'])]=first
              elif first.startswith('WRITE_QUIET_END'):
                  vals=[]
                  for _,v in pat.findall(first):
                      if not v.isdigit():
                          raise SystemExit(f'non-numeric END id {c["id"]}')
                      vals.append(int(v))
                  if vals:
                      if len(set(vals))!=1:
                          raise SystemExit(f'conflicting END ids {c["id"]}')
                      active.pop(vals[0],None)
          if active:
              raise SystemExit(f'unmatched WRITE_QUIET_BEGIN: {active}')
          print('ISSUE60_FENCE_CLEAR',len(comments))
          PY

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORD54_RUN" > ord54-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ORD54_ANALYSIS_ARTIFACT" > ord54-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/issues/856" > issue856.json
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$ORD54_RESULT_COMMENT" > ord54-result-comment.json
          python - <<'PY'
          import json,os
          r=json.load(open('ord54-run.json'))
          a=json.load(open('ord54-artifact.json'))
          i=json.load(open('issue856.json'))
          c=json.load(open('ord54-result-comment.json'))
          assert r['head_sha']==os.environ['ORD54_HEAD'] and r['run_attempt']==1 and r['conclusion']=='success'
          assert str(a['id'])==os.environ['ORD54_ANALYSIS_ARTIFACT'] and a['digest']==os.environ['ORD54_ANALYSIS_DIGEST'] and not a['expired']
          assert i['state']=='closed'
          body=c.get('body') or ''
          assert 'ROW27_SPARSE_QUADRATIC_CIE_HOLDOUT_FAIL' in body
          assert 'halt this quadratic-surrogate route' in body
          print('ORDINAL54_TERMINAL_FAIL_BOUND')
          PY
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: koomen-alis-screen-preflight
          create-args: >-
            -c conda-forge
            python=3.12.4
            numpy=2.3.2
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Verify exact runtime and frozen source compatibility
        shell: bash -el {0}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$SOURCE_SHA" "$ORD47_HEAD"
          mkdir -p frozen-source
          git show "$SOURCE_SHA:experiments/mystic-batch-v1/runtime-lock.micromamba.json" > frozen-source/runtime-lock.json
          git show "$SOURCE_SHA:experiments/mystic-batch-v1/runtime_probe.py" > frozen-source/runtime_probe.py
          git show "$SOURCE_SHA:experiments/taylor-ann-arbor-sqm-mystic-v1/run_row.py" > frozen-source/run_row.py
          git show "$ORD47_HEAD:experiments/taylor-paired-profile-crn-v1/run_pair.py" > frozen-source/profile_runner.py
          grep -q 'mc_vroom off' frozen-source/run_row.py
          grep -q 'mc_spectral_is 550.0' frozen-source/run_row.py
          grep -q "'mc_vroom off'" frozen-source/profile_runner.py
          grep -q "'mc_spectral_is 550.0'" frozen-source/profile_runner.py
          grep -q '^PHOTONS = 200000$' frozen-source/profile_runner.py
          UVSPEC="$(command -v uvspec)"
          DATA_DIR="$CONDA_PREFIX/share/libRadtran/data"
          ATM="$DATA_DIR/atmmod/afglus.dat"
          python frozen-source/runtime_probe.py --uvspec "$UVSPEC" --data-dir "$DATA_DIR" --atmosphere "$ATM" --runtime-lock frozen-source/runtime-lock.json --output runtime-report.json
          python - <<'PY'
          import json
          r=json.load(open('runtime-report.json'))
          assert r['uvspecSha256']=='2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3'
          assert r['libRadtranDataTreeSha256']=='ad30b49177e9c84e46497d69faf0c75e466996b0d0003f1de210289ae9f847d7'
          print('RUNTIME_LOCK_PASS')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: koomen-alis-importance-screen-ordinal55-preflight
          path: |
            runtime-report.json
            issue60-comments.json
            issue861-comments.json
            ord54-run.json
            ord54-artifact.json
            issue856.json
            ord54-result-comment.json
          if-no-files-found: error
          retention-days: 90

  cases:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        replicate: [1,2,3,4,5,6]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.head }}
          persist-credentials: false

      - name: Materialize immutable source files
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$SOURCE_SHA" "$ORD47_HEAD"
          mkdir -p frozen-source
          for f in run_row.py observations.csv sqm_response.csv; do
            git show "$SOURCE_SHA:experiments/taylor-ann-arbor-sqm-mystic-v1/$f" > "frozen-source/$f"
          done
          git show "$ORD47_HEAD:experiments/taylor-paired-profile-crn-v1/run_pair.py" > frozen-source/profile_runner.py

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.CAMS_ARTIFACT_NAME }}
          path: cams
          github-token: ${{ github.token }}
          repository: search-maker/twilight-mystic-experiments
          run-id: ${{ env.CAMS_RUN_ID }}

      - name: Verify CAMS proxy
        shell: bash
        run: echo "$CAMS_PROFILE_SHA256  cams/profile.csv" | sha256sum -c -

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: koomen-alis-screen55
          create-args: >-
            -c conda-forge
            python=3.12.4
            numpy=2.3.2
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Run ALIS importance-center screening arms
        shell: bash -el {0}
        run: |
          set -euo pipefail
          python "$RUNNER" \
            --replicate '${{ matrix.replicate }}' \
            --manifest "$MANIFEST" \
            --baseline-runner frozen-source/run_row.py \
            --profile-runner frozen-source/profile_runner.py \
            --observations frozen-source/observations.csv \
            --response frozen-source/sqm_response.csv \
            --cams-profile cams/profile.csv \
            --uvspec "$(command -v uvspec)" \
            --data-dir "$CONDA_PREFIX/share/libRadtran/data" \
            --output-dir "screen-rep${{ matrix.replicate }}"

      - uses: actions/upload-artifact@v4
        with:
          name: koomen-alis-importance-screen-ordinal55-rep${{ matrix.replicate }}
          path: screen-rep${{ matrix.replicate }}/screen-result.json
          if-no-files-found: error
          retention-days: 90

  analysis:
    needs: cases
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: koomen-alis-importance-screen-ordinal55-rep*
          path: all-results
          merge-multiple: false

      - name: Apply frozen importance-center screening analysis
        shell: bash
        run: |
          set -euo pipefail
          python "$ANALYZER" --results-root all-results --output analysis
          python - <<'PY'
          import json
          x=json.load(open('analysis/summary.json'))
          assert x['classification'] in ('ALIS_IMPORTANCE_SCREEN_NOMINATES_500','ALIS_IMPORTANCE_SCREEN_NOMINATES_600','ALIS_IMPORTANCE_SCREEN_RETAINS_550','ALIS_IMPORTANCE_SCREEN_INVALID')
          assert x['TaylorResidualUsed'] is False
          assert x['ordinal54Salvage'] is False
          assert x['quadraticSurrogateRehabilitated'] is False
          assert x['physicalKoomenCorrectionComputed'] is False
          assert x['physicalSupportEnvelopeAuthorized'] is False
          assert x['full81DirectionGridAuthorized'] is False
          assert x['productionAuthorized'] is False
          print(json.dumps({'classification':x['classification'],'nominatedImportanceCenterNm':x['nominatedImportanceCenterNm'],'screeningScore':x['screeningScore'],'equivalenceFailureCount':x['equivalenceFailureCount']},indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: koomen-alis-importance-screen-ordinal55-analysis
          path: analysis/
          if-no-files-found: error
          retention-days: 90
