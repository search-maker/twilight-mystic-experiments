name: Koomen certified paired shape 1e-3 diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/koomen-certified-shape-1e3-v1.yml"

permissions:
  contents: read

jobs:
  certified-paired-shape-1e3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize exact frozen inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-inputs
          cp review/published-twilight-radiance-benchmark-v1/frozen-runtime/validated-v3-primary-runtime-v1.json benchmark-inputs/base.json
          cp review/published-twilight-radiance-benchmark-v1/frozen-runtime/aerosol-scenario-interpolator-runtime-v1.json benchmark-inputs/asiv.json
          printf '%s  %s\n' "6a927bd702ebbf1b1913ebe51731f3b92f967f2ae95edf090280b8370ea091e4" benchmark-inputs/base.json | sha256sum -c -
          printf '%s  %s\n' "a324408e87fd1ffa5f3fc386e77e54fe046eb3e749f2b39a699712ba355eb060" benchmark-inputs/asiv.json | sha256sum -c -
          git fetch --no-tags --depth=1 origin 83fa2a8fad83213e2a5ccfa45f0c80d03604c04e
          git show 83fa2a8fad83213e2a5ccfa45f0c80d03604c04e:review/empirical-twilight-radiance-source-admission-v1/exact_aod_interval_support_v1.py > benchmark-inputs/support.py
          git show 83fa2a8fad83213e2a5ccfa45f0c80d03604c04e:review/empirical-twilight-radiance-source-admission-v1/certified_aod_scenario_extrema_v1.py > benchmark-inputs/model.py

      - name: Run same certified algorithm at 1e-3 numerical tolerance
        shell: bash
        run: |
          set -euo pipefail
          cp review/published-twilight-radiance-benchmark-v1/certified_paired_shape_v1.py /tmp/certified_paired_shape_1e3.py
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/certified_paired_shape_1e3.py')
          s=p.read_text()
          old="cert = certify_pair(mod, base, asiv, alt=alt, raz=raz)"
          new="cert = certify_pair(mod, base, asiv, alt=alt, raz=raz, log_tolerance=1e-3)"
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
          python /tmp/certified_paired_shape_1e3.py \
            --dataset review/published-twilight-radiance-benchmark-v1/KOOMEN_1952_MARYLAND_PHOTOPIC_48.json \
            --base-runtime benchmark-inputs/base.json \
            --asiv-runtime benchmark-inputs/asiv.json \
            --support-evaluator benchmark-inputs/support.py \
            --extrema-evaluator benchmark-inputs/model.py \
            --output KOOMEN_CERTIFIED_PAIRED_SHAPE_1E3_RESULT.json \
            --workers 4
          sha256sum KOOMEN_CERTIFIED_PAIRED_SHAPE_1E3_RESULT.json > KOOMEN_CERTIFIED_PAIRED_SHAPE_1E3_RESULT.sha256

      - name: Prove coarse-certification boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('KOOMEN_CERTIFIED_PAIRED_SHAPE_1E3_RESULT.json'))
          assert r['pairCount']==24
          assert r['boundary']['pandoraTargetDataUsed'] is False
          assert r['boundary']['strictModernValidationClaimAuthorized'] is False
          assert r['boundary']['modelRetuningAuthorized'] is False
          for row in r['rows']:
              if row['status']=='CERTIFIED_PAIRED_SHAPE_EVALUATED':
                  c=row['certification']
                  assert c['certified'] is True
                  assert c['sameAodRequired'] is True
                  assert c['sameScenarioRequired'] is True
                  assert c['logTolerance']==0.001
          print('1e-3 interval certification boundary verified')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: koomen-certified-paired-shape-1e3-v1
          path: |
            KOOMEN_CERTIFIED_PAIRED_SHAPE_1E3_RESULT.json
            KOOMEN_CERTIFIED_PAIRED_SHAPE_1E3_RESULT.sha256
          if-no-files-found: error
          retention-days: 30
