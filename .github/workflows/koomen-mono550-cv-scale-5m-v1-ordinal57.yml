name: Koomen mono550 CV 5M scale ordinal57
run-name: Koomen mono550 CV 5M Issue870 ordinal57 | ${{ github.event.pull_request.head.sha }}

on:
  pull_request:
    types: [synchronize]
    paths:
      - 'experiments/koomen-mono550-cv-scale-5m-v1/EXECUTE_ORDINAL57.txt'

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: koomen-mono550-cv-scale-5m-v1-ordinal57
  cancel-in-progress: false

env:
  PKG: experiments/koomen-mono550-cv-scale-5m-v1
  MANIFEST: experiments/koomen-mono550-cv-scale-5m-v1/manifest.json
  RUNNER: experiments/koomen-mono550-cv-scale-5m-v1/run_scale.py
  ANALYZER: experiments/koomen-mono550-cv-scale-5m-v1/analyze_scale.py
  EXPECTED_BRANCH: science/koomen-mono550-cv-scale-5m-v1-ordinal57
  BASE_MAIN: de3fafa052ff1d5b2f33ec0d4347c884d560d8b6
  SOURCE_SHA: 7231bd873859cc8c36fe6749985e0ece193b5de7
  BASELINE_RUNNER_BLOB: 34e6229ccbd0976032a292171b4f64c66854029d
  ORD47_HEAD: 2426335c652adacf442122c3a1bcdf9489a10298
  PROFILE_RUNNER_BLOB: 13eb5448f44177927995eb0b31c123846ebe7ddd
  ORD56_HEAD: 058284d17a632c1c76dbbf7a58229a186445cb87
  ORD56_RUNNER_BLOB: f79e7606509285bc3b0eaa42c0aaa8b973610574
  ORD56_ANALYZER_BLOB: 93a51ef1caecd71c47fc3af3c7cb6f1e9c9af8dc
  ORD56_RUN: '33585842755'
  ORD56_ANALYSIS_ARTIFACT: '9830086548'
  ORD56_ANALYSIS_DIGEST: sha256:7fc10298ad3df738c8b2914d195dd92802f2a59d213e5271fdb5faeffb493bf4
  ORD56_RESULT_COMMENT: '5503742872'
  CAMS_RUN_ID: '33039911540'
  CAMS_ARTIFACT_NAME: taylor-cams-priorcycle-split-extinction532-v2
  CAMS_PROFILE_SHA256: 6c3a3041b6718db415300323f23da0277752b6c9fc6c806e5eff7c493b060359

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      head: ${{ steps.guard.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - id: guard
        name: Verify frozen ordinal57 identity, budget, and predecessor evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_HEAD_REF" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git diff --name-only HEAD^ HEAD)" = "$PKG/EXECUTE_ORDINAL57.txt"
          PARENT="$(git rev-parse HEAD^)"
          test "$(cat "$PKG/EXECUTE_ORDINAL57.txt")" = "AUTHORIZED_EXECUTION_KEY=koomen-mono550-cv-scale-5m-v1:scientific:57 PARENT=$PARENT"

          gh api "repos/$GITHUB_REPOSITORY/issues/870/comments?per_page=100" --paginate --slurp > issue870-comments.json
          python - "$PARENT" <<'PY'
          import json,sys
          parent=sys.argv[1]
          pages=json.load(open('issue870-comments.json'))
          comments=[c for page in pages for c in page]
          token=f'KOOMEN870_ORDINAL57_PREREGISTERED_HEAD={parent}'
          hits=[c for c in comments if token in (c.get('body') or '')]
          if len(hits)!=1:
              raise SystemExit(f'expected exactly one ordinal57 preregistration for {parent}, got {len(hits)}')
          print('PREREGISTRATION_PASS',hits[0]['id'])
          PY

          python -m json.tool "$MANIFEST" >/dev/null
          python -m py_compile "$RUNNER" "$ANALYZER"
          python - <<'PY'
          import importlib.util,json,math
          m=json.load(open('experiments/koomen-mono550-cv-scale-5m-v1/manifest.json'))
          assert m['stageId']=='koomen-mono550-cv-scale-5m-v1'
          assert m['executionKey']=='koomen-mono550-cv-scale-5m-v1:scientific:57'
          assert m['issue']==870 and m['row']==27
          assert [d['directionIndex'] for d in m['directions']]==[0,14,18]
          assert m['cases']==['baseline','profile'] and m['arms']==['alis550','mono550']
          assert m['replicateSeedBases']==[1611000000,1612000000,1613000000,1614000000,1615000000,1616000000]
          assert m['seedOffset']==996
          assert m['photonsPerDirectionPerCaseArm']==5000000
          assert m['maximumSolverCalls']==72 and m['maximumConfiguredPhotonHistories']==360000000
          p=m['planning']
          required=p['ordinal56Photons']*(p['ordinal56WorstCvSeMag']/p['precisionTargetSeMag'])**2
          chosen=math.ceil(required/1000000)*1000000
          assert chosen==5000000==p['chosenPhotons']==m['photonsPerDirectionPerCaseArm']
          assert abs(p['requiredPhotons']-required)<1.0
          predicted=p['ordinal56WorstCvSeMag']*math.sqrt(p['ordinal56Photons']/p['chosenPhotons'])
          assert abs(p['predictedWorstSeMagAtChosenN']-predicted)<1e-9
          assert m['method']['alis550']=={'wavelengthNm':[380,780],'mcSpectralIsNm':550.0}
          assert m['method']['mono550']=={'wavelengthNm':[550,550],'mcSpectralIs':False}
          assert m['method']['controlVariateFormula']=='D_CV=(D_CIE-D_A)+D_M'
          assert m['analysis']['primaryMethodConsistencyToleranceMag']==0.03
          assert m['analysis']['precisionTargetSeMag']==0.03
          assert m['analysis']['controlVariateFormula']=='D_CV=(D_CIE-D_A)+D_M'
          assert all(m['analysis'][k] is False for k in ('fitTaylor','fitAcceptance','fitFov','fitSpectralResponse','fitOffset','fitAtmosphere','fitAod','fitProfile','fitAnyParameter'))
          assert all(m['boundaries'][k] is False for k in ('TaylorResidualUsed','ordinal54Salvage','importanceWavelengthRetuned','historicalAcceptanceInvented','exactHistoricalSpectralResponseClaimed','physicalKoomenCorrectionComputed','physicalSupportEnvelopeAuthorized','full81DirectionGridAuthorized','productionAuthorized','adaptivePhotonExtensionAuthorized'))
          spec=importlib.util.spec_from_file_location('scale','experiments/koomen-mono550-cv-scale-5m-v1/run_scale.py')
          scale=importlib.util.module_from_spec(spec); spec.loader.exec_module(scale)
          scale.validate_manifest(__import__('pathlib').Path('experiments/koomen-mono550-cv-scale-5m-v1/manifest.json'))
          print('FROZEN_ORDINAL57_MANIFEST_AND_PLANNING_PASS',required,predicted)
          PY

          git fetch --no-tags --depth=1 origin "$BASE_MAIN" "$SOURCE_SHA" "$ORD47_HEAD" "$ORD56_HEAD" main
          test "$(git rev-parse origin/main)" = "$BASE_MAIN"
          test "$(git rev-parse "$SOURCE_SHA:experiments/taylor-ann-arbor-sqm-mystic-v1/run_row.py")" = "$BASELINE_RUNNER_BLOB"
          test "$(git rev-parse "$ORD47_HEAD:experiments/taylor-paired-profile-crn-v1/run_pair.py")" = "$PROFILE_RUNNER_BLOB"
          test "$(git rev-parse "$ORD56_HEAD:experiments/koomen-mono550-cv-sentinel-v1/run_sentinel.py")" = "$ORD56_RUNNER_BLOB"
          test "$(git rev-parse "$ORD56_HEAD:experiments/koomen-mono550-cv-sentinel-v1/analyze.py")" = "$ORD56_ANALYZER_BLOB"
          for seed in 1611000000 1612000000 1613000000 1614000000 1615000000 1616000000; do
            if git grep -n -E "(^|[^0-9])${seed}([^0-9]|$)" origin/main -- .; then
              echo "candidate ordinal57 seed base already present on main: $seed" >&2
              exit 1
            fi
          done

          gh api "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" --paginate --slurp > issue60-comments.json
          python - <<'PY'
          import json,re
          pages=json.load(open('issue60-comments.json'))
          comments=[c for page in pages for c in page]
          active={}
          pat=re.compile(r'(?:^|[|\s])(begin|beginComment|begin_comment)=([^\s|]+)')
          for c in comments:
              first=((c.get('body') or '').splitlines() or [''])[0].strip()
              if first.startswith('WRITE_QUIET_BEGIN'):
                  active[int(c['id'])]=first
              elif first.startswith('WRITE_QUIET_END'):
                  vals=[]
                  for _,v in pat.findall(first):
                      if not v.isdigit(): raise SystemExit(f'non-numeric WRITE_QUIET_END id {c["id"]}')
                      vals.append(int(v))
                  if vals:
                      if len(set(vals))!=1: raise SystemExit(f'conflicting WRITE_QUIET_END ids {c["id"]}')
                      active.pop(vals[0],None)
          if active: raise SystemExit(f'unmatched WRITE_QUIET_BEGIN: {active}')
          print('ISSUE60_FENCE_CLEAR',len(comments))
          PY

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORD56_RUN" > ord56-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ORD56_ANALYSIS_ARTIFACT" > ord56-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$ORD56_RESULT_COMMENT" > ord56-result-comment.json
          gh api "repos/$GITHUB_REPOSITORY/issues/868" > issue868.json
          python - <<'PY'
          import json,os
          r=json.load(open('ord56-run.json')); a=json.load(open('ord56-artifact.json')); c=json.load(open('ord56-result-comment.json')); i=json.load(open('issue868.json'))
          assert r['head_sha']==os.environ['ORD56_HEAD'] and r['run_attempt']==1 and r['status']=='completed' and r['conclusion']=='success'
          assert str(a['id'])==os.environ['ORD56_ANALYSIS_ARTIFACT'] and a['digest']==os.environ['ORD56_ANALYSIS_DIGEST'] and not a['expired']
          assert i['state']=='closed' and i['state_reason']=='completed'
          body=c.get('body') or ''
          assert 'MONO550_CV_SENTINEL_EQUIVALENT_BUT_PRECISION_INELIGIBLE' in body
          assert 'Equivalence failures: `0` / `10`' in body
          assert 'Control-variate precision failures: `2` / `4`' in body
          assert '0.0642911565' in body
          assert 'separate fresh one-level budget-scaling pilot' in body
          print('ORDINAL56_TERMINAL_SCALING_AUTHORITY_BOUND')
          PY
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: koomen-mono550-cv57-preflight
          create-args: >-
            -c conda-forge
            python=3.12.4
            numpy=2.3.2
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Verify exact runtime and frozen ordinal56 substrate
        shell: bash -el {0}
        run: |
          set -euo pipefail
          mkdir -p frozen-source
          git show "$SOURCE_SHA:experiments/mystic-batch-v1/runtime-lock.micromamba.json" > frozen-source/runtime-lock.json
          git show "$SOURCE_SHA:experiments/mystic-batch-v1/runtime_probe.py" > frozen-source/runtime_probe.py
          git show "$ORD56_HEAD:experiments/koomen-mono550-cv-sentinel-v1/run_sentinel.py" > frozen-source/ordinal56_run_sentinel.py
          git show "$ORD56_HEAD:experiments/koomen-mono550-cv-sentinel-v1/analyze.py" > frozen-source/ordinal56_analyze.py
          test "$(git hash-object frozen-source/ordinal56_run_sentinel.py)" = "$ORD56_RUNNER_BLOB"
          test "$(git hash-object frozen-source/ordinal56_analyze.py)" = "$ORD56_ANALYZER_BLOB"
          UVSPEC="$(command -v uvspec)"
          DATA_DIR="$CONDA_PREFIX/share/libRadtran/data"
          ATM="$DATA_DIR/atmmod/afglus.dat"
          python frozen-source/runtime_probe.py --uvspec "$UVSPEC" --data-dir "$DATA_DIR" --atmosphere "$ATM" --runtime-lock frozen-source/runtime-lock.json --output runtime-report.json
          python - <<'PY'
          import json
          r=json.load(open('runtime-report.json'))
          assert r['uvspecSha256']=='2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3'
          assert r['libRadtranDataTreeSha256']=='ad30b49177e9c84e46497d69faf0c75e466996b0d0003f1de210289ae9f847d7'
          print('RUNTIME_LOCK_PASS')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: koomen-mono550-cv-scale-5m-ordinal57-preflight
          path: |
            runtime-report.json
            issue60-comments.json
            issue870-comments.json
            ord56-run.json
            ord56-artifact.json
            ord56-result-comment.json
            issue868.json
          if-no-files-found: error
          retention-days: 90

  cases:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        replicate: [1,2,3,4,5,6]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.head }}
          persist-credentials: false

      - name: Materialize immutable source and ordinal56 estimator substrate
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$SOURCE_SHA" "$ORD47_HEAD" "$ORD56_HEAD"
          mkdir -p frozen-source
          git show "$SOURCE_SHA:experiments/taylor-ann-arbor-sqm-mystic-v1/run_row.py" > frozen-source/run_row.py
          git show "$SOURCE_SHA:experiments/taylor-ann-arbor-sqm-mystic-v1/observations.csv" > frozen-source/observations.csv
          git show "$ORD47_HEAD:experiments/taylor-paired-profile-crn-v1/run_pair.py" > frozen-source/profile_runner.py
          git show "$ORD56_HEAD:experiments/koomen-mono550-cv-sentinel-v1/run_sentinel.py" > frozen-source/ordinal56_run_sentinel.py
          test "$(git hash-object frozen-source/run_row.py)" = "$BASELINE_RUNNER_BLOB"
          test "$(git hash-object frozen-source/profile_runner.py)" = "$PROFILE_RUNNER_BLOB"
          test "$(git hash-object frozen-source/ordinal56_run_sentinel.py)" = "$ORD56_RUNNER_BLOB"

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.CAMS_ARTIFACT_NAME }}
          path: cams
          github-token: ${{ github.token }}
          repository: search-maker/twilight-mystic-experiments
          run-id: ${{ env.CAMS_RUN_ID }}

      - name: Verify CAMS proxy
        shell: bash
        run: echo "$CAMS_PROFILE_SHA256  cams/profile.csv" | sha256sum -c -

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: koomen-mono550-cv57
          create-args: >-
            -c conda-forge
            python=3.12.4
            numpy=2.3.2
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Run frozen 5M ALIS550 and MONO550 scaling arms
        env:
          ORD56_FROZEN_RUNNER: frozen-source/ordinal56_run_sentinel.py
        shell: bash -el {0}
        run: |
          set -euo pipefail
          python "$RUNNER" \
            --replicate '${{ matrix.replicate }}' \
            --manifest "$MANIFEST" \
            --baseline-runner frozen-source/run_row.py \
            --profile-runner frozen-source/profile_runner.py \
            --observations frozen-source/observations.csv \
            --cams-profile cams/profile.csv \
            --uvspec "$(command -v uvspec)" \
            --data-dir "$CONDA_PREFIX/share/libRadtran/data" \
            --output-dir result
          test -s result/sentinel-result.json

      - uses: actions/upload-artifact@v4
        with:
          name: koomen-mono550-cv-scale-5m-ordinal57-rep${{ matrix.replicate }}
          path: result/sentinel-result.json
          if-no-files-found: error
          retention-days: 90

  analysis:
    needs: cases
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Materialize exact frozen ordinal56 analyzer
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$ORD56_HEAD"
          mkdir -p frozen-source
          git show "$ORD56_HEAD:experiments/koomen-mono550-cv-sentinel-v1/analyze.py" > frozen-source/ordinal56_analyze.py
          test "$(git hash-object frozen-source/ordinal56_analyze.py)" = "$ORD56_ANALYZER_BLOB"

      - uses: actions/download-artifact@v4
        with:
          pattern: koomen-mono550-cv-scale-5m-ordinal57-rep*
          path: all-results
          merge-multiple: false

      - uses: actions/download-artifact@v4
        with:
          name: koomen-mono550-cv-sentinel-ordinal56-analysis
          path: ordinal56-analysis
          github-token: ${{ github.token }}
          repository: search-maker/twilight-mystic-experiments
          run-id: ${{ env.ORD56_RUN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'

      - name: Install pinned analysis dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==2.3.2
          python - <<'PY'
          import numpy
          assert numpy.__version__=='2.3.2'
          print('NUMPY_PIN_PASS',numpy.__version__)
          PY

      - name: Apply frozen ordinal56 analysis semantics through metadata-only ordinal57 adapter
        shell: bash
        run: |
          set -euo pipefail
          python "$ANALYZER" \
            --results-root all-results \
            --ordinal56-analyzer frozen-source/ordinal56_analyze.py \
            --ordinal56-summary ordinal56-analysis/summary.json \
            --output analysis-output
          python - <<'PY'
          import json
          x=json.load(open('analysis-output/summary.json'))
          assert x['classification'] in (
            'MONO550_CV_5M_SCALE_EQUIVALENT_AND_PRECISION_ELIGIBLE',
            'MONO550_CV_5M_SCALE_EQUIVALENT_BUT_PRECISION_INELIGIBLE',
            'MONO550_CV_5M_SCALE_NOT_EQUIVALENT',
            'MONO550_CV_5M_SCALE_INVALID',
          )
          assert x['TaylorResidualUsed'] is False
          assert x['ordinal54Salvage'] is False
          assert x['importanceWavelengthRetuned'] is False
          assert x['physicalKoomenCorrectionComputed'] is False
          assert x['physicalSupportEnvelopeAuthorized'] is False
          assert x['full81DirectionGridAuthorized'] is False
          assert x['productionAuthorized'] is False
          assert x['adaptivePhotonExtensionAuthorized'] is False
          print(json.dumps({
            'classification':x['classification'],
            'equivalenceFailureCount':x.get('equivalenceFailureCount'),
            'precisionFailureCount':x.get('precisionFailureCount'),
            'scalingDiagnostic':x.get('scalingDiagnostic'),
            'runtime':x.get('runtime'),
          },indent=2,sort_keys=True))
          PY

      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: koomen-mono550-cv-scale-5m-ordinal57-analysis
          path: analysis-output
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Publish compact immutable ordinal57 result to Issue 870
        env:
          GH_TOKEN: ${{ github.token }}
          ANALYSIS_ARTIFACT_ID: ${{ steps.upload.outputs['artifact-id'] }}
          ANALYSIS_ARTIFACT_DIGEST: ${{ steps.upload.outputs['artifact-digest'] }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > issue-comment.md
          import json,os
          x=json.load(open('analysis-output/summary.json'))
          print('KOOMEN ORDINAL57 MONO550 CONTROL-VARIATE 5M SCALE — TERMINAL RESULT')
          print()
          print(f"Classification: `{x['classification']}`")
          print(f"Equivalence failures: `{x.get('equivalenceFailureCount')}` / `{x.get('equivalenceQuantityCount')}`")
          print(f"Control-variate precision failures: `{x.get('precisionFailureCount')}` / `{x.get('precisionQuantityCount')}`")
          if x.get('controlVariate'):
              worst=max(r['seMag'] for r in x['controlVariate']); best=min(r['seMag'] for r in x['controlVariate'])
              print(f"Control-variate SE range: `{best:.10f}` .. `{worst:.10f}` mag")
          s=x.get('scalingDiagnostic') or {}
          if s:
              print(f"Observed worst-SE ratio ordinal57/ordinal56: `{s.get('observedWorstSeRatio')}`")
              print(f"Frozen 1/sqrt(5) planning factor: `{s.get('expectedOneOverSqrtNFactor')}`")
          if x.get('runtime'):
              print(f"Median solver-time ratio MONO550/ALIS550: `{x['runtime']['monoOverAlisMedianRatio']}`")
              print(f"Total solver-time ratio MONO550/ALIS550: `{x['runtime']['monoOverAlisTotalRatio']}`")
          print()
          print('Immutable provenance:')
          print('- fresh ordinal57 identity; attempt 1 only')
          print('- exact ordinal56 estimator/analyzer substrate; metadata-only compatibility adapter changes no numerical values')
          print('- row27; baseline + same CAMS proxy; center + mid180 + outer315')
          print('- ALIS importance center fixed at 550 nm; no importance-wavelength retuning')
          print('- 5,000,000 photons per direction/case/arm/seed; six fresh seed bases; no adaptive extension')
          print(f"- run `{os.environ['GITHUB_RUN_ID']}`, attempt `{os.environ['GITHUB_RUN_ATTEMPT']}`")
          print(f"- workflow head `${{ github.event.pull_request.head.sha }}`")
          print(f"- analysis artifact `{os.environ['ANALYSIS_ARTIFACT_ID']}`, digest `{os.environ['ANALYSIS_ARTIFACT_DIGEST']}`")
          print()
          c=x['classification']
          if c=='MONO550_CV_5M_SCALE_EQUIVALENT_AND_PRECISION_ELIGIBLE':
              print('Frozen consequence: the exact MONO550 control-variate estimator is eligible only for a separate fresh independent numerical confirmation with new seeds and a separately frozen geometry universe; do not launch the 81-direction grid directly.')
          elif c=='MONO550_CV_5M_SCALE_EQUIVALENT_BUT_PRECISION_INELIGIBLE':
              print('Frozen consequence: stop photon-budget escalation for this control-variate path. Any continuation must use a genuinely different numerical strategy under a fresh identity.')
          elif c=='MONO550_CV_5M_SCALE_NOT_EQUIVALENT':
              print('Frozen consequence: abandon MONO550 as the control anchor for this path; do not tune wavelength to force agreement.')
          else:
              print('Frozen consequence: invalid pilot; no estimator continuation from this identity.')
          print()
          print('No Taylor residual use, Koomen correction/support-envelope claim, 81-direction-grid authority, production/Level-B authority, or post-result wavelength retuning is created by this pilot.')
          PY
          gh issue comment 870 --repo "$GITHUB_REPOSITORY" --body-file issue-comment.md
