name: Koomen mono550 control-variate sentinel ordinal56
run-name: Koomen mono550 CV Issue868 ordinal56 | ${{ github.event.pull_request.head.sha }}

on:
  pull_request:
    types: [synchronize]
    paths:
      - 'experiments/koomen-mono550-cv-sentinel-v1/EXECUTE_ORDINAL56.txt'

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: koomen-mono550-cv-sentinel-v1-ordinal56
  cancel-in-progress: false

env:
  PKG: experiments/koomen-mono550-cv-sentinel-v1
  MANIFEST: experiments/koomen-mono550-cv-sentinel-v1/manifest.json
  RUNNER: experiments/koomen-mono550-cv-sentinel-v1/run_sentinel.py
  ANALYZER: experiments/koomen-mono550-cv-sentinel-v1/analyze.py
  EXPECTED_BRANCH: science/koomen-mono550-cv-sentinel-v1-ordinal56
  SOURCE_SHA: 7231bd873859cc8c36fe6749985e0ece193b5de7
  BASELINE_RUNNER_BLOB: 34e6229ccbd0976032a292171b4f64c66854029d
  ORD47_HEAD: 2426335c652adacf442122c3a1bcdf9489a10298
  PROFILE_RUNNER_BLOB: 13eb5448f44177927995eb0b31c123846ebe7ddd
  ORD55_RECOVERY_RUN: '33584837869'
  ORD55_RECOVERY_HEAD: 60e5d3cad092cb3e303d050a645ec8b3ebd2230f
  ORD55_RECOVERY_ARTIFACT: '9829700897'
  ORD55_RECOVERY_DIGEST: sha256:7ce2dc5131b35825c846e3649924efdea730dfa71d2114799519245aab7a517a
  ORD55_RESULT_COMMENT: '5503610221'
  CAMS_RUN_ID: '33039911540'
  CAMS_ARTIFACT_NAME: taylor-cams-priorcycle-split-extinction532-v2
  CAMS_PROFILE_SHA256: 6c3a3041b6718db415300323f23da0277752b6c9fc6c806e5eff7c493b060359

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      head: ${{ steps.guard.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - id: guard
        name: Verify frozen ordinal56 identity and predecessor evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_HEAD_REF" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git diff --name-only HEAD^ HEAD)" = "$PKG/EXECUTE_ORDINAL56.txt"
          PARENT="$(git rev-parse HEAD^)"
          test "$(cat "$PKG/EXECUTE_ORDINAL56.txt")" = "AUTHORIZED_EXECUTION_KEY=koomen-mono550-cv-sentinel-v1:scientific:56 PARENT=$PARENT"

          gh api "repos/$GITHUB_REPOSITORY/issues/868/comments?per_page=100" --paginate --slurp > issue868-comments.json
          python - "$PARENT" <<'PY'
          import json,sys
          parent=sys.argv[1]
          pages=json.load(open('issue868-comments.json'))
          comments=[c for page in pages for c in page]
          token=f'KOOMEN868_ORDINAL56_PREREGISTERED_HEAD={parent}'
          hits=[c for c in comments if token in (c.get('body') or '')]
          if len(hits)!=1:
              raise SystemExit(f'expected exactly one ordinal56 preregistration for {parent}, got {len(hits)}')
          print('PREREGISTRATION_PASS',hits[0]['id'])
          PY

          python -m json.tool "$MANIFEST" >/dev/null
          python -m py_compile "$RUNNER" "$ANALYZER"
          python - <<'PY'
          import json
          m=json.load(open('experiments/koomen-mono550-cv-sentinel-v1/manifest.json'))
          assert m['stageId']=='koomen-mono550-cv-sentinel-v1'
          assert m['executionKey']=='koomen-mono550-cv-sentinel-v1:scientific:56'
          assert m['issue']==868 and m['row']==27
          assert [d['directionIndex'] for d in m['directions']]==[0,14,18]
          assert m['cases']==['baseline','profile'] and m['arms']==['alis550','mono550']
          assert m['replicateSeedBases']==[1601000000,1602000000,1603000000,1604000000,1605000000,1606000000]
          assert m['seedOffset']==996
          assert m['photonsPerDirectionPerCaseArm']==1000000
          assert m['maximumSolverCalls']==72 and m['maximumConfiguredPhotonHistories']==72000000
          assert m['method']['alis550']=={'wavelengthNm':[380,780],'mcSpectralIsNm':550.0}
          assert m['method']['mono550']=={'wavelengthNm':[550,550],'mcSpectralIs':False}
          assert m['analysis']['primaryMethodConsistencyToleranceMag']==0.03
          assert m['analysis']['precisionTargetSeMag']==0.03
          assert m['analysis']['controlVariateFormula']=='D_CV=(D_CIE-D_A)+D_M'
          assert all(m['analysis'][k] is False for k in ('fitTaylor','fitAcceptance','fitFov','fitSpectralResponse','fitOffset','fitAtmosphere','fitAod','fitProfile','fitAnyParameter'))
          assert all(m['boundaries'][k] is False for k in ('TaylorResidualUsed','ordinal54Salvage','importanceWavelengthRetuned','historicalAcceptanceInvented','exactHistoricalSpectralResponseClaimed','physicalKoomenCorrectionComputed','physicalSupportEnvelopeAuthorized','full81DirectionGridAuthorized','productionAuthorized'))
          print('FROZEN_ORDINAL56_MANIFEST_PASS')
          PY

          git fetch --no-tags --depth=1 origin "$SOURCE_SHA" "$ORD47_HEAD" main
          test "$(git rev-parse "$SOURCE_SHA:experiments/taylor-ann-arbor-sqm-mystic-v1/run_row.py")" = "$BASELINE_RUNNER_BLOB"
          test "$(git rev-parse "$ORD47_HEAD:experiments/taylor-paired-profile-crn-v1/run_pair.py")" = "$PROFILE_RUNNER_BLOB"
          if git grep -n -E '(^|[^0-9])(1601000000|1602000000|1603000000|1604000000|1605000000|1606000000)([^0-9]|$)' origin/main -- .; then
            echo 'candidate ordinal56 seed base already present on main' >&2
            exit 1
          fi

          gh api "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" --paginate --slurp > issue60-comments.json
          python - <<'PY'
          import json,re
          pages=json.load(open('issue60-comments.json'))
          comments=[c for page in pages for c in page]
          active={}
          pat=re.compile(r'(?:^|[|\s])(begin|beginComment|begin_comment)=([^\s|]+)')
          for c in comments:
              first=((c.get('body') or '').splitlines() or [''])[0].strip()
              if first.startswith('WRITE_QUIET_BEGIN'):
                  active[int(c['id'])]=first
              elif first.startswith('WRITE_QUIET_END'):
                  vals=[]
                  for _,v in pat.findall(first):
                      if not v.isdigit():
                          raise SystemExit(f'non-numeric WRITE_QUIET_END id {c["id"]}')
                      vals.append(int(v))
                  if vals:
                      if len(set(vals))!=1:
                          raise SystemExit(f'conflicting WRITE_QUIET_END ids {c["id"]}')
                      active.pop(vals[0],None)
          if active:
              raise SystemExit(f'unmatched WRITE_QUIET_BEGIN: {active}')
          print('ISSUE60_FENCE_CLEAR',len(comments))
          PY

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORD55_RECOVERY_RUN" > ord55-recovery-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ORD55_RECOVERY_ARTIFACT" > ord55-recovery-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$ORD55_RESULT_COMMENT" > ord55-result-comment.json
          gh api "repos/$GITHUB_REPOSITORY/issues/861" > issue861.json
          python - <<'PY'
          import json,os
          r=json.load(open('ord55-recovery-run.json'))
          a=json.load(open('ord55-recovery-artifact.json'))
          c=json.load(open('ord55-result-comment.json'))
          i=json.load(open('issue861.json'))
          assert r['head_sha']==os.environ['ORD55_RECOVERY_HEAD'] and r['run_attempt']==1 and r['conclusion']=='success'
          assert str(a['id'])==os.environ['ORD55_RECOVERY_ARTIFACT'] and a['digest']==os.environ['ORD55_RECOVERY_DIGEST'] and not a['expired']
          assert i['state']=='closed' and i['state_reason']=='completed'
          body=c.get('body') or ''
          assert 'ALIS_IMPORTANCE_SCREEN_RETAINS_550' in body
          assert 'Nominated importance center: `550` nm' in body
          assert 'stop post-hoc ALIS importance-wavelength tuning' in body
          assert 'do not launch the 81-direction grid' in body
          print('ORDINAL55_TERMINAL_RETAINS_550_BOUND')
          PY
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: koomen-mono550-cv-preflight
          create-args: >-
            -c conda-forge
            python=3.12.4
            numpy=2.3.2
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Verify exact runtime and monochromatic syntax
        shell: bash -el {0}
        run: |
          set -euo pipefail
          mkdir -p frozen-source mono-syntax
          git show "$SOURCE_SHA:experiments/mystic-batch-v1/runtime-lock.micromamba.json" > frozen-source/runtime-lock.json
          git show "$SOURCE_SHA:experiments/mystic-batch-v1/runtime_probe.py" > frozen-source/runtime_probe.py
          git show "$SOURCE_SHA:experiments/taylor-ann-arbor-sqm-mystic-v1/run_row.py" > frozen-source/run_row.py
          git show "$SOURCE_SHA:experiments/taylor-ann-arbor-sqm-mystic-v1/observations.csv" > frozen-source/observations.csv
          UVSPEC="$(command -v uvspec)"
          DATA_DIR="$CONDA_PREFIX/share/libRadtran/data"
          ATM="$DATA_DIR/atmmod/afglus.dat"
          python frozen-source/runtime_probe.py --uvspec "$UVSPEC" --data-dir "$DATA_DIR" --atmosphere "$ATM" --runtime-lock frozen-source/runtime-lock.json --output runtime-report.json
          python - <<'PY'
          import json
          r=json.load(open('runtime-report.json'))
          assert r['uvspecSha256']=='2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3'
          assert r['libRadtranDataTreeSha256']=='ad30b49177e9c84e46497d69faf0c75e466996b0d0003f1de210289ae9f847d7'
          print('RUNTIME_LOCK_PASS')
          PY
          python - "$UVSPEC" "$DATA_DIR" "$ATM" <<'PY'
          import importlib.util,subprocess,sys
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('base','frozen-source/run_row.py'); base=importlib.util.module_from_spec(spec); spec.loader.exec_module(base)
          obs=base.load_observation(Path('frozen-source/observations.csv'),27)
          ray={'thetaDeg':0.0,'relativeAzimuthDeg':0.0}
          text=base.render(Path(sys.argv[2]),Path(sys.argv[3]),Path('mono-syntax'),obs,ray,float(obs['aod550_primary_frozen']),1,1601027996)
          lines=[]
          for line in text.splitlines():
              if line=='wavelength 380 780': lines.append('wavelength 550 550')
              elif line=='mc_vroom off': lines.extend(['mc_vroom on','mc_escape on'])
              elif line=='mc_spectral_is 550.0': continue
              else: lines.append(line)
          mono='\n'.join(lines)+'\n'
          p=subprocess.run([sys.argv[1],'-c'],input=mono,text=True,capture_output=True,cwd='mono-syntax')
          if p.returncode!=0:
              print(p.stdout); print(p.stderr,file=sys.stderr); raise SystemExit(p.returncode)
          print('MONO550_SYNTAX_PASS')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: koomen-mono550-cv-sentinel-ordinal56-preflight
          path: |
            runtime-report.json
            issue60-comments.json
            issue868-comments.json
            ord55-recovery-run.json
            ord55-recovery-artifact.json
            ord55-result-comment.json
            issue861.json
          if-no-files-found: error
          retention-days: 90

  cases:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        replicate: [1,2,3,4,5,6]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.head }}
          persist-credentials: false

      - name: Materialize immutable source files
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$SOURCE_SHA" "$ORD47_HEAD"
          mkdir -p frozen-source
          git show "$SOURCE_SHA:experiments/taylor-ann-arbor-sqm-mystic-v1/run_row.py" > frozen-source/run_row.py
          git show "$SOURCE_SHA:experiments/taylor-ann-arbor-sqm-mystic-v1/observations.csv" > frozen-source/observations.csv
          git show "$ORD47_HEAD:experiments/taylor-paired-profile-crn-v1/run_pair.py" > frozen-source/profile_runner.py
          test "$(git hash-object frozen-source/run_row.py)" = "$BASELINE_RUNNER_BLOB"
          test "$(git hash-object frozen-source/profile_runner.py)" = "$PROFILE_RUNNER_BLOB"

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.CAMS_ARTIFACT_NAME }}
          path: cams
          github-token: ${{ github.token }}
          repository: search-maker/twilight-mystic-experiments
          run-id: ${{ env.CAMS_RUN_ID }}

      - name: Verify CAMS proxy
        shell: bash
        run: echo "$CAMS_PROFILE_SHA256  cams/profile.csv" | sha256sum -c -

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: koomen-mono550-cv56
          create-args: >-
            -c conda-forge
            python=3.12.4
            numpy=2.3.2
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Run frozen ALIS550 and MONO550 sentinel arms
        shell: bash -el {0}
        run: |
          set -euo pipefail
          python "$RUNNER" \
            --replicate '${{ matrix.replicate }}' \
            --manifest "$MANIFEST" \
            --baseline-runner frozen-source/run_row.py \
            --profile-runner frozen-source/profile_runner.py \
            --observations frozen-source/observations.csv \
            --cams-profile cams/profile.csv \
            --uvspec "$(command -v uvspec)" \
            --data-dir "$CONDA_PREFIX/share/libRadtran/data" \
            --output-dir result
          test -s result/sentinel-result.json

      - uses: actions/upload-artifact@v4
        with:
          name: koomen-mono550-cv-sentinel-ordinal56-rep${{ matrix.replicate }}
          path: result/sentinel-result.json
          if-no-files-found: error
          retention-days: 90

  analysis:
    needs: cases
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: koomen-mono550-cv-sentinel-ordinal56-rep*
          path: all-results
          merge-multiple: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'

      - name: Install pinned analysis dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==2.3.2
          python - <<'PY'
          import numpy
          assert numpy.__version__=='2.3.2'
          print('NUMPY_PIN_PASS',numpy.__version__)
          PY

      - name: Apply frozen ordinal56 analysis
        shell: bash
        run: |
          set -euo pipefail
          python "$ANALYZER" --results-root all-results --output analysis-output
          python - <<'PY'
          import json
          x=json.load(open('analysis-output/summary.json'))
          assert x['classification'] in (
            'MONO550_CV_SENTINEL_EQUIVALENT_AND_PRECISION_ELIGIBLE',
            'MONO550_CV_SENTINEL_EQUIVALENT_BUT_PRECISION_INELIGIBLE',
            'MONO550_CV_SENTINEL_NOT_EQUIVALENT',
            'MONO550_CV_SENTINEL_INVALID',
          )
          assert x['TaylorResidualUsed'] is False
          assert x['ordinal54Salvage'] is False
          assert x['importanceWavelengthRetuned'] is False
          assert x['physicalKoomenCorrectionComputed'] is False
          assert x['physicalSupportEnvelopeAuthorized'] is False
          assert x['full81DirectionGridAuthorized'] is False
          assert x['productionAuthorized'] is False
          print(json.dumps({
            'classification':x['classification'],
            'equivalenceFailureCount':x.get('equivalenceFailureCount'),
            'precisionFailureCount':x.get('precisionFailureCount'),
            'runtime':x.get('runtime'),
          },indent=2,sort_keys=True))
          PY

      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: koomen-mono550-cv-sentinel-ordinal56-analysis
          path: analysis-output
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Publish compact immutable ordinal56 result to Issue 868
        env:
          GH_TOKEN: ${{ github.token }}
          ANALYSIS_ARTIFACT_ID: ${{ steps.upload.outputs['artifact-id'] }}
          ANALYSIS_ARTIFACT_DIGEST: ${{ steps.upload.outputs['artifact-digest'] }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > issue-comment.md
          import json,os
          x=json.load(open('analysis-output/summary.json'))
          print('KOOMEN ORDINAL56 MONO550 CONTROL-VARIATE SENTINEL — TERMINAL RESULT')
          print()
          print(f"Classification: `{x['classification']}`")
          print(f"Equivalence failures: `{x.get('equivalenceFailureCount')}` / `{x.get('equivalenceQuantityCount')}`")
          print(f"Control-variate precision failures: `{x.get('precisionFailureCount')}` / `{x.get('precisionQuantityCount')}`")
          if x.get('controlVariate'):
              worst=max(r['seMag'] for r in x['controlVariate'])
              best=min(r['seMag'] for r in x['controlVariate'])
              print(f"Control-variate SE range: `{best:.10f}` .. `{worst:.10f}` mag")
          if x.get('runtime'):
              print(f"Median solver-time ratio MONO550/ALIS550: `{x['runtime']['monoOverAlisMedianRatio']}`")
              print(f"Total solver-time ratio MONO550/ALIS550: `{x['runtime']['monoOverAlisTotalRatio']}`")
          print()
          print('Immutable provenance:')
          print('- fresh ordinal56 identity; attempt 1 only')
          print('- row27; baseline + same CAMS proxy; center + mid180 + outer315')
          print('- ALIS importance center fixed at 550 nm; no importance-wavelength retuning')
          print('- 1,000,000 photons per direction/case/arm/seed; six fresh seed bases')
          print(f"- run `{os.environ['GITHUB_RUN_ID']}`, attempt `{os.environ['GITHUB_RUN_ATTEMPT']}`")
          print(f"- run head `{os.environ['GITHUB_SHA']}`")
          print(f"- analysis artifact `{os.environ['ANALYSIS_ARTIFACT_ID']}`, digest `{os.environ['ANALYSIS_ARTIFACT_DIGEST']}`")
          print()
          c=x['classification']
          if c=='MONO550_CV_SENTINEL_EQUIVALENT_AND_PRECISION_ELIGIBLE':
              print('Frozen consequence: the exact control-variate formula is eligible only for a separate fresh numerical confirmation with new seeds and separately frozen geometry; do not launch the 81-direction grid directly.')
          elif c=='MONO550_CV_SENTINEL_EQUIVALENT_BUT_PRECISION_INELIGIBLE':
              print('Frozen consequence: do not rerun ordinal56 or raise its photons ad hoc. A separate fresh one-level budget-scaling pilot may be preregistered from the measured SE using the frozen 1/sqrt(N) planning rule.')
          elif c=='MONO550_CV_SENTINEL_NOT_EQUIVALENT':
              print('Frozen consequence: abandon dedicated MONO550 as the control anchor for this path; do not tune wavelength to force agreement.')
          else:
              print('Frozen consequence: invalid sentinel; no estimator continuation from this identity.')
          print()
          print('No Taylor residual use, Koomen correction/support-envelope claim, 81-direction-grid authority, production/Level-B authority, or post-result wavelength retuning is created by this sentinel.')
          PY
          gh issue comment 868 --repo "$GITHUB_REPOSITORY" --body-file issue-comment.md
