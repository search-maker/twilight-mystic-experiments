name: Koomen row27 sparse quadratic holdout ordinal54
run-name: Koomen sparse holdout Issue856 ordinal54 | ${{ github.event.pull_request.head.sha }}

on:
  pull_request:
    types: [synchronize]
    paths:
      - 'experiments/koomen-row27-sparse-quadratic-holdout-v1/EXECUTE_ORDINAL54.txt'

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: koomen-row27-sparse-quadratic-holdout-v1-ordinal54
  cancel-in-progress: false

env:
  PKG: experiments/koomen-row27-sparse-quadratic-holdout-v1
  MANIFEST: experiments/koomen-row27-sparse-quadratic-holdout-v1/manifest.json
  RUNNER: experiments/koomen-row27-sparse-quadratic-holdout-v1/run_holdout.py
  ANALYZER: experiments/koomen-row27-sparse-quadratic-holdout-v1/analyze.py
  EXPECTED_BRANCH: science/koomen-row27-sparse-quadratic-holdout-v1-ordinal54
  SOURCE_SHA: 7231bd873859cc8c36fe6749985e0ece193b5de7
  ORD47_HEAD: 2426335c652adacf442122c3a1bcdf9489a10298
  ORD53_HEAD: 7a3d3d0ee314f0fbe4957014462c87e61b6e9745
  ORD53_RUN: '33569491236'
  ORD53_ANALYSIS_ARTIFACT: '9824627985'
  ORD53_ANALYSIS_DIGEST: sha256:5507cb88b183a1c894d891d8889db810fb1db36ad00c6caeb7f5d6f35c4da23a
  ORD53_RESULT_COMMENT: '5501785150'
  CAMS_RUN_ID: '33039911540'
  CAMS_ARTIFACT_NAME: taylor-cams-priorcycle-split-extinction532-v2
  CAMS_PROFILE_SHA256: 6c3a3041b6718db415300323f23da0277752b6c9fc6c806e5eff7c493b060359

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      head: ${{ steps.guard.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - id: guard
        name: Verify frozen ordinal54 identity and training evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_HEAD_REF" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git diff --name-only HEAD^ HEAD)" = "$PKG/EXECUTE_ORDINAL54.txt"
          PARENT="$(git rev-parse HEAD^)"
          test "$(cat "$PKG/EXECUTE_ORDINAL54.txt")" = "AUTHORIZED_EXECUTION_KEY=koomen-row27-sparse-quadratic-holdout-v1:scientific:54 PARENT=$PARENT"

          gh api "repos/$GITHUB_REPOSITORY/issues/856/comments?per_page=100" --paginate --slurp > issue856-comments.json
          python - "$PARENT" <<'PY'
          import json,sys
          parent=sys.argv[1]
          pages=json.load(open('issue856-comments.json'))
          comments=[c for page in pages for c in page]
          token=f'KOOMEN856_ORDINAL54_PREREGISTERED_HEAD={parent}'
          hits=[c for c in comments if token in (c.get('body') or '')]
          if len(hits)!=1:
              raise SystemExit(f'expected one preregistration for {parent}, got {len(hits)}')
          print('PREREGISTRATION_PASS',hits[0]['id'])
          PY

          python -m json.tool "$MANIFEST" >/dev/null
          python -m py_compile "$RUNNER" "$ANALYZER"
          python - <<'PY'
          import json
          m=json.load(open('experiments/koomen-row27-sparse-quadratic-holdout-v1/manifest.json'))
          assert m['stageId']=='koomen-row27-sparse-quadratic-holdout-v1'
          assert m['executionKey']=='koomen-row27-sparse-quadratic-holdout-v1:scientific:54'
          assert m['issue']==856 and m['row']==27 and m['supportRadiusDeg']==0.75
          assert m['surrogate']['form']=='delta(u,v)=b*u+c*u^2+d*v^2'
          assert m['surrogate']['trainingOnlyFromOrdinal53Cardinals'] is True
          assert m['surrogate']['holdoutsNeverRefitCoefficients'] is True
          assert m['operatorHierarchy']['primary']=='ciePhotopicQ'
          assert m['operatorHierarchy']['secondaryNonDecisional']=='sqmConditionalQ'
          assert m['operatorHierarchy']['doesNotReinterpretOrdinal53'] is True
          assert [d['directionIndex'] for d in m['freshDirections']]==[0,10,11,12,13,14,15,16,17,18]
          assert m['replicateSeedBases']==[1581000000,1582000000,1583000000,1584000000,1585000000,1586000000]
          assert m['photonsPerDirectionPerCase']==6500000
          assert m['maximumSolverCalls']==120 and m['maximumConfiguredPhotonHistories']==780000000
          assert m['analysis']['primaryHoldoutQuantityCount']==18 and m['analysis']['primarySymmetryQuantityCount']==4
          assert m['analysis']['combinedSeThresholdMag']==0.03
          assert m['analysis']['secondaryNeverChangesClassification'] is True
          assert all(m['analysis'][k] is False for k in ('fitTaylor','fitAcceptance','fitFov','fitSpectralResponse','fitOffset','fitAtmosphere','fitAod','fitProfile','fitAnyParameter'))
          assert all(m['boundaries'][k] is False for k in ('TaylorResidualUsed','historicalAcceptanceInvented','exactHistoricalSpectralResponseClaimed','physicalKoomenCorrectionComputed','physicalSupportEnvelopeAuthorized','full81DirectionGridAuthorized','productionAuthorized','priorOrdinalsRerunAuthorized'))
          print('FROZEN_SURROGATE_MANIFEST_PASS')
          PY

          git fetch --no-tags --depth=1 origin main
          if git grep -n -E '(^|[^0-9])(1581000000|1582000000|1583000000|1584000000|1585000000|1586000000)([^0-9]|$)' origin/main -- .; then
            echo 'candidate ordinal54 seed base already present on main' >&2
            exit 1
          fi

          gh api "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" --paginate --slurp > issue60-comments.json
          python - <<'PY'
          import json,re
          pages=json.load(open('issue60-comments.json'))
          comments=[c for page in pages for c in page]
          active={}
          pat=re.compile(r'(?:^|[|\s])(begin|beginComment|begin_comment)=([^\s|]+)')
          for c in comments:
              first=((c.get('body') or '').splitlines() or [''])[0].strip()
              if first.startswith('WRITE_QUIET_BEGIN'):
                  active[int(c['id'])]=first
              elif first.startswith('WRITE_QUIET_END'):
                  vals=[]
                  for _,v in pat.findall(first):
                      if not v.isdigit():
                          raise SystemExit(f'non-numeric END id {c["id"]}')
                      vals.append(int(v))
                  if vals:
                      if len(set(vals))!=1:
                          raise SystemExit(f'conflicting END ids {c["id"]}')
                      active.pop(vals[0],None)
          if active:
              raise SystemExit(f'unmatched WRITE_QUIET_BEGIN: {active}')
          print('ISSUE60_FENCE_CLEAR',len(comments))
          PY

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORD53_RUN" > ord53-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORD53_RUN/artifacts?per_page=100" > ord53-artifacts.json
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$ORD53_RESULT_COMMENT" > ord53-result-comment.json
          python - <<'PY'
          import json,os
          m=json.load(open('experiments/koomen-row27-sparse-quadratic-holdout-v1/manifest.json'))
          r=json.load(open('ord53-run.json')); arts=json.load(open('ord53-artifacts.json'))['artifacts']; c=json.load(open('ord53-result-comment.json'))
          assert r['head_sha']==os.environ['ORD53_HEAD'] and r['run_attempt']==1 and r['conclusion']=='success'
          assert int(c['id'])==int(os.environ['ORD53_RESULT_COMMENT'])
          body=c.get('body') or ''
          assert 'ROW27_VROOM_6P5M_PRECISION_FAIL' in body
          assert 'do not increase photons ad hoc' in body.lower()
          by_id={int(a['id']):a for a in arts}
          aa=by_id[int(os.environ['ORD53_ANALYSIS_ARTIFACT'])]
          assert aa['digest']==os.environ['ORD53_ANALYSIS_DIGEST'] and not aa['expired']
          for expected in m['ordinal53TrainingEvidence']['replicateArtifacts']:
              a=by_id[int(expected['id'])]
              assert a['name']==expected['name'] and a['digest']==expected['digest'] and not a['expired']
          print('ORDINAL53_IMMUTABLE_TRAINING_ARTIFACTS_BOUND',len(m['ordinal53TrainingEvidence']['replicateArtifacts']))
          PY
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: koomen-sparse-holdout-preflight
          create-args: >-
            -c conda-forge
            python=3.12.4
            numpy=2.3.2
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Verify exact runtime and frozen source compatibility
        shell: bash -el {0}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$SOURCE_SHA" "$ORD47_HEAD"
          mkdir -p frozen-source
          git show "$SOURCE_SHA:experiments/mystic-batch-v1/runtime-lock.micromamba.json" > frozen-source/runtime-lock.json
          git show "$SOURCE_SHA:experiments/mystic-batch-v1/runtime_probe.py" > frozen-source/runtime_probe.py
          git show "$SOURCE_SHA:experiments/taylor-ann-arbor-sqm-mystic-v1/run_row.py" > frozen-source/run_row.py
          git show "$ORD47_HEAD:experiments/taylor-paired-profile-crn-v1/run_pair.py" > frozen-source/profile_runner.py
          grep -q 'mc_vroom off' frozen-source/run_row.py
          grep -q 'mc_vroom off' frozen-source/profile_runner.py
          grep -q '^PHOTONS = 200000$' frozen-source/profile_runner.py
          UVSPEC="$(command -v uvspec)"
          DATA_DIR="$CONDA_PREFIX/share/libRadtran/data"
          ATM="$DATA_DIR/atmmod/afglus.dat"
          python frozen-source/runtime_probe.py --uvspec "$UVSPEC" --data-dir "$DATA_DIR" --atmosphere "$ATM" --runtime-lock frozen-source/runtime-lock.json --output runtime-report.json
          python - <<'PY'
          import json
          r=json.load(open('runtime-report.json'))
          assert r['uvspecSha256']=='2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3'
          assert r['libRadtranDataTreeSha256']=='ad30b49177e9c84e46497d69faf0c75e466996b0d0003f1de210289ae9f847d7'
          print('RUNTIME_LOCK_PASS')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: koomen-row27-sparse-quadratic-ordinal54-preflight
          path: |
            runtime-report.json
            issue60-comments.json
            issue856-comments.json
            ord53-run.json
            ord53-artifacts.json
            ord53-result-comment.json
          if-no-files-found: error
          retention-days: 90

  cases:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        replicate: [1,2,3,4,5,6]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.head }}
          persist-credentials: false

      - name: Materialize immutable source files
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$SOURCE_SHA" "$ORD47_HEAD"
          mkdir -p frozen-source
          for f in run_row.py observations.csv sqm_response.csv; do
            git show "$SOURCE_SHA:experiments/taylor-ann-arbor-sqm-mystic-v1/$f" > "frozen-source/$f"
          done
          git show "$ORD47_HEAD:experiments/taylor-paired-profile-crn-v1/run_pair.py" > frozen-source/profile_runner.py

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.CAMS_ARTIFACT_NAME }}
          path: cams
          github-token: ${{ github.token }}
          repository: search-maker/twilight-mystic-experiments
          run-id: ${{ env.CAMS_RUN_ID }}

      - name: Verify CAMS proxy
        shell: bash
        run: echo "$CAMS_PROFILE_SHA256  cams/profile.csv" | sha256sum -c -

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: koomen-sparse-holdout54
          create-args: >-
            -c conda-forge
            python=3.12.4
            numpy=2.3.2
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Run fresh sparse holdout directions
        shell: bash -el {0}
        run: |
          set -euo pipefail
          python "$RUNNER" \
            --replicate '${{ matrix.replicate }}' \
            --manifest "$MANIFEST" \
            --baseline-runner frozen-source/run_row.py \
            --profile-runner frozen-source/profile_runner.py \
            --observations frozen-source/observations.csv \
            --response frozen-source/sqm_response.csv \
            --cams-profile cams/profile.csv \
            --uvspec "$(command -v uvspec)" \
            --data-dir "$CONDA_PREFIX/share/libRadtran/data" \
            --output-dir "holdout-rep${{ matrix.replicate }}"

      - uses: actions/upload-artifact@v4
        with:
          name: koomen-row27-sparse-quadratic-ordinal54-rep${{ matrix.replicate }}
          path: holdout-rep${{ matrix.replicate }}/holdout-result.json
          if-no-files-found: error
          retention-days: 90

  analysis:
    needs: cases
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: koomen-row27-sparse-quadratic-ordinal54-rep*
          path: fresh-results
          merge-multiple: false

      - name: Download immutable ordinal53 cardinal training artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: koomen-row27-vroom-precision-ordinal53-rep*
          path: ordinal53-training
          merge-multiple: false
          github-token: ${{ github.token }}
          repository: search-maker/twilight-mystic-experiments
          run-id: ${{ env.ORD53_RUN }}

      - name: Apply frozen sparse-surrogate holdout gates
        shell: bash
        run: |
          set -euo pipefail
          python "$ANALYZER" --training-root ordinal53-training --fresh-root fresh-results --output analysis
          python - <<'PY'
          import json
          x=json.load(open('analysis/summary.json'))
          assert x['classification'] in ('ROW27_SPARSE_QUADRATIC_CIE_HOLDOUT_PASS','ROW27_SPARSE_QUADRATIC_CIE_HOLDOUT_FAIL')
          assert x['decision']['primaryOperator']=='ciePhotopicQ'
          assert x['decision']['secondaryNeverChangesClassification'] is True
          assert x['decision']['primaryHoldoutGateCount']==18 and x['decision']['primarySymmetryGateCount']==4 and x['decision']['primaryTotalGateCount']==22
          assert x['TaylorResidualUsed'] is False
          assert x['historicalAcceptanceInvented'] is False
          assert x['exactHistoricalSpectralResponseClaimed'] is False
          assert x['physicalKoomenCorrectionComputed'] is False
          assert x['physicalSupportEnvelopeAuthorized'] is False
          assert x['full81DirectionGridAuthorized'] is False
          assert x['productionAuthorized'] is False
          print(json.dumps({'classification':x['classification'],'decision':x['decision']},indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: koomen-row27-sparse-quadratic-ordinal54-analysis
          path: analysis/
          if-no-files-found: error
          retention-days: 90
