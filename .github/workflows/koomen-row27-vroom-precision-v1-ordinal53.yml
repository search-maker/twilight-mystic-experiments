name: Koomen row27 VROOM precision ordinal53
run-name: Koomen row27 precision Issue854 ordinal53 | ${{ github.event.pull_request.head.sha }}

on:
  pull_request:
    types: [synchronize]
    paths:
      - 'experiments/koomen-row27-vroom-precision-v1/EXECUTE_ORDINAL53.txt'

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: koomen-row27-vroom-precision-v1-ordinal53
  cancel-in-progress: false

env:
  PKG: experiments/koomen-row27-vroom-precision-v1
  MANIFEST: experiments/koomen-row27-vroom-precision-v1/manifest.json
  RUNNER: experiments/koomen-row27-vroom-precision-v1/run_pilot.py
  ANALYZER: experiments/koomen-row27-vroom-precision-v1/analyze.py
  EXPECTED_BRANCH: science/koomen-row27-vroom-precision-v1-ordinal53
  SOURCE_SHA: 7231bd873859cc8c36fe6749985e0ece193b5de7
  ORD47_HEAD: 2426335c652adacf442122c3a1bcdf9489a10298
  ORD51_HEAD: 0c8e77d2f6b08e2851a2f060f528c684a96c4ffa
  ORD51_RUN: '33566907312'
  ORD51_ANALYSIS_ARTIFACT: '9823555912'
  ORD51_ANALYSIS_ARTIFACT_NAME: koomen-estimator-pilot-ordinal51-analysis
  ORD51_ANALYSIS_DIGEST: sha256:8dca395007e801abff62a752064edd3ee013746f5b7e839bfb3876e9069e4f22
  ORD52_HEAD: b8d205fce7733fc5617002966d85b05ba809d285
  ORD52_RUN: '33568274053'
  ORD52_ANALYSIS_ARTIFACT: '9824075502'
  ORD52_ANALYSIS_ARTIFACT_NAME: koomen-vroom-equivalence-sentinel-ordinal52-analysis
  ORD52_ANALYSIS_DIGEST: sha256:1402f3a77b43ecce2fba4591969458102deba7558b9ab51a8c4d7a90458cd09b
  ORD52_RESULT_COMMENT: '5501541216'
  CAMS_RUN_ID: '33039911540'
  CAMS_ARTIFACT_NAME: taylor-cams-priorcycle-split-extinction532-v2
  CAMS_PROFILE_SHA256: 6c3a3041b6718db415300323f23da0277752b6c9fc6c806e5eff7c493b060359

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      head: ${{ steps.guard.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - id: guard
        name: Verify frozen ordinal53 identity and eligibility
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_HEAD_REF" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git diff --name-only HEAD^ HEAD)" = "$PKG/EXECUTE_ORDINAL53.txt"
          PARENT="$(git rev-parse HEAD^)"
          test "$(cat "$PKG/EXECUTE_ORDINAL53.txt")" = "AUTHORIZED_EXECUTION_KEY=koomen-row27-vroom-precision-v1:scientific:53 PARENT=$PARENT"

          gh api "repos/$GITHUB_REPOSITORY/issues/854/comments?per_page=100" --paginate --slurp > issue854-comments.json
          python - "$PARENT" <<'PY'
          import json,sys
          parent=sys.argv[1]
          pages=json.load(open('issue854-comments.json'))
          comments=[c for page in pages for c in page]
          token=f'KOOMEN854_ORDINAL53_PREREGISTERED_HEAD={parent}'
          hits=[c for c in comments if token in (c.get('body') or '')]
          if len(hits)!=1:
              raise SystemExit(f'expected one preregistration for {parent}, got {len(hits)}')
          print('PREREGISTRATION_PASS',hits[0]['id'])
          PY

          python -m json.tool "$MANIFEST" >/dev/null
          python -m py_compile "$RUNNER" "$ANALYZER"
          python - <<'PY'
          import json,math
          m=json.load(open('experiments/koomen-row27-vroom-precision-v1/manifest.json'))
          assert m['stageId']=='koomen-row27-vroom-precision-v1'
          assert m['executionKey']=='koomen-row27-vroom-precision-v1:scientific:53'
          assert m['issue']==854 and m['row']==27
          assert [d['directionIndex'] for d in m['fixedDirections']]==[0,1,2,3,4]
          assert m['method']=='mc_vroom_on' and m['mcEscapeExplicit']=='on'
          assert m['replicateSeedBases']==[1571000000,1572000000,1573000000,1574000000,1575000000,1576000000]
          assert m['photonsPerDirectionPerCase']==6500000
          assert m['maximumSolverCalls']==60 and m['maximumConfiguredPhotonHistories']==390000000
          assert m['analysis']['edgeMinusCenterSeThresholdMag']==0.03 and m['analysis']['edgeQuantityCount']==16
          assert abs(m['planning']['expectedSqrtScalingFactor']-math.sqrt(32.5)) < 1e-12
          assert all(m['analysis'][k] is False for k in ('fitTaylor','fitAcceptance','fitFov','fitOffset','fitAtmosphere','fitAod','fitProfile','fitAnyParameter'))
          assert all(m['boundaries'][k] is False for k in ('TaylorResidualUsed','historicalKoomenCorrectionComputed','physicalSupportEnvelopeAuthorized','full81DirectionGridAuthorized','productionAuthorized','priorOrdinalsRerunAuthorized'))
          print('FROZEN_PRECISION_MANIFEST_PASS')
          PY

          git fetch --no-tags --depth=1 origin main
          if git grep -n -E '(^|[^0-9])(1571000000|1572000000|1573000000|1574000000|1575000000|1576000000)([^0-9]|$)' origin/main -- .; then
            echo 'candidate ordinal53 seed base already present on main' >&2
            exit 1
          fi

          gh api "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" --paginate --slurp > issue60-comments.json
          python - <<'PY'
          import json,re
          pages=json.load(open('issue60-comments.json'))
          comments=[c for page in pages for c in page]
          active={}
          pat=re.compile(r'(?:^|[|\s])(begin|beginComment|begin_comment)=([^\s|]+)')
          for c in comments:
              first=((c.get('body') or '').splitlines() or [''])[0].strip()
              if first.startswith('WRITE_QUIET_BEGIN'):
                  active[int(c['id'])]=first
              elif first.startswith('WRITE_QUIET_END'):
                  vals=[]
                  for _,v in pat.findall(first):
                      if not v.isdigit():
                          raise SystemExit(f'non-numeric END id {c["id"]}')
                      vals.append(int(v))
                  if vals:
                      if len(set(vals))!=1:
                          raise SystemExit(f'conflicting END ids {c["id"]}')
                      active.pop(vals[0],None)
          if active:
              raise SystemExit(f'unmatched WRITE_QUIET_BEGIN: {active}')
          print('ISSUE60_FENCE_CLEAR',len(comments))
          PY

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORD51_RUN" > ord51-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ORD51_ANALYSIS_ARTIFACT" > ord51-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORD52_RUN" > ord52-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ORD52_ANALYSIS_ARTIFACT" > ord52-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$ORD52_RESULT_COMMENT" > ord52-result-comment.json
          python - <<'PY'
          import json,os
          r51=json.load(open('ord51-run.json')); a51=json.load(open('ord51-artifact.json'))
          assert r51['head_sha']==os.environ['ORD51_HEAD'] and r51['run_attempt']==1 and r51['conclusion']=='success'
          assert str(a51['id'])==os.environ['ORD51_ANALYSIS_ARTIFACT'] and a51['name']==os.environ['ORD51_ANALYSIS_ARTIFACT_NAME'] and a51['digest']==os.environ['ORD51_ANALYSIS_DIGEST'] and not a51['expired']
          r52=json.load(open('ord52-run.json')); a52=json.load(open('ord52-artifact.json')); c52=json.load(open('ord52-result-comment.json'))
          assert r52['head_sha']==os.environ['ORD52_HEAD'] and r52['run_attempt']==1 and r52['conclusion']=='success'
          assert str(a52['id'])==os.environ['ORD52_ANALYSIS_ARTIFACT'] and a52['name']==os.environ['ORD52_ANALYSIS_ARTIFACT_NAME'] and a52['digest']==os.environ['ORD52_ANALYSIS_DIGEST'] and not a52['expired']
          assert int(c52['id'])==int(os.environ['ORD52_RESULT_COMMENT'])
          assert 'VROOM_HIGH_PHOTON_EQUIVALENCE_SENTINEL_PASS' in (c52.get('body') or '')
          print('ORDINAL51_AND_52_IMMUTABLE_EVIDENCE_BOUND')
          PY
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: koomen-row27-precision-preflight
          create-args: >-
            -c conda-forge
            python=3.12.4
            numpy=2.3.2
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Verify exact runtime and frozen source compatibility
        shell: bash -el {0}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$SOURCE_SHA" "$ORD47_HEAD"
          mkdir -p frozen-source
          git show "$SOURCE_SHA:experiments/mystic-batch-v1/runtime-lock.micromamba.json" > frozen-source/runtime-lock.json
          git show "$SOURCE_SHA:experiments/mystic-batch-v1/runtime_probe.py" > frozen-source/runtime_probe.py
          git show "$SOURCE_SHA:experiments/taylor-ann-arbor-sqm-mystic-v1/run_row.py" > frozen-source/run_row.py
          git show "$ORD47_HEAD:experiments/taylor-paired-profile-crn-v1/run_pair.py" > frozen-source/profile_runner.py
          grep -q 'mc_vroom off' frozen-source/run_row.py
          grep -q 'mc_vroom off' frozen-source/profile_runner.py
          grep -q '^PHOTONS = 200000$' frozen-source/profile_runner.py
          UVSPEC="$(command -v uvspec)"
          DATA_DIR="$CONDA_PREFIX/share/libRadtran/data"
          ATM="$DATA_DIR/atmmod/afglus.dat"
          python frozen-source/runtime_probe.py --uvspec "$UVSPEC" --data-dir "$DATA_DIR" --atmosphere "$ATM" --runtime-lock frozen-source/runtime-lock.json --output runtime-report.json
          python - <<'PY'
          import json
          r=json.load(open('runtime-report.json'))
          assert r['uvspecSha256']=='2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3'
          assert r['libRadtranDataTreeSha256']=='ad30b49177e9c84e46497d69faf0c75e466996b0d0003f1de210289ae9f847d7'
          print('RUNTIME_LOCK_PASS')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: koomen-row27-vroom-precision-ordinal53-preflight
          path: |
            runtime-report.json
            issue60-comments.json
            issue854-comments.json
            ord51-run.json
            ord51-artifact.json
            ord52-run.json
            ord52-artifact.json
            ord52-result-comment.json
          if-no-files-found: error
          retention-days: 90

  cases:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        replicate: [1,2,3,4,5,6]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.head }}
          persist-credentials: false

      - name: Materialize immutable source files
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$SOURCE_SHA" "$ORD47_HEAD"
          mkdir -p frozen-source
          for f in run_row.py observations.csv sqm_response.csv; do
            git show "$SOURCE_SHA:experiments/taylor-ann-arbor-sqm-mystic-v1/$f" > "frozen-source/$f"
          done
          git show "$ORD47_HEAD:experiments/taylor-paired-profile-crn-v1/run_pair.py" > frozen-source/profile_runner.py

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.CAMS_ARTIFACT_NAME }}
          path: cams
          github-token: ${{ github.token }}
          repository: search-maker/twilight-mystic-experiments
          run-id: ${{ env.CAMS_RUN_ID }}

      - name: Verify CAMS proxy
        shell: bash
        run: echo "$CAMS_PROFILE_SHA256  cams/profile.csv" | sha256sum -c -

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: koomen-row27-precision53
          create-args: >-
            -c conda-forge
            python=3.12.4
            numpy=2.3.2
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Run 6.5M-photon row27 VROOM precision pilot
        shell: bash -el {0}
        run: |
          set -euo pipefail
          python "$RUNNER" \
            --replicate '${{ matrix.replicate }}' \
            --manifest "$MANIFEST" \
            --baseline-runner frozen-source/run_row.py \
            --profile-runner frozen-source/profile_runner.py \
            --observations frozen-source/observations.csv \
            --response frozen-source/sqm_response.csv \
            --cams-profile cams/profile.csv \
            --uvspec "$(command -v uvspec)" \
            --data-dir "$CONDA_PREFIX/share/libRadtran/data" \
            --output-dir "precision-rep${{ matrix.replicate }}"

      - uses: actions/upload-artifact@v4
        with:
          name: koomen-row27-vroom-precision-ordinal53-rep${{ matrix.replicate }}
          path: precision-rep${{ matrix.replicate }}/precision-result.json
          if-no-files-found: error
          retention-days: 90

  analysis:
    needs: cases
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: koomen-row27-vroom-precision-ordinal53-rep*
          path: all-results
          merge-multiple: false

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.ORD51_ANALYSIS_ARTIFACT_NAME }}
          path: ordinal51-analysis
          github-token: ${{ github.token }}
          repository: search-maker/twilight-mystic-experiments
          run-id: ${{ env.ORD51_RUN }}

      - name: Apply frozen row27 precision gates
        shell: bash
        run: |
          set -euo pipefail
          python "$ANALYZER" --results-root all-results --ordinal51-summary ordinal51-analysis/summary.json --output analysis
          python - <<'PY'
          import json
          x=json.load(open('analysis/summary.json'))
          assert x['classification'] in ('ROW27_VROOM_6P5M_PRECISION_PASS','ROW27_VROOM_6P5M_PRECISION_FAIL')
          assert x['decision']['gateCount']==16
          assert x['TaylorResidualUsed'] is False
          assert x['historicalKoomenCorrectionComputed'] is False
          assert x['physicalSupportEnvelopeAuthorized'] is False
          assert x['full81DirectionGridAuthorized'] is False
          assert x['productionAuthorized'] is False
          print(json.dumps({'classification':x['classification'],'decision':x['decision'],'scaling':x['scaling']},indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: koomen-row27-vroom-precision-ordinal53-analysis
          path: analysis/
          if-no-files-found: error
          retention-days: 90
