name: Level-B private exact-head build probe

on:
  pull_request:
    paths:
      - '.github/workflows/level-b-private-exact-head-build-probe.yml'

permissions:
  contents: read

jobs:
  build-probe:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APPLICATION_SHA: 5d8bc6b75bbaee5c5a2d9f310045c53191588929
      EXPECTED_MAIN_SHA: 5e95eceb316583db63db05c593541a0a85f48d2b
      PUBLIC_ASSET_COMMIT: 4b71445139e24236f12952ab41c791bd07a9f7db
      STARSVISIBILITY_READ_TOKEN: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}

    steps:
      - name: Require exact immutable binding
        shell: bash
        run: |
          set -euo pipefail
          test -n "${STARSVISIBILITY_READ_TOKEN:-}" || { echo 'Required read-only secret unavailable.' >&2; exit 78; }
          printf '%s' "$APPLICATION_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$EXPECTED_MAIN_SHA" | grep -Eq '^[0-9a-f]{40}$'

      - name: Checkout exact private head
        uses: actions/checkout@v4
        with:
          repository: search-maker/starsvisibility
          ref: ${{ env.APPLICATION_SHA }}
          token: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}
          path: private-app
          persist-credentials: false
          fetch-depth: 5

      - name: Checkout frozen public stellar assets
        uses: actions/checkout@v4
        with:
          repository: search-maker/twilight-mystic-experiments
          ref: ${{ env.PUBLIC_ASSET_COMMIT }}
          path: public-assets
          persist-credentials: false
          fetch-depth: 1

      - name: Verify parent and sanitize remotes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C private-app rev-parse HEAD)" = "$APPLICATION_SHA"
          git -C private-app merge-base --is-ancestor "$EXPECTED_MAIN_SHA" HEAD
          git -C private-app remote remove origin || true
          git -C public-assets remote remove origin || true
          mkdir -p private-app/scientific-tools/visibility-v3/generated
          cp public-assets/generated/level-b-stellar-v2/pickles-sed-1nm.json private-app/scientific-tools/visibility-v3/generated/pickles-sed-1nm.json
          cp public-assets/generated/level-b-stellar-v2/stellar-transport-v2-lut.json private-app/scientific-tools/visibility-v3/generated/stellar-transport-v2-lut.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: private-app
        shell: bash
        run: npm ci

      - name: Run exact Pages build
        working-directory: private-app
        shell: bash
        run: |
          set -euo pipefail
          GITHUB_SHA="$APPLICATION_SHA" npm run build:pages
          grep -Fq 'WEEKLY-WORKER-TERMINAL-CONTRACT-V1' dist/index.html
          grep -Fq 'WEEKLY-ATMOSPHERE-UNAVAILABLE-DATE-CONTRACT-V1' dist/index.html
          grep -Fq 'WEEKLY-WORKER-ATMOSPHERE-DIAGNOSTIC-V1' dist/index.html
          ! grep -Fq "const prefix = document.documentElement.lang === 'en' ? 'Level-B atmosphere unavailable'" dist/index.html
          python - <<'PY'
          import json, os
          from pathlib import Path
          marker=json.loads(Path('dist/level-b-software-status.json').read_text())
          assert marker['commitSha'] == os.environ['APPLICATION_SHA']
          PY
