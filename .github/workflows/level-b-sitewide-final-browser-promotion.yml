name: Level-B site-wide final deployed-browser promotion

on:
  pull_request:
    paths:
      - '.github/workflows/level-b-sitewide-final-browser-promotion.yml'
      - 'tools/level_b_0079_browser_qa.mjs'

permissions:
  contents: read

concurrency:
  group: level-b-sitewide-final-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  promotion:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APPLICATION_SHA: 68feedaa8d1bbf6172a44388ebceb1c0a63725e0
      REQUIRED_MAIN_SHA: d507fdcefdcbad53095097d485aa6c0a0f3870bd
      HISTORICAL_0079_PARENT_SHA: a2c821ed85257e921fa74345c79bc429cd5501f5
      PUBLIC_ASSET_COMMIT: 4b71445139e24236f12952ab41c791bd07a9f7db
      DEPLOYMENT_URL: https://37db28a9.starsvisibility.pages.dev
      EXPECTED_PROTOCOL_SHA256: aae80c6c958c0d3dabe9e841be50b4fca52e1b5fb717e834d361172bfed00fef
      EXPECTED_SED_SHA256: 85cbf41c86309b9d54d4765516167165f2d8736bcda8994337ef25d775ea11cb
      EXPECTED_LUT_SHA256: 21eeb51fcc5287ab3bb8cb59cfe0bb0073f34e9ca1b6cc6df988c6eb5043631f
      EXPECTED_JOHNSON_V_SHA256: 51c357eb4cb3609361759f9750ad13ae13a901970913e3a5d87bb5c45ee2db9a
      STARSVISIBILITY_READ_TOKEN: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}

    steps:
      - name: Require exact immutable bindings and read-only credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${STARSVISIBILITY_READ_TOKEN:-}" || { echo 'Required read-only secret unavailable.' >&2; exit 78; }
          for value in "$APPLICATION_SHA" "$REQUIRED_MAIN_SHA" "$HISTORICAL_0079_PARENT_SHA" "$PUBLIC_ASSET_COMMIT"; do
            printf '%s' "$value" | grep -Eq '^[0-9a-f]{40}$'
          done
          test "$DEPLOYMENT_URL" = 'https://37db28a9.starsvisibility.pages.dev'
          echo "Exact MYSTIC-STATE-0079 application head: $APPLICATION_SHA"

      - name: Checkout clean public runner source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout immutable validated stellar assets
        uses: actions/checkout@v4
        with:
          repository: search-maker/twilight-mystic-experiments
          ref: ${{ env.PUBLIC_ASSET_COMMIT }}
          path: public-assets
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact private 0079 head
        uses: actions/checkout@v4
        with:
          repository: search-maker/starsvisibility
          ref: ${{ env.APPLICATION_SHA }}
          token: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}
          path: private-app
          persist-credentials: false
          fetch-depth: 2

      - name: Verify exact reconciliation ancestry, scientific bindings, and sanitize remotes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C private-app rev-parse HEAD)" = "$APPLICATION_SHA"
          test "$(git -C public-assets rev-parse HEAD)" = "$PUBLIC_ASSET_COMMIT"
          git -C private-app cat-file -p HEAD | grep -Fx "parent $HISTORICAL_0079_PARENT_SHA"
          git -C private-app cat-file -p HEAD | grep -Fx "parent $REQUIRED_MAIN_SHA"
          git -C private-app remote remove origin || true
          git -C public-assets remote remove origin || true
          test "$(sha256sum private-app/scientific-tools/visibility-v3/STELLAR_TRANSPORT_VALIDATION_PROTOCOL_V2.md | awk '{print $1}')" = "$EXPECTED_PROTOCOL_SHA256"
          test "$(sha256sum public-assets/generated/level-b-stellar-v2/pickles-sed-1nm.json | awk '{print $1}')" = "$EXPECTED_SED_SHA256"
          test "$(sha256sum public-assets/generated/level-b-stellar-v2/stellar-transport-v2-lut.json | awk '{print $1}')" = "$EXPECTED_LUT_SHA256"
          python - <<'PY'
          import json, os
          from pathlib import Path
          b=json.loads(Path('private-app/scientific-tools/visibility-v3/stellar-v2-asset-binding.json').read_text())
          assert b['mysticState'] == 'MYSTIC-STATE-0081'
          assert b['publicAssetCommit'] == os.environ['PUBLIC_ASSET_COMMIT']
          assert b['protocolSha256'] == os.environ['EXPECTED_PROTOCOL_SHA256']
          assert b['sedBundleSha256'] == os.environ['EXPECTED_SED_SHA256']
          assert b['spectralRuntimeSha256'] == os.environ['EXPECTED_LUT_SHA256']
          assert b['johnsonVBandpassSha256'] == os.environ['EXPECTED_JOHNSON_V_SHA256']
          assert b['freshValidationCaseCount'] == 576
          assert b['maxAbsDeltaAvMag'] <= b['maxAbsDeltaAvMagLimit']
          assert b['rmsDeltaAvMag'] <= b['rmsDeltaAvMagLimit']
          assert b['parsedScienceMatchesOriginalPassAfterRemovingVolatileRawResponseHashes'] is True
          PY
          mkdir -p private-app/scientific-tools/visibility-v3/generated
          cp public-assets/generated/level-b-stellar-v2/pickles-sed-1nm.json private-app/scientific-tools/visibility-v3/generated/pickles-sed-1nm.json
          cp public-assets/generated/level-b-stellar-v2/stellar-transport-v2-lut.json private-app/scientific-tools/visibility-v3/generated/stellar-transport-v2-lut.json
          test -z "$(git -C private-app remote -v)"
          test -z "$(git -C public-assets remote -v)"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install private application dependencies
        working-directory: private-app
        shell: bash
        run: npm ci

      - name: Run exact parity, sunset audit, site-wide regressions, and Pages build
        working-directory: private-app
        shell: bash
        run: |
          set -euo pipefail
          npm run prepare:level-b-stellar-v2
          npm run test:level-b-parity
          node scientific-tools/visibility-v3/tests/audit-sunset-adaptation-prehistory-timing.mjs --output "$RUNNER_TEMP/0079-sunset-audit.json"
          node scientific-tools/visibility-v3/tests/audit-stellar-transport-v2-timing.mjs --output "$RUNNER_TEMP/0079-spectral-audit.json"
          GITHUB_SHA="$APPLICATION_SHA" npm run build:pages
          node scripts/test-level-b-stellar-v2-dist.mjs
          cp dist/level-b-software-status.json "$RUNNER_TEMP/0079-build-marker.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          sunset=json.loads((root/'0079-sunset-audit.json').read_text())
          assert sunset['scientificAcceptanceGate'] is False
          assert sunset['observationallyCalibrated'] is False
          assert sunset['fixtureCount'] >= 1000
          assert sunset['totalTauCaseCount'] >= 4000
          assert sunset['tauSeconds'] == [20,30,45,60]
          assert sunset['levelBDetectionSkyUsedBelow2Deg'] is False
          assert all(v == 0 for v in sunset['invariants'].values())
          spectral=json.loads((root/'0079-spectral-audit.json').read_text())
          assert spectral['attemptedCaseCount'] == 1600
          assert spectral['commonSupportedLevelBCaseCount'] == 1600
          assert spectral['supportedLegacyCompatibilityCaseCount'] == 1600
          marker=json.loads((root/'0079-build-marker.json').read_text())
          assert marker['commitSha'] == os.environ['APPLICATION_SHA']
          assert marker['stellarTransportState'] == 'MYSTIC-STATE-0081'
          assert marker['stellarTransportProtocolSha256'] == os.environ['EXPECTED_PROTOCOL_SHA256']
          assert marker['stellarTransportSedSha256'] == os.environ['EXPECTED_SED_SHA256']
          assert marker['stellarTransportLutSha256'] == os.environ['EXPECTED_LUT_SHA256']
          assert marker['stellarTransportPublicAssetCommit'] == os.environ['PUBLIC_ASSET_COMMIT']
          PY

      - name: Install Chromium for deployed interactive QA
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-package-lock --no-save playwright@1.61.1
          npx playwright install --with-deps chromium

      - name: Run deployed Jerusalem mode-feature browser matrix
        shell: bash
        env:
          BROWSER_QA_OUTPUT: ${{ runner.temp }}/0079-browser-qa.json
        run: |
          set -euo pipefail
          node tools/level_b_0079_browser_qa.mjs
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'0079-browser-qa.json'
          r=json.loads(p.read_text())
          assert r['pass'] is True
          assert r['applicationSha'] == os.environ['APPLICATION_SHA']
          assert r['deploymentUrl'] == os.environ['DEPLOYMENT_URL']
          assert not r['consoleErrors']
          assert not r['pageErrors']
          pairs={(x['engine'],x['feature']) for x in r['matrix']}
          for engine in ('legacy','level-b-v3-crumey-blackwell-equilibrium','level-b-v3-crumey-blackwell-transient-experimental'):
              assert (engine,'standard') in pairs
              assert (engine,'three-star') in pairs
          features={x['feature'] for x in r['batch']}
          assert {'comparison-day','weekly','sky-map','annual-month-weekly+csv-export'} <= features
          labels={x['label'] for x in r['viewportChecks']}
          assert {'wide-initial','wide-after-dynamic-results','narrow-initial','narrow-after-three-star'} <= labels
          PY

      - name: Seal public-safe final promotion summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/public-summary"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          out={
            'mysticState':'MYSTIC-STATE-0079',
            'applicationSha':os.environ['APPLICATION_SHA'],
            'requiredMainSha':os.environ['REQUIRED_MAIN_SHA'],
            'historical0079ParentSha':os.environ['HISTORICAL_0079_PARENT_SHA'],
            'publicAssetCommit':os.environ['PUBLIC_ASSET_COMMIT'],
            'deploymentUrl':os.environ['DEPLOYMENT_URL'],
            'githubRunId':os.environ['GITHUB_RUN_ID'],
            'githubRunAttempt':os.environ['GITHUB_RUN_ATTEMPT'],
            'claimBoundary':'deployed-browser-and-software-integration-only-not-empirical-real-sky-or-human-validation',
          }
          for name,key in [('0079-sunset-audit.json','sunsetAudit'),('0079-spectral-audit.json','spectralAudit'),('0079-build-marker.json','buildMarker'),('0079-browser-qa.json','browserQa')]:
              p=root/name
              if p.exists(): out[key]=json.loads(p.read_text())
          (root/'public-summary'/'0079-final-promotion-summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:v for k,v in out.items() if k not in ('sunsetAudit','spectralAudit','browserQa')},sort_keys=True))
          PY

      - name: Upload public-safe evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: level-b-sitewide-final-browser-promotion-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/public-summary/0079-final-promotion-summary.json
            ${{ runner.temp }}/0079-sunset-audit.json
            ${{ runner.temp }}/0079-spectral-audit.json
            ${{ runner.temp }}/0079-build-marker.json
            ${{ runner.temp }}/0079-browser-qa.json
