name: Level-B stellar transport v2 exact asset export

on:
  pull_request:
    paths:
      - '.github/workflows/level-b-stellar-transport-v2-assets.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: level-b-stellar-v2-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      APPLICATION_SHA: b88821df557b379935898c682772ed313357bf9f
      EXPECTED_PROTOCOL_SHA256: aae80c6c958c0d3dabe9e841be50b4fca52e1b5fb717e834d361172bfed00fef
      EXPECTED_SED_SHA256: 379f390bddb3f873b3b8cf336776c2bf9b0180b5e7924a8fdca4649bf835438f
      EXPECTED_LUT_SHA256: 21eeb51fcc5287ab3bb8cb59cfe0bb0073f34e9ca1b6cc6df988c6eb5043631f
      EXPECTED_UVSPEC_SHA256: 2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3
      EXPECTED_AFGLUS_SHA256: dab26290ed81c762ed0c607e5dc2d53393c1462a0c3a528bc5e3f5935191cfb5
      STARSVISIBILITY_READ_TOKEN: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}
    steps:
      - name: Require read-only private checkout credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${STARSVISIBILITY_READ_TOKEN:-}" || exit 78
          echo "Exact private application SHA: $APPLICATION_SHA"
          echo "Expected passing SED SHA-256: $EXPECTED_SED_SHA256"
          echo "Expected passing LUT SHA-256: $EXPECTED_LUT_SHA256"

      - name: Checkout public source helpers
        uses: actions/checkout@v4
        with:
          path: bridge
          persist-credentials: false

      - name: Checkout exact passing private application commit
        uses: actions/checkout@v4
        with:
          repository: search-maker/starsvisibility
          ref: ${{ env.APPLICATION_SHA }}
          token: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}
          path: private-app
          persist-credentials: false
          fetch-depth: 1

      - name: Verify private SHA/protocol and sanitize remote
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C private-app rev-parse HEAD)"
          test "$actual" = "$APPLICATION_SHA"
          git -C private-app remote remove origin || true
          protocol='private-app/scientific-tools/visibility-v3/STELLAR_TRANSPORT_VALIDATION_PROTOCOL_V2.md'
          test "$(sha256sum "$protocol" | awk '{print $1}')" = "$EXPECTED_PROTOCOL_SHA256"

      - name: Retrieve exact public Pickles source contract
        shell: bash
        run: |
          set -euo pipefail
          metadata_service='https://vizier.cds.unistra.fr/viz-bin/asu-tsv'
          mkdir -p "$RUNNER_TEMP/pickles98"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --get "$metadata_service" \
            --data-urlencode '-source=J/PASP/110/863/synphot' \
            --data-urlencode '-out=num,SpType,LogTe,file' \
            --data-urlencode '-out.max=unlimited' \
            --data-urlencode '-out.meta=hu' \
            --output "$RUNNER_TEMP/pickles98/synphot.dat"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --get "$metadata_service" \
            --data-urlencode '-source=VI/135/table6' \
            --data-urlencode '-out=Lib,Type,Bmmag,Vcmag' \
            --data-urlencode '-out.max=unlimited' \
            --data-urlencode '-out.meta=hu' \
            --output "$RUNNER_TEMP/table6.dat"
          python bridge/tools/fetch_pickles_raw_sources.py \
            --synphot-tsv "$RUNNER_TEMP/pickles98/synphot.dat" \
            --output-dir "$RUNNER_TEMP/pickles98"

      - name: Set up exact reviewed libRadtran environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: stellar-ref
          create-args: >-
            python=3.12
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          init-shell: bash
          cache-environment: false

      - name: Verify libRadtran and AFGLUS identity
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          uvspec="$(command -v uvspec)"
          test "$(sha256sum "$uvspec" | awk '{print $1}')" = "$EXPECTED_UVSPEC_SHA256"
          data_dir="$(python - <<'PY'
          from pathlib import Path
          import shutil
          u=Path(shutil.which('uvspec')).resolve()
          for p in (u.parent.parent/'share'/'libRadtran'/'data', u.parent.parent/'data'):
              if p.is_dir(): print(p); break
          else: raise SystemExit('libRadtran data dir not found')
          PY
          )"
          test "$(sha256sum "$data_dir/atmmod/afglus.dat" | awk '{print $1}')" = "$EXPECTED_AFGLUS_SHA256"
          echo "LIBRADTRAN_DATA=$data_dir" >> "$GITHUB_ENV"
          echo "UVSPEC=$uvspec" >> "$GITHUB_ENV"

      - name: Rebuild exact passing assets and verify identities
        shell: micromamba-shell {0}
        working-directory: private-app
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/export"
          python scientific-tools/visibility-v3/build_pickles_sed_bundle.py \
            --pickles-dir "$RUNNER_TEMP/pickles98" \
            --libmags-table6 "$RUNNER_TEMP/table6.dat" \
            --output "$RUNNER_TEMP/export/pickles-sed-1nm.json"
          python scientific-tools/visibility-v3/build_stellar_transport_lut.py \
            --output "$RUNNER_TEMP/export/stellar-transport-v2-lut.json"
          sed_sha="$(sha256sum "$RUNNER_TEMP/export/pickles-sed-1nm.json" | awk '{print $1}')"
          lut_sha="$(sha256sum "$RUNNER_TEMP/export/stellar-transport-v2-lut.json" | awk '{print $1}')"
          test "$sed_sha" = "$EXPECTED_SED_SHA256"
          test "$lut_sha" = "$EXPECTED_LUT_SHA256"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'export'/'stellar-transport-v2-lut.json'
          j=json.loads(p.read_text())
          assert len(j['directOpticalDepth']) == 675
          assert j['provenance']['validationProtocolSha256'] == os.environ['EXPECTED_PROTOCOL_SHA256']
          PY
          echo "Exact passing generated assets reproduced byte-for-byte."

      - name: Upload generated public-science assets only
        uses: actions/upload-artifact@v4
        with:
          name: level-b-stellar-v2-exact-assets-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/export/pickles-sed-1nm.json
            ${{ runner.temp }}/export/stellar-transport-v2-lut.json
