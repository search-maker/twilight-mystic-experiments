name: Level-B stellar v2 final exact-head promotion

on:
  pull_request:
    paths:
      - '.github/workflows/level-b-stellar-v2-final-promotion.yml'
      - 'tools/level_b_0081_reference_gate.py'

permissions:
  contents: read

concurrency:
  group: level-b-stellar-v2-final-promotion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  promotion:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APPLICATION_SHA: 75b77fdfe55d6fb3b52b5ae9010e2da051a503b8
      PUBLIC_ASSET_COMMIT: 4b71445139e24236f12952ab41c791bd07a9f7db
      EXPECTED_PROTOCOL_SHA256: aae80c6c958c0d3dabe9e841be50b4fca52e1b5fb717e834d361172bfed00fef
      EXPECTED_SED_SHA256: 85cbf41c86309b9d54d4765516167165f2d8736bcda8994337ef25d775ea11cb
      EXPECTED_LUT_SHA256: 21eeb51fcc5287ab3bb8cb59cfe0bb0073f34e9ca1b6cc6df988c6eb5043631f
      EXPECTED_JOHNSON_V_SHA256: 51c357eb4cb3609361759f9750ad13ae13a901970913e3a5d87bb5c45ee2db9a
      EXPECTED_UVSPEC_SHA256: 2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3
      EXPECTED_AFGLUS_SHA256: dab26290ed81c762ed0c607e5dc2d53393c1462a0c3a528bc5e3f5935191cfb5
      STARSVISIBILITY_READ_TOKEN: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}

    steps:
      - name: Require read-only private checkout credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${STARSVISIBILITY_READ_TOKEN:-}" ]; then
            echo 'Required read-only secret STARSVISIBILITY_READ_TOKEN is unavailable.' >&2
            exit 78
          fi
          printf '%s' "$APPLICATION_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$PUBLIC_ASSET_COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          echo "Exact private application SHA: $APPLICATION_SHA"
          echo "Immutable public asset commit: $PUBLIC_ASSET_COMMIT"

      - name: Checkout final public gate source
        uses: actions/checkout@v4
        with:
          path: bridge
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout immutable validated public assets
        uses: actions/checkout@v4
        with:
          repository: search-maker/twilight-mystic-experiments
          ref: ${{ env.PUBLIC_ASSET_COMMIT }}
          path: public-assets
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact private application head
        uses: actions/checkout@v4
        with:
          repository: search-maker/starsvisibility
          ref: ${{ env.APPLICATION_SHA }}
          token: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}
          path: private-app
          persist-credentials: false
          fetch-depth: 1

      - name: Verify immutable bindings and stage exact public assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C private-app rev-parse HEAD)" = "$APPLICATION_SHA"
          test "$(git -C public-assets rev-parse HEAD)" = "$PUBLIC_ASSET_COMMIT"
          git -C private-app remote remove origin || true
          git -C public-assets remote remove origin || true
          test "$(sha256sum private-app/scientific-tools/visibility-v3/STELLAR_TRANSPORT_VALIDATION_PROTOCOL_V2.md | awk '{print $1}')" = "$EXPECTED_PROTOCOL_SHA256"
          test "$(sha256sum public-assets/generated/level-b-stellar-v2/pickles-sed-1nm.json | awk '{print $1}')" = "$EXPECTED_SED_SHA256"
          test "$(sha256sum public-assets/generated/level-b-stellar-v2/stellar-transport-v2-lut.json | awk '{print $1}')" = "$EXPECTED_LUT_SHA256"
          test "$(sha256sum private-app/scientific-tools/visibility-v3/generated/johnson-v-1nm.json | awk '{print $1}')" = "$EXPECTED_JOHNSON_V_SHA256"
          python - <<'PY'
          import json, os
          from pathlib import Path
          b=json.loads(Path('private-app/scientific-tools/visibility-v3/stellar-v2-asset-binding.json').read_text())
          assert b['mysticState'] == 'MYSTIC-STATE-0081'
          assert b['publicAssetCommit'] == os.environ['PUBLIC_ASSET_COMMIT']
          assert b['captureRunId'] == '31996849250'
          assert b['protocolSha256'] == os.environ['EXPECTED_PROTOCOL_SHA256']
          assert b['sedBundleSha256'] == os.environ['EXPECTED_SED_SHA256']
          assert b['spectralRuntimeSha256'] == os.environ['EXPECTED_LUT_SHA256']
          assert b['parsedScienceMatchesOriginalPassAfterRemovingVolatileRawResponseHashes'] is True
          PY
          mkdir -p private-app/scientific-tools/visibility-v3/generated
          cp public-assets/generated/level-b-stellar-v2/pickles-sed-1nm.json private-app/scientific-tools/visibility-v3/generated/pickles-sed-1nm.json
          cp public-assets/generated/level-b-stellar-v2/stellar-transport-v2-lut.json private-app/scientific-tools/visibility-v3/generated/stellar-transport-v2-lut.json

      - name: Set up exact reviewed libRadtran environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: stellar-ref
          create-args: >-
            python=3.12
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          init-shell: bash
          cache-environment: false

      - name: Verify exact libRadtran and AFGLUS identities
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          uvspec="$(command -v uvspec)"
          test "$(sha256sum "$uvspec" | awk '{print $1}')" = "$EXPECTED_UVSPEC_SHA256"
          data_dir="$(python - <<'PY'
          from pathlib import Path
          import shutil
          u=Path(shutil.which('uvspec')).resolve()
          for p in (u.parent.parent/'share'/'libRadtran'/'data', u.parent.parent/'data'):
              if p.is_dir(): print(p); break
          else: raise SystemExit('libRadtran data dir not found')
          PY
          )"
          test "$(sha256sum "$data_dir/atmmod/afglus.dat" | awk '{print $1}')" = "$EXPECTED_AFGLUS_SHA256"
          echo "LIBRADTRAN_DATA=$data_dir" >> "$GITHUB_ENV"
          echo "UVSPEC=$uvspec" >> "$GITHUB_ENV"

      - name: Re-run frozen 576-case reference gate on final exact head
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          python bridge/tools/level_b_0081_reference_gate.py \
            --app-dir private-app \
            --sed-bundle public-assets/generated/level-b-stellar-v2/pickles-sed-1nm.json \
            --lut public-assets/generated/level-b-stellar-v2/stellar-transport-v2-lut.json \
            --output "$RUNNER_TEMP/0081-final-reference-result.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'0081-final-reference-result.json').read_text())
          assert r['pass'] is True
          assert r['caseCount'] == 576 and r['atmosphericCaseCount'] == 192
          assert r['protocolSha256'] == os.environ['EXPECTED_PROTOCOL_SHA256']
          assert r['hashes']['sedBundleSha256'] == os.environ['EXPECTED_SED_SHA256']
          assert r['hashes']['lutSha256'] == os.environ['EXPECTED_LUT_SHA256']
          assert r['statistics']['maxAbsDeltaAvMag'] <= 0.025
          assert r['statistics']['rmsDeltaAvMag'] <= 0.010
          PY

      - name: Run parity, current-main Pages build, dist identity, and thousands-case audit
        working-directory: private-app
        shell: bash
        run: |
          set -euo pipefail
          npm run prepare:level-b-stellar-v2
          node scientific-tools/visibility-v3/tests/test-stellar-spectral-runtime.mjs
          npm run test:level-b-parity
          GITHUB_SHA="$APPLICATION_SHA" npm run build:pages
          node scientific-tools/visibility-v3/tests/audit-stellar-transport-v2-timing.mjs --output "$RUNNER_TEMP/0081-timing-audit.json"
          node scripts/test-level-b-stellar-v2-dist.mjs
          python - <<'PY'
          import json, os
          from pathlib import Path
          marker=json.loads(Path('dist/level-b-software-status.json').read_text())
          assert marker['commitSha'] == os.environ['APPLICATION_SHA']
          assert marker['stellarTransportState'] == 'MYSTIC-STATE-0081'
          assert marker['stellarTransportProtocolSha256'] == os.environ['EXPECTED_PROTOCOL_SHA256']
          assert marker['stellarTransportSedSha256'] == os.environ['EXPECTED_SED_SHA256']
          assert marker['stellarTransportLutSha256'] == os.environ['EXPECTED_LUT_SHA256']
          assert marker['stellarTransportPublicAssetCommit'] == os.environ['PUBLIC_ASSET_COMMIT']
          PY
          cp dist/level-b-software-status.json "$RUNNER_TEMP/0081-build-marker.json"

      - name: Seal public-safe final promotion summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/public-summary"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          summary={
            'mysticState':'MYSTIC-STATE-0081',
            'applicationSha':os.environ['APPLICATION_SHA'],
            'publicAssetCommit':os.environ['PUBLIC_ASSET_COMMIT'],
            'protocolSha256':os.environ['EXPECTED_PROTOCOL_SHA256'],
            'sedBundleSha256':os.environ['EXPECTED_SED_SHA256'],
            'spectralRuntimeSha256':os.environ['EXPECTED_LUT_SHA256'],
            'githubRunId':os.environ['GITHUB_RUN_ID'],
            'githubRunAttempt':os.environ['GITHUB_RUN_ATTEMPT'],
          }
          for name,key in [('0081-final-reference-result.json','referenceGate'),('0081-timing-audit.json','timingAudit'),('0081-build-marker.json','buildMarker')]:
              p=root/name
              if p.exists(): summary[key]=json.loads(p.read_text())
          out=root/'public-summary'/'0081-final-promotion-summary.json'
          out.write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:v for k,v in summary.items() if k not in ('referenceGate','timingAudit')},sort_keys=True))
          PY

      - name: Upload public-safe final promotion evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: level-b-stellar-v2-final-promotion-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/public-summary/0081-final-promotion-summary.json
            ${{ runner.temp }}/0081-final-reference-result.json
            ${{ runner.temp }}/0081-timing-audit.json
            ${{ runner.temp }}/0081-build-marker.json
