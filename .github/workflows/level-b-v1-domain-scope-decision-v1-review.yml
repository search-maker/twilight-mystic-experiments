name: Level-B v1 domain scope decision v1 review
run-name: Level-B v1 domain scope decision v1 review

on:
  pull_request:
    paths:
      - review/level-b-v1-domain-scope-decision-v1/level-b-v1-domain-scope-decision-v1.json
      - review/level-b-v1-domain-scope-decision-v1/validate_level_b_v1_domain_scope_decision_v1.py
      - review/level-b-v1-domain-scope-decision-v1/test_level_b_v1_domain_scope_decision_v1.py
      - review/level-b-v1-domain-scope-decision-v1/test_workflow_surface_v1.py
      - .github/workflows/level-b-v1-domain-scope-decision-v1-review.yml

permissions:
  contents: read

jobs:
  review:
    if: github.head_ref == 'review/level-b-v1-domain-scope-decision-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'

      - name: Refuse wrong review context or execution surface
        env:
          EXPECTED_BASE_SHA: 80523d8a59b0c2b4682559e5020410d1962d31d7
          ACTUAL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_HEAD_REF" = review/level-b-v1-domain-scope-decision-v1
          test "$GITHUB_BASE_REF" = main
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$ACTUAL_BASE_SHA" = "$EXPECTED_BASE_SHA"
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/level-b-v1-domain-scope-decision-v1-review.yml')
          text=p.read_text(encoding='utf-8').lower()
          forbidden=('workflow_'+'dispatch','uv'+'spec','librad'+'tran','executor_'+'v1.py','--allow-'+'execution','setup-micro'+'mamba')
          found=[x for x in forbidden if x in text]
          if found: raise SystemExit(f'forbidden execution surface: {found}')
          PY

      - name: Bind the merged train0014 admission decision being superseded
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('review/train-0014-fresh-training-admission-decision-v1/train-0014-fresh-training-admission-decision-v1.json')
          d=json.loads(p.read_text())
          assert d['decisionId']=='public-tier1-train-0014-fresh-training-admission-decision-v1'
          assert d['decisionSha256']=='439f11900d82148e3af61be46071f1ae5910a73ae552f33949e6cdc58eabe10c'
          assert d['frozenInterpretation']['currentUniverseAfterDecision']['admittedTrainingGeometryCount']==25
          assert d['frozenInterpretation']['currentUniverseAfterDecision']['remainingContinuationRequiredGeometryIds']==['train-0037']
          assert d['nextBoundary']['modelFittingRequiresSeparateVersionedProtocolAfterTrain0037FinalTreatment'] is True
          assert d['decisionSemantics']['newScientificExecutionAuthorized'] is False
          assert d['decisionSemantics']['modelFittingAuthorized'] is False
          assert d['decisionSemantics']['protectedHoldoutOpeningAuthorized'] is False
          PY

      - name: Validate exact Level-B v1 domain scope decision
        run: |
          python review/level-b-v1-domain-scope-decision-v1/validate_level_b_v1_domain_scope_decision_v1.py             --decision review/level-b-v1-domain-scope-decision-v1/level-b-v1-domain-scope-decision-v1.json

      - name: Run fail-closed mutation and workflow-surface tests
        run: |
          python review/level-b-v1-domain-scope-decision-v1/test_level_b_v1_domain_scope_decision_v1.py
          python review/level-b-v1-domain-scope-decision-v1/test_workflow_surface_v1.py
