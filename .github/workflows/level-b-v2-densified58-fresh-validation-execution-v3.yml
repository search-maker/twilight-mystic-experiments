name: Level-B densified-58 fresh protected validation v3
run-name: Level-B densified-58 fresh protected validation ordinal24 authorization-v3 dispatch-v3 attempt1

on:
  push:
    branches: ['dispatch/level-b-v2-densified58-fresh-validation-ordinal24-v3']

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: level-b-v2-v0070-ordinal24-v3
  cancel-in-progress: false

env:
  AUTH_PATH: review/level-b-v2-densified58-fresh-validation-transport-v3/authorization.json
  CONTRACT: review/level-b-v2-densified58-fresh-validation-v1/contract-v1.json
  AUTH_BRANCH: authorization/level-b-v2-densified58-fresh-validation-ordinal24-v3
  DISPATCH_BRANCH: dispatch/level-b-v2-densified58-fresh-validation-ordinal24-v3

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      dispatch_branch: ${{ steps.identity.outputs.dispatch_branch }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.4'}
      - run: python -m pip install --disable-pip-version-check 'numpy==2.3.2'
      - id: identity
        name: Refuse retry, wrong dispatch, moved main, wrong commit shape, or authorization-v3 drift
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = "$DISPATCH_BRANCH"
          HEAD_SHA="$(git rev-parse HEAD)"
          test "$(git cat-file -p "$HEAD_SHA" | grep -c '^parent ')" = 1
          PARENT="$(git rev-parse "$HEAD_SHA^")"
          test "$PARENT" = "$(gh api repos/${GITHUB_REPOSITORY}/branches/main --jq .commit.sha)"
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA")
          test "${#CHANGED[@]}" = 1
          test "${CHANGED[0]}" = "$AUTH_PATH"
          test -f "$AUTH_PATH"
          if git cat-file -e "$PARENT:$AUTH_PATH" 2>/dev/null; then echo authorization-already-on-main; exit 1; fi
          python review/level-b-v2-densified58-fresh-validation-transport-v3/validate_transport_v3.py
          python - <<'PY'
          import json,os,subprocess
          a=json.load(open(os.environ['AUTH_PATH']));parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          def b(p):return subprocess.check_output(['git','rev-parse',f'HEAD^:{p}'],text=True).strip()
          expected={'schemaVersion':3,'status':'AUTHORIZED_FRESH_PROTECTED_VALIDATION_ORDINAL24_ATTEMPT1_V3','governance':'MYSTIC-STATE-0070','scientificOrdinal':24,'authorizationBranch':os.environ['AUTH_BRANCH'],'dispatchBranch':os.environ['DISPATCH_BRANCH'],'executionKey':'level-b-v2-densified58:fresh-protected-validation:24','authorizationParentMainSha':parent,'transportV3GitBlobSha':b('review/level-b-v2-densified58-fresh-validation-transport-v3/transport-v3.json'),'freshValidationContractGitBlobSha':b('review/level-b-v2-densified58-fresh-validation-v1/contract-v1.json'),'implementationContractGitBlobSha':b('review/level-b-v2-densified58-fresh-validation-implementation-v1/implementation-v1.json'),'evaluatorGitBlobSha':b('review/level-b-v2-densified58-fresh-validation-implementation-v1/fresh_validation_v1.py'),'manifestBuilderGitBlobSha':b('experiments/level-b-v2-densified58-fresh-validation-v1/build_manifest_v1.py'),'adapterGitBlobSha':b('experiments/level-b-v2-densified58-fresh-validation-v1/adapter_v1.py'),'executorGitBlobSha':b('experiments/level-b-v2-densified58-fresh-validation-v1/executor_v1.py'),'authorizationReviewWorkflowV3GitBlobSha':b('.github/workflows/level-b-v2-densified58-fresh-validation-authorization-review-v3.yml'),'executionWorkflowV3GitBlobSha':b('.github/workflows/level-b-v2-densified58-fresh-validation-execution-v3.yml'),'modelSha256':'91ae5811e55b3d4ef872ab672f006c4b383c6581a53de67cd018b6eb2666f9a7','representationPackageSha256':'2491ac91ed924f2ba69b37ea20f48d63f51d41146cd9fe50e0bd63bfb315a763','reservedSeeds':list(range(2101000001,2101000025)),'runAttemptRequired':1,'scientificExecutionAuthorized':True,'protectedValidationAuthorized':True,'protectedValuesMayBeRead':True,'automaticDispatch':False,'githubRerunAllowed':False,'retryAllowed':False,'resumeAllowed':False,'solverExecutionPerformed':False,'modelRetuningAuthorized':False,'productionPromotionAuthorized':False,'workerBLaneReactivated':False,'workerCLaneReactivated':False}
          assert a==expected,(a,expected)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('dispatch_branch='+a['dispatchBranch']+'\n')
          PY
      - name: Resolve exact successful attempt-1 Draft authorization-v3 review
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY%%/*}"; HEAD_SHA="$(git rev-parse HEAD)"
          gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${OWNER}:${AUTH_BRANCH}&per_page=100" > /tmp/auth-prs.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/level-b-v2-densified58-fresh-validation-authorization-review-v3.yml/runs?event=pull_request&branch=${AUTH_BRANCH}&per_page=100" > /tmp/auth-runs.json
          python - "$HEAD_SHA" <<'PY'
          import json,os,sys
          sha=sys.argv[1];prs=json.load(open('/tmp/auth-prs.json'));runs=json.load(open('/tmp/auth-runs.json'))['workflow_runs']
          ps=[p for p in prs if p['head']['sha']==sha and p['head']['ref']==os.environ['AUTH_BRANCH'] and p.get('merged_at') is None and p.get('draft') is True]
          rs=[r for r in runs if r['head_sha']==sha and r['head_branch']==os.environ['AUTH_BRANCH'] and int(r.get('run_attempt') or 0)==1 and r.get('status')=='completed' and r.get('conclusion')=='success']
          assert len(ps)==1 and len(rs)==1,(len(ps),len(rs))
          PY
      - name: Require exactly one allocation marker and sole ordinal24 dispatch-v3 identity
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp repos/${GITHUB_REPOSITORY}/branches?per_page=100 > /tmp/branches.json
          gh api --paginate --slurp repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100 > /tmp/runs.json
          gh api --paginate --slurp repos/${GITHUB_REPOSITORY}/issues/60/comments?per_page=100 > /tmp/comments.json
          HEAD_SHA="$(git rev-parse HEAD)"
          python - "$HEAD_SHA" <<'PY'
          import json,os,re,sys
          head=sys.argv[1]
          def flat(p,key=None):
            out=[]
            for page in json.load(open(p)):out.extend(page.get(key,[]) if key else page)
            return out
          branches=flat('/tmp/branches.json');runs=flat('/tmp/runs.json','workflow_runs');comments=flat('/tmp/comments.json');auth=os.environ['AUTH_BRANCH'];dispatch=os.environ['DISPATCH_BRANCH']
          assert len([b for b in branches if b.get('name')==auth and (b.get('commit') or {}).get('sha')==head])==1
          assert len([b for b in branches if b.get('name')==dispatch and (b.get('commit') or {}).get('sha')==head])==1
          rx=re.compile(r'^dispatch/level-b-v2-densified58-fresh-validation-ordinal24-v[0-9]+$');assert not [(b.get('name'),(b.get('commit') or {}).get('sha')) for b in branches if rx.match(str(b.get('name') or '')) and not (b.get('name')==dispatch and (b.get('commit') or {}).get('sha')==head)]
          current=[r for r in runs if r.get('event')=='push' and r.get('head_branch')==dispatch and r.get('head_sha')==head];assert len(current)==1 and int(current[0].get('run_attempt') or 0)==1,current
          assert not [(r.get('id'),r.get('head_branch'),r.get('head_sha')) for r in runs if r.get('event')=='push' and rx.match(str(r.get('head_branch') or '')) and not (r.get('head_branch')==dispatch and r.get('head_sha')==head and int(r.get('id') or 0)==int(os.environ['GITHUB_RUN_ID']))]
          marker=f'ALLOCATED-SCIENCE-IDENTITY | MYSTIC-STATE-0070 | ordinal=24 | authHead={head} | seeds=2101000001-2101000024';matches=[c for c in comments if str(c.get('body') or '').strip()==marker];any_alloc=[c for c in comments if 'ALLOCATED-SCIENCE-IDENTITY | MYSTIC-STATE-0070 | ordinal=24 | authHead=' in str(c.get('body') or '')];assert len(matches)==1 and len(any_alloc)==1
          PY
      - name: Build exact 24-case payload after all guards
        run: python experiments/level-b-v2-densified58-fresh-validation-v1/build_manifest_v1.py --repo-root . --contract "$CONTRACT" --output /tmp/v0070-manifest.json
      - id: matrix
        name: Emit exact 24-case matrix
        run: |
          python - <<'PY'
          import json,os
          m=json.load(open('/tmp/v0070-manifest.json'));rows=[{'caseId':c['caseId'],'timeoutSeconds':1800} for c in m['cases']];assert len(rows)==24
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('matrix='+json.dumps({'include':rows},separators=(',',':'))+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v0070-v3-preflight-${{ github.sha }}
          path: |
            review/level-b-v2-densified58-fresh-validation-transport-v3/authorization.json
            /tmp/v0070-manifest.json
            /tmp/auth-prs.json
            /tmp/auth-runs.json
          if-no-files-found: error
          retention-days: 90

  cases:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}'}
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: v0070-fresh-validation-v3
          create-args: -c conda-forge python=3.12.4 rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true
      - uses: actions/download-artifact@v4
        with:
          name: v0070-v3-preflight-${{ github.sha }}
          path: /tmp/v0070-preflight
      - name: Re-prove exact runtime identity without solver execution
        shell: micromamba-shell {0}
        run: python experiments/mystic-batch-v1/runtime_probe.py --uvspec "$(command -v uvspec)" --data-dir "$CONDA_PREFIX/share/libRadtran/data" --atmosphere "$CONDA_PREFIX/share/libRadtran/data/atmmod/afglus.dat" --runtime-lock experiments/mystic-batch-v1/runtime-lock.micromamba.json --output /tmp/v0070-runtime.json
      - name: Execute exactly one syntax check and one fresh protected MYSTIC invocation
        shell: micromamba-shell {0}
        run: python experiments/level-b-v2-densified58-fresh-validation-v1/executor_v1.py --manifest /tmp/v0070-preflight/v0070-manifest.json --runtime-report /tmp/v0070-runtime.json --adapter experiments/level-b-v2-densified58-fresh-validation-v1/adapter_v1.py --case-id '${{ matrix.caseId }}' --data-dir "$CONDA_PREFIX/share/libRadtran/data" --repository-root . --uvspec "$(command -v uvspec)" --output-root /tmp/v0070-case-output --timeout-seconds '${{ matrix.timeoutSeconds }}' --expected-dispatch-branch '${{ needs.preflight.outputs.dispatch_branch }}' --allow-execution
      - name: Audit terminal attempt-1 case artifact
        shell: micromamba-shell {0}
        run: |
          python - <<'PY'
          import json,pathlib
          cid='${{ matrix.caseId }}';d=pathlib.Path('/tmp/v0070-case-output')/cid;r=json.load(open(d/'case-result.json'));assert r['status']=='COMPLETED' and r['workflowRunAttempt']==1 and r['syntaxCheckCount']==1 and r['solverExecutionCount']==1 and r['retryPerformed'] is False and r['resumePerformed'] is False and r['githubRerun'] is False and r['protectedHoldoutValueExposed'] is True and r['ordinal22ValueExposed'] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: level-b-v2-v0070-v3-case-${{ matrix.caseId }}
          path: /tmp/v0070-case-output/${{ matrix.caseId }}
          if-no-files-found: warn
          retention-days: 90

  evaluate:
    needs: [preflight, cases]
    if: needs.preflight.result == 'success' && needs.cases.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.4'}
      - run: python -m pip install --disable-pip-version-check 'numpy==2.3.2'
      - uses: actions/download-artifact@v4
        with: {pattern: 'level-b-v2-v0070-v3-case-*', path: '/tmp/v0070-case-artifacts', merge-multiple: false}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: 31827007009, artifact-ids: 9229229366, path: '/tmp/v0070-model', merge-multiple: true}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: 31771224298, artifact-ids: 9208203541, path: '/tmp/v0070-representation', merge-multiple: true}
      - name: Evaluate six fresh holdouts once against frozen model and DoD
        run: python review/level-b-v2-densified58-fresh-validation-implementation-v1/fresh_validation_v1.py evaluate --contract "$CONTRACT" --cases-root /tmp/v0070-case-artifacts --model-dir /tmp/v0070-model --representation-dir /tmp/v0070-representation --repo-root . --output /tmp/v0070-evaluation.json
      - name: Independently audit self-hash and frozen all-or-nothing result
        run: |
          python - <<'PY'
          import hashlib,json
          r=json.load(open('/tmp/v0070-evaluation.json'));b=dict(r);h=b.pop('resultSha256');assert h==hashlib.sha256(json.dumps(b,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest();assert (r['geometryCount'],r['caseCount'],r['configuredPhotonHistories'])==(6,24,960_000_000);assert r['modelSha256']=='91ae5811e55b3d4ef872ab672f006c4b383c6581a53de67cd018b6eb2666f9a7';assert r['representationPackageSha256']=='2491ac91ed924f2ba69b37ea20f48d63f51d41146cd9fe50e0bd63bfb315a763';assert r['p90OrP95Used'] is False and r['retuningPerformed'] is False and r['modelChangedAfterHoldoutOpening'] is False and r['ordinal22ValuesRead'] is False and r['productionPromotionAuthorized'] is False and r['workerBLaneReactivated'] is False and r['workerCLaneReactivated'] is False;calc=r['supportPass'] and all(x['passes'] for x in r['channelSummary'].values()) and r['shapePass'] and r['baselinePass'];assert calc==r['definitionOfDonePassed'];assert r['status']==('PASS_FROZEN_FRESH_DOD' if calc else 'FAIL_FROZEN_FRESH_DOD_NO_RETUNING');assert r['freshValidationSourceMayBeReusedAfterRetuningIfFailed'] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: level-b-v2-v0070-v3-evaluation-${{ github.sha }}
          path: /tmp/v0070-evaluation.json
          if-no-files-found: warn
          retention-days: 90
