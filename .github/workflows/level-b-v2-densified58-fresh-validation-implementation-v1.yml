name: Level-B densified-58 fresh validation implementation v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'review/level-b-v2-densified58-fresh-validation-implementation-v1/**'
      - 'experiments/level-b-v2-densified58-fresh-validation-v1/**'
      - '.github/workflows/level-b-v2-densified58-fresh-validation-implementation-v1.yml'
  push:
    branches:
      - 'review/level-b-v2-densified58-fresh-validation-implementation-v1'
    paths:
      - 'review/level-b-v2-densified58-fresh-validation-implementation-v1/**'
      - 'experiments/level-b-v2-densified58-fresh-validation-v1/**'
      - '.github/workflows/level-b-v2-densified58-fresh-validation-implementation-v1.yml'

permissions:
  contents: read
  actions: read

jobs:
  synthetic-review-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - name: Install frozen numerical dependency
        run: python -m pip install --disable-pip-version-check 'numpy==2.3.2'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: search-maker/twilight-mystic-experiments
          run-id: 31827007009
          artifact-ids: 9229229366
          path: /tmp/densified58-v3
          merge-multiple: true
      - name: Revalidate merged 0070 preregistration without protected data
        run: |
          python review/level-b-v2-densified58-fresh-validation-v1/validate_v1.py \
            --dataset /tmp/densified58-v3/training-representation-dataset-v3-densified58.json
      - name: Validate implementation bindings and compile all new Python
        run: |
          python review/level-b-v2-densified58-fresh-validation-implementation-v1/validate_impl_v1.py
          python -m py_compile \
            review/level-b-v2-densified58-fresh-validation-implementation-v1/fresh_validation_v1.py \
            review/level-b-v2-densified58-fresh-validation-implementation-v1/test_v1.py \
            experiments/level-b-v2-densified58-fresh-validation-v1/build_manifest_v1.py \
            experiments/level-b-v2-densified58-fresh-validation-v1/adapter_v1.py \
            experiments/level-b-v2-densified58-fresh-validation-v1/executor_v1.py
      - name: Run synthetic DoD, baseline and manifest tests
        run: python review/level-b-v2-densified58-fresh-validation-implementation-v1/test_v1.py -v
      - name: Rebuild exact frozen manifest without authorization
        run: |
          python experiments/level-b-v2-densified58-fresh-validation-v1/build_manifest_v1.py \
            --repo-root . \
            --contract review/level-b-v2-densified58-fresh-validation-v1/contract-v1.json \
            --output /tmp/v0070-manifest.json
          python - <<'PY'
          import hashlib,json
          p='/tmp/v0070-manifest.json'; m=json.load(open(p)); body=dict(m); body['manifestSha256']=None
          h=hashlib.sha256(json.dumps(body,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
          assert h==m['manifestSha256']
          assert (m['geometryCount'],m['caseCount'],m['configuredPhotonHistories'])==(6,24,960_000_000)
          assert m['closedUntilAuthorization']['scientificOrdinalAllocated'] is False
          assert m['closedUntilAuthorization']['holdoutValuesMayBeRead'] is False
          assert m['closedUntilAuthorization']['scientificSolverExecutionAuthorized'] is False
          assert [x['seed'] for x in m['cases']]==list(range(2101000001,2101000025))
          PY
      - name: Prove review has no authorization, dispatch or fresh-value execution surface
        shell: bash
        run: |
          set -euo pipefail
          test ! -e review/level-b-v2-densified58-fresh-validation-implementation-v1/authorization.json
          test ! -e .github/workflows/level-b-v2-densified58-fresh-validation-execution-v1.yml
          test ! -e .github/workflows/level-b-v2-densified58-fresh-validation-authorization-review-v1.yml
          ! git diff --name-only origin/main...HEAD | grep -E '(^|/)authorization\.json$|fresh-validation-execution-v1\.yml$|fresh-validation-authorization-review-v1\.yml$'
