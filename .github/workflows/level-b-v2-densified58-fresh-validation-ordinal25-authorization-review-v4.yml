name: Level-B densified-58 fresh validation ordinal25 authorization review v4

on:
  pull_request:
    branches: [main]
    paths:
      - 'review/level-b-v2-densified58-fresh-validation-ordinal25-transport-v4/authorization.json'

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

env:
  AUTH_PATH: review/level-b-v2-densified58-fresh-validation-ordinal25-transport-v4/authorization.json
  RECOVERY: review/level-b-v2-densified58-fresh-validation-recovery-v2/recovery-v2.json
  AUTH_BRANCH: authorization/level-b-v2-densified58-fresh-validation-ordinal25-v1
  DISPATCH_BRANCH: dispatch/level-b-v2-densified58-fresh-validation-ordinal25-v1

jobs:
  authorization-review-v4:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.4'}
      - run: python -m pip install --disable-pip-version-check 'numpy==2.3.2'
      - name: Refuse retry, non-draft, non-one-file, wrong branch, moved main, or merge-ref identity
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test '${{ github.event.pull_request.draft }}' = true
          test "$GITHUB_HEAD_REF" = "$AUTH_BRANCH"
          test "$GITHUB_BASE_REF" = main
          HEAD_SHA="$(git rev-parse HEAD)"
          test "$HEAD_SHA" = '${{ github.event.pull_request.head.sha }}'
          test "$(git cat-file -p HEAD | grep -c '^parent ')" = 1
          PARENT="$(git rev-parse HEAD^)"
          test "$PARENT" = '${{ github.event.pull_request.base.sha }}'
          test "$PARENT" = "$(gh api repos/${GITHUB_REPOSITORY}/branches/main --jq .commit.sha)"
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = 1
          test "${CHANGED[0]}" = "$AUTH_PATH"
          test -f "$AUTH_PATH"
          if git cat-file -e "$PARENT:$AUTH_PATH" 2>/dev/null; then echo authorization-already-on-main; exit 1; fi
      - name: Revalidate ordinal25 transport and exact recovery manifest
        run: |
          python review/level-b-v2-densified58-fresh-validation-ordinal25-transport-v4/validate_transport_v4.py
          python review/level-b-v2-densified58-fresh-validation-recovery-v2/fresh_validation_v2.py validate --recovery "$RECOVERY" --repo-root .
          python experiments/level-b-v2-densified58-fresh-validation-recovery-v2/build_manifest_v2.py --repo-root . --recovery "$RECOVERY" --output /tmp/v0070-o25-manifest.json
          python - <<'PY'
          import json
          m=json.load(open('/tmp/v0070-o25-manifest.json'))
          assert (m['geometryCount'],m['caseCount'],m['configuredPhotonHistories'])==(6,24,960_000_000)
          assert m['scientificOrdinalCandidate']==25
          assert [x['seed'] for x in m['cases']]==list(range(2101000025,2101000049))
          assert all(v is False for v in m['closedUntilAuthorization'].values())
          assert m['ordinal24ProtectedValuesRead'] is False and m['ordinal24SolverExecutionCount']==0
          PY
      - name: Audit exact authorization payload against parent-main blobs
        run: |
          python - <<'PY'
          import json,os,subprocess
          a=json.load(open(os.environ['AUTH_PATH']));parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          def b(p):return subprocess.check_output(['git','rev-parse',f'HEAD^:{p}'],text=True).strip()
          expected={
            'schemaVersion':4,
            'status':'AUTHORIZED_FRESH_PROTECTED_VALIDATION_ORDINAL25_ATTEMPT1_V1',
            'governance':'MYSTIC-STATE-0070',
            'scientificOrdinal':25,
            'authorizationBranch':os.environ['AUTH_BRANCH'],
            'dispatchBranch':os.environ['DISPATCH_BRANCH'],
            'executionKey':'level-b-v2-densified58:fresh-protected-validation:25',
            'authorizationParentMainSha':parent,
            'transportV4GitBlobSha':b('review/level-b-v2-densified58-fresh-validation-ordinal25-transport-v4/transport-v4.json'),
            'recoveryContractV2GitBlobSha':b('review/level-b-v2-densified58-fresh-validation-recovery-v2/contract-v2.json'),
            'recoveryRecordGitBlobSha':b('review/level-b-v2-densified58-fresh-validation-recovery-v2/recovery-v2.json'),
            'evaluatorV2GitBlobSha':b('review/level-b-v2-densified58-fresh-validation-recovery-v2/fresh_validation_v2.py'),
            'manifestBuilderV2GitBlobSha':b('experiments/level-b-v2-densified58-fresh-validation-recovery-v2/build_manifest_v2.py'),
            'adapterV1GitBlobSha':b('experiments/level-b-v2-densified58-fresh-validation-v1/adapter_v1.py'),
            'executorV2GitBlobSha':b('experiments/level-b-v2-densified58-fresh-validation-recovery-v2/executor_v2.py'),
            'authorizationReviewWorkflowV4GitBlobSha':b('.github/workflows/level-b-v2-densified58-fresh-validation-ordinal25-authorization-review-v4.yml'),
            'executionWorkflowV4GitBlobSha':b('.github/workflows/level-b-v2-densified58-fresh-validation-ordinal25-execution-v4.yml'),
            'modelSha256':'91ae5811e55b3d4ef872ab672f006c4b383c6581a53de67cd018b6eb2666f9a7',
            'representationPackageSha256':'2491ac91ed924f2ba69b37ea20f48d63f51d41146cd9fe50e0bd63bfb315a763',
            'reservedSeeds':list(range(2101000025,2101000049)),
            'retiredOrdinal24Seeds':list(range(2101000001,2101000025)),
            'runAttemptRequired':1,
            'scientificExecutionAuthorized':True,
            'protectedValidationAuthorized':True,
            'protectedValuesMayBeRead':True,
            'automaticDispatch':False,
            'githubRerunAllowed':False,
            'retryAllowed':False,
            'resumeAllowed':False,
            'solverExecutionPerformed':False,
            'modelRetuningAuthorized':False,
            'productionPromotionAuthorized':False,
            'workerBLaneReactivated':False,
            'workerCLaneReactivated':False
          }
          assert a==expected,(a,expected)
          PY
      - name: Prove ordinal24 immutable refusal and ordinal25 fresh allocation state
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/pulls/194 > /tmp/pr194.json
          gh api repos/${GITHUB_REPOSITORY}/actions/runs/31840757436 > /tmp/run24.json
          gh api --paginate --slurp repos/${GITHUB_REPOSITORY}/branches?per_page=100 > /tmp/branches.json
          gh api --paginate --slurp repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100 > /tmp/runs.json
          gh api --paginate --slurp repos/${GITHUB_REPOSITORY}/issues/60/comments?per_page=100 > /tmp/comments.json
          python - <<'PY'
          import json,os,re,subprocess
          pr=json.load(open('/tmp/pr194.json'));run24=json.load(open('/tmp/run24.json'))
          assert pr['state']=='closed' and pr['merged_at'] is None and pr['head']['sha']=='520ff3cc5f8fee2defc1a0a950bfa7a40974479c'
          assert run24['id']==31840757436 and run24['run_attempt']==1 and run24['conclusion']=='failure'
          def flat(p,key=None):
            out=[]
            for page in json.load(open(p)): out.extend(page.get(key,[]) if key else page)
            return out
          branches=flat('/tmp/branches.json');runs=flat('/tmp/runs.json','workflow_runs');comments=flat('/tmp/comments.json')
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip();auth=os.environ['AUTH_BRANCH'];dispatch=os.environ['DISPATCH_BRANCH']
          assert len([b for b in branches if b.get('name')==auth and (b.get('commit') or {}).get('sha')==head])==1
          assert not [b for b in branches if b.get('name')==dispatch]
          assert not [r for r in runs if r.get('event')=='push' and r.get('head_branch')==dispatch]
          prefix='ALLOCATED-SCIENCE-IDENTITY | MYSTIC-STATE-0070 | ordinal=25 | authHead='
          assert not [c for c in comments if prefix in str(c.get('body') or '')]
          old='ALLOCATED-SCIENCE-IDENTITY | MYSTIC-STATE-0070 | ordinal=24 | authHead=520ff3cc5f8fee2defc1a0a950bfa7a40974479c | seeds=2101000001-2101000024'
          assert len([c for c in comments if str(c.get('body') or '').strip()==old])==1
          PY
      - name: Prove review did not dispatch or open protected values
        run: |
          python - <<'PY'
          import json,os
          a=json.load(open(os.environ['AUTH_PATH']))
          assert a['automaticDispatch'] is False and a['solverExecutionPerformed'] is False
          assert a['modelRetuningAuthorized'] is False and a['productionPromotionAuthorized'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v0070-o25-authorization-v4-review-${{ github.event.pull_request.head.sha }}
          path: /tmp/v0070-o25-manifest.json
          if-no-files-found: error
          retention-days: 90
