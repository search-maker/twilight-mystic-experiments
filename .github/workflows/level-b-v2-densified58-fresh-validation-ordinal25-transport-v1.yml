name: Level-B densified-58 fresh validation ordinal25 transport v1 review

on:
  pull_request:
    branches: [main]
    paths:
      - 'review/level-b-v2-densified58-fresh-validation-ordinal25-transport-v1/transport-v1.json'
      - 'review/level-b-v2-densified58-fresh-validation-ordinal25-transport-v1/validate_transport_v1.py'
      - '.github/workflows/level-b-v2-densified58-fresh-validation-ordinal25-transport-v1.yml'
      - '.github/workflows/level-b-v2-densified58-fresh-validation-ordinal25-authorization-review-v1.yml'
      - '.github/workflows/level-b-v2-densified58-fresh-validation-ordinal25-execution-v1.yml'
  push:
    branches: ['review/level-b-v2-densified58-fresh-validation-ordinal25-transport-v1']
    paths:
      - 'review/level-b-v2-densified58-fresh-validation-ordinal25-transport-v1/transport-v1.json'
      - 'review/level-b-v2-densified58-fresh-validation-ordinal25-transport-v1/validate_transport_v1.py'
      - '.github/workflows/level-b-v2-densified58-fresh-validation-ordinal25-transport-v1.yml'
      - '.github/workflows/level-b-v2-densified58-fresh-validation-ordinal25-authorization-review-v1.yml'
      - '.github/workflows/level-b-v2-densified58-fresh-validation-ordinal25-execution-v1.yml'

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

jobs:
  review-only-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.4'}
      - run: python -m pip install --disable-pip-version-check 'numpy==2.3.2'
      - name: Validate transport and merged recovery package
        run: |
          set -euo pipefail
          python review/level-b-v2-densified58-fresh-validation-ordinal25-transport-v1/validate_transport_v1.py --require-review-inert
          python review/level-b-v2-densified58-fresh-validation-recovery-v2/test_v2.py -v
          python review/level-b-v2-densified58-fresh-validation-recovery-v2/fresh_validation_v2.py validate --recovery review/level-b-v2-densified58-fresh-validation-recovery-v2/recovery-v2.json --repo-root .
          python experiments/level-b-v2-densified58-fresh-validation-recovery-v2/build_manifest_v2.py --repo-root . --recovery review/level-b-v2-densified58-fresh-validation-recovery-v2/recovery-v2.json --output /tmp/ordinal25-manifest.json
          python - <<'PY'
          import json
          m=json.load(open('/tmp/ordinal25-manifest.json'))
          assert (m['scientificOrdinalCandidate'],m['geometryCount'],m['caseCount'],m['configuredPhotonHistories'])==(25,6,24,960_000_000)
          assert [c['seed'] for c in m['cases']]==list(range(2101000025,2101000049))
          assert all(c['caseId'].startswith('v0070-o25-holdout-') for c in m['cases'])
          assert m['ordinal24ProtectedValuesRead'] is False and m['ordinal24SolverExecutionCount']==0
          assert all(v is False for v in m['closedUntilAuthorization'].values())
          PY
      - name: Prove exact versioned executor branch guard
        run: |
          python - <<'PY'
          import importlib.util,pathlib
          p=pathlib.Path('experiments/level-b-v2-densified58-fresh-validation-recovery-v2/executor_v2.py')
          s=importlib.util.spec_from_file_location('e',p);e=importlib.util.module_from_spec(s);s.loader.exec_module(e)
          assert e.BASE_EXECUTOR_GIT_BLOB_SHA=='5bf0477f0d5100dcb73da8027233e8415ce9021c'
          assert e.BRANCH_RE.pattern==r'^dispatch/level-b-v2-densified58-fresh-validation-ordinal25-v1$'
          assert e.BRANCH_RE.fullmatch('dispatch/level-b-v2-densified58-fresh-validation-ordinal25-v1')
          assert not e.BRANCH_RE.fullmatch('dispatch/level-b-v2-densified58-fresh-validation-ordinal24-v3')
          PY
      - name: Prove ordinal25 has no allocation, authorization or dispatch identity yet
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          gh api --paginate --slurp 'repos/'${GITHUB_REPOSITORY}'/branches?per_page=100' > /tmp/branches.json
          gh api --paginate --slurp 'repos/'${GITHUB_REPOSITORY}'/actions/runs?per_page=100' > /tmp/runs.json
          gh api --paginate --slurp 'repos/'${GITHUB_REPOSITORY}'/issues/60/comments?per_page=100' > /tmp/comments.json
          python - <<'PY'
          import json,re
          def flat(path,key=None):
            out=[]
            for page in json.load(open(path)):out.extend(page.get(key,[]) if key else page)
            return out
          branches=flat('/tmp/branches.json');runs=flat('/tmp/runs.json','workflow_runs');comments=flat('/tmp/comments.json')
          ar=re.compile(r'^authorization/level-b-v2-densified58-fresh-validation-ordinal25-v[0-9]+$');dr=re.compile(r'^dispatch/level-b-v2-densified58-fresh-validation-ordinal25-v[0-9]+$')
          assert not [b for b in branches if ar.match(str(b.get('name') or ''))]
          assert not [b for b in branches if dr.match(str(b.get('name') or ''))]
          assert not [r for r in runs if r.get('event')=='push' and dr.match(str(r.get('head_branch') or ''))]
          prefix='ALLOCATED-SCIENCE-IDENTITY | MYSTIC-STATE-0070 | ordinal=25 | authHead=';assert not [c for c in comments if prefix in str(c.get('body') or '')]
          PY
      - name: Prove future workflows are trigger-locked and branch-consistent
        shell: bash
        run: |
          set -euo pipefail
          auth=.github/workflows/level-b-v2-densified58-fresh-validation-ordinal25-authorization-review-v1.yml
          exec=.github/workflows/level-b-v2-densified58-fresh-validation-ordinal25-execution-v1.yml
          grep -F 'authorization/level-b-v2-densified58-fresh-validation-ordinal25-v1' "$auth"
          grep -F 'git rev-parse HEAD' "$auth"
          ! grep -F 'GITHUB_SHA' "$auth"
          grep -F 'dispatch/level-b-v2-densified58-fresh-validation-ordinal25-v1' "$exec"
          grep -F 'executor_v2.py' "$exec"
          ! grep -F 'workflow_dispatch:' "$auth" "$exec"
          ! grep -F 'schedule:' "$auth" "$exec"
      - uses: actions/upload-artifact@v4
        with:
          name: v0070-ordinal25-transport-review-${{ github.sha }}
          path: /tmp/ordinal25-manifest.json
          if-no-files-found: error
          retention-days: 90
