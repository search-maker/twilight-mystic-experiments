name: Level-B densified-58 fresh validation ordinal25 transport review v4

on:
  pull_request:
    branches: [main]
    paths:
      - 'review/level-b-v2-densified58-fresh-validation-ordinal25-transport-v4/transport-v4.json'
      - 'review/level-b-v2-densified58-fresh-validation-ordinal25-transport-v4/validate_transport_v4.py'
      - '.github/workflows/level-b-v2-densified58-fresh-validation-ordinal25-transport-v4.yml'
      - '.github/workflows/level-b-v2-densified58-fresh-validation-ordinal25-authorization-review-v4.yml'
      - '.github/workflows/level-b-v2-densified58-fresh-validation-ordinal25-execution-v4.yml'
  push:
    branches:
      - 'review/level-b-v2-densified58-fresh-validation-ordinal25-transport-v4'
    paths:
      - 'review/level-b-v2-densified58-fresh-validation-ordinal25-transport-v4/transport-v4.json'
      - 'review/level-b-v2-densified58-fresh-validation-ordinal25-transport-v4/validate_transport_v4.py'
      - '.github/workflows/level-b-v2-densified58-fresh-validation-ordinal25-transport-v4.yml'
      - '.github/workflows/level-b-v2-densified58-fresh-validation-ordinal25-authorization-review-v4.yml'
      - '.github/workflows/level-b-v2-densified58-fresh-validation-ordinal25-execution-v4.yml'

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

jobs:
  review-only-ordinal25-transport-v4:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.4'}
      - name: Install frozen numerical dependency
        run: python -m pip install --disable-pip-version-check 'numpy==2.3.2'
      - name: Validate exact transport bindings and inert review surface
        run: |
          python review/level-b-v2-densified58-fresh-validation-ordinal25-transport-v4/validate_transport_v4.py --require-review-inert
          python -m py_compile review/level-b-v2-densified58-fresh-validation-ordinal25-transport-v4/validate_transport_v4.py
      - name: Re-run recovery tests and build exact ordinal25 manifest
        run: |
          python review/level-b-v2-densified58-fresh-validation-recovery-v2/test_v2.py -v
          python review/level-b-v2-densified58-fresh-validation-recovery-v2/fresh_validation_v2.py validate --recovery review/level-b-v2-densified58-fresh-validation-recovery-v2/recovery-v2.json --repo-root .
          python experiments/level-b-v2-densified58-fresh-validation-recovery-v2/build_manifest_v2.py --repo-root . --recovery review/level-b-v2-densified58-fresh-validation-recovery-v2/recovery-v2.json --output /tmp/v0070-o25-transport-manifest.json
          python - <<'PY'
          import json
          m=json.load(open('/tmp/v0070-o25-transport-manifest.json'))
          assert (m['geometryCount'],m['caseCount'],m['configuredPhotonHistories'])==(6,24,960_000_000)
          assert m['scientificOrdinalCandidate']==25
          assert [x['seed'] for x in m['cases']]==list(range(2101000025,2101000049))
          assert all(v is False for v in m['closedUntilAuthorization'].values())
          PY
      - name: Prove ordinal24 refusal remains immutable and ordinal25 is not allocated or dispatched
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/actions/runs/31840757436 > /tmp/run24.json
          gh api --paginate --slurp repos/${GITHUB_REPOSITORY}/branches?per_page=100 > /tmp/branches.json
          gh api --paginate --slurp repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100 > /tmp/runs.json
          gh api --paginate --slurp repos/${GITHUB_REPOSITORY}/issues/60/comments?per_page=100 > /tmp/comments.json
          python - <<'PY'
          import json,re
          run24=json.load(open('/tmp/run24.json'));assert run24['id']==31840757436 and run24['run_attempt']==1 and run24['conclusion']=='failure'
          def flat(p,key=None):
            out=[]
            for page in json.load(open(p)):out.extend(page.get(key,[]) if key else page)
            return out
          branches=flat('/tmp/branches.json');runs=flat('/tmp/runs.json','workflow_runs');comments=flat('/tmp/comments.json')
          ar=re.compile(r'^authorization/level-b-v2-densified58-fresh-validation-ordinal25-v[0-9]+$')
          dr=re.compile(r'^dispatch/level-b-v2-densified58-fresh-validation-ordinal25-v[0-9]+$')
          assert not [b.get('name') for b in branches if ar.match(str(b.get('name') or ''))]
          assert not [b.get('name') for b in branches if dr.match(str(b.get('name') or ''))]
          assert not [(r.get('id'),r.get('head_branch')) for r in runs if r.get('event')=='push' and dr.match(str(r.get('head_branch') or ''))]
          prefix='ALLOCATED-SCIENCE-IDENTITY | MYSTIC-STATE-0070 | ordinal=25 | authHead='
          assert not [c for c in comments if prefix in str(c.get('body') or '')]
          old='ALLOCATED-SCIENCE-IDENTITY | MYSTIC-STATE-0070 | ordinal=24 | authHead=520ff3cc5f8fee2defc1a0a950bfa7a40974479c | seeds=2101000001-2101000024'
          assert len([c for c in comments if str(c.get('body') or '').strip()==old])==1
          PY
      - name: Prove future workflows are exact-trigger locked and use executor v2
        shell: bash
        run: |
          set -euo pipefail
          auth=.github/workflows/level-b-v2-densified58-fresh-validation-ordinal25-authorization-review-v4.yml
          exec=.github/workflows/level-b-v2-densified58-fresh-validation-ordinal25-execution-v4.yml
          grep -F 'authorization/level-b-v2-densified58-fresh-validation-ordinal25-v1' "$auth"
          grep -F 'dispatch/level-b-v2-densified58-fresh-validation-ordinal25-v1' "$exec"
          grep -F 'executor_v2.py' "$exec"
          grep -F 'build_manifest_v2.py' "$auth" "$exec"
          grep -F 'github.event.pull_request.head.sha' "$auth"
          ! grep -F 'GITHUB_SHA' "$auth"
          ! grep -F 'workflow_dispatch:' "$auth" "$exec"
          ! grep -F 'schedule:' "$auth" "$exec"
      - uses: actions/upload-artifact@v4
        with:
          name: v0070-o25-transport-v4-review-${{ github.sha }}
          path: /tmp/v0070-o25-transport-manifest.json
          if-no-files-found: error
          retention-days: 90
