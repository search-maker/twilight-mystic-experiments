name: Level-B densified-58 ordinal27 evaluation-recovery authorization review v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'review/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v1/evaluation-authorization.json'

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

env:
  AUTH_PATH: review/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v1/evaluation-authorization.json
  RECOVERY: review/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v1/recovery-v1.json
  EVALUATOR: review/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v1/fresh_validation_evaluation_recovery_v1.py
  AUTH_BRANCH: authorization/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v1
  EVAL_BRANCH: evaluation/level-b-v2-densified58-fresh-validation-ordinal27-recovery-v1

jobs:
  evaluation-authorization-review-v1:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Refuse retry, non-draft, wrong branch, moved main, or non-one-file authorization
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test '${{ github.event.pull_request.draft }}' = true
          test "$GITHUB_HEAD_REF" = "$AUTH_BRANCH"
          test "$GITHUB_BASE_REF" = main
          HEAD_SHA="$(git rev-parse HEAD)"
          test "$HEAD_SHA" = '${{ github.event.pull_request.head.sha }}'
          test "$(git cat-file -p HEAD | grep -c '^parent ')" = 1
          PARENT="$(git rev-parse HEAD^)"
          test "$PARENT" = '${{ github.event.pull_request.base.sha }}'
          test "$PARENT" = "$(gh api repos/${GITHUB_REPOSITORY}/branches/main --jq .commit.sha)"
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = 1
          test "${CHANGED[0]}" = "$AUTH_PATH"
          test -f "$AUTH_PATH"
          if git cat-file -e "$PARENT:$AUTH_PATH" 2>/dev/null; then echo evaluation-authorization-already-on-main; exit 1; fi
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.4'}
      - run: python -m pip install --disable-pip-version-check 'numpy==2.3.2'
      - name: Audit exact evaluation-only authorization payload against parent-main blobs
        run: |
          python - <<'PY'
          import json,os,subprocess
          a=json.load(open(os.environ['AUTH_PATH']));parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          def b(p):return subprocess.check_output(['git','rev-parse',f'HEAD^:{p}'],text=True).strip()
          expected={
            'schemaVersion':1,
            'status':'AUTHORIZED_ORDINAL27_EVALUATION_ONLY_RECOVERY_ATTEMPT1',
            'governance':'MYSTIC-STATE-0070',
            'scientificOrdinal':27,
            'sourceScientificRunId':31848052825,
            'sourceScientificRunAttempt':1,
            'sourceScientificHeadSha':'44ef4dee635745a8d9cabab25a5e01638307bdc9',
            'sourceCaseArtifactCount':24,
            'sourceSolverInvocationCount':24,
            'authorizationBranch':os.environ['AUTH_BRANCH'],
            'evaluationBranch':os.environ['EVAL_BRANCH'],
            'authorizationParentMainSha':parent,
            'recoveryGitBlobSha':b('review/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v1/recovery-v1.json'),
            'evaluatorGitBlobSha':b('review/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v1/fresh_validation_evaluation_recovery_v1.py'),
            'reviewWorkflowGitBlobSha':b('.github/workflows/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-review-v1.yml'),
            'authorizationReviewWorkflowGitBlobSha':b('.github/workflows/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-authorization-review-v1.yml'),
            'evaluationWorkflowGitBlobSha':b('.github/workflows/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v1.yml'),
            'modelArtifactId':9229229366,
            'modelArtifactDigest':'sha256:f4c8c68a622f7c6bdc1b9177ad31d22f673becb1f286436d54b876ceece3668a',
            'modelCanonicalSha256':'91ae5811e55b3d4ef872ab672f006c4b383c6581a53de67cd018b6eb2666f9a7',
            'representationArtifactId':9208203541,
            'representationArtifactDigest':'sha256:2fe50ed674155f440322c92d28877f5c022f0cc5fa13e1e601596a9902482815',
            'representationPackageSha256':'2491ac91ed924f2ba69b37ea20f48d63f51d41146cd9fe50e0bd63bfb315a763',
            'evaluationOnlyRecoveryAuthorized':True,
            'protectedCaseArtifactsMayBeRead':True,
            'solverExecutionAuthorized':False,
            'syntaxCheckAuthorized':False,
            'newScientificOrdinalAuthorized':False,
            'newSeedsAuthorized':False,
            'scientificRerunAllowed':False,
            'scientificRetryAllowed':False,
            'scientificResumeAllowed':False,
            'modelRetuningAuthorized':False,
            'geometryChangeAuthorized':False,
            'definitionOfDoneChangeAuthorized':False,
            'supportRuleChangeAuthorized':False,
            'physicsChangeAuthorized':False,
            'runtimeChangeAuthorized':False,
            'automaticDispatch':False,
            'productionPromotionAuthorized':False,
            'workerBLaneReactivated':False,
            'workerCLaneReactivated':False,
            'runAttemptRequired':1
          }
          assert a==expected,(a,expected)
          PY
      - name: Revalidate recovery descriptor and frozen nested model only
        run: |
          python - <<'PY'
          import importlib.util,json,os,pathlib
          p=pathlib.Path(os.environ['EVALUATOR']);s=importlib.util.spec_from_file_location('er',p);m=importlib.util.module_from_spec(s);s.loader.exec_module(m);m.validate_eval_recovery(m.load(pathlib.Path(os.environ['RECOVERY'])))
          print(json.dumps({'status':'PASS','protectedCaseArtifactsRead':False,'solverExecutionCount':0},sort_keys=True))
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31827007009
          artifact-ids: 9229229366
          path: /tmp/v0070-model
          merge-multiple: true
      - name: Verify frozen model schema fix without protected case artifacts
        run: python "$EVALUATOR" validate-model --evaluation-recovery "$RECOVERY" --scientific-recovery review/level-b-v2-densified58-fresh-validation-recovery-v4/recovery-v4.json --model-dir /tmp/v0070-model --repo-root .
      - name: Prove immutable source run/artifact metadata and no prior evaluation recovery dispatch
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/31848052825" > /tmp/source-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/31848052825/jobs?per_page=100" > /tmp/source-jobs.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/31848052825/artifacts?per_page=100" > /tmp/source-artifacts.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/branches?per_page=100" > /tmp/branches.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" > /tmp/runs.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/60/comments?per_page=100" > /tmp/comments.json
          python - <<'PY'
          import json,os
          r=json.load(open(os.environ['RECOVERY']));run=json.load(open('/tmp/source-run.json'));jobs=json.load(open('/tmp/source-jobs.json'))['jobs'];arts=json.load(open('/tmp/source-artifacts.json'))['artifacts']
          assert (run['id'],run['run_attempt'],run['head_sha'],run['status'],run['conclusion'])==(31848052825,1,'44ef4dee635745a8d9cabab25a5e01638307bdc9','completed','failure')
          assert len([j for j in jobs if j['name'].startswith('cases (')])==24 and all(j['conclusion']=='success' for j in jobs if j['name'].startswith('cases ('))
          assert len(arts)==25
          actual={a['id']:(a['name'],a.get('digest')) for a in arts if a['name'].startswith('level-b-v2-v0070-o27-case-')};assert len(actual)==24
          for x in r['immutableCaseArtifacts']:assert actual[x['artifactId']]==('level-b-v2-v0070-o27-case-'+x['caseId'],x['digest'])
          def flat(path,key=None):
            out=[]
            for page in json.load(open(path)):out.extend(page.get(key,[]) if key else page)
            return out
          branches=flat('/tmp/branches.json');runs=flat('/tmp/runs.json','workflow_runs');comments=flat('/tmp/comments.json')
          assert not [b for b in branches if b.get('name')==os.environ['EVAL_BRANCH']]
          assert not [x for x in runs if x.get('event')=='push' and x.get('head_branch')==os.environ['EVAL_BRANCH']]
          assert not [c for c in comments if 'AUTHORIZED-EVALUATION-RECOVERY | MYSTIC-STATE-0070 | ordinal=27 | ' in str(c.get('body') or '')]
          PY
      - name: Prove authorization review cannot execute solver or change science
        run: |
          ! grep -Eiq 'micromamba|rubin-libradtran|uvspec|executor_v[0-9]+\.py|build_manifest_v[0-9]+\.py' "$GITHUB_WORKSPACE/.github/workflows/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-authorization-review-v1.yml"
          python - <<'PY'
          import json,os
          a=json.load(open(os.environ['AUTH_PATH']))
          for k in ('solverExecutionAuthorized','syntaxCheckAuthorized','newScientificOrdinalAuthorized','newSeedsAuthorized','scientificRerunAllowed','scientificRetryAllowed','scientificResumeAllowed','modelRetuningAuthorized','geometryChangeAuthorized','definitionOfDoneChangeAuthorized','supportRuleChangeAuthorized','physicsChangeAuthorized','runtimeChangeAuthorized','automaticDispatch','productionPromotionAuthorized','workerBLaneReactivated','workerCLaneReactivated'):assert a[k] is False,k
          assert a['evaluationOnlyRecoveryAuthorized'] is True and a['protectedCaseArtifactsMayBeRead'] is True
          PY
