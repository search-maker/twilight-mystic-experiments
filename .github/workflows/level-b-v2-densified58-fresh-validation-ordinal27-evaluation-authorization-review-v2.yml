name: Level-B densified-58 ordinal27 evaluation transport recovery v2 authorization review

on:
  pull_request:
    branches: [main]
    paths:
      - 'review/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v2/evaluation-authorization-v2.json'

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

env:
  AUTH_PATH: review/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v2/evaluation-authorization-v2.json
  TRANSPORT_RECOVERY: review/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v2/recovery-v2.json
  EVAL_RECOVERY: review/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v1/recovery-v1.json
  EVALUATOR: review/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v1/fresh_validation_evaluation_recovery_v1.py
  AUTH_BRANCH: authorization/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v2
  EVAL_BRANCH: evaluation/level-b-v2-densified58-fresh-validation-ordinal27-recovery-v2

jobs:
  evaluation-authorization-review-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Refuse retry, non-draft, wrong branch, moved main, or non-one-file authorization
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test '${{ github.event.pull_request.draft }}' = true
          test "$GITHUB_HEAD_REF" = "$AUTH_BRANCH"
          test "$GITHUB_BASE_REF" = main
          HEAD_SHA="$(git rev-parse HEAD)"
          test "$HEAD_SHA" = '${{ github.event.pull_request.head.sha }}'
          test "$(git cat-file -p HEAD | grep -c '^parent ')" = 1
          PARENT="$(git rev-parse HEAD^)"
          test "$PARENT" = '${{ github.event.pull_request.base.sha }}'
          test "$PARENT" = "$(gh api repos/${GITHUB_REPOSITORY}/branches/main --jq .commit.sha)"
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = 1
          test "${CHANGED[0]}" = "$AUTH_PATH"
          test -f "$AUTH_PATH"
          if git cat-file -e "$PARENT:$AUTH_PATH" 2>/dev/null; then echo evaluation-v2-authorization-already-on-main; exit 1; fi
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.4'}
      - run: python -m pip install --disable-pip-version-check 'numpy==2.3.2'
      - name: Audit exact evaluation-only v2 authorization payload against parent-main blobs
        run: |
          python - <<'PY'
          import json,os,subprocess
          a=json.load(open(os.environ['AUTH_PATH']));parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          def b(p):return subprocess.check_output(['git','rev-parse',f'HEAD^:{p}'],text=True).strip()
          expected={
            'schemaVersion':2,
            'status':'AUTHORIZED_ORDINAL27_EVALUATION_ONLY_TRANSPORT_RECOVERY_V2_ATTEMPT1',
            'governance':'MYSTIC-STATE-0070',
            'scientificOrdinal':27,
            'sourceScientificRunId':31848052825,
            'sourceScientificRunAttempt':1,
            'sourceScientificHeadSha':'44ef4dee635745a8d9cabab25a5e01638307bdc9',
            'sourceCaseArtifactCount':24,
            'sourceSolverInvocationCount':24,
            'priorEvaluationRecoveryRunId':31849706647,
            'priorEvaluationRecoveryRunAttempt':1,
            'priorEvaluationRecoveryAuthorizationHeadSha':'1593c37e2c266570332898e48092b68349059bc3',
            'priorEvaluationRecoveryProtectedCaseArtifactsRead':False,
            'priorEvaluationRecoveryAdditionalSolverInvocationCount':0,
            'priorEvaluationRecoveryScientificVerdictProduced':False,
            'authorizationBranch':os.environ['AUTH_BRANCH'],
            'evaluationBranch':os.environ['EVAL_BRANCH'],
            'authorizationParentMainSha':parent,
            'transportRecoveryV2GitBlobSha':b('review/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v2/recovery-v2.json'),
            'sourceEvaluationRecoveryV1GitBlobSha':b('review/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v1/recovery-v1.json'),
            'evaluatorV1GitBlobSha':b('review/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v1/fresh_validation_evaluation_recovery_v1.py'),
            'reviewWorkflowV2GitBlobSha':b('.github/workflows/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v2-review.yml'),
            'authorizationReviewWorkflowV2GitBlobSha':b('.github/workflows/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-authorization-review-v2.yml'),
            'evaluationWorkflowV2GitBlobSha':b('.github/workflows/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v2.yml'),
            'modelArtifactId':9229229366,
            'modelArtifactDigest':'sha256:f4c8c68a622f7c6bdc1b9177ad31d22f673becb1f286436d54b876ceece3668a',
            'modelCanonicalSha256':'91ae5811e55b3d4ef872ab672f006c4b383c6581a53de67cd018b6eb2666f9a7',
            'representationArtifactId':9208203541,
            'representationArtifactDigest':'sha256:2fe50ed674155f440322c92d28877f5c022f0cc5fa13e1e601596a9902482815',
            'representationPackageSha256':'2491ac91ed924f2ba69b37ea20f48d63f51d41146cd9fe50e0bd63bfb315a763',
            'evaluationOnlyRecoveryAuthorized':True,
            'protectedCaseArtifactsMayBeRead':True,
            'solverExecutionAuthorized':False,
            'syntaxCheckAuthorized':False,
            'newScientificOrdinalAuthorized':False,
            'newSeedsAuthorized':False,
            'scientificRerunAllowed':False,
            'scientificRetryAllowed':False,
            'scientificResumeAllowed':False,
            'modelRetuningAuthorized':False,
            'geometryChangeAuthorized':False,
            'definitionOfDoneChangeAuthorized':False,
            'supportRuleChangeAuthorized':False,
            'physicsChangeAuthorized':False,
            'runtimeChangeAuthorized':False,
            'automaticDispatch':False,
            'productionPromotionAuthorized':False,
            'workerBLaneReactivated':False,
            'workerCLaneReactivated':False,
            'runAttemptRequired':1
          }
          assert a==expected,(a,expected)
          PY
      - name: Revalidate v2 transport and unchanged evaluator without protected case artifacts
        run: |
          python - <<'PY'
          import importlib.util,json,os,pathlib
          r=json.load(open(os.environ['TRANSPORT_RECOVERY']))
          assert r['transportFix']['fixScope']=='SELF_REFERENTIAL_STATIC_GUARD_ONLY'
          assert r['priorEvaluationRecoveryV1']['evaluationRunId']==31849706647 and r['priorEvaluationRecoveryV1']['identityConsumed'] is True
          assert all(v is False for v in r['reviewSurface'].values())
          p=pathlib.Path(os.environ['EVALUATOR']);s=importlib.util.spec_from_file_location('er',p);m=importlib.util.module_from_spec(s);s.loader.exec_module(m);m.validate_eval_recovery(m.load(pathlib.Path(os.environ['EVAL_RECOVERY'])))
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31827007009
          artifact-ids: 9229229366
          path: /tmp/v0070-model
          merge-multiple: true
      - name: Verify frozen model schema without protected case artifacts
        run: python "$EVALUATOR" validate-model --evaluation-recovery "$EVAL_RECOVERY" --scientific-recovery review/level-b-v2-densified58-fresh-validation-recovery-v4/recovery-v4.json --model-dir /tmp/v0070-model --repo-root .
      - name: Prove source identities and no prior v2 evaluation dispatch or marker
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/31848052825" > /tmp/source-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/31849706647" > /tmp/v1-run.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/branches?per_page=100" > /tmp/branches.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" > /tmp/runs.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/60/comments?per_page=100" > /tmp/comments.json
          python - <<'PY'
          import json,os
          s=json.load(open('/tmp/source-run.json'));v=json.load(open('/tmp/v1-run.json'))
          assert (s['id'],s['run_attempt'],s['head_sha'],s['status'],s['conclusion'])==(31848052825,1,'44ef4dee635745a8d9cabab25a5e01638307bdc9','completed','failure')
          assert (v['id'],v['run_attempt'],v['head_sha'],v['status'],v['conclusion'])==(31849706647,1,'1593c37e2c266570332898e48092b68349059bc3','completed','failure')
          def flat(path,key=None):
            out=[]
            for page in json.load(open(path)):out.extend(page.get(key,[]) if key else page)
            return out
          branches=flat('/tmp/branches.json');runs=flat('/tmp/runs.json','workflow_runs');comments=flat('/tmp/comments.json')
          assert not [b for b in branches if b.get('name')==os.environ['EVAL_BRANCH']]
          assert not [r for r in runs if r.get('event')=='push' and r.get('head_branch')==os.environ['EVAL_BRANCH']]
          assert not [c for c in comments if 'AUTHORIZED-EVALUATION-RECOVERY-V2 | MYSTIC-STATE-0070 | ordinal=27 | ' in str(c.get('body') or '')]
          PY
      - name: Prove authorization review contains no scientific execution surface
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('.github/workflows/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-authorization-review-v2.yml').read_text().lower()
          forbidden=[''.join(x) for x in [('micro','mamba'),('rubin-','libradtran'),('uv','spec'),('executor_','v'),('build_','manifest_v'),('workflow_','dispatch:'),('sched','ule:')]]
          for token in forbidden:assert token not in t,token
          PY
