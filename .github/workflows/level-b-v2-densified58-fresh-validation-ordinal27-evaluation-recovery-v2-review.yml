name: Level-B densified-58 ordinal27 evaluation-only transport recovery v2 review

on:
  pull_request:
    branches: [main]
    paths:
      - 'review/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v2/**'
      - '.github/workflows/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v2-review.yml'
      - '.github/workflows/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-authorization-review-v2.yml'
      - '.github/workflows/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v2.yml'

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

env:
  TRANSPORT_RECOVERY: review/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v2/recovery-v2.json
  EVAL_RECOVERY: review/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v1/recovery-v1.json
  EVALUATOR: review/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v1/fresh_validation_evaluation_recovery_v1.py
  AUTH_BRANCH: authorization/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v2
  EVAL_BRANCH: evaluation/level-b-v2-densified58-fresh-validation-ordinal27-recovery-v2

jobs:
  review-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - name: Prove exact review branch and inert PR surface
        run: |
          python - <<'PY'
          import json,os,pathlib,subprocess
          e=json.load(open(os.environ['GITHUB_EVENT_PATH']))
          assert e['pull_request']['base']['ref']=='main'
          assert e['pull_request']['head']['ref']=='review/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v2'
          assert e['pull_request']['head']['sha']==subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert not pathlib.Path('review/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v2/evaluation-authorization-v2.json').exists()
          PY
          test -z "$(git ls-remote --heads origin 'refs/heads/authorization/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v2')"
          test -z "$(git ls-remote --heads origin 'refs/heads/evaluation/level-b-v2-densified58-fresh-validation-ordinal27-recovery-v2')"
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.4'}
      - run: python -m pip install --disable-pip-version-check 'numpy==2.3.2'
      - name: Validate additive transport recovery without protected artifacts
        run: |
          python - <<'PY'
          import json,os,subprocess
          r=json.load(open(os.environ['TRANSPORT_RECOVERY']))
          assert (r['schemaVersion'],r['recoveryId'],r['status'],r['governance'],r['sourceMainAtRecoveryFreeze'])==(2,'level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v2','REVIEW_ONLY_POST_EXPOSURE_EVALUATION_TRANSPORT_RECOVERY_V2_NO_PROTECTED_ARTIFACT_READ_NO_SOLVER_NO_DOD_RESULT','MYSTIC-STATE-0070','2fa11fb26d745fae2ba6967861edca6462afc7f2')
          s=r['sourceScientificRun'];assert (s['runId'],s['runAttempt'],s['headSha'],s['scientificOrdinal'],s['caseCount'],s['successfulCaseCount'],s['solverInvocationCount'],s['protectedValuesOpened'],s['scientificVerdictProduced'])==(31848052825,1,'44ef4dee635745a8d9cabab25a5e01638307bdc9',27,24,24,24,True,False)
          p=r['priorEvaluationRecoveryV1'];assert (p['recoveryGitBlobSha'],p['evaluatorGitBlobSha'],p['authorizationHeadSha'],p['authorizationPullRequest'],p['authorizationReviewRunId'],p['evaluationRunId'],p['evaluationRunAttempt'],p['preflightJobId'],p['preflightConclusion'],p['evaluateConclusion'])==('bb320a9cfd4b7973733f6fd99a1bf1982d2acc07','5c04fd33415fcc45bea81429ac71add86eb50120','1593c37e2c266570332898e48092b68349059bc3',206,31849454943,31849706647,1,94923040576,'failure','skipped')
          assert p['protectedCaseArtifactsDownloaded'] is False and p['protectedCaseArtifactsRead'] is False and p['additionalSolverInvocationCount']==0 and p['scientificVerdictProduced'] is False and p['identityConsumed'] is True
          assert p['failureReason']=='SELF_REFERENTIAL_FORBIDDEN_SURFACE_GREP_MATCHED_ITS_OWN_PATTERN_TEXT'
          f=r['transportFix'];assert f['fixScope']=='SELF_REFERENTIAL_STATIC_GUARD_ONLY' and f['replacementGuard']=='DYNAMIC_TOKEN_CONSTRUCTION_WITHOUT_CONTIGUOUS_FORBIDDEN_LITERALS_IN_THE_PROOF_STEP'
          for k in ('evaluatorChangeAuthorized','scientificPayloadChangeAuthorized','protectedArtifactUniverseChangeAuthorized','solverExecutionAuthorized','syntaxCheckAuthorized','newScientificOrdinalAuthorized','newSeedsAuthorized','scientificRerunAllowed','scientificRetryAllowed','scientificResumeAllowed','retuningAllowed'):assert f[k] is False,k
          u=r['reusedImmutableEvaluationInputs'];assert u['evaluatorGitBlobSha']=='5c04fd33415fcc45bea81429ac71add86eb50120' and u['caseArtifactUniverseMayChange'] is False
          n=r['futureEvaluationOnlyIdentity'];assert (n['authorizationBranch'],n['evaluationBranch'],n['authorizationPath'],n['runAttemptRequired'],n['automaticDispatch'])==(os.environ['AUTH_BRANCH'],os.environ['EVAL_BRANCH'],'review/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v2/evaluation-authorization-v2.json',1,False)
          assert all(v is False for v in r['reviewSurface'].values())
          expected={
            'review/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v1/recovery-v1.json':'bb320a9cfd4b7973733f6fd99a1bf1982d2acc07',
            'review/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v1/fresh_validation_evaluation_recovery_v1.py':'5c04fd33415fcc45bea81429ac71add86eb50120'}
          for path,sha in expected.items():assert subprocess.check_output(['git','rev-parse',f'HEAD:{path}'],text=True).strip()==sha
          print(json.dumps({'status':'PASS','protectedNumericValuesRead':False,'solverExecutionCount':0,'evaluationRun':False},sort_keys=True))
          PY
      - name: Prove prior v1 refusal occurred before protected artifact download
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/31849706647" > /tmp/v1-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/31849706647/jobs?per_page=100" > /tmp/v1-jobs.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/94923040576/logs" > /tmp/v1-preflight.log
          python - <<'PY'
          import json
          run=json.load(open('/tmp/v1-run.json'));jobs=json.load(open('/tmp/v1-jobs.json'))['jobs']
          assert (run['run_attempt'],run['head_sha'],run['status'],run['conclusion'])==(1,'1593c37e2c266570332898e48092b68349059bc3','completed','failure')
          pre=[j for j in jobs if j['name']=='preflight'];ev=[j for j in jobs if j['name']=='evaluate']
          assert len(pre)==1 and pre[0]['id']==94923040576 and pre[0]['conclusion']=='failure'
          assert len(ev)==1 and ev[0]['conclusion']=='skipped'
          log=open('/tmp/v1-preflight.log',errors='replace').read()
          assert "Prove this workflow has no solver or scientific continuation surface" in log
          assert "Process completed with exit code 1" in log
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31827007009
          artifact-ids: 9229229366
          path: /tmp/v0070-model
          merge-multiple: true
      - name: Revalidate unchanged evaluator and frozen nested model without holdout truths
        run: python "$EVALUATOR" validate-model --evaluation-recovery "$EVAL_RECOVERY" --scientific-recovery review/level-b-v2-densified58-fresh-validation-recovery-v4/recovery-v4.json --model-dir /tmp/v0070-model --repo-root .
      - name: Prove future v2 workflows contain no scientific execution surface
        run: |
          python - <<'PY'
          from pathlib import Path
          files=[Path('.github/workflows/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-authorization-review-v2.yml'),Path('.github/workflows/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v2.yml')]
          forbidden=[''.join(x) for x in [('micro','mamba'),('rubin-','libradtran'),('uv','spec'),('executor_','v'),('build_','manifest_v'),('workflow_','dispatch:'),('sched','ule:')]]
          for f in files:
            t=f.read_text().lower()
            for token in forbidden:assert token not in t,(f.as_posix(),token)
          PY
      - name: Prove v2 authorization and evaluation identities do not yet exist
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/branches?per_page=100" > /tmp/branches.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" > /tmp/runs.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/60/comments?per_page=100" > /tmp/comments.json
          python - <<'PY'
          import json,os
          def flat(path,key=None):
            out=[]
            for page in json.load(open(path)):out.extend(page.get(key,[]) if key else page)
            return out
          branches=flat('/tmp/branches.json');runs=flat('/tmp/runs.json','workflow_runs');comments=flat('/tmp/comments.json')
          assert not [b for b in branches if b.get('name') in (os.environ['AUTH_BRANCH'],os.environ['EVAL_BRANCH'])]
          assert not [r for r in runs if r.get('event')=='push' and r.get('head_branch')==os.environ['EVAL_BRANCH']]
          assert not [c for c in comments if 'AUTHORIZED-EVALUATION-RECOVERY-V2 | MYSTIC-STATE-0070 | ordinal=27 | ' in str(c.get('body') or '')]
          PY
