name: Level-B densified-58 ordinal27 evaluation-only transport recovery v2 attempt1

on:
  push:
    branches:
      - evaluation/level-b-v2-densified58-fresh-validation-ordinal27-recovery-v2

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

env:
  AUTH_PATH: review/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v2/evaluation-authorization-v2.json
  TRANSPORT_RECOVERY: review/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v2/recovery-v2.json
  EVAL_RECOVERY: review/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v1/recovery-v1.json
  EVALUATOR: review/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v1/fresh_validation_evaluation_recovery_v1.py
  SCI_RECOVERY: review/level-b-v2-densified58-fresh-validation-recovery-v4/recovery-v4.json
  AUTH_BRANCH: authorization/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v2
  EVAL_BRANCH: evaluation/level-b-v2-densified58-fresh-validation-ordinal27-recovery-v2
  SOURCE_RUN: '31848052825'

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - name: Refuse retry, wrong branch, moved main, wrong commit shape, or authorization drift
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = "$EVAL_BRANCH"
          HEAD_SHA="$(git rev-parse HEAD)"
          test "$HEAD_SHA" = "$GITHUB_SHA"
          test "$(git cat-file -p "$HEAD_SHA" | grep -c '^parent ')" = 1
          PARENT="$(git rev-parse "$HEAD_SHA^")"
          test "$PARENT" = "$(gh api repos/${GITHUB_REPOSITORY}/branches/main --jq .commit.sha)"
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA")
          test "${#CHANGED[@]}" = 1
          test "${CHANGED[0]}" = "$AUTH_PATH"
          test -f "$AUTH_PATH"
          if git cat-file -e "$PARENT:$AUTH_PATH" 2>/dev/null; then echo evaluation-v2-authorization-already-on-main; exit 1; fi
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.4'}
      - run: python -m pip install --disable-pip-version-check 'numpy==2.3.2'
      - name: Validate exact v2 authorization and frozen recovery bindings before protected artifact access
        run: |
          python - <<'PY'
          import importlib.util,json,os,pathlib,subprocess
          a=json.load(open(os.environ['AUTH_PATH']));parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          def b(p):return subprocess.check_output(['git','rev-parse',f'HEAD^:{p}'],text=True).strip()
          expected={
            'schemaVersion':2,'status':'AUTHORIZED_ORDINAL27_EVALUATION_ONLY_TRANSPORT_RECOVERY_V2_ATTEMPT1','governance':'MYSTIC-STATE-0070','scientificOrdinal':27,
            'sourceScientificRunId':31848052825,'sourceScientificRunAttempt':1,'sourceScientificHeadSha':'44ef4dee635745a8d9cabab25a5e01638307bdc9','sourceCaseArtifactCount':24,'sourceSolverInvocationCount':24,
            'priorEvaluationRecoveryRunId':31849706647,'priorEvaluationRecoveryRunAttempt':1,'priorEvaluationRecoveryAuthorizationHeadSha':'1593c37e2c266570332898e48092b68349059bc3','priorEvaluationRecoveryProtectedCaseArtifactsRead':False,'priorEvaluationRecoveryAdditionalSolverInvocationCount':0,'priorEvaluationRecoveryScientificVerdictProduced':False,
            'authorizationBranch':os.environ['AUTH_BRANCH'],'evaluationBranch':os.environ['EVAL_BRANCH'],'authorizationParentMainSha':parent,
            'transportRecoveryV2GitBlobSha':b('review/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v2/recovery-v2.json'),
            'sourceEvaluationRecoveryV1GitBlobSha':b('review/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v1/recovery-v1.json'),
            'evaluatorV1GitBlobSha':b('review/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v1/fresh_validation_evaluation_recovery_v1.py'),
            'reviewWorkflowV2GitBlobSha':b('.github/workflows/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v2-review.yml'),
            'authorizationReviewWorkflowV2GitBlobSha':b('.github/workflows/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-authorization-review-v2.yml'),
            'evaluationWorkflowV2GitBlobSha':b('.github/workflows/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v2.yml'),
            'modelArtifactId':9229229366,'modelArtifactDigest':'sha256:f4c8c68a622f7c6bdc1b9177ad31d22f673becb1f286436d54b876ceece3668a','modelCanonicalSha256':'91ae5811e55b3d4ef872ab672f006c4b383c6581a53de67cd018b6eb2666f9a7',
            'representationArtifactId':9208203541,'representationArtifactDigest':'sha256:2fe50ed674155f440322c92d28877f5c022f0cc5fa13e1e601596a9902482815','representationPackageSha256':'2491ac91ed924f2ba69b37ea20f48d63f51d41146cd9fe50e0bd63bfb315a763',
            'evaluationOnlyRecoveryAuthorized':True,'protectedCaseArtifactsMayBeRead':True,'solverExecutionAuthorized':False,'syntaxCheckAuthorized':False,'newScientificOrdinalAuthorized':False,'newSeedsAuthorized':False,
            'scientificRerunAllowed':False,'scientificRetryAllowed':False,'scientificResumeAllowed':False,'modelRetuningAuthorized':False,'geometryChangeAuthorized':False,'definitionOfDoneChangeAuthorized':False,'supportRuleChangeAuthorized':False,'physicsChangeAuthorized':False,'runtimeChangeAuthorized':False,'automaticDispatch':False,'productionPromotionAuthorized':False,'workerBLaneReactivated':False,'workerCLaneReactivated':False,'runAttemptRequired':1}
          assert a==expected,(a,expected)
          tr=json.load(open(os.environ['TRANSPORT_RECOVERY']));assert tr['transportFix']['fixScope']=='SELF_REFERENTIAL_STATIC_GUARD_ONLY' and tr['priorEvaluationRecoveryV1']['identityConsumed'] is True
          p=pathlib.Path(os.environ['EVALUATOR']);s=importlib.util.spec_from_file_location('er',p);m=importlib.util.module_from_spec(s);s.loader.exec_module(m);m.validate_eval_recovery(m.load(pathlib.Path(os.environ['EVAL_RECOVERY'])))
          PY
      - name: Resolve exact successful attempt-1 Draft v2 evaluation authorization review
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY%%/*}"; HEAD_SHA="$(git rev-parse HEAD)"
          gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${OWNER}:${AUTH_BRANCH}&per_page=100" > /tmp/auth-prs.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-authorization-review-v2.yml/runs?event=pull_request&branch=${AUTH_BRANCH}&per_page=100" > /tmp/auth-runs.json
          python - "$HEAD_SHA" <<'PY'
          import json,os,sys
          sha=sys.argv[1];prs=json.load(open('/tmp/auth-prs.json'));runs=json.load(open('/tmp/auth-runs.json'))['workflow_runs']
          ps=[p for p in prs if p['head']['sha']==sha and p['head']['ref']==os.environ['AUTH_BRANCH'] and p.get('merged_at') is None and p.get('draft') is True]
          rs=[r for r in runs if r['head_sha']==sha and r['head_branch']==os.environ['AUTH_BRANCH'] and int(r.get('run_attempt') or 0)==1 and r.get('status')=='completed' and r.get('conclusion')=='success']
          assert len(ps)==1 and len(rs)==1,(len(ps),len(rs))
          PY
      - name: Require exact v2 authorization marker and sole v2 evaluation dispatch identity
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/branches?per_page=100" > /tmp/branches.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" > /tmp/runs.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/60/comments?per_page=100" > /tmp/comments.json
          HEAD_SHA="$(git rev-parse HEAD)"
          python - "$HEAD_SHA" "$GITHUB_RUN_ID" <<'PY'
          import json,os,sys
          head=sys.argv[1];run_id=int(sys.argv[2]);marker=f'AUTHORIZED-EVALUATION-RECOVERY-V2 | MYSTIC-STATE-0070 | ordinal=27 | authHead={head} | sourceRun=31848052825 | sourceArtifacts=24'
          def flat(path,key=None):
            out=[]
            for page in json.load(open(path)):out.extend(page.get(key,[]) if key else page)
            return out
          branches=flat('/tmp/branches.json');runs=flat('/tmp/runs.json','workflow_runs');comments=flat('/tmp/comments.json')
          eb=[b for b in branches if b.get('name')==os.environ['EVAL_BRANCH']];assert len(eb)==1 and eb[0]['commit']['sha']==head
          markers=[c for c in comments if str(c.get('body') or '')==marker];assert len(markers)==1,len(markers)
          distinct=[str(c.get('body') or '') for c in comments if 'AUTHORIZED-EVALUATION-RECOVERY-V2 | MYSTIC-STATE-0070 | ordinal=27 | ' in str(c.get('body') or '')];assert distinct==[marker],distinct
          dr=[r for r in runs if r.get('event')=='push' and r.get('head_branch')==os.environ['EVAL_BRANCH']];assert len(dr)==1 and int(dr[0]['id'])==run_id and dr[0]['head_sha']==head and int(dr[0].get('run_attempt') or 0)==1,(dr,run_id)
          PY
      - name: Prove immutable source artifacts and prior v1 refusal before protected download
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}" > /tmp/source-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}/jobs?per_page=100" > /tmp/source-jobs.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}/artifacts?per_page=100" > /tmp/source-artifacts.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/31849706647" > /tmp/v1-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/31849706647/jobs?per_page=100" > /tmp/v1-jobs.json
          python - <<'PY'
          import json,os
          r=json.load(open(os.environ['EVAL_RECOVERY']));run=json.load(open('/tmp/source-run.json'));jobs=json.load(open('/tmp/source-jobs.json'))['jobs'];arts=json.load(open('/tmp/source-artifacts.json'))['artifacts']
          assert (run['id'],run['run_attempt'],run['head_sha'],run['status'],run['conclusion'])==(31848052825,1,'44ef4dee635745a8d9cabab25a5e01638307bdc9','completed','failure')
          pre=[j for j in jobs if j['name']=='preflight'];cases=[j for j in jobs if j['name'].startswith('cases (')];ev=[j for j in jobs if j['name']=='evaluate']
          assert len(pre)==1 and pre[0]['conclusion']=='success';assert len(cases)==24 and all(j['conclusion']=='success' for j in cases);assert len(ev)==1 and ev[0]['id']==94920097388 and ev[0]['conclusion']=='failure'
          assert len(arts)==25
          actual={a['id']:(a['name'],a.get('digest')) for a in arts if a['name'].startswith('level-b-v2-v0070-o27-case-')};assert len(actual)==24
          for x in r['immutableCaseArtifacts']:assert actual[x['artifactId']]==('level-b-v2-v0070-o27-case-'+x['caseId'],x['digest'])
          v=json.load(open('/tmp/v1-run.json'));vj=json.load(open('/tmp/v1-jobs.json'))['jobs'];assert (v['run_attempt'],v['head_sha'],v['status'],v['conclusion'])==(1,'1593c37e2c266570332898e48092b68349059bc3','completed','failure')
          vp=[j for j in vj if j['name']=='preflight'];ve=[j for j in vj if j['name']=='evaluate'];assert len(vp)==1 and vp[0]['conclusion']=='failure' and len(ve)==1 and ve[0]['conclusion']=='skipped'
          PY
      - name: Prove this v2 workflow has no scientific execution surface without self-matching
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('.github/workflows/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v2.yml').read_text().lower()
          forbidden=[''.join(x) for x in [('micro','mamba'),('rubin-','libradtran'),('uv','spec'),('executor_','v'),('build_','manifest_v'),('workflow_','dispatch:'),('sched','ule:')]]
          for token in forbidden:assert token not in t,token
          PY

  evaluate:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.4'}
      - run: python -m pip install --disable-pip-version-check 'numpy==2.3.2'
      - name: Download exactly the immutable 24 protected case artifacts from the original source run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31848052825
          pattern: 'level-b-v2-v0070-o27-case-*'
          path: /tmp/v0070-o27-case-artifacts
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31827007009
          artifact-ids: 9229229366
          path: /tmp/v0070-model
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31771224298
          artifact-ids: 9208203541
          path: /tmp/v0070-representation
          merge-multiple: true
      - name: Evaluate original ordinal27 case artifacts once with the unchanged reviewed evaluator
        run: python "$EVALUATOR" evaluate --evaluation-recovery "$EVAL_RECOVERY" --scientific-recovery "$SCI_RECOVERY" --cases-root /tmp/v0070-o27-case-artifacts --model-dir /tmp/v0070-model --representation-dir /tmp/v0070-representation --repo-root . --output /tmp/v0070-o27-evaluation-recovery-v2.json
      - name: Independently audit frozen DoD and zero-additional-solver provenance
        run: |
          python - <<'PY'
          import hashlib,json,os
          p='/tmp/v0070-o27-evaluation-recovery-v2.json';r=json.load(open(p));b=dict(r);h=b.pop('resultSha256');assert h==hashlib.sha256(json.dumps(b,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
          assert (r['geometryCount'],r['caseCount'],r['configuredPhotonHistories'])==(6,24,960_000_000)
          assert r['modelSha256']=='91ae5811e55b3d4ef872ab672f006c4b383c6581a53de67cd018b6eb2666f9a7' and r['representationPackageSha256']=='2491ac91ed924f2ba69b37ea20f48d63f51d41146cd9fe50e0bd63bfb315a763'
          assert r['p90OrP95Used'] is False and r['retuningPerformed'] is False and r['modelChangedAfterHoldoutOpening'] is False and r['ordinal22ValuesRead'] is False
          calc=r['supportPass'] and all(x['passes'] for x in r['channelSummary'].values()) and r['shapePass'] and r['baselinePass'];assert calc==r['definitionOfDonePassed'];assert r['status']==('PASS_FROZEN_FRESH_DOD' if calc else 'FAIL_FROZEN_FRESH_DOD_NO_RETUNING')
          assert r['freshValidationSourceMayBeReusedAfterRetuningIfFailed'] is False
          assert r['evaluationRecoveryId']=='level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v1' and r['sourceScientificRunId']==31848052825 and r['sourceScientificRunAttempt']==1 and r['sourceCaseArtifactCount']==24 and r['sourceSolverInvocationCount']==24
          assert r['additionalSolverInvocationCount']==0 and r['scientificRerunPerformed'] is False and r['scientificRetryPerformed'] is False and r['scientificResumePerformed'] is False and r['modelRetuningPerformed'] is False
          assert r['productionPromotionAuthorized'] is False and r['workerBLaneReactivated'] is False and r['workerCLaneReactivated'] is False
          provenance={'schemaVersion':2,'transportRecoveryId':'level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v2','transportRecoveryRunId':int(os.environ['GITHUB_RUN_ID']),'transportRecoveryRunAttempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'authorizationHeadSha':os.environ['GITHUB_SHA'],'sourceScientificRunId':31848052825,'sourceEvaluationRecoveryV1RunId':31849706647,'sourceCaseArtifactCount':24,'sourceSolverInvocationCount':24,'additionalSolverInvocationCount':0,'reusedEvaluatorGitBlobSha':'5c04fd33415fcc45bea81429ac71add86eb50120','scientificVerdictStatus':r['status'],'scientificResultSha256':r['resultSha256'],'modelRetuningPerformed':False,'productionPromotionAuthorized':False}
          with open('/tmp/v0070-o27-evaluation-recovery-v2-provenance.json','w') as f:json.dump(provenance,f,indent=2,sort_keys=True);f.write('\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: level-b-v2-v0070-o27-evaluation-recovery-v2-${{ github.sha }}
          path: |
            /tmp/v0070-o27-evaluation-recovery-v2.json
            /tmp/v0070-o27-evaluation-recovery-v2-provenance.json
          if-no-files-found: warn
          retention-days: 90
