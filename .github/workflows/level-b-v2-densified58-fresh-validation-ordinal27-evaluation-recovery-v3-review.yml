name: Level-B densified-58 ordinal27 evaluation schema recovery v3 review

on:
  pull_request:
    branches: [main]
    paths:
      - 'review/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v3/**'
      - '.github/workflows/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v3-review.yml'
      - '.github/workflows/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-authorization-review-v3.yml'
      - '.github/workflows/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v3.yml'

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

env:
  RECOVERY: review/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v3/recovery-v3.json
  EVALUATOR: review/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v3/fresh_validation_evaluation_recovery_v2.py
  EVAL_V1_RECOVERY: review/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v1/recovery-v1.json
  SCI_RECOVERY: review/level-b-v2-densified58-fresh-validation-recovery-v4/recovery-v4.json
  AUTH_BRANCH: authorization/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v3
  EVAL_BRANCH: evaluation/level-b-v2-densified58-fresh-validation-ordinal27-recovery-v3

jobs:
  review-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - name: Prove exact review branch and inert surface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,subprocess
          e=json.load(open(os.environ['GITHUB_EVENT_PATH']))
          assert e['pull_request']['base']['ref']=='main'
          assert e['pull_request']['head']['ref']=='review/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v3'
          assert e['pull_request']['head']['sha']==subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert not pathlib.Path('review/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v3/evaluation-authorization-v3.json').exists()
          PY
          test -z "$(git ls-remote --heads origin 'refs/heads/authorization/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v3')"
          test -z "$(git ls-remote --heads origin 'refs/heads/evaluation/level-b-v2-densified58-fresh-validation-ordinal27-recovery-v3')"
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.4'}
      - run: python -m pip install --disable-pip-version-check 'numpy==2.3.2'
      - name: Validate v3 recovery descriptor and exact frozen source blobs
        run: |
          python - <<'PY'
          import json,os,subprocess
          r=json.load(open(os.environ['RECOVERY']))
          assert (r['schemaVersion'],r['recoveryId'],r['status'],r['governance'],r['sourceMainAtRecoveryFreeze'])==(3,'level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v3','REVIEW_ONLY_POST_EXPOSURE_COMPLETE_NESTED_MODEL_EVALUATION_SCHEMA_RECOVERY_NO_PROTECTED_CASE_READ_NO_SOLVER_NO_DOD_RESULT','MYSTIC-STATE-0070','bde051158b4e78c6d91a186ba3de4f66faca45cd')
          s=r['sourceScientificRun'];assert (s['runId'],s['runAttempt'],s['headSha'],s['scientificOrdinal'],s['caseCount'],s['successfulCaseCount'],s['syntaxCheckCount'],s['solverInvocationCount'],s['protectedValuesOpened'],s['scientificVerdictProduced'])==(31848052825,1,'44ef4dee635745a8d9cabab25a5e01638307bdc9',27,24,24,24,24,True,False)
          p=r['priorEvaluationAttempts'];assert p['evaluationRecoveryV1']['identityConsumed'] is True and p['evaluationRecoveryV2']['identityConsumed'] is True
          assert p['evaluationRecoveryV2']['evaluationRunId']==31850828379 and p['evaluationRecoveryV2']['protectedCaseArtifactsDownloaded'] is True and p['evaluationRecoveryV2']['protectedCaseArtifactCount']==24 and p['evaluationRecoveryV2']['evaluatorRefusal']=="KeyError:'shapeFitX'" and p['evaluationRecoveryV2']['resultArtifactWritten'] is False
          root=r['rootCause'];assert root['kind']=='BASE_EVALUATOR_SECOND_LEGACY_FLAT_MODEL_ACCESS_IN_SUPPORT_DISTANCE_ONLY' and root['legacyLookup']=="model['model']['shapeFitX']" and root['exactFrozenNestedEquivalent']=="model['model']['shape']['coordinates']" and root['nestedShapeCoordinateDimensions']==[58,5] and root['discoveredWithoutConsultingProtectedNumericValues'] is True
          c=r['compatibilityMechanism'];assert c['kind']=='NON_SERIALIZED_DICT_SUBCLASS_VIRTUAL_LOOKUP_ONLY' and c['virtualKey']=='shapeFitX' and c['virtualValueSource']=='shape.coordinates' and c['virtualKeyIncludedInSerializedKeys'] is False and c['canonicalModelSelfHashChanges'] is False and c['predictionObjectChanges'] is False and c['evaluationMathCopiedOrReimplemented'] is False and c['baseEvaluationMathReused'] is True
          scope=r['recoveryScope'];assert scope['allowedChange']=='VIRTUALIZE_ONLY_THE_SINGLE_SUPPORT_DISTANCE_LEGACY_SHAPEFITX_LOOKUP_TO_THE_EXACT_FROZEN_NESTED_SHAPE_COORDINATES'
          for k,v in scope.items():
            if k!='allowedChange': assert v is False,(k,v)
          assert all(v is False for v in r['reviewSurface'].values())
          expected={
            'review/level-b-v2-densified58-fresh-validation-implementation-v1/fresh_validation_v1.py':'085f040caa6aec53aace00381035115358b21239',
            'review/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v1/fresh_validation_evaluation_recovery_v1.py':'5c04fd33415fcc45bea81429ac71add86eb50120',
            'review/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v1/recovery-v1.json':'bb320a9cfd4b7973733f6fd99a1bf1982d2acc07',
            'review/level-b-v2-densified58-fresh-validation-recovery-v4/fresh_validation_v4.py':'fccabb0aa3d780573843be11a79f76bf50f4261b',
            'review/level-b-v2-training-implementation-v3-densified58/train_v3.py':'013768b9cb32050e698bc7b884921cbd5f1674e2',
            'review/level-b-v2-training-implementation-v2/train_v2.py':'bd0d20ebaaf77a8780dbfa021cfaa49bf3e2d0be',
            'review/tier2-stage2-protected-holdout-v1/stage2_v1.py':'59cbff54a6393f138ac44fdbb553842f38e6db60',
            'review/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v3/fresh_validation_evaluation_recovery_v2.py':'c1c7d449e3280e22857e219378303f2321e7ea60'}
          for path,sha in expected.items():
            got=subprocess.check_output(['git','rev-parse',f'HEAD:{path}'],text=True).strip();assert got==sha,(path,got,sha)
          PY
      - name: Prove source run and both prior evaluation identities are terminal and consumed
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/31848052825" > /tmp/source.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/31849706647/jobs?per_page=100" > /tmp/v1jobs.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/31850828379/jobs?per_page=100" > /tmp/v2jobs.json
          python - <<'PY'
          import json
          s=json.load(open('/tmp/source.json'));assert (s['run_attempt'],s['head_sha'],s['status'],s['conclusion'])==(1,'44ef4dee635745a8d9cabab25a5e01638307bdc9','completed','failure')
          v1=json.load(open('/tmp/v1jobs.json'))['jobs'];p1=[j for j in v1 if j['name']=='preflight'];e1=[j for j in v1 if j['name']=='evaluate'];assert len(p1)==1 and p1[0]['conclusion']=='failure' and len(e1)==1 and e1[0]['conclusion']=='skipped'
          v2=json.load(open('/tmp/v2jobs.json'))['jobs'];p2=[j for j in v2 if j['name']=='preflight'];e2=[j for j in v2 if j['name']=='evaluate'];assert len(p2)==1 and p2[0]['conclusion']=='success' and len(e2)==1 and e2[0]['id']==94926328818 and e2[0]['conclusion']=='failure'
          failed=[x for x in (e2[0].get('steps') or []) if x.get('conclusion')=='failure'];assert len(failed)==1 and failed[0]['name']=='Evaluate original ordinal27 case artifacts once with the unchanged reviewed evaluator'
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31827007009
          artifact-ids: 9229229366
          path: /tmp/v0070-model
          merge-multiple: true
      - name: Prove complete compatibility layer on frozen model without protected case artifacts
        run: python "$EVALUATOR" validate-model --evaluation-recovery-v1 "$EVAL_V1_RECOVERY" --scientific-recovery "$SCI_RECOVERY" --model-dir /tmp/v0070-model --repo-root .
      - name: Prove evaluator patch does not copy evaluation math and future workflows have no science execution surface
        run: |
          python - <<'PY'
          from pathlib import Path
          e=Path('review/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v3/fresh_validation_evaluation_recovery_v2.py').read_text()
          assert 'def summarize_records' not in e
          assert "if key == 'shapeFitX'" in e and "return shape['coordinates']" in e
          assert "base.load = load_with_frozen_model_compatibility" in e
          assert "v4.evaluate(science_recovery" in e
          files=[Path('.github/workflows/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-authorization-review-v3.yml'),Path('.github/workflows/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v3.yml')]
          forbidden=[''.join(x) for x in [('micro','mamba'),('rubin-','libradtran'),('uv','spec'),('executor_','v'),('build_','manifest_v'),('workflow_','dispatch:'),('sched','ule:')]]
          for f in files:
            assert f.exists(),f
            t=f.read_text().lower()
            for token in forbidden: assert token not in t,(f.as_posix(),token)
          PY
      - name: Prove v3 authorization, marker and evaluation dispatch do not exist
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/branches?per_page=100" > /tmp/branches.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" > /tmp/runs.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/60/comments?per_page=100" > /tmp/comments.json
          python - <<'PY'
          import json,os
          def flat(path,key=None):
            out=[]
            for page in json.load(open(path)): out.extend(page.get(key,[]) if key else page)
            return out
          branches=flat('/tmp/branches.json');runs=flat('/tmp/runs.json','workflow_runs');comments=flat('/tmp/comments.json')
          assert not [b for b in branches if b.get('name') in (os.environ['AUTH_BRANCH'],os.environ['EVAL_BRANCH'])]
          assert not [r for r in runs if r.get('event')=='push' and r.get('head_branch')==os.environ['EVAL_BRANCH']]
          assert not [c for c in comments if 'AUTHORIZED-EVALUATION-RECOVERY-V3 | MYSTIC-STATE-0070 | ordinal=27 | ' in str(c.get('body') or '')]
          PY
