name: Level-B densified-58 ordinal27 evaluation schema recovery v3 attempt1

on:
  push:
    branches:
      - evaluation/level-b-v2-densified58-fresh-validation-ordinal27-recovery-v3

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

env:
  AUTH_PATH: review/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v3/evaluation-authorization-v3.json
  RECOVERY: review/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v3/recovery-v3.json
  EVALUATOR: review/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v3/fresh_validation_evaluation_recovery_v2.py
  EVAL_V1_RECOVERY: review/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v1/recovery-v1.json
  SCI_RECOVERY: review/level-b-v2-densified58-fresh-validation-recovery-v4/recovery-v4.json
  AUTH_BRANCH: authorization/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v3
  EVAL_BRANCH: evaluation/level-b-v2-densified58-fresh-validation-ordinal27-recovery-v3
  SOURCE_RUN: '31848052825'

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - name: Refuse retry, wrong branch, moved main, wrong commit shape, or authorization drift
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = "$EVAL_BRANCH"
          HEAD_SHA="$(git rev-parse HEAD)"; test "$HEAD_SHA" = "$GITHUB_SHA"
          test "$(git cat-file -p "$HEAD_SHA" | grep -c '^parent ')" = 1
          PARENT="$(git rev-parse "$HEAD_SHA^")"
          test "$PARENT" = "$(gh api repos/${GITHUB_REPOSITORY}/branches/main --jq .commit.sha)"
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA")
          test "${#CHANGED[@]}" = 1; test "${CHANGED[0]}" = "$AUTH_PATH"; test -f "$AUTH_PATH"
          if git cat-file -e "$PARENT:$AUTH_PATH" 2>/dev/null; then echo v3-authorization-already-on-main; exit 1; fi
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.4'}
      - run: python -m pip install --disable-pip-version-check 'numpy==2.3.2'
      - name: Validate exact v3 authorization and recovery bindings before protected artifact access
        run: |
          python - <<'PY'
          import json,os,subprocess
          a=json.load(open(os.environ['AUTH_PATH']));parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          def b(p): return subprocess.check_output(['git','rev-parse',f'HEAD^:{p}'],text=True).strip()
          expected={
            'schemaVersion':3,'status':'AUTHORIZED_ORDINAL27_EVALUATION_SCHEMA_RECOVERY_V3_ATTEMPT1','governance':'MYSTIC-STATE-0070','scientificOrdinal':27,
            'sourceScientificRunId':31848052825,'sourceScientificRunAttempt':1,'sourceScientificHeadSha':'44ef4dee635745a8d9cabab25a5e01638307bdc9','sourceCaseArtifactCount':24,'sourceSolverInvocationCount':24,
            'priorEvaluationRecoveryV1RunId':31849706647,'priorEvaluationRecoveryV2RunId':31850828379,'priorEvaluationRecoveryV2ProtectedCaseArtifactsRead':True,'priorEvaluationRecoveryV2ScientificVerdictProduced':False,'priorEvaluationRecoveryV2AdditionalSolverInvocationCount':0,
            'authorizationBranch':os.environ['AUTH_BRANCH'],'evaluationBranch':os.environ['EVAL_BRANCH'],'authorizationParentMainSha':parent,
            'recoveryV3GitBlobSha':b('review/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v3/recovery-v3.json'),
            'evaluatorV2GitBlobSha':b('review/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v3/fresh_validation_evaluation_recovery_v2.py'),
            'sourceEvaluationRecoveryV1GitBlobSha':b('review/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v1/recovery-v1.json'),
            'reviewWorkflowV3GitBlobSha':b('.github/workflows/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v3-review.yml'),
            'authorizationReviewWorkflowV3GitBlobSha':b('.github/workflows/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-authorization-review-v3.yml'),
            'evaluationWorkflowV3GitBlobSha':b('.github/workflows/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v3.yml'),
            'modelArtifactId':9229229366,'modelArtifactDigest':'sha256:f4c8c68a622f7c6bdc1b9177ad31d22f673becb1f286436d54b876ceece3668a','modelCanonicalSha256':'91ae5811e55b3d4ef872ab672f006c4b383c6581a53de67cd018b6eb2666f9a7',
            'representationArtifactId':9208203541,'representationArtifactDigest':'sha256:2fe50ed674155f440322c92d28877f5c022f0cc5fa13e1e601596a9902482815','representationPackageSha256':'2491ac91ed924f2ba69b37ea20f48d63f51d41146cd9fe50e0bd63bfb315a763',
            'compatibilityId':'VIRTUAL_SHAPEFITX_TO_FROZEN_NESTED_SHAPE_COORDINATES_ONLY','evaluationOnlyRecoveryAuthorized':True,'protectedCaseArtifactsMayBeRead':True,'solverExecutionAuthorized':False,'syntaxCheckAuthorized':False,'newScientificOrdinalAuthorized':False,'newSeedsAuthorized':False,
            'scientificRerunAllowed':False,'scientificRetryAllowed':False,'scientificResumeAllowed':False,'modelRetuningAuthorized':False,'modelChangeAuthorized':False,'geometryChangeAuthorized':False,'definitionOfDoneChangeAuthorized':False,'supportRuleChangeAuthorized':False,'supportCoordinateFormulaChangeAuthorized':False,'physicsChangeAuthorized':False,'runtimeChangeAuthorized':False,'predictionEngineChangeAuthorized':False,'automaticDispatch':False,'productionPromotionAuthorized':False,'workerBLaneReactivated':False,'workerCLaneReactivated':False,'runAttemptRequired':1}
          assert a==expected,(a,expected)
          r=json.load(open(os.environ['RECOVERY']));assert r['rootCause']['newEvaluatorGitBlobSha']==b('review/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v3/fresh_validation_evaluation_recovery_v2.py') and r['compatibilityMechanism']['evaluationMathCopiedOrReimplemented'] is False
          PY
      - name: Resolve exact successful attempt-1 Draft v3 authorization review
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY%%/*}"; HEAD_SHA="$(git rev-parse HEAD)"
          gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${OWNER}:${AUTH_BRANCH}&per_page=100" > /tmp/auth-prs.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-authorization-review-v3.yml/runs?event=pull_request&branch=${AUTH_BRANCH}&per_page=100" > /tmp/auth-runs.json
          python - "$HEAD_SHA" <<'PY'
          import json,os,sys
          sha=sys.argv[1];prs=json.load(open('/tmp/auth-prs.json'));runs=json.load(open('/tmp/auth-runs.json'))['workflow_runs']
          ps=[p for p in prs if p['head']['sha']==sha and p['head']['ref']==os.environ['AUTH_BRANCH'] and p.get('merged_at') is None and p.get('draft') is True]
          rs=[r for r in runs if r['head_sha']==sha and r['head_branch']==os.environ['AUTH_BRANCH'] and int(r.get('run_attempt') or 0)==1 and r.get('status')=='completed' and r.get('conclusion')=='success']
          assert len(ps)==1 and len(rs)==1,(len(ps),len(rs))
          PY
      - name: Require exact v3 marker and sole v3 evaluation dispatch identity
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/branches?per_page=100" > /tmp/branches.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" > /tmp/runs.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/60/comments?per_page=100" > /tmp/comments.json
          python - "$GITHUB_SHA" "$GITHUB_RUN_ID" <<'PY'
          import json,os,sys
          head=sys.argv[1];run_id=int(sys.argv[2]);marker=f'AUTHORIZED-EVALUATION-RECOVERY-V3 | MYSTIC-STATE-0070 | ordinal=27 | authHead={head} | sourceRun=31848052825 | sourceArtifacts=24'
          def flat(path,key=None):
            out=[]
            for page in json.load(open(path)): out.extend(page.get(key,[]) if key else page)
            return out
          branches=flat('/tmp/branches.json');runs=flat('/tmp/runs.json','workflow_runs');comments=flat('/tmp/comments.json')
          eb=[b for b in branches if b.get('name')==os.environ['EVAL_BRANCH']];assert len(eb)==1 and eb[0]['commit']['sha']==head
          markers=[c for c in comments if str(c.get('body') or '')==marker];assert len(markers)==1,len(markers)
          distinct=[str(c.get('body') or '') for c in comments if 'AUTHORIZED-EVALUATION-RECOVERY-V3 | MYSTIC-STATE-0070 | ordinal=27 | ' in str(c.get('body') or '')];assert distinct==[marker],distinct
          dr=[r for r in runs if r.get('event')=='push' and r.get('head_branch')==os.environ['EVAL_BRANCH']];assert len(dr)==1 and int(dr[0]['id'])==run_id and dr[0]['head_sha']==head and int(dr[0].get('run_attempt') or 0)==1,(dr,run_id)
          PY
      - name: Prove immutable source artifacts and prior v2 refusal metadata before protected download
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}" > /tmp/source.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}/jobs?per_page=100" > /tmp/source-jobs.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}/artifacts?per_page=100" > /tmp/source-artifacts.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/31850828379/jobs?per_page=100" > /tmp/v2-jobs.json
          python - <<'PY'
          import json,os
          r=json.load(open(os.environ['EVAL_V1_RECOVERY']));run=json.load(open('/tmp/source.json'));jobs=json.load(open('/tmp/source-jobs.json'))['jobs'];arts=json.load(open('/tmp/source-artifacts.json'))['artifacts']
          assert (run['run_attempt'],run['head_sha'],run['status'],run['conclusion'])==(1,'44ef4dee635745a8d9cabab25a5e01638307bdc9','completed','failure')
          cases=[j for j in jobs if j['name'].startswith('cases (')];assert len(cases)==24 and all(j['conclusion']=='success' for j in cases)
          actual={a['id']:(a['name'],a.get('digest')) for a in arts if a['name'].startswith('level-b-v2-v0070-o27-case-')};assert len(actual)==24
          for x in r['immutableCaseArtifacts']: assert actual[x['artifactId']]==('level-b-v2-v0070-o27-case-'+x['caseId'],x['digest'])
          v2=json.load(open('/tmp/v2-jobs.json'))['jobs'];p=[j for j in v2 if j['name']=='preflight'];e=[j for j in v2 if j['name']=='evaluate'];assert len(p)==1 and p[0]['conclusion']=='success' and len(e)==1 and e[0]['id']==94926328818 and e[0]['conclusion']=='failure'
          PY
      - name: Prove v3 workflow has no scientific execution surface without self-matching
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('.github/workflows/level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v3.yml').read_text().lower()
          forbidden=[''.join(x) for x in [('micro','mamba'),('rubin-','libradtran'),('uv','spec'),('executor_','v'),('build_','manifest_v'),('workflow_','dispatch:'),('sched','ule:')]]
          for token in forbidden: assert token not in t,token
          PY

  evaluate:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.4'}
      - run: python -m pip install --disable-pip-version-check 'numpy==2.3.2'
      - name: Download exactly the immutable 24 protected case artifacts from the original source run
        uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: 31848052825, pattern: 'level-b-v2-v0070-o27-case-*', path: '/tmp/v0070-o27-case-artifacts', merge-multiple: false}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: 31827007009, artifact-ids: 9229229366, path: '/tmp/v0070-model', merge-multiple: true}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: 31771224298, artifact-ids: 9208203541, path: '/tmp/v0070-representation', merge-multiple: true}
      - name: Evaluate original ordinal27 artifacts once with complete frozen-model compatibility
        shell: bash
        run: |
          set +e
          python "$EVALUATOR" evaluate --evaluation-recovery-v1 "$EVAL_V1_RECOVERY" --scientific-recovery "$SCI_RECOVERY" --cases-root /tmp/v0070-o27-case-artifacts --model-dir /tmp/v0070-model --representation-dir /tmp/v0070-representation --repo-root . --output /tmp/v0070-o27-evaluation-recovery-v3.json > /tmp/v0070-o27-evaluator-v3.stdout.log 2> /tmp/v0070-o27-evaluator-v3.stderr.log
          rc=$?
          cat /tmp/v0070-o27-evaluator-v3.stdout.log
          cat /tmp/v0070-o27-evaluator-v3.stderr.log >&2
          exit "$rc"
      - name: Independently audit frozen DoD and zero-additional-solver provenance
        run: |
          python - <<'PY'
          import hashlib,json,os
          p='/tmp/v0070-o27-evaluation-recovery-v3.json';r=json.load(open(p));b=dict(r);h=b.pop('resultSha256');assert h==hashlib.sha256(json.dumps(b,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
          assert (r['geometryCount'],r['caseCount'],r['configuredPhotonHistories'])==(6,24,960_000_000)
          assert r['modelSha256']=='91ae5811e55b3d4ef872ab672f006c4b383c6581a53de67cd018b6eb2666f9a7' and r['representationPackageSha256']=='2491ac91ed924f2ba69b37ea20f48d63f51d41146cd9fe50e0bd63bfb315a763'
          calc=r['supportPass'] and all(x['passes'] for x in r['channelSummary'].values()) and r['shapePass'] and r['baselinePass'];assert calc==r['definitionOfDonePassed'];assert r['status']==('PASS_FROZEN_FRESH_DOD' if calc else 'FAIL_FROZEN_FRESH_DOD_NO_RETUNING')
          assert r['evaluationRecoveryId']=='level-b-v2-densified58-fresh-validation-ordinal27-evaluation-recovery-v3' and r['evaluationCompatibilityId']=='VIRTUAL_SHAPEFITX_TO_FROZEN_NESTED_SHAPE_COORDINATES_ONLY'
          assert r['previousEvaluationRecoveryV1RunId']==31849706647 and r['previousEvaluationRecoveryV2RunId']==31850828379
          assert r['sourceScientificRunId']==31848052825 and r['sourceScientificRunAttempt']==1 and r['sourceCaseArtifactCount']==24 and r['sourceSolverInvocationCount']==24 and r['additionalSolverInvocationCount']==0
          assert r['scientificRerunPerformed'] is False and r['scientificRetryPerformed'] is False and r['scientificResumePerformed'] is False and r['modelRetuningPerformed'] is False and r['serializedFrozenModelChanged'] is False
          assert r['p90OrP95Used'] is False and r['retuningPerformed'] is False and r['modelChangedAfterHoldoutOpening'] is False and r['ordinal22ValuesRead'] is False and r['freshValidationSourceMayBeReusedAfterRetuningIfFailed'] is False
          assert r['productionPromotionAuthorized'] is False and r['workerBLaneReactivated'] is False and r['workerCLaneReactivated'] is False
          provenance={'schemaVersion':3,'evaluationRecoveryId':r['evaluationRecoveryId'],'evaluationRunId':int(os.environ['GITHUB_RUN_ID']),'evaluationRunAttempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'authorizationHeadSha':os.environ['GITHUB_SHA'],'sourceScientificRunId':31848052825,'sourceEvaluationRecoveryV1RunId':31849706647,'sourceEvaluationRecoveryV2RunId':31850828379,'sourceCaseArtifactCount':24,'sourceSolverInvocationCount':24,'additionalSolverInvocationCount':0,'evaluatorGitBlobSha':'c1c7d449e3280e22857e219378303f2321e7ea60','compatibilityId':r['evaluationCompatibilityId'],'scientificVerdictStatus':r['status'],'scientificResultSha256':r['resultSha256'],'modelRetuningPerformed':False,'productionPromotionAuthorized':False}
          with open('/tmp/v0070-o27-evaluation-recovery-v3-provenance.json','w') as f: json.dump(provenance,f,indent=2,sort_keys=True);f.write('\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: level-b-v2-v0070-o27-evaluation-recovery-v3-${{ github.sha }}
          path: |
            /tmp/v0070-o27-evaluation-recovery-v3.json
            /tmp/v0070-o27-evaluation-recovery-v3-provenance.json
            /tmp/v0070-o27-evaluator-v3.stdout.log
            /tmp/v0070-o27-evaluator-v3.stderr.log
          if-no-files-found: warn
          retention-days: 90
