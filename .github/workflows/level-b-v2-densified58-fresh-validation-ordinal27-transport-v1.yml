name: Level-B densified-58 fresh validation ordinal27 transport review v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'review/level-b-v2-densified58-fresh-validation-ordinal27-transport-v1/transport-v1.json'
      - 'review/level-b-v2-densified58-fresh-validation-ordinal27-transport-v1/validate_transport_v1.py'
      - 'review/level-b-v2-densified58-fresh-validation-ordinal27-transport-v1/allocation_guard_v1.py'
      - '.github/workflows/level-b-v2-densified58-fresh-validation-ordinal27-transport-v1.yml'
      - '.github/workflows/level-b-v2-densified58-fresh-validation-ordinal27-authorization-review-v1.yml'
      - '.github/workflows/level-b-v2-densified58-fresh-validation-ordinal27-execution-v1.yml'
  push:
    branches: ['review/level-b-v2-densified58-fresh-validation-ordinal27-transport-v1']
    paths:
      - 'review/level-b-v2-densified58-fresh-validation-ordinal27-transport-v1/transport-v1.json'
      - 'review/level-b-v2-densified58-fresh-validation-ordinal27-transport-v1/validate_transport_v1.py'
      - 'review/level-b-v2-densified58-fresh-validation-ordinal27-transport-v1/allocation_guard_v1.py'
      - '.github/workflows/level-b-v2-densified58-fresh-validation-ordinal27-transport-v1.yml'
      - '.github/workflows/level-b-v2-densified58-fresh-validation-ordinal27-authorization-review-v1.yml'
      - '.github/workflows/level-b-v2-densified58-fresh-validation-ordinal27-execution-v1.yml'

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

jobs:
  review-only-ordinal27-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.4'}
      - run: python -m pip install --disable-pip-version-check 'numpy==2.3.2'
      - name: Validate transport bindings, allocation semantics and corrected artifact path
        run: |
          python review/level-b-v2-densified58-fresh-validation-ordinal27-transport-v1/validate_transport_v1.py --require-review-inert
          python -m py_compile review/level-b-v2-densified58-fresh-validation-ordinal27-transport-v1/validate_transport_v1.py review/level-b-v2-densified58-fresh-validation-ordinal27-transport-v1/allocation_guard_v1.py
      - name: Re-run ordinal27 recovery tests and exact manifest construction
        run: |
          python review/level-b-v2-densified58-fresh-validation-recovery-v4/test_v4.py -v
          python review/level-b-v2-densified58-fresh-validation-recovery-v4/fresh_validation_v4.py validate --recovery review/level-b-v2-densified58-fresh-validation-recovery-v4/recovery-v4.json --repo-root .
          python experiments/level-b-v2-densified58-fresh-validation-recovery-v4/build_manifest_v4.py --repo-root . --recovery review/level-b-v2-densified58-fresh-validation-recovery-v4/recovery-v4.json --output /tmp/o27-transport-manifest.json
          python - <<'PY'
          import importlib.util,json
          m=json.load(open('/tmp/o27-transport-manifest.json'));assert (m['scientificOrdinalCandidate'],m['geometryCount'],m['caseCount'],m['configuredPhotonHistories'])==(27,6,24,960_000_000);assert [x['seed'] for x in m['cases']]==list(range(2101000073,2101000097));assert all(v is False for v in m['closedUntilAuthorization'].values())
          s=importlib.util.spec_from_file_location('adapter','experiments/level-b-v2-densified58-fresh-validation-v1/adapter_v1.py');a=importlib.util.module_from_spec(s);s.loader.exec_module(a);a.validate_manifest(m)
          PY
      - name: Re-prove immutable ordinal26 artifact layout used by path correction
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31844855497
          artifact-ids: 9235548762
          path: /tmp/o26-preflight-evidence
          merge-multiple: true
      - name: Prove preserved tmp prefix and future workflow exact corrected path
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/o26-preflight-evidence/tmp/o26-manifest.json
          test ! -f /tmp/o26-preflight-evidence/o26-manifest.json
          exec=.github/workflows/level-b-v2-densified58-fresh-validation-ordinal27-execution-v1.yml
          grep -F 'DOWNLOADED_MANIFEST: /tmp/v0070-o27-preflight/tmp/o27-manifest.json' "$exec"
          grep -F 'test -f "$DOWNLOADED_MANIFEST"' "$exec"
          grep -F 'test ! -f /tmp/v0070-o27-preflight/o27-manifest.json' "$exec"
          grep -F -- '--manifest "$DOWNLOADED_MANIFEST"' "$exec"
          ! grep -F -- '--manifest /tmp/v0070-o27-preflight/o27-manifest.json' "$exec"
      - name: Prove no ordinal27 authorization, allocation lock, marker or dispatch identity exists
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          gh api --paginate --slurp 'repos/'${GITHUB_REPOSITORY}'/branches?per_page=100' > /tmp/branches.json
          gh api --paginate --slurp 'repos/'${GITHUB_REPOSITORY}'/actions/runs?per_page=100' > /tmp/runs.json
          gh api --paginate --slurp 'repos/'${GITHUB_REPOSITORY}'/issues/60/comments?per_page=100' > /tmp/comments.json
          python - <<'PY'
          import json
          def flat(p,key=None):
            out=[]
            for page in json.load(open(p)):out.extend(page.get(key,[]) if key else page)
            return out
          branches=flat('/tmp/branches.json');runs=flat('/tmp/runs.json','workflow_runs');comments=flat('/tmp/comments.json')
          prefixes=('authorization/level-b-v2-densified58-fresh-validation-ordinal27-','allocation/level-b-v2-densified58-fresh-validation-ordinal27-','dispatch/level-b-v2-densified58-fresh-validation-ordinal27-')
          assert not [b.get('name') for b in branches if any(str(b.get('name') or '').startswith(p) for p in prefixes)]
          assert not [r for r in runs if r.get('event')=='push' and str(r.get('head_branch') or '').startswith('dispatch/level-b-v2-densified58-fresh-validation-ordinal27-')]
          assert not [c for c in comments if 'ALLOCATED-SCIENCE-IDENTITY | MYSTIC-STATE-0070 | ordinal=27 | ' in str(c.get('body') or '')]
          PY
      - name: Prove future workflows are trigger-locked and review branch cannot reach science
        shell: bash
        run: |
          set -euo pipefail
          auth=.github/workflows/level-b-v2-densified58-fresh-validation-ordinal27-authorization-review-v1.yml
          exec=.github/workflows/level-b-v2-densified58-fresh-validation-ordinal27-execution-v1.yml
          grep -F 'authorization/level-b-v2-densified58-fresh-validation-ordinal27-v1' "$auth"
          grep -F 'dispatch/level-b-v2-densified58-fresh-validation-ordinal27-v1' "$exec"
          grep -F 'allocation_guard_v1.py dispatch' "$exec"
          grep -F 'executor_v4.py' "$exec"
          grep -F 'build_manifest_v4.py' "$auth" "$exec"
          grep -F 'github.event.pull_request.head.sha' "$auth"
          ! grep -F 'GITHUB_SHA' "$auth"
          ! grep -F 'workflow_dispatch:' "$auth" "$exec"
          ! grep -F 'schedule:' "$auth" "$exec"
          test "$GITHUB_REF_NAME" != authorization/level-b-v2-densified58-fresh-validation-ordinal27-v1
          test "$GITHUB_REF_NAME" != allocation/level-b-v2-densified58-fresh-validation-ordinal27-v1
          test "$GITHUB_REF_NAME" != dispatch/level-b-v2-densified58-fresh-validation-ordinal27-v1
      - uses: actions/upload-artifact@v4
        with:
          name: v0070-o27-transport-review-${{ github.sha }}
          path: /tmp/o27-transport-manifest.json
          if-no-files-found: error
          retention-days: 90
