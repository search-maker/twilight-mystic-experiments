name: Level-B densified-58 fresh validation transport review v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'review/level-b-v2-densified58-fresh-validation-transport-v1/**'
      - '.github/workflows/level-b-v2-densified58-fresh-validation-transport-v1.yml'
      - '.github/workflows/level-b-v2-densified58-fresh-validation-authorization-review-v1.yml'
      - '.github/workflows/level-b-v2-densified58-fresh-validation-execution-v1.yml'
  push:
    branches:
      - 'review/level-b-v2-densified58-fresh-validation-transport-v1'
    paths:
      - 'review/level-b-v2-densified58-fresh-validation-transport-v1/**'
      - '.github/workflows/level-b-v2-densified58-fresh-validation-transport-v1.yml'
      - '.github/workflows/level-b-v2-densified58-fresh-validation-authorization-review-v1.yml'
      - '.github/workflows/level-b-v2-densified58-fresh-validation-execution-v1.yml'

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  review-only-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - name: Install frozen numerical dependency for inherited synthetic checks
        run: python -m pip install --disable-pip-version-check 'numpy==2.3.2'
      - name: Validate exact transport/core bindings and inert review surface
        run: |
          python review/level-b-v2-densified58-fresh-validation-transport-v1/validate_transport_v1.py --require-review-inert
          python -m py_compile review/level-b-v2-densified58-fresh-validation-transport-v1/validate_transport_v1.py
      - name: Re-run merged synthetic implementation tests and exact manifest construction
        run: |
          python review/level-b-v2-densified58-fresh-validation-implementation-v1/test_v1.py -v
          python experiments/level-b-v2-densified58-fresh-validation-v1/build_manifest_v1.py \
            --repo-root . \
            --contract review/level-b-v2-densified58-fresh-validation-v1/contract-v1.json \
            --output /tmp/v0070-transport-manifest.json
          python - <<'PY'
          import json
          m=json.load(open('/tmp/v0070-transport-manifest.json'))
          assert (m['geometryCount'],m['caseCount'],m['configuredPhotonHistories'])==(6,24,960_000_000)
          assert [x['seed'] for x in m['cases']]==list(range(2101000001,2101000025))
          assert m['closedUntilAuthorization']['scientificOrdinalAllocated'] is False
          assert m['closedUntilAuthorization']['holdoutValuesMayBeRead'] is False
          assert m['closedUntilAuthorization']['scientificSolverExecutionAuthorized'] is False
          PY
      - name: Prove no authorization/allocation/dispatch identity exists during transport review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test ! -e review/level-b-v2-densified58-fresh-validation-transport-v1/authorization.json
          gh api --paginate --slurp repos/${GITHUB_REPOSITORY}/branches?per_page=100 > /tmp/branch-pages.json
          gh api --paginate --slurp repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100 > /tmp/run-pages.json
          gh api --paginate --slurp repos/${GITHUB_REPOSITORY}/issues/60/comments?per_page=100 > /tmp/issue-pages.json
          python - <<'PY'
          import json,re
          def flat(path,key=None):
              out=[]
              for page in json.load(open(path)): out.extend(page.get(key,[]) if key else page)
              return out
          branches=flat('/tmp/branch-pages.json'); runs=flat('/tmp/run-pages.json','workflow_runs'); comments=flat('/tmp/issue-pages.json')
          ar=re.compile(r'^authorization/level-b-v2-densified58-fresh-validation-ordinal24-v[0-9]+$')
          dr=re.compile(r'^dispatch/level-b-v2-densified58-fresh-validation-ordinal24-v[0-9]+$')
          assert not [b.get('name') for b in branches if ar.match(str(b.get('name') or ''))]
          assert not [b.get('name') for b in branches if dr.match(str(b.get('name') or ''))]
          assert not [(r.get('id'),r.get('head_branch')) for r in runs if r.get('event')=='push' and dr.match(str(r.get('head_branch') or ''))]
          prefix='ALLOCATED-SCIENCE-IDENTITY | MYSTIC-STATE-0070 | ordinal=24 | authHead='
          assert not [(c.get('id'),c.get('body')) for c in comments if prefix in str(c.get('body') or '')]
          PY
      - name: Prove future workflows are trigger-locked and review branch cannot reach science
        shell: bash
        run: |
          set -euo pipefail
          auth=.github/workflows/level-b-v2-densified58-fresh-validation-authorization-review-v1.yml
          exec=.github/workflows/level-b-v2-densified58-fresh-validation-execution-v1.yml
          grep -F "authorization/level-b-v2-densified58-fresh-validation-ordinal24-v1" "$auth"
          grep -F "dispatch/level-b-v2-densified58-fresh-validation-ordinal24-v1" "$exec"
          grep -F 'GITHUB_RUN_ATTEMPT' "$auth"
          grep -F 'GITHUB_RUN_ATTEMPT' "$exec"
          ! grep -F 'workflow_dispatch:' "$auth" "$exec"
          ! grep -F 'schedule:' "$auth" "$exec"
          test "$GITHUB_REF_NAME" != authorization/level-b-v2-densified58-fresh-validation-ordinal24-v1
          test "$GITHUB_REF_NAME" != dispatch/level-b-v2-densified58-fresh-validation-ordinal24-v1
      - uses: actions/upload-artifact@v4
        with:
          name: v0070-transport-review-${{ github.sha }}
          path: /tmp/v0070-transport-manifest.json
          if-no-files-found: error
          retention-days: 90
