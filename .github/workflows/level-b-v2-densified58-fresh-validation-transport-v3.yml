name: Level-B densified-58 fresh validation transport review v3

on:
  pull_request:
    branches: [main]
    paths:
      - 'review/level-b-v2-densified58-fresh-validation-transport-v3/transport-v3.json'
      - 'review/level-b-v2-densified58-fresh-validation-transport-v3/validate_transport_v3.py'
      - '.github/workflows/level-b-v2-densified58-fresh-validation-transport-v3.yml'
      - '.github/workflows/level-b-v2-densified58-fresh-validation-authorization-review-v3.yml'
      - '.github/workflows/level-b-v2-densified58-fresh-validation-execution-v3.yml'
  push:
    branches: ['review/level-b-v2-densified58-fresh-validation-transport-v3-correction']
    paths:
      - 'review/level-b-v2-densified58-fresh-validation-transport-v3/transport-v3.json'
      - 'review/level-b-v2-densified58-fresh-validation-transport-v3/validate_transport_v3.py'
      - '.github/workflows/level-b-v2-densified58-fresh-validation-transport-v3.yml'
      - '.github/workflows/level-b-v2-densified58-fresh-validation-authorization-review-v3.yml'
      - '.github/workflows/level-b-v2-densified58-fresh-validation-execution-v3.yml'

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

jobs:
  review-only-transport-v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.4'}
      - run: python -m pip install --disable-pip-version-check 'numpy==2.3.2'
      - name: Validate v3 bindings and inert review surface
        run: |
          python review/level-b-v2-densified58-fresh-validation-transport-v3/validate_transport_v3.py --require-review-inert
          python -m py_compile review/level-b-v2-densified58-fresh-validation-transport-v3/validate_transport_v3.py
      - name: Re-run frozen synthetic evaluator and manifest construction
        run: |
          python review/level-b-v2-densified58-fresh-validation-implementation-v1/test_v1.py -v
          python experiments/level-b-v2-densified58-fresh-validation-v1/build_manifest_v1.py --repo-root . --contract review/level-b-v2-densified58-fresh-validation-v1/contract-v1.json --output /tmp/v0070-v3-manifest.json
          python - <<'PY'
          import json
          m=json.load(open('/tmp/v0070-v3-manifest.json'));assert (m['geometryCount'],m['caseCount'],m['configuredPhotonHistories'])==(6,24,960_000_000);assert [x['seed'] for x in m['cases']]==list(range(2101000001,2101000025));assert m['closedUntilAuthorization']['scientificSolverExecutionAuthorized'] is False
          PY
      - name: Prove both prior authorization refusals and no allocation or dispatch
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/pulls/190 > /tmp/pr190.json
          gh api repos/${GITHUB_REPOSITORY}/pulls/192 > /tmp/pr192.json
          gh api repos/${GITHUB_REPOSITORY}/actions/runs/31838796101 > /tmp/runv1.json
          gh api repos/${GITHUB_REPOSITORY}/actions/runs/31839703495 > /tmp/runv2.json
          gh api --paginate --slurp repos/${GITHUB_REPOSITORY}/branches?per_page=100 > /tmp/branches.json
          gh api --paginate --slurp repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100 > /tmp/runs.json
          gh api --paginate --slurp repos/${GITHUB_REPOSITORY}/issues/60/comments?per_page=100 > /tmp/comments.json
          python - <<'PY'
          import json,re
          for p,sha in [(json.load(open('/tmp/pr190.json')),'1cefb761f0ec57059da0dbdfe2229d0fd0ab8e9b'),(json.load(open('/tmp/pr192.json')),'3d35ea42d89fdf6f1b013ed7cc5c3a1b10b99a7f')]:assert p['state']=='closed' and p['merged_at'] is None and p['head']['sha']==sha
          for r,rid in [(json.load(open('/tmp/runv1.json')),31838796101),(json.load(open('/tmp/runv2.json')),31839703495)]:assert r['id']==rid and r['run_attempt']==1 and r['conclusion']=='failure'
          def flat(p,key=None):
            out=[]
            for page in json.load(open(p)):out.extend(page.get(key,[]) if key else page)
            return out
          branches=flat('/tmp/branches.json');runs=flat('/tmp/runs.json','workflow_runs');comments=flat('/tmp/comments.json')
          assert any(b.get('name')=='authorization/level-b-v2-densified58-fresh-validation-ordinal24-v1' for b in branches)
          assert any(b.get('name')=='authorization/level-b-v2-densified58-fresh-validation-ordinal24-v2' for b in branches)
          assert not any(b.get('name')=='authorization/level-b-v2-densified58-fresh-validation-ordinal24-v3' for b in branches)
          dr=re.compile(r'^dispatch/level-b-v2-densified58-fresh-validation-ordinal24-v[0-9]+$');assert not [b for b in branches if dr.match(str(b.get('name') or ''))];assert not [r for r in runs if r.get('event')=='push' and dr.match(str(r.get('head_branch') or ''))]
          prefix='ALLOCATED-SCIENCE-IDENTITY | MYSTIC-STATE-0070 | ordinal=24 | authHead=';assert not [c for c in comments if prefix in str(c.get('body') or '')]
          PY
      - name: Prove PR head identity fix and trigger isolation
        shell: bash
        run: |
          set -euo pipefail
          auth=.github/workflows/level-b-v2-densified58-fresh-validation-authorization-review-v3.yml
          exec=.github/workflows/level-b-v2-densified58-fresh-validation-execution-v3.yml
          grep -F 'git rev-parse HEAD' "$auth"
          ! grep -F 'GITHUB_SHA' "$auth"
          grep -F 'authorization/level-b-v2-densified58-fresh-validation-ordinal24-v3' "$auth"
          grep -F 'dispatch/level-b-v2-densified58-fresh-validation-ordinal24-v3' "$exec"
          ! grep -F 'dispatch/level-b-v2-densified58-fresh-validation-ordinal24-v1' "$exec"
          ! grep -F 'dispatch/level-b-v2-densified58-fresh-validation-ordinal24-v2' "$exec"
          ! grep -F 'workflow_dispatch:' "$auth" "$exec"
      - uses: actions/upload-artifact@v4
        with:
          name: v0070-transport-v3-review-${{ github.sha }}
          path: /tmp/v0070-v3-manifest.json
          if-no-files-found: error
          retention-days: 90
