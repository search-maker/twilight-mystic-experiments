name: Level-B densified-58 fresh validation prereg v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'review/level-b-v2-densified58-fresh-validation-v1/**'
      - '.github/workflows/level-b-v2-densified58-fresh-validation-v1.yml'
  push:
    branches:
      - 'review/level-b-v2-densified58-fresh-validation-v1'
    paths:
      - 'review/level-b-v2-densified58-fresh-validation-v1/**'
      - '.github/workflows/level-b-v2-densified58-fresh-validation-v1.yml'

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  review-only-fresh-validation-prereg:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download bound densified-58 training artifact for geometry inputs only
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: search-maker/twilight-mystic-experiments
          run-id: 31827007009
          artifact-ids: 9229229366
          path: /tmp/densified58-v3
          merge-multiple: true
      - name: Validate geometry-only source, unchanged DoD, and closed boundaries
        run: |
          python review/level-b-v2-densified58-fresh-validation-v1/validate_v1.py \
            --dataset /tmp/densified58-v3/training-representation-dataset-v3-densified58.json
      - name: Prove ordinal24 and reserved seeds are fresh across repository refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --force --prune --no-tags
          mapfile -t refs < <(git for-each-ref refs/remotes/origin --format='%(refname)' | grep -v '/review/level-b-v2-densified58-fresh-validation-v1$' | grep -v '/HEAD$')
          test "${#refs[@]}" -gt 0
          regex='ordinal[-_ ]?24|scientificOrdinal[^0-9]{0,12}24|candidateScientificOrdinal[^0-9]{0,12}24|21010000(0[1-9]|1[0-9]|2[0-4])'
          if git log "${refs[@]}" --extended-regexp --regexp-ignore-case -G "$regex" --pretty='format:%H %D' --all-match -- . | grep -q .; then
            echo 'REFUSED: ordinal24 or reserved seed collision exists in repository history reachable from another ref'
            git log "${refs[@]}" --extended-regexp --regexp-ignore-case -G "$regex" --pretty='format:%H %D' --all-match -- . | head -40
            exit 1
          fi
      - name: Prove Issue 60 has no prior ordinal24 or reserved-seed allocation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, re, urllib.request
          repo='search-maker/twilight-mystic-experiments'
          token=os.environ['GITHUB_TOKEN']
          allowed_comments={5296722770,5296838210}
          seed_re=re.compile(r'21010000(?:0[1-9]|1[0-9]|2[0-4])')
          ordinal_re=re.compile(r'(?i)\bordinal[- _:`]*(?:24|`24`)\b')
          collisions=[]
          page=1
          while True:
              url=f'https://api.github.com/repos/{repo}/issues/60/comments?per_page=100&page={page}'
              req=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'mystic-state-0070-prereg'})
              with urllib.request.urlopen(req,timeout=60) as response:
                  rows=json.loads(response.read())
              if not rows: break
              for row in rows:
                  body=row.get('body') or ''
                  if row.get('id') in allowed_comments: continue
                  hits=seed_re.findall(body)
                  if hits or ordinal_re.search(body): collisions.append((row.get('id'),hits[:5],body[:180]))
              if len(rows)<100: break
              page+=1
          if collisions:
              raise SystemExit('REFUSED: prior Issue #60 ordinal24/seed collision: '+repr(collisions[:10]))
          print(json.dumps({'status':'PASS','allowedPreregCommentIds':sorted(allowed_comments),'priorIssueAllocationCollision':False},sort_keys=True))
          PY
      - name: Prove review cannot execute or open fresh protected validation
        shell: bash
        run: |
          set -euo pipefail
          review='review/level-b-v2-densified58-fresh-validation-v1'
          test ! -e "$review/authorization.json"
          test ! -e "$review/evaluation.json"
          test ! -e "$review/executor_v1.py"
          test ! -e "$review/adapter_v1.py"
          files="$(find "$review" -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')"
          test "$files" = 'contract-v1.json validate_v1.py '
