name: Level-B v2 training-only pre-fit freeze v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/level-b-v2-training-prefit-freeze-v1.yml'
      - 'review/level-b-v2-training-prefit-freeze-v1/**'

permissions:
  contents: read

jobs:
  review-only-prefit-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen v2 training-only protocol
        run: python review/level-b-v2-training-prefit-freeze-v1/validate_v1.py validate --protocol review/level-b-v2-training-prefit-freeze-v1/protocol-v1.json
      - name: Validate basis definitions without fitting
        run: python review/level-b-v2-training-prefit-freeze-v1/validate_v1.py selftest
      - name: Prove review PR cannot execute changed real fitting or validation
        shell: bash
        run: |
          set -euo pipefail
          test ! -e review/level-b-v2-training-prefit-freeze-v1/activation.json
          test ! -e review/level-b-v2-training-prefit-freeze-v1/train_v1.py
          ! grep -R -n -E 'uvspec|mc_basename|9209494627|stage2-evaluation' review/level-b-v2-training-prefit-freeze-v1 .github/workflows/level-b-v2-training-prefit-freeze-v1.yml
          python - <<'PY'
          import json
          p=json.load(open('review/level-b-v2-training-prefit-freeze-v1/protocol-v1.json'))
          assert p['futureTrainingExecution']['authorizedOnThisReviewPullRequest'] is False
          assert p['futureValidationBoundary']['protectedValidationAuthorized'] is False
          assert p['absoluteBoundaries']['newMysticSolverExecutionAuthorized'] is False
          assert p['roleIsolation']['protectedRecordCountRequired'] == 0
          PY
