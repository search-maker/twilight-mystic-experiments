name: Level-B v2 training-only pre-fit freeze v2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/level-b-v2-training-prefit-freeze-v2.yml'
      - 'review/level-b-v2-training-prefit-freeze-v2/**'

permissions:
  contents: read

jobs:
  review-only-prefit-freeze-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate second-generation frozen protocol
        run: python review/level-b-v2-training-prefit-freeze-v2/validate_v2.py validate --protocol review/level-b-v2-training-prefit-freeze-v2/protocol-v2.json
      - name: Review-only arithmetic self-test
        run: python review/level-b-v2-training-prefit-freeze-v2/validate_v2.py selftest --protocol review/level-b-v2-training-prefit-freeze-v2/protocol-v2.json
      - name: Prove no changed real fit or protected source is reachable from this PR
        shell: bash
        run: |
          set -euo pipefail
          test ! -e review/level-b-v2-training-prefit-freeze-v2/activation.json
          test ! -e review/level-b-v2-training-prefit-freeze-v2/train_v2.py
          ! grep -R -n -E '9209494627|stage2-evaluation|tier2-stage2-ordinal22|uvspec|mc_basename' review/level-b-v2-training-prefit-freeze-v2
