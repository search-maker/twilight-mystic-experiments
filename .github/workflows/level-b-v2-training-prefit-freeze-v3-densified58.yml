name: Level-B v2 densified-58 pre-fit freeze v3

on:
  pull_request:
    paths:
      - 'review/level-b-v2-training-prefit-freeze-v3-densified58/**'
      - '.github/workflows/level-b-v2-training-prefit-freeze-v3-densified58.yml'
  push:
    branches:
      - 'review/level-b-v2-training-prefit-freeze-v3-densified58'
    paths:
      - 'review/level-b-v2-training-prefit-freeze-v3-densified58/**'
      - '.github/workflows/level-b-v2-training-prefit-freeze-v3-densified58.yml'

permissions:
  contents: read

jobs:
  review-only-prefit-freeze-v3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate densified-58 freeze and immutable source bindings
        run: python review/level-b-v2-training-prefit-freeze-v3-densified58/validate_v3.py
      - name: Prove review cannot read ordinal23 spectra or fit
        shell: bash
        run: |
          set -euo pipefail
          review_dir='review/level-b-v2-training-prefit-freeze-v3-densified58'
          workflow='.github/workflows/level-b-v2-training-prefit-freeze-v3-densified58.yml'
          test ! -e "$review_dir/activation.json"
          test ! -e "$review_dir/model.json"
          forbidden=(
            "actions/download""-artifact"
            "gh run ""download"
            "actions/artifacts/""9224"
            "mc.rad.""spc"
            "mc.rad.std.""spc"
            "uv""spec"
            "lib""Radtran"
            "scientific_case_""executor"
            "fit_""candidate"
            "np.linalg.""solve"
            "numpy.linalg.""solve"
            "model.""fit("
            "requests.""get("
            "urllib.request"
            "cur""l "
            "w""get "
          )
          for needle in "${forbidden[@]}"; do
            ! grep -R -F -- "$needle" "$review_dir" "$workflow"
          done
