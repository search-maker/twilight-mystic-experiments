name: Level-B v3 fresh validation ordinal28 authorization review v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'review/level-b-v3-fresh-validation-ordinal28-transport-v1/authorization.json'

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

env:
  AUTH_PATH: review/level-b-v3-fresh-validation-ordinal28-transport-v1/authorization.json
  CONTRACT: review/level-b-v3-fresh-validation-implementation-v1/contract-v1.json
  AUTH_BRANCH: authorization/level-b-v3-fresh-validation-ordinal28-v1
  LOCK_BRANCH: allocation/level-b-v3-fresh-validation-ordinal28-v1
  DISPATCH_BRANCH: dispatch/level-b-v3-fresh-validation-ordinal28-v1

jobs:
  authorization-review-v1:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check numpy==2.3.2
      - name: Refuse retry, non-draft, non-one-file, wrong branch, moved main, or merge-ref identity
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test '${{ github.event.pull_request.draft }}' = true
          test "$GITHUB_HEAD_REF" = "$AUTH_BRANCH"
          test "$GITHUB_BASE_REF" = main
          HEAD_SHA="$(git rev-parse HEAD)"
          test "$HEAD_SHA" = '${{ github.event.pull_request.head.sha }}'
          test "$(git cat-file -p HEAD | grep -c '^parent ')" = 1
          PARENT="$(git rev-parse HEAD^)"
          test "$PARENT" = '${{ github.event.pull_request.base.sha }}'
          test "$PARENT" = "$(gh api repos/${GITHUB_REPOSITORY}/branches/main --jq .commit.sha)"
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = 1
          test "${CHANGED[0]}" = "$AUTH_PATH"
          test -f "$AUTH_PATH"
          if git cat-file -e "$PARENT:$AUTH_PATH" 2>/dev/null; then echo authorization-already-on-main; exit 1; fi
      - name: Download exact frozen base model and v3 materialization for independent parity proof
        uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: 31827007009, artifact-ids: 9229229366, path: '/tmp/v3-base', merge-multiple: true}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: 31927414786, artifact-ids: 9258264586, path: '/tmp/v3-materialized', merge-multiple: true}
      - name: Revalidate merged transport, v3 predictor parity, manifest, and source geometry freshness
        shell: bash
        run: |
          set -euo pipefail
          python review/level-b-v3-fresh-validation-ordinal28-transport-v1/validate_transport_v1.py
          python review/level-b-v3-fresh-validation-implementation-v1/fresh_validation_v1.py validate --contract "$CONTRACT" --repo-root . --materialized-dir /tmp/v3-materialized --base-model-dir /tmp/v3-base
          python experiments/level-b-v3-fresh-validation-v1/build_manifest_v1.py --repo-root . --output /tmp/o28-manifest.json
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --force --prune --no-tags
          python review/level-b-v3-fresh-validation-implementation-v1/freshness_v1.py --repo-root . --contract "$CONTRACT"
      - name: Audit exact authorization payload against parent-main blobs
        run: |
          python - <<'PY'
          import json,os,subprocess
          a=json.load(open(os.environ['AUTH_PATH']));parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          def b(p):return subprocess.check_output(['git','rev-parse',f'HEAD^:{p}'],text=True).strip()
          expected={
            'schemaVersion':1,'status':'AUTHORIZED_FRESH_PROTECTED_VALIDATION_ORDINAL28_ATTEMPT1','governance':'MYSTIC-STATE-0072','scientificOrdinal':28,
            'authorizationBranch':os.environ['AUTH_BRANCH'],'allocationLockBranch':os.environ['LOCK_BRANCH'],'dispatchBranch':os.environ['DISPATCH_BRANCH'],'executionKey':'level-b-v3:fresh-protected-validation:28','authorizationParentMainSha':parent,
            'transportGitBlobSha':b('review/level-b-v3-fresh-validation-ordinal28-transport-v1/transport-v1.json'),
            'contractGitBlobSha':b('review/level-b-v3-fresh-validation-implementation-v1/contract-v1.json'),
            'evaluatorGitBlobSha':b('review/level-b-v3-fresh-validation-implementation-v1/fresh_validation_v1.py'),
            'freshnessAuditGitBlobSha':b('review/level-b-v3-fresh-validation-implementation-v1/freshness_v1.py'),
            'manifestBuilderGitBlobSha':b('experiments/level-b-v3-fresh-validation-v1/build_manifest_v1.py'),
            'adapterGitBlobSha':b('experiments/level-b-v3-fresh-validation-v1/adapter_v1.py'),
            'executorGitBlobSha':b('experiments/level-b-v3-fresh-validation-v1/executor_v1.py'),
            'allocationGuardGitBlobSha':b('review/level-b-v3-fresh-validation-ordinal28-transport-v1/allocation_guard_v1.py'),
            'authorizationReviewWorkflowGitBlobSha':b('.github/workflows/level-b-v3-fresh-validation-ordinal28-authorization-review-v1.yml'),
            'executionWorkflowGitBlobSha':b('.github/workflows/level-b-v3-fresh-validation-ordinal28-execution-v1.yml'),
            'futureSourceGitBlobSha':'105b1560dbb1dacaba891a6828ca04a28d756e6b','modelCanonicalSha256':'c4902eb3c2ba67b12dc4ef2b9cefb67c5963a6abc104708a73b2aab5dd0163b9','modelArtifactCanonicalSha256':'d7f77416c782dd6226be0898f722fb880096638156517177cf1252b96b66f015','materializationArtifactId':9258264586,'baseTrainingArtifactId':9229229366,'representationPackageSha256':'2491ac91ed924f2ba69b37ea20f48d63f51d41146cd9fe50e0bd63bfb315a763','reservedSeeds':list(range(2110000001,2110000025)),
            'runAttemptRequired':1,'scientificExecutionAuthorized':True,'protectedValidationAuthorized':True,'protectedValuesMayBeRead':True,'automaticDispatch':False,'atomicAllocationLockRequired':True,'duplicateByteIdenticalMarkerCopiesAllowed':True,'distinctAllocationMarkerBodyAllowed':False,'artifactDownloadedManifestPath':'/tmp/v0072-o28-preflight/tmp/o28-manifest.json','githubRerunAllowed':False,'retryAllowed':False,'resumeAllowed':False,'solverExecutionPerformed':False,'modelRetuningAuthorized':False,'thresholdRelaxationAuthorized':False,'ordinal27MayInfluenceModelOrEvaluation':False,'productionPromotionAuthorized':False,'workerBLaneReactivated':False,'workerCLaneReactivated':False
          }
          assert a==expected,(a,expected)
          PY
      - name: Prove ordinal28 is unallocated and undispatched during authorization review
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          gh api --paginate --slurp 'repos/'${GITHUB_REPOSITORY}'/branches?per_page=100' > /tmp/branches.json
          gh api --paginate --slurp 'repos/'${GITHUB_REPOSITORY}'/actions/runs?per_page=100' > /tmp/runs.json
          gh api --paginate --slurp 'repos/'${GITHUB_REPOSITORY}'/issues/60/comments?per_page=100' > /tmp/comments.json
          HEAD_SHA="$(git rev-parse HEAD)"
          python - "$HEAD_SHA" <<'PY'
          import json,os,sys
          head=sys.argv[1]
          def flat(p,key=None):
            out=[]
            for page in json.load(open(p)):out.extend(page.get(key,[]) if key else page)
            return out
          branches=flat('/tmp/branches.json');runs=flat('/tmp/runs.json','workflow_runs');comments=flat('/tmp/comments.json')
          assert len([b for b in branches if b.get('name')==os.environ['AUTH_BRANCH'] and (b.get('commit') or {}).get('sha')==head])==1
          for prefix in ('allocation/level-b-v3-fresh-validation-ordinal28-','dispatch/level-b-v3-fresh-validation-ordinal28-'):
            assert not [b.get('name') for b in branches if str(b.get('name') or '').startswith(prefix)]
          assert not [r for r in runs if r.get('event')=='push' and str(r.get('head_branch') or '').startswith('dispatch/level-b-v3-fresh-validation-ordinal28-')]
          assert not [c for c in comments if 'ALLOCATED-SCIENCE-IDENTITY | MYSTIC-STATE-0072 | ordinal=28 | ' in str(c.get('body') or '')]
          PY
      - name: Prove review did not allocate or execute
        run: |
          python - <<'PY'
          import json,os
          a=json.load(open(os.environ['AUTH_PATH']))
          assert a['automaticDispatch'] is False and a['solverExecutionPerformed'] is False and a['atomicAllocationLockRequired'] is True
          assert a['modelRetuningAuthorized'] is False and a['thresholdRelaxationAuthorized'] is False and a['ordinal27MayInfluenceModelOrEvaluation'] is False
          PY
      - uses: actions/upload-artifact@v4
        with: {name: 'v0072-o28-authorization-review-${{ github.event.pull_request.head.sha }}', path: '/tmp/o28-manifest.json', if-no-files-found: error, retention-days: 90}
