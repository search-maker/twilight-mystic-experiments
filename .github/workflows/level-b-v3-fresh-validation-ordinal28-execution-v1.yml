name: Level-B v3 fresh protected validation ordinal28 v1
run-name: Level-B v3 fresh protected validation ordinal28 attempt1

on:
  push:
    branches: ['dispatch/level-b-v3-fresh-validation-ordinal28-v1']

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: level-b-v3-v0072-ordinal28-v1
  cancel-in-progress: false

env:
  AUTH_PATH: review/level-b-v3-fresh-validation-ordinal28-transport-v1/authorization.json
  CONTRACT: review/level-b-v3-fresh-validation-implementation-v1/contract-v1.json
  AUTH_BRANCH: authorization/level-b-v3-fresh-validation-ordinal28-v1
  LOCK_BRANCH: allocation/level-b-v3-fresh-validation-ordinal28-v1
  DISPATCH_BRANCH: dispatch/level-b-v3-fresh-validation-ordinal28-v1
  DOWNLOADED_MANIFEST: /tmp/v0072-o28-preflight/tmp/o28-manifest.json

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      dispatch_branch: ${{ steps.identity.outputs.dispatch_branch }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check numpy==2.3.2
      - id: identity
        name: Refuse retry, wrong dispatch, moved main, wrong commit shape, or authorization drift
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = "$DISPATCH_BRANCH"
          HEAD_SHA="$(git rev-parse HEAD)"
          test "$(git cat-file -p "$HEAD_SHA" | grep -c '^parent ')" = 1
          PARENT="$(git rev-parse "$HEAD_SHA^")"
          test "$PARENT" = "$(gh api repos/${GITHUB_REPOSITORY}/branches/main --jq .commit.sha)"
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA")
          test "${#CHANGED[@]}" = 1
          test "${CHANGED[0]}" = "$AUTH_PATH"
          test -f "$AUTH_PATH"
          if git cat-file -e "$PARENT:$AUTH_PATH" 2>/dev/null; then echo authorization-already-on-main; exit 1; fi
          python review/level-b-v3-fresh-validation-ordinal28-transport-v1/validate_transport_v1.py
          python - <<'PY'
          import json,os,subprocess
          a=json.load(open(os.environ['AUTH_PATH']));parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          def b(p):return subprocess.check_output(['git','rev-parse',f'HEAD^:{p}'],text=True).strip()
          expected={
            'schemaVersion':1,'status':'AUTHORIZED_FRESH_PROTECTED_VALIDATION_ORDINAL28_ATTEMPT1','governance':'MYSTIC-STATE-0072','scientificOrdinal':28,
            'authorizationBranch':os.environ['AUTH_BRANCH'],'allocationLockBranch':os.environ['LOCK_BRANCH'],'dispatchBranch':os.environ['DISPATCH_BRANCH'],'executionKey':'level-b-v3:fresh-protected-validation:28','authorizationParentMainSha':parent,
            'transportGitBlobSha':b('review/level-b-v3-fresh-validation-ordinal28-transport-v1/transport-v1.json'),'contractGitBlobSha':b('review/level-b-v3-fresh-validation-implementation-v1/contract-v1.json'),'evaluatorGitBlobSha':b('review/level-b-v3-fresh-validation-implementation-v1/fresh_validation_v1.py'),'freshnessAuditGitBlobSha':b('review/level-b-v3-fresh-validation-implementation-v1/freshness_v1.py'),'manifestBuilderGitBlobSha':b('experiments/level-b-v3-fresh-validation-v1/build_manifest_v1.py'),'adapterGitBlobSha':b('experiments/level-b-v3-fresh-validation-v1/adapter_v1.py'),'executorGitBlobSha':b('experiments/level-b-v3-fresh-validation-v1/executor_v1.py'),'allocationGuardGitBlobSha':b('review/level-b-v3-fresh-validation-ordinal28-transport-v1/allocation_guard_v1.py'),'authorizationReviewWorkflowGitBlobSha':b('.github/workflows/level-b-v3-fresh-validation-ordinal28-authorization-review-v1.yml'),'executionWorkflowGitBlobSha':b('.github/workflows/level-b-v3-fresh-validation-ordinal28-execution-v1.yml'),
            'futureSourceGitBlobSha':'105b1560dbb1dacaba891a6828ca04a28d756e6b','modelCanonicalSha256':'c4902eb3c2ba67b12dc4ef2b9cefb67c5963a6abc104708a73b2aab5dd0163b9','modelArtifactCanonicalSha256':'d7f77416c782dd6226be0898f722fb880096638156517177cf1252b96b66f015','materializationArtifactId':9258264586,'baseTrainingArtifactId':9229229366,'representationPackageSha256':'2491ac91ed924f2ba69b37ea20f48d63f51d41146cd9fe50e0bd63bfb315a763','reservedSeeds':list(range(2110000001,2110000025)),
            'runAttemptRequired':1,'scientificExecutionAuthorized':True,'protectedValidationAuthorized':True,'protectedValuesMayBeRead':True,'automaticDispatch':False,'atomicAllocationLockRequired':True,'duplicateByteIdenticalMarkerCopiesAllowed':True,'distinctAllocationMarkerBodyAllowed':False,'artifactDownloadedManifestPath':'/tmp/v0072-o28-preflight/tmp/o28-manifest.json','githubRerunAllowed':False,'retryAllowed':False,'resumeAllowed':False,'solverExecutionPerformed':False,'modelRetuningAuthorized':False,'thresholdRelaxationAuthorized':False,'ordinal27MayInfluenceModelOrEvaluation':False,'productionPromotionAuthorized':False,'workerBLaneReactivated':False,'workerCLaneReactivated':False
          }
          assert a==expected,(a,expected)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('dispatch_branch='+a['dispatchBranch']+'\n')
          PY
      - name: Resolve exact successful attempt-1 Draft ordinal28 authorization review
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY%%/*}"; HEAD_SHA="$(git rev-parse HEAD)"
          gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${OWNER}:${AUTH_BRANCH}&per_page=100" > /tmp/auth-prs.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/level-b-v3-fresh-validation-ordinal28-authorization-review-v1.yml/runs?event=pull_request&branch=${AUTH_BRANCH}&per_page=100" > /tmp/auth-runs.json
          python - "$HEAD_SHA" <<'PY'
          import json,os,sys
          sha=sys.argv[1];prs=json.load(open('/tmp/auth-prs.json'));runs=json.load(open('/tmp/auth-runs.json'))['workflow_runs']
          ps=[p for p in prs if p['head']['sha']==sha and p['head']['ref']==os.environ['AUTH_BRANCH'] and p.get('merged_at') is None and p.get('draft') is True]
          rs=[r for r in runs if r['head_sha']==sha and r['head_branch']==os.environ['AUTH_BRANCH'] and int(r.get('run_attempt') or 0)==1 and r.get('status')=='completed' and r.get('conclusion')=='success']
          assert len(ps)==1 and len(rs)==1,(len(ps),len(rs))
          PY
      - name: Re-prove geometry source freshness before opening any value
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --force --prune --no-tags
          python review/level-b-v3-fresh-validation-implementation-v1/freshness_v1.py --repo-root . --contract "$CONTRACT"
      - name: Require atomic allocation lock, one logical marker identity, sole dispatch, and no reused seed allocation
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          gh api --paginate --slurp 'repos/'${GITHUB_REPOSITORY}'/branches?per_page=100' > /tmp/branches.json
          gh api --paginate --slurp 'repos/'${GITHUB_REPOSITORY}'/actions/runs?per_page=100' > /tmp/runs.json
          gh api --paginate --slurp 'repos/'${GITHUB_REPOSITORY}'/issues/60/comments?per_page=100' > /tmp/comments.json
          HEAD_SHA="$(git rev-parse HEAD)"
          python review/level-b-v3-fresh-validation-ordinal28-transport-v1/allocation_guard_v1.py dispatch --branches /tmp/branches.json --runs /tmp/runs.json --comments /tmp/comments.json --auth-head "$HEAD_SHA" --current-run-id "$GITHUB_RUN_ID"
          python - <<'PY'
          import json
          pages=json.load(open('/tmp/comments.json'));rows=[]
          for page in pages: rows.extend(page)
          seed='2110000001-2110000024';alloc=[str(r.get('body') or '').strip() for r in rows if 'ALLOCATED-SCIENCE-IDENTITY | ' in str(r.get('body') or '') and seed in str(r.get('body') or '')]
          expected='ALLOCATED-SCIENCE-IDENTITY | MYSTIC-STATE-0072 | ordinal=28 | authHead=' + __import__('subprocess').check_output(['git','rev-parse','HEAD'],text=True).strip() + ' | seeds=' + seed
          assert set(alloc)=={expected},alloc
          PY
      - name: Build exact ordinal28 24-case payload after all guards
        run: |
          python experiments/level-b-v3-fresh-validation-v1/build_manifest_v1.py --repo-root . --output /tmp/o28-manifest.json
          python - <<'PY'
          import json
          m=json.load(open('/tmp/o28-manifest.json'));assert m['scientificOrdinalCandidate']==28 and len(m['cases'])==24 and m['configuredPhotonHistories']==960000000;assert [x['seed'] for x in m['cases']]==list(range(2110000001,2110000025));assert all(v is False for v in m['closedUntilAuthorization'].values())
          PY
      - id: matrix
        name: Emit exact ordinal28 24-case matrix
        run: |
          python - <<'PY'
          import json,os
          m=json.load(open('/tmp/o28-manifest.json'));rows=[{'caseId':c['caseId'],'timeoutSeconds':1800} for c in m['cases']];assert len(rows)==24
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('matrix='+json.dumps({'include':rows},separators=(',',':'))+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v0072-o28-preflight-${{ github.sha }}
          path: |
            review/level-b-v3-fresh-validation-ordinal28-transport-v1/authorization.json
            /tmp/o28-manifest.json
            /tmp/auth-prs.json
            /tmp/auth-runs.json
          if-no-files-found: error
          retention-days: 90

  cases:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}'}
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: v0072-fresh-validation-o28
          create-args: -c conda-forge python=3.12.4 rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true
      - uses: actions/download-artifact@v4
        with:
          name: v0072-o28-preflight-${{ github.sha }}
          path: /tmp/v0072-o28-preflight
      - name: Prove preserved tmp manifest path before runtime probe
        shell: bash
        run: |
          set -euo pipefail
          test -f "$DOWNLOADED_MANIFEST"
          test ! -f /tmp/v0072-o28-preflight/o28-manifest.json
          python - "$DOWNLOADED_MANIFEST" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1]));assert m['scientificOrdinalCandidate']==28;assert len(m['cases'])==24;assert [x['seed'] for x in m['cases']]==list(range(2110000001,2110000025))
          PY
      - name: Re-prove exact runtime identity without solver execution
        shell: micromamba-shell {0}
        run: python experiments/mystic-batch-v1/runtime_probe.py --uvspec "$(command -v uvspec)" --data-dir "$CONDA_PREFIX/share/libRadtran/data" --atmosphere "$CONDA_PREFIX/share/libRadtran/data/atmmod/afglus.dat" --runtime-lock experiments/mystic-batch-v1/runtime-lock.micromamba.json --output /tmp/v0072-runtime.json
      - name: Execute exactly one syntax check and one fresh protected MYSTIC invocation
        shell: micromamba-shell {0}
        run: python experiments/level-b-v3-fresh-validation-v1/executor_v1.py --manifest "$DOWNLOADED_MANIFEST" --runtime-report /tmp/v0072-runtime.json --adapter experiments/level-b-v3-fresh-validation-v1/adapter_v1.py --case-id '${{ matrix.caseId }}' --data-dir "$CONDA_PREFIX/share/libRadtran/data" --repository-root . --uvspec "$(command -v uvspec)" --output-root /tmp/v0072-o28-case-output --timeout-seconds '${{ matrix.timeoutSeconds }}' --expected-dispatch-branch '${{ needs.preflight.outputs.dispatch_branch }}' --allow-execution
      - name: Audit terminal attempt-1 case artifact
        shell: micromamba-shell {0}
        run: |
          python - <<'PY'
          import json,pathlib
          cid='${{ matrix.caseId }}';d=pathlib.Path('/tmp/v0072-o28-case-output')/cid;r=json.load(open(d/'case-result.json'))
          assert r['status']=='COMPLETED' and r['workflowRunAttempt']==1 and r['syntaxCheckCount']==1 and r['solverExecutionCount']==1
          assert r['retryPerformed'] is False and r['resumePerformed'] is False and r['githubRerun'] is False
          assert r['protectedHoldoutValueExposed'] is True and r['ordinal22ValueExposed'] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: level-b-v3-v0072-o28-case-${{ matrix.caseId }}
          path: /tmp/v0072-o28-case-output/${{ matrix.caseId }}
          if-no-files-found: warn
          retention-days: 90

  evaluate:
    needs: [preflight, cases]
    if: needs.preflight.result == 'success' && needs.cases.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check numpy==2.3.2
      - uses: actions/download-artifact@v4
        with: {pattern: 'level-b-v3-v0072-o28-case-*', path: '/tmp/v0072-o28-case-artifacts', merge-multiple: false}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: 31827007009, artifact-ids: 9229229366, path: '/tmp/v3-base', merge-multiple: true}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: 31771224298, artifact-ids: 9208203541, path: '/tmp/v3-representation', merge-multiple: true}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: 31927414786, artifact-ids: 9258264586, path: '/tmp/v3-materialized', merge-multiple: true}
      - name: Evaluate six fresh holdouts once against frozen v3 model and unchanged DoD
        run: python review/level-b-v3-fresh-validation-implementation-v1/fresh_validation_v1.py evaluate --contract "$CONTRACT" --cases-root /tmp/v0072-o28-case-artifacts --materialized-dir /tmp/v3-materialized --base-model-dir /tmp/v3-base --representation-dir /tmp/v3-representation --repo-root . --output /tmp/v0072-o28-evaluation.json
      - name: Independently audit result self-hash and immutable identity
        run: |
          python - <<'PY'
          import hashlib,json
          r=json.load(open('/tmp/v0072-o28-evaluation.json'));b=dict(r);h=b.pop('resultSha256')
          assert h==hashlib.sha256(json.dumps(b,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
          assert r['scientificOrdinal']==28 and r['modelSha256']=='c4902eb3c2ba67b12dc4ef2b9cefb67c5963a6abc104708a73b2aab5dd0163b9'
          assert r['ordinal27ValuesRead'] is False and r['ordinal27MayInfluenceResult'] is False and r['retuningPerformed'] is False
          assert r['protectedHoldoutValuesRead'] is True and r['caseCount']==24 and r['geometryCount']==6
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: level-b-v3-v0072-o28-evaluation-${{ github.sha }}
          path: /tmp/v0072-o28-evaluation.json
          if-no-files-found: error
          retention-days: 90
