name: Level-B v3 fresh validation ordinal28 transport review v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'review/level-b-v3-fresh-validation-ordinal28-transport-v1/transport-v1.json'
      - 'review/level-b-v3-fresh-validation-ordinal28-transport-v1/validate_transport_v1.py'
      - 'review/level-b-v3-fresh-validation-ordinal28-transport-v1/allocation_guard_v1.py'
      - 'review/level-b-v3-fresh-validation-ordinal28-transport-v1/synthetic_evaluate_v1.py'
      - '.github/workflows/level-b-v3-fresh-validation-ordinal28-transport-v1.yml'
      - '.github/workflows/level-b-v3-fresh-validation-ordinal28-authorization-review-v1.yml'
      - '.github/workflows/level-b-v3-fresh-validation-ordinal28-execution-v1.yml'
  push:
    branches: ['review/level-b-v3-fresh-validation-ordinal28-transport-v1']
    paths:
      - 'review/level-b-v3-fresh-validation-ordinal28-transport-v1/transport-v1.json'
      - 'review/level-b-v3-fresh-validation-ordinal28-transport-v1/validate_transport_v1.py'
      - 'review/level-b-v3-fresh-validation-ordinal28-transport-v1/allocation_guard_v1.py'
      - 'review/level-b-v3-fresh-validation-ordinal28-transport-v1/synthetic_evaluate_v1.py'
      - '.github/workflows/level-b-v3-fresh-validation-ordinal28-transport-v1.yml'
      - '.github/workflows/level-b-v3-fresh-validation-ordinal28-authorization-review-v1.yml'
      - '.github/workflows/level-b-v3-fresh-validation-ordinal28-execution-v1.yml'

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

jobs:
  review-only-ordinal28-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check numpy==2.3.2
      - name: Validate frozen transport bindings and inert review surface
        run: |
          python review/level-b-v3-fresh-validation-ordinal28-transport-v1/validate_transport_v1.py --require-review-inert
          python -m py_compile \
            review/level-b-v3-fresh-validation-ordinal28-transport-v1/validate_transport_v1.py \
            review/level-b-v3-fresh-validation-ordinal28-transport-v1/allocation_guard_v1.py \
            review/level-b-v3-fresh-validation-ordinal28-transport-v1/synthetic_evaluate_v1.py
      - name: Download exact frozen representation artifact
        uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: 31771224298, artifact-ids: 9208203541, path: '/tmp/v3-representation', merge-multiple: true}
      - name: Download exact frozen densified58 training/model artifact
        uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: 31827007009, artifact-ids: 9229229366, path: '/tmp/v3-base', merge-multiple: true}
      - name: Download exact frozen v3 materialized model artifact
        uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: 31927414786, artifact-ids: 9258264586, path: '/tmp/v3-materialized', merge-multiple: true}
      - name: Download one immutable ordinal20 training serialization anchor
        uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: 31763376962, artifact-ids: 9205467288, path: '/tmp/grid-anchor', merge-multiple: true}
      - name: Re-prove v3 predictor parity and run synthetic end-to-end evaluator
        shell: bash
        run: |
          set -euo pipefail
          python review/level-b-v3-fresh-validation-implementation-v1/fresh_validation_v1.py validate \
            --contract review/level-b-v3-fresh-validation-implementation-v1/contract-v1.json \
            --repo-root . --materialized-dir /tmp/v3-materialized --base-model-dir /tmp/v3-base
          mapfile -t GRIDS < <(find /tmp/grid-anchor -type f -name 'mc.rad.spc' -print)
          test "${#GRIDS[@]}" = 1
          python review/level-b-v3-fresh-validation-ordinal28-transport-v1/synthetic_evaluate_v1.py \
            --materialized-dir /tmp/v3-materialized --base-model-dir /tmp/v3-base \
            --representation-dir /tmp/v3-representation --repo-root . --grid-source "${GRIDS[0]}"
      - name: Build exact ordinal28 manifest and validate accounting
        run: |
          python experiments/level-b-v3-fresh-validation-v1/build_manifest_v1.py --repo-root . --output /tmp/o28-transport-manifest.json
          python - <<'PY'
          import json
          m=json.load(open('/tmp/o28-transport-manifest.json'))
          assert (m['scientificOrdinalCandidate'],m['geometryCount'],m['caseCount'],m['configuredPhotonHistories'])==(28,6,24,960000000)
          assert [x['seed'] for x in m['cases']]==list(range(2110000001,2110000025))
          assert all(v is False for v in m['closedUntilAuthorization'].values())
          PY
      - name: Re-prove repository-wide source geometry freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --force --prune --no-tags
          python review/level-b-v3-fresh-validation-implementation-v1/freshness_v1.py \
            --repo-root . --contract review/level-b-v3-fresh-validation-implementation-v1/contract-v1.json
      - name: Prove no ordinal28 authorization, allocation, marker, dispatch, or prior seed allocation exists
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          gh api --paginate --slurp 'repos/'${GITHUB_REPOSITORY}'/branches?per_page=100' > /tmp/branches.json
          gh api --paginate --slurp 'repos/'${GITHUB_REPOSITORY}'/actions/runs?per_page=100' > /tmp/runs.json
          gh api --paginate --slurp 'repos/'${GITHUB_REPOSITORY}'/issues/60/comments?per_page=100' > /tmp/comments.json
          python - <<'PY'
          import json
          def flat(p,key=None):
            out=[]
            for page in json.load(open(p)):out.extend(page.get(key,[]) if key else page)
            return out
          branches=flat('/tmp/branches.json');runs=flat('/tmp/runs.json','workflow_runs');comments=flat('/tmp/comments.json')
          prefixes=('authorization/level-b-v3-fresh-validation-ordinal28-','allocation/level-b-v3-fresh-validation-ordinal28-','dispatch/level-b-v3-fresh-validation-ordinal28-')
          assert not [b.get('name') for b in branches if any(str(b.get('name') or '').startswith(p) for p in prefixes)]
          assert not [r for r in runs if r.get('event')=='push' and str(r.get('head_branch') or '').startswith('dispatch/level-b-v3-fresh-validation-ordinal28-')]
          alloc=[str(c.get('body') or '') for c in comments if 'ALLOCATED-SCIENCE-IDENTITY | ' in str(c.get('body') or '')]
          assert not [x for x in alloc if 'ordinal=28 | ' in x]
          assert not [x for x in alloc if 'seeds=2110000001-2110000024' in x]
          assert any('DIRECTIVE | MYSTIC-STATE-0072 | ' in str(c.get('body') or '') for c in comments)
          PY
      - name: Prove future workflows are exact-trigger locked and review cannot reach science
        shell: bash
        run: |
          set -euo pipefail
          auth=.github/workflows/level-b-v3-fresh-validation-ordinal28-authorization-review-v1.yml
          exec=.github/workflows/level-b-v3-fresh-validation-ordinal28-execution-v1.yml
          grep -F 'authorization/level-b-v3-fresh-validation-ordinal28-v1' "$auth"
          grep -F 'dispatch/level-b-v3-fresh-validation-ordinal28-v1' "$exec"
          grep -F 'allocation_guard_v1.py dispatch' "$exec"
          grep -F 'freshness_v1.py' "$auth" "$exec"
          grep -F 'DOWNLOADED_MANIFEST: /tmp/v0072-o28-preflight/tmp/o28-manifest.json' "$exec"
          grep -F 'test -f "$DOWNLOADED_MANIFEST"' "$exec"
          grep -F 'test ! -f /tmp/v0072-o28-preflight/o28-manifest.json' "$exec"
          grep -F -- '--manifest "$DOWNLOADED_MANIFEST"' "$exec"
          grep -F 'github.event.pull_request.head.sha' "$auth"
          ! grep -F 'GITHUB_SHA' "$auth"
          ! grep -F 'workflow_dispatch:' "$auth" "$exec"
          ! grep -F 'schedule:' "$auth" "$exec"
          test ! -e review/level-b-v3-fresh-validation-ordinal28-transport-v1/authorization.json
          test "$GITHUB_REF_NAME" != authorization/level-b-v3-fresh-validation-ordinal28-v1
          test "$GITHUB_REF_NAME" != allocation/level-b-v3-fresh-validation-ordinal28-v1
          test "$GITHUB_REF_NAME" != dispatch/level-b-v3-fresh-validation-ordinal28-v1
      - uses: actions/upload-artifact@v4
        with:
          name: v0072-o28-transport-review-${{ github.sha }}
          path: /tmp/o28-transport-manifest.json
          if-no-files-found: error
          retention-days: 90
