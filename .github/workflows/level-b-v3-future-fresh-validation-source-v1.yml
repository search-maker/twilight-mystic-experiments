name: Level-B v3 future fresh validation source prereg v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'review/level-b-v3-future-fresh-validation-source-v1/**'
      - '.github/workflows/level-b-v3-future-fresh-validation-source-v1.yml'

permissions:
  contents: read
  actions: read

jobs:
  review-only-future-fresh-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact immutable 58-geometry training artifact for geometry inputs only
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: search-maker/twilight-mystic-experiments
          run-id: 31827007009
          artifact-ids: 9229229366
          path: /tmp/lbv3-future-source
          merge-multiple: true
      - name: Validate training-only structurally fresh source and closed activation boundaries
        run: |
          python review/level-b-v3-future-fresh-validation-source-v1/validate_v1.py \
            --dataset /tmp/lbv3-future-source/training-representation-dataset-v3-densified58.json
      - name: Prove package contains no ordinal27 protected identities or execution surface
        shell: bash
        run: |
          set -euo pipefail
          review='review/level-b-v3-future-fresh-validation-source-v1'
          files="$(find "$review" -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')"
          test "$files" = 'contract-v1.json validate_v1.py '
          test ! -e "$review/authorization.json"
          test ! -e "$review/evaluation.json"
          test ! -e "$review/executor_v1.py"
          test ! -e "$review/adapter_v1.py"
          if grep -R -n -E 'v0070-holdout-|31848052825|31849706647|31850828379|31851872896|9237788838|210100007[3-9]|210100008[0-9]|210100009[0-6]' "$review"; then
            echo 'REFUSED: ordinal27 protected identity leaked into future-source package'
            exit 1
          fi
          if grep -R -n -E 'subprocess.*uvspec|(^|[^[:alnum:]_])uvspec([^[:alnum:]_]|$)|libradtran|MYSTIC execution' "$review"; then
            echo 'REFUSED: solver/execution surface found in source-only package'
            exit 1
          fi
