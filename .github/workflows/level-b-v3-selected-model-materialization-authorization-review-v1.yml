name: Level-B v3 selected-model materialization authorization review v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'review/level-b-v3-training-only-selected-model-materialization-recovery-v1/authorization-v1.json'

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

env:
  AUTH_PATH: review/level-b-v3-training-only-selected-model-materialization-recovery-v1/authorization-v1.json
  AUTH_BRANCH: authorization/level-b-v3-training-only-selected-model-materialization-recovery-v1
  MATERIALIZATION_BRANCH: materialization/level-b-v3-training-only-selected-model-recovery-v1
  SOURCE_FIT_RUN: '31924262989'
  SOURCE_FIT_JOB: '95109323854'
  SOURCE_TRAINING_RUN: '31827007009'
  SOURCE_TRAINING_ARTIFACT: '9229229366'

jobs:
  authorization-review-v1:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.4'}
      - name: Refuse retry, non-Draft, moved main, wrong branch, or non-one-file authorization
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test '${{ github.event.pull_request.draft }}' = true
          test "$GITHUB_HEAD_REF" = "$AUTH_BRANCH"
          test "$GITHUB_BASE_REF" = main
          HEAD_SHA="$(git rev-parse HEAD)"; test "$HEAD_SHA" = '${{ github.event.pull_request.head.sha }}'
          test "$(git cat-file -p HEAD | grep -c '^parent ')" = 1
          PARENT="$(git rev-parse HEAD^)"
          test "$PARENT" = '${{ github.event.pull_request.base.sha }}'
          test "$PARENT" = "$(gh api repos/${GITHUB_REPOSITORY}/branches/main --jq .commit.sha)"
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = 1; test "${CHANGED[0]}" = "$AUTH_PATH"; test -f "$AUTH_PATH"
          if git cat-file -e "$PARENT:$AUTH_PATH" 2>/dev/null; then echo authorization-already-on-main; exit 1; fi
      - name: Validate recovery package and exact authorization payload against parent-main blobs
        run: |
          python review/level-b-v3-training-only-selected-model-materialization-recovery-v1/validate_recovery_v1.py
          python - <<'PY'
          import json,os,subprocess
          a=json.load(open(os.environ['AUTH_PATH'])); parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          def b(path): return subprocess.check_output(['git','rev-parse',f'HEAD^:{path}'],text=True).strip()
          expected={
            'schemaVersion':1,
            'status':'AUTHORIZED_LEVEL_B_V3_SELECTED_MODEL_MATERIALIZATION_RECOVERY_V1_ATTEMPT1',
            'governance':'MYSTIC-STATE-0071',
            'authorizationBranch':os.environ['AUTH_BRANCH'],
            'materializationBranch':os.environ['MATERIALIZATION_BRANCH'],
            'executionKey':'level-b-v3:selected-model-materialization-recovery:v1',
            'authorizationParentMainSha':parent,
            'recoveryContractGitBlobSha':b('review/level-b-v3-training-only-selected-model-materialization-recovery-v1/recovery-v1.json'),
            'recoveryValidatorGitBlobSha':b('review/level-b-v3-training-only-selected-model-materialization-recovery-v1/validate_recovery_v1.py'),
            'materializerGitBlobSha':b('review/level-b-v3-training-only-selected-model-materialization-recovery-v1/materialize_selected_v1.py'),
            'materializerSourceSha256':'f7cb19d2bdbb66977d5061d5ec23c8cfde4263ba95f63cc9550af90d7c7d0dfc',
            'independentAuditorGitBlobSha':b('review/level-b-v3-training-only-selected-model-materialization-recovery-v1/audit_materialization_v1.py'),
            'independentAuditorSourceSha256':'2b32f49de789e85653a07f71b5018d3270dd53878740fccb9b50ec727ce926f8',
            'reviewWorkflowGitBlobSha':b('.github/workflows/level-b-v3-selected-model-materialization-recovery-v1-review.yml'),
            'authorizationReviewWorkflowGitBlobSha':b('.github/workflows/level-b-v3-selected-model-materialization-authorization-review-v1.yml'),
            'materializationWorkflowGitBlobSha':b('.github/workflows/level-b-v3-selected-model-materialization-recovery-v1.yml'),
            'prefitV2GitBlobSha':b('review/level-b-v3-training-only-prefit-freeze-v2/protocol-v2.json'),
            'prefitV2CanonicalSha256':'8e3928634c3d297974c07533bed3bbfa24783f14ed55391fd318f817282d9a8e',
            'implementationDescriptorGitBlobSha':b('review/level-b-v3-training-only-implementation-v1/implementation-v1.json'),
            'implementationDescriptorCanonicalSha256':'2536ec084597b9e6d9e2dabfbf7902de28c91d02b510415dc4f926e9595be104',
            'sourceFitRunId':31924262989,
            'sourceFitRunAttempt':1,
            'sourceFitJobId':95109323854,
            'sourceFitAuthorizationHeadSha':'bd568ada4e05dea6bcf68223778a5d4f6a0fce56',
            'sourceAuditedSelectionStatus':'FREEZE_CHANGED_MODEL_TRAINING_ONLY_PENDING_SEPARATE_FRESH_VALIDATION_GOVERNANCE',
            'sourceAuditedEligibleCandidateCount':145,
            'selectedCandidateId':'resid-V1_IDW_COS_COORDINATES-r1e-05-k6-p1-a1',
            'selectedPrimaryRidge':1e-5,
            'selectedResidualCoordinateSystem':'V1_IDW_COS_COORDINATES',
            'selectedResidualNeighbors':6,
            'selectedResidualPower':1.0,
            'selectedResidualShrinkage':1.0,
            'sourceTrainingRunId':31827007009,
            'sourceTrainingArtifactId':9229229366,
            'sourceTrainingArtifactDigest':'sha256:f4c8c68a622f7c6bdc1b9177ad31d22f673becb1f286436d54b876ceece3668a',
            'datasetMember':'training-representation-dataset-v3-densified58.json',
            'datasetMemberByteSha256':'1cf31f1a80ce4ae1f39b9e750616093f6cfa927d10e258f81fe9fc0e58f0ea69',
            'datasetCanonicalSha256':'58c977acf84b6ce17717765c2052f7f9fd64e2965e5bf447eba5cc4accb30435',
            'trainingGeometryCount':58,
            'selectedModelMaterializationAuthorized':True,
            'candidateSearchAuthorized':False,
            'candidateEnumerationAuthorized':False,
            'crossValidationAuthorized':False,
            'rankingAuthorized':False,
            'selectionChangeAuthorized':False,
            'protectedValidationAuthorized':False,
            'protectedValuesMayBeRead':False,
            'ordinal27MayBeRead':False,
            'newMysticSolverExecutionAuthorized':False,
            'automaticDispatch':False,
            'runAttemptRequired':1,
            'githubRerunAllowed':False,
            'retryAllowed':False,
            'resumeAllowed':False,
            'productionPromotionAuthorized':False,
            'workerBLaneReactivated':False,
            'workerCLaneReactivated':False,
          }
          assert a==expected,(a,expected)
          PY
      - name: Re-prove original audited changed-winner verdict and provenance-only failure
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_FIT_RUN}/jobs" > /tmp/source-jobs.json
          gh api --allow-escape-sequences "repos/${GITHUB_REPOSITORY}/actions/jobs/${SOURCE_FIT_JOB}/logs" > /tmp/source-fit.log
          python - <<'PY'
          import json,os
          jobs=json.load(open('/tmp/source-jobs.json'))['jobs']; j=[x for x in jobs if int(x['id'])==int(os.environ['SOURCE_FIT_JOB'])][0]
          steps={s['name']:s['conclusion'] for s in j['steps']}
          assert steps['Execute frozen 145-candidate training-only fit once']=='success'
          assert steps['Independently audit candidate gates, ranking, shape invariance, and result bindings']=='success'
          assert steps['Bind immutable workflow/source provenance with zero protected/MYSTIC access']=='failure'
          PY
          grep -F '{"eligibleCandidateCount": 145, "selectedCandidateId": "resid-V1_IDW_COS_COORDINATES-r1e-05-k6-p1-a1", "selectionStatus": "FREEZE_CHANGED_MODEL_TRAINING_ONLY_PENDING_SEPARATE_FRESH_VALIDATION_GOVERNANCE", "status": "PASS"}' /tmp/source-fit.log
          grep -F "fatal: ambiguous argument 'HEAD^': unknown revision or path not in the working tree." /tmp/source-fit.log
      - name: Re-prove exact immutable training source metadata
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_TRAINING_RUN}" > /tmp/training-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_TRAINING_ARTIFACT}" > /tmp/training-artifact.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/training-run.json')); a=json.load(open('/tmp/training-artifact.json'))
          assert (r['run_attempt'],r['head_sha'],r['status'],r['conclusion'])==(1,'6ffae96ad6054d380f26e6d3a2d17917ba01900f','completed','success')
          assert (a['id'],a['name'],a.get('digest'),a.get('expired'))==(9229229366,'level-b-v2-training-fit-v3-densified58-6ffae96ad6054d380f26e6d3a2d17917ba01900f','sha256:f4c8c68a622f7c6bdc1b9177ad31d22f673becb1f286436d54b876ceece3668a',False)
          PY
      - name: Download only exact frozen training artifact for source identity review
        uses: actions/download-artifact@v4
        with:
          github-token: '${{ github.token }}'
          repository: '${{ github.repository }}'
          run-id: 31827007009
          artifact-ids: 9229229366
          path: /tmp/lbv3-training-source
          merge-multiple: true
      - name: Verify dataset bytes, self-hash, roles and zero protected records without materializing
        run: |
          python - <<'PY'
          import hashlib,json
          p='/tmp/lbv3-training-source/training-representation-dataset-v3-densified58.json'; raw=open(p,'rb').read()
          assert hashlib.sha256(raw).hexdigest()=='1cf31f1a80ce4ae1f39b9e750616093f6cfa927d10e258f81fe9fc0e58f0ea69'
          d=json.loads(raw); body=dict(d); h=body.pop('datasetSha256')
          assert h=='58c977acf84b6ce17717765c2052f7f9fd64e2965e5bf447eba5cc4accb30435'
          assert hashlib.sha256(json.dumps(body,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()==h
          protocol=json.load(open('review/level-b-v3-training-only-prefit-freeze-v2/protocol-v2.json'))
          assert d['geometryCount']==58 and d['protectedHoldoutRecordCount']==0 and len(d['records'])==58
          assert [str(x['geometryId']) for x in d['records']]==protocol['roleIsolation']['trainingGeometryIds']
          PY
      - name: Prove no materialization branch, run, or marker exists yet
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/branches?per_page=100" > /tmp/branches.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" > /tmp/runs.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/60/comments?per_page=100" > /tmp/comments.json
          python - <<'PY'
          import json,os
          def flat(path,key=None):
              out=[]
              for page in json.load(open(path)): out.extend(page.get(key,[]) if key else page)
              return out
          branches=flat('/tmp/branches.json'); runs=flat('/tmp/runs.json','workflow_runs'); comments=flat('/tmp/comments.json')
          assert not [b for b in branches if b.get('name')==os.environ['MATERIALIZATION_BRANCH']]
          assert not [r for r in runs if r.get('event')=='push' and r.get('head_branch')==os.environ['MATERIALIZATION_BRANCH']]
          prefix='AUTHORIZED-LEVEL-B-V3-SELECTED-MODEL-MATERIALIZATION-RECOVERY | MYSTIC-STATE-0071 | '
          assert not [c for c in comments if prefix in str(c.get('body') or '')]
          PY
      - name: Prove authorization review cannot materialize or reselect
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/level-b-v3-selected-model-materialization-authorization-review-v1.yml'
          forbidden=(" materialize --" "candidate_specs" "folds58" "evaluate_all" "select_candidate" "v0070-""holdout" "lib""Radtran" "mc.rad.""spc")
          for needle in "${forbidden[@]}"; do ! grep -F -- "$needle" "$workflow"; done
