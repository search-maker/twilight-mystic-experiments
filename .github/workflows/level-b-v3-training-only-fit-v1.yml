name: Level-B v3 training-only fit v1 attempt1

on:
  push:
    branches:
      - fit/level-b-v3-training-only-v1

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

env:
  AUTH_PATH: review/level-b-v3-training-only-fit-activation-v1/authorization-v1.json
  CONTRACT: review/level-b-v3-training-only-fit-activation-v1/activation-contract-v1.json
  AUDITOR: review/level-b-v3-training-only-fit-activation-v1/audit_fit_result_v1.py
  AUTH_BRANCH: authorization/level-b-v3-training-only-fit-v1
  FIT_BRANCH: fit/level-b-v3-training-only-v1
  SOURCE_RUN: '31827007009'
  SOURCE_ARTIFACT: '9229229366'
  DATASET_MEMBER: training-representation-dataset-v3-densified58.json

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - name: Refuse retry, wrong branch, moved main, wrong commit shape, or authorization drift
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = "$FIT_BRANCH"
          HEAD_SHA="$(git rev-parse HEAD)"; test "$HEAD_SHA" = "$GITHUB_SHA"
          test "$(git cat-file -p "$HEAD_SHA" | grep -c '^parent ')" = 1
          PARENT="$(git rev-parse "$HEAD_SHA^")"
          test "$PARENT" = "$(gh api repos/${GITHUB_REPOSITORY}/branches/main --jq .commit.sha)"
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA")
          test "${#CHANGED[@]}" = 1; test "${CHANGED[0]}" = "$AUTH_PATH"; test -f "$AUTH_PATH"
          if git cat-file -e "$PARENT:$AUTH_PATH" 2>/dev/null; then echo authorization-already-on-main; exit 1; fi
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.4'}
      - name: Validate exact activation and authorization payload before training artifact access
        run: |
          python review/level-b-v3-training-only-fit-activation-v1/validate_activation_v1.py
          python - <<'PY'
          import json,os,subprocess
          a=json.load(open(os.environ['AUTH_PATH'])); parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          def b(path): return subprocess.check_output(['git','rev-parse',f'HEAD^:{path}'],text=True).strip()
          expected={
            'schemaVersion':1,'status':'AUTHORIZED_LEVEL_B_V3_TRAINING_ONLY_FIT_V1_ATTEMPT1','governance':'MYSTIC-STATE-0071',
            'authorizationBranch':os.environ['AUTH_BRANCH'],'fitBranch':os.environ['FIT_BRANCH'],'executionKey':'level-b-v3:training-only-fit:v1','authorizationParentMainSha':parent,
            'activationContractGitBlobSha':b('review/level-b-v3-training-only-fit-activation-v1/activation-contract-v1.json'),
            'activationValidatorGitBlobSha':b('review/level-b-v3-training-only-fit-activation-v1/validate_activation_v1.py'),
            'resultAuditGitBlobSha':b('review/level-b-v3-training-only-fit-activation-v1/audit_fit_result_v1.py'),
            'activationReviewWorkflowGitBlobSha':b('.github/workflows/level-b-v3-training-only-fit-activation-v1-review.yml'),
            'authorizationReviewWorkflowGitBlobSha':b('.github/workflows/level-b-v3-training-only-fit-authorization-review-v1.yml'),
            'fitWorkflowGitBlobSha':b('.github/workflows/level-b-v3-training-only-fit-v1.yml'),
            'prefitV2GitBlobSha':b('review/level-b-v3-training-only-prefit-freeze-v2/protocol-v2.json'),'prefitV2CanonicalSha256':'8e3928634c3d297974c07533bed3bbfa24783f14ed55391fd318f817282d9a8e',
            'implementationDescriptorGitBlobSha':b('review/level-b-v3-training-only-implementation-v1/implementation-v1.json'),'implementationDescriptorCanonicalSha256':'2536ec084597b9e6d9e2dabfbf7902de28c91d02b510415dc4f926e9595be104',
            'engineGitBlobSha':b('review/level-b-v3-training-only-implementation-v1/engine_v1.py'),'engineSourceSha256':'0c8037dad360cabb8dc2e02254d3f4d48b4f99e036763756899d208796e2a1e0',
            'trainerGitBlobSha':b('review/level-b-v3-training-only-implementation-v1/train_v1.py'),'trainerSourceSha256':'58911cfb1f46a5c3d8597381354f914e8d7312f41a3ece86cf0c1dafc265538b',
            'sourceTrainingRunId':31827007009,'sourceTrainingRunAttempt':1,'sourceTrainingHeadSha':'6ffae96ad6054d380f26e6d3a2d17917ba01900f',
            'sourceTrainingArtifactId':9229229366,'sourceTrainingArtifactName':'level-b-v2-training-fit-v3-densified58-6ffae96ad6054d380f26e6d3a2d17917ba01900f','sourceTrainingArtifactDigest':'sha256:f4c8c68a622f7c6bdc1b9177ad31d22f673becb1f286436d54b876ceece3668a',
            'datasetMember':'training-representation-dataset-v3-densified58.json','datasetMemberByteSha256':'1cf31f1a80ce4ae1f39b9e750616093f6cfa927d10e258f81fe9fc0e58f0ea69','datasetCanonicalSha256':'58c977acf84b6ce17717765c2052f7f9fd64e2965e5bf447eba5cc4accb30435',
            'trainingGeometryCount':58,'candidateCount':145,'cvFoldCount':73,'trainingOnlyFitAuthorized':True,'trainingArtifactMayBeRead':True,
            'protectedValidationAuthorized':False,'protectedValuesMayBeRead':False,'ordinal27MayBeRead':False,'newMysticSolverExecutionAuthorized':False,'newTrainingDataAuthorized':False,'thresholdChangeAuthorized':False,'supportChangeAuthorized':False,
            'automaticDispatch':False,'runAttemptRequired':1,'githubRerunAllowed':False,'retryAllowed':False,'resumeAllowed':False,'productionPromotionAuthorized':False,'workerBLaneReactivated':False,'workerCLaneReactivated':False,
          }
          assert a==expected,(a,expected)
          PY
      - name: Resolve exact successful attempt-1 Draft authorization review
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY%%/*}"; HEAD_SHA="$(git rev-parse HEAD)"
          gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${OWNER}:${AUTH_BRANCH}&per_page=100" > /tmp/auth-prs.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/level-b-v3-training-only-fit-authorization-review-v1.yml/runs?event=pull_request&branch=${AUTH_BRANCH}&per_page=100" > /tmp/auth-runs.json
          python - "$HEAD_SHA" <<'PY'
          import json,os,sys
          sha=sys.argv[1]; prs=json.load(open('/tmp/auth-prs.json')); runs=json.load(open('/tmp/auth-runs.json'))['workflow_runs']
          ps=[p for p in prs if p['head']['sha']==sha and p['head']['ref']==os.environ['AUTH_BRANCH'] and p.get('merged_at') is None and p.get('draft') is True]
          rs=[r for r in runs if r['head_sha']==sha and r['head_branch']==os.environ['AUTH_BRANCH'] and int(r.get('run_attempt') or 0)==1 and r.get('status')=='completed' and r.get('conclusion')=='success']
          assert len(ps)==1 and len(rs)==1,(len(ps),len(rs))
          PY
      - name: Require exact authorization marker and sole fit dispatch identity
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/branches?per_page=100" > /tmp/branches.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" > /tmp/runs.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/60/comments?per_page=100" > /tmp/comments.json
          python - "$GITHUB_SHA" "$GITHUB_RUN_ID" <<'PY'
          import json,os,sys
          head=sys.argv[1]; run_id=int(sys.argv[2]); marker=f'AUTHORIZED-LEVEL-B-V3-TRAINING-ONLY-FIT | MYSTIC-STATE-0071 | authHead={head} | sourceRun=31827007009 | sourceArtifact=9229229366 | candidates=145'
          def flat(path,key=None):
              out=[]
              for page in json.load(open(path)): out.extend(page.get(key,[]) if key else page)
              return out
          branches=flat('/tmp/branches.json'); runs=flat('/tmp/runs.json','workflow_runs'); comments=flat('/tmp/comments.json')
          fb=[b for b in branches if b.get('name')==os.environ['FIT_BRANCH']]; assert len(fb)==1 and fb[0]['commit']['sha']==head
          markers=[c for c in comments if str(c.get('body') or '')==marker]; assert len(markers)==1,len(markers)
          prefix='AUTHORIZED-LEVEL-B-V3-TRAINING-ONLY-FIT | MYSTIC-STATE-0071 | '
          distinct=[str(c.get('body') or '') for c in comments if prefix in str(c.get('body') or '')]; assert distinct==[marker],distinct
          fr=[r for r in runs if r.get('event')=='push' and r.get('head_branch')==os.environ['FIT_BRANCH']]; assert len(fr)==1 and int(fr[0]['id'])==run_id and fr[0]['head_sha']==head and int(fr[0].get('run_attempt') or 0)==1,(fr,run_id)
          PY
      - name: Re-prove exact immutable training source metadata before fit job
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}" > /tmp/source-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT}" > /tmp/source-artifact.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/source-run.json')); a=json.load(open('/tmp/source-artifact.json'))
          assert (r['run_attempt'],r['head_sha'],r['status'],r['conclusion'])==(1,'6ffae96ad6054d380f26e6d3a2d17917ba01900f','completed','success')
          assert (a['id'],a['name'],a.get('digest'),a.get('expired'))==(9229229366,'level-b-v2-training-fit-v3-densified58-6ffae96ad6054d380f26e6d3a2d17917ba01900f','sha256:f4c8c68a622f7c6bdc1b9177ad31d22f673becb1f286436d54b876ceece3668a',False)
          PY
      - name: Prove fit workflow has no MYSTIC, protected artifact, ordinal27, or production surface
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('.github/workflows/level-b-v3-training-only-fit-v1.yml').read_text().lower()
          forbidden=[''.join(x) for x in [('micro','mamba'),('lib','radtran'),('mc.rad.','spc'),('923778','8838'),('318518','72896'),('318480','52825'),('v0070-','holdout'),('workflow_','dispatch:'),('sched','ule:')]]
          for token in forbidden: assert token not in t,token
          PY

  fit:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.4'}
      - run: python -m pip install --disable-pip-version-check 'numpy==2.3.2'
      - name: Download only exact immutable 58-geometry training artifact
        uses: actions/download-artifact@v4
        with:
          github-token: '${{ github.token }}'
          repository: '${{ github.repository }}'
          run-id: 31827007009
          artifact-ids: 9229229366
          path: /tmp/lbv3-training-source
          merge-multiple: true
      - name: Verify exact dataset member before fitting
        run: |
          python - <<'PY'
          import hashlib,json
          p='/tmp/lbv3-training-source/training-representation-dataset-v3-densified58.json'; raw=open(p,'rb').read()
          assert hashlib.sha256(raw).hexdigest()=='1cf31f1a80ce4ae1f39b9e750616093f6cfa927d10e258f81fe9fc0e58f0ea69'
          d=json.loads(raw); body=dict(d); h=body.pop('datasetSha256'); assert h=='58c977acf84b6ce17717765c2052f7f9fd64e2965e5bf447eba5cc4accb30435'
          assert hashlib.sha256(json.dumps(body,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()==h
          assert d['geometryCount']==58 and d['protectedHoldoutRecordCount']==0 and len(d['records'])==58
          PY
      - name: Execute frozen 145-candidate training-only fit once
        run: |
          mkdir -p /tmp/lbv3-fit-output
          python review/level-b-v3-training-only-implementation-v1/train_v1.py execute \
            --protocol review/level-b-v3-training-only-prefit-freeze-v2/protocol-v2.json \
            --dataset /tmp/lbv3-training-source/training-representation-dataset-v3-densified58.json \
            --output /tmp/lbv3-fit-output
      - name: Independently audit candidate gates, ranking, shape invariance, and result bindings
        run: |
          python "$AUDITOR" \
            --protocol review/level-b-v3-training-only-prefit-freeze-v2/protocol-v2.json \
            --output-dir /tmp/lbv3-fit-output | tee /tmp/lbv3-fit-output/independent-audit-v1.log
      - name: Bind immutable workflow/source provenance with zero protected/MYSTIC access
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess
          out='/tmp/lbv3-fit-output'; parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          p={
            'schemaVersion':1,'provenanceId':'level-b-v3-training-only-fit-v1-provenance','status':'TRAINING_ONLY_FIT_ATTEMPT1_COMPLETED','governance':'MYSTIC-STATE-0071',
            'workflowRunId':int(os.environ['GITHUB_RUN_ID']),'workflowRunAttempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'authorizationHeadSha':os.environ['GITHUB_SHA'],'authorizationParentMainSha':parent,
            'sourceTrainingRunId':31827007009,'sourceTrainingArtifactId':9229229366,'sourceTrainingArtifactDigest':'sha256:f4c8c68a622f7c6bdc1b9177ad31d22f673becb1f286436d54b876ceece3668a',
            'datasetMemberByteSha256':'1cf31f1a80ce4ae1f39b9e750616093f6cfa927d10e258f81fe9fc0e58f0ea69','datasetCanonicalSha256':'58c977acf84b6ce17717765c2052f7f9fd64e2965e5bf447eba5cc4accb30435',
            'candidateCount':145,'cvFoldCount':73,'additionalMysticSolverInvocationCount':0,'protectedArtifactCountRead':0,'ordinal27ValuesRead':False,'githubRerunPerformed':False,'retryPerformed':False,'resumePerformed':False,'protectedValidationAuthorized':False,'productionPromotionAuthorized':False,'workerBLaneReactivated':False,'workerCLaneReactivated':False,
          }
          p['provenanceSha256']=hashlib.sha256(json.dumps(p,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
          open(out+'/fit-provenance-v1.json','w').write(json.dumps(p,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: level-b-v3-training-only-fit-v1-${{ github.sha }}
          path: /tmp/lbv3-fit-output
          if-no-files-found: error
          retention-days: 90
