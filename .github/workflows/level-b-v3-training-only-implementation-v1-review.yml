name: Level-B v3 training-only implementation v1 review

on:
  pull_request:
    paths:
      - 'review/level-b-v3-training-only-implementation-v1/**'
      - '.github/workflows/level-b-v3-training-only-implementation-v1-review.yml'
  push:
    branches:
      - 'review/level-b-v3-training-only-implementation-v1'
    paths:
      - 'review/level-b-v3-training-only-implementation-v1/**'
      - '.github/workflows/level-b-v3-training-only-implementation-v1-review.yml'

permissions:
  contents: read

jobs:
  synthetic-only-implementation-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact numerical runtime
        run: python -m pip install --disable-pip-version-check 'numpy==2.3.2'
      - name: Validate exact pre-fit and legacy source bindings
        run: python review/level-b-v3-training-only-implementation-v1/validate_implementation_v1.py
      - name: Run deterministic pure-engine fixtures
        run: python review/level-b-v3-training-only-implementation-v1/test_v1.py --protocol review/level-b-v3-training-only-prefit-freeze-v2/protocol-v2.json
      - name: Prove legacy-control parity and 145-candidate shape invariance on synthetic 58-record fixture
        run: python review/level-b-v3-training-only-implementation-v1/train_v1.py synthetic --protocol review/level-b-v3-training-only-prefit-freeze-v2/protocol-v2.json
      - name: Prove review has no artifact download, network, solver, or protected-evaluation surface
        shell: bash
        run: |
          set -euo pipefail
          review_dir='review/level-b-v3-training-only-implementation-v1'
          workflow='.github/workflows/level-b-v3-training-only-implementation-v1-review.yml'
          forbidden=(
            "actions/download""-artifact"
            "gh run ""download"
            "GITHUB_""TOKEN"
            "api.github"".com"
            "https:""//"
            "ur""llib"
            "requests.""get("
            "subprocess"
            "cu""rl "
            "w""get "
            "mc.rad.""spc"
            "lib""Radtran"
            "922922""9366"
            "923778""8838"
            "318518""72896"
          )
          for needle in "${forbidden[@]}"; do
            ! grep -R -F -- "$needle" "$review_dir" "$workflow"
          done
