name: Level-B v3 training-only pre-fit freeze v1

on:
  pull_request:
    paths:
      - 'review/level-b-v3-training-only-prefit-freeze-v1/**'
      - '.github/workflows/level-b-v3-training-only-prefit-freeze-v1.yml'
  push:
    branches:
      - 'review/level-b-v3-training-only-prefit-freeze-v1'
    paths:
      - 'review/level-b-v3-training-only-prefit-freeze-v1/**'
      - '.github/workflows/level-b-v3-training-only-prefit-freeze-v1.yml'

permissions:
  contents: read

jobs:
  review-only-prefit-freeze-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Level-B v3 58-training-only freeze and unchanged gates
        run: python review/level-b-v3-training-only-prefit-freeze-v1/validate_v1.py
      - name: Prove review cannot fit, download scientific artifacts, or open ordinal27
        shell: bash
        run: |
          set -euo pipefail
          review_dir='review/level-b-v3-training-only-prefit-freeze-v1'
          workflow='.github/workflows/level-b-v3-training-only-prefit-freeze-v1.yml'
          test ! -e "$review_dir/activation.json"
          test ! -e "$review_dir/model.json"
          forbidden=(
            "actions/download""-artifact"
            "gh run ""download"
            "923778""8838"
            "318518""72896"
            "mc.rad.""spc"
            "lib""Radtran"
            "scientific_case_""executor"
            "fit_""candidate"
            "np.linalg.""solve"
            "numpy.linalg.""solve"
            "urllib.""request"
            "requests.""get("
            "cur""l "
            "w""get "
          )
          for needle in "${forbidden[@]}"; do
            ! grep -R -F -- "$needle" "$review_dir" "$workflow"
          done
