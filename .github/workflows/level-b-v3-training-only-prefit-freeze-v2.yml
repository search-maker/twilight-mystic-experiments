name: Level-B v3 training-only pre-fit semantic clarification v2

on:
  pull_request:
    paths:
      - 'review/level-b-v3-training-only-prefit-freeze-v2/**'
      - '.github/workflows/level-b-v3-training-only-prefit-freeze-v2.yml'
  push:
    branches:
      - 'review/level-b-v3-training-only-prefit-freeze-v2'
    paths:
      - 'review/level-b-v3-training-only-prefit-freeze-v2/**'
      - '.github/workflows/level-b-v3-training-only-prefit-freeze-v2.yml'

permissions:
  contents: read

jobs:
  review-only-prefit-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate semantic-only pre-fit v2 supersession
        run: python review/level-b-v3-training-only-prefit-freeze-v2/validate_v2.py
      - name: Prove no fit, artifact download, MYSTIC, or ordinal27 opening surface
        shell: bash
        run: |
          set -euo pipefail
          review_dir='review/level-b-v3-training-only-prefit-freeze-v2'
          workflow='.github/workflows/level-b-v3-training-only-prefit-freeze-v2.yml'
          forbidden=(
            "actions/download""-artifact"
            "gh run ""download"
            "fit_""candidate"
            "np.linalg.""solve"
            "numpy.linalg.""solve"
            "urllib.""request"
            "requests.""get("
            "lib""Radtran"
            "mc.rad.""spc"
            "923778""8838"
            "318518""72896"
          )
          for needle in "${forbidden[@]}"; do
            ! grep -R -F -- "$needle" "$review_dir" "$workflow"
          done
