name: Level-B Weekly heartbeat probe

on:
  pull_request:
    paths:
      - '.github/workflows/level-b-weekly-heartbeat-probe.yml'
      - 'tools/level_b_0079_weekly_probe.mjs'

permissions:
  contents: read

concurrency:
  group: level-b-weekly-heartbeat-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  weekly-heartbeat:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APPLICATION_SHA: dc969284ae53a1a6b8fe421aa78ed078b0169ccf
      DEPLOYMENT_URL: https://7236ff67.starsvisibility.pages.dev

    steps:
      - name: Checkout public diagnostic runner
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-package-lock --no-save playwright@1.61.1
          npx playwright install --with-deps chromium

      - name: Probe exact deployed Weekly heartbeat
        shell: bash
        env:
          WEEKLY_PROBE_OUTPUT: ${{ runner.temp }}/0079-weekly-probe.json
        run: |
          set -euo pipefail
          node tools/level_b_0079_weekly_probe.mjs

      - name: Upload public-safe Weekly heartbeat evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: level-b-weekly-heartbeat-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: ${{ runner.temp }}/0079-weekly-probe.json
