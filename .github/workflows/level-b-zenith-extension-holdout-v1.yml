name: Level-B zenith extension protected holdout v1
run-name: Level-B zenith extension fresh holdout v1 | ${{ github.event.pull_request.head.sha }}

on:
  pull_request:
    types: [opened, reopened]
    paths:
      - 'experiments/level-b-zenith-extension-holdout-v1/dispatch.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: level-b-zenith-extension-holdout-v1-scientific-1
  cancel-in-progress: false

env:
  PKG: experiments/level-b-zenith-extension-holdout-v1
  ACQ: experiments/level-b-zenith-expansion-acquisition-v1
  RUNTIME_LOCK: experiments/mystic-batch-v1/runtime-lock.micromamba.json
  RUNTIME_PROBE: experiments/mystic-batch-v1/runtime_probe.py
  WORKFLOW_PATH: .github/workflows/level-b-zenith-extension-holdout-v1.yml

jobs:
  preflight:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      head: ${{ steps.guard.outputs.head }}
      matrix: ${{ steps.guard.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - name: Elect exactly one run for this immutable holdout dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          DISPATCH_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.parse,urllib.request
          repo=os.environ['REPOSITORY']; wf=urllib.parse.quote(os.environ['WORKFLOW_PATH'],safe='')
          url=f"https://api.github.com/repos/{repo}/actions/workflows/{wf}/runs?event=pull_request&per_page=100"
          req=urllib.request.Request(url,headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'X-GitHub-Api-Version':'2022-11-28','User-Agent':'zenith-holdout-one-shot'})
          with urllib.request.urlopen(req,timeout=30) as r:p=json.load(r)
          if p.get('total_count',0)>len(p.get('workflow_runs',[])):raise SystemExit('run scan incomplete')
          head=os.environ['DISPATCH_HEAD_SHA'];ids=sorted(int(x['id']) for x in p.get('workflow_runs',[]) if x.get('head_sha')==head and x.get('head_branch')=='dispatch/level-b-zenith-extension-holdout-v1');cur=int(os.environ['CURRENT_RUN_ID'])
          if cur not in ids or cur!=ids[0]:raise SystemExit(f'duplicate/non-elected holdout run refused: current={cur}, matches={ids}')
          print(json.dumps({'status':'PASS','electedRunId':cur,'matchingRunIds':ids},sort_keys=True))
          PY
      - id: guard
        name: Verify frozen model, holdout design, manifest and one-file dispatch
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_HEAD_REF" = "dispatch/level-b-zenith-extension-holdout-v1"
          test "$(git diff --name-only HEAD^ HEAD)" = "$PKG/dispatch.json"
          python - <<'PY'
          import json
          d=json.load(open('experiments/level-b-zenith-extension-holdout-v1/dispatch.json'))
          assert d=={'schemaVersion':1,'executionKey':'level-b-zenith-extension-holdout-v1:scientific:1','authorized':True,'attempt':1,'manifestSha256':'4a0a91e07c6a1f2c9f4870da70eda55664231e645d4050e78f72b46e22eb6394','sourceModelCanonicalSha256':'f9202b45a6540416b3cb021425b40da27e2c9adc966edd81d3608c55826a162a','holdoutDesignSha256':'2a4853910c4b3eac09bccb0995c92bb2427cae5eee1291663e47469517ffa05a','supportExpansionAuthorized':False,'productionAuthorized':False}
          PY
          test "$(sha256sum review/level-b-zenith-extension-training-v1/training-only-model-v1.json | awk '{print $1}')" = "e9f8106d9c5c81c41b2fdd16fbdf1ced522fa395e7db917e7008b5c9414f9bf3"
          python -m py_compile "$PKG/build_manifest.py" "$PKG/adapter.py" "$PKG/analyze_holdout.py" "$ACQ/run_case.py"
          python "$PKG/build_manifest.py"
          python - <<'PY'
          import json,os
          m=json.load(open('experiments/level-b-zenith-extension-holdout-v1/manifest.json'))
          assert m['manifestSha256']=='4a0a91e07c6a1f2c9f4870da70eda55664231e645d4050e78f72b46e22eb6394'
          assert m['caseCount']==32 and m['geometryCount']==8 and m['configuredPhotonHistories']==1280000000
          assert [c['seed'] for c in m['cases']]==list(range(2240000001,2240000033))
          matrix={'include':[{'case_id':c['caseId']} for c in m['cases']]}
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('matrix='+json.dumps(matrix,separators=(',',':'))+'\n')
          PY
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: level-b-zenith-extension-holdout-v1-frozen-manifest
          path: ${{ env.PKG }}/manifest.json
          if-no-files-found: error
          retention-days: 90

  cases:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.head }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: level-b-zenith-extension-holdout-v1-frozen-manifest
          path: frozen
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: level-b-zenith-extension-holdout-v1
          create-args: >-
            -c conda-forge
            python=3.12.4
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true
      - name: Verify exact reviewed MYSTIC runtime
        shell: bash -el {0}
        run: |
          set -euo pipefail
          UVSPEC="$(command -v uvspec)";DATA_DIR="$CONDA_PREFIX/share/libRadtran/data";ATM="$DATA_DIR/atmmod/afglus.dat"
          python "$RUNTIME_PROBE" --uvspec "$UVSPEC" --data-dir "$DATA_DIR" --atmosphere "$ATM" --runtime-lock "$RUNTIME_LOCK" --output runtime-report.json
          python - <<'PY'
          import json
          r=json.load(open('runtime-report.json'))
          assert r['uvspecSha256']=='2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3'
          assert r['uvspecHelpSha256']=='868aea5af762d968f6f62c4e1472916d25232ed9cab5be112d753b0823d20548'
          assert r['libRadtranDataTreeSha256']=='ad30b49177e9c84e46497d69faf0c75e466996b0d0003f1de210289ae9f847d7'
          assert r['atmosphereSha256']=='dab26290ed81c762ed0c607e5dc2d53393c1462a0c3a528bc5e3f5935191cfb5'
          assert r['runtimeLockRawSha256']=='3b5fbec964642b04c73a6423b3355dbcc4ba5e84f9614f6d74420491bacc20c5'
          PY
      - name: Execute exactly one protected-holdout MYSTIC case
        shell: bash -el {0}
        run: |
          set -euo pipefail
          python "$ACQ/run_case.py" --manifest frozen/manifest.json --runtime-report runtime-report.json --adapter "$PKG/adapter.py" --case-id "${{ matrix.case_id }}" --data-dir "$CONDA_PREFIX/share/libRadtran/data" --repository-root "$GITHUB_WORKSPACE" --uvspec "$(command -v uvspec)" --output-root case-output --timeout-seconds 1800
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: level-b-zenith-holdout-v1-case-${{ matrix.case_id }}
          path: |
            case-output
            runtime-report.json
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6

  analysis:
    needs: [preflight,cases]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.head }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - uses: actions/download-artifact@v4
        with:
          name: level-b-zenith-extension-holdout-v1-frozen-manifest
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          pattern: level-b-zenith-holdout-v1-case-*
          path: all-case-artifacts
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31927414786
          name: level-b-v3-selected-model-materialization-recovery-v1-2f03ddb491c43183ee16ebc6b17d159d6c372c49
          path: old-model
      - name: Evaluate untouched frozen holdout against frozen extension model
        run: |
          set -euo pipefail
          python "$PKG/analyze_holdout.py" --repo-root . --manifest frozen/manifest.json --results-root all-case-artifacts --old-model old-model/model-artifact-materialization-v1.json --output holdout-analysis-output
          cat holdout-analysis-output/fresh-holdout-evaluation-v1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: level-b-zenith-extension-fresh-holdout-v1-evaluation
          path: holdout-analysis-output
          if-no-files-found: warn
          retention-days: 90
