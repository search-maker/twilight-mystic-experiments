name: Clean local-vs-raw catalog diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/local-vs-raw-catalog-clean-v1.yml'
      - 'review/local-vs-raw-catalog-clean-v1/run.mjs'
permissions:
  contents: read
jobs:
  audit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      APPLICATION_SHA: e2d5b761206b6223526f6f79fcb0af5f6de3ba06
      STARSVISIBILITY_READ_TOKEN: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 1}
      - name: Require read-only application credential
        run: test -n "${STARSVISIBILITY_READ_TOKEN:-}" || exit 78
      - name: Checkout exact merged starsvisibility main
        uses: actions/checkout@v4
        with:
          repository: search-maker/starsvisibility
          ref: ${{ env.APPLICATION_SHA }}
          token: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}
          path: app
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with: {node-version-file: app/.node-version}
      - name: Build exact application
        working-directory: app
        env: {GITHUB_SHA: '${{ env.APPLICATION_SHA }}'}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPLICATION_SHA"
          npm ci
          npm run build:pages
          grep -q 'LEVEL-B-THREE-STAR-DIRECT-CATALOG-HANDOFF-V3' dist/work-in-progress/index.html
          grep -q 'LEVEL-B-THREE-STAR-CATALOG-ONLY-WORKER-BYPASS-V1' dist/work-in-progress/index.html
          grep -q "fieldFactor: 3.14" scientific-tools/visibility-v3/level-b-current-main-adapter.mjs
      - name: Instrument built diagnostic snapshot only
        working-directory: app
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='dist/work-in-progress/index.html';
          let s=fs.readFileSync(p,'utf8');
          const needle='globalThis.__LEVEL_B_SITEWIDE_DIRECT_CATALOG_ROWS__ = levelBDirectCatalogRows;';
          const count=s.split(needle).length-1;
          if(count!==1) throw new Error(`instrumentation anchor count ${count}`);
          s=s.replace(needle,needle+'\n          globalThis.__DIAG_LEVEL_B_DIRECT_CATALOG_ROWS__ = levelBDirectCatalogRows.map(row => ({ ...row }));');
          fs.writeFileSync(p,s);
          NODE
      - name: Install Chromium
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Run diagnostic
        run: |
          set -euo pipefail
          cp review/local-vs-raw-catalog-clean-v1/run.mjs app/local-vs-raw.mjs
          python3 -m http.server 4173 --bind 127.0.0.1 --directory app/dist > "$RUNNER_TEMP/server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:4173/work-in-progress/ >/dev/null && break; sleep 0.2; done
          cd app
          node local-vs-raw.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-vs-raw-clean-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: ${{ runner.temp }}/local-vs-raw-catalog-audit/summary.json
