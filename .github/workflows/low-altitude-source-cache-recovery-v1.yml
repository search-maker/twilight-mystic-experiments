name: LOWALT source-cache recovery v4

on:
  push:
    branches:
      - review/low-altitude-source-cache-recovery-v1

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recover retained GitHub Check annotations from failed historical build
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='999e47f4af4b5df6f85a6887fc105fc8f6e1a7cee89a3124f69ac8d8912c8e85'
          PRIOR='64930cc40b6e4a37aa220520974d330fc1563796f466a649b2238131f2d69840'
          FAILED_COMMIT='34661f6d1776374c409908256c38055b6641f4e1'
          API='https://api.github.com/repos/conda-forge/rubin-libradtran-feedstock'
          mkdir -p out/annotations
          REPORT='out/github-check-annotation-recovery.txt'
          : > "$REPORT"
          {
            echo 'LOWALT_SOURCE_RECOVERY_V4_GITHUB_CHECK_ANNOTATIONS'
            echo "expected_sha256=$EXPECTED"
            echo "prior_sha256=$PRIOR"
            echo "failed_commit=$FAILED_COMMIT"
            echo "probe_head=${GITHUB_SHA:-unknown}"
            date -u '+utc=%Y-%m-%dT%H:%M:%SZ'
          } >> "$REPORT"

          curl_json() {
            local url="$1"
            local dst="$2"
            local hdr="$3"
            local code
            set +e
            code=$(curl --location --silent --show-error \
              --connect-timeout 20 --max-time 120 --retry 0 \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H 'User-Agent: lowalt-source-provenance-probe' \
              --dump-header "$hdr" \
              --output "$dst" \
              --write-out '%{http_code}' \
              "$url")
            rc=$?
            set -e
            echo "curl_rc=$rc http_code=$code url=$url" >> "$REPORT"
            if [[ $rc -ne 0 || "$code" != '200' ]]; then
              return 1
            fi
            return 0
          }

          CHECKS='out/check-runs.json'
          if ! curl_json "$API/commits/$FAILED_COMMIT/check-runs?per_page=100" "$CHECKS" 'out/check-runs.headers.txt'; then
            echo 'check_run_inventory=UNAVAILABLE' >> "$REPORT"
          else
            python - "$CHECKS" > out/check-run-inventory.tsv <<'PY'
          import json
          import pathlib
          import sys

          d = json.loads(pathlib.Path(sys.argv[1]).read_text())
          print('id\tname\tconclusion\tannotations_count\tannotations_url')
          for r in d.get('check_runs') or []:
              o = r.get('output') or {}
              print('\t'.join(str(x) for x in (
                  r.get('id'),
                  (r.get('name') or '').replace('\t', ' '),
                  r.get('conclusion'),
                  o.get('annotations_count', 0),
                  o.get('annotations_url') or '',
              )))
          PY
            total=$(tail -n +2 out/check-run-inventory.tsv | wc -l | tr -d ' ')
            annotated=$(tail -n +2 out/check-run-inventory.tsv | awk -F '\t' '$4+0 > 0 {n++} END {print n+0}')
            echo "check_run_count=$total" >> "$REPORT"
            echo "annotated_check_run_count=$annotated" >> "$REPORT"

            while IFS=$'\t' read -r id name conclusion count url; do
              [[ "$id" == 'id' ]] && continue
              [[ "${count:-0}" -gt 0 ]] || continue
              [[ -n "${url:-}" ]] || continue
              dst="out/annotations/check-${id}.json"
              hdr="out/annotations/check-${id}.headers.txt"
              if ! curl_json "${url}?per_page=100" "$dst" "$hdr"; then
                echo "annotation_fetch_failed check=$id name=$name" >> "$REPORT"
              fi
            done < out/check-run-inventory.tsv
          fi

          python - "$EXPECTED" "$PRIOR" "$REPORT" <<'PY'
          import json
          import pathlib
          import re
          import sys

          expected, prior, report_name = sys.argv[1:]
          rows = []
          for p in sorted(pathlib.Path('out/annotations').glob('check-*.json')):
              try:
                  data = json.loads(p.read_text())
              except Exception as exc:
                  rows.append((p.name, 'PARSE_ERROR', str(exc)))
                  continue
              if not isinstance(data, list):
                  rows.append((p.name, 'NON_LIST', repr(data)[:1000]))
                  continue
              for i, a in enumerate(data):
                  fields = [
                      str(a.get('annotation_level') or ''),
                      str(a.get('title') or ''),
                      str(a.get('message') or ''),
                      str(a.get('raw_details') or ''),
                      str(a.get('path') or ''),
                  ]
                  text = ' | '.join(x.replace('\n', '\\n') for x in fields)
                  rows.append((p.name, str(i), text))
          out = pathlib.Path('out/all-check-annotations.txt')
          out.write_text('\n'.join('\t'.join(r) for r in rows) + ('\n' if rows else ''))
          text = out.read_text(errors='replace')
          needle = re.compile(
              r'(libradtran|checksum|sha(?:256)?|hash|source|download|expected|actual|mismatch)',
              re.I,
          )
          relevant = [line for line in text.splitlines() if needle.search(line)]
          pathlib.Path('out/relevant-check-annotations.txt').write_text(
              '\n'.join(relevant) + ('\n' if relevant else '')
          )
          with pathlib.Path(report_name).open('a') as fh:
              fh.write(f'annotation_row_count={len(rows)}\n')
              fh.write(f'relevant_annotation_row_count={len(relevant)}\n')
              fh.write(f'expected_hash_mentions={text.lower().count(expected.lower())}\n')
              fh.write(f'prior_hash_mentions={text.lower().count(prior.lower())}\n')
              fh.write(f'expected_prefix_mentions={text.lower().count(expected[:8].lower())}\n')
              fh.write(f'prior_prefix_mentions={text.lower().count(prior[:8].lower())}\n')
          PY

          cat "$REPORT"
          echo '--- retained relevant GitHub Check annotations ---'
          cat out/relevant-check-annotations.txt

      - name: Upload immutable recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-source-cache-recovery-v4-check-annotations
          path: out/
          if-no-files-found: error
          retention-days: 90
