name: LOWALT solver-object equivalence v8

on:
  push:
    branches:
      - review/low-altitude-source-cache-recovery-v1

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Compare exact solver-library object code across historical and pinned packages
        shell: bash
        run: |
          set -euo pipefail
          BUILD0='rubin-libradtran-2.0.6-py312pl5321hffb8e61_0.conda'
          BUILD0_SHA='485886cdef4fad72f60d8407aec2c53648b85129572894ca2672015f85a38e8f'
          PINNED='rubin-libradtran-2.0.6-py312pl5321he9373c2_1.conda'
          PINNED_SHA='9090033a39a7e963ecabb31d5cbd264330c64ec1c4cb5f44be2e70f10cbc54c2'
          EXPECTED_SOURCE='999e47f4af4b5df6f85a6887fc105fc8f6e1a7cee89a3124f69ac8d8912c8e85'
          CHANNEL='https://conda.anaconda.org/conda-forge/linux-64'
          mkdir -p out/raw out/libs out/tmp
          REPORT='out/solver-object-equivalence-v8.txt'
          : > "$REPORT"
          {
            echo 'LOWALT_SOLVER_OBJECT_EQUIVALENCE_V8'
            echo "probe_head=${GITHUB_SHA:-unknown}"
            echo "expected_source_sha256=$EXPECTED_SOURCE"
            date -u '+utc=%Y-%m-%dT%H:%M:%SZ'
          } >> "$REPORT"

          for spec in "build0:$BUILD0:$BUILD0_SHA" "pinned:$PINNED:$PINNED_SHA"; do
            label=${spec%%:*}
            rest=${spec#*:}
            fn=${rest%%:*}
            expected=${rest#*:}
            dst="out/raw/$fn"
            curl --fail --location --silent --show-error \
              --connect-timeout 20 --max-time 600 --retry 0 \
              --output "$dst" "$CHANNEL/$fn"
            actual=$(sha256sum "$dst" | awk '{print $1}')
            echo "${label}_package_sha256=$actual" >> "$REPORT"
            if [[ "$actual" != "$expected" ]]; then
              echo "${label}_package_integrity=FAIL" >> "$REPORT"
              exit 1
            fi
            echo "${label}_package_integrity=PASS" >> "$REPORT"
          done

          python -m pip install --quiet --disable-pip-version-check zstandard
          python - "$BUILD0" "$PINNED" "$REPORT" <<'PY'
          import hashlib, io, json, pathlib, subprocess, sys, tarfile, zipfile
          import zstandard as zstd

          build0, pinned, report_name = sys.argv[1:]
          root = pathlib.Path('out')
          labels = {'build0': build0, 'pinned': pinned}
          lib_paths = ('lib/libRadtran_c.a', 'lib/libRadtran_f.a')
          selected = {
              'lib/libRadtran_c.a': ['cdisort.o'],
              'lib/libRadtran_f.a': [
                  'DISORT.o', 'DISORT2.o', 'dpsdisort.o', 'spsdisort.o',
                  'DISORTblas.o', 'DISORTlapack.o', 'twostr.o'
              ],
          }

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          def extract_payload_members(conda_path, wanted, outdir):
              found = set()
              with zipfile.ZipFile(conda_path) as zf:
                  pkg_name = next(n for n in zf.namelist() if n.startswith('pkg-') and n.endswith('.tar.zst'))
                  pkg_blob = zf.read(pkg_name)
              with zstd.ZstdDecompressor().stream_reader(io.BytesIO(pkg_blob)) as reader:
                  with tarfile.open(fileobj=reader, mode='r|') as tf:
                      for member in tf:
                          if member.isfile() and member.name in wanted:
                              f = tf.extractfile(member)
                              if f is None:
                                  continue
                              dst = outdir / pathlib.Path(member.name).name
                              dst.write_bytes(f.read())
                              found.add(member.name)
              missing = set(wanted) - found
              if missing:
                  raise SystemExit(f'missing payload members: {sorted(missing)}')

          for label, fn in labels.items():
              d = root / 'libs' / label
              d.mkdir(parents=True, exist_ok=True)
              extract_payload_members(root / 'raw' / fn, set(lib_paths), d)

          def ar_members(path):
              cp = subprocess.run(['ar', 't', str(path)], check=True, stdout=subprocess.PIPE, text=True)
              return [x for x in cp.stdout.splitlines() if x]

          def ar_bytes(path, member):
              cp = subprocess.run(['ar', 'p', str(path), member], check=True, stdout=subprocess.PIPE)
              return cp.stdout

          def normalized_objdump(blob, tag):
              tmp = root / 'tmp' / (tag.replace('/', '_') + '.o')
              tmp.write_bytes(blob)
              cp = subprocess.run(['objdump', '-drwC', str(tmp)], check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              lines = cp.stdout.splitlines()
              # Drop the filename banner so identical code is not made different by temp paths.
              if lines and lines[0].endswith(':     file format elf64-x86-64'):
                  lines = lines[1:]
              text = '\n'.join(lines).strip() + '\n'
              return sha(text.encode()), text

          result = {'libraries': {}, 'selected_solver_members': {}}
          for rel in lib_paths:
              name = pathlib.Path(rel).name
              p0 = root / 'libs' / 'build0' / name
              p1 = root / 'libs' / 'pinned' / name
              m0, m1 = ar_members(p0), ar_members(p1)
              common = sorted(set(m0) & set(m1))
              byte_same = []
              disasm_same = []
              member_rows = {}
              for member in common:
                  b0, b1 = ar_bytes(p0, member), ar_bytes(p1, member)
                  h0, h1 = sha(b0), sha(b1)
                  d0, _ = normalized_objdump(b0, f'build0-{name}-{member}')
                  d1, _ = normalized_objdump(b1, f'pinned-{name}-{member}')
                  if h0 == h1:
                      byte_same.append(member)
                  if d0 == d1:
                      disasm_same.append(member)
                  member_rows[member] = {
                      'build0_object_sha256': h0,
                      'pinned_object_sha256': h1,
                      'object_bytes_identical': h0 == h1,
                      'build0_objdump_drwC_sha256': d0,
                      'pinned_objdump_drwC_sha256': d1,
                      'normalized_disassembly_identical': d0 == d1,
                  }
              result['libraries'][name] = {
                  'build0_member_count': len(m0),
                  'pinned_member_count': len(m1),
                  'member_order_identical': m0 == m1,
                  'common_count': len(common),
                  'only_build0': sorted(set(m0) - set(m1)),
                  'only_pinned': sorted(set(m1) - set(m0)),
                  'byte_identical_member_count': len(byte_same),
                  'normalized_disassembly_identical_member_count': len(disasm_same),
                  'byte_identical_members': byte_same,
                  'normalized_disassembly_identical_members': disasm_same,
                  'members': member_rows,
              }
              for member in selected[rel]:
                  if member not in member_rows:
                      result['selected_solver_members'][f'{name}:{member}'] = {'missing': True}
                  else:
                      result['selected_solver_members'][f'{name}:{member}'] = member_rows[member]

          (root / 'solver-object-equivalence-v8.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          with pathlib.Path(report_name).open('a') as fh:
              for name, data in result['libraries'].items():
                  fh.write(f'{name}_member_order_identical={"YES" if data["member_order_identical"] else "NO"}\n')
                  fh.write(f'{name}_common_member_count={data["common_count"]}\n')
                  fh.write(f'{name}_byte_identical_member_count={data["byte_identical_member_count"]}\n')
                  fh.write(f'{name}_normalized_disassembly_identical_member_count={data["normalized_disassembly_identical_member_count"]}\n')
              for key, data in result['selected_solver_members'].items():
                  if data.get('missing'):
                      fh.write(f'selected={key}|MISSING\n')
                  else:
                      fh.write(f'selected={key}|object_bytes_identical={"YES" if data["object_bytes_identical"] else "NO"}|normalized_disassembly_identical={"YES" if data["normalized_disassembly_identical"] else "NO"}\n')
          PY

          rm -rf out/raw out/libs out/tmp
          cat "$REPORT"
          echo '--- selected solver members ---'
          python - <<'PY'
          import json
          d=json.load(open('out/solver-object-equivalence-v8.json'))
          print(json.dumps(d['selected_solver_members'], indent=2, sort_keys=True))
          PY

      - name: Upload immutable solver-object equivalence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-solver-object-equivalence-v8
          path: |
            out/solver-object-equivalence-v8.txt
            out/solver-object-equivalence-v8.json
          if-no-files-found: warn
          retention-days: 90
