name: LOWALT source-cache recovery v2

on:
  push:
    branches:
      - review/low-altitude-source-cache-recovery-v1

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe historical libRadtran 2.0.6 source candidates
        shell: bash
        run: |
          set -u -o pipefail
          EXPECTED='999e47f4af4b5df6f85a6887fc105fc8f6e1a7cee89a3124f69ac8d8912c8e85'
          mkdir -p out/work out/cdx
          REPORT=out/source-recovery-report.txt
          : > "$REPORT"
          {
            echo "LOWALT_SOURCE_RECOVERY_V2"
            echo "expected_sha256=$EXPECTED"
            echo "runner_os=${RUNNER_OS:-unknown}"
            echo "github_sha=${GITHUB_SHA:-unknown}"
            date -u '+utc=%Y-%m-%dT%H:%M:%SZ'
          } >> "$REPORT"

          hash_candidate() {
            local label="$1"
            local body="$2"
            local bytes sha
            bytes=$(wc -c < "$body" | tr -d ' ')
            sha=$(sha256sum "$body" | awk '{print $1}')
            echo "bytes=$bytes" >> "$REPORT"
            echo "sha256=$sha" >> "$REPORT"
            file "$body" | sed 's/^/file=/' >> "$REPORT" || true
            if [[ "$sha" == "$EXPECTED" ]]; then
              echo "expected_match=true" >> "$REPORT"
              cp "$body" "out/libRadtran-2.0.6-EXPECTED-${label}.tar.gz"
            else
              echo "expected_match=false" >> "$REPORT"
            fi
          }

          probe_url() {
            local label="$1"
            local url="$2"
            local body="out/work/${label}.bin"
            local headers="out/${label}.headers.txt"
            echo >> "$REPORT"
            echo "candidate=$label" >> "$REPORT"
            echo "url=$url" >> "$REPORT"
            rm -f "$body" "$headers"
            set +e
            curl --fail --location --silent --show-error \
              --connect-timeout 20 --max-time 300 --retry 0 \
              --dump-header "$headers" --output "$body" "$url"
            rc=$?
            set -e
            echo "curl_rc=$rc" >> "$REPORT"
            if [[ $rc -ne 0 ]]; then
              rm -f "$body"
              return 0
            fi
            hash_candidate "$label" "$body"
            rm -f "$body"
          }

          probe_resolved_url() {
            local label="$1"
            local ip="$2"
            local url='https://sources.conda.io/libRadtran-2.0.6.tar.gz'
            local body="out/work/${label}.bin"
            local headers="out/${label}.headers.txt"
            echo >> "$REPORT"
            echo "candidate=$label" >> "$REPORT"
            echo "url=$url" >> "$REPORT"
            echo "forced_ip=$ip" >> "$REPORT"
            rm -f "$body" "$headers"
            set +e
            curl --fail --location --silent --show-error \
              --connect-timeout 20 --max-time 300 --retry 0 \
              --resolve "sources.conda.io:443:$ip" \
              --dump-header "$headers" --output "$body" "$url"
            rc=$?
            set -e
            echo "curl_rc=$rc" >> "$REPORT"
            if [[ $rc -ne 0 ]]; then
              rm -f "$body"
              return 0
            fi
            hash_candidate "$label" "$body"
            rm -f "$body"
          }

          probe_cdx() {
            local label="$1"
            local encoded_url="$2"
            local out_json="out/cdx/${label}.json"
            local cdx="https://web.archive.org/cdx/search/cdx?url=${encoded_url}&output=json&filter=statuscode%3A200&fl=timestamp%2Coriginal%2Cdigest%2Clength%2Cstatuscode%2Cmimetype&collapse=digest"
            echo >> "$REPORT"
            echo "wayback_label=$label" >> "$REPORT"
            echo "wayback_cdx_url=$cdx" >> "$REPORT"
            set +e
            curl --fail --location --silent --show-error \
              --connect-timeout 20 --max-time 120 --retry 0 \
              --dump-header "out/cdx/${label}.headers.txt" \
              --output "$out_json" "$cdx"
            rc=$?
            set -e
            echo "wayback_cdx_curl_rc=$rc" >> "$REPORT"
            if [[ $rc -ne 0 ]]; then
              rm -f "$out_json"
              return 0
            fi
            echo "wayback_cdx_bytes=$(wc -c < "$out_json" | tr -d ' ')" >> "$REPORT"
            sha256sum "$out_json" | sed 's/^/wayback_cdx_sha256=/' >> "$REPORT"
            python - "$out_json" "$label" "$REPORT" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          label = sys.argv[2]
          report = pathlib.Path(sys.argv[3])
          try:
              payload = json.loads(path.read_text())
          except Exception as exc:
              with report.open('a') as fh:
                  fh.write(f"wayback_{label}_json_valid=false\n")
                  fh.write(f"wayback_{label}_json_error={type(exc).__name__}\n")
              raise SystemExit(0)
          rows = payload[1:] if isinstance(payload, list) and payload else []
          with report.open('a') as fh:
              fh.write(f"wayback_{label}_json_valid=true\n")
              fh.write(f"wayback_{label}_capture_count={len(rows)}\n")
              for idx, row in enumerate(rows[:10], 1):
                  fh.write(f"wayback_{label}_capture_{idx}=" + "|".join(map(str, row)) + "\n")
          PY
          }

          set -e
          probe_url sources_conda_https 'https://sources.conda.io/libRadtran-2.0.6.tar.gz'
          probe_url anaconda_main_src_cache 'https://repo.anaconda.com/pkgs/main/src_cache/libRadtran-2.0.6.tar.gz'
          probe_url libradtran_https 'https://www.libradtran.org/download/libRadtran-2.0.6.tar.gz'
          probe_url libradtran_http 'http://www.libradtran.org/download/libRadtran-2.0.6.tar.gz'

          echo >> "$REPORT"
          echo 'doh_candidate=sources.conda.io' >> "$REPORT"
          set +e
          curl --fail --location --silent --show-error \
            --connect-timeout 20 --max-time 60 --retry 0 \
            --output out/sources-conda-doh.json \
            'https://dns.google/resolve?name=sources.conda.io&type=A'
          doh_rc=$?
          set -e
          echo "doh_curl_rc=$doh_rc" >> "$REPORT"
          if [[ $doh_rc -eq 0 ]]; then
            python - <<'PY' >> "$REPORT"
          import json
          from pathlib import Path
          p = Path('out/sources-conda-doh.json')
          try:
              d = json.loads(p.read_text())
          except Exception as exc:
              print('doh_json_valid=false')
              print(f'doh_json_error={type(exc).__name__}')
          else:
              print('doh_json_valid=true')
              print(f"doh_status={d.get('Status')}")
              ips = [a.get('data') for a in d.get('Answer', []) if a.get('type') == 1 and a.get('data')]
              print('doh_a_records=' + ','.join(ips))
          PY
            mapfile -t IPS < <(python - <<'PY'
          import json
          from pathlib import Path
          try:
              d = json.loads(Path('out/sources-conda-doh.json').read_text())
          except Exception:
              raise SystemExit(0)
          for ans in d.get('Answer', []):
              if ans.get('type') == 1 and ans.get('data'):
                  print(ans['data'])
          PY
            )
            for ip in "${IPS[@]}"; do
              safe_ip=${ip//./_}
              probe_resolved_url "sources_conda_doh_${safe_ip}" "$ip"
            done
          fi

          probe_cdx wayback_www_http 'http%3A%2F%2Fwww.libradtran.org%2Fdownload%2FlibRadtran-2.0.6.tar.gz'
          probe_cdx wayback_www_https 'https%3A%2F%2Fwww.libradtran.org%2Fdownload%2FlibRadtran-2.0.6.tar.gz'
          probe_cdx wayback_bare_http 'http%3A%2F%2Flibradtran.org%2Fdownload%2FlibRadtran-2.0.6.tar.gz'
          probe_cdx wayback_bare_https 'https%3A%2F%2Flibradtran.org%2Fdownload%2FlibRadtran-2.0.6.tar.gz'
          probe_cdx wayback_host_wildcard '%2A.libradtran.org%2Fdownload%2FlibRadtran-2.0.6.tar.gz'

          rm -rf out/work
          cat "$REPORT"

      - name: Upload immutable recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-source-cache-recovery-v2
          path: out/
          if-no-files-found: error
          retention-days: 90
