name: LOWALT pinned DWARF source-checksum probe v9

on:
  push:
    branches:
      - review/low-altitude-source-cache-recovery-v1

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Probe pinned solver objects for embedded source checksums
        shell: bash
        run: |
          set -euo pipefail
          PINNED='rubin-libradtran-2.0.6-py312pl5321he9373c2_1.conda'
          PINNED_SHA='9090033a39a7e963ecabb31d5cbd264330c64ec1c4cb5f44be2e70f10cbc54c2'
          EXPECTED_SOURCE='999e47f4af4b5df6f85a6887fc105fc8f6e1a7cee89a3124f69ac8d8912c8e85'
          CURRENT_SOURCE_SHA='64930cc40b6e4a37aa220520974d330fc1563796f466a649b2238131f2d69840'
          CHANNEL='https://conda.anaconda.org/conda-forge/linux-64'
          SOURCE_URL='https://www.libradtran.org/download/libRadtran-2.0.6.tar.gz'
          mkdir -p out/raw out/pkg out/objects out/current-src out/dwarf
          REPORT='out/pinned-dwarf-source-checksum-v9.txt'
          : > "$REPORT"
          {
            echo 'LOWALT_PINNED_DWARF_SOURCE_CHECKSUM_V9'
            echo "probe_head=${GITHUB_SHA:-unknown}"
            echo "expected_historical_source_sha256=$EXPECTED_SOURCE"
            echo "known_current_source_sha256=$CURRENT_SOURCE_SHA"
            date -u '+utc=%Y-%m-%dT%H:%M:%SZ'
          } >> "$REPORT"

          curl --fail --location --silent --show-error \
            --connect-timeout 20 --max-time 600 --retry 0 \
            --output "out/raw/$PINNED" "$CHANNEL/$PINNED"
          actual=$(sha256sum "out/raw/$PINNED" | awk '{print $1}')
          echo "pinned_package_sha256=$actual" >> "$REPORT"
          if [[ "$actual" != "$PINNED_SHA" ]]; then
            echo 'pinned_package_integrity=FAIL' >> "$REPORT"
            exit 1
          fi
          echo 'pinned_package_integrity=PASS' >> "$REPORT"

          # Pull the current public 2.0.6 archive only as a comparison candidate.
          # A match to it cannot establish historical provenance; the expected historical
          # archive identity above remains immutable and is deliberately not relaxed.
          curl --fail --location --silent --show-error \
            --connect-timeout 20 --max-time 600 --retry 0 \
            --user 'libRadtran:libRadtran' \
            --output out/raw/current-libRadtran-2.0.6.tar.gz "$SOURCE_URL"
          current_actual=$(sha256sum out/raw/current-libRadtran-2.0.6.tar.gz | awk '{print $1}')
          echo "current_source_sha256=$current_actual" >> "$REPORT"
          if [[ "$current_actual" != "$CURRENT_SOURCE_SHA" ]]; then
            echo 'current_source_identity=UNEXPECTED' >> "$REPORT"
            exit 1
          fi
          echo 'current_source_identity=KNOWN_64930_ONLY' >> "$REPORT"

          python -m pip install --quiet --disable-pip-version-check zstandard
          python - "$PINNED" "$REPORT" <<'PY'
          import hashlib, io, json, pathlib, re, subprocess, sys, tarfile, zipfile
          import zstandard as zstd

          pinned, report_name = sys.argv[1:]
          root = pathlib.Path('out')
          selected = {
              'lib/libRadtran_c.a': ['cdisort.o'],
              'lib/libRadtran_f.a': [
                  'DISORT.o', 'DISORT2.o', 'dpsdisort.o', 'spsdisort.o',
                  'DISORTblas.o', 'DISORTlapack.o', 'twostr.o'
              ],
          }

          def sha256_bytes(data):
              return hashlib.sha256(data).hexdigest()

          def md5_file(path):
              h = hashlib.md5()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          # Extract only the two static libraries from the exact pinned package.
          wanted_libs = set(selected)
          with zipfile.ZipFile(root / 'raw' / pinned) as zf:
              pkg_name = next(n for n in zf.namelist() if n.startswith('pkg-') and n.endswith('.tar.zst'))
              pkg_blob = zf.read(pkg_name)
          found = set()
          with zstd.ZstdDecompressor().stream_reader(io.BytesIO(pkg_blob)) as reader:
              with tarfile.open(fileobj=reader, mode='r|') as tf:
                  for member in tf:
                      if member.isfile() and member.name in wanted_libs:
                          f = tf.extractfile(member)
                          if f is None:
                              continue
                          dst = root / 'pkg' / pathlib.Path(member.name).name
                          dst.write_bytes(f.read())
                          found.add(member.name)
          if found != wanted_libs:
              raise SystemExit(f'missing pinned libraries: {sorted(wanted_libs - found)}')

          # Expand only selected archive members.
          object_rows = []
          for librel, members in selected.items():
              lib = root / 'pkg' / pathlib.Path(librel).name
              for member in members:
                  cp = subprocess.run(['ar', 'p', str(lib), member], check=True, stdout=subprocess.PIPE)
                  dst = root / 'objects' / f'{lib.name}__{member}'
                  dst.write_bytes(cp.stdout)
                  object_rows.append((lib.name, member, dst))

          # Extract current public source archive for candidate-file checksums.
          current_root = root / 'current-src'
          with tarfile.open(root / 'raw' / 'current-libRadtran-2.0.6.tar.gz', 'r:gz') as tf:
              tf.extractall(current_root, filter='data')

          all_current_files = [p for p in current_root.rglob('*') if p.is_file()]
          current_by_basename = {}
          for p in all_current_files:
              current_by_basename.setdefault(p.name.lower(), []).append(p)

          md5_re = re.compile(r'(?i)\b[0-9a-f]{32}\b')
          results = {
              'pinned_package_sha256': '9090033a39a7e963ecabb31d5cbd264330c64ec1c4cb5f44be2e70f10cbc54c2',
              'expected_historical_source_sha256': '999e47f4af4b5df6f85a6887fc105fc8f6e1a7cee89a3124f69ac8d8912c8e85',
              'current_source_sha256': '64930cc40b6e4a37aa220520974d330fc1563796f466a649b2238131f2d69840',
              'objects': {},
          }

          for libname, member, obj in object_rows:
              key = f'{libname}:{member}'
              section_cp = subprocess.run(
                  ['readelf', '-SW', str(obj)], check=False,
                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True,
              )
              sections_text = section_cp.stdout
              debug_sections = sorted(set(re.findall(r'\.debug_[A-Za-z0-9_.-]+', sections_text)))

              raw_cp = subprocess.run(
                  ['readelf', '--debug-dump=rawline', str(obj)], check=False,
                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True,
              )
              info_cp = subprocess.run(
                  ['readelf', '--debug-dump=info', str(obj)], check=False,
                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True,
              )
              raw = raw_cp.stdout
              info = info_cp.stdout
              (root / 'dwarf' / f'{obj.name}.rawline.txt').write_text(raw)
              (root / 'dwarf' / f'{obj.name}.info.txt').write_text(info)
              (root / 'dwarf' / f'{obj.name}.sections.txt').write_text(sections_text)

              embedded_md5 = sorted(set(x.lower() for x in md5_re.findall(raw)))
              source_stem = pathlib.Path(member).stem
              candidate_names = {
                  source_stem.lower(),
                  (source_stem + '.c').lower(),
                  (source_stem + '.cc').lower(),
                  (source_stem + '.f').lower(),
                  (source_stem + '.f90').lower(),
                  (source_stem + '.for').lower(),
              }
              candidates = []
              for name in candidate_names:
                  for p in current_by_basename.get(name, []):
                      candidates.append({
                          'path': str(p.relative_to(current_root)),
                          'md5': md5_file(p),
                          'sha256': hashlib.sha256(p.read_bytes()).hexdigest(),
                      })
              candidate_md5s = {c['md5'] for c in candidates}
              matches = sorted(candidate_md5s & set(embedded_md5))

              # Preserve a compact set of path/provenance hints from DWARF info.
              hint_lines = []
              for line in (raw + '\n' + info).splitlines():
                  low = line.lower()
                  if ('comp_dir' in low or 'producer' in low or source_stem.lower() in low
                          or 'md5' in low or 'file name table' in low or 'directory table' in low):
                      hint_lines.append(line)
                  if len(hint_lines) >= 300:
                      break

              results['objects'][key] = {
                  'object_sha256': sha256_bytes(obj.read_bytes()),
                  'debug_sections': debug_sections,
                  'has_dwarf_sections': bool(debug_sections),
                  'readelf_rawline_rc': raw_cp.returncode,
                  'readelf_info_rc': info_cp.returncode,
                  'embedded_md5_tokens': embedded_md5,
                  'current_source_candidates': candidates,
                  'embedded_md5_matches_current_candidates': matches,
                  'dwarf_hint_lines': hint_lines,
              }

          (root / 'pinned-dwarf-source-checksum-v9.json').write_text(
              json.dumps(results, indent=2, sort_keys=True) + '\n'
          )

          with pathlib.Path(report_name).open('a') as fh:
              for key, row in results['objects'].items():
                  fh.write(
                      f'object={key}|debug_sections={len(row["debug_sections"])}'
                      f'|embedded_md5_tokens={len(row["embedded_md5_tokens"])}'
                      f'|current_candidates={len(row["current_source_candidates"])}'
                      f'|md5_matches_current={len(row["embedded_md5_matches_current_candidates"])}\n'
                  )
                  if row['debug_sections']:
                      fh.write(f'  debug={",".join(row["debug_sections"])}\n')
                  if row['embedded_md5_matches_current_candidates']:
                      fh.write(
                          '  current_source_md5_match='
                          + ','.join(row['embedded_md5_matches_current_candidates']) + '\n'
                      )
          PY

          rm -rf out/raw out/pkg out/objects out/current-src
          cat "$REPORT"
          echo '--- compact JSON object summary ---'
          python - <<'PY'
          import json
          d=json.load(open('out/pinned-dwarf-source-checksum-v9.json'))
          for k,v in d['objects'].items():
              print(k, {
                  'debug_sections': v['debug_sections'],
                  'embedded_md5_tokens': v['embedded_md5_tokens'],
                  'current_source_candidates': v['current_source_candidates'],
                  'embedded_md5_matches_current_candidates': v['embedded_md5_matches_current_candidates'],
              })
          PY

      - name: Upload immutable pinned-DWARF evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-pinned-dwarf-source-checksum-v9
          path: |
            out/pinned-dwarf-source-checksum-v9.txt
            out/pinned-dwarf-source-checksum-v9.json
            out/dwarf/
          if-no-files-found: warn
          retention-days: 90
