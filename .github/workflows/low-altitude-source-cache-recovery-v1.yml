name: LOWALT exact-package reconstruction v6

on:
  push:
    branches:
      - review/low-altitude-source-cache-recovery-v1

permissions:
  contents: read

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Compare historical build-0 to exact pinned build-1
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SOURCE='999e47f4af4b5df6f85a6887fc105fc8f6e1a7cee89a3124f69ac8d8912c8e85'
          BUILD0='rubin-libradtran-2.0.6-py312pl5321hffb8e61_0.conda'
          PINNED='rubin-libradtran-2.0.6-py312pl5321he9373c2_1.conda'
          CHANNEL='https://conda.anaconda.org/conda-forge/linux-64'
          mkdir -p out/raw out/extracted
          REPORT='out/exact-package-reconstruction-v6.txt'
          : > "$REPORT"
          {
            echo 'LOWALT_EXACT_PACKAGE_RECONSTRUCTION_V6'
            echo "expected_source_sha256=$EXPECTED_SOURCE"
            echo "build0=$BUILD0"
            echo "pinned=$PINNED"
            echo "probe_head=${GITHUB_SHA:-unknown}"
            date -u '+utc=%Y-%m-%dT%H:%M:%SZ'
          } >> "$REPORT"

          REPODATA='out/raw/repodata.json.bz2'
          curl --fail --location --silent --show-error \
            --connect-timeout 20 --max-time 180 --retry 0 \
            --output "$REPODATA" "$CHANNEL/repodata.json.bz2"

          python - "$REPODATA" "$BUILD0" "$PINNED" "$REPORT" <<'PY'
          import bz2, json, pathlib, sys
          repodata_name, build0, pinned, report_name = sys.argv[1:]
          with bz2.open(repodata_name, 'rt') as fh:
              d = json.load(fh)
          records = {}
          records.update(d.get('packages') or {})
          records.update(d.get('packages.conda') or {})
          selected = {}
          for label, fn in [('build0', build0), ('pinned', pinned)]:
              rec = records.get(fn)
              selected[label] = rec
              if rec is not None:
                  pathlib.Path(f'out/{label}-repodata-record.json').write_text(
                      json.dumps({'filename': fn, **rec}, indent=2, sort_keys=True) + '\n'
                  )
          with pathlib.Path(report_name).open('a') as fh:
              for label, fn in [('build0', build0), ('pinned', pinned)]:
                  rec = selected[label]
                  fh.write(f'{label}_repodata_present={"YES" if rec else "NO"}\n')
                  if rec:
                      fh.write(f'{label}_repodata_sha256={rec.get("sha256")}\n')
                      fh.write(f'{label}_repodata_size={rec.get("size")}\n')
                      fh.write(f'{label}_build={rec.get("build")}\n')
                      fh.write(f'{label}_build_number={rec.get("build_number")}\n')
                      fh.write(f'{label}_timestamp_ms={rec.get("timestamp")}\n')
          if not all(selected.values()):
              raise SystemExit('required package record missing from current repodata')
          PY

          for spec in "build0:$BUILD0" "pinned:$PINNED"; do
            label=${spec%%:*}
            fn=${spec#*:}
            dst="out/raw/$fn"
            curl --fail --location --silent --show-error \
              --connect-timeout 20 --max-time 600 --retry 0 \
              --output "$dst" "$CHANNEL/$fn"
            actual=$(sha256sum "$dst" | awk '{print $1}')
            size=$(wc -c < "$dst" | tr -d ' ')
            expected=$(python - "$label" <<'PY'
          import json,sys
          print(json.load(open(f'out/{sys.argv[1]}-repodata-record.json')).get('sha256') or '')
          PY
            )
            echo "${label}_download_bytes=$size" >> "$REPORT"
            echo "${label}_download_sha256=$actual" >> "$REPORT"
            if [[ -n "$expected" && "$actual" == "$expected" ]]; then
              echo "${label}_repodata_integrity=PASS" >> "$REPORT"
            else
              echo "${label}_repodata_integrity=FAIL" >> "$REPORT"
              exit 1
            fi
          done

          python -m pip install --quiet --disable-pip-version-check zstandard
          python - "$BUILD0" "$PINNED" "$EXPECTED_SOURCE" "$REPORT" <<'PY'
          import hashlib
          import io
          import json
          import pathlib
          import re
          import subprocess
          import sys
          import tarfile
          import zipfile
          import zstandard as zstd

          build0, pinned, expected_source, report_name = sys.argv[1:]
          root = pathlib.Path('out')
          extracted_root = root / 'extracted'
          extracted_root.mkdir(parents=True, exist_ok=True)
          labels = {'build0': build0, 'pinned': pinned}
          state = {}

          def sha_bytes(data):
              return hashlib.sha256(data).hexdigest()

          def stream_tar(blob, callback):
              with zstd.ZstdDecompressor().stream_reader(io.BytesIO(blob)) as reader:
                  with tarfile.open(fileobj=reader, mode='r|') as tf:
                      for member in tf:
                          callback(tf, member)

          for label, filename in labels.items():
              package_path = root / 'raw' / filename
              info_text = {}
              payload_paths = []
              header_hashes = {}
              selected_hashes = {}
              source_archive_members = []
              extract_dir = extracted_root / label
              extract_dir.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(package_path) as zf:
                  names = zf.namelist()
                  info_inner = next(n for n in names if n.startswith('info-') and n.endswith('.tar.zst'))
                  pkg_inner = next(n for n in names if n.startswith('pkg-') and n.endswith('.tar.zst'))
                  info_blob = zf.read(info_inner)
                  pkg_blob = zf.read(pkg_inner)

              def handle_info(tf, member):
                  if not member.isfile():
                      return
                  if member.name in {
                      'info/recipe/meta.yaml', 'info/recipe/meta.yaml.template',
                      'info/recipe/build.sh', 'info/hash_input.json', 'info/index.json'
                  }:
                      f = tf.extractfile(member)
                      if f is not None:
                          data = f.read()
                          info_text[member.name] = data
                          out_name = member.name.replace('/', '__')
                          (root / f'{label}-{out_name}').write_bytes(data)
              stream_tar(info_blob, handle_info)

              selected_names = {'bin/uvspec', 'lib/libRadtran_c.a', 'lib/libRadtran_f.a'}
              def handle_pkg(tf, member):
                  name = member.name
                  payload_paths.append(name)
                  if not member.isfile():
                      return
                  if name.endswith('libRadtran-2.0.6.tar.gz'):
                      source_archive_members.append(name)
                  want_header = name.startswith('include/libRadtran/') and name.endswith(('.h', '.hpp'))
                  want_selected = name in selected_names
                  if not (want_header or want_selected):
                      return
                  f = tf.extractfile(member)
                  if f is None:
                      return
                  data = f.read()
                  if want_header:
                      header_hashes[name] = sha_bytes(data)
                  if want_selected:
                      selected_hashes[name] = sha_bytes(data)
                      dst = extract_dir / pathlib.Path(name).name
                      dst.write_bytes(data)
              stream_tar(pkg_blob, handle_pkg)

              payload_paths = sorted(set(payload_paths))
              (root / f'{label}-payload-paths.txt').write_text('\n'.join(payload_paths) + '\n')
              (root / f'{label}-header-manifest.json').write_text(json.dumps(header_hashes, indent=2, sort_keys=True) + '\n')
              (root / f'{label}-selected-binary-hashes.json').write_text(json.dumps(selected_hashes, indent=2, sort_keys=True) + '\n')
              recipe_blob = info_text.get('info/recipe/meta.yaml', b'') + b'\n' + info_text.get('info/recipe/meta.yaml.template', b'')
              state[label] = {
                  'payload_paths': set(payload_paths),
                  'header_hashes': header_hashes,
                  'selected_hashes': selected_hashes,
                  'source_archive_members': source_archive_members,
                  'recipe_expected_mentions': recipe_blob.decode('utf-8', errors='replace').count(expected_source),
                  'recipe_build_sh_sha256': sha_bytes(info_text.get('info/recipe/build.sh', b'')),
                  'recipe_meta_sha256': sha_bytes(info_text.get('info/recipe/meta.yaml', b'')),
              }

          a, b = state['build0'], state['pinned']
          common_headers = set(a['header_hashes']) & set(b['header_hashes'])
          identical_headers = sorted(k for k in common_headers if a['header_hashes'][k] == b['header_hashes'][k])
          changed_headers = sorted(k for k in common_headers if a['header_hashes'][k] != b['header_hashes'][k])
          only_a_headers = sorted(set(a['header_hashes']) - set(b['header_hashes']))
          only_b_headers = sorted(set(b['header_hashes']) - set(a['header_hashes']))
          only_a_paths = sorted(a['payload_paths'] - b['payload_paths'])
          only_b_paths = sorted(b['payload_paths'] - a['payload_paths'])
          (root / 'header-comparison.json').write_text(json.dumps({
              'common': len(common_headers), 'identical': len(identical_headers),
              'changed': changed_headers, 'only_build0': only_a_headers, 'only_pinned': only_b_headers,
          }, indent=2, sort_keys=True) + '\n')
          (root / 'payload-only-build0.txt').write_text('\n'.join(only_a_paths) + ('\n' if only_a_paths else ''))
          (root / 'payload-only-pinned.txt').write_text('\n'.join(only_b_paths) + ('\n' if only_b_paths else ''))

          def run_tool(args, out_path):
              try:
                  cp = subprocess.run(args, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, check=False, timeout=120)
                  pathlib.Path(out_path).write_text(cp.stdout)
                  return cp.returncode
              except Exception as exc:
                  pathlib.Path(out_path).write_text(f'ERROR: {exc}\n')
                  return 127

          symbol_sets = {}
          needed_sets = {}
          for label in labels:
              d = extracted_root / label
              symbol_sets[label] = {}
              for lib in ('libRadTran_c.a', 'libRadTran_f.a'):
                  p = d / lib
                  out = root / f'{label}-{lib}.nm.txt'
                  rc = run_tool(['nm', '-g', '--defined-only', str(p)], out) if p.exists() else 127
                  symbols = set()
                  if out.exists():
                      for line in out.read_text(errors='replace').splitlines():
                          parts = line.split()
                          if rc == 0 and parts and not line.endswith(':'):
                              symbols.add(parts[-1])
                  symbol_sets[label][lib] = symbols
              uvspec = d / 'uvspec'
              dyn = root / f'{label}-uvspec-readelf-dynamic.txt'
              rc = run_tool(['readelf', '-d', str(uvspec)], dyn) if uvspec.exists() else 127
              needed = set()
              if dyn.exists():
                  for line in dyn.read_text(errors='replace').splitlines():
                      if '(NEEDED)' in line:
                          needed.add(line.strip())
              needed_sets[label] = needed

          symbol_comparison = {}
          for lib in ('libRadTran_c.a', 'libRadTran_f.a'):
              sa, sb = symbol_sets['build0'][lib], symbol_sets['pinned'][lib]
              symbol_comparison[lib] = {
                  'build0_count': len(sa), 'pinned_count': len(sb),
                  'common_count': len(sa & sb),
                  'only_build0_count': len(sa - sb), 'only_pinned_count': len(sb - sa),
                  'only_build0': sorted(sa - sb)[:200], 'only_pinned': sorted(sb - sa)[:200],
              }
          (root / 'static-library-symbol-comparison.json').write_text(json.dumps(symbol_comparison, indent=2, sort_keys=True) + '\n')

          with pathlib.Path(report_name).open('a') as fh:
              for label in ('build0', 'pinned'):
                  s = state[label]
                  fh.write(f'{label}_payload_path_count={len(s["payload_paths"])}\n')
                  fh.write(f'{label}_header_count={len(s["header_hashes"])}\n')
                  fh.write(f'{label}_source_archive_payload_count={len(s["source_archive_members"])}\n')
                  fh.write(f'{label}_recipe_expected_source_mentions={s["recipe_expected_mentions"]}\n')
                  fh.write(f'{label}_recipe_meta_sha256={s["recipe_meta_sha256"]}\n')
                  fh.write(f'{label}_recipe_build_sh_sha256={s["recipe_build_sh_sha256"]}\n')
                  for name, digest in sorted(s['selected_hashes'].items()):
                      fh.write(f'{label}_selected_sha256={name}|{digest}\n')
              fh.write(f'common_header_count={len(common_headers)}\n')
              fh.write(f'identical_header_count={len(identical_headers)}\n')
              fh.write(f'changed_header_count={len(changed_headers)}\n')
              fh.write(f'only_build0_header_count={len(only_a_headers)}\n')
              fh.write(f'only_pinned_header_count={len(only_b_headers)}\n')
              fh.write(f'payload_path_only_build0_count={len(only_a_paths)}\n')
              fh.write(f'payload_path_only_pinned_count={len(only_b_paths)}\n')
              fh.write(f'uvspec_needed_lines_identical={"YES" if needed_sets["build0"] == needed_sets["pinned"] else "NO"}\n')
              for lib, comp in symbol_comparison.items():
                  fh.write(f'{lib}_symbol_build0_count={comp["build0_count"]}\n')
                  fh.write(f'{lib}_symbol_pinned_count={comp["pinned_count"]}\n')
                  fh.write(f'{lib}_symbol_common_count={comp["common_count"]}\n')
                  fh.write(f'{lib}_symbol_only_build0_count={comp["only_build0_count"]}\n')
                  fh.write(f'{lib}_symbol_only_pinned_count={comp["only_pinned_count"]}\n')
          PY

          rm -rf out/raw out/extracted
          cat "$REPORT"
          echo '--- header comparison ---'
          cat out/header-comparison.json
          echo '--- static library symbol comparison ---'
          cat out/static-library-symbol-comparison.json
          echo '--- build0-only payload paths ---'
          cat out/payload-only-build0.txt
          echo '--- pinned-only payload paths ---'
          cat out/payload-only-pinned.txt

      - name: Upload immutable reconstruction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-exact-package-reconstruction-v6
          path: |
            out/exact-package-reconstruction-v6.txt
            out/*-repodata-record.json
            out/*-info__recipe__meta.yaml
            out/*-info__recipe__meta.yaml.template
            out/*-info__recipe__build.sh
            out/*-header-manifest.json
            out/*-selected-binary-hashes.json
            out/header-comparison.json
            out/payload-only-build0.txt
            out/payload-only-pinned.txt
            out/static-library-symbol-comparison.json
            out/*-uvspec-readelf-dynamic.txt
            out/*-libRadTran_c.a.nm.txt
            out/*-libRadTran_f.a.nm.txt
          if-no-files-found: warn
          retention-days: 90
