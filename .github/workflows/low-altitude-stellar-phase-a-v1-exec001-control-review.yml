name: Low-altitude stellar Phase-A exec001 control review

on:
  pull_request:
    paths:
      - 'review/low-altitude-stellar-transport-v1/run_phase_a_exec001.py'
      - 'tests/test_low_altitude_stellar_phase_a_exec001_control.py'
      - '.github/workflows/low-altitude-stellar-phase-a-v1-exec001-control-review.yml'
      - '.github/workflows/low-altitude-stellar-phase-a-v1-exec001-one-shot.yml'

permissions:
  contents: read

jobs:
  no-solver-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run execution-control tests without libRadtran
        run: python -m unittest -v tests/test_low_altitude_stellar_phase_a_exec001_control.py tests/test_low_altitude_stellar_transport_preexecution_v1.py
      - name: Static one-shot boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'EXPECTED_INVOCATIONS = 28' review/low-altitude-stellar-transport-v1/run_phase_a_exec001.py
          grep -q 'githubRerunPermitted.*False' review/low-altitude-stellar-transport-v1/run_phase_a_exec001.py
          grep -q 'solverRetryPermitted.*False' review/low-altitude-stellar-transport-v1/run_phase_a_exec001.py
          grep -q 'protectedRepresentationValidationOpened.*False' review/low-altitude-stellar-transport-v1/run_phase_a_exec001.py
          ! grep -R -n -E 'Taylor|Jerusalem|halachic|first-seeing' review/low-altitude-stellar-transport-v1/run_phase_a_exec001.py
