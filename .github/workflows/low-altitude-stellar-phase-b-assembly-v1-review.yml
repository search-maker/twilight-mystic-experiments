name: Low-altitude stellar Phase-B assembly v1 review

on:
  pull_request:
    paths:
      - 'review/low-altitude-stellar-transport-v1/assemble_phase_b_training_candidate_v1.py'
      - 'tests/test_low_altitude_stellar_phase_b_assembly_v1.py'
      - '.github/workflows/low-altitude-stellar-phase-b-assembly-v1-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assembly-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run assembly contract tests
        run: python -m unittest -v tests/test_low_altitude_stellar_phase_b_assembly_v1.py tests/test_low_altitude_stellar_phase_b_v1.py
      - name: Verify closed validation boundary
        shell: bash
        run: |
          set -euo pipefail
          FILE=review/low-altitude-stellar-transport-v1/assemble_phase_b_training_candidate_v1.py
          ! grep -n 'build_protected_cases()' "$FILE"
          ! grep -n 'evaluate_protected_deltas(' "$FILE"
          grep -q 'SOURCE_V32_RUNTIME_SHA256' "$FILE"
          grep -q 'exactFiveDegreeSeamContentIdentical' "$FILE"
          grep -q 'protectedValidationAuthorized.*False' "$FILE"
          grep -q 'minimumScientificallySupportedGeometricAltitudeDeg.*None' "$FILE"
      - name: Verify authoritative v3.2 bytes
        run: test "$(sha256sum generated/level-b-stellar-v32/stellar-transport-v32-zenith-lut.json | cut -d' ' -f1)" = '0b96bd5868dc0c72d5cd77b504098d35086feaf573d92556c4f8311a163e3ce2'
