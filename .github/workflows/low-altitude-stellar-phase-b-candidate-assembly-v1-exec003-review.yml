name: Low-altitude stellar Phase-B candidate assembly v1 exec003 review

on:
  pull_request:
    paths:
      - 'review/low-altitude-stellar-transport-v1/assemble_phase_b_training_candidate_v1_exec003.py'
      - '.github/workflows/low-altitude-stellar-phase-b-candidate-assembly-v1-exec003-review.yml'
      - '.github/workflows/low-altitude-stellar-phase-b-candidate-assembly-v1-exec003-one-shot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-solver-free-exec003-assembly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prove frozen STATE-0001 assembly science remains byte-identical
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:review/low-altitude-stellar-transport-v1/assemble_phase_b_training_candidate_v1.py)" = "291d3cb12f7431249fd36489b9c5c46f4867df04"
          test "$(git rev-parse HEAD:review/low-altitude-stellar-transport-v1/low_altitude_phase_b.py)" = "3577da2a64ddc549b81f806d8960120af6dc1a6a"

      - name: Re-run frozen solver-free assembly and Phase-B tests
        run: python -m unittest -v tests/test_low_altitude_stellar_phase_b_assembly_v1.py tests/test_low_altitude_stellar_phase_b_v1.py

      - name: Verify exec003 assembler is identity-only rebinding
        run: |
          python - <<'PY'
          import importlib.util, pathlib
          p=pathlib.Path('review/low-altitude-stellar-transport-v1/assemble_phase_b_training_candidate_v1_exec003.py')
          s=importlib.util.spec_from_file_location('asm_exec003_review',p); m=importlib.util.module_from_spec(s); s.loader.exec_module(m)
          assert m.ORIGINAL_ASSEMBLY_ID=='low-altitude-stellar-phase-b-training-candidate-v1'
          assert m.ORIGINAL_TRAINING_EXECUTION_ID=='low-altitude-stellar-phase-b-training-v1-exec001'
          assert m.ASSEMBLY_ID=='low-altitude-stellar-phase-b-training-candidate-v1-exec003'
          assert m.TRAINING_EXECUTION_ID=='low-altitude-stellar-phase-b-training-v1-exec003'
          assert m.base.ASSEMBLY_ID==m.ASSEMBLY_ID
          assert m.base.TRAINING_EXECUTION_ID==m.TRAINING_EXECUTION_ID
          assert m.EXEC001_GOVERNANCE_INELIGIBLE is True
          assert m.EXEC002_GOVERNANCE_INELIGIBLE is True
          assert m.COORDINATOR_CORRECTION_ISSUE60_COMMENT_ID==5468736357
          assert m.EXEC002_CLASSIFICATION_ISSUE60_COMMENT_ID==5468770998
          PY

      - name: Verify wrapper cannot alter science or open protected validation
        shell: bash
        run: |
          set -euo pipefail
          P=review/low-altitude-stellar-transport-v1/assemble_phase_b_training_candidate_v1_exec003.py
          grep -Fq 'base.ASSEMBLY_ID = ASSEMBLY_ID' "$P"
          grep -Fq 'base.TRAINING_EXECUTION_ID = TRAINING_EXECUTION_ID' "$P"
          ! grep -n -E 'build_protected_cases|evaluate_protected_deltas|interpolate_lower_tau|rte_solver|uvspec|sdisort|cosecant|csc' "$P"

      - name: Verify one-shot assembly source binding and branch-creation safety
        shell: bash
        run: |
          set -euo pipefail
          W=.github/workflows/low-altitude-stellar-phase-b-candidate-assembly-v1-exec003-one-shot.yml
          grep -Fq 'dispatch/low-altitude-stellar-phase-b-candidate-assembly-v1-exec003' "$W"
          grep -Fq 'phase-b-candidate-assembly-v1-exec003-dispatch.json' "$W"
          grep -Fq 'github.event.created == false' "$W"
          grep -Fq 'github.event.deleted == false' "$W"
          grep -Fq "SOURCE_RUN_ID: '33312698195'" "$W"
          grep -Fq "SOURCE_JOB_ID: '99260484227'" "$W"
          grep -Fq "SOURCE_ARTIFACT_NAME: 'low-altitude-stellar-phase-b-training-v1-exec003-result'" "$W"
          grep -Fq "SOURCE_DISPATCH_SHA: 'b72a8a9bf625e49e78fd5631b22957bf6025cd78'" "$W"
          grep -Fq "SOURCE_V32_RUNTIME_SHA256: '0b96bd5868dc0c72d5cd77b504098d35086feaf573d92556c4f8311a163e3ce2'" "$W"
          grep -Fq "'trainingExecutionId':'low-altitude-stellar-phase-b-training-v1-exec003'" "$W"
          grep -Fq "'protectedValidationAuthorized':False" "$W"
          grep -Fq "'scientificSolverExecutionAuthorized':False" "$W"
          grep -Fq "'postResultRetuningAuthorized':False" "$W"
          grep -Fq "'branchCreationExecutionAllowed':False" "$W"
          grep -Fq 'test -z "$(command -v uvspec || true)"' "$W"
          ! grep -q 'workflow_dispatch' "$W"
          ! grep -q 'pull_request:' "$W"

      - name: Verify exact seam and claim-boundary assertions are retained
        shell: bash
        run: |
          set -euo pipefail
          W=.github/workflows/low-altitude-stellar-phase-b-candidate-assembly-v1-exec003-one-shot.yml
          grep -Fq 'sha256sum generated/level-b-stellar-v32/stellar-transport-v32-zenith-lut.json' "$W"
          grep -Fq "receipt['exactFiveDegreeSeamContentIdentical'] is True" "$W"
          grep -Fq "receipt['minimumScientificallySupportedGeometricAltitudeDeg'] is None" "$W"
          grep -Fq "receipt['scientificallyValidatedBelow5Deg'] is False" "$W"
          grep -Fq "receipt['productionAuthorized'] is False" "$W"
          grep -Fq "receipt['applicationSupportChanged'] is False" "$W"
