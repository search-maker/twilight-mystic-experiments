name: Low-altitude stellar Phase-B candidate assembly v1 review

on:
  pull_request:
    paths:
      - '.github/workflows/low-altitude-stellar-phase-b-candidate-assembly-v1-one-shot.yml'
      - '.github/workflows/low-altitude-stellar-phase-b-candidate-assembly-v1-review.yml'
      - 'tests/test_low_altitude_stellar_phase_b_candidate_assembly_workflow_v1.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solver-free-assembly-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run candidate assembly workflow contract tests
        run: python -m unittest -v tests/test_low_altitude_stellar_phase_b_candidate_assembly_workflow_v1.py tests/test_low_altitude_stellar_phase_b_assembly_v1.py tests/test_low_altitude_stellar_phase_b_v1.py
      - name: Prove one-shot assembly contains no solver path
        shell: bash
        run: |
          set -euo pipefail
          FILE=.github/workflows/low-altitude-stellar-phase-b-candidate-assembly-v1-one-shot.yml
          ! grep -n -E 'rte_solver|uvspec --|micromamba|conda install|mc_photons' "$FILE"
          ! grep -n -E 'Taylor|Jerusalem|first-seeing|halachic' "$FILE"
          grep -q 'test "$GITHUB_RUN_ATTEMPT" = 1' "$FILE"
          grep -q 'protectedValidationAuthorized' "$FILE"
          grep -q 'scientificSolverExecutionAuthorized' "$FILE"
          grep -q 'trainingScientificallyEligible' "$FILE"
          grep -q 'exactFiveDegreeSeamContentIdentical' "$FILE"
          grep -q 'minimumScientificallySupportedGeometricAltitudeDeg' "$FILE"
          ! grep -q 'workflow_dispatch:' "$FILE"
