name: Low-altitude stellar Phase-B protected one-shot v1 review

on:
  pull_request:
    paths:
      - '.github/workflows/low-altitude-stellar-phase-b-protected-validation-v1-one-shot.yml'
      - '.github/workflows/low-altitude-stellar-phase-b-protected-validation-v1-one-shot-review.yml'
      - 'tests/test_low_altitude_stellar_phase_b_protected_one_shot_v1.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protected-one-shot-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run protected workflow plus frozen controller contracts
        run: python -m unittest -v tests/test_low_altitude_stellar_phase_b_protected_one_shot_v1.py tests/test_low_altitude_stellar_phase_b_protected_validation_v1.py tests/test_low_altitude_stellar_phase_b_v1.py
      - name: Verify exact candidate and one-shot refusal surface
        shell: bash
        run: |
          set -euo pipefail
          FILE=.github/workflows/low-altitude-stellar-phase-b-protected-validation-v1-one-shot.yml
          grep -q "CANDIDATE_RUNTIME_SHA256: '2ab71a13dee10374d7ebba854bd46cedb61e77d293d0d24804ea75dcd2a33ea3'" "$FILE"
          grep -q "CANDIDATE_ARTIFACT_ID: '9732025874'" "$FILE"
          grep -q "CANDIDATE_ARTIFACT_DIGEST: 'sha256:ce499746ee929bbd5800c70dce56004068bf6d17f964d332dabe306f5bed17a8'" "$FILE"
          grep -q 'test "$GITHUB_RUN_ATTEMPT" = 1' "$FILE"
          grep -q "'protectedAtmosphericSpectrumCount':176" "$FILE"
          grep -q "'protectedJohnsonVComparisonCount':528" "$FILE"
          grep -q "'postResultFloorBackSelectionAuthorized':False" "$FILE"
          grep -q "'positiveEpsilonSubstitutionAllowed':False" "$FILE"
          grep -q "'taylorOrJerusalemUsed':False" "$FILE"
          ! grep -q 'workflow_dispatch:' "$FILE"
          ! grep -n -E 'AnnArbor.csv|Taylor residual|Jerusalem residual|first-seeing|halachic' "$FILE"
