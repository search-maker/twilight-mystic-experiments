name: Low-altitude stellar Phase-B protected validation v1 review

on:
  pull_request:
    paths:
      - 'review/low-altitude-stellar-transport-v1/run_phase_b_protected_validation_v1.py'
      - 'tests/test_low_altitude_stellar_phase_b_protected_validation_v1.py'
      - '.github/workflows/low-altitude-stellar-phase-b-protected-validation-v1-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protected-review-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen protected-matrix tests
        run: python -m unittest -v tests/test_low_altitude_stellar_phase_b_protected_validation_v1.py tests/test_low_altitude_stellar_phase_b_v1.py
      - name: Emit review-only ledger
        run: |
          python review/low-altitude-stellar-transport-v1/run_phase_b_protected_validation_v1.py --emit-ledger > /tmp/protected-ledger.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/protected-ledger.json'))
          assert d['scientificState']=='LOWALT-STELLAR-STATE-0001'
          assert d['protectedAtmosphericSpectrumCount']==176
          assert d['protectedJohnsonVComparisonCount']==528
          assert d['representativeLibraryNumbers']==[1,26,45]
          assert d['maxAbsDeltaAvMagLimit']==0.025
          assert d['rmsDeltaAvMagLimit']==0.010
          assert d['globalAndEveryAltitudeIntervalMustPass'] is True
          assert d['candidateShaMustBeBoundBeforeExecution'] is True
          assert d['postResultFloorBackSelectionAuthorized'] is False
          assert d['positiveEpsilonSubstitutionAllowed'] is False
          assert d['scientificExecutionAuthorizedByModule'] is False
          assert d['productionAuthorized'] is False
          PY
      - name: Verify anti-fitting and fresh-matrix boundary
        shell: bash
        run: |
          set -euo pipefail
          FILE=review/low-altitude-stellar-transport-v1/run_phase_b_protected_validation_v1.py
          ! grep -n 'MYSTIC-STATE-0077' "$FILE"
          ! grep -n -E 'Taylor|Jerusalem|first-seeing|halachic' "$FILE"
          grep -q 'build_protected_cases()' "$FILE"
          grep -q 'evaluate_protected_deltas' "$FILE"
          grep -q 'expected_candidate_sha256' "$FILE"
          grep -q 'retry/resume is forbidden' "$FILE"
          grep -q 'NUMERICALLY_UNRESOLVED' "$FILE"
          grep -q 'postResultFloorBackSelectionAuthorized' "$FILE"
