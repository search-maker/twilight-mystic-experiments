name: Low-altitude stellar Phase-B training v1 review

on:
  pull_request:
    paths:
      - 'review/low-altitude-stellar-transport-v1/run_phase_b_training_v1.py'
      - 'tests/test_low_altitude_stellar_phase_b_training_v1.py'
      - '.github/workflows/low-altitude-stellar-phase-b-training-v1-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-control-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen training-control tests without solver
        run: python -m unittest -v tests/test_low_altitude_stellar_phase_b_training_v1.py tests/test_low_altitude_stellar_phase_b_v1.py
      - name: Verify training-only and protected-closed surface
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'EXPECTED_INVOCATIONS = phase_b.EXPECTED_TRAINING_SPECTRA' review/low-altitude-stellar-transport-v1/run_phase_b_training_v1.py
          grep -q 'protectedSolverInvocationCount' review/low-altitude-stellar-transport-v1/run_phase_b_training_v1.py
          ! grep -n 'build_protected_cases()' review/low-altitude-stellar-transport-v1/run_phase_b_training_v1.py
          ! grep -n 'evaluate_protected_deltas(' review/low-altitude-stellar-transport-v1/run_phase_b_training_v1.py
          ! grep -n -E 'Taylor|Jerusalem|first-seeing|halachic' review/low-altitude-stellar-transport-v1/run_phase_b_training_v1.py
      - name: Verify execution requires explicit one-shot gate
        shell: bash
        run: |
          set -euo pipefail
          grep -q -- '--execute' review/low-altitude-stellar-transport-v1/run_phase_b_training_v1.py
          grep -q -- '--allow-execution' review/low-altitude-stellar-transport-v1/run_phase_b_training_v1.py
          grep -q 'output directory already exists; retry/resume forbidden' review/low-altitude-stellar-transport-v1/run_phase_b_training_v1.py
          grep -q 'positiveEpsilonSubstitutionUsed' review/low-altitude-stellar-transport-v1/run_phase_b_training_v1.py
