name: Low-altitude stellar Phase-B v1 review

on:
  pull_request:
    paths:
      - 'review/low-altitude-stellar-transport-v1/low_altitude_phase_b.py'
      - 'tests/test_low_altitude_stellar_phase_b_v1.py'
      - '.github/workflows/low-altitude-stellar-phase-b-v1-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solver-free-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove no scientific solver execution surface
        shell: bash
        run: |
          set -euo pipefail
          ! grep -n -E 'subprocess\.|Popen\(|os\.system|--execute|allow_execution' review/low-altitude-stellar-transport-v1/low_altitude_phase_b.py
          ! grep -n -E 'Taylor|Jerusalem|first-seeing|halachic' review/low-altitude-stellar-transport-v1/low_altitude_phase_b.py
          ! grep -n -E 'rte_solver|uvspec|MYSTIC|mc_photons' review/low-altitude-stellar-transport-v1/low_altitude_phase_b.py
      - name: Run exact frozen Phase-B contract tests
        run: python -m unittest -v tests/test_low_altitude_stellar_phase_b_v1.py
      - name: Emit and verify deterministic review ledger
        run: |
          python review/low-altitude-stellar-transport-v1/low_altitude_phase_b.py --emit-ledger > /tmp/phase-b-ledger.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/phase-b-ledger.json', encoding='utf-8'))
          assert d['scientificState']=='LOWALT-STELLAR-STATE-0001'
          assert d['counts']=={
            'freshTrainingSpectra':275,
            'inheritedFiveDegreeSeamSpectra':25,
            'protectedJohnsonVComparisons':528,
            'protectedSpectra':176,
          }
          assert d['representation']['targetAltitudeCoordinate']=='identity-geometric-altitude-deg'
          assert d['representation']['cscExtrapolationBelow5Deg'] is False
          assert d['routing']['lowerCandidateIntervalDeg']=='[0.25,5)'
          assert d['routing']['exactFiveAndAboveProvider']=='authoritative-v3.2'
          assert d['routing']['exactHorizonSupported'] is False
          assert d['failureSemantics']['epsilonSubstitutionAllowed'] is False
          assert d['solverExecutionAuthorized'] is False
          assert d['protectedResultsOpened'] is False
          assert d['productionAuthorized'] is False
          print('LOW_ALTITUDE_PHASE_B_REVIEW_PASS', d['ledgerSha256'])
          PY
