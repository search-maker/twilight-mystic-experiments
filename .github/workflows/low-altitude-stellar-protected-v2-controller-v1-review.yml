name: Low-altitude stellar protected v2 controller review

on:
  pull_request:
    paths:
      - 'review/low-altitude-stellar-transport-v1/run_protected_v2_validation_v1.py'
      - 'review/low-altitude-stellar-transport-v1/protected_v2_fresh_matrix.py'
      - 'tests/test_low_altitude_stellar_protected_v2_validation_v1.py'
      - '.github/workflows/low-altitude-stellar-protected-v2-controller-v1-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run fresh protected-v2 controller contracts
        run: |
          python -m unittest -v \
            tests/test_low_altitude_stellar_protected_v2_validation_v1.py \
            tests/test_low_altitude_stellar_protected_v2_fresh_matrix.py \
            tests/test_low_altitude_stellar_phase_b_v1.py
      - name: Emit and bind review-only ledger
        shell: bash
        run: |
          set -euo pipefail
          C=review/low-altitude-stellar-transport-v1/run_protected_v2_validation_v1.py
          python "$C" --emit-ledger > /tmp/lowalt-protected-v2-controller-ledger.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/lowalt-protected-v2-controller-ledger.json'))
          assert d['scientificState']=='LOWALT-STELLAR-STATE-0001'
          assert d['protocolId']=='low-altitude-stellar-protected-v2-fresh-cell-centers'
          assert d['candidateTrainingExecutionId']=='low-altitude-stellar-phase-b-training-v1-exec003'
          assert d['candidateAssemblyId']=='low-altitude-stellar-phase-b-training-candidate-v1-exec003'
          assert d['candidateRuntimeSha256']=='4730c4404ef4ee93c07930f5fe8eb391f117cdc84f2c9eff49c5e7ee9f73b72e'
          assert d['candidateSourceRunId']==33313239384
          assert d['candidateArtifactId']==9732635873
          assert d['protectedAtmosphericSpectrumCount']==176
          assert d['protectedJohnsonVComparisonCount']==528
          assert d['protectedAltitudeDeg']==[0.375,0.625,0.875,1.25,1.75,2.25,2.75,3.25,3.75,4.25,4.75]
          assert d['maxAbsDeltaAvMagLimit']==0.025
          assert d['rmsDeltaAvMagLimit']==0.010
          assert d['globalAndEveryAltitudeCellCenterMustPass'] is True
          assert d['targetAltitudeBasis']=='topocentric-vacuum-geometric'
          assert d['refractionAppliedInRadiativeTransfer'] is False
          assert d['positiveEpsilonSubstitutionAllowed'] is False
          assert d['githubRerunPermitted'] is False
          assert d['postResultFloorBackSelectionAuthorized'] is False
          assert d['protectedResultsOpenedByReview'] is False
          assert d['applicationSupportChanged'] is False
          assert d['productionAuthorized'] is False
          assert d['inadmissibleExec001NumericalResultsUsed'] is False
          assert d['mysticState0077ResidualsUsed'] is False
          assert d['taylorOrJerusalemUsed'] is False
          PY
      - name: Verify review cannot open results or drift to old candidate
        shell: bash
        run: |
          set -euo pipefail
          C=review/low-altitude-stellar-transport-v1/run_protected_v2_validation_v1.py
          ! grep -n '33311205702\|9732025874\|2ab71a13dee10374d7ebba854bd46cedb61e77d293d0d24804ea75dcd2a33ea3' "$C"
          ! grep -n '0\.34375\|0\.59375\|0\.84375\|4\.6875' "$C"
          ! grep -n -E 'Taylor residual|Jerusalem residual|first-seeing|halachic' "$C"
          grep -q 'EXPECTED_TRAINING_EXECUTION_ID = "low-altitude-stellar-phase-b-training-v1-exec003"' "$C"
          grep -q 'EXPECTED_CANDIDATE_RUNTIME_SHA256 = "4730c4404ef4ee93c07930f5fe8eb391f117cdc84f2c9eff49c5e7ee9f73b72e"' "$C"
          grep -q 'sza {90.0 - h:.8f}' "$C"
          grep -q 'rte_solver sdisort' "$C"
          grep -q 'NUMERICALLY_UNRESOLVED direct transmission' "$C"
          grep -q 'postResultFloorBackSelectionAuthorized' "$C"
          grep -q 'positiveEpsilonSubstitutionAllowed' "$C"
