name: Low-altitude stellar fresh protected v2 matrix review

on:
  pull_request:
    paths:
      - 'review/low-altitude-stellar-transport-v1/protected_v2_fresh_matrix.py'
      - 'tests/test_low_altitude_stellar_protected_v2_fresh_matrix.py'
      - '.github/workflows/low-altitude-stellar-protected-v2-fresh-matrix-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-result-blind-fresh-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prove frozen training/representation contract is untouched
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:review/low-altitude-stellar-transport-v1/low_altitude_phase_b.py)" = "3577da2a64ddc549b81f806d8960120af6dc1a6a"
          test "$(git rev-parse HEAD:review/low-altitude-stellar-transport-v1/run_phase_b_training_v1.py)" = "eb83fffaddc9bcb441ad1362f044ddaef082b222"

      - name: Run fresh-matrix and inherited Phase-B tests
        run: |
          python -m unittest -v \
            tests/test_low_altitude_stellar_protected_v2_fresh_matrix.py \
            tests/test_low_altitude_stellar_phase_b_v1.py

      - name: Emit and verify deterministic result-blind ledger
        shell: bash
        run: |
          set -euo pipefail
          python review/low-altitude-stellar-transport-v1/protected_v2_fresh_matrix.py --emit-ledger > /tmp/fresh-protected-v2-ledger.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/fresh-protected-v2-ledger.json',encoding='utf-8'))
          assert d['protocolId']=='low-altitude-stellar-protected-v2-fresh-cell-centers'
          assert d['scientificState']=='LOWALT-STELLAR-STATE-0001'
          assert d['coordinatorCorrectionIssue60CommentId']==5468736357
          assert d['matrixSelectionBasis']=='exact-geometric-center-of-every-frozen-trilinear-interpolation-cell'
          assert d['protectedResidualsUsedForMatrixSelection'] is False
          assert d['inadmissibleV1NumericalResultsUsed'] is False
          assert d['mysticState0077ResidualsUsed'] is False
          assert d['taylorOrJerusalemUsed'] is False
          assert d['protectedSolverExecutionAuthorized'] is False
          assert d['protectedResultsOpened'] is False
          assert d['trainingOrRepresentationChanged'] is False
          assert d['targetAltitudeBasis']=='topocentric-vacuum-geometric'
          assert d['refractionAppliedInRadiativeTransfer'] is False
          assert d['axes']['targetGeometricAltitudeDeg']==[0.375,0.625,0.875,1.25,1.75,2.25,2.75,3.25,3.75,4.25,4.75]
          assert d['axes']['observerElevationM']==[250.0,875.0,1625.0,2250.0]
          assert d['axes']['aod550']==[0.075,0.15,0.25,0.35]
          assert d['counts']['freshProtectedAtmosphericSpectra']==176
          assert d['counts']['freshProtectedJohnsonVComparisons']==528
          assert d['representativeLibraryNumbers']==[1,26,45]
          assert d['acceptance']['maxAbsDeltaAvMag']==0.025
          assert d['acceptance']['rmsDeltaAvMag']==0.010
          assert d['acceptance']['globalAndEveryAltitudeCellCenterMustPass'] is True
          assert d['acceptance']['postResultFloorBackSelectionAuthorized'] is False
          assert d['seamRequirement']['exactFiveDegreeContentIdentityRequired'] is True
          assert d['seamRequirement']['exactFiveDegreeProvider']=='authoritative-v3.2'
          assert d['claimBoundary']['minimumSupportedGeometricAltitudeIfPassDeg']==0.25
          assert d['claimBoundary']['exactHorizonSupported'] is False
          assert d['failureSemantics']['zeroOrUnderflowDirectTransmission']=='TERMINAL_REFUSAL'
          assert d['failureSemantics']['positiveEpsilonSubstitutionAllowed'] is False
          assert d['failureSemantics']['sameIdentityRetryAllowed'] is False
          assert d['failureSemantics']['githubRerunAllowed'] is False
          PY

      - name: Prove review surface cannot execute or inspect protected science
        shell: bash
        run: |
          set -euo pipefail
          P=review/low-altitude-stellar-transport-v1/protected_v2_fresh_matrix.py
          ! grep -n -E 'subprocess|uvspec|rte_solver|sdisort|--execute|candidateRuntimeSha256|runtimeAvMag|referenceAvMag' "$P"
          ! grep -n -E 'maxErrorObserved|rmsObserved|protectedArtifact|Taylor|Jerusalem|halachic|first-seeing' "$P"
          grep -Fq 'protectedResidualsUsedForMatrixSelection": False' "$P"
          grep -Fq 'inadmissibleV1NumericalResultsUsed": False' "$P"
