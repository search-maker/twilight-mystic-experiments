name: Low-altitude stellar protected v2 one-shot v1 review

on:
  pull_request:
    paths:
      - '.github/workflows/low-altitude-stellar-protected-v2-validation-v1-one-shot.yml'
      - '.github/workflows/low-altitude-stellar-protected-v2-one-shot-v1-review.yml'
      - 'tests/test_low_altitude_stellar_protected_v2_one_shot_v1.py'
      - 'review/low-altitude-stellar-transport-v1/run_protected_v2_validation_v1.py'
      - 'review/low-altitude-stellar-transport-v1/protected_v2_fresh_matrix.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run fresh protected-v2 workflow and controller contracts
        run: |
          python -m unittest -v \
            tests/test_low_altitude_stellar_protected_v2_one_shot_v1.py \
            tests/test_low_altitude_stellar_protected_v2_validation_v1.py \
            tests/test_low_altitude_stellar_protected_v2_fresh_matrix.py \
            tests/test_low_altitude_stellar_phase_b_v1.py
      - name: Prove review is solver-free and bound to fresh identities
        shell: bash
        run: |
          set -euo pipefail
          FILE=.github/workflows/low-altitude-stellar-protected-v2-validation-v1-one-shot.yml
          grep -q "CANDIDATE_SOURCE_RUN_ID: '33313239384'" "$FILE"
          grep -q "CANDIDATE_ARTIFACT_ID: '9732635873'" "$FILE"
          grep -q 'CANDIDATE_RUNTIME_SHA256: 4730c4404ef4ee93c07930f5fe8eb391f117cdc84f2c9eff49c5e7ee9f73b72e' "$FILE"
          grep -q 'PROTOCOL_ID: low-altitude-stellar-protected-v2-fresh-cell-centers' "$FILE"
          grep -q 'test "$GITHUB_RUN_ATTEMPT" = 1' "$FILE"
          grep -q "'protectedAtmosphericSpectrumCount':176" "$FILE"
          grep -q "'protectedJohnsonVComparisonCount':528" "$FILE"
          grep -q "assert d\['globalAndEveryAltitudeCellCenterMustPass'\] is True" "$FILE"
          grep -q "'positiveEpsilonSubstitutionAllowed':False" "$FILE"
          grep -q "'postResultFloorBackSelectionAuthorized':False" "$FILE"
          grep -q "'mysticState0077ResidualsUsed':False" "$FILE"
          grep -q "'inadmissibleExec001NumericalResultsUsed':False" "$FILE"
          ! grep -q 'workflow_dispatch:' "$FILE"
          ! grep -n -E '33310723749|33311205702|33311467254|9732025874|2ab71a13dee10374d7ebba854bd46cedb61e77d293d0d24804ea75dcd2a33ea3' "$FILE"
          ! grep -n -E '0\.34375|0\.59375|0\.84375|4\.6875' "$FILE"
          ! grep -n -E 'AnnArbor.csv|Taylor residual|Jerusalem residual|first-seeing|halachic' "$FILE"
          test -z "$(command -v uvspec || true)"
      - name: Emit review-only controller ledger
        run: |
          python review/low-altitude-stellar-transport-v1/run_protected_v2_validation_v1.py --emit-ledger > /tmp/ledger.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/ledger.json'))
          assert d['protocolId']=='low-altitude-stellar-protected-v2-fresh-cell-centers'
          assert d['candidateTrainingExecutionId']=='low-altitude-stellar-phase-b-training-v1-exec003'
          assert d['candidateRuntimeSha256']=='4730c4404ef4ee93c07930f5fe8eb391f117cdc84f2c9eff49c5e7ee9f73b72e'
          assert d['protectedResultsOpenedByReview'] is False
          assert d['scientificExecutionAuthorizedByModule'] is False
          assert d['productionAuthorized'] is False
          assert d['applicationSupportChanged'] is False
          PY
