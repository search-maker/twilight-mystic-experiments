name: Low-altitude stellar protected v2 validation v1 one-shot
run-name: Low-altitude stellar protected v2 validation v1 ${{ github.sha }}

on:
  push:
    branches:
      - dispatch/low-altitude-stellar-protected-v2-validation-v1-exec001
    paths:
      - review/low-altitude-stellar-transport-v1/protected-v2-validation-v1-dispatch.json

permissions:
  contents: read
  actions: read

concurrency:
  group: low-altitude-stellar-protected-v2-validation-v1-exec001-one-shot
  cancel-in-progress: false

env:
  STAGE_DIR: review/low-altitude-stellar-transport-v1
  DISPATCH_PATH: review/low-altitude-stellar-transport-v1/protected-v2-validation-v1-dispatch.json
  CONTROLLER: review/low-altitude-stellar-transport-v1/run_protected_v2_validation_v1.py
  PROTOCOL_ID: low-altitude-stellar-protected-v2-fresh-cell-centers
  CANDIDATE_SOURCE_RUN_ID: '33313239384'
  CANDIDATE_SOURCE_JOB_ID: '99261929321'
  CANDIDATE_ARTIFACT_NAME: low-altitude-stellar-phase-b-training-candidate-v1-exec003
  CANDIDATE_ARTIFACT_ID: '9732635873'
  CANDIDATE_ARTIFACT_DIGEST: 'sha256:f5049c22d5c4c793e4ee789b3e0e050969b132aeac714c8ccf17d7de264dbeec'
  CANDIDATE_SOURCE_DISPATCH_SHA: c723e3c4cf780d68148b8b9297e486596e33d6a5
  CANDIDATE_RUNTIME_SHA256: 4730c4404ef4ee93c07930f5fe8eb391f117cdc84f2c9eff49c5e7ee9f73b72e
  UVSPEC_SHA256: 2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3
  UVSPEC_HELP_SHA256: 868aea5af762d968f6f62c4e1472916d25232ed9cab5be112d753b0823d20548
  AFGLUS_SHA256: dab26290ed81c762ed0c607e5dc2d53393c1462a0c3a528bc5e3f5935191cfb5
  SED_SHA256: 85cbf41c86309b9d54d4765516167165f2d8736bcda8994337ef25d775ea11cb
  JOHNSON_V_SHA256: 51c357eb4cb3609361759f9750ad13ae13a901970913e3a5d87bb5c45ee2db9a

jobs:
  execute-protected-v2-once:
    if: ${{ github.event.created == false && github.event.deleted == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact fresh protected-v2 dispatch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify one-file fresh protected-v2 dispatch boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = dispatch/low-altitude-stellar-protected-v2-validation-v1-exec001
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import json, os
          e=json.load(open(os.environ['GITHUB_EVENT_PATH'],encoding='utf-8'))
          assert e.get('created') is False
          assert e.get('deleted') is False
          PY
          git fetch origin main
          mapfile -t PARENTS < <(git cat-file -p HEAD | sed -n 's/^parent //p')
          test "${#PARENTS[@]}" = 1
          PARENT="${PARENTS[0]}"
          test "$PARENT" = "$(git rev-parse origin/main)"
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = 1
          test "${CHANGED[0]}" = "$DISPATCH_PATH"
          python - <<'PY'
          import json, os, subprocess
          d=json.load(open(os.environ['DISPATCH_PATH'],encoding='utf-8'))
          parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          expected={
            'schemaVersion':1,
            'executionId':'low-altitude-stellar-protected-v2-validation-v1-exec001',
            'scientificState':'LOWALT-STELLAR-STATE-0001',
            'protocolId':os.environ['PROTOCOL_ID'],
            'status':'AUTHORIZED_FRESH_ONE_SHOT_PROTECTED_V2_VALIDATION',
            'baseMainSha':parent,
            'candidateSourceRunId':int(os.environ['CANDIDATE_SOURCE_RUN_ID']),
            'candidateSourceJobId':int(os.environ['CANDIDATE_SOURCE_JOB_ID']),
            'candidateArtifactName':os.environ['CANDIDATE_ARTIFACT_NAME'],
            'candidateArtifactId':int(os.environ['CANDIDATE_ARTIFACT_ID']),
            'candidateArtifactDigest':os.environ['CANDIDATE_ARTIFACT_DIGEST'],
            'candidateSourceDispatchSha':os.environ['CANDIDATE_SOURCE_DISPATCH_SHA'],
            'candidateRuntimeSha256':os.environ['CANDIDATE_RUNTIME_SHA256'],
            'protectedAtmosphericSpectrumCount':176,
            'protectedJohnsonVComparisonCount':528,
            'scientificExecutionAuthorized':True,
            'protectedValidationAuthorized':True,
            'solverExecutionAuthorized':True,
            'resultOpeningAuthorized':True,
            'githubRerunPermitted':False,
            'solverRetryPermitted':False,
            'solverResumePermitted':False,
            'positiveEpsilonSubstitutionAllowed':False,
            'postResultFloorBackSelectionAuthorized':False,
            'postResultRetuningAuthorized':False,
            'applicationSupportChanged':False,
            'productionAuthorized':False,
            'taylorOrJerusalemUsed':False,
            'mysticState0077ResidualsUsed':False,
            'inadmissibleExec001NumericalResultsUsed':False,
            'refractionAppliedInRadiativeTransfer':False,
          }
          for k,v in expected.items():
              if d.get(k)!=v: raise SystemExit(f'dispatch mismatch {k}: {d.get(k)!r} != {v!r}')
          assert d['protectedAltitudeDeg']==[0.375,0.625,0.875,1.25,1.75,2.25,2.75,3.25,3.75,4.25,4.75]
          assert d['protectedElevationM']==[250.0,875.0,1625.0,2250.0]
          assert d['protectedAod550']==[0.075,0.15,0.25,0.35]
          assert d['representativeLibraryNumbers']==[1,26,45]
          assert d['maxAbsDeltaAvMagLimit']==0.025
          assert d['rmsDeltaAvMagLimit']==0.010
          assert d['globalAndEveryAltitudeCellCenterMustPass'] is True
          assert d['minimumSupportedGeometricAltitudeIfPassDeg']==0.25
          assert d['exactHorizonSupported'] is False
          PY

      - name: Verify immutable admissible exec003 candidate metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT_ID" \
            > "$RUNNER_TEMP/candidate-artifact-metadata.json"
          python - <<'PY'
          import json, os
          p=json.load(open(os.environ['RUNNER_TEMP']+'/candidate-artifact-metadata.json'))
          assert int(p['id'])==int(os.environ['CANDIDATE_ARTIFACT_ID'])
          assert p['name']==os.environ['CANDIDATE_ARTIFACT_NAME']
          assert p['digest']==os.environ['CANDIDATE_ARTIFACT_DIGEST']
          assert int(p['workflow_run']['id'])==int(os.environ['CANDIDATE_SOURCE_RUN_ID'])
          assert p['workflow_run']['head_sha']==os.environ['CANDIDATE_SOURCE_DISPATCH_SHA']
          assert p['expired'] is False
          PY
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_SOURCE_RUN_ID" > "$RUNNER_TEMP/candidate-run.json"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/jobs/$CANDIDATE_SOURCE_JOB_ID" > "$RUNNER_TEMP/candidate-job.json"
          python - <<'PY'
          import json, os
          r=json.load(open(os.environ['RUNNER_TEMP']+'/candidate-run.json'))
          j=json.load(open(os.environ['RUNNER_TEMP']+'/candidate-job.json'))
          assert r['id']==int(os.environ['CANDIDATE_SOURCE_RUN_ID'])
          assert r['head_sha']==os.environ['CANDIDATE_SOURCE_DISPATCH_SHA']
          assert r['run_attempt']==1 and r['status']=='completed' and r['conclusion']=='success'
          assert j['id']==int(os.environ['CANDIDATE_SOURCE_JOB_ID']) and j['run_id']==int(os.environ['CANDIDATE_SOURCE_RUN_ID'])
          assert j['status']=='completed' and j['conclusion']=='success'
          PY

      - name: Download and verify exact protected-closed exec003 candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candidate-source"
          curl -fsSL --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT_ID/zip" \
            -o "$RUNNER_TEMP/candidate-source.zip"
          unzip -q "$RUNNER_TEMP/candidate-source.zip" -d "$RUNNER_TEMP/candidate-source"
          CANDIDATE="$RUNNER_TEMP/candidate-source/stellar-transport-low-altitude-training-candidate-v1.json"
          RECEIPT="$RUNNER_TEMP/candidate-source/assembly-receipt.json"
          test -f "$CANDIDATE" && test -f "$RECEIPT"
          printf '%s  %s\n' "$CANDIDATE_RUNTIME_SHA256" "$CANDIDATE" | sha256sum -c -
          python - <<'PY'
          import json, os
          root=os.environ['RUNNER_TEMP']+'/candidate-source'
          q=json.load(open(root+'/assembly-receipt.json'))
          assert q['scientificState']=='LOWALT-STELLAR-STATE-0001'
          assert q['candidateRuntimeSha256']==os.environ['CANDIDATE_RUNTIME_SHA256']
          assert q['freshTrainingSpectrumCount']==275
          assert q['inheritedFiveDegreeSeamSpectrumCount']==25
          assert q['protectedSpectrumCountOpened']==0
          assert q['protectedJohnsonVComparisonCountOpened']==0
          assert q['exactFiveDegreeSeamContentIdentical'] is True
          assert q['cscExtrapolationBelow5Deg'] is False
          assert q['minimumCandidateGeometricAltitudeDeg']==0.25
          assert q['minimumScientificallySupportedGeometricAltitudeDeg'] is None
          assert q['scientificallyValidatedBelow5Deg'] is False
          assert q['exactHorizonSupported'] is False
          assert q['protectedValidationAuthorized'] is False
          assert q['productionAuthorized'] is False
          PY
          echo "CANDIDATE_RUNTIME=$CANDIDATE" >> "$GITHUB_ENV"

      - name: Set up exact libRadtran runtime
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: low-altitude-stellar-protected-v2-validation-v1
          create-args: -c conda-forge python=3.12.4 rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Verify pinned deterministic solver and frozen science inputs
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          UVSPEC="$(command -v uvspec)"
          test -n "$UVSPEC"
          printf '%s  %s\n' "$UVSPEC_SHA256" "$UVSPEC" | sha256sum -c -
          UVHELP_SHA="$(python - <<'PY'
          import hashlib, subprocess, shutil
          u=shutil.which('uvspec')
          r=subprocess.run([u,'-h'],capture_output=True,check=True)
          print(hashlib.sha256(r.stdout+r.stderr).hexdigest())
          PY
          )"
          test "$UVHELP_SHA" = "$UVSPEC_HELP_SHA256"
          PACKAGE_SPEC="$(python - <<'PY'
          import json,subprocess
          obj=json.loads(subprocess.check_output(['micromamba','list','--json'],text=True))
          rows=[]
          def walk(x):
              if isinstance(x,dict):
                  if x.get('name')=='rubin-libradtran': rows.append(x)
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(obj)
          specs=set()
          for r in rows:
              version=r.get('version'); build=r.get('build_string',r.get('build'))
              if version and build: specs.add(f"rubin-libradtran={version}={build}")
          if len(specs)!=1: raise SystemExit(f'exact package identity unresolved: {sorted(specs)!r}')
          print(next(iter(specs)))
          PY
          )"
          test "$PACKAGE_SPEC" = 'rubin-libradtran=2.0.6=py312pl5321he9373c2_1'
          DATA_DIR="$(python - <<'PY'
          from pathlib import Path
          import shutil
          u=Path(shutil.which('uvspec')).resolve()
          for p in (u.parent.parent/'share'/'libRadtran'/'data', u.parent.parent/'data'):
              if p.is_dir(): print(p); break
          else: raise SystemExit('libRadtran data directory not found')
          PY
          )"
          printf '%s  %s\n' "$AFGLUS_SHA256" "$DATA_DIR/atmmod/afglus.dat" | sha256sum -c -
          printf '%s  %s\n' "$SED_SHA256" review/asiv-matched-stellar-transport-v1/frozen-assets/pickles-sed-1nm.json | sha256sum -c -
          printf '%s  %s\n' "$JOHNSON_V_SHA256" review/asiv-matched-stellar-transport-v1/frozen-assets/johnson-v-1nm.json | sha256sum -c -
          echo "UVSPEC=$UVSPEC" >> "$GITHUB_ENV"
          echo "LIBRADTRAN_DATA=$DATA_DIR" >> "$GITHUB_ENV"

      - name: Recheck fresh protected-v2 contract immediately before opening results
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests/test_low_altitude_stellar_protected_v2_validation_v1.py \
            tests/test_low_altitude_stellar_protected_v2_fresh_matrix.py \
            tests/test_low_altitude_stellar_phase_b_v1.py
          python "$CONTROLLER" --emit-ledger > /tmp/protected-v2-ledger.json
          python - <<'PY'
          import json, os
          d=json.load(open('/tmp/protected-v2-ledger.json'))
          assert d['scientificState']=='LOWALT-STELLAR-STATE-0001'
          assert d['protocolId']==os.environ['PROTOCOL_ID']
          assert d['candidateTrainingExecutionId']=='low-altitude-stellar-phase-b-training-v1-exec003'
          assert d['candidateRuntimeSha256']==os.environ['CANDIDATE_RUNTIME_SHA256']
          assert d['protectedAtmosphericSpectrumCount']==176
          assert d['protectedJohnsonVComparisonCount']==528
          assert d['protectedAltitudeDeg']==[0.375,0.625,0.875,1.25,1.75,2.25,2.75,3.25,3.75,4.25,4.75]
          assert d['protectedElevationM']==[250.0,875.0,1625.0,2250.0]
          assert d['protectedAod550']==[0.075,0.15,0.25,0.35]
          assert d['maxAbsDeltaAvMagLimit']==0.025
          assert d['rmsDeltaAvMagLimit']==0.010
          assert d['globalAndEveryAltitudeCellCenterMustPass'] is True
          assert d['targetAltitudeBasis']=='topocentric-vacuum-geometric'
          assert d['refractionAppliedInRadiativeTransfer'] is False
          assert d['postResultFloorBackSelectionAuthorized'] is False
          assert d['positiveEpsilonSubstitutionAllowed'] is False
          assert d['protectedResultsOpenedByReview'] is False
          assert d['scientificExecutionAuthorizedByModule'] is False
          assert d['inadmissibleExec001NumericalResultsUsed'] is False
          assert d['mysticState0077ResidualsUsed'] is False
          assert d['taylorOrJerusalemUsed'] is False
          assert d['productionAuthorized'] is False
          PY

      - name: Execute exactly 176 fresh protected spectra once and evaluate 528 comparisons
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          test ! -e protected-v2-output
          python "$CONTROLLER" \
            --execute --allow-execution \
            --root . \
            --candidate-runtime "$CANDIDATE_RUNTIME" \
            --expected-candidate-sha256 "$CANDIDATE_RUNTIME_SHA256" \
            --uvspec "$UVSPEC" \
            --data-dir "$LIBRADTRAN_DATA" \
            --atmosphere-file "$LIBRADTRAN_DATA/atmmod/afglus.dat" \
            --wavelength-grid-file experiments/aerosol-family-challenge-v2-r8/wavelength-grid-1nm.dat \
            --sed-bundle review/asiv-matched-stellar-transport-v1/frozen-assets/pickles-sed-1nm.json \
            --johnson-v review/asiv-matched-stellar-transport-v1/frozen-assets/johnson-v-1nm.json \
            --output-dir protected-v2-output

      - name: Verify terminal fresh protected-v2 accounting without floor selection
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RESULT=protected-v2-output/low-altitude-stellar-protected-v2-validation-v1.json
          test -f "$RESULT"
          python - <<'PY'
          import json, os
          v=json.load(open('protected-v2-output/low-altitude-stellar-protected-v2-validation-v1.json'))
          assert v['stageId']=='low-altitude-stellar-protected-v2-validation-v1'
          assert v['protocolId']==os.environ['PROTOCOL_ID']
          assert v['scientificState']=='LOWALT-STELLAR-STATE-0001'
          assert v['candidateRuntimeSha256']==os.environ['CANDIDATE_RUNTIME_SHA256']
          assert v['scientificSolverExecuted'] is True
          assert v['solver']=='sdisort' and v['solverGeometry']=='pseudo-spherical'
          assert v['solverInvocationCount']==176
          assert v['randomNumbersUsed'] is False
          assert v['positiveEpsilonSubstitutionUsed'] is False
          assert v['sameIdentityRetryUsed'] is False
          assert v['refractionAppliedInRadiativeTransfer'] is False
          assert v['exactHorizonSupported'] is False
          assert v['postResultFloorBackSelectionAuthorized'] is False
          assert v['postResultRetuningAuthorized'] is False
          assert v['productionAuthorized'] is False
          assert v['applicationSupportChanged'] is False
          if v['status']=='PROTECTED_VALIDATION_PASS':
              assert v['freshProtectedAtmosphericSpectrumCount']==176
              assert v['freshProtectedJohnsonVComparisonCount']==528
              assert v['overall']['comparisonCount']==528 and v['overall']['passed'] is True
              assert all(x['passed'] is True for x in v['byProtectedAltitudeDeg'].values())
              assert v['minimumSupportedGeometricAltitudeIfPassDeg']==0.25
          elif v['status']=='PROTECTED_VALIDATION_FAIL':
              assert v['freshProtectedAtmosphericSpectrumCount']==176
              assert v['freshProtectedJohnsonVComparisonCount']==528
              assert v['minimumSupportedGeometricAltitudeIfPassDeg'] is None
          elif v['status']=='PROTECTED_VALIDATION_FAIL_NUMERICALLY_UNRESOLVED':
              assert v['freshProtectedAtmosphericSpectrumCount']==176
              assert v['freshProtectedJohnsonVComparisonCount']==0
              assert v['numericallyUnresolvedSpectrumCount'] > 0
              assert v['minimumSupportedGeometricAltitudeIfPassDeg'] is None
          else:
              raise SystemExit(f"unexpected protected-v2 status: {v['status']}")
          print(json.dumps({
              'status':v['status'],
              'candidateRuntimeSha256':v['candidateRuntimeSha256'],
              'overall':v.get('overall'),
              'byProtectedAltitudeDeg':v.get('byProtectedAltitudeDeg'),
              'minimumSupportedGeometricAltitudeIfPassDeg':v.get('minimumSupportedGeometricAltitudeIfPassDeg'),
              'numericallyUnresolvedSpectrumCount':v.get('numericallyUnresolvedSpectrumCount'),
          },sort_keys=True))
          PY

      - name: Publish immutable fresh protected-v2 decision evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: low-altitude-stellar-protected-v2-validation-v1-exec001-result
          path: protected-v2-output/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
