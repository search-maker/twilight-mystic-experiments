name: Low-altitude stellar STATE-0002 capability exec001 one-shot
run-name: Low-altitude stellar STATE-0002 capability exec001 ${{ github.sha }}

on:
  push:
    branches:
      - dispatch/lowalt-stellar-state-0002-capability-exec001-v1

permissions:
  contents: read

concurrency:
  group: lowalt-stellar-state-0002-capability-exec001-one-shot
  cancel-in-progress: false

env:
  STAGE_DIR: review/low-altitude-stellar-transport-v2
  EXECUTOR_PATH: review/low-altitude-stellar-transport-v2/lowalt_state_0002_capability_exec001.py
  CONTROLLER_PATH: review/low-altitude-stellar-transport-v2/lowalt_state_0002_capability_controller.py
  DISPATCH_PATH: review/low-altitude-stellar-transport-v2/lowalt-state-0002-capability-exec001-dispatch.json
  EXECUTOR_GIT_BLOB: f9d3127b7e5fe643408d99bdd0bd6a3869bf8f84
  CONTROLLER_GIT_BLOB: 2b7951b1ed260d21e3d1cbc6dbd48b68fdf44607
  UVSPEC_SHA256: 2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3
  UVSPEC_HELP_SHA256: 868aea5af762d968f6f62c4e1472916d25232ed9cab5be112d753b0823d20548
  AFGLUS_SHA256: dab26290ed81c762ed0c607e5dc2d53393c1462a0c3a528bc5e3f5935191cfb5

jobs:
  execute-once:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact dispatch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify fresh one-file dispatch boundary and published scientific bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = dispatch/lowalt-stellar-state-0002-capability-exec001-v1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin main
          mapfile -t PARENTS < <(git cat-file -p HEAD | sed -n 's/^parent //p')
          test "${#PARENTS[@]}" = 1
          PARENT="${PARENTS[0]}"
          test "$PARENT" = "$(git rev-parse origin/main)"
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = 1
          test "${CHANGED[0]}" = "$DISPATCH_PATH"
          test "$(git hash-object "$EXECUTOR_PATH")" = "$EXECUTOR_GIT_BLOB"
          test "$(git hash-object "$CONTROLLER_PATH")" = "$CONTROLLER_GIT_BLOB"
          python - <<'PY'
          import json, os, subprocess
          d=json.load(open(os.environ['DISPATCH_PATH'],encoding='utf-8'))
          parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          expected={
            'schemaVersion':1,
            'scientificState':'LOWALT-STELLAR-STATE-0002',
            'executionId':'lowalt-state-0002-capability-runtime-exec001',
            'status':'AUTHORIZED_ONE_SHOT_RESULT_BLIND_CAPABILITY_RUNTIME_EXECUTION',
            'baseMainSha':parent,
            'executorGitBlob':'f9d3127b7e5fe643408d99bdd0bd6a3869bf8f84',
            'controllerGitBlob':'2b7951b1ed260d21e3d1cbc6dbd48b68fdf44607',
            'freshCaseCount':20,
            'solverInvocationCount':60,
            'timingRepetitionsPerCase':3,
            'scientificExecutionAuthorized':True,
            'solverExecutionAuthorized':True,
            'resultOpeningAuthorized':True,
            'protectedEvidence':False,
            'supportDecisionEvidence':False,
            'applicationSupportChangeAuthorized':False,
            'githubRerunPermitted':False,
            'solverRetryPermitted':False,
            'solverResumePermitted':False,
            'positiveEpsilonSubstitutionAllowed':False,
            'productionAuthorized':False,
            'exactHorizonSupported':False,
            'postV1Nonblocking':True,
            'openedState0001ProtectedResidualsUsedForDesign':False,
            'taylorOrJerusalemUsed':False,
          }
          for k,v in expected.items():
              if d.get(k)!=v: raise SystemExit(f'dispatch mismatch {k}: {d.get(k)!r} != {v!r}')
          assert d['targetGeometricAltitudeDeg']==[0.30,0.70,1.40,2.90,4.60]
          assert d['observerElevationM']==[0.0,2500.0]
          assert d['aod550']==[0.05,0.40]
          PY

      - name: Set up exact libRadtran runtime
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: lowalt-stellar-state-0002-capability-exec001
          create-args: -c conda-forge python=3.12.4 rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Verify pinned solver package help and atmosphere data
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          UVSPEC="$(command -v uvspec)"
          test -n "$UVSPEC"
          ACTUAL_UVSPEC_SHA="$(sha256sum "$UVSPEC" | awk '{print $1}')"
          echo "uvspec_sha256=$ACTUAL_UVSPEC_SHA"
          test "$ACTUAL_UVSPEC_SHA" = "$UVSPEC_SHA256"
          UVHELP_SHA="$(python - <<'PY'
          import hashlib,subprocess,shutil
          u=shutil.which('uvspec')
          r=subprocess.run([u,'-h'],capture_output=True,check=True)
          print(hashlib.sha256(r.stdout+r.stderr).hexdigest())
          PY
          )"
          echo "uvspec_help_sha256=$UVHELP_SHA"
          test "$UVHELP_SHA" = "$UVSPEC_HELP_SHA256"
          PACKAGE_SPEC="$(python - <<'PY'
          import json,subprocess
          obj=json.loads(subprocess.check_output(['micromamba','list','--json'],text=True))
          rows=[]
          def walk(x):
              if isinstance(x,dict):
                  if x.get('name')=='rubin-libradtran': rows.append(x)
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(obj)
          specs=set()
          for r in rows:
              version=r.get('version'); build=r.get('build_string',r.get('build'))
              if version and build: specs.add(f"rubin-libradtran={version}={build}")
          if len(specs)!=1: raise SystemExit(f'exact package identity unresolved: {sorted(specs)!r}')
          print(next(iter(specs)))
          PY
          )"
          echo "package_spec=$PACKAGE_SPEC"
          test "$PACKAGE_SPEC" = 'rubin-libradtran=2.0.6=py312pl5321he9373c2_1'
          DATA_DIR="$(python - <<'PY'
          from pathlib import Path
          import shutil
          u=Path(shutil.which('uvspec')).resolve()
          for p in (u.parent.parent/'share'/'libRadtran'/'data', u.parent.parent/'data'):
              if p.is_dir(): print(p); break
          else: raise SystemExit('libRadtran data directory not found')
          PY
          )"
          ACTUAL_AFGLUS_SHA="$(sha256sum "$DATA_DIR/atmmod/afglus.dat" | awk '{print $1}')"
          echo "afglus_sha256=$ACTUAL_AFGLUS_SHA"
          test "$ACTUAL_AFGLUS_SHA" = "$AFGLUS_SHA256"
          echo "UVSPEC=$UVSPEC" >> "$GITHUB_ENV"
          echo "LIBRADTRAN_DATA=$DATA_DIR" >> "$GITHUB_ENV"

      - name: Recheck frozen STATE-0002 controller and executor immediately before science
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          test "$(git hash-object "$EXECUTOR_PATH")" = "$EXECUTOR_GIT_BLOB"
          test "$(git hash-object "$CONTROLLER_PATH")" = "$CONTROLLER_GIT_BLOB"
          python "$CONTROLLER_PATH" --self-test
          python "$EXECUTOR_PATH" --self-test
          python "$CONTROLLER_PATH" --emit-manifest > /tmp/lowalt-state-0002-manifest.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/lowalt-state-0002-manifest.json',encoding='utf-8'))
          assert p['scientificState']=='LOWALT-STELLAR-STATE-0002'
          assert p['freshCaseCount']==20
          assert p['timedInvocationCount']==60
          assert p['freshAxes']['targetGeometricAltitudeDeg']==['0.30','0.70','1.40','2.90','4.60']
          assert p['protectedResultsAuthorized'] is False
          assert p['applicationSupportChangeAuthorized'] is False
          assert p['exactHorizonSupported'] is False
          PY

      - name: Execute exactly 60 deterministic capability and timing invocations once
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          test ! -e execution-output
          python "$EXECUTOR_PATH" \
            --execute --allow-execution \
            --uvspec "$UVSPEC" \
            --data-dir "$LIBRADTRAN_DATA" \
            --atmosphere-file "$LIBRADTRAN_DATA/atmmod/afglus.dat" \
            --wavelength-grid-file experiments/aerosol-family-challenge-v2-r8/wavelength-grid-1nm.dat \
            --output-dir execution-output

      - name: Verify terminal accounting without support reclassification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('execution-output/capability-runtime-result.json',encoding='utf-8'))
          q=json.load(open('execution-output/execution-receipt.json',encoding='utf-8'))
          assert r['scientificState']=='LOWALT-STELLAR-STATE-0002'
          assert r['executionId']=='lowalt-state-0002-capability-runtime-exec001'
          assert r['attemptedInvocationCount']==60 and r['solverInvocationCount']==60
          assert r['capabilitySpectrumCount']==20
          assert r['protectedEvidence'] is False and r['supportDecisionEvidence'] is False
          assert r['applicationSupportChangeAuthorized'] is False
          assert r['sameIdentityRetryUsed'] is False
          assert r['positiveEpsilonSubstitutionUsed'] is False
          assert r['productionAuthorized'] is False
          assert r['minimumSupportedGeometricAltitudeDeg'] is None
          assert r['exactHorizonSupported'] is False
          assert q['solverInvocationCount']==60
          print(json.dumps(q,sort_keys=True))
          PY

      - name: Publish immutable STATE-0002 capability/runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lowalt-stellar-state-0002-capability-exec001-result
          path: execution-output/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
