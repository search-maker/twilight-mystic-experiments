name: LOWALT STATE-0002 capability exec001 review
run-name: LOWALT STATE-0002 capability exec001 review ${{ github.sha }}

on:
  pull_request:
    paths:
      - review/low-altitude-stellar-transport-v2/lowalt_state_0002_capability_exec001.py
      - tests/test_lowalt_state_0002_capability_exec001.py
      - .github/workflows/low-altitude-stellar-state-0002-capability-exec001-review.yml

permissions:
  contents: read

concurrency:
  group: lowalt-state-0002-capability-exec001-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  CONTROLLER_PATH: review/low-altitude-stellar-transport-v2/lowalt_state_0002_capability_controller.py
  CONTROLLER_GIT_BLOB: 2b7951b1ed260d21e3d1cbc6dbd48b68fdf44607
  EXECUTOR_PATH: review/low-altitude-stellar-transport-v2/lowalt_state_0002_capability_exec001.py

jobs:
  solver-free-executor-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact review head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact published controller blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "HEAD:$CONTROLLER_PATH")" = "$CONTROLLER_GIT_BLOB"

      - name: Compile and execute solver-free tests only
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile "$EXECUTOR_PATH" tests/test_lowalt_state_0002_capability_exec001.py
          python "$EXECUTOR_PATH" --self-test --repo-root .
          python -m unittest -v tests/test_lowalt_state_0002_capability_exec001.py

      - name: Prove review workflow cannot execute science
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/low-altitude-stellar-state-0002-capability-exec001-review.yml')
          text=path.read_text(encoding='utf-8')
          forbidden=(
              '--'+'execute',
              '--allow-'+'execution',
              'micro'+'mamba',
              'rubin-'+'libradtran',
              'uv'+'spec',
          )
          lowered=text.lower()
          for token in forbidden:
              assert token not in lowered, token
          PY

      - name: Prove protected and support boundaries remain closed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path('review/low-altitude-stellar-transport-v2/lowalt_state_0002_capability_controller.py')
          s=importlib.util.spec_from_file_location('c',p); m=importlib.util.module_from_spec(s); s.loader.exec_module(m)
          x=m.manifest()
          assert x['protectedResultsAuthorized'] is False
          assert x['applicationSupportChangeAuthorized'] is False
          assert x['compactRepresentationSelected'] is False
          assert x['exactHorizonSupported'] is False
          assert x['authoritativeExistingMinimumGeometricAltitudeDeg']=='5.0'
          assert x['freshCaseCount']==20 and x['timedInvocationCount']==60
          PY
