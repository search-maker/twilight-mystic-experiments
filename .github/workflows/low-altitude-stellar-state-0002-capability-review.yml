name: low-altitude-stellar-state-0002-capability-review

on:
  pull_request:
    paths:
      - 'review/low-altitude-stellar-transport-v2/LOWALT_STELLAR_STATE_0002_CAPABILITY_RUNTIME_PROTOCOL_V1.md'
      - 'review/low-altitude-stellar-transport-v2/lowalt_state_0002_capability_controller.py'
      - '.github/workflows/low-altitude-stellar-state-0002-capability-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solver-free-capability-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove controller is solver-free and deterministic
        shell: bash
        run: |
          set -euo pipefail
          f=review/low-altitude-stellar-transport-v2/lowalt_state_0002_capability_controller.py
          test -f "$f"
          if grep -Eq 'subprocess|os\.system|Popen' "$f"; then
            echo 'solver execution surface found in solver-free controller' >&2
            exit 1
          fi
          python -m py_compile "$f"
          python "$f" --self-test
          python "$f" --emit-manifest > /tmp/lowalt-state-0002-capability.json
      - name: Audit frozen capability and timing manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p = json.load(open('/tmp/lowalt-state-0002-capability.json', encoding='utf-8'))
          assert p['scientificState'] == 'LOWALT-STELLAR-STATE-0002'
          assert p['issue60TheoryFreezeComment'] == 5470357109
          assert p['issue60ApplicationBudgetFreezeComment'] == 5470368706
          assert p['solverExecutionAuthorizedByThisController'] is False
          assert p['protectedResultsAuthorized'] is False
          assert p['compactRepresentationSelected'] is False
          assert p['applicationSupportChangeAuthorized'] is False
          assert p['freshAxes']['targetGeometricAltitudeDeg'] == ['0.30','0.70','1.40','2.90','4.60']
          assert p['freshAxes']['observerElevationM'] == ['0','2500']
          assert p['freshAxes']['aod550'] == ['0.05','0.40']
          assert p['freshCaseCount'] == 20
          assert p['timingRepetitionsPerCase'] == 3
          assert p['timedInvocationCount'] == 60
          assert p['capabilitySpectrumCount'] == 20
          assert p['timingOnlyInvocationCount'] == 40
          assert p['collisionAudit']['openedState0001ProtectedAltitudeCollisionCount'] == 0
          assert p['collisionAudit']['openedState0001TrainingAltitudeCollisionCount'] == 0
          assert p['inheritedSeam']['geometricAltitudeDeg'] == '5.0'
          assert p['inheritedSeam']['freshSuccessorEvidence'] is False
          assert p['practicalRouteFreeze']['perSampleRemoteSdisortEligible'] is False
          assert p['practicalRouteFreeze']['ordinaryTimelineBaseEvaluations'] == 2049
          assert p['practicalRouteFreeze']['sevenDayAnnualSingleTargetBaseEvaluations'] == 108597
          assert p['exactHorizonSupported'] is False
          PY
      - name: Audit anti-fitting, seam, geometry, and nonblocking text
        shell: bash
        run: |
          set -euo pipefail
          f=review/low-altitude-stellar-transport-v2/LOWALT_STELLAR_STATE_0002_CAPABILITY_RUNTIME_PROTOCOL_V1.md
          grep -Fq 'POST_V1_NONBLOCKING' "$f"
          grep -Fq '5470357109' "$f"
          grep -Fq '5470368706' "$f"
          grep -Fq 'opened protected residual values, pattern, signs, ranking' "$f"
          grep -Fq 'Apparent/refracted altitude remains a separate observational transform' "$f"
          grep -Fq 'Exact 5 deg is inherited seam/control only' "$f"
          grep -Fq 'PER_SAMPLE_REMOTE_SDISORT' "$f"
          grep -Fq 'No protected matrix exists under this package' "$f"
