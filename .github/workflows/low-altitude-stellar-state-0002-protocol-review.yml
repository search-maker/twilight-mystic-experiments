name: Low-altitude stellar state 0002 protocol review

on:
  pull_request:
    paths:
      - 'review/low-altitude-stellar-transport-v2/low_altitude_state_0002_protocol.py'
      - 'tests/test_low_altitude_stellar_state_0002_protocol.py'
      - '.github/workflows/low-altitude-stellar-state-0002-protocol-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen successor protocol contracts
        run: python -m unittest -v tests/test_low_altitude_stellar_state_0002_protocol.py
      - name: Emit and inspect result-blind ledger
        run: |
          python review/low-altitude-stellar-transport-v2/low_altitude_state_0002_protocol.py > /tmp/state0002.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/state0002.json'))
          assert d['scientificState']=='LOWALT-STELLAR-STATE-0002'
          assert d['trainingSpectrumCount']==2090
          assert d['inheritedFiveDegreeSeamSpectrumCount']==55
          assert d['protectedAtmosphericSpectrumCount']==220
          assert d['protectedJohnsonVComparisonCount']==660
          assert d['candidateMinGeometricAltitudeDeg']==0.25
          assert d['exactHorizonSupported'] is False
          assert d['representation']['pseudoSphericalReferenceSolver']=='sdisort'
          assert d['representation']['targetAltitudeBasis']=='topocentric-vacuum-geometric'
          assert d['representation']['cscExtrapolationBelow5Deg'] is False
          assert d['representation']['fittedChapmanFormula'] is False
          assert d['representation']['refractionAppliedInRadiativeTransfer'] is False
          assert d['predecessorProtectedResidualsMayInformDesign'] is False
          assert d['taylorJerusalemOrHalachicTimesMayInformDesign'] is False
          assert d['positiveEpsilonSubstitutionAllowed'] is False
          assert d['githubRerunAllowed'] is False
          assert d['postProtectedResultFloorSelectionAllowed'] is False
          assert d['postProtectedResultRetuningAllowed'] is False
          assert d['applicationSupportChanged'] is False
          assert d['productionAuthorized'] is False
          assert d['protectedResultsOpened'] is False
          PY
      - name: Prove review is solver-free and protected-result-free
        shell: bash
        run: |
          set -euo pipefail
          FILE=review/low-altitude-stellar-transport-v2/low_altitude_state_0002_protocol.py
          test -z "$(command -v uvspec || true)"
          ! grep -n -E '0\.20750414925067062|0\.044561710921862445|0\.010802886158554112|0\.015863226012807097|0\.012279708245117149' "$FILE"
          ! grep -n -E 'AnnArbor\.csv|Taylor residual|Jerusalem residual|first-seeing|halachic' "$FILE"
          grep -q 'MAX_ALTITUDE_STEP_DEG = 0.125' "$FILE"
          grep -q 'MAX_ELEVATION_STEP_M = 250.0' "$FILE"
          grep -q 'cscExtrapolationBelow5Deg' "$FILE"
          grep -q 'fittedChapmanFormula' "$FILE"
