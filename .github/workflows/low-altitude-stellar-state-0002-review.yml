name: low-altitude-stellar-state-0002-review

on:
  pull_request:
    paths:
      - 'review/low-altitude-stellar-transport-v2/**'
      - '.github/workflows/low-altitude-stellar-state-0002-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solver-free-contract-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove planning helper is solver-free and deterministic
        shell: bash
        run: |
          set -euo pipefail
          test -f review/low-altitude-stellar-transport-v2/LOW_ALTITUDE_STELLAR_TRANSPORT_STATE_AND_PROTOCOL_V2.md
          test -f review/low-altitude-stellar-transport-v2/low_altitude_state_0002.py
          ! grep -Eq 'subprocess|os\.system|uvspec[[:space:]]*\(' review/low-altitude-stellar-transport-v2/low_altitude_state_0002.py
          python -m py_compile review/low-altitude-stellar-transport-v2/low_altitude_state_0002.py
          python review/low-altitude-stellar-transport-v2/low_altitude_state_0002.py --self-test
      - name: Freeze and audit initial result-blind plan
        shell: bash
        run: |
          set -euo pipefail
          python review/low-altitude-stellar-transport-v2/low_altitude_state_0002.py --emit-initial-plan > /tmp/lowalt-state-0002-plan.json
          python - <<'PY'
          import json
          p = json.load(open('/tmp/lowalt-state-0002-plan.json', encoding='utf-8'))
          assert p['scientificState'] == 'LOWALT-STELLAR-STATE-0002'
          assert p['solverExecutionAuthorized'] is False
          assert p['protectedResultsAuthorized'] is False
          assert p['applicationSupportChangeAuthorized'] is False
          assert p['representation']['cscExtrapolationBelow5'] is False
          assert p['initialGrid']['tensorVertexCount'] == 300
          assert p['training']['probeCountInitialRound'] == 352
          assert p['training']['collisionCountAgainstOpenedState0001Protected'] == 0
          assert p['protectedRule']['materialized'] is False
          assert p['authoritativeExistingMinimumGeometricAltitudeDeg'] == 5.0
          assert p['exactHorizonSupported'] is False
          PY
      - name: Audit protected seam and anti-fitting statements
        shell: bash
        run: |
          set -euo pipefail
          f=review/low-altitude-stellar-transport-v2/LOW_ALTITUDE_STELLAR_TRANSPORT_STATE_AND_PROTOCOL_V2.md
          grep -Fq 'MYSTIC-STATE-0077: representation FAIL' "$f"
          grep -Fq 'MYSTIC-STATE-0081 v2 and later v3/v3.2: successful repair for >=5 deg' "$f"
          grep -Fq '<5 deg remains unvalidated' "$f"
          grep -Fq 'opened residual pattern is sealed from successor design' "$f"
          grep -Fq 'Refraction remains outside RT' "$f"
          grep -Fq 'exact `h_geo = 5.0 deg`' "$f"
          grep -Fq 'This file authorizes **no solver execution and no application support change**' "$f"
