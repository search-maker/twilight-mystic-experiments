name: low-altitude-stellar-state-0003-source-audit-review

on:
  pull_request:
    paths:
      - 'review/low-altitude-stellar-transport-v3/**'
      - '.github/workflows/low-altitude-stellar-state-0003-source-audit-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solver-free-direct-path-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove prototype is solver-free and deterministic
        shell: bash
        run: |
          set -euo pipefail
          f=review/low-altitude-stellar-transport-v3/lowalt_state_0003_spherical_path.py
          test -f "$f"
          if grep -Eq '(^|[^A-Za-z0-9_])(subprocess|Popen)([^A-Za-z0-9_]|$)|os\.system[[:space:]]*\(' "$f"; then
            echo 'solver/process execution surface found in STATE-0003 solver-free prototype' >&2
            exit 1
          fi
          if grep -Eq '(^|[[:space:]])(import|from)[[:space:]]+(subprocess|shutil|os)([[:space:].]|$)' "$f"; then
            echo 'process-discovery module import found in STATE-0003 solver-free prototype' >&2
            exit 1
          fi
          python -m py_compile "$f"
          python "$f"
      - name: Audit result-blind source-trace contract
        shell: bash
        run: |
          set -euo pipefail
          p=review/low-altitude-stellar-transport-v3/LOWALT_STELLAR_STATE_0003_DIRECT_PATH_PROTOCOL_V1.md
          test -f "$p"
          grep -Fq '5471304029' "$p"
          grep -Fq 'POST_V1_NONBLOCKING / RESULT_BLIND / SOLVER_FREE_REVIEW_ONLY' "$p"
          grep -Fq 'Exact horizon `0 deg` is not supported or assumed' "$p"
          grep -Fq 'Apparent/refracted altitude is a separate observational transform' "$p"
          grep -Fq 'No fitted surrogate is substituted under this identity' "$p"
          grep -Fq 'No protected matrix, support floor, interpolation knot set, formula tolerance, or application routing threshold is selected by this protocol' "$p"
          grep -Fq 'EARTH_RADIUS_CONVENTION' "$p"
          grep -Fq 'NULL_PREPROCESS_EQUIVALENCE' "$p"
          grep -Fq 'FLOAT_UNDERFLOW_SEMANTICS' "$p"
      - name: Reject forbidden tuning surfaces
        shell: bash
        run: |
          set -euo pipefail
          d=review/low-altitude-stellar-transport-v3
          if grep -RniE '0\.207504149|0\.044561710|Taylor|Jerusalem|halachic first-seeing|desired halachic' "$d"; then
            echo 'forbidden opened-result or target-specific tuning surface found' >&2
            exit 1
          fi
      - name: Audit fail-closed geometry and no production claim
        shell: bash
        run: |
          set -euo pipefail
          f=review/low-altitude-stellar-transport-v3/lowalt_state_0003_spherical_path.py
          grep -Fq '0 < h <= 90 deg' "$f"
          grep -Fq 'direct transmission is unresolved/underflowed' "$f"
          grep -Fq 'NOT a frozen sdisort source-equivalence claim' "$f"
          p=review/low-altitude-stellar-transport-v3/LOWALT_STELLAR_STATE_0003_DIRECT_PATH_PROTOCOL_V1.md
          grep -Fq 'does **not** prove that the prototype below is source-equivalent' "$p"
