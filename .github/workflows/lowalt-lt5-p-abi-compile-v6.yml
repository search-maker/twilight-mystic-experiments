name: LowAlt LT5 P ABI Compile V6

on:
  push:
    branches:
      - review/lowalt-lt5-p-abi-compile-v6-20260917
    paths:
      - .github/workflows/lowalt-lt5-p-abi-compile-v6.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  compile-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Apply frozen lower-underscore interop ABI and probe P C units without execution
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p work/evidence work/objects
          cd work
          STAGE=bootstrap
          trap 'rc=$?; printf "status=FAIL\nstage=%s\nexit=%s\nwasm_instantiated=false\nruntime_executed=false\nlt5_result=false\nc_executed=false\nd_executed=false\nb_selected=false\nb_resolved=false\nproduction_changed=false\n" "$STAGE" "$rc" > evidence/failure-receipt.txt; exit "$rc"' ERR

          source /opt/emsdk/emsdk_env.sh >/dev/null
          EMCC="$(command -v emcc)"
          test "$(sha256sum "$EMCC" | awk '{print $1}')" = "b0c9551f9155fa9c028efa24591acdfd30f02f32fb247cf9266f5f0f2ede7589"

          STAGE=source
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/8894652347/zip" \
            -o source-audit.zip
          test "$(sha256sum source-audit.zip | awk '{print $1}')" = "db189ee5f145719ebf85c97e1c0b35eacb4963c2c19544df29f0a978b1dbd12b"
          unzip -p source-audit.zip libRadtran-2.0.6.tar.gz > libRadtran-2.0.6.tar.gz
          test "$(sha256sum libRadtran-2.0.6.tar.gz | awk '{print $1}')" = "64930cc40b6e4a37aa220520974d330fc1563796f466a649b2238131f2d69840"
          gzip -dc libRadtran-2.0.6.tar.gz > source.tar
          test "$(sha256sum source.tar | awk '{print $1}')" = "999e47f4af4b5df6f85a6887fc105fc8f6e1a7cee89a3124f69ac8d8912c8e85"
          tar -xf source.tar

          STAGE=abi-freeze
          cat > p-fortran-abi.h <<'EOF'
          #ifndef LOWALT_P_FORTRAN_ABI_H
          #define LOWALT_P_FORTRAN_ABI_H 1
          #define F77_FUNC(name,NAME) name ## _
          #define F77_FUNC_(name,NAME) name ## _
          #define HAVE_TIPA 0
          #endif
          EOF
          cp p-fortran-abi.h evidence/p-fortran-abi.h
          test ! -f libRadtran-2.0.6/src/tipa.c
          test ! -f libRadtran-2.0.6/src/tipa.h
          grep -q 'AC_F77_WRAPPERS' libRadtran-2.0.6/configure.in
          grep -q '#define F77_FUNC(name,NAME) name ## _' libRadtran-2.0.6/configure
          grep -q '^DEFS = @DEFS@' libRadtran-2.0.6/Makeconf.in
          grep -q '$(HAVE_TIPA)' libRadtran-2.0.6/Makeconf.in

          STAGE=compile-probe
          : > evidence/compile-status.tsv
          INDEX=0
          for UNIT in src/solve_rte.c src/ancillary.c; do
            INDEX=$((INDEX+1))
            STEM="$(basename "$UNIT" .c)"
            OBJ="objects/${INDEX}-${STEM}.o"
            OUT="evidence/${INDEX}-${STEM}.stdout.txt"
            ERR="evidence/${INDEX}-${STEM}.stderr.txt"
            set +e
            "$EMCC" -O0 -std=gnu11 -include "$(pwd)/p-fortran-abi.h" -c "libRadtran-2.0.6/$UNIT" \
              -IlibRadtran-2.0.6 -IlibRadtran-2.0.6/src -IlibRadtran-2.0.6/src_c \
              -IlibRadtran-2.0.6/libsrc_c -IlibRadtran-2.0.6/libsrc_f \
              -o "$OBJ" >"$OUT" 2>"$ERR"
            RC=$?
            set -e
            if [ -s "$OBJ" ]; then
              cp "$OBJ" "evidence/${INDEX}-${STEM}.o"
              printf '%s\tRC_%s\t%s\t%s\n' "$UNIT" "$RC" "$(sha256sum "$OBJ" | awk '{print $1}')" "$(wc -c < "$OBJ" | tr -d ' ')" >> evidence/compile-status.tsv
            else
              rm -f "$OBJ"
              printf '%s\tRC_%s\t-\t-\n' "$UNIT" "$RC" >> evidence/compile-status.tsv
            fi
          done

          STAGE=provenance
          python3 - <<'PY'
          import hashlib, json, pathlib, re
          root=pathlib.Path('libRadtran-2.0.6')
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          files=['configure.in','configure','Makeconf.in','src/Makefile.in','src/solve_rte.c','src/ancillary.c','libsrc_f/solver.h']
          records={r:{'sha256':sha(root/r),'size':(root/r).stat().st_size} for r in files}
          def selected(path, pats):
              lines=(root/path).read_text(errors='replace').splitlines(); out=[]
              for i,line in enumerate(lines,1):
                  if any(re.search(p,line) for p in pats): out.append({'line':i,'text':line[:500]})
              return out
          compile=[]
          for line in pathlib.Path('evidence/compile-status.tsv').read_text().splitlines():
              unit,status,objhash,size=line.split('\t'); compile.append({'unit':unit,'status':status,'objectSha256':objhash,'objectSize':size})
          out={
            'schema':6,
            'classification':'PRE_RESULT_P_FROZEN_INTEROP_ABI_COMPILE_FEASIBILITY_ONLY',
            'sourceDecodedTarSha256':'999e47f4af4b5df6f85a6887fc105fc8f6e1a7cee89a3124f69ac8d8912c8e85',
            'authoritativeFiles':records,
            'fortranWrapperSource':selected('configure.in',[r'AC_PROG_F77',r'AC_F77_LIBRARY_LDFLAGS',r'AC_F77_DUMMY_MAIN',r'AC_F77_WRAPPERS']),
            'generatedManglingBranches':selected('configure',[r'#define F77_FUNC\\(',r'#define F77_FUNC_\\(']),
            'tipaSourceRule':selected('configure.in',[r'HAVE_TIPA',r'tipa\\.c',r'tipa\\.h']),
            'makeFlagRule':selected('Makeconf.in',[r'^DEFS = @DEFS@',r'^ALL_CFLAGS',r'\\$\\(DEFS\\)',r'\\$\\(HAVE_TIPA\\)']),
            'frozenInteropBasis':{
              'TLinkedCandidateRun':35199554793,
              'TLinkedWasmSha256':'2ddff4fd919868e0f2518adce6937bdca779f6c15d49d843a42ee7f4e0fec070',
              'TStaticExportNames':['sdisort_','dpsdisort_','setout_'],
              'F77_FUNC(name,NAME)':'name##_',
              'F77_FUNC_(name,NAME)':'name##_',
              'HAVE_TIPA':0,
              'tipaFilesAbsent':True,
            },
            'compileRecords':compile,
            'predecessorV4':{'run':35226417668,'artifact':10499136447,'digest':'sha256:1f0a86a4b25b15fe2820230c309825eeb7ce23c2121a89d26d9cd4f6554ab9ef','firstBlocker':'F77_FUNC not defined'},
            'predecessorV5':{'run':35226992378,'failure':'mechanical probe used non-existent PATH flang command before source stage'},
            'wasmInstantiated':False,'runtimeExecuted':False,'lt5Result':False,'cExecuted':False,'dExecuted':False,
            'bSelected':False,'bResolved':False,'productionChanged':False,
          }
          pathlib.Path('evidence/p-abi-compile-provenance.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY

          STAGE=receipt
          {
            echo 'schema=6'
            echo 'classification=PRE_RESULT_P_FROZEN_INTEROP_ABI_COMPILE_FEASIBILITY_ONLY'
            echo 'bSelected=false'; echo 'bResolved=false'; echo 'wasmInstantiated=false'; echo 'runtimeExecuted=false'; echo 'lt5Result=false'; echo 'cExecuted=false'; echo 'dExecuted=false'; echo 'productionChanged=false'
            echo 'source_artifact_id=8894652347'
            echo 'source_decoded_tar_sha256=999e47f4af4b5df6f85a6887fc105fc8f6e1a7cee89a3124f69ac8d8912c8e85'
            echo 't_linked_candidate_run=35199554793'
            echo 't_linked_wasm_sha256=2ddff4fd919868e0f2518adce6937bdca779f6c15d49d843a42ee7f4e0fec070'
            echo 't_static_export_abi=sdisort_,dpsdisort_,setout_'
            echo 'f77_func_macro=name##_'
            echo 'f77_func_underscore_macro=name##_'
            echo 'have_tipa=0'
            echo "emcc_sha256=$(sha256sum "$EMCC" | awk '{print $1}')"
            echo "abi_header_sha256=$(sha256sum evidence/p-fortran-abi.h | awk '{print $1}')"
            echo "provenance_sha256=$(sha256sum evidence/p-abi-compile-provenance.json | awk '{print $1}')"
            echo '--- compile-status ---'; cat evidence/compile-status.tsv
            echo '--- diagnostics ---'
            for LOG in evidence/*stderr.txt; do echo "### $LOG"; sed -n '1,100p' "$LOG"; done
          } > evidence/completion-receipt.txt
          find evidence -maxdepth 1 -type f ! -name manifest.sha256 -print0 | sort -z | xargs -0 sha256sum > evidence/manifest.sha256

      - name: Upload immutable pre-result P ABI compile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-abi-compile-v6
          path: work/evidence/
          if-no-files-found: error
          retention-days: 90
