name: LowAlt LT5 P ABI Compile V7

on:
  push:
    branches:
      - review/lowalt-lt5-p-abi-compile-v7-20260917
    paths:
      - .github/workflows/lowalt-lt5-p-abi-compile-v7.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  compile-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Freeze generated feature layer and probe P C units without execution
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p work/evidence work/objects
          cd work
          STAGE=bootstrap
          trap 'rc=$?; printf "status=FAIL\nstage=%s\nexit=%s\nwasm_instantiated=false\nruntime_executed=false\nlt5_result=false\nc_executed=false\nd_executed=false\nb_selected=false\nb_resolved=false\nproduction_changed=false\n" "$STAGE" "$rc" > evidence/failure-receipt.txt; exit "$rc"' ERR

          source /opt/emsdk/emsdk_env.sh >/dev/null
          EMCC="$(command -v emcc)"
          test "$(sha256sum "$EMCC" | awk '{print $1}')" = "b0c9551f9155fa9c028efa24591acdfd30f02f32fb247cf9266f5f0f2ede7589"

          STAGE=source
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/8894652347/zip" \
            -o source-audit.zip
          test "$(sha256sum source-audit.zip | awk '{print $1}')" = "db189ee5f145719ebf85c97e1c0b35eacb4963c2c19544df29f0a978b1dbd12b"
          unzip -p source-audit.zip libRadtran-2.0.6.tar.gz > libRadtran-2.0.6.tar.gz
          test "$(sha256sum libRadtran-2.0.6.tar.gz | awk '{print $1}')" = "64930cc40b6e4a37aa220520974d330fc1563796f466a649b2238131f2d69840"
          gzip -dc libRadtran-2.0.6.tar.gz > source.tar
          test "$(sha256sum source.tar | awk '{print $1}')" = "999e47f4af4b5df6f85a6887fc105fc8f6e1a7cee89a3124f69ac8d8912c8e85"
          tar -xf source.tar

          STAGE=feature-freeze
          ROOT=libRadtran-2.0.6
          test -f "$ROOT/libsrc_c/mystic.c" && test -f "$ROOT/libsrc_c/mystic.h"
          test -f "$ROOT/libsrc_c/sos.c" && test -f "$ROOT/libsrc_c/sos.h"
          test -f "$ROOT/libsrc_c/ocean.c" && test -f "$ROOT/libsrc_c/ocean.h"
          test -f "$ROOT/libsrc_c/ambralsfor.c" && test -f "$ROOT/libsrc_c/ambralsfor.h"
          grep -q 'HAVE_MYSTIC="-DHAVE_MYSTIC=1"' "$ROOT/configure.in"
          grep -q 'HAVE_SOS="-DHAVE_SOS=1"' "$ROOT/configure.in"
          grep -q 'HAVE_BRDF="-DHAVE_BRDF=1"' "$ROOT/configure.in"
          grep -q '$(HAVE_MYSTIC)' "$ROOT/Makeconf.in"
          grep -q '$(HAVE_SOS)' "$ROOT/Makeconf.in"
          grep -q '$(HAVE_BRDF)' "$ROOT/Makeconf.in"
          test ! -f "$ROOT/src/tipa.c"
          test ! -f "$ROOT/src/tipa.h"

          cat > p-generated-abi.h <<'EOF'
          #ifndef LOWALT_P_GENERATED_ABI_H
          #define LOWALT_P_GENERATED_ABI_H 1
          #define F77_FUNC(name,NAME) name ## _
          #define F77_FUNC_(name,NAME) name ## _
          #define HAVE_TIPA 0
          #define HAVE_MYSTIC 1
          #define HAVE_SOS 1
          #define HAVE_BRDF 1
          #endif
          EOF
          cp p-generated-abi.h evidence/p-generated-abi.h

          STAGE=compile-probe
          : > evidence/compile-status.tsv
          INDEX=0
          FAIL=0
          for UNIT in src/solve_rte.c src/ancillary.c; do
            INDEX=$((INDEX+1))
            STEM="$(basename "$UNIT" .c)"
            OBJ="objects/${INDEX}-${STEM}.o"
            OUT="evidence/${INDEX}-${STEM}.stdout.txt"
            ERR="evidence/${INDEX}-${STEM}.stderr.txt"
            set +e
            "$EMCC" -O0 -std=gnu11 -include "$(pwd)/p-generated-abi.h" -c "$ROOT/$UNIT" \
              -I"$ROOT" -I"$ROOT/src" -I"$ROOT/src_c" -I"$ROOT/libsrc_c" -I"$ROOT/libsrc_f" \
              -o "$OBJ" >"$OUT" 2>"$ERR"
            RC=$?
            set -e
            if [ -s "$OBJ" ]; then
              cp "$OBJ" "evidence/${INDEX}-${STEM}.o"
              printf '%s\tRC_%s\t%s\t%s\n' "$UNIT" "$RC" "$(sha256sum "$OBJ" | awk '{print $1}')" "$(wc -c < "$OBJ" | tr -d ' ')" >> evidence/compile-status.tsv
            else
              rm -f "$OBJ"
              printf '%s\tRC_%s\t-\t-\n' "$UNIT" "$RC" >> evidence/compile-status.tsv
            fi
            if [ "$RC" -ne 0 ]; then FAIL=1; fi
          done

          STAGE=receipt
          printf 'classification=PRE_RESULT_P_GENERATED_FEATURE_COMPILE_FEASIBILITY_ONLY\npredecessor_v6_run=35227273160\npredecessor_v6_artifact=10499811212\npredecessor_v6_digest=sha256:0c342959fe14f6a968a1e7078db077f11c5304e3728546ad135cf0905140c36b\nsource_decoded_tar_sha256=999e47f4af4b5df6f85a6887fc105fc8f6e1a7cee89a3124f69ac8d8912c8e85\nHAVE_MYSTIC=1\nHAVE_SOS=1\nHAVE_BRDF=1\nHAVE_TIPA=0\nF77_FUNC=name##_\nwasm_instantiated=false\nruntime_executed=false\nlt5_result=false\nc_executed=false\nd_executed=false\nb_selected=false\nb_resolved=false\nproduction_changed=false\n' > evidence/receipt.txt
          sha256sum p-generated-abi.h "$ROOT/configure.in" "$ROOT/Makeconf.in" "$ROOT/src/solve_rte.c" "$ROOT/src/ancillary.c" > evidence/source-sha256.txt
          if [ "$FAIL" -ne 0 ]; then
            STAGE=compile-probe
            false
          fi
          printf 'status=PASS\nwasm_instantiated=false\nruntime_executed=false\nlt5_result=false\nc_executed=false\nd_executed=false\nb_selected=false\nb_resolved=false\nproduction_changed=false\n' > evidence/pass-receipt.txt

      - name: Upload immutable pre-result P generated-feature compile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-abi-compile-v7
          path: work/evidence
          if-no-files-found: error
          retention-days: 90
