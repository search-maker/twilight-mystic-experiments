name: LowAlt LT5 P Bytes V44 Pre-result Freeze

on:
  push:
    branches:
      - review/lowalt-lt5-p-bytes-v44-20260917
    paths:
      - .github/workflows/lowalt-lt5-p-bytes-v44.yml

permissions:
  contents: read
  actions: read

jobs:
  freeze-p-bytes:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Replay exact V43 and preserve actual P compiled/link-input bytes without runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p bootstrap evidence preserved/p-objects preserved/link-inputs preserved/abi

          V43_HEAD=53b85106d9f84da520c7d036048918845f810971
          V43_BLOB=5f87dccdd83574aeabe46024b6fc6fafd0351d30
          V43_RUN=35289602523
          V43_JOB=105429364488
          V43_ARTIFACT=10525488325
          V43_ARTIFACT_DIGEST=aa382cd8700d2d1bfd15f47712506c523f50070d8e9dd655c88a1a96fab401ca

          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/lowalt-lt5-p-netcdf-exact410-v43.yml?ref=${V43_HEAD}" \
            -o bootstrap/v43.yml
          test "$(git hash-object bootstrap/v43.yml)" = "$V43_BLOB"

          awk '
            /^        run: \|$/ { capture=1; next }
            capture && /^      - name: Upload immutable V43 pre-result evidence$/ { exit }
            capture { sub(/^          /, ""); print }
          ' bootstrap/v43.yml > bootstrap/v44-v43-run.sh
          test "$(grep -c '^set -euo pipefail$' bootstrap/v44-v43-run.sh)" = 1
          bash -n bootstrap/v44-v43-run.sh

          cat > evidence/v44-preexecution-receipt.txt <<EOF
          status=PRE_RESULT_V44_P_COMPILED_BYTE_PRESERVATION_FROZEN
          predecessor_v43_head=${V43_HEAD}
          predecessor_v43_blob=${V43_BLOB}
          predecessor_v43_run=${V43_RUN}
          predecessor_v43_job=${V43_JOB}
          predecessor_v43_artifact=${V43_ARTIFACT}
          predecessor_v43_artifact_digest=sha256:${V43_ARTIFACT_DIGEST}
          action=replay_exact_v43_then_copy_actual_compiled_objects_and_static_link_inputs
          candidate_semantics_changed=false
          source_or_dependency_identity_changed=false
          compiler_or_link_flags_changed=false
          worker_loadable_p_module=false
          link_export_closure_complete=false
          wasm_instantiated=false
          p_numerical_evaluation=false
          p_to_t_marshalling=false
          t_called=false
          lt5_result=false
          c_executed=false
          d_executed=false
          b_selected=false
          b_resolved=false
          production_changed=false
          EOF
          sha256sum bootstrap/v43.yml bootstrap/v44-v43-run.sh evidence/v44-preexecution-receipt.txt > evidence/v44-preexecution-sha256.txt

          # Rebuild the exact V43 PRE-RESULT compile/static-link closure. This does not
          # instantiate any WASM module or evaluate P.
          bash bootstrap/v44-v43-run.sh

          test -f work/evidence/v43-receipt.txt
          grep -Fxq 'status=PASS' work/evidence/v43-receipt.txt
          grep -Fxq 'classification=EXACT_P_COMPILE_CLOSURE_PASS_AFTER_V43_PATCH_POSTCONDITION_REPAIR' work/evidence/v43-receipt.txt
          grep -Fxq 'wasm_instantiated=false' work/evidence/v43-receipt.txt
          grep -Fxq 'runtime_executed=false' work/evidence/v43-receipt.txt
          grep -Fxq 'lt5_result=false' work/evidence/v43-receipt.txt

          # Preserve the actual P-facing object bytes that V43 previously only hashed.
          test -f work/ancillary.o
          test -f work/netCDF_functions.o
          cp work/ancillary.o preserved/p-objects/ancillary.o
          cp work/netCDF_functions.o preserved/p-objects/netCDF_functions.o
          test -f work/evidence/p-netcdf-objects-sha256.txt
          ANC_EXPECT="$(awk '$2=="ancillary.o" {print $1}' work/evidence/p-netcdf-objects-sha256.txt)"
          NCF_EXPECT="$(awk '$2=="netCDF_functions.o" {print $1}' work/evidence/p-netcdf-objects-sha256.txt)"
          test -n "$ANC_EXPECT"
          test -n "$NCF_EXPECT"
          test "$(sha256sum preserved/p-objects/ancillary.o | awk '{print $1}')" = "$ANC_EXPECT"
          test "$(sha256sum preserved/p-objects/netCDF_functions.o | awk '{print $1}')" = "$NCF_EXPECT"

          # Preserve exact static dependency link inputs and generated ABI/header surface.
          for f in libnetcdf.a libhdf5.a libhdf5_hl.a libz.a; do
            test -f "work/install/lib/$f"
            cp "work/install/lib/$f" "preserved/link-inputs/$f"
          done
          for f in netcdf.h netcdf_meta.h hdf5.h zlib.h; do
            test -f "work/install/include/$f"
            cp "work/install/include/$f" "preserved/link-inputs/$f"
          done
          test -f work/p-generated-abi.h
          cp work/p-generated-abi.h preserved/abi/p-generated-abi.h
          test -f work/build/netcdf/CMakeCache.txt
          cp work/build/netcdf/CMakeCache.txt preserved/link-inputs/netcdf-CMakeCache.txt

          # Cross-check copied archives against the exact V43-generated dependency hash ledger.
          test -f work/evidence/wasm-dependency-output-sha256.txt
          for f in libnetcdf.a libhdf5.a libhdf5_hl.a libz.a; do
            expected="$(awk -v n="/$f" '$2 ~ n"$" {print $1}' work/evidence/wasm-dependency-output-sha256.txt)"
            test -n "$expected"
            test "$(sha256sum "preserved/link-inputs/$f" | awk '{print $1}')" = "$expected"
          done

          sha256sum preserved/p-objects/* preserved/link-inputs/* preserved/abi/* > evidence/v44-preserved-bytes-sha256.txt
          wc -c preserved/p-objects/* preserved/link-inputs/* preserved/abi/* > evidence/v44-preserved-bytes-size.txt
          printf 'p_object_count=2\nstatic_link_archive_count=4\nworker_loadable_p_module=false\nlink_export_closure_complete=false\n' > evidence/v44-link-input-scope.txt

          cat > evidence/v44-receipt.txt <<EOF
          status=PASS
          classification=P_COMPILED_BYTES_AND_STATIC_LINK_INPUTS_PRESERVED_PRE_RESULT
          predecessor_v43_head=${V43_HEAD}
          predecessor_v43_run=${V43_RUN}
          actual_p_object_bytes_preserved=true
          actual_static_dependency_archive_bytes_preserved=true
          generated_p_abi_header_preserved=true
          netcdf_cmake_cache_preserved=true
          candidate_semantics_changed=false
          source_or_dependency_identity_changed=false
          compiler_or_link_flags_changed=false
          worker_loadable_p_module=false
          link_export_closure_complete=false
          wasm_instantiated=false
          p_numerical_evaluation=false
          p_to_t_marshalling=false
          t_called=false
          lt5_result=false
          c_executed=false
          d_executed=false
          b_selected=false
          b_resolved=false
          production_changed=false
          EOF
          sha256sum evidence/v44-receipt.txt >> evidence/v44-preserved-bytes-sha256.txt

      - name: Upload immutable V44 PRE-RESULT P bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-bytes-v44
          path: |
            evidence
            preserved
            work/evidence
            bootstrap/v43.yml
            bootstrap/v44-v43-run.sh
          if-no-files-found: error
          retention-days: 90
