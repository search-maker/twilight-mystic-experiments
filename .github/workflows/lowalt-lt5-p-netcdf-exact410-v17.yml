name: LowAlt LT5 P NetCDF Exact410 V17

on:
  push:
    branches:
      - review/lowalt-lt5-p-netcdf-exact410-v17-20260917
    paths:
      - .github/workflows/lowalt-lt5-p-netcdf-exact410-v17.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Execute V13 candidate with frozen selector and source-representation repairs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p bootstrap
          V13_HEAD=a4c5aaa6be54b63658d9fd765c4786eb77cc7c21
          V13_WORKFLOW_BLOB=f9eb21d03961867f83e99cc0883105eec65b9c31
          V16_HEAD=20a3944b70d6f7b83c988fb13a66f37e30b8d1e2
          V16_ARTIFACT_DIGEST=29c89996ca0cca330e2bafc972ce7df534916f21abf8a79774bb52f30fe14286
          V16_TARGET_SHA256=8886209a5457253dd7df3814f65fdcdd8e233d3b21c3c22d7687f97580155389
          V11_SOURCE_LINE_SHA256=d9e5aa213cb6df34ba02b0525b34c2b4db16d773214786a6ac89cb545dc091e1

          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/lowalt-lt5-p-netcdf-exact410-v13.yml?ref=${V13_HEAD}" \
            -o bootstrap/v13.yml
          test "$(git hash-object bootstrap/v13.yml)" = "$V13_WORKFLOW_BLOB"
          sha256sum bootstrap/v13.yml > bootstrap/v13-workflow-sha256.txt

          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          p = Path('bootstrap/v13.yml')
          s = p.read_text()
          bs = chr(92)
          nl = chr(10)

          # Preserve the already-proven V14 selector repair exactly in semantics:
          # anchor the trap injection at the unique V9 transform read, not a generic read_text.
          old_needle = "          needle = '''          s = p.read_text()" + bs + "n'''"
          new_needle = "          needle = '''          p = Path('bootstrap/v9-run.sh')" + bs + "n          s = p.read_text()" + bs + "n'''"
          old_injection = "          injection = '''          s = p.read_text()" + bs + "n"
          new_injection = "          injection = '''          p = Path('bootstrap/v9-run.sh')" + bs + "n          s = p.read_text()" + bs + "n"
          assert s.count(old_needle) == 1
          assert s.count(old_injection) == 1
          s = s.replace(old_needle, new_needle)
          s = s.replace(old_injection, new_injection)
          assert s.count(old_needle) == 0
          assert s.count(old_injection) == 0
          assert s.count(new_needle) == 1
          assert s.count(new_injection) == 1

          # V16 proved V13's HDF5 matcher used evaluated inner bytes while the raw V11
          # workflow contains the nested Python-source representation: three literal
          # backslashes followed by literal 'n'. Replace only the V13 matcher definitions.
          start_marker = "          old_flag = '''  -DHDF5_HAS_COLL_METADATA_OPS=OFF"
          end_marker = "          assert s.count(old_flag) == 1"
          assert s.count(start_marker) == 1
          start = s.index(start_marker)
          end = s.index(end_marker, start)
          source_bs_expr = "source_bs = chr(92)"
          replacement = nl.join([
              "          source_bs = chr(92)",
              "          old_flag = '  -DHDF5_HAS_COLL_METADATA_OPS=OFF ' + (source_bs * 3) + 'n'",
              "          new_flag = '  -DHDF5_DIR=$PREFIX/cmake ' + (source_bs * 3) + 'n' + '  -DHDF5_HAS_COLL_METADATA_OPS=OFF ' + (source_bs * 3) + 'n'",
          ]) + nl
          s = s[:start] + replacement + s[end:]
          assert s.count(source_bs_expr) == 1
          assert s.count("old_flag = '  -DHDF5_HAS_COLL_METADATA_OPS=OFF ' + (source_bs * 3) + 'n'") == 1
          assert s.count("new_flag = '  -DHDF5_DIR=$PREFIX/cmake ' + (source_bs * 3) + 'n' + '  -DHDF5_HAS_COLL_METADATA_OPS=OFF ' + (source_bs * 3) + 'n'") == 1

          Path('bootstrap/v17-patched-v13.yml').write_text(s)
          Path('bootstrap/v17-patch-receipt.txt').write_text(
              'v13_head=a4c5aaa6be54b63658d9fd765c4786eb77cc7c21' + nl
              + 'v13_blob=f9eb21d03961867f83e99cc0883105eec65b9c31' + nl
              + 'v16_head=20a3944b70d6f7b83c988fb13a66f37e30b8d1e2' + nl
              + 'v16_artifact_digest=sha256:29c89996ca0cca330e2bafc972ce7df534916f21abf8a79774bb52f30fe14286' + nl
              + 'v16_target_sha256=8886209a5457253dd7df3814f65fdcdd8e233d3b21c3c22d7687f97580155389' + nl
              + 'v11_source_line_sha256=d9e5aa213cb6df34ba02b0525b34c2b4db16d773214786a6ac89cb545dc091e1' + nl
              + 'preserved_v14_unique_selector_repair=true' + nl
              + 'new_repair=v13_hdf5_nested_python_source_representation_only' + nl
              + 'candidate_semantics_changed=false' + nl
          )
          PY

          sha256sum bootstrap/v17-patched-v13.yml bootstrap/v17-patch-receipt.txt > bootstrap/v17-patch-sha256.txt
          diff -u bootstrap/v13.yml bootstrap/v17-patched-v13.yml > bootstrap/v13-to-v17.diff || test "$?" = 1
          test "$(grep -c '^@@' bootstrap/v13-to-v17.diff)" -ge 1
          grep -Fq "source_bs = chr(92)" bootstrap/v17-patched-v13.yml
          grep -Fq "(source_bs * 3) + 'n'" bootstrap/v17-patched-v13.yml
          grep -Fq "p = Path('bootstrap/v9-run.sh')\\n          s = p.read_text()\\n" bootstrap/v17-patched-v13.yml

          awk '
            /^        run: \|$/ { capture=1; next }
            capture && /^      - name: Upload immutable pre-result exact410 V13 evidence$/ { exit }
            capture { sub(/^          /, ""); print }
          ' bootstrap/v17-patched-v13.yml > bootstrap/v17-inner.sh
          test "$(grep -c '^set -euo pipefail$' bootstrap/v17-inner.sh)" = 1
          sha256sum bootstrap/v17-inner.sh > bootstrap/v17-inner-sha256.txt

          # Compile/link only. The inherited V13/V11/V9 candidate never instantiates WASM.
          bash bootstrap/v17-inner.sh

          test -f work/evidence/v13-receipt.txt
          grep -Fxq 'status=PASS' work/evidence/v13-receipt.txt
          grep -Fxq 'classification=EXACT_BUILD1_NETCDF_4_10_0_HDF5_CONFIG_DISCOVERY_P_COMPILE_CLOSURE_PASS' work/evidence/v13-receipt.txt
          grep -Fxq 'wasm_instantiated=false' work/evidence/v13-receipt.txt
          grep -Fxq 'runtime_executed=false' work/evidence/v13-receipt.txt
          grep -Fxq 'lt5_result=false' work/evidence/v13-receipt.txt
          grep -Fxq 'c_executed=false' work/evidence/v13-receipt.txt
          grep -Fxq 'd_executed=false' work/evidence/v13-receipt.txt
          grep -Fxq 'b_selected=false' work/evidence/v13-receipt.txt
          grep -Fxq 'b_resolved=false' work/evidence/v13-receipt.txt
          grep -Fxq 'production_changed=false' work/evidence/v13-receipt.txt

          test -f work/build/netcdf/CMakeCache.txt
          grep -Eq '^HDF5_DIR:PATH=.*/work/install/cmake$' work/build/netcdf/CMakeCache.txt
          grep -Fq 'Found HDF5 version: 1.14.3' work/evidence/netcdf-configure.txt
          grep -Eq '^#define[[:space:]]+NC_VERSION_MAJOR[[:space:]]+4$' work/install/include/netcdf_meta.h
          grep -Eq '^#define[[:space:]]+NC_VERSION_MINOR[[:space:]]+10$' work/install/include/netcdf_meta.h
          grep -Eq '^#define[[:space:]]+NC_VERSION_PATCH[[:space:]]+0$' work/install/include/netcdf_meta.h

          cp bootstrap/v13-workflow-sha256.txt work/evidence/
          cp bootstrap/v17-patch-sha256.txt work/evidence/
          cp bootstrap/v13-to-v17.diff work/evidence/
          cp bootstrap/v17-inner-sha256.txt work/evidence/
          cp bootstrap/v17-patch-receipt.txt work/evidence/

          cat > work/evidence/v17-receipt.txt <<EOF
          status=PASS
          classification=EXACT_BUILD1_NETCDF_4_10_0_HDF5_CONFIG_DISCOVERY_P_COMPILE_CLOSURE_PASS_AFTER_SELECTOR_AND_SOURCE_REPRESENTATION_REPAIRS
          predecessor_v16_run=35263445932
          predecessor_v16_first_false=V13_HDF5_EVALUATED_OLD_FLAG
          predecessor_v16_artifact_digest=sha256:${V16_ARTIFACT_DIGEST}
          preserved_v14_unique_selector_repair=true
          repair=v13_hdf5_nested_python_source_representation_only
          candidate_semantics_changed=false
          netcdf_source_modified=false
          libradtran_source_modified=false
          wasm_instantiated=false
          runtime_executed=false
          lt5_result=false
          c_executed=false
          d_executed=false
          b_selected=false
          b_resolved=false
          production_changed=false
          EOF

      - name: Upload immutable pre-result exact410 V17 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-netcdf-exact410-v17
          path: |
            work/evidence
            bootstrap/v13-workflow-sha256.txt
            bootstrap/v17-patch-sha256.txt
            bootstrap/v13-to-v17.diff
            bootstrap/v17-inner-sha256.txt
            bootstrap/v17-patch-receipt.txt
          if-no-files-found: error
          retention-days: 90
