name: LowAlt LT5 P NetCDF Exact410 V19

on:
  push:
    branches:
      - review/lowalt-lt5-p-netcdf-exact410-v19-20260917
    paths:
      - .github/workflows/lowalt-lt5-p-netcdf-exact410-v19.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Execute exact V17 candidate with one V18-proven cardinality repair
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p bootstrap evidence
          V17_HEAD=e874cb2f7b7319c1258fe9a12952c6a1ea274338
          V17_BLOB=8054d300416de8853088802b2b7d122855691cf2
          V18_RUN=35264524403
          V18_ARTIFACT=10516176807
          V18_ARTIFACT_DIGEST=3c877a0217edd09b4d01059a95b37ac836e85da2f43c2bd756d1979bf88c8b0e
          V18_REPORT_SHA256=20f8176e92375777030590ad53390b72255a36f1fcc58cb45347ec09fa6865f4
          V18_RECEIPT_SHA256=866b4f3443547417a1d566be3031d1710e967a82ad4c10f47c88d821493b08e9

          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/lowalt-lt5-p-netcdf-exact410-v17.yml?ref=${V17_HEAD}" \
            -o bootstrap/v17.yml
          test "$(git hash-object bootstrap/v17.yml)" = "$V17_BLOB"
          sha256sum bootstrap/v17.yml > evidence/v17-workflow-sha256.txt

          awk '
            /^        run: \|$/ { capture=1; next }
            capture && /^      - name: Upload immutable pre-result exact410 V17 evidence$/ { exit }
            capture { sub(/^          /, ""); print }
          ' bootstrap/v17.yml > bootstrap/v17-run.sh
          test "$(grep -c '^set -euo pipefail$' bootstrap/v17-run.sh)" = 1

          python3 - <<'PY'
          from pathlib import Path
          s = Path('bootstrap/v17-run.sh').read_text()
          marker = 'sha256sum bootstrap/v17-patched-v13.yml bootstrap/v17-patch-receipt.txt > bootstrap/v17-patch-sha256.txt\n'
          assert s.count(marker) == 1
          a, b = s.split(marker, 1)
          Path('bootstrap/v19-prefix.sh').write_text(a)
          Path('bootstrap/v19-suffix.sh').write_text(marker + b)
          PY
          sha256sum bootstrap/v17-run.sh bootstrap/v19-prefix.sh bootstrap/v19-suffix.sh > evidence/v19-split-sha256.txt

          # Run only the exact V17 preparation prefix. It fetches the frozen V13 input and
          # produces V17's patched V13 bytes; it does not enter the nested V9 dependency build.
          source bootstrap/v19-prefix.sh

          test "$(sha256sum bootstrap/v17-patched-v13.yml | awk '{print $1}')" = "117b319943e71f7ee39f1941cdd6cfb866e122e9f8eb9d8b4591ba0ed2076efa"
          cp bootstrap/v17-patched-v13.yml evidence/v19-before-cardinality-repair.yml

          python3 - <<'PY'
          from pathlib import Path
          p = Path('bootstrap/v17-patched-v13.yml')
          s = p.read_text()
          old = '''          test "$(grep -c 'EVIDENCE_DIR=' bootstrap/v13-patched-v11.yml)" = 2'''
          new = '''          test "$(grep -c 'EVIDENCE_DIR=' bootstrap/v13-patched-v11.yml)" = 1'''
          assert s.count(old) == 1
          assert s.count(new) == 0
          s = s.replace(old, new)
          assert s.count(old) == 0
          assert s.count(new) == 1
          p.write_text(s)
          PY

          cp bootstrap/v17-patched-v13.yml evidence/v19-after-cardinality-repair.yml
          diff -u evidence/v19-before-cardinality-repair.yml evidence/v19-after-cardinality-repair.yml > evidence/v19-cardinality-only.diff || test "$?" = 1
          test "$(grep -c '^@@' evidence/v19-cardinality-only.diff)" = 1
          grep -Fq "EVIDENCE_DIR=' bootstrap/v13-patched-v11.yml)\" = 1" evidence/v19-after-cardinality-repair.yml
          sha256sum evidence/v19-before-cardinality-repair.yml evidence/v19-after-cardinality-repair.yml evidence/v19-cardinality-only.diff > evidence/v19-cardinality-repair-sha256.txt

          cat > evidence/v19-preexecution-receipt.txt <<EOF
          status=PRE_RESULT_CARDINALITY_REPAIR_FROZEN
          predecessor_v17_head=${V17_HEAD}
          predecessor_v17_blob=${V17_BLOB}
          predecessor_v18_run=${V18_RUN}
          predecessor_v18_artifact=${V18_ARTIFACT}
          predecessor_v18_artifact_digest=sha256:${V18_ARTIFACT_DIGEST}
          predecessor_v18_report_sha256=${V18_REPORT_SHA256}
          predecessor_v18_receipt_sha256=${V18_RECEIPT_SHA256}
          predecessor_v18_first_false=V13_POST_EVIDENCE_DIR_LINE_CARDINALITY
          predecessor_v18_observed=1
          predecessor_v18_expected=2
          repair=V13_POST_EVIDENCE_DIR_LINE_CARDINALITY_EXPECTATION_2_TO_1_ONLY
          candidate_semantics_changed=false
          source_or_dependency_identity_changed=false
          wasm_instantiated=false
          runtime_executed=false
          lt5_result=false
          c_executed=false
          d_executed=false
          b_selected=false
          b_resolved=false
          production_changed=false
          EOF

          # Continue the exact V17 compile/link-only suffix against the one-line-corrected
          # harness bytes. The nested candidate remains PRE-RESULT and never instantiates WASM.
          source bootstrap/v19-suffix.sh

          test -f work/evidence/v13-receipt.txt
          grep -Fxq 'status=PASS' work/evidence/v13-receipt.txt
          grep -Fxq 'wasm_instantiated=false' work/evidence/v13-receipt.txt
          grep -Fxq 'runtime_executed=false' work/evidence/v13-receipt.txt
          grep -Fxq 'lt5_result=false' work/evidence/v13-receipt.txt
          grep -Fxq 'c_executed=false' work/evidence/v13-receipt.txt
          grep -Fxq 'd_executed=false' work/evidence/v13-receipt.txt
          grep -Fxq 'b_selected=false' work/evidence/v13-receipt.txt
          grep -Fxq 'b_resolved=false' work/evidence/v13-receipt.txt
          grep -Fxq 'production_changed=false' work/evidence/v13-receipt.txt

          cp evidence/v19-* work/evidence/
          cat > work/evidence/v19-receipt.txt <<EOF
          status=PASS
          classification=EXACT_BUILD1_NETCDF_4_10_0_HDF5_CONFIG_DISCOVERY_P_COMPILE_CLOSURE_PASS_AFTER_V18_CARDINALITY_REPAIR
          predecessor_v17_run=35264076779
          predecessor_v18_run=${V18_RUN}
          repair=V13_POST_EVIDENCE_DIR_LINE_CARDINALITY_EXPECTATION_2_TO_1_ONLY
          candidate_semantics_changed=false
          source_or_dependency_identity_changed=false
          wasm_instantiated=false
          runtime_executed=false
          lt5_result=false
          c_executed=false
          d_executed=false
          b_selected=false
          b_resolved=false
          production_changed=false
          EOF
          sha256sum work/evidence/v19-receipt.txt >> work/evidence/v19-cardinality-repair-sha256.txt

      - name: Upload immutable pre-result exact410 V19 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-netcdf-exact410-v19
          path: |
            work/evidence
            evidence
            bootstrap/v17-workflow-sha256.txt
            bootstrap/v17-patch-sha256.txt
            bootstrap/v13-to-v17.diff
            bootstrap/v17-inner-sha256.txt
            bootstrap/v17-patch-receipt.txt
          if-no-files-found: warn
          retention-days: 90
