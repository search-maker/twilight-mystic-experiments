name: LowAlt LT5 P NetCDF Exact410 V29 Serialization Repair

on:
  push:
    branches:
      - review/lowalt-lt5-p-netcdf-exact410-v29-20260917
    paths:
      - .github/workflows/lowalt-lt5-p-netcdf-exact410-v29.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Replay exact V28 substrate with one nested serialization-layer repair
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p bootstrap evidence

          V28_HEAD=bfb7120437c4acd26fc4cf76baab99110202f077
          V28_BLOB=1df829e5e3e03f3ce5403c35767bc2b2bb523971
          V28_RUN=35277785776
          V28_JOB=105392443182
          V28_ARTIFACT=10521327128
          V28_ARTIFACT_DIGEST=165cf0241888bd8bf25bab1b1c48bec5fe24cae5cd11d9b9ecead4bbabfdef85
          V28_FAULTY_V25_SHA256=48de7f3d6c36287369244b3990d4c126fd819e6cf21c92817a1636caa58d8d70
          V28_BEFORE_V13_SHA256=b519740755bd0543998214eb62f6d157ff9fcd9360a4586fa36b7c8092b916c8
          OLD_SEGMENT_SHA256=4f14c20e57743a15b1b55523fd8a6fd2030cc850d9c4c9c95f26c10c150fd53b
          NEW_SEGMENT_SHA256=c4a805ca5259f17d1d3adc3930165bb18d2b1f849332cf28f71ae1cacb114bc2
          NEW_SEGMENT_B64=''

          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/lowalt-lt5-p-netcdf-exact410-v28.yml?ref=${V28_HEAD}" \
            -o bootstrap/v28.yml
          test "$(git hash-object bootstrap/v28.yml)" = "$V28_BLOB"
          sha256sum bootstrap/v28.yml > evidence/v29-sha256.txt

          awk '
            /^        run: \|$/ { capture=1; next }
            capture && /^      - name: Upload immutable V28 pre-result evidence$/ { exit }
            capture { sub(/^          /, ""); print }
          ' bootstrap/v28.yml > bootstrap/v28-run.sh
          test "$(grep -c '^set -euo pipefail$' bootstrap/v28-run.sh)" = 1

          python3 - <<'PY_SPLIT'
          from pathlib import Path
          s = Path('bootstrap/v28-run.sh').read_text()
          marker = 'bash bootstrap/v25-run.sh\n'
          assert s.count(marker) == 1
          a, b = s.split(marker, 1)
          Path('bootstrap/v29-v28-prefix.sh').write_text(a)
          Path('bootstrap/v29-v28-suffix.sh').write_text(marker + b)
          PY_SPLIT
          sha256sum bootstrap/v28-run.sh bootstrap/v29-v28-prefix.sh bootstrap/v29-v28-suffix.sh >> evidence/v29-sha256.txt

          # Execute only V28's already-frozen preparation. It recreates the exact faulty
          # V28-generated V25 script but stops before that script is executed.
          source bootstrap/v29-v28-prefix.sh
          test -f bootstrap/v25-run.sh
          test "$(sha256sum bootstrap/v25-run.sh | awk '{print $1}')" = "$V28_FAULTY_V25_SHA256"
          cp bootstrap/v25-run.sh evidence/v29-v25-run-before.sh

          export OLD_SEGMENT_SHA256 NEW_SEGMENT_SHA256 NEW_SEGMENT_B64
          python3 - <<'PY_V29_SERIALIZATION'
          from pathlib import Path
          import base64, hashlib, os

          p = Path('bootstrap/v25-run.sh')
          s = p.read_text()
          start_token = 'needle = "          Path(\'bootstrap/v13-patched-v11.yml\').write_text(s)'
          end_token = 'p2.write_text(t)'
          assert s.count(start_token) == 1
          start = s.index(start_token)
          end = s.index(end_token, start) + len(end_token)
          old = s[start:end]
          assert hashlib.sha256(old.encode()).hexdigest() == os.environ['OLD_SEGMENT_SHA256']
          new = base64.b64decode(os.environ['NEW_SEGMENT_B64']).decode()
          assert hashlib.sha256(new.encode()).hexdigest() == os.environ['NEW_SEGMENT_SHA256']
          assert old != new
          assert s.count(old) == 1
          assert s.count(new) == 0
          s = s[:start] + new + s[end:]
          assert s.count(old) == 0
          assert s.count(new) == 1
          p.write_text(s)
          PY_V29_SERIALIZATION

          cp bootstrap/v25-run.sh evidence/v29-v25-run-after.sh
          diff -u evidence/v29-v25-run-before.sh evidence/v29-v25-run-after.sh > evidence/v29-serialization-only.diff || test "$?" = 1
          test "$(grep -c '^@@' evidence/v29-serialization-only.diff)" = 1
          grep -Fq 'Path('"'"'bootstrap/v13-patched-v11.yml'"'"').write_text(s)\\n' evidence/v29-v25-run-before.sh
          grep -Fq 'Path('"'"'bootstrap/v13-patched-v11.yml'"'"').write_text(s)\n' evidence/v29-v25-run-after.sh
          sha256sum evidence/v29-v25-run-before.sh evidence/v29-v25-run-after.sh evidence/v29-serialization-only.diff >> evidence/v29-sha256.txt

          # Static syntax proof of the corrected generated harness and its nested Python body.
          bash -n bootstrap/v25-run.sh
          python3 - <<'PY_STATIC'
          from pathlib import Path
          s = Path('bootstrap/v25-run.sh').read_text()
          begin = "python3 - <<'PY_V28_PLUGIN_POSTCONDITION'\n"
          end = '\nPY_V28_PLUGIN_POSTCONDITION\n'
          assert s.count(begin) == 1
          a = s.index(begin) + len(begin)
          b = s.index(end, a)
          body = s[a:b]
          compile(body, 'PY_V28_PLUGIN_POSTCONDITION', 'exec')
          assert 'NETCDF_ENABLE_PLUGINS:BOOL=OFF' in body
          assert 'NETCDF_ENABLE_PLUGINS:INTERNAL=OFF' in body
          Path('evidence/v29-corrected-inner-python-sha256.txt').write_text(
              __import__('hashlib').sha256(body.encode()).hexdigest() + '  PY_V28_PLUGIN_POSTCONDITION\n'
          )
          PY_STATIC

          cat > evidence/v29-preexecution-receipt.txt <<EOF
          status=PRE_RESULT_NESTED_SERIALIZATION_LAYER_REPAIR_FROZEN
          predecessor_v28_head=${V28_HEAD}
          predecessor_v28_run=${V28_RUN}
          predecessor_v28_job=${V28_JOB}
          predecessor_v28_artifact=${V28_ARTIFACT}
          predecessor_v28_artifact_digest=sha256:${V28_ARTIFACT_DIGEST}
          predecessor_faulty_v25_sha256=${V28_FAULTY_V25_SHA256}
          predecessor_before_v13_sha256=${V28_BEFORE_V13_SHA256}
          old_segment_sha256=${OLD_SEGMENT_SHA256}
          corrected_segment_sha256=${NEW_SEGMENT_SHA256}
          repair=V28_NESTED_PYTHON_ESCAPE_SERIALIZATION_ONE_LAYER_ONLY
          candidate_semantics_changed=false
          source_or_dependency_identity_changed=false
          wasm_instantiated=false
          runtime_executed=false
          lt5_result=false
          c_executed=false
          d_executed=false
          b_selected=false
          b_resolved=false
          production_changed=false
          EOF
          sha256sum evidence/v29-preexecution-receipt.txt >> evidence/v29-sha256.txt

          # Execute the corrected inherited PRE-RESULT chain exactly once. It still contains
          # the V27 diagnostic first-false probe and never instantiates generated WASM.
          bash bootstrap/v25-run.sh

          test -f work/build/netcdf/CMakeCache.txt
          grep -Eq '^NETCDF_ENABLE_PLUGINS:INTERNAL=OFF$' work/build/netcdf/CMakeCache.txt
          test -f work/evidence/v11-receipt.txt
          grep -Fxq 'status=PASS' work/evidence/v11-receipt.txt
          grep -Fxq 'wasm_instantiated=false' work/evidence/v11-receipt.txt
          grep -Fxq 'runtime_executed=false' work/evidence/v11-receipt.txt
          grep -Fxq 'lt5_result=false' work/evidence/v11-receipt.txt
          grep -Fxq 'c_executed=false' work/evidence/v11-receipt.txt
          grep -Fxq 'd_executed=false' work/evidence/v11-receipt.txt
          grep -Fxq 'b_selected=false' work/evidence/v11-receipt.txt
          grep -Fxq 'b_resolved=false' work/evidence/v11-receipt.txt
          grep -Fxq 'production_changed=false' work/evidence/v11-receipt.txt

          cp evidence/v29-* work/evidence/
          cat > work/evidence/v29-receipt.txt <<EOF
          status=PASS
          classification=EXACT_BUILD1_NETCDF_4_10_0_P_COMPILE_CLOSURE_PASS_AFTER_PLUGIN_POSTCONDITION_AND_SERIALIZATION_REPAIRS
          predecessor_v28_run=${V28_RUN}
          repair=V28_NESTED_PYTHON_ESCAPE_SERIALIZATION_ONE_LAYER_ONLY
          observed_cache=NETCDF_ENABLE_PLUGINS:INTERNAL=OFF
          candidate_semantics_changed=false
          source_or_dependency_identity_changed=false
          wasm_instantiated=false
          runtime_executed=false
          lt5_result=false
          c_executed=false
          d_executed=false
          b_selected=false
          b_resolved=false
          production_changed=false
          EOF
          sha256sum work/evidence/v29-receipt.txt >> work/evidence/v29-sha256.txt

      - name: Upload immutable V29 pre-result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-netcdf-exact410-v29
          path: |
            evidence
            work/evidence
            bootstrap/v28.yml
            bootstrap/v28-run.sh
            bootstrap/v29-v28-prefix.sh
            bootstrap/v29-v28-suffix.sh
            bootstrap/v25-run.sh
          if-no-files-found: warn
          retention-days: 90
