name: LowAlt LT5 P NetCDF Exact410 V35 Relocated Outer Repair

on:
  push:
    branches:
      - review/lowalt-lt5-p-netcdf-exact410-v35-20260917
    paths:
      - .github/workflows/lowalt-lt5-p-netcdf-exact410-v35.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Preserve V31 proof then apply exact V13 outer repair before candidate chain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p bootstrap evidence

          V32_HEAD=60d7d784549732b3a0316fb83019dc8186918f67
          V32_BLOB=a966fb8b148f4202c61b97ff8a037c8dcea67158
          V32_RUN=35280966694
          V34_RUN=35281888754
          V34_ARTIFACT=10522990034
          V34_ARTIFACT_DIGEST=5f6ef27d78d9754251c46a8c0fe54c441df3732b580a0bf650af2b30303bcbd7

          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/lowalt-lt5-p-netcdf-exact410-v32.yml?ref=${V32_HEAD}" \
            -o bootstrap/v32.yml
          test "$(git hash-object bootstrap/v32.yml)" = "$V32_BLOB"
          sha256sum bootstrap/v32.yml > evidence/v35-sha256.txt

          awk '
            /^        run: \|$/ { capture=1; next }
            capture && /^      - name: Upload immutable V31 pre-result evidence$/ { exit }
            capture { sub(/^          /, ""); print }
          ' bootstrap/v32.yml > bootstrap/v32-run.sh
          test "$(grep -c '^set -euo pipefail$' bootstrap/v32-run.sh)" = 1
          bash -n bootstrap/v32-run.sh

          python3 - <<'PY_V35_INSERT'
          from pathlib import Path
          p = Path('bootstrap/v32-run.sh')
          s = p.read_text()
          needle = "source bootstrap/v19-suffix.sh\n"
          assert s.count(needle) == 1
          insert_lines = [
              "python3 - <<'PY_V35_OUTER'",
              "from pathlib import Path",
              "from difflib import unified_diff",
              "p = Path('bootstrap/v17-patched-v13.yml')",
              "before = p.read_text()",
              "pairs = [",
              "    (\"          grep -Eq '^#define[[:space:]]+NC_VERSION_MAJOR[[:space:]]+4$' work/install/include/netcdf_meta.h\\n\", \"          grep -Fxq '#define NC_VERSION_MAJOR 4 /*!< netcdf-c major version. */' work/install/include/netcdf_meta.h\\n\"),",
              "    (\"          grep -Eq '^#define[[:space:]]+NC_VERSION_MINOR[[:space:]]+10$' work/install/include/netcdf_meta.h\\n\", \"          grep -Fxq '#define NC_VERSION_MINOR 10 /*!< netcdf-c minor version. */' work/install/include/netcdf_meta.h\\n\"),",
              "    (\"          grep -Eq '^#define[[:space:]]+NC_VERSION_PATCH[[:space:]]+0$' work/install/include/netcdf_meta.h\\n\", \"          grep -Fxq '#define NC_VERSION_PATCH 0 /*!< netcdf-c patch version. */' work/install/include/netcdf_meta.h\\n\"),",
              "]",
              "lines = before.splitlines(keepends=True)",
              "for old, new in pairs:",
              "    assert lines.count(old) == 1, old",
              "    assert lines.count(new) == 0, new",
              "    lines[lines.index(old)] = new",
              "    assert lines.count(old) == 0",
              "    assert lines.count(new) == 1",
              "after = ''.join(lines)",
              "d = ''.join(unified_diff(before.splitlines(True), after.splitlines(True), fromfile='v13-outer-before', tofile='v13-outer-after'))",
              "dl = d.splitlines()",
              "assert sum(1 for line in dl if line.startswith('-') and not line.startswith('---')) == 3",
              "assert sum(1 for line in dl if line.startswith('+') and not line.startswith('+++')) == 3",
              "Path('bootstrap/v35-v13-outer-version-postconditions.diff').write_text(d)",
              "Path('bootstrap/v35-v13-outer-version-postconditions-receipt.txt').write_text(",
              "    'repair=RELOCATED_EXACT_V13_OUTER_NETCDF_4_10_0_VERSION_POSTCONDITIONS_ONLY\\n'",
              "    'changed_outer_postconditions=3\\n'",
              "    'v31_one_hunk_proof_preserved_before_this_repair=true\\n'",
              "    'candidate_semantics_changed=false\\n'",
              "    'source_or_dependency_identity_changed=false\\n'",
              ")",
              "p.write_text(after)",
              "PY_V35_OUTER",
          ]
          insert = "\n".join(insert_lines) + "\n"
          out = s.replace(needle, insert + needle)
          assert out.count('RELOCATED_EXACT_V13_OUTER_NETCDF_4_10_0_VERSION_POSTCONDITIONS_ONLY') == 1
          assert out.count(needle) == 1
          Path('bootstrap/v35-run.sh').write_text(out)
          PY_V35_INSERT

          bash -n bootstrap/v35-run.sh
          diff -u bootstrap/v32-run.sh bootstrap/v35-run.sh > evidence/v35-v32-run-to-v35-run.diff || test "$?" = 1
          test "$(grep -c '^@@' evidence/v35-v32-run-to-v35-run.diff)" = 1

          python3 - <<'PY_V35_EXTRACT'
          from pathlib import Path
          s = Path('bootstrap/v35-run.sh').read_text()
          start = "python3 - <<'PY_V35_OUTER'\n"
          end = "\nPY_V35_OUTER\n"
          assert s.count(start) == 1
          a = s.index(start) + len(start)
          b = s.index(end, a)
          Path('bootstrap/v35-outer.py').write_text(s[a:b] + "\n")
          PY_V35_EXTRACT
          python3 -m py_compile bootstrap/v35-outer.py
          sha256sum bootstrap/v32-run.sh bootstrap/v35-run.sh bootstrap/v35-outer.py evidence/v35-v32-run-to-v35-run.diff >> evidence/v35-sha256.txt

          cat > evidence/v35-preexecution-receipt.txt <<EOF
          status=PRE_RESULT_V31_PROOF_PRESERVED_V13_OUTER_REPAIR_RELOCATED
          predecessor_v32_head=${V32_HEAD}
          predecessor_v32_blob=${V32_BLOB}
          predecessor_v32_run=${V32_RUN}
          predecessor_v34_run=${V34_RUN}
          predecessor_v34_artifact=${V34_ARTIFACT}
          predecessor_v34_artifact_digest=sha256:${V34_ARTIFACT_DIGEST}
          predecessor_v34_first_false=V31_INJECTION_DIFF_ONE_HUNK_PROOF_AFTER_EARLY_OUTER_PATCH
          repair=RELOCATE_EXACT_V13_OUTER_REPAIR_AFTER_V31_PROOF_BEFORE_V19_SUFFIX_ONLY
          candidate_semantics_changed=false
          source_or_dependency_identity_changed=false
          compiler_or_link_flags_changed=false
          wasm_instantiated=false
          runtime_executed=false
          lt5_result=false
          c_executed=false
          d_executed=false
          b_selected=false
          b_resolved=false
          production_changed=false
          EOF
          sha256sum evidence/v35-preexecution-receipt.txt >> evidence/v35-sha256.txt

          # PRE-RESULT compile/link diagnostic only. A new first-false remains terminal.
          bash bootstrap/v35-run.sh

          # Reachable only if all inherited diagnostics pass.
          test -f work/evidence/v13-receipt.txt
          grep -Fxq 'status=PASS' work/evidence/v13-receipt.txt
          test -f bootstrap/v35-v13-outer-version-postconditions.diff
          cp evidence/v35-* work/evidence/
          cp bootstrap/v35-v13-outer-version-postconditions.diff work/evidence/
          cp bootstrap/v35-v13-outer-version-postconditions-receipt.txt work/evidence/
          cat > work/evidence/v35-receipt.txt <<EOF
          status=PASS
          classification=EXACT_P_COMPILE_CLOSURE_PASS_AFTER_RELOCATED_V13_OUTER_VERSION_REPAIR
          predecessor_v32_run=${V32_RUN}
          candidate_semantics_changed=false
          source_or_dependency_identity_changed=false
          compiler_or_link_flags_changed=false
          wasm_instantiated=false
          runtime_executed=false
          lt5_result=false
          c_executed=false
          d_executed=false
          b_selected=false
          b_resolved=false
          production_changed=false
          EOF

      - name: Upload immutable V35 pre-result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-netcdf-exact410-v35
          path: |
            evidence
            work/evidence
            bootstrap
          if-no-files-found: warn
          retention-days: 90
