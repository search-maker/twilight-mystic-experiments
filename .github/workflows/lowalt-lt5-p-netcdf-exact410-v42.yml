name: LowAlt LT5 P NetCDF Exact410 V42 NC_VERSION_MINOR Repair

on:
  push:
    branches:
      - review/lowalt-lt5-p-netcdf-exact410-v42-20260917
    paths:
      - .github/workflows/lowalt-lt5-p-netcdf-exact410-v42.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Replay exact V41 and patch only MINOR postcondition
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p bootstrap evidence

          V41_HEAD=6a95b9448f149fea5241e9e573159841fd593a89
          V41_BLOB=845f98c7c900bfbbc86f157a489cf19c174c91b6
          V41_RUN=35287941254
          V41_JOB=105424322705
          V41_ARTIFACT=10525232273
          V41_ARTIFACT_DIGEST=4d68a5f87bc07c7a18653bcabacd9e0b83d0484245bf9c15fe92ed7df65ad840
          V41_TOP_SHA256=de0da0925412e56f653a0826290a0b882288fcb82c3ae8bb9c97e16e4b935642
          V41_DIFF_SHA256=63ca18d15c5955aac2fe662674b3761be8f3c8178badd1bbd8a541873bb5a17d
          V19_SUFFIX_SHA256=a8347298d67efb6d7b4d769300df41fd5b87e6deeab87ae4a686c74a30999fb5

          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/lowalt-lt5-p-netcdf-exact410-v41.yml?ref=${V41_HEAD}" \
            -o bootstrap/v41.yml
          test "$(git hash-object bootstrap/v41.yml)" = "$V41_BLOB"

          awk '
            /^        run: \|$/ { capture=1; next }
            capture && /^      - name: Upload immutable V41 pre-result evidence$/ { exit }
            capture { sub(/^          /, ""); print }
          ' bootstrap/v41.yml > bootstrap/v41-run.sh
          test "$(grep -c '^set -euo pipefail$' bootstrap/v41-run.sh)" = 1
          bash -n bootstrap/v41-run.sh

          python3 - <<'PY_V42_SPLIT'
          from pathlib import Path
          s = Path('bootstrap/v41-run.sh').read_text()
          marker = 'bash bootstrap/v41-top-run.sh\n'
          assert s.count(marker) == 1
          a, b = s.split(marker, 1)
          Path('bootstrap/v42-v41-prefix.sh').write_text(a)
          Path('bootstrap/v42-v41-tail.sh').write_text(b)
          PY_V42_SPLIT
          bash -n bootstrap/v42-v41-prefix.sh

          # Reproduce V41 exactly up to, but not including, its failing child execution.
          source bootstrap/v42-v41-prefix.sh
          test -f bootstrap/v41-top-run.sh
          test "$(sha256sum bootstrap/v41-top-run.sh | awk '{print $1}')" = "$V41_TOP_SHA256"
          test "$(sha256sum evidence/v41-v40-nested-newline-serialization-only.diff | awk '{print $1}')" = "$V41_DIFF_SHA256"
          cp bootstrap/v41-top-run.sh evidence/v42-v41-top-run-before.sh

          # V41 gets through HDF5_DIR and the exact MAJOR line, then stops on V19 line 35.
          # Repair only that newly observed MINOR postcondition; PATCH remains untouched.
          python3 - <<'PY_V42_REPAIR'
          from pathlib import Path
          from difflib import unified_diff
          p = Path('bootstrap/v41-top-run.sh')
          before = p.read_text()
          anchor = "lines[lines.index(old_major)] = new_major\nafter = ''.join(lines)\n"
          assert before.count(anchor) == 1
          replacement = (
              "lines[lines.index(old_major)] = new_major\n"
              "old_minor = \"grep -Eq '^#define[[:space:]]+NC_VERSION_MINOR[[:space:]]+10$' work/install/include/netcdf_meta.h\\n\"\n"
              "new_minor = \"grep -Fxq '#define NC_VERSION_MINOR 10 /*!< netcdf-c minor version. */' work/install/include/netcdf_meta.h\\n\"\n"
              "assert lines.count(old_minor) == 1, old_minor\n"
              "assert lines.count(new_minor) == 0, new_minor\n"
              "lines[lines.index(old_minor)] = new_minor\n"
              "after = ''.join(lines)\n"
              "assert after.splitlines(keepends=True).count(old_minor) == 0\n"
              "assert after.splitlines(keepends=True).count(new_minor) == 1\n"
          )
          after = before.replace(anchor, replacement, 1)

          minus_old = "assert sum(1 for line in dl if line.startswith('-') and not line.startswith('---')) == 2\n"
          plus_old = "assert sum(1 for line in dl if line.startswith('+') and not line.startswith('+++')) == 2\n"
          assert after.count(minus_old) == 1
          assert after.count(plus_old) == 1
          after = after.replace(minus_old, minus_old.replace('== 2', '== 3'), 1)
          after = after.replace(plus_old, plus_old.replace('== 2', '== 3'), 1)

          old_label = "'repair=EXACT_V19_HDF5_DIR_AND_NC_VERSION_MAJOR_POSTCONDITIONS\\n'"
          new_label = "'repair=EXACT_V19_HDF5_DIR_AND_NC_VERSION_MAJOR_AND_MINOR_POSTCONDITIONS\\n'"
          assert after.count(old_label) == 1
          after = after.replace(old_label, new_label, 1)

          old_count = "'changed_postconditions=2\\n'"
          new_count = "'changed_postconditions=3\\n'"
          assert after.count(old_count) == 1
          after = after.replace(old_count, new_count, 1)

          old_names = "fromfile='v19-suffix-before-v40-major-postcondition', tofile='v19-suffix-after-v40-major-postcondition'"
          new_names = "fromfile='v19-suffix-before-v42-minor-postcondition', tofile='v19-suffix-after-v42-minor-postcondition'"
          assert after.count(old_names) == 1
          after = after.replace(old_names, new_names, 1)

          d = ''.join(unified_diff(before.splitlines(True), after.splitlines(True), fromfile='v41-top-run-major-only', tofile='v42-top-run-major-and-minor'))
          assert d
          Path('evidence/v42-v41-minor-postcondition-only.diff').write_text(d)
          Path('bootstrap/v42-top-run.sh').write_text(after)
          PY_V42_REPAIR

          bash -n bootstrap/v42-top-run.sh
          cp bootstrap/v42-top-run.sh evidence/v42-top-run-before-execution.sh
          sha256sum bootstrap/v41.yml bootstrap/v41-run.sh bootstrap/v42-v41-prefix.sh evidence/v42-v41-top-run-before.sh evidence/v42-top-run-before-execution.sh evidence/v42-v41-minor-postcondition-only.diff > evidence/v42-sha256.txt

          cat > evidence/v42-preexecution-receipt.txt <<EOF
          status=PRE_RESULT_V42_EXACT_MINOR_POSTCONDITION_REPAIR_FROZEN
          predecessor_v41_head=${V41_HEAD}
          predecessor_v41_blob=${V41_BLOB}
          predecessor_v41_run=${V41_RUN}
          predecessor_v41_job=${V41_JOB}
          predecessor_v41_artifact=${V41_ARTIFACT}
          predecessor_v41_artifact_digest=sha256:${V41_ARTIFACT_DIGEST}
          predecessor_v41_top_run_sha256=${V41_TOP_SHA256}
          predecessor_v41_diff_sha256=${V41_DIFF_SHA256}
          frozen_v19_suffix_sha256=${V19_SUFFIX_SHA256}
          predecessor_v41_first_false=V19_NC_VERSION_MINOR_STALE_END_ANCHORED_POSTCONDITION
          preserved_repairs=HDF5_DIR_UNINITIALIZED_AND_EXACT_NC_VERSION_MAJOR
          added_repair=EXACT_NC_VERSION_MINOR_SOURCE_DERIVED_LINE_ONLY
          nc_version_patch_touched=false
          candidate_semantics_changed=false
          source_or_dependency_identity_changed=false
          compiler_or_link_flags_changed=false
          wasm_instantiated=false
          runtime_executed=false
          lt5_result=false
          c_executed=false
          d_executed=false
          b_selected=false
          b_resolved=false
          production_changed=false
          EOF
          sha256sum evidence/v42-preexecution-receipt.txt >> evidence/v42-sha256.txt

          # PRE-RESULT compile/link diagnostic only. A later first-false remains terminal.
          bash bootstrap/v42-top-run.sh

          mkdir -p work/evidence
          cp evidence/v42-* work/evidence/
          cat > work/evidence/v42-receipt.txt <<EOF
          status=PASS
          classification=EXACT_P_COMPILE_CLOSURE_PASS_AFTER_V42_MINOR_POSTCONDITION_REPAIR
          predecessor_v41_run=${V41_RUN}
          candidate_semantics_changed=false
          source_or_dependency_identity_changed=false
          compiler_or_link_flags_changed=false
          wasm_instantiated=false
          runtime_executed=false
          lt5_result=false
          c_executed=false
          d_executed=false
          b_selected=false
          b_resolved=false
          production_changed=false
          EOF

      - name: Upload immutable V42 pre-result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-netcdf-exact410-v42
          path: |
            evidence
            work/evidence
            bootstrap
          if-no-files-found: warn
          retention-days: 90
