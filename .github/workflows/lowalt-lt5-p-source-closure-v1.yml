name: LowAlt LT5 P Source Closure V1

on:
  push:
    branches:
      - review/lowalt-lt5-p-source-closure-v1-20260917
    paths:
      - .github/workflows/lowalt-lt5-p-source-closure-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  source-closure-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Freeze exact P source closure and WASM compile feasibility without execution
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p lowalt-p-source
          cd lowalt-p-source
          STAGE=bootstrap
          trap 'rc=$?; printf "status=FAIL\nstage=%s\nexit=%s\nwasm_instantiated=false\nruntime_executed=false\nlt5_result=false\nc_executed=false\nd_executed=false\n" "$STAGE" "$rc" > failure-receipt.txt; exit "$rc"' ERR

          for cmd in curl unzip gzip tar sha256sum python3 grep; do
            command -v "$cmd" >/dev/null
          done

          STAGE=toolchain
          source /opt/emsdk/emsdk_env.sh >/dev/null
          EMCC="$(command -v emcc)"
          PYTHON="$(command -v python3)"
          test "$(sha256sum "$EMCC" | awk '{print $1}')" = "b0c9551f9155fa9c028efa24591acdfd30f02f32fb247cf9266f5f0f2ede7589"

          STAGE=source
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/8894652347/zip" \
            -o source-audit.zip
          test "$(sha256sum source-audit.zip | awk '{print $1}')" = "db189ee5f145719ebf85c97e1c0b35eacb4963c2c19544df29f0a978b1dbd12b"
          unzip -p source-audit.zip libRadtran-2.0.6.tar.gz > libRadtran-2.0.6.tar.gz
          test "$(sha256sum libRadtran-2.0.6.tar.gz | awk '{print $1}')" = "64930cc40b6e4a37aa220520974d330fc1563796f466a649b2238131f2d69840"
          gzip -dc libRadtran-2.0.6.tar.gz > source.tar
          test "$(sha256sum source.tar | awk '{print $1}')" = "999e47f4af4b5df6f85a6887fc105fc8f6e1a7cee89a3124f69ac8d8912c8e85"
          tar -xf source.tar

          STAGE=static-closure
          cat > freeze_p_closure.py <<'PY'
          import hashlib, json, pathlib, re

          root = pathlib.Path('libRadtran-2.0.6').resolve()
          source_ext = {'.c', '.h', '.cc', '.cpp', '.inc', '.f', '.F', '.f90', '.F90'}
          tokens = ('setup_and_call_solver', 'optical_properties')
          files = [p for p in root.rglob('*') if p.is_file() and p.suffix in source_ext]

          def sha256(p):
              h = hashlib.sha256()
              with p.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          matches = {t: [] for t in tokens}
          definition_patterns = {
              t: re.compile(r'^\s*(?:(?:static|extern|inline)\s+)*(?:[A-Za-z_][A-Za-z0-9_]*(?:\s*\*)?\s+)+%s\s*\(' % re.escape(t))
              for t in tokens
          }
          definitions = {t: [] for t in tokens}
          for p in files:
              try:
                  text = p.read_text(encoding='utf-8', errors='replace')
              except Exception:
                  continue
              rel = p.relative_to(root).as_posix()
              for lineno, line in enumerate(text.splitlines(), 1):
                  for token in tokens:
                      if token in line:
                          rec = {'path': rel, 'line': lineno, 'text': line.strip()[:500]}
                          matches[token].append(rec)
                          if definition_patterns[token].search(line):
                              definitions[token].append(rec)

          if len(definitions['setup_and_call_solver']) != 1:
              raise SystemExit(f"expected exactly one setup_and_call_solver definition, got {definitions['setup_and_call_solver']}")
          if len(definitions['optical_properties']) != 1:
              raise SystemExit(f"expected exactly one optical_properties definition, got {definitions['optical_properties']}")

          roots = [root, root/'src_c', root/'libsrc_c', root/'libsrc_f']
          include_re = re.compile(r'^\s*#\s*include\s*"([^"]+)"')

          def resolve_include(parent, name):
              candidates = [parent.parent/name] + [r/name for r in roots]
              for c in candidates:
                  if c.is_file():
                      return c.resolve()
              return None

          closure = set()
          unresolved = []
          queue = []
          for token in tokens:
              p = (root / definitions[token][0]['path']).resolve()
              if p.suffix in {'.c', '.cc', '.cpp'}:
                  queue.append(p)
          while queue:
              p = queue.pop()
              if p in closure:
                  continue
              closure.add(p)
              text = p.read_text(encoding='utf-8', errors='replace')
              for lineno, line in enumerate(text.splitlines(), 1):
                  m = include_re.match(line)
                  if not m:
                      continue
                  q = resolve_include(p, m.group(1))
                  if q is None:
                      unresolved.append({'from': p.relative_to(root).as_posix(), 'line': lineno, 'include': m.group(1)})
                  elif q not in closure:
                      queue.append(q)

          closure_records = []
          for p in sorted(closure):
              closure_records.append({
                  'path': p.relative_to(root).as_posix(),
                  'size': p.stat().st_size,
                  'sha256': sha256(p),
              })

          make_refs = []
          for name in ('Makefile.am', 'Makefile.in'):
              for p in root.rglob(name):
                  text = p.read_text(encoding='utf-8', errors='replace')
                  for lineno, line in enumerate(text.splitlines(), 1):
                      if any(definitions[t][0]['path'].split('/')[-1] in line for t in tokens):
                          make_refs.append({'path': p.relative_to(root).as_posix(), 'line': lineno, 'text': line.strip()[:500]})

          out = {
              'schema': 1,
              'classification': 'PRE_RESULT_P_STATIC_SOURCE_CLOSURE_ONLY',
              'sourceEntitySha256': '999e47f4af4b5df6f85a6887fc105fc8f6e1a7cee89a3124f69ac8d8912c8e85',
              'definitions': definitions,
              'allMatches': matches,
              'quotedIncludeClosure': closure_records,
              'unresolvedQuotedIncludes': unresolved,
              'makefileReferences': make_refs,
              'wasmInstantiated': False,
              'runtimeExecuted': False,
              'lt5Result': False,
              'cExecuted': False,
              'dExecuted': False,
              'bSelected': False,
              'bResolved': False,
          }
          pathlib.Path('p-source-closure.json').write_text(json.dumps(out, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          pathlib.Path('definition-units.txt').write_text('\n'.join(sorted({definitions[t][0]['path'] for t in tokens})) + '\n', encoding='utf-8')
          PY
          "$PYTHON" freeze_p_closure.py

          STAGE=compile-probe
          mkdir -p objects compile-logs
          : > compile-status.tsv
          while IFS= read -r unit; do
            test -n "$unit"
            base="$(basename "$unit")"
            obj="objects/${base%.*}.o"
            log="compile-logs/${base}.stderr.txt"
            set +e
            "$EMCC" -O0 -std=gnu11 -c "libRadtran-2.0.6/$unit" \
              -IlibRadtran-2.0.6 \
              -IlibRadtran-2.0.6/src_c \
              -IlibRadtran-2.0.6/libsrc_c \
              -IlibRadtran-2.0.6/libsrc_f \
              -o "$obj" 2>"$log"
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              test -s "$obj"
              printf '%s\tSUCCESS\t%s\t%s\n' "$unit" "$(sha256sum "$obj" | awk '{print $1}')" "$(wc -c < "$obj" | tr -d ' ')" >> compile-status.tsv
            else
              rm -f "$obj"
              printf '%s\tBLOCKED_RC_%s\t-\t-\n' "$unit" "$rc" >> compile-status.tsv
            fi
          done < definition-units.txt

          STAGE=receipt
          {
            echo 'schema=1'
            echo 'classification=PRE_RESULT_P_SOURCE_CLOSURE_AND_COMPILE_FEASIBILITY_ONLY'
            echo 'bSelected=false'
            echo 'bResolved=false'
            echo 'wasmInstantiated=false'
            echo 'runtimeExecuted=false'
            echo 'lt5Result=false'
            echo 'cExecuted=false'
            echo 'dExecuted=false'
            echo 'productionChanged=false'
            echo 'source_artifact_id=8894652347'
            echo 'source_artifact_zip_sha256=db189ee5f145719ebf85c97e1c0b35eacb4963c2c19544df29f0a978b1dbd12b'
            echo 'source_member_sha256=64930cc40b6e4a37aa220520974d330fc1563796f466a649b2238131f2d69840'
            echo 'source_decoded_tar_sha256=999e47f4af4b5df6f85a6887fc105fc8f6e1a7cee89a3124f69ac8d8912c8e85'
            echo 'container_image=ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5'
            echo 'target=wasm32-unknown-emscripten'
            echo "emcc_sha256=$(sha256sum "$EMCC" | awk '{print $1}')"
            echo "closure_json_sha256=$(sha256sum p-source-closure.json | awk '{print $1}')"
            echo "definition_units_sha256=$(sha256sum definition-units.txt | awk '{print $1}')"
            echo "compile_status_sha256=$(sha256sum compile-status.tsv | awk '{print $1}')"
            echo '--- compile-status ---'
            cat compile-status.tsv
            echo '--- emcc-version ---'
            "$EMCC" --version
          } > completion-receipt.txt
          sha256sum completion-receipt.txt p-source-closure.json definition-units.txt compile-status.tsv > manifest.sha256

      - name: Upload immutable pre-result P source-closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-source-closure-v1
          path: lowalt-p-source/
          if-no-files-found: error
          retention-days: 90
