name: LowAlt LT5 P Source Matrix V11

on:
  push:
    branches:
      - review/lowalt-lt5-p-source-matrix-v11-20260917
    paths:
      - .github/workflows/lowalt-lt5-p-source-matrix-v11.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  compile-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Rebuild exact V10 dependency closure and compile authoritative P source matrix without execution
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p bootstrap

          V10_HEAD=ca8b4f444dc6487fb5b037bcc1d068c9b48106dd
          V10_WORKFLOW_BLOB=79f1651e8e5ce33414880e388f788dd513e91488
          V10_RUN=35234131280
          V10_ARTIFACT=10503111271
          V10_DIGEST=sha256:b6e94fee5212c656185e29f551f0b47b7c18ec5067e8d87e7c2125803b31562c

          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/lowalt-lt5-p-netcdf-nommap-v10.yml?ref=${V10_HEAD}" \
            -o bootstrap/v10.yml
          test "$(git hash-object bootstrap/v10.yml)" = "$V10_WORKFLOW_BLOB"
          sha256sum bootstrap/v10.yml > bootstrap/v10-workflow-sha256.txt

          awk '
            /^        run: \|$/ { capture=1; next }
            capture && /^      - name: Upload immutable pre-result NetCDF4 no-MMAP closure evidence$/ { exit }
            capture { sub(/^          /, ""); print }
          ' bootstrap/v10.yml > bootstrap/v10-run.sh
          test "$(grep -c '^set -euo pipefail$' bootstrap/v10-run.sh)" = 1
          test "$(grep -c -- '-DENABLE_MMAP=OFF \\' bootstrap/v10-run.sh)" = 1
          sha256sum bootstrap/v10-run.sh > bootstrap/v10-run-sha256.txt

          # Reproduce only the frozen V10 build/compile/link closure. It never instantiates WASM.
          bash bootstrap/v10-run.sh

          source /opt/emsdk/emsdk_env.sh >/dev/null
          EMCC="$(command -v emcc)"
          EMAR="$(command -v emar)"
          ROOT="$PWD/work/libRadtran-2.0.6"
          PREFIX="$PWD/work/install"
          ABI="$PWD/work/p-generated-abi.h"
          test -f "$ABI"
          test -f "$ROOT/src/Makefile.in"
          mkdir -p work/p-matrix work/evidence/p-source-stderr work/evidence/p-source-stdout

          cat > work/evidence/p-core-source-list.txt <<'EOF'
          src/uvspec.c
          src/ancillary.c
          src/options_stash.c
          src/atmosphere.c
          src/extraterrestrial.c
          src/aerosol.c
          src/cloud.c
          src/cloud3d.c
          src/elevation2d.c
          src/temperature2d.c
          src/molecular.c
          src/sza.c
          src/albedo.c
          src/redistribute.c
          src/fluorescence.c
          src/molecular3d.c
          src/solve_rte.c
          src/ipa.c
          src/ck.c
          src/ckdfu.c
          EOF

          # This is the explicit ordinary-preprocessing + optical-properties core surface
          # derived from src/Makefile.in UVSPEC plus the exact pre-solver call chain in uvspec.c.
          # Optional TIPA/CONDOR sources remain excluded under the frozen generated ABI.
          sha256sum "$ROOT/src/Makefile.in" "$ROOT/src/uvspec.c" "$ROOT/src/ancillary.c" > work/evidence/p-source-authority-sha256.txt
          : > work/evidence/p-source-matrix.tsv
          printf 'source\trc\tobject_sha256\tobject_bytes\n' >> work/evidence/p-source-matrix.tsv
          pass=0
          fail=0
          while IFS= read -r rel; do
            test -n "$rel"
            src="$ROOT/$rel"
            test -f "$src"
            base="$(basename "$rel" .c)"
            obj="$PWD/work/p-matrix/${base}.o"
            out="$PWD/work/evidence/p-source-stdout/${base}.txt"
            err="$PWD/work/evidence/p-source-stderr/${base}.txt"
            set +e
            "$EMCC" -O0 -std=gnu11 -include "$ABI" -c "$src" \
              -I"$ROOT" -I"$ROOT/src" -I"$ROOT/src_c" -I"$ROOT/libsrc_c" -I"$ROOT/libsrc_f" -I"$PREFIX/include" \
              -o "$obj" >"$out" 2>"$err"
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              sha="$(sha256sum "$obj" | awk '{print $1}')"
              bytes="$(wc -c < "$obj")"
              printf '%s\t0\t%s\t%s\n' "$rel" "$sha" "$bytes" >> work/evidence/p-source-matrix.tsv
              pass=$((pass+1))
            else
              rm -f "$obj"
              printf '%s\t%s\t-\t-\n' "$rel" "$rc" >> work/evidence/p-source-matrix.tsv
              fail=$((fail+1))
            fi
          done < work/evidence/p-core-source-list.txt

          printf 'pass=%s\nfail=%s\n' "$pass" "$fail" > work/evidence/p-source-matrix-summary.txt
          sha256sum $(awk -v r="$ROOT/" '{printf "%s%s ", r, $0}' work/evidence/p-core-source-list.txt) > work/evidence/p-core-source-bytes-sha256.txt

          if [ "$pass" -gt 0 ]; then
            "$EMAR" rcs work/p-matrix/p-core-compile-only.a work/p-matrix/*.o
            sha256sum work/p-matrix/*.o work/p-matrix/p-core-compile-only.a > work/evidence/p-compiled-object-sha256.txt
            wc -c work/p-matrix/*.o work/p-matrix/p-core-compile-only.a > work/evidence/p-compiled-object-size.txt
          fi

          if [ "$fail" -eq 0 ]; then
            classification=P_CORE_SOURCE_MATRIX_ALL_COMPILE_PASS
          else
            classification=P_CORE_SOURCE_MATRIX_DIAGNOSTIC_HAS_COMPILE_BLOCKERS
          fi
          cat > work/evidence/v11-receipt.txt <<EOF
          status=PASS
          classification=${classification}
          predecessor_v10_head=${V10_HEAD}
          predecessor_v10_workflow_blob=${V10_WORKFLOW_BLOB}
          predecessor_v10_run=${V10_RUN}
          predecessor_v10_artifact=${V10_ARTIFACT}
          predecessor_v10_digest=${V10_DIGEST}
          source_count=$((pass+fail))
          compile_pass=${pass}
          compile_fail=${fail}
          wasm_instantiated=false
          runtime_executed=false
          p_numeric_evaluation=false
          t_called=false
          lt5_result=false
          c_executed=false
          d_executed=false
          b_selected=false
          b_resolved=false
          production_changed=false
          EOF

      - name: Upload immutable pre-result P compile-matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-source-matrix-v11
          path: |
            work/evidence
            work/p-matrix
            bootstrap/v10-workflow-sha256.txt
            bootstrap/v10-run-sha256.txt
          if-no-files-found: error
          retention-days: 90
