name: LowAlt LT5 P Worker Module V96 New Bind Runtime Value V100

on:
  push:
    branches: [review/lowalt-lt5-p-worker-module-v100-20260920]
    paths: [.github/workflows/lowalt-lt5-p-worker-module-v100.yml]

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  v96-new-bind-source-to-runtime-value:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Repair only V97 V96 new_bind source representation plumbing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p fetched-v100 artifacts-v100 bootstrap-v100 evidence/v100-v96-new-bind-runtime-value
          api_get(){ curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$1" -o "$2"; }
          R=https://api.github.com/repos/search-maker/twilight-mystic-experiments
          api_get "$R/issues/comments/5749598189" fetched-v100/coordinator.json
          api_get "$R/contents/.github/workflows/lowalt-lt5-p-worker-module-v99.yml?ref=73f87a34c7f4c933ff78f014c749c71d576e1bc9" fetched-v100/v99-workflow.json
          api_get "$R/contents/.github/workflows/lowalt-lt5-p-worker-module-v97.yml?ref=ae069a42089c2e83181d4d17b8b7eea999501306" fetched-v100/v97-workflow.json
          api_get "$R/contents/.github/workflows/lowalt-lt5-p-worker-module-v96.yml?ref=1b5eb7f67eba148b750070fa56701a22c93bcbeb" fetched-v100/v96-workflow.json
          api_get "$R/contents/.github/workflows/lowalt-lt5-p-worker-module-v95.yml?ref=e42a51211d6e4400ec32dd028f056e184abb1f1c" fetched-v100/v95-workflow.json
          api_get "$R/contents/.github/workflows/lowalt-lt5-p-worker-module-v92.yml?ref=1b94ff8e8d9869c0b61d8ee491b185b13580a9f0" fetched-v100/v92-workflow.json
          api_get "$R/contents/.github/workflows/lowalt-lt5-p-worker-module-v94.yml?ref=5ea63a6479fd75fcdff597fa3d6b84a10304c268" fetched-v100/v94-workflow.json
          api_get "$R/actions/runs/35508615549" fetched-v100/v99-run.json
          api_get "$R/actions/jobs/106072521162" fetched-v100/v99-job.json
          api_get "$R/actions/artifacts/10603838836" fetched-v100/v99-artifact.json
          curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$R/actions/artifacts/10603838836/zip" -o artifacts-v100/v99.zip
          curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$R/actions/jobs/106072521162/logs" -o fetched-v100/v99-job.log
          api_get "$R/branches/main" fetched-v100/main.json
          api_get "$R/compare/6cd7c075766fe0c86bc7561ec205a3f9120fd1fb...${GITHUB_SHA}" fetched-v100/main-to-v100.json

          python3 - <<'PY'
          import ast,base64,difflib,hashlib,json
          from pathlib import Path
          O=Path('evidence/v100-v96-new-bind-runtime-value'); O.mkdir(parents=True,exist_ok=True)
          MAIN='6cd7c075766fe0c86bc7561ec205a3f9120fd1fb'; AUTH=5749598189
          V99H='73f87a34c7f4c933ff78f014c749c71d576e1bc9'; V99T='4472ecee659818b36855ce490596870694a5bf6e'; V99B='b06c3d26491c85bcd423188ffd37434f81fccf84'; V99R=35508615549; V99J=106072521162; V99A=10603838836; V99AS='0d16579c516987361b538604bffed6f60a96b4ff0ea317d0c7812dbb2acbaff5'; V99AZ=102714648
          V97B='bed19a5115d4ac3aa22c0b20b7d504d3df9d1136'; V96B='972c008497053888993e1094b990d05f428929f8'; V95B='3ca2322db51ea86caae9836afbd5b8dda2ac4c94'; V92B='7a66d463a424665133fcc1f967909ea647d97135'; V94B='ee1d9a690da87450a40a3fb48c1b18f87dd2299a'
          H=lambda b:hashlib.sha256(b).hexdigest()
          G=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          def j(p): return json.loads(Path(p).read_text())
          def wf(p,b):
              x=j(p); d=base64.b64decode(x['content'])
              if x.get('sha')!=b or G(d)!=b: raise SystemExit('V100_BIND_FAIL workflow '+p)
              return d
          def runpart(d):
              ls=d.splitlines(keepends=True); m=b'        run: |\n'
              if ls.count(m)!=1: raise SystemExit('V100_BIND_FAIL run marker')
              out=[]
              for q in ls[ls.index(m)+1:]:
                  if q.strip() and not q.startswith(b'          '): break
                  out.append(q[10:] if q.startswith(b'          ') else q)
              return b''.join(out)
          def raw_triple(src,name):
              marker=name+'="""'
              if src.count(marker)!=1: raise SystemExit('V100_BIND_FAIL raw marker '+name+' count='+str(src.count(marker)))
              a=src.index(marker)+len(marker); b=src.find('"""',a)
              if b<0: raise SystemExit('V100_BIND_FAIL raw closing '+name)
              return src[a:b]
          def pyheredoc(run,tag):
              h="python3 - <<'PY'\n"; e='\nPY\n'
              if run.count(h)!=1: raise SystemExit('V100_BIND_FAIL '+tag+' python start count='+str(run.count(h)))
              tail=run.split(h,1)[1]
              if tail.count(e)!=1: raise SystemExit('V100_BIND_FAIL '+tag+' python end count='+str(tail.count(e)))
              return tail.split(e,1)[0]

          c=j('fetched-v100/coordinator.json')
          if c.get('id')!=AUTH or c.get('user',{}).get('login')!='search-maker': raise SystemExit('V100_BIND_FAIL coordinator identity')
          body=c.get('body','')
          for x in ['COORDINATOR::LOWALT_V100_V99_V97_V96_NEW_BIND_SOURCE_REPRESENTATION_TO_RUNTIME_VALUE_SUCCESSOR_AUTHORIZED__SCIENCE_PRODUCTION_FALSE','AUTHORIZED: exactly ONE fresh LowAlt PRE-RESULT V100 identity','V96_NEW_BIND_SOURCE_TO_RUNTIME_VALUE_GATE_PASS','No V101 absent later direct Coordinator transition.']:
              if x not in body: raise SystemExit('V100_BIND_FAIL authority '+x)

          v99=wf('fetched-v100/v99-workflow.json',V99B); v97=wf('fetched-v100/v97-workflow.json',V97B); v96=wf('fetched-v100/v96-workflow.json',V96B); v95=wf('fetched-v100/v95-workflow.json',V95B); wf('fetched-v100/v92-workflow.json',V92B); wf('fetched-v100/v94-workflow.json',V94B)
          rr=j('fetched-v100/v99-run.json'); jj=j('fetched-v100/v99-job.json'); aa=j('fetched-v100/v99-artifact.json')
          if rr.get('id')!=V99R or rr.get('run_attempt')!=1 or rr.get('conclusion')!='failure' or rr.get('head_sha')!=V99H or rr.get('head_commit',{}).get('tree_id')!=V99T: raise SystemExit('V100_BIND_FAIL V99 run')
          if jj.get('id')!=V99J or jj.get('conclusion')!='failure': raise SystemExit('V100_BIND_FAIL V99 job')
          if aa.get('id')!=V99A or aa.get('digest')!='sha256:'+V99AS or aa.get('size_in_bytes')!=V99AZ or aa.get('expired'): raise SystemExit('V100_BIND_FAIL V99 artifact')
          z=Path('artifacts-v100/v99.zip').read_bytes()
          if len(z)!=V99AZ or H(z)!=V99AS: raise SystemExit('V100_BIND_FAIL V99 artifact transport')
          log=Path('fetched-v100/v99-job.log').read_text(errors='replace')
          gp='V97_FIRST_FALSE_EXECUTION_RECEIPT_BINDING_GATE_PASS'
          gp_exec=[q for q in log.splitlines() if q.count('Z ')==1 and q.split('Z ',1)[1]==gp]
          bad='SyntaxError: unexpected character after line continuation character'
          bad_exec=[q for q in log.splitlines() if q.count('Z ')==1 and q.split('Z ',1)[1]==bad]
          malformed='h92=\\"python3 - <<\'PY\'\\\\n\\"; e92=\\"\\\\nPY\\\\n\\"'
          if len(gp_exec)!=1 or len(bad_exec)!=1 or malformed not in log: raise SystemExit('V100_BIND_FAIL V99 first-false payload '+repr((len(gp_exec),len(bad_exec),malformed in log)))

          s96=v96.decode(); new_raw=raw_triple(s96,'new_bind')
          try: new_value=ast.literal_eval('"""'+new_raw+'"""')
          except Exception as e: raise SystemExit('V100_BIND_FAIL V96 new_bind literal evaluation '+repr(e))
          if not isinstance(new_value,str): raise SystemExit('V100_BIND_FAIL V96 new_bind runtime type')
          if new_raw==new_value: raise SystemExit('V100_BIND_FAIL V96 raw/value classes not distinct')

          r95=runpart(v95).decode()
          old_expected="for s in [old_auth,new_auth]:\n    if s not in r92: raise SystemExit('V95_BIND_FAIL V92 accepted repair source')\n"
          old_import='import base64,difflib,hashlib,io,json,zipfile'; new_import='import ast,base64,difflib,hashlib,io,json,zipfile'
          if r95.count(old_import)!=1 or r95.count(new_import)!=0 or r95.count(old_expected)!=1 or r95.count(new_value)!=0: raise SystemExit('V100_BIND_FAIL simulation precondition')
          sim=r95.replace(old_import,new_import,1).replace(old_expected,new_value,1)
          ast.parse(pyheredoc(sim,'simulated patched V95'))

          r99=runpart(v99); text=r99.decode()
          anchor='bash -n bootstrap-v99/v98-run-patched-v99.sh\n'
          if text.count(anchor)!=1: raise SystemExit('V100_PATCH_FAIL V99 anchor count='+str(text.count(anchor)))
          nested=r'''python3 - <<'PY_V100_NEST'
from pathlib import Path
p=Path('bootstrap-v99/v98-run-patched-v99.sh')
s=p.read_text()
anchor="bash -n bootstrap-v98/v97-run-patched-v98.sh\n"
exec_old="GITHUB_SHA=ae069a42089c2e83181d4d17b8b7eea999501306 bash bootstrap-v98/v97-run-patched-v98.sh >evidence/v98-v97-v95-first-false-execution-receipt-binding/preserved-v97-child.stdout 2>evidence/v98-v97-v95-first-false-execution-receipt-binding/preserved-v97-child.stderr\n"
hook=r'''python3 - <<'PY_V100_FIX'
from pathlib import Path
p=Path('bootstrap-v98/v97-run-patched-v98.sh')
s=p.read_text()
old='''if text.count(old_import)!=1 or text.count(new_import)!=0 or text.count(old_expected)!=1 or text.count(new_raw)!=0: raise SystemExit('V97_PATCH_FAIL precondition')
patched=text.replace(old_import,new_import,1).replace(old_expected,new_raw,1)
if patched.count(old_import)!=0 or patched.count(new_import)!=1 or patched.count(old_expected)!=0 or patched.count(new_raw)!=1: raise SystemExit('V97_PATCH_FAIL postcondition')
if patched.replace(new_import,old_import,1).replace(new_raw,old_expected,1)!=text: raise SystemExit('V97_PATCH_FAIL inverse reconstruction')'''
new='''new_value=ast.literal_eval('"""'+new_raw+'"""')
if not isinstance(new_value,str): raise SystemExit('V97_BIND_FAIL V96 new_bind runtime value type')
if text.count(old_import)!=1 or text.count(new_import)!=0 or text.count(old_expected)!=1 or text.count(new_value)!=0: raise SystemExit('V97_PATCH_FAIL precondition')
patched=text.replace(old_import,new_import,1).replace(old_expected,new_value,1)
if patched.count(old_import)!=0 or patched.count(new_import)!=1 or patched.count(old_expected)!=0 or patched.count(new_value)!=1: raise SystemExit('V97_PATCH_FAIL postcondition')
if patched.replace(new_import,old_import,1).replace(new_value,old_expected,1)!=text: raise SystemExit('V97_PATCH_FAIL inverse reconstruction')'''
if s.count(old)!=1 or s.count(new)!=0: raise SystemExit('V100_NEST_PATCH_FAIL V97 precondition')
t=s.replace(old,new,1)
if t.count(old)!=0 or t.count(new)!=1 or t.replace(new,old,1)!=s: raise SystemExit('V100_NEST_PATCH_FAIL V97 postcondition')
Path('bootstrap-v98/v97-run-patched-v98-v100.sh').write_text(t)
PY_V100_FIX
bash -n bootstrap-v98/v97-run-patched-v98-v100.sh
'''
if s.count(anchor)!=1 or s.count(exec_old)!=1: raise SystemExit('V100_NEST_PATCH_FAIL V98 anchors')
s2=s.replace(anchor,hook,1).replace(exec_old,exec_old.replace('bootstrap-v98/v97-run-patched-v98.sh','bootstrap-v98/v97-run-patched-v98-v100.sh'),1)
if s2.count('bootstrap-v98/v97-run-patched-v98-v100.sh')!=2: raise SystemExit('V100_NEST_PATCH_FAIL V98 corrected-path cardinality')
Path('bootstrap-v99/v98-run-patched-v99-v100.sh').write_text(s2)
PY_V100_NEST
bash -n bootstrap-v99/v98-run-patched-v99-v100.sh
'''
          patched=text.replace(anchor,nested,1).replace('GITHUB_SHA=0c58c7013855107d5b848835c61bd6a278ca8029 bash bootstrap-v99/v98-run-patched-v99.sh','GITHUB_SHA=0c58c7013855107d5b848835c61bd6a278ca8029 bash bootstrap-v99/v98-run-patched-v99-v100.sh',1)
          if patched==text or patched.count('bootstrap-v99/v98-run-patched-v99-v100.sh')!=2: raise SystemExit('V100_PATCH_FAIL V99 corrected child path')
          diff=''.join(difflib.unified_diff(text.splitlines(True),patched.splitlines(True),fromfile='v99-run.sh',tofile='v99-run-patched-v100.sh',n=3))
          main=j('fetched-v100/main.json'); comp=j('fetched-v100/main-to-v100.json'); fs=comp.get('files') or []
          if main.get('commit',{}).get('sha')!=MAIN: raise SystemExit('V100_BIND_FAIL main drift')
          if comp.get('base_commit',{}).get('sha')!=MAIN or len(fs)!=1 or fs[0].get('filename')!='.github/workflows/lowalt-lt5-p-worker-module-v100.yml' or fs[0].get('status')!='added': raise SystemExit('V100_BIND_FAIL branch scope')
          Path('bootstrap-v100/v99-run-patched-v100.sh').write_text(patched)
          Path(O/'v99-to-v100-runtime-value.diff').write_text(diff)
          table={'schema':1,'raw_new_bind_sha256':H(new_raw.encode()),'runtime_new_bind_sha256':H(new_value.encode()),'raw_bytes':len(new_raw.encode()),'runtime_bytes':len(new_value.encode()),'distinct':new_raw!=new_value,'simulated_patched_v95_python_ast_parse':True}
          Path(O/'source-representation-to-runtime-value.json').write_text(json.dumps(table,indent=2,sort_keys=True)+'\n')
          rec={'schema':1,'status':'V96_NEW_BIND_SOURCE_TO_RUNTIME_VALUE_GATE_PASS','authority_comment':AUTH,'v99_head':V99H,'v99_tree':V99T,'v99_workflow_blob':V99B,'v99_run':V99R,'v99_job':V99J,'v99_artifact':V99A,'v99_artifact_sha256':V99AS,'v97_workflow_blob':V97B,'v96_workflow_blob':V96B,'v95_workflow_blob':V95B,'v92_workflow_blob':V92B,'v94_workflow_blob':V94B,'before_v99_run_sha256':H(r99),'after_v99_run_sha256':H(patched.encode()),'diff_sha256':H(diff.encode()),'scientific_script_mutation':False,'source_defined_transport_mutation':False,'b_selected':False,'b_resolved':False}
          Path(O/'runtime-value-gate-receipt.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n')
          Path(O/'V96_NEW_BIND_SOURCE_TO_RUNTIME_VALUE_GATE_PASS').write_text('PASS exact immutable V96 triple-literal source representation deterministically mapped to Python runtime string value\n')
          PY

          bash -n bootstrap-v100/v99-run-patched-v100.sh
          echo V96_NEW_BIND_SOURCE_TO_RUNTIME_VALUE_GATE_PASS
          set +e
          GITHUB_SHA=73f87a34c7f4c933ff78f014c749c71d576e1bc9 bash bootstrap-v100/v99-run-patched-v100.sh >evidence/v100-v96-new-bind-runtime-value/preserved-v99-child.stdout 2>evidence/v100-v96-new-bind-runtime-value/preserved-v99-child.stderr
          RC=$?
          set -e
          printf '%s\n' "$RC" > evidence/v100-v96-new-bind-runtime-value/preserved-v99-child.exit-code.txt
          if [ "$RC" -ne 0 ]; then
            echo "V100_PRESERVED_V99_FIRST_FALSE rc=$RC" >&2
            tail -n 7000 evidence/v100-v96-new-bind-runtime-value/preserved-v99-child.stderr >&2 || true
            exit "$RC"
          fi
          echo V100_PRESERVED_CHAIN_COMPLETED_PRE_RESULT

      - name: Upload V100 frozen PRE-RESULT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-worker-module-v100-evidence
          if-no-files-found: error
          retention-days: 90
          path: |
            fetched-*/
            artifacts-*/
            bootstrap*/
            evidence/
