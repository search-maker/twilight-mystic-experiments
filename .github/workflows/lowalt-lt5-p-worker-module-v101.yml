name: LowAlt LT5 P Worker Module V100 YAML Indentation V101

on:
  push:
    branches: [review/lowalt-lt5-p-worker-module-v101-20260920]
    paths: [.github/workflows/lowalt-lt5-p-worker-module-v101.yml]

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  v100-yaml-block-raw-literal-indentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Repair only V100 YAML raw-literal physical indentation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p fetched-v101 bootstrap-v101 evidence/v101-v100-yaml-raw-literal-indentation
          api_get(){ curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$1" -o "$2"; }
          R=https://api.github.com/repos/search-maker/twilight-mystic-experiments
          api_get "$R/issues/comments/5749643621" fetched-v101/coordinator.json
          api_get "$R/contents/.github/workflows/lowalt-lt5-p-worker-module-v100.yml?ref=288e443145866ff6206bdc159221935e763e4575" fetched-v101/v100-workflow.json
          api_get "$R/actions/runs/35509122613" fetched-v101/v100-run.json
          api_get "$R/actions/runs/35509122613/jobs?filter=latest&per_page=100" fetched-v101/v100-jobs.json
          api_get "$R/actions/runs/35509122613/artifacts?per_page=100" fetched-v101/v100-artifacts.json
          api_get "$R/branches/main" fetched-v101/main.json
          api_get "$R/compare/6cd7c075766fe0c86bc7561ec205a3f9120fd1fb...${GITHUB_SHA}" fetched-v101/main-to-v101.json

          python3 - <<'PY'
          import base64,difflib,hashlib,json
          from pathlib import Path

          O=Path('evidence/v101-v100-yaml-raw-literal-indentation')
          O.mkdir(parents=True,exist_ok=True)
          MAIN='6cd7c075766fe0c86bc7561ec205a3f9120fd1fb'
          AUTH=5749643621
          V100H='288e443145866ff6206bdc159221935e763e4575'
          V100T='df16b4afe45ff08ca5fa63d1884391054417178b'
          V100B='74466d0e7ce68c935d2d932baa23b1dbe70e9fc6'
          V100R=35509122613
          PATH='.github/workflows/lowalt-lt5-p-worker-module-v101.yml'
          H=lambda b:hashlib.sha256(b).hexdigest()
          G=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          def j(p): return json.loads(Path(p).read_text())

          c=j('fetched-v101/coordinator.json')
          if c.get('id')!=AUTH or c.get('user',{}).get('login')!='search-maker':
              raise SystemExit('V101_BIND_FAIL coordinator identity')
          body=c.get('body','')
          required=[
              'COORDINATOR::LOWALT_V101_V100_YAML_BLOCK_RAW_LITERAL_INDENTATION_SUCCESSOR_AUTHORIZED__SCIENCE_PRODUCTION_FALSE',
              'AUTHORIZED: exactly ONE fresh LowAlt PRE-RESULT V101 identity',
              'V100_YAML_BLOCK_RAW_LITERAL_INDENTATION_GATE_PASS',
              'No V102 absent later direct Coordinator transition.',
          ]
          for x in required:
              if x not in body: raise SystemExit('V101_BIND_FAIL authority '+x)

          wf=j('fetched-v101/v100-workflow.json')
          src=base64.b64decode(wf['content'])
          if wf.get('sha')!=V100B or G(src)!=V100B:
              raise SystemExit('V101_BIND_FAIL V100 workflow blob')
          rr=j('fetched-v101/v100-run.json')
          if rr.get('id')!=V100R or rr.get('run_attempt')!=1 or rr.get('conclusion')!='failure' or rr.get('head_sha')!=V100H:
              raise SystemExit('V101_BIND_FAIL V100 run identity')
          tree=(rr.get('head_commit') or {}).get('tree_id')
          if tree!=V100T: raise SystemExit('V101_BIND_FAIL V100 tree '+repr(tree))
          jobs=j('fetched-v101/v100-jobs.json')
          arts=j('fetched-v101/v100-artifacts.json')
          if jobs.get('total_count')!=0 or (jobs.get('jobs') or []):
              raise SystemExit('V101_BIND_FAIL V100 jobs not zero')
          if arts.get('total_count')!=0 or (arts.get('artifacts') or []):
              raise SystemExit('V101_BIND_FAIL V100 artifacts not zero')

          main=j('fetched-v101/main.json')
          comp=j('fetched-v101/main-to-v101.json')
          fs=comp.get('files') or []
          if main.get('commit',{}).get('sha')!=MAIN:
              raise SystemExit('V101_BIND_FAIL main drift')
          if comp.get('base_commit',{}).get('sha')!=MAIN or len(fs)!=1 or fs[0].get('filename')!=PATH or fs[0].get('status')!='added':
              raise SystemExit('V101_BIND_FAIL branch scope '+repr([(q.get('filename'),q.get('status')) for q in fs]))

          lines=src.splitlines(keepends=True)
          run_marker=b'        run: |\n'
          opening=b"          nested=r'''python3 - <<'PY_V100_NEST'\n"
          next_line=b'          patched=text.replace(anchor,nested,1).replace('
          if lines.count(run_marker)!=1: raise SystemExit('V101_BIND_FAIL run marker count='+str(lines.count(run_marker)))
          if lines.count(opening)!=1: raise SystemExit('V101_BIND_FAIL opening count='+str(lines.count(opening)))
          rm=lines.index(run_marker); op=lines.index(opening)
          if not rm < op: raise SystemExit('V101_BIND_FAIL opening order')
          candidates=[]
          for i in range(op+1,len(lines)-1):
              if lines[i] in (b"'''\n",b"'''") and lines[i+1].startswith(next_line): candidates.append(i)
          if len(candidates)!=1: raise SystemExit('V101_BIND_FAIL outer closing candidates='+repr(candidates))
          cl=candidates[0]
          if cl<=op+1: raise SystemExit('V101_BIND_FAIL empty continuation region')

          rows=[]
          for i in range(op+1,cl+1):
              q=lines[i]
              lead=len(q)-len(q.lstrip(b' '))
              rows.append({'source_line':i+1,'leading_spaces':lead,'bytes':len(q),'sha256':H(q)})
          Path(O/'v100-continuation-row-freeze.json').write_text(json.dumps({'schema':1,'opening_line':op+1,'closing_line':cl+1,'rows':rows},indent=2,sort_keys=True)+'\n')

          repaired=list(lines)
          for i in range(op+1,cl+1): repaired[i]=b'          '+lines[i]
          repaired_src=b''.join(repaired)
          if repaired_src==src: raise SystemExit('V101_PATCH_FAIL no change')
          inverse=list(repaired)
          for i in range(op+1,cl+1):
              if not inverse[i].startswith(b'          '): raise SystemExit('V101_PATCH_FAIL missing repair prefix')
              inverse[i]=inverse[i][10:]
          if b''.join(inverse)!=src: raise SystemExit('V101_PATCH_FAIL inverse reconstruction')
          if repaired[:op+1]!=lines[:op+1] or repaired[cl+1:]!=lines[cl+1:]:
              raise SystemExit('V101_PATCH_FAIL outside-region drift')
          for i in range(op+1,cl+1):
              if repaired[i][10:]!=lines[i]: raise SystemExit('V101_PATCH_FAIL row payload drift line='+str(i+1))

          # All nonblank rows in the repaired run block must satisfy the ten-space YAML block indent.
          end=len(repaired)
          for i in range(rm+1,len(repaired)):
              q=repaired[i]
              if q.strip() and not q.startswith(b'          '):
                  end=i; break
          for i in range(rm+1,end):
              if repaired[i].strip() and not repaired[i].startswith(b'          '):
                  raise SystemExit('V101_PATCH_FAIL repaired run indentation line='+str(i+1))

          def extract_run(ls,marker_index):
              out=[]
              for q in ls[marker_index+1:]:
                  if q.strip() and not q.startswith(b'          '): break
                  out.append(q[10:] if q.startswith(b'          ') else q)
              return out
          run_lines=extract_run(repaired,rm)
          run=b''.join(run_lines)
          a=op-rm
          b=cl-rm
          extracted_region=b''.join(run_lines[a:b])
          intended_region=b''.join(lines[op+1:cl+1])
          if extracted_region!=intended_region:
              raise SystemExit('V101_PATCH_FAIL extracted intended-region mismatch')
          if run_lines[a-1] != opening[10:]:
              raise SystemExit('V101_PATCH_FAIL extracted opening mismatch')

          before=H(src); after=H(repaired_src); runsha=H(run)
          diff=''.join(difflib.unified_diff(src.decode().splitlines(True),repaired_src.decode().splitlines(True),fromfile='v100-workflow.yml',tofile='v100-workflow-repaired-v101.yml',n=3))
          Path(O/'v100-to-v101-yaml-container-only.diff').write_text(diff)
          Path(O/'v100-workflow-repaired-v101.yml').write_bytes(repaired_src)
          Path('bootstrap-v101/v100-run-repaired-v101.sh').write_bytes(run)
          receipt={
              'schema':1,
              'status':'V100_YAML_BLOCK_RAW_LITERAL_INDENTATION_GATE_PASS',
              'authority_comment':AUTH,
              'v100_head':V100H,
              'v100_tree':V100T,
              'v100_workflow_blob':V100B,
              'v100_run':V100R,
              'v100_jobs':0,
              'v100_artifacts':0,
              'opening_source_line':op+1,
              'closing_source_line':cl+1,
              'continuation_rows':cl-op,
              'prefix_added_per_row_ascii_spaces':10,
              'before_source_sha256':before,
              'after_source_sha256':after,
              'extracted_run_sha256':runsha,
              'intended_region_sha256':H(intended_region),
              'extracted_region_sha256':H(extracted_region),
              'diff_sha256':H(diff.encode()),
              'inverse_reconstruction':True,
              'outside_region_mutation':False,
              'scientific_script_mutation':False,
              'source_defined_transport_mutation':False,
              'b_selected':False,
              'b_resolved':False,
          }
          Path(O/'yaml-indentation-gate-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          Path(O/'V100_YAML_BLOCK_RAW_LITERAL_INDENTATION_GATE_PASS').write_text('PASS exact ten-space YAML container-prefix repair only; extracted continuation bytes preserve frozen V100 intended payload\n')
          PY

          bash -n bootstrap-v101/v100-run-repaired-v101.sh
          echo V100_YAML_BLOCK_RAW_LITERAL_INDENTATION_GATE_PASS
          set +e
          GITHUB_SHA=288e443145866ff6206bdc159221935e763e4575 bash bootstrap-v101/v100-run-repaired-v101.sh >evidence/v101-v100-yaml-raw-literal-indentation/preserved-v100-child.stdout 2>evidence/v101-v100-yaml-raw-literal-indentation/preserved-v100-child.stderr
          RC=$?
          set -e
          printf '%s\n' "$RC" > evidence/v101-v100-yaml-raw-literal-indentation/preserved-v100-child.exit-code.txt
          if [ "$RC" -ne 0 ]; then
            echo "V101_PRESERVED_V100_FIRST_FALSE rc=$RC" >&2
            tail -n 7000 evidence/v101-v100-yaml-raw-literal-indentation/preserved-v100-child.stderr >&2 || true
            exit "$RC"
          fi
          echo V101_PRESERVED_CHAIN_COMPLETED_PRE_RESULT

      - name: Upload V101 frozen PRE-RESULT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-worker-module-v101-evidence
          if-no-files-found: error
          retention-days: 90
          path: |
            fetched-v101/
            bootstrap-v101/
            evidence/v101-v100-yaml-raw-literal-indentation/
