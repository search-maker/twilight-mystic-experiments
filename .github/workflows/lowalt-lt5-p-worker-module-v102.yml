name: LowAlt LT5 P Worker Module V101 Nested Repr V102

on:
  push:
    branches: [review/lowalt-lt5-p-worker-module-v102-20260920]
    paths: [.github/workflows/lowalt-lt5-p-worker-module-v102.yml]

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  v101-nested-payload-canonical-repr:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Repair only V101 nested payload source representation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p fetched-v102 artifacts-v102/v101 bootstrap-v102 evidence/v102-v101-nested-payload-canonical-repr
          api_get(){ curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$1" -o "$2"; }
          R=https://api.github.com/repos/search-maker/twilight-mystic-experiments
          api_get "$R/issues/comments/5749888071" fetched-v102/coordinator.json
          api_get "$R/contents/.github/workflows/lowalt-lt5-p-worker-module-v101.yml?ref=77411b64b9a091dd14a1c16c6bd6ac0b6014602b" fetched-v102/v101-workflow.json
          api_get "$R/actions/runs/35511336839" fetched-v102/v101-run.json
          api_get "$R/actions/jobs/106079649859" fetched-v102/v101-job.json
          api_get "$R/actions/artifacts/10605642049" fetched-v102/v101-artifact.json
          api_get "$R/branches/main" fetched-v102/main.json
          api_get "$R/compare/6cd7c075766fe0c86bc7561ec205a3f9120fd1fb...${GITHUB_SHA}" fetched-v102/main-to-v102.json
          curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$R/actions/jobs/106079649859/logs" -o fetched-v102/v101-job.log
          curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$R/actions/artifacts/10605642049/zip" -o fetched-v102/v101-artifact.zip

          python3 - <<'PY'
          import ast,base64,difflib,hashlib,json,zipfile
          from pathlib import Path

          O=Path('evidence/v102-v101-nested-payload-canonical-repr')
          O.mkdir(parents=True,exist_ok=True)
          MAIN='6cd7c075766fe0c86bc7561ec205a3f9120fd1fb'
          AUTH=5749888071
          V101H='77411b64b9a091dd14a1c16c6bd6ac0b6014602b'
          V101T='ddb8e385d3501e31b00377a84527fb198b21a6f4'
          V101B='0510b96f46ccc4f2a3f378e33dc5258312f787c7'
          V101R=35511336839
          V101J=106079649859
          V101A=10605642049
          V101AD='sha256:8db906f74e4553e95083bed4d278267189969456a89e627f47ce109a2ab9fbac'
          PATH='.github/workflows/lowalt-lt5-p-worker-module-v102.yml'
          RUN_SHA='45d027927e0200973d196699949583d7c4018b70b6853ac95ea0e2bfbf45e16a'
          PAYLOAD_SHA='7103aef0fcf4e2c581719a18e324dee55a845d686b9bf22f4e8b7df2fda66214'
          REPL_SHA='b490aa87277adb259ed3f32e804c1907d5100d80007ee79874da99d202cd4eae'
          PATCHED_SHA='ade2a9ff0325fbc0face24d502b39c190ce525cb540ba158d96245ed937be9c3'
          DIFF_SHA='5471cb0c967ca6cb9fffece960e0c0f176adb2c3a472d968dcb06e0e4f80e453'
          H=lambda b:hashlib.sha256(b).hexdigest()
          G=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          def j(p): return json.loads(Path(p).read_text())

          c=j('fetched-v102/coordinator.json')
          if c.get('id')!=AUTH or c.get('user',{}).get('login')!='search-maker':
              raise SystemExit('V102_BIND_FAIL coordinator identity')
          body=c.get('body','')
          required=[
              'COORDINATOR::LOWALT_V102_V101_CANONICAL_REPR_NESTED_PAYLOAD_SERIALIZATION_SUCCESSOR_AUTHORIZED__SCIENCE_PRODUCTION_FALSE',
              'AUTHORIZED: exactly ONE fresh LowAlt PRE-RESULT V102 identity',
              'V101_NESTED_PAYLOAD_CANONICAL_REPR_SERIALIZATION_GATE_PASS',
              'No V103 absent later direct Coordinator transition.',
              RUN_SHA,PAYLOAD_SHA,REPL_SHA,PATCHED_SHA,DIFF_SHA,
          ]
          for x in required:
              if x not in body: raise SystemExit('V102_BIND_FAIL authority '+x)

          wf=j('fetched-v102/v101-workflow.json')
          src=base64.b64decode(wf['content'])
          if wf.get('sha')!=V101B or G(src)!=V101B:
              raise SystemExit('V102_BIND_FAIL V101 workflow blob')
          rr=j('fetched-v102/v101-run.json')
          if rr.get('id')!=V101R or rr.get('run_attempt')!=1 or rr.get('conclusion')!='failure' or rr.get('head_sha')!=V101H:
              raise SystemExit('V102_BIND_FAIL V101 run identity')
          if (rr.get('head_commit') or {}).get('tree_id')!=V101T:
              raise SystemExit('V102_BIND_FAIL V101 tree')
          jj=j('fetched-v102/v101-job.json')
          if jj.get('id')!=V101J or jj.get('run_id')!=V101R or jj.get('run_attempt')!=1 or jj.get('conclusion')!='failure':
              raise SystemExit('V102_BIND_FAIL V101 job identity')
          aa=j('fetched-v102/v101-artifact.json')
          if aa.get('id')!=V101A or aa.get('workflow_run',{}).get('id')!=V101R or aa.get('digest')!=V101AD or aa.get('expired') is not False:
              raise SystemExit('V102_BIND_FAIL V101 artifact identity')

          main=j('fetched-v102/main.json')
          comp=j('fetched-v102/main-to-v102.json')
          fs=comp.get('files') or []
          if main.get('commit',{}).get('sha')!=MAIN:
              raise SystemExit('V102_BIND_FAIL main drift')
          if comp.get('base_commit',{}).get('sha')!=MAIN or len(fs)!=1 or fs[0].get('filename')!=PATH or fs[0].get('status')!='added':
              raise SystemExit('V102_BIND_FAIL branch scope '+repr([(q.get('filename'),q.get('status')) for q in fs]))

          with zipfile.ZipFile('fetched-v102/v101-artifact.zip') as z:
              names=z.namelist()
              if len(names)!=len(set(names)): raise SystemExit('V102_BIND_FAIL duplicate artifact members')
              z.extractall('artifacts-v102/v101')
          root=Path('artifacts-v102/v101')
          runp=root/'bootstrap-v101/v100-run-repaired-v101.sh'
          errp=root/'evidence/v101-v100-yaml-raw-literal-indentation/preserved-v100-child.stderr'
          rcp=root/'evidence/v101-v100-yaml-raw-literal-indentation/preserved-v100-child.exit-code.txt'
          gatep=root/'evidence/v101-v100-yaml-raw-literal-indentation/V100_YAML_BLOCK_RAW_LITERAL_INDENTATION_GATE_PASS'
          recp=root/'evidence/v101-v100-yaml-raw-literal-indentation/yaml-indentation-gate-receipt.json'
          for p in [runp,errp,rcp,gatep,recp]:
              if not p.is_file(): raise SystemExit('V102_BIND_FAIL missing V101 member '+str(p))
          run=runp.read_bytes()
          if H(run)!=RUN_SHA: raise SystemExit('V102_BIND_FAIL V101 repaired run sha')
          if rcp.read_bytes()!=b'1\n': raise SystemExit('V102_BIND_FAIL V101 child rc')
          err=errp.read_bytes()
          expected_err=(b'  File "<stdin>", line 78\n'
                        b"    hook=r'''python3 - <<'PY_V100_FIX'\n"
                        b'             ^^^^^^^\n'
                        b'SyntaxError: invalid syntax\n')
          if err!=expected_err: raise SystemExit('V102_BIND_FAIL exact parser receipt')
          rec=j(recp)
          if rec.get('status')!='V100_YAML_BLOCK_RAW_LITERAL_INDENTATION_GATE_PASS' or rec.get('extracted_run_sha256')!=RUN_SHA or rec.get('b_selected') is not False or rec.get('b_resolved') is not False:
              raise SystemExit('V102_BIND_FAIL V101 gate receipt')

          lines=run.splitlines(keepends=True)
          open_prefix=b"nested=r'''"
          open_line=b"nested=r'''python3 - <<'PY_V100_NEST'\n"
          next_line=b'patched=text.replace(anchor,nested,1)'
          ops=[i for i,q in enumerate(lines) if q==open_line]
          cls=[i for i,q in enumerate(lines[:-1]) if q==b"'''\n" and lines[i+1].startswith(next_line)]
          if ops!=[92] or cls!=[125]: raise SystemExit('V102_BIND_FAIL outer boundaries '+repr((ops,cls)))
          op,cl=ops[0],cls[0]
          payload=lines[op][len(open_prefix):]+b''.join(lines[op+1:cl])
          if len(payload)!=2757 or H(payload)!=PAYLOAD_SHA:
              raise SystemExit('V102_BIND_FAIL payload identity '+str(len(payload))+' '+H(payload))
          try: text=payload.decode('utf-8')
          except UnicodeDecodeError: raise SystemExit('V102_BIND_FAIL payload utf8')
          rep=repr(text)
          if ast.literal_eval(rep).encode('utf-8')!=payload:
              raise SystemExit('V102_BIND_FAIL repr roundtrip')
          replacement=b'nested='+rep.encode('utf-8')+b'\n'
          if H(replacement)!=REPL_SHA:
              raise SystemExit('V102_BIND_FAIL canonical replacement sha '+H(replacement))
          patched_lines=lines[:op]+[replacement]+lines[cl+1:]
          patched=b''.join(patched_lines)
          if H(patched)!=PATCHED_SHA:
              raise SystemExit('V102_BIND_FAIL patched run sha '+H(patched))
          inverse=b''.join(patched_lines[:op]+[b"nested=r'''"+payload+b"'''\n"]+patched_lines[op+1:])
          if inverse!=run:
              raise SystemExit('V102_BIND_FAIL inverse reconstruction')
          diff=''.join(difflib.unified_diff(run.decode().splitlines(True),patched.decode().splitlines(True),fromfile='v101-repaired-v100-run.sh',tofile='v102-canonical-repr-v100-run.sh',n=3))
          if H(diff.encode())!=DIFF_SHA:
              raise SystemExit('V102_BIND_FAIL diff sha '+H(diff.encode()))

          # Parse only the exact outer Python heredoc after the representation-only substitution.
          pl=patched.splitlines(keepends=True)
          starts=[i for i,q in enumerate(pl) if q==b"python3 - <<'PY'\n"]
          ends=[i for i,q in enumerate(pl) if q==b'PY\n']
          if starts!=[20] or ends!=[106] or not starts[0]<ends[0]:
              raise SystemExit('V102_BIND_FAIL outer python heredoc boundaries '+repr((starts,ends)))
          pybody=b''.join(pl[starts[0]+1:ends[0]]).decode('utf-8')
          ast.parse(pybody)

          Path('bootstrap-v102/v100-run-canonical-repr-v102.sh').write_bytes(patched)
          Path(O/'v101-to-v102-canonical-repr.diff').write_text(diff)
          receipt={
              'schema':1,
              'status':'V101_NESTED_PAYLOAD_CANONICAL_REPR_SERIALIZATION_GATE_PASS',
              'authority_comment':AUTH,
              'v101_head':V101H,
              'v101_tree':V101T,
              'v101_run':V101R,
              'v101_job':V101J,
              'v101_artifact':V101A,
              'v101_repaired_run_sha256':RUN_SHA,
              'opening_run_line':op+1,
              'closing_run_line':cl+1,
              'payload_size':len(payload),
              'payload_sha256':H(payload),
              'replacement_sha256':H(replacement),
              'patched_run_sha256':H(patched),
              'diff_sha256':H(diff.encode()),
              'repr_roundtrip':True,
              'outer_python_ast_parse':True,
              'inverse_reconstruction':True,
              'payload_mutation':False,
              'scientific_script_mutation':False,
              'source_defined_transport_mutation':False,
              'b_selected':False,
              'b_resolved':False,
          }
          Path(O/'canonical-repr-gate-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          Path(O/'V101_NESTED_PAYLOAD_CANONICAL_REPR_SERIALIZATION_GATE_PASS').write_text('PASS exact canonical repr serialization of frozen 2757-byte payload only\n')
          PY

          bash -n bootstrap-v102/v100-run-canonical-repr-v102.sh
          echo V101_NESTED_PAYLOAD_CANONICAL_REPR_SERIALIZATION_GATE_PASS
          set +e
          GITHUB_SHA=288e443145866ff6206bdc159221935e763e4575 bash bootstrap-v102/v100-run-canonical-repr-v102.sh >evidence/v102-v101-nested-payload-canonical-repr/preserved-v100-child.stdout 2>evidence/v102-v101-nested-payload-canonical-repr/preserved-v100-child.stderr
          RC=$?
          set -e
          printf '%s\n' "$RC" > evidence/v102-v101-nested-payload-canonical-repr/preserved-v100-child.exit-code.txt
          if [ "$RC" -ne 0 ]; then
            echo "V102_PRESERVED_V100_FIRST_FALSE rc=$RC" >&2
            tail -n 7000 evidence/v102-v101-nested-payload-canonical-repr/preserved-v100-child.stderr >&2 || true
            exit "$RC"
          fi
          echo V102_PRESERVED_CHAIN_COMPLETED_PRE_RESULT

      - name: Upload V102 frozen PRE-RESULT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-worker-module-v102-evidence
          if-no-files-found: error
          retention-days: 90
          path: |
            fetched-v102/
            bootstrap-v102/
            evidence/v102-v101-nested-payload-canonical-repr/
