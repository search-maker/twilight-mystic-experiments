name: LowAlt LT5 P Worker Module V102 Diff Hash V103

on:
  push:
    branches: [review/lowalt-lt5-p-worker-module-v103-20260920]
    paths: [.github/workflows/lowalt-lt5-p-worker-module-v103.yml]

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  v102-diff-hash-assertion-binding:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Repair only V102 diff-hash assertion binding
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p fetched-v103 owner-v103/v101 bootstrap-v103 evidence/v103-v102-diff-hash-binding
          api_get(){ curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$1" -o "$2"; }
          R=https://api.github.com/repos/search-maker/twilight-mystic-experiments
          api_get "$R/issues/comments/5749920319" fetched-v103/coordinator.json
          api_get "$R/contents/.github/workflows/lowalt-lt5-p-worker-module-v102.yml?ref=63aab791a049c4d9a0f7286a98996b9864be8950" fetched-v103/v102-workflow.json
          api_get "$R/actions/runs/35511748756" fetched-v103/v102-run.json
          api_get "$R/actions/jobs/106080737706" fetched-v103/v102-job.json
          api_get "$R/actions/artifacts/10605662489" fetched-v103/v102-artifact.json
          api_get "$R/branches/main" fetched-v103/main.json
          api_get "$R/compare/6cd7c075766fe0c86bc7561ec205a3f9120fd1fb...${GITHUB_SHA}" fetched-v103/main-to-v103.json
          curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$R/actions/jobs/106080737706/logs" -o fetched-v103/v102-job.log
          curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$R/actions/artifacts/10605642049/zip" -o fetched-v103/v101-artifact.zip

          python3 - <<'PY'
          import ast,base64,difflib,hashlib,json,zipfile
          from pathlib import Path

          O=Path('evidence/v103-v102-diff-hash-binding')
          O.mkdir(parents=True,exist_ok=True)
          MAIN='6cd7c075766fe0c86bc7561ec205a3f9120fd1fb'
          AUTH=5749920319
          V102H='63aab791a049c4d9a0f7286a98996b9864be8950'
          V102T='2f7bceca9006a690db648eb5e4c61df668128789'
          V102B='c825311dd1a8928decc1ae46902bc90beba96165'
          V102R=35511748756
          V102J=106080737706
          V102A=10605662489
          V102AD='sha256:31a592616eb27b87659990af96e48b1351a096606eb5f463472bc2407a58e91f'
          V101_RUN_SHA='45d027927e0200973d196699949583d7c4018b70b6853ac95ea0e2bfbf45e16a'
          OLD='5471cb0c967ca6cb9fffece960e0c0f176adb2c3a472d968dcb06e0e4f80e453'
          NEW='c2d23345d39a4fb043b938c021bd5fb947e068a2a796b7bc2e96d2d10798814d'
          PATH='.github/workflows/lowalt-lt5-p-worker-module-v103.yml'
          H=lambda b:hashlib.sha256(b).hexdigest()
          G=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          def j(p): return json.loads(Path(p).read_text())

          c=j('fetched-v103/coordinator.json')
          if c.get('id')!=AUTH or c.get('user',{}).get('login')!='search-maker':
              raise SystemExit('V103_BIND_FAIL coordinator identity')
          body=c.get('body','')
          required=[
              'COORDINATOR::LOWALT_V103_V102_DIFF_HASH_ASSERTION_BINDING_SUCCESSOR_AUTHORIZED__SCIENCE_PRODUCTION_FALSE',
              'AUTHORIZED: exactly ONE fresh LowAlt PRE-RESULT V103 identity',
              'V102_DIFF_HASH_ASSERTION_BINDING_GATE_PASS',
              'No V104 absent later direct Coordinator transition.',
              OLD,NEW,V101_RUN_SHA,
          ]
          for x in required:
              if x not in body: raise SystemExit('V103_BIND_FAIL authority '+x)

          wf=j('fetched-v103/v102-workflow.json')
          src=base64.b64decode(wf['content'])
          if wf.get('sha')!=V102B or G(src)!=V102B:
              raise SystemExit('V103_BIND_FAIL V102 workflow blob')
          rr=j('fetched-v103/v102-run.json')
          if rr.get('id')!=V102R or rr.get('run_attempt')!=1 or rr.get('conclusion')!='failure' or rr.get('head_sha')!=V102H:
              raise SystemExit('V103_BIND_FAIL V102 run identity')
          if (rr.get('head_commit') or {}).get('tree_id')!=V102T:
              raise SystemExit('V103_BIND_FAIL V102 tree')
          jj=j('fetched-v103/v102-job.json')
          if jj.get('id')!=V102J or jj.get('run_id')!=V102R or jj.get('run_attempt')!=1 or jj.get('conclusion')!='failure':
              raise SystemExit('V103_BIND_FAIL V102 job identity')
          aa=j('fetched-v103/v102-artifact.json')
          if aa.get('id')!=V102A or aa.get('workflow_run',{}).get('id')!=V102R or aa.get('digest')!=V102AD or aa.get('expired') is not False:
              raise SystemExit('V103_BIND_FAIL V102 artifact identity')
          main=j('fetched-v103/main.json')
          comp=j('fetched-v103/main-to-v103.json')
          fs=comp.get('files') or []
          if main.get('commit',{}).get('sha')!=MAIN:
              raise SystemExit('V103_BIND_FAIL main drift')
          if comp.get('base_commit',{}).get('sha')!=MAIN or len(fs)!=1 or fs[0].get('filename')!=PATH or fs[0].get('status')!='added':
              raise SystemExit('V103_BIND_FAIL branch scope '+repr([(q.get('filename'),q.get('status')) for q in fs]))

          # Exact V102 first-false execution receipt: distinguish command/source echo from the executed line.
          log=Path('fetched-v103/v102-job.log').read_text(errors='strict').splitlines()
          needle='V102_BIND_FAIL diff sha '+NEW
          raw=[q for q in log if needle in q]
          executed=[]
          for q in raw:
              if 'Z ' in q and q.split('Z ',1)[1]==needle:
                  executed.append(q)
          if len(executed)!=1:
              raise SystemExit('V103_BIND_FAIL V102 first-false executed receipt '+repr(executed))

          # Extract exact V102 run shell by the already-established 10-space YAML block-indent rule.
          sl=src.splitlines(keepends=True)
          marker=b'        run: |\n'
          if sl.count(marker)!=1: raise SystemExit('V103_BIND_FAIL V102 run marker count='+str(sl.count(marker)))
          m=sl.index(marker)
          out=[]
          for q in sl[m+1:]:
              if q.strip() and not q.startswith(b'          '): break
              out.append(q[10:] if q.startswith(b'          ') else q)
          run=b''.join(out)
          oldb=OLD.encode(); newb=NEW.encode()
          if run.count(oldb)!=1 or run.count(newb)!=0:
              raise SystemExit('V103_BIND_FAIL hash literal cardinality '+repr((run.count(oldb),run.count(newb))))

          # Independently recompute the exact V102 diff hash from accepted immutable V101 owner bytes.
          with zipfile.ZipFile('fetched-v103/v101-artifact.zip') as z:
              names=z.namelist()
              target='bootstrap-v101/v100-run-repaired-v101.sh'
              if names.count(target)!=1: raise SystemExit('V103_BIND_FAIL V101 owner member cardinality')
              owner=z.read(target)
          if H(owner)!=V101_RUN_SHA: raise SystemExit('V103_BIND_FAIL V101 owner sha')
          lines=owner.splitlines(keepends=True)
          op,cl=92,125
          if lines[op]!=b"nested=r'''python3 - <<'PY_V100_NEST'\n" or lines[cl]!=b"'''\n" or not lines[cl+1].startswith(b'patched=text.replace(anchor,nested,1)'):
              raise SystemExit('V103_BIND_FAIL V101 owner boundaries')
          payload=lines[op][len(b"nested=r'''"):]+b''.join(lines[op+1:cl])
          rep=repr(payload.decode('utf-8'))
          replacement=b'nested='+rep.encode('utf-8')+b'\n'
          corrected=b''.join(lines[:op]+[replacement]+lines[cl+1:])
          generated=''.join(difflib.unified_diff(owner.decode().splitlines(True),corrected.decode().splitlines(True),fromfile='v101-repaired-v100-run.sh',tofile='v102-canonical-repr-v100-run.sh',n=3)).encode()
          if H(generated)!=NEW:
              raise SystemExit('V103_BIND_FAIL independent diff recomputation '+H(generated))
          # Confirm the corrected representation remains parseable.
          pl=corrected.splitlines(keepends=True)
          starts=[i for i,q in enumerate(pl) if q==b"python3 - <<'PY'\n"]
          ends=[i for i,q in enumerate(pl) if q==b'PY\n']
          if starts!=[20] or ends!=[106]: raise SystemExit('V103_BIND_FAIL owner AST boundaries')
          ast.parse(b''.join(pl[21:106]).decode('utf-8'))

          patched=run.replace(oldb,newb,1)
          if patched==run or patched.count(oldb)!=0 or patched.count(newb)!=1:
              raise SystemExit('V103_PATCH_FAIL substitution')
          if patched.replace(newb,oldb,1)!=run:
              raise SystemExit('V103_PATCH_FAIL inverse reconstruction')
          d=''.join(difflib.unified_diff(run.decode().splitlines(True),patched.decode().splitlines(True),fromfile='v102-run.sh',tofile='v103-patched-v102-run.sh',n=3))
          changed=[q for q in d.splitlines() if (q.startswith('+') or q.startswith('-')) and not q.startswith('+++') and not q.startswith('---')]
          if len(changed)!=2 or OLD not in changed[0]+changed[1] or NEW not in changed[0]+changed[1]:
              raise SystemExit('V103_PATCH_FAIL non-single-literal diff '+repr(changed))

          Path('bootstrap-v103/v102-run-patched-v103.sh').write_bytes(patched)
          Path(O/'v102-to-v103-one-literal.diff').write_text(d)
          receipt={
              'schema':1,
              'status':'V102_DIFF_HASH_ASSERTION_BINDING_GATE_PASS',
              'authority_comment':AUTH,
              'v102_head':V102H,'v102_tree':V102T,'v102_run':V102R,'v102_job':V102J,'v102_artifact':V102A,
              'old_expected_diff_sha256':OLD,
              'recomputed_exact_diff_sha256':NEW,
              'before_run_sha256':H(run),
              'after_run_sha256':H(patched),
              'patch_diff_sha256':H(d.encode()),
              'independent_recomputation':True,
              'owner_outer_python_ast_parse':True,
              'inverse_reconstruction':True,
              'changed_literal_count':1,
              'scientific_script_mutation':False,
              'source_defined_transport_mutation':False,
              'b_selected':False,'b_resolved':False,
          }
          Path(O/'diff-hash-binding-gate-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          Path(O/'V102_DIFF_HASH_ASSERTION_BINDING_GATE_PASS').write_text('PASS exact one-literal V102 diff-hash assertion correction only\n')
          PY

          bash -n bootstrap-v103/v102-run-patched-v103.sh
          echo V102_DIFF_HASH_ASSERTION_BINDING_GATE_PASS
          set +e
          GITHUB_SHA=63aab791a049c4d9a0f7286a98996b9864be8950 bash bootstrap-v103/v102-run-patched-v103.sh >evidence/v103-v102-diff-hash-binding/preserved-v102-child.stdout 2>evidence/v103-v102-diff-hash-binding/preserved-v102-child.stderr
          RC=$?
          set -e
          printf '%s\n' "$RC" > evidence/v103-v102-diff-hash-binding/preserved-v102-child.exit-code.txt
          if [ "$RC" -ne 0 ]; then
            echo "V103_PRESERVED_V102_FIRST_FALSE rc=$RC" >&2
            tail -n 7000 evidence/v103-v102-diff-hash-binding/preserved-v102-child.stderr >&2 || true
            exit "$RC"
          fi
          echo V103_PRESERVED_CHAIN_COMPLETED_PRE_RESULT

      - name: Upload V103 frozen PRE-RESULT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-worker-module-v103-evidence
          if-no-files-found: error
          retention-days: 90
          path: |
            fetched-v103/
            bootstrap-v103/
            evidence/v103-v102-diff-hash-binding/
            fetched-v102/
            artifacts-v102/
            bootstrap-v102/
            evidence/v102-v101-nested-payload-canonical-repr/
