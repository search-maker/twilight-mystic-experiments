name: LowAlt LT5 P Worker Module V100 Path Cardinality V105
on:
  push:
    branches: [review/lowalt-lt5-p-worker-module-v105-20260920]
    paths: [.github/workflows/lowalt-lt5-p-worker-module-v105.yml]
permissions:
  contents: read
  actions: read
  issues: read
jobs:
  v105:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p fetched-v105 bootstrap-v105 evidence/v105-v100-corrected-child-path-cardinality
          R=https://api.github.com/repos/search-maker/twilight-mystic-experiments
          get(){ curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$1" -o "$2"; }
          get "$R/issues/comments/5750193612" fetched-v105/coordinator.json
          get "$R/contents/.github/workflows/lowalt-lt5-p-worker-module-v104.yml?ref=ae3a706bd32f8fdc7094cdb9e37312f85b8dc82f" fetched-v105/v104-workflow.json
          get "$R/actions/runs/35514266665" fetched-v105/v104-run.json
          get "$R/actions/jobs/106087428973" fetched-v105/v104-job.json
          get "$R/actions/artifacts/10606187750" fetched-v105/v104-artifact.json
          get "$R/actions/jobs/106087428973/logs" fetched-v105/v104-job.log
          get "$R/actions/artifacts/10606187750/zip" fetched-v105/v104.zip
          get "$R/branches/main" fetched-v105/main.json
          get "$R/compare/6cd7c075766fe0c86bc7561ec205a3f9120fd1fb...${GITHUB_SHA}" fetched-v105/compare.json
          python3 - <<'PY'
          import ast,base64,difflib,hashlib,json,zipfile
          from pathlib import Path
          H=lambda b:hashlib.sha256(b).hexdigest()
          G=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          J=lambda p:json.loads(Path(p).read_text())
          O=Path('evidence/v105-v100-corrected-child-path-cardinality')
          MAIN='6cd7c075766fe0c86bc7561ec205a3f9120fd1fb'; AUTH=5750193612
          H104='ae3a706bd32f8fdc7094cdb9e37312f85b8dc82f'; T104='58c10fb6de7458614af67bfe77978d922f4cfd57'; B104='2b6addc8686317514dc1cee6bc7df4625200c4c9'
          R104=35514266665; J104=106087428973; A104=10606187750; AD104='sha256:01cec04dd6681ef1a43e5b6e6e02c0725558109f41b0236b770312fec20844bf'; AZ104=103118849
          CHILD0='ade2a9ff0325fbc0face24d502b39c190ce525cb540ba158d96245ed937be9c3'; CHILD1='62270e588ea11043c4bae63951f51a2c87797c03e14273d676e7651aeb8f5bd7'; DSH='bf8a47603aadc9e2013d0ca12e4244c05fc36d78741cc1d4c20b44e59c398392'
          CREC='d1d4a598d7affac808653dd749a8f031e4903816d2f44f68d197f0cb76e0e223'; ERRH='9a0740ac3c5185711c9629df26312f2bd074628168555799d27cf460906b8926'
          V99B='b06c3d26491c85bcd423188ffd37434f81fccf84'
          old_path='bootstrap-v99/v98-run-patched-v99.sh'; new_path='bootstrap-v99/v98-run-patched-v99-v100.sh'
          OLD="if patched==text or patched.count('bootstrap-v99/v98-run-patched-v99-v100.sh')!=2: raise SystemExit('V100_PATCH_FAIL V99 corrected child path')"
          NEW=OLD.replace('!=2','!=3')
          c=J('fetched-v105/coordinator.json')
          if c.get('id')!=AUTH or c.get('user',{}).get('login')!='search-maker': raise SystemExit('V105_BIND_FAIL coordinator identity')
          body=c.get('body','')
          for x in ['COORDINATOR::LOWALT_V105_V104_V100_CORRECTED_CHILD_PATH_CARDINALITY_ASSERTION_SUCCESSOR_AUTHORIZED__SCIENCE_PRODUCTION_FALSE','AUTHORIZED: exactly ONE fresh LowAlt PRE-RESULT V105 identity','V100_CORRECTED_CHILD_PATH_CARDINALITY_GATE_PASS','No V106 absent later direct Coordinator transition.',CHILD0,CHILD1,DSH]:
              if x not in body: raise SystemExit('V105_BIND_FAIL authority '+x)
          wf=J('fetched-v105/v104-workflow.json'); src=base64.b64decode(wf['content'])
          if wf.get('sha')!=B104 or G(src)!=B104: raise SystemExit('V105_BIND_FAIL V104 workflow')
          r,j,a=J('fetched-v105/v104-run.json'),J('fetched-v105/v104-job.json'),J('fetched-v105/v104-artifact.json')
          if r.get('id')!=R104 or r.get('run_attempt')!=1 or r.get('conclusion')!='failure' or r.get('head_sha')!=H104 or (r.get('head_commit') or {}).get('tree_id')!=T104: raise SystemExit('V105_BIND_FAIL V104 run')
          if j.get('id')!=J104 or j.get('run_id')!=R104 or j.get('run_attempt')!=1 or j.get('conclusion')!='failure': raise SystemExit('V105_BIND_FAIL V104 job')
          if a.get('id')!=A104 or a.get('digest')!=AD104 or a.get('size_in_bytes')!=AZ104 or a.get('expired') is not False: raise SystemExit('V105_BIND_FAIL V104 artifact')
          m,comp=J('fetched-v105/main.json'),J('fetched-v105/compare.json'); fs=comp.get('files') or []
          if m.get('commit',{}).get('sha')!=MAIN or comp.get('base_commit',{}).get('sha')!=MAIN or len(fs)!=1 or fs[0].get('filename')!='.github/workflows/lowalt-lt5-p-worker-module-v105.yml' or fs[0].get('status')!='added': raise SystemExit('V105_BIND_FAIL branch scope '+repr([(q.get('filename'),q.get('status')) for q in fs]))
          log=Path('fetched-v105/v104-job.log').read_text(errors='strict').splitlines(); ex=lambda t:[q for q in log if 'Z ' in q and q.split('Z ',1)[1]==t]
          for t in ['V103_CORRECTED_DIFF_HASH_AUTHORITY_LOCUS_GATE_PASS','V104_PRESERVED_V102_FIRST_FALSE rc=1','V102_PRESERVED_V100_FIRST_FALSE rc=1','V100_PATCH_FAIL V99 corrected child path']:
              if len(ex(t))!=1: raise SystemExit('V105_BIND_FAIL V104 executed receipt '+t+' '+repr(ex(t)))
          with zipfile.ZipFile('fetched-v105/v104.zip') as z:
              names=z.namelist()
              cn='bootstrap-v102/v100-run-canonical-repr-v102.sh'; rn='evidence/v102-v101-nested-payload-canonical-repr/canonical-repr-gate-receipt.json'; gn='evidence/v102-v101-nested-payload-canonical-repr/V101_NESTED_PAYLOAD_CANONICAL_REPR_SERIALIZATION_GATE_PASS'; en='evidence/v102-v101-nested-payload-canonical-repr/preserved-v100-child.stderr'; xn='evidence/v102-v101-nested-payload-canonical-repr/preserved-v100-child.exit-code.txt'; vn='fetched-v100/v99-workflow.json'
              if len(names)!=len(set(names)) or any(names.count(q)!=1 for q in [cn,rn,gn,en,xn,vn]): raise SystemExit('V105_BIND_FAIL V104 members')
              child,recb,gate,err,rc,v99j=(z.read(q) for q in [cn,rn,gn,en,xn,vn])
          if H(child)!=CHILD0 or H(recb)!=CREC or H(err)!=ERRH or err!=b'V100_PATCH_FAIL V99 corrected child path\n' or rc!=b'1\n': raise SystemExit('V105_BIND_FAIL canonical child evidence')
          rec=json.loads(recb)
          if rec.get('status')!='V101_NESTED_PAYLOAD_CANONICAL_REPR_SERIALIZATION_GATE_PASS' or rec.get('patched_run_sha256')!=CHILD0 or rec.get('diff_sha256')!='c2d23345d39a4fb043b938c021bd5fb947e068a2a796b7bc2e96d2d10798814d' or rec.get('b_selected') is not False or rec.get('b_resolved') is not False: raise SystemExit('V105_BIND_FAIL canonical receipt')
          if gate!=b'PASS exact canonical repr serialization of frozen 2757-byte payload only\n': raise SystemExit('V105_BIND_FAIL canonical gate marker')
          vj=json.loads(v99j); v99=base64.b64decode(vj['content'])
          if vj.get('sha')!=V99B or G(v99)!=V99B: raise SystemExit('V105_BIND_FAIL V99 workflow bytes')
          sl=v99.splitlines(keepends=True); marker=b'        run: |\n'
          if sl.count(marker)!=1: raise SystemExit('V105_BIND_FAIL V99 run marker')
          mm=sl.index(marker); out=[]
          for q in sl[mm+1:]:
              if q.strip() and not q.startswith(b'          '): break
              out.append(q[10:] if q.startswith(b'          ') else q)
          r99=b''.join(out).decode()
          anchor='bash -n '+old_path+'\n'; exec_old='GITHUB_SHA=0c58c7013855107d5b848835c61bd6a278ca8029 bash '+old_path
          if r99.count(old_path)!=3 or r99.count(new_path)!=0 or r99.count(anchor)!=1 or r99.count(exec_old)!=1: raise SystemExit('V105_BIND_FAIL V99 path ownership '+repr((r99.count(old_path),r99.count(new_path),r99.count(anchor),r99.count(exec_old))))
          text=child.decode()
          if text.count(OLD)!=1 or text.count(NEW)!=0: raise SystemExit('V105_BIND_FAIL assertion cardinality')
          lines=text.splitlines(keepends=True)
          starts=[i for i,q in enumerate(lines) if q=="python3 - <<'PY'\n"]; ends=[i for i,q in enumerate(lines) if q=='PY\n']
          if starts!=[20] or ends!=[106]: raise SystemExit('V105_BIND_FAIL child python boundaries '+repr((starts,ends)))
          tree=ast.parse(''.join(lines[21:106])); nested=None
          for n in tree.body:
              if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='nested' for t in n.targets): nested=ast.literal_eval(n.value)
          if not isinstance(nested,str) or nested.count(new_path)!=2 or nested.count(old_path)!=1: raise SystemExit('V105_BIND_FAIL nested path counts '+repr((None if nested is None else nested.count(new_path),None if nested is None else nested.count(old_path))))
          simulated=r99.replace(anchor,nested,1).replace(exec_old,exec_old.replace(old_path,new_path),1)
          if simulated.count(new_path)!=3 or simulated.count(old_path)!=2: raise SystemExit('V105_BIND_FAIL deterministic 2+1 proof '+repr((simulated.count(new_path),simulated.count(old_path))))
          patched=child.replace(OLD.encode(),NEW.encode(),1)
          if patched.replace(NEW.encode(),OLD.encode(),1)!=child or H(patched)!=CHILD1: raise SystemExit('V105_PATCH_FAIL child inverse/sha '+H(patched))
          d=''.join(difflib.unified_diff(text.splitlines(True),patched.decode().splitlines(True),fromfile='v102-canonical-repr-v100-run.sh',tofile='v105-cardinality-corrected-v100-run.sh',n=3)).encode()
          if H(d)!=DSH: raise SystemExit('V105_PATCH_FAIL diff sha '+H(d))
          changed=[q for q in d.decode().splitlines() if (q.startswith('+') or q.startswith('-')) and not q.startswith('+++') and not q.startswith('---')]
          if changed!=['-'+OLD,'+'+NEW]: raise SystemExit('V105_PATCH_FAIL non-single-assertion diff '+repr(changed))
          Path('bootstrap-v105/v100-run-cardinality-v105.sh').write_bytes(patched); Path(O/'v104-to-v105.diff').write_bytes(d)
          proof={'schema':1,'v99_old_path_count':r99.count(old_path),'v99_new_path_count_before':r99.count(new_path),'nested_new_path_count':nested.count(new_path),'outer_execution_substitution_count':1,'deterministic_new_path_count_after':simulated.count(new_path),'expected_cardinality_old':2,'expected_cardinality_new':3}
          Path(O/'occurrence-proof.json').write_text(json.dumps(proof,indent=2,sort_keys=True)+'\n')
          receipt={'schema':1,'status':'V100_CORRECTED_CHILD_PATH_CARDINALITY_GATE_PASS','authority_comment':AUTH,'v104_head':H104,'v104_run':R104,'v104_job':J104,'v104_artifact':A104,'before_child_sha256':CHILD0,'after_child_sha256':CHILD1,'patch_diff_sha256':DSH,'inverse_reconstruction':True,'changed_assertion_count':1,'scientific_script_mutation':False,'source_defined_transport_mutation':False,'b_selected':False,'b_resolved':False}
          Path(O/'gate-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n'); Path(O/'V100_CORRECTED_CHILD_PATH_CARDINALITY_GATE_PASS').write_text('PASS exact V100 corrected-child-path cardinality assertion 2->3 only\n')
          PY
          bash -n bootstrap-v105/v100-run-cardinality-v105.sh
          echo V100_CORRECTED_CHILD_PATH_CARDINALITY_GATE_PASS
          set +e
          GITHUB_SHA=288e443145866ff6206bdc159221935e763e4575 bash bootstrap-v105/v100-run-cardinality-v105.sh >evidence/v105-v100-corrected-child-path-cardinality/preserved-v100-child.stdout 2>evidence/v105-v100-corrected-child-path-cardinality/preserved-v100-child.stderr
          RC=$?
          set -e
          printf '%s\n' "$RC" > evidence/v105-v100-corrected-child-path-cardinality/preserved-v100-child.exit-code.txt
          if [ "$RC" -ne 0 ]; then echo "V105_PRESERVED_V100_FIRST_FALSE rc=$RC" >&2; tail -n 7000 evidence/v105-v100-corrected-child-path-cardinality/preserved-v100-child.stderr >&2 || true; exit "$RC"; fi
          echo V105_PRESERVED_CHAIN_COMPLETED_PRE_RESULT
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-worker-module-v105-evidence
          if-no-files-found: error
          retention-days: 90
          path: |
            fetched-v*/
            artifacts-v*/
            bootstrap-v*/
            evidence/
