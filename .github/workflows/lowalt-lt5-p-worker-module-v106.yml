name: LowAlt LT5 P Worker Module V100 Hook Canonical Repr V106
on:
  push:
    branches: [review/lowalt-lt5-p-worker-module-v106-20260920]
    paths: [.github/workflows/lowalt-lt5-p-worker-module-v106.yml]
permissions:
  contents: read
  actions: read
  issues: read
jobs:
  v106:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p fetched-v106 bootstrap-v106 evidence/v106-v100-nested-hook-canonical-repr
          R=https://api.github.com/repos/search-maker/twilight-mystic-experiments
          get(){ curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$1" -o "$2"; }
          get "$R/issues/comments/5750213496" fetched-v106/coordinator.json
          get "$R/contents/.github/workflows/lowalt-lt5-p-worker-module-v105.yml?ref=c31827a2e93e288402b91c54447536e20f27ccee" fetched-v106/v105-workflow.json
          get "$R/actions/runs/35514545954" fetched-v106/v105-run.json
          get "$R/actions/jobs/106088155178" fetched-v106/v105-job.json
          get "$R/actions/artifacts/10606296860" fetched-v106/v105-artifact.json
          get "$R/actions/jobs/106088155178/logs" fetched-v106/v105-job.log
          get "$R/actions/artifacts/10606296860/zip" fetched-v106/v105.zip
          get "$R/branches/main" fetched-v106/main.json
          get "$R/compare/6cd7c075766fe0c86bc7561ec205a3f9120fd1fb...${GITHUB_SHA}" fetched-v106/compare.json
          python3 - <<'PY'
          import ast,base64,difflib,hashlib,json,zipfile
          from pathlib import Path
          H=lambda b:hashlib.sha256(b).hexdigest()
          G=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          J=lambda p:json.loads(Path(p).read_text())
          O=Path('evidence/v106-v100-nested-hook-canonical-repr')
          MAIN='6cd7c075766fe0c86bc7561ec205a3f9120fd1fb'; AUTH=5750213496
          H105='c31827a2e93e288402b91c54447536e20f27ccee'; T105='93656c01075bc01534e2ee4ca2748ee016ed21a1'; B105='1acefb7aa03032535dfc8ea6bf4356afd929ffb5'
          R105=35514545954; J105=106088155178; A105=10606296860; AD105='sha256:ee68210be5cdbc6349eb1842251753ace6ff29372494e4b99adf9f1c06e79fa4'; AZ105=240299909
          BEFORE='b63713a4abb7167add74e2004a1b6b9154ad76efe0b057a65801f15334a9b3aa'; PAY='2b1dbc2c108b13aaf70eeec7b7619a03a9de1ad25930d795d3340d293b71459a'; REPL='b36f5a210f7a8d3e956135a9711acfbd4b928c173d84e804cdcb6243d7927c49'; AFTER='e10ffdb3fd93dfc3af0d962863ece410ede6aa6280cf13195c3aea0ad64fbea4'; DSH='fdbbabe32b997190d4a0001b58f479d0a0bcd0c1593d16abd0f9bf785bb869b9'
          c=J('fetched-v106/coordinator.json')
          if c.get('id')!=AUTH or c.get('user',{}).get('login')!='search-maker': raise SystemExit('V106_BIND_FAIL coordinator identity')
          body=c.get('body','')
          for x in ['COORDINATOR::LOWALT_V106_V105_V100_NESTED_HOOK_CANONICAL_REPR_SERIALIZATION_SUCCESSOR_AUTHORIZED__SCIENCE_PRODUCTION_FALSE','AUTHORIZED: exactly ONE fresh LowAlt PRE-RESULT V106 identity','V100_NESTED_HOOK_CANONICAL_REPR_SERIALIZATION_GATE_PASS','No V107 absent later direct Coordinator transition.',BEFORE,PAY,REPL,AFTER,DSH]:
              if x not in body: raise SystemExit('V106_BIND_FAIL authority '+x)
          wf=J('fetched-v106/v105-workflow.json'); src=base64.b64decode(wf['content'])
          if wf.get('sha')!=B105 or G(src)!=B105: raise SystemExit('V106_BIND_FAIL V105 workflow')
          r,j,a=J('fetched-v106/v105-run.json'),J('fetched-v106/v105-job.json'),J('fetched-v106/v105-artifact.json')
          if r.get('id')!=R105 or r.get('run_attempt')!=1 or r.get('conclusion')!='failure' or r.get('head_sha')!=H105 or (r.get('head_commit') or {}).get('tree_id')!=T105: raise SystemExit('V106_BIND_FAIL V105 run')
          if j.get('id')!=J105 or j.get('run_id')!=R105 or j.get('run_attempt')!=1 or j.get('conclusion')!='failure': raise SystemExit('V106_BIND_FAIL V105 job')
          if a.get('id')!=A105 or a.get('digest')!=AD105 or a.get('size_in_bytes')!=AZ105 or a.get('expired') is not False: raise SystemExit('V106_BIND_FAIL V105 artifact')
          m,comp=J('fetched-v106/main.json'),J('fetched-v106/compare.json'); fs=comp.get('files') or []
          if m.get('commit',{}).get('sha')!=MAIN or comp.get('base_commit',{}).get('sha')!=MAIN or len(fs)!=1 or fs[0].get('filename')!='.github/workflows/lowalt-lt5-p-worker-module-v106.yml' or fs[0].get('status')!='added': raise SystemExit('V106_BIND_FAIL branch scope')
          log=Path('fetched-v106/v105-job.log').read_text(errors='strict').splitlines(); ex=lambda t:[q for q in log if 'Z ' in q and q.split('Z ',1)[1]==t]
          for t in ['V100_CORRECTED_CHILD_PATH_CARDINALITY_GATE_PASS','V105_PRESERVED_V100_FIRST_FALSE rc=1','V100_PRESERVED_V99_FIRST_FALSE rc=1','SyntaxError: invalid syntax']:
              if len(ex(t))!=1: raise SystemExit('V106_BIND_FAIL V105 executed receipt '+t+' '+repr(ex(t)))
          with zipfile.ZipFile('fetched-v106/v105.zip') as z:
              names=z.namelist(); cn='bootstrap-v100/v99-run-patched-v100.sh'; gr='evidence/v105-v100-corrected-child-path-cardinality/gate-receipt.json'; er='evidence/v105-v100-corrected-child-path-cardinality/preserved-v100-child.stderr'; xr='evidence/v105-v100-corrected-child-path-cardinality/preserved-v100-child.exit-code.txt'
              if len(names)!=len(set(names)) or any(names.count(q)!=1 for q in [cn,gr,er,xr]): raise SystemExit('V106_BIND_FAIL V105 members')
              child,grec,err,rc=(z.read(q) for q in [cn,gr,er,xr])
          if H(child)!=BEFORE or rc!=b'1\n' or b'SyntaxError: invalid syntax' not in err or b"old='''if text.count(old_import)" not in err: raise SystemExit('V106_BIND_FAIL first-false evidence')
          g=json.loads(grec)
          if g.get('status')!='V100_CORRECTED_CHILD_PATH_CARDINALITY_GATE_PASS' or g.get('after_child_sha256')!='62270e588ea11043c4bae63951f51a2c87797c03e14273d676e7651aeb8f5bd7' or g.get('b_selected') is not False or g.get('b_resolved') is not False: raise SystemExit('V106_BIND_FAIL V105 receipt')
          lines=child.splitlines(keepends=True)
          ops=[i for i,q in enumerate(lines) if q.startswith(b"hook=r'''python3 - <<'PY_V100_FIX'")]
          cls=[i for i,q in enumerate(lines[:-1]) if q==b"'''\n" and lines[i+1].startswith(b"if s.count(anchor)!=1 or s.count(exec_old)!=1")]
          if len(ops)!=1 or len(cls)!=1 or not ops[0]<cls[0]: raise SystemExit('V106_BIND_FAIL hook boundaries '+repr((ops,cls)))
          op,cl=ops[0],cls[0]; prefix=b"hook=r'''"
          payload=lines[op][len(prefix):]+b''.join(lines[op+1:cl])
          if len(payload)!=1781 or H(payload)!=PAY: raise SystemExit('V106_BIND_FAIL payload identity '+repr((len(payload),H(payload))))
          replacement=('hook='+repr(payload.decode('utf-8'))+'\n').encode()
          if H(replacement)!=REPL: raise SystemExit('V106_BIND_FAIL replacement sha '+H(replacement))
          an=ast.parse(replacement.decode()).body
          if len(an)!=1 or not isinstance(an[0],ast.Assign) or ast.literal_eval(an[0].value).encode()!=payload: raise SystemExit('V106_BIND_FAIL literal roundtrip')
          patched=b''.join(lines[:op]+[replacement]+lines[cl+1:])
          malformed=prefix+payload+b"'''\n"
          if patched.replace(replacement,malformed,1)!=child or H(patched)!=AFTER: raise SystemExit('V106_PATCH_FAIL inverse/sha '+H(patched))
          ps=patched.decode().splitlines(keepends=True); starts=[i for i,q in enumerate(ps) if q=="python3 - <<'PY_V100_NEST'\n"]; ends=[i for i,q in enumerate(ps) if q=='PY_V100_NEST\n']
          if len(starts)!=1 or len(ends)!=1 or not starts[0]<ends[0]: raise SystemExit('V106_BIND_FAIL nested heredoc boundaries')
          ast.parse(''.join(ps[starts[0]+1:ends[0]]))
          d=''.join(difflib.unified_diff(child.decode().splitlines(True),patched.decode().splitlines(True),fromfile='v105-generated-v99-run.sh',tofile='v106-hook-canonical-repr-v99-run.sh',n=3)).encode()
          if H(d)!=DSH: raise SystemExit('V106_PATCH_FAIL diff sha '+H(d))
          Path('bootstrap-v106/v99-run-hook-repr-v106.sh').write_bytes(patched); Path(O/'v105-to-v106.diff').write_bytes(d); Path(O/'frozen-hook-payload.bin').write_bytes(payload)
          rec={'schema':1,'status':'V100_NESTED_HOOK_CANONICAL_REPR_SERIALIZATION_GATE_PASS','authority_comment':AUTH,'v105_head':H105,'v105_run':R105,'v105_job':J105,'v105_artifact':A105,'before_child_sha256':BEFORE,'payload_size':len(payload),'payload_sha256':PAY,'replacement_sha256':REPL,'after_child_sha256':AFTER,'patch_diff_sha256':DSH,'literal_roundtrip':True,'nested_ast_parse':True,'inverse_reconstruction':True,'payload_mutation':False,'scientific_script_mutation':False,'source_defined_transport_mutation':False,'b_selected':False,'b_resolved':False}
          Path(O/'gate-receipt.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n'); Path(O/'V100_NESTED_HOOK_CANONICAL_REPR_SERIALIZATION_GATE_PASS').write_text('PASS exact 1781-byte hook payload canonical repr serialization only\n')
          PY
          bash -n bootstrap-v106/v99-run-hook-repr-v106.sh
          echo V100_NESTED_HOOK_CANONICAL_REPR_SERIALIZATION_GATE_PASS
          set +e
          GITHUB_SHA=73f87a34c7f4c933ff78f014c749c71d576e1bc9 bash bootstrap-v106/v99-run-hook-repr-v106.sh >evidence/v106-v100-nested-hook-canonical-repr/preserved-v99-child.stdout 2>evidence/v106-v100-nested-hook-canonical-repr/preserved-v99-child.stderr
          RC=$?
          set -e
          printf '%s\n' "$RC" > evidence/v106-v100-nested-hook-canonical-repr/preserved-v99-child.exit-code.txt
          if [ "$RC" -ne 0 ]; then echo "V106_PRESERVED_V99_FIRST_FALSE rc=$RC" >&2; tail -n 7000 evidence/v106-v100-nested-hook-canonical-repr/preserved-v99-child.stderr >&2 || true; exit "$RC"; fi
          echo V106_PRESERVED_CHAIN_COMPLETED_PRE_RESULT
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-worker-module-v106-evidence
          if-no-files-found: error
          retention-days: 90
          path: |
            fetched-v*/
            artifacts-v*/
            bootstrap-v*/
            evidence/
