name: LowAlt LT5 P Worker Module V100 V98 Exec Path V107
on:
  push:
    branches: [review/lowalt-lt5-p-worker-module-v107-20260920]
    paths: [.github/workflows/lowalt-lt5-p-worker-module-v107.yml]
permissions:
  contents: read
  actions: read
  issues: read
jobs:
  v107:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p fetched-v107 bootstrap-v107 evidence/v107-v100-v98-execution-path-representation
          R=https://api.github.com/repos/search-maker/twilight-mystic-experiments
          get(){ curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$1" -o "$2"; }
          get "$R/issues/comments/5750239177" fetched-v107/coordinator.json
          get "$R/contents/.github/workflows/lowalt-lt5-p-worker-module-v106.yml?ref=c5f03f8632663d4e8a36498f422604c6c8e3f46c" fetched-v107/v106-workflow.json
          get "$R/actions/runs/35514719040" fetched-v107/v106-run.json
          get "$R/actions/jobs/106088604225" fetched-v107/v106-job.json
          get "$R/actions/artifacts/10606826068" fetched-v107/v106-artifact.json
          get "$R/actions/jobs/106088604225/logs" fetched-v107/v106-job.log
          get "$R/actions/artifacts/10606826068/zip" fetched-v107/v106.zip
          get "$R/branches/main" fetched-v107/main.json
          get "$R/compare/6cd7c075766fe0c86bc7561ec205a3f9120fd1fb...${GITHUB_SHA}" fetched-v107/compare.json
          python3 - <<'PY'
          import ast,base64,difflib,hashlib,json,zipfile
          from pathlib import Path
          H=lambda b:hashlib.sha256(b).hexdigest()
          G=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          J=lambda p:json.loads(Path(p).read_text())
          O=Path('evidence/v107-v100-v98-execution-path-representation')
          MAIN='6cd7c075766fe0c86bc7561ec205a3f9120fd1fb'; AUTH=5750239177
          H106='c5f03f8632663d4e8a36498f422604c6c8e3f46c'; T106='e430c102138c636c2a499f969ee6fd4b9ebc454e'; B106='25cde5bac87c6fa8c664d58029874c5f3807d5c3'
          R106=35514719040; J106=106088604225; A106=10606826068; AD106='sha256:27c5181048d6f304fbbb22ccd4956cc556c745d3e387434ba74c620af97b87ac'; AZ106=274710795
          BEFORE='e10ffdb3fd93dfc3af0d962863ece410ede6aa6280cf13195c3aea0ad64fbea4'; V98='6dce0c9b9fbd72e4d3d2896788766514345acc52cd804121989a9066e785db8f'; GRE='7bdcd81f27fc38d386085a8d10393332a1c6f2e57927d9366b9404e45c365c56'; ERR='59b7c8f3de29e951a7d6dca87f2ae5caebd2331fb3084b95aa8cb43cb7f873d7'
          OLDH='c92477dd7fdb7ea9c45e84fd4d992620694f38196b2676e6f37c31bbec38cec8'; NEWH='f4ecfeb7ca17f5e93b64fa15cf78425f85b63a9674bf2b62bbbcf58d09244fd2'; AFTER='ef00c27388074eaa6a80b4c42d986658711dd680f5ad1b89629967ac1ddda81a'; DSH='8e1abf2c8bdf065ecc9120b05268110904861cd964ee9f6630937bbe12375d99'
          old_line='exec_old="GITHUB_SHA=ae069a42089c2e83181d4d17b8b7eea999501306 bash bootstrap-v98/v97-run-patched-v98.sh >evidence/v98-v97-v95-first-false-execution-receipt-binding/preserved-v97-child.stdout 2>evidence/v98-v97-v95-first-false-execution-receipt-binding/preserved-v97-child.stderr\\n"\n'
          new_line='exec_old="GITHUB_SHA=ae069a42089c2e83181d4d17b8b7eea999501306 bash bootstrap-v98/v97-run-patched-v98.sh >evidence/v98-v95-execution-receipt-binding/preserved-v97-child.stdout 2>evidence/v98-v95-execution-receipt-binding/preserved-v97-child.stderr\\n"\n'
          if len(old_line.encode())!=282 or H(old_line.encode())!=OLDH or len(new_line.encode())!=250 or H(new_line.encode())!=NEWH: raise SystemExit('V107_BIND_FAIL frozen line identity')
          c=J('fetched-v107/coordinator.json')
          if c.get('id')!=AUTH or c.get('user',{}).get('login')!='search-maker': raise SystemExit('V107_BIND_FAIL coordinator identity')
          body=c.get('body','')
          for x in ['COORDINATOR::LOWALT_V107_V106_V100_V98_EXECUTION_EVIDENCE_PATH_REPRESENTATION_SUCCESSOR_AUTHORIZED__SCIENCE_PRODUCTION_FALSE','AUTHORIZED: exactly ONE fresh LowAlt PRE-RESULT V107 identity','V100_V98_EXECUTION_EVIDENCE_PATH_REPRESENTATION_GATE_PASS','No V108 absent later direct Coordinator transition.',BEFORE,V98,OLDH,NEWH,AFTER,DSH]:
              if x not in body: raise SystemExit('V107_BIND_FAIL authority '+x)
          wf=J('fetched-v107/v106-workflow.json'); src=base64.b64decode(wf['content'])
          if wf.get('sha')!=B106 or G(src)!=B106: raise SystemExit('V107_BIND_FAIL V106 workflow')
          r,j,a=J('fetched-v107/v106-run.json'),J('fetched-v107/v106-job.json'),J('fetched-v107/v106-artifact.json')
          if r.get('id')!=R106 or r.get('run_attempt')!=1 or r.get('conclusion')!='failure' or r.get('head_sha')!=H106 or (r.get('head_commit') or {}).get('tree_id')!=T106: raise SystemExit('V107_BIND_FAIL V106 run')
          if j.get('id')!=J106 or j.get('run_id')!=R106 or j.get('run_attempt')!=1 or j.get('conclusion')!='failure': raise SystemExit('V107_BIND_FAIL V106 job')
          if a.get('id')!=A106 or a.get('digest')!=AD106 or a.get('size_in_bytes')!=AZ106 or a.get('expired') is not False: raise SystemExit('V107_BIND_FAIL V106 artifact')
          m,comp=J('fetched-v107/main.json'),J('fetched-v107/compare.json'); fs=comp.get('files') or []
          if m.get('commit',{}).get('sha')!=MAIN or comp.get('base_commit',{}).get('sha')!=MAIN or len(fs)!=1 or fs[0].get('filename')!='.github/workflows/lowalt-lt5-p-worker-module-v107.yml' or fs[0].get('status')!='added': raise SystemExit('V107_BIND_FAIL branch scope '+repr([(q.get('filename'),q.get('status')) for q in fs]))
          log=Path('fetched-v107/v106-job.log').read_text(errors='strict').splitlines(); ex=lambda t:[q for q in log if 'Z ' in q and q.split('Z ',1)[1]==t]
          for t in ['V100_NESTED_HOOK_CANONICAL_REPR_SERIALIZATION_GATE_PASS','V106_PRESERVED_V99_FIRST_FALSE rc=1','V100_NEST_PATCH_FAIL V98 anchors']:
              if len(ex(t))!=1: raise SystemExit('V107_BIND_FAIL V106 executed receipt '+t+' '+repr(ex(t)))
          with zipfile.ZipFile('fetched-v107/v106.zip') as z:
              names=z.namelist(); cn='bootstrap-v106/v99-run-hook-repr-v106.sh'; vn='bootstrap-v99/v98-run-patched-v99.sh'; gn='evidence/v106-v100-nested-hook-canonical-repr/gate-receipt.json'; en='evidence/v106-v100-nested-hook-canonical-repr/preserved-v99-child.stderr'; xn='evidence/v106-v100-nested-hook-canonical-repr/preserved-v99-child.exit-code.txt'
              if len(names)!=len(set(names)) or any(names.count(q)!=1 for q in [cn,vn,gn,en,xn]): raise SystemExit('V107_BIND_FAIL V106 members')
              child,v98,grec,err,rc=(z.read(q) for q in [cn,vn,gn,en,xn])
          if H(child)!=BEFORE or H(v98)!=V98 or H(grec)!=GRE or H(err)!=ERR or err!=b'V100_NEST_PATCH_FAIL V98 anchors\n' or rc!=b'1\n': raise SystemExit('V107_BIND_FAIL evidence identity')
          g=json.loads(grec)
          if g.get('status')!='V100_NESTED_HOOK_CANONICAL_REPR_SERIALIZATION_GATE_PASS' or g.get('after_child_sha256')!=BEFORE or g.get('b_selected') is not False or g.get('b_resolved') is not False: raise SystemExit('V107_BIND_FAIL gate receipt')
          text=child.decode(); v98t=v98.decode()
          if text.count(old_line)!=1 or text.count(new_line)!=0: raise SystemExit('V107_BIND_FAIL patch precondition '+repr((text.count(old_line),text.count(new_line))))
          anchor='bash -n bootstrap-v98/v97-run-patched-v98.sh\n'
          actual='GITHUB_SHA=ae069a42089c2e83181d4d17b8b7eea999501306 bash bootstrap-v98/v97-run-patched-v98.sh >evidence/v98-v95-execution-receipt-binding/preserved-v97-child.stdout 2>evidence/v98-v95-execution-receipt-binding/preserved-v97-child.stderr\n'
          if v98t.count(anchor)!=1 or v98t.count(actual)!=1: raise SystemExit('V107_BIND_FAIL immutable V98 anchors '+repr((v98t.count(anchor),v98t.count(actual))))
          patched=text.replace(old_line,new_line,1).encode()
          if patched.decode().replace(new_line,old_line,1).encode()!=child or H(patched)!=AFTER: raise SystemExit('V107_PATCH_FAIL inverse/sha '+H(patched))
          ps=patched.decode().splitlines(keepends=True); starts=[i for i,q in enumerate(ps) if q=="python3 - <<'PY_V100_NEST'\n"]; ends=[i for i,q in enumerate(ps) if q=='PY_V100_NEST\n']
          if len(starts)!=1 or len(ends)!=1 or not starts[0]<ends[0]: raise SystemExit('V107_BIND_FAIL nested heredoc')
          mod=ast.parse(''.join(ps[starts[0]+1:ends[0]])); execval=None
          for n in ast.walk(mod):
              if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='exec_old' for t in n.targets): execval=ast.literal_eval(n.value); break
          if execval!=actual: raise SystemExit('V107_BIND_FAIL runtime value mismatch '+repr(execval))
          d=''.join(difflib.unified_diff(text.splitlines(True),patched.decode().splitlines(True),fromfile='v106-hook-repr-v99-run.sh',tofile='v107-v98-exec-path-v99-run.sh',n=3)).encode()
          if H(d)!=DSH: raise SystemExit('V107_PATCH_FAIL diff sha '+H(d))
          changed=[q for q in d.decode().splitlines() if (q.startswith('+') or q.startswith('-')) and not q.startswith('+++') and not q.startswith('---')]
          if changed!=['-'+old_line.rstrip('\n'),'+'+new_line.rstrip('\n')]: raise SystemExit('V107_PATCH_FAIL extra diff '+repr(changed))
          Path('bootstrap-v107/v99-run-v98-exec-path-v107.sh').write_bytes(patched); Path(O/'v106-to-v107.diff').write_bytes(d)
          rec={'schema':1,'status':'V100_V98_EXECUTION_EVIDENCE_PATH_REPRESENTATION_GATE_PASS','authority_comment':AUTH,'v106_head':H106,'v106_run':R106,'v106_job':J106,'v106_artifact':A106,'before_child_sha256':BEFORE,'immutable_v98_sha256':V98,'old_assignment_sha256':OLDH,'new_assignment_sha256':NEWH,'after_child_sha256':AFTER,'patch_diff_sha256':DSH,'runtime_exec_value_matches_immutable_v98':True,'immutable_v98_anchor_count':1,'immutable_v98_exec_count':1,'inverse_reconstruction':True,'scientific_script_mutation':False,'source_defined_transport_mutation':False,'b_selected':False,'b_resolved':False}
          Path(O/'gate-receipt.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n'); Path(O/'V100_V98_EXECUTION_EVIDENCE_PATH_REPRESENTATION_GATE_PASS').write_text('PASS exact V100 V98 execution-evidence path representation repair only\n')
          PY
          bash -n bootstrap-v107/v99-run-v98-exec-path-v107.sh
          echo V100_V98_EXECUTION_EVIDENCE_PATH_REPRESENTATION_GATE_PASS
          set +e
          GITHUB_SHA=73f87a34c7f4c933ff78f014c749c71d576e1bc9 bash bootstrap-v107/v99-run-v98-exec-path-v107.sh >evidence/v107-v100-v98-execution-path-representation/preserved-v99-child.stdout 2>evidence/v107-v100-v98-execution-path-representation/preserved-v99-child.stderr
          RC=$?
          set -e
          printf '%s\n' "$RC" > evidence/v107-v100-v98-execution-path-representation/preserved-v99-child.exit-code.txt
          if [ "$RC" -ne 0 ]; then echo "V107_PRESERVED_V99_FIRST_FALSE rc=$RC" >&2; tail -n 7000 evidence/v107-v100-v98-execution-path-representation/preserved-v99-child.stderr >&2 || true; exit "$RC"; fi
          echo V107_PRESERVED_CHAIN_COMPLETED_PRE_RESULT
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-worker-module-v107-evidence
          if-no-files-found: error
          retention-days: 90
          path: |
            fetched-v*/
            artifacts-v*/
            bootstrap-v*/
            evidence/
