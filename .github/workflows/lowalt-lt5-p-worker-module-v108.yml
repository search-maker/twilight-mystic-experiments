name: LowAlt LT5 P Worker Module V100 V98 Path Cardinality V108
on:
  push:
    branches: [review/lowalt-lt5-p-worker-module-v108-20260920]
    paths: [.github/workflows/lowalt-lt5-p-worker-module-v108.yml]
permissions:
  contents: read
  actions: read
  issues: read
jobs:
  v108:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p fetched-v108 bootstrap-v108 evidence/v108-v100-v98-corrected-path-cardinality
          R=https://api.github.com/repos/search-maker/twilight-mystic-experiments
          get(){ curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$1" -o "$2"; }
          get "$R/issues/comments/5750261403" fetched-v108/coordinator.json
          get "$R/contents/.github/workflows/lowalt-lt5-p-worker-module-v107.yml?ref=100d66dbe1863966cc507b1a699e6837aeda743c" fetched-v108/v107-workflow.json
          get "$R/actions/runs/35514962504" fetched-v108/v107-run.json
          get "$R/actions/jobs/106089231795" fetched-v108/v107-job.json
          get "$R/actions/artifacts/10606701777" fetched-v108/v107-artifact.json
          get "$R/actions/jobs/106089231795/logs" fetched-v108/v107-job.log
          get "$R/actions/artifacts/10606701777/zip" fetched-v108/v107.zip
          get "$R/branches/main" fetched-v108/main.json
          get "$R/compare/6cd7c075766fe0c86bc7561ec205a3f9120fd1fb...${GITHUB_SHA}" fetched-v108/compare.json
          python3 - <<'PY'
          import ast,base64,difflib,hashlib,json,zipfile
          from pathlib import Path
          H=lambda b:hashlib.sha256(b).hexdigest()
          G=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          J=lambda p:json.loads(Path(p).read_text())
          O=Path('evidence/v108-v100-v98-corrected-path-cardinality')
          MAIN='6cd7c075766fe0c86bc7561ec205a3f9120fd1fb'; AUTH=5750261403
          H107='100d66dbe1863966cc507b1a699e6837aeda743c'; T107='b65ded337ecf0ee14cb5b401910c5cf8c2a1bd05'; B107='bbb28c13854bbca32ae89e53e3a725572c52d696'
          R107=35514962504; J107=106089231795; A107=10606701777; AD107='sha256:e5e4fbfca84a81f62a4b182290753960ce2284fd55326a652f0623a299f48d6f'; AZ107=309132768
          BEFORE='ef00c27388074eaa6a80b4c42d986658711dd680f5ad1b89629967ac1ddda81a'; V98='6dce0c9b9fbd72e4d3d2896788766514345acc52cd804121989a9066e785db8f'; GRE='2bc5a0bd3a7eb7b4a882e24ab12c5d5ab7442401509ce831f91e579f72ccef54'; ERR='68f2be10a934da78d2a320286c11efc948a0ef1e72ea59b3243b55f94caaf7d0'
          OLDH='8813ce9563742622d4da34a3d3be851b03b8bf93f48baf18fdf269cf443f47b5'; NEWH='84f6cd5d1b8f9e6d27eaec113925693fcbb83960c7298940e4c99c6f1e5d1bd9'; AFTER='c640be62b948ed5fd9a0bc2a70be48eac034b251dcfc047e0758c500bd13fd26'; DSH='8edb163443cc0d73a0c21ed1de0f01086b1f8e199231e622cfce96b67a2473a2'; V98GEN='ee1b77db9f0258307a9552bb1b6662757ce1e9d117070accdb97ef73eae3b42c'
          OLD="if s2.count('bootstrap-v98/v97-run-patched-v98-v100.sh')!=2: raise SystemExit('V100_NEST_PATCH_FAIL V98 corrected-path cardinality')\n"
          NEW=OLD.replace('!=2','!=3')
          if H(OLD.encode())!=OLDH or H(NEW.encode())!=NEWH: raise SystemExit('V108_BIND_FAIL frozen assertion identity')
          c=J('fetched-v108/coordinator.json')
          if c.get('id')!=AUTH or c.get('user',{}).get('login')!='search-maker': raise SystemExit('V108_BIND_FAIL coordinator identity')
          body=c.get('body','')
          for x in ['COORDINATOR::LOWALT_V108_V107_V100_V98_CORRECTED_PATH_CARDINALITY_SUCCESSOR_AUTHORIZED__SCIENCE_PRODUCTION_FALSE','AUTHORIZED: exactly ONE fresh LowAlt PRE-RESULT V108 identity','V100_V98_CORRECTED_PATH_CARDINALITY_GATE_PASS','No V109 absent later direct Coordinator transition.',BEFORE,V98,OLDH,NEWH,AFTER,DSH,V98GEN]:
              if x not in body: raise SystemExit('V108_BIND_FAIL authority '+x)
          wf=J('fetched-v108/v107-workflow.json'); src=base64.b64decode(wf['content'])
          if wf.get('sha')!=B107 or G(src)!=B107: raise SystemExit('V108_BIND_FAIL V107 workflow')
          r,j,a=J('fetched-v108/v107-run.json'),J('fetched-v108/v107-job.json'),J('fetched-v108/v107-artifact.json')
          if r.get('id')!=R107 or r.get('run_attempt')!=1 or r.get('conclusion')!='failure' or r.get('head_sha')!=H107 or (r.get('head_commit') or {}).get('tree_id')!=T107: raise SystemExit('V108_BIND_FAIL V107 run')
          if j.get('id')!=J107 or j.get('run_id')!=R107 or j.get('run_attempt')!=1 or j.get('conclusion')!='failure': raise SystemExit('V108_BIND_FAIL V107 job')
          if a.get('id')!=A107 or a.get('digest')!=AD107 or a.get('size_in_bytes')!=AZ107 or a.get('expired') is not False: raise SystemExit('V108_BIND_FAIL V107 artifact')
          m,comp=J('fetched-v108/main.json'),J('fetched-v108/compare.json'); fs=comp.get('files') or []
          if m.get('commit',{}).get('sha')!=MAIN or comp.get('base_commit',{}).get('sha')!=MAIN or len(fs)!=1 or fs[0].get('filename')!='.github/workflows/lowalt-lt5-p-worker-module-v108.yml' or fs[0].get('status')!='added': raise SystemExit('V108_BIND_FAIL branch scope '+repr([(q.get('filename'),q.get('status')) for q in fs]))
          log=Path('fetched-v108/v107-job.log').read_text(errors='strict').splitlines(); ex=lambda t:[q for q in log if 'Z ' in q and q.split('Z ',1)[1]==t]
          for t in ['V100_V98_EXECUTION_EVIDENCE_PATH_REPRESENTATION_GATE_PASS','V107_PRESERVED_V99_FIRST_FALSE rc=1','V100_NEST_PATCH_FAIL V98 corrected-path cardinality']:
              if len(ex(t))!=1: raise SystemExit('V108_BIND_FAIL V107 executed receipt '+t+' '+repr(ex(t)))
          with zipfile.ZipFile('fetched-v108/v107.zip') as z:
              names=z.namelist(); cn='bootstrap-v107/v99-run-v98-exec-path-v107.sh'; vn='bootstrap-v99/v98-run-patched-v99.sh'; gn='evidence/v107-v100-v98-execution-path-representation/gate-receipt.json'; en='evidence/v107-v100-v98-execution-path-representation/preserved-v99-child.stderr'; xn='evidence/v107-v100-v98-execution-path-representation/preserved-v99-child.exit-code.txt'
              if len(names)!=len(set(names)) or any(names.count(q)!=1 for q in [cn,vn,gn,en,xn]): raise SystemExit('V108_BIND_FAIL V107 members')
              child,v98,grec,err,rc=(z.read(q) for q in [cn,vn,gn,en,xn])
          if H(child)!=BEFORE or H(v98)!=V98 or H(grec)!=GRE or H(err)!=ERR or err!=b'V100_NEST_PATCH_FAIL V98 corrected-path cardinality\n' or rc!=b'1\n': raise SystemExit('V108_BIND_FAIL evidence identity')
          g=json.loads(grec)
          if g.get('status')!='V100_V98_EXECUTION_EVIDENCE_PATH_REPRESENTATION_GATE_PASS' or g.get('after_child_sha256')!=BEFORE or g.get('b_selected') is not False or g.get('b_resolved') is not False: raise SystemExit('V108_BIND_FAIL gate receipt')
          text=child.decode(); v98t=v98.decode()
          if text.count(OLD)!=1 or text.count(NEW)!=0: raise SystemExit('V108_BIND_FAIL patch precondition '+repr((text.count(OLD),text.count(NEW))))
          ps=text.splitlines(keepends=True); starts=[i for i,q in enumerate(ps) if q=="python3 - <<'PY_V100_NEST'\n"]; ends=[i for i,q in enumerate(ps) if q=='PY_V100_NEST\n']
          if len(starts)!=1 or len(ends)!=1 or not starts[0]<ends[0]: raise SystemExit('V108_BIND_FAIL nested heredoc')
          mod=ast.parse(''.join(ps[starts[0]+1:ends[0]])); vals={}
          for n in mod.body:
              if isinstance(n,ast.Assign) and len(n.targets)==1 and isinstance(n.targets[0],ast.Name) and n.targets[0].id in {'anchor','exec_old','hook'}: vals[n.targets[0].id]=ast.literal_eval(n.value)
          if set(vals)!={'anchor','exec_old','hook'}: raise SystemExit('V108_BIND_FAIL nested values')
          anchor,exec_old,hook=vals['anchor'],vals['exec_old'],vals['hook']; newpath='bootstrap-v98/v97-run-patched-v98-v100.sh'; oldpath='bootstrap-v98/v97-run-patched-v98.sh'
          if v98t.count(anchor)!=1 or v98t.count(exec_old)!=1 or hook.count(newpath)!=2: raise SystemExit('V108_BIND_FAIL occurrence inputs '+repr((v98t.count(anchor),v98t.count(exec_old),hook.count(newpath))))
          s2=v98t.replace(anchor,hook,1).replace(exec_old,exec_old.replace(oldpath,newpath),1)
          if s2.count(newpath)!=3 or s2.count(oldpath)!=2 or len(s2.encode())!=11209 or H(s2.encode())!=V98GEN: raise SystemExit('V108_BIND_FAIL deterministic child '+repr((s2.count(newpath),s2.count(oldpath),len(s2.encode()),H(s2.encode()))))
          patched=text.replace(OLD,NEW,1).encode()
          if patched.decode().replace(NEW,OLD,1).encode()!=child or H(patched)!=AFTER: raise SystemExit('V108_PATCH_FAIL inverse/sha '+H(patched))
          pps=patched.decode().splitlines(keepends=True); pst=pps.index("python3 - <<'PY_V100_NEST'\n"); pen=pps.index('PY_V100_NEST\n'); ast.parse(''.join(pps[pst+1:pen]))
          d=''.join(difflib.unified_diff(text.splitlines(True),patched.decode().splitlines(True),fromfile='v107-v98-exec-path-v99-run.sh',tofile='v108-v98-cardinality-v99-run.sh',n=3)).encode()
          if H(d)!=DSH: raise SystemExit('V108_PATCH_FAIL diff sha '+H(d))
          changed=[q for q in d.decode().splitlines() if (q.startswith('+') or q.startswith('-')) and not q.startswith('+++') and not q.startswith('---')]
          if changed!=['-'+OLD.rstrip('\n'),'+'+NEW.rstrip('\n')]: raise SystemExit('V108_PATCH_FAIL extra diff '+repr(changed))
          Path('bootstrap-v108/v99-run-v98-cardinality-v108.sh').write_bytes(patched); Path(O/'v107-to-v108.diff').write_bytes(d); Path(O/'deterministic-v98-child-preexecution.sh').write_text(s2)
          proof={'schema':1,'immutable_v98_anchor_count':v98t.count(anchor),'immutable_v98_exec_count':v98t.count(exec_old),'hook_corrected_path_count':hook.count(newpath),'outer_execution_substitution_count':1,'deterministic_corrected_path_count':s2.count(newpath),'deterministic_old_path_count':s2.count(oldpath),'deterministic_v98_child_size':len(s2.encode()),'deterministic_v98_child_sha256':V98GEN}
          Path(O/'occurrence-proof.json').write_text(json.dumps(proof,indent=2,sort_keys=True)+'\n')
          rec={'schema':1,'status':'V100_V98_CORRECTED_PATH_CARDINALITY_GATE_PASS','authority_comment':AUTH,'v107_head':H107,'v107_run':R107,'v107_job':J107,'v107_artifact':A107,'before_child_sha256':BEFORE,'immutable_v98_sha256':V98,'old_assertion_sha256':OLDH,'new_assertion_sha256':NEWH,'after_child_sha256':AFTER,'patch_diff_sha256':DSH,'deterministic_v98_child_sha256':V98GEN,'inverse_reconstruction':True,'scientific_script_mutation':False,'source_defined_transport_mutation':False,'b_selected':False,'b_resolved':False}
          Path(O/'gate-receipt.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n'); Path(O/'V100_V98_CORRECTED_PATH_CARDINALITY_GATE_PASS').write_text('PASS exact V100 V98 corrected-path cardinality assertion 2->3 only\n')
          PY
          bash -n bootstrap-v108/v99-run-v98-cardinality-v108.sh
          echo V100_V98_CORRECTED_PATH_CARDINALITY_GATE_PASS
          set +e
          GITHUB_SHA=73f87a34c7f4c933ff78f014c749c71d576e1bc9 bash bootstrap-v108/v99-run-v98-cardinality-v108.sh >evidence/v108-v100-v98-corrected-path-cardinality/preserved-v99-child.stdout 2>evidence/v108-v100-v98-corrected-path-cardinality/preserved-v99-child.stderr
          RC=$?
          set -e
          printf '%s\n' "$RC" > evidence/v108-v100-v98-corrected-path-cardinality/preserved-v99-child.exit-code.txt
          if [ "$RC" -ne 0 ]; then echo "V108_PRESERVED_V99_FIRST_FALSE rc=$RC" >&2; tail -n 7000 evidence/v108-v100-v98-corrected-path-cardinality/preserved-v99-child.stderr >&2 || true; exit "$RC"; fi
          echo V108_PRESERVED_CHAIN_COMPLETED_PRE_RESULT
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-worker-module-v108-evidence
          if-no-files-found: error
          retention-days: 90
          path: |
            fetched-v*/
            artifacts-v*/
            bootstrap-v*/
            evidence/
