name: LowAlt LT5 P Worker Module V71 Expected Diff Source Literal V110
on:
  push:
    branches: [review/lowalt-lt5-p-worker-module-v110-20260920]
    paths: [.github/workflows/lowalt-lt5-p-worker-module-v110.yml]
permissions:
  contents: read
  actions: read
  issues: read
jobs:
  v110:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HELPER_GZ_B64: ""
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p fetched-v110 artifacts-v110 bootstrap-v110 evidence/v110-v71-expected-diff-source-literal
          R=https://api.github.com/repos/search-maker/twilight-mystic-experiments
          get(){ curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$1" -o "$2"; }
          get "$R/issues/comments/5751194937" fetched-v110/coordinator-v110.json
          get "$R/contents/.github/workflows/lowalt-lt5-p-worker-module-v109.yml?ref=a93a93fe71f48014efe2f6c3017b344a7b3b5afd" fetched-v110/v109-workflow.json
          get "$R/actions/runs/35523498209" fetched-v110/v109-run.json
          get "$R/actions/jobs/106111539688" fetched-v110/v109-job.json
          get "$R/actions/artifacts/10609253110" fetched-v110/v109-artifact.json
          get "$R/actions/jobs/106111539688/logs" fetched-v110/v109-job.log
          get "$R/actions/artifacts/10609253110/zip" artifacts-v110/v109.zip
          get "$R/branches/main" fetched-v110/main.json
          get "$R/compare/6cd7c075766fe0c86bc7561ec205a3f9120fd1fb...${GITHUB_SHA}" fetched-v110/compare.json
          printf '%s' "$HELPER_GZ_B64" | base64 -d | gzip -dc > bootstrap-v110/patch-v71-expected.py
          python3 - <<'PY'
          import base64,hashlib,json,zipfile
          from pathlib import Path
          H=lambda b:hashlib.sha256(b).hexdigest()
          G=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          J=lambda p:json.loads(Path(p).read_text())
          MAIN='6cd7c075766fe0c86bc7561ec205a3f9120fd1fb'; COORD=5751194937
          H109='a93a93fe71f48014efe2f6c3017b344a7b3b5afd'; T109='617a0fb2218e1060e4fa2b648b2db5646be804c3'; B109='858d024ed6ea131e6352e7da8cb05484fa240738'
          R109=35523498209; J109=106111539688; A109=10609253110; AD109='sha256:c779010e48c8a8d10858335ba5a3f3c71fa6676705fd4b93c5672b3ce80d5dc3'; AZ109=492926001
          CHILD_BEFORE='b2ff31f3d3b2e2440a5ee8ffc92f43adf1c8de337963ca5d0a8448187383f0bf'; CHILD_AFTER='6467db98307d854075cc318da2da498dfd5a77b7a0f5bb368a972b59e421f2e0'
          HELPER='61b336c3f3a1e540645fdbcf691b00ee69e627358135b7ce8a0cda34b46b200d'; V109REC='f3bd2539940671a77c5b7789c7c98abd3aa108a3994783114ff699aaf0b14c39'
          ALIASREC='2a3ac54058bd2ca1b13de2f1c0b7c156a11db71187fa068841dac980f02b7b8b'; V71BLOB='ef860365834de63248a6c1f1c70bd77449477900'
          ANCHOR=b"PY_V79_ALIAS\nbash -n bootstrap/v71-run-patched-v72.sh\n"
          REPL=b"PY_V79_ALIAS\npython3 bootstrap-v110/patch-v71-expected.py\ntest -f evidence/v110-v71-expected-diff-source-literal/V71_EXPECTED_DIFF_SOURCE_LITERAL_REPRESENTATION_GATE_PASS\nbash -n bootstrap/v71-run-patched-v72.sh\n"
          if len(ANCHOR)!=54 or H(ANCHOR)!='63ec12b0cff52c02d113df4fe15aa2c818fb4e13b0f2e0936b1ea27254da0619': raise SystemExit('V110_BIND_FAIL anchor identity')
          if len(REPL)!=212 or H(REPL)!='ec29c8214cd793d1d1211764329df530adc276ea7eb877f75d4ab443d4d2764c': raise SystemExit('V110_BIND_FAIL replacement identity')
          hb=Path('bootstrap-v110/patch-v71-expected.py').read_bytes()
          if len(hb)!=6243 or H(hb)!=HELPER: raise SystemExit('V110_BIND_FAIL helper identity '+repr((len(hb),H(hb))))
          c=J('fetched-v110/coordinator-v110.json'); cb=c.get('body','')
          if c.get('id')!=COORD or c.get('user',{}).get('login')!='search-maker': raise SystemExit('V110_BIND_FAIL coordinator identity')
          for x in ['AUTHORIZED: exactly ONE fresh LowAlt PRE-RESULT V110',CHILD_BEFORE,CHILD_AFTER,HELPER,'ad3fcaa7c449555f830943541854880c0f35f4f95f05ce186e47567b4b5dde99','48cbfe83845948f96af967f7a8fee2aead99b06d00bcb35034d67e664662e4fb','No V111 absent later direct Coordinator transition']:
              if x not in cb: raise SystemExit('V110_BIND_FAIL coordinator '+x)
          wf=J('fetched-v110/v109-workflow.json'); src=base64.b64decode(wf['content'])
          if wf.get('sha')!=B109 or G(src)!=B109: raise SystemExit('V110_BIND_FAIL V109 workflow')
          r,j,a=J('fetched-v110/v109-run.json'),J('fetched-v110/v109-job.json'),J('fetched-v110/v109-artifact.json')
          if r.get('id')!=R109 or r.get('run_attempt')!=1 or r.get('conclusion')!='failure' or r.get('head_sha')!=H109 or (r.get('head_commit') or {}).get('tree_id')!=T109: raise SystemExit('V110_BIND_FAIL V109 run')
          if j.get('id')!=J109 or j.get('run_id')!=R109 or j.get('run_attempt')!=1 or j.get('conclusion')!='failure': raise SystemExit('V110_BIND_FAIL V109 job')
          if a.get('id')!=A109 or a.get('digest')!=AD109 or a.get('size_in_bytes')!=AZ109 or a.get('expired') is not False: raise SystemExit('V110_BIND_FAIL V109 artifact metadata')
          m,comp=J('fetched-v110/main.json'),J('fetched-v110/compare.json'); fs=comp.get('files') or []
          if m.get('commit',{}).get('sha')!=MAIN or comp.get('base_commit',{}).get('sha')!=MAIN or len(fs)!=1 or fs[0].get('filename')!='.github/workflows/lowalt-lt5-p-worker-module-v110.yml' or fs[0].get('status')!='added': raise SystemExit('V110_BIND_FAIL branch scope '+repr([(q.get('filename'),q.get('status')) for q in fs]))
          log=Path('fetched-v110/v109-job.log').read_text(errors='strict').splitlines(); ex=lambda t:[q for q in log if 'Z ' in q and q.split('Z ',1)[1]==t]
          for t in ['V109_DIFF_HEADER_REPRESENTATION_BINDING_GATE_PASS','V91_CORRECTED_VALUE_LITERAL_CARDINALITY_ASSERTION_GATE_PASS','V109_PRESERVED_V91_FIRST_FALSE rc=1','V71_PATCH_FAIL unexpected harness payload']:
              if len(ex(t))!=1: raise SystemExit('V110_BIND_FAIL V109 executed receipt '+t+' '+repr(ex(t)))
          zbytes=Path('artifacts-v110/v109.zip').read_bytes()
          if len(zbytes)!=AZ109 or H(zbytes)!=AD109.split(':',1)[1]: raise SystemExit('V110_BIND_FAIL V109 artifact transport '+repr((len(zbytes),H(zbytes))))
          with zipfile.ZipFile('artifacts-v110/v109.zip') as z:
              names=z.namelist()
              if len(names)!=len(set(names)): raise SystemExit('V110_BIND_FAIL duplicate artifact members')
              req=['bootstrap-v79/v72-run-patched-v79.sh','evidence/v109-v91-cardinality/gate-receipt.json','evidence/v109-v91-cardinality/V109_DIFF_HEADER_REPRESENTATION_BINDING_GATE_PASS','evidence/v109-v91-cardinality/V91_CORRECTED_VALUE_LITERAL_CARDINALITY_ASSERTION_GATE_PASS','evidence/v79-v71-corrected-sha-alias-binding/alias-binding-receipt.json','evidence/v79-v71-corrected-sha-alias-binding/V71_CORRECTED_SHA_ALIAS_BINDING_GATE_PASS','evidence/v72-authority-locus/AUTHORITY_LOCUS_GATE_PASS']
              if any(names.count(q)!=1 for q in req): raise SystemExit('V110_BIND_FAIL required member cardinality '+repr([(q,names.count(q)) for q in req]))
              child=z.read(req[0]); vr=z.read(req[1]); ar=z.read(req[4]); ag=z.read(req[5]); loc=z.read(req[6])
              v71=[q for q in names if q.endswith('/v71-workflow.json')]
              if not v71: raise SystemExit('V110_BIND_FAIL V71 workflow member missing')
              v71objs=[]
              for q in v71:
                  try: o=json.loads(z.read(q)); d=base64.b64decode(o.get('content',''))
                  except Exception: continue
                  if o.get('sha')==V71BLOB and G(d)==V71BLOB: v71objs.append(q)
              if len(v71objs)<1: raise SystemExit('V110_BIND_FAIL immutable V71 workflow blob')
          if len(child)!=23056 or H(child)!=CHILD_BEFORE: raise SystemExit('V110_BIND_FAIL deterministic child '+repr((len(child),H(child))))
          if H(vr)!=V109REC or H(ar)!=ALIASREC: raise SystemExit('V110_BIND_FAIL receipts')
          vrj=json.loads(vr); arj=json.loads(ar)
          if vrj.get('status')!='V109_DIFF_HEADER_REPRESENTATION_BINDING_GATE_PASS' or vrj.get('b_selected') is not False or vrj.get('b_resolved') is not False or vrj.get('diff_sha256')!='ef01e4de77da62d55809ed4405a7cd275291ed2667dbcdf050ed1a672ca0e07a' or vrj.get('diff_size')!=725: raise SystemExit('V110_BIND_FAIL V109 receipt semantics')
          if arj.get('status')!='PASS_PRE_RESULT_V79_V71_CORRECTED_SHA_ALIAS_BINDING_ONLY' or arj.get('after_sha256')!='ad3fcaa7c449555f830943541854880c0f35f4f95f05ce186e47567b4b5dde99' or arj.get('b_selected') is not False or arj.get('b_resolved') is not False: raise SystemExit('V110_BIND_FAIL alias receipt semantics')
          if b'V71_CORRECTED_SHA_ALIAS_BINDING_GATE_PASS' not in ag or b'AUTHORITY_LOCUS_GATE_PASS' not in loc: raise SystemExit('V110_BIND_FAIL inherited pass receipts')
          if child.count(ANCHOR)!=1 or child.count(REPL)!=0: raise SystemExit('V110_PATCH_FAIL child insertion precondition '+repr((child.count(ANCHOR),child.count(REPL))))
          after=child.replace(ANCHOR,REPL,1)
          if len(after)!=23214 or H(after)!=CHILD_AFTER or after.replace(REPL,ANCHOR,1)!=child: raise SystemExit('V110_PATCH_FAIL child insertion identity '+repr((len(after),H(after))))
          import difflib
          ds=''.join(difflib.unified_diff(child.decode().splitlines(True),after.decode().splitlines(True),fromfile='bootstrap-v79/v72-run-patched-v79.sh',tofile='bootstrap-v110/v72-run-v71-expected-v110.sh',n=3)).encode()
          if len(ds)!=661 or H(ds)!='e2de05dc31b94125cf6d03d15063e2eb25d5ca82abfbeb70ca1d0098a05a9862': raise SystemExit('V110_PATCH_FAIL insertion diff '+repr((len(ds),H(ds))))
          changed=[q for q in ds.decode().splitlines() if (q.startswith('+') or q.startswith('-')) and not q.startswith('+++') and not q.startswith('---')]
          if changed!=['+python3 bootstrap-v110/patch-v71-expected.py','+test -f evidence/v110-v71-expected-diff-source-literal/V71_EXPECTED_DIFF_SOURCE_LITERAL_REPRESENTATION_GATE_PASS']: raise SystemExit('V110_PATCH_FAIL extra insertion payload '+repr(changed))
          Path('bootstrap-v110/v72-run-v71-expected-v110.sh').write_bytes(after)
          O=Path('evidence/v110-v71-expected-diff-source-literal')
          O.mkdir(parents=True,exist_ok=True); (O/'v79-child-insertion.diff').write_bytes(ds)
          rec={'schema':1,'status':'V110_CHILD_INSERTION_GATE_PASS','coordinator':COORD,'v109_head':H109,'v109_run':R109,'v109_job':J109,'v109_artifact':A109,'source_child_size':len(child),'source_child_sha256':H(child),'patched_child_size':len(after),'patched_child_sha256':H(after),'insertion_diff_size':len(ds),'insertion_diff_sha256':H(ds),'helper_size':len(hb),'helper_sha256':H(hb),'v109_gate_receipt_sha256':H(vr),'v79_alias_receipt_sha256':H(ar),'scientific_script_mutation':False,'source_defined_transport_mutation':False,'b_selected':False,'b_resolved':False}
          (O/'v110-child-insertion-receipt.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n')
          (O/'V110_CHILD_INSERTION_GATE_PASS').write_text('PASS exact V110 wrapper-only child insertion for V71 expected-diff source-literal repair\n')
          print('V110_CHILD_INSERTION_GATE_PASS')
          PY
          bash -n bootstrap-v110/patch-v71-expected.py
          bash -n bootstrap-v110/v72-run-v71-expected-v110.sh
          test -f evidence/v110-v71-expected-diff-source-literal/V110_CHILD_INSERTION_GATE_PASS
          set +e
          GITHUB_SHA=a2babd4e981ae5f9433c57a318ed42b315db2edf bash bootstrap-v110/v72-run-v71-expected-v110.sh >evidence/v110-v71-expected-diff-source-literal/preserved-child.stdout 2>evidence/v110-v71-expected-diff-source-literal/preserved-child.stderr
          RC=$?
          set -e
          printf '%s\n' "$RC" > evidence/v110-v71-expected-diff-source-literal/preserved-child.exit-code.txt
          if [ "$RC" -ne 0 ]; then echo "V110_PRESERVED_V79_V72_FIRST_FALSE rc=$RC" >&2; tail -n 7000 evidence/v110-v71-expected-diff-source-literal/preserved-child.stderr >&2 || true; exit "$RC"; fi
          echo V110_PRESERVED_CHAIN_COMPLETED_PRE_RESULT
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-worker-module-v110-evidence
          if-no-files-found: error
          retention-days: 90
          path: |
            fetched-v*/
            artifacts-v*/
            bootstrap*/
            evidence/
