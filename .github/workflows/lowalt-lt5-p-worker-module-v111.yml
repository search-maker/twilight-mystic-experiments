name: LowAlt LT5 P Worker Module V109 Receipt Prefix V111
on:
  push:
    branches: [review/lowalt-lt5-p-worker-module-v111-20260920]
    paths: [.github/workflows/lowalt-lt5-p-worker-module-v111.yml]
permissions:
  contents: read
  actions: read
  issues: read
jobs:
  v111:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_B64: ""
          NEW_B64: ""
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p fetched-v111 artifacts-v111 bootstrap-v111 evidence/v111-v110-v109-receipt-prefix
          R=https://api.github.com/repos/search-maker/twilight-mystic-experiments
          get(){ curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$1" -o "$2"; }
          get "$R/issues/comments/5751243739" fetched-v111/coordinator-v111.json
          get "$R/contents/.github/workflows/lowalt-lt5-p-worker-module-v110.yml?ref=7692b6f45d9e2facf1d01bef0133b0a2a04ac6df" fetched-v111/v110-workflow.json
          get "$R/actions/runs/35524063768" fetched-v111/v110-run.json
          get "$R/actions/jobs/106113026775" fetched-v111/v110-job.json
          get "$R/actions/artifacts/10608829608" fetched-v111/v110-artifact.json
          get "$R/actions/jobs/106113026775/logs" fetched-v111/v110-job.log
          get "$R/actions/artifacts/10608829608/zip" artifacts-v111/v110.zip
          get "$R/branches/main" fetched-v111/main.json
          get "$R/compare/6cd7c075766fe0c86bc7561ec205a3f9120fd1fb...${GITHUB_SHA}" fetched-v111/compare.json
          python3 - <<'PY'
          import base64,difflib,gzip,hashlib,json,os,re,zipfile
          from pathlib import Path
          H=lambda b:hashlib.sha256(b).hexdigest()
          G=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          J=lambda p:json.loads(Path(p).read_text())
          MAIN='6cd7c075766fe0c86bc7561ec205a3f9120fd1fb'; COORD=5751243739
          H110='7692b6f45d9e2facf1d01bef0133b0a2a04ac6df'; T110='526b0c90a899ed5bcd5ef96378eb3e22920bd684'; B110='c64046620a48c6c0e3fac8f43fe40ec67c402e72'
          R110=35524063768; J110=106113026775; A110=10608829608; AD110='sha256:f7be51b393de83437889f9d5fd5b71c1396598d39ab4687f0979a13e828b98fa'; AZ110=493090860
          LOG109_SIZE=33703; LOG109_SHA='5cfec88bea58fb2f11e57794a3a2a5c180756979618f34042995ef75091efb98'
          RUN_BEFORE_SIZE=10807; RUN_BEFORE_SHA='40b0daf8555d34e56afc73c98be4b6fbb90e42f01cfc90a0632149446379a3a6'
          RUN_AFTER_SIZE=11245; RUN_AFTER_SHA='b6df754a71d942e97e797c8206296c6abf67389afae7119a688b88482953dd3d'
          DIFF_SIZE=1930; DIFF_SHA='052f393abef0beead230e7b2bcba5b60b997a3ecbdde7357b56ae5d0e68db18d'
          OLD=base64.b64decode(os.environ['OLD_B64']); NEW=base64.b64decode(os.environ['NEW_B64'])
          if len(OLD)!=453 or H(OLD)!='131ebcacb9530716c1e5103fdfd19049f3330d3e108f9d70a7bb81d6f91c7cee': raise SystemExit('V111_BIND_FAIL old block identity')
          if len(NEW)!=891 or H(NEW)!='81d3af31515e4e431f585883185f611158476f590f6accad6981fbaf072f7e84': raise SystemExit('V111_BIND_FAIL new block identity')
          c=J('fetched-v111/coordinator-v111.json'); cb=c.get('body','')
          if c.get('id')!=COORD or c.get('user',{}).get('login')!='search-maker': raise SystemExit('V111_BIND_FAIL coordinator identity')
          for x in ['AUTHORIZED: exactly ONE fresh LowAlt PRE-RESULT V111',RUN_BEFORE_SHA,RUN_AFTER_SHA,DIFF_SHA,LOG109_SHA,'1d50b44f5673f5aa2ed96b1f9ef8007350c35bfdad10aa3b3e74ffa79d9f1db8','No V112 absent later direct Coordinator transition']:
              if x not in cb: raise SystemExit('V111_BIND_FAIL coordinator '+x)
          wf=J('fetched-v111/v110-workflow.json'); src=base64.b64decode(wf['content'])
          if wf.get('sha')!=B110 or G(src)!=B110: raise SystemExit('V111_BIND_FAIL V110 workflow')
          r,j,a=J('fetched-v111/v110-run.json'),J('fetched-v111/v110-job.json'),J('fetched-v111/v110-artifact.json')
          if r.get('id')!=R110 or r.get('run_attempt')!=1 or r.get('status')!='completed' or r.get('conclusion')!='failure' or r.get('head_sha')!=H110 or (r.get('head_commit') or {}).get('tree_id')!=T110: raise SystemExit('V111_BIND_FAIL V110 run')
          if j.get('id')!=J110 or j.get('run_id')!=R110 or j.get('run_attempt')!=1 or j.get('status')!='completed' or j.get('conclusion')!='failure': raise SystemExit('V111_BIND_FAIL V110 job')
          if a.get('id')!=A110 or a.get('digest')!=AD110 or a.get('size_in_bytes')!=AZ110 or a.get('expired') is not False: raise SystemExit('V111_BIND_FAIL V110 artifact metadata')
          m,comp=J('fetched-v111/main.json'),J('fetched-v111/compare.json'); fs=comp.get('files') or []
          if m.get('commit',{}).get('sha')!=MAIN or comp.get('base_commit',{}).get('sha')!=MAIN or len(fs)!=1 or fs[0].get('filename')!='.github/workflows/lowalt-lt5-p-worker-module-v111.yml' or fs[0].get('status')!='added': raise SystemExit('V111_BIND_FAIL branch scope '+repr([(q.get('filename'),q.get('status')) for q in fs]))
          vlog=Path('fetched-v111/v110-job.log').read_text(errors='strict').splitlines(); post=[q.split('Z ',1)[1] for q in vlog if 'Z ' in q]
          ff='V110_BIND_FAIL V109 executed receipt V71_PATCH_FAIL unexpected harness payload []'
          if post.count(ff)!=1: raise SystemExit('V111_BIND_FAIL V110 exact first false '+repr(post.count(ff)))
          if any(q=='V110_CHILD_INSERTION_GATE_PASS' for q in post): raise SystemExit('V111_BIND_FAIL V110 advanced beyond first gate')
          zbytes=Path('artifacts-v111/v110.zip').read_bytes()
          if len(zbytes)!=AZ110 or H(zbytes)!=AD110.split(':',1)[1]: raise SystemExit('V111_BIND_FAIL V110 artifact transport '+repr((len(zbytes),H(zbytes))))
          with zipfile.ZipFile('artifacts-v111/v110.zip') as z:
              names=z.namelist()
              if len(names)!=len(set(names)): raise SystemExit('V111_BIND_FAIL duplicate V110 artifact members')
              p='fetched-v110/v109-job.log'
              if names.count(p)!=1: raise SystemExit('V111_BIND_FAIL V109 log member cardinality '+str(names.count(p)))
              log109=z.read(p)
          if len(log109)!=LOG109_SIZE or H(log109)!=LOG109_SHA: raise SystemExit('V111_BIND_FAIL V109 log member identity '+repr((len(log109),H(log109))))
          l109=log109.decode('utf-8-sig').splitlines(); post109=[q.split('Z ',1)[1] for q in l109 if 'Z ' in q]
          for t in ['V109_DIFF_HEADER_REPRESENTATION_BINDING_GATE_PASS','V91_CORRECTED_VALUE_LITERAL_CARDINALITY_ASSERTION_GATE_PASS','V109_PRESERVED_V91_FIRST_FALSE rc=1','V72_PRESERVED_V71_FIRST_FALSE rc=1']:
              if post109.count(t)!=1: raise SystemExit('V111_BIND_FAIL V109 exact receipt '+t+' '+repr(post109.count(t)))
          marker='V71_PATCH_FAIL unexpected harness payload '
          vp=[q for q in post109 if q.startswith(marker)]
          if len(vp)!=1 or len((vp[0]+'\n').encode())!=1679 or H((vp[0]+'\n').encode())!='1d50b44f5673f5aa2ed96b1f9ef8007350c35bfdad10aa3b3e74ffa79d9f1db8': raise SystemExit('V111_BIND_FAIL V109 V71 payload receipt '+repr((len(vp),[(len((x+'\n').encode()),H((x+'\n').encode())) for x in vp])))
          text=src.decode(); markerline='        run: |\n'; lines=text.splitlines(keepends=True); mids=[i for i,q in enumerate(lines) if q==markerline]
          if len(mids)!=1: raise SystemExit('V111_BIND_FAIL V110 run marker '+repr(mids))
          out=[]
          for q in lines[mids[0]+1:]:
              if q.startswith('          '): out.append(q[10:])
              elif q=='\n': out.append(q)
              else: break
          run=''.join(out).encode()
          if len(run)!=RUN_BEFORE_SIZE or H(run)!=RUN_BEFORE_SHA: raise SystemExit('V111_BIND_FAIL V110 extracted run '+repr((len(run),H(run))))
          if run.count(OLD)!=1 or run.count(NEW)!=0: raise SystemExit('V111_PATCH_FAIL block precondition '+repr((run.count(OLD),run.count(NEW))))
          patched=run.replace(OLD,NEW,1)
          if len(patched)!=RUN_AFTER_SIZE or H(patched)!=RUN_AFTER_SHA or patched.replace(NEW,OLD,1)!=run: raise SystemExit('V111_PATCH_FAIL run identity/inverse '+repr((len(patched),H(patched))))
          d=''.join(difflib.unified_diff(run.decode().splitlines(True),patched.decode().splitlines(True),fromfile='v110-run.sh',tofile='v111-run.sh',n=3)).encode()
          if len(d)!=DIFF_SIZE or H(d)!=DIFF_SHA: raise SystemExit('V111_PATCH_FAIL diff identity '+repr((len(d),H(d))))
          helper=[q for q in text.splitlines() if q.startswith('          HELPER_GZ_B64: "')]
          if len(helper)!=1 or not helper[0].endswith('"'): raise SystemExit('V111_BIND_FAIL helper env cardinality')
          hb64=helper[0].split('"',1)[1][:-1]
          try: helperbytes=gzip.decompress(base64.b64decode(hb64))
          except Exception as e: raise SystemExit('V111_BIND_FAIL helper decode '+repr(e))
          if len(helperbytes)!=6243 or H(helperbytes)!='61b336c3f3a1e540645fdbcf691b00ee69e627358135b7ce8a0cda34b46b200d': raise SystemExit('V111_BIND_FAIL helper exact bytes '+repr((len(helperbytes),H(helperbytes))))
          Path('bootstrap-v111/v110-run-patched-v111.sh').write_bytes(patched)
          Path('bootstrap-v111/helper.b64').write_text(hb64)
          O=Path('evidence/v111-v110-v109-receipt-prefix'); O.mkdir(parents=True,exist_ok=True)
          (O/'v110-to-v111-run.diff').write_bytes(d)
          rec={'schema':1,'status':'V110_V109_FIRST_FALSE_EXECUTION_RECEIPT_REPRESENTATION_GATE_PASS','coordinator':COORD,'v110_head':H110,'v110_run':R110,'v110_job':J110,'v110_artifact':A110,'v110_artifact_digest':AD110,'v109_log_member_size':len(log109),'v109_log_member_sha256':H(log109),'v109_v71_payload_receipt_size':len((vp[0]+'\n').encode()),'v109_v71_payload_receipt_sha256':H((vp[0]+'\n').encode()),'before_run_size':len(run),'before_run_sha256':H(run),'old_block_size':len(OLD),'old_block_sha256':H(OLD),'new_block_size':len(NEW),'new_block_sha256':H(NEW),'after_run_size':len(patched),'after_run_sha256':H(patched),'inverse_reconstruction':True,'diff_size':len(d),'diff_sha256':H(d),'helper_size':len(helperbytes),'helper_sha256':H(helperbytes),'scientific_script_mutation':False,'source_defined_transport_mutation':False,'b_selected':False,'b_resolved':False}
          (O/'gate-receipt.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n')
          (O/'V110_V109_FIRST_FALSE_EXECUTION_RECEIPT_REPRESENTATION_GATE_PASS').write_text('PASS exact V110 V109 first-false execution receipt prefix representation only\n')
          print('V110_V109_FIRST_FALSE_EXECUTION_RECEIPT_REPRESENTATION_GATE_PASS')
          PY
          bash -n bootstrap-v111/v110-run-patched-v111.sh
          test -f evidence/v111-v110-v109-receipt-prefix/V110_V109_FIRST_FALSE_EXECUTION_RECEIPT_REPRESENTATION_GATE_PASS
          export HELPER_GZ_B64="$(cat bootstrap-v111/helper.b64)"
          set +e
          GITHUB_SHA=7692b6f45d9e2facf1d01bef0133b0a2a04ac6df bash bootstrap-v111/v110-run-patched-v111.sh >evidence/v111-v110-v109-receipt-prefix/preserved-v110.stdout 2>evidence/v111-v110-v109-receipt-prefix/preserved-v110.stderr
          RC=$?
          set -e
          printf '%s\n' "$RC" > evidence/v111-v110-v109-receipt-prefix/preserved-v110.exit-code.txt
          if [ "$RC" -ne 0 ]; then echo "V111_PRESERVED_V110_FIRST_FALSE rc=$RC" >&2; tail -n 7000 evidence/v111-v110-v109-receipt-prefix/preserved-v110.stderr >&2 || true; exit "$RC"; fi
          echo V111_PRESERVED_CHAIN_COMPLETED_PRE_RESULT
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-worker-module-v111-evidence
          if-no-files-found: error
          retention-days: 90
          path: |
            fetched-v*/
            artifacts-v*/
            bootstrap*/
            evidence/
