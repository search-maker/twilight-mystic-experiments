              bp='bootstrap-v111/v110-run-patched-v111.sh'; rp='evidence/v111-v110-v109-receipt-prefix/gate-receipt.json'; mp='evidence/v111-v110-v109-receipt-prefix/V110_V109_FIRST_FALSE_EXECUTION_RECEIPT_REPRESENTATION_GATE_PASS'
              for p in [bp,rp,mp]:
