          if [ "$RC" -ne 0 ]; then echo "V112_PRESERVED_V110_FIRST_FALSE rc=$RC" >&2; tail -n 7000 evidence/v112-v110-inherited-pass-marker-content/preserved-v110.stderr >&2 || true; exit "$RC"; fi
          echo V112_PRESERVED_CHAIN_COMPLETED_PRE_RESULT
      - if: always()
