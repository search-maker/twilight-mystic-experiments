          OLD=base64.b64decode(os.environ['OLD_B64']); NEW=base64.b64decode(os.environ['NEW_B64'])
          ALIAS=base64.b64decode(os.environ['ALIAS_B64']); LOCUS=base64.b64decode(os.environ['LOCUS_B64'])
          if len(OLD)!=161 or H(OLD)!='192523e74a41325677b74d217602d34f786e07af047492fc083e36c84264aa46': raise SystemExit('V112_BIND_FAIL old line')
          if len(NEW)!=336 or H(NEW)!='cb6cc36782dec1b34c147d69fa311827006e01651fddd6a3f7c20d8c9992ac2f': raise SystemExit('V112_BIND_FAIL new line')
          if len(ALIAS)!=107 or H(ALIAS)!='6e10943a3bffdaf32e5ddeb0f9a2dcf6e235b59ebd2b4305d8bd817b62c65eed': raise SystemExit('V112_BIND_FAIL alias marker bytes')
          if len(LOCUS)!=144 or H(LOCUS)!='9a198b800cb4b2ce49a059740115caa59ced7e888d7e2ac5e4525ad479ee81cd': raise SystemExit('V112_BIND_FAIL locus marker bytes')
          c=J('fetched-v112/coordinator-v112.json'); cb=c.get('body','')
          if c.get('id')!=COORD or c.get('user',{}).get('login')!='search-maker': raise SystemExit('V112_BIND_FAIL coordinator identity')
          for x in ['AUTHORIZED: exactly ONE fresh LowAlt PRE-RESULT V112',BEFORE_SHA,'192523e74a41325677b74d217602d34f786e07af047492fc083e36c84264aa46','cb6cc36782dec1b34c147d69fa311827006e01651fddd6a3f7c20d8c9992ac2f',B79,B72,'No V113 absent later direct Coordinator transition']:
              if x not in cb: raise SystemExit('V112_BIND_FAIL coordinator '+x)
          def wf(path,blob):
              x=J(path); d=base64.b64decode(x['content'])
