              before=z.read(bp); rec=json.loads(z.read(rp)); mark=z.read(mp)
          if len(before)!=BEFORE_SIZE or H(before)!=BEFORE_SHA: raise SystemExit('V112_BIND_FAIL preserved V110 identity '+repr((len(before),H(before))))
          if rec.get('status')!='V110_V109_FIRST_FALSE_EXECUTION_RECEIPT_REPRESENTATION_GATE_PASS' or rec.get('b_selected') is not False or rec.get('b_resolved') is not False: raise SystemExit('V112_BIND_FAIL V111 gate receipt semantics')
          if b'PASS exact V110 V109 first-false execution receipt prefix representation only' not in mark: raise SystemExit('V112_BIND_FAIL V111 marker bytes')
          t79=s79.decode(); t72=s72.decode(); atext=ALIAS.decode().rstrip('\n'); ltext=LOCUS.decode().rstrip('\n')
          if t79.count("V71_CORRECTED_SHA_ALIAS_BINDING_GATE_PASS').write_text")!=1 or t79.count(atext)!=1: raise SystemExit('V112_BIND_FAIL V79 marker owner source')
          if t72.count("AUTHORITY_LOCUS_GATE_PASS').write_text")!=1 or t72.count(ltext)!=1: raise SystemExit('V112_BIND_FAIL V72 marker owner source')
          if before.count(OLD)!=1 or before.count(NEW)!=0: raise SystemExit('V112_PATCH_FAIL line precondition '+repr((before.count(OLD),before.count(NEW))))
          after=before.replace(OLD,NEW,1)
          if after.replace(NEW,OLD,1)!=before: raise SystemExit('V112_PATCH_FAIL inverse reconstruction')
          d=''.join(difflib.unified_diff(before.decode().splitlines(True),after.decode().splitlines(True),fromfile='bootstrap-v111/v110-run-patched-v111.sh',tofile='bootstrap-v112/v110-run-patched-v112.sh',n=3)).encode()
          changed=[q for q in d.decode().splitlines() if (q.startswith('+') or q.startswith('-')) and not q.startswith('+++') and not q.startswith('---')]
          if changed!=['-'+OLD.decode().rstrip('\n'),'+'+NEW.decode().rstrip('\n')]: raise SystemExit('V112_PATCH_FAIL diff payload '+repr(changed))
          Path('bootstrap-v112/v110-run-patched-v112.sh').write_bytes(after)
          Path('evidence/v112-v110-inherited-pass-marker-content/v111-to-v112.diff').write_bytes(d)
          v110text=s110.decode(); helper=[q for q in v110text.splitlines() if q.startswith('          HELPER_GZ_B64: "')]
          if len(helper)!=1 or not helper[0].endswith('"'): raise SystemExit('V112_BIND_FAIL helper env')
          hb64=helper[0].split('"',1)[1][:-1]
          try: hbytes=gzip.decompress(base64.b64decode(hb64))
          except Exception as e: raise SystemExit('V112_BIND_FAIL helper decode '+repr(e))
          if len(hbytes)!=6243 or H(hbytes)!='61b336c3f3a1e540645fdbcf691b00ee69e627358135b7ce8a0cda34b46b200d': raise SystemExit('V112_BIND_FAIL helper identity '+repr((len(hbytes),H(hbytes))))
          Path('bootstrap-v112/helper.b64').write_text(hb64)
          out={'schema':1,'status':'V110_INHERITED_PASS_MARKER_CONTENT_SOURCE_BINDING_GATE_PASS','coordinator':COORD,'v111_head':H111,'v111_run':R111,'v111_job':J111,'v111_artifact':A111,'before_size':len(before),'before_sha256':H(before),'old_line_size':len(OLD),'old_line_sha256':H(OLD),'new_line_size':len(NEW),'new_line_sha256':H(NEW),'after_size':len(after),'after_sha256':H(after),'diff_size':len(d),'diff_sha256':H(d),'alias_marker_size':len(ALIAS),'alias_marker_sha256':H(ALIAS),'locus_marker_size':len(LOCUS),'locus_marker_sha256':H(LOCUS),'v79_workflow_blob':B79,'v72_workflow_blob':B72,'inverse_reconstruction':True,'scientific_script_mutation':False,'source_defined_transport_mutation':False,'b_selected':False,'b_resolved':False}
          O=Path('evidence/v112-v110-inherited-pass-marker-content')
