          if a.get('id')!=A111 or a.get('digest')!=AD111 or a.get('size_in_bytes')!=AZ111 or a.get('expired') is not False: raise SystemExit('V112_BIND_FAIL V111 artifact metadata')
          m,comp=J('fetched-v112/main.json'),J('fetched-v112/compare.json'); fs=comp.get('files') or []
          if m.get('commit',{}).get('sha')!=MAIN or comp.get('base_commit',{}).get('sha')!=MAIN or len(fs)!=1 or fs[0].get('filename')!='.github/workflows/lowalt-lt5-p-worker-module-v112.yml' or fs[0].get('status')!='added': raise SystemExit('V112_BIND_FAIL branch scope')
          post=[q.split('Z ',1)[1] for q in Path('fetched-v112/v111-job.log').read_text(errors='strict').splitlines() if 'Z ' in q]
          for t in ['V110_V109_FIRST_FALSE_EXECUTION_RECEIPT_REPRESENTATION_GATE_PASS','V111_PRESERVED_V110_FIRST_FALSE rc=1','V110_BIND_FAIL inherited pass receipts']:
              if post.count(t)!=1: raise SystemExit('V112_BIND_FAIL V111 execution receipt '+t+' '+repr(post.count(t)))
          zbytes=Path('artifacts-v112/v111.zip').read_bytes()
          if len(zbytes)!=AZ111 or H(zbytes)!=AD111.split(':',1)[1]: raise SystemExit('V112_BIND_FAIL V111 artifact transport '+repr((len(zbytes),H(zbytes))))
          with zipfile.ZipFile('artifacts-v112/v111.zip') as z:
              names=z.namelist()
