          print('V110_INHERITED_PASS_MARKER_CONTENT_SOURCE_BINDING_GATE_PASS')
          print('V112_AFTER_RUN_SHA256='+H(after))
          print('V111_TO_V112_DIFF_SHA256='+H(d))
          PY
          bash -n bootstrap-v112/v110-run-patched-v112.sh
          test -f evidence/v112-v110-inherited-pass-marker-content/V110_INHERITED_PASS_MARKER_CONTENT_SOURCE_BINDING_GATE_PASS
          export HELPER_GZ_B64="$(cat bootstrap-v112/helper.b64)"
          set +e
          GITHUB_SHA=7692b6f45d9e2facf1d01bef0133b0a2a04ac6df bash bootstrap-v112/v110-run-patched-v112.sh >evidence/v112-v110-inherited-pass-marker-content/preserved-v110.stdout 2>evidence/v112-v110-inherited-pass-marker-content/preserved-v110.stderr
