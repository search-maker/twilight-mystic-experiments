          J=lambda p:json.loads(Path(p).read_text())
          MAIN='6cd7c075766fe0c86bc7561ec205a3f9120fd1fb'; COORD=5751325676
          H111='0626b40dacadfa05c41341cc7d34b42e772c2332'; T111='0af152b0e4fb3d8235029787b96bf27968c51000'; B111='f1ae9134dc0a5e7a0b5c16701611af11dd089325'
          R111=35524495078; J111=106114180676; A111=10608339295; AD111='sha256:00aa278e8fb05d9eedc980150327a5aa97b11b31d6fcdb3e3d8e8d577ffdf601'; AZ111=986380154
