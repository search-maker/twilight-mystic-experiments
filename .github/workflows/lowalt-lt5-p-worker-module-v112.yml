              return d
          s111=wf('fetched-v112/v111-workflow.json',B111); s110=wf('fetched-v112/v110-workflow.json',B110); s79=wf('fetched-v112/v79-workflow.json',B79); s72=wf('fetched-v112/v72-workflow.json',B72)
          r,j,a=J('fetched-v112/v111-run.json'),J('fetched-v112/v111-job.json'),J('fetched-v112/v111-artifact.json')
          if r.get('id')!=R111 or r.get('run_attempt')!=1 or r.get('status')!='completed' or r.get('conclusion')!='failure' or r.get('head_sha')!=H111 or (r.get('head_commit') or {}).get('tree_id')!=T111: raise SystemExit('V112_BIND_FAIL V111 run')
