name: LowAlt LT5 P Worker Module V110 Python Helper Preflight V113
on:
  push:
    branches: [review/lowalt-lt5-p-worker-module-v113-20260920]
    paths: [.github/workflows/lowalt-lt5-p-worker-module-v113.yml]
permissions:
  contents: read
  actions: read
  issues: read
jobs:
  v113:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_B64: "YmFzaCAtbiBib290c3RyYXAtdjExMC9wYXRjaC12NzEtZXhwZWN0ZWQucHkK"
          NEW_B64: "cHl0aG9uMyAtbSBweV9jb21waWxlIGJvb3RzdHJhcC12MTEwL3BhdGNoLXY3MS1leHBlY3RlZC5weQo="
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p fetched-v113 artifacts-v113 bootstrap-v113 evidence/v113-v110-python-helper-preflight
          R=https://api.github.com/repos/search-maker/twilight-mystic-experiments
          get(){ curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$1" -o "$2"; }
          get "$R/issues/comments/5751372645" fetched-v113/coordinator-v113.json
          get "$R/contents/.github/workflows/lowalt-lt5-p-worker-module-v112.yml?ref=c8153fa5659db71b24747b9f53713b88830bfaaa" fetched-v113/v112-workflow.json
          get "$R/actions/runs/35525273974" fetched-v113/v112-run.json
          get "$R/actions/jobs/106116216830" fetched-v113/v112-job.json
          get "$R/actions/artifacts/10610095196" fetched-v113/v112-artifact.json
          get "$R/actions/jobs/106116216830/logs" fetched-v113/v112-job.log
          get "$R/actions/artifacts/10610095196/zip" artifacts-v113/v112.zip
          get "$R/contents/.github/workflows/lowalt-lt5-p-worker-module-v110.yml?ref=7692b6f45d9e2facf1d01bef0133b0a2a04ac6df" fetched-v113/v110-workflow.json
          get "$R/branches/main" fetched-v113/main.json
          get "$R/compare/6cd7c075766fe0c86bc7561ec205a3f9120fd1fb...${GITHUB_SHA}" fetched-v113/compare.json
          python3 - <<'PY'
          import base64,difflib,gzip,hashlib,json,os,zipfile
          from pathlib import Path
          H=lambda b:hashlib.sha256(b).hexdigest()
          G=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          J=lambda p:json.loads(Path(p).read_text())
          MAIN='6cd7c075766fe0c86bc7561ec205a3f9120fd1fb'; COORD=5751372645
          H112='c8153fa5659db71b24747b9f53713b88830bfaaa'; T112='4c14fb1ce8a56200bd6a952bae6917e9e963b470'; B112='952545c917e5f6f1bbc1370adec8001d501ce5b6'
          R112=35525273974; J112=106116216830; A112=10610095196; AD112='sha256:22ea0555d477beab6f36f04782dfbf2875cbc2f62a573120d882e6ba6633b5d4'; AZ112=1479857646
          B110='c64046620a48c6c0e3fac8f43fe40ec67c402e72'; BEFORE_SHA='3d9f272456bf6d26bd8d0ca1dcbdf734de49127f20981518f09bee8676127074'
          OLD=base64.b64decode(os.environ['OLD_B64']); NEW=base64.b64decode(os.environ['NEW_B64'])
          if len(OLD)!=45 or H(OLD)!='8bb01a35fd2c3968605032d11a309a401db99c2beb869257bb1bee64bb15c905': raise SystemExit('V113_BIND_FAIL old line')
          if len(NEW)!=59 or H(NEW)!='d7a9cd9ae58336a0a57a6f87a8322ba72f7264cead560282a9b49c4644468be3': raise SystemExit('V113_BIND_FAIL new line')
          c=J('fetched-v113/coordinator-v113.json'); cb=c.get('body','')
          if c.get('id')!=COORD or c.get('user',{}).get('login')!='search-maker': raise SystemExit('V113_BIND_FAIL coordinator identity')
          for x in ['AUTHORIZED: exactly ONE fresh LowAlt PRE-RESULT V113',H112,BEFORE_SHA,'8bb01a35fd2c3968605032d11a309a401db99c2beb869257bb1bee64bb15c905','d7a9cd9ae58336a0a57a6f87a8322ba72f7264cead560282a9b49c4644468be3','No V114 absent later direct Coordinator transition']:
              if x not in cb: raise SystemExit('V113_BIND_FAIL coordinator '+x)
          def wf(path,blob):
              x=J(path); d=base64.b64decode(x['content'])
              if x.get('sha')!=blob or G(d)!=blob: raise SystemExit('V113_BIND_FAIL workflow '+path)
              return d
          s112=wf('fetched-v113/v112-workflow.json',B112); s110=wf('fetched-v113/v110-workflow.json',B110)
          r,j,a=J('fetched-v113/v112-run.json'),J('fetched-v113/v112-job.json'),J('fetched-v113/v112-artifact.json')
          if r.get('id')!=R112 or r.get('run_attempt')!=1 or r.get('status')!='completed' or r.get('conclusion')!='failure' or r.get('head_sha')!=H112 or (r.get('head_commit') or {}).get('tree_id')!=T112: raise SystemExit('V113_BIND_FAIL V112 run')
          if j.get('id')!=J112 or j.get('run_id')!=R112 or j.get('status')!='completed' or j.get('conclusion')!='failure': raise SystemExit('V113_BIND_FAIL V112 job')
          if a.get('id')!=A112 or a.get('digest')!=AD112 or a.get('size_in_bytes')!=AZ112 or a.get('expired') is not False: raise SystemExit('V113_BIND_FAIL V112 artifact metadata')
          m,comp=J('fetched-v113/main.json'),J('fetched-v113/compare.json'); fs=comp.get('files') or []
          if m.get('commit',{}).get('sha')!=MAIN or comp.get('base_commit',{}).get('sha')!=MAIN or len(fs)!=1 or fs[0].get('filename')!='.github/workflows/lowalt-lt5-p-worker-module-v113.yml' or fs[0].get('status')!='added': raise SystemExit('V113_BIND_FAIL branch scope')
          post=[q.split('Z ',1)[1] for q in Path('fetched-v113/v112-job.log').read_text(errors='strict').splitlines() if 'Z ' in q]
          for t in ['V110_INHERITED_PASS_MARKER_CONTENT_SOURCE_BINDING_GATE_PASS','V112_PRESERVED_V110_FIRST_FALSE rc=2']:
              if post.count(t)!=1: raise SystemExit('V113_BIND_FAIL V112 execution receipt '+t+' '+repr(post.count(t)))
          errs=[q for q in post if q.startswith('bootstrap-v110/patch-v71-expected.py: line 3: syntax error near unexpected token')]
          if len(errs)!=1: raise SystemExit('V113_BIND_FAIL V112 exact first-false parser line '+repr(errs))
          zbytes=Path('artifacts-v113/v112.zip').read_bytes()
          if len(zbytes)!=AZ112 or H(zbytes)!=AD112.split(':',1)[1]: raise SystemExit('V113_BIND_FAIL V112 artifact transport '+repr((len(zbytes),H(zbytes))))
          with zipfile.ZipFile('artifacts-v113/v112.zip') as z:
              names=z.namelist()
              if len(names)!=len(set(names)): raise SystemExit('V113_BIND_FAIL duplicate artifact members')
              bp='bootstrap-v112/v110-run-patched-v112.sh'; hp='bootstrap-v112/helper.b64'; rp='evidence/v112-v110-inherited-pass-marker-content/gate-receipt.json'; mp='evidence/v112-v110-inherited-pass-marker-content/V110_INHERITED_PASS_MARKER_CONTENT_SOURCE_BINDING_GATE_PASS'
              for p in [bp,hp,rp,mp]:
                  if names.count(p)!=1: raise SystemExit('V113_BIND_FAIL member '+p+' '+str(names.count(p)))
              before=z.read(bp); hb64=z.read(hp); rec=json.loads(z.read(rp)); mark=z.read(mp)
          if H(before)!=BEFORE_SHA: raise SystemExit('V113_BIND_FAIL preserved V110 identity '+repr((len(before),H(before))))
          if rec.get('status')!='V110_INHERITED_PASS_MARKER_CONTENT_SOURCE_BINDING_GATE_PASS' or rec.get('after_sha256')!=BEFORE_SHA or rec.get('b_selected') is not False or rec.get('b_resolved') is not False: raise SystemExit('V113_BIND_FAIL V112 gate receipt semantics')
          if b'PASS exact inherited marker file bytes bind to immutable source-defined marker contents' not in mark: raise SystemExit('V113_BIND_FAIL V112 gate marker')
          try: hbytes=gzip.decompress(base64.b64decode(hb64))
          except Exception as e: raise SystemExit('V113_BIND_FAIL helper transport '+repr(e))
          if len(hbytes)!=6243 or H(hbytes)!='61b336c3f3a1e540645fdbcf691b00ee69e627358135b7ce8a0cda34b46b200d': raise SystemExit('V113_BIND_FAIL helper identity '+repr((len(hbytes),H(hbytes))))
          v110=s110.decode()
          if v110.count('bash -n bootstrap-v110/patch-v71-expected.py')!=1: raise SystemExit('V113_BIND_FAIL immutable V110 wrong preflight cardinality')
          if v110.count('+python3 bootstrap-v110/patch-v71-expected.py')!=1: raise SystemExit('V113_BIND_FAIL immutable V110 helper invocation cardinality')
          if v110.count("patch-v71-expected.py').write_bytes")!=1: raise SystemExit('V113_BIND_FAIL immutable V110 Python helper owner')
          if before.count(OLD)!=1 or before.count(NEW)!=0: raise SystemExit('V113_PATCH_FAIL precondition '+repr((before.count(OLD),before.count(NEW))))
          after=before.replace(OLD,NEW,1)
          if after.replace(NEW,OLD,1)!=before: raise SystemExit('V113_PATCH_FAIL inverse reconstruction')
          d=''.join(difflib.unified_diff(before.decode().splitlines(True),after.decode().splitlines(True),fromfile='bootstrap-v112/v110-run-patched-v112.sh',tofile='bootstrap-v113/v110-run-patched-v113.sh',n=3)).encode()
          changed=[q for q in d.decode().splitlines() if (q.startswith('+') or q.startswith('-')) and not q.startswith('+++') and not q.startswith('---')]
          if changed!=['-'+OLD.decode().rstrip('\n'),'+'+NEW.decode().rstrip('\n')]: raise SystemExit('V113_PATCH_FAIL diff payload '+repr(changed))
          Path('bootstrap-v113/v110-run-patched-v113.sh').write_bytes(after)
          Path('bootstrap-v113/helper.b64').write_bytes(hb64)
          O=Path('evidence/v113-v110-python-helper-preflight'); (O/'v112-to-v113.diff').write_bytes(d)
          out={'schema':1,'status':'V110_PYTHON_HELPER_SYNTAX_PREFLIGHT_INTERPRETER_GATE_PASS','coordinator':COORD,'v112_head':H112,'v112_run':R112,'v112_job':J112,'v112_artifact':A112,'before_size':len(before),'before_sha256':H(before),'old_line_size':len(OLD),'old_line_sha256':H(OLD),'new_line_size':len(NEW),'new_line_sha256':H(NEW),'after_size':len(after),'after_sha256':H(after),'diff_size':len(d),'diff_sha256':H(d),'helper_size':len(hbytes),'helper_sha256':H(hbytes),'inverse_reconstruction':True,'scientific_script_mutation':False,'source_defined_transport_mutation':False,'b_selected':False,'b_resolved':False}
          (O/'gate-receipt.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          (O/'V110_PYTHON_HELPER_SYNTAX_PREFLIGHT_INTERPRETER_GATE_PASS').write_text('PASS exact Python helper uses Python syntax preflight instead of shell parser\n')
          print('V110_PYTHON_HELPER_SYNTAX_PREFLIGHT_INTERPRETER_GATE_PASS')
          print('V113_AFTER_RUN_SIZE='+str(len(after)))
          print('V113_AFTER_RUN_SHA256='+H(after))
          print('V112_TO_V113_DIFF_SIZE='+str(len(d)))
          print('V112_TO_V113_DIFF_SHA256='+H(d))
          PY
          bash -n bootstrap-v113/v110-run-patched-v113.sh
          test -f evidence/v113-v110-python-helper-preflight/V110_PYTHON_HELPER_SYNTAX_PREFLIGHT_INTERPRETER_GATE_PASS
          export HELPER_GZ_B64="$(cat bootstrap-v113/helper.b64)"
          set +e
          GITHUB_SHA=7692b6f45d9e2facf1d01bef0133b0a2a04ac6df bash bootstrap-v113/v110-run-patched-v113.sh >evidence/v113-v110-python-helper-preflight/preserved-v110.stdout 2>evidence/v113-v110-python-helper-preflight/preserved-v110.stderr
          RC=$?
          set -e
          printf '%s\n' "$RC" > evidence/v113-v110-python-helper-preflight/preserved-v110.exit-code.txt
          if [ "$RC" -ne 0 ]; then echo "V113_PRESERVED_V110_FIRST_FALSE rc=$RC" >&2; tail -n 7000 evidence/v113-v110-python-helper-preflight/preserved-v110.stderr >&2 || true; exit "$RC"; fi
          echo V113_PRESERVED_CHAIN_COMPLETED_PRE_RESULT
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-worker-module-v113-evidence
          if-no-files-found: error
          retention-days: 90
          path: |
            fetched-v*/
            artifacts-v*/
            bootstrap*/
            evidence/
