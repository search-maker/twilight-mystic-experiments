name: LowAlt LT5 P Worker Module V113 Helper Owner Source Representation V114
on:
  push:
    branches: [review/lowalt-lt5-p-worker-module-v114-20260920]
    paths: [.github/workflows/lowalt-lt5-p-worker-module-v114.yml]
permissions:
  contents: read
  actions: read
  issues: read
jobs:
  v114:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER_OLD_B64: "aWYgdjExMC5jb3VudCgicGF0Y2gtdjcxLWV4cGVjdGVkLnB5Jykud3JpdGVfYnl0ZXMiKSE9MTogcmFpc2UgU3lzdGVtRXhpdCgnVjExM19CSU5EX0ZBSUwgaW1tdXRhYmxlIFYxMTAgUHl0aG9uIGhlbHBlciBvd25lcicpCg=="
          OWNER_NEW_B64: "aWYgdjExMC5jb3VudCgncHJpbnRmIFwnJXNcJyAiJEhFTFBFUl9HWl9CNjQiIHwgYmFzZTY0IC1kIHwgZ3ppcCAtZGMgPiBib290c3RyYXAtdjExMC9wYXRjaC12NzEtZXhwZWN0ZWQucHknKSE9MTogcmFpc2UgU3lzdGVtRXhpdCgnVjExM19CSU5EX0ZBSUwgaW1tdXRhYmxlIFYxMTAgUHl0aG9uIGhlbHBlciBvd25lcicpCg=="
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p fetched-v114 artifacts-v114 bootstrap-v114 evidence/v114-v113-helper-owner-source-representation
          R=https://api.github.com/repos/search-maker/twilight-mystic-experiments
          get(){ curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$1" -o "$2"; }
          get "$R/issues/comments/5751426444" fetched-v114/coordinator-v114.json
          get "$R/contents/.github/workflows/lowalt-lt5-p-worker-module-v113.yml?ref=6d7b65fff0f2d9b52f0d911bcd589a45eda34e34" fetched-v114/v113-workflow.json
          get "$R/actions/runs/35525741677" fetched-v114/v113-run.json
          get "$R/actions/jobs/106117455440" fetched-v114/v113-job.json
          get "$R/actions/artifacts/10609846562" fetched-v114/v113-artifact.json
          get "$R/actions/jobs/106117455440/logs" fetched-v114/v113-job.log
          get "$R/actions/artifacts/10609846562/zip" artifacts-v114/v113.zip
          get "$R/contents/.github/workflows/lowalt-lt5-p-worker-module-v110.yml?ref=7692b6f45d9e2facf1d01bef0133b0a2a04ac6df" fetched-v114/v110-workflow.json
          get "$R/branches/main" fetched-v114/main.json
          get "$R/compare/6cd7c075766fe0c86bc7561ec205a3f9120fd1fb...${GITHUB_SHA}" fetched-v114/compare.json
          python3 - <<'PY'
          import base64,difflib,hashlib,json,os
          from pathlib import Path
          H=lambda b:hashlib.sha256(b).hexdigest()
          G=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          J=lambda p:json.loads(Path(p).read_text())
          MAIN='6cd7c075766fe0c86bc7561ec205a3f9120fd1fb'; COORD=5751426444
          H113='6d7b65fff0f2d9b52f0d911bcd589a45eda34e34'; T113='02c3d4da530954c781299a4ab23b3d3e69a21718'; B113='4f04569e62d620d27a50453a4a8b9f0988391ed7'
          R113=35525741677; J113=106117455440; A113=10609846562; AD113='sha256:14a3137a298842337b494d568f43181aa37a6c9a5309e5e0274db701d558bc6c'; AZ113=1480351644
          B110='c64046620a48c6c0e3fac8f43fe40ec67c402e72'
          OLD=base64.b64decode(os.environ['OWNER_OLD_B64']); NEW=base64.b64decode(os.environ['OWNER_NEW_B64'])
          if len(OLD)!=127 or H(OLD)!='fc1b0f30e1ff2b51532a3c60b9300bf29b81137350c710de878a3b75fc797894': raise SystemExit('V114_BIND_FAIL old owner line')
          if len(NEW)!=184 or H(NEW)!='8ca039d091fdea274616f10ed9139cfc2463608840ac6ffff089c6f1aa710b9f': raise SystemExit('V114_BIND_FAIL new owner line')
          c=J('fetched-v114/coordinator-v114.json'); cb=c.get('body','')
          if c.get('id')!=COORD or c.get('user',{}).get('login')!='search-maker': raise SystemExit('V114_BIND_FAIL coordinator identity')
          for x in ['AUTHORIZED: exactly ONE fresh LowAlt PRE-RESULT V114',H113,B110,'fc1b0f30e1ff2b51532a3c60b9300bf29b81137350c710de878a3b75fc797894','8ca039d091fdea274616f10ed9139cfc2463608840ac6ffff089c6f1aa710b9f','No V115 absent later direct Coordinator transition']:
              if x not in cb: raise SystemExit('V114_BIND_FAIL coordinator '+x)
          def wf(path,blob):
              x=J(path); d=base64.b64decode(x['content'])
              if x.get('sha')!=blob or G(d)!=blob: raise SystemExit('V114_BIND_FAIL workflow '+path)
              return d
          s113=wf('fetched-v114/v113-workflow.json',B113); s110=wf('fetched-v114/v110-workflow.json',B110)
          r,j,a=J('fetched-v114/v113-run.json'),J('fetched-v114/v113-job.json'),J('fetched-v114/v113-artifact.json')
          if r.get('id')!=R113 or r.get('run_attempt')!=1 or r.get('status')!='completed' or r.get('conclusion')!='failure' or r.get('head_sha')!=H113 or (r.get('head_commit') or {}).get('tree_id')!=T113: raise SystemExit('V114_BIND_FAIL V113 run')
          if j.get('id')!=J113 or j.get('run_id')!=R113 or j.get('status')!='completed' or j.get('conclusion')!='failure': raise SystemExit('V114_BIND_FAIL V113 job')
          if a.get('id')!=A113 or a.get('digest')!=AD113 or a.get('size_in_bytes')!=AZ113 or a.get('expired') is not False: raise SystemExit('V114_BIND_FAIL V113 artifact metadata')
          m,comp=J('fetched-v114/main.json'),J('fetched-v114/compare.json'); fs=comp.get('files') or []
          if m.get('commit',{}).get('sha')!=MAIN or comp.get('base_commit',{}).get('sha')!=MAIN or len(fs)!=1 or fs[0].get('filename')!='.github/workflows/lowalt-lt5-p-worker-module-v114.yml' or fs[0].get('status')!='added': raise SystemExit('V114_BIND_FAIL branch scope '+repr([(q.get('filename'),q.get('status')) for q in fs]))
          logb=Path('fetched-v114/v113-job.log').read_bytes(); post=[]
          for q in logb.decode(errors='strict').splitlines():
              if 'Z ' in q: post.append(q.split('Z ',1)[1])
          if post.count('V113_BIND_FAIL immutable V110 Python helper owner')!=1: raise SystemExit('V114_BIND_FAIL V113 first false '+repr(post.count('V113_BIND_FAIL immutable V110 Python helper owner')))
          if post.count('V110_PYTHON_HELPER_SYNTAX_PREFLIGHT_INTERPRETER_GATE_PASS')!=0: raise SystemExit('V114_BIND_FAIL V113 pass marker executed')
          zbytes=Path('artifacts-v114/v113.zip').read_bytes()
          if len(zbytes)!=AZ113 or H(zbytes)!=AD113.split(':',1)[1]: raise SystemExit('V114_BIND_FAIL V113 artifact transport '+repr((len(zbytes),H(zbytes))))
          v110=s110.decode()
          owner='printf \'%s\' "$HELPER_GZ_B64" | base64 -d | gzip -dc > bootstrap-v110/patch-v71-expected.py'
          if v110.count(owner)!=1: raise SystemExit('V114_BIND_FAIL immutable V110 helper owner source '+repr(v110.count(owner)))
          if v110.count('+python3 bootstrap-v110/patch-v71-expected.py')!=1: raise SystemExit('V114_BIND_FAIL immutable V110 helper invocation '+repr(v110.count('+python3 bootstrap-v110/patch-v71-expected.py')))
          marker=b'        run: |\n'
          if s113.count(marker)!=1: raise SystemExit('V114_BIND_FAIL V113 run marker '+repr(s113.count(marker)))
          tail=s113.split(marker,1)[1]; end=b'      - if: always()\n'
          if tail.count(end)!=1: raise SystemExit('V114_BIND_FAIL V113 run end '+repr(tail.count(end)))
          block=tail.split(end,1)[0]; parts=[]
          for line in block.splitlines(True):
              if line.startswith(b'          '): parts.append(line[10:])
              elif line==b'\n': parts.append(line)
              else: raise SystemExit('V114_BIND_FAIL V113 block indentation '+repr(line[:40]))
          before=b''.join(parts)
          if before.count(OLD)!=1 or before.count(NEW)!=0: raise SystemExit('V114_PATCH_FAIL precondition '+repr((before.count(OLD),before.count(NEW))))
          after=before.replace(OLD,NEW,1)
          if after.replace(NEW,OLD,1)!=before: raise SystemExit('V114_PATCH_FAIL inverse reconstruction')
          d=''.join(difflib.unified_diff(before.decode().splitlines(True),after.decode().splitlines(True),fromfile='bootstrap-v114/v113-run-before-v114.sh',tofile='bootstrap-v114/v113-run-patched-v114.sh',n=3)).encode()
          changed=[q for q in d.decode().splitlines() if (q.startswith('+') or q.startswith('-')) and not q.startswith('+++') and not q.startswith('---')]
          if changed!=['-'+OLD.decode().rstrip('\n'),'+'+NEW.decode().rstrip('\n')]: raise SystemExit('V114_PATCH_FAIL diff payload '+repr(changed))
          Path('bootstrap-v114/v113-run-before-v114.sh').write_bytes(before)
          Path('bootstrap-v114/v113-run-patched-v114.sh').write_bytes(after)
          O=Path('evidence/v114-v113-helper-owner-source-representation'); (O/'v113-to-v114.diff').write_bytes(d)
          rec={'schema':1,'status':'V113_V110_HELPER_OWNER_SOURCE_REPRESENTATION_GATE_PASS','coordinator':COORD,'v113_head':H113,'v113_run':R113,'v113_job':J113,'v113_artifact':A113,'v113_workflow_blob':B113,'v110_workflow_blob':B110,'v113_job_log_size':len(logb),'v113_job_log_sha256':H(logb),'v113_artifact_zip_size':len(zbytes),'v113_artifact_zip_sha256':H(zbytes),'before_size':len(before),'before_sha256':H(before),'old_line_size':len(OLD),'old_line_sha256':H(OLD),'new_line_size':len(NEW),'new_line_sha256':H(NEW),'after_size':len(after),'after_sha256':H(after),'diff_size':len(d),'diff_sha256':H(d),'inverse_reconstruction':True,'scientific_script_mutation':False,'source_defined_transport_mutation':False,'b_selected':False,'b_resolved':False}
          (O/'gate-receipt.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n')
          (O/'V113_V110_HELPER_OWNER_SOURCE_REPRESENTATION_GATE_PASS').write_text('PASS exact immutable V110 helper owner binds to shell source representation; V113 interpreter repair semantics unchanged\n')
          print('V113_V110_HELPER_OWNER_SOURCE_REPRESENTATION_GATE_PASS')
          print('V114_BEFORE_RUN_SIZE='+str(len(before)))
          print('V114_BEFORE_RUN_SHA256='+H(before))
          print('V114_AFTER_RUN_SIZE='+str(len(after)))
          print('V114_AFTER_RUN_SHA256='+H(after))
          print('V113_TO_V114_DIFF_SIZE='+str(len(d)))
          print('V113_TO_V114_DIFF_SHA256='+H(d))
          PY
          bash -n bootstrap-v114/v113-run-patched-v114.sh
          test -f evidence/v114-v113-helper-owner-source-representation/V113_V110_HELPER_OWNER_SOURCE_REPRESENTATION_GATE_PASS
          set +e
          OLD_B64="YmFzaCAtbiBib290c3RyYXAtdjExMC9wYXRjaC12NzEtZXhwZWN0ZWQucHkK" NEW_B64="cHl0aG9uMyAtbSBweV9jb21waWxlIGJvb3RzdHJhcC12MTEwL3BhdGNoLXY3MS1leHBlY3RlZC5weQo=" GITHUB_SHA=6d7b65fff0f2d9b52f0d911bcd589a45eda34e34 bash bootstrap-v114/v113-run-patched-v114.sh >evidence/v114-v113-helper-owner-source-representation/preserved-v113.stdout 2>evidence/v114-v113-helper-owner-source-representation/preserved-v113.stderr
          RC=$?
          set -e
          printf '%s\n' "$RC" > evidence/v114-v113-helper-owner-source-representation/preserved-v113.exit-code.txt
          if [ "$RC" -ne 0 ]; then echo "V114_PRESERVED_V113_FIRST_FALSE rc=$RC" >&2; tail -n 7000 evidence/v114-v113-helper-owner-source-representation/preserved-v113.stderr >&2 || true; exit "$RC"; fi
          echo V114_PRESERVED_CHAIN_COMPLETED_PRE_RESULT
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-worker-module-v114-evidence
          if-no-files-found: error
          retention-days: 90
          path: |
            fetched-v*/
            artifacts-v*/
            bootstrap*/
            evidence/
