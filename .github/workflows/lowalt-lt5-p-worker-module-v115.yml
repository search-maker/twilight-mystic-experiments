name: LowAlt LT5 P Worker Module V63 V61 Source Representation V115

on:
  push:
    branches:
      - review/lowalt-lt5-p-worker-module-v115-20260920
    paths:
      - .github/workflows/lowalt-lt5-p-worker-module-v115.yml

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  v63-v61-source-representation:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Bind V61 runtime values to exact source definitions and execute corrected preserved V63 descendant
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p fetched-v115 artifacts-v115 bootstrap-v115 evidence/v115-v63-v61-source-representation
          R=https://api.github.com/repos/search-maker/twilight-mystic-experiments
          get(){ curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$1" -o "$2"; }

          get "$R/issues/comments/5751794031" fetched-v115/coordinator-v115.json
          get "$R/issues/comments/5751519834" fetched-v115/v114-checkpoint.json
          get "$R/contents/.github/workflows/lowalt-lt5-p-worker-module-v114.yml?ref=bda706bf6aa359c973e8ce62438e2fbe3b331c41" fetched-v115/v114-workflow.json
          get "$R/actions/runs/35526583749" fetched-v115/v114-run.json
          get "$R/actions/jobs/106119700786" fetched-v115/v114-job.json
          get "$R/actions/artifacts/10610326380" fetched-v115/v114-artifact.json
          get "$R/actions/jobs/106119700786/logs" fetched-v115/v114-job.log
          get "$R/actions/artifacts/10610326380/zip" artifacts-v115/v114.zip
          get "$R/contents/.github/workflows/lowalt-lt5-p-worker-module-v63.yml?ref=11e6acdf8a04bec0a4db7428c481f43c47e371ca" fetched-v115/v63-workflow.json
          get "$R/contents/.github/workflows/lowalt-lt5-p-worker-module-v61.yml?ref=bab8d462280edc68195ae2e6a3970512cf6413a8" fetched-v115/v61-workflow.json
          get "$R/contents/.github/workflows/lowalt-lt5-p-worker-module-v65.yml?ref=eba5f9422ee947b89625a45a2538eea4ae61f705" fetched-v115/v65-workflow.json
          get "$R/contents/.github/workflows/lowalt-lt5-p-worker-module-v66.yml?ref=6658bc086a81fca549f448d1e990ae406742df18" fetched-v115/v66-workflow.json
          get "$R/branches/main" fetched-v115/main.json
          get "$R/compare/6cd7c075766fe0c86bc7561ec205a3f9120fd1fb...${GITHUB_SHA}" fetched-v115/compare.json

          python3 - <<'PY_V115'
          import ast
          import base64
          import difflib
          import hashlib
          import json
          from pathlib import Path

          O=Path('evidence/v115-v63-v61-source-representation'); O.mkdir(parents=True,exist_ok=True)
          H=lambda b:hashlib.sha256(b).hexdigest()
          G=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          J=lambda p:json.loads(Path(p).read_text())

          MAIN='6cd7c075766fe0c86bc7561ec205a3f9120fd1fb'
          COORD=5751794031; CHECKPOINT=5751519834
          H114='bda706bf6aa359c973e8ce62438e2fbe3b331c41'; T114='698a79ffedb5565a5decaf01c1439ad708f68510'; B114='e19b0e1810cfa6e2bc4f3ede9e301ced9ecfd06c'
          R114=35526583749; J114=106119700786; A114=10610326380; AD114='sha256:ef61cfb738a6fd9d8f006ab90250ac8a26000f3621bef55ec857c8a435397404'; AZ114=3491970392
          B63='3a749f80cdfb1a9280fb2bee23d5a01956c38374'; B61='2bdff8b34c18ecade1b298dbff5e1d71ea33a2ee'
          B65='976e37d56ecf75e7db0b9bedb35d9eac19c0b859'; B66='7dcb67e4a7d1d9de3bc31e0d0ab31e1f71c62d94'
          V65_HEAD='eba5f9422ee947b89625a45a2538eea4ae61f705'
          OLD_SHA='e827a23b4fb05924810748778384862c69931aeb88a57407fb1ae2692f70ef20'
          NEW_SHA='e8271687adef6755d904b3663263837506fbcf74b2906ae470850b8eb994cd4b'
          HIST_TABLE='631b52bb8bd4f4f3c3d7cdf0a4ad23dab558c7c27649bb746a064fe59ff36f80'
          HIST_MANIFEST='fe48c37dea56b3c5b03b99237d6ea52337b4f92aafeac389b597aea08ce62bf6'
          CORR_TABLE='9d1f9817c71f9873052b1e0735de3285588d18a2789ee22b1addca9336078d3f'
          CORR_MANIFEST='c6be26dc8da045cb4199a1bf7b58a6eb0a4974c306e95b11a1fa58ca9f80ab89'

          def wf(path,blob):
              x=J(path); d=base64.b64decode(x['content'])
              if x.get('sha')!=blob or G(d)!=blob: raise SystemExit('V115_BIND_FAIL workflow '+path)
              return d

          def extract_run(source):
              lines=source.splitlines(keepends=True); marker=b'        run: |\n'
              if lines.count(marker)!=1: raise SystemExit('V115_BIND_FAIL run marker '+repr(lines.count(marker)))
              start=lines.index(marker)+1; out=[]; mapping=[]
              for idx in range(start,len(lines)):
                  line=lines[idx]
                  if line.strip() and not line.startswith(b'          '): break
                  removed=10 if line.startswith(b'          ') else 0
                  out.append(line[removed:]); mapping.append({'yaml_line_1_based':idx+1,'removed_prefix_spaces':removed})
              return b''.join(out),mapping

          coord=J('fetched-v115/coordinator-v115.json'); cp=J('fetched-v115/v114-checkpoint.json')
          if coord.get('id')!=COORD or coord.get('user',{}).get('login')!='search-maker': raise SystemExit('V115_BIND_FAIL coordinator identity')
          cb=coord.get('body','')
          for q in ['AUTHORIZED: exactly ONE fresh LowAlt PRE-RESULT V115',B61,B63,OLD_SHA,NEW_SHA,'V63_V61_RUNTIME_VALUE_SOURCE_REPRESENTATION_BINDING_GATE_PASS','No V116 absent a later direct Coordinator transition']:
              if q not in cb: raise SystemExit('V115_BIND_FAIL coordinator literal '+q)
          if cp.get('id')!=CHECKPOINT or cp.get('user',{}).get('login')!='search-maker' or 'V63_CHAIN_FAIL exact V61 source-defined SHA repair literals absent' not in cp.get('body',''):
              raise SystemExit('V115_BIND_FAIL V114 checkpoint')

          s114=wf('fetched-v115/v114-workflow.json',B114); s63=wf('fetched-v115/v63-workflow.json',B63); s61=wf('fetched-v115/v61-workflow.json',B61); s65=wf('fetched-v115/v65-workflow.json',B65); s66=wf('fetched-v115/v66-workflow.json',B66)
          r=J('fetched-v115/v114-run.json'); j=J('fetched-v115/v114-job.json'); a=J('fetched-v115/v114-artifact.json')
          if r.get('id')!=R114 or r.get('run_attempt')!=1 or r.get('status')!='completed' or r.get('conclusion')!='failure' or r.get('head_sha')!=H114 or (r.get('head_commit') or {}).get('tree_id')!=T114: raise SystemExit('V115_BIND_FAIL V114 run')
          if j.get('id')!=J114 or j.get('run_id')!=R114 or j.get('status')!='completed' or j.get('conclusion')!='failure': raise SystemExit('V115_BIND_FAIL V114 job')
          if a.get('id')!=A114 or a.get('digest')!=AD114 or a.get('size_in_bytes')!=AZ114 or a.get('expired') is not False: raise SystemExit('V115_BIND_FAIL V114 artifact metadata')
          logb=Path('fetched-v115/v114-job.log').read_bytes(); logt=logb.decode(errors='strict')
          required_log=['V113_V110_HELPER_OWNER_SOURCE_REPRESENTATION_GATE_PASS','V114_BEFORE_RUN_SHA256=79e4ea8b832c7576c24a74f2496231e3d0cdf9a3fb4823b5b8e845aacfa55317','V114_AFTER_RUN_SHA256=a44d65b6bacbe08bfb5495faa68f3846ee77d1516d949f005cf74e04fdc2689b','V113_TO_V114_DIFF_SHA256=b527a0672cdb09b0cf3a1715a45be41d45a208d8f715a4493f4e22a679adb5f1','V63_CHAIN_FAIL exact V61 source-defined SHA repair literals absent','SHA256 digest of uploaded artifact zip is ef61cfb738a6fd9d8f006ab90250ac8a26000f3621bef55ec857c8a435397404','Final size is 3491970392 bytes. Artifact ID is 10610326380']
          if any(q not in logt for q in required_log): raise SystemExit('V115_BIND_FAIL V114 log receipt')

          z=Path('artifacts-v115/v114.zip')
          hs=hashlib.sha256(); n=0
          with z.open('rb') as f:
              while True:
                  b=f.read(8*1024*1024)
                  if not b: break
                  n+=len(b); hs.update(b)
          if n!=AZ114 or hs.hexdigest()!=AD114.split(':',1)[1]: raise SystemExit('V115_BIND_FAIL V114 artifact transport '+repr((n,hs.hexdigest())))
          z.unlink()

          main=J('fetched-v115/main.json'); comp=J('fetched-v115/compare.json'); fs=comp.get('files') or []
          if main.get('commit',{}).get('sha')!=MAIN or comp.get('base_commit',{}).get('sha')!=MAIN or len(fs)!=1 or fs[0].get('filename')!='.github/workflows/lowalt-lt5-p-worker-module-v115.yml' or fs[0].get('status')!='added': raise SystemExit('V115_BIND_FAIL branch scope '+repr([(x.get('filename'),x.get('status')) for x in fs]))

          r61,map61=extract_run(s61); r63,map63=extract_run(s63)
          hs61=b"python3 - <<'PY_V61_GATE'\n"; p0=r61.find(hs61)
          if p0<0: raise SystemExit('V115_BIND_FAIL V61 heredoc start'); p0+=len(hs61)
          p1=r61.find(b'\nPY_V61_GATE\n',p0)
          if p1<0: raise SystemExit('V115_BIND_FAIL V61 heredoc end')
          py61b=r61[p0:p1+1]; py61=py61b.decode('utf-8'); tree=ast.parse(py61)
          def assign(name):
              out=[]
              for node in ast.walk(tree):
                  if isinstance(node,ast.Assign) and len(node.targets)==1 and isinstance(node.targets[0],ast.Name) and node.targets[0].id==name:
                      out.append(node)
              return out
          old_runtime=("          V54_SOURCE_SHA256 = '"+OLD_SHA+"'\n").encode(); new_runtime=("          V54_SOURCE_SHA256 = '"+NEW_SHA+"'\n").encode()
          od=assign('old'); nd=assign('new')
          if len(od)!=1 or len(nd)!=1 or not isinstance(od[0].value,ast.Constant) or not isinstance(nd[0].value,ast.Constant) or od[0].value.value!=old_runtime or nd[0].value.value!=new_runtime or od[0].lineno>=nd[0].lineno:
              raise SystemExit('V115_GATE_FAIL V61 old/new source definition binding')
          odseg=ast.get_source_segment(py61,od[0]); ndseg=ast.get_source_segment(py61,nd[0])
          if odseg is None or ndseg is None: raise SystemExit('V115_GATE_FAIL V61 definition source segment')
          test_expected='original.count(old) != 1 or original.count(new) != 0'
          tests=[n for n in ast.walk(tree) if isinstance(n,ast.If) and ast.get_source_segment(py61,n.test)==test_expected]
          repl_expected='patched = original.replace(old, new, 1)'
          repl=[n for n in ast.walk(tree) if isinstance(n,ast.Assign) and ast.get_source_segment(py61,n)==repl_expected]
          if len(tests)!=1 or len(repl)!=1 or not (nd[0].lineno < tests[0].lineno < repl[0].lineno): raise SystemExit('V115_GATE_FAIL V61 use binding/order')
          use_test=ast.get_source_segment(py61,tests[0].test); use_repl=ast.get_source_segment(py61,repl[0])

          hist=("TABLE_TARGET = '"+HIST_TABLE+"'\n"+"MANIFEST_TARGET = '"+HIST_MANIFEST+"'\n").encode()
          succ=("TABLE_TARGET = '"+HIST_TABLE+"'\n"+"MANIFEST_TARGET = '"+HIST_MANIFEST+"'\n"+"V59_SOURCE_DEFINED_TABLE_SHA256 = '"+CORR_TABLE+"'\n"+"V59_SOURCE_DEFINED_MANIFEST_SHA256 = '"+CORR_MANIFEST+"'\n").encode()
          oc=b'if table_sha != TABLE_TARGET or manifest_sha != MANIFEST_TARGET:\n'; nc=b'if table_sha != V59_SOURCE_DEFINED_TABLE_SHA256 or manifest_sha != V59_SOURCE_DEFINED_MANIFEST_SHA256:\n'
          if r63.count(hist)!=1 or r63.count(succ)!=0 or r63.count(oc)!=1 or r63.count(nc)!=0: raise SystemExit('V115_BIND_FAIL preserved V65/V66 successor transform precondition')
          before=r63.replace(hist,succ,1).replace(oc,nc,1)
          if s65.count(b"V59_SOURCE_DEFINED_TABLE_SHA256 = '"+CORR_TABLE.encode()+b"'")<1 or s65.count(b"V59_SOURCE_DEFINED_MANIFEST_SHA256 = '"+CORR_MANIFEST.encode()+b"'")<1: raise SystemExit('V115_BIND_FAIL V65 corrected owner values')
          if s66.count(b"GITHUB_SHA=\"eba5f9422ee947b89625a45a2538eea4ae61f705\"")!=1: raise SystemExit('V115_BIND_FAIL V66 preserved child outer SHA')

          old_assert=("if old not in v61 or new not in v61:\n"+"    raise SystemExit('V63_CHAIN_FAIL exact V61 source-defined SHA repair literals absent')\n").encode()
          new_assert=("ast_owner = __import__('ast')\n"
          "v61_owner_run, _ = extract_run(v61)\n"
          "v61_owner_start = b\"python3 - <<'PY_V61_GATE'\\n\"\n"
          "v61_owner_i = v61_owner_run.find(v61_owner_start)\n"
          "if v61_owner_i < 0: raise SystemExit('V63_CHAIN_FAIL V61 owner heredoc start')\n"
          "v61_owner_i += len(v61_owner_start)\n"
          "v61_owner_j = v61_owner_run.find(b'\\nPY_V61_GATE\\n', v61_owner_i)\n"
          "if v61_owner_j < 0: raise SystemExit('V63_CHAIN_FAIL V61 owner heredoc end')\n"
          "v61_owner_text = v61_owner_run[v61_owner_i:v61_owner_j+1].decode('utf-8')\n"
          "v61_owner_tree = ast_owner.parse(v61_owner_text)\n"
          "def v61_owner_assign(name):\n"
          "    return [n for n in ast_owner.walk(v61_owner_tree) if isinstance(n, ast_owner.Assign) and len(n.targets)==1 and isinstance(n.targets[0], ast_owner.Name) and n.targets[0].id==name]\n"
          "v61_owner_old = v61_owner_assign('old'); v61_owner_new = v61_owner_assign('new')\n"
          "if len(v61_owner_old)!=1 or len(v61_owner_new)!=1 or not isinstance(v61_owner_old[0].value, ast_owner.Constant) or not isinstance(v61_owner_new[0].value, ast_owner.Constant) or v61_owner_old[0].value.value != old or v61_owner_new[0].value.value != new or v61_owner_old[0].lineno >= v61_owner_new[0].lineno: raise SystemExit('V63_CHAIN_FAIL V61 runtime-value source-definition binding')\n"
          "v61_owner_test = [n for n in ast_owner.walk(v61_owner_tree) if isinstance(n, ast_owner.If) and ast_owner.get_source_segment(v61_owner_text,n.test) == 'original.count(old) != 1 or original.count(new) != 0']\n"
          "v61_owner_replace = [n for n in ast_owner.walk(v61_owner_tree) if isinstance(n, ast_owner.Assign) and ast_owner.get_source_segment(v61_owner_text,n) == 'patched = original.replace(old, new, 1)']\n"
          "if len(v61_owner_test)!=1 or len(v61_owner_replace)!=1 or not (v61_owner_new[0].lineno < v61_owner_test[0].lineno < v61_owner_replace[0].lineno): raise SystemExit('V63_CHAIN_FAIL V61 source use/order binding')\n").encode()
          if before.count(old_assert)!=1 or before.count(new_assert)!=0: raise SystemExit('V115_PATCH_FAIL owner assertion precondition '+repr((before.count(old_assert),before.count(new_assert))))
          after=before.replace(old_assert,new_assert,1)
          if after.replace(new_assert,old_assert,1)!=before: raise SystemExit('V115_PATCH_FAIL inverse reconstruction')
          d=''.join(difflib.unified_diff(before.decode().splitlines(True),after.decode().splitlines(True),fromfile='bootstrap-v115/v63-preserved-before-v115.sh',tofile='bootstrap-v115/v63-preserved-patched-v115.sh',n=3)).encode()
          changed=[x for x in d.decode().splitlines() if (x.startswith('+') or x.startswith('-')) and not x.startswith('+++') and not x.startswith('---')]
          expected_changed=['-'+x for x in old_assert.decode().rstrip('\n').split('\n')]+['+'+x for x in new_assert.decode().rstrip('\n').split('\n')]
          if changed!=expected_changed: raise SystemExit('V115_PATCH_FAIL extra diff '+repr(changed))

          Path('bootstrap-v115/v63-preserved-before-v115.sh').write_bytes(before); Path('bootstrap-v115/v63-preserved-patched-v115.sh').write_bytes(after)
          (O/'v63-v115-owner-assertion.diff').write_bytes(d); (O/'old-owner-assertion.bin').write_bytes(old_assert); (O/'new-owner-assertion.bin').write_bytes(new_assert)
          (O/'v61-old-definition-source-segment.txt').write_text(odseg+'\n'); (O/'v61-new-definition-source-segment.txt').write_text(ndseg+'\n'); (O/'v61-use-test-source-segment.txt').write_text(use_test+'\n'); (O/'v61-use-replace-source-segment.txt').write_text(use_repl+'\n')
          (O/'v61-run-extraction-map.json').write_text(json.dumps(map61,indent=2,sort_keys=True)+'\n'); (O/'v63-run-extraction-map.json').write_text(json.dumps(map63,indent=2,sort_keys=True)+'\n')
          rec={'schema':1,'status':'V63_V61_RUNTIME_VALUE_SOURCE_REPRESENTATION_BINDING_GATE_PASS','coordinator':COORD,'checkpoint':CHECKPOINT,'v114':{'head':H114,'tree':T114,'workflow_blob':B114,'run':R114,'job':J114,'artifact':A114,'artifact_digest':AD114,'artifact_size':AZ114,'job_log_size':len(logb),'job_log_sha256':H(logb)},'v63_blob':B63,'v61_blob':B61,'v65_blob':B65,'v66_blob':B66,'old_runtime_sha256':H(old_runtime),'new_runtime_sha256':H(new_runtime),'v61_old_definition_segment_sha256':H((odseg+'\n').encode()),'v61_new_definition_segment_sha256':H((ndseg+'\n').encode()),'v61_test_segment_sha256':H((use_test+'\n').encode()),'v61_replace_segment_sha256':H((use_repl+'\n').encode()),'definition_order':[od[0].lineno,nd[0].lineno],'use_order':[tests[0].lineno,repl[0].lineno],'before_size':len(before),'before_sha256':H(before),'old_assertion_size':len(old_assert),'old_assertion_sha256':H(old_assert),'new_assertion_size':len(new_assert),'new_assertion_sha256':H(new_assert),'after_size':len(after),'after_sha256':H(after),'diff_size':len(d),'diff_sha256':H(d),'inverse_reconstruction':True,'outer_github_sha':V65_HEAD,'scientific_script_mutation':False,'source_defined_transport_mutation':False,'b_selected':False,'b_resolved':False}
          (O/'gate-receipt.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n')
          (O/'V63_V61_RUNTIME_VALUE_SOURCE_REPRESENTATION_BINDING_GATE_PASS').write_text('PASS exact V61 runtime byte values bound to unique source definitions and preserved count/replace use order; V63 owner assertion only repaired\n')
          print('V63_V61_RUNTIME_VALUE_SOURCE_REPRESENTATION_BINDING_GATE_PASS')
          print('V115_BEFORE_V63_SHA256='+H(before)); print('V115_AFTER_V63_SHA256='+H(after)); print('V115_DIFF_SHA256='+H(d))
          PY_V115

          rm -rf artifacts-v115
          test -f evidence/v115-v63-v61-source-representation/V63_V61_RUNTIME_VALUE_SOURCE_REPRESENTATION_BINDING_GATE_PASS
          bash -n bootstrap-v115/v63-preserved-patched-v115.sh
          set +e
          GITHUB_SHA=eba5f9422ee947b89625a45a2538eea4ae61f705 bash bootstrap-v115/v63-preserved-patched-v115.sh >evidence/v115-v63-v61-source-representation/preserved-v63.stdout 2>evidence/v115-v63-v61-source-representation/preserved-v63.stderr
          RC=$?
          set -e
          printf '%s\n' "$RC" > evidence/v115-v63-v61-source-representation/preserved-v63.exit-code.txt
          if [ "$RC" -ne 0 ]; then echo "V115_PRESERVED_V63_FIRST_FALSE rc=$RC" >&2; tail -n 4000 evidence/v115-v63-v61-source-representation/preserved-v63.stderr >&2 || true; exit "$RC"; fi
          echo V115_PRESERVED_CHAIN_COMPLETED_PRE_RESULT

      - name: Freeze V115 PRE-RESULT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-worker-module-v115-evidence
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
          path: |
            evidence/
            bootstrap*/
            fetched-v*/
            artifacts-v*/
            work/
