name: LowAlt LT5 P Worker Module V115 Heredoc Control Flow V116

on:
  push:
    branches:
      - review/lowalt-lt5-p-worker-module-v116-20260920
    paths:
      - .github/workflows/lowalt-lt5-p-worker-module-v116.yml

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  v115-heredoc-control-flow:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Repair only V115 heredoc-start control flow and continue preserved PRE-RESULT chain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p fetched-v116 artifacts-v116 bootstrap-v116 evidence/v116-v115-heredoc-control-flow
          R=https://api.github.com/repos/search-maker/twilight-mystic-experiments
          get(){ curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$1" -o "$2"; }

          get "$R/issues/comments/5751872363" fetched-v116/coordinator-v116.json
          get "$R/contents/.github/workflows/lowalt-lt5-p-worker-module-v115.yml?ref=df481466e6434bab7b10bf6abae2577cf49bbfca" fetched-v116/v115-workflow.json
          get "$R/actions/runs/35530013464" fetched-v116/v115-run.json
          get "$R/actions/jobs/106128833572" fetched-v116/v115-job.json
          get "$R/actions/artifacts/10611201879" fetched-v116/v115-artifact.json
          get "$R/actions/jobs/106128833572/logs" fetched-v116/v115-job.log
          get "$R/actions/artifacts/10611201879/zip" artifacts-v116/v115.zip
          get "$R/branches/main" fetched-v116/main.json
          get "$R/compare/6cd7c075766fe0c86bc7561ec205a3f9120fd1fb...${GITHUB_SHA}" fetched-v116/compare.json

          python3 - <<'PY_V116'
          import base64
          import difflib
          import hashlib
          import json
          from pathlib import Path

          O=Path('evidence/v116-v115-heredoc-control-flow'); O.mkdir(parents=True,exist_ok=True)
          H=lambda b:hashlib.sha256(b).hexdigest()
          G=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          J=lambda p:json.loads(Path(p).read_text())

          MAIN='6cd7c075766fe0c86bc7561ec205a3f9120fd1fb'
          COORD=5751872363
          H115='df481466e6434bab7b10bf6abae2577cf49bbfca'
          T115='6d5b93cf59a65f872b576a4221bfda91f107de89'
          B115='05f87779eb6d5afd655c5072fee8888c24a54f72'
          R115=35530013464; J115=106128833572; A115=10611201879
          AD115='sha256:a8af11ee4e8befe2d4ee0cba017d21a4e46e843fd21b5c1efc228f0ab96e2fa0'; AZ115=87947
          OLD=b"if p0<0: raise SystemExit('V115_BIND_FAIL V61 heredoc start'); p0+=len(hs61)\n"
          NEW=b"if p0<0: raise SystemExit('V115_BIND_FAIL V61 heredoc start')\np0+=len(hs61)\n"

          def wf(path,blob):
              x=J(path); d=base64.b64decode(x['content'])
              if x.get('sha')!=blob or G(d)!=blob: raise SystemExit('V116_BIND_FAIL V115 workflow')
              return d

          def extract_run(source):
              lines=source.splitlines(keepends=True); marker=b'        run: |\n'
              if lines.count(marker)!=1: raise SystemExit('V116_BIND_FAIL run marker '+repr(lines.count(marker)))
              start=lines.index(marker)+1; out=[]; mapping=[]
              for idx in range(start,len(lines)):
                  line=lines[idx]
                  if line.strip() and not line.startswith(b'          '): break
                  removed=10 if line.startswith(b'          ') else 0
                  out.append(line[removed:]); mapping.append({'yaml_line_1_based':idx+1,'removed_prefix_spaces':removed})
              return b''.join(out),mapping

          coord=J('fetched-v116/coordinator-v116.json')
          if coord.get('id')!=COORD or coord.get('user',{}).get('login')!='search-maker': raise SystemExit('V116_BIND_FAIL coordinator identity')
          cb=coord.get('body','')
          for q in ['AUTHORIZED: exactly ONE fresh LowAlt PRE-RESULT V116 identity',H115,T115,B115,str(R115),str(J115),str(A115),AD115,"if p0<0: raise SystemExit('V115_BIND_FAIL V61 heredoc start'); p0+=len(hs61)",'V115_V61_HEREDOC_START_CONTROL_FLOW_GATE_PASS','No V117 absent a later direct Coordinator transition']:
              if q not in cb: raise SystemExit('V116_BIND_FAIL coordinator literal '+q)

          source=wf('fetched-v116/v115-workflow.json',B115)
          run=J('fetched-v116/v115-run.json'); job=J('fetched-v116/v115-job.json'); art=J('fetched-v116/v115-artifact.json')
          if run.get('id')!=R115 or run.get('run_attempt')!=1 or run.get('status')!='completed' or run.get('conclusion')!='failure' or run.get('head_sha')!=H115 or (run.get('head_commit') or {}).get('tree_id')!=T115: raise SystemExit('V116_BIND_FAIL V115 run')
          if job.get('id')!=J115 or job.get('run_id')!=R115 or job.get('status')!='completed' or job.get('conclusion')!='failure': raise SystemExit('V116_BIND_FAIL V115 job')
          if art.get('id')!=A115 or art.get('digest')!=AD115 or art.get('size_in_bytes')!=AZ115 or art.get('expired') is not False: raise SystemExit('V116_BIND_FAIL V115 artifact metadata')
          logb=Path('fetched-v116/v115-job.log').read_bytes(); logt=logb.decode('utf-8-sig')
          for q in ["python3 - <<'PY_V61_GATE'",'SyntaxError: invalid syntax','File "<stdin>", line 78, in <module>','V115_BIND_FAIL V61 heredoc start','SHA256 digest of uploaded artifact zip is a8af11ee4e8befe2d4ee0cba017d21a4e46e843fd21b5c1efc228f0ab96e2fa0','Final size is 87947 bytes. Artifact ID is 10611201879']:
              if q not in logt: raise SystemExit('V116_BIND_FAIL V115 log '+q)
          if 'V63_V61_RUNTIME_VALUE_SOURCE_REPRESENTATION_BINDING_GATE_PASS\n' in logt: raise SystemExit('V116_BIND_FAIL V115 unexpectedly passed target gate')

          z=Path('artifacts-v116/v115.zip'); zb=z.read_bytes()
          if len(zb)!=AZ115 or H(zb)!=AD115.split(':',1)[1]: raise SystemExit('V116_BIND_FAIL V115 artifact transport '+repr((len(zb),H(zb))))
          z.unlink()

          main=J('fetched-v116/main.json'); comp=J('fetched-v116/compare.json'); fs=comp.get('files') or []
          if main.get('commit',{}).get('sha')!=MAIN or comp.get('base_commit',{}).get('sha')!=MAIN or len(fs)!=1 or fs[0].get('filename')!='.github/workflows/lowalt-lt5-p-worker-module-v116.yml' or fs[0].get('status')!='added': raise SystemExit('V116_BIND_FAIL branch scope '+repr([(x.get('filename'),x.get('status')) for x in fs]))

          before,mapping=extract_run(source)
          if before.count(OLD)!=1 or before.count(NEW)!=0: raise SystemExit('V116_PATCH_FAIL control-flow precondition '+repr((before.count(OLD),before.count(NEW))))
          after=before.replace(OLD,NEW,1)
          if after.replace(NEW,OLD,1)!=before: raise SystemExit('V116_PATCH_FAIL inverse reconstruction')
          d=''.join(difflib.unified_diff(before.decode().splitlines(True),after.decode().splitlines(True),fromfile='bootstrap-v116/v115-run-original.sh',tofile='bootstrap-v116/v115-run-patched-v116.sh',n=3)).encode()
          changed=[x for x in d.decode().splitlines() if (x.startswith('+') or x.startswith('-')) and not x.startswith('+++') and not x.startswith('---')]
          expected=['-'+OLD.decode().rstrip('\n'),"+if p0<0: raise SystemExit('V115_BIND_FAIL V61 heredoc start')",'+p0+=len(hs61)']
          if changed!=expected: raise SystemExit('V116_PATCH_FAIL extra diff '+repr(changed))

          Path('bootstrap-v116/v115-run-original.sh').write_bytes(before)
          Path('bootstrap-v116/v115-run-patched-v116.sh').write_bytes(after)
          (O/'v115-to-v116-control-flow.diff').write_bytes(d)
          (O/'old-control-flow.bin').write_bytes(OLD); (O/'new-control-flow.bin').write_bytes(NEW)
          (O/'v115-run-extraction-map.json').write_text(json.dumps(mapping,indent=2,sort_keys=True)+'\n')
          receipt={'schema':1,'status':'V115_V61_HEREDOC_START_CONTROL_FLOW_GATE_PASS','coordinator':COORD,'v115':{'head':H115,'tree':T115,'workflow_blob':B115,'run':R115,'job':J115,'artifact':A115,'artifact_digest':AD115,'artifact_size':AZ115,'job_log_size':len(logb),'job_log_sha256':H(logb)},'before_size':len(before),'before_sha256':H(before),'old_size':len(OLD),'old_sha256':H(OLD),'new_size':len(NEW),'new_sha256':H(NEW),'after_size':len(after),'after_sha256':H(after),'diff_size':len(d),'diff_sha256':H(d),'changed_payload_lines':changed,'inverse_reconstruction':True,'outer_github_sha':H115,'scientific_script_mutation':False,'source_defined_transport_mutation':False,'b_selected':False,'b_resolved':False}
          (O/'gate-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          (O/'V115_V61_HEREDOC_START_CONTROL_FLOW_GATE_PASS').write_text('PASS exact V115 one-line if-suite split only; heredoc body start advances after successful marker lookup\n')
          print('V115_V61_HEREDOC_START_CONTROL_FLOW_GATE_PASS')
          print('V116_BEFORE_RUN_SHA256='+H(before)); print('V116_AFTER_RUN_SHA256='+H(after)); print('V115_TO_V116_DIFF_SHA256='+H(d))
          PY_V116

          rm -rf artifacts-v116
          test -f evidence/v116-v115-heredoc-control-flow/V115_V61_HEREDOC_START_CONTROL_FLOW_GATE_PASS
          bash -n bootstrap-v116/v115-run-patched-v116.sh
          set +e
          GITHUB_SHA=df481466e6434bab7b10bf6abae2577cf49bbfca bash bootstrap-v116/v115-run-patched-v116.sh >evidence/v116-v115-heredoc-control-flow/preserved-v115.stdout 2>evidence/v116-v115-heredoc-control-flow/preserved-v115.stderr
          RC=$?
          set -e
          printf '%s\n' "$RC" > evidence/v116-v115-heredoc-control-flow/preserved-v115.exit-code.txt
          if [ "$RC" -ne 0 ]; then echo "V116_PRESERVED_V115_FIRST_FALSE rc=$RC" >&2; tail -n 4000 evidence/v116-v115-heredoc-control-flow/preserved-v115.stderr >&2 || true; exit "$RC"; fi
          echo V116_PRESERVED_CHAIN_COMPLETED_PRE_RESULT

      - name: Freeze V116 PRE-RESULT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-worker-module-v116-evidence
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
          path: |
            evidence/
            bootstrap*/
            fetched-v*/
            artifacts-v*/
            work/
