name: LowAlt LT5 P Worker Module V118 V60 V58 Unified Diff Payload Order Representation

on:
  push:
    branches:
      - review/lowalt-lt5-p-worker-module-v118-20260920
    paths:
      - .github/workflows/lowalt-lt5-p-worker-module-v118.yml

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  v60-v58-unified-diff-payload-order-representation:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Bind exact V117 evidence, repair only V60 expected V58 diff payload order, continue PRE-RESULT chain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p fetched-v118 artifacts-v118 work-v117 evidence-v118/v60-v58-unified-diff-payload-order-representation
          R=https://api.github.com/repos/search-maker/twilight-mystic-experiments
          get(){ curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$1" -o "$2"; }

          get "$R/issues/comments/5752068642" fetched-v118/coordinator-v118.json
          get "$R/contents/.github/workflows/lowalt-lt5-p-worker-module-v117.yml?ref=30093cf3650ca31e288312c3c75001155fbea400" fetched-v118/v117-workflow.json
          get "$R/actions/runs/35531884647" fetched-v118/v117-run.json
          get "$R/actions/jobs/106133827535" fetched-v118/v117-job.json
          get "$R/actions/artifacts/10611351812" fetched-v118/v117-artifact.json
          get "$R/actions/jobs/106133827535/logs" fetched-v118/v117-job.log
          get "$R/actions/artifacts/10611351812/zip" artifacts-v118/v117.zip
          get "$R/branches/main" fetched-v118/main.json
          get "$R/compare/6cd7c075766fe0c86bc7561ec205a3f9120fd1fb...${GITHUB_SHA}" fetched-v118/compare.json

          python3 - <<'PY_V118'
          import base64
          import difflib
          import hashlib
          import io
          import json
          import zipfile
          from pathlib import Path

          E=Path('evidence-v118/v60-v58-unified-diff-payload-order-representation'); E.mkdir(parents=True,exist_ok=True)
          W=Path('work-v117'); W.mkdir(parents=True,exist_ok=True)
          H=lambda b:hashlib.sha256(b).hexdigest()
          G=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          J=lambda p:json.loads(Path(p).read_text())

          MAIN='6cd7c075766fe0c86bc7561ec205a3f9120fd1fb'
          C=5752068642
          H117='30093cf3650ca31e288312c3c75001155fbea400'
          T117='22e125aafd654383f606ce78e862bb89c19bdf25'
          B117='da614f02de1a8b0f62fbc2bd8dfa6f32c41f84c9'
          R117=35531884647; J117=106133827535; A117=10611351812
          AD117='sha256:08e6db570735aeeeb49bfd62d29205da82e6c67e26a343fb590e560367041799'; AZ117=3095721
          MEMBER='bootstrap/v60-run-patched-v63.sh'
          BEFORE_SIZE=12832; BEFORE_SHA='db30ed9c2bba447ca91052b36a00b45c108cdcff3c72034f56d222bcfc2e6c5e'
          V58_BLOB='a88873140a276d8735a65f998d2d6b8ca97492d1'
          OUTER='eba5f9422ee947b89625a45a2538eea4ae61f705'
          OLD=b'''expected_v58_payload = [\n    "-          if [x['line_1_based'] for x in v54_intended] != [136]:",\n    "-          if [x['line_1_based'] for x in v54_payload] != [267]:",\n    "+          if [x['line_1_based'] for x in v54_intended] != [82]:",\n    "+          if [x['line_1_based'] for x in v54_payload] != [83]:",\n]\n'''
          NEW=b'''expected_v58_payload = [\n    "-          if [x['line_1_based'] for x in v54_intended] != [136]:",\n    "+          if [x['line_1_based'] for x in v54_intended] != [82]:",\n    "-          if [x['line_1_based'] for x in v54_payload] != [267]:",\n    "+          if [x['line_1_based'] for x in v54_payload] != [83]:",\n]\n'''
          OLD_SIZE=315; OLD_SHA='68741e87560ff37befb501830ee222530b1ec127c154ca9a55e8a38614d7304c'
          NEW_SIZE=315; NEW_SHA='6e961a2e7e8ebf0e3a50337d2d11f15a7bc9831a26cb744e8b82d2246daa0404'
          AFTER_SIZE=12832; AFTER_SHA='6337ba225d0c6e129310252e950c23fa0c32fd896e1658e01beb8daf7ad34784'
          DIFF_SIZE=722; DIFF_SHA='602166c12c13a1ec6104f61745c4860340f610f2b5a83dc6e6679c8523c5b152'

          c=J('fetched-v118/coordinator-v118.json')
          if c.get('id')!=C or c.get('user',{}).get('login')!='search-maker': raise SystemExit('V118_BIND_FAIL coordinator identity')
          cb=c.get('body','')
          for q in ['COORDINATOR::LOWALT_V117_TERMINAL_V118_V60_DIFF_PAYLOAD_ORDER_REPRESENTATION_AUTHORIZATION__PRE_RESULT_ONLY',H117,T117,B117,str(R117),str(J117),str(A117),AD117,BEFORE_SHA,OLD_SHA,NEW_SHA,AFTER_SHA,DIFF_SHA,'No V119 absent later direct Coordinator transition']:
              if q not in cb: raise SystemExit('V118_BIND_FAIL coordinator literal '+q)

          wj=J('fetched-v118/v117-workflow.json'); wsrc=base64.b64decode(wj['content'])
          if wj.get('sha')!=B117 or G(wsrc)!=B117: raise SystemExit('V118_BIND_FAIL V117 workflow blob')
          run=J('fetched-v118/v117-run.json'); job=J('fetched-v118/v117-job.json'); art=J('fetched-v118/v117-artifact.json')
          if run.get('id')!=R117 or run.get('run_attempt')!=1 or run.get('status')!='completed' or run.get('conclusion')!='failure' or run.get('head_sha')!=H117 or (run.get('head_commit') or {}).get('tree_id')!=T117: raise SystemExit('V118_BIND_FAIL V117 run')
          if job.get('id')!=J117 or job.get('run_id')!=R117 or job.get('status')!='completed' or job.get('conclusion')!='failure': raise SystemExit('V118_BIND_FAIL V117 job')
          if art.get('id')!=A117 or art.get('digest')!=AD117 or art.get('size_in_bytes')!=AZ117 or art.get('expired') is not False: raise SystemExit('V118_BIND_FAIL V117 artifact metadata')
          logb=Path('fetched-v118/v117-job.log').read_bytes(); logt=logb.decode('utf-8-sig')
          for q in ['V63_V61_YAML_RUN_EXTRACTION_PATCH_TOKEN_REPRESENTATION_GATE_PASS','V117_AFTER_CHILD_SHA256=e47e281a4d7015b8e89a8487be25aad6111128db624ebf8972c519fcbc0aeb11','V115_TO_V117_DIFF_SHA256=1e58cee188f8f25e90305b9876d5bab789892f233742644258550e486088b461','V60_LINE_IDENTITY_FAIL unexpected V58 diff payload',"-          if [x['line_1_based'] for x in v54_intended] != [136]:","+          if [x['line_1_based'] for x in v54_intended] != [82]:","-          if [x['line_1_based'] for x in v54_payload] != [267]:","+          if [x['line_1_based'] for x in v54_payload] != [83]:"]:
              if q not in logt: raise SystemExit('V118_BIND_FAIL V117 log '+q)
          if 'V60_V58_UNIFIED_DIFF_PAYLOAD_ORDER_REPRESENTATION_GATE_PASS\n' in logt: raise SystemExit('V118_BIND_FAIL V117 unexpectedly passed target gate')

          z=Path('artifacts-v118/v117.zip'); zb=z.read_bytes()
          if len(zb)!=AZ117 or H(zb)!=AD117.split(':',1)[1]: raise SystemExit('V118_BIND_FAIL artifact transport '+repr((len(zb),H(zb))))
          with zipfile.ZipFile(io.BytesIO(zb)) as zz:
              names=zz.namelist()
              if names.count(MEMBER)!=1: raise SystemExit('V118_BIND_FAIL target member cardinality '+repr(names.count(MEMBER)))
              for n in names:
                  p=Path(n)
                  if p.is_absolute() or '..' in p.parts: raise SystemExit('V118_BIND_FAIL unsafe artifact path '+n)
              zz.extractall(W)
          z.unlink()

          before=(W/MEMBER).read_bytes()
          if len(before)!=BEFORE_SIZE or H(before)!=BEFORE_SHA: raise SystemExit('V118_BIND_FAIL child identity '+repr((len(before),H(before))))
          v58=(W/'fetched-v60/v58-workflow-source.yml').read_bytes()
          if G(v58)!=V58_BLOB: raise SystemExit('V118_BIND_FAIL immutable V58 blob '+G(v58))
          old_i=b"          if [x['line_1_based'] for x in v54_intended] != [136]:\n"
          new_i=b"          if [x['line_1_based'] for x in v54_intended] != [82]:\n"
          old_p=b"          if [x['line_1_based'] for x in v54_payload] != [267]:\n"
          new_p=b"          if [x['line_1_based'] for x in v54_payload] != [83]:\n"
          counts={'old_i':v58.count(old_i),'new_i':v58.count(new_i),'old_p':v58.count(old_p),'new_p':v58.count(new_p)}
          if counts!={'old_i':1,'new_i':0,'old_p':1,'new_p':0}: raise SystemExit('V118_GATE_FAIL V58 source predicate counts '+repr(counts))
          v58p=v58.replace(old_i,new_i,1).replace(old_p,new_p,1)
          vd=''.join(difflib.unified_diff(v58.decode().splitlines(True),v58p.decode().splitlines(True),fromfile='v58-workflow-exact.yml',tofile='v58-workflow-v60-line-identity.yml',n=3))
          actual=[x for x in vd.splitlines() if (x.startswith('+') and not x.startswith('+++')) or (x.startswith('-') and not x.startswith('---'))]
          expected=[
              "-          if [x['line_1_based'] for x in v54_intended] != [136]:",
              "+          if [x['line_1_based'] for x in v54_intended] != [82]:",
              "-          if [x['line_1_based'] for x in v54_payload] != [267]:",
              "+          if [x['line_1_based'] for x in v54_payload] != [83]:",
          ]
          if actual!=expected: raise SystemExit('V118_GATE_FAIL derived V58 payload '+repr(actual))

          if len(OLD)!=OLD_SIZE or H(OLD)!=OLD_SHA or len(NEW)!=NEW_SIZE or H(NEW)!=NEW_SHA: raise SystemExit('V118_PATCH_FAIL region identity')
          if before.count(OLD)!=1 or before.count(NEW)!=0: raise SystemExit('V118_PATCH_FAIL cardinality '+repr((before.count(OLD),before.count(NEW))))
          idx=before.find(OLD); after=before.replace(OLD,NEW,1)
          if after.replace(NEW,OLD,1)!=before: raise SystemExit('V118_PATCH_FAIL inverse reconstruction')
          if after[:idx]!=before[:idx] or after[idx+len(NEW):]!=before[idx+len(OLD):]: raise SystemExit('V118_PATCH_FAIL outside-region drift')
          if len(after)!=AFTER_SIZE or H(after)!=AFTER_SHA: raise SystemExit('V118_PATCH_FAIL corrected child '+repr((len(after),H(after))))
          d=''.join(difflib.unified_diff(before.decode().splitlines(True),after.decode().splitlines(True),fromfile='bootstrap/v60-run-patched-v63.sh',tofile='bootstrap-v118/v60-run-v58-diff-order-v118.sh',n=3)).encode()
          if len(d)!=DIFF_SIZE or H(d)!=DIFF_SHA: raise SystemExit('V118_PATCH_FAIL wrapper diff '+repr((len(d),H(d))))

          out=W/'bootstrap-v118/v60-run-v58-diff-order-v118.sh'; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(after)
          (E/'old-region.bin').write_bytes(OLD); (E/'new-region.bin').write_bytes(NEW); (E/'v117-to-v118.diff').write_bytes(d); (E/'derived-v58.diff').write_text(vd)
          receipt={'schema':1,'status':'V60_V58_UNIFIED_DIFF_PAYLOAD_ORDER_REPRESENTATION_GATE_PASS','coordinator':C,'v117':{'head':H117,'tree':T117,'workflow_blob':B117,'run':R117,'job':J117,'artifact':A117,'artifact_digest':AD117,'artifact_size':AZ117,'job_log_size':len(logb),'job_log_sha256':H(logb),'artifact_transport_sha256':H(zb)},'member':{'path':MEMBER,'size':len(before),'sha256':H(before)},'immutable_v58':{'blob_sha1':G(v58),'size':len(v58),'sha256':H(v58),'counts':counts},'derived_payload':actual,'old_region':{'size':len(OLD),'sha256':H(OLD),'offset':idx},'new_region':{'size':len(NEW),'sha256':H(NEW)},'after':{'path':'bootstrap-v118/v60-run-v58-diff-order-v118.sh','size':len(after),'sha256':H(after)},'wrapper_diff':{'fromfile':'bootstrap/v60-run-patched-v63.sh','tofile':'bootstrap-v118/v60-run-v58-diff-order-v118.sh','n':3,'size':len(d),'sha256':H(d)},'inverse_reconstruction':True,'outside_region_unchanged':True,'outer_github_sha':OUTER,'scientific_script_mutation':False,'source_defined_transport_mutation':False,'b_selected':False,'b_resolved':False}
          (E/'gate-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          (E/'V60_V58_UNIFIED_DIFF_PAYLOAD_ORDER_REPRESENTATION_GATE_PASS').write_text('PASS exact deterministic unified-diff payload ordering representation only\n')
          print('V60_V58_UNIFIED_DIFF_PAYLOAD_ORDER_REPRESENTATION_GATE_PASS')
          print('V118_AFTER_CHILD_SHA256='+H(after)); print('V117_TO_V118_DIFF_SHA256='+H(d)); print('V117_JOB_LOG_SHA256='+H(logb))
          PY_V118

          rm -rf artifacts-v118
          test -f evidence-v118/v60-v58-unified-diff-payload-order-representation/V60_V58_UNIFIED_DIFF_PAYLOAD_ORDER_REPRESENTATION_GATE_PASS
          bash -n work-v117/bootstrap-v118/v60-run-v58-diff-order-v118.sh
          set +e
          (cd work-v117 && GITHUB_SHA=eba5f9422ee947b89625a45a2538eea4ae61f705 bash bootstrap-v118/v60-run-v58-diff-order-v118.sh) >evidence-v118/v60-v58-unified-diff-payload-order-representation/preserved-v60.stdout 2>evidence-v118/v60-v58-unified-diff-payload-order-representation/preserved-v60.stderr
          RC=$?
          set -e
          printf '%s\n' "$RC" > evidence-v118/v60-v58-unified-diff-payload-order-representation/preserved-v60.exit-code.txt
          if [ "$RC" -ne 0 ]; then echo "V118_PRESERVED_V60_FIRST_FALSE rc=$RC" >&2; tail -n 4000 evidence-v118/v60-v58-unified-diff-payload-order-representation/preserved-v60.stderr >&2 || true; exit "$RC"; fi
          echo V118_PRESERVED_CHAIN_COMPLETED_PRE_RESULT

      - name: Freeze V118 PRE-RESULT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-worker-module-v118-evidence
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
          path: |
            evidence-v118/
            fetched-v118/
            work-v117/evidence/
            work-v117/bootstrap*/
            work-v117/fetched-v*/
            work-v117/artifacts-v*/
