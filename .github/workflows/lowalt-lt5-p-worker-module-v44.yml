name: LowAlt LT5 P Worker Module Closure V44

on:
  push:
    branches:
      - review/lowalt-lt5-p-worker-module-v44-20260917
    paths:
      - .github/workflows/lowalt-lt5-p-worker-module-v44.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Replay exact V43, freeze P objects, and attempt strict worker-module link
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p bootstrap evidence

          V43_HEAD=53b85106d9f84da520c7d036048918845f810971
          V43_BLOB=5f87dccdd83574aeabe46024b6fc6fafd0351d30
          V43_RUN=35289602523
          V43_JOB=105429364488
          V43_ARTIFACT=10525488325
          V43_ARTIFACT_DIGEST=aa382cd8700d2d1bfd15f47712506c523f50070d8e9dd655c88a1a96fab401ca
          ANCILLARY_SHA256=4eec846ea3a3f095efee7dfad7d096de0c209f5b8ae6ed9b12793c0ffdaa7282
          NETCDF_FUNCTIONS_SHA256=1f53dbb2a24a322bbc48d7d7dc8bf15f84a91dca496c0327fed2eca336163a43

          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/lowalt-lt5-p-netcdf-exact410-v43.yml?ref=${V43_HEAD}" \
            -o bootstrap/v43.yml
          test "$(git hash-object bootstrap/v43.yml)" = "$V43_BLOB"

          awk '
            /^        run: \|$/ { capture=1; next }
            capture && /^      - name: Upload immutable V43 pre-result evidence$/ { exit }
            capture { sub(/^          /, ""); print }
          ' bootstrap/v43.yml > bootstrap/v43-run.sh
          test "$(grep -c '^set -euo pipefail$' bootstrap/v43-run.sh)" = 1
          bash -n bootstrap/v43-run.sh

          cat > evidence/v44-preexecution-receipt.txt <<EOF_V44_PRE
          status=PRE_RESULT_V44_EXACT_P_OBJECT_PRESERVATION_AND_WORKER_MODULE_LINK_ATTEMPT_FROZEN
          predecessor_v43_head=${V43_HEAD}
          predecessor_v43_blob=${V43_BLOB}
          predecessor_v43_run=${V43_RUN}
          predecessor_v43_job=${V43_JOB}
          predecessor_v43_artifact=${V43_ARTIFACT}
          predecessor_v43_artifact_digest=sha256:${V43_ARTIFACT_DIGEST}
          expected_ancillary_o_sha256=${ANCILLARY_SHA256}
          expected_netCDF_functions_o_sha256=${NETCDF_FUNCTIONS_SHA256}
          source_or_dependency_identity_changed=false
          compiler_or_link_flags_changed_before_v44_link=false
          wasm_instantiated=false
          p_numerical_evaluated=false
          raw_byte_p_to_t_marshalling=false
          t_called=false
          spectrum_401_evaluated=false
          lt5_result=false
          c_executed=false
          d_executed=false
          b_selected=false
          b_resolved=false
          production_changed=false
          EOF_V44_PRE
          sha256sum bootstrap/v43.yml bootstrap/v43-run.sh evidence/v44-preexecution-receipt.txt > evidence/v44-preexecution-sha256.txt

          # Rebuild the exact V43 source/dependency/P objects without instantiation or numerical evaluation.
          bash bootstrap/v43-run.sh

          grep -Fxq 'status=PASS' work/evidence/v11-receipt.txt
          grep -Fxq 'ancillary_compile=PASS' work/evidence/v11-receipt.txt
          grep -Fxq 'netCDF_functions_compile=PASS' work/evidence/v11-receipt.txt
          grep -Fxq 'netcdf_static_link=PASS' work/evidence/v11-receipt.txt
          grep -Fxq 'wasm_instantiated=false' work/evidence/v11-receipt.txt
          test "$(sha256sum work/ancillary.o | awk '{print $1}')" = "$ANCILLARY_SHA256"
          test "$(sha256sum work/netCDF_functions.o | awk '{print $1}')" = "$NETCDF_FUNCTIONS_SHA256"

          mkdir -p evidence/v44-p-objects evidence/v44-p-source evidence/v44-link
          cp work/ancillary.o evidence/v44-p-objects/ancillary.o
          cp work/netCDF_functions.o evidence/v44-p-objects/netCDF_functions.o
          cp work/p-generated-abi.h evidence/v44-p-source/p-generated-abi.h
          cp work/libRadtran-2.0.6/src/ancillary.c evidence/v44-p-source/ancillary.c
          cp work/libRadtran-2.0.6/libsrc_c/netCDF_functions.c evidence/v44-p-source/netCDF_functions.c
          cp work/libRadtran-2.0.6/libsrc_c/netCDF_functions.h evidence/v44-p-source/netCDF_functions.h
          sha256sum evidence/v44-p-objects/* > evidence/v44-p-objects-sha256.txt
          wc -c evidence/v44-p-objects/* > evidence/v44-p-objects-size.txt
          sha256sum evidence/v44-p-source/* > evidence/v44-p-source-sha256.txt

          source /opt/emsdk/emsdk_env.sh >/dev/null
          EMCC="$(command -v emcc)"
          LLVM_NM="$(command -v llvm-nm)"
          "$EMCC" --version > evidence/v44-link/emcc-version.txt 2>&1
          "$LLVM_NM" --version > evidence/v44-link/llvm-nm-version.txt 2>&1
          "$LLVM_NM" --defined-only --extern-only work/ancillary.o > evidence/v44-link/ancillary-defined.txt
          "$LLVM_NM" --undefined-only work/ancillary.o > evidence/v44-link/ancillary-undefined.txt
          "$LLVM_NM" --defined-only --extern-only work/netCDF_functions.o > evidence/v44-link/netCDF_functions-defined.txt
          "$LLVM_NM" --undefined-only work/netCDF_functions.o > evidence/v44-link/netCDF_functions-undefined.txt
          grep -Eq '[[:space:]]optical_properties$' evidence/v44-link/ancillary-defined.txt

          PREFIX="$(pwd)/work/install"
          set +e
          "$EMCC" -O0 \
            work/ancillary.o work/netCDF_functions.o \
            "$PREFIX/lib/libnetcdf.a" "$PREFIX/lib/libhdf5_hl.a" "$PREFIX/lib/libhdf5.a" "$PREFIX/lib/libz.a" \
            -sERROR_ON_UNDEFINED_SYMBOLS=1 \
            -sMODULARIZE=1 \
            -sEXPORT_ES6=1 \
            -sENVIRONMENT=worker \
            -sALLOW_MEMORY_GROWTH=0 \
            -sEXPORTED_FUNCTIONS='["_optical_properties","_malloc","_free"]' \
            -sEXPORTED_RUNTIME_METHODS='[]' \
            -Wl,--no-entry \
            -o evidence/v44-link/lowalt-p-exact.mjs \
            > evidence/v44-link/link.stdout.txt 2> evidence/v44-link/link.stderr.txt
          LINK_RC=$?
          set -e
          printf '%s\n' "$LINK_RC" > evidence/v44-link/link.exit.txt

          if [ "$LINK_RC" -eq 0 ]; then
            test -s evidence/v44-link/lowalt-p-exact.mjs
            test -s evidence/v44-link/lowalt-p-exact.wasm
            sha256sum evidence/v44-link/lowalt-p-exact.mjs evidence/v44-link/lowalt-p-exact.wasm > evidence/v44-link/module-sha256.txt
            wc -c evidence/v44-link/lowalt-p-exact.mjs evidence/v44-link/lowalt-p-exact.wasm > evidence/v44-link/module-size.txt
            printf 'status=PASS\nclassification=STRICT_WORKER_LOADABLE_P_MODULE_LINK_PASS_PRE_RESULT\n' > evidence/v44-receipt.txt
          else
            printf 'status=FAIL\nclassification=STRICT_WORKER_LOADABLE_P_MODULE_LINK_FIRST_FALSE_FROZEN\nlink_exit=%s\n' "$LINK_RC" > evidence/v44-receipt.txt
          fi

          cat >> evidence/v44-receipt.txt <<'EOF_V44_BOUNDARY'
          actual_p_object_bytes_preserved=true
          exact_p_source_bytes_preserved=true
          source_or_dependency_identity_changed=false
          wasm_instantiated=false
          p_numerical_evaluated=false
          raw_byte_p_to_t_marshalling=false
          t_called=false
          spectrum_401_evaluated=false
          lt5_result=false
          c_executed=false
          d_executed=false
          b_selected=false
          b_resolved=false
          production_changed=false
          EOF_V44_BOUNDARY
          sha256sum evidence/v44-receipt.txt evidence/v44-link/* evidence/v44-p-objects/* evidence/v44-p-source/* > evidence/v44-final-sha256.txt

          # A failed strict link is the next source-derived closure diagnostic, never a reason to weaken undefined-symbol rules.
          exit "$LINK_RC"

      - name: Upload immutable V44 pre-result evidence and exact P bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-worker-module-v44
          path: |
            evidence
            work/evidence
            bootstrap
          if-no-files-found: warn
          retention-days: 90
