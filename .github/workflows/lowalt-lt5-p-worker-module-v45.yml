name: LowAlt LT5 P Worker Module Closure V45

on:
  push:
    branches:
      - review/lowalt-lt5-p-worker-module-v45-20260917
    paths:
      - .github/workflows/lowalt-lt5-p-worker-module-v45.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Replay exact V44 with absolute pinned llvm-nm locator only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p bootstrap evidence

          V44_HEAD=90c133cbed4abe673027799bed6e5b92b2a1b1bb
          V44_BLOB=c064715673fcf8c349e106f69f82f9a4325cd4b0
          V44_RUN=35294140337
          V44_JOB=105443049867
          V44_ARTIFACT=10526194945
          V44_ARTIFACT_DIGEST=92c8d8691ad4123b800317103026e0b47e0e00def6461329669fd3c4b9e508a4
          V44_ANCILLARY_SHA256=4eec846ea3a3f095efee7dfad7d096de0c209f5b8ae6ed9b12793c0ffdaa7282
          V44_NETCDF_FUNCTIONS_SHA256=1f53dbb2a24a322bbc48d7d7dc8bf15f84a91dca496c0327fed2eca336163a43
          PINNED_LLVM_NM=/opt/emsdk/upstream/bin/llvm-nm

          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/lowalt-lt5-p-worker-module-v44.yml?ref=${V44_HEAD}" \
            -o bootstrap/v44.yml
          test "$(git hash-object bootstrap/v44.yml)" = "$V44_BLOB"

          awk '
            /^        run: \|$/ { capture=1; next }
            capture && /^      - name: Upload immutable V44 pre-result evidence and exact P bytes$/ { exit }
            capture { sub(/^          /, ""); print }
          ' bootstrap/v44.yml > bootstrap/v44-run.sh
          test "$(grep -c '^set -euo pipefail$' bootstrap/v44-run.sh)" = 1
          bash -n bootstrap/v44-run.sh

          python3 - <<'PY_V45'
          from pathlib import Path
          from difflib import unified_diff
          p = Path('bootstrap/v44-run.sh')
          before = p.read_text()
          old = 'LLVM_NM="$(command -v llvm-nm)"\n'
          new = (
              'LLVM_NM=/opt/emsdk/upstream/bin/llvm-nm\n'
              'test -x "$LLVM_NM"\n'
              'printf \'locator=absolute_pinned_emsdk_upstream_bin\\npath=%s\\n\' "$LLVM_NM" > evidence/v44-link/llvm-nm-locator.txt\n'
          )
          assert before.count(old) == 1, before.count(old)
          assert before.count('/opt/emsdk/upstream/bin/llvm-nm') == 0
          after = before.replace(old, new, 1)
          d = ''.join(unified_diff(before.splitlines(True), after.splitlines(True), fromfile='v44-run', tofile='v45-run-llvm-nm-locator-only'))
          assert d
          Path('evidence/v45-v44-llvm-nm-locator-only.diff').write_text(d)
          Path('bootstrap/v45-run.sh').write_text(after)
          PY_V45
          bash -n bootstrap/v45-run.sh
          sha256sum bootstrap/v44.yml bootstrap/v44-run.sh bootstrap/v45-run.sh evidence/v45-v44-llvm-nm-locator-only.diff > evidence/v45-preexecution-sha256.txt

          cat > evidence/v45-preexecution-receipt.txt <<EOF_V45_PRE
          status=PRE_RESULT_V45_V44_LLVM_NM_LOCATOR_ONLY_REPAIR_FROZEN
          predecessor_v44_head=${V44_HEAD}
          predecessor_v44_blob=${V44_BLOB}
          predecessor_v44_run=${V44_RUN}
          predecessor_v44_job=${V44_JOB}
          predecessor_v44_artifact=${V44_ARTIFACT}
          predecessor_v44_artifact_digest=sha256:${V44_ARTIFACT_DIGEST}
          predecessor_v44_first_false=LLVM_NM_COMMAND_V_LOOKUP_NOT_ON_EMSDK_PATH_BEFORE_LINK
          replacement_locator=${PINNED_LLVM_NM}
          expected_ancillary_o_sha256=${V44_ANCILLARY_SHA256}
          expected_netCDF_functions_o_sha256=${V44_NETCDF_FUNCTIONS_SHA256}
          source_or_dependency_identity_changed=false
          compiler_or_link_flags_changed=false
          strict_undefined_symbol_policy_changed=false
          wasm_instantiated=false
          p_numerical_evaluated=false
          raw_byte_p_to_t_marshalling=false
          t_called=false
          spectrum_401_evaluated=false
          lt5_result=false
          c_executed=false
          d_executed=false
          b_selected=false
          b_resolved=false
          production_changed=false
          EOF_V45_PRE
          sha256sum evidence/v45-preexecution-receipt.txt >> evidence/v45-preexecution-sha256.txt

          set +e
          bash bootstrap/v45-run.sh
          CHILD_RC=$?
          set -e
          printf '%s\n' "$CHILD_RC" > evidence/v45-child.exit.txt

          if [ -f evidence/v44-receipt.txt ]; then
            cp evidence/v44-receipt.txt evidence/v45-inherited-link-receipt.txt
          fi
          if [ -f evidence/v44-link/link.stderr.txt ]; then
            cp evidence/v44-link/link.stderr.txt evidence/v45-link.stderr.txt
          fi
          if [ -f evidence/v44-link/link.stdout.txt ]; then
            cp evidence/v44-link/link.stdout.txt evidence/v45-link.stdout.txt
          fi
          if [ -f evidence/v44-link/link.exit.txt ]; then
            cp evidence/v44-link/link.exit.txt evidence/v45-link.exit.txt
          fi
          if [ -f evidence/v44-link/llvm-nm-locator.txt ]; then
            cp evidence/v44-link/llvm-nm-locator.txt evidence/v45-llvm-nm-locator.txt
          fi
          if [ -f evidence/v44-link/llvm-nm-version.txt ]; then
            cp evidence/v44-link/llvm-nm-version.txt evidence/v45-llvm-nm-version.txt
          fi
          if [ -f evidence/v44-link/module-sha256.txt ]; then
            cp evidence/v44-link/module-sha256.txt evidence/v45-module-sha256.txt
          fi
          if [ -f evidence/v44-link/module-size.txt ]; then
            cp evidence/v44-link/module-size.txt evidence/v45-module-size.txt
          fi

          if [ "$CHILD_RC" -eq 0 ]; then
            test -f evidence/v44-receipt.txt
            grep -Fxq 'status=PASS' evidence/v44-receipt.txt
            grep -Fxq 'classification=STRICT_WORKER_LOADABLE_P_MODULE_LINK_PASS_PRE_RESULT' evidence/v44-receipt.txt
            printf 'status=PASS\nclassification=V45_STRICT_WORKER_LOADABLE_P_MODULE_LINK_PASS_PRE_RESULT_AFTER_LOCATOR_ONLY_REPAIR\n' > evidence/v45-receipt.txt
          elif [ -f evidence/v44-receipt.txt ]; then
            printf 'status=FAIL\nclassification=V45_STRICT_WORKER_LOADABLE_P_MODULE_LINK_FIRST_FALSE_FROZEN_AFTER_LOCATOR_ONLY_REPAIR\nchild_exit=%s\n' "$CHILD_RC" > evidence/v45-receipt.txt
          else
            printf 'status=FAIL\nclassification=V45_PRELINK_FIRST_FALSE_FROZEN_AFTER_LOCATOR_ONLY_REPAIR\nchild_exit=%s\n' "$CHILD_RC" > evidence/v45-receipt.txt
          fi

          cat >> evidence/v45-receipt.txt <<'EOF_V45_BOUNDARY'
          actual_p_object_bytes_preserved=true
          exact_p_source_bytes_preserved=true
          source_or_dependency_identity_changed=false
          compiler_or_link_flags_changed=false
          strict_undefined_symbol_policy_changed=false
          wasm_instantiated=false
          p_numerical_evaluated=false
          raw_byte_p_to_t_marshalling=false
          t_called=false
          spectrum_401_evaluated=false
          lt5_result=false
          c_executed=false
          d_executed=false
          b_selected=false
          b_resolved=false
          production_changed=false
          EOF_V45_BOUNDARY
          sha256sum evidence/v45-* > evidence/v45-final-sha256.txt
          exit "$CHILD_RC"

      - name: Upload immutable V45 pre-result evidence and exact P bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-worker-module-v45
          path: |
            evidence
            work/evidence
            bootstrap
          if-no-files-found: warn
          retention-days: 90
