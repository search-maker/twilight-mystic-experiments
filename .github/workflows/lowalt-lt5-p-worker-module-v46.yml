name: LowAlt LT5 P Worker Module Closure V46

on:
  push:
    branches:
      - review/lowalt-lt5-p-worker-module-v46-20260917
    paths:
      - .github/workflows/lowalt-lt5-p-worker-module-v46.yml

permissions:
  contents: read
  actions: read

jobs:
  build-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Freeze complete unresolved set and minimum authoritative source closure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p bootstrap evidence/v46-diagnostic evidence/v46-closure evidence/v46-link

          V45_HEAD=95f338afd55bef8f730574f80a19fd5e38fedc46
          V45_BLOB=5694b0e30096e64ef9a16a849df9b49e33729750
          V45_RUN=35294611717
          V45_JOB=105444467741
          V45_ARTIFACT=10527500901
          V45_ARTIFACT_DIGEST=58c2efaacc8d8c24e158c381cba9774adcdce639a7da949bc58daab5b5433e93
          ANCILLARY_SHA256=4eec846ea3a3f095efee7dfad7d096de0c209f5b8ae6ed9b12793c0ffdaa7282
          NETCDF_FUNCTIONS_SHA256=1f53dbb2a24a322bbc48d7d7dc8bf15f84a91dca496c0327fed2eca336163a43
          PINNED_LLVM_NM=/opt/emsdk/upstream/bin/llvm-nm

          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/lowalt-lt5-p-worker-module-v45.yml?ref=${V45_HEAD}" \
            -o bootstrap/v45.yml
          test "$(git hash-object bootstrap/v45.yml)" = "$V45_BLOB"
          awk '
            /^        run: \|$/ { capture=1; next }
            capture && /^      - name: Upload immutable V45 pre-result evidence and exact P bytes$/ { exit }
            capture { sub(/^          /, ""); print }
          ' bootstrap/v45.yml > bootstrap/v45-run.sh
          test "$(grep -c '^set -euo pipefail$' bootstrap/v45-run.sh)" = 1
          bash -n bootstrap/v45-run.sh
          sha256sum bootstrap/v45.yml bootstrap/v45-run.sh > evidence/v46-predecessor-sha256.txt

          cat > evidence/v46-preexecution-receipt.txt <<EOF_V46_PRE
          status=PRE_RESULT_V46_COMPLETE_STRICT_UNRESOLVED_AND_MINIMUM_SOURCE_CLOSURE_FROZEN
          predecessor_v45_head=${V45_HEAD}
          predecessor_v45_blob=${V45_BLOB}
          predecessor_v45_run=${V45_RUN}
          predecessor_v45_job=${V45_JOB}
          predecessor_v45_artifact=${V45_ARTIFACT}
          predecessor_v45_artifact_digest=sha256:${V45_ARTIFACT_DIGEST}
          expected_ancillary_o_sha256=${ANCILLARY_SHA256}
          expected_netCDF_functions_o_sha256=${NETCDF_FUNCTIONS_SHA256}
          diagnostic_only_error_limit_zero=true
          strict_undefined_symbol_policy_changed=false
          guessed_stubs=false
          semantic_substitution=false
          wasm_instantiated=false
          p_numerical_evaluated=false
          raw_byte_p_to_t_marshalling=false
          t_called=false
          spectrum_401_evaluated=false
          lt5_result=false
          c_executed=false
          d_executed=false
          b_selected=false
          b_resolved=false
          production_changed=false
          EOF_V46_PRE

          # Replay exact V45 once. Its expected strict-link failure leaves the exact source,
          # dependency tree, P objects and frozen evidence in this workspace.
          set +e
          bash bootstrap/v45-run.sh
          V45_RC=$?
          set -e
          printf '%s\n' "$V45_RC" > evidence/v46-v45-replay.exit.txt
          test "$V45_RC" -ne 0
          grep -Fxq 'classification=V45_STRICT_WORKER_LOADABLE_P_MODULE_LINK_FIRST_FALSE_FROZEN_AFTER_LOCATOR_ONLY_REPAIR' evidence/v45-receipt.txt
          test "$(sha256sum work/ancillary.o | awk '{print $1}')" = "$ANCILLARY_SHA256"
          test "$(sha256sum work/netCDF_functions.o | awk '{print $1}')" = "$NETCDF_FUNCTIONS_SHA256"
          test -f work/p-generated-abi.h
          test -d work/libRadtran-2.0.6

          source /opt/emsdk/emsdk_env.sh >/dev/null
          EMCC="$(command -v emcc)"
          LLVM_NM="$PINNED_LLVM_NM"
          test -x "$LLVM_NM"
          "$EMCC" --version > evidence/v46-diagnostic/emcc-version.txt 2>&1
          "$LLVM_NM" --version > evidence/v46-diagnostic/llvm-nm-version.txt 2>&1
          PREFIX="$(pwd)/work/install"
          ROOT="$(pwd)/work/libRadtran-2.0.6"

          # Same strict V45 link, with only wasm-ld --error-limit=0 added for complete
          # diagnostic enumeration. ERROR_ON_UNDEFINED_SYMBOLS remains enabled.
          set +e
          "$EMCC" -O0 \
            work/ancillary.o work/netCDF_functions.o \
            "$PREFIX/lib/libnetcdf.a" "$PREFIX/lib/libhdf5_hl.a" "$PREFIX/lib/libhdf5.a" "$PREFIX/lib/libz.a" \
            -sERROR_ON_UNDEFINED_SYMBOLS=1 \
            -sMODULARIZE=1 \
            -sEXPORT_ES6=1 \
            -sENVIRONMENT=worker \
            -sALLOW_MEMORY_GROWTH=0 \
            -sEXPORTED_FUNCTIONS='["_optical_properties","_malloc","_free"]' \
            -sEXPORTED_RUNTIME_METHODS='[]' \
            -Wl,--no-entry \
            -Wl,--error-limit=0 \
            -o evidence/v46-diagnostic/diagnostic-only.mjs \
            > evidence/v46-diagnostic/link.stdout.txt 2> evidence/v46-diagnostic/link.stderr.txt
          DIAG_RC=$?
          set -e
          printf '%s\n' "$DIAG_RC" > evidence/v46-diagnostic/link.exit.txt
          test "$DIAG_RC" -ne 0

          python3 - <<'PY_PARSE'
          import re
          from pathlib import Path
          text = Path('evidence/v46-diagnostic/link.stderr.txt').read_text(errors='replace')
          pats = [
              r'undefined symbol:\s*[`\'\"]?([^\s`\'\"]+)',
              r'error: undefined symbol:\s*([^\s]+)',
          ]
          syms = set()
          for pat in pats:
              for m in re.finditer(pat, text):
                  s = m.group(1).strip('`\'\":,')
                  if s:
                      syms.add(s)
          out = sorted(syms)
          if not out:
              raise SystemExit('no unresolved symbols parsed from complete diagnostic')
          Path('evidence/v46-diagnostic/unresolved-complete.txt').write_text('\n'.join(out)+'\n')
          known = {
              'chkerr','ASCII_calloc_float_3D','chkerr_out','create_phase_from_HG',
              'create_phase_from_Rayleigh','sort_theta_and_mu','fct_err_out',
              'interpolate_phase_weighted'
          }
          missing = sorted(known-set(out))
          if missing:
              raise SystemExit('V45 frozen first-symbol set not reproduced: '+','.join(missing))
          Path('evidence/v46-diagnostic/unresolved-count.txt').write_text(str(len(out))+'\n')
          PY_PARSE
          sha256sum evidence/v46-diagnostic/unresolved-complete.txt evidence/v46-diagnostic/link.stderr.txt > evidence/v46-diagnostic/diagnostic-sha256.txt

          # Build the minimum ordinary libRadtran C closure by source provenance. A source
          # is selected only when it uniquely defines a currently unresolved internal
          # symbol. Transitive internal symbols from each selected object are then resolved
          # by the same rule. No stub or replacement implementation is permitted.
          set +e
          EMCC="$EMCC" LLVM_NM="$LLVM_NM" ROOT="$ROOT" PREFIX="$PREFIX" python3 - <<'PY_CLOSURE'
          import csv, hashlib, os, re, subprocess, sys
          from pathlib import Path

          root = Path(os.environ['ROOT'])
          prefix = Path(os.environ['PREFIX'])
          emcc = os.environ['EMCC']
          nm = os.environ['LLVM_NM']
          evidence = Path('evidence/v46-closure')
          objdir = evidence / 'objects'
          objdir.mkdir(parents=True, exist_ok=True)
          abi = Path('work/p-generated-abi.h').resolve()
          initial = [x.strip() for x in Path('evidence/v46-diagnostic/unresolved-complete.txt').read_text().splitlines() if x.strip()]

          search_dirs = [root/'libsrc_c', root/'src_c', root/'src']
          sources = []
          for d in search_dirs:
              if d.is_dir():
                  sources.extend(sorted(d.glob('*.c')))
          if not sources:
              raise SystemExit(81)

          makefiles = sorted(root.rglob('Makefile.am')) + sorted(root.rglob('Makefile.in'))
          make_text = {p: p.read_text(errors='replace') for p in makefiles}

          def source_hash(p):
              return hashlib.sha256(p.read_bytes()).hexdigest()

          def unique_definition(sym):
              esc = re.escape(sym)
              pat = re.compile(r'\b'+esc+r'\s*\([^;{}]{0,4000}\)\s*\{', re.S)
              hits = []
              for p in sources:
                  t = p.read_text(errors='replace')
                  if pat.search(t):
                      hits.append(p)
              return hits

          def provenance(p):
              rel = p.relative_to(root).as_posix()
              base = p.name
              hits = []
              for mf, txt in make_text.items():
                  if base in txt or rel in txt:
                      hits.append(mf.relative_to(root).as_posix())
              return ';'.join(sorted(set(hits))) if hits else 'NO_BUILD_MANIFEST_MATCH'

          cflags = [
              '-O0','-std=gnu11','-include',str(abi),'-c',
          ]
          includes = [
              '-I'+str(root), '-I'+str(root/'src'), '-I'+str(root/'src_c'),
              '-I'+str(root/'libsrc_c'), '-I'+str(root/'libsrc_f'), '-I'+str(prefix/'include')
          ]

          selected = {}
          mapping = {}
          external = set()
          queue = list(initial)
          seen = set()
          compile_log = []

          while queue:
              sym = queue.pop(0)
              if sym in seen:
                  continue
              seen.add(sym)
              hits = unique_definition(sym)
              if not hits:
                  external.add(sym)
                  continue
              if len(hits) != 1:
                  Path(evidence/'ambiguous-symbol.txt').write_text(sym+'\n'+'\n'.join(str(x.relative_to(root)) for x in hits)+'\n')
                  raise SystemExit(82)
              src = hits[0]
              rel = src.relative_to(root).as_posix()
              prov = provenance(src)
              if prov == 'NO_BUILD_MANIFEST_MATCH':
                  Path(evidence/'unproven-build-source.txt').write_text(sym+'\n'+rel+'\n')
                  raise SystemExit(83)
              mapping[sym] = (rel, prov, source_hash(src))
              if rel in selected:
                  continue

              safe = re.sub(r'[^A-Za-z0-9_.-]+','_',rel)
              obj = objdir/(safe+'.o')
              stdout = evidence/(safe+'.compile.stdout.txt')
              stderr = evidence/(safe+'.compile.stderr.txt')
              cmd = [emcc] + cflags + [str(src)] + includes + ['-o',str(obj)]
              cp = subprocess.run(cmd, stdout=stdout.open('wb'), stderr=stderr.open('wb'))
              compile_log.append((rel, cp.returncode, ' '.join(cmd)))
              if cp.returncode != 0:
                  Path(evidence/'compile-first-false.txt').write_text(f'source={rel}\ntrigger_symbol={sym}\nexit={cp.returncode}\n')
                  raise SystemExit(84)
              selected[rel] = obj

              nmu = subprocess.run([nm,'--undefined-only',str(obj)], text=True, capture_output=True, check=True).stdout
              (evidence/(safe+'.undefined.txt')).write_text(nmu)
              for line in nmu.splitlines():
                  parts = line.split()
                  if not parts:
                      continue
                  usym = parts[-1]
                  if usym.startswith('__'):
                      continue
                  if usym not in seen:
                      if unique_definition(usym):
                          queue.append(usym)
                      else:
                          external.add(usym)

          with (evidence/'symbol-source-provenance.csv').open('w', newline='') as f:
              w = csv.writer(f)
              w.writerow(['symbol','source','source_sha256','build_provenance'])
              for sym in sorted(mapping):
                  rel, prov, sha = mapping[sym]
                  w.writerow([sym,rel,sha,prov])
          Path(evidence/'selected-sources.txt').write_text('\n'.join(sorted(selected))+'\n')
          Path(evidence/'external-or-toolchain-symbols.txt').write_text('\n'.join(sorted(external))+'\n')
          with (evidence/'compile-commands.tsv').open('w') as f:
              for rel, rc, cmd in compile_log:
                  f.write(f'{rel}\t{rc}\t{cmd}\n')
          with (evidence/'selected-objects.txt').open('w') as f:
              for rel in sorted(selected):
                  f.write(str(selected[rel])+'\n')
          with (evidence/'selected-object-sha256.txt').open('w') as f:
              for rel in sorted(selected):
                  p = selected[rel]
                  f.write(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+str(p)+'\n')

          initial_internal = sorted(s for s in initial if s in mapping)
          initial_unmapped = sorted(s for s in initial if s not in mapping)
          Path(evidence/'initial-internal-mapped.txt').write_text('\n'.join(initial_internal)+'\n')
          Path(evidence/'initial-unmapped.txt').write_text('\n'.join(initial_unmapped)+'\n')
          if initial_unmapped:
              # Initial strict-link unresolved entries must all be source-mapped or explicitly
              # proven external by the linker's own libraries at the final strict link.
              Path(evidence/'initial-unmapped-present.txt').write_text('true\n')
          else:
              Path(evidence/'initial-unmapped-present.txt').write_text('false\n')
          PY_CLOSURE
          CLOSURE_RC=$?
          set -e
          printf '%s\n' "$CLOSURE_RC" > evidence/v46-closure/closure.exit.txt

          if [ "$CLOSURE_RC" -ne 0 ]; then
            cat > evidence/v46-receipt.txt <<EOF_V46_FAIL
          status=FAIL
          classification=V46_SOURCE_DERIVED_CLOSURE_FIRST_FALSE_FROZEN_BEFORE_FINAL_STRICT_LINK
          closure_exit=${CLOSURE_RC}
          complete_unresolved_set_frozen=true
          strict_undefined_symbol_policy_changed=false
          guessed_stubs=false
          semantic_substitution=false
          wasm_instantiated=false
          p_numerical_evaluated=false
          raw_byte_p_to_t_marshalling=false
          t_called=false
          spectrum_401_evaluated=false
          lt5_result=false
          c_executed=false
          d_executed=false
          b_selected=false
          b_resolved=false
          production_changed=false
          EOF_V46_FAIL
            sha256sum evidence/v46-receipt.txt evidence/v46-diagnostic/* evidence/v46-closure/* 2>/dev/null > evidence/v46-final-sha256.txt || true
            exit "$CLOSURE_RC"
          fi

          # Freeze the complete mapped closure before the final strict link.
          sha256sum evidence/v46-closure/symbol-source-provenance.csv \
            evidence/v46-closure/selected-sources.txt \
            evidence/v46-closure/selected-object-sha256.txt \
            evidence/v46-closure/compile-commands.tsv \
            > evidence/v46-closure/closure-freeze-sha256.txt
          cp evidence/v46-closure/selected-sources.txt evidence/v46-closure/selected-sources-frozen-before-link.txt

          mapfile -t CLOSURE_OBJECTS < evidence/v46-closure/selected-objects.txt
          set +e
          "$EMCC" -O0 \
            work/ancillary.o work/netCDF_functions.o "${CLOSURE_OBJECTS[@]}" \
            "$PREFIX/lib/libnetcdf.a" "$PREFIX/lib/libhdf5_hl.a" "$PREFIX/lib/libhdf5.a" "$PREFIX/lib/libz.a" \
            -sERROR_ON_UNDEFINED_SYMBOLS=1 \
            -sMODULARIZE=1 \
            -sEXPORT_ES6=1 \
            -sENVIRONMENT=worker \
            -sALLOW_MEMORY_GROWTH=0 \
            -sEXPORTED_FUNCTIONS='["_optical_properties","_malloc","_free"]' \
            -sEXPORTED_RUNTIME_METHODS='[]' \
            -Wl,--no-entry \
            -o evidence/v46-link/lowalt-p-exact.mjs \
            > evidence/v46-link/link.stdout.txt 2> evidence/v46-link/link.stderr.txt
          LINK_RC=$?
          set -e
          printf '%s\n' "$LINK_RC" > evidence/v46-link/link.exit.txt

          if [ "$LINK_RC" -eq 0 ]; then
            test -s evidence/v46-link/lowalt-p-exact.mjs
            test -s evidence/v46-link/lowalt-p-exact.wasm
            sha256sum evidence/v46-link/lowalt-p-exact.mjs evidence/v46-link/lowalt-p-exact.wasm > evidence/v46-link/module-sha256.txt
            wc -c evidence/v46-link/lowalt-p-exact.mjs evidence/v46-link/lowalt-p-exact.wasm > evidence/v46-link/module-size.txt
            CLASS=V46_STRICT_WORKER_LOADABLE_P_MODULE_LINK_PASS_PRE_RESULT_SOURCE_DERIVED_CLOSURE
          else
            python3 - <<'PY_FIRST'
          import re
          from pathlib import Path
          text=Path('evidence/v46-link/link.stderr.txt').read_text(errors='replace')
          m=re.search(r'undefined symbol:\s*[`\'\"]?([^\s`\'\"]+)', text)
          Path('evidence/v46-link/next-first-false.txt').write_text((m.group(1).strip('`\'\":,') if m else 'NON_SYMBOL_LINK_FAILURE')+'\n')
          PY_FIRST
            CLASS=V46_STRICT_WORKER_LOADABLE_P_MODULE_LINK_NEXT_SOURCE_DERIVED_FIRST_FALSE_FROZEN
          fi

          cat > evidence/v46-receipt.txt <<EOF_V46_FINAL
          status=$([ "$LINK_RC" -eq 0 ] && echo PASS || echo FAIL)
          classification=${CLASS}
          predecessor_v45_head=${V45_HEAD}
          predecessor_v45_run=${V45_RUN}
          predecessor_v45_artifact=${V45_ARTIFACT}
          predecessor_v45_artifact_digest=sha256:${V45_ARTIFACT_DIGEST}
          complete_unresolved_set_frozen=true
          source_provenance_mapping_frozen=true
          minimum_source_closure_frozen_before_link=true
          exact_v45_p_objects_preserved=true
          exact_v45_toolchain_abi_link_semantics_preserved=true
          strict_undefined_symbol_policy_changed=false
          guessed_stubs=false
          semantic_substitution=false
          wasm_instantiated=false
          p_numerical_evaluated=false
          raw_byte_p_to_t_marshalling=false
          t_called=false
          spectrum_401_evaluated=false
          lt5_result=false
          c_executed=false
          d_executed=false
          b_selected=false
          b_resolved=false
          production_changed=false
          EOF_V46_FINAL
          sha256sum evidence/v46-receipt.txt evidence/v46-preexecution-receipt.txt \
            evidence/v46-diagnostic/* evidence/v46-closure/* evidence/v46-link/* 2>/dev/null \
            > evidence/v46-final-sha256.txt || true
          exit "$LINK_RC"

      - name: Upload immutable V46 PRE-RESULT evidence and exact closure bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-worker-module-v46
          path: |
            evidence
            work/evidence
            bootstrap
          if-no-files-found: warn
          retention-days: 90
