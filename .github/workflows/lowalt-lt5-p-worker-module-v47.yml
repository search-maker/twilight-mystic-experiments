name: LowAlt LT5 P Worker Module Closure V47

on:
  push:
    branches:
      - review/lowalt-lt5-p-worker-module-v47-20260917
    paths:
      - .github/workflows/lowalt-lt5-p-worker-module-v47.yml

permissions:
  contents: read
  actions: read

jobs:
  build-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Repair only V46 outer-wrapper pathname collision and continue frozen closure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p bootstrap evidence/v47-wrapper

          V46_HEAD=0f49e9e8ddfdfec39c224b86fa615420ad84e9a0
          V46_BLOB=18393075b4f0fde7eaaa966e686600bee429b567

          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/lowalt-lt5-p-worker-module-v46.yml?ref=${V46_HEAD}" \
            -o bootstrap/v46.yml
          test "$(git hash-object bootstrap/v46.yml)" = "$V46_BLOB"

          awk '
            /^        run: \|$/ { capture=1; next }
            capture && /^      - name: Upload immutable V46 PRE-RESULT evidence and exact closure bytes$/ { exit }
            capture { sub(/^          /, ""); print }
          ' bootstrap/v46.yml > bootstrap/v46-run-original.sh
          test "$(grep -c '^set -euo pipefail$' bootstrap/v46-run-original.sh)" = 1
          bash -n bootstrap/v46-run-original.sh

          python3 - <<'PY_FIX'
          from pathlib import Path
          src = Path('bootstrap/v46-run-original.sh')
          dst = Path('bootstrap/v46-run-v47.sh')
          text = src.read_text()
          old = 'bootstrap/v45-run.sh'
          new = 'bootstrap/v45-wrapper-run.sh'
          count = text.count(old)
          if count != 4:
              raise SystemExit(f'expected exactly 4 outer-wrapper pathname references, found {count}')
          fixed = text.replace(old, new)
          if fixed.count(old) != 0:
              raise SystemExit('old outer-wrapper pathname remains after bounded repair')
          if fixed.count(new) != 4:
              raise SystemExit('unexpected repaired pathname cardinality')
          dst.write_text(fixed)
          Path('evidence/v47-wrapper/replacement-count.txt').write_text('4\n')
          PY_FIX
          bash -n bootstrap/v46-run-v47.sh

          diff -u bootstrap/v46-run-original.sh bootstrap/v46-run-v47.sh > evidence/v47-wrapper/pathname-only.diff || true
          test "$(grep -c '^-.*bootstrap/v45-run.sh' evidence/v47-wrapper/pathname-only.diff)" = 4
          test "$(grep -c '^+.*bootstrap/v45-wrapper-run.sh' evidence/v47-wrapper/pathname-only.diff)" = 4
          test "$(grep -Ec '^[+-]' evidence/v47-wrapper/pathname-only.diff)" = 8
          sha256sum bootstrap/v46.yml bootstrap/v46-run-original.sh bootstrap/v46-run-v47.sh > evidence/v47-wrapper/wrapper-sha256.txt

          cat > evidence/v47-wrapper/preexecution-receipt.txt <<EOF_V47_PRE
          status=PRE_RESULT_V47_V46_PATHNAME_COLLISION_ONLY_REPAIR
          predecessor_v46_head=${V46_HEAD}
          predecessor_v46_blob=${V46_BLOB}
          original_outer_path=bootstrap/v45-run.sh
          repaired_outer_path=bootstrap/v45-wrapper-run.sh
          exact_replacement_count=4
          inner_v45_path_preserved_by_runtime_fetch=true
          v45_v46_source_object_toolchain_abi_link_semantics_changed=false
          strict_undefined_symbol_policy_changed=false
          guessed_stubs=false
          semantic_substitution=false
          wasm_instantiated=false
          p_numerical_evaluated=false
          raw_byte_p_to_t_marshalling=false
          t_called=false
          spectrum_401_evaluated=false
          lt5_result=false
          c_executed=false
          d_executed=false
          b_selected=false
          b_resolved=false
          production_changed=false
          EOF_V47_PRE

          set +e
          bash bootstrap/v46-run-v47.sh
          V47_RC=$?
          set -e
          printf '%s\n' "$V47_RC" > evidence/v47-wrapper/v47.exit.txt

          V45_REPLAY_SAME_BLOCKER=false
          if [ -f evidence/v45-receipt.txt ] && grep -Fxq 'classification=V45_STRICT_WORKER_LOADABLE_P_MODULE_LINK_FIRST_FALSE_FROZEN_AFTER_LOCATOR_ONLY_REPAIR' evidence/v45-receipt.txt; then
            V45_REPLAY_SAME_BLOCKER=true
          fi

          cat > evidence/v47-wrapper/final-receipt.txt <<EOF_V47_FINAL
          status=$( [ "$V47_RC" -eq 0 ] && echo PASS || echo FAIL )
          classification=V47_V46_PATHNAME_COLLISION_ONLY_REPAIR_REPLAY_COMPLETED
          corrected_v46_script_exit=${V47_RC}
          v45_replay_same_strict_source_linker_blocker=${V45_REPLAY_SAME_BLOCKER}
          exact_replacement_count=4
          strict_undefined_symbol_policy_changed=false
          guessed_stubs=false
          semantic_substitution=false
          wasm_instantiated=false
          p_numerical_evaluated=false
          raw_byte_p_to_t_marshalling=false
          t_called=false
          spectrum_401_evaluated=false
          lt5_result=false
          c_executed=false
          d_executed=false
          b_selected=false
          b_resolved=false
          production_changed=false
          EOF_V47_FINAL

          exit "$V47_RC"

      - name: Upload immutable V47 PRE-RESULT evidence and exact closure bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-worker-module-v47
          path: |
            evidence
            work/evidence
            bootstrap
          if-no-files-found: warn
