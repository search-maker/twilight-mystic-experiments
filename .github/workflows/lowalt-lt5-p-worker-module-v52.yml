name: LowAlt LT5 P Worker Module Closure V52

on:
  push:
    branches:
      - review/lowalt-lt5-p-worker-module-v52-20260918
    paths:
      - .github/workflows/lowalt-lt5-p-worker-module-v52.yml

permissions:
  contents: read
  actions: read

jobs:
  build-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Deterministically reconstruct exact authorized script and execute PRE-RESULT only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          V45_RECEIPT_SHA256: 6c22914a6f18c606b22e84ead35619c3937bb1f5d1e7789c7aa666860d90f371
          V45_LINK_STDOUT_SHA256: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
          V45_LINK_EXIT_SHA256: 4355a46b19d348dc2f57c046f8ef63d4538ebb936000f3c9ee954a27460dd865
          V45_INHERITED_RECEIPT_SHA256: daae684393217051439df0b8d3f542c88a412eeac45b437e9573a3df5d81a412
          V45_INNER_RUN_SHA256: d76c53a0940dc7d778166a6466b069063f1e483140bfd5624f7a7a8d189bd710
          V45_LLVM_NM_LOCATOR_SHA256: 1dcc365566a266b07ebc662f0a8b99f27b9d3796bce16de405ea26b880c1f531
          V45_LLVM_NM_VERSION_SHA256: 8b4411918092993c628345549a73caaf34a62ebb0d55931d308d4f27f34fcd73
          V45_LINK_STDERR_RAW_FROZEN_SHA256: f65d8cdb7545f1f4a460cfc1a08e9cdbacd981b339bbee5508e3c88832d02991
          V45_LINK_STDERR_CANONICAL_SHA256: 4aff8a14790c69b3c81eba8a61ebd8571e865950362997f1a7b849eaac179607
          V45_UNRESOLVED_LINES_SHA256: 6e4a89c2753a2327f35e65df2e3913471308bc64c95aa38708632b895a4724e5
          V45_TOO_MANY_ERRORS_LINE_SHA256: b4f049386ed258204241dd1e25c3ce80704b8981f50663c57c6b9cfd5315d18b
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p bootstrap evidence/v52-wrapper predecessor-v50 transport-v51

          # Exact accepted V50 predecessor binding.
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/10534273752/zip" \
            -o predecessor-v50.zip
          test "$(sha256sum predecessor-v50.zip | awk '{print $1}')" = "d5734b539cc3daa383987d579a5714022c305ff4b385ec422125ebfc4ab47b02"
          unzip -q predecessor-v50.zip -d predecessor-v50
          test "$(sha256sum predecessor-v50/bootstrap/v46-run-v50.sh | awk '{print $1}')" = "ddfe1bfdc48e95887b3e87841a7d3139200032cda4e54907e04163f5dce86320"
          cp predecessor-v50/bootstrap/v46-run-v50.sh bootstrap/v46-run-v50.sh

          # Exact V51 workflow blob is used only as the frozen transport source. No V51
          # analytical observation is consumed. The intended script identity was frozen
          # before V51 execution and is recovered only by that cryptographic identity.
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/lowalt-lt5-p-worker-module-v51.yml?ref=6e9c7bc59ff5153422b989f2ee28a0403fa54d4c" \
            -o transport-v51/v51-workflow-api.json

          python3 - <<'PY_TRANSPORT'
          import base64, gzip, hashlib, itertools, json, re, subprocess, zlib
          from pathlib import Path

          TARGET_SCRIPT_SHA = 'e4608a47964eba236a3681a056b2f4be8704c1ffa7e14c23857bdce323448ddb'
          TARGET_DIFF_SHA = 'de543b76e0444269d4a7dd9e150b762c030edcf734617f11c6ae4ce909b0658e'
          V51_WORKFLOW_BLOB = '5585f3ce09311ebb88de2a5231b813fbe8e63e03'
          ALPHABET = b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          out = Path('evidence/v52-wrapper')
          out.mkdir(parents=True, exist_ok=True)

          obj = json.loads(Path('transport-v51/v51-workflow-api.json').read_text())
          if obj.get('sha') != V51_WORKFLOW_BLOB:
              raise SystemExit('V52_TRANSPORT_FAIL exact V51 workflow blob mismatch')
          workflow = base64.b64decode(obj['content'])
          Path('transport-v51/v51-workflow-source.yml').write_bytes(workflow)
          git_blob = hashlib.sha1(b'blob '+str(len(workflow)).encode()+b'\0'+workflow).hexdigest()
          if git_blob != V51_WORKFLOW_BLOB:
              raise SystemExit('V52_TRANSPORT_FAIL reconstructed V51 workflow Git blob mismatch')

          lines = workflow.splitlines(keepends=True)
          start_marker = b"          cat > bootstrap/v46-run-v51.sh.gz.b64 <<'EOF_V51_SCRIPT'\n"
          end_marker = b'          EOF_V51_SCRIPT\n'
          starts = [i for i,x in enumerate(lines) if x == start_marker]
          ends = [i for i,x in enumerate(lines) if x == end_marker]
          if len(starts) != 1 or len(ends) != 1 or ends[0] <= starts[0]+1:
              raise SystemExit('V52_TRANSPORT_FAIL unique V51 payload markers not found')
          block = lines[starts[0]+1:ends[0]]
          prefix = b'          '
          if not block or any(not x.startswith(prefix) for x in block):
              raise SystemExit('V52_TRANSPORT_FAIL payload indentation is not exact')
          transport = b''.join(x[len(prefix):] for x in block)
          Path('transport-v51/v51-payload-as-executed.b64').write_bytes(transport)
          if b'\r' in transport or b'\t' in transport or b' ' in transport:
              raise SystemExit('V52_TRANSPORT_FAIL unexpected payload whitespace')
          compact = transport.replace(b'\n', b'')
          Path('transport-v51/v51-payload-compact.bin').write_bytes(compact)

          def script_from_compact(c):
              if len(c) % 4:
                  return None
              try:
                  decoded = base64.b64decode(c, validate=True)
              except Exception:
                  return None
              if base64.b64encode(decoded) != c:
                  return None
              try:
                  script = gzip.decompress(decoded)
              except Exception:
                  return None
              if hashlib.sha256(script).hexdigest() != TARGET_SCRIPT_SHA:
                  return None
              return decoded, script

          matches = {}
          exact = script_from_compact(compact)
          if exact is not None:
              matches[compact] = ('exact', exact)

          # Deterministic one-/two-invalid-byte transport repair. This does not select
          # any source/build/science outcome: the sole acceptance predicate is the
          # already-frozen intended script SHA256.
          trailing = len(compact) - len(compact.rstrip(b'='))
          if trailing > 2:
              trailing = 0
          data_end = len(compact) - trailing
          invalid = [i for i,b in enumerate(compact[:data_end]) if b not in ALPHABET]
          if any(b != ord('=') for b in compact[data_end:]):
              invalid.extend(range(data_end, len(compact)))
          if b'=' in compact[:data_end]:
              invalid.extend(i for i,b in enumerate(compact[:data_end]) if b == ord('='))
          invalid = sorted(set(invalid))

          if 1 <= len(invalid) <= 2:
              for repl in itertools.product(ALPHABET, repeat=len(invalid)):
                  c = bytearray(compact)
                  for pos, val in zip(invalid, repl):
                      c[pos] = val
                  cb = bytes(c)
                  got = script_from_compact(cb)
                  if got is not None:
                      matches[cb] = ('replace-invalid:'+','.join(map(str,invalid)), got)
              # Also test pure deletion of the invalid transport bytes when that is
              # structurally possible; acceptance still requires exact intended SHA.
              cdel = bytes(b for i,b in enumerate(compact) if i not in set(invalid))
              got = script_from_compact(cdel)
              if got is not None:
                  matches[cdel] = ('delete-invalid:'+','.join(map(str,invalid)), got)

          # Bounded one-character recovery for structurally valid alphabet-only
          # transport. The search window is localized only by the unchanged V50
          # prefix through line 283, before either authorized V51 diff hunk. It uses
          # no V51 source/build conclusion and accepts only the pre-frozen script SHA.
          def transport_center(c):
              pad = b'=' * ((-len(c)) % 4)
              try:
                  corrupt_decoded = base64.b64decode(c + pad, validate=False)
              except Exception:
                  corrupt_decoded = b''
              v50 = Path('bootstrap/v46-run-v50.sh').read_bytes()
              prefix_len = len(b''.join(v50.splitlines(keepends=True)[:283]))
              d = zlib.decompressobj(16 + zlib.MAX_WBITS)
              produced = 0
              comp_index = None
              for i,b in enumerate(corrupt_decoded):
                  try:
                      chunk = d.decompress(bytes([b]))
                  except zlib.error:
                      comp_index = i
                      break
                  produced += len(chunk)
                  if produced >= prefix_len:
                      comp_index = i
                      break
              if comp_index is None:
                  comp_index = max(0, len(corrupt_decoded)//2)
              return (comp_index // 3) * 4

          if not matches and not invalid:
              center = transport_center(compact)
              lo = max(0, center - 1024)
              hi = min(len(compact), center + 1024)
              mod = len(compact) % 4
              if mod == 3:  # exactly one missing base64 character
                  for pos in range(lo, hi+1):
                      for val in ALPHABET:
                          cb = compact[:pos] + bytes([val]) + compact[pos:]
                          got = script_from_compact(cb)
                          if got is not None:
                              matches[cb] = (f'insert-one@{pos}', got)
              elif mod == 1:  # exactly one extra base64 character
                  for pos in range(lo, min(hi+1, len(compact))):
                      cb = compact[:pos] + compact[pos+1:]
                      got = script_from_compact(cb)
                      if got is not None:
                          matches[cb] = (f'delete-one@{pos}', got)
              elif mod == 0:  # one valid-alphabet substitution
                  for pos in range(lo, min(hi+1, len(compact))):
                      old = compact[pos]
                      if old == ord('='):
                          continue
                      for val in ALPHABET:
                          if val == old:
                              continue
                          cb = compact[:pos] + bytes([val]) + compact[pos+1:]
                          got = script_from_compact(cb)
                          if got is not None:
                              matches[cb] = (f'substitute-one@{pos}', got)

          if len(matches) != 1:
              Path(out/'transport-first-false.txt').write_text(
                  f'unique_exact_script_recovery=false\nmatch_count={len(matches)}\n'
                  f'compact_size={len(compact)}\ncompact_mod4={len(compact)%4}\n'
                  f'invalid_count={len(invalid)}\ninvalid_positions={invalid}\n'
              )
              raise SystemExit('V52_TRANSPORT_FAIL exact intended script recovery was not unique')

          repaired, (method, (gzip_bytes, script)) = next(iter(matches.items()))
          Path('transport-v51/v51-payload-repaired-compact.b64').write_bytes(repaired)
          Path('transport-v51/v51-recovered-script.gz').write_bytes(gzip_bytes)
          Path('bootstrap/v46-run-v52.sh').write_bytes(script)

          # Exact one-source-byte/source-representation freeze and no-ambiguity proof.
          diffs = [(i,a,b) for i,(a,b) in enumerate(zip(compact,repaired)) if a != b]
          length_delta = len(repaired)-len(compact)
          with (out/'transport-repair-table.txt').open('w') as f:
              f.write(f'method={method}\n')
              f.write(f'workflow_git_blob_sha1={git_blob}\n')
              f.write(f'workflow_size={len(workflow)}\n')
              f.write(f'transport_size={len(transport)}\n')
              f.write(f'compact_size_before={len(compact)}\n')
              f.write(f'compact_size_after={len(repaired)}\n')
              f.write(f'length_delta={length_delta}\n')
              f.write(f'invalid_positions_before={invalid}\n')
              f.write(f'same_length_byte_differences={diffs}\n')
              f.write(f'recovered_gzip_size={len(gzip_bytes)}\n')
              f.write(f'recovered_script_size={len(script)}\n')
              f.write(f'recovered_script_sha256={hashlib.sha256(script).hexdigest()}\n')
              f.write(f'canonical_base64_roundtrip={base64.b64encode(gzip_bytes)==repaired}\n')
          hashes = {
              'v51_workflow_source_sha256': hashlib.sha256(workflow).hexdigest(),
              'v51_transport_sha256': hashlib.sha256(transport).hexdigest(),
              'v51_compact_before_sha256': hashlib.sha256(compact).hexdigest(),
              'v51_compact_after_sha256': hashlib.sha256(repaired).hexdigest(),
              'recovered_gzip_sha256': hashlib.sha256(gzip_bytes).hexdigest(),
              'recovered_script_sha256': hashlib.sha256(script).hexdigest(),
          }
          Path(out/'transport-sha256.json').write_text(json.dumps(hashes, sort_keys=True, indent=2)+'\n')

          if hashlib.sha256(script).hexdigest() != TARGET_SCRIPT_SHA:
              raise SystemExit('V52_TRANSPORT_FAIL final script SHA mismatch')
          cp = subprocess.run(['bash','-n','bootstrap/v46-run-v52.sh'])
          if cp.returncode:
              raise SystemExit('V52_TRANSPORT_FAIL recovered script syntax')

          # The exact semantic script is unchanged from the already-frozen intended
          # V51 script: prove with the pre-frozen V50->intended payload diff identity.
          diff = subprocess.run(
              ['diff','-u','bootstrap/v46-run-v50.sh','bootstrap/v46-run-v52.sh'],
              stdout=subprocess.PIPE, check=False).stdout
          Path(out/'v50-to-v52.diff').write_bytes(diff)
          payload_diff = b''.join(
              line for line in diff.splitlines(keepends=True)
              if not (line.startswith(b'--- ') or line.startswith(b'+++ ')))
          Path(out/'v50-to-v52.payload.diff').write_bytes(payload_diff)
          if hashlib.sha256(payload_diff).hexdigest() != TARGET_DIFF_SHA:
              raise SystemExit('V52_TRANSPORT_FAIL semantic payload diff drift')
          if sum(1 for x in diff.splitlines() if x.startswith(b'@@')) != 2:
              raise SystemExit('V52_TRANSPORT_FAIL unexpected diff hunk count')
          PY_TRANSPORT

          test "$(sha256sum bootstrap/v46-run-v52.sh | awk '{print $1}')" = "e4608a47964eba236a3681a056b2f4be8704c1ffa7e14c23857bdce323448ddb"
          bash -n bootstrap/v46-run-v52.sh
          sha256sum bootstrap/v46-run-v50.sh bootstrap/v46-run-v52.sh \
            transport-v51/v51-workflow-source.yml transport-v51/v51-payload-as-executed.b64 \
            transport-v51/v51-payload-compact.bin transport-v51/v51-payload-repaired-compact.b64 \
            transport-v51/v51-recovered-script.gz \
            evidence/v52-wrapper/v50-to-v52.diff evidence/v52-wrapper/v50-to-v52.payload.diff \
            > evidence/v52-wrapper/preexecution-sha256.txt
          wc -c bootstrap/v46-run-v50.sh bootstrap/v46-run-v52.sh \
            transport-v51/v51-workflow-source.yml transport-v51/v51-payload-as-executed.b64 \
            transport-v51/v51-payload-compact.bin transport-v51/v51-payload-repaired-compact.b64 \
            transport-v51/v51-recovered-script.gz \
            > evidence/v52-wrapper/preexecution-size.txt
          cat > evidence/v52-wrapper/preexecution-receipt.txt <<'EOF_V52_PRE'
          status=PASS_PRE_RESULT_V52_DETERMINISTIC_BYTE_PRESERVING_TRANSPORT_ONLY
          predecessor_v50_run=35313898411
          predecessor_v50_artifact=10534273752
          predecessor_v50_artifact_digest=sha256:d5734b539cc3daa383987d579a5714022c305ff4b385ec422125ebfc4ab47b02
          predecessor_v50_script_sha256=ddfe1bfdc48e95887b3e87841a7d3139200032cda4e54907e04163f5dce86320
          transport_source_v51_workflow_head=6e9c7bc59ff5153422b989f2ee28a0403fa54d4c
          transport_source_v51_workflow_blob=5585f3ce09311ebb88de2a5231b813fbe8e63e03
          reconstructed_script_sha256=e4608a47964eba236a3681a056b2f4be8704c1ffa7e14c23857bdce323448ddb
          canonical_payload_diff_sha256=de543b76e0444269d4a7dd9e150b762c030edcf734617f11c6ae4ce909b0658e
          repair_scope=deterministic_transport_only
          v51_analytical_conclusion_consumed=false
          trial_link_selection=false
          filename_preference=false
          guessed_stub=false
          semantic_substitution=false
          wasm_instantiated=false
          p_numerical_evaluated=false
          raw_byte_p_to_t_marshalling=false
          t_called=false
          spectrum_401_evaluated=false
          lt5_result=false
          c_executed=false
          d_executed=false
          b_selected=false
          b_resolved=false
          production_changed=false
          EOF_V52_PRE

          set +e
          bash bootstrap/v46-run-v52.sh
          V52_RC=$?
          set -e
          printf '%s\n' "$V52_RC" > evidence/v52-wrapper/v52-script.exit.txt

          # Mandatory postcondition: any post-replay diagnostic/provenance evidence is
          # authorizing only if the preserved semantic V45 replay gate passed first.
          GATE_FILE=evidence/v50-wrapper/v45-replay-exact-gate.txt
          GATE_PASS=false
          if [ -f "$GATE_FILE" ] && grep -Fxq 'PASS semantic_v45_replay_reproduced_frozen_source_derived_linker_blocker' "$GATE_FILE"; then
            GATE_PASS=true
          fi
          if [ -e evidence/v46-diagnostic/unresolved-complete.txt ] || [ -e evidence/v46-closure/symbol-source-provenance.csv ] || [ -d evidence/v46-closure/v51-chkerr-out ]; then
            test "$GATE_PASS" = true
          fi

          CONTINUITY=false
          if [ "$GATE_PASS" = true ] && [ -f evidence/v46-diagnostic/unresolved-complete.txt ]; then
            test "$(sha256sum evidence/v46-diagnostic/unresolved-complete.txt | awk '{print $1}')" = "33b683c9be89e63611e3071a3f164bf739aa74357a2e3a8882555b1e25274ffa"
            CONTINUITY=true
          fi

          if [ "$V52_RC" -eq 0 ] && [ -s evidence/v46-link/lowalt-p-exact.wasm ] && [ -s evidence/v46-link/lowalt-p-exact.mjs ]; then
            CLASS=V52_CHKERR_OUT_BUILD_SEMANTICS_UNIQUELY_RESOLVED__STRICT_P_WORKER_MODULE_LINK_PASS_PRE_RESULT
          elif [ -f evidence/v46-closure/v51-chkerr-out/first-false.txt ]; then
            CLASS=V52_CHKERR_OUT_BUILD_PROVENANCE_FAIL_CLOSED
          elif [ -f evidence/v46-link/next-first-false.txt ]; then
            CLASS=V52_CHKERR_OUT_UNIQUELY_RESOLVED__NEXT_SOURCE_DERIVED_LINK_FIRST_FALSE_FROZEN
          elif [ -f evidence/v46-closure/ambiguous-symbol.txt ] || [ -f evidence/v46-closure/compile-first-false.txt ] || [ -f evidence/v46-closure/unproven-build-source.txt ]; then
            CLASS=V52_CHKERR_OUT_UNIQUELY_RESOLVED__NEXT_SOURCE_DERIVED_CLOSURE_FIRST_FALSE_FROZEN
          elif [ "$GATE_PASS" != true ]; then
            CLASS=V52_MANDATORY_V45_SEMANTIC_REPLAY_GATE_NOT_PASSED
          else
            CLASS=V52_PRE_RESULT_FIRST_FALSE_FROZEN
          fi
          cat > evidence/v52-wrapper/final-receipt.txt <<EOF_V52_FINAL
          status=$([ "$V52_RC" -eq 0 ] && echo PASS || echo FAIL)
          classification=${CLASS}
          script_exit=${V52_RC}
          deterministic_transport_reconstruction_passed=true
          exact_intended_script_sha_preserved=true
          exact_v50_to_intended_payload_diff_preserved=true
          v45_semantic_replay_gate_passed=${GATE_PASS}
          complete_17_symbol_set_continuity_proved=${CONTINUITY}
          chkerr_out_selection_trial_link_used=false
          strict_undefined_symbol_policy_changed=false
          wasm_instantiated=false
          p_numerical_evaluated=false
          raw_byte_p_to_t_marshalling=false
          t_called=false
          spectrum_401_evaluated=false
          lt5_result=false
          c_executed=false
          d_executed=false
          b_selected=false
          b_resolved=false
          production_changed=false
          EOF_V52_FINAL
          find evidence transport-v51 -type f -print0 | sort -z | xargs -0 sha256sum > evidence/v52-wrapper/all-evidence-sha256.txt
          exit "$V52_RC"

      - name: Upload immutable V52 pre-result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-worker-module-v52
          path: |
            evidence
            transport-v51
            bootstrap/v46-run-v50.sh
            bootstrap/v46-run-v52.sh
          if-no-files-found: error
          retention-days: 90
