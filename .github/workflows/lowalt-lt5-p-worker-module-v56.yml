name: LowAlt LT5 P Worker Module Origin Forensics V56

on:
  push:
    branches:
      - review/lowalt-lt5-p-worker-module-v56-20260918
    paths:
      - .github/workflows/lowalt-lt5-p-worker-module-v56.yml

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  origin-forensics-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Repair only V55 extracted-script needle representation and execute
        id: origin
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p bootstrap evidence/v56-wrapper fetched-v56

          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/lowalt-lt5-p-worker-module-v55.yml?ref=28d619a280cb112126393b5809069b39abff6f5b" \
            -o fetched-v56/v55-workflow-api.json
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/lowalt-lt5-p-worker-module-v54.yml?ref=dbb6458baf2785ceac624daa0e1748970749abf9" \
            -o fetched-v56/v54-workflow-api.json

          python3 - <<'PY_V56'
          import base64, difflib, hashlib, json
          from pathlib import Path

          OUT = Path('evidence/v56-wrapper')
          YAML_PREFIX = b'          '

          def decode_bound(path, expected_blob):
              api = json.loads(Path(path).read_text())
              assert api['sha'] == expected_blob
              source = base64.b64decode(api['content'])
              blob = hashlib.sha1(b'blob ' + str(len(source)).encode() + b'\0' + source).hexdigest()
              assert blob == expected_blob
              return source

          def extract_first_run(source, end_marker):
              lines = source.splitlines(keepends=True)
              run_mark = b'        run: |\n'
              starts = [i for i,x in enumerate(lines) if x == run_mark]
              ends = [i for i,x in enumerate(lines) if x == end_marker]
              assert starts == [26]
              assert len(ends) == 1 and ends[0] > starts[0]
              block = lines[starts[0]+1:ends[0]]
              out = []
              for line in block:
                  if line.startswith(YAML_PREFIX):
                      out.append(line[len(YAML_PREFIX):])
                  elif line in (b'\n', b''):
                      out.append(line)
                  else:
                      raise SystemExit(f'V56_REPRESENTATION_FAIL unexpected run-block indentation: {line!r}')
              return b''.join(out)

          v55_source = decode_bound('fetched-v56/v55-workflow-api.json', '8e06a0c0cc296ee336ae2cceb45f4c2a6213ef8e')
          v54_source = decode_bound('fetched-v56/v54-workflow-api.json', '2f40250aaf9d3d63a9669480256f31bc4190795a')
          Path('fetched-v56/v55-workflow-source.yml').write_bytes(v55_source)
          Path('fetched-v56/v54-workflow-source.yml').write_bytes(v54_source)

          v55_run = extract_first_run(v55_source, b'      - name: Freeze V55 origin-forensics artifact\n')
          v54_run = extract_first_run(v54_source, b'      - name: Freeze V54 origin-forensics artifact\n')
          Path('bootstrap/v55-run-original.sh').write_bytes(v55_run)
          Path('bootstrap/v54-run-original-v56-proof.sh').write_bytes(v54_run)

          # FIRST GATE: prove exact YAML-source -> extracted-shell representation.
          representation_pairs = [
              (b"              'intended_script_sha256_validator_lines_1_based': [328, 342, 350],\n",
               b"    'intended_script_sha256_validator_lines_1_based': [328, 342, 350],\n",
               'declared_intended_inventory_old'),
              (b"              'canonical_payload_diff_sha256_validator_lines_1_based': [333, 336],\n",
               b"    'canonical_payload_diff_sha256_validator_lines_1_based': [333, 336],\n",
               'declared_payload_diff_inventory_old'),
              (b"              342: 'source_defined_validator_reference_or_receipt',\n",
               b"    342: 'source_defined_validator_reference_or_receipt',\n",
               'intended_receipt_context_old'),
              (b"              350: 'source_defined_validator_reference_or_receipt',\n",
               b"    350: 'source_defined_validator_reference_or_receipt',\n",
               'stale_intended_receipt_old'),
              (b"              336: 'source_defined_payload_diff_validator_reference_or_receipt',\n",
               b"    336: 'source_defined_payload_diff_validator_reference_or_receipt',\n",
               'payload_diff_receipt_context_old'),
          ]
          rep_table = []
          for yaml_line, shell_line, purpose in representation_pairs:
              if v54_source.count(yaml_line) != 1:
                  raise SystemExit(f'V56_REPRESENTATION_FAIL yaml source occurrence {purpose} count={v54_source.count(yaml_line)}')
              if v54_run.count(shell_line) != 1:
                  raise SystemExit(f'V56_REPRESENTATION_FAIL extracted shell occurrence {purpose} count={v54_run.count(shell_line)}')
              if not yaml_line.startswith(YAML_PREFIX) or yaml_line[len(YAML_PREFIX):] != shell_line:
                  raise SystemExit(f'V56_REPRESENTATION_FAIL deterministic indentation mapping {purpose}')
              rep_table.append({
                  'purpose': purpose,
                  'yaml_source_line_utf8': yaml_line.decode().rstrip('\n'),
                  'extracted_shell_line_utf8': shell_line.decode().rstrip('\n'),
                  'yaml_leading_spaces': len(yaml_line) - len(yaml_line.lstrip(b' ')),
                  'shell_leading_spaces': len(shell_line) - len(shell_line.lstrip(b' ')),
                  'removed_yaml_block_spaces': len(YAML_PREFIX),
                  'mapping': 'exact_prefix_removal_only',
              })
          Path(OUT/'yaml-to-extracted-shell-representation.json').write_text(json.dumps(rep_table, sort_keys=True, indent=2)+'\n')

          # Repair only the V55 replacement-needle representation: remove the exact
          # 10-space YAML block indentation retained inside the nine needle literals.
          needle_replacements = [
              (b"b\"              'intended_script_sha256_validator_lines_1_based': [328, 342, 350],\\n\"",
               b"b\"    'intended_script_sha256_validator_lines_1_based': [328, 342, 350],\\n\""),
              (b"b\"              'intended_script_sha256_validator_lines_1_based': [328, 344],\\n\"",
               b"b\"    'intended_script_sha256_validator_lines_1_based': [328, 344],\\n\""),
              (b"b\"              'canonical_payload_diff_sha256_validator_lines_1_based': [333, 336],\\n\"",
               b"b\"    'canonical_payload_diff_sha256_validator_lines_1_based': [333, 336],\\n\""),
              (b"b\"              'canonical_payload_diff_sha256_validator_lines_1_based': [333, 345],\\n\"",
               b"b\"    'canonical_payload_diff_sha256_validator_lines_1_based': [333, 345],\\n\""),
              (b"b\"              342: 'source_defined_validator_reference_or_receipt',\\n\"",
               b"b\"    342: 'source_defined_validator_reference_or_receipt',\\n\""),
              (b"b\"              344: 'source_defined_validator_reference_or_receipt',\\n\"",
               b"b\"    344: 'source_defined_validator_reference_or_receipt',\\n\""),
              (b"b\"              350: 'source_defined_validator_reference_or_receipt',\\n\"",
               b"b\"    350: 'source_defined_validator_reference_or_receipt',\\n\""),
              (b"b\"              336: 'source_defined_payload_diff_validator_reference_or_receipt',\\n\"",
               b"b\"    336: 'source_defined_payload_diff_validator_reference_or_receipt',\\n\""),
              (b"b\"              345: 'source_defined_payload_diff_validator_reference_or_receipt',\\n\"",
               b"b\"    345: 'source_defined_payload_diff_validator_reference_or_receipt',\\n\""),
          ]
          patched = v55_run
          needle_table = []
          for old, new in needle_replacements:
              old_count = patched.count(old)
              new_pre = patched.count(new)
              if old_count != 1 or new_pre != 0:
                  raise SystemExit(f'V56_REPRESENTATION_FAIL needle precondition old={old_count} new_pre={new_pre} old={old!r}')
              before = hashlib.sha256(patched).hexdigest()
              patched = patched.replace(old, new, 1)
              needle_table.append({
                  'old_utf8': old.decode(),
                  'new_utf8': new.decode(),
                  'old_embedded_indent_spaces': 14,
                  'new_embedded_indent_spaces': 4,
                  'removed_exact_yaml_block_indent_spaces': 10,
                  'before_script_sha256': before,
                  'after_script_sha256': hashlib.sha256(patched).hexdigest(),
              })

          Path('bootstrap/v55-run-patched-v56.sh').write_bytes(patched)
          Path(OUT/'needle-replacement-table.json').write_text(json.dumps(needle_table, sort_keys=True, indent=2)+'\n')
          diff = ''.join(difflib.unified_diff(
              v55_run.decode().splitlines(True),
              patched.decode().splitlines(True),
              fromfile='v55-run-original.sh',
              tofile='v55-run-patched-v56.sh',
              n=2,
          ))
          Path(OUT/'v55-to-v56-harness-only.diff').write_text(diff)

          # Prove only the nine frozen needle literals changed.
          check = v55_run
          for old, new in needle_replacements:
              check = check.replace(old, new, 1)
          assert check == patched
          assert len(needle_table) == 9
          marker = b"          marker = b'# Reproduce ONLY the exact source-defined V51 transport transform. No repair,\\n'\n"
          assert v55_run.count(marker) == 1 and patched.count(marker) == 1
          assert v55_run[v55_run.index(marker):] == patched[patched.index(marker):]

          manifest = {
              'schema': 1,
              'scope': 'V55_TO_V56_EXTRACTED_SCRIPT_NEEDLE_REPRESENTATION_ONLY',
              'v55_workflow_blob_sha1': '8e06a0c0cc296ee336ae2cceb45f4c2a6213ef8e',
              'v55_workflow_sha256': hashlib.sha256(v55_source).hexdigest(),
              'v54_workflow_blob_sha1': '2f40250aaf9d3d63a9669480256f31bc4190795a',
              'v54_workflow_sha256': hashlib.sha256(v54_source).hexdigest(),
              'v55_run_original_sha256': hashlib.sha256(v55_run).hexdigest(),
              'v55_run_patched_v56_sha256': hashlib.sha256(patched).hexdigest(),
              'representation_pair_count': len(rep_table),
              'needle_replacement_count': len(needle_table),
              'yaml_block_indent_removed_from_needles': 10,
              'embedded_semantic_script_changed': False,
              'source_defined_transform_changed': False,
              'target_sha_selection_semantics_changed': False,
          }
          Path(OUT/'representation-gate-manifest.json').write_text(json.dumps(manifest, sort_keys=True, indent=2)+'\n')
          Path(OUT/'REPRESENTATION_GATE_PASS').write_text('representation_gate_pass=true\n')
          PY_V56

          test -f evidence/v56-wrapper/REPRESENTATION_GATE_PASS
          bash -n bootstrap/v55-run-patched-v56.sh
          set +e
          bash bootstrap/v55-run-patched-v56.sh >evidence/v56-wrapper/patched-v55.stdout.txt 2>evidence/v56-wrapper/patched-v55.stderr.txt
          V55_PATCHED_RC=$?
          set -e
          printf '%s\n' "$V55_PATCHED_RC" > evidence/v56-wrapper/patched-v55.exit-code.txt
          exit "$V55_PATCHED_RC"

      - name: Freeze V56 origin-forensics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-worker-module-v56
          if-no-files-found: error
          retention-days: 90
          path: |
            evidence/
            fetched-v56/
            fetched-v55/
            bootstrap/v55-run-original.sh
            bootstrap/v55-run-patched-v56.sh
            bootstrap/v54-run-original-v56-proof.sh
            bootstrap/v54-run-original.sh
            bootstrap/v54-run-patched-v55.sh
            bootstrap/v46-run-v51.sh
            inputs/
