name: LowAlt LT5 P Worker Module Origin Forensics V58

on:
  push:
    branches:
      - review/lowalt-lt5-p-worker-module-v58-20260918
    paths:
      - .github/workflows/lowalt-lt5-p-worker-module-v58.yml

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  origin-forensics-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Repair only V57 wrapper validator-source identity count and execute
        id: origin
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p bootstrap evidence/v58-source-identity fetched-v58/v57-artifact

          for spec in \
            "v57 e75961ade4cd365b5bb7c269c9d0a80a370f325f lowalt-lt5-p-worker-module-v57.yml" \
            "v54 dbb6458baf2785ceac624daa0e1748970749abf9 lowalt-lt5-p-worker-module-v54.yml" \
            "v51 6e9c7bc59ff5153422b989f2ee28a0403fa54d4c lowalt-lt5-p-worker-module-v51.yml"
          do
            set -- $spec
            label="$1"; ref="$2"; file="$3"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/${file}?ref=${ref}" \
              -o "fetched-v58/${label}-workflow-api.json"
          done

          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/10549070882/zip" \
            -o fetched-v58/v57-artifact.zip

          python3 - <<'PY_V58'
          import base64
          import difflib
          import hashlib
          import json
          import zipfile
          from pathlib import Path

          OUT = Path('evidence/v58-source-identity')
          V57_WORKFLOW_BLOB = 'd1ccc8accd6a23db0e0eef34ca99d54c9946bb5b'
          V54_WORKFLOW_BLOB = '2f40250aaf9d3d63a9669480256f31bc4190795a'
          V51_WORKFLOW_BLOB = '5585f3ce09311ebb88de2a5231b813fbe8e63e03'
          V57_ARTIFACT_SHA256 = 'e55727147572410813494334982fb750281339920f9580ffad7ac13d4f3c57f8'
          V57_ARTIFACT_SIZE = 1283366
          INTENDED = b'e4608a47964eba236a3681a056b2f4be8704c1ffa7e14c23857bdce323448ddb'
          PAYLOAD = b'de543b76e0444269d4a7dd9e150b762c030edcf734617f11c6ae4ce909b0658e'

          def sha256(data):
              return hashlib.sha256(data).hexdigest()

          def bind_source(label, expected_blob):
              api = json.loads(Path(f'fetched-v58/{label}-workflow-api.json').read_text())
              if api.get('sha') != expected_blob:
                  raise SystemExit(f'V58_BIND_FAIL {label} workflow blob {api.get("sha")}')
              source = base64.b64decode(api['content'])
              git_blob = hashlib.sha1(b'blob ' + str(len(source)).encode() + b'\0' + source).hexdigest()
              if git_blob != expected_blob:
                  raise SystemExit(f'V58_BIND_FAIL {label} recomputed blob {git_blob}')
              Path(f'fetched-v58/{label}-workflow-source.yml').write_bytes(source)
              return source

          v57_source = bind_source('v57', V57_WORKFLOW_BLOB)
          v54_source = bind_source('v54', V54_WORKFLOW_BLOB)
          v51_source = bind_source('v51', V51_WORKFLOW_BLOB)

          zip_bytes = Path('fetched-v58/v57-artifact.zip').read_bytes()
          if len(zip_bytes) != V57_ARTIFACT_SIZE:
              raise SystemExit(f'V58_BIND_FAIL V57 artifact size {len(zip_bytes)}')
          if sha256(zip_bytes) != V57_ARTIFACT_SHA256:
              raise SystemExit(f'V58_BIND_FAIL V57 artifact sha {sha256(zip_bytes)}')
          with zipfile.ZipFile('fetched-v58/v57-artifact.zip') as zf:
              zf.extractall('fetched-v58/v57-artifact')
          root = Path('fetched-v58/v57-artifact')

          accepted = {
              'bootstrap/v56-run-original.sh': ('960473ac17ae17985803b9f09c85c485312526b2ec92ff5d4b20621b27e27bb2', 9806),
              'bootstrap/v56-run-patched-v57.sh': ('f8c30d71c8457ce86c5bb19af997781a2b6a3e667a18dfe7f3af53a36e699152', 9796),
              'bootstrap/v55-run-original.sh': ('41b75835e3ad2cfb146e3283b6357bc69b473092209349ac8122de5b0ad0be06', 8099),
              'bootstrap/v55-run-patched-v56.sh': ('3fe4696455c80d4fbf5c26e063a43936acdec89fe2325babf682747a41334d64', 8009),
              'evidence/v57-wrapper/REPRESENTATION_GATE_PASS': ('13fe1cb0b1706721ea2674c430baa9454b8574c5c0f578d79c1e9c601473fd70', 30),
              'evidence/v57-wrapper/suffix-marker-representation.json': ('72da2fc9ba1274b0863e6fccab40c5e214cdcfaaee3dd25a2f6e86c9cbbe9e92', 2746),
              'evidence/v57-wrapper/v56-to-v57-harness-only.diff': ('f8fabd5a5cff53d2c389620698a70ef34f54e2170f82b50ecf20e15221b56eea', 494),
              'evidence/v57-wrapper/representation-gate-manifest.json': ('b941b14f42c109a575d1d644a13692dd52a10e75b5488837f2abfc4e6dcc2bb8', 853),
              'evidence/v56-wrapper/REPRESENTATION_GATE_PASS': ('13fe1cb0b1706721ea2674c430baa9454b8574c5c0f578d79c1e9c601473fd70', 30),
              'evidence/v56-wrapper/needle-replacement-table.json': ('90c12bd318dc3c4beaf3341985c4fb6b8af4abc0b17a95b3e240c02bd942bc4f', None),
              'evidence/v56-wrapper/v55-to-v56-harness-only.diff': ('81ce3f52e6f65cf1e55bbc24aa045c3ad6263e910f0cc5d04a97519d8302079a', None),
          }
          bindings = []
          for rel, (expected_sha, expected_size) in accepted.items():
              p = root / rel
              if not p.is_file():
                  raise SystemExit(f'V58_BIND_FAIL missing V57 artifact member {rel}')
              data = p.read_bytes()
              actual_sha = sha256(data)
              if actual_sha != expected_sha:
                  raise SystemExit(f'V58_BIND_FAIL artifact member sha {rel} {actual_sha}')
              if expected_size is not None and len(data) != expected_size:
                  raise SystemExit(f'V58_BIND_FAIL artifact member size {rel} {len(data)}')
              bindings.append({'path': rel, 'sha256': actual_sha, 'size': len(data)})
          Path(OUT/'accepted-wrapper-bindings.json').write_text(json.dumps(bindings, sort_keys=True, indent=2)+'\n')

          def occurrences(source, token):
              lines = source.splitlines(keepends=True)
              out = []
              for idx, line in enumerate(lines):
                  if token in line:
                      out.append({
                          'line_1_based': idx + 1,
                          'line_b64': base64.b64encode(line).decode(),
                          'previous_b64': base64.b64encode(lines[idx-1] if idx else b'').decode(),
                          'next_b64': base64.b64encode(lines[idx+1] if idx+1 < len(lines) else b'').decode(),
                      })
              return out

          v54_intended = occurrences(v54_source, INTENDED)
          v54_payload = occurrences(v54_source, PAYLOAD)
          v51_intended = occurrences(v51_source, INTENDED)
          v51_payload = occurrences(v51_source, PAYLOAD)
          if [x['line_1_based'] for x in v54_intended] != [136]:
              raise SystemExit(f'V58_SOURCE_IDENTITY_FAIL V54 intended lines {v54_intended}')
          if [x['line_1_based'] for x in v54_payload] != [267]:
              raise SystemExit(f'V58_SOURCE_IDENTITY_FAIL V54 payload lines {v54_payload}')
          if [x['line_1_based'] for x in v51_intended] != [328, 344]:
              raise SystemExit(f'V58_SOURCE_IDENTITY_FAIL V51 intended lines {v51_intended}')
          if [x['line_1_based'] for x in v51_payload] != [333, 345]:
              raise SystemExit(f'V58_SOURCE_IDENTITY_FAIL V51 payload lines {v51_payload}')

          inventory = {
              'schema': 1,
              'status': 'SOURCE_IDENTITY_GATE_PASS',
              'validator_identities': {
                  'intended_script_sha256': INTENDED.decode(),
                  'canonical_payload_diff_sha256': PAYLOAD.decode(),
              },
              'v57_workflow': {'blob_sha1': V57_WORKFLOW_BLOB, 'sha256': sha256(v57_source), 'size': len(v57_source)},
              'v54_wrapper_workflow': {
                  'blob_sha1': V54_WORKFLOW_BLOB,
                  'sha256': sha256(v54_source),
                  'size': len(v54_source),
                  'intended_occurrences': v54_intended,
                  'payload_occurrences': v54_payload,
                  'required_literal_cardinality': '1+1',
              },
              'v51_authoritative_workflow': {
                  'blob_sha1': V51_WORKFLOW_BLOB,
                  'sha256': sha256(v51_source),
                  'size': len(v51_source),
                  'intended_occurrences': v51_intended,
                  'payload_occurrences': v51_payload,
                  'required_literal_cardinality': '2+2',
              },
              'count_relaxation_used': False,
              'dynamic_source_substitution_used': False,
              'first_match_or_cardinality_inference_used': False,
              'authoritative_v51_gate_weakened': False,
          }
          Path(OUT/'validator-source-occurrence-inventory.json').write_text(json.dumps(inventory, sort_keys=True, indent=2)+'\n')

          original = (root/'bootstrap/v55-run-patched-v56.sh').read_bytes()
          old_new = [
              (b'assert source.count(intended) == 2\n', b'assert source.count(intended) == 1\n', 'v54_source_intended_exact_1'),
              (b'assert source.count(payload) == 2\n', b'assert source.count(payload) == 1\n', 'v54_source_payload_exact_1'),
          ]
          patched = original
          table = []
          for old, new, purpose in old_new:
              old_count = patched.count(old)
              new_pre = patched.count(new)
              if old_count != 1 or new_pre != 0:
                  raise SystemExit(f'V58_PATCH_FAIL {purpose} old={old_count} new_pre={new_pre}')
              before = sha256(patched)
              patched = patched.replace(old, new, 1)
              table.append({
                  'purpose': purpose,
                  'old_b64': base64.b64encode(old).decode(),
                  'new_b64': base64.b64encode(new).decode(),
                  'before_sha256': before,
                  'after_sha256': sha256(patched),
              })

          expected = original
          for old, new, _ in old_new:
              expected = expected.replace(old, new, 1)
          if patched != expected:
              raise SystemExit('V58_PATCH_FAIL unrelated mutation')

          marker = b'# Reproduce ONLY the exact source-defined V51 transport transform. No repair,\n'
          if original.count(marker) != 1 or patched.count(marker) != 1:
              raise SystemExit('V58_PATCH_FAIL source-defined-transform marker changed')
          v51_inventory_literal = (
              b"        'intended_script_validator_lines_1_based': [328, 344],\n"
              b"        'payload_diff_validator_lines_1_based': [333, 345],\n"
          )
          if original.count(v51_inventory_literal) != 1 or patched.count(v51_inventory_literal) != 1:
              raise SystemExit('V58_PATCH_FAIL authoritative V51 2+2 literal block changed')

          diff = ''.join(difflib.unified_diff(
              original.decode().splitlines(True),
              patched.decode().splitlines(True),
              fromfile='v55-run-patched-v56.sh',
              tofile='v55-run-patched-v58.sh',
              n=3,
          ))
          payload_lines = [line for line in diff.splitlines() if (line.startswith('+') and not line.startswith('+++')) or (line.startswith('-') and not line.startswith('---'))]
          expected_payload = [
              '-assert source.count(intended) == 2',
              '-assert source.count(payload) == 2',
              '+assert source.count(intended) == 1',
              '+assert source.count(payload) == 1',
          ]
          if payload_lines != expected_payload:
              raise SystemExit(f'V58_PATCH_FAIL unexpected diff payload {payload_lines}')

          Path('bootstrap/v55-run-patched-v58.sh').write_bytes(patched)
          Path(OUT/'v57-to-v58-harness-only.diff').write_text(diff)
          Path(OUT/'source-binding-count-replacement-table.json').write_text(json.dumps(table, sort_keys=True, indent=2)+'\n')
          manifest = {
              'schema': 1,
              'status': 'SOURCE_IDENTITY_GATE_PASS',
              'scope': 'V57_TO_V58_WRAPPER_VALIDATOR_SOURCE_IDENTITY_COUNT_ASSERTION_ONLY',
              'v55_input_sha256': sha256(original),
              'v55_input_size': len(original),
              'v58_patched_sha256': sha256(patched),
              'v58_patched_size': len(patched),
              'diff_sha256': sha256(diff.encode()),
              'replacement_table_sha256': sha256((Path(OUT/'source-binding-count-replacement-table.json')).read_bytes()),
              'accepted_suffix_marker_repair_changed': False,
              'accepted_nine_needle_repair_changed': False,
              'authoritative_v51_2_plus_2_update_changed': False,
              'source_defined_transform_changed': False,
              'semantic_script_transport_changed': False,
              'target_sha_selection_semantics_changed': False,
          }
          Path(OUT/'source-identity-gate-manifest.json').write_text(json.dumps(manifest, sort_keys=True, indent=2)+'\n')
          Path(OUT/'SOURCE_IDENTITY_GATE_PASS').write_text('source_identity_gate_pass=true\n')
          PY_V58

          test -f evidence/v58-source-identity/SOURCE_IDENTITY_GATE_PASS
          bash -n bootstrap/v55-run-patched-v58.sh
          set +e
          bash bootstrap/v55-run-patched-v58.sh >evidence/v58-source-identity/patched-v55.stdout.txt 2>evidence/v58-source-identity/patched-v55.stderr.txt
          CHILD_RC=$?
          set -e
          printf '%s\n' "$CHILD_RC" > evidence/v58-source-identity/patched-v55.exit-code.txt
          exit "$CHILD_RC"

      - name: Freeze V58 PRE-RESULT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-worker-module-v58-evidence
          path: |
            bootstrap/
            evidence/
            fetched-v58/v57-workflow-source.yml
            fetched-v58/v54-workflow-source.yml
            fetched-v58/v51-workflow-source.yml
          if-no-files-found: error
          retention-days: 30
