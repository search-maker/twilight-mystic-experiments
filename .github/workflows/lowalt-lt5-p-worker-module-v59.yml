name: LowAlt LT5 P Worker Module Artifact Identity V59

on:
  push:
    branches:
      - review/lowalt-lt5-p-worker-module-v59-20260918
    paths:
      - .github/workflows/lowalt-lt5-p-worker-module-v59.yml

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  artifact-identity-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Repair only V58 predecessor-artifact identity surface and execute
        id: artifact_identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p bootstrap evidence/v59-artifact-identity fetched-v59

          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/lowalt-lt5-p-worker-module-v58.yml?ref=b15b5d91c50d81c09f4a6f78d2359941662879a0" \
            -o fetched-v59/v58-workflow-api.json

          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/runs/35348880635/artifacts?per_page=100" \
            -o fetched-v59/v57-artifacts-api.json

          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/10549070882/zip" \
            -o fetched-v59/v57-artifact-transport.zip

          python3 - <<'PY_V59'
          import base64
          import collections
          import difflib
          import hashlib
          import json
          import zipfile
          from pathlib import Path

          OUT = Path('evidence/v59-artifact-identity')
          OUT.mkdir(parents=True, exist_ok=True)

          V58_WORKFLOW_BLOB = 'a88873140a276d8735a65f998d2d6b8ca97492d1'
          V57_ARTIFACT_ID = 10549070882
          V57_ARTIFACT_NAME = 'lowalt-lt5-p-worker-module-v57'
          V57_RUN_ID = 35348880635
          V57_HEAD = 'e75961ade4cd365b5bb7c269c9d0a80a370f325f'
          V57_API_SIZE = 166972
          V57_API_DIGEST = 'sha256:169118a67f933a54b91575881223760921d571acd59ed9a505d6037067575cdb'
          V57_TRANSPORT_SIZE = 166972
          V57_TRANSPORT_SHA256 = '169118a67f933a54b91575881223760921d571acd59ed9a505d6037067575cdb'

          def sha256(data):
              return hashlib.sha256(data).hexdigest()

          v58_api = json.loads(Path('fetched-v59/v58-workflow-api.json').read_text())
          if v58_api.get('sha') != V58_WORKFLOW_BLOB:
              raise SystemExit(f'V59_BIND_FAIL V58 workflow blob {v58_api.get("sha")}')
          v58_source = base64.b64decode(v58_api['content'])
          git_blob = hashlib.sha1(b'blob ' + str(len(v58_source)).encode() + b'\0' + v58_source).hexdigest()
          if git_blob != V58_WORKFLOW_BLOB:
              raise SystemExit(f'V59_BIND_FAIL V58 recomputed blob {git_blob}')
          Path('fetched-v59/v58-workflow-source.yml').write_bytes(v58_source)

          artifacts_api = json.loads(Path('fetched-v59/v57-artifacts-api.json').read_text())
          artifacts = artifacts_api.get('artifacts', [])
          matches = [a for a in artifacts if a.get('id') == V57_ARTIFACT_ID]
          if len(matches) != 1:
              raise SystemExit(f'V59_BIND_FAIL V57 artifact API id cardinality {len(matches)}')
          meta = matches[0]
          expected_metadata = {
              'id': V57_ARTIFACT_ID,
              'name': V57_ARTIFACT_NAME,
              'size_in_bytes': V57_API_SIZE,
              'digest': V57_API_DIGEST,
          }
          for key, expected in expected_metadata.items():
              if meta.get(key) != expected:
                  raise SystemExit(f'V59_BIND_FAIL V57 artifact API {key}={meta.get(key)!r}')
          workflow_run = meta.get('workflow_run') or {}
          if workflow_run.get('id') != V57_RUN_ID or workflow_run.get('head_sha') != V57_HEAD:
              raise SystemExit(f'V59_BIND_FAIL V57 artifact workflow identity {workflow_run!r}')
          if meta.get('expired') is not False:
              raise SystemExit('V59_BIND_FAIL V57 artifact unexpectedly expired')

          transport = Path('fetched-v59/v57-artifact-transport.zip').read_bytes()
          transport_size = len(transport)
          transport_sha = sha256(transport)
          if transport_size != V57_TRANSPORT_SIZE:
              raise SystemExit(f'V59_BIND_FAIL V57 transport size {transport_size}')
          if transport_sha != V57_TRANSPORT_SHA256:
              raise SystemExit(f'V59_BIND_FAIL V57 transport sha256 {transport_sha}')

          required = {
              'bootstrap/v56-run-original.sh': ('960473ac17ae17985803b9f09c85c485312526b2ec92ff5d4b20621b27e27bb2', 9806),
              'bootstrap/v56-run-patched-v57.sh': ('f8c30d71c8457ce86c5bb19af997781a2b6a3e667a18dfe7f3af53a36e699152', 9796),
              'bootstrap/v55-run-original.sh': ('41b75835e3ad2cfb146e3283b6357bc69b473092209349ac8122de5b0ad0be06', 8099),
              'bootstrap/v55-run-patched-v56.sh': ('3fe4696455c80d4fbf5c26e063a43936acdec89fe2325babf682747a41334d64', 8009),
              'evidence/v57-wrapper/REPRESENTATION_GATE_PASS': ('13fe1cb0b1706721ea2674c430baa9454b8574c5c0f578d79c1e9c601473fd70', 30),
              'evidence/v57-wrapper/suffix-marker-representation.json': ('72da2fc9ba1274b0863e6fccab40c5e214cdcfaaee3dd25a2f6e86c9cbbe9e92', 2746),
              'evidence/v57-wrapper/v56-to-v57-harness-only.diff': ('f8fabd5a5cff53d2c389620698a70ef34f54e2170f82b50ecf20e15221b56eea', 494),
              'evidence/v57-wrapper/representation-gate-manifest.json': ('b941b14f42c109a575d1d644a13692dd52a10e75b5488837f2abfc4e6dcc2bb8', 853),
              'evidence/v56-wrapper/REPRESENTATION_GATE_PASS': ('13fe1cb0b1706721ea2674c430baa9454b8574c5c0f578d79c1e9c601473fd70', 30),
              'evidence/v56-wrapper/needle-replacement-table.json': ('90c12bd318dc3c4beaf3341985c4fb6b8af4abc0b17a95b3e240c02bd942bc4f', 4693),
              'evidence/v56-wrapper/v55-to-v56-harness-only.diff': ('81ce3f52e6f65cf1e55bbc24aa045c3ad6263e910f0cc5d04a97519d8302079a', 1837),
          }

          with zipfile.ZipFile('fetched-v59/v57-artifact-transport.zip') as zf:
              infos = zf.infolist()
              names = [i.filename for i in infos]
              counts = collections.Counter(names)
              duplicates = sorted(name for name, count in counts.items() if count != 1)
              if duplicates:
                  raise SystemExit(f'V59_BIND_FAIL duplicate archive member names {duplicates!r}')
              member_table = []
              for info in infos:
                  data = zf.read(info.filename)
                  member_table.append({
                      'name': info.filename,
                      'file_size': info.file_size,
                      'compress_size': info.compress_size,
                      'crc32_hex': f'{info.CRC:08x}',
                      'sha256': sha256(data),
                      'required_accepted_evidence': info.filename in required,
                  })
              for rel, (expected_sha, expected_size) in required.items():
                  if counts.get(rel, 0) != 1:
                      raise SystemExit(f'V59_BIND_FAIL required member cardinality {rel}={counts.get(rel, 0)}')
                  data = zf.read(rel)
                  if len(data) != expected_size:
                      raise SystemExit(f'V59_BIND_FAIL required member size {rel}={len(data)}')
                  actual_sha = sha256(data)
                  if actual_sha != expected_sha:
                      raise SystemExit(f'V59_BIND_FAIL required member sha {rel}={actual_sha}')

          member_names = {row['name'] for row in member_table}
          required_names = set(required)
          if not required_names.issubset(member_names):
              raise SystemExit('V59_BIND_FAIL missing required member after enumeration')

          identity_table = {
              'schema': 1,
              'status': 'ARTIFACT_IDENTITY_GATE_PASS',
              'v58_workflow': {
                  'blob_sha1': V58_WORKFLOW_BLOB,
                  'sha256': sha256(v58_source),
                  'size': len(v58_source),
              },
              'v57_artifact_api_metadata': {
                  'id': meta['id'],
                  'name': meta['name'],
                  'digest': meta['digest'],
                  'size_in_bytes': meta['size_in_bytes'],
                  'expired': meta['expired'],
                  'workflow_run_id': workflow_run.get('id'),
                  'workflow_head_sha': workflow_run.get('head_sha'),
              },
              'v57_generated_download_transport': {
                  'size': transport_size,
                  'sha256': transport_sha,
                  'semantic_equivalence_to_api_digest_assumed': False,
                  'semantic_equivalence_to_api_size_assumed': False,
                  'numeric_size_equality_observed': transport_size == meta['size_in_bytes'],
                  'digest_text_matches_transport_sha256_observed': meta['digest'] == 'sha256:' + transport_sha,
              },
              'archive': {
                  'member_count': len(member_table),
                  'duplicate_name_count': 0,
                  'required_member_count': len(required),
                  'supplemental_member_count': len(member_table) - len(required),
                  'required_missing_count': 0,
                  'required_ambiguous_count': 0,
                  'members': member_table,
              },
          }
          identity_bytes = (json.dumps(identity_table, sort_keys=True, indent=2) + '\n').encode()
          Path(OUT/'metadata-transport-member-identity-table.json').write_bytes(identity_bytes)

          lines = v58_source.splitlines(keepends=True)
          run_marker = b'        run: |\n'
          try:
              start = lines.index(run_marker) + 1
          except ValueError:
              raise SystemExit('V59_PATCH_FAIL V58 run block marker absent')
          extracted = []
          source_line_map = []
          for idx in range(start, len(lines)):
              line = lines[idx]
              if line.strip() and not line.startswith(b'          '):
                  break
              if line.startswith(b'          '):
                  out_line = line[10:]
                  removed = 10
              else:
                  out_line = line
                  removed = 0
              extracted.append(out_line)
              source_line_map.append({'yaml_line_1_based': idx + 1, 'removed_prefix_spaces': removed})
          original = b''.join(extracted)
          if not original.startswith(b'set -euo pipefail\n'):
              raise SystemExit('V59_PATCH_FAIL extracted V58 shell prefix')
          Path('bootstrap/v58-run-original.sh').write_bytes(original)

          old = (
              b"zip_bytes = Path('fetched-v58/v57-artifact.zip').read_bytes()\n"
              b"if len(zip_bytes) != V57_ARTIFACT_SIZE:\n"
              b"    raise SystemExit(f'V58_BIND_FAIL V57 artifact size {len(zip_bytes)}')\n"
              b"if sha256(zip_bytes) != V57_ARTIFACT_SHA256:\n"
              b"    raise SystemExit(f'V58_BIND_FAIL V57 artifact sha {sha256(zip_bytes)}')\n"
          )
          new = (
              b"zip_bytes = Path('fetched-v58/v57-artifact.zip').read_bytes()\n"
              b"# V59 independently bound API metadata and generated ZIP transport before child execution.\n"
              b"# No API-metadata/transport semantic equivalence is assumed by this child.\n"
          )
          if original.count(old) != 1 or original.count(new) != 0:
              raise SystemExit(f'V59_PATCH_FAIL identity-surface precondition old={original.count(old)} new_pre={original.count(new)}')
          patched = original.replace(old, new, 1)
          expected = original.replace(old, new, 1)
          if patched != expected:
              raise SystemExit('V59_PATCH_FAIL unrelated mutation')

          preserved_needles = [
              b"assert source.count(intended) == 2\n",
              b"assert source.count(payload) == 2\n",
              b"# Reproduce ONLY the exact source-defined V51 transport transform. No repair,\n",
              b"        'intended_script_validator_lines_1_based': [328, 344],\n",
              b"        'payload_diff_validator_lines_1_based': [333, 345],\n",
          ]
          for needle in preserved_needles:
              if original.count(needle) != patched.count(needle):
                  raise SystemExit(f'V59_PATCH_FAIL preserved downstream needle changed {needle!r}')

          diff = ''.join(difflib.unified_diff(
              original.decode().splitlines(True),
              patched.decode().splitlines(True),
              fromfile='v58-run-original.sh',
              tofile='v58-run-patched-v59.sh',
              n=3,
          ))
          payload_lines = [line for line in diff.splitlines() if (line.startswith('+') and not line.startswith('+++')) or (line.startswith('-') and not line.startswith('---'))]
          expected_payload = [
              '-if len(zip_bytes) != V57_ARTIFACT_SIZE:',
              "-    raise SystemExit(f'V58_BIND_FAIL V57 artifact size {len(zip_bytes)}')",
              '-if sha256(zip_bytes) != V57_ARTIFACT_SHA256:',
              "-    raise SystemExit(f'V58_BIND_FAIL V57 artifact sha {sha256(zip_bytes)}')",
              '+# V59 independently bound API metadata and generated ZIP transport before child execution.',
              '+# No API-metadata/transport semantic equivalence is assumed by this child.',
          ]
          if payload_lines != expected_payload:
              raise SystemExit(f'V59_PATCH_FAIL unexpected diff payload {payload_lines!r}')

          Path('bootstrap/v58-run-patched-v59.sh').write_bytes(patched)
          Path(OUT/'v58-to-v59-harness-only.diff').write_text(diff)
          patch_manifest = {
              'schema': 1,
              'status': 'ARTIFACT_IDENTITY_GATE_PASS',
              'scope': 'V58_TO_V59_PREDECESSOR_ARTIFACT_IDENTITY_SURFACE_ONLY',
              'v58_extracted_shell_sha256': sha256(original),
              'v58_extracted_shell_size': len(original),
              'v59_patched_shell_sha256': sha256(patched),
              'v59_patched_shell_size': len(patched),
              'harness_diff_sha256': sha256(diff.encode()),
              'identity_table_sha256': sha256(identity_bytes),
              'yaml_run_block_extraction': {
                  'marker_b64': base64.b64encode(run_marker).decode(),
                  'source_first_body_line_1_based': start + 1,
                  'source_last_body_line_1_based': start + len(extracted),
                  'deterministic_yaml_block_indent_removed_spaces': 10,
                  'line_map': source_line_map,
              },
              'v58_source_identity_count_repair_changed': False,
              'authoritative_v51_2_plus_2_gate_changed': False,
              'source_defined_transform_changed': False,
              'result_boundary_changed': False,
          }
          manifest_bytes = (json.dumps(patch_manifest, sort_keys=True, indent=2) + '\n').encode()
          Path(OUT/'artifact-identity-gate-manifest.json').write_bytes(manifest_bytes)
          Path(OUT/'ARTIFACT_IDENTITY_GATE_PASS').write_text('ARTIFACT_IDENTITY_GATE_PASS\n')
          PY_V59

          test -f evidence/v59-artifact-identity/ARTIFACT_IDENTITY_GATE_PASS
          bash -n bootstrap/v58-run-patched-v59.sh
          set +e
          bash bootstrap/v58-run-patched-v59.sh >evidence/v59-artifact-identity/patched-v58.stdout.txt 2>evidence/v59-artifact-identity/patched-v58.stderr.txt
          CHILD_RC=$?
          set -e
          printf '%s\n' "$CHILD_RC" > evidence/v59-artifact-identity/patched-v58.exit-code.txt
          exit "$CHILD_RC"

      - name: Freeze V59 PRE-RESULT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-worker-module-v59-evidence
          path: |
            bootstrap/
            evidence/
            fetched-v59/
            fetched-v58/
          if-no-files-found: error
          retention-days: 30
