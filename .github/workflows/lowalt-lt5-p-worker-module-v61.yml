name: LowAlt LT5 P Worker Module V54 Source Identity V61

on:
  push:
    branches:
      - review/lowalt-lt5-p-worker-module-v61-20260918
    paths:
      - .github/workflows/lowalt-lt5-p-worker-module-v61.yml

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  v54-source-identity-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Prove exact V54 source identity, patch only stale SHA predicate, execute preserved V60 child
        id: v54_source_identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p bootstrap fetched-v61 evidence/v61-source-identity artifacts-v61

          api_get() {
            local url="$1" out="$2"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$url" -o "$out"
          }

          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/git/ref/heads/review/lowalt-lt5-p-worker-module-v54-20260918" fetched-v61/v54-ref.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/lowalt-lt5-p-worker-module-v54.yml?ref=dbb6458baf2785ceac624daa0e1748970749abf9" fetched-v61/v54-contents-head.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/lowalt-lt5-p-worker-module-v54.yml?ref=review/lowalt-lt5-p-worker-module-v54-20260918" fetched-v61/v54-contents-branch.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/git/blobs/2f40250aaf9d3d63a9669480256f31bc4190795a" fetched-v61/v54-git-blob.json
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/search-maker/twilight-mystic-experiments/dbb6458baf2785ceac624daa0e1748970749abf9/.github/workflows/lowalt-lt5-p-worker-module-v54.yml" \
            -o fetched-v61/v54-raw-head.yml

          for spec in \
            "v59 46593d008ed9b2c737c5514bf42f36c4a4011ccc .github/workflows/lowalt-lt5-p-worker-module-v59.yml" \
            "v60 f8a56a70470c608c87c7e40c3e5132df3601ed8e .github/workflows/lowalt-lt5-p-worker-module-v60.yml"
          do
            set -- $spec
            label="$1"; ref="$2"; path="$3"
            api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/${path}?ref=${ref}" "fetched-v61/${label}-contents.json"
          done

          for spec in \
            "v54 10541607724 1d99c75bd84a83334445e98054d8849e91e8aad9e58d66768a721a7b3e6f3f69 1261378" \
            "v59 10553549120 910cca1ff98b57b731f438fcc736418f6c50aac9e15e210edd52754f98632fb7 380119" \
            "v60 10556049794 07d08fd09eecc91de9f2ebeb11b32d934fb88d29d7c2724582e49066c3cdc5c3 43357"
          do
            set -- $spec
            label="$1"; artifact_id="$2"
            api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/${artifact_id}" "fetched-v61/${label}-artifact-api.json"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/${artifact_id}/zip" \
              -o "artifacts-v61/${label}-transport.zip"
          done

          python3 - <<'PY_V61_GATE'
          import base64
          import difflib
          import hashlib
          import io
          import json
          import zipfile
          from pathlib import Path

          OUT = Path('evidence/v61-source-identity')
          OUT.mkdir(parents=True, exist_ok=True)

          V54_HEAD = 'dbb6458baf2785ceac624daa0e1748970749abf9'
          V54_BRANCH = 'review/lowalt-lt5-p-worker-module-v54-20260918'
          V54_PATH = '.github/workflows/lowalt-lt5-p-worker-module-v54.yml'
          V54_BLOB = '2f40250aaf9d3d63a9669480256f31bc4190795a'
          V54_SIZE = 17277
          V54_SHA = 'e8271687adef6755d904b3663263837506fbcf74b2906ae470850b8eb994cd4b'
          STALE_SHA = 'e827a23b4fb05924810748778384862c69931aeb88a57407fb1ae2692f70ef20'
          V59_BLOB = '3228ab81bd3f1983cce2afb4a167a4fa187d841f'
          V60_BLOB = 'bbe7edbedee434298cc60cf619f344fc05fe4a35'
          INTENDED = b'e4608a47964eba236a3681a056b2f4be8704c1ffa7e14c23857bdce323448ddb'
          PAYLOAD = b'de543b76e0444269d4a7dd9e150b762c030edcf734617f11c6ae4ce909b0658e'

          def sha256(data):
              return hashlib.sha256(data).hexdigest()

          def git_blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()

          ref = json.loads(Path('fetched-v61/v54-ref.json').read_text())
          if ref.get('ref') != 'refs/heads/' + V54_BRANCH or ref.get('object', {}).get('sha') != V54_HEAD:
              raise SystemExit(f'V61_SOURCE_IDENTITY_FAIL V54 branch/head {ref}')

          def decode_contents(path, expected_blob):
              api = json.loads(Path(path).read_text())
              if api.get('sha') != expected_blob:
                  raise SystemExit(f'V61_SOURCE_IDENTITY_FAIL contents blob {path} {api.get("sha")}')
              data = base64.b64decode(api['content'])
              if git_blob(data) != expected_blob:
                  raise SystemExit(f'V61_SOURCE_IDENTITY_FAIL recomputed blob {path} {git_blob(data)}')
              return data

          v54_head = decode_contents('fetched-v61/v54-contents-head.json', V54_BLOB)
          v54_branch = decode_contents('fetched-v61/v54-contents-branch.json', V54_BLOB)
          blob_api = json.loads(Path('fetched-v61/v54-git-blob.json').read_text())
          if blob_api.get('sha') != V54_BLOB or blob_api.get('encoding') != 'base64':
              raise SystemExit('V61_SOURCE_IDENTITY_FAIL git blob metadata')
          v54_blob = base64.b64decode(blob_api['content'])
          v54_raw = Path('fetched-v61/v54-raw-head.yml').read_bytes()

          reps = {
              'contents_exact_head': v54_head,
              'contents_exact_branch_after_head_bind': v54_branch,
              'git_blob_object': v54_blob,
              'raw_exact_head': v54_raw,
          }
          canonical = v54_blob
          representation_table = []
          for name, data in reps.items():
              row = {
                  'representation': name,
                  'size': len(data),
                  'sha256': sha256(data),
                  'git_blob_sha1': git_blob(data),
                  'byte_equal_canonical': data == canonical,
              }
              representation_table.append(row)
              if len(data) != V54_SIZE or sha256(data) != V54_SHA or git_blob(data) != V54_BLOB or data != canonical:
                  raise SystemExit(f'V61_SOURCE_IDENTITY_FAIL representation disagreement {row}')
          Path(OUT/'v54-authoritative-source.yml').write_bytes(canonical)

          lines = canonical.splitlines(keepends=True)
          def token_occurrences(token):
              rows = []
              for i, line in enumerate(lines):
                  if token in line:
                      rows.append({
                          'line_1_based': i + 1,
                          'line_sha256': sha256(line),
                          'line_b64': base64.b64encode(line).decode(),
                          'previous_b64': base64.b64encode(lines[i-1] if i else b'').decode(),
                          'next_b64': base64.b64encode(lines[i+1] if i + 1 < len(lines) else b'').decode(),
                      })
              return rows
          intended = token_occurrences(INTENDED)
          payload = token_occurrences(PAYLOAD)
          if [x['line_1_based'] for x in intended] != [82] or [x['line_1_based'] for x in payload] != [83]:
              raise SystemExit(f'V61_SOURCE_IDENTITY_FAIL preserved V54 validator context {intended} {payload}')

          v59 = decode_contents('fetched-v61/v59-contents.json', V59_BLOB)
          v60 = decode_contents('fetched-v61/v60-contents.json', V60_BLOB)
          sources = {'v54_workflow_source': canonical, 'v59_workflow_source': v59, 'v60_workflow_source': v60}

          artifact_expected = {
              'v54': {'id': 10541607724, 'digest': 'sha256:1d99c75bd84a83334445e98054d8849e91e8aad9e58d66768a721a7b3e6f3f69', 'size_in_bytes': 1261378},
              'v59': {'id': 10553549120, 'digest': 'sha256:910cca1ff98b57b731f438fcc736418f6c50aac9e15e210edd52754f98632fb7', 'size_in_bytes': 380119},
              'v60': {'id': 10556049794, 'digest': 'sha256:07d08fd09eecc91de9f2ebeb11b32d934fb88d29d7c2724582e49066c3cdc5c3', 'size_in_bytes': 43357},
          }
          artifact_rows = []
          for label, exp in artifact_expected.items():
              meta = json.loads(Path(f'fetched-v61/{label}-artifact-api.json').read_text())
              for key in ('id', 'digest', 'size_in_bytes'):
                  if meta.get(key) != exp[key]:
                      raise SystemExit(f'V61_SOURCE_IDENTITY_FAIL {label} artifact metadata {key} {meta.get(key)!r}')
              transport = Path(f'artifacts-v61/{label}-transport.zip').read_bytes()
              artifact_rows.append({
                  'label': label,
                  'api_id': meta['id'],
                  'api_name': meta.get('name'),
                  'api_digest': meta['digest'],
                  'api_size_in_bytes': meta['size_in_bytes'],
                  'transport_size': len(transport),
                  'transport_sha256': sha256(transport),
                  'transport_not_equated_to_api_digest': True,
              })

          needle = STALE_SHA.encode()
          correct_needle = V54_SHA.encode()
          inventory = []
          def add_occurrences(surface, data, nested_path=None):
              for kind, tok in (('stale_expected_sha', needle), ('authoritative_sha', correct_needle)):
                  start = 0
                  while True:
                      pos = data.find(tok, start)
                      if pos < 0:
                          break
                      line_no = data[:pos].count(b'\n') + 1
                      context = data[max(0, pos-120):min(len(data), pos+len(tok)+120)]
                      inventory.append({
                          'surface': surface,
                          'nested_path': nested_path,
                          'kind': kind,
                          'byte_offset': pos,
                          'line_1_based_if_textual': line_no,
                          'context_b64': base64.b64encode(context).decode(),
                          'classification': 'textual_reference_or_receipt_not_authoritative_v54_byte_object',
                      })
                      start = pos + 1

          for name, data in sources.items():
              add_occurrences(name, data)

          def scan_zip(label, blob, prefix='', depth=0):
              if depth > 4:
                  return
              with zipfile.ZipFile(io.BytesIO(blob)) as zf:
                  for info in zf.infolist():
                      if info.is_dir():
                          continue
                      data = zf.read(info.filename)
                      member_path = f'{prefix}{info.filename}'
                      add_occurrences(f'{label}_artifact_member', data, member_path)
                      if data[:4] == b'PK\x03\x04':
                          try:
                              scan_zip(label, data, prefix=member_path + '::', depth=depth+1)
                          except zipfile.BadZipFile:
                              pass
          for label in artifact_expected:
              scan_zip(label, Path(f'artifacts-v61/{label}-transport.zip').read_bytes())

          stale_rows = [x for x in inventory if x['kind'] == 'stale_expected_sha']
          if any(row['surface'].startswith('authoritative_representation') for row in stale_rows):
              raise SystemExit('V61_SOURCE_IDENTITY_FAIL stale SHA bound as authoritative representation')

          source_identity = {
              'schema': 1,
              'status': 'V54_SOURCE_IDENTITY_GATE_PASS',
              'v54_identity': {
                  'branch': V54_BRANCH,
                  'head': V54_HEAD,
                  'path': V54_PATH,
                  'git_blob_sha1': V54_BLOB,
                  'size': V54_SIZE,
                  'sha256': V54_SHA,
                  'stale_predecessor_predicate_sha256': STALE_SHA,
              },
              'representations': representation_table,
              'validator_context': {'intended': intended, 'payload': payload},
              'artifact_identity_surfaces': artifact_rows,
              'stale_and_authoritative_sha_inventory': inventory,
              'stale_classification': 'STALE_PREDECESSOR_PREDICATE_ONLY_NOT_AUTHORITATIVE_V54_BLOB_IDENTITY',
          }
          Path(OUT/'source-identity-table.json').write_text(json.dumps(source_identity, indent=2, sort_keys=True) + '\n')

          v60_lines = v60.splitlines(keepends=True)
          marker = b'        run: |\n'
          try:
              start = v60_lines.index(marker) + 1
          except ValueError:
              raise SystemExit('V61_PATCH_FAIL V60 run block marker absent')
          extracted = []
          mapping = []
          for idx in range(start, len(v60_lines)):
              line = v60_lines[idx]
              if line.strip() and not line.startswith(b'          '):
                  break
              if line.startswith(b'          '):
                  extracted.append(line[10:])
                  removed = 10
              else:
                  extracted.append(line)
                  removed = 0
              mapping.append({'yaml_line_1_based': idx + 1, 'removed_prefix_spaces': removed})
          original = b''.join(extracted)
          if not original.startswith(b'set -euo pipefail\n'):
              raise SystemExit('V61_PATCH_FAIL extracted V60 shell prefix')
          old = b"          V54_SOURCE_SHA256 = 'e827a23b4fb05924810748778384862c69931aeb88a57407fb1ae2692f70ef20'\n"
          new = b"          V54_SOURCE_SHA256 = 'e8271687adef6755d904b3663263837506fbcf74b2906ae470850b8eb994cd4b'\n"
          if original.count(old) != 1 or original.count(new) != 0:
              raise SystemExit(f'V61_PATCH_FAIL exact SHA predicate precondition old={original.count(old)} new={original.count(new)}')
          patched = original.replace(old, new, 1)
          diff = ''.join(difflib.unified_diff(
              original.decode().splitlines(True), patched.decode().splitlines(True),
              fromfile='v60-run-original.sh', tofile='v60-run-patched-v61.sh', n=3,
          ))
          payload_lines = [x for x in diff.splitlines() if (x.startswith('+') and not x.startswith('+++')) or (x.startswith('-') and not x.startswith('---'))]
          expected_payload = [
              "-          V54_SOURCE_SHA256 = 'e827a23b4fb05924810748778384862c69931aeb88a57407fb1ae2692f70ef20'",
              "+          V54_SOURCE_SHA256 = 'e8271687adef6755d904b3663263837506fbcf74b2906ae470850b8eb994cd4b'",
          ]
          if payload_lines != expected_payload:
              raise SystemExit(f'V61_PATCH_FAIL non-SHA harness mutation {payload_lines!r}')

          preserved = [
              b"          if [x['line_1_based'] for x in v54_intended] != [82]:\n",
              b"          if [x['line_1_based'] for x in v54_payload] != [83]:\n",
              b"              b\"# Reproduce ONLY the exact source-defined V51 transport transform. No repair,\\n\",\n",
              b"              b\"        'intended_script_validator_lines_1_based': [328, 344],\\n\",\n",
              b"              b\"        'payload_diff_validator_lines_1_based': [333, 345],\\n\",\n",
          ]
          for p in preserved:
              if original.count(p) != patched.count(p):
                  raise SystemExit(f'V61_PATCH_FAIL downstream mutation {p!r}')

          Path('bootstrap/v60-run-original.sh').write_bytes(original)
          Path('bootstrap/v60-run-patched-v61.sh').write_bytes(patched)
          Path(OUT/'v60-to-v61-harness-only.diff').write_text(diff)
          Path(OUT/'v60-extraction-map.json').write_text(json.dumps(mapping, indent=2) + '\n')
          Path(OUT/'v61-preexecution-receipt.json').write_text(json.dumps({
              'schema': 1,
              'status': 'V61_PREEXECUTION_SOURCE_IDENTITY_AND_PATCH_PASS',
              'v54_source_sha256': V54_SHA,
              'v54_source_size': V54_SIZE,
              'v54_git_blob_sha1': V54_BLOB,
              'v60_original_shell_sha256': sha256(original),
              'v61_patched_shell_sha256': sha256(patched),
              'v60_to_v61_diff_sha256': sha256(diff.encode()),
              'patch_scope': 'V54_SOURCE_SHA256_PREDICATE_ONLY_AFTER_AUTHORITATIVE_IDENTITY_PASS',
          }, indent=2, sort_keys=True) + '\n')
          print('V54_SOURCE_IDENTITY_GATE_PASS')
          print('V61_SHA_PREDICATE_PATCH_PASS')
          PY_V61_GATE

          bash -n bootstrap/v60-run-patched-v61.sh
          set +e
          bash bootstrap/v60-run-patched-v61.sh > evidence/v61-source-identity/child.stdout 2> evidence/v61-source-identity/child.stderr
          child_rc=$?
          set -e
          printf '%s\n' "$child_rc" > evidence/v61-source-identity/child.exit_code
          if [ "$child_rc" -ne 0 ]; then
            echo "V61_CHILD_FIRST_FALSE rc=${child_rc}" >&2
            tail -n 80 evidence/v61-source-identity/child.stderr >&2 || true
            exit "$child_rc"
          fi

      - name: Freeze V61 evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-worker-module-v61-evidence
          path: |
            evidence/
            bootstrap/v60-run-original.sh
            bootstrap/v60-run-patched-v61.sh
            fetched-v61/
            artifacts-v61/
          if-no-files-found: error
          compression-level: 6
          retention-days: 90
