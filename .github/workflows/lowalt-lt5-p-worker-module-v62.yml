name: LowAlt LT5 P Worker Module V59 Member Identity Forensics V62

on:
  push:
    branches:
      - review/lowalt-lt5-p-worker-module-v62-20260918
    paths:
      - .github/workflows/lowalt-lt5-p-worker-module-v62.yml

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  v59-member-identity-forensics:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Bind V59 durable member identity and fail closed if frozen inventory is unrecoverable
        id: member_identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p fetched-v62 artifacts-v62 evidence/v62-artifact-identity

          api_get() {
            local url="$1" out="$2"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$url" -o "$out"
          }

          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/issues/comments/5732127187" fetched-v62/v59-checkpoint.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/lowalt-lt5-p-worker-module-v59.yml?ref=46593d008ed9b2c737c5514bf42f36c4a4011ccc" fetched-v62/v59-workflow-contents.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/lowalt-lt5-p-worker-module-v61.yml?ref=bab8d462280edc68195ae2e6a3970512cf6413a8" fetched-v62/v61-workflow-contents.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/10559045723" fetched-v62/v61-artifact-api.json
          curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/10559045723/zip" -o artifacts-v62/v61-transport.zip
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/10553549120" fetched-v62/v59-artifact-direct.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/runs/35360786337/artifacts?per_page=100" fetched-v62/v59-run-artifacts.json
          curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/10553549120/zip" -o artifacts-v62/v59-current-transport.zip

          python3 - <<'PY_V62'
          import base64, hashlib, io, json, zipfile
          from pathlib import Path
          OUT=Path('evidence/v62-artifact-identity'); OUT.mkdir(parents=True,exist_ok=True)
          AID=10553549120; ANAME='lowalt-lt5-p-worker-module-v59-evidence'
          FROZEN_API='sha256:910cca1ff98b57b731f438fcc736418f6c50aac9e15e210edd52754f98632fb7'; FROZEN_SIZE=380119
          FROZEN_TRANSPORT='f9373b36e42eeba016c88a1cc68a3d4d310c55e3bab6746ca173626292972c2d'
          TABLE='631b52bb8bd4f4f3c3d7cdf0a4ad23dab558c7c27649bb746a064fe59ff36f80'
          MANIFEST='fe48c37dea56b3c5b03b99237d6ea52337b4f92aafeac389b597aea08ce62bf6'
          V59_BLOB='3228ab81bd3f1983cce2afb4a167a4fa187d841f'; V61_BLOB='2bdff8b34c18ecade1b298dbff5e1d71ea33a2ee'
          V61_DIGEST='sha256:8d01db1ff60a197e815db50615ea37dbb7cbf37e45b2b9efc32778d3c3136c90'; V61_SIZE=1865138
          REQUIRED={
          'bootstrap/v56-run-original.sh':(9806,'960473ac17ae17985803b9f09c85c485312526b2ec92ff5d4b20621b27e27bb2'),
          'bootstrap/v56-run-patched-v57.sh':(9796,'f8c30d71c8457ce86c5bb19af997781a2b6a3e667a18dfe7f3af53a36e699152'),
          'bootstrap/v55-run-original.sh':(8099,'41b75835e3ad2cfb146e3283b6357bc69b473092209349ac8122de5b0ad0be06'),
          'bootstrap/v55-run-patched-v56.sh':(8009,'3fe4696455c80d4fbf5c26e063a43936acdec89fe2325babf682747a41334d64'),
          'evidence/v57-wrapper/REPRESENTATION_GATE_PASS':(30,'13fe1cb0b1706721ea2674c430baa9454b8574c5c0f578d79c1e9c601473fd70'),
          'evidence/v57-wrapper/suffix-marker-representation.json':(2746,'72da2fc9ba1274b0863e6fccab40c5e214cdcfaaee3dd25a2f6e86c9cbbe9e92'),
          'evidence/v57-wrapper/v56-to-v57-harness-only.diff':(494,'f8fabd5a5cff53d2c389620698a70ef34f54e2170f82b50ecf20e15221b56eea'),
          'evidence/v57-wrapper/representation-gate-manifest.json':(853,'b941b14f42c109a575d1d644a13692dd52a10e75b5488837f2abfc4e6dcc2bb8'),
          'evidence/v56-wrapper/REPRESENTATION_GATE_PASS':(30,'13fe1cb0b1706721ea2674c430baa9454b8574c5c0f578d79c1e9c601473fd70'),
          'evidence/v56-wrapper/needle-replacement-table.json':(4693,'90c12bd318dc3c4beaf3341985c4fb6b8af4abc0b17a95b3e240c02bd942bc4f'),
          'evidence/v56-wrapper/v55-to-v56-harness-only.diff':(1837,'81ce3f52e6f65cf1e55bbc24aa045c3ad6263e910f0cc5d04a97519d8302079a')}
          def H(b): return hashlib.sha256(b).hexdigest()
          def G(b): return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          def decode(path,blob):
            o=json.loads(Path(path).read_text()); b=base64.b64decode(o['content'])
            if o.get('sha')!=blob or G(b)!=blob: raise SystemExit(f'V62_BIND_FAIL workflow blob {path}')
            return b
          cp=json.loads(Path('fetched-v62/v59-checkpoint.json').read_text()); body=cp.get('body','')
          must=[str(AID),ANAME,FROZEN_API,f'API size `{FROZEN_SIZE}`',FROZEN_TRANSPORT,TABLE,MANIFEST,'exactly `50` unique member names','all `11` required accepted V57 evidence members']
          if cp.get('id')!=5732127187 or any(x not in body for x in must): raise SystemExit('V62_BIND_FAIL accepted V59 checkpoint text')
          Path(OUT/'accepted-v59-checkpoint-body.txt').write_text(body)
          v59src=decode('fetched-v62/v59-workflow-contents.json',V59_BLOB); v61src=decode('fetched-v62/v61-workflow-contents.json',V61_BLOB)
          for n,(s,d) in REQUIRED.items():
            if n.encode() not in v59src or str(s).encode() not in v59src or d.encode() not in v59src: raise SystemExit(f'V62_BIND_FAIL required contract literal {n}')
          Path(OUT/'v59-workflow-source.yml').write_bytes(v59src); Path(OUT/'v61-workflow-source.yml').write_bytes(v61src)
          m61=json.loads(Path('fetched-v62/v61-artifact-api.json').read_text()); z61=Path('artifacts-v62/v61-transport.zip').read_bytes()
          if m61.get('id')!=10559045723 or m61.get('digest')!=V61_DIGEST or m61.get('size_in_bytes')!=V61_SIZE or len(z61)!=V61_SIZE or 'sha256:'+H(z61)!=V61_DIGEST: raise SystemExit('V62_BIND_FAIL V61 artifact')
          direct=json.loads(Path('fetched-v62/v59-artifact-direct.json').read_text()); rl=json.loads(Path('fetched-v62/v59-run-artifacts.json').read_text())
          xs=[a for a in rl.get('artifacts',[]) if a.get('id')==AID]
          if len(xs)!=1: raise SystemExit(f'V62_ARTIFACT_IDENTITY_FAIL run-list cardinality {len(xs)}')
          listed=xs[0]; fields=('id','name','digest','size_in_bytes','expired')
          if any(direct.get(k)!=listed.get(k) for k in fields): raise SystemExit('V62_ARTIFACT_IDENTITY_FAIL two fresh metadata surfaces disagree')
          if direct.get('id')!=AID or direct.get('name')!=ANAME or direct.get('expired') is not False: raise SystemExit('V62_ARTIFACT_IDENTITY_FAIL current id/name/expiry')
          z59=Path('artifacts-v62/v59-current-transport.zip').read_bytes()
          with zipfile.ZipFile(io.BytesIO(z59)) as z:
            names=[i.filename for i in z.infolist() if not i.is_dir()]
            if len(names)!=len(set(names)): raise SystemExit('V62_ARTIFACT_IDENTITY_FAIL duplicate V59 top member')
            nested='fetched-v59/v57-artifact-transport.zip'
            if names.count(nested)!=1: raise SystemExit('V62_ARTIFACT_IDENTITY_FAIL V57 transport member cardinality')
            v57=z.read(nested); curtable=z.read('evidence/v59-artifact-identity/metadata-transport-member-identity-table.json'); curmanifest=z.read('evidence/v59-artifact-identity/artifact-identity-gate-manifest.json')
          with zipfile.ZipFile(io.BytesIO(v57)) as z:
            n57=[i.filename for i in z.infolist() if not i.is_dir()]
            if len(n57)!=50 or len(n57)!=len(set(n57)): raise SystemExit(f'V62_ARTIFACT_IDENTITY_FAIL 50-member contract count={len(n57)}')
            rows=[]
            for n,(s,d) in REQUIRED.items():
              if n57.count(n)!=1: raise SystemExit(f'V62_ARTIFACT_IDENTITY_FAIL required cardinality {n}={n57.count(n)}')
              b=z.read(n); row={'name':n,'size':len(b),'sha256':H(b),'expected_size':s,'expected_sha256':d,'exact':len(b)==s and H(b)==d}; rows.append(row)
              if not row['exact']: raise SystemExit(f'V62_ARTIFACT_IDENTITY_FAIL required mismatch {n}')
          hits={TABLE:[],MANIFEST:[]}; scanned=[]
          def scan(label,blob,prefix='',depth=0):
            if depth>5:return
            try:z=zipfile.ZipFile(io.BytesIO(blob))
            except zipfile.BadZipFile:return
            with z:
              for i in z.infolist():
                if i.is_dir():continue
                b=z.read(i.filename); p=prefix+i.filename; h=H(b); scanned.append({'surface':label,'path':p,'size':len(b),'sha256':h})
                if h in hits:hits[h].append({'surface':label,'path':p,'size':len(b)})
                if b[:4]==b'PK\x03\x04':scan(label,b,p+'::',depth+1)
          scan('current_v59_artifact',z59); scan('accepted_v61_artifact',z61)
          recovered=len(hits[TABLE])==1 and len(hits[MANIFEST])==1
          comparison={'schema':1,'authority':'Coordinator 5733768804','accepted_checkpoint':{'comment_id':5732127187,'body_sha256':H(body.encode()),'artifact_id':AID,'name':ANAME,'frozen_api_digest':FROZEN_API,'frozen_api_size':FROZEN_SIZE,'frozen_transport_sha256':FROZEN_TRANSPORT,'frozen_identity_table_sha256':TABLE,'frozen_manifest_sha256':MANIFEST},'current_direct':{k:direct.get(k) for k in fields},'current_run_list':{k:listed.get(k) for k in fields},'current_transport':{'size':len(z59),'sha256':H(z59),'api_digest_equality_observed_not_assumed_semantic':direct.get('digest')=='sha256:'+H(z59),'api_size_equality_observed_not_assumed_semantic':direct.get('size_in_bytes')==len(z59)},'current_v59_top_member_count':len(names),'current_identity_table':{'size':len(curtable),'sha256':H(curtable)},'current_manifest':{'size':len(curmanifest),'sha256':H(curmanifest)},'v57_transport':{'size':len(v57),'sha256':H(v57),'member_count':len(n57)},'required_members':rows,'frozen_table_hits':hits[TABLE],'frozen_manifest_hits':hits[MANIFEST],'frozen_inventory_exact_recovered':recovered,'outer_discrepancy_cause':'UNKNOWN','outer_values_not_substituted_for_member_identity':True,'b_selected':False,'b_resolved':False,'result_boundary_unchanged':True}
          Path(OUT/'metadata-transport-member-comparison.json').write_text(json.dumps(comparison,indent=2,sort_keys=True)+'\n'); Path(OUT/'required-v57-members.json').write_text(json.dumps(rows,indent=2,sort_keys=True)+'\n'); Path(OUT/'recursive-member-scan.json').write_text(json.dumps(scanned,indent=2,sort_keys=True)+'\n'); Path(OUT/'DURABLE_REQUIRED_MEMBER_MATCH').write_text('PASS 11/11 exact member bytes/SHA256; outer cause UNKNOWN\n')
          if not recovered:
            reason=f'V62_ARTIFACT_IDENTITY_FAIL frozen V59 identity table/manifest bytes not uniquely recoverable; table_hits={len(hits[TABLE])} manifest_hits={len(hits[MANIFEST])}; 11/11 required V57 member identities match but cannot substitute for missing frozen inventory bytes'
            Path(OUT/'FIRST_FALSE.txt').write_text(reason+'\n'); raise SystemExit(reason)
          Path(OUT/'ARTIFACT_IDENTITY_GATE_PASS').write_text('PASS frozen V59 inventory bytes and all required members uniquely recovered\n')
          raise SystemExit('V62_CHAIN_STOP unexpected first-gate PASS; no result work executed')
          PY_V62

      - name: Freeze V62 forensic evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-worker-module-v62-evidence
          path: |
            evidence/v62-artifact-identity/
            fetched-v62/
            artifacts-v62/
          if-no-files-found: error
          compression-level: 6
          retention-days: 90
