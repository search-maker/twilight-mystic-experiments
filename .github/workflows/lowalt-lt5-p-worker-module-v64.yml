name: LowAlt LT5 P Worker Module Frozen V59 Target Provenance V64

on:
  push:
    branches:
      - review/lowalt-lt5-p-worker-module-v64-20260918
    paths:
      - .github/workflows/lowalt-lt5-p-worker-module-v64.yml

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  frozen-v59-target-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Forensic-only frozen V59 target-hash provenance origin
        id: provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p fetched-v64 artifacts-v64 evidence/v64-target-provenance

          api_get() {
            local url="$1" out="$2"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$url" -o "$out"
          }

          # Exact accepted checkpoints and immutable workflow sources.
          for id in 5731212721 5732127187 5732779515 5733510403 5734260894 5734917652; do
            api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/issues/comments/${id}" "fetched-v64/comment-${id}.json"
          done
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/lowalt-lt5-p-worker-module-v58.yml?ref=b15b5d91c50d81c09f4a6f78d2359941662879a0" fetched-v64/v58-workflow.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/lowalt-lt5-p-worker-module-v59.yml?ref=46593d008ed9b2c737c5514bf42f36c4a4011ccc" fetched-v64/v59-workflow.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/lowalt-lt5-p-worker-module-v60.yml?ref=f8a56a70470c608c87c7e40c3e5132df3601ed8e" fetched-v64/v60-workflow.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/lowalt-lt5-p-worker-module-v61.yml?ref=bab8d462280edc68195ae2e6a3970512cf6413a8" fetched-v64/v61-workflow.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/lowalt-lt5-p-worker-module-v62.yml?ref=ef12e0d4d999c5817de63c416b8d5ff1fa1f7157" fetched-v64/v62-workflow.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/lowalt-lt5-p-worker-module-v63.yml?ref=11e6acdf8a04bec0a4db7428c481f43c47e371ca" fetched-v64/v63-workflow.json
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/search-maker/twilight-mystic-experiments/11e6acdf8a04bec0a4db7428c481f43c47e371ca/.github/workflows/lowalt-lt5-p-worker-module-v63.yml" \
            -o fetched-v64/v63-workflow-raw.yml
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/search-maker/twilight-mystic-experiments/${GITHUB_SHA}/.github/workflows/lowalt-lt5-p-worker-module-v64.yml" \
            -o fetched-v64/v64-workflow-raw.yml

          # Exact V59 execution surfaces.
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/runs/35360786337" fetched-v64/v59-run.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/runs/35360786337/jobs?per_page=100" fetched-v64/v59-jobs.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/10553549120" fetched-v64/v59-artifact.json
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/jobs/105651240149/logs" \
            -o fetched-v64/v59-job-logs.bin
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/10553549120/zip" \
            -o artifacts-v64/v59-current.zip

          # Exact predecessor and accepted successor evidence.
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/runs/35348880635/artifacts?per_page=100" fetched-v64/v57-artifacts.json
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/10549070882/zip" \
            -o artifacts-v64/v57.zip
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/10561781023" fetched-v64/v62-artifact.json
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/10561781023/zip" \
            -o artifacts-v64/v62.zip
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/10562233951" fetched-v64/v63-artifact.json
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/10562233951/zip" \
            -o artifacts-v64/v63.zip

          # Full Issue #60 comment chronology, used only to locate first declaration/propagation.
          : > fetched-v64/all-comment-pages.ndjson
          for page in $(seq 1 30); do
            api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/issues/60/comments?per_page=100&page=${page}" "fetched-v64/comments-page-${page}.json"
            count=$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))))' "fetched-v64/comments-page-${page}.json")
            cat "fetched-v64/comments-page-${page}.json" >> fetched-v64/all-comment-pages.ndjson
            printf '\n' >> fetched-v64/all-comment-pages.ndjson
            [ "$count" -lt 100 ] && break
          done

          python3 - <<'PY_V64'
          import base64, collections, difflib, hashlib, io, json, os, re, shutil, subprocess, sys, tempfile, zipfile
          from pathlib import Path

          OUT = Path('evidence/v64-target-provenance'); OUT.mkdir(parents=True, exist_ok=True)
          TABLE_TARGET = '631b52bb8bd4f4f3c3d7cdf0a4ad23dab558c7c27649bb746a064fe59ff36f80'
          MANIFEST_TARGET = 'fe48c37dea56b3c5b03b99237d6ea52337b4f92aafeac389b597aea08ce62bf6'
          TABLE_DERIVED = '9d1f9817c71f9873052b1e0735de3285588d18a2789ee22b1addca9336078d3f'
          MANIFEST_DERIVED = 'c6be26dc8da045cb4199a1bf7b58a6eb0a4974c306e95b11a1fa58ca9f80ab89'
          BLOBS = {
            'v58': 'a88873140a276d8735a65f998d2d6b8ca97492d1',
            'v59': '3228ab81bd3f1983cce2afb4a167a4fa187d841f',
            'v60': 'bbe7edbedee434298cc60cf619f344fc05fe4a35',
            'v61': '2bdff8b34c18ecade1b298dbff5e1d71ea33a2ee',
            'v62': 'f0b76d72544acba2e11e8965347d13a5f931b68c',
            'v63': '3a749f80cdfb1a9280fb2bee23d5a01956c38374',
          }
          def H(b): return hashlib.sha256(b).hexdigest()
          def G(b): return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          def decode_workflow(label):
            obj=json.loads(Path(f'fetched-v64/{label}-workflow.json').read_text())
            data=base64.b64decode(obj['content'])
            if obj.get('sha') != BLOBS[label] or G(data) != BLOBS[label]:
              raise SystemExit(f'V64_BIND_FAIL {label} workflow identity')
            return data
          wf={k:decode_workflow(k) for k in BLOBS}
          if wf['v63'] != Path('fetched-v64/v63-workflow-raw.yml').read_bytes():
            raise SystemExit('V64_BIND_FAIL V63 representations disagree')

          # Bind accepted comments exactly by id/user and preserve bodies.
          comment_ids=[5731212721,5732127187,5732779515,5733510403,5734260894,5734917652]
          accepted={}
          for cid in comment_ids:
            obj=json.loads(Path(f'fetched-v64/comment-{cid}.json').read_text())
            if obj.get('id') != cid or obj.get('user',{}).get('login') != 'search-maker':
              raise SystemExit(f'V64_BIND_FAIL comment {cid}')
            accepted[cid]=obj.get('body','')
            Path(OUT/f'accepted-comment-{cid}.txt').write_text(accepted[cid])
          if TABLE_TARGET not in accepted[5732127187] or MANIFEST_TARGET not in accepted[5732127187]:
            raise SystemExit('V64_BIND_FAIL V59 checkpoint target declarations absent')
          if TABLE_DERIVED not in accepted[5734917652] or MANIFEST_DERIVED not in accepted[5734917652]:
            raise SystemExit('V64_BIND_FAIL V63 deterministic outputs absent')

          # Bind V59 run/job identities.
          run=json.loads(Path('fetched-v64/v59-run.json').read_text())
          jobs=json.loads(Path('fetched-v64/v59-jobs.json').read_text())
          if run.get('id') != 35360786337 or run.get('run_attempt') != 1 or run.get('head_sha') != '46593d008ed9b2c737c5514bf42f36c4a4011ccc':
            raise SystemExit('V64_BIND_FAIL V59 run identity')
          job_matches=[j for j in jobs.get('jobs',[]) if j.get('id')==105651240149]
          if len(job_matches)!=1:
            raise SystemExit('V64_BIND_FAIL V59 job identity')

          # Verify accepted V57 bytes and extract exact V59 generator from exact workflow.
          v57=Path('artifacts-v64/v57.zip').read_bytes()
          if len(v57)!=166972 or H(v57)!='169118a67f933a54b91575881223760921d571acd59ed9a505d6037067575cdb':
            raise SystemExit('V64_BIND_FAIL V57 transport')
          v57_api=json.loads(Path('fetched-v64/v57-artifacts.json').read_text())
          ms=[a for a in v57_api.get('artifacts',[]) if a.get('id')==10549070882]
          if len(ms)!=1 or ms[0].get('digest')!='sha256:169118a67f933a54b91575881223760921d571acd59ed9a505d6037067575cdb':
            raise SystemExit('V64_BIND_FAIL V57 API identity')

          def extract_run(source):
            lines=source.splitlines(keepends=True); marker=b'        run: |\n'
            if marker not in lines: raise SystemExit('V64_DERIVE_FAIL run marker')
            start=lines.index(marker)+1; out=[]
            for line in lines[start:]:
              if line.strip() and not line.startswith(b'          '): break
              out.append(line[10:] if line.startswith(b'          ') else line)
            return b''.join(out)
          r59=extract_run(wf['v59']); hs=b"python3 - <<'PY_V59'\n"; a=r59.find(hs)
          if a<0: raise SystemExit('V64_DERIVE_FAIL PY_V59 start')
          a+=len(hs); b=r59.find(b'\nPY_V59\n',a)
          if b<0: raise SystemExit('V64_DERIVE_FAIL PY_V59 end')
          generator=r59[a:b+1]; Path(OUT/'source-defined-v59-generator.py').write_bytes(generator)

          # Recreate exact V58 workflow/API and V57 artifact inputs, then run source-defined generator twice.
          deriv=[]
          for label in ('derive-a','derive-b'):
            root=OUT/label; (root/'fetched-v59').mkdir(parents=True); (root/'bootstrap').mkdir(); (root/'evidence/v59-artifact-identity').mkdir(parents=True)
            shutil.copyfile('fetched-v64/v58-workflow.json',root/'fetched-v59/v58-workflow-api.json')
            shutil.copyfile('fetched-v64/v57-artifacts.json',root/'fetched-v59/v57-artifacts-api.json')
            (root/'fetched-v59/v57-artifact-transport.zip').write_bytes(v57)
            (root/'generator.py').write_bytes(generator)
            p=subprocess.run([sys.executable,'generator.py'],cwd=root,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
            (root/'generator.stdout').write_bytes(p.stdout); (root/'generator.stderr').write_bytes(p.stderr); (root/'generator.exit-code').write_text(str(p.returncode)+'\n')
            if p.returncode: raise SystemExit(f'V64_DERIVE_FAIL {label} rc={p.returncode}')
            tb=(root/'evidence/v59-artifact-identity/metadata-transport-member-identity-table.json').read_bytes()
            mb=(root/'evidence/v59-artifact-identity/artifact-identity-gate-manifest.json').read_bytes()
            deriv.append((tb,mb))
          tset={x[0] for x in deriv}; mset={x[1] for x in deriv}
          if len(tset)!=1 or len(mset)!=1: raise SystemExit('V64_DERIVE_FAIL nonunique source outputs')
          tb=next(iter(tset)); mb=next(iter(mset)); tsha=H(tb); msha=H(mb)
          if tsha!=TABLE_DERIVED or msha!=MANIFEST_DERIVED:
            raise SystemExit(f'V64_DERIVE_FAIL V63 candidate continuity {tsha} {msha}')
          Path(OUT/'unique-source-defined-table.json').write_bytes(tb); Path(OUT/'unique-source-defined-manifest.json').write_bytes(mb)

          # Prove the V59 workflow has a single deterministic write for each output and no later same-path writer.
          s59=wf['v59'].decode()
          table_path='metadata-transport-member-identity-table.json'; manifest_path='artifact-identity-gate-manifest.json'
          source_path_counts={table_path:s59.count(table_path), manifest_path:s59.count(manifest_path)}
          write_receipts={
            'table_write_bytes_present': "Path(OUT/'metadata-transport-member-identity-table.json').write_bytes(identity_bytes)" in s59,
            'manifest_write_bytes_present': "Path(OUT/'artifact-identity-gate-manifest.json').write_bytes(manifest_bytes)" in s59,
            'identity_serialization_present': "json.dumps(identity_table, sort_keys=True, indent=2) + '\\n'" in s59,
            'manifest_serialization_present': "json.dumps(patch_manifest, sort_keys=True, indent=2) + '\\n'" in s59,
          }
          if source_path_counts[table_path]!=1 or source_path_counts[manifest_path]!=1 or not all(write_receipts.values()):
            raise SystemExit(f'V64_PROVENANCE_FAIL V59 deterministic writer proof {source_path_counts} {write_receipts}')

          targets=[TABLE_TARGET,MANIFEST_TARGET]
          derived_hashes=[TABLE_DERIVED,MANIFEST_DERIVED]
          occurrences=[]; byte_receipts=[]
          def add_text(surface,name,data,authority,phase):
            text=data.decode('utf-8','replace')
            for target in targets:
              start=0
              while True:
                i=text.find(target,start)
                if i<0: break
                line=text.count('\n',0,i)+1; ls=text.rfind('\n',0,i)+1; le=text.find('\n',i); le=len(text) if le<0 else le
                occurrences.append({'target':target,'surface':surface,'name':name,'authority':authority,'phase':phase,'line':line,'context':text[ls:le][:1000]})
                start=i+1
          def scan_zip(label,zbytes,depth=0,prefix=''):
            try: z=zipfile.ZipFile(io.BytesIO(zbytes))
            except Exception: return
            for info in z.infolist():
              if info.is_dir(): continue
              data=z.read(info.filename); full=f'{prefix}{info.filename}'
              h=H(data)
              if h in targets: byte_receipts.append({'target':h,'surface':label,'member':full,'size':len(data),'kind':'exact_member_bytes'})
              add_text(label,full,data,'artifact-member','execution-evidence')
              if depth<3 and data[:4]==b'PK\x03\x04': scan_zip(label,data,depth+1,full+'!/')

          # Workflows, accepted checkpoint bodies, job logs, current V59/V62/V63 artifacts.
          for label,data in wf.items(): add_text('workflow',label,data,'git-blob','source')
          for cid,body in accepted.items(): add_text('accepted-comment',str(cid),body.encode(),'issue-comment','checkpoint')
          logs=Path('fetched-v64/v59-job-logs.bin').read_bytes(); add_text('v59-job-logs','105651240149',logs,'github-actions-job-log','execution')
          for label,path in [('v59-artifact-current','artifacts-v64/v59-current.zip'),('v62-artifact','artifacts-v64/v62.zip'),('v63-artifact','artifacts-v64/v63.zip')]: scan_zip(label,Path(path).read_bytes())

          # Full Issue #60 chronology for first introduction / later propagation.
          all_comments=[]
          for p in sorted(Path('fetched-v64').glob('comments-page-*.json'),key=lambda x:int(x.stem.split('-')[-1])):
            all_comments.extend(json.loads(p.read_text()))
          chronology=[]
          for c in all_comments:
            body=c.get('body') or ''
            for target in targets:
              if target in body: chronology.append({'target':target,'comment_id':c.get('id'),'created_at':c.get('created_at'),'user':(c.get('user') or {}).get('login'),'count':body.count(target),'context':[ln[:1000] for ln in body.splitlines() if target in ln]})
          chronology.sort(key=lambda x:(x['target'],x['comment_id'] or 0))
          first_intro={t:next((x for x in chronology if x['target']==t),None) for t in targets}

          # Historical-target string must not exist in the immutable pre-checkpoint V59 source or V59 execution log.
          precheckpoint_occ=[o for o in occurrences if o['target'] in targets and ((o['surface']=='workflow' and o['name'] in ('v58','v59')) or o['surface']=='v59-job-logs')]
          # Exact-byte receipt means actual authoritative bytes whose own SHA equals the frozen target.
          historical_bytes_proven=all(any(r['target']==t for r in byte_receipts) for t in targets)
          first_intro_is_v59_checkpoint=all(first_intro[t] and first_intro[t]['comment_id']==5732127187 for t in targets)
          source_outputs_unique=(tsha==TABLE_DERIVED and msha==MANIFEST_DERIVED and len(tset)==1 and len(mset)==1)
          target_differs_from_outputs=(TABLE_TARGET!=tsha and MANIFEST_TARGET!=msha)
          no_precheckpoint_computation_receipt=(len(precheckpoint_occ)==0 and not historical_bytes_proven)

          if historical_bytes_proven:
            classification='HISTORICAL_TARGET_BYTES_PROVEN'
          elif first_intro_is_v59_checkpoint and source_outputs_unique and target_differs_from_outputs and no_precheckpoint_computation_receipt and all(write_receipts.values()):
            classification='FROZEN_TARGET_DECLARATION_STALE_OR_MISRECORDED_PROVEN'
          else:
            classification='PROVENANCE_UNRESOLVED'

          graph={
            'schema':1,
            'classification':classification,
            'frozen_targets':{'table':TABLE_TARGET,'manifest':MANIFEST_TARGET},
            'unique_source_defined_outputs':{'table':tsha,'manifest':msha,'derivations':2},
            'v59_source_identity':{'blob_sha1':BLOBS['v59'],'sha256':H(wf['v59']),'size':len(wf['v59'])},
            'v59_run':{'id':run.get('id'),'attempt':run.get('run_attempt'),'head_sha':run.get('head_sha'),'conclusion':run.get('conclusion')},
            'v59_job':{'id':job_matches[0].get('id'),'conclusion':job_matches[0].get('conclusion')},
            'deterministic_writer_proof':{'path_counts':source_path_counts,'receipts':write_receipts},
            'first_issue_occurrence':first_intro,
            'precheckpoint_source_or_log_target_occurrences':precheckpoint_occ,
            'exact_target_byte_receipts':byte_receipts,
            'occurrence_count':len(occurrences),
            'issue_chronology_count':len(chronology),
            'reasoning_flags':{
              'first_intro_is_v59_checkpoint':first_intro_is_v59_checkpoint,
              'source_outputs_unique':source_outputs_unique,
              'target_differs_from_outputs':target_differs_from_outputs,
              'no_precheckpoint_computation_receipt':no_precheckpoint_computation_receipt,
              'checkpoint_prose_alone_used_as_byte_proof':False,
              'current_outer_artifact_identity_used_as_historical_truth':False,
              'target_guided_construction_used':False,
              'manual_historical_json_recreation_used':False,
              'downstream_execution_performed':False,
              'b_selected':False,'b_resolved':False
            }
          }
          Path(OUT/'target-hash-occurrences.json').write_text(json.dumps(occurrences,indent=2,sort_keys=True)+'\n')
          Path(OUT/'issue60-target-hash-chronology.json').write_text(json.dumps(chronology,indent=2,sort_keys=True)+'\n')
          Path(OUT/'exact-target-byte-receipts.json').write_text(json.dumps(byte_receipts,indent=2,sort_keys=True)+'\n')
          Path(OUT/'authoritative-provenance-graph.json').write_text(json.dumps(graph,indent=2,sort_keys=True)+'\n')
          Path(OUT/'CLASSIFICATION').write_text(classification+'\n')

          # Exact V63 -> V64 harness-only diff. V64 contains no preserved downstream child execution.
          v63=Path('fetched-v64/v63-workflow-raw.yml').read_text().splitlines(True)
          v64=Path('fetched-v64/v64-workflow-raw.yml').read_text().splitlines(True)
          diff=''.join(difflib.unified_diff(v63,v64,fromfile='lowalt-lt5-p-worker-module-v63.yml',tofile='lowalt-lt5-p-worker-module-v64.yml',n=3))
          Path(OUT/'v63-to-v64-harness-only.diff').write_text(diff)
          harness={'schema':1,'scope':'V64_FORENSIC_ONLY_FROZEN_V59_TARGET_HASH_PROVENANCE','v63_blob':BLOBS['v63'],'v63_sha256':H(wf['v63']),'v64_sha256':H(Path('fetched-v64/v64-workflow-raw.yml').read_bytes()),'diff_sha256':H(diff.encode()),'v54_patch_executed':False,'v51_gate_executed':False,'origin_transport_executed':False,'v45_replay_executed':False,'chkerr_out_executed':False,'p_link_executed':False,'result_work_executed':False,'b_selected':False,'b_resolved':False}
          Path(OUT/'v64-harness-scope.json').write_text(json.dumps(harness,indent=2,sort_keys=True)+'\n')
          print('V64_CLASSIFICATION='+classification)
          print('V64_TABLE_SOURCE_DEFINED_SHA='+tsha)
          print('V64_MANIFEST_SOURCE_DEFINED_SHA='+msha)
          print('V64_FIRST_TABLE_COMMENT='+str(first_intro[TABLE_TARGET]['comment_id'] if first_intro[TABLE_TARGET] else None))
          print('V64_FIRST_MANIFEST_COMMENT='+str(first_intro[MANIFEST_TARGET]['comment_id'] if first_intro[MANIFEST_TARGET] else None))
          PY_V64

      - name: Freeze V64 forensic PRE-RESULT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-worker-module-v64-evidence
          path: |
            evidence/v64-target-provenance/
            fetched-v64/
            artifacts-v64/
          if-no-files-found: error
          compression-level: 6
          retention-days: 90
