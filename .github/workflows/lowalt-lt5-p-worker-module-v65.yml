name: LowAlt LT5 P Worker Module Corrected V59 Source Output Identity V65

on:
  push:
    branches:
      - review/lowalt-lt5-p-worker-module-v65-20260918
    paths:
      - .github/workflows/lowalt-lt5-p-worker-module-v65.yml

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  corrected-v59-source-output-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Prove corrected V59 source-output identity and execute preserved PRE-RESULT chain
        id: corrected_identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p fetched-v65 artifacts-v65 bootstrap evidence/v65-source-output-identity

          api_get() {
            local url="$1" out="$2"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$url" -o "$out"
          }

          # Exact accepted governance/evidence surfaces.
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/issues/comments/5735630929" fetched-v65/v64-checkpoint.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/issues/comments/5735866583" fetched-v65/v65-coordinator.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/issues/comments/5732127187" fetched-v65/v59-checkpoint.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/lowalt-lt5-p-worker-module-v64.yml?ref=dc8b73a2750eef4860e3803db53294f403895d19" fetched-v65/v64-workflow.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/lowalt-lt5-p-worker-module-v63.yml?ref=11e6acdf8a04bec0a4db7428c481f43c47e371ca" fetched-v65/v63-workflow.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/lowalt-lt5-p-worker-module-v59.yml?ref=46593d008ed9b2c737c5514bf42f36c4a4011ccc" fetched-v65/v59-workflow.json
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/search-maker/twilight-mystic-experiments/11e6acdf8a04bec0a4db7428c481f43c47e371ca/.github/workflows/lowalt-lt5-p-worker-module-v63.yml" \
            -o fetched-v65/v63-workflow-raw.yml
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/search-maker/twilight-mystic-experiments/dc8b73a2750eef4860e3803db53294f403895d19/.github/workflows/lowalt-lt5-p-worker-module-v64.yml" \
            -o fetched-v65/v64-workflow-raw.yml
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/search-maker/twilight-mystic-experiments/${GITHUB_SHA}/.github/workflows/lowalt-lt5-p-worker-module-v65.yml" \
            -o fetched-v65/v65-workflow-raw.yml
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/compare/6cd7c075766fe0c86bc7561ec205a3f9120fd1fb...${GITHUB_SHA}" fetched-v65/main-to-v65-compare.json

          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/10566170653" fetched-v65/v64-artifact.json
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/10566170653/zip" \
            -o artifacts-v65/v64-evidence.zip

          python3 - <<'PY_V65'
          import base64
          import collections
          import difflib
          import hashlib
          import io
          import json
          import shutil
          import subprocess
          import sys
          import zipfile
          from pathlib import Path

          OUT = Path('evidence/v65-source-output-identity')
          OUT.mkdir(parents=True, exist_ok=True)

          MAIN = '6cd7c075766fe0c86bc7561ec205a3f9120fd1fb'
          V64_HEAD = 'dc8b73a2750eef4860e3803db53294f403895d19'
          V64_BLOB = '5eec248829996fdabdd488168e3943dc51de6909'
          V63_BLOB = '3a749f80cdfb1a9280fb2bee23d5a01956c38374'
          V59_BLOB = '3228ab81bd3f1983cce2afb4a167a4fa187d841f'
          V64_ARTIFACT_ID = 10566170653
          V64_ARTIFACT_SHA = 'd26367ac95cb4d375b3cd9b5a590305f571776ca45e9ac8ca62bc1f74ddf038b'
          V64_ARTIFACT_SIZE = 10948866
          V64_RUN = 35390036936
          V64_CLASS_SHA = 'c6faff241647e998b6476356b2a349e0b06e7dd2577904d5b573c597cad148dd'
          V64_GRAPH_SHA = 'c5a3af5e55a703d4a61feff32fc905506f1208ddfa3c853dc6620f7d8b9ed316'
          V64_OCC_SHA = '9330f206055a2d642e319ba89485f50d012f73752b3aad4aad511a55efd32414'
          V64_RECEIPT_SHA = '37517e5f3dc66819f61f5a7bb8ace1921282415f10551d2defa5c3eb0985b570'
          V59_GENERATOR_SHA = 'd393880e34ddefac2a95730896338bf5ce72b14f5fcca78a468ab5ddc3f4d3ab'
          HIST_TABLE = '631b52bb8bd4f4f3c3d7cdf0a4ad23dab558c7c27649bb746a064fe59ff36f80'
          HIST_MANIFEST = 'fe48c37dea56b3c5b03b99237d6ea52337b4f92aafeac389b597aea08ce62bf6'
          V59_SOURCE_DEFINED_TABLE_SHA256 = '9d1f9817c71f9873052b1e0735de3285588d18a2789ee22b1addca9336078d3f'
          V59_SOURCE_DEFINED_MANIFEST_SHA256 = 'c6be26dc8da045cb4199a1bf7b58a6eb0a4974c306e95b11a1fa58ca9f80ab89'
          V62_SHA = 'e418414af8cfd11b6dce15e32a19b8330643852d9ff147aca5283b13dcdc5584'
          V62_SIZE = 2441545
          V63_SHA = 'aced4e04089ecc537fbb6ba0bceb2ee077f9124b4f75d909837dd524e7cb1e7a'
          V63_SIZE = 2981550

          def H(data):
              return hashlib.sha256(data).hexdigest()

          def G(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()

          def decode_contents(path, expected_blob):
              obj = json.loads(Path(path).read_text())
              if obj.get('sha') != expected_blob:
                  raise SystemExit(f'V65_BIND_FAIL contents blob {path} {obj.get("sha")}')
              data = base64.b64decode(obj['content'])
              if G(data) != expected_blob:
                  raise SystemExit(f'V65_BIND_FAIL recomputed blob {path} {G(data)}')
              return data

          # Bind V64 classification and current direct authorization exactly.
          cp64 = json.loads(Path('fetched-v65/v64-checkpoint.json').read_text())
          coord = json.loads(Path('fetched-v65/v65-coordinator.json').read_text())
          cp59 = json.loads(Path('fetched-v65/v59-checkpoint.json').read_text())
          if cp64.get('id') != 5735630929 or cp64.get('user',{}).get('login') != 'search-maker':
              raise SystemExit('V65_BIND_FAIL V64 checkpoint')
          if coord.get('id') != 5735866583 or coord.get('user',{}).get('login') != 'search-maker':
              raise SystemExit('V65_BIND_FAIL Coordinator')
          cbody = coord.get('body','')
          required_coord = [
              'FROZEN_TARGET_DECLARATION_STALE_OR_MISRECORDED_PROVEN',
              'V59_SOURCE_DEFINED_TABLE_SHA256=' + V59_SOURCE_DEFINED_TABLE_SHA256,
              'V59_SOURCE_DEFINED_MANIFEST_SHA256=' + V59_SOURCE_DEFINED_MANIFEST_SHA256,
              V64_CLASS_SHA, V64_GRAPH_SHA, V64_OCC_SHA, V64_RECEIPT_SHA, V59_GENERATOR_SHA,
          ]
          if any(x not in cbody for x in required_coord):
              raise SystemExit('V65_BIND_FAIL Coordinator literals')
          if cp59.get('id') != 5732127187 or HIST_TABLE not in cp59.get('body','') or HIST_MANIFEST not in cp59.get('body',''):
              raise SystemExit('V65_BIND_FAIL frozen V59 historical declarations')
          Path(OUT/'historical-v59-checkpoint-body.txt').write_text(cp59.get('body',''))

          v64 = decode_contents('fetched-v65/v64-workflow.json', V64_BLOB)
          v63 = decode_contents('fetched-v65/v63-workflow.json', V63_BLOB)
          v59 = decode_contents('fetched-v65/v59-workflow.json', V59_BLOB)
          if v63 != Path('fetched-v65/v63-workflow-raw.yml').read_bytes():
              raise SystemExit('V65_BIND_FAIL V63 representations disagree')
          if v64 != Path('fetched-v65/v64-workflow-raw.yml').read_bytes():
              raise SystemExit('V65_BIND_FAIL V64 representations disagree')

          # Branch mutation scope must be exactly one added workflow file from the authorized main.
          comp = json.loads(Path('fetched-v65/main-to-v65-compare.json').read_text())
          files = comp.get('files') or []
          expected_path = '.github/workflows/lowalt-lt5-p-worker-module-v65.yml'
          if comp.get('base_commit',{}).get('sha') != MAIN or len(files) != 1 or files[0].get('filename') != expected_path or files[0].get('status') != 'added':
              raise SystemExit('V65_BIND_FAIL branch is not harness-only single workflow addition')

          # Bind V64 outer artifact and required frozen internal evidence identities.
          meta = json.loads(Path('fetched-v65/v64-artifact.json').read_text())
          if meta.get('id') != V64_ARTIFACT_ID or meta.get('digest') != 'sha256:' + V64_ARTIFACT_SHA or meta.get('size_in_bytes') != V64_ARTIFACT_SIZE:
              raise SystemExit('V65_BIND_FAIL V64 artifact metadata')
          if meta.get('workflow_run',{}).get('id') != V64_RUN or meta.get('workflow_run',{}).get('head_sha') != V64_HEAD or meta.get('expired') is not False:
              raise SystemExit('V65_BIND_FAIL V64 artifact workflow identity')
          z64b = Path('artifacts-v65/v64-evidence.zip').read_bytes()
          if len(z64b) != V64_ARTIFACT_SIZE or H(z64b) != V64_ARTIFACT_SHA:
              raise SystemExit('V65_BIND_FAIL V64 artifact transport')
          with zipfile.ZipFile(io.BytesIO(z64b)) as z64:
              names = [i.filename for i in z64.infolist() if not i.is_dir()]
              required = {
                  'classification': 'evidence/v64-target-provenance/CLASSIFICATION',
                  'graph': 'evidence/v64-target-provenance/authoritative-provenance-graph.json',
                  'occ': 'evidence/v64-target-provenance/target-hash-occurrences.json',
                  'receipts': 'evidence/v64-target-provenance/exact-target-byte-receipts.json',
                  'generator': 'evidence/v64-target-provenance/source-defined-v59-generator.py',
                  'v58_json': 'fetched-v64/v58-workflow.json',
                  'v57_api': 'fetched-v64/v57-artifacts.json',
                  'v57_zip': 'artifacts-v64/v57.zip',
                  'v62_zip': 'artifacts-v64/v62.zip',
                  'v63_zip': 'artifacts-v64/v63.zip',
              }
              for p in required.values():
                  if names.count(p) != 1:
                      raise SystemExit(f'V65_BIND_FAIL V64 member cardinality {p}={names.count(p)}')
              blobs = {k:z64.read(p) for k,p in required.items()}
          frozen_internal = {
              'classification': V64_CLASS_SHA,
              'graph': V64_GRAPH_SHA,
              'occ': V64_OCC_SHA,
              'receipts': V64_RECEIPT_SHA,
              'generator': V59_GENERATOR_SHA,
          }
          for k, expected in frozen_internal.items():
              if H(blobs[k]) != expected:
                  raise SystemExit(f'V65_BIND_FAIL V64 frozen member {k} sha={H(blobs[k])}')
          if blobs['classification'] != b'FROZEN_TARGET_DECLARATION_STALE_OR_MISRECORDED_PROVEN\n':
              raise SystemExit('V65_BIND_FAIL V64 classification bytes')
          graph = json.loads(blobs['graph'])
          if graph.get('classification') != 'FROZEN_TARGET_DECLARATION_STALE_OR_MISRECORDED_PROVEN':
              raise SystemExit('V65_BIND_FAIL V64 graph classification')
          u = graph.get('unique_source_defined_outputs',{})
          if u.get('table') != V59_SOURCE_DEFINED_TABLE_SHA256 or u.get('manifest') != V59_SOURCE_DEFINED_MANIFEST_SHA256 or u.get('derivations') != 2:
              raise SystemExit('V65_BIND_FAIL V64 source-defined identities')
          if json.loads(blobs['receipts']) != []:
              raise SystemExit('V65_BIND_FAIL V64 receipt inventory not empty')

          # Exact immutable V59 generator must re-extract from exact V59 workflow and match V64 frozen generator bytes.
          def extract_run(source):
              lines = source.splitlines(keepends=True)
              marker = b'        run: |\n'
              try:
                  start = lines.index(marker) + 1
              except ValueError:
                  raise SystemExit('V65_DERIVE_FAIL run marker absent')
              out=[]
              for line in lines[start:]:
                  if line.strip() and not line.startswith(b'          '):
                      break
                  out.append(line[10:] if line.startswith(b'          ') else line)
              return b''.join(out)
          r59 = extract_run(v59)
          hs = b"python3 - <<'PY_V59'\n"
          a = r59.find(hs)
          if a < 0:
              raise SystemExit('V65_DERIVE_FAIL PY_V59 start')
          a += len(hs)
          b = r59.find(b'\nPY_V59\n', a)
          if b < 0:
              raise SystemExit('V65_DERIVE_FAIL PY_V59 end')
          gen = r59[a:b+1]
          if H(gen) != V59_GENERATOR_SHA or gen != blobs['generator']:
              raise SystemExit('V65_BIND_FAIL exact V59 generator')

          # Bind accepted V62 50/11 durable member evidence carried immutably inside V64.
          if len(blobs['v62_zip']) != V62_SIZE or H(blobs['v62_zip']) != V62_SHA:
              raise SystemExit('V65_BIND_FAIL nested accepted V62 artifact')
          with zipfile.ZipFile(io.BytesIO(blobs['v62_zip'])) as z62:
              p_rows='evidence/v62-artifact-identity/required-v57-members.json'
              p_mark='evidence/v62-artifact-identity/DURABLE_REQUIRED_MEMBER_MATCH'
              p_cmp='evidence/v62-artifact-identity/metadata-transport-member-comparison.json'
              n62=[i.filename for i in z62.infolist() if not i.is_dir()]
              for p in (p_rows,p_mark,p_cmp):
                  if n62.count(p)!=1:
                      raise SystemExit(f'V65_BIND_FAIL V62 member {p}')
              rows62=json.loads(z62.read(p_rows)); mark62=z62.read(p_mark); cmp62=json.loads(z62.read(p_cmp))
          if mark62 != b'PASS 11/11 exact member bytes/SHA256; outer cause UNKNOWN\n' or len(rows62)!=11 or not all(r.get('exact') is True for r in rows62):
              raise SystemExit('V65_BIND_FAIL V62 durable 11/11 evidence')
          if cmp62.get('v57_transport',{}).get('member_count') != 50 or len(cmp62.get('required_members',[])) != 11:
              raise SystemExit('V65_BIND_FAIL V62 50/11 contract')

          # Bind accepted V63 deterministic derivation evidence carried inside V64.
          if len(blobs['v63_zip']) != V63_SIZE or H(blobs['v63_zip']) != V63_SHA:
              raise SystemExit('V65_BIND_FAIL nested accepted V63 artifact')
          with zipfile.ZipFile(io.BytesIO(blobs['v63_zip'])) as z63:
              n63=[i.filename for i in z63.infolist() if not i.is_dir()]
              paths=[]
              for label in ('derive-a','derive-b'):
                  paths.extend([
                    f'evidence/v63-v59-recovery/{label}/evidence/v59-artifact-identity/metadata-transport-member-identity-table.json',
                    f'evidence/v63-v59-recovery/{label}/evidence/v59-artifact-identity/artifact-identity-gate-manifest.json',
                  ])
              for p in paths:
                  if n63.count(p)!=1:
                      raise SystemExit(f'V65_BIND_FAIL V63 derivation member {p}')
              v63_outputs=[z63.read(p) for p in paths]
          if H(v63_outputs[0])!=V59_SOURCE_DEFINED_TABLE_SHA256 or H(v63_outputs[2])!=V59_SOURCE_DEFINED_TABLE_SHA256 or v63_outputs[0]!=v63_outputs[2]:
              raise SystemExit('V65_BIND_FAIL V63 table derivations')
          if H(v63_outputs[1])!=V59_SOURCE_DEFINED_MANIFEST_SHA256 or H(v63_outputs[3])!=V59_SOURCE_DEFINED_MANIFEST_SHA256 or v63_outputs[1]!=v63_outputs[3]:
              raise SystemExit('V65_BIND_FAIL V63 manifest derivations')

          # Independently reproduce both corrected identities twice from exact accepted V59 inputs before using them as predicates.
          deriv=[]
          for label in ('reproduce-a','reproduce-b'):
              root=OUT/label
              (root/'fetched-v59').mkdir(parents=True,exist_ok=True)
              (root/'bootstrap').mkdir(parents=True,exist_ok=True)
              (root/'evidence/v59-artifact-identity').mkdir(parents=True,exist_ok=True)
              (root/'fetched-v59/v58-workflow-api.json').write_bytes(blobs['v58_json'])
              (root/'fetched-v59/v57-artifacts-api.json').write_bytes(blobs['v57_api'])
              (root/'fetched-v59/v57-artifact-transport.zip').write_bytes(blobs['v57_zip'])
              (root/'generator.py').write_bytes(gen)
              p=subprocess.run([sys.executable,'generator.py'],cwd=root,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              (root/'generator.stdout').write_bytes(p.stdout)
              (root/'generator.stderr').write_bytes(p.stderr)
              (root/'generator.exit-code').write_text(str(p.returncode)+'\n')
              if p.returncode:
                  raise SystemExit(f'V65_DERIVE_FAIL {label} rc={p.returncode}')
              tb=(root/'evidence/v59-artifact-identity/metadata-transport-member-identity-table.json').read_bytes()
              mb=(root/'evidence/v59-artifact-identity/artifact-identity-gate-manifest.json').read_bytes()
              deriv.append((tb,mb))
          tset={x[0] for x in deriv}; mset={x[1] for x in deriv}
          if len(tset)!=1 or len(mset)!=1:
              raise SystemExit(f'V65_DERIVE_FAIL nonunique outputs table={len(tset)} manifest={len(mset)}')
          tb=next(iter(tset)); mb=next(iter(mset))
          if H(tb)!=V59_SOURCE_DEFINED_TABLE_SHA256 or H(mb)!=V59_SOURCE_DEFINED_MANIFEST_SHA256:
              raise SystemExit(f'V65_DERIVE_FAIL corrected identity mismatch table={H(tb)} manifest={H(mb)}')

          # Install only a separate successor predicate layer into exact V63 executable shell.
          r63=extract_run(v63)
          hist_block=(
              "          TABLE_TARGET = '"+HIST_TABLE+"'\n"
              "          MANIFEST_TARGET = '"+HIST_MANIFEST+"'\n"
          ).encode()
          successor_block=(
              "          TABLE_TARGET = '"+HIST_TABLE+"'\n"
              "          MANIFEST_TARGET = '"+HIST_MANIFEST+"'\n"
              "          V59_SOURCE_DEFINED_TABLE_SHA256 = '"+V59_SOURCE_DEFINED_TABLE_SHA256+"'\n"
              "          V59_SOURCE_DEFINED_MANIFEST_SHA256 = '"+V59_SOURCE_DEFINED_MANIFEST_SHA256+"'\n"
          ).encode()
          old_check=b'          if table_sha != TABLE_TARGET or manifest_sha != MANIFEST_TARGET:\n'
          new_check=b'          if table_sha != V59_SOURCE_DEFINED_TABLE_SHA256 or manifest_sha != V59_SOURCE_DEFINED_MANIFEST_SHA256:\n'
          if r63.count(hist_block)!=1 or r63.count(successor_block)!=0 or r63.count(old_check)!=1 or r63.count(new_check)!=0:
              raise SystemExit('V65_PATCH_FAIL correction predicate precondition')
          patched=r63.replace(hist_block,successor_block,1).replace(old_check,new_check,1)
          diff=''.join(difflib.unified_diff(r63.decode().splitlines(True),patched.decode().splitlines(True),fromfile='v63-run-original.sh',tofile='v63-run-patched-v65.sh',n=3))
          payload=[x for x in diff.splitlines() if (x.startswith('+') and not x.startswith('+++')) or (x.startswith('-') and not x.startswith('---'))]
          expected=collections.Counter([
              "+          V59_SOURCE_DEFINED_TABLE_SHA256 = '"+V59_SOURCE_DEFINED_TABLE_SHA256+"'",
              "+          V59_SOURCE_DEFINED_MANIFEST_SHA256 = '"+V59_SOURCE_DEFINED_MANIFEST_SHA256+"'",
              '-          if table_sha != TABLE_TARGET or manifest_sha != MANIFEST_TARGET:',
              '+          if table_sha != V59_SOURCE_DEFINED_TABLE_SHA256 or manifest_sha != V59_SOURCE_DEFINED_MANIFEST_SHA256:',
          ])
          if collections.Counter(payload)!=expected or len(payload)!=4:
              raise SystemExit(f'V65_PATCH_FAIL unexpected child diff payload {payload!r}')
          if HIST_TABLE not in patched.decode() or HIST_MANIFEST not in patched.decode():
              raise SystemExit('V65_PATCH_FAIL historical declarations not preserved in child')
          Path('bootstrap/v63-run-original-v65.sh').write_bytes(r63)
          Path('bootstrap/v63-run-patched-v65.sh').write_bytes(patched)
          Path(OUT/'v63-successor-predicate-only.diff').write_text(diff)

          # Freeze exact V64->V65 workflow diff plus machine proof that repository mutation is harness-only.
          v64_lines=Path('fetched-v65/v64-workflow-raw.yml').read_text().splitlines(True)
          v65_lines=Path('fetched-v65/v65-workflow-raw.yml').read_text().splitlines(True)
          full_diff=''.join(difflib.unified_diff(v64_lines,v65_lines,fromfile='lowalt-lt5-p-worker-module-v64.yml',tofile='lowalt-lt5-p-worker-module-v65.yml',n=3))
          Path(OUT/'v64-to-v65-harness-only.diff').write_text(full_diff)
          gate={
              'schema':1,
              'authority':'Coordinator 5735866583',
              'status':'CORRECTED_V59_SOURCE_OUTPUT_IDENTITY_PASS',
              'historical_v59_declarations_preserved':{'table':HIST_TABLE,'manifest':HIST_MANIFEST},
              'successor_source_defined_identity':{'table':V59_SOURCE_DEFINED_TABLE_SHA256,'manifest':V59_SOURCE_DEFINED_MANIFEST_SHA256},
              'independent_reproductions':2,
              'unique_table_candidates':len(tset),
              'unique_manifest_candidates':len(mset),
              'v64_classification_sha256':V64_CLASS_SHA,
              'v64_provenance_graph_sha256':V64_GRAPH_SHA,
              'v64_occurrence_inventory_sha256':V64_OCC_SHA,
              'v64_empty_receipt_inventory_sha256':V64_RECEIPT_SHA,
              'exact_v59_generator_blob_sha1':V59_BLOB,
              'exact_v59_generator_sha256':V59_GENERATOR_SHA,
              'v62_durable_required_member_match':'PASS_11_OF_11_EXACT_MEMBER_BYTES_SHA256',
              'v63_deterministic_derivation_exact':True,
              'child_patch_payload_line_count':len(payload),
              'child_patch_changes_only_successor_predicates':True,
              'repository_compare_exactly_one_added_workflow':True,
              'historical_checkpoint_mutated':False,
              'scientific_script_mutated':False,
              'source_defined_transport_mutated':False,
              'result_work_executed_by_gate':False,
              'b_selected':False,
              'b_resolved':False,
          }
          Path(OUT/'corrected-source-output-identity-gate.json').write_text(json.dumps(gate,indent=2,sort_keys=True)+'\n')
          Path(OUT/'CORRECTED_V59_SOURCE_OUTPUT_IDENTITY_PASS').write_text('PASS separately corrected source-defined V59 output identities reproduced twice before predicate use\n')
          print('CORRECTED_V59_SOURCE_OUTPUT_IDENTITY_PASS')
          print('V59_SOURCE_DEFINED_TABLE_SHA256='+V59_SOURCE_DEFINED_TABLE_SHA256)
          print('V59_SOURCE_DEFINED_MANIFEST_SHA256='+V59_SOURCE_DEFINED_MANIFEST_SHA256)
          PY_V65

          test -f evidence/v65-source-output-identity/CORRECTED_V59_SOURCE_OUTPUT_IDENTITY_PASS
          bash -n bootstrap/v63-run-patched-v65.sh
          set +e
          bash bootstrap/v63-run-patched-v65.sh >evidence/v65-source-output-identity/preserved-chain.stdout 2>evidence/v65-source-output-identity/preserved-chain.stderr
          CHILD_RC=$?
          set -e
          printf '%s\n' "$CHILD_RC" > evidence/v65-source-output-identity/preserved-chain.exit-code.txt
          if [ "$CHILD_RC" -ne 0 ]; then
            echo "V65_PRESERVED_CHAIN_FIRST_FALSE rc=${CHILD_RC}" >&2
            tail -n 160 evidence/v65-source-output-identity/preserved-chain.stderr >&2 || true
            exit "$CHILD_RC"
          fi

