name: LowAlt LT5 P Worker Module V65 Extracted-Shell Representation V66

on:
  push:
    branches:
      - review/lowalt-lt5-p-worker-module-v66-20260918
    paths:
      - .github/workflows/lowalt-lt5-p-worker-module-v66.yml

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  v65-extracted-shell-representation:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Repair only V65 extracted-shell successor-predicate precondition representation
        id: representation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p fetched-v66 bootstrap evidence/v66-representation

          api_get() {
            local url="$1" out="$2"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$url" -o "$out"
          }

          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/issues/comments/5736469602" fetched-v66/coordinator.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/issues/comments/5736218929" fetched-v66/v65-checkpoint.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/lowalt-lt5-p-worker-module-v65.yml?ref=eba5f9422ee947b89625a45a2538eea4ae61f705" fetched-v66/v65-workflow.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/lowalt-lt5-p-worker-module-v63.yml?ref=11e6acdf8a04bec0a4db7428c481f43c47e371ca" fetched-v66/v63-workflow.json
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/search-maker/twilight-mystic-experiments/eba5f9422ee947b89625a45a2538eea4ae61f705/.github/workflows/lowalt-lt5-p-worker-module-v65.yml" \
            -o fetched-v66/v65-workflow-raw.yml
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/search-maker/twilight-mystic-experiments/11e6acdf8a04bec0a4db7428c481f43c47e371ca/.github/workflows/lowalt-lt5-p-worker-module-v63.yml" \
            -o fetched-v66/v63-workflow-raw.yml
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/branches/main" fetched-v66/main.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/compare/6cd7c075766fe0c86bc7561ec205a3f9120fd1fb...${GITHUB_SHA}" fetched-v66/main-to-v66.json

          python3 - <<'PY_V66'
          import base64
          import collections
          import difflib
          import hashlib
          import json
          from pathlib import Path

          OUT = Path('evidence/v66-representation')
          OUT.mkdir(parents=True, exist_ok=True)

          MAIN = '6cd7c075766fe0c86bc7561ec205a3f9120fd1fb'
          COORD = 5736469602
          V65_CHECKPOINT = 5736218929
          V65_HEAD = 'eba5f9422ee947b89625a45a2538eea4ae61f705'
          V65_BLOB = '976e37d56ecf75e7db0b9bedb35d9eac19c0b859'
          V63_BLOB = '3a749f80cdfb1a9280fb2bee23d5a01956c38374'
          HIST_TABLE = '631b52bb8bd4f4f3c3d7cdf0a4ad23dab558c7c27649bb746a064fe59ff36f80'
          HIST_MANIFEST = 'fe48c37dea56b3c5b03b99237d6ea52337b4f92aafeac389b597aea08ce62bf6'
          CORR_TABLE = '9d1f9817c71f9873052b1e0735de3285588d18a2789ee22b1addca9336078d3f'
          CORR_MANIFEST = 'c6be26dc8da045cb4199a1bf7b58a6eb0a4974c306e95b11a1fa58ca9f80ab89'

          def H(data):
              return hashlib.sha256(data).hexdigest()

          def G(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()

          def decode_contents(path, expected_blob):
              obj = json.loads(Path(path).read_text())
              if obj.get('sha') != expected_blob:
                  raise SystemExit(f'V66_BIND_FAIL contents blob {path} {obj.get("sha")}')
              data = base64.b64decode(obj['content'])
              if G(data) != expected_blob:
                  raise SystemExit(f'V66_BIND_FAIL recomputed blob {path} {G(data)}')
              return data

          def extract_run(source):
              lines = source.splitlines(keepends=True)
              marker = b'        run: |\n'
              try:
                  start = lines.index(marker) + 1
              except ValueError:
                  raise SystemExit('V66_BIND_FAIL run marker absent')
              out=[]
              mapping=[]
              for idx in range(start, len(lines)):
                  line=lines[idx]
                  if line.strip() and not line.startswith(b'          '):
                      break
                  removed = 10 if line.startswith(b'          ') else 0
                  out.append(line[removed:])
                  mapping.append({'yaml_line_1_based': idx+1, 'removed_prefix_spaces': removed})
              return b''.join(out), mapping

          coord = json.loads(Path('fetched-v66/coordinator.json').read_text())
          cp65 = json.loads(Path('fetched-v66/v65-checkpoint.json').read_text())
          if coord.get('id') != COORD or coord.get('user',{}).get('login') != 'search-maker':
              raise SystemExit('V66_BIND_FAIL coordinator identity')
          cb = coord.get('body','')
          required = [
              'AUTHORIZED: exactly ONE fresh LowAlt PRE-RESULT V66 identity',
              'V66 may repair ONLY the V65 successor-predicate extracted-shell indentation/representation defect',
              V65_HEAD, V65_BLOB, CORR_TABLE, CORR_MANIFEST,
          ]
          if any(x not in cb for x in required):
              raise SystemExit('V66_BIND_FAIL coordinator literals')
          if cp65.get('id') != V65_CHECKPOINT or cp65.get('user',{}).get('login') != 'search-maker':
              raise SystemExit('V66_BIND_FAIL V65 checkpoint identity')
          if 'V65_PATCH_FAIL correction predicate precondition' not in cp65.get('body',''):
              raise SystemExit('V66_BIND_FAIL V65 first-false literal')

          main = json.loads(Path('fetched-v66/main.json').read_text())
          if main.get('commit',{}).get('sha') != MAIN:
              raise SystemExit('V66_BIND_FAIL main drift')
          comp = json.loads(Path('fetched-v66/main-to-v66.json').read_text())
          files = comp.get('files') or []
          expected_path = '.github/workflows/lowalt-lt5-p-worker-module-v66.yml'
          if comp.get('base_commit',{}).get('sha') != MAIN or len(files) != 1 or files[0].get('filename') != expected_path or files[0].get('status') != 'added':
              raise SystemExit('V66_BIND_FAIL branch is not harness-only single workflow addition')

          v65 = decode_contents('fetched-v66/v65-workflow.json', V65_BLOB)
          v63 = decode_contents('fetched-v66/v63-workflow.json', V63_BLOB)
          if v65 != Path('fetched-v66/v65-workflow-raw.yml').read_bytes():
              raise SystemExit('V66_BIND_FAIL V65 representations disagree')
          if v63 != Path('fetched-v66/v63-workflow-raw.yml').read_bytes():
              raise SystemExit('V66_BIND_FAIL V63 representations disagree')

          r65, map65 = extract_run(v65)
          r63, map63 = extract_run(v63)
          Path(OUT/'v65-run-original.sh').write_bytes(r65)
          Path(OUT/'v63-run-original.sh').write_bytes(r63)
          Path(OUT/'v65-run-extraction-map.json').write_text(json.dumps(map65, indent=2, sort_keys=True)+'\n')
          Path(OUT/'v63-run-extraction-map.json').write_text(json.dumps(map63, indent=2, sort_keys=True)+'\n')

          shell_table = ("TABLE_TARGET = '"+HIST_TABLE+"'\n").encode()
          shell_manifest = ("MANIFEST_TARGET = '"+HIST_MANIFEST+"'\n").encode()
          shell_check = b'if table_sha != TABLE_TARGET or manifest_sha != MANIFEST_TARGET:\n'
          yaml_table = b'          ' + shell_table
          yaml_manifest = b'          ' + shell_manifest
          yaml_check = b'          ' + shell_check

          rep_rows=[]
          for label, y, s in [
              ('TABLE_TARGET',yaml_table,shell_table),
              ('MANIFEST_TARGET',yaml_manifest,shell_manifest),
              ('comparison_predicate',yaml_check,shell_check),
          ]:
              yc=v63.count(y); sc=r63.count(s); wrong=r63.count(y)
              if yc != 1 or sc != 1 or wrong != 0:
                  raise SystemExit(f'V66_REP_FAIL {label} yaml={yc} shell={sc} shell_wrong10={wrong}')
              ylines=v63.splitlines(keepends=True); slines=r63.splitlines(keepends=True)
              yi=ylines.index(y)+1; si=slines.index(s)+1
              rep_rows.append({
                  'label':label,
                  'yaml_line_1_based':yi,
                  'shell_line_1_based':si,
                  'yaml_indent_spaces':10,
                  'shell_indent_spaces':0,
                  'yaml_hex':y.hex(),
                  'shell_hex':s.hex(),
                  'yaml_context':[x.decode(errors='replace').rstrip('\n') for x in ylines[max(0,yi-3):min(len(ylines),yi+2)]],
                  'shell_context':[x.decode(errors='replace').rstrip('\n') for x in slines[max(0,si-3):min(len(slines),si+2)]],
              })
          Path(OUT/'v63-yaml-vs-extracted-representation.json').write_text(json.dumps(rep_rows, indent=2, sort_keys=True)+'\n')

          # Repair ONLY the three V65 precondition-needle representations. Replacement payloads/assertions remain untouched.
          old_hist = (
              "hist_block=(\n"
              "    \"          TABLE_TARGET = '\"+HIST_TABLE+\"'\\n\"\n"
              "    \"          MANIFEST_TARGET = '\"+HIST_MANIFEST+\"'\\n\"\n"
              ").encode()\n"
          ).encode()
          new_hist = (
              "hist_block=(\n"
              "    \"TABLE_TARGET = '\"+HIST_TABLE+\"'\\n\"\n"
              "    \"MANIFEST_TARGET = '\"+HIST_MANIFEST+\"'\\n\"\n"
              ").encode()\n"
          ).encode()
          old_check_def = b"old_check=b'          if table_sha != TABLE_TARGET or manifest_sha != MANIFEST_TARGET:\\n'\n"
          new_check_def = b"old_check=b'if table_sha != TABLE_TARGET or manifest_sha != MANIFEST_TARGET:\\n'\n"

          counts = {
              'old_hist': r65.count(old_hist), 'new_hist_pre': r65.count(new_hist),
              'old_check': r65.count(old_check_def), 'new_check_pre': r65.count(new_check_def),
          }
          if counts != {'old_hist':1,'new_hist_pre':0,'old_check':1,'new_check_pre':0}:
              raise SystemExit(f'V66_PATCH_FAIL precondition {counts}')
          patched = r65.replace(old_hist,new_hist,1).replace(old_check_def,new_check_def,1)

          diff=''.join(difflib.unified_diff(r65.decode().splitlines(True),patched.decode().splitlines(True),fromfile='v65-run-original.sh',tofile='v65-run-patched-v66.sh',n=3))
          payload=[x for x in diff.splitlines() if (x.startswith('+') and not x.startswith('+++')) or (x.startswith('-') and not x.startswith('---'))]
          old_lines=old_hist.decode().splitlines()
          new_lines=new_hist.decode().splitlines()
          expected_payload=collections.Counter([
              '-'+old_lines[1], '+'+new_lines[1],
              '-'+old_lines[2], '+'+new_lines[2],
              '-'+old_check_def.decode().rstrip('\n'),
              '+'+new_check_def.decode().rstrip('\n'),
          ])
          if collections.Counter(payload) != expected_payload or len(payload) != 6:
              raise SystemExit(f'V66_PATCH_FAIL unexpected harness payload {payload!r}')

          forbidden_changed = [
              'successor_block=(',
              'new_check=',
              'V59_SOURCE_DEFINED_TABLE_SHA256',
              'V59_SOURCE_DEFINED_MANIFEST_SHA256',
              'base64 -d | gzip -dc',
          ]
          # Presence is required on both sides; the diff payload itself must not add/remove these semantic literals.
          if any(x not in r65.decode() or x not in patched.decode() for x in forbidden_changed):
              raise SystemExit('V66_PATCH_FAIL preserved semantic/source-transform literals absent')
          if any(('V59_SOURCE_DEFINED_' in x or 'successor_block' in x or 'new_check=' in x or 'base64 -d | gzip -dc' in x) for x in payload):
              raise SystemExit('V66_PATCH_FAIL unauthorized semantic/source-transform diff')

          Path('bootstrap/v65-run-patched-v66.sh').write_bytes(patched)
          Path(OUT/'v65-to-v66-precondition-representation.diff').write_text(diff)
          Path(OUT/'old-new-needle-bytes.json').write_text(json.dumps({
              'old_hist_hex':old_hist.hex(),'new_hist_hex':new_hist.hex(),
              'old_check_hex':old_check_def.hex(),'new_check_hex':new_check_def.hex(),
              'payload':payload,
          }, indent=2, sort_keys=True)+'\n')
          Path(OUT/'REPRESENTATION_GATE_PASS').write_text('PASS: exact 10-space YAML-source precondition needles mapped to column-0 extracted-shell representations only\n')
          print('REPRESENTATION_GATE_PASS')
          print('V65_RUN_ORIGINAL_SHA256='+H(r65))
          print('V65_RUN_PATCHED_V66_SHA256='+H(patched))
          print('V65_TO_V66_DIFF_SHA256='+H(diff.encode()))
          PY_V66

          test -f evidence/v66-representation/REPRESENTATION_GATE_PASS
          bash -n bootstrap/v65-run-patched-v66.sh
          set +e
          GITHUB_SHA="eba5f9422ee947b89625a45a2538eea4ae61f705" \
            bash bootstrap/v65-run-patched-v66.sh \
            >evidence/v66-representation/preserved-v65-child.stdout \
            2>evidence/v66-representation/preserved-v65-child.stderr
          CHILD_RC=$?
          set -e
          printf '%s\n' "$CHILD_RC" > evidence/v66-representation/preserved-v65-child.exit-code.txt
          if [ "$CHILD_RC" -ne 0 ]; then
            echo "V66_PRESERVED_V65_FIRST_FALSE rc=${CHILD_RC}" >&2
            tail -n 200 evidence/v66-representation/preserved-v65-child.stderr >&2 || true
            exit "$CHILD_RC"
          fi

      - name: Freeze V66 PRE-RESULT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-worker-module-v66
          path: |
            fetched-v66
            bootstrap
            evidence
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
