name: LowAlt LT5 P Worker Module Authority Literal V68

on:
  push:
    branches:
      - review/lowalt-lt5-p-worker-module-v68-20260919
    paths:
      - .github/workflows/lowalt-lt5-p-worker-module-v68.yml

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  v67-authority-literal:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Repair only V67 Coordinator authority literal binding
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p fetched-v68 bootstrap evidence/v68-authority-literal

          api_get() {
            local url="$1" out="$2"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$url" -o "$out"
          }

          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/issues/comments/5746492946" fetched-v68/coordinator-v68.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/issues/comments/5737002205" fetched-v68/coordinator-v67.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/lowalt-lt5-p-worker-module-v67.yml?ref=f7dcf09021d76548815ec26c8098953c6d5cde06" fetched-v68/v67-workflow.json
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/search-maker/twilight-mystic-experiments/f7dcf09021d76548815ec26c8098953c6d5cde06/.github/workflows/lowalt-lt5-p-worker-module-v67.yml" \
            -o fetched-v68/v67-workflow-raw.yml
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/runs/35479326200" fetched-v68/v67-run.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/jobs/105994135026" fetched-v68/v67-job.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/10595172504" fetched-v68/v67-artifact.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/branches/main" fetched-v68/main.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/compare/6cd7c075766fe0c86bc7561ec205a3f9120fd1fb...${GITHUB_SHA}" fetched-v68/main-to-v68.json

          python3 - <<'PY_V68'
          import base64, difflib, hashlib, json
          from pathlib import Path

          OUT=Path('evidence/v68-authority-literal'); OUT.mkdir(parents=True,exist_ok=True)
          MAIN='6cd7c075766fe0c86bc7561ec205a3f9120fd1fb'
          V67_HEAD='f7dcf09021d76548815ec26c8098953c6d5cde06'
          V67_BLOB='3d042a01ad4b706b0bd3860b0d675b232aab622f'
          V67_RUN=35479326200; V67_JOB=105994135026; V67_ART=10595172504
          V67_DIGEST='sha256:7e4c0e20b27cc39c8fab6d7d56528c1fc6694abb69b77d2e5808ebcacdc3ea04'
          OLD="'V67 may repair ONLY this preservation-guard scope defect',"
          NEW="'V67 may repair ONLY this newly exposed preservation-guard SCOPE defect.',"

          def H(b): return hashlib.sha256(b).hexdigest()
          def G(b): return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          def extract_run(src):
            lines=src.splitlines(keepends=True); marker=b'        run: |\n'
            start=lines.index(marker)+1; out=[]
            for line in lines[start:]:
              if line.strip() and not line.startswith(b'          '): break
              out.append(line[10:] if line.startswith(b'          ') else line)
            return b''.join(out)

          c68=json.loads(Path('fetched-v68/coordinator-v68.json').read_text())
          c67=json.loads(Path('fetched-v68/coordinator-v67.json').read_text())
          if c68.get('id')!=5746492946 or c68.get('user',{}).get('login')!='search-maker': raise SystemExit('V68_BIND_FAIL coordinator v68 identity')
          b68=c68.get('body','')
          for x in ['Exactly ONE fresh LowAlt PRE-RESULT V68 identity is authorized','V68 may repair ONLY this exact Coordinator-authority literal binding predicate.', 'No V69 absent later direct Coordinator transition.']:
            if x not in b68: raise SystemExit('V68_BIND_FAIL coordinator v68 literal '+x)
          if c67.get('id')!=5737002205 or c67.get('user',{}).get('login')!='search-maker': raise SystemExit('V68_BIND_FAIL coordinator v67 identity')
          authoritative='V67 may repair ONLY this newly exposed preservation-guard SCOPE defect.'
          if authoritative not in c67.get('body',''): raise SystemExit('V68_BIND_FAIL authoritative sentence absent')

          obj=json.loads(Path('fetched-v68/v67-workflow.json').read_text())
          if obj.get('sha')!=V67_BLOB: raise SystemExit('V68_BIND_FAIL V67 blob')
          v67=base64.b64decode(obj['content'])
          if G(v67)!=V67_BLOB or v67!=Path('fetched-v68/v67-workflow-raw.yml').read_bytes(): raise SystemExit('V68_BIND_FAIL V67 representations')
          run=json.loads(Path('fetched-v68/v67-run.json').read_text())
          job=json.loads(Path('fetched-v68/v67-job.json').read_text())
          art=json.loads(Path('fetched-v68/v67-artifact.json').read_text())
          if run.get('id')!=V67_RUN or run.get('run_attempt')!=1 or run.get('conclusion')!='failure' or run.get('head_sha')!=V67_HEAD: raise SystemExit('V68_BIND_FAIL V67 run')
          if job.get('id')!=V67_JOB or job.get('conclusion')!='failure': raise SystemExit('V68_BIND_FAIL V67 job')
          if art.get('id')!=V67_ART or art.get('digest')!=V67_DIGEST or art.get('expired'): raise SystemExit('V68_BIND_FAIL V67 artifact')
          main=json.loads(Path('fetched-v68/main.json').read_text())
          if main.get('commit',{}).get('sha')!=MAIN: raise SystemExit('V68_BIND_FAIL main drift')
          comp=json.loads(Path('fetched-v68/main-to-v68.json').read_text()); files=comp.get('files') or []
          if comp.get('base_commit',{}).get('sha')!=MAIN or len(files)!=1 or files[0].get('filename')!='.github/workflows/lowalt-lt5-p-worker-module-v68.yml' or files[0].get('status')!='added': raise SystemExit('V68_BIND_FAIL branch scope')

          r=extract_run(v67); text=r.decode()
          if text.count(OLD)!=1 or text.count(NEW)!=0: raise SystemExit(f'V68_PATCH_FAIL old={text.count(OLD)} new={text.count(NEW)}')
          patched=text.replace(OLD,NEW,1).encode()
          diff=''.join(difflib.unified_diff(text.splitlines(True),patched.decode().splitlines(True),fromfile='v67-run-original.sh',tofile='v67-run-patched-v68.sh',n=3))
          payload=[x for x in diff.splitlines() if (x.startswith('+') and not x.startswith('+++')) or (x.startswith('-') and not x.startswith('---'))]
          if payload!=['-'+OLD,'+'+NEW]: raise SystemExit('V68_PATCH_FAIL non-literal diff '+repr(payload))
          Path('bootstrap/v67-run-patched-v68.sh').write_bytes(patched)
          Path(OUT/'v67-to-v68-authority-literal.diff').write_text(diff)
          Path(OUT/'AUTHORITY_LITERAL_GATE_PASS').write_text('PASS exact Coordinator sentence bound; only stale V67 required literal corrected\n')
          Path(OUT/'receipt.json').write_text(json.dumps({'status':'PASS_PRE_RESULT_V68_AUTHORITY_LITERAL_ONLY','v67_run_sha256':H(r),'v68_patched_run_sha256':H(patched),'diff_sha256':H(diff.encode()),'historical_checkpoint_mutation':False,'scientific_script_mutation':False,'source_defined_transport_mutation':False,'b_selected':False,'b_resolved':False},indent=2,sort_keys=True)+'\n')
          print('AUTHORITY_LITERAL_GATE_PASS')
          PY_V68

          test -f evidence/v68-authority-literal/AUTHORITY_LITERAL_GATE_PASS
          bash -n bootstrap/v67-run-patched-v68.sh
          set +e
          GITHUB_SHA="f7dcf09021d76548815ec26c8098953c6d5cde06" \
            bash bootstrap/v67-run-patched-v68.sh \
            >evidence/v68-authority-literal/preserved-v67-child.stdout \
            2>evidence/v68-authority-literal/preserved-v67-child.stderr
          CHILD_RC=$?
          set -e
          printf '%s\n' "$CHILD_RC" > evidence/v68-authority-literal/preserved-v67-child.exit-code.txt
          if [ "$CHILD_RC" -ne 0 ]; then
            echo "V68_PRESERVED_V67_FIRST_FALSE rc=${CHILD_RC}" >&2
            tail -n 260 evidence/v68-authority-literal/preserved-v67-child.stderr >&2 || true
            exit "$CHILD_RC"
          fi

      - name: Freeze V68 PRE-RESULT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-worker-module-v68
          path: |
            fetched-v68
            bootstrap
            evidence
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
