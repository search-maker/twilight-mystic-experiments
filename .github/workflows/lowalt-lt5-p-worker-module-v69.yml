name: LowAlt LT5 P Worker Module Authority Diff V69

on:
  push:
    branches:
      - review/lowalt-lt5-p-worker-module-v69-20260919
    paths:
      - .github/workflows/lowalt-lt5-p-worker-module-v69.yml

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  v68-authority-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Repair only V68 authority-diff payload representation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p fetched-v69 bootstrap evidence/v69-authority-diff

          api_get() {
            local url="$1" out="$2"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$url" -o "$out"
          }

          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/issues/comments/5746508858" fetched-v69/coordinator-v69.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/lowalt-lt5-p-worker-module-v68.yml?ref=3d7e0fdb0e86820592a36a8996238e531d0ed673" fetched-v69/v68-workflow.json
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/search-maker/twilight-mystic-experiments/3d7e0fdb0e86820592a36a8996238e531d0ed673/.github/workflows/lowalt-lt5-p-worker-module-v68.yml" \
            -o fetched-v69/v68-workflow-raw.yml
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/runs/35479583901" fetched-v69/v68-run.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/jobs/105994842270" fetched-v69/v68-job.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/10596015187" fetched-v69/v68-artifact.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/branches/main" fetched-v69/main.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/compare/6cd7c075766fe0c86bc7561ec205a3f9120fd1fb...${GITHUB_SHA}" fetched-v69/main-to-v69.json

          python3 - <<'PY_V69'
          import base64, difflib, hashlib, json
          from pathlib import Path

          OUT=Path('evidence/v69-authority-diff'); OUT.mkdir(parents=True,exist_ok=True)
          MAIN='6cd7c075766fe0c86bc7561ec205a3f9120fd1fb'
          V68_HEAD='3d7e0fdb0e86820592a36a8996238e531d0ed673'
          V68_BLOB='e1f0dded96aafcad74e662928fe34edde627c01c'
          V68_RUN=35479583901; V68_JOB=105994842270; V68_ART=10596015187
          V68_DIGEST='sha256:ab3c86a98a4f8775cf27bb6e42f57d215f5a4474ad28aafe25af5cd61284b4e0'
          OLD="if payload!=['-'+OLD,'+'+NEW]: raise SystemExit('V68_PATCH_FAIL non-literal diff '+repr(payload))"
          NEW="if payload!=['-    '+OLD,'+    '+NEW]: raise SystemExit('V68_PATCH_FAIL non-literal diff '+repr(payload))"

          def H(b): return hashlib.sha256(b).hexdigest()
          def G(b): return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          def extract_run(src):
            lines=src.splitlines(keepends=True); marker=b'        run: |\n'
            start=lines.index(marker)+1; out=[]
            for line in lines[start:]:
              if line.strip() and not line.startswith(b'          '): break
              out.append(line[10:] if line.startswith(b'          ') else line)
            return b''.join(out)

          coord=json.loads(Path('fetched-v69/coordinator-v69.json').read_text())
          if coord.get('id')!=5746508858 or coord.get('user',{}).get('login')!='search-maker': raise SystemExit('V69_BIND_FAIL coordinator identity')
          body=coord.get('body','')
          for x in ['Exactly ONE fresh LowAlt PRE-RESULT V69 identity is authorized','V69 may repair ONLY this exact V68 diff-payload indentation/representation assertion.','No V70 absent later direct Coordinator transition.']:
            if x not in body: raise SystemExit('V69_BIND_FAIL coordinator literal '+x)

          obj=json.loads(Path('fetched-v69/v68-workflow.json').read_text())
          if obj.get('sha')!=V68_BLOB: raise SystemExit('V69_BIND_FAIL V68 blob')
          v68=base64.b64decode(obj['content'])
          if G(v68)!=V68_BLOB or v68!=Path('fetched-v69/v68-workflow-raw.yml').read_bytes(): raise SystemExit('V69_BIND_FAIL V68 representations')
          run=json.loads(Path('fetched-v69/v68-run.json').read_text()); job=json.loads(Path('fetched-v69/v68-job.json').read_text()); art=json.loads(Path('fetched-v69/v68-artifact.json').read_text())
          if run.get('id')!=V68_RUN or run.get('run_attempt')!=1 or run.get('conclusion')!='failure' or run.get('head_sha')!=V68_HEAD: raise SystemExit('V69_BIND_FAIL V68 run')
          if job.get('id')!=V68_JOB or job.get('conclusion')!='failure': raise SystemExit('V69_BIND_FAIL V68 job')
          if art.get('id')!=V68_ART or art.get('digest')!=V68_DIGEST or art.get('expired'): raise SystemExit('V69_BIND_FAIL V68 artifact')
          main=json.loads(Path('fetched-v69/main.json').read_text())
          if main.get('commit',{}).get('sha')!=MAIN: raise SystemExit('V69_BIND_FAIL main drift')
          comp=json.loads(Path('fetched-v69/main-to-v69.json').read_text()); files=comp.get('files') or []
          if comp.get('base_commit',{}).get('sha')!=MAIN or len(files)!=1 or files[0].get('filename')!='.github/workflows/lowalt-lt5-p-worker-module-v69.yml' or files[0].get('status')!='added': raise SystemExit('V69_BIND_FAIL branch scope')

          r=extract_run(v68); text=r.decode()
          if text.count(OLD)!=1 or text.count(NEW)!=0: raise SystemExit(f'V69_PATCH_FAIL old={text.count(OLD)} new={text.count(NEW)}')
          patched=text.replace(OLD,NEW,1).encode()
          diff=''.join(difflib.unified_diff(text.splitlines(True),patched.decode().splitlines(True),fromfile='v68-run-original.sh',tofile='v68-run-patched-v69.sh',n=3))
          payload=[x for x in diff.splitlines() if (x.startswith('+') and not x.startswith('+++')) or (x.startswith('-') and not x.startswith('---'))]
          expected=['-'+OLD,'+'+NEW]
          if payload!=expected: raise SystemExit('V69_PATCH_FAIL unexpected wrapper diff '+repr(payload))
          Path('bootstrap/v68-run-patched-v69.sh').write_bytes(patched)
          Path(OUT/'v68-to-v69-authority-diff.diff').write_text(diff)
          Path(OUT/'AUTHORITY_DIFF_REPRESENTATION_GATE_PASS').write_text('PASS only V68 expected diff-payload indentation representation corrected\n')
          Path(OUT/'receipt.json').write_text(json.dumps({'status':'PASS_PRE_RESULT_V69_AUTHORITY_DIFF_ONLY','v68_run_sha256':H(r),'v69_patched_run_sha256':H(patched),'diff_sha256':H(diff.encode()),'authority_replacement_mutation':False,'scientific_script_mutation':False,'source_defined_transport_mutation':False,'b_selected':False,'b_resolved':False},indent=2,sort_keys=True)+'\n')
          print('AUTHORITY_DIFF_REPRESENTATION_GATE_PASS')
          PY_V69

          test -f evidence/v69-authority-diff/AUTHORITY_DIFF_REPRESENTATION_GATE_PASS
          bash -n bootstrap/v68-run-patched-v69.sh
          set +e
          GITHUB_SHA="3d7e0fdb0e86820592a36a8996238e531d0ed673" \
            bash bootstrap/v68-run-patched-v69.sh \
            >evidence/v69-authority-diff/preserved-v68-child.stdout \
            2>evidence/v69-authority-diff/preserved-v68-child.stderr
          CHILD_RC=$?
          set -e
          printf '%s\n' "$CHILD_RC" > evidence/v69-authority-diff/preserved-v68-child.exit-code.txt
          if [ "$CHILD_RC" -ne 0 ]; then
            echo "V69_PRESERVED_V68_FIRST_FALSE rc=${CHILD_RC}" >&2
            tail -n 320 evidence/v69-authority-diff/preserved-v68-child.stderr >&2 || true
            exit "$CHILD_RC"
          fi

      - name: Freeze V69 PRE-RESULT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-worker-module-v69
          path: |
            fetched-v69
            bootstrap
            evidence
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
