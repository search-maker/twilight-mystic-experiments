name: LowAlt LT5 P Worker Module V66 Checkpoint Binding V70

on:
  push:
    branches:
      - review/lowalt-lt5-p-worker-module-v70-20260919
    paths:
      - .github/workflows/lowalt-lt5-p-worker-module-v70.yml

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  v67-v66-checkpoint-binding:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Repair only V67 V66-checkpoint first-false binding
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p fetched-v70 bootstrap evidence/v70-v66-checkpoint-binding

          api_get() {
            local url="$1" out="$2"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$url" -o "$out"
          }

          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/issues/comments/5746530813" fetched-v70/coordinator-v70.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/lowalt-lt5-p-worker-module-v69.yml?ref=e73ecf8a01b5eb84255097263bf782f4bd3bad6a" fetched-v70/v69-workflow.json
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/search-maker/twilight-mystic-experiments/e73ecf8a01b5eb84255097263bf782f4bd3bad6a/.github/workflows/lowalt-lt5-p-worker-module-v69.yml" \
            -o fetched-v70/v69-workflow-raw.yml
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/runs/35479752638" fetched-v70/v69-run.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/jobs/105995306471" fetched-v70/v69-job.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/10595750724" fetched-v70/v69-artifact.json
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/jobs/105995306471/logs" \
            -o fetched-v70/v69-job.log
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/lowalt-lt5-p-worker-module-v67.yml?ref=f7dcf09021d76548815ec26c8098953c6d5cde06" fetched-v70/v67-workflow.json
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/search-maker/twilight-mystic-experiments/f7dcf09021d76548815ec26c8098953c6d5cde06/.github/workflows/lowalt-lt5-p-worker-module-v67.yml" \
            -o fetched-v70/v67-workflow-raw.yml
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/issues/comments/5736851192" fetched-v70/v66-checkpoint.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/branches/main" fetched-v70/main.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/compare/6cd7c075766fe0c86bc7561ec205a3f9120fd1fb...${GITHUB_SHA}" fetched-v70/main-to-v70.json

          python3 - <<'PY_V70'
          import base64, difflib, hashlib, json
          from pathlib import Path

          OUT=Path('evidence/v70-v66-checkpoint-binding'); OUT.mkdir(parents=True,exist_ok=True)
          MAIN='6cd7c075766fe0c86bc7561ec205a3f9120fd1fb'
          V69_HEAD='e73ecf8a01b5eb84255097263bf782f4bd3bad6a'
          V69_BLOB='5447a2870de07fefcc8f5cb49aa4569508323ad5'
          V69_RUN=35479752638; V69_JOB=105995306471; V69_ART=10595750724
          V69_DIGEST='sha256:d9fef954a589a5ee7e89d8a98e49c5cbc76a15d5ac2ca56f1dd33dbc4eb37ab4'
          V67_HEAD='f7dcf09021d76548815ec26c8098953c6d5cde06'
          V67_BLOB='3d042a01ad4b706b0bd3860b0d675b232aab622f'
          COORD=5746530813; CP66=5736851192
          OLD_AUTH="    'V67 may repair ONLY this preservation-guard scope defect',\n"
          NEW_AUTH="    'V67 may repair ONLY this newly exposed preservation-guard SCOPE defect.',\n"
          OLD_CP="if 'wrapper-only preservation-guard scope' not in cp66.get('body',''):\n"
          NEW_CP="if ('V66_PATCH_FAIL preserved semantic/source-transform literals absent' not in cp66.get('body','') or 'The source-defined transport belongs downstream in the preserved child chain' not in cp66.get('body','')):\n"

          def H(b): return hashlib.sha256(b).hexdigest()
          def G(b): return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          def decode_contents(path, blob):
              obj=json.loads(Path(path).read_text())
              if obj.get('sha')!=blob: raise SystemExit(f'V70_BIND_FAIL blob {path}')
              data=base64.b64decode(obj['content'])
              if G(data)!=blob: raise SystemExit(f'V70_BIND_FAIL recomputed blob {path}')
              return data
          def extract_run(src):
              lines=src.splitlines(keepends=True); marker=b'        run: |\n'
              start=lines.index(marker)+1; out=[]
              for line in lines[start:]:
                  if line.strip() and not line.startswith(b'          '): break
                  out.append(line[10:] if line.startswith(b'          ') else line)
              return b''.join(out)

          coord=json.loads(Path('fetched-v70/coordinator-v70.json').read_text())
          if coord.get('id')!=COORD or coord.get('user',{}).get('login')!='search-maker': raise SystemExit('V70_BIND_FAIL coordinator identity')
          cbody=coord.get('body','')
          for x in [
              'Exactly ONE fresh LowAlt PRE-RESULT V70 identity is authorized',
              'V70 may repair ONLY this exact V67→V66-checkpoint first-false literal binding predicate',
              'V66_PATCH_FAIL preserved semantic/source-transform literals absent',
              'The source-defined transport belongs downstream in the preserved child chain',
              'No V71 absent later direct Coordinator transition',
          ]:
              if x not in cbody: raise SystemExit('V70_BIND_FAIL coordinator literal '+x)

          v69=decode_contents('fetched-v70/v69-workflow.json',V69_BLOB)
          if v69!=Path('fetched-v70/v69-workflow-raw.yml').read_bytes(): raise SystemExit('V70_BIND_FAIL V69 representations')
          run=json.loads(Path('fetched-v70/v69-run.json').read_text()); job=json.loads(Path('fetched-v70/v69-job.json').read_text()); art=json.loads(Path('fetched-v70/v69-artifact.json').read_text())
          if run.get('id')!=V69_RUN or run.get('run_attempt')!=1 or run.get('conclusion')!='failure' or run.get('head_sha')!=V69_HEAD: raise SystemExit('V70_BIND_FAIL V69 run')
          if job.get('id')!=V69_JOB or job.get('conclusion')!='failure': raise SystemExit('V70_BIND_FAIL V69 job')
          if art.get('id')!=V69_ART or art.get('digest')!=V69_DIGEST or art.get('expired'): raise SystemExit('V70_BIND_FAIL V69 artifact')
          log=Path('fetched-v70/v69-job.log').read_text(errors='replace')
          if 'AUTHORITY_DIFF_REPRESENTATION_GATE_PASS' not in log or 'V67_BIND_FAIL V66 first-false literal' not in log: raise SystemExit('V70_BIND_FAIL V69 log receipts')

          v67=decode_contents('fetched-v70/v67-workflow.json',V67_BLOB)
          if v67!=Path('fetched-v70/v67-workflow-raw.yml').read_bytes(): raise SystemExit('V70_BIND_FAIL V67 representations')
          cp66=json.loads(Path('fetched-v70/v66-checkpoint.json').read_text())
          if cp66.get('id')!=CP66 or cp66.get('user',{}).get('login')!='search-maker': raise SystemExit('V70_BIND_FAIL V66 checkpoint identity')
          body66=cp66.get('body','')
          code='V66_PATCH_FAIL preserved semantic/source-transform literals absent'
          causal='The source-defined transport belongs downstream in the preserved child chain'
          if code not in body66 or causal not in body66: raise SystemExit('V70_BIND_FAIL authoritative V66 evidence')

          main=json.loads(Path('fetched-v70/main.json').read_text())
          if main.get('commit',{}).get('sha')!=MAIN: raise SystemExit('V70_BIND_FAIL main drift')
          comp=json.loads(Path('fetched-v70/main-to-v70.json').read_text()); files=comp.get('files') or []
          if comp.get('base_commit',{}).get('sha')!=MAIN or len(files)!=1 or files[0].get('filename')!='.github/workflows/lowalt-lt5-p-worker-module-v70.yml' or files[0].get('status')!='added': raise SystemExit('V70_BIND_FAIL branch scope')

          r=extract_run(v67); text=r.decode()
          if text.count(OLD_AUTH)!=1 or text.count(NEW_AUTH)!=0: raise SystemExit('V70_PATCH_FAIL accepted authority precondition')
          if text.count(OLD_CP)!=1 or text.count(NEW_CP)!=0: raise SystemExit('V70_PATCH_FAIL V66 checkpoint precondition')
          patched=text.replace(OLD_AUTH,NEW_AUTH,1).replace(OLD_CP,NEW_CP,1).encode()
          diff=''.join(difflib.unified_diff(text.splitlines(True),patched.decode().splitlines(True),fromfile='v67-run-original.sh',tofile='v67-run-patched-v70.sh',n=3))
          payload=[x for x in diff.splitlines() if (x.startswith('+') and not x.startswith('+++')) or (x.startswith('-') and not x.startswith('---'))]
          expected=[
              '-'+OLD_AUTH.rstrip('\n'), '+'+NEW_AUTH.rstrip('\n'),
              '-'+OLD_CP.rstrip('\n'), '+'+NEW_CP.rstrip('\n'),
          ]
          if payload!=expected: raise SystemExit('V70_PATCH_FAIL unexpected diff '+repr(payload))
          Path('bootstrap/v67-run-patched-v70.sh').write_bytes(patched)
          Path(OUT/'v67-to-v70-checkpoint-binding.diff').write_text(diff)
          Path(OUT/'V66_CHECKPOINT_BINDING_GATE_PASS').write_text('PASS exact V66 first-false code and causal sentence bound; accepted V68 authority correction preserved\n')
          Path(OUT/'receipt.json').write_text(json.dumps({
              'status':'PASS_PRE_RESULT_V70_V66_CHECKPOINT_BINDING_ONLY',
              'v67_run_sha256':H(r),
              'v70_patched_run_sha256':H(patched),
              'diff_sha256':H(diff.encode()),
              'accepted_v68_authority_fix_preserved':True,
              'accepted_v69_diff_representation_receipt_seen':True,
              'novel_repair_only':'V67_V66_CHECKPOINT_FIRST_FALSE_LITERAL_BINDING',
              'scientific_script_mutation':False,
              'source_defined_transport_mutation':False,
              'b_selected':False,
              'b_resolved':False,
          },indent=2,sort_keys=True)+'\n')
          print('V66_CHECKPOINT_BINDING_GATE_PASS')
          PY_V70

          test -f evidence/v70-v66-checkpoint-binding/V66_CHECKPOINT_BINDING_GATE_PASS
          bash -n bootstrap/v67-run-patched-v70.sh
          set +e
          GITHUB_SHA="f7dcf09021d76548815ec26c8098953c6d5cde06" \
            bash bootstrap/v67-run-patched-v70.sh \
            >evidence/v70-v66-checkpoint-binding/preserved-v67-child.stdout \
            2>evidence/v70-v66-checkpoint-binding/preserved-v67-child.stderr
          CHILD_RC=$?
          set -e
          printf '%s\n' "$CHILD_RC" > evidence/v70-v66-checkpoint-binding/preserved-v67-child.exit-code.txt
          if [ "$CHILD_RC" -ne 0 ]; then
            echo "V70_PRESERVED_V67_FIRST_FALSE rc=${CHILD_RC}" >&2
            tail -n 360 evidence/v70-v66-checkpoint-binding/preserved-v67-child.stderr >&2 || true
            exit "$CHILD_RC"
          fi

      - name: Freeze V70 PRE-RESULT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-worker-module-v70
          path: |
            fetched-v70
            bootstrap
            evidence
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
