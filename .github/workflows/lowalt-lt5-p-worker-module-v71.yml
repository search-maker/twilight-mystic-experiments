name: LowAlt LT5 P Worker Module V65 Successor Replacement Representation V71

on:
  push:
    branches:
      - review/lowalt-lt5-p-worker-module-v71-20260919
    paths:
      - .github/workflows/lowalt-lt5-p-worker-module-v71.yml

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  v65-successor-replacement-representation:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Repair only V65 successor replacement-content representation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p fetched-v71 artifacts-v71 bootstrap evidence/v71-successor-replacement-representation

          api_get() {
            local url="$1" out="$2"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$url" -o "$out"
          }

          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/issues/comments/5746554724" fetched-v71/coordinator-v71.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/lowalt-lt5-p-worker-module-v70.yml?ref=b7cbcff9f15e4a4e580e4bf9048e840a2943ab54" fetched-v71/v70-workflow.json
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/search-maker/twilight-mystic-experiments/b7cbcff9f15e4a4e580e4bf9048e840a2943ab54/.github/workflows/lowalt-lt5-p-worker-module-v70.yml" \
            -o fetched-v71/v70-workflow-raw.yml
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/runs/35480003355" fetched-v71/v70-run.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/jobs/105995990478" fetched-v71/v70-job.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/10595143200" fetched-v71/v70-artifact.json
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/jobs/105995990478/logs" \
            -o fetched-v71/v70-job.log
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/10595143200/zip" \
            -o artifacts-v71/v70.zip
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/lowalt-lt5-p-worker-module-v65.yml?ref=eba5f9422ee947b89625a45a2538eea4ae61f705" fetched-v71/v65-workflow.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/lowalt-lt5-p-worker-module-v66.yml?ref=6658bc086a81fca549f448d1e990ae406742df18" fetched-v71/v66-workflow.json
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/search-maker/twilight-mystic-experiments/eba5f9422ee947b89625a45a2538eea4ae61f705/.github/workflows/lowalt-lt5-p-worker-module-v65.yml" \
            -o fetched-v71/v65-workflow-raw.yml
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/search-maker/twilight-mystic-experiments/6658bc086a81fca549f448d1e990ae406742df18/.github/workflows/lowalt-lt5-p-worker-module-v66.yml" \
            -o fetched-v71/v66-workflow-raw.yml
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/branches/main" fetched-v71/main.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/compare/6cd7c075766fe0c86bc7561ec205a3f9120fd1fb...${GITHUB_SHA}" fetched-v71/main-to-v71.json

          python3 - <<'PY_V71'
          import base64, collections, difflib, hashlib, io, json, zipfile
          from pathlib import Path

          OUT=Path('evidence/v71-successor-replacement-representation'); OUT.mkdir(parents=True,exist_ok=True)
          MAIN='6cd7c075766fe0c86bc7561ec205a3f9120fd1fb'
          COORD=5746554724
          V70_HEAD='b7cbcff9f15e4a4e580e4bf9048e840a2943ab54'
          V70_BLOB='c77f52cc7d1bea241fcbb8702c23a9298d898bc3'
          V70_RUN=35480003355; V70_JOB=105995990478; V70_ART=10595143200
          V70_SHA='29ba2fdb03bb655ff64de16b3b6eedf139ed401a7f5ff7c2b32673329ac72938'; V70_SIZE=929387
          V65_BLOB='976e37d56ecf75e7db0b9bedb35d9eac19c0b859'
          V66_BLOB='7dcb67e4a7d1d9de3bc31e0d0ab31e1f71c62d94'
          V65_PATCHED_V66_SHA='47cfb9177dfab7ad1c930ae3557cde67e5f68801c9743c5c4c14ee448208084b'
          V65_ORIGINAL_SHA='182ab8b3b216135948521c3616775de27c4af58aee8d41bb8525c762906bfbe8'
          HIST_TABLE='631b52bb8bd4f4f3c3d7cdf0a4ad23dab558c7c27649bb746a064fe59ff36f80'
          HIST_MANIFEST='fe48c37dea56b3c5b03b99237d6ea52337b4f92aafeac389b597aea08ce62bf6'
          CORR_TABLE='9d1f9817c71f9873052b1e0735de3285588d18a2789ee22b1addca9336078d3f'
          CORR_MANIFEST='c6be26dc8da045cb4199a1bf7b58a6eb0a4974c306e95b11a1fa58ca9f80ab89'

          def H(b): return hashlib.sha256(b).hexdigest()
          def G(b): return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          def decode_contents(path, blob):
              obj=json.loads(Path(path).read_text())
              if obj.get('sha')!=blob: raise SystemExit(f'V71_BIND_FAIL blob {path}')
              data=base64.b64decode(obj['content'])
              if G(data)!=blob: raise SystemExit(f'V71_BIND_FAIL recomputed blob {path}')
              return data

          coord=json.loads(Path('fetched-v71/coordinator-v71.json').read_text())
          if coord.get('id')!=COORD or coord.get('user',{}).get('login')!='search-maker': raise SystemExit('V71_BIND_FAIL coordinator identity')
          cb=coord.get('body','')
          for x in [
              'Exactly ONE fresh LowAlt PRE-RESULT V71 identity is authorized',
              'V71 may repair ONLY the V65 successor replacement-content and exact child-diff assertion indentation representation',
              'successor_block', 'new_check',
              'with no TABLE_TARGET/MANIFEST_TARGET reindent',
              'No V72 absent later direct Coordinator transition',
              CORR_TABLE, CORR_MANIFEST,
          ]:
              if x not in cb: raise SystemExit('V71_BIND_FAIL coordinator literal '+x)

          v70=decode_contents('fetched-v71/v70-workflow.json',V70_BLOB)
          if v70!=Path('fetched-v71/v70-workflow-raw.yml').read_bytes(): raise SystemExit('V71_BIND_FAIL V70 representations')
          run=json.loads(Path('fetched-v71/v70-run.json').read_text()); job=json.loads(Path('fetched-v71/v70-job.json').read_text()); art=json.loads(Path('fetched-v71/v70-artifact.json').read_text())
          if run.get('id')!=V70_RUN or run.get('run_attempt')!=1 or run.get('conclusion')!='failure' or run.get('head_sha')!=V70_HEAD: raise SystemExit('V71_BIND_FAIL V70 run')
          if job.get('id')!=V70_JOB or job.get('conclusion')!='failure': raise SystemExit('V71_BIND_FAIL V70 job')
          if art.get('id')!=V70_ART or art.get('digest')!='sha256:'+V70_SHA or art.get('size_in_bytes')!=V70_SIZE or art.get('expired'): raise SystemExit('V71_BIND_FAIL V70 artifact metadata')
          log=Path('fetched-v71/v70-job.log').read_text(errors='replace')
          if 'V66_CHECKPOINT_BINDING_GATE_PASS' not in log or 'V65_PATCH_FAIL unexpected child diff payload' not in log: raise SystemExit('V71_BIND_FAIL V70 log receipts')
          expected_first_false=[
              "-TABLE_TARGET = '"+HIST_TABLE+"'",
              "-MANIFEST_TARGET = '"+HIST_MANIFEST+"'",
              "+          TABLE_TARGET = '"+HIST_TABLE+"'",
              "+          MANIFEST_TARGET = '"+HIST_MANIFEST+"'",
              "+          V59_SOURCE_DEFINED_TABLE_SHA256 = '"+CORR_TABLE+"'",
              "+          V59_SOURCE_DEFINED_MANIFEST_SHA256 = '"+CORR_MANIFEST+"'",
              '-if table_sha != TABLE_TARGET or manifest_sha != MANIFEST_TARGET:',
              '+          if table_sha != V59_SOURCE_DEFINED_TABLE_SHA256 or manifest_sha != V59_SOURCE_DEFINED_MANIFEST_SHA256:',
          ]
          if any(x not in log for x in expected_first_false): raise SystemExit('V71_BIND_FAIL V70 first-false payload')

          z=Path('artifacts-v71/v70.zip').read_bytes()
          if len(z)!=V70_SIZE or H(z)!=V70_SHA: raise SystemExit('V71_BIND_FAIL V70 artifact transport')
          with zipfile.ZipFile(io.BytesIO(z)) as zz:
              names=[i.filename for i in zz.infolist() if not i.is_dir()]
              required=[
                  'bootstrap/v65-run-patched-v66.sh',
                  'evidence/v66-representation/v65-run-original.sh',
                  'evidence/v66-representation/REPRESENTATION_GATE_PASS',
                  'evidence/v67-preservation-scope/PRESERVATION_SCOPE_GATE_PASS',
                  'evidence/v70-v66-checkpoint-binding/V66_CHECKPOINT_BINDING_GATE_PASS',
                  'evidence/v70-v66-checkpoint-binding/receipt.json',
                  'evidence/v67-preservation-scope/scope-receipt.json',
              ]
              for p in required:
                  if names.count(p)!=1: raise SystemExit(f'V71_BIND_FAIL V70 member cardinality {p}={names.count(p)}')
              blobs={p:zz.read(p) for p in required}
          if H(blobs['bootstrap/v65-run-patched-v66.sh'])!=V65_PATCHED_V66_SHA: raise SystemExit('V71_BIND_FAIL patched V65 identity')
          if H(blobs['evidence/v66-representation/v65-run-original.sh'])!=V65_ORIGINAL_SHA: raise SystemExit('V71_BIND_FAIL original V65 extracted identity')
          if blobs['evidence/v66-representation/REPRESENTATION_GATE_PASS']!=b'PASS: exact 10-space YAML-source precondition needles mapped to column-0 extracted-shell representations only\n': raise SystemExit('V71_BIND_FAIL V66 representation gate')
          if not blobs['evidence/v67-preservation-scope/PRESERVATION_SCOPE_GATE_PASS'].startswith(b'PASS: wrapper-owned predicates preserved;'): raise SystemExit('V71_BIND_FAIL V67 scope gate')
          if not blobs['evidence/v70-v66-checkpoint-binding/V66_CHECKPOINT_BINDING_GATE_PASS'].startswith(b'PASS exact V66 first-false code'): raise SystemExit('V71_BIND_FAIL V70 checkpoint gate')
          r70=json.loads(blobs['evidence/v70-v66-checkpoint-binding/receipt.json'])
          if r70.get('status')!='PASS_PRE_RESULT_V70_V66_CHECKPOINT_BINDING_ONLY' or not r70.get('accepted_v68_authority_fix_preserved') or not r70.get('accepted_v69_diff_representation_receipt_seen') or r70.get('b_selected') or r70.get('b_resolved'): raise SystemExit('V71_BIND_FAIL V70 receipt')
          r67=json.loads(blobs['evidence/v67-preservation-scope/scope-receipt.json'])
          if r67.get('status')!='PASS_PRE_RESULT_V67_PRESERVATION_SCOPE_ONLY' or r67.get('scientific_script_mutation') or r67.get('source_defined_transport_mutation') or r67.get('historical_v59_checkpoint_mutation') or r67.get('b_selected') or r67.get('b_resolved'): raise SystemExit('V71_BIND_FAIL V67 receipt')

          v65=decode_contents('fetched-v71/v65-workflow.json',V65_BLOB); v66=decode_contents('fetched-v71/v66-workflow.json',V66_BLOB)
          if v65!=Path('fetched-v71/v65-workflow-raw.yml').read_bytes() or v66!=Path('fetched-v71/v66-workflow-raw.yml').read_bytes(): raise SystemExit('V71_BIND_FAIL V65/V66 representations')
          if H(blobs['evidence/v66-representation/v65-run-original.sh'])!=V65_ORIGINAL_SHA: raise SystemExit('V71_BIND_FAIL V65 extracted source repeat')

          main=json.loads(Path('fetched-v71/main.json').read_text())
          if main.get('commit',{}).get('sha')!=MAIN: raise SystemExit('V71_BIND_FAIL main drift')
          comp=json.loads(Path('fetched-v71/main-to-v71.json').read_text()); files=comp.get('files') or []
          if comp.get('base_commit',{}).get('sha')!=MAIN or len(files)!=1 or files[0].get('filename')!='.github/workflows/lowalt-lt5-p-worker-module-v71.yml' or files[0].get('status')!='added': raise SystemExit('V71_BIND_FAIL branch scope')

          original=blobs['bootstrap/v65-run-patched-v66.sh']; text=original.decode()
          old_successor=(
              "successor_block=(\n"
              "    \"          TABLE_TARGET = '\"+HIST_TABLE+\"'\\n\"\n"
              "    \"          MANIFEST_TARGET = '\"+HIST_MANIFEST+\"'\\n\"\n"
              "    \"          V59_SOURCE_DEFINED_TABLE_SHA256 = '\"+V59_SOURCE_DEFINED_TABLE_SHA256+\"'\\n\"\n"
              "    \"          V59_SOURCE_DEFINED_MANIFEST_SHA256 = '\"+V59_SOURCE_DEFINED_MANIFEST_SHA256+\"'\\n\"\n"
              ").encode()\n"
          )
          new_successor=(
              "successor_block=(\n"
              "    \"TABLE_TARGET = '\"+HIST_TABLE+\"'\\n\"\n"
              "    \"MANIFEST_TARGET = '\"+HIST_MANIFEST+\"'\\n\"\n"
              "    \"V59_SOURCE_DEFINED_TABLE_SHA256 = '\"+V59_SOURCE_DEFINED_TABLE_SHA256+\"'\\n\"\n"
              "    \"V59_SOURCE_DEFINED_MANIFEST_SHA256 = '\"+V59_SOURCE_DEFINED_MANIFEST_SHA256+\"'\\n\"\n"
              ").encode()\n"
          )
          old_new_check="new_check=b'          if table_sha != V59_SOURCE_DEFINED_TABLE_SHA256 or manifest_sha != V59_SOURCE_DEFINED_MANIFEST_SHA256:\\n'\n"
          new_new_check="new_check=b'if table_sha != V59_SOURCE_DEFINED_TABLE_SHA256 or manifest_sha != V59_SOURCE_DEFINED_MANIFEST_SHA256:\\n'\n"
          old_expected=(
              "expected=collections.Counter([\n"
              "    \"+          V59_SOURCE_DEFINED_TABLE_SHA256 = '\"+V59_SOURCE_DEFINED_TABLE_SHA256+\"'\",\n"
              "    \"+          V59_SOURCE_DEFINED_MANIFEST_SHA256 = '\"+V59_SOURCE_DEFINED_MANIFEST_SHA256+\"'\",\n"
              "    '-          if table_sha != TABLE_TARGET or manifest_sha != MANIFEST_TARGET:',\n"
              "    '+          if table_sha != V59_SOURCE_DEFINED_TABLE_SHA256 or manifest_sha != V59_SOURCE_DEFINED_MANIFEST_SHA256:',\n"
              "])\n"
          )
          new_expected=(
              "expected=collections.Counter([\n"
              "    \"+V59_SOURCE_DEFINED_TABLE_SHA256 = '\"+V59_SOURCE_DEFINED_TABLE_SHA256+\"'\",\n"
              "    \"+V59_SOURCE_DEFINED_MANIFEST_SHA256 = '\"+V59_SOURCE_DEFINED_MANIFEST_SHA256+\"'\",\n"
              "    '-if table_sha != TABLE_TARGET or manifest_sha != MANIFEST_TARGET:',\n"
              "    '+if table_sha != V59_SOURCE_DEFINED_TABLE_SHA256 or manifest_sha != V59_SOURCE_DEFINED_MANIFEST_SHA256:',\n"
              "])\n"
          )
          changes=[
              ('successor_block',old_successor,new_successor),
              ('new_check',old_new_check,new_new_check),
              ('expected_child_diff',old_expected,new_expected),
          ]
          counts=[]
          patched=text
          for label,old,new in changes:
              c_old=patched.count(old); c_new=patched.count(new)
              counts.append({'label':label,'old_count_before':c_old,'new_count_before':c_new,'old_sha256':H(old.encode()),'new_sha256':H(new.encode())})
              if c_old!=1 or c_new!=0: raise SystemExit('V71_PATCH_FAIL replacement precondition '+repr(counts[-1]))
              patched=patched.replace(old,new,1)
          diff=''.join(difflib.unified_diff(text.splitlines(True),patched.splitlines(True),fromfile='v65-run-patched-v66.sh',tofile='v65-run-patched-v71.sh',n=3))
          payload=[x for x in diff.splitlines() if (x.startswith('+') and not x.startswith('+++')) or (x.startswith('-') and not x.startswith('---'))]
          expected_payload=collections.Counter([
              '-    "          TABLE_TARGET = \''+HIST_TABLE+'\'\\n"', '+    "TABLE_TARGET = \''+HIST_TABLE+'\'\\n"',
              '-    "          MANIFEST_TARGET = \''+HIST_MANIFEST+'\'\\n"', '+    "MANIFEST_TARGET = \''+HIST_MANIFEST+'\'\\n"',
              '-    "          V59_SOURCE_DEFINED_TABLE_SHA256 = \''+V59_SOURCE_DEFINED_TABLE_SHA256+'\'\\n"', '+    "V59_SOURCE_DEFINED_TABLE_SHA256 = \''+V59_SOURCE_DEFINED_TABLE_SHA256+'\'\\n"',
              '-    "          V59_SOURCE_DEFINED_MANIFEST_SHA256 = \''+V59_SOURCE_DEFINED_MANIFEST_SHA256+'\'\\n"', '+    "V59_SOURCE_DEFINED_MANIFEST_SHA256 = \''+V59_SOURCE_DEFINED_MANIFEST_SHA256+'\'\\n"',
              "-new_check=b'          if table_sha != V59_SOURCE_DEFINED_TABLE_SHA256 or manifest_sha != V59_SOURCE_DEFINED_MANIFEST_SHA256:\\n'",
              "+new_check=b'if table_sha != V59_SOURCE_DEFINED_TABLE_SHA256 or manifest_sha != V59_SOURCE_DEFINED_MANIFEST_SHA256:\\n'",
              '-    "+          V59_SOURCE_DEFINED_TABLE_SHA256 = \''+V59_SOURCE_DEFINED_TABLE_SHA256+'\'",', '+    "+V59_SOURCE_DEFINED_TABLE_SHA256 = \''+V59_SOURCE_DEFINED_TABLE_SHA256+'\'",',
              '-    "+          V59_SOURCE_DEFINED_MANIFEST_SHA256 = \''+V59_SOURCE_DEFINED_MANIFEST_SHA256+'\'",', '+    "+V59_SOURCE_DEFINED_MANIFEST_SHA256 = \''+V59_SOURCE_DEFINED_MANIFEST_SHA256+'\'",',
              "-    '-          if table_sha != TABLE_TARGET or manifest_sha != MANIFEST_TARGET:',", "+    '-if table_sha != TABLE_TARGET or manifest_sha != MANIFEST_TARGET:',",
              "-    '+          if table_sha != V59_SOURCE_DEFINED_TABLE_SHA256 or manifest_sha != V59_SOURCE_DEFINED_MANIFEST_SHA256:',", "+    '+if table_sha != V59_SOURCE_DEFINED_TABLE_SHA256 or manifest_sha != V59_SOURCE_DEFINED_MANIFEST_SHA256:',",
          ])
          if collections.Counter(payload)!=expected_payload or len(payload)!=18: raise SystemExit('V71_PATCH_FAIL unexpected harness payload '+repr(payload))
          forbidden=[
              '631b52bb8bd4f4f3c3d7cdf0a4ad23dab558c7c27649bb746a064fe59ff36f80',
              'fe48c37dea56b3c5b03b99237d6ea52337b4f92aafeac389b597aea08ce62bf6',
              '9d1f9817c71f9873052b1e0735de3285588d18a2789ee22b1addca9336078d3f',
              'c6be26dc8da045cb4199a1bf7b58a6eb0a4974c306e95b11a1fa58ca9f80ab89',
          ]
          if any(text.count(x)!=patched.count(x) for x in forbidden): raise SystemExit('V71_PATCH_FAIL source-output/historical value drift')
          if 'base64 -d bootstrap/v46-run-v51.sh.gz.b64 | gzip -dc > bootstrap/v46-run-v51.sh' in text or 'base64 -d bootstrap/v46-run-v51.sh.gz.b64 | gzip -dc > bootstrap/v46-run-v51.sh' in patched: raise SystemExit('V71_PATCH_FAIL source-defined transport leaked into V65 wrapper')

          Path('bootstrap/v65-run-patched-v71.sh').write_text(patched)
          Path(OUT/'v65-v66-to-v71-successor-replacement-representation.diff').write_text(diff)
          Path(OUT/'old-new-replacement-content.json').write_text(json.dumps({'changes':counts,'payload':payload},indent=2,sort_keys=True)+'\n')
          receipt={
              'status':'PASS_PRE_RESULT_V71_V65_SUCCESSOR_REPLACEMENT_REPRESENTATION_ONLY',
              'v70_artifact_sha256':H(z),
              'v65_patched_v66_sha256':H(original),
              'v65_patched_v71_sha256':H(patched.encode()),
              'diff_sha256':H(diff.encode()),
              'historical_v59_declarations_mutated':False,
              'corrected_v59_source_output_identity_values_mutated':False,
              'scientific_script_mutation':False,
              'source_defined_transport_mutation':False,
              'accepted_v66_precondition_repair_preserved':True,
              'accepted_v67_v68_v69_v70_evidence_bound':True,
              'b_selected':False,
              'b_resolved':False,
          }
          Path(OUT/'receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          Path(OUT/'SUCCESSOR_REPLACEMENT_REPRESENTATION_GATE_PASS').write_text('PASS: V65 replacement content and child-diff assertion now use exact column-0 V63 extracted-shell representation only\n')
          print('SUCCESSOR_REPLACEMENT_REPRESENTATION_GATE_PASS')
          print('V65_PATCHED_V66_SHA256='+H(original))
          print('V65_PATCHED_V71_SHA256='+H(patched.encode()))
          print('V65_V66_TO_V71_DIFF_SHA256='+H(diff.encode()))
          PY_V71

          test -f evidence/v71-successor-replacement-representation/SUCCESSOR_REPLACEMENT_REPRESENTATION_GATE_PASS
          bash -n bootstrap/v65-run-patched-v71.sh
          set +e
          GITHUB_SHA="eba5f9422ee947b89625a45a2538eea4ae61f705" \
            bash bootstrap/v65-run-patched-v71.sh \
            >evidence/v71-successor-replacement-representation/preserved-v65-child.stdout \
            2>evidence/v71-successor-replacement-representation/preserved-v65-child.stderr
          CHILD_RC=$?
          set -e
          printf '%s\n' "$CHILD_RC" > evidence/v71-successor-replacement-representation/preserved-v65-child.exit-code.txt
          if [ "$CHILD_RC" -ne 0 ]; then
            echo "V71_PRESERVED_V65_FIRST_FALSE rc=${CHILD_RC}" >&2
            tail -n 420 evidence/v71-successor-replacement-representation/preserved-v65-child.stderr >&2 || true
            exit "$CHILD_RC"
          fi

      - name: Freeze V71 PRE-RESULT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-worker-module-v71
          path: |
            fetched-v71
            artifacts-v71
            bootstrap
            evidence
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
