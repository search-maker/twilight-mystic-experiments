name: LowAlt LT5 P Worker Module Authority Locus V72

on:
  push:
    branches:
      - review/lowalt-lt5-p-worker-module-v72-20260919
    paths:
      - .github/workflows/lowalt-lt5-p-worker-module-v72.yml

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  v71-authority-locus:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Repair only V71 authority-binding locus
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p fetched-v72 artifacts-v72 bootstrap evidence/v72-authority-locus

          api_get() {
            local url="$1" out="$2"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$url" -o "$out"
          }

          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/issues/comments/5746738878" fetched-v72/coordinator-v72.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/issues/comments/5746554724" fetched-v72/coordinator-v71.json

          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/lowalt-lt5-p-worker-module-v71.yml?ref=304af652dcd01bd8230d979aca8a0c791eb2f18d" fetched-v72/v71-workflow.json
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/search-maker/twilight-mystic-experiments/304af652dcd01bd8230d979aca8a0c791eb2f18d/.github/workflows/lowalt-lt5-p-worker-module-v71.yml" \
            -o fetched-v72/v71-workflow-raw.yml
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/runs/35480751142" fetched-v72/v71-run.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/jobs/105997984963" fetched-v72/v71-job.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/10596111685" fetched-v72/v71-artifact.json
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/jobs/105997984963/logs" \
            -o fetched-v72/v71-job.log
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/10596111685/zip" \
            -o artifacts-v72/v71.zip

          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/issues/comments/5735866583" fetched-v72/coordinator-v65.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/issues/comments/5736218929" fetched-v72/v65-checkpoint.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/issues/comments/5736469602" fetched-v72/coordinator-v66.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/lowalt-lt5-p-worker-module-v64.yml?ref=dc8b73a2750eef4860e3803db53294f403895d19" fetched-v72/v64-workflow.json
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/search-maker/twilight-mystic-experiments/dc8b73a2750eef4860e3803db53294f403895d19/.github/workflows/lowalt-lt5-p-worker-module-v64.yml" \
            -o fetched-v72/v64-workflow-raw.yml
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/10566170653" fetched-v72/v64-artifact.json
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/10566170653/zip" \
            -o artifacts-v72/v64.zip
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/lowalt-lt5-p-worker-module-v65.yml?ref=eba5f9422ee947b89625a45a2538eea4ae61f705" fetched-v72/v65-workflow.json
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/search-maker/twilight-mystic-experiments/eba5f9422ee947b89625a45a2538eea4ae61f705/.github/workflows/lowalt-lt5-p-worker-module-v65.yml" \
            -o fetched-v72/v65-workflow-raw.yml
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/10566699601" fetched-v72/v65-artifact.json
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/10566699601/zip" \
            -o artifacts-v72/v65.zip

          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/branches/main" fetched-v72/main.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/compare/6cd7c075766fe0c86bc7561ec205a3f9120fd1fb...${GITHUB_SHA}" fetched-v72/main-to-v72.json

          python3 - <<'PY_V72'
          import base64, difflib, hashlib, io, json, zipfile
          from pathlib import Path

          OUT=Path('evidence/v72-authority-locus'); OUT.mkdir(parents=True,exist_ok=True)
          MAIN='6cd7c075766fe0c86bc7561ec205a3f9120fd1fb'
          V72_COORD=5746738878
          V71_COORD=5746554724
          V71_HEAD='304af652dcd01bd8230d979aca8a0c791eb2f18d'
          V71_BLOB='ef860365834de63248a6c1f1c70bd77449477900'
          V71_RUN=35480751142; V71_JOB=105997984963; V71_ART=10596111685
          V71_SHA='5fdd2bfdcd5d8eb89abe7f9ff822e9d6a896d0437826f348b8e4d18f4aad7a66'; V71_SIZE=1165323
          V64_BLOB='5eec248829996fdabdd488168e3943dc51de6909'
          V64_ART=10566170653; V64_SHA='d26367ac95cb4d375b3cd9b5a590305f571776ca45e9ac8ca62bc1f74ddf038b'; V64_SIZE=10948866
          V65_BLOB='976e37d56ecf75e7db0b9bedb35d9eac19c0b859'
          V65_ART=10566699601; V65_SHA='7f6d6c84ecb2a3f5caf0d262e08f575566538e139c157a57c321ce5d593a1fd8'; V65_SIZE=11324552
          OWNER_COORD=5735866583; OWNER_CP65=5736218929; OWNER_COORD66=5736469602
          CORR_TABLE='9d1f9817c71f9873052b1e0735de3285588d18a2789ee22b1addca9336078d3f'
          CORR_MANIFEST='c6be26dc8da045cb4199a1bf7b58a6eb0a4974c306e95b11a1fa58ca9f80ab89'
          V64_CLASS_SHA='c6faff241647e998b6476356b2a349e0b06e7dd2577904d5b573c597cad148dd'
          V64_GRAPH_SHA='c5a3af5e55a703d4a61feff32fc905506f1208ddfa3c853dc6620f7d8b9ed316'
          V64_OCC_SHA='9330f206055a2d642e319ba89485f50d012f73752b3aad4aad511a55efd32414'
          V64_RECEIPT_SHA='37517e5f3dc66819f61f5a7bb8ace1921282415f10551d2defa5c3eb0985b570'
          V59_GENERATOR_SHA='d393880e34ddefac2a95730896338bf5ce72b14f5fcca78a468ab5ddc3f4d3ab'

          def H(b): return hashlib.sha256(b).hexdigest()
          def G(b): return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          def decode_contents(path, blob):
              obj=json.loads(Path(path).read_text())
              if obj.get('sha')!=blob: raise SystemExit(f'V72_BIND_FAIL blob {path}')
              data=base64.b64decode(obj['content'])
              if G(data)!=blob: raise SystemExit(f'V72_BIND_FAIL recomputed blob {path}')
              return data
          def comment(path,cid):
              obj=json.loads(Path(path).read_text())
              if obj.get('id')!=cid or obj.get('user',{}).get('login')!='search-maker': raise SystemExit(f'V72_BIND_FAIL comment {cid}')
              return obj.get('body','')
          def extract_run(src):
              lines=src.splitlines(keepends=True); marker=b'        run: |\n'
              if marker not in lines: raise SystemExit('V72_BIND_FAIL V71 run marker')
              start=lines.index(marker)+1; out=[]
              for line in lines[start:]:
                  if line.strip() and not line.startswith(b'          '): break
                  out.append(line[10:] if line.startswith(b'          ') else line)
              return b''.join(out)

          v72body=comment('fetched-v72/coordinator-v72.json',V72_COORD)
          for x in [
              'Exactly ONE fresh LowAlt PRE-RESULT V72 identity is authorized',
              'V72 may repair ONLY this V71 authority-binding LOCUS defect',
              'AUTHORITY_LOCUS_GATE_PASS',
              'No V73 absent later direct Coordinator transition',
          ]:
              if x not in v72body: raise SystemExit('V72_BIND_FAIL direct authority literal '+x)

          v71body=comment('fetched-v72/coordinator-v71.json',V71_COORD)
          scope_markers=[
              'Exactly ONE fresh LowAlt PRE-RESULT V71 identity is authorized',
              'V71 may repair ONLY the V65 successor replacement-content and exact child-diff assertion indentation representation',
              'successor_block', 'new_check',
              'with no TABLE_TARGET/MANIFEST_TARGET reindent',
              'No V72 absent later direct Coordinator transition',
          ]
          for x in scope_markers:
              if x not in v71body: raise SystemExit('V72_BIND_FAIL V71 scope literal '+x)
          if v71body.count(CORR_TABLE)!=0 or v71body.count(CORR_MANIFEST)!=0:
              raise SystemExit('V72_BIND_FAIL V71 scope owner unexpectedly restates inherited values')

          v71=decode_contents('fetched-v72/v71-workflow.json',V71_BLOB)
          if v71!=Path('fetched-v72/v71-workflow-raw.yml').read_bytes(): raise SystemExit('V72_BIND_FAIL V71 representations')
          run=json.loads(Path('fetched-v72/v71-run.json').read_text()); job=json.loads(Path('fetched-v72/v71-job.json').read_text()); art=json.loads(Path('fetched-v72/v71-artifact.json').read_text())
          if run.get('id')!=V71_RUN or run.get('run_attempt')!=1 or run.get('conclusion')!='failure' or run.get('head_sha')!=V71_HEAD: raise SystemExit('V72_BIND_FAIL V71 run')
          if job.get('id')!=V71_JOB or job.get('conclusion')!='failure': raise SystemExit('V72_BIND_FAIL V71 job')
          if art.get('id')!=V71_ART or art.get('digest')!='sha256:'+V71_SHA or art.get('size_in_bytes')!=V71_SIZE or art.get('expired'): raise SystemExit('V72_BIND_FAIL V71 artifact metadata')
          log=Path('fetched-v72/v71-job.log').read_text(errors='replace')
          first_false='V71_BIND_FAIL coordinator literal '+CORR_TABLE
          if first_false not in log or 'SUCCESSOR_REPLACEMENT_REPRESENTATION_GATE_PASS' in log: raise SystemExit('V72_BIND_FAIL V71 first-false boundary')
          z71=Path('artifacts-v72/v71.zip').read_bytes()
          if len(z71)!=V71_SIZE or H(z71)!=V71_SHA: raise SystemExit('V72_BIND_FAIL V71 artifact transport')

          owner65=comment('fetched-v72/coordinator-v65.json',OWNER_COORD)
          ownercp=comment('fetched-v72/v65-checkpoint.json',OWNER_CP65)
          owner66=comment('fetched-v72/coordinator-v66.json',OWNER_COORD66)
          owner65_need=[
              'FROZEN_TARGET_DECLARATION_STALE_OR_MISRECORDED_PROVEN',
              'V59_SOURCE_DEFINED_TABLE_SHA256='+CORR_TABLE,
              'V59_SOURCE_DEFINED_MANIFEST_SHA256='+CORR_MANIFEST,
              V64_CLASS_SHA,V64_GRAPH_SHA,V64_OCC_SHA,V64_RECEIPT_SHA,V59_GENERATOR_SHA,
          ]
          for x in owner65_need:
              if owner65.count(x)!=1: raise SystemExit('V72_BIND_FAIL V64/V65 owner cardinality '+x)
          cp_table="table size `16331`, SHA256 `"+CORR_TABLE+'`'
          cp_manifest="manifest size `21981`, SHA256 `"+CORR_MANIFEST+'`'
          if ownercp.count(cp_table)!=1 or ownercp.count(cp_manifest)!=1 or 'the independently reproduced corrected V59 source-output identities themselves did not drift' not in ownercp:
              raise SystemExit('V72_BIND_FAIL V65 checkpoint value context')
          if owner66.count(cp_table)!=1 or owner66.count(cp_manifest)!=1:
              raise SystemExit('V72_BIND_FAIL V66 coordinator reproduction continuity')

          v64=decode_contents('fetched-v72/v64-workflow.json',V64_BLOB)
          if v64!=Path('fetched-v72/v64-workflow-raw.yml').read_bytes(): raise SystemExit('V72_BIND_FAIL V64 representations')
          m64=json.loads(Path('fetched-v72/v64-artifact.json').read_text()); z64=Path('artifacts-v72/v64.zip').read_bytes()
          if m64.get('id')!=V64_ART or m64.get('digest')!='sha256:'+V64_SHA or m64.get('size_in_bytes')!=V64_SIZE or m64.get('expired') or len(z64)!=V64_SIZE or H(z64)!=V64_SHA: raise SystemExit('V72_BIND_FAIL V64 artifact')
          with zipfile.ZipFile(io.BytesIO(z64)) as zz:
              p64={
                  'classification':'evidence/v64-target-provenance/CLASSIFICATION',
                  'graph':'evidence/v64-target-provenance/authoritative-provenance-graph.json',
                  'occ':'evidence/v64-target-provenance/target-hash-occurrences.json',
                  'receipts':'evidence/v64-target-provenance/exact-target-byte-receipts.json',
                  'generator':'evidence/v64-target-provenance/source-defined-v59-generator.py',
              }
              names=[i.filename for i in zz.infolist() if not i.is_dir()]
              for p in p64.values():
                  if names.count(p)!=1: raise SystemExit('V72_BIND_FAIL V64 member '+p)
              b64={k:zz.read(p) for k,p in p64.items()}
          expect64={'classification':V64_CLASS_SHA,'graph':V64_GRAPH_SHA,'occ':V64_OCC_SHA,'receipts':V64_RECEIPT_SHA,'generator':V59_GENERATOR_SHA}
          for k,v in expect64.items():
              if H(b64[k])!=v: raise SystemExit('V72_BIND_FAIL V64 member sha '+k)
          if b64['classification']!=b'FROZEN_TARGET_DECLARATION_STALE_OR_MISRECORDED_PROVEN\n' or json.loads(b64['receipts'])!=[]: raise SystemExit('V72_BIND_FAIL V64 classification/receipts')
          graph=json.loads(b64['graph']); u=graph.get('unique_source_defined_outputs',{})
          if graph.get('classification')!='FROZEN_TARGET_DECLARATION_STALE_OR_MISRECORDED_PROVEN' or u.get('table')!=CORR_TABLE or u.get('manifest')!=CORR_MANIFEST or u.get('derivations')!=2:
              raise SystemExit('V72_BIND_FAIL V64 graph values')

          v65=decode_contents('fetched-v72/v65-workflow.json',V65_BLOB)
          if v65!=Path('fetched-v72/v65-workflow-raw.yml').read_bytes(): raise SystemExit('V72_BIND_FAIL V65 representations')
          m65=json.loads(Path('fetched-v72/v65-artifact.json').read_text()); z65=Path('artifacts-v72/v65.zip').read_bytes()
          if m65.get('id')!=V65_ART or m65.get('digest')!='sha256:'+V65_SHA or m65.get('size_in_bytes')!=V65_SIZE or m65.get('expired') or len(z65)!=V65_SIZE or H(z65)!=V65_SHA: raise SystemExit('V72_BIND_FAIL V65 artifact')
          with zipfile.ZipFile(io.BytesIO(z65)) as zz:
              gatep='evidence/v65-source-output-identity/corrected-source-output-identity-gate.json'
              markp='evidence/v65-source-output-identity/CORRECTED_V59_SOURCE_OUTPUT_IDENTITY_PASS'
              names=[i.filename for i in zz.infolist() if not i.is_dir()]
              if names.count(gatep)!=1 or names.count(markp)!=1: raise SystemExit('V72_BIND_FAIL V65 gate members')
              gate=json.loads(zz.read(gatep)); mark=zz.read(markp)
          ident=gate.get('successor_source_defined_identity',{})
          if gate.get('status')!='CORRECTED_V59_SOURCE_OUTPUT_IDENTITY_PASS' or ident.get('table')!=CORR_TABLE or ident.get('manifest')!=CORR_MANIFEST or gate.get('independent_reproductions')!=2 or gate.get('unique_table_candidates')!=1 or gate.get('unique_manifest_candidates')!=1:
              raise SystemExit('V72_BIND_FAIL V65 corrected identity gate')
          if gate.get('historical_checkpoint_mutated') or gate.get('scientific_script_mutated') or gate.get('source_defined_transport_mutated') or gate.get('b_selected') or gate.get('b_resolved'):
              raise SystemExit('V72_BIND_FAIL V65 gate boundary')
          if mark!=b'PASS separately corrected source-defined V59 output identities reproduced twice before predicate use\n': raise SystemExit('V72_BIND_FAIL V65 marker')

          main=json.loads(Path('fetched-v72/main.json').read_text())
          if main.get('commit',{}).get('sha')!=MAIN: raise SystemExit('V72_BIND_FAIL main drift')
          comp=json.loads(Path('fetched-v72/main-to-v72.json').read_text()); files=comp.get('files') or []
          if comp.get('base_commit',{}).get('sha')!=MAIN or len(files)!=1 or files[0].get('filename')!='.github/workflows/lowalt-lt5-p-worker-module-v72.yml' or files[0].get('status')!='added': raise SystemExit('V72_BIND_FAIL branch scope')

          locus={
              'schema':1,
              'status':'AUTHORITY_LOCUS_GATE_PASS',
              'direct_successor_authority':V72_COORD,
              'v71_scope_owner':V71_COORD,
              'v71_scope_markers':scope_markers,
              'v71_scope_owner_corrected_table_literal_count':v71body.count(CORR_TABLE),
              'v71_scope_owner_corrected_manifest_literal_count':v71body.count(CORR_MANIFEST),
              'inherited_value_owners':{
                  'coordinator_v65':OWNER_COORD,
                  'v65_checkpoint':OWNER_CP65,
                  'coordinator_v66':OWNER_COORD66,
                  'v64_artifact':V64_ART,
                  'v65_artifact':V65_ART,
              },
              'corrected_source_output_identity':{'table':CORR_TABLE,'manifest':CORR_MANIFEST},
              'v64_internal_member_sha256':expect64,
              'v65_independent_reproductions':gate.get('independent_reproductions'),
              'v65_unique_table_candidates':gate.get('unique_table_candidates'),
              'v65_unique_manifest_candidates':gate.get('unique_manifest_candidates'),
              'historical_v59_checkpoint_mutation':False,
              'scientific_script_mutation':False,
              'source_defined_transport_mutation':False,
              'b_selected':False,
              'b_resolved':False,
          }
          Path(OUT/'authority-locus-table.json').write_text(json.dumps(locus,indent=2,sort_keys=True)+'\n')

          r71=extract_run(v71); text=r71.decode()
          old="    CORR_TABLE, CORR_MANIFEST,\n"
          if text.count(old)!=1: raise SystemExit('V72_PATCH_FAIL authority-locus precondition count='+str(text.count(old)))
          patched=text.replace(old,'',1)
          diff=''.join(difflib.unified_diff(text.splitlines(True),patched.splitlines(True),fromfile='v71-run-original.sh',tofile='v71-run-patched-v72.sh',n=3))
          payload=[x for x in diff.splitlines() if (x.startswith('+') and not x.startswith('+++')) or (x.startswith('-') and not x.startswith('---'))]
          if payload!=['-'+old.rstrip('\n')]: raise SystemExit('V72_PATCH_FAIL unexpected harness payload '+repr(payload))
          if text.count(CORR_TABLE)!=patched.count(CORR_TABLE) or text.count(CORR_MANIFEST)!=patched.count(CORR_MANIFEST): raise SystemExit('V72_PATCH_FAIL corrected value drift')
          for x in scope_markers:
              if text.count(x)!=patched.count(x): raise SystemExit('V72_PATCH_FAIL scope marker drift '+x)
          Path('bootstrap/v71-run-patched-v72.sh').write_text(patched)
          Path(OUT/'v71-to-v72-authority-locus-harness-only.diff').write_text(diff)
          receipt={
              'status':'PASS_PRE_RESULT_V72_AUTHORITY_LOCUS_ONLY',
              'v71_workflow_blob':V71_BLOB,
              'v71_extracted_run_sha256':H(r71),
              'v72_patched_v71_run_sha256':H(patched.encode()),
              'diff_sha256':H(diff.encode()),
              'diff_payload':payload,
              'scope_permission_owner':V71_COORD,
              'corrected_value_owner_chain':[OWNER_COORD,OWNER_CP65,OWNER_COORD66,V64_ART,V65_ART],
              'corrected_table':CORR_TABLE,
              'corrected_manifest':CORR_MANIFEST,
              'broad_authority_relaxation':False,
              'source_output_value_change':False,
              'historical_v59_checkpoint_mutation':False,
              'scientific_script_mutation':False,
              'source_defined_transport_mutation':False,
              'normalization_used':False,
              'desired_outcome_selection_used':False,
              'b_selected':False,
              'b_resolved':False,
          }
          Path(OUT/'receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          Path(OUT/'AUTHORITY_LOCUS_GATE_PASS').write_text('PASS: current V71 Coordinator owns scope/permission only; inherited corrected V59 source-output values bind to immutable V64/V65 owner evidence\n')
          print('AUTHORITY_LOCUS_GATE_PASS')
          print('V71_EXTRACTED_RUN_SHA256='+H(r71))
          print('V72_PATCHED_V71_RUN_SHA256='+H(patched.encode()))
          print('V71_TO_V72_AUTHORITY_LOCUS_DIFF_SHA256='+H(diff.encode()))
          PY_V72

          test -f evidence/v72-authority-locus/AUTHORITY_LOCUS_GATE_PASS
          bash -n bootstrap/v71-run-patched-v72.sh
          set +e
          GITHUB_SHA="304af652dcd01bd8230d979aca8a0c791eb2f18d" \
            bash bootstrap/v71-run-patched-v72.sh \
            >evidence/v72-authority-locus/preserved-v71-child.stdout \
            2>evidence/v72-authority-locus/preserved-v71-child.stderr
          CHILD_RC=$?
          set -e
          printf '%s\n' "$CHILD_RC" > evidence/v72-authority-locus/preserved-v71-child.exit-code.txt
          if [ "$CHILD_RC" -ne 0 ]; then
            echo "V72_PRESERVED_V71_FIRST_FALSE rc=${CHILD_RC}" >&2
            tail -n 480 evidence/v72-authority-locus/preserved-v71-child.stderr >&2 || true
            exit "$CHILD_RC"
          fi

      - name: Freeze V72 PRE-RESULT evidence
        if: always()
