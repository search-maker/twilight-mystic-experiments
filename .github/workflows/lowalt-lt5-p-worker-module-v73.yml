name: LowAlt LT5 P Worker Module Authority Marker V73

on:
  push:
    branches:
      - review/lowalt-lt5-p-worker-module-v73-20260919
    paths:
      - .github/workflows/lowalt-lt5-p-worker-module-v73.yml

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  v72-authority-marker-case:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Repair only V72 direct-authority marker case representation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p fetched-v73 artifacts-v73 bootstrap evidence/v73-authority-marker

          api_get() {
            local url="$1" out="$2"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$url" -o "$out"
          }

          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/issues/comments/5747055946" fetched-v73/coordinator-v73.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/issues/comments/5746738878" fetched-v73/coordinator-v72.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/lowalt-lt5-p-worker-module-v72.yml?ref=a2babd4e981ae5f9433c57a318ed42b315db2edf" fetched-v73/v72-workflow.json
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/search-maker/twilight-mystic-experiments/a2babd4e981ae5f9433c57a318ed42b315db2edf/.github/workflows/lowalt-lt5-p-worker-module-v72.yml" \
            -o fetched-v73/v72-workflow-raw.yml
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/runs/35483228093" fetched-v73/v72-run.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/jobs/106004690300" fetched-v73/v72-job.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/10597380085" fetched-v73/v72-artifact.json
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/jobs/106004690300/logs" \
            -o fetched-v73/v72-job.log
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/10597380085/zip" \
            -o artifacts-v73/v72.zip
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/branches/main" fetched-v73/main.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/compare/6cd7c075766fe0c86bc7561ec205a3f9120fd1fb...${GITHUB_SHA}" fetched-v73/main-to-v73.json

          python3 - <<'PY_V73'
          import base64, difflib, hashlib, json
          from pathlib import Path

          OUT=Path('evidence/v73-authority-marker'); OUT.mkdir(parents=True,exist_ok=True)
          MAIN='6cd7c075766fe0c86bc7561ec205a3f9120fd1fb'
          V73_COORD=5747055946
          V72_COORD=5746738878
          V72_HEAD='a2babd4e981ae5f9433c57a318ed42b315db2edf'
          V72_BLOB='182834d32f01e7d04839beb2196c9dfb7541f920'
          V72_RUN=35483228093; V72_JOB=106004690300; V72_ART=10597380085
          V72_SHA='c7f78e9476ef7592a607ea3dc5736893da87286dd0c82f028eebd74a7ce81723'; V72_SIZE=23779457
          OLD='No V73 absent later direct Coordinator transition'
          NEW='no V73 absent later direct Coordinator transition'
          FIRST_FALSE='V72_BIND_FAIL direct authority literal '+OLD

          def H(b): return hashlib.sha256(b).hexdigest()
          def G(b): return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          def decode_contents(path, blob):
              obj=json.loads(Path(path).read_text())
              if obj.get('sha')!=blob: raise SystemExit('V73_BIND_FAIL workflow blob')
              data=base64.b64decode(obj['content'])
              if G(data)!=blob: raise SystemExit('V73_BIND_FAIL recomputed workflow blob')
              return data
          def comment(path,cid):
              obj=json.loads(Path(path).read_text())
              if obj.get('id')!=cid or obj.get('user',{}).get('login')!='search-maker': raise SystemExit('V73_BIND_FAIL comment '+str(cid))
              return obj.get('body','')
          def extract_run(src):
              lines=src.splitlines(keepends=True); marker=b'        run: |\n'
              if marker not in lines: raise SystemExit('V73_BIND_FAIL V72 run marker')
              start=lines.index(marker)+1; out=[]
              for line in lines[start:]:
                  if line.strip() and not line.startswith(b'          '): break
                  out.append(line[10:] if line.startswith(b'          ') else line)
              return b''.join(out)

          current=comment('fetched-v73/coordinator-v73.json',V73_COORD)
          current_markers=[
              'Exactly ONE fresh LowAlt PRE-RESULT V73 identity is authorized',
              'V73 may repair ONLY this direct-authority boundary-marker case/representation defect',
              'FIRST GATE: byte-bind exact V72 workflow/head/run/job/artifact/log and exact Coordinator `5746738878`',
              'no V74 absent later direct Coordinator transition',
          ]
          for x in current_markers:
              if current.count(x)!=1: raise SystemExit('V73_BIND_FAIL current authority cardinality '+x)

          source=comment('fetched-v73/coordinator-v72.json',V72_COORD)
          if source.count(NEW)!=1: raise SystemExit('V73_BIND_FAIL source lowercase marker cardinality='+str(source.count(NEW)))
          if source.count(OLD)!=0: raise SystemExit('V73_BIND_FAIL source unexpectedly contains uppercase marker')
          source_line=[(i+1,l) for i,l in enumerate(source.splitlines()) if NEW in l]
          if len(source_line)!=1: raise SystemExit('V73_BIND_FAIL source marker context ambiguity')

          v72=decode_contents('fetched-v73/v72-workflow.json',V72_BLOB)
          raw=Path('fetched-v73/v72-workflow-raw.yml').read_bytes()
          if v72!=raw: raise SystemExit('V73_BIND_FAIL V72 workflow representations')
          run=json.loads(Path('fetched-v73/v72-run.json').read_text())
          job=json.loads(Path('fetched-v73/v72-job.json').read_text())
          art=json.loads(Path('fetched-v73/v72-artifact.json').read_text())
          if run.get('id')!=V72_RUN or run.get('run_attempt')!=1 or run.get('conclusion')!='failure' or run.get('head_sha')!=V72_HEAD:
              raise SystemExit('V73_BIND_FAIL V72 run')
          if job.get('id')!=V72_JOB or job.get('conclusion')!='failure': raise SystemExit('V73_BIND_FAIL V72 job')
          if art.get('id')!=V72_ART or art.get('digest')!='sha256:'+V72_SHA or art.get('size_in_bytes')!=V72_SIZE or art.get('expired'):
              raise SystemExit('V73_BIND_FAIL V72 artifact metadata')
          log=Path('fetched-v73/v72-job.log').read_text(errors='replace')
          if log.count(FIRST_FALSE)!=1 or 'AUTHORITY_LOCUS_GATE_PASS' in log:
              raise SystemExit('V73_BIND_FAIL V72 first-false boundary')
          z=Path('artifacts-v73/v72.zip').read_bytes()
          if len(z)!=V72_SIZE or H(z)!=V72_SHA: raise SystemExit('V73_BIND_FAIL V72 artifact transport')

          main=json.loads(Path('fetched-v73/main.json').read_text())
          if main.get('commit',{}).get('sha')!=MAIN: raise SystemExit('V73_BIND_FAIL main drift')
          comp=json.loads(Path('fetched-v73/main-to-v73.json').read_text()); files=comp.get('files') or []
          if comp.get('base_commit',{}).get('sha')!=MAIN or len(files)!=1 or files[0].get('filename')!='.github/workflows/lowalt-lt5-p-worker-module-v73.yml' or files[0].get('status')!='added':
              raise SystemExit('V73_BIND_FAIL branch scope')

          shell=extract_run(v72); text=shell.decode()
          if text.count(OLD)!=1 or text.count(NEW)!=0:
              raise SystemExit('V73_PATCH_FAIL marker precondition old='+str(text.count(OLD))+' new='+str(text.count(NEW)))
          old_line=[(i+1,l) for i,l in enumerate(text.splitlines()) if OLD in l]
          if len(old_line)!=1: raise SystemExit('V73_PATCH_FAIL old marker context ambiguity')
          patched=text.replace(OLD,NEW,1)
          if patched.count(OLD)!=0 or patched.count(NEW)!=1: raise SystemExit('V73_PATCH_FAIL postcondition')
          new_line=[(i+1,l) for i,l in enumerate(patched.splitlines()) if NEW in l]
          if len(new_line)!=1 or new_line[0][0]!=old_line[0][0]: raise SystemExit('V73_PATCH_FAIL new marker context ambiguity')

          diff=''.join(difflib.unified_diff(text.splitlines(True),patched.splitlines(True),fromfile='v72-run-original.sh',tofile='v72-run-patched-v73.sh',n=3))
          payload=[x for x in diff.splitlines() if (x.startswith('+') and not x.startswith('+++')) or (x.startswith('-') and not x.startswith('---'))]
          expected=['-'+old_line[0][1], '+'+new_line[0][1]]
          if payload!=expected: raise SystemExit('V73_PATCH_FAIL unexpected diff payload '+repr(payload))
          if old_line[0][1].replace(OLD,NEW,1)!=new_line[0][1]: raise SystemExit('V73_PATCH_FAIL line changed beyond marker')

          Path('bootstrap/v72-run-patched-v73.sh').write_text(patched)
          Path(OUT/'v72-to-v73-authority-marker-harness-only.diff').write_text(diff)
          receipt={
              'schema':1,
              'status':'AUTHORITY_MARKER_REPRESENTATION_GATE_PASS',
              'v73_authority_comment':V73_COORD,
              'v72_source_authority_comment':V72_COORD,
              'v72_workflow_blob':V72_BLOB,
              'v72_head':V72_HEAD,
              'v72_run':V72_RUN,
              'v72_job':V72_JOB,
              'v72_artifact':V72_ART,
              'v72_artifact_sha256':V72_SHA,
              'v72_artifact_size':V72_SIZE,
              'v72_first_false':FIRST_FALSE,
              'old_marker':OLD,
              'new_marker':NEW,
              'source_authority_marker_line':source_line[0][0],
              'source_authority_marker_context':source_line[0][1],
              'extracted_shell_old_marker_line':old_line[0][0],
              'extracted_shell_old_marker_context':old_line[0][1],
              'extracted_shell_new_marker_line':new_line[0][0],
              'extracted_shell_new_marker_context':new_line[0][1],
              'v72_extracted_run_sha256':H(shell),
              'v73_patched_v72_run_sha256':H(patched.encode()),
              'diff_sha256':H(diff.encode()),
              'diff_payload':payload,
              'broad_case_folding':False,
              'case_insensitive_matching':False,
              'punctuation_normalization':False,
              'unrelated_literal_relaxation':False,
              'historical_checkpoint_mutation':False,
              'scientific_script_mutation':False,
              'source_defined_transport_mutation':False,
              'b_selected':False,
              'b_resolved':False,
          }
          Path(OUT/'receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          Path(OUT/'AUTHORITY_MARKER_REPRESENTATION_GATE_PASS').write_text('PASS: exact V72 direct-authority boundary marker changed only from uppercase No to lowercase no in extracted-shell predicate\n')
          print('AUTHORITY_MARKER_REPRESENTATION_GATE_PASS')
          print('V72_EXTRACTED_RUN_SHA256='+H(shell))
          print('V73_PATCHED_V72_RUN_SHA256='+H(patched.encode()))
          print('V72_TO_V73_DIFF_SHA256='+H(diff.encode()))
          PY_V73

          test -f evidence/v73-authority-marker/AUTHORITY_MARKER_REPRESENTATION_GATE_PASS
          bash -n bootstrap/v72-run-patched-v73.sh
          set +e
          GITHUB_SHA="a2babd4e981ae5f9433c57a318ed42b315db2edf" \
            bash bootstrap/v72-run-patched-v73.sh \
            >evidence/v73-authority-marker/preserved-v72-child.stdout \
            2>evidence/v73-authority-marker/preserved-v72-child.stderr
          CHILD_RC=$?
          set -e
          printf '%s\n' "$CHILD_RC" > evidence/v73-authority-marker/preserved-v72-child.exit-code.txt
          if [ "$CHILD_RC" -ne 0 ]; then
            echo "V73_PRESERVED_V72_FIRST_FALSE rc=${CHILD_RC}" >&2
            tail -n 520 evidence/v73-authority-marker/preserved-v72-child.stderr >&2 || true
            exit "$CHILD_RC"
          fi

      - name: Freeze V73 PRE-RESULT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-worker-module-v73
          path: |
            fetched-v73
            artifacts-v73
            bootstrap
            evidence
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
