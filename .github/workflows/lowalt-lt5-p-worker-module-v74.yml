name: LowAlt LT5 P Worker Module Execution Boundary V74

on:
  push:
    branches:
      - review/lowalt-lt5-p-worker-module-v74-20260919
    paths:
      - .github/workflows/lowalt-lt5-p-worker-module-v74.yml

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  v73-execution-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Repair only V73 execution-marker log source-echo representation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p fetched-v74 artifacts-v74 bootstrap evidence/v74-execution-boundary

          api_get() {
            local url="$1" out="$2"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$url" -o "$out"
          }

          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/issues/comments/5747352254" fetched-v74/coordinator-v74.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/issues/comments/5747252813" fetched-v74/v73-checkpoint.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/issues/comments/5746960040" fetched-v74/v72-checkpoint.json

          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/lowalt-lt5-p-worker-module-v73.yml?ref=818eff5fd48fa2dc33c97e128ac79b37e2e3fd67" fetched-v74/v73-workflow.json
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/search-maker/twilight-mystic-experiments/818eff5fd48fa2dc33c97e128ac79b37e2e3fd67/.github/workflows/lowalt-lt5-p-worker-module-v73.yml" \
            -o fetched-v74/v73-workflow-raw.yml
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/runs/35485856223" fetched-v74/v73-run.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/jobs/106011974270" fetched-v74/v73-job.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/10597655255" fetched-v74/v73-artifact.json
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/jobs/106011974270/logs" \
            -o fetched-v74/v73-job.log
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/10597655255/zip" \
            -o artifacts-v74/v73.zip

          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/lowalt-lt5-p-worker-module-v72.yml?ref=a2babd4e981ae5f9433c57a318ed42b315db2edf" fetched-v74/v72-workflow.json
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/search-maker/twilight-mystic-experiments/a2babd4e981ae5f9433c57a318ed42b315db2edf/.github/workflows/lowalt-lt5-p-worker-module-v72.yml" \
            -o fetched-v74/v72-workflow-raw.yml
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/runs/35483228093" fetched-v74/v72-run.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/jobs/106004690300" fetched-v74/v72-job.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/10597380085" fetched-v74/v72-artifact.json
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/jobs/106004690300/logs" \
            -o fetched-v74/v72-job.log
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/10597380085/zip" \
            -o artifacts-v74/v72.zip

          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/branches/main" fetched-v74/main.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/compare/6cd7c075766fe0c86bc7561ec205a3f9120fd1fb...${GITHUB_SHA}" fetched-v74/main-to-v74.json

          python3 - <<'PY_V74'
          import base64, difflib, hashlib, json, zipfile
          from pathlib import Path

          OUT=Path('evidence/v74-execution-boundary'); OUT.mkdir(parents=True,exist_ok=True)
          MAIN='6cd7c075766fe0c86bc7561ec205a3f9120fd1fb'
          V74_COORD=5747352254
          V73_CP=5747252813
          V72_CP=5746960040
          V73_HEAD='818eff5fd48fa2dc33c97e128ac79b37e2e3fd67'
          V73_BLOB='38e1e07be586f6df22281968677a7b9ceb32639e'
          V73_RUN=35485856223; V73_JOB=106011974270; V73_ART=10597655255
          V73_SHA='f0210b9256406a77ffe8b55d65f9b089c1a92c7669dcd4b5181f86f0af92e579'; V73_SIZE=23958232
          V72_HEAD='a2babd4e981ae5f9433c57a318ed42b315db2edf'
          V72_BLOB='182834d32f01e7d04839beb2196c9dfb7541f920'
          V72_RUN=35483228093; V72_JOB=106004690300; V72_ART=10597380085
          V72_SHA='c7f78e9476ef7592a607ea3dc5736893da87286dd0c82f028eebd74a7ce81723'; V72_SIZE=23779457
          FIRST_FALSE_V73='V73_BIND_FAIL V72 first-false boundary'
          FIRST_FALSE_V72='V72_BIND_FAIL direct authority literal No V73 absent later direct Coordinator transition'
          MARKER='AUTHORITY_LOCUS_GATE_PASS'
          EXEC_MEMBER='evidence/v72-authority-locus/'+MARKER
          OLD="if log.count(FIRST_FALSE)!=1 or 'AUTHORITY_LOCUS_GATE_PASS' in log:"
          NEW="if log.count(FIRST_FALSE)!=1 or __import__('zipfile').ZipFile('artifacts-v73/v72.zip').namelist().count('evidence/v72-authority-locus/AUTHORITY_LOCUS_GATE_PASS')!=0:"

          def H(b): return hashlib.sha256(b).hexdigest()
          def G(b): return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          def decode_contents(path, blob):
              obj=json.loads(Path(path).read_text())
              if obj.get('sha')!=blob: raise SystemExit('V74_BIND_FAIL workflow blob '+path)
              data=base64.b64decode(obj['content'])
              if G(data)!=blob: raise SystemExit('V74_BIND_FAIL recomputed workflow blob '+path)
              return data
          def comment(path,cid):
              obj=json.loads(Path(path).read_text())
              if obj.get('id')!=cid or obj.get('user',{}).get('login')!='search-maker': raise SystemExit('V74_BIND_FAIL comment '+str(cid))
              return obj.get('body','')
          def extract_run(src):
              lines=src.splitlines(keepends=True); marker=b'        run: |\n'
              if marker not in lines: raise SystemExit('V74_BIND_FAIL run marker')
              start=lines.index(marker)+1; out=[]
              for line in lines[start:]:
                  if line.strip() and not line.startswith(b'          '): break
                  out.append(line[10:] if line.startswith(b'          ') else line)
              return b''.join(out)
          def bind_run_job_art(run_path,job_path,art_path,run_id,job_id,art_id,head,sha,size):
              run=json.loads(Path(run_path).read_text()); job=json.loads(Path(job_path).read_text()); art=json.loads(Path(art_path).read_text())
              if run.get('id')!=run_id or run.get('run_attempt')!=1 or run.get('conclusion')!='failure' or run.get('head_sha')!=head:
                  raise SystemExit('V74_BIND_FAIL run '+str(run_id))
              if job.get('id')!=job_id or job.get('conclusion')!='failure': raise SystemExit('V74_BIND_FAIL job '+str(job_id))
              if art.get('id')!=art_id or art.get('digest')!='sha256:'+sha or art.get('size_in_bytes')!=size or art.get('expired'):
                  raise SystemExit('V74_BIND_FAIL artifact metadata '+str(art_id))

          current=comment('fetched-v74/coordinator-v74.json',V74_COORD)
          current_markers=[
              'Exactly ONE fresh LowAlt PRE-RESULT V74 identity is authorized',
              'V74 may repair ONLY this execution-marker/log-source-echo representation defect',
              'V72_FIRST_FALSE_EXECUTION_BOUNDARY_GATE_PASS',
              'No V75 absent later direct Coordinator transition',
          ]
          for x in current_markers:
              if current.count(x)!=1: raise SystemExit('V74_BIND_FAIL current authority cardinality '+x)

          cp73=comment('fetched-v74/v73-checkpoint.json',V73_CP)
          cp72=comment('fetched-v74/v72-checkpoint.json',V72_CP)
          if cp73.count(FIRST_FALSE_V73)!=1 or cp73.count(str(V73_RUN))!=1 or cp73.count(str(V73_JOB))!=1:
              raise SystemExit('V74_BIND_FAIL V73 checkpoint')
          if cp72.count(FIRST_FALSE_V72)!=1 or cp72.count(str(V72_RUN))!=1 or cp72.count(str(V72_JOB))!=1:
              raise SystemExit('V74_BIND_FAIL V72 checkpoint')

          v73=decode_contents('fetched-v74/v73-workflow.json',V73_BLOB)
          if v73!=Path('fetched-v74/v73-workflow-raw.yml').read_bytes(): raise SystemExit('V74_BIND_FAIL V73 workflow representations')
          bind_run_job_art('fetched-v74/v73-run.json','fetched-v74/v73-job.json','fetched-v74/v73-artifact.json',V73_RUN,V73_JOB,V73_ART,V73_HEAD,V73_SHA,V73_SIZE)
          z73=Path('artifacts-v74/v73.zip').read_bytes()
          if len(z73)!=V73_SIZE or H(z73)!=V73_SHA: raise SystemExit('V74_BIND_FAIL V73 artifact transport')
          log73=Path('fetched-v74/v73-job.log').read_bytes()
          if FIRST_FALSE_V73.encode() not in log73: raise SystemExit('V74_BIND_FAIL V73 first-false log')

          v72=decode_contents('fetched-v74/v72-workflow.json',V72_BLOB)
          if v72!=Path('fetched-v74/v72-workflow-raw.yml').read_bytes(): raise SystemExit('V74_BIND_FAIL V72 workflow representations')
          bind_run_job_art('fetched-v74/v72-run.json','fetched-v74/v72-job.json','fetched-v74/v72-artifact.json',V72_RUN,V72_JOB,V72_ART,V72_HEAD,V72_SHA,V72_SIZE)
          z72=Path('artifacts-v74/v72.zip').read_bytes()
          if len(z72)!=V72_SIZE or H(z72)!=V72_SHA: raise SystemExit('V74_BIND_FAIL V72 artifact transport')
          log72b=Path('fetched-v74/v72-job.log').read_bytes(); log72=log72b.decode(errors='replace')
          if log72.count(FIRST_FALSE_V72)!=1: raise SystemExit('V74_BIND_FAIL V72 accepted first-false cardinality='+str(log72.count(FIRST_FALSE_V72)))

          r72=extract_run(v72); t72=r72.decode()
          print_needle="print('"+MARKER+"')"
          write_needle="Path(OUT/'"+MARKER+"').write_text("
          test_needle='test -f '+EXEC_MEMBER
          source_counts={
              'python_print_marker':t72.count(print_needle),
              'python_write_marker_receipt':t72.count(write_needle),
              'shell_test_marker_receipt':t72.count(test_needle),
          }
          if source_counts!={'python_print_marker':1,'python_write_marker_receipt':1,'shell_test_marker_receipt':1}:
              raise SystemExit('V74_BOUNDARY_FAIL nonunique source-defined execution receipt '+repr(source_counts))
          print_lines=[i+1 for i,l in enumerate(t72.splitlines()) if print_needle in l]
          write_lines=[i+1 for i,l in enumerate(t72.splitlines()) if write_needle in l]
          test_lines=[i+1 for i,l in enumerate(t72.splitlines()) if test_needle in l]
          if len(print_lines)!=1 or len(write_lines)!=1 or len(test_lines)!=1 or not (write_lines[0] < print_lines[0] < test_lines[0]):
              raise SystemExit('V74_BOUNDARY_FAIL source execution marker ordering')

          with zipfile.ZipFile('artifacts-v74/v72.zip','r') as zf:
              names=zf.namelist()
              exec_member_count=names.count(EXEC_MEMBER)
          marker_log_lines=[l for l in log72.splitlines() if MARKER in l]
          exact_emitted_marker_lines=[l for l in marker_log_lines if l.endswith(' '+MARKER)]
          source_echo_ansi_lines=[l for l in marker_log_lines if '\x1b[36;1m' in l and '\x1b[0m' in l]
          if exec_member_count!=0:
              raise SystemExit('V74_BOUNDARY_FAIL V72 execution receipt exists count='+str(exec_member_count))
          if len(exact_emitted_marker_lines)!=0:
              raise SystemExit('V74_BOUNDARY_FAIL V72 emitted execution marker exists count='+str(len(exact_emitted_marker_lines)))
          if len(marker_log_lines)==0:
              raise SystemExit('V74_BOUNDARY_FAIL expected source-echo evidence absent')

          table={
              'schema':1,
              'marker':MARKER,
              'execution_receipt_member':EXEC_MEMBER,
              'v72_source_sha256':H(v72),
              'v72_extracted_run_sha256':H(r72),
              'source_counts':source_counts,
              'source_write_line':write_lines[0],
              'source_print_line':print_lines[0],
              'source_post_python_test_line':test_lines[0],
              'v72_job_log_sha256':H(log72b),
              'v72_job_log_marker_occurrence_count':len(marker_log_lines),
              'v72_job_log_exact_emitted_marker_count':len(exact_emitted_marker_lines),
              'v72_job_log_ansi_source_echo_marker_count':len(source_echo_ansi_lines),
              'v72_artifact_sha256':H(z72),
              'v72_artifact_execution_receipt_member_count':exec_member_count,
              'v72_first_false':FIRST_FALSE_V72,
              'v72_first_false_count':log72.count(FIRST_FALSE_V72),
              'classification':'SOURCE_ECHO_PRESENT_EXECUTION_RECEIPT_ABSENT',
          }
          Path(OUT/'source-echo-vs-executed-marker.json').write_text(json.dumps(table,indent=2,sort_keys=True)+'\n')
          Path(OUT/'V72_FIRST_FALSE_EXECUTION_BOUNDARY_GATE_PASS').write_text('PASS: exact V72 first-false is unique; source-defined AUTHORITY_LOCUS_GATE_PASS receipt member and exact emitted marker are absent while source echo is present\n')

          main=json.loads(Path('fetched-v74/main.json').read_text())
          if main.get('commit',{}).get('sha')!=MAIN: raise SystemExit('V74_BIND_FAIL main drift')
          comp=json.loads(Path('fetched-v74/main-to-v74.json').read_text()); files=comp.get('files') or []
          if comp.get('base_commit',{}).get('sha')!=MAIN or len(files)!=1 or files[0].get('filename')!='.github/workflows/lowalt-lt5-p-worker-module-v74.yml' or files[0].get('status')!='added':
              raise SystemExit('V74_BIND_FAIL branch scope')

          r73=extract_run(v73); text=r73.decode()
          if text.count(OLD)!=1 or text.count(NEW)!=0:
              raise SystemExit('V74_PATCH_FAIL boundary predicate precondition old='+str(text.count(OLD))+' new='+str(text.count(NEW)))
          old_line=[(i+1,l) for i,l in enumerate(text.splitlines()) if OLD in l]
          if len(old_line)!=1: raise SystemExit('V74_PATCH_FAIL old predicate context ambiguity')
          patched=text.replace(OLD,NEW,1)
          new_line=[(i+1,l) for i,l in enumerate(patched.splitlines()) if NEW in l]
          if len(new_line)!=1 or new_line[0][0]!=old_line[0][0]: raise SystemExit('V74_PATCH_FAIL new predicate context ambiguity')
          if patched.count(OLD)!=0 or patched.count(NEW)!=1: raise SystemExit('V74_PATCH_FAIL postcondition')

          diff=''.join(difflib.unified_diff(text.splitlines(True),patched.splitlines(True),fromfile='v73-run-original.sh',tofile='v73-run-patched-v74.sh',n=3))
          payload=[x for x in diff.splitlines() if (x.startswith('+') and not x.startswith('+++')) or (x.startswith('-') and not x.startswith('---'))]
          expected=['-'+old_line[0][1], '+'+new_line[0][1]]
          if payload!=expected: raise SystemExit('V74_PATCH_FAIL unexpected diff payload '+repr(payload))
          if old_line[0][1].replace(OLD,NEW,1)!=new_line[0][1]: raise SystemExit('V74_PATCH_FAIL line changed beyond boundary predicate')

          Path('bootstrap/v73-run-patched-v74.sh').write_text(patched)
          Path(OUT/'v73-to-v74-execution-boundary-harness-only.diff').write_text(diff)
          receipt={
              'schema':1,
              'status':'V72_FIRST_FALSE_EXECUTION_BOUNDARY_GATE_PASS',
              'v74_authority_comment':V74_COORD,
              'v73_checkpoint':V73_CP,
              'v72_checkpoint':V72_CP,
              'v73_workflow_blob':V73_BLOB,
              'v73_head':V73_HEAD,
              'v73_run':V73_RUN,
              'v73_job':V73_JOB,
              'v73_artifact':V73_ART,
              'v73_artifact_sha256':V73_SHA,
              'v73_artifact_size':V73_SIZE,
              'v73_job_log_sha256':H(log73),
              'v72_workflow_blob':V72_BLOB,
              'v72_head':V72_HEAD,
              'v72_run':V72_RUN,
              'v72_job':V72_JOB,
              'v72_artifact':V72_ART,
              'v72_artifact_sha256':V72_SHA,
              'v72_artifact_size':V72_SIZE,
              'v72_job_log_sha256':H(log72b),
              'source_echo_vs_execution_receipt':table,
              'old_predicate':OLD,
              'new_predicate':NEW,
              'v73_extracted_run_sha256':H(r73),
              'v74_patched_v73_run_sha256':H(patched.encode()),
              'diff_sha256':H(diff.encode()),
              'diff_payload':payload,
              'broad_log_normalization':False,
              'case_folding':False,
              'regex_relaxation':False,
              'generic_echo_suppression':False,
              'other_boundary_check_deletion':False,
              'scientific_script_mutation':False,
              'source_defined_transform_mutation':False,
              'historical_checkpoint_mutation':False,
              'desired_outcome_selection':False,
              'b_selected':False,
              'b_resolved':False,
          }
          Path(OUT/'receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print('V72_FIRST_FALSE_EXECUTION_BOUNDARY_GATE_PASS')
          print('V72_ARTIFACT_EXECUTION_RECEIPT_MEMBER_COUNT='+str(exec_member_count))
          print('V72_LOG_SOURCE_MARKER_OCCURRENCES='+str(len(marker_log_lines)))
          print('V72_LOG_EXACT_EMITTED_MARKER_COUNT='+str(len(exact_emitted_marker_lines)))
          print('V73_EXTRACTED_RUN_SHA256='+H(r73))
          print('V74_PATCHED_V73_RUN_SHA256='+H(patched.encode()))
          print('V73_TO_V74_DIFF_SHA256='+H(diff.encode()))
          PY_V74

          test -f evidence/v74-execution-boundary/V72_FIRST_FALSE_EXECUTION_BOUNDARY_GATE_PASS
          bash -n bootstrap/v73-run-patched-v74.sh
          set +e
          GITHUB_SHA="818eff5fd48fa2dc33c97e128ac79b37e2e3fd67" \
            bash bootstrap/v73-run-patched-v74.sh \
            >evidence/v74-execution-boundary/preserved-v73-child.stdout \
            2>evidence/v74-execution-boundary/preserved-v73-child.stderr
          CHILD_RC=$?
          set -e
          printf '%s\n' "$CHILD_RC" > evidence/v74-execution-boundary/preserved-v73-child.exit-code.txt
          if [ "$CHILD_RC" -ne 0 ]; then
            echo "V74_PRESERVED_V73_FIRST_FALSE rc=${CHILD_RC}" >&2
            tail -n 620 evidence/v74-execution-boundary/preserved-v73-child.stderr >&2 || true
            exit "$CHILD_RC"
          fi

      - name: Freeze V74 PRE-RESULT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-worker-module-v74
          path: |
            fetched-v74
            artifacts-v74
            bootstrap
            evidence
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
