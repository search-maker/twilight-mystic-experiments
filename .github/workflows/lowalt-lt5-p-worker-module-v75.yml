name: LowAlt LT5 P Worker Module V71 Execution Receipt Boundary V75

on:
  push:
    branches:
      - review/lowalt-lt5-p-worker-module-v75-20260919
    paths:
      - .github/workflows/lowalt-lt5-p-worker-module-v75.yml

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  v71-execution-receipt-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Repair only V72 V71-boundary execution-marker source-echo representation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p fetched-v75 artifacts-v75 bootstrap evidence/v75-v71-execution-boundary

          api_get() {
            local url="$1" out="$2"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$url" -o "$out"
          }

          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/issues/comments/5747650082" fetched-v75/coordinator-v75.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/issues/comments/5747546107" fetched-v75/v74-checkpoint.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/issues/comments/5746960040" fetched-v75/v72-checkpoint.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/issues/comments/5746628934" fetched-v75/v71-checkpoint.json

          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/lowalt-lt5-p-worker-module-v74.yml?ref=23ffa8a4be3b8446bd3680d56318509d84fc3fa1" fetched-v75/v74-workflow.json
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/search-maker/twilight-mystic-experiments/23ffa8a4be3b8446bd3680d56318509d84fc3fa1/.github/workflows/lowalt-lt5-p-worker-module-v74.yml" \
            -o fetched-v75/v74-workflow-raw.yml
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/runs/35488358144" fetched-v75/v74-run.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/jobs/106018745337" fetched-v75/v74-job.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/10598088600" fetched-v75/v74-artifact.json
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/jobs/106018745337/logs" \
            -o fetched-v75/v74-job.log
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/10598088600/zip" \
            -o artifacts-v75/v74.zip

          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/lowalt-lt5-p-worker-module-v72.yml?ref=a2babd4e981ae5f9433c57a318ed42b315db2edf" fetched-v75/v72-workflow.json
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/search-maker/twilight-mystic-experiments/a2babd4e981ae5f9433c57a318ed42b315db2edf/.github/workflows/lowalt-lt5-p-worker-module-v72.yml" \
            -o fetched-v75/v72-workflow-raw.yml
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/runs/35483228093" fetched-v75/v72-run.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/jobs/106004690300" fetched-v75/v72-job.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/10597380085" fetched-v75/v72-artifact.json
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/jobs/106004690300/logs" \
            -o fetched-v75/v72-job.log
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/10597380085/zip" \
            -o artifacts-v75/v72.zip

          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/lowalt-lt5-p-worker-module-v71.yml?ref=304af652dcd01bd8230d979aca8a0c791eb2f18d" fetched-v75/v71-workflow.json
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/search-maker/twilight-mystic-experiments/304af652dcd01bd8230d979aca8a0c791eb2f18d/.github/workflows/lowalt-lt5-p-worker-module-v71.yml" \
            -o fetched-v75/v71-workflow-raw.yml
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/runs/35480751142" fetched-v75/v71-run.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/jobs/105997984963" fetched-v75/v71-job.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/10596111685" fetched-v75/v71-artifact.json
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/jobs/105997984963/logs" \
            -o fetched-v75/v71-job.log
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/10596111685/zip" \
            -o artifacts-v75/v71.zip

          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/branches/main" fetched-v75/main.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/compare/6cd7c075766fe0c86bc7561ec205a3f9120fd1fb...${GITHUB_SHA}" fetched-v75/main-to-v75.json

          python3 - <<'PY_V75'
          import base64, difflib, hashlib, json, zipfile
          from pathlib import Path

          OUT=Path('evidence/v75-v71-execution-boundary'); OUT.mkdir(parents=True,exist_ok=True)
          MAIN='6cd7c075766fe0c86bc7561ec205a3f9120fd1fb'
          COORD=5747650082
          CP74=5747546107; CP72=5746960040; CP71=5746628934
          V74_HEAD='23ffa8a4be3b8446bd3680d56318509d84fc3fa1'; V74_BLOB='451277b47670abd25054ef4a8f29e0680bd14004'
          V74_RUN=35488358144; V74_JOB=106018745337; V74_ART=10598088600
          V74_SHA='697dcaed7aec9db19aad387f1bc6bbe5f836c1fcf73051d96f813147acb35ec0'; V74_SIZE=48051631
          V72_HEAD='a2babd4e981ae5f9433c57a318ed42b315db2edf'; V72_BLOB='182834d32f01e7d04839beb2196c9dfb7541f920'
          V72_RUN=35483228093; V72_JOB=106004690300; V72_ART=10597380085
          V72_SHA='c7f78e9476ef7592a607ea3dc5736893da87286dd0c82f028eebd74a7ce81723'; V72_SIZE=23779457
          V71_HEAD='304af652dcd01bd8230d979aca8a0c791eb2f18d'; V71_BLOB='ef860365834de63248a6c1f1c70bd77449477900'
          V71_RUN=35480751142; V71_JOB=105997984963; V71_ART=10596111685
          V71_SHA='5fdd2bfdcd5d8eb89abe7f9ff822e9d6a896d0437826f348b8e4d18f4aad7a66'; V71_SIZE=1165323
          CORR_TABLE='9d1f9817c71f9873052b1e0735de3285588d18a2789ee22b1addca9336078d3f'
          FIRST_FALSE='V71_BIND_FAIL coordinator literal '+CORR_TABLE
          MARKER='SUCCESSOR_REPLACEMENT_REPRESENTATION_GATE_PASS'
          EXEC_MEMBER='evidence/v71-successor-replacement-representation/'+MARKER
          OLD_CASE='No V73 absent later direct Coordinator transition'
          NEW_CASE='no V73 absent later direct Coordinator transition'
          V72_EXTRACTED_SHA='0bc51fffa202a7116c93dba5561734b2941114c8a5219208471cb1dd9c5457a5'
          V73_PATCHED_V72_SHA='66f7202b8871dca469119462dfcc26fa6f70739dc7fa9c3fa22f8dcb40628658'
          V73_CASE_DIFF_SHA='6beafa30dfebabfdf3d8fcd22140f27a7a9d4514f7f70bd6bc0d8490afc2b7a5'
          OLD_BOUNDARY="if first_false not in log or 'SUCCESSOR_REPLACEMENT_REPRESENTATION_GATE_PASS' in log: raise SystemExit('V72_BIND_FAIL V71 first-false boundary')"
          NEW_BOUNDARY="if first_false not in log or zipfile.ZipFile('artifacts-v72/v71.zip').namelist().count('evidence/v71-successor-replacement-representation/SUCCESSOR_REPLACEMENT_REPRESENTATION_GATE_PASS')!=0: raise SystemExit('V72_BIND_FAIL V71 first-false boundary')"

          def H(b): return hashlib.sha256(b).hexdigest()
          def G(b): return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          def decode_contents(path, blob):
              obj=json.loads(Path(path).read_text())
              if obj.get('sha')!=blob: raise SystemExit('V75_BIND_FAIL workflow blob '+path)
              data=base64.b64decode(obj['content'])
              if G(data)!=blob: raise SystemExit('V75_BIND_FAIL recomputed workflow blob '+path)
              return data
          def comment(path,cid):
              obj=json.loads(Path(path).read_text())
              if obj.get('id')!=cid or obj.get('user',{}).get('login')!='search-maker': raise SystemExit('V75_BIND_FAIL comment '+str(cid))
              return obj.get('body','')
          def extract_run(src):
              lines=src.splitlines(keepends=True); marker=b'        run: |\n'
              if marker not in lines: raise SystemExit('V75_BIND_FAIL run marker')
              start=lines.index(marker)+1; out=[]
              for line in lines[start:]:
                  if line.strip() and not line.startswith(b'          '): break
                  out.append(line[10:] if line.startswith(b'          ') else line)
              return b''.join(out)
          def bind_run_job_art(prefix,run_id,job_id,art_id,head,sha,size):
              run=json.loads(Path(f'fetched-v75/{prefix}-run.json').read_text())
              job=json.loads(Path(f'fetched-v75/{prefix}-job.json').read_text())
              art=json.loads(Path(f'fetched-v75/{prefix}-artifact.json').read_text())
              if run.get('id')!=run_id or run.get('run_attempt')!=1 or run.get('conclusion')!='failure' or run.get('head_sha')!=head:
                  raise SystemExit('V75_BIND_FAIL run '+prefix)
              if job.get('id')!=job_id or job.get('conclusion')!='failure': raise SystemExit('V75_BIND_FAIL job '+prefix)
              if art.get('id')!=art_id or art.get('digest')!='sha256:'+sha or art.get('size_in_bytes')!=size or art.get('expired'):
                  raise SystemExit('V75_BIND_FAIL artifact metadata '+prefix)
              z=Path(f'artifacts-v75/{prefix}.zip').read_bytes()
              if len(z)!=size or H(z)!=sha: raise SystemExit('V75_BIND_FAIL artifact transport '+prefix)
              return z

          cb=comment('fetched-v75/coordinator-v75.json',COORD)
          for x in [
              'Exactly ONE fresh LowAlt PRE-RESULT V75 identity is authorized',
              "V75 may repair ONLY V72's V71-boundary execution-marker/log-source-echo defect",
              EXEC_MEMBER,
              'No V76 absent later direct Coordinator transition',
          ]:
              if cb.count(x)!=1: raise SystemExit('V75_BIND_FAIL current authority cardinality '+x)

          cp74=comment('fetched-v75/v74-checkpoint.json',CP74)
          cp72=comment('fetched-v75/v72-checkpoint.json',CP72)
          cp71=comment('fetched-v75/v71-checkpoint.json',CP71)
          for x in ['V72_FIRST_FALSE_EXECUTION_BOUNDARY_GATE_PASS','AUTHORITY_MARKER_REPRESENTATION_GATE_PASS','V72_BIND_FAIL V71 first-false boundary',V73_PATCHED_V72_SHA,V73_CASE_DIFF_SHA]:
              if cp74.count(x)<1: raise SystemExit('V75_BIND_FAIL V74 checkpoint evidence '+x)
          if 'V72_BIND_FAIL direct authority literal No V73 absent later direct Coordinator transition' not in cp72:
              raise SystemExit('V75_BIND_FAIL V72 checkpoint first false')
          if FIRST_FALSE not in cp71: raise SystemExit('V75_BIND_FAIL V71 checkpoint first false')

          v74=decode_contents('fetched-v75/v74-workflow.json',V74_BLOB)
          if v74!=Path('fetched-v75/v74-workflow-raw.yml').read_bytes(): raise SystemExit('V75_BIND_FAIL V74 workflow representations')
          z74=bind_run_job_art('v74',V74_RUN,V74_JOB,V74_ART,V74_HEAD,V74_SHA,V74_SIZE)
          log74b=Path('fetched-v75/v74-job.log').read_bytes(); log74=log74b.decode(errors='replace')
          if 'V72_FIRST_FALSE_EXECUTION_BOUNDARY_GATE_PASS' not in log74 or 'V74_PRESERVED_V73_FIRST_FALSE' not in log74:
              raise SystemExit('V75_BIND_FAIL V74 log receipts')
          with zipfile.ZipFile('artifacts-v75/v74.zip','r') as zf:
              names74=zf.namelist()
              for p in ['evidence/v74-execution-boundary/V72_FIRST_FALSE_EXECUTION_BOUNDARY_GATE_PASS','evidence/v73-authority-marker/AUTHORITY_MARKER_REPRESENTATION_GATE_PASS']:
                  if names74.count(p)!=1: raise SystemExit('V75_BIND_FAIL V74 accepted receipt '+p)

          v72=decode_contents('fetched-v75/v72-workflow.json',V72_BLOB)
          if v72!=Path('fetched-v75/v72-workflow-raw.yml').read_bytes(): raise SystemExit('V75_BIND_FAIL V72 workflow representations')
          z72=bind_run_job_art('v72',V72_RUN,V72_JOB,V72_ART,V72_HEAD,V72_SHA,V72_SIZE)
          log72b=Path('fetched-v75/v72-job.log').read_bytes(); log72=log72b.decode(errors='replace')
          if 'V72_BIND_FAIL direct authority literal No V73 absent later direct Coordinator transition' not in log72:
              raise SystemExit('V75_BIND_FAIL V72 accepted first false')

          v71=decode_contents('fetched-v75/v71-workflow.json',V71_BLOB)
          if v71!=Path('fetched-v75/v71-workflow-raw.yml').read_bytes(): raise SystemExit('V75_BIND_FAIL V71 workflow representations')
          z71=bind_run_job_art('v71',V71_RUN,V71_JOB,V71_ART,V71_HEAD,V71_SHA,V71_SIZE)
          log71b=Path('fetched-v75/v71-job.log').read_bytes(); log71=log71b.decode(errors='replace')
          if log71.count(FIRST_FALSE)!=1: raise SystemExit('V75_BOUNDARY_FAIL V71 first-false cardinality='+str(log71.count(FIRST_FALSE)))

          r71=extract_run(v71); t71=r71.decode()
          print_needle="print('"+MARKER+"')"
          write_needle="Path(OUT/'"+MARKER+"').write_text("
          test_needle='test -f '+EXEC_MEMBER
          source_counts={
              'python_print_marker':t71.count(print_needle),
              'python_write_marker_receipt':t71.count(write_needle),
              'shell_test_marker_receipt':t71.count(test_needle),
          }
          if source_counts!={'python_print_marker':1,'python_write_marker_receipt':1,'shell_test_marker_receipt':1}:
              raise SystemExit('V75_BOUNDARY_FAIL nonunique source-defined execution receipt '+repr(source_counts))
          write_lines=[i+1 for i,l in enumerate(t71.splitlines()) if write_needle in l]
          print_lines=[i+1 for i,l in enumerate(t71.splitlines()) if print_needle in l]
          test_lines=[i+1 for i,l in enumerate(t71.splitlines()) if test_needle in l]
          if len(write_lines)!=1 or len(print_lines)!=1 or len(test_lines)!=1 or not (write_lines[0] < print_lines[0] < test_lines[0]):
              raise SystemExit('V75_BOUNDARY_FAIL source execution marker ordering')

          with zipfile.ZipFile('artifacts-v75/v71.zip','r') as zf:
              names71=zf.namelist(); exec_member_count=names71.count(EXEC_MEMBER)
          marker_log_lines=[l for l in log71.splitlines() if MARKER in l]
          exact_emitted_marker_lines=[l for l in marker_log_lines if l.endswith(' '+MARKER)]
          source_echo_ansi_lines=[l for l in marker_log_lines if '\x1b[36;1m' in l and '\x1b[0m' in l]
          if exec_member_count!=0: raise SystemExit('V75_BOUNDARY_FAIL V71 execution receipt exists count='+str(exec_member_count))
          if len(exact_emitted_marker_lines)!=0: raise SystemExit('V75_BOUNDARY_FAIL V71 emitted execution marker exists count='+str(len(exact_emitted_marker_lines)))
          if len(marker_log_lines)!=3: raise SystemExit('V75_BOUNDARY_FAIL V71 marker log count='+str(len(marker_log_lines)))

          table={
              'schema':1,'marker':MARKER,'execution_receipt_member':EXEC_MEMBER,
              'v71_source_sha256':H(v71),'v71_extracted_run_sha256':H(r71),'source_counts':source_counts,
              'source_write_line':write_lines[0],'source_print_line':print_lines[0],'source_post_python_test_line':test_lines[0],
              'v71_job_log_sha256':H(log71b),'v71_job_log_marker_occurrence_count':len(marker_log_lines),
              'v71_job_log_exact_emitted_marker_count':len(exact_emitted_marker_lines),
              'v71_job_log_ansi_source_echo_marker_count':len(source_echo_ansi_lines),
              'v71_artifact_sha256':H(z71),'v71_artifact_execution_receipt_member_count':exec_member_count,
              'v71_first_false':FIRST_FALSE,'v71_first_false_count':log71.count(FIRST_FALSE),
              'classification':'SOURCE_ECHO_PRESENT_EXECUTION_RECEIPT_ABSENT',
          }
          Path(OUT/'source-echo-vs-execution-receipt.json').write_text(json.dumps(table,indent=2,sort_keys=True)+'\n')
          Path(OUT/'V71_FIRST_FALSE_EXECUTION_BOUNDARY_GATE_PASS').write_text('PASS: exact V71 first-false is unique; source-defined successor-replacement execution receipt is absent while source echo is present\n')

          main=json.loads(Path('fetched-v75/main.json').read_text())
          if main.get('commit',{}).get('sha')!=MAIN: raise SystemExit('V75_BIND_FAIL main drift')
          comp=json.loads(Path('fetched-v75/main-to-v75.json').read_text()); files=comp.get('files') or []
          if comp.get('base_commit',{}).get('sha')!=MAIN or len(files)!=1 or files[0].get('filename')!='.github/workflows/lowalt-lt5-p-worker-module-v75.yml' or files[0].get('status')!='added':
              raise SystemExit('V75_BIND_FAIL branch scope')

          r72=extract_run(v72); text=r72.decode()
          if H(r72)!=V72_EXTRACTED_SHA: raise SystemExit('V75_BIND_FAIL V72 extracted run identity')
          if text.count(OLD_CASE)!=1 or text.count(NEW_CASE)!=0: raise SystemExit('V75_PRESERVE_FAIL V73 case precondition')
          case_patched=text.replace(OLD_CASE,NEW_CASE,1)
          case_diff=''.join(difflib.unified_diff(text.splitlines(True),case_patched.splitlines(True),fromfile='v72-run-original.sh',tofile='v72-run-patched-v73.sh',n=3))
          if H(case_patched.encode())!=V73_PATCHED_V72_SHA or H(case_diff.encode())!=V73_CASE_DIFF_SHA:
              raise SystemExit('V75_PRESERVE_FAIL accepted V73 patch identity drift')

          if case_patched.count(OLD_BOUNDARY)!=1 or case_patched.count(NEW_BOUNDARY)!=0:
              raise SystemExit('V75_PATCH_FAIL V71 boundary precondition old='+str(case_patched.count(OLD_BOUNDARY))+' new='+str(case_patched.count(NEW_BOUNDARY)))
          old_line=[(i+1,l) for i,l in enumerate(case_patched.splitlines()) if OLD_BOUNDARY in l]
          final=case_patched.replace(OLD_BOUNDARY,NEW_BOUNDARY,1)
          new_line=[(i+1,l) for i,l in enumerate(final.splitlines()) if NEW_BOUNDARY in l]
          if len(old_line)!=1 or len(new_line)!=1 or old_line[0][0]!=new_line[0][0]: raise SystemExit('V75_PATCH_FAIL V71 boundary context ambiguity')
          diff=''.join(difflib.unified_diff(case_patched.splitlines(True),final.splitlines(True),fromfile='v72-run-preserved-v73.sh',tofile='v72-run-patched-v75.sh',n=3))
          payload=[x for x in diff.splitlines() if (x.startswith('+') and not x.startswith('+++')) or (x.startswith('-') and not x.startswith('---'))]
          expected=['-'+old_line[0][1], '+'+new_line[0][1]]
          if payload!=expected: raise SystemExit('V75_PATCH_FAIL unexpected diff payload '+repr(payload))
          if old_line[0][1].replace(OLD_BOUNDARY,NEW_BOUNDARY,1)!=new_line[0][1]: raise SystemExit('V75_PATCH_FAIL line changed beyond boundary predicate')

          Path('bootstrap/v72-run-patched-v75.sh').write_text(final)
          Path(OUT/'v74-to-v75-v71-boundary-harness-only.diff').write_text(diff)
          receipt={
              'schema':1,'status':'V71_FIRST_FALSE_EXECUTION_BOUNDARY_GATE_PASS','authority_comment':COORD,
              'v74_checkpoint':CP74,'v72_checkpoint':CP72,'v71_checkpoint':CP71,
              'v74_workflow_blob':V74_BLOB,'v74_head':V74_HEAD,'v74_run':V74_RUN,'v74_job':V74_JOB,'v74_artifact':V74_ART,'v74_artifact_sha256':V74_SHA,'v74_artifact_size':V74_SIZE,
              'v72_workflow_blob':V72_BLOB,'v72_head':V72_HEAD,'v72_run':V72_RUN,'v72_job':V72_JOB,'v72_artifact':V72_ART,'v72_artifact_sha256':V72_SHA,'v72_artifact_size':V72_SIZE,
              'v71_workflow_blob':V71_BLOB,'v71_head':V71_HEAD,'v71_run':V71_RUN,'v71_job':V71_JOB,'v71_artifact':V71_ART,'v71_artifact_sha256':V71_SHA,'v71_artifact_size':V71_SIZE,
              'source_echo_vs_execution_receipt':table,
              'preserved_v73_case_patch_sha256':V73_CASE_DIFF_SHA,'preserved_v73_patched_v72_run_sha256':V73_PATCHED_V72_SHA,
              'old_boundary_predicate':OLD_BOUNDARY,'new_boundary_predicate':NEW_BOUNDARY,
              'v75_patched_v72_run_sha256':H(final.encode()),'diff_sha256':H(diff.encode()),'diff_payload':payload,
              'broad_log_normalization':False,'case_folding':False,'regex_relaxation':False,'source_suppression':False,
              'unrelated_guard_weakening':False,'scientific_script_mutation':False,'source_defined_transform_mutation':False,
              'historical_checkpoint_mutation':False,'desired_outcome_selection':False,'b_selected':False,'b_resolved':False,
          }
          Path(OUT/'receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print('V71_FIRST_FALSE_EXECUTION_BOUNDARY_GATE_PASS')
          print('V71_ARTIFACT_EXECUTION_RECEIPT_MEMBER_COUNT='+str(exec_member_count))
          print('V71_LOG_SOURCE_MARKER_OCCURRENCES='+str(len(marker_log_lines)))
          print('V71_LOG_EXACT_EMITTED_MARKER_COUNT='+str(len(exact_emitted_marker_lines)))
          print('V75_PATCHED_V72_RUN_SHA256='+H(final.encode()))
          print('V74_TO_V75_DIFF_SHA256='+H(diff.encode()))
          PY_V75

          test -f evidence/v75-v71-execution-boundary/V71_FIRST_FALSE_EXECUTION_BOUNDARY_GATE_PASS
          bash -n bootstrap/v72-run-patched-v75.sh
          set +e
          GITHUB_SHA="a2babd4e981ae5f9433c57a318ed42b315db2edf" \
            bash bootstrap/v72-run-patched-v75.sh \
            >evidence/v75-v71-execution-boundary/preserved-v72-child.stdout \
            2>evidence/v75-v71-execution-boundary/preserved-v72-child.stderr
          CHILD_RC=$?
          set -e
          printf '%s\n' "$CHILD_RC" > evidence/v75-v71-execution-boundary/preserved-v72-child.exit-code.txt
          if [ "$CHILD_RC" -ne 0 ]; then
            echo "V75_PRESERVED_V72_FIRST_FALSE rc=${CHILD_RC}" >&2
            tail -n 760 evidence/v75-v71-execution-boundary/preserved-v72-child.stderr >&2 || true
            exit "$CHILD_RC"
          fi

