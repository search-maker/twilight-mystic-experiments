name: LowAlt LT5 P Worker Module V75 Authority Value Locus V76

on:
  push:
    branches:
      - review/lowalt-lt5-p-worker-module-v76-20260920
    paths:
      - .github/workflows/lowalt-lt5-p-worker-module-v76.yml

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  v75-authority-value-locus:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Repair only V75 current-Coordinator inherited-value cardinality locus
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p fetched-v76 artifacts-v76 bootstrap-v76 evidence/v76-authority-value-locus

          api_get() {
            local url="$1" out="$2"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$url" -o "$out"
          }

          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/issues/comments/5747693835" fetched-v76/coordinator-v76.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/issues/comments/5747650082" fetched-v76/coordinator-v75.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/issues/comments/5747689437" fetched-v76/v75-checkpoint.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/issues/comments/5747546107" fetched-v76/v74-checkpoint.json

          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/lowalt-lt5-p-worker-module-v75.yml?ref=7b4de53ba2c64a6bbcb895b707b138300827d385" fetched-v76/v75-workflow.json
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/search-maker/twilight-mystic-experiments/7b4de53ba2c64a6bbcb895b707b138300827d385/.github/workflows/lowalt-lt5-p-worker-module-v75.yml" \
            -o fetched-v76/v75-workflow-raw.yml
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/runs/35489789462" fetched-v76/v75-run.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/jobs/106022643478" fetched-v76/v75-job.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/10598915970" fetched-v76/v75-artifact.json
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/jobs/106022643478/logs" \
            -o fetched-v76/v75-job.log
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/10598915970/zip" \
            -o artifacts-v76/v75.zip

          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/lowalt-lt5-p-worker-module-v71.yml?ref=304af652dcd01bd8230d979aca8a0c791eb2f18d" fetched-v76/v71-workflow.json
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/search-maker/twilight-mystic-experiments/304af652dcd01bd8230d979aca8a0c791eb2f18d/.github/workflows/lowalt-lt5-p-worker-module-v71.yml" \
            -o fetched-v76/v71-workflow-raw.yml

          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/10598088600" fetched-v76/v74-artifact.json
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/10598088600/zip" \
            -o artifacts-v76/v74.zip

          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/branches/main" fetched-v76/main.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/compare/6cd7c075766fe0c86bc7561ec205a3f9120fd1fb...${GITHUB_SHA}" fetched-v76/main-to-v76.json

          python3 - <<'PY_V76'
          import base64, difflib, hashlib, io, json, zipfile
          from pathlib import Path

          OUT=Path('evidence/v76-authority-value-locus'); OUT.mkdir(parents=True,exist_ok=True)
          MAIN='6cd7c075766fe0c86bc7561ec205a3f9120fd1fb'
          COORD76=5747693835; COORD75=5747650082; CP75=5747689437; CP74=5747546107
          V75_HEAD='7b4de53ba2c64a6bbcb895b707b138300827d385'; V75_TREE='3d06de5201e363975b0dec669f88c62013b353b9'
          V75_BLOB='16c617b330e056fa8b1ac4b6e355ab82189257f0'; V75_RUN=35489789462; V75_JOB=106022643478; V75_ART=10598915970
          V75_SHA='909a9316d65ec064cb27243c90473c2845f52bc71cc0508bb65e13b7a08a683b'; V75_SIZE=73420282
          V71_BLOB='ef860365834de63248a6c1f1c70bd77449477900'
          V74_ART=10598088600; V74_SHA='697dcaed7aec9db19aad387f1bc6bbe5f836c1fcf73051d96f813147acb35ec0'; V74_SIZE=48051631
          MARKER='SUCCESSOR_REPLACEMENT_REPRESENTATION_GATE_PASS'
          EXEC_MEMBER='evidence/v71-successor-replacement-representation/'+MARKER
          FIRST_FALSE='V75_BIND_FAIL current authority cardinality '+EXEC_MEMBER
          OLD_LINE='    EXEC_MEMBER,\n'

          def H(b): return hashlib.sha256(b).hexdigest()
          def G(b): return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          def comment(path,cid):
              obj=json.loads(Path(path).read_text())
              if obj.get('id')!=cid or obj.get('user',{}).get('login')!='search-maker': raise SystemExit('V76_BIND_FAIL comment '+str(cid))
              return obj.get('body','')
          def decode_contents(path, blob):
              obj=json.loads(Path(path).read_text())
              if obj.get('sha')!=blob: raise SystemExit('V76_BIND_FAIL workflow blob '+path)
              data=base64.b64decode(obj['content'])
              if G(data)!=blob: raise SystemExit('V76_BIND_FAIL recomputed blob '+path)
              return data
          def extract_run(src):
              lines=src.splitlines(keepends=True); marker=b'        run: |\n'
              if marker not in lines: raise SystemExit('V76_BIND_FAIL run marker')
              start=lines.index(marker)+1; out=[]
              for line in lines[start:]:
                  if line.strip() and not line.startswith(b'          '): break
                  out.append(line[10:] if line.startswith(b'          ') else line)
              return b''.join(out)

          current=comment('fetched-v76/coordinator-v76.json',COORD76)
          scope_markers=[
              'Exactly ONE fresh LowAlt PRE-RESULT V76 identity',
              'V76 may repair ONLY this V75 current-Coordinator authority/value-locus cardinality defect',
              'V75_AUTHORITY_VALUE_LOCUS_GATE_PASS',
              'No V77 absent later direct Coordinator transition',
          ]
          for x in scope_markers:
              if current.count(x)!=1: raise SystemExit('V76_BIND_FAIL current scope cardinality '+x)

          inherited=comment('fetched-v76/coordinator-v75.json',COORD75)
          inherited_scope=[
              'Exactly ONE fresh LowAlt PRE-RESULT V75 identity is authorized',
              "V75 may repair ONLY V72's V71-boundary execution-marker/log-source-echo defect",
              'No V76 absent later direct Coordinator transition',
          ]
          for x in inherited_scope:
              if inherited.count(x)!=1: raise SystemExit('V76_BIND_FAIL inherited scope cardinality '+x)
          inherited_path_occurrences=inherited.count(EXEC_MEMBER)
          if inherited_path_occurrences < 1: raise SystemExit('V76_BIND_FAIL inherited path missing')

          cp75=comment('fetched-v76/v75-checkpoint.json',CP75)
          cp74=comment('fetched-v76/v74-checkpoint.json',CP74)
          for x in [V75_HEAD,V75_TREE,V75_BLOB,str(V75_RUN),str(V75_JOB),str(V75_ART),V75_SHA,str(V75_SIZE),FIRST_FALSE]:
              if x not in cp75: raise SystemExit('V76_BIND_FAIL V75 checkpoint '+x)
          for x in ['V72_FIRST_FALSE_EXECUTION_BOUNDARY_GATE_PASS','AUTHORITY_MARKER_REPRESENTATION_GATE_PASS','V72_BIND_FAIL V71 first-false boundary',EXEC_MEMBER]:
              if x not in cp74: raise SystemExit('V76_BIND_FAIL V74 accepted evidence '+x)

          v75=decode_contents('fetched-v76/v75-workflow.json',V75_BLOB)
          if v75!=Path('fetched-v76/v75-workflow-raw.yml').read_bytes(): raise SystemExit('V76_BIND_FAIL V75 workflow representations')
          run=json.loads(Path('fetched-v76/v75-run.json').read_text()); job=json.loads(Path('fetched-v76/v75-job.json').read_text()); art=json.loads(Path('fetched-v76/v75-artifact.json').read_text())
          if run.get('id')!=V75_RUN or run.get('run_attempt')!=1 or run.get('conclusion')!='failure' or run.get('head_sha')!=V75_HEAD or run.get('head_commit',{}).get('tree_id')!=V75_TREE:
              raise SystemExit('V76_BIND_FAIL V75 run')
          if job.get('id')!=V75_JOB or job.get('conclusion')!='failure': raise SystemExit('V76_BIND_FAIL V75 job')
          if art.get('id')!=V75_ART or art.get('digest')!='sha256:'+V75_SHA or art.get('size_in_bytes')!=V75_SIZE or art.get('expired'):
              raise SystemExit('V76_BIND_FAIL V75 artifact metadata')
          z75=Path('artifacts-v76/v75.zip').read_bytes()
          if len(z75)!=V75_SIZE or H(z75)!=V75_SHA: raise SystemExit('V76_BIND_FAIL V75 artifact transport')
          log75b=Path('fetched-v76/v75-job.log').read_bytes(); log75=log75b.decode(errors='replace')
          if log75.count(FIRST_FALSE)!=1: raise SystemExit('V76_BIND_FAIL V75 first false cardinality='+str(log75.count(FIRST_FALSE)))

          v71=decode_contents('fetched-v76/v71-workflow.json',V71_BLOB)
          if v71!=Path('fetched-v76/v71-workflow-raw.yml').read_bytes(): raise SystemExit('V76_BIND_FAIL V71 workflow representations')
          r71=extract_run(v71); t71=r71.decode()
          source_owner_counts={
              'marker_literal':t71.count("MARKER='"+MARKER+"'") if "MARKER='"+MARKER+"'" in t71 else 0,
              'exact_receipt_path':t71.count(EXEC_MEMBER),
              'marker_write':t71.count("Path(OUT/'"+MARKER+"').write_text("),
              'marker_print':t71.count("print('"+MARKER+"')"),
          }
          # V71 defines OUT as the immutable directory and writes/prints the exact marker once; the shell post-test owns the full path.
          if t71.count("OUT=Path('evidence/v71-successor-replacement-representation')")!=1: raise SystemExit('V76_LOCUS_FAIL V71 OUT ownership')
          if source_owner_counts['exact_receipt_path']!=1 or source_owner_counts['marker_write']!=1 or source_owner_counts['marker_print']!=1:
              raise SystemExit('V76_LOCUS_FAIL V71 receipt ownership '+repr(source_owner_counts))

          a74=json.loads(Path('fetched-v76/v74-artifact.json').read_text())
          if a74.get('id')!=V74_ART or a74.get('digest')!='sha256:'+V74_SHA or a74.get('size_in_bytes')!=V74_SIZE or a74.get('expired'):
              raise SystemExit('V76_BIND_FAIL V74 artifact metadata')
          z74=Path('artifacts-v76/v74.zip').read_bytes()
          if len(z74)!=V74_SIZE or H(z74)!=V74_SHA: raise SystemExit('V76_BIND_FAIL V74 artifact transport')
          with zipfile.ZipFile(io.BytesIO(z74)) as zz:
              names74=zz.namelist()
              accepted_v74_receipts=[
                  'evidence/v74-execution-boundary/V72_FIRST_FALSE_EXECUTION_BOUNDARY_GATE_PASS',
                  'evidence/v73-authority-marker/AUTHORITY_MARKER_REPRESENTATION_GATE_PASS',
              ]
              for p in accepted_v74_receipts:
                  if names74.count(p)!=1: raise SystemExit('V76_BIND_FAIL V74 receipt '+p)

          authority_locus={
              'schema':1,
              'current_scope_permission_owner_comment':COORD76,
              'inherited_v75_scope_owner_comment':COORD75,
              'immutable_value_identity_owner':'V71 source-defined receipt semantics',
              'immutable_value_identity_workflow_blob':V71_BLOB,
              'receipt_path':EXEC_MEMBER,
              'v75_coordinator_receipt_path_occurrences':inherited_path_occurrences,
              'v71_source_owner_counts':source_owner_counts,
              'accepted_v74_artifact_sha256':V74_SHA,
              'classification':'CURRENT_SCOPE_SEPARATE_FROM_INHERITED_IMMUTABLE_RECEIPT_IDENTITY',
          }
          Path(OUT/'authority-locus.json').write_text(json.dumps(authority_locus,indent=2,sort_keys=True)+'\n')

          main=json.loads(Path('fetched-v76/main.json').read_text())
          if main.get('commit',{}).get('sha')!=MAIN: raise SystemExit('V76_BIND_FAIL main drift')
          comp=json.loads(Path('fetched-v76/main-to-v76.json').read_text()); files=comp.get('files') or []
          if comp.get('base_commit',{}).get('sha')!=MAIN or len(files)!=1 or files[0].get('filename')!='.github/workflows/lowalt-lt5-p-worker-module-v76.yml' or files[0].get('status')!='added':
              raise SystemExit('V76_BIND_FAIL branch scope')

          r75=extract_run(v75); text=r75.decode()
          if text.count(OLD_LINE)!=1: raise SystemExit('V76_PATCH_FAIL exact inherited-value list member cardinality='+str(text.count(OLD_LINE)))
          final=text.replace(OLD_LINE,'',1)
          diff=''.join(difflib.unified_diff(text.splitlines(True),final.splitlines(True),fromfile='v75-run-original.sh',tofile='v75-run-patched-v76.sh',n=3))
          payload=[x for x in diff.splitlines() if (x.startswith('+') and not x.startswith('+++')) or (x.startswith('-') and not x.startswith('---'))]
          expected=['-    EXEC_MEMBER,']
          if payload!=expected: raise SystemExit('V76_PATCH_FAIL unexpected diff payload '+repr(payload))
          for forbidden in ['CORR_TABLE=','CORR_MANIFEST=','OLD_BOUNDARY=','NEW_BOUNDARY=']:
              if text.count(forbidden)!=final.count(forbidden): raise SystemExit('V76_PATCH_FAIL unrelated semantic literal drift '+forbidden)

          Path('bootstrap-v76/v75-run-patched-v76.sh').write_text(final)
          Path(OUT/'v75-to-v76-harness-only.diff').write_text(diff)
          receipt={
              'schema':1,'status':'V75_AUTHORITY_VALUE_LOCUS_GATE_PASS','authority_comment':COORD76,
              'v75_checkpoint':CP75,'v75_head':V75_HEAD,'v75_tree':V75_TREE,'v75_workflow_blob':V75_BLOB,
              'v75_run':V75_RUN,'v75_job':V75_JOB,'v75_artifact':V75_ART,'v75_artifact_sha256':V75_SHA,'v75_artifact_size':V75_SIZE,
              'v75_first_false':FIRST_FALSE,'authority_locus':authority_locus,
              'original_v75_extracted_run_sha256':H(r75),'patched_v75_extracted_run_sha256':H(final.encode()),
              'diff_sha256':H(diff.encode()),'diff_payload':payload,
              'broad_authority_relaxation':False,'normalization':False,'case_folding':False,'regex_relaxation':False,
              'scientific_script_mutation':False,'source_defined_transport_mutation':False,'historical_checkpoint_mutation':False,
              'desired_outcome_selection':False,'b_selected':False,'b_resolved':False,
          }
          Path(OUT/'receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          Path(OUT/'V75_AUTHORITY_VALUE_LOCUS_GATE_PASS').write_text('PASS: current Coordinator scope/permission separated from immutable V71 receipt-path identity; only over-strong current-prose cardinality member removed\n')
          print('V75_AUTHORITY_VALUE_LOCUS_GATE_PASS')
          print('V75_COORDINATOR_RECEIPT_PATH_OCCURRENCES='+str(inherited_path_occurrences))
          print('V76_PATCHED_V75_RUN_SHA256='+H(final.encode()))
          print('V75_TO_V76_DIFF_SHA256='+H(diff.encode()))
          PY_V76

          test -f evidence/v76-authority-value-locus/V75_AUTHORITY_VALUE_LOCUS_GATE_PASS
          bash -n bootstrap-v76/v75-run-patched-v76.sh
          set +e
          GITHUB_SHA="7b4de53ba2c64a6bbcb895b707b138300827d385" \
            bash bootstrap-v76/v75-run-patched-v76.sh \
            >evidence/v76-authority-value-locus/preserved-v75-child.stdout \
            2>evidence/v76-authority-value-locus/preserved-v75-child.stderr
          CHILD_RC=$?
          set -e
          printf '%s\n' "$CHILD_RC" > evidence/v76-authority-value-locus/preserved-v75-child.exit-code.txt
          if [ "$CHILD_RC" -ne 0 ]; then
            echo "V76_PRESERVED_V75_FIRST_FALSE rc=${CHILD_RC}" >&2
            tail -n 1000 evidence/v76-authority-value-locus/preserved-v75-child.stderr >&2 || true
            exit "$CHILD_RC"
          fi

      - name: Freeze V76 PRE-RESULT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-worker-module-v76
          path: |
            fetched-*
            artifacts-*
            bootstrap*
            evidence
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
