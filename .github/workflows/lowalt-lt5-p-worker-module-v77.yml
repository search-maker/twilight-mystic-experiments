name: LowAlt LT5 P Worker Module V76 Scope Marker Representation V77

on:
  push:
    branches:
      - review/lowalt-lt5-p-worker-module-v77-20260920
    paths:
      - .github/workflows/lowalt-lt5-p-worker-module-v77.yml

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  v76-scope-marker-representation:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Repair only V76 current-scope marker case representation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p fetched-v77 artifacts-v77 bootstrap-v77 evidence/v77-scope-marker-representation

          api_get() {
            local url="$1" out="$2"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$url" -o "$out"
          }

          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/issues/comments/5747718496" fetched-v77/coordinator-v77.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/issues/comments/5747693835" fetched-v77/coordinator-v76.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/issues/comments/5747714128" fetched-v77/v76-checkpoint.json

          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/contents/.github/workflows/lowalt-lt5-p-worker-module-v76.yml?ref=82a3a5fd0085bd28bad715847629fd87cc3fa54d" fetched-v77/v76-workflow.json
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/search-maker/twilight-mystic-experiments/82a3a5fd0085bd28bad715847629fd87cc3fa54d/.github/workflows/lowalt-lt5-p-worker-module-v76.yml" \
            -o fetched-v77/v76-workflow-raw.yml
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/runs/35490096659" fetched-v77/v76-run.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/jobs/106023453174" fetched-v77/v76-job.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/10598871451" fetched-v77/v76-artifact.json
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/jobs/106023453174/logs" \
            -o fetched-v77/v76-job.log
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/10598871451/zip" \
            -o artifacts-v77/v76.zip

          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/branches/main" fetched-v77/main.json
          api_get "https://api.github.com/repos/search-maker/twilight-mystic-experiments/compare/6cd7c075766fe0c86bc7561ec205a3f9120fd1fb...${GITHUB_SHA}" fetched-v77/main-to-v77.json

          python3 - <<'PY_V77'
          import base64, difflib, hashlib, json
          from pathlib import Path

          OUT=Path('evidence/v77-scope-marker-representation'); OUT.mkdir(parents=True,exist_ok=True)
          MAIN='6cd7c075766fe0c86bc7561ec205a3f9120fd1fb'
          COORD77=5747718496; COORD76=5747693835; CP76=5747714128
          V76_HEAD='82a3a5fd0085bd28bad715847629fd87cc3fa54d'
          V76_TREE='a609f5aa9a9d61fc12b8e8028e3d5b4da7cf6a3b'
          V76_BLOB='d9212bef709c9d6764001d2d4e011e06863b4d78'
          V76_RUN=35490096659; V76_JOB=106023453174; V76_ART=10598871451
          V76_SHA='8d5f324448d99a376bcb7ba02a2a8c6fec7fb2ab70fdb8a72c1f470a65c6846e'; V76_SIZE=121728153
          FIRST_FALSE='V76_BIND_FAIL current scope cardinality Exactly ONE fresh LowAlt PRE-RESULT V76 identity'
          OLD='Exactly ONE fresh LowAlt PRE-RESULT V76 identity'
          NEW='exactly ONE fresh LowAlt PRE-RESULT V76 identity'

          def H(b): return hashlib.sha256(b).hexdigest()
          def G(b): return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          def comment(path,cid):
              obj=json.loads(Path(path).read_text())
              if obj.get('id')!=cid or obj.get('user',{}).get('login')!='search-maker': raise SystemExit('V77_BIND_FAIL comment '+str(cid))
              return obj.get('body','')
          def decode_contents(path,blob):
              obj=json.loads(Path(path).read_text())
              if obj.get('sha')!=blob: raise SystemExit('V77_BIND_FAIL workflow blob')
              data=base64.b64decode(obj['content'])
              if G(data)!=blob: raise SystemExit('V77_BIND_FAIL recomputed workflow blob')
              return data
          def extract_run(src):
              lines=src.splitlines(keepends=True); marker=b'        run: |\n'
              if marker not in lines: raise SystemExit('V77_BIND_FAIL run marker')
              start=lines.index(marker)+1; out=[]
              for line in lines[start:]:
                  if line.strip() and not line.startswith(b'          '): break
                  out.append(line[10:] if line.startswith(b'          ') else line)
              return b''.join(out)

          current=comment('fetched-v77/coordinator-v77.json',COORD77)
          for x in [
              'AUTHORIZED: exactly ONE fresh LowAlt PRE-RESULT V77 identity',
              'V77 may repair ONLY this V76 current-scope marker case/representation defect',
              'V76_SCOPE_MARKER_REPRESENTATION_GATE_PASS',
              'No V78 absent later direct Coordinator transition',
          ]:
              if current.count(x)!=1: raise SystemExit('V77_BIND_FAIL current authority cardinality '+x+' count='+str(current.count(x)))

          prior=comment('fetched-v77/coordinator-v76.json',COORD76)
          if prior.count('AUTHORIZED: exactly ONE fresh LowAlt PRE-RESULT V76 identity')!=1:
              raise SystemExit('V77_BIND_FAIL V76 exact source marker')
          cp=comment('fetched-v77/v76-checkpoint.json',CP76)
          for x in [V76_HEAD,V76_TREE,V76_BLOB,str(V76_RUN),str(V76_JOB),str(V76_ART),V76_SHA,str(V76_SIZE),FIRST_FALSE]:
              if x not in cp: raise SystemExit('V77_BIND_FAIL V76 checkpoint '+x)

          v76=decode_contents('fetched-v77/v76-workflow.json',V76_BLOB)
          if v76!=Path('fetched-v77/v76-workflow-raw.yml').read_bytes(): raise SystemExit('V77_BIND_FAIL workflow representations')
          run=json.loads(Path('fetched-v77/v76-run.json').read_text()); job=json.loads(Path('fetched-v77/v76-job.json').read_text()); art=json.loads(Path('fetched-v77/v76-artifact.json').read_text())
          if run.get('id')!=V76_RUN or run.get('run_attempt')!=1 or run.get('conclusion')!='failure' or run.get('head_sha')!=V76_HEAD or run.get('head_commit',{}).get('tree_id')!=V76_TREE:
              raise SystemExit('V77_BIND_FAIL V76 run')
          if job.get('id')!=V76_JOB or job.get('conclusion')!='failure': raise SystemExit('V77_BIND_FAIL V76 job')
          if art.get('id')!=V76_ART or art.get('digest')!='sha256:'+V76_SHA or art.get('size_in_bytes')!=V76_SIZE or art.get('expired'):
              raise SystemExit('V77_BIND_FAIL V76 artifact metadata')
          z=Path('artifacts-v77/v76.zip').read_bytes()
          if len(z)!=V76_SIZE or H(z)!=V76_SHA: raise SystemExit('V77_BIND_FAIL V76 artifact transport')
          logb=Path('fetched-v77/v76-job.log').read_bytes(); log=logb.decode(errors='replace')
          if log.count(FIRST_FALSE)!=1: raise SystemExit('V77_BIND_FAIL V76 first-false cardinality='+str(log.count(FIRST_FALSE)))

          main=json.loads(Path('fetched-v77/main.json').read_text())
          if main.get('commit',{}).get('sha')!=MAIN: raise SystemExit('V77_BIND_FAIL main drift')
          comp=json.loads(Path('fetched-v77/main-to-v77.json').read_text()); files=comp.get('files') or []
          if comp.get('base_commit',{}).get('sha')!=MAIN or len(files)!=1 or files[0].get('filename')!='.github/workflows/lowalt-lt5-p-worker-module-v77.yml' or files[0].get('status')!='added':
              raise SystemExit('V77_BIND_FAIL branch scope')

          r76=extract_run(v76); text=r76.decode()
          if text.count(OLD)!=1 or text.count(NEW)!=0:
              raise SystemExit('V77_PATCH_FAIL exact marker precondition old='+str(text.count(OLD))+' new='+str(text.count(NEW)))
          old_line=[(i+1,l) for i,l in enumerate(text.splitlines()) if OLD in l]
          final=text.replace(OLD,NEW,1)
          new_line=[(i+1,l) for i,l in enumerate(final.splitlines()) if NEW in l]
          if len(old_line)!=1 or len(new_line)!=1 or old_line[0][0]!=new_line[0][0]: raise SystemExit('V77_PATCH_FAIL context ambiguity')
          diff=''.join(difflib.unified_diff(text.splitlines(True),final.splitlines(True),fromfile='v76-run-original.sh',tofile='v76-run-patched-v77.sh',n=3))
          payload=[x for x in diff.splitlines() if (x.startswith('+') and not x.startswith('+++')) or (x.startswith('-') and not x.startswith('---'))]
          expected=['-'+old_line[0][1], '+'+new_line[0][1]]
          if payload!=expected: raise SystemExit('V77_PATCH_FAIL unexpected diff payload '+repr(payload))
          if old_line[0][1].replace(OLD,NEW,1)!=new_line[0][1]: raise SystemExit('V77_PATCH_FAIL extra line drift')

          Path('bootstrap-v77/v76-run-patched-v77.sh').write_text(final)
          Path(OUT/'v76-to-v77-harness-only.diff').write_text(diff)
          receipt={
              'schema':1,'status':'V76_SCOPE_MARKER_REPRESENTATION_GATE_PASS','authority_comment':COORD77,
              'v76_checkpoint':CP76,'v76_head':V76_HEAD,'v76_tree':V76_TREE,'v76_workflow_blob':V76_BLOB,
              'v76_run':V76_RUN,'v76_job':V76_JOB,'v76_artifact':V76_ART,'v76_artifact_sha256':V76_SHA,'v76_artifact_size':V76_SIZE,
              'v76_first_false':FIRST_FALSE,'old_marker':OLD,'new_marker':NEW,
              'original_v76_extracted_run_sha256':H(r76),'patched_v76_extracted_run_sha256':H(final.encode()),
              'diff_sha256':H(diff.encode()),'diff_payload':payload,
              'case_folding':False,'normalization':False,'punctuation_normalization':False,'regex_relaxation':False,
              'cardinality_weakening':False,'unrelated_scope_change':False,'scientific_script_mutation':False,
              'source_defined_transport_mutation':False,'historical_checkpoint_mutation':False,'desired_outcome_selection':False,
              'b_selected':False,'b_resolved':False,
          }
          Path(OUT/'receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          Path(OUT/'V76_SCOPE_MARKER_REPRESENTATION_GATE_PASS').write_text('PASS: changed only V76 current-scope marker initial E to exact lowercase source representation\n')
          print('V76_SCOPE_MARKER_REPRESENTATION_GATE_PASS')
          print('V77_PATCHED_V76_RUN_SHA256='+H(final.encode()))
          print('V76_TO_V77_DIFF_SHA256='+H(diff.encode()))
          PY_V77

          test -f evidence/v77-scope-marker-representation/V76_SCOPE_MARKER_REPRESENTATION_GATE_PASS
          bash -n bootstrap-v77/v76-run-patched-v77.sh
          set +e
          GITHUB_SHA="82a3a5fd0085bd28bad715847629fd87cc3fa54d" \
            bash bootstrap-v77/v76-run-patched-v77.sh \
            >evidence/v77-scope-marker-representation/preserved-v76-child.stdout \
            2>evidence/v77-scope-marker-representation/preserved-v76-child.stderr
          CHILD_RC=$?
          set -e
          printf '%s\n' "$CHILD_RC" > evidence/v77-scope-marker-representation/preserved-v76-child.exit-code.txt
          if [ "$CHILD_RC" -ne 0 ]; then
            echo "V77_PRESERVED_V76_FIRST_FALSE rc=${CHILD_RC}" >&2
            tail -n 1200 evidence/v77-scope-marker-representation/preserved-v76-child.stderr >&2 || true
            exit "$CHILD_RC"
          fi

      - name: Freeze V77 PRE-RESULT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-worker-module-v77
          path: |
            fetched-*
            artifacts-*
            bootstrap*
            evidence
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
