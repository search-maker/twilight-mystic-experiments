name: LowAlt LT5 P Worker Module V81 Child Invocation Full-Line V82

on:
  push:
    branches: [review/lowalt-lt5-p-worker-module-v82-20260920]
    paths: [.github/workflows/lowalt-lt5-p-worker-module-v82.yml]

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  v81-child-invocation-full-line:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Repair only V81 child invocation full-line representation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p fetched-v82 artifacts-v82 bootstrap-v82 evidence/v82-v81-child-invocation-full-line
          api_get(){ curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$1" -o "$2"; }
          R=https://api.github.com/repos/search-maker/twilight-mystic-experiments
          api_get "$R/issues/comments/5748452460" fetched-v82/coordinator.json
          api_get "$R/issues/comments/5748447940" fetched-v82/v81-checkpoint.json
          api_get "$R/contents/.github/workflows/lowalt-lt5-p-worker-module-v81.yml?ref=b7152f61c53840ebd0385672e869ceb534534e7e" fetched-v82/v81-workflow.json
          api_get "$R/actions/runs/35495738841" fetched-v82/v81-run.json
          api_get "$R/actions/jobs/106038219160" fetched-v82/v81-job.json
          api_get "$R/actions/artifacts/10600825151" fetched-v82/v81-artifact.json
          curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$R/actions/jobs/106038219160/logs" -o fetched-v82/v81-job.log
          curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$R/actions/artifacts/10600825151/zip" -o artifacts-v82/v81.zip
          api_get "$R/branches/main" fetched-v82/main.json
          api_get "$R/compare/6cd7c075766fe0c86bc7561ec205a3f9120fd1fb...${GITHUB_SHA}" fetched-v82/main-to-v82.json

          python3 - <<'PY'
          import base64,difflib,hashlib,io,json,zipfile
          from pathlib import Path
          O=Path('evidence/v82-v81-child-invocation-full-line'); O.mkdir(parents=True,exist_ok=True)
          MAIN='6cd7c075766fe0c86bc7561ec205a3f9120fd1fb'; COORD=5748452460
          V81H='b7152f61c53840ebd0385672e869ceb534534e7e'; V81T='65657bf7d1b6f5274e201c71f6110b85c24e5236'; V81B='f247916ce12c943e48e71a69135d80672a895283'; V81R=35495738841; V81J=106038219160; V81A=10600825151; V81S='458514296d2bd71aba8318df9e283a2935a4a15d26f1bdc29a8626e6cde1cf4e'; V81Z=290929
          V80S='0b2eae67d4fe43313f94dd4670adeb2b1fae638b3a4fc43171db6133bcf4b5f6'; V80Z=239229
          V79H='c09937a8459f0f423a3e0fe4eff58634f270e877'; V72H='a2babd4e981ae5f9433c57a318ed42b315db2edf'
          SCRIPT80='6f73bd41fef767aa9d835311f09392509c626bac899bc0331cc4740c9503f7da'
          H=lambda b:hashlib.sha256(b).hexdigest(); G=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          def j(p): return json.loads(Path(p).read_text())
          def body(p,i):
              x=j(p)
              if x.get('id')!=i or x.get('user',{}).get('login')!='search-maker': raise SystemExit('V82_BIND_FAIL comment '+str(i))
              return x.get('body','')
          def wf(p,b):
              x=j(p); d=base64.b64decode(x['content'])
              if x.get('sha')!=b or G(d)!=b: raise SystemExit('V82_BIND_FAIL workflow '+p)
              return d
          def extract_run(w):
              ls=w.splitlines(keepends=True); m=b'        run: |\n'
              if ls.count(m)!=1: raise SystemExit('V82_BIND_FAIL run marker')
              out=[]
              for q in ls[ls.index(m)+1:]:
                  if q.strip() and not q.startswith(b'          '): break
                  out.append(q[10:] if q.startswith(b'          ') else q)
              return b''.join(out)
          cb=body('fetched-v82/coordinator.json',COORD)
          for x in ['AUTHORIZED: exactly ONE fresh LowAlt PRE-RESULT V82 identity',"V82 may repair ONLY V81's child-invocation full-line representation defect",'V72_CHILD_HEAD_CONTEXT_GATE_PASS','No V83 absent later direct Coordinator transition',V81H,V72H,SCRIPT80]:
              if x not in cb: raise SystemExit('V82_BIND_FAIL authority '+x)
          c81=body('fetched-v82/v81-checkpoint.json',5748447940)
          for x in [V81H,V81T,V81B,str(V81R),str(V81J),str(V81A),V81S,str(V81Z),'V81_PATCH_FAIL child invocation cardinality',SCRIPT80,V72H]:
              if x not in c81: raise SystemExit('V82_BIND_FAIL V81 checkpoint '+x)
          w81=wf('fetched-v82/v81-workflow.json',V81B)
          rr=j('fetched-v82/v81-run.json'); jj=j('fetched-v82/v81-job.json'); aa=j('fetched-v82/v81-artifact.json')
          if rr.get('id')!=V81R or rr.get('run_attempt')!=1 or rr.get('conclusion')!='failure' or rr.get('head_sha')!=V81H or rr.get('head_commit',{}).get('tree_id')!=V81T: raise SystemExit('V82_BIND_FAIL V81 run')
          if jj.get('id')!=V81J or jj.get('conclusion')!='failure': raise SystemExit('V82_BIND_FAIL V81 job')
          if aa.get('id')!=V81A or aa.get('digest')!='sha256:'+V81S or aa.get('size_in_bytes')!=V81Z or aa.get('expired'): raise SystemExit('V82_BIND_FAIL V81 artifact')
          log=Path('fetched-v82/v81-job.log').read_text(errors='replace')
          if 'V81_PATCH_FAIL child invocation cardinality' not in log: raise SystemExit('V82_BIND_FAIL V81 first false')
          main=j('fetched-v82/main.json')
          if main.get('commit',{}).get('sha')!=MAIN: raise SystemExit('V82_BIND_FAIL main drift')
          comp=j('fetched-v82/main-to-v82.json'); fs=comp.get('files') or []
          if comp.get('base_commit',{}).get('sha')!=MAIN or len(fs)!=1 or fs[0].get('filename')!='.github/workflows/lowalt-lt5-p-worker-module-v82.yml' or fs[0].get('status')!='added': raise SystemExit('V82_BIND_FAIL V82 branch scope')
          z81=Path('artifacts-v82/v81.zip').read_bytes()
          if len(z81)!=V81Z or H(z81)!=V81S: raise SystemExit('V82_BIND_FAIL V81 artifact transport')
          with zipfile.ZipFile(io.BytesIO(z81)) as z:
              names=[i.filename for i in z.infolist() if not i.is_dir()]
              if names.count('artifacts-v81/v80.zip')!=1: raise SystemExit('V82_BIND_FAIL nested V80 artifact member')
              z80=z.read('artifacts-v81/v80.zip')
          if len(z80)!=V80Z or H(z80)!=V80S: raise SystemExit('V82_BIND_FAIL nested V80 artifact transport')
          with zipfile.ZipFile(io.BytesIO(z80)) as z:
              names=[i.filename for i in z.infolist() if not i.is_dir()]
              p='bootstrap-v80/v79-run-patched-v80.sh'
              if names.count(p)!=1: raise SystemExit('V82_BIND_FAIL V80 preserved script member')
              v79=z.read(p).decode()
          if H(v79.encode())!=SCRIPT80: raise SystemExit('V82_BIND_FAIL V80 preserved script SHA')
          redir=' >evidence/v79-v71-corrected-sha-alias-binding/preserved-v72-child.stdout 2>evidence/v79-v71-corrected-sha-alias-binding/preserved-v72-child.stderr'
          full_old='bash bootstrap-v79/v72-run-patched-v79.sh'+redir+'\n'
          full_new='GITHUB_SHA='+V72H+' bash bootstrap-v79/v72-run-patched-v79.sh'+redir+'\n'
          standalone='bash bootstrap-v79/v72-run-patched-v79.sh\n'
          if v79.count(standalone)!=0 or v79.count(full_old)!=1 or v79.count(full_new)!=0: raise SystemExit('V82_BIND_FAIL invocation representation')
          run81=extract_run(w81).decode()
          old1="old='bash bootstrap-v79/v72-run-patched-v79.sh\\n'"
          new1="old='bash bootstrap-v79/v72-run-patched-v79.sh"+redir+"\\n'"
          old2="new='GITHUB_SHA='+V72H+' bash bootstrap-v79/v72-run-patched-v79.sh\\n'"
          new2="new='GITHUB_SHA='+V72H+' bash bootstrap-v79/v72-run-patched-v79.sh"+redir+"\\n'"
          old3="expected=['-bash bootstrap-v79/v72-run-patched-v79.sh','+GITHUB_SHA='+V72H+' bash bootstrap-v79/v72-run-patched-v79.sh']"
          new3="expected=['-bash bootstrap-v79/v72-run-patched-v79.sh"+redir+"','+GITHUB_SHA='+V72H+' bash bootstrap-v79/v72-run-patched-v79.sh"+redir+"']"
          pairs=[(old1,new1),(old2,new2),(old3,new3)]
          patched=run81
          for a,b in pairs:
              if patched.count(a)!=1 or patched.count(b)!=0: raise SystemExit('V82_PATCH_FAIL V81 representation '+a)
              patched=patched.replace(a,b,1)
          diff=''.join(difflib.unified_diff(run81.splitlines(True),patched.splitlines(True),fromfile='v81-run-original.sh',tofile='v81-run-patched-v82.sh',n=3))
          payload=[x for x in diff.splitlines() if (x.startswith('+') and not x.startswith('+++')) or (x.startswith('-') and not x.startswith('---'))]
          expected_payload=['-'+old1,'+'+new1,'-'+old2,'+'+new2,'-'+old3,'+'+new3]
          if payload!=expected_payload: raise SystemExit('V82_PATCH_FAIL unexpected harness diff '+repr(payload))
          Path('bootstrap-v82/v81-run-patched-v82.sh').write_text(patched)
          Path(O/'v81-to-v82-full-line.diff').write_text(diff)
          rec={'status':'PASS_PRE_RESULT_V82_CHILD_INVOCATION_FULL_LINE_REPRESENTATION_ONLY','v81_run_original_sha256':H(run81.encode()),'v81_run_patched_sha256':H(patched.encode()),'v80_preserved_v79_script_sha256':H(v79.encode()),'standalone_invocation_count':v79.count(standalone),'full_redirected_invocation_count':v79.count(full_old),'already_rebound_full_invocation_count':v79.count(full_new),'redirection_suffix':redir,'diff_sha256':H(diff.encode()),'diff_payload':payload,'scientific_script_mutation':False,'source_defined_transport_mutation':False,'v72_branch_scope_predicate_mutation':False,'global_environment_rewrite':False,'b_selected':False,'b_resolved':False}
          Path(O/'full-line-representation-receipt.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n')
          PY

          bash -n bootstrap-v82/v81-run-patched-v82.sh
          set +e
          GITHUB_SHA=b7152f61c53840ebd0385672e869ceb534534e7e bash bootstrap-v82/v81-run-patched-v82.sh >evidence/v82-v81-child-invocation-full-line/preserved-v81-child.stdout 2>evidence/v82-v81-child-invocation-full-line/preserved-v81-child.stderr
          RC=$?
          set -e
          printf '%s\n' "$RC" > evidence/v82-v81-child-invocation-full-line/preserved-v81-child.exit-code.txt
          if grep -q '^V72_CHILD_HEAD_CONTEXT_GATE_PASS$' evidence/v82-v81-child-invocation-full-line/preserved-v81-child.stdout; then echo V72_CHILD_HEAD_CONTEXT_GATE_PASS; fi
          if [ "$RC" -ne 0 ]; then
            echo "V82_PRESERVED_V81_FIRST_FALSE rc=$RC" >&2
            tail -n 1200 evidence/v82-v81-child-invocation-full-line/preserved-v81-child.stderr >&2 || true
            exit "$RC"
          fi
          echo V82_PRESERVED_CHAIN_COMPLETED_PRE_RESULT

      - name: Upload V82 frozen PRE-RESULT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-worker-module-v82-evidence
          if-no-files-found: error
          retention-days: 90
          path: |
            fetched-v82/
            artifacts-v82/
            bootstrap-v82/
            bootstrap-v81/
            bootstrap-v79/
            bootstrap-v78/
            bootstrap/
            evidence/
            fetched-v81/
            fetched-v80/
            fetched-v79/
            fetched-v78/
            fetched-v72/
            fetched-v71/
