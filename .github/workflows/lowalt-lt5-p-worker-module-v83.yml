name: LowAlt LT5 P Worker Module V82 Diff Assertion Order V83

on:
  push:
    branches: [review/lowalt-lt5-p-worker-module-v83-20260920]
    paths: [.github/workflows/lowalt-lt5-p-worker-module-v83.yml]

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  v82-diff-assertion-order:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Repair only V82 diff assertion order
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p fetched-v83 artifacts-v83 bootstrap-v83 evidence/v83-v82-diff-assertion-order
          api_get(){ curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$1" -o "$2"; }
          R=https://api.github.com/repos/search-maker/twilight-mystic-experiments
          api_get "$R/issues/comments/5748491937" fetched-v83/coordinator.json
          api_get "$R/issues/comments/5748487109" fetched-v83/v82-checkpoint.json
          api_get "$R/contents/.github/workflows/lowalt-lt5-p-worker-module-v82.yml?ref=cd29f7f991b721ec9d010d683303aafc425cf8b8" fetched-v83/v82-workflow.json
          api_get "$R/actions/runs/35497694535" fetched-v83/v82-run.json
          api_get "$R/actions/jobs/106043654409" fetched-v83/v82-job.json
          api_get "$R/actions/artifacts/10601497186" fetched-v83/v82-artifact.json
          curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$R/actions/jobs/106043654409/logs" -o fetched-v83/v82-job.log
          curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$R/actions/artifacts/10601497186/zip" -o artifacts-v83/v82.zip
          api_get "$R/branches/main" fetched-v83/main.json
          api_get "$R/compare/6cd7c075766fe0c86bc7561ec205a3f9120fd1fb...${GITHUB_SHA}" fetched-v83/main-to-v83.json

          python3 - <<'PY'
          import base64,difflib,hashlib,json
          from pathlib import Path
          O=Path('evidence/v83-v82-diff-assertion-order'); O.mkdir(parents=True,exist_ok=True)
          MAIN='6cd7c075766fe0c86bc7561ec205a3f9120fd1fb'; COORD=5748491937
          V82H='cd29f7f991b721ec9d010d683303aafc425cf8b8'; V82T='ca64d308ea8935dc85f8dde5634f8e0af6104b5a'; V82B='1ba0c65e66a326b0d6774bb63f931af206e8352f'; V82R=35497694535; V82J=106043654409; V82A=10601497186; V82S='77e308ffe454ecf952a96923296f135fc6fa2721ba593d4482b9428dc20c7a86'; V82Z=323949
          H=lambda b:hashlib.sha256(b).hexdigest(); G=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          def j(p): return json.loads(Path(p).read_text())
          def body(p,i):
              x=j(p)
              if x.get('id')!=i or x.get('user',{}).get('login')!='search-maker': raise SystemExit('V83_BIND_FAIL comment '+str(i))
              return x.get('body','')
          def wf(p,b):
              x=j(p); d=base64.b64decode(x['content'])
              if x.get('sha')!=b or G(d)!=b: raise SystemExit('V83_BIND_FAIL workflow '+p)
              return d
          def extract_run(w):
              ls=w.splitlines(keepends=True); m=b'        run: |\n'
              if ls.count(m)!=1: raise SystemExit('V83_BIND_FAIL run marker')
              out=[]
              for q in ls[ls.index(m)+1:]:
                  if q.strip() and not q.startswith(b'          '): break
                  out.append(q[10:] if q.startswith(b'          ') else q)
              return b''.join(out)
          cb=body('fetched-v83/coordinator.json',COORD)
          for x in ['AUTHORIZED: exactly ONE fresh LowAlt PRE-RESULT V83 identity',"V83 may repair ONLY V82's local harness diff-assertion ordering",'V82_DIFF_ASSERTION_ORDER_GATE_PASS','No V84 absent later direct Coordinator transition',V82H,V82B]:
              if x not in cb: raise SystemExit('V83_BIND_FAIL authority '+x)
          c82=body('fetched-v83/v82-checkpoint.json',5748487109)
          for x in [V82H,V82T,V82B,str(V82R),str(V82J),str(V82A),V82S,str(V82Z),'V82_PATCH_FAIL unexpected harness diff']:
              if x not in c82: raise SystemExit('V83_BIND_FAIL V82 checkpoint '+x)
          w82=wf('fetched-v83/v82-workflow.json',V82B)
          rr=j('fetched-v83/v82-run.json'); jj=j('fetched-v83/v82-job.json'); aa=j('fetched-v83/v82-artifact.json')
          if rr.get('id')!=V82R or rr.get('run_attempt')!=1 or rr.get('conclusion')!='failure' or rr.get('head_sha')!=V82H or rr.get('head_commit',{}).get('tree_id')!=V82T: raise SystemExit('V83_BIND_FAIL V82 run')
          if jj.get('id')!=V82J or jj.get('conclusion')!='failure': raise SystemExit('V83_BIND_FAIL V82 job')
          if aa.get('id')!=V82A or aa.get('digest')!='sha256:'+V82S or aa.get('size_in_bytes')!=V82Z or aa.get('expired'): raise SystemExit('V83_BIND_FAIL V82 artifact')
          log=Path('fetched-v83/v82-job.log').read_text(errors='replace')
          if 'V82_PATCH_FAIL unexpected harness diff' not in log: raise SystemExit('V83_BIND_FAIL V82 first false')
          main=j('fetched-v83/main.json')
          if main.get('commit',{}).get('sha')!=MAIN: raise SystemExit('V83_BIND_FAIL main drift')
          comp=j('fetched-v83/main-to-v83.json'); fs=comp.get('files') or []
          if comp.get('base_commit',{}).get('sha')!=MAIN or len(fs)!=1 or fs[0].get('filename')!='.github/workflows/lowalt-lt5-p-worker-module-v83.yml' or fs[0].get('status')!='added': raise SystemExit('V83_BIND_FAIL V83 branch scope')
          run82=extract_run(w82).decode()
          old="expected_payload=['-'+old1,'+'+new1,'-'+old2,'+'+new2,'-'+old3,'+'+new3]"
          new="expected_payload=['-'+old1,'-'+old2,'+'+new1,'+'+new2,'-'+old3,'+'+new3]"
          if run82.count(old)!=1 or run82.count(new)!=0: raise SystemExit('V83_PATCH_FAIL assertion-order cardinality')
          patched=run82.replace(old,new,1)
          diff=''.join(difflib.unified_diff(run82.splitlines(True),patched.splitlines(True),fromfile='v82-run-original.sh',tofile='v82-run-patched-v83.sh',n=3))
          payload=[x for x in diff.splitlines() if (x.startswith('+') and not x.startswith('+++')) or (x.startswith('-') and not x.startswith('---'))]
          if payload!=['-'+old,'+'+new]: raise SystemExit('V83_PATCH_FAIL unexpected diff '+repr(payload))
          z=Path('artifacts-v83/v82.zip').read_bytes()
          if len(z)!=V82Z or H(z)!=V82S: raise SystemExit('V83_BIND_FAIL V82 artifact transport')
          Path('bootstrap-v83/v82-run-patched-v83.sh').write_text(patched)
          Path(O/'v82-to-v83-assertion-order.diff').write_text(diff)
          rec={'status':'V82_DIFF_ASSERTION_ORDER_GATE_PASS','v82_run_original_sha256':H(run82.encode()),'v82_run_patched_sha256':H(patched.encode()),'artifact_sha256':H(z),'diff_sha256':H(diff.encode()),'diff_payload':payload,'old_expression_count':run82.count(old),'new_expression_preexisting_count':run82.count(new),'scientific_script_mutation':False,'source_defined_transport_mutation':False,'b_selected':False,'b_resolved':False}
          Path(O/'assertion-order-receipt.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n')
          Path(O/'V82_DIFF_ASSERTION_ORDER_GATE_PASS').write_text('PASS exact V82 expected_payload order only\n')
          PY

          bash -n bootstrap-v83/v82-run-patched-v83.sh
          echo V82_DIFF_ASSERTION_ORDER_GATE_PASS
          set +e
          GITHUB_SHA=cd29f7f991b721ec9d010d683303aafc425cf8b8 bash bootstrap-v83/v82-run-patched-v83.sh >evidence/v83-v82-diff-assertion-order/preserved-v82-child.stdout 2>evidence/v83-v82-diff-assertion-order/preserved-v82-child.stderr
          RC=$?
          set -e
          printf '%s\n' "$RC" > evidence/v83-v82-diff-assertion-order/preserved-v82-child.exit-code.txt
          if grep -q '^V72_CHILD_HEAD_CONTEXT_GATE_PASS$' evidence/v83-v82-diff-assertion-order/preserved-v82-child.stdout; then echo V72_CHILD_HEAD_CONTEXT_GATE_PASS; fi
          if [ "$RC" -ne 0 ]; then
            echo "V83_PRESERVED_V82_FIRST_FALSE rc=$RC" >&2
            tail -n 1500 evidence/v83-v82-diff-assertion-order/preserved-v82-child.stderr >&2 || true
            exit "$RC"
          fi
          echo V83_PRESERVED_CHAIN_COMPLETED_PRE_RESULT

      - name: Upload V83 frozen PRE-RESULT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-worker-module-v83-evidence
          if-no-files-found: error
          retention-days: 90
          path: |
            fetched-v83/
            artifacts-v83/
            bootstrap-v83/
            bootstrap-v82/
            bootstrap-v81/
            bootstrap-v79/
            bootstrap-v78/
            bootstrap/
            evidence/
            fetched-v82/
            fetched-v81/
            fetched-v80/
            fetched-v79/
            fetched-v78/
            fetched-v72/
            fetched-v71/
