name: LowAlt LT5 P Worker Module V79 Nested Newline Escape Serialization V84

on:
  push:
    branches: [review/lowalt-lt5-p-worker-module-v84-20260920]
    paths: [.github/workflows/lowalt-lt5-p-worker-module-v84.yml]

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  v79-nested-newline-escape-serialization:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Repair only V79 nested newline escape serialization
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p fetched-v84 artifacts-v84 bootstrap-v84 evidence/v84-v79-newline-serialization
          api_get(){ curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$1" -o "$2"; }
          R=https://api.github.com/repos/search-maker/twilight-mystic-experiments
          api_get "$R/issues/comments/5748531112" fetched-v84/coordinator.json
          api_get "$R/issues/comments/5748523833" fetched-v84/v83-checkpoint.json
          api_get "$R/contents/.github/workflows/lowalt-lt5-p-worker-module-v83.yml?ref=ec9e8cbfd26dc08cfa0b7b4ece9b5364abacccf4" fetched-v84/v83-workflow.json
          api_get "$R/git/blobs/fcbaabf4ee2797d813f60897bd6c29ecb8e81fa5" fetched-v84/v79-workflow-blob.json
          api_get "$R/actions/runs/35497977130" fetched-v84/v83-run.json
          api_get "$R/actions/jobs/106044444455" fetched-v84/v83-job.json
          api_get "$R/actions/artifacts/10601347826" fetched-v84/v83-artifact.json
          curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$R/actions/jobs/106044444455/logs" -o fetched-v84/v83-job.log
          curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$R/actions/artifacts/10601347826/zip" -o artifacts-v84/v83.zip
          api_get "$R/branches/main" fetched-v84/main.json
          api_get "$R/compare/6cd7c075766fe0c86bc7561ec205a3f9120fd1fb...${GITHUB_SHA}" fetched-v84/main-to-v84.json

          python3 - <<'PY'
          import ast,base64,difflib,hashlib,io,json,re,zipfile
          from pathlib import Path
          O=Path('evidence/v84-v79-newline-serialization'); O.mkdir(parents=True,exist_ok=True)
          MAIN='6cd7c075766fe0c86bc7561ec205a3f9120fd1fb'; COORD=5748531112
          V83H='ec9e8cbfd26dc08cfa0b7b4ece9b5364abacccf4'; V83T='f8845eaf0e0506f7512581aaee2c5f31da85d0a2'; V83B='c1b56d81dcb9ce337113e6f72448d08a6ad9265d'; V83R=35497977130; V83J=106044444455; V83A=10601347826; V83S='c6d6703b3592d2c283389257d443c8eea587a0f88d8dc9b9c542c89abc566966'; V83Z=664962
          V79B='fcbaabf4ee2797d813f60897bd6c29ecb8e81fa5'; V79S='f0e8aceefb9e574cde3bf672028b4898af448935ae0181f17766eddc0880fafb'; BADGEN='2b090a436c19561e9558750b99e798b17426c91fce1ea79d4389c3fabe182ac8'
          CT='9d1f9817c71f9873052b1e0735de3285588d18a2789ee22b1addca9336078d3f'; CM='c6be26dc8da045cb4199a1bf7b58a6eb0a4974c306e95b11a1fa58ca9f80ab89'
          H=lambda b:hashlib.sha256(b).hexdigest(); G=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          def j(p): return json.loads(Path(p).read_text())
          def body(p,i):
              x=j(p)
              if x.get('id')!=i or x.get('user',{}).get('login')!='search-maker': raise SystemExit('V84_BIND_FAIL comment '+str(i))
              return x.get('body','')
          def wf_content(p,b):
              x=j(p); d=base64.b64decode(x['content'])
              if x.get('sha')!=b or G(d)!=b: raise SystemExit('V84_BIND_FAIL workflow '+p)
              return d
          def blob_content(p,b):
              x=j(p); d=base64.b64decode(x['content'])
              if x.get('sha')!=b or G(d)!=b: raise SystemExit('V84_BIND_FAIL blob '+p)
              return d
          def extract_run(w):
              ls=w.splitlines(keepends=True); m=b'        run: |\n'
              if ls.count(m)!=1: raise SystemExit('V84_BIND_FAIL run marker')
              out=[]
              for q in ls[ls.index(m)+1:]:
                  if q.strip() and not q.startswith(b'          '): break
                  out.append(q[10:] if q.startswith(b'          ') else q)
              return b''.join(out)

          cb=body('fetched-v84/coordinator.json',COORD)
          for x in ['AUTHORIZED: exactly ONE fresh LowAlt PRE-RESULT V84 identity','V84 may repair ONLY this V79 raw-injector two-class newline serialization defect','V79_NESTED_NEWLINE_ESCAPE_SERIALIZATION_GATE_PASS','__V84_ESC_N__','No V85 absent later direct transition',V83H,V83B,V79B,V79S,CT,CM]:
              if x not in cb: raise SystemExit('V84_BIND_FAIL authority '+x)
          c83=body('fetched-v84/v83-checkpoint.json',5748523833)
          for x in [V83H,V83T,V83B,str(V83R),str(V83J),str(V83A),V83S,str(V83Z),'V82_DIFF_ASSERTION_ORDER_GATE_PASS','V72_CHILD_HEAD_CONTEXT_GATE_PASS',V79B,V79S,BADGEN,CT,CM]:
              if x not in c83: raise SystemExit('V84_BIND_FAIL V83 checkpoint '+x)
          w83=wf_content('fetched-v84/v83-workflow.json',V83B)
          w79=blob_content('fetched-v84/v79-workflow-blob.json',V79B)
          rr=j('fetched-v84/v83-run.json'); jj=j('fetched-v84/v83-job.json'); aa=j('fetched-v84/v83-artifact.json')
          if rr.get('id')!=V83R or rr.get('run_attempt')!=1 or rr.get('conclusion')!='failure' or rr.get('head_sha')!=V83H or rr.get('head_commit',{}).get('tree_id')!=V83T: raise SystemExit('V84_BIND_FAIL V83 run')
          if jj.get('id')!=V83J or jj.get('conclusion')!='failure': raise SystemExit('V84_BIND_FAIL V83 job')
          if aa.get('id')!=V83A or aa.get('digest')!='sha256:'+V83S or aa.get('size_in_bytes')!=V83Z or aa.get('expired'): raise SystemExit('V84_BIND_FAIL V83 artifact')
          log=Path('fetched-v84/v83-job.log').read_text(errors='replace')
          for x in ['V82_DIFF_ASSERTION_ORDER_GATE_PASS','V72_CHILD_HEAD_CONTEXT_GATE_PASS']:
              if x not in log: raise SystemExit('V84_BIND_FAIL V83 log '+x)
          main=j('fetched-v84/main.json')
          if main.get('commit',{}).get('sha')!=MAIN: raise SystemExit('V84_BIND_FAIL main drift')
          comp=j('fetched-v84/main-to-v84.json'); fs=comp.get('files') or []
          if comp.get('base_commit',{}).get('sha')!=MAIN or len(fs)!=1 or fs[0].get('filename')!='.github/workflows/lowalt-lt5-p-worker-module-v84.yml' or fs[0].get('status')!='added': raise SystemExit('V84_BIND_FAIL V84 branch scope')
          z=Path('artifacts-v84/v83.zip').read_bytes()
          if len(z)!=V83Z or H(z)!=V83S: raise SystemExit('V84_BIND_FAIL V83 artifact transport')
          with zipfile.ZipFile(io.BytesIO(z)) as zz:
              ns=[i.filename for i in zz.infolist() if not i.is_dir()]
              target='bootstrap-v81/v79-run-patched-v81.sh'
              malformed='bootstrap-v79/v72-run-patched-v79.sh'
              if ns.count(target)!=1 or ns.count(malformed)!=1: raise SystemExit('V84_BIND_FAIL V83 member cardinality')
              run79=zz.read(target)
              bad=zz.read(malformed)
          if H(run79)!=V79S or H(bad)!=BADGEN: raise SystemExit('V84_BIND_FAIL V83 member transport')
          r79src=extract_run(w79).decode()
          before=run79.decode()
          old=r"'''.replace('\\n','\n')"
          new=r"'''.replace('\\\\n','__V84_ESC_N__').replace('\\n','\n').replace('__V84_ESC_N__','\\n')"
          if r79src.count(old)!=1 or r79src.count(new)!=0: raise SystemExit('V84_SERIAL_FAIL immutable V79 decoder cardinality')
          if before.count(old)!=1 or before.count(new)!=0: raise SystemExit('V84_SERIAL_FAIL preserved V79 decoder cardinality')
          start="injector=r'''"
          if before.count(start)!=1: raise SystemExit('V84_SERIAL_FAIL injector start cardinality')
          raw_payload=before.split(start,1)[1].split(old,1)[0]
          if '__V84_ESC_N__' in raw_payload: raise SystemExit('V84_SERIAL_FAIL sentinel collision')
          after=before.replace(old,new,1)
          if after.replace(new,old,1)!=before or after.count(old)!=0 or after.count(new)!=1: raise SystemExit('V84_SERIAL_FAIL nonlocal patch')
          diff=''.join(difflib.unified_diff(before.splitlines(True),after.splitlines(True),fromfile='v79-run-patched-v81.sh',tofile='v79-run-patched-v84.sh',n=3))
          payload=[x for x in diff.splitlines() if (x.startswith('+') and not x.startswith('+++')) or (x.startswith('-') and not x.startswith('---'))]
          if len(payload)!=2 or not payload[0].startswith('-') or not payload[1].startswith('+') or old not in payload[0] or new not in payload[1]: raise SystemExit('V84_SERIAL_FAIL diff payload')

          blocks=[]
          for m in re.finditer(r"python3 - <<'([^']+)'\n",after):
              tag=m.group(1); e=after.find('\n'+tag+'\n',m.end())
              if e<0: raise SystemExit('V84_SERIAL_FAIL unterminated outer heredoc '+tag)
              block=after[m.end():e]
              if 'injector=r' in block: blocks.append(block)
          if len(blocks)!=1: raise SystemExit('V84_SERIAL_FAIL outer injector block count='+str(len(blocks)))
          tree=ast.parse(blocks[0])
          assigns=[n for n in tree.body if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='injector' for t in n.targets)]
          if len(assigns)!=1: raise SystemExit('V84_SERIAL_FAIL injector assignment AST count')
          injector=eval(compile(ast.Expression(assigns[0].value),'<v84-injector>','eval'),{})
          if '__V84_ESC_N__' in injector: raise SystemExit('V84_SERIAL_FAIL sentinel survived evaluation')
          hs="python3 - <<'PY_V79_ALIAS'\n"; he='\nPY_V79_ALIAS\n'
          if injector.count(hs)!=1 or injector.count(he)!=1: raise SystemExit('V84_SERIAL_FAIL nested markers')
          nested=injector.split(hs,1)[1].split(he,1)[0]
          ast.parse(nested)
          needles=[
              "anchor=\"CORR_MANIFEST='\"+CM+\"'\\n\"",
              "add=anchor+LT+' = CORR_TABLE\\n'+LM+' = CORR_MANIFEST\\n'",
              "exec(\"CORR_TABLE='\"+CT+\"'\\nCORR_MANIFEST='\"+CM+\"'\\n\"+LT+' = CORR_TABLE\\n'+LM+' = CORR_MANIFEST\\n',ns)",
              "Path(O/'alias-binding-receipt.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\\n')",
              "Path(O/'V71_CORRECTED_SHA_ALIAS_BINDING_GATE_PASS').write_text('PASS exact local aliases bind accepted corrected V59 source-output SHA identities before preserved V71 use\\n')",
          ]
          if any(nested.count(x)!=1 for x in needles): raise SystemExit('V84_SERIAL_FAIL nested literal preservation')
          if '\\\n' in nested: raise SystemExit('V84_SERIAL_FAIL source backslash-newline continuation survived')
          if nested.count(CT)!=1 or nested.count(CM)!=1: raise SystemExit('V84_SERIAL_FAIL corrected value drift')
          Path('bootstrap-v84/v79-run-patched-v84.sh').write_text(after)
          Path(O/'v83-to-v84-newline-serialization.diff').write_text(diff)
          rec={
            'status':'V79_NESTED_NEWLINE_ESCAPE_SERIALIZATION_GATE_PASS',
            'v79_workflow_blob':V79B,
            'preserved_v79_before_sha256':H(before.encode()),
            'patched_v79_after_sha256':H(after.encode()),
            'malformed_generated_v72_sha256':H(bad),
            'diff_sha256':H(diff.encode()),
            'diff_payload_line_count':len(payload),
            'old_decoder_count_before':before.count(old),
            'new_decoder_count_before':before.count(new),
            'sentinel_collision_before':False,
            'evaluated_injector_sha256':H(injector.encode()),
            'nested_alias_source_sha256':H(nested.encode()),
            'nested_alias_parses':True,
            'nested_source_backslash_newline_count':nested.count('\\\n'),
            'corrected_table':CT,
            'corrected_manifest':CM,
            'scientific_script_mutation':False,
            'source_defined_transport_mutation':False,
            'b_selected':False,
            'b_resolved':False,
          }
          Path(O/'newline-serialization-receipt.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n')
          Path(O/'V79_NESTED_NEWLINE_ESCAPE_SERIALIZATION_GATE_PASS').write_text('PASS exact V79 terminal decoder only\n')
          PY

          bash -n bootstrap-v84/v79-run-patched-v84.sh
          echo V79_NESTED_NEWLINE_ESCAPE_SERIALIZATION_GATE_PASS
          set +e
          GITHUB_SHA=c09937a8459f0f423a3e0fe4eff58634f270e877 bash bootstrap-v84/v79-run-patched-v84.sh >evidence/v84-v79-newline-serialization/preserved-v79-child.stdout 2>evidence/v84-v79-newline-serialization/preserved-v79-child.stderr
          RC=$?
          set -e
          printf '%s\n' "$RC" > evidence/v84-v79-newline-serialization/preserved-v79-child.exit-code.txt
          if [ "$RC" -ne 0 ]; then
            echo "V84_PRESERVED_V79_FIRST_FALSE rc=$RC" >&2
            tail -n 1800 evidence/v84-v79-newline-serialization/preserved-v79-child.stderr >&2 || true
            exit "$RC"
          fi
          echo V84_PRESERVED_CHAIN_COMPLETED_PRE_RESULT

      - name: Upload V84 frozen PRE-RESULT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-worker-module-v84-evidence
          if-no-files-found: error
          retention-days: 90
          path: |
            fetched-*/
            artifacts-*/
            bootstrap*/
            evidence/
