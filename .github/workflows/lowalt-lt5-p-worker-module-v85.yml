name: LowAlt LT5 P Worker Module V84 Authority Marker Representation V85

on:
  push:
    branches: [review/lowalt-lt5-p-worker-module-v85-20260920]
    paths: [.github/workflows/lowalt-lt5-p-worker-module-v85.yml]

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  v84-authority-marker-representation:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Repair only V84 direct-authority marker representation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p fetched-v85 artifacts-v85 bootstrap-v85 evidence/v85-v84-authority-marker
          api_get(){ curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$1" -o "$2"; }
          R=https://api.github.com/repos/search-maker/twilight-mystic-experiments
          api_get "$R/issues/comments/5748762503" fetched-v85/coordinator.json
          api_get "$R/issues/comments/5748758235" fetched-v85/v84-checkpoint.json
          api_get "$R/contents/.github/workflows/lowalt-lt5-p-worker-module-v84.yml?ref=e34532cce5f29f443c7f02b4bb63fa252ddd03d8" fetched-v85/v84-workflow.json
          api_get "$R/actions/runs/35500370224" fetched-v85/v84-run.json
          api_get "$R/actions/jobs/106050969388" fetched-v85/v84-job.json
          api_get "$R/actions/artifacts/10602061573" fetched-v85/v84-artifact.json
          curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$R/actions/jobs/106050969388/logs" -o fetched-v85/v84-job.log
          curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$R/actions/artifacts/10602061573/zip" -o artifacts-v85/v84.zip
          api_get "$R/branches/main" fetched-v85/main.json
          api_get "$R/compare/6cd7c075766fe0c86bc7561ec205a3f9120fd1fb...${GITHUB_SHA}" fetched-v85/main-to-v85.json

          python3 - <<'PY'
          import base64,difflib,hashlib,json
          from pathlib import Path
          O=Path('evidence/v85-v84-authority-marker'); O.mkdir(parents=True,exist_ok=True)
          MAIN='6cd7c075766fe0c86bc7561ec205a3f9120fd1fb'; COORD=5748762503
          V84H='e34532cce5f29f443c7f02b4bb63fa252ddd03d8'; V84T='9cda4d53f4b87c1cae987364aa189f81edcd59fc'; V84B='f4cd59321fa7ba088a699c36e834ccc83eca1603'; V84R=35500370224; V84J=106050969388; V84A=10602061573; V84S='badf9c22fefd7d05991a22ac42ffe344b4113edddfc0fdef8f95f0e9ce7ac73d'; V84Z=697668
          H=lambda b:hashlib.sha256(b).hexdigest(); G=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          def j(p): return json.loads(Path(p).read_text())
          def body(p,i):
              x=j(p)
              if x.get('id')!=i or x.get('user',{}).get('login')!='search-maker': raise SystemExit('V85_BIND_FAIL comment '+str(i))
              return x.get('body','')
          def wf(p,b):
              x=j(p); d=base64.b64decode(x['content'])
              if x.get('sha')!=b or G(d)!=b: raise SystemExit('V85_BIND_FAIL workflow '+p)
              return d
          def extract_run(w):
              ls=w.splitlines(keepends=True); m=b'        run: |\n'
              if ls.count(m)!=1: raise SystemExit('V85_BIND_FAIL run marker')
              out=[]
              for q in ls[ls.index(m)+1:]:
                  if q.strip() and not q.startswith(b'          '): break
                  out.append(q[10:] if q.startswith(b'          ') else q)
              return b''.join(out)
          cb=body('fetched-v85/coordinator.json',COORD)
          for x in ['AUTHORIZED: exactly ONE fresh LowAlt PRE-RESULT V85 identity','V85 may repair ONLY this V84 direct-authority marker representation defect','V84_DIRECT_AUTHORITY_MARKER_REPRESENTATION_GATE_PASS',V84H,V84B,V84S]:
              if x not in cb: raise SystemExit('V85_BIND_FAIL authority '+x)
          c84=body('fetched-v85/v84-checkpoint.json',5748758235)
          for x in [V84H,V84T,V84B,str(V84R),str(V84J),str(V84A),V84S,str(V84Z),'V84_BIND_FAIL authority No V85 absent later direct transition']:
              if x not in c84: raise SystemExit('V85_BIND_FAIL V84 checkpoint '+x)
          w84=wf('fetched-v85/v84-workflow.json',V84B)
          rr=j('fetched-v85/v84-run.json'); jj=j('fetched-v85/v84-job.json'); aa=j('fetched-v85/v84-artifact.json')
          if rr.get('id')!=V84R or rr.get('run_attempt')!=1 or rr.get('conclusion')!='failure' or rr.get('head_sha')!=V84H or rr.get('head_commit',{}).get('tree_id')!=V84T: raise SystemExit('V85_BIND_FAIL V84 run')
          if jj.get('id')!=V84J or jj.get('conclusion')!='failure': raise SystemExit('V85_BIND_FAIL V84 job')
          if aa.get('id')!=V84A or aa.get('digest')!='sha256:'+V84S or aa.get('size_in_bytes')!=V84Z or aa.get('expired'): raise SystemExit('V85_BIND_FAIL V84 artifact')
          log=Path('fetched-v85/v84-job.log').read_text(errors='replace')
          if 'V84_BIND_FAIL authority No V85 absent later direct transition' not in log: raise SystemExit('V85_BIND_FAIL V84 first false')
          main=j('fetched-v85/main.json')
          if main.get('commit',{}).get('sha')!=MAIN: raise SystemExit('V85_BIND_FAIL main drift')
          comp=j('fetched-v85/main-to-v85.json'); fs=comp.get('files') or []
          if comp.get('base_commit',{}).get('sha')!=MAIN or len(fs)!=1 or fs[0].get('filename')!='.github/workflows/lowalt-lt5-p-worker-module-v85.yml' or fs[0].get('status')!='added': raise SystemExit('V85_BIND_FAIL V85 branch scope')
          z=Path('artifacts-v85/v84.zip').read_bytes()
          if len(z)!=V84Z or H(z)!=V84S: raise SystemExit('V85_BIND_FAIL V84 artifact transport')
          before=extract_run(w84).decode()
          old='No V85 absent later direct transition'
          new='No V85 absent later direct Coordinator transition'
          if before.count(old)!=1 or before.count(new)!=0: raise SystemExit('V85_PATCH_FAIL marker cardinality')
          after=before.replace(old,new,1)
          if after.count(old)!=0 or after.count(new)!=1 or after.replace(new,old,1)!=before: raise SystemExit('V85_PATCH_FAIL nonlocal marker patch')
          diff=''.join(difflib.unified_diff(before.splitlines(True),after.splitlines(True),fromfile='v84-run-original.sh',tofile='v84-run-patched-v85.sh',n=3))
          payload=[x for x in diff.splitlines() if (x.startswith('+') and not x.startswith('+++')) or (x.startswith('-') and not x.startswith('---'))]
          if len(payload)!=2 or not payload[0].startswith('-') or not payload[1].startswith('+') or old not in payload[0] or new not in payload[1]: raise SystemExit('V85_PATCH_FAIL diff payload')
          if payload[0][1:].replace(old,new,1)!=payload[1][1:]: raise SystemExit('V85_PATCH_FAIL unrelated line drift')
          Path('bootstrap-v85/v84-run-patched-v85.sh').write_text(after)
          Path(O/'v84-to-v85-authority-marker.diff').write_text(diff)
          rec={'status':'V84_DIRECT_AUTHORITY_MARKER_REPRESENTATION_GATE_PASS','v84_run_original_sha256':H(before.encode()),'v84_run_patched_sha256':H(after.encode()),'v84_artifact_sha256':H(z),'diff_sha256':H(diff.encode()),'diff_payload':payload,'old_marker':old,'new_marker':new,'scientific_script_mutation':False,'source_defined_transport_mutation':False,'b_selected':False,'b_resolved':False}
          Path(O/'authority-marker-receipt.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n')
          Path(O/'V84_DIRECT_AUTHORITY_MARKER_REPRESENTATION_GATE_PASS').write_text('PASS exact V84 direct-authority marker representation only\n')
          PY

          bash -n bootstrap-v85/v84-run-patched-v85.sh
          echo V84_DIRECT_AUTHORITY_MARKER_REPRESENTATION_GATE_PASS
          set +e
          GITHUB_SHA=e34532cce5f29f443c7f02b4bb63fa252ddd03d8 bash bootstrap-v85/v84-run-patched-v85.sh >evidence/v85-v84-authority-marker/preserved-v84-child.stdout 2>evidence/v85-v84-authority-marker/preserved-v84-child.stderr
          RC=$?
          set -e
          printf '%s\n' "$RC" > evidence/v85-v84-authority-marker/preserved-v84-child.exit-code.txt
          if [ "$RC" -ne 0 ]; then
            echo "V85_PRESERVED_V84_FIRST_FALSE rc=$RC" >&2
            tail -n 2200 evidence/v85-v84-authority-marker/preserved-v84-child.stderr >&2 || true
            exit "$RC"
          fi
          echo V85_PRESERVED_CHAIN_COMPLETED_PRE_RESULT

      - name: Upload V85 frozen PRE-RESULT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-worker-module-v85-evidence
          if-no-files-found: error
          retention-days: 90
          path: |
            fetched-*/
            artifacts-*/
            bootstrap*/
            evidence/
