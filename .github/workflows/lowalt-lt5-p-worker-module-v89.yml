name: LowAlt LT5 P Worker Module V84 Owner Literal Cardinality V89

on:
  push:
    branches: [review/lowalt-lt5-p-worker-module-v89-20260920]
    paths: [.github/workflows/lowalt-lt5-p-worker-module-v89.yml]

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  v84-owner-literal-cardinality:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Repair only V84 owner literal cardinality representation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p fetched-v89 artifacts-v89 bootstrap-v89 evidence/v89-v84-owner-cardinality
          api_get(){ curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$1" -o "$2"; }
          R=https://api.github.com/repos/search-maker/twilight-mystic-experiments
          api_get "$R/issues/comments/5748937676" fetched-v89/coordinator.json
          api_get "$R/issues/comments/5748922036" fetched-v89/v88-checkpoint.json
          api_get "$R/contents/.github/workflows/lowalt-lt5-p-worker-module-v88.yml?ref=262a0dd09516f6db121a18760d50bbf571f8809b" fetched-v89/v88-workflow.json
          api_get "$R/actions/runs/35501922115" fetched-v89/v88-run.json
          api_get "$R/actions/jobs/106055078634" fetched-v89/v88-job.json
          api_get "$R/actions/artifacts/10602995782" fetched-v89/v88-artifact.json
          curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$R/actions/jobs/106055078634/logs" -o fetched-v89/v88-job.log
          curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$R/actions/artifacts/10602995782/zip" -o artifacts-v89/v88.zip
          api_get "$R/branches/main" fetched-v89/main.json
          api_get "$R/compare/6cd7c075766fe0c86bc7561ec205a3f9120fd1fb...${GITHUB_SHA}" fetched-v89/main-to-v89.json

          python3 - <<'PY'
          import base64,difflib,hashlib,io,json,zipfile
          from pathlib import Path
          O=Path('evidence/v89-v84-owner-cardinality'); O.mkdir(parents=True,exist_ok=True)
          MAIN='6cd7c075766fe0c86bc7561ec205a3f9120fd1fb'; COORD=5748937676; V88C=5748922036
          V88H='262a0dd09516f6db121a18760d50bbf571f8809b'; V88T='73b13dabf895310688ac8e915132dca05366aa6f'; V88B='f5562aff90a7b97c32407afb5271d484ead6eeed'; V88R=35501922115; V88J=106055078634; V88A=10602995782; V88AS='664ca4f2fc09e0ff6d728ccad74b3743b764f1f6724cfa24deb5c6aae84c2a6b'; V88AZ=4440106
          V87H='810515a3fff81f25223b3605036021ed603b954a'
          CHILD='bootstrap-v88/v87-run-patched-v88.sh'; CHILDSHA='d2157e45ea3321a8143121a3f4ac425b08fa249cbfdca607771c33668cdbc9b1'
          V84OWNER='fetched-v87/v84-coordinator.json'; V84C=5748531112
          V79S='f0e8aceefb9e574cde3bf672028b4898af448935ae0181f17766eddc0880fafb'; BADGEN='2b090a436c19561e9558750b99e798b17426c91fce1ea79d4389c3fabe182ac8'
          H=lambda b:hashlib.sha256(b).hexdigest(); G=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          def j(p): return json.loads(Path(p).read_text())
          def body(p,i):
              x=j(p)
              if x.get('id')!=i or x.get('user',{}).get('login')!='search-maker': raise SystemExit('V89_BIND_FAIL comment '+str(i))
              return x.get('body','')
          def wf(p,b):
              x=j(p); d=base64.b64decode(x['content'])
              if x.get('sha')!=b or G(d)!=b: raise SystemExit('V89_BIND_FAIL workflow '+p)
              return d
          cb=body('fetched-v89/coordinator.json',COORD)
          for x in ['AUTHORIZED: exactly ONE fresh LowAlt PRE-RESULT V89 identity','V89 may repair ONLY this preserved-V87 V84-owner-literal cardinality representation defect','V84_OWNER_LITERAL_CARDINALITY_REPRESENTATION_GATE_PASS',CHILDSHA,V79S,BADGEN,'No V90 absent later direct Coordinator transition']:
              if x not in cb: raise SystemExit('V89_BIND_FAIL authority '+x)
          cp=body('fetched-v89/v88-checkpoint.json',V88C)
          for x in [V88H,V88T,V88B,str(V88R),str(V88J),str(V88A),V88AS,str(V88AZ),'V87_DERIVED_MEMBER_SHA_AUTHORITY_LOCUS_GATE_PASS','V87_LOCUS_FAIL V84 owner cardinality','V88 IS TERMINAL/SPENT/FROZEN FOREVER']:
              if x not in cp: raise SystemExit('V89_BIND_FAIL V88 checkpoint '+x)
          wf('fetched-v89/v88-workflow.json',V88B)
          rr=j('fetched-v89/v88-run.json'); jj=j('fetched-v89/v88-job.json'); aa=j('fetched-v89/v88-artifact.json')
          if rr.get('id')!=V88R or rr.get('run_attempt')!=1 or rr.get('conclusion')!='failure' or rr.get('head_sha')!=V88H or rr.get('head_commit',{}).get('tree_id')!=V88T: raise SystemExit('V89_BIND_FAIL V88 run')
          if jj.get('id')!=V88J or jj.get('conclusion')!='failure': raise SystemExit('V89_BIND_FAIL V88 job')
          if aa.get('id')!=V88A or aa.get('digest')!='sha256:'+V88AS or aa.get('size_in_bytes')!=V88AZ or aa.get('expired'): raise SystemExit('V89_BIND_FAIL V88 artifact')
          log=Path('fetched-v89/v88-job.log').read_text(errors='replace')
          if 'V87_DERIVED_MEMBER_SHA_AUTHORITY_LOCUS_GATE_PASS' not in log or 'V87_LOCUS_FAIL V84 owner cardinality' not in log: raise SystemExit('V89_BIND_FAIL V88 gate/first-false log')
          z=Path('artifacts-v89/v88.zip').read_bytes()
          if len(z)!=V88AZ or H(z)!=V88AS: raise SystemExit('V89_BIND_FAIL V88 artifact transport')
          with zipfile.ZipFile(io.BytesIO(z)) as zz:
              ns=[i.filename for i in zz.infolist() if not i.is_dir()]
              if ns.count(CHILD)!=1 or ns.count(V84OWNER)!=1: raise SystemExit('V89_BIND_FAIL target member cardinality')
              before_b=zz.read(CHILD); c84raw=zz.read(V84OWNER)
          if H(before_b)!=CHILDSHA: raise SystemExit('V89_BIND_FAIL preserved V87 child SHA')
          c84j=json.loads(c84raw.decode())
          if c84j.get('id')!=V84C or c84j.get('user',{}).get('login')!='search-maker': raise SystemExit('V89_BIND_FAIL V84 owner identity')
          c84=c84j.get('body','')
          if c84.count(V79S)!=2 or c84.count(BADGEN)!=1: raise SystemExit('V89_OWNER_FAIL frozen cardinality')
          diag='Frozen V83 member `bootstrap-v81/v79-run-patched-v81.sh` SHA256 `'+V79S+'`'
          gate='exact V83 artifact member `bootstrap-v81/v79-run-patched-v81.sh` SHA256 `'+V79S+'`'
          badctx='frozen generated member `bootstrap-v79/v72-run-patched-v79.sh` SHA256 `'+BADGEN+'`'
          if c84.count(diag)!=1 or c84.count(gate)!=1 or c84.count(badctx)!=1: raise SystemExit('V89_OWNER_FAIL frozen contexts')
          main=j('fetched-v89/main.json')
          if main.get('commit',{}).get('sha')!=MAIN: raise SystemExit('V89_BIND_FAIL main drift')
          comp=j('fetched-v89/main-to-v89.json'); fs=comp.get('files') or []
          if comp.get('base_commit',{}).get('sha')!=MAIN or len(fs)!=1 or fs[0].get('filename')!='.github/workflows/lowalt-lt5-p-worker-module-v89.yml' or fs[0].get('status')!='added': raise SystemExit('V89_BIND_FAIL V89 branch scope')
          before=before_b.decode()
          old="if c84.count(V79S)!=1 or c84.count(BADGEN)!=1: raise SystemExit('V87_LOCUS_FAIL V84 owner cardinality')"
          new="if c84.count(V79S)!=2 or c84.count(BADGEN)!=1: raise SystemExit('V87_LOCUS_FAIL V84 owner cardinality')"
          zero="if c83.count(V79S)!=0 or c83.count(BADGEN)!=0:"
          if before.count(old)!=1 or before.count(new)!=0 or before.count(zero)!=1: raise SystemExit('V89_PATCH_FAIL predicate cardinality')
          after=before.replace(old,new,1)
          if after.count(old)!=0 or after.count(new)!=1 or after.count(zero)!=1 or after.replace(new,old,1)!=before: raise SystemExit('V89_PATCH_FAIL nonlocal patch')
          diff=''.join(difflib.unified_diff(before.splitlines(True),after.splitlines(True),fromfile='v87-run-patched-v88.sh',tofile='v87-run-patched-v89.sh',n=3))
          payload=[x for x in diff.splitlines() if (x.startswith('+') and not x.startswith('+++')) or (x.startswith('-') and not x.startswith('---'))]
          if payload!=['-'+old,'+'+new]: raise SystemExit('V89_PATCH_FAIL diff payload')
          Path('bootstrap-v89/v87-run-patched-v89.sh').write_text(after)
          Path(O/'v88-to-v89-owner-cardinality.diff').write_text(diff)
          rec={'status':'V84_OWNER_LITERAL_CARDINALITY_REPRESENTATION_GATE_PASS','v84_owner_comment':V84C,'v79s_count':c84.count(V79S),'badgen_count':c84.count(BADGEN),'diagnosis_context_count':c84.count(diag),'first_gate_context_count':c84.count(gate),'badgen_context_count':c84.count(badctx),'preserved_v87_before_sha256':H(before_b),'preserved_v87_after_sha256':H(after.encode()),'diff_sha256':H(diff.encode()),'diff_payload':payload,'scientific_script_mutation':False,'source_defined_transport_mutation':False,'b_selected':False,'b_resolved':False}
          Path(O/'owner-literal-cardinality-receipt.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n')
          Path(O/'V84_OWNER_LITERAL_CARDINALITY_REPRESENTATION_GATE_PASS').write_text('PASS exact V84 owner has V79S twice in two fixed contexts and BADGEN once\n')
          PY

          bash -n bootstrap-v89/v87-run-patched-v89.sh
          echo V84_OWNER_LITERAL_CARDINALITY_REPRESENTATION_GATE_PASS
          set +e
          GITHUB_SHA=810515a3fff81f25223b3605036021ed603b954a bash bootstrap-v89/v87-run-patched-v89.sh >evidence/v89-v84-owner-cardinality/preserved-v87-child.stdout 2>evidence/v89-v84-owner-cardinality/preserved-v87-child.stderr
          RC=$?
          set -e
          printf '%s\n' "$RC" > evidence/v89-v84-owner-cardinality/preserved-v87-child.exit-code.txt
          if [ "$RC" -ne 0 ]; then
            echo "V89_PRESERVED_V87_FIRST_FALSE rc=$RC" >&2
            tail -n 3400 evidence/v89-v84-owner-cardinality/preserved-v87-child.stderr >&2 || true
            exit "$RC"
          fi
          echo V89_PRESERVED_CHAIN_COMPLETED_PRE_RESULT

      - name: Upload V89 frozen PRE-RESULT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-worker-module-v89-evidence
          if-no-files-found: error
          retention-days: 90
          path: |
            fetched-*/
            artifacts-*/
            bootstrap*/
            evidence/
