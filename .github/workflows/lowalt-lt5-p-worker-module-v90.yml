name: LowAlt LT5 P Worker Module V84 Corrected SHA Value Locus V90

on:
  push:
    branches: [review/lowalt-lt5-p-worker-module-v90-20260920]
    paths: [.github/workflows/lowalt-lt5-p-worker-module-v90.yml]

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  v84-corrected-sha-value-locus:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Repair only V84 corrected SHA value authority locus
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p fetched-v90 artifacts-v90 bootstrap-v90 evidence/v90-v84-corrected-sha-value-locus
          api_get(){ curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$1" -o "$2"; }
          R=https://api.github.com/repos/search-maker/twilight-mystic-experiments
          api_get "$R/issues/comments/5749042398" fetched-v90/coordinator.json
          api_get "$R/issues/comments/5749037713" fetched-v90/v89-checkpoint.json
          api_get "$R/contents/.github/workflows/lowalt-lt5-p-worker-module-v89.yml?ref=7b459ec52e4a13e1e98efb3b9ae4e8c7eea85fb1" fetched-v90/v89-workflow.json
          api_get "$R/actions/runs/35502377223" fetched-v90/v89-run.json
          api_get "$R/actions/jobs/106056327155" fetched-v90/v89-job.json
          api_get "$R/actions/artifacts/10601964712" fetched-v90/v89-artifact.json
          curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$R/actions/jobs/106056327155/logs" -o fetched-v90/v89-job.log
          curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$R/actions/artifacts/10601964712/zip" -o artifacts-v90/v89.zip
          api_get "$R/branches/main" fetched-v90/main.json
          api_get "$R/compare/6cd7c075766fe0c86bc7561ec205a3f9120fd1fb...${GITHUB_SHA}" fetched-v90/main-to-v90.json

          python3 - <<'PY'
          import base64,difflib,hashlib,io,json,zipfile
          from pathlib import Path
          O=Path('evidence/v90-v84-corrected-sha-value-locus'); O.mkdir(parents=True,exist_ok=True)
          MAIN='6cd7c075766fe0c86bc7561ec205a3f9120fd1fb'; COORD=5749042398; V89C=5749037713
          V89H='7b459ec52e4a13e1e98efb3b9ae4e8c7eea85fb1'; V89T='90146ae1763b754430e4302e7e8bce2d52c290a7'; V89B='082fb73ba3de4d70af2052c47ef6fcae206feef8'; V89R=35502377223; V89J=106056327155; V89A=10601964712; V89AS='bc8b0badf37d19c6a63ae5fec73e4df7dedcedb0018ea8b7b0e2263e8329759e'; V89AZ=6694184
          V87H='810515a3fff81f25223b3605036021ed603b954a'
          CHILD='bootstrap-v89/v87-run-patched-v89.sh'; CHILDSHA='e2bee9393bd1a8d6e0ef2c3b5c93e1923286bf27ea339cd8d986360885d8ba7c'; AFTERSHA='aedb90cce3eeb4cd5082ecf18020d6e2f1d5595c5a31424e6fbedbd5f40edf27'; DIFFSHA='5600daf10a83ddcfd93e4b1cc5a26a34bdc6f023f161ab3be0e946a86742547e'
          V84OWNER='fetched-v87/v84-coordinator.json'; V84C=5748531112; V83OWNER='fetched-v87/v83-checkpoint.json'; V83C=5748523833
          V79B='fcbaabf4ee2797d813f60897bd6c29ecb8e81fa5'; V79S='f0e8aceefb9e574cde3bf672028b4898af448935ae0181f17766eddc0880fafb'; BADGEN='2b090a436c19561e9558750b99e798b17426c91fce1ea79d4389c3fabe182ac8'
          CT='9d1f9817c71f9873052b1e0735de3285588d18a2789ee22b1addca9336078d3f'; CM='c6be26dc8da045cb4199a1bf7b58a6eb0a4974c306e95b11a1fa58ca9f80ab89'
          H=lambda b:hashlib.sha256(b).hexdigest(); G=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          def j(p): return json.loads(Path(p).read_text())
          def body(p,i):
              x=j(p)
              if x.get('id')!=i or x.get('user',{}).get('login')!='search-maker': raise SystemExit('V90_BIND_FAIL comment '+str(i))
              return x.get('body','')
          def wf(p,b):
              x=j(p); d=base64.b64decode(x['content'])
              if x.get('sha')!=b or G(d)!=b: raise SystemExit('V90_BIND_FAIL workflow '+p)
              return d
          cb=body('fetched-v90/coordinator.json',COORD)
          for x in ['AUTHORIZED: exactly ONE fresh LowAlt PRE-RESULT V90 identity','V90 may repair ONLY this preserved-V87 V84-Coordinator corrected-SHA value-locus defect','V84_CORRECTED_SHA_VALUE_AUTHORITY_LOCUS_GATE_PASS',CHILDSHA,AFTERSHA,DIFFSHA,V79B,V79S,BADGEN,CT,CM,'No V91 absent later direct Coordinator transition']:
              if x not in cb: raise SystemExit('V90_BIND_FAIL authority '+x)
          cp=body('fetched-v90/v89-checkpoint.json',V89C)
          for x in [V89H,V89T,V89B,str(V89R),str(V89J),str(V89A),V89AS,str(V89AZ),'V84_OWNER_LITERAL_CARDINALITY_REPRESENTATION_GATE_PASS','V87_LOCUS_FAIL V84 owner context '+CT,'V89 IS TERMINAL/SPENT/FROZEN FOREVER']:
              if x not in cp: raise SystemExit('V90_BIND_FAIL V89 checkpoint '+x)
          wf('fetched-v90/v89-workflow.json',V89B)
          rr=j('fetched-v90/v89-run.json'); jj=j('fetched-v90/v89-job.json'); aa=j('fetched-v90/v89-artifact.json')
          if rr.get('id')!=V89R or rr.get('run_attempt')!=1 or rr.get('conclusion')!='failure' or rr.get('head_sha')!=V89H or rr.get('head_commit',{}).get('tree_id')!=V89T: raise SystemExit('V90_BIND_FAIL V89 run')
          if jj.get('id')!=V89J or jj.get('conclusion')!='failure': raise SystemExit('V90_BIND_FAIL V89 job')
          if aa.get('id')!=V89A or aa.get('digest')!='sha256:'+V89AS or aa.get('size_in_bytes')!=V89AZ or aa.get('expired'): raise SystemExit('V90_BIND_FAIL V89 artifact')
          log=Path('fetched-v90/v89-job.log').read_text(errors='replace')
          if 'V84_OWNER_LITERAL_CARDINALITY_REPRESENTATION_GATE_PASS' not in log or ('V87_LOCUS_FAIL V84 owner context '+CT) not in log: raise SystemExit('V90_BIND_FAIL V89 gate/first-false log')
          z=Path('artifacts-v90/v89.zip').read_bytes()
          if len(z)!=V89AZ or H(z)!=V89AS: raise SystemExit('V90_BIND_FAIL V89 artifact transport')
          with zipfile.ZipFile(io.BytesIO(z)) as zz:
              ns=[i.filename for i in zz.infolist() if not i.is_dir()]
              for p in [CHILD,V84OWNER,V83OWNER]:
                  if ns.count(p)!=1: raise SystemExit('V90_BIND_FAIL target member cardinality '+p)
              before_b=zz.read(CHILD); c84raw=zz.read(V84OWNER); c83raw=zz.read(V83OWNER)
          if H(before_b)!=CHILDSHA: raise SystemExit('V90_BIND_FAIL preserved V87 child SHA')
          c84j=json.loads(c84raw.decode()); c83j=json.loads(c83raw.decode())
          if c84j.get('id')!=V84C or c84j.get('user',{}).get('login')!='search-maker': raise SystemExit('V90_LOCUS_FAIL V84 owner identity')
          if c83j.get('id')!=V83C or c83j.get('user',{}).get('login')!='search-maker': raise SystemExit('V90_LOCUS_FAIL V83 owner identity')
          c84=c84j.get('body',''); c83=c83j.get('body','')
          if c84.count(CT)!=0 or c84.count(CM)!=0: raise SystemExit('V90_LOCUS_FAIL V84 corrected SHA presence')
          if c84.count(V79S)!=2 or c84.count(BADGEN)!=1 or c84.count(V79B)<1: raise SystemExit('V90_LOCUS_FAIL V84 member/workflow identity cardinality')
          for x in ['bootstrap-v81/v79-run-patched-v81.sh','bootstrap-v79/v72-run-patched-v79.sh',V79B,V79S,BADGEN]:
              if x not in c84: raise SystemExit('V90_LOCUS_FAIL V84 scope/member context '+x)
          if c83.count(CT)!=1 or c83.count(CM)!=3 or c83.count(V79B)!=1: raise SystemExit('V90_LOCUS_FAIL V83 inherited value cardinality')
          for x in ['V82_DIFF_ASSERTION_ORDER_GATE_PASS','V72_CHILD_HEAD_CONTEXT_GATE_PASS',V79B,CT,CM]:
              if x not in c83: raise SystemExit('V90_LOCUS_FAIL V83 preserved requirement '+x)
          main=j('fetched-v90/main.json')
          if main.get('commit',{}).get('sha')!=MAIN: raise SystemExit('V90_BIND_FAIL main drift')
          comp=j('fetched-v90/main-to-v90.json'); fs=comp.get('files') or []
          if comp.get('base_commit',{}).get('sha')!=MAIN or len(fs)!=1 or fs[0].get('filename')!='.github/workflows/lowalt-lt5-p-worker-module-v90.yml' or fs[0].get('status')!='added': raise SystemExit('V90_BIND_FAIL V90 branch scope')
          before=before_b.decode()
          old="for x in ['bootstrap-v81/v79-run-patched-v81.sh','bootstrap-v79/v72-run-patched-v79.sh',V79B,CT,CM]:"
          new="for x in ['bootstrap-v81/v79-run-patched-v81.sh','bootstrap-v79/v72-run-patched-v79.sh',V79B]:"
          preserved="for x in ['V82_DIFF_ASSERTION_ORDER_GATE_PASS','V72_CHILD_HEAD_CONTEXT_GATE_PASS',V79B,CT,CM]:"
          if before.count(old)!=1 or before.count(new)!=0 or before.count(preserved)!=1: raise SystemExit('V90_PATCH_FAIL predicate cardinality')
          after=before.replace(old,new,1)
          if after.count(old)!=0 or after.count(new)!=1 or after.count(preserved)!=1 or after.replace(new,old,1)!=before: raise SystemExit('V90_PATCH_FAIL nonlocal patch')
          diff=''.join(difflib.unified_diff(before.splitlines(True),after.splitlines(True),fromfile='v87-run-patched-v89.sh',tofile='v87-run-patched-v90.sh',n=3))
          payload=[x for x in diff.splitlines() if (x.startswith('+') and not x.startswith('+++')) or (x.startswith('-') and not x.startswith('---'))]
          if payload!=['-'+old,'+'+new]: raise SystemExit('V90_PATCH_FAIL diff payload')
          if H(after.encode())!=AFTERSHA or H(diff.encode())!=DIFFSHA: raise SystemExit('V90_PATCH_FAIL frozen hash')
          Path('bootstrap-v90/v87-run-patched-v90.sh').write_text(after)
          Path(O/'v89-to-v90-value-locus.diff').write_text(diff)
          rec={'status':'V84_CORRECTED_SHA_VALUE_AUTHORITY_LOCUS_GATE_PASS','v84_owner_comment':V84C,'v83_value_owner_checkpoint':V83C,'v84_ct_count':c84.count(CT),'v84_cm_count':c84.count(CM),'v83_ct_count':c83.count(CT),'v83_cm_count':c83.count(CM),'preserved_v87_before_sha256':H(before_b),'preserved_v87_after_sha256':H(after.encode()),'diff_sha256':H(diff.encode()),'diff_payload':payload,'scientific_script_mutation':False,'source_defined_transport_mutation':False,'b_selected':False,'b_resolved':False}
          Path(O/'corrected-sha-value-authority-locus-receipt.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n')
          Path(O/'V84_CORRECTED_SHA_VALUE_AUTHORITY_LOCUS_GATE_PASS').write_text('PASS V84 owns scope/member recipe; V83 owns inherited corrected values CT/CM\n')
          PY

          bash -n bootstrap-v90/v87-run-patched-v90.sh
          echo V84_CORRECTED_SHA_VALUE_AUTHORITY_LOCUS_GATE_PASS
          set +e
          GITHUB_SHA=810515a3fff81f25223b3605036021ed603b954a bash bootstrap-v90/v87-run-patched-v90.sh >evidence/v90-v84-corrected-sha-value-locus/preserved-v87-child.stdout 2>evidence/v90-v84-corrected-sha-value-locus/preserved-v87-child.stderr
          RC=$?
          set -e
          printf '%s\n' "$RC" > evidence/v90-v84-corrected-sha-value-locus/preserved-v87-child.exit-code.txt
          if [ "$RC" -ne 0 ]; then
            echo "V90_PRESERVED_V87_FIRST_FALSE rc=$RC" >&2
            tail -n 3400 evidence/v90-v84-corrected-sha-value-locus/preserved-v87-child.stderr >&2 || true
            exit "$RC"
          fi
          echo V90_PRESERVED_CHAIN_COMPLETED_PRE_RESULT

      - name: Upload V90 frozen PRE-RESULT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-worker-module-v90-evidence
          if-no-files-found: error
          retention-days: 90
          path: |
            fetched-*/
            artifacts-*/
            bootstrap*/
            evidence/
