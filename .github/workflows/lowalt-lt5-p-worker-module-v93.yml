name: LowAlt LT5 P Worker Module V92 Hash Value Cardinality Assertion V93

on:
  push:
    branches: [review/lowalt-lt5-p-worker-module-v93-20260920]
    paths: [.github/workflows/lowalt-lt5-p-worker-module-v93.yml]

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  v92-hash-value-cardinality-assertion:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Repair only V92 hash value cardinality assertion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p fetched-v93 artifacts-v93 bootstrap-v93 evidence/v93-v92-hash-value-cardinality-assertion
          api_get(){ curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$1" -o "$2"; }
          R=https://api.github.com/repos/search-maker/twilight-mystic-experiments
          api_get "$R/issues/comments/5749321229" fetched-v93/coordinator.json
          api_get "$R/contents/.github/workflows/lowalt-lt5-p-worker-module-v92.yml?ref=1b94ff8e8d9869c0b61d8ee491b185b13580a9f0" fetched-v93/v92-workflow.json
          api_get "$R/actions/runs/35505960376" fetched-v93/v92-run.json
          api_get "$R/actions/jobs/106065706465" fetched-v93/v92-job.json
          api_get "$R/actions/artifacts/10603604184" fetched-v93/v92-artifact.json
          curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$R/actions/jobs/106065706465/logs" -o fetched-v93/v92-job.log
          curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$R/actions/artifacts/10603604184/zip" -o artifacts-v93/v92.zip
          api_get "$R/branches/main" fetched-v93/main.json
          api_get "$R/compare/6cd7c075766fe0c86bc7561ec205a3f9120fd1fb...${GITHUB_SHA}" fetched-v93/main-to-v93.json

          python3 - <<'PY'
          import base64,difflib,hashlib,io,json,zipfile
          from pathlib import Path
          O=Path('evidence/v93-v92-hash-value-cardinality-assertion'); O.mkdir(parents=True,exist_ok=True)
          MAIN='6cd7c075766fe0c86bc7561ec205a3f9120fd1fb'
          AUTH=5749321229
          V92H='1b94ff8e8d9869c0b61d8ee491b185b13580a9f0'; V92T='dbd170e3b549009199e7cf3290e71c214a5d62ef'; V92B='7a66d463a424665133fcc1f967909ea647d97135'
          V92R=35505960376; V92J=106065706465; V92A=10603604184; V92AS='80442f5149f68d7f949dd0bc6190040862b30de2bb276c0b9c14a96d4d27c5b9'; V92AZ=6806670
          H=lambda b:hashlib.sha256(b).hexdigest()
          G=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          def j(p): return json.loads(Path(p).read_text())
          def body(p,i):
              x=j(p)
              if x.get('id')!=i or x.get('user',{}).get('login')!='search-maker': raise SystemExit('V93_BIND_FAIL comment '+str(i))
              return x.get('body','')
          def wf(p,b):
              x=j(p); d=base64.b64decode(x['content'])
              if x.get('sha')!=b or G(d)!=b: raise SystemExit('V93_BIND_FAIL workflow')
              return d
          def runpart(d):
              ls=d.splitlines(keepends=True); m=b'        run: |\n'
              if ls.count(m)!=1: raise SystemExit('V93_BIND_FAIL run marker')
              out=[]
              for q in ls[ls.index(m)+1:]:
                  if q.strip() and not q.startswith(b'          '): break
                  out.append(q[10:] if q.startswith(b'          ') else q)
              return b''.join(out)

          auth=body('fetched-v93/coordinator.json',AUTH)
          for x in ['COORDINATOR::LOWALT_V93_V92_HASH_VALUE_VS_VARIABLE_TOKEN_CARDINALITY_ASSERTION_SUCCESSOR_AUTHORIZED__SCIENCE_PRODUCTION_FALSE','AUTHORIZED: exactly ONE fresh LowAlt PRE-RESULT V93 identity','V93 may repair ONLY this V92 hash-value-vs-variable-token cardinality assertion.','V92_HASH_VALUE_CARDINALITY_ASSERTION_GATE_PASS','No V94 absent later direct Coordinator transition.']:
              if x not in auth: raise SystemExit('V93_BIND_FAIL authority '+x)

          v92=wf('fetched-v93/v92-workflow.json',V92B)
          rr=j('fetched-v93/v92-run.json'); jj=j('fetched-v93/v92-job.json'); aa=j('fetched-v93/v92-artifact.json')
          if rr.get('id')!=V92R or rr.get('run_attempt')!=1 or rr.get('conclusion')!='failure' or rr.get('head_sha')!=V92H or rr.get('head_commit',{}).get('tree_id')!=V92T: raise SystemExit('V93_BIND_FAIL V92 run')
          if jj.get('id')!=V92J or jj.get('conclusion')!='failure': raise SystemExit('V93_BIND_FAIL V92 job')
          if aa.get('id')!=V92A or aa.get('digest')!='sha256:'+V92AS or aa.get('size_in_bytes')!=V92AZ or aa.get('expired'): raise SystemExit('V93_BIND_FAIL V92 artifact')
          log=Path('fetched-v93/v92-job.log').read_text(errors='replace')
          ff='V92_PATCH_FAIL hash cardinality drift'
          executed=[ln for ln in log.splitlines() if ln.rstrip().endswith(' '+ff)]
          if len(executed)!=1: raise SystemExit('V93_BIND_FAIL V92 first-false execution count='+str(len(executed)))
          z=Path('artifacts-v93/v92.zip').read_bytes()
          if len(z)!=V92AZ or H(z)!=V92AS: raise SystemExit('V93_BIND_FAIL V92 artifact transport')
          with zipfile.ZipFile(io.BytesIO(z)) as zz:
              ns=[i.filename for i in zz.infolist() if not i.is_dir()]
              if not any(n.startswith('fetched-v92/') for n in ns): raise SystemExit('V93_BIND_FAIL V92 artifact inventory')

          run=runpart(v92); text=run.decode()
          old="if patched.count(AFTER)!=text.count(AFTER) or patched.count(DIFF)!=text.count(DIFF) or patched.count(BEFORE)!=text.count(BEFORE)+1:"
          new="if patched.count(AFTER)!=text.count(AFTER) or patched.count(DIFF)!=text.count(DIFF) or patched.count(BEFORE)!=text.count(BEFORE):"
          raise_line="    raise SystemExit('V92_PATCH_FAIL hash cardinality drift')"
          if text.count(old)!=1 or text.count(new)!=0 or text.count(raise_line)!=1: raise SystemExit('V93_PATCH_FAIL precondition')
          patched=text.replace(old,new,1)
          if patched.count(old)!=0 or patched.count(new)!=1 or patched.count(raise_line)!=1 or patched.replace(new,old,1)!=text: raise SystemExit('V93_PATCH_FAIL inverse reconstruction')
          diff=''.join(difflib.unified_diff(text.splitlines(True),patched.splitlines(True),fromfile='v92-run.sh',tofile='v92-run-patched-v93.sh',n=3))
          payload=[x for x in diff.splitlines() if (x.startswith('+') and not x.startswith('+++')) or (x.startswith('-') and not x.startswith('---'))]
          if payload!=['-'+old,'+'+new]: raise SystemExit('V93_PATCH_FAIL diff payload '+repr(payload))
          for marker in ['V91_AUTHORITY_LITERAL_CARDINALITY_REPRESENTATION_GATE_PASS','V92_PRESERVED_V91_FIRST_FALSE','V92_PRESERVED_CHAIN_COMPLETED_PRE_RESULT']:
              if patched.count(marker)!=text.count(marker): raise SystemExit('V93_PATCH_FAIL chain marker drift '+marker)
          main=j('fetched-v93/main.json')
          if main.get('commit',{}).get('sha')!=MAIN: raise SystemExit('V93_BIND_FAIL main drift')
          comp=j('fetched-v93/main-to-v93.json'); fs=comp.get('files') or []
          if comp.get('base_commit',{}).get('sha')!=MAIN or len(fs)!=1 or fs[0].get('filename')!='.github/workflows/lowalt-lt5-p-worker-module-v93.yml' or fs[0].get('status')!='added': raise SystemExit('V93_BIND_FAIL V93 branch scope')

          Path('bootstrap-v93/v92-run-patched-v93.sh').write_text(patched)
          Path(O/'v92-to-v93-hash-value-cardinality-assertion.diff').write_text(diff)
          rec={'schema':1,'status':'V92_HASH_VALUE_CARDINALITY_ASSERTION_GATE_PASS','authority_comment':AUTH,'v92_head':V92H,'v92_tree':V92T,'v92_workflow_blob':V92B,'v92_run':V92R,'v92_job':V92J,'v92_artifact':V92A,'v92_artifact_sha256':V92AS,'before_run_sha256':H(run),'after_run_sha256':H(patched.encode()),'diff_sha256':H(diff.encode()),'diff_payload':payload,'first_false_execution_line':executed[0],'scientific_script_mutation':False,'source_defined_transport_mutation':False,'b_selected':False,'b_resolved':False}
          Path(O/'hash-value-cardinality-assertion-receipt.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n')
          Path(O/'V92_HASH_VALUE_CARDINALITY_ASSERTION_GATE_PASS').write_text('PASS hash literal cardinality preserved; variable-token assertion repaired\n')
          PY

          bash -n bootstrap-v93/v92-run-patched-v93.sh
          echo V92_HASH_VALUE_CARDINALITY_ASSERTION_GATE_PASS
          set +e
          GITHUB_SHA=1b94ff8e8d9869c0b61d8ee491b185b13580a9f0 bash bootstrap-v93/v92-run-patched-v93.sh >evidence/v93-v92-hash-value-cardinality-assertion/preserved-v92-child.stdout 2>evidence/v93-v92-hash-value-cardinality-assertion/preserved-v92-child.stderr
          RC=$?
          set -e
          printf '%s\n' "$RC" > evidence/v93-v92-hash-value-cardinality-assertion/preserved-v92-child.exit-code.txt
          if [ "$RC" -ne 0 ]; then
            echo "V93_PRESERVED_V92_FIRST_FALSE rc=$RC" >&2
            tail -n 5000 evidence/v93-v92-hash-value-cardinality-assertion/preserved-v92-child.stderr >&2 || true
            exit "$RC"
          fi
          echo V93_PRESERVED_CHAIN_COMPLETED_PRE_RESULT

      - name: Upload V93 frozen PRE-RESULT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-worker-module-v93-evidence
          if-no-files-found: error
          retention-days: 90
          path: |
            fetched-*/
            artifacts-*/
            bootstrap*/
            evidence/
