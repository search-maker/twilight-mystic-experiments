name: LowAlt LT5 P Worker Module V91 P2 Literal Reuse Cardinality V94

on:
  push:
    branches: [review/lowalt-lt5-p-worker-module-v94-20260920]
    paths: [.github/workflows/lowalt-lt5-p-worker-module-v94.yml]

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  v91-p2-literal-reuse-cardinality:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Repair only V91 p2 literal reuse cardinality
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p fetched-v94 artifacts-v94 bootstrap-v94 evidence/v94-v91-p2-literal-reuse-cardinality
          api_get(){ curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$1" -o "$2"; }
          R=https://api.github.com/repos/search-maker/twilight-mystic-experiments
          api_get "$R/issues/comments/5749346749" fetched-v94/coordinator.json
          api_get "$R/contents/.github/workflows/lowalt-lt5-p-worker-module-v93.yml?ref=5d0bbae08aaec81c158846779bdf3c658d7c07d9" fetched-v94/v93-workflow.json
          api_get "$R/actions/runs/35506194444" fetched-v94/v93-run.json
          api_get "$R/actions/jobs/106066312631" fetched-v94/v93-job.json
          api_get "$R/actions/artifacts/10603429784" fetched-v94/v93-artifact.json
          curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$R/actions/jobs/106066312631/logs" -o fetched-v94/v93-job.log
          curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$R/actions/artifacts/10603429784/zip" -o artifacts-v94/v93.zip
          api_get "$R/contents/.github/workflows/lowalt-lt5-p-worker-module-v91.yml?ref=0ab2716f61c1bf3739025080cbf1f12917bf92cf" fetched-v94/v91-workflow.json
          api_get "$R/contents/.github/workflows/lowalt-lt5-p-worker-module-v90.yml?ref=08440aff21d69b21706b6dfc0ca6df71063605bc" fetched-v94/v90-workflow.json
          api_get "$R/branches/main" fetched-v94/main.json
          api_get "$R/compare/6cd7c075766fe0c86bc7561ec205a3f9120fd1fb...${GITHUB_SHA}" fetched-v94/main-to-v94.json

          python3 - <<'PY'
          import base64,difflib,hashlib,io,json,zipfile
          from pathlib import Path
          O=Path('evidence/v94-v91-p2-literal-reuse-cardinality'); O.mkdir(parents=True,exist_ok=True)
          MAIN='6cd7c075766fe0c86bc7561ec205a3f9120fd1fb'; AUTH=5749346749
          V93H='5d0bbae08aaec81c158846779bdf3c658d7c07d9'; V93T='22636f68733809b50018205c028b3bab9b0a9c7d'; V93B='50bedfd47868e1e67ed11cee92190cf6bfa7ecc0'
          V93R=35506194444; V93J=106066312631; V93A=10603429784; V93AS='2092579e7459a03866f9e18b3cf55c323c9368869c123df7e24d77bf730005f0'; V93AZ=20426279
          V91H='0ab2716f61c1bf3739025080cbf1f12917bf92cf'; V91B='0f9e76ed52345853b20d085109662cba4fbf7488'
          V90H='08440aff21d69b21706b6dfc0ca6df71063605bc'; V90B='664ea10379cc19a15d2e4a978faedf196af3ea7f'
          H=lambda b:hashlib.sha256(b).hexdigest()
          G=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          def j(p): return json.loads(Path(p).read_text())
          def body(p,i):
              x=j(p)
              if x.get('id')!=i or x.get('user',{}).get('login')!='search-maker': raise SystemExit('V94_BIND_FAIL comment '+str(i))
              return x.get('body','')
          def wf(p,b):
              x=j(p); d=base64.b64decode(x['content'])
              if x.get('sha')!=b or G(d)!=b: raise SystemExit('V94_BIND_FAIL workflow '+p)
              return d
          def runpart(d):
              ls=d.splitlines(keepends=True); m=b'        run: |\n'
              if ls.count(m)!=1: raise SystemExit('V94_BIND_FAIL run marker')
              out=[]
              for q in ls[ls.index(m)+1:]:
                  if q.strip() and not q.startswith(b'          '): break
                  out.append(q[10:] if q.startswith(b'          ') else q)
              return b''.join(out)

          auth=body('fetched-v94/coordinator.json',AUTH)
          for x in ['COORDINATOR::LOWALT_V94_V93_V91_P2_LITERAL_REUSE_CARDINALITY_SUCCESSOR_AUTHORIZED__SCIENCE_PRODUCTION_FALSE','AUTHORIZED: exactly ONE fresh LowAlt PRE-RESULT V94 identity','V94 may repair ONLY the two V91 `p2` cardinality assertions from `!=1` to `!=2`.','V91_P2_LITERAL_REUSE_CARDINALITY_GATE_PASS','No V95 absent later direct Coordinator transition.']:
              if x not in auth: raise SystemExit('V94_BIND_FAIL authority '+x)

          v93=wf('fetched-v94/v93-workflow.json',V93B); v91=wf('fetched-v94/v91-workflow.json',V91B); v90=wf('fetched-v94/v90-workflow.json',V90B)
          rr=j('fetched-v94/v93-run.json'); jj=j('fetched-v94/v93-job.json'); aa=j('fetched-v94/v93-artifact.json')
          if rr.get('id')!=V93R or rr.get('run_attempt')!=1 or rr.get('conclusion')!='failure' or rr.get('head_sha')!=V93H or rr.get('head_commit',{}).get('tree_id')!=V93T: raise SystemExit('V94_BIND_FAIL V93 run')
          if jj.get('id')!=V93J or jj.get('conclusion')!='failure': raise SystemExit('V94_BIND_FAIL V93 job')
          if aa.get('id')!=V93A or aa.get('digest')!='sha256:'+V93AS or aa.get('size_in_bytes')!=V93AZ or aa.get('expired'): raise SystemExit('V94_BIND_FAIL V93 artifact')
          z=Path('artifacts-v94/v93.zip').read_bytes()
          if len(z)!=V93AZ or H(z)!=V93AS: raise SystemExit('V94_BIND_FAIL V93 artifact transport')
          with zipfile.ZipFile(io.BytesIO(z)) as zz:
              if 'evidence/v93-v92-hash-value-cardinality-assertion/V92_HASH_VALUE_CARDINALITY_ASSERTION_GATE_PASS' not in [i.filename for i in zz.infolist() if not i.is_dir()]: raise SystemExit('V94_BIND_FAIL V93 gate artifact member')
          log=Path('fetched-v94/v93-job.log').read_text(errors='replace')
          expected_exec=['V92_HASH_VALUE_CARDINALITY_ASSERTION_GATE_PASS','V93_PRESERVED_V92_FIRST_FALSE rc=1','V92_PRESERVED_V91_FIRST_FALSE rc=1','V91_PATCH_FAIL predicate cardinality']
          for x in expected_exec:
              lines=[ln for ln in log.splitlines() if ln.rstrip().endswith(' '+x)]
              if len(lines)!=1: raise SystemExit('V94_BIND_FAIL V93 execution chain '+x+' count='+str(len(lines)))

          r91=runpart(v91); t91=r91.decode(); r90=runpart(v90); t90=r90.decode()
          old="for x in ['AUTHORIZED: exactly ONE fresh LowAlt PRE-RESULT V90 identity','V90 may repair ONLY this preserved-V87 V84-Coordinator corrected-SHA value-locus defect','V84_CORRECTED_SHA_VALUE_AUTHORITY_LOCUS_GATE_PASS',CHILDSHA,AFTERSHA,DIFFSHA,V79B,V79S,BADGEN,CT,CM,'No V91 absent later direct Coordinator transition']:"
          new="for x in ['AUTHORIZED: exactly ONE fresh LowAlt PRE-RESULT V90 identity','V90 may repair ONLY this preserved-V87 V84-Coordinator corrected-SHA value-locus defect','V84_CORRECTED_SHA_VALUE_AUTHORITY_LOCUS_GATE_PASS',CHILDSHA,AFTERSHA,DIFFSHA,V79B,V79S,BADGEN,CT,'No V91 absent later direct Coordinator transition']:"
          p1="if c83.count(CT)!=1 or c83.count(CM)!=3 or c83.count(V79B)!=1: raise SystemExit('V90_LOCUS_FAIL V83 inherited value cardinality')"
          p2="for x in ['V82_DIFF_ASSERTION_ORDER_GATE_PASS','V72_CHILD_HEAD_CONTEXT_GATE_PASS',V79B,CT,CM]:"
          preserved='preserved="'+p2+'"'
          executable=p2+"\n    if x not in c83: raise SystemExit('V90_LOCUS_FAIL V83 preserved requirement '+x)"
          if (t90.count(old),t90.count(new),t90.count(p1),t90.count(p2))!=(1,0,1,2): raise SystemExit('V94_CARDINALITY_FAIL V90 '+repr((t90.count(old),t90.count(new),t90.count(p1),t90.count(p2))))
          if t90.count(preserved)!=1 or t90.count(executable)!=1: raise SystemExit('V94_CONTEXT_FAIL V90 p2 contexts')

          old_pre="if text.count(old)!=1 or text.count(new)!=0 or text.count(p1)!=1 or text.count(p2)!=1:"
          new_pre="if text.count(old)!=1 or text.count(new)!=0 or text.count(p1)!=1 or text.count(p2)!=2:"
          old_post="if patched.count(old)!=0 or patched.count(new)!=1 or patched.count(p1)!=1 or patched.count(p2)!=1 or patched.replace(new,old,1)!=text:"
          new_post="if patched.count(old)!=0 or patched.count(new)!=1 or patched.count(p1)!=1 or patched.count(p2)!=2 or patched.replace(new,old,1)!=text:"
          if t91.count(old_pre)!=1 or t91.count(new_pre)!=0 or t91.count(old_post)!=1 or t91.count(new_post)!=0: raise SystemExit('V94_PATCH_FAIL precondition')
          patched=t91.replace(old_pre,new_pre,1).replace(old_post,new_post,1)
          if patched.count(old_pre)!=0 or patched.count(new_pre)!=1 or patched.count(old_post)!=0 or patched.count(new_post)!=1: raise SystemExit('V94_PATCH_FAIL postcondition')
          if patched.replace(new_pre,old_pre,1).replace(new_post,old_post,1)!=t91: raise SystemExit('V94_PATCH_FAIL inverse reconstruction')
          diff=''.join(difflib.unified_diff(t91.splitlines(True),patched.splitlines(True),fromfile='v91-run.sh',tofile='v91-run-patched-v94.sh',n=3))
          payload=[x for x in diff.splitlines() if (x.startswith('+') and not x.startswith('+++')) or (x.startswith('-') and not x.startswith('---'))]
          if payload!=['-'+old_pre,'+'+new_pre,'-'+old_post,'+'+new_post]: raise SystemExit('V94_PATCH_FAIL diff payload '+repr(payload))

          main=j('fetched-v94/main.json')
          if main.get('commit',{}).get('sha')!=MAIN: raise SystemExit('V94_BIND_FAIL main drift')
          comp=j('fetched-v94/main-to-v94.json'); fs=comp.get('files') or []
          if comp.get('base_commit',{}).get('sha')!=MAIN or len(fs)!=1 or fs[0].get('filename')!='.github/workflows/lowalt-lt5-p-worker-module-v94.yml' or fs[0].get('status')!='added': raise SystemExit('V94_BIND_FAIL V94 branch scope')

          Path('bootstrap-v94/v91-run-patched-v94.sh').write_text(patched)
          Path(O/'v91-to-v94-p2-cardinality.diff').write_text(diff)
          rec={'schema':1,'status':'V91_P2_LITERAL_REUSE_CARDINALITY_GATE_PASS','authority_comment':AUTH,'v93_head':V93H,'v93_tree':V93T,'v93_workflow_blob':V93B,'v93_run':V93R,'v93_job':V93J,'v93_artifact':V93A,'v93_artifact_sha256':V93AS,'v91_head':V91H,'v91_workflow_blob':V91B,'v90_head':V90H,'v90_workflow_blob':V90B,'v90_old_count':t90.count(old),'v90_new_count':t90.count(new),'v90_p1_count':t90.count(p1),'v90_p2_count':t90.count(p2),'v90_p2_executable_context_count':t90.count(executable),'v90_p2_preserved_literal_context_count':t90.count(preserved),'before_run_sha256':H(r91),'after_run_sha256':H(patched.encode()),'diff_sha256':H(diff.encode()),'diff_payload':payload,'scientific_script_mutation':False,'source_defined_transport_mutation':False,'b_selected':False,'b_resolved':False}
          Path(O/'p2-literal-reuse-cardinality-receipt.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n')
          Path(O/'V91_P2_LITERAL_REUSE_CARDINALITY_GATE_PASS').write_text('PASS V90 p2 appears exactly twice: executable loop plus preserved literal\n')
          PY

          bash -n bootstrap-v94/v91-run-patched-v94.sh
          echo V91_P2_LITERAL_REUSE_CARDINALITY_GATE_PASS
          set +e
          GITHUB_SHA=0ab2716f61c1bf3739025080cbf1f12917bf92cf bash bootstrap-v94/v91-run-patched-v94.sh >evidence/v94-v91-p2-literal-reuse-cardinality/preserved-v91-child.stdout 2>evidence/v94-v91-p2-literal-reuse-cardinality/preserved-v91-child.stderr
          RC=$?
          set -e
          printf '%s\n' "$RC" > evidence/v94-v91-p2-literal-reuse-cardinality/preserved-v91-child.exit-code.txt
          if [ "$RC" -ne 0 ]; then
            echo "V94_PRESERVED_V91_FIRST_FALSE rc=$RC" >&2
            tail -n 6000 evidence/v94-v91-p2-literal-reuse-cardinality/preserved-v91-child.stderr >&2 || true
            exit "$RC"
          fi
          echo V94_PRESERVED_CHAIN_COMPLETED_PRE_RESULT

      - name: Upload V94 frozen PRE-RESULT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-worker-module-v94-evidence
          if-no-files-found: error
          retention-days: 90
          path: |
            fetched-*/
            artifacts-*/
            bootstrap*/
            evidence/
