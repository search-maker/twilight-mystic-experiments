name: LowAlt LT5 P Worker Module V92 AST Value Binding V96

on:
  push:
    branches: [review/lowalt-lt5-p-worker-module-v96-20260920]
    paths: [.github/workflows/lowalt-lt5-p-worker-module-v96.yml]

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  v92-ast-value-binding:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Repair only V95 V92 source representation binding
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p fetched-v96 artifacts-v96 bootstrap-v96 evidence/v96-v92-ast-value-binding
          api_get(){ curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$1" -o "$2"; }
          R=https://api.github.com/repos/search-maker/twilight-mystic-experiments
          api_get "$R/issues/comments/5749428325" fetched-v96/coordinator.json
          api_get "$R/contents/.github/workflows/lowalt-lt5-p-worker-module-v95.yml?ref=e42a51211d6e4400ec32dd028f056e184abb1f1c" fetched-v96/v95-workflow.json
          api_get "$R/contents/.github/workflows/lowalt-lt5-p-worker-module-v92.yml?ref=1b94ff8e8d9869c0b61d8ee491b185b13580a9f0" fetched-v96/v92-workflow.json
          api_get "$R/contents/.github/workflows/lowalt-lt5-p-worker-module-v94.yml?ref=5ea63a6479fd75fcdff597fa3d6b84a10304c268" fetched-v96/v94-workflow.json
          api_get "$R/actions/runs/35506971175" fetched-v96/v95-run.json
          api_get "$R/actions/jobs/106068317040" fetched-v96/v95-job.json
          api_get "$R/actions/artifacts/10604750734" fetched-v96/v95-artifact.json
          curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$R/actions/artifacts/10604750734/zip" -o artifacts-v96/v95.zip
          curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$R/actions/jobs/106068317040/logs" -o fetched-v96/v95-job.log
          api_get "$R/branches/main" fetched-v96/main.json
          api_get "$R/compare/6cd7c075766fe0c86bc7561ec205a3f9120fd1fb...${GITHUB_SHA}" fetched-v96/main-to-v96.json

          python3 - <<'PY'
          import ast,base64,difflib,hashlib,json
          from pathlib import Path
          O=Path('evidence/v96-v92-ast-value-binding'); O.mkdir(parents=True,exist_ok=True)
          MAIN='6cd7c075766fe0c86bc7561ec205a3f9120fd1fb'; AUTH=5749428325
          V95H='e42a51211d6e4400ec32dd028f056e184abb1f1c'; V95T='97b06f0c4187b60257ecaa10eef9933e6e431156'; V95B='3ca2322db51ea86caae9836afbd5b8dda2ac4c94'
          V95R=35506971175; V95J=106068317040; V95A=10604750734; V95AS='81dc46d5b0ff3cba10b1cfb8bc19229f4267fc0d14a189217b3ebe2084247834'; V95AZ=34097291
          V92B='7a66d463a424665133fcc1f967909ea647d97135'; V94B='ee1d9a690da87450a40a3fb48c1b18f87dd2299a'
          H=lambda b:hashlib.sha256(b).hexdigest()
          G=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          def j(p): return json.loads(Path(p).read_text())
          def body(p,i):
              x=j(p)
              if x.get('id')!=i or x.get('user',{}).get('login')!='search-maker': raise SystemExit('V96_BIND_FAIL comment '+str(i))
              return x.get('body','')
          def wf(p,b):
              x=j(p); d=base64.b64decode(x['content'])
              if x.get('sha')!=b or G(d)!=b: raise SystemExit('V96_BIND_FAIL workflow '+p)
              return d
          def runpart(d):
              ls=d.splitlines(keepends=True); m=b'        run: |\n'
              if ls.count(m)!=1: raise SystemExit('V96_BIND_FAIL run marker')
              out=[]
              for q in ls[ls.index(m)+1:]:
                  if q.strip() and not q.startswith(b'          '): break
                  out.append(q[10:] if q.startswith(b'          ') else q)
              return b''.join(out)

          auth=body('fetched-v96/coordinator.json',AUTH)
          for x in ['COORDINATOR::LOWALT_V96_V95_V92_SOURCE_VS_RUNTIME_PATCH_PAYLOAD_BINDING_SUCCESSOR_AUTHORIZED__SCIENCE_PRODUCTION_FALSE',
                    'AUTHORIZED: exactly ONE fresh LowAlt PRE-RESULT V96 identity',
                    "V96 may repair ONLY V95's V92 accepted-repair source-binding representation check",
                    'V92_ACCEPTED_REPAIR_AST_VALUE_BINDING_GATE_PASS',
                    'No V97 absent later direct Coordinator transition.']:
              if x not in auth: raise SystemExit('V96_BIND_FAIL authority '+x)

          v95=wf('fetched-v96/v95-workflow.json',V95B)
          v92=wf('fetched-v96/v92-workflow.json',V92B)
          wf('fetched-v96/v94-workflow.json',V94B)
          rr=j('fetched-v96/v95-run.json'); jj=j('fetched-v96/v95-job.json'); aa=j('fetched-v96/v95-artifact.json')
          if rr.get('id')!=V95R or rr.get('run_attempt')!=1 or rr.get('conclusion')!='failure' or rr.get('head_sha')!=V95H or rr.get('head_commit',{}).get('tree_id')!=V95T: raise SystemExit('V96_BIND_FAIL V95 run')
          if jj.get('id')!=V95J or jj.get('conclusion')!='failure': raise SystemExit('V96_BIND_FAIL V95 job')
          if aa.get('id')!=V95A or aa.get('digest')!='sha256:'+V95AS or aa.get('size_in_bytes')!=V95AZ or aa.get('expired'): raise SystemExit('V96_BIND_FAIL V95 artifact')
          z=Path('artifacts-v96/v95.zip').read_bytes()
          if len(z)!=V95AZ or H(z)!=V95AS: raise SystemExit('V96_BIND_FAIL V95 artifact transport')
          log=Path('fetched-v96/v95-job.log').read_text(errors='replace')
          ff='V95_BIND_FAIL V92 accepted repair source'
          if log.count(ff)!=1: raise SystemExit('V96_BIND_FAIL V95 first-false execution count='+str(log.count(ff)))

          r95=runpart(v95); text=r95.decode(); r92=runpart(v92).decode()
          old_import='import base64,difflib,hashlib,io,json,zipfile'
          new_import='import ast,base64,difflib,hashlib,io,json,zipfile'
          old_bind="""for s in [old_auth,new_auth]:
    if s not in r92: raise SystemExit('V95_BIND_FAIL V92 accepted repair source')
"""
          new_bind="""h92=\"python3 - <<'PY'\\n\"; e92=\"\\nPY\\n\"
if r92.count(h92)!=1: raise SystemExit('V95_BIND_FAIL V92 python-source start marker')
tail92=r92.split(h92,1)[1]
if tail92.count(e92)!=1: raise SystemExit('V95_BIND_FAIL V92 python-source end marker')
py92=tail92.split(e92,1)[0]
tree92=ast.parse(py92)
vals92={'old':[],'new':[]}
for n in ast.walk(tree92):
    if isinstance(n,ast.Assign) and len(n.targets)==1 and isinstance(n.targets[0],ast.Name) and n.targets[0].id in vals92:
        if not isinstance(n.value,ast.Constant) or not isinstance(n.value.value,str): raise SystemExit('V95_BIND_FAIL V92 accepted repair nonconstant '+n.targets[0].id)
        vals92[n.targets[0].id].append(n.value.value)
if vals92!={'old':[old_auth],'new':[new_auth]}: raise SystemExit('V95_BIND_FAIL V92 accepted repair AST values '+repr(vals92))
"""
          counts=(text.count(old_import),text.count(new_import),text.count(old_bind),text.count(new_bind))
          if counts!=(1,0,1,0): raise SystemExit('V96_PATCH_FAIL precondition '+repr(counts))
          a=text.index(old_import); b=text.index(old_bind)
          if not (a+len(old_import)<=b or b+len(old_bind)<=a): raise SystemExit('V96_PATCH_FAIL overlap')
          patched=text.replace(old_import,new_import,1).replace(old_bind,new_bind,1)
          if patched.count(old_import)!=0 or patched.count(new_import)!=1 or patched.count(old_bind)!=0 or patched.count(new_bind)!=1: raise SystemExit('V96_PATCH_FAIL postcondition')
          if patched.replace(new_import,old_import,1).replace(new_bind,old_bind,1)!=text: raise SystemExit('V96_PATCH_FAIL inverse reconstruction')

          # Independently evaluate only the exact immutable V92 Python-source assignments through AST constants.
          h92="python3 - <<'PY'\n"; e92='\nPY\n'
          if r92.count(h92)!=1: raise SystemExit('V96_BIND_FAIL V92 python-source start cardinality')
          tail92=r92.split(h92,1)[1]
          if tail92.count(e92)!=1: raise SystemExit('V96_BIND_FAIL V92 python-source end cardinality')
          py92=tail92.split(e92,1)[0]
          tree92=ast.parse(py92)
          vals92={'old':[],'new':[]}
          for n in ast.walk(tree92):
              if isinstance(n,ast.Assign) and len(n.targets)==1 and isinstance(n.targets[0],ast.Name) and n.targets[0].id in vals92:
                  if not isinstance(n.value,ast.Constant) or not isinstance(n.value.value,str): raise SystemExit('V96_BIND_FAIL V92 assignment nonconstant')
                  vals92[n.targets[0].id].append(n.value.value)
          # Read exact V95 payload literals by parsing its inner Python source rather than executing it.
          h95="python3 - <<'PY'\n"; e95='\nPY\n'
          if text.count(h95)!=1 or text.split(h95,1)[1].count(e95)!=1: raise SystemExit('V96_BIND_FAIL V95 python-source markers')
          py95=text.split(h95,1)[1].split(e95,1)[0]
          tree95=ast.parse(py95)
          vals95={'old_auth':[],'new_auth':[]}
          for n in ast.walk(tree95):
              if isinstance(n,ast.Assign) and len(n.targets)==1 and isinstance(n.targets[0],ast.Name) and n.targets[0].id in vals95:
                  if not isinstance(n.value,ast.Constant) or not isinstance(n.value.value,str): raise SystemExit('V96_BIND_FAIL V95 payload nonconstant')
                  vals95[n.targets[0].id].append(n.value.value)
          if len(vals92['old'])!=1 or len(vals92['new'])!=1 or len(vals95['old_auth'])!=1 or len(vals95['new_auth'])!=1: raise SystemExit('V96_BIND_FAIL AST owner cardinality '+repr((vals92,vals95)))
          if vals92['old'][0]!=vals95['old_auth'][0] or vals92['new'][0]!=vals95['new_auth'][0]: raise SystemExit('V96_BIND_FAIL AST value mismatch')

          diff=''.join(difflib.unified_diff(text.splitlines(True),patched.splitlines(True),fromfile='v95-run.sh',tofile='v95-run-patched-v96.sh',n=3))
          main=j('fetched-v96/main.json'); comp=j('fetched-v96/main-to-v96.json'); fs=comp.get('files') or []
          if main.get('commit',{}).get('sha')!=MAIN: raise SystemExit('V96_BIND_FAIL main drift')
          if comp.get('base_commit',{}).get('sha')!=MAIN or len(fs)!=1 or fs[0].get('filename')!='.github/workflows/lowalt-lt5-p-worker-module-v96.yml' or fs[0].get('status')!='added': raise SystemExit('V96_BIND_FAIL branch scope')

          Path('bootstrap-v96/v95-run-patched-v96.sh').write_text(patched)
          Path(O/'v95-to-v96-ast-value-binding.diff').write_text(diff)
          rec={'schema':1,'status':'V92_ACCEPTED_REPAIR_AST_VALUE_BINDING_GATE_PASS','authority_comment':AUTH,
               'v95_head':V95H,'v95_workflow_blob':V95B,'v95_run':V95R,'v95_job':V95J,'v95_artifact':V95A,'v95_artifact_sha256':V95AS,
               'v92_workflow_blob':V92B,'v94_workflow_blob':V94B,
               'before_run_sha256':H(r95),'after_run_sha256':H(patched.encode()),'diff_sha256':H(diff.encode()),
               'v92_old_assignment_count':len(vals92['old']),'v92_new_assignment_count':len(vals92['new']),
               'ast_value_identity':True,'scientific_script_mutation':False,'source_defined_transport_mutation':False,'b_selected':False,'b_resolved':False}
          Path(O/'ast-owner-value-receipt.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n')
          Path(O/'V92_ACCEPTED_REPAIR_AST_VALUE_BINDING_GATE_PASS').write_text('PASS exact V92 old/new AST constant values equal V95 accepted payload values\n')
          PY

          bash -n bootstrap-v96/v95-run-patched-v96.sh
          echo V92_ACCEPTED_REPAIR_AST_VALUE_BINDING_GATE_PASS
          set +e
          GITHUB_SHA=e42a51211d6e4400ec32dd028f056e184abb1f1c bash bootstrap-v96/v95-run-patched-v96.sh >evidence/v96-v92-ast-value-binding/preserved-v95-child.stdout 2>evidence/v96-v92-ast-value-binding/preserved-v95-child.stderr
          RC=$?
          set -e
          printf '%s\n' "$RC" > evidence/v96-v92-ast-value-binding/preserved-v95-child.exit-code.txt
          if [ "$RC" -ne 0 ]; then
            echo "V96_PRESERVED_V95_FIRST_FALSE rc=$RC" >&2
            tail -n 6000 evidence/v96-v92-ast-value-binding/preserved-v95-child.stderr >&2 || true
            exit "$RC"
          fi
          echo V96_PRESERVED_CHAIN_COMPLETED_PRE_RESULT

      - name: Upload V96 frozen PRE-RESULT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-worker-module-v96-evidence
          if-no-files-found: error
          retention-days: 90
          path: |
            fetched-*/
            artifacts-*/
            bootstrap*/
            evidence/
