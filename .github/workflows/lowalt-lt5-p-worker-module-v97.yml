name: LowAlt LT5 P Worker Module V96 YAML Literal Serialization V97

on:
  push:
    branches: [review/lowalt-lt5-p-worker-module-v97-20260920]
    paths: [.github/workflows/lowalt-lt5-p-worker-module-v97.yml]

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  v96-yaml-literal-serialization:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Repair only V96 YAML block literal serialization
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p fetched-v97 artifacts-v97 bootstrap-v97 evidence/v97-v96-yaml-literal-serialization
          api_get(){ curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$1" -o "$2"; }
          R=https://api.github.com/repos/search-maker/twilight-mystic-experiments
          api_get "$R/issues/comments/5749456736" fetched-v97/coordinator-v97.json
          api_get "$R/issues/comments/5749428325" fetched-v97/coordinator-v96.json
          api_get "$R/contents/.github/workflows/lowalt-lt5-p-worker-module-v96.yml?ref=1b5eb7f67eba148b750070fa56701a22c93bcbeb" fetched-v97/v96-workflow.json
          api_get "$R/contents/.github/workflows/lowalt-lt5-p-worker-module-v95.yml?ref=e42a51211d6e4400ec32dd028f056e184abb1f1c" fetched-v97/v95-workflow.json
          api_get "$R/contents/.github/workflows/lowalt-lt5-p-worker-module-v92.yml?ref=1b94ff8e8d9869c0b61d8ee491b185b13580a9f0" fetched-v97/v92-workflow.json
          api_get "$R/contents/.github/workflows/lowalt-lt5-p-worker-module-v94.yml?ref=5ea63a6479fd75fcdff597fa3d6b84a10304c268" fetched-v97/v94-workflow.json
          api_get "$R/actions/runs/35507234352" fetched-v97/v96-run.json
          api_get "$R/actions/runs/35507234352/jobs?per_page=100" fetched-v97/v96-jobs.json
          api_get "$R/actions/runs/35507234352/artifacts" fetched-v97/v96-artifacts.json
          api_get "$R/actions/runs/35506971175" fetched-v97/v95-run.json
          api_get "$R/actions/jobs/106068317040" fetched-v97/v95-job.json
          api_get "$R/actions/artifacts/10604750734" fetched-v97/v95-artifact.json
          curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$R/actions/artifacts/10604750734/zip" -o artifacts-v97/v95.zip
          curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$R/actions/jobs/106068317040/logs" -o fetched-v97/v95-job.log
          api_get "$R/branches/main" fetched-v97/main.json
          api_get "$R/compare/6cd7c075766fe0c86bc7561ec205a3f9120fd1fb...${GITHUB_SHA}" fetched-v97/main-to-v97.json

          python3 - <<'PY'
          import ast,base64,difflib,hashlib,json
          from pathlib import Path
          O=Path('evidence/v97-v96-yaml-literal-serialization'); O.mkdir(parents=True,exist_ok=True)
          MAIN='6cd7c075766fe0c86bc7561ec205a3f9120fd1fb'; AUTH97=5749456736; AUTH96=5749428325
          V96H='1b5eb7f67eba148b750070fa56701a22c93bcbeb'; V96T='9d54cdb0d6e391ea0270556d2b0f3981879c43d7'; V96B='972c008497053888993e1094b990d05f428929f8'; V96R=35507234352
          V95H='e42a51211d6e4400ec32dd028f056e184abb1f1c'; V95T='97b06f0c4187b60257ecaa10eef9933e6e431156'; V95B='3ca2322db51ea86caae9836afbd5b8dda2ac4c94'
          V95R=35506971175; V95J=106068317040; V95A=10604750734; V95AS='81dc46d5b0ff3cba10b1cfb8bc19229f4267fc0d14a189217b3ebe2084247834'; V95AZ=34097291
          V92B='7a66d463a424665133fcc1f967909ea647d97135'; V94B='ee1d9a690da87450a40a3fb48c1b18f87dd2299a'
          H=lambda b:hashlib.sha256(b).hexdigest()
          G=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          def j(p): return json.loads(Path(p).read_text())
          def body(p,i):
              x=j(p)
              if x.get('id')!=i or x.get('user',{}).get('login')!='search-maker': raise SystemExit('V97_BIND_FAIL comment '+str(i))
              return x.get('body','')
          def wf(p,b):
              x=j(p); d=base64.b64decode(x['content'])
              if x.get('sha')!=b or G(d)!=b: raise SystemExit('V97_BIND_FAIL workflow '+p)
              return d
          def runpart(d):
              ls=d.splitlines(keepends=True); m=b'        run: |\n'
              if ls.count(m)!=1: raise SystemExit('V97_BIND_FAIL run marker')
              out=[]
              for q in ls[ls.index(m)+1:]:
                  if q.strip() and not q.startswith(b'          '): break
                  out.append(q[10:] if q.startswith(b'          ') else q)
              return b''.join(out)
          def raw_triple(src,name):
              marker=name+'="""'
              if src.count(marker)!=1: raise SystemExit('V97_BIND_FAIL V96 raw marker '+name+' count='+str(src.count(marker)))
              a=src.index(marker)+len(marker)
              b=src.find('"""',a)
              if b<0: raise SystemExit('V97_BIND_FAIL V96 raw closing marker '+name)
              return src[a:b],a,b
          def pyheredoc(run,tag):
              h="python3 - <<'PY'\n"; e='\nPY\n'
              if run.count(h)!=1: raise SystemExit('V97_BIND_FAIL '+tag+' python start count='+str(run.count(h)))
              tail=run.split(h,1)[1]
              if tail.count(e)!=1: raise SystemExit('V97_BIND_FAIL '+tag+' python end count='+str(tail.count(e)))
              return tail.split(e,1)[0]
          def constants(tree,names,tag):
              out={n:[] for n in names}
              for node in ast.walk(tree):
                  if isinstance(node,ast.Assign) and len(node.targets)==1 and isinstance(node.targets[0],ast.Name) and node.targets[0].id in out:
                      if not isinstance(node.value,ast.Constant) or not isinstance(node.value.value,str): raise SystemExit('V97_BIND_FAIL '+tag+' nonconstant '+node.targets[0].id)
                      out[node.targets[0].id].append(node.value.value)
              for n in names:
                  if len(out[n])!=1: raise SystemExit('V97_BIND_FAIL '+tag+' owner cardinality '+n+'='+str(len(out[n])))
              return {n:out[n][0] for n in names}

          a97=body('fetched-v97/coordinator-v97.json',AUTH97)
          for x in ['COORDINATOR::LOWALT_V97_V96_YAML_BLOCK_LITERAL_PATCH_STRING_SERIALIZATION_SUCCESSOR_AUTHORIZED__SCIENCE_PRODUCTION_FALSE',
                    'AUTHORIZED: exactly ONE fresh LowAlt PRE-RESULT V97 identity',
                    "V97 may repair ONLY V96's YAML-block serialization",
                    'V96_YAML_BLOCK_LITERAL_SERIALIZATION_GATE_PASS',
                    'No V98 absent later direct Coordinator transition.']:
              if x not in a97: raise SystemExit('V97_BIND_FAIL authority97 '+x)
          a96=body('fetched-v97/coordinator-v96.json',AUTH96)
          for x in ['COORDINATOR::LOWALT_V96_V95_V92_SOURCE_VS_RUNTIME_PATCH_PAYLOAD_BINDING_SUCCESSOR_AUTHORIZED__SCIENCE_PRODUCTION_FALSE',
                    'V92_ACCEPTED_REPAIR_AST_VALUE_BINDING_GATE_PASS']:
              if x not in a96: raise SystemExit('V97_BIND_FAIL authority96 '+x)

          v96=wf('fetched-v97/v96-workflow.json',V96B); s96=v96.decode()
          v95=wf('fetched-v97/v95-workflow.json',V95B); r95=runpart(v95); text=r95.decode()
          v92=wf('fetched-v97/v92-workflow.json',V92B); r92=runpart(v92).decode()
          wf('fetched-v97/v94-workflow.json',V94B)
          rr96=j('fetched-v97/v96-run.json'); jobs96=j('fetched-v97/v96-jobs.json'); arts96=j('fetched-v97/v96-artifacts.json')
          if rr96.get('id')!=V96R or rr96.get('run_attempt')!=1 or rr96.get('conclusion')!='failure' or rr96.get('head_sha')!=V96H or rr96.get('head_commit',{}).get('tree_id')!=V96T: raise SystemExit('V97_BIND_FAIL V96 run')
          if jobs96.get('total_count')!=0 or (jobs96.get('jobs') or []): raise SystemExit('V97_BIND_FAIL V96 jobs not zero')
          if arts96.get('total_count')!=0 or (arts96.get('artifacts') or []): raise SystemExit('V97_BIND_FAIL V96 artifacts not zero')

          old_raw,a1,b1=raw_triple(s96,'old_bind'); new_raw,a2,b2=raw_triple(s96,'new_bind')
          old_expected="for s in [old_auth,new_auth]:\n    if s not in r92: raise SystemExit('V95_BIND_FAIL V92 accepted repair source')\n"
          if old_raw!=old_expected: raise SystemExit('V97_BIND_FAIL V96 old_bind decoded value')
          if H(old_raw.encode())==H(new_raw.encode()): raise SystemExit('V97_BIND_FAIL V96 payload alias')
          # Freeze physical indentation in the exact malformed V96 regions and require actual below-block-indent continuation evidence.
          lines=s96.splitlines()
          table=[]
          for name,a,b in [('old_bind',a1,b1),('new_bind',a2,b2)]:
              start=s96[:a].count('\n')+1; end=s96[:b].count('\n')+1
              rows=[]
              for n in range(start,end+1):
                  q=lines[n-1] if 1<=n<=len(lines) else ''
                  lead=len(q)-len(q.lstrip(' '))
                  rows.append({'line':n,'leading_spaces':lead,'sha256':H(q.encode()),'nonblank':bool(q.strip())})
              table.append({'name':name,'start_line':start,'end_line':end,'rows':rows})
          bad=[r for g in table for r in g['rows'][1:] if r['nonblank'] and r['leading_spaces']<10]
          if not bad: raise SystemExit('V97_BIND_FAIL no malformed V96 continuation indentation')

          rr95=j('fetched-v97/v95-run.json'); jj95=j('fetched-v97/v95-job.json'); aa95=j('fetched-v97/v95-artifact.json')
          if rr95.get('id')!=V95R or rr95.get('run_attempt')!=1 or rr95.get('conclusion')!='failure' or rr95.get('head_sha')!=V95H or rr95.get('head_commit',{}).get('tree_id')!=V95T: raise SystemExit('V97_BIND_FAIL V95 run')
          if jj95.get('id')!=V95J or jj95.get('conclusion')!='failure': raise SystemExit('V97_BIND_FAIL V95 job')
          if aa95.get('id')!=V95A or aa95.get('digest')!='sha256:'+V95AS or aa95.get('size_in_bytes')!=V95AZ or aa95.get('expired'): raise SystemExit('V97_BIND_FAIL V95 artifact')
          z=Path('artifacts-v97/v95.zip').read_bytes()
          if len(z)!=V95AZ or H(z)!=V95AS: raise SystemExit('V97_BIND_FAIL V95 artifact transport')
          log=Path('fetched-v97/v95-job.log').read_text(errors='replace')
          if log.count('V95_BIND_FAIL V92 accepted repair source')!=1: raise SystemExit('V97_BIND_FAIL V95 first false')

          # Independently prove the V96-intended replacement semantics from immutable V95/V92 source, without eval/exec.
          p95=constants(ast.parse(pyheredoc(text,'V95')),['old_auth','new_auth'],'V95')
          p92=constants(ast.parse(pyheredoc(r92,'V92')),['old','new'],'V92')
          if p92['old']!=p95['old_auth'] or p92['new']!=p95['new_auth']: raise SystemExit('V97_BIND_FAIL AST value identity')

          old_import='import base64,difflib,hashlib,io,json,zipfile'
          new_import='import ast,base64,difflib,hashlib,io,json,zipfile'
          if text.count(old_import)!=1 or text.count(new_import)!=0 or text.count(old_expected)!=1 or text.count(new_raw)!=0: raise SystemExit('V97_PATCH_FAIL precondition')
          patched=text.replace(old_import,new_import,1).replace(old_expected,new_raw,1)
          if patched.count(old_import)!=0 or patched.count(new_import)!=1 or patched.count(old_expected)!=0 or patched.count(new_raw)!=1: raise SystemExit('V97_PATCH_FAIL postcondition')
          if patched.replace(new_import,old_import,1).replace(new_raw,old_expected,1)!=text: raise SystemExit('V97_PATCH_FAIL inverse reconstruction')
          ast.parse(pyheredoc(patched,'patched V95'))

          diff=''.join(difflib.unified_diff(text.splitlines(True),patched.splitlines(True),fromfile='v95-run.sh',tofile='v95-run-patched-v97.sh',n=3))
          main=j('fetched-v97/main.json'); comp=j('fetched-v97/main-to-v97.json'); fs=comp.get('files') or []
          if main.get('commit',{}).get('sha')!=MAIN: raise SystemExit('V97_BIND_FAIL main drift')
          if comp.get('base_commit',{}).get('sha')!=MAIN or len(fs)!=1 or fs[0].get('filename')!='.github/workflows/lowalt-lt5-p-worker-module-v97.yml' or fs[0].get('status')!='added': raise SystemExit('V97_BIND_FAIL branch scope')

          Path('bootstrap-v97/v95-run-patched-v97.sh').write_text(patched)
          Path(O/'v95-to-v97-ast-binding.diff').write_text(diff)
          Path(O/'v96-malformed-indentation-table.json').write_text(json.dumps(table,indent=2,sort_keys=True)+'\n')
          rec={'schema':1,'status':'V96_YAML_BLOCK_LITERAL_SERIALIZATION_GATE_PASS','authority_comment':AUTH97,
               'v96_head':V96H,'v96_tree':V96T,'v96_workflow_blob':V96B,'v96_run':V96R,'v96_jobs':0,'v96_artifacts':0,
               'v95_head':V95H,'v95_workflow_blob':V95B,'v92_workflow_blob':V92B,'v94_workflow_blob':V94B,
               'decoded_old_bind_sha256':H(old_raw.encode()),'decoded_new_bind_sha256':H(new_raw.encode()),
               'before_v95_run_sha256':H(r95),'after_v95_run_sha256':H(patched.encode()),'diff_sha256':H(diff.encode()),
               'malformed_continuation_rows':len(bad),'ast_value_identity':True,'scientific_script_mutation':False,'source_defined_transport_mutation':False,
               'b_selected':False,'b_resolved':False}
          Path(O/'serialization-receipt.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n')
          Path(O/'V96_YAML_BLOCK_LITERAL_SERIALIZATION_GATE_PASS').write_text('PASS malformed V96 physical YAML literal serialization repaired without decoded-value drift\n')
          PY

          bash -n bootstrap-v97/v95-run-patched-v97.sh
          echo V96_YAML_BLOCK_LITERAL_SERIALIZATION_GATE_PASS
          set +e
          GITHUB_SHA=e42a51211d6e4400ec32dd028f056e184abb1f1c bash bootstrap-v97/v95-run-patched-v97.sh >evidence/v97-v96-yaml-literal-serialization/preserved-v95-child.stdout 2>evidence/v97-v96-yaml-literal-serialization/preserved-v95-child.stderr
          RC=$?
          set -e
          printf '%s\n' "$RC" > evidence/v97-v96-yaml-literal-serialization/preserved-v95-child.exit-code.txt
          if [ "$RC" -ne 0 ]; then
            echo "V97_PRESERVED_V95_FIRST_FALSE rc=$RC" >&2
            tail -n 6000 evidence/v97-v96-yaml-literal-serialization/preserved-v95-child.stderr >&2 || true
            exit "$RC"
          fi
          echo V97_PRESERVED_CHAIN_COMPLETED_PRE_RESULT

      - name: Upload V97 frozen PRE-RESULT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-worker-module-v97-evidence
          if-no-files-found: error
          retention-days: 90
          path: |
            fetched-*/
            artifacts-*/
            bootstrap*/
            evidence/
