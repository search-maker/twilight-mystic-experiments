name: LowAlt LT5 P Worker Module V95 Execution Receipt Binding V98

on:
  push:
    branches: [review/lowalt-lt5-p-worker-module-v98-20260920]
    paths: [.github/workflows/lowalt-lt5-p-worker-module-v98.yml]

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  v95-first-false-execution-receipt-binding:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Repair only V97 V95 first-false receipt binding
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p fetched-v98 artifacts-v98 bootstrap-v98 evidence/v98-v95-execution-receipt-binding
          api_get(){ curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$1" -o "$2"; }
          R=https://api.github.com/repos/search-maker/twilight-mystic-experiments
          api_get "$R/issues/comments/5749486452" fetched-v98/coordinator.json
          api_get "$R/contents/.github/workflows/lowalt-lt5-p-worker-module-v97.yml?ref=ae069a42089c2e83181d4d17b8b7eea999501306" fetched-v98/v97-workflow.json
          api_get "$R/contents/.github/workflows/lowalt-lt5-p-worker-module-v95.yml?ref=e42a51211d6e4400ec32dd028f056e184abb1f1c" fetched-v98/v95-workflow.json
          api_get "$R/actions/runs/35507499112" fetched-v98/v97-run.json
          api_get "$R/actions/jobs/106069681508" fetched-v98/v97-job.json
          api_get "$R/actions/artifacts/10604566663" fetched-v98/v97-artifact.json
          curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$R/actions/artifacts/10604566663/zip" -o artifacts-v98/v97.zip
          curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$R/actions/jobs/106069681508/logs" -o fetched-v98/v97-job.log
          api_get "$R/actions/runs/35506971175" fetched-v98/v95-run.json
          api_get "$R/actions/jobs/106068317040" fetched-v98/v95-job.json
          curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$R/actions/jobs/106068317040/logs" -o fetched-v98/v95-job.log
          api_get "$R/branches/main" fetched-v98/main.json
          api_get "$R/compare/6cd7c075766fe0c86bc7561ec205a3f9120fd1fb...${GITHUB_SHA}" fetched-v98/main-to-v98.json

          python3 - <<'PY'
          import base64,difflib,hashlib,json
          from pathlib import Path
          O=Path('evidence/v98-v95-execution-receipt-binding'); O.mkdir(parents=True,exist_ok=True)
          MAIN='6cd7c075766fe0c86bc7561ec205a3f9120fd1fb'; AUTH=5749486452
          V97H='ae069a42089c2e83181d4d17b8b7eea999501306'; V97T='f4091c1d1575c92ab13b733c0572a186e656307f'; V97B='bed19a5115d4ac3aa22c0b20b7d504d3df9d1136'; V97R=35507499112; V97J=106069681508; V97A=10604566663; V97AS='9f89e8e758fcd07bcf28ac833e5d6a3d995e1fd974e3f73ce18dcbc26cbda178'; V97AZ=34170375
          V95H='e42a51211d6e4400ec32dd028f056e184abb1f1c'; V95T='97b06f0c4187b60257ecaa10eef9933e6e431156'; V95B='3ca2322db51ea86caae9836afbd5b8dda2ac4c94'; V95R=35506971175; V95J=106068317040
          H=lambda b:hashlib.sha256(b).hexdigest()
          G=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          def j(p): return json.loads(Path(p).read_text())
          def wf(p,b):
              x=j(p); d=base64.b64decode(x['content'])
              if x.get('sha')!=b or G(d)!=b: raise SystemExit('V98_BIND_FAIL workflow '+p)
              return d
          def runpart(d):
              ls=d.splitlines(keepends=True); m=b'        run: |\n'
              if ls.count(m)!=1: raise SystemExit('V98_BIND_FAIL run marker')
              out=[]
              for q in ls[ls.index(m)+1:]:
                  if q.strip() and not q.startswith(b'          '): break
                  out.append(q[10:] if q.startswith(b'          ') else q)
              return b''.join(out)
          c=j('fetched-v98/coordinator.json')
          if c.get('id')!=AUTH or c.get('user',{}).get('login')!='search-maker': raise SystemExit('V98_BIND_FAIL coordinator identity')
          body=c.get('body','')
          for x in ['COORDINATOR::LOWALT_V98_V97_V95_FIRST_FALSE_EXECUTION_RECEIPT_BINDING_SUCCESSOR_AUTHORIZED__SCIENCE_PRODUCTION_FALSE','AUTHORIZED: exactly ONE fresh LowAlt PRE-RESULT V98 identity','V95_FIRST_FALSE_EXECUTION_RECEIPT_BINDING_GATE_PASS','No V99 absent later direct Coordinator transition.']:
              if x not in body: raise SystemExit('V98_BIND_FAIL authority '+x)
          v97=wf('fetched-v98/v97-workflow.json',V97B); wf('fetched-v98/v95-workflow.json',V95B)
          rr=j('fetched-v98/v97-run.json'); jj=j('fetched-v98/v97-job.json'); aa=j('fetched-v98/v97-artifact.json')
          if rr.get('id')!=V97R or rr.get('run_attempt')!=1 or rr.get('conclusion')!='failure' or rr.get('head_sha')!=V97H or rr.get('head_commit',{}).get('tree_id')!=V97T: raise SystemExit('V98_BIND_FAIL V97 run')
          if jj.get('id')!=V97J or jj.get('conclusion')!='failure': raise SystemExit('V98_BIND_FAIL V97 job')
          if aa.get('id')!=V97A or aa.get('digest')!='sha256:'+V97AS or aa.get('size_in_bytes')!=V97AZ or aa.get('expired'): raise SystemExit('V98_BIND_FAIL V97 artifact')
          z=Path('artifacts-v98/v97.zip').read_bytes()
          if len(z)!=V97AZ or H(z)!=V97AS: raise SystemExit('V98_BIND_FAIL V97 artifact transport')
          log97=Path('fetched-v98/v97-job.log').read_text(errors='replace')
          if log97.count('V97_BIND_FAIL V95 first false')!=1: raise SystemExit('V98_BIND_FAIL V97 first false')
          r97=runpart(v97); text=r97.decode()
          old="if log.count('V95_BIND_FAIL V92 accepted repair source')!=1: raise SystemExit('V97_BIND_FAIL V95 first false')"
          new="\n".join(["msg='V95_BIND_FAIL V92 accepted repair source'","src_stmt=\"if s not in r92: raise SystemExit('V95_BIND_FAIL V92 accepted repair source')\"","raw=[q for q in log.splitlines() if msg in q]","echo=[q for q in raw if '\\x1b[36;1m' in q and src_stmt in q]","executed=[q for q in raw if q.count('Z ')==1 and q.split('Z ',1)[1]==msg]","if log.count(msg)!=2 or len(raw)!=2 or len(echo)!=1 or len(executed)!=1: raise SystemExit('V97_BIND_FAIL V95 first false')"])
          if text.count(old)!=1 or text.count(new)!=0: raise SystemExit('V98_PATCH_FAIL precondition')
          patched=text.replace(old,new,1)
          if patched.count(old)!=0 or patched.count(new)!=1 or patched.replace(new,old,1)!=text: raise SystemExit('V98_PATCH_FAIL postcondition')
          log95=Path('fetched-v98/v95-job.log').read_text(errors='replace'); msg='V95_BIND_FAIL V92 accepted repair source'; src_stmt="if s not in r92: raise SystemExit('V95_BIND_FAIL V92 accepted repair source')"
          raw=[q for q in log95.splitlines() if msg in q]; echo=[q for q in raw if '\x1b[36;1m' in q and src_stmt in q]; executed=[q for q in raw if q.count('Z ')==1 and q.split('Z ',1)[1]==msg]
          if log95.count(msg)!=2 or len(raw)!=2 or len(echo)!=1 or len(executed)!=1: raise SystemExit('V98_BIND_FAIL immutable V95 receipt table '+repr((log95.count(msg),len(raw),len(echo),len(executed))))
          rr95=j('fetched-v98/v95-run.json'); jj95=j('fetched-v98/v95-job.json')
          if rr95.get('id')!=V95R or rr95.get('run_attempt')!=1 or rr95.get('conclusion')!='failure' or rr95.get('head_sha')!=V95H or rr95.get('head_commit',{}).get('tree_id')!=V95T or jj95.get('id')!=V95J or jj95.get('conclusion')!='failure': raise SystemExit('V98_BIND_FAIL V95 identity')
          diff=''.join(difflib.unified_diff(text.splitlines(True),patched.splitlines(True),fromfile='v97-run.sh',tofile='v97-run-patched-v98.sh',n=3))
          main=j('fetched-v98/main.json'); comp=j('fetched-v98/main-to-v98.json'); fs=comp.get('files') or []
          if main.get('commit',{}).get('sha')!=MAIN: raise SystemExit('V98_BIND_FAIL main drift')
          if comp.get('base_commit',{}).get('sha')!=MAIN or len(fs)!=1 or fs[0].get('filename')!='.github/workflows/lowalt-lt5-p-worker-module-v98.yml' or fs[0].get('status')!='added': raise SystemExit('V98_BIND_FAIL branch scope')
          Path('bootstrap-v98/v97-run-patched-v98.sh').write_text(patched)
          Path(O/'v97-to-v98-receipt-binding.diff').write_text(diff)
          table={'schema':1,'message':msg,'raw_count':len(raw),'source_echo_count':len(echo),'executed_count':len(executed),'source_echo_sha256':H(echo[0].encode()),'executed_sha256':H(executed[0].encode())}
          Path(O/'source-echo-vs-executed-receipt.json').write_text(json.dumps(table,indent=2,sort_keys=True)+'\n')
          rec={'schema':1,'status':'V95_FIRST_FALSE_EXECUTION_RECEIPT_BINDING_GATE_PASS','authority_comment':AUTH,'v97_head':V97H,'v97_tree':V97T,'v97_workflow_blob':V97B,'v97_run':V97R,'v97_job':V97J,'v97_artifact':V97A,'v97_artifact_sha256':V97AS,'v95_head':V95H,'v95_workflow_blob':V95B,'v95_run':V95R,'v95_job':V95J,'before_run_sha256':H(r97),'after_run_sha256':H(patched.encode()),'diff_sha256':H(diff.encode()),'scientific_script_mutation':False,'source_defined_transport_mutation':False,'b_selected':False,'b_resolved':False}
          Path(O/'receipt-binding-receipt.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n')
          Path(O/'V95_FIRST_FALSE_EXECUTION_RECEIPT_BINDING_GATE_PASS').write_text('PASS exact one source echo plus exact one executed V95 first-false receipt\n')
          PY

          bash -n bootstrap-v98/v97-run-patched-v98.sh
          echo V95_FIRST_FALSE_EXECUTION_RECEIPT_BINDING_GATE_PASS
          set +e
          GITHUB_SHA=ae069a42089c2e83181d4d17b8b7eea999501306 bash bootstrap-v98/v97-run-patched-v98.sh >evidence/v98-v95-execution-receipt-binding/preserved-v97-child.stdout 2>evidence/v98-v95-execution-receipt-binding/preserved-v97-child.stderr
          RC=$?
          set -e
          printf '%s\n' "$RC" > evidence/v98-v95-execution-receipt-binding/preserved-v97-child.exit-code.txt
          if [ "$RC" -ne 0 ]; then
            echo "V98_PRESERVED_V97_FIRST_FALSE rc=$RC" >&2
            tail -n 6000 evidence/v98-v95-execution-receipt-binding/preserved-v97-child.stderr >&2 || true
            exit "$RC"
          fi
          echo V98_PRESERVED_CHAIN_COMPLETED_PRE_RESULT

      - name: Upload V98 frozen PRE-RESULT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-worker-module-v98-evidence
          if-no-files-found: error
          retention-days: 90
          path: |
            fetched-*/
            artifacts-*/
            bootstrap*/
            evidence/
