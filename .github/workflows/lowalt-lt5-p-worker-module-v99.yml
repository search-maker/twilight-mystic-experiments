name: LowAlt LT5 P Worker Module V97 Execution Receipt Binding V99

on:
  push:
    branches: [review/lowalt-lt5-p-worker-module-v99-20260920]
    paths: [.github/workflows/lowalt-lt5-p-worker-module-v99.yml]

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  v97-first-false-execution-receipt-binding:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Repair only V98 V97 first-false receipt binding
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p fetched-v99 artifacts-v99 bootstrap-v99 evidence/v99-v97-execution-receipt-binding
          api_get(){ curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$1" -o "$2"; }
          R=https://api.github.com/repos/search-maker/twilight-mystic-experiments
          api_get "$R/issues/comments/5749506150" fetched-v99/coordinator.json
          api_get "$R/issues/comments/5749486452" fetched-v99/v98-coordinator.json
          api_get "$R/contents/.github/workflows/lowalt-lt5-p-worker-module-v98.yml?ref=0c58c7013855107d5b848835c61bd6a278ca8029" fetched-v99/v98-workflow.json
          api_get "$R/contents/.github/workflows/lowalt-lt5-p-worker-module-v97.yml?ref=ae069a42089c2e83181d4d17b8b7eea999501306" fetched-v99/v97-workflow.json
          api_get "$R/actions/runs/35507779206" fetched-v99/v98-run.json
          api_get "$R/actions/jobs/106070388045" fetched-v99/v98-job.json
          api_get "$R/actions/artifacts/10604661985" fetched-v99/v98-artifact.json
          curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$R/actions/artifacts/10604661985/zip" -o artifacts-v99/v98.zip
          curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$R/actions/jobs/106070388045/logs" -o fetched-v99/v98-job.log
          api_get "$R/actions/runs/35507499112" fetched-v99/v97-run.json
          api_get "$R/actions/jobs/106069681508" fetched-v99/v97-job.json
          api_get "$R/actions/artifacts/10604566663" fetched-v99/v97-artifact.json
          curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$R/actions/jobs/106069681508/logs" -o fetched-v99/v97-job.log
          api_get "$R/branches/main" fetched-v99/main.json
          api_get "$R/compare/6cd7c075766fe0c86bc7561ec205a3f9120fd1fb...${GITHUB_SHA}" fetched-v99/main-to-v99.json

          python3 - <<'PY'
          import base64,difflib,hashlib,json
          from pathlib import Path
          O=Path('evidence/v99-v97-execution-receipt-binding'); O.mkdir(parents=True,exist_ok=True)
          MAIN='6cd7c075766fe0c86bc7561ec205a3f9120fd1fb'; AUTH=5749506150; V98AUTH=5749486452
          V98H='0c58c7013855107d5b848835c61bd6a278ca8029'; V98T='916b990d220d3d400f50017ccd89b14413c6fb7e'; V98B='25ab039873993d0c22153141015f8d9eea4f2999'; V98R=35507779206; V98J=106070388045; V98A=10604661985; V98AS='c5e6101d2f113f6294699a33a44d7b2ac9ef74382646f2ecd3276bd46c93107d'; V98AZ=34232424
          V97H='ae069a42089c2e83181d4d17b8b7eea999501306'; V97T='f4091c1d1575c92ab13b733c0572a186e656307f'; V97B='bed19a5115d4ac3aa22c0b20b7d504d3df9d1136'; V97R=35507499112; V97J=106069681508; V97A=10604566663; V97AS='9f89e8e758fcd07bcf28ac833e5d6a3d995e1fd974e3f73ce18dcbc26cbda178'; V97AZ=34170375
          H=lambda b:hashlib.sha256(b).hexdigest()
          G=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          def j(p): return json.loads(Path(p).read_text())
          def wf(p,b):
              x=j(p); d=base64.b64decode(x['content'])
              if x.get('sha')!=b or G(d)!=b: raise SystemExit('V99_BIND_FAIL workflow '+p)
              return d
          def runpart(d):
              ls=d.splitlines(keepends=True); m=b'        run: |\n'
              if ls.count(m)!=1: raise SystemExit('V99_BIND_FAIL run marker')
              out=[]
              for q in ls[ls.index(m)+1:]:
                  if q.strip() and not q.startswith(b'          '): break
                  out.append(q[10:] if q.startswith(b'          ') else q)
              return b''.join(out)
          c=j('fetched-v99/coordinator.json')
          if c.get('id')!=AUTH or c.get('user',{}).get('login')!='search-maker': raise SystemExit('V99_BIND_FAIL coordinator identity')
          body=c.get('body','')
          for x in ['COORDINATOR::LOWALT_V99_V98_V97_FIRST_FALSE_EXECUTION_RECEIPT_BINDING_SUCCESSOR_AUTHORIZED__SCIENCE_PRODUCTION_FALSE','AUTHORIZED: exactly ONE fresh LowAlt PRE-RESULT V99 identity','V97_FIRST_FALSE_EXECUTION_RECEIPT_BINDING_GATE_PASS','No V100 absent later direct Coordinator transition.']:
              if x not in body: raise SystemExit('V99_BIND_FAIL authority '+x)
          c98=j('fetched-v99/v98-coordinator.json')
          if c98.get('id')!=V98AUTH or c98.get('user',{}).get('login')!='search-maker': raise SystemExit('V99_BIND_FAIL V98 coordinator identity')
          if 'COORDINATOR::LOWALT_V98_V97_V95_FIRST_FALSE_EXECUTION_RECEIPT_BINDING_SUCCESSOR_AUTHORIZED__SCIENCE_PRODUCTION_FALSE' not in c98.get('body',''): raise SystemExit('V99_BIND_FAIL V98 coordinator scope')
          v98=wf('fetched-v99/v98-workflow.json',V98B); v97=wf('fetched-v99/v97-workflow.json',V97B)
          rr=j('fetched-v99/v98-run.json'); jj=j('fetched-v99/v98-job.json'); aa=j('fetched-v99/v98-artifact.json')
          if rr.get('id')!=V98R or rr.get('run_attempt')!=1 or rr.get('conclusion')!='failure' or rr.get('head_sha')!=V98H or rr.get('head_commit',{}).get('tree_id')!=V98T: raise SystemExit('V99_BIND_FAIL V98 run')
          if jj.get('id')!=V98J or jj.get('conclusion')!='failure': raise SystemExit('V99_BIND_FAIL V98 job')
          if aa.get('id')!=V98A or aa.get('digest')!='sha256:'+V98AS or aa.get('size_in_bytes')!=V98AZ or aa.get('expired'): raise SystemExit('V99_BIND_FAIL V98 artifact')
          z=Path('artifacts-v99/v98.zip').read_bytes()
          if len(z)!=V98AZ or H(z)!=V98AS: raise SystemExit('V99_BIND_FAIL V98 artifact transport')
          log98=Path('fetched-v99/v98-job.log').read_text(errors='replace')
          ff98='V98_BIND_FAIL V97 first false'
          raw98=[q for q in log98.splitlines() if ff98 in q]
          exec98=[q for q in raw98 if q.count('Z ')==1 and q.split('Z ',1)[1]==ff98]
          if len(exec98)!=1: raise SystemExit('V99_BIND_FAIL V98 first-false execution '+repr((len(raw98),len(exec98))))

          rr97=j('fetched-v99/v97-run.json'); jj97=j('fetched-v99/v97-job.json'); aa97=j('fetched-v99/v97-artifact.json')
          if rr97.get('id')!=V97R or rr97.get('run_attempt')!=1 or rr97.get('conclusion')!='failure' or rr97.get('head_sha')!=V97H or rr97.get('head_commit',{}).get('tree_id')!=V97T: raise SystemExit('V99_BIND_FAIL V97 run')
          if jj97.get('id')!=V97J or jj97.get('conclusion')!='failure': raise SystemExit('V99_BIND_FAIL V97 job')
          if aa97.get('id')!=V97A or aa97.get('digest')!='sha256:'+V97AS or aa97.get('size_in_bytes')!=V97AZ or aa97.get('expired'): raise SystemExit('V99_BIND_FAIL V97 artifact')
          log97=Path('fetched-v99/v97-job.log').read_text(errors='replace')
          msg='V97_BIND_FAIL V95 first false'
          src_stmt="if log.count('V95_BIND_FAIL V92 accepted repair source')!=1: raise SystemExit('V97_BIND_FAIL V95 first false')"
          raw=[q for q in log97.splitlines() if msg in q]
          echo=[q for q in raw if '\x1b[36;1m' in q and src_stmt in q]
          executed=[q for q in raw if q.count('Z ')==1 and q.split('Z ',1)[1]==msg]
          if log97.count(msg)!=2 or len(raw)!=2 or len(echo)!=1 or len(executed)!=1: raise SystemExit('V99_BIND_FAIL immutable V97 receipt table '+repr((log97.count(msg),len(raw),len(echo),len(executed))))

          r98=runpart(v98); text=r98.decode()
          old="if log97.count('V97_BIND_FAIL V95 first false')!=1: raise SystemExit('V98_BIND_FAIL V97 first false')"
          new="\n".join(["msg97='V97_BIND_FAIL V95 first false'","src97=\"if log.count('V95_BIND_FAIL V92 accepted repair source')!=1: raise SystemExit('V97_BIND_FAIL V95 first false')\"","raw97=[q for q in log97.splitlines() if msg97 in q]","echo97=[q for q in raw97 if '\\x1b[36;1m' in q and src97 in q]","executed97=[q for q in raw97 if q.count('Z ')==1 and q.split('Z ',1)[1]==msg97]","if log97.count(msg97)!=2 or len(raw97)!=2 or len(echo97)!=1 or len(executed97)!=1: raise SystemExit('V98_BIND_FAIL V97 first false')"])
          if text.count(old)!=1 or text.count(new)!=0: raise SystemExit('V99_PATCH_FAIL precondition')
          patched=text.replace(old,new,1)
          if patched.count(old)!=0 or patched.count(new)!=1 or patched.replace(new,old,1)!=text: raise SystemExit('V99_PATCH_FAIL postcondition')
          diff=''.join(difflib.unified_diff(text.splitlines(True),patched.splitlines(True),fromfile='v98-run.sh',tofile='v98-run-patched-v99.sh',n=3))
          main=j('fetched-v99/main.json'); comp=j('fetched-v99/main-to-v99.json'); fs=comp.get('files') or []
          if main.get('commit',{}).get('sha')!=MAIN: raise SystemExit('V99_BIND_FAIL main drift')
          if comp.get('base_commit',{}).get('sha')!=MAIN or len(fs)!=1 or fs[0].get('filename')!='.github/workflows/lowalt-lt5-p-worker-module-v99.yml' or fs[0].get('status')!='added': raise SystemExit('V99_BIND_FAIL branch scope')
          Path('bootstrap-v99/v98-run-patched-v99.sh').write_text(patched)
          Path(O/'v98-to-v99-receipt-binding.diff').write_text(diff)
          table={'schema':1,'message':msg,'raw_count':len(raw),'source_echo_count':len(echo),'executed_count':len(executed),'source_echo_sha256':H(echo[0].encode()),'executed_sha256':H(executed[0].encode())}
          Path(O/'source-echo-vs-executed-receipt.json').write_text(json.dumps(table,indent=2,sort_keys=True)+'\n')
          rec={'schema':1,'status':'V97_FIRST_FALSE_EXECUTION_RECEIPT_BINDING_GATE_PASS','authority_comment':AUTH,'v98_head':V98H,'v98_tree':V98T,'v98_workflow_blob':V98B,'v98_run':V98R,'v98_job':V98J,'v98_artifact':V98A,'v98_artifact_sha256':V98AS,'v97_head':V97H,'v97_workflow_blob':V97B,'v97_run':V97R,'v97_job':V97J,'before_run_sha256':H(r98),'after_run_sha256':H(patched.encode()),'diff_sha256':H(diff.encode()),'scientific_script_mutation':False,'source_defined_transport_mutation':False,'b_selected':False,'b_resolved':False}
          Path(O/'receipt-binding-receipt.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n')
          Path(O/'V97_FIRST_FALSE_EXECUTION_RECEIPT_BINDING_GATE_PASS').write_text('PASS exact one source echo plus exact one executed V97 first-false receipt\n')
          PY

          bash -n bootstrap-v99/v98-run-patched-v99.sh
          echo V97_FIRST_FALSE_EXECUTION_RECEIPT_BINDING_GATE_PASS
          set +e
          GITHUB_SHA=0c58c7013855107d5b848835c61bd6a278ca8029 bash bootstrap-v99/v98-run-patched-v99.sh >evidence/v99-v97-execution-receipt-binding/preserved-v98-child.stdout 2>evidence/v99-v97-execution-receipt-binding/preserved-v98-child.stderr
          RC=$?
          set -e
          printf '%s\n' "$RC" > evidence/v99-v97-execution-receipt-binding/preserved-v98-child.exit-code.txt
          if [ "$RC" -ne 0 ]; then
            echo "V99_PRESERVED_V98_FIRST_FALSE rc=$RC" >&2
            tail -n 6000 evidence/v99-v97-execution-receipt-binding/preserved-v98-child.stderr >&2 || true
            exit "$RC"
          fi
          echo V99_PRESERVED_CHAIN_COMPLETED_PRE_RESULT

      - name: Upload V99 frozen PRE-RESULT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-p-worker-module-v99-evidence
          if-no-files-found: error
          retention-days: 90
          path: |
            fetched-*/
            artifacts-*/
            bootstrap*/
            evidence/
