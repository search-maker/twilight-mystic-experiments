name: LowAlt LT5 T Governing Source WASM Compile Probe V1

on:
  push:
    branches:
      - review/lowalt-lt5-t-governing-source-wasm-compile-probe-v1-20260917
    paths:
      - .github/workflows/lowalt-lt5-t-governing-source-wasm-compile-probe-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  compile-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Compile exact governing T sources to relocatable WASM objects only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p lowalt-t-compile
          cd lowalt-t-compile

          for cmd in curl unzip gzip tar sha256sum; do
            command -v "$cmd" >/dev/null
          done

          source /opt/emsdk/emsdk_env.sh >/dev/null
          FLANG=/opt/flang/host/bin/flang
          FRT=/opt/flang/wasm/lib/libFortranRuntime.a
          EMCC="$(command -v emcc)"
          WASMLD="$(command -v wasm-ld)"

          test "$(sha256sum "$FLANG" | awk '{print $1}')" = "70e9de59304303f1a242a3f9a37e89636cad27b645c41cf0ce9b1c2c6f9b604b"
          test "$(sha256sum "$FRT" | awk '{print $1}')" = "a01af58d67c5792512b4eb483a245b6c7dddc75d75f2e07bd4680c1a4078f66f"
          test "$(sha256sum "$EMCC" | awk '{print $1}')" = "b0c9551f9155fa9c028efa24591acdfd30f02f32fb247cf9266f5f0f2ede7589"
          test "$(sha256sum "$WASMLD" | awk '{print $1}')" = "7ad9a0e8fe6d0e79b71172d731e33872c0274e49fceb7b516d774876d5a58ade"

          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/8894652347/zip" \
            -o source-audit.zip
          test "$(sha256sum source-audit.zip | awk '{print $1}')" = "db189ee5f145719ebf85c97e1c0b35eacb4963c2c19544df29f0a978b1dbd12b"

          unzip -p source-audit.zip libRadtran-2.0.6.tar.gz > libRadtran-2.0.6.tar.gz
          test "$(sha256sum libRadtran-2.0.6.tar.gz | awk '{print $1}')" = "64930cc40b6e4a37aa220520974d330fc1563796f466a649b2238131f2d69840"
          gzip -dc libRadtran-2.0.6.tar.gz > source.tar
          test "$(sha256sum source.tar | awk '{print $1}')" = "999e47f4af4b5df6f85a6887fc105fc8f6e1a7cee89a3124f69ac8d8912c8e85"
          tar -xf source.tar

          test "$(sha256sum libRadtran-2.0.6/libsrc_f/dpmisc.f | awk '{print $1}')" = "e0d8975408ead1d6fe0c9630c0b2e5a858868334ba6af179d9f94c063955324e"
          test "$(sha256sum libRadtran-2.0.6/libsrc_f/dpsdisort.f | awk '{print $1}')" = "54448cc9358d32c5be30b5c860006ff0ed05484a58cf3417f05fbc4b6a5efd66"
          test "$(sha256sum libRadtran-2.0.6/libsrc_f/setout.f | awk '{print $1}')" = "4c1672daa8586c5fd9f38c4bcde64b2f684b1e25401ba4fccc53fcaf52d0d344"
          test "$(sha256sum libRadtran-2.0.6/libsrc_f/inter.f | awk '{print $1}')" = "59d1b74b0152c9109da858dddd7d4f5b57da55cb6678cab9c403661bcc587c9b"
          test "$(sha256sum libRadtran-2.0.6/libsrc_f/DISORT.MXD | awk '{print $1}')" = "9cf3f04bac9703b302a13b29eb1df11ea3200a992bc50ab3fa947d1d83c71f69"

          "$FLANG" --target=wasm32-unknown-emscripten -I libRadtran-2.0.6/libsrc_f -c libRadtran-2.0.6/libsrc_f/dpmisc.f -o dpmisc.o
          "$FLANG" --target=wasm32-unknown-emscripten -I libRadtran-2.0.6/libsrc_f -c libRadtran-2.0.6/libsrc_f/dpsdisort.f -o dpsdisort.o
          "$FLANG" --target=wasm32-unknown-emscripten -I libRadtran-2.0.6/libsrc_f -c libRadtran-2.0.6/libsrc_f/inter.f -o inter.o
          "$FLANG" --target=wasm32-unknown-emscripten -I libRadtran-2.0.6/libsrc_f -c libRadtran-2.0.6/libsrc_f/setout.f -o setout.o

          test -s dpmisc.o
          test -s dpsdisort.o
          test -s inter.o
          test -s setout.o

          {
            echo 'schema=1'
            echo 'classification=PRE_RESULT_COMPILE_ONLY_T_GOVERNING_SOURCE_NO_LT5_NO_C_NO_D'
            echo 'bSelected=false'
            echo 'bResolved=false'
            echo 'container_image=ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5'
            echo 'target=wasm32-unknown-emscripten'
            echo 'source_artifact_id=8894652347'
            echo 'source_artifact_zip_sha256=db189ee5f145719ebf85c97e1c0b35eacb4963c2c19544df29f0a978b1dbd12b'
            echo 'source_member_sha256=64930cc40b6e4a37aa220520974d330fc1563796f466a649b2238131f2d69840'
            echo 'source_decoded_tar_sha256=999e47f4af4b5df6f85a6887fc105fc8f6e1a7cee89a3124f69ac8d8912c8e85'
            echo '--- toolchain ---'
            "$FLANG" --version
            "$EMCC" --version
            echo '--- hashes ---'
            sha256sum \
              "$FLANG" "$FRT" "$EMCC" "$WASMLD" \
              libRadtran-2.0.6/libsrc_f/dpmisc.f \
              libRadtran-2.0.6/libsrc_f/dpsdisort.f \
              libRadtran-2.0.6/libsrc_f/inter.f \
              libRadtran-2.0.6/libsrc_f/setout.f \
              libRadtran-2.0.6/libsrc_f/DISORT.MXD \
              dpmisc.o dpsdisort.o inter.o setout.o
            echo '--- exact compile commands ---'
            echo '/opt/flang/host/bin/flang --target=wasm32-unknown-emscripten -I libRadtran-2.0.6/libsrc_f -c libRadtran-2.0.6/libsrc_f/dpmisc.f -o dpmisc.o'
            echo '/opt/flang/host/bin/flang --target=wasm32-unknown-emscripten -I libRadtran-2.0.6/libsrc_f -c libRadtran-2.0.6/libsrc_f/dpsdisort.f -o dpsdisort.o'
            echo '/opt/flang/host/bin/flang --target=wasm32-unknown-emscripten -I libRadtran-2.0.6/libsrc_f -c libRadtran-2.0.6/libsrc_f/inter.f -o inter.o'
            echo '/opt/flang/host/bin/flang --target=wasm32-unknown-emscripten -I libRadtran-2.0.6/libsrc_f -c libRadtran-2.0.6/libsrc_f/setout.f -o setout.o'
            echo 'link_performed=false'
            echo 'wasm_instantiated=false'
            echo 'runtime_executed=false'
            echo 'lt5_result=false'
            echo 'c_executed=false'
            echo 'd_executed=false'
          } > compile-only-receipt.txt
          sha256sum compile-only-receipt.txt > compile-only-receipt.sha256
          cat compile-only-receipt.txt
          cat compile-only-receipt.sha256

      - name: Publish compile-only evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lowalt-lt5-t-governing-source-wasm-compile-probe-v1
          path: |
            lowalt-t-compile/compile-only-receipt.txt
            lowalt-t-compile/compile-only-receipt.sha256
            lowalt-t-compile/dpmisc.o
            lowalt-t-compile/dpsdisort.o
            lowalt-t-compile/inter.o
            lowalt-t-compile/setout.o
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
