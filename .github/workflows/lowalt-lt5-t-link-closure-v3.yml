name: LowAlt LT5 T Link Closure V3

on:
  push:
    branches:
      - review/lowalt-lt5-t-link-closure-v3-20260917
    paths:
      - .github/workflows/lowalt-lt5-t-link-closure-v3.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  link-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5
    steps:
      - name: Link exact T source closure with frozen COMMON storage without execution
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p lowalt-t-link
          cd lowalt-t-link
          STAGE=bootstrap
          trap 'rc=$?; printf "status=FAIL\nstage=%s\nexit=%s\nwasm_instantiated=false\nruntime_executed=false\nlt5_result=false\nc_executed=false\nd_executed=false\n" "$STAGE" "$rc" > failure-receipt.txt; exit "$rc"' ERR

          for cmd in curl unzip gzip tar sha256sum python3; do
            command -v "$cmd" >/dev/null
          done

          STAGE=toolchain
          source /opt/emsdk/emsdk_env.sh >/dev/null
          FLANG=/opt/flang/host/bin/flang
          FRT=/opt/flang/wasm/lib/libFortranRuntime.a
          EMCC="$(command -v emcc)"
          WASMLD="$(command -v wasm-ld)"
          PYTHON="$(command -v python3)"
          test "$(sha256sum "$FLANG" | awk '{print $1}')" = "70e9de59304303f1a242a3f9a37e89636cad27b645c41cf0ce9b1c2c6f9b604b"
          test "$(sha256sum "$FRT" | awk '{print $1}')" = "a01af58d67c5792512b4eb483a245b6c7dddc75d75f2e07bd4680c1a4078f66f"
          test "$(sha256sum "$EMCC" | awk '{print $1}')" = "b0c9551f9155fa9c028efa24591acdfd30f02f32fb247cf9266f5f0f2ede7589"
          test "$(sha256sum "$WASMLD" | awk '{print $1}')" = "7ad9a0e8fe6d0e79b71172d731e33872c0274e49fceb7b516d774876d5a58ade"

          STAGE=source
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/8894652347/zip" \
            -o source-audit.zip
          test "$(sha256sum source-audit.zip | awk '{print $1}')" = "db189ee5f145719ebf85c97e1c0b35eacb4963c2c19544df29f0a978b1dbd12b"
          unzip -p source-audit.zip libRadtran-2.0.6.tar.gz > libRadtran-2.0.6.tar.gz
          test "$(sha256sum libRadtran-2.0.6.tar.gz | awk '{print $1}')" = "64930cc40b6e4a37aa220520974d330fc1563796f466a649b2238131f2d69840"
          gzip -dc libRadtran-2.0.6.tar.gz > source.tar
          test "$(sha256sum source.tar | awk '{print $1}')" = "999e47f4af4b5df6f85a6887fc105fc8f6e1a7cee89a3124f69ac8d8912c8e85"
          tar -xf source.tar
          test "$(sha256sum libRadtran-2.0.6/libsrc_f/dpmisc.f | awk '{print $1}')" = "e0d8975408ead1d6fe0c9630c0b2e5a858868334ba6af179d9f94c063955324e"
          test "$(sha256sum libRadtran-2.0.6/libsrc_f/dpsdisort.f | awk '{print $1}')" = "54448cc9358d32c5be30b5c860006ff0ed05484a58cf3417f05fbc4b6a5efd66"
          test "$(sha256sum libRadtran-2.0.6/libsrc_f/inter.f | awk '{print $1}')" = "59d1b74b0152c9109da858dddd7d4f5b57da55cb6678cab9c403661bcc587c9b"
          test "$(sha256sum libRadtran-2.0.6/libsrc_f/setout.f | awk '{print $1}')" = "4c1672daa8586c5fd9f38c4bcde64b2f684b1e25401ba4fccc53fcaf52d0d344"
          test "$(sha256sum libRadtran-2.0.6/libsrc_f/d1mach.f | awk '{print $1}')" = "f5751d7907cd4a5f1f1da3b4b679ef83bcda71091b25f49c0b4470b8d9ff95c9"
          test "$(sha256sum libRadtran-2.0.6/libsrc_f/spsmisc.f | awk '{print $1}')" = "91133fe1b16f4cdd2c4b3d86abe3ba5931818806261b577848e12a02b4de6170"
          test "$(sha256sum libRadtran-2.0.6/libsrc_f/ErrPack.f | awk '{print $1}')" = "888d72f8b6a820117d84992e6fdbedae41cff6879446445a8df7dcc7b14a45c2"
          test "$(sha256sum libRadtran-2.0.6/libsrc_f/DISORT.MXD | awk '{print $1}')" = "9cf3f04bac9703b302a13b29eb1df11ea3200a992bc50ab3fa947d1d83c71f69"
          test "$(grep -RIl 'COMMON /D9MACH/' libRadtran-2.0.6/libsrc_f | wc -l | tr -d ' ')" = 1

          STAGE=shim
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/search-maker/twilight-mystic-experiments/cf0b33e48be68c4c7046786cbead1d53e3f16dc2/review/lowalt-lt5-d9mach-common-storage-v1.c" \
            -o d9mach-common-storage.c
          test "$(sha256sum d9mach-common-storage.c | awk '{print $1}')" = "8a8b0f326088da8a46f6f22d5816b47e6c19afccb08c8f8ff01a8160fc588472"
          "$EMCC" -O0 -c d9mach-common-storage.c -o d9mach-common-storage.o
          test -s d9mach-common-storage.o

          STAGE=compile
          compile_one() {
            src="$1"
            out="$2"
            "$FLANG" --target=wasm32-unknown-emscripten -I libRadtran-2.0.6/libsrc_f -c "$src" -o "$out"
            test -s "$out"
          }
          compile_one libRadtran-2.0.6/libsrc_f/dpmisc.f dpmisc.o
          compile_one libRadtran-2.0.6/libsrc_f/dpsdisort.f dpsdisort.o
          compile_one libRadtran-2.0.6/libsrc_f/inter.f inter.o
          compile_one libRadtran-2.0.6/libsrc_f/setout.f setout.o
          compile_one libRadtran-2.0.6/libsrc_f/d1mach.f d1mach.o
          compile_one libRadtran-2.0.6/libsrc_f/spsmisc.f spsmisc.o
          compile_one libRadtran-2.0.6/libsrc_f/ErrPack.f ErrPack.o

          STAGE=link
          "$EMCC" \
            dpmisc.o dpsdisort.o inter.o setout.o d1mach.o spsmisc.o ErrPack.o d9mach-common-storage.o "$FRT" \
            --no-entry -O0 \
            -sMODULARIZE=1 \
            -sEXPORT_ES6=1 \
            -sENVIRONMENT=worker \
            -sALLOW_MEMORY_GROWTH=0 \
            -sINITIAL_MEMORY=67108864 \
            -sSTACK_SIZE=1048576 \
            -sERROR_ON_UNDEFINED_SYMBOLS=1 \
            -sEXPORTED_FUNCTIONS='["_sdisort_","_dpsdisort_","_setout_","_malloc","_free"]' \
            -sEXPORTED_RUNTIME_METHODS='[]' \
            -o lowalt-t-exact.mjs
          test -s lowalt-t-exact.mjs
          test -s lowalt-t-exact.wasm

          STAGE=static-inspection
          cat > inspect_wasm.py <<'PY'
          import sys
          KIND = {0: 'func', 1: 'table', 2: 'memory', 3: 'global', 4: 'tag'}
          data = open(sys.argv[1], 'rb').read()
          if data[:8] != b'\x00asm\x01\x00\x00\x00':
              raise SystemExit('bad wasm header')
          def uleb(p):
              value = 0; shift = 0
              while True:
                  if p >= len(data): raise SystemExit('truncated leb')
                  b = data[p]; p += 1; value |= (b & 0x7f) << shift
                  if not (b & 0x80): return value, p
                  shift += 7
                  if shift > 70: raise SystemExit('oversize leb')
          def name(p):
              n, p = uleb(p); q = p + n
              if q > len(data): raise SystemExit('truncated name')
              return data[p:q].decode('utf-8'), q
          def limits(p):
              flags, p = uleb(p); minimum, p = uleb(p); maximum = None
              if flags & 1: maximum, p = uleb(p)
              return flags, minimum, maximum, p
          lines = []; p = 8
          while p < len(data):
              sid = data[p]; p += 1; size, p = uleb(p); end = p + size
              if end > len(data): raise SystemExit('truncated section')
              if sid == 2:
                  count, p = uleb(p)
                  for _ in range(count):
                      mod, p = name(p); nm, p = name(p); kind = data[p]; p += 1; desc = ''
                      if kind == 0:
                          typeidx, p = uleb(p); desc = f'type={typeidx}'
                      elif kind == 1:
                          reftype = data[p]; p += 1; flags, minimum, maximum, p = limits(p); desc = f'reftype=0x{reftype:02x} flags={flags} min={minimum} max={maximum}'
                      elif kind == 2:
                          flags, minimum, maximum, p = limits(p); desc = f'flags={flags} min={minimum} max={maximum}'
                      elif kind == 3:
                          valtype = data[p]; mut = data[p+1]; p += 2; desc = f'valtype=0x{valtype:02x} mut={mut}'
                      elif kind == 4:
                          attr = data[p]; p += 1; typeidx, p = uleb(p); desc = f'attr={attr} type={typeidx}'
                      else: raise SystemExit(f'unknown import kind {kind}')
                      lines.append(f'IMPORT {mod} {nm} {KIND.get(kind, kind)} {desc}')
              elif sid == 5:
                  count, p = uleb(p)
                  for i in range(count):
                      flags, minimum, maximum, p = limits(p); lines.append(f'MEMORY {i} flags={flags} min={minimum} max={maximum}')
              elif sid == 7:
                  count, p = uleb(p)
                  for _ in range(count):
                      nm, p = name(p); kind = data[p]; p += 1; idx, p = uleb(p); lines.append(f'EXPORT {nm} {KIND.get(kind, kind)} index={idx}')
              p = end
          open(sys.argv[2], 'w', encoding='utf-8').write('\n'.join(lines) + '\n')
          PY
          "$PYTHON" inspect_wasm.py lowalt-t-exact.wasm module-interface.txt
          grep -E '^EXPORT (sdisort_|_sdisort_) func ' module-interface.txt >/dev/null
          grep -E '^EXPORT (dpsdisort_|_dpsdisort_) func ' module-interface.txt >/dev/null
          grep -E '^EXPORT (setout_|_setout_) func ' module-interface.txt >/dev/null
          grep -E '^EXPORT memory memory ' module-interface.txt >/dev/null

          STAGE=receipt
          {
            echo 'schema=3'
            echo 'classification=PRE_RESULT_T_COMMON_STORAGE_LINK_SUCCESS_NO_LT5_NO_C_NO_D'
            echo 'bSelected=false'
            echo 'bResolved=false'
            echo 'predecessor_v1_run=35198773208'
            echo 'predecessor_v2_run=35199088086'
            echo 'predecessor_v2_first_error=wasm-ld: error: d1mach.o: undefined symbol: d9mach_'
            echo 'container_image=ghcr.io/r-wasm/flang-wasm:v20.1.4@sha256:456f78d526b5582204d6b1da3ccbca2e5b6965d0ec5f528ff8891f496a08f6a5'
            echo 'target=wasm32-unknown-emscripten'
            echo 'source_artifact_id=8894652347'
            echo 'source_artifact_zip_sha256=db189ee5f145719ebf85c97e1c0b35eacb4963c2c19544df29f0a978b1dbd12b'
            echo 'source_member_sha256=64930cc40b6e4a37aa220520974d330fc1563796f466a649b2238131f2d69840'
            echo 'source_decoded_tar_sha256=999e47f4af4b5df6f85a6887fc105fc8f6e1a7cee89a3124f69ac8d8912c8e85'
            echo 'd9mach_shim_git_blob=6b8821de6f535907f6e2b1307bb8e13e48f83957'
            echo 'd9mach_shim_sha256=8a8b0f326088da8a46f6f22d5816b47e6c19afccb08c8f8ff01a8160fc588472'
            echo '--- toolchain ---'
            "$FLANG" --version
            "$EMCC" --version
            "$PYTHON" --version
            echo '--- hashes ---'
            sha256sum "$FLANG" "$FRT" "$EMCC" "$WASMLD" \
              libRadtran-2.0.6/libsrc_f/dpmisc.f libRadtran-2.0.6/libsrc_f/dpsdisort.f \
              libRadtran-2.0.6/libsrc_f/inter.f libRadtran-2.0.6/libsrc_f/setout.f \
              libRadtran-2.0.6/libsrc_f/d1mach.f libRadtran-2.0.6/libsrc_f/spsmisc.f \
              libRadtran-2.0.6/libsrc_f/ErrPack.f libRadtran-2.0.6/libsrc_f/DISORT.MXD \
              d9mach-common-storage.c dpmisc.o dpsdisort.o inter.o setout.o d1mach.o spsmisc.o ErrPack.o d9mach-common-storage.o \
              inspect_wasm.py lowalt-t-exact.mjs lowalt-t-exact.wasm module-interface.txt
            echo '--- exact link command ---'
            echo 'emcc dpmisc.o dpsdisort.o inter.o setout.o d1mach.o spsmisc.o ErrPack.o d9mach-common-storage.o /opt/flang/wasm/lib/libFortranRuntime.a --no-entry -O0 -sMODULARIZE=1 -sEXPORT_ES6=1 -sENVIRONMENT=worker -sALLOW_MEMORY_GROWTH=0 -sINITIAL_MEMORY=67108864 -sSTACK_SIZE=1048576 -sERROR_ON_UNDEFINED_SYMBOLS=1 -sEXPORTED_FUNCTIONS=[_sdisort_,_dpsdisort_,_setout_,_malloc,_free] -sEXPORTED_RUNTIME_METHODS=[] -o lowalt-t-exact.mjs'
            echo '--- static module interface ---'
            cat module-interface.txt
            echo 'wasm_instantiated=false'
            echo 'runtime_executed=false'
            echo 'lt5_result=false'
            echo 'c_executed=false'
            echo 'd_executed=false'
          } > link-only-receipt.txt
          sha256sum link-only-receipt.txt > link-only-receipt.sha256

      - name: Upload immutable pre-result link closure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-lt5-t-link-closure-v3
          path: |
            lowalt-t-link/lowalt-t-exact.mjs
            lowalt-t-link/lowalt-t-exact.wasm
            lowalt-t-link/module-interface.txt
            lowalt-t-link/inspect_wasm.py
            lowalt-t-link/d9mach-common-storage.c
            lowalt-t-link/d9mach-common-storage.o
            lowalt-t-link/link-only-receipt.txt
            lowalt-t-link/link-only-receipt.sha256
            lowalt-t-link/failure-receipt.txt
          if-no-files-found: warn
          retention-days: 90
