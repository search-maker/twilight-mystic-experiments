name: lowalt-lt5-tref-wasm-build-only-v1

on:
  push:
    branches:
      - review/lowalt-lt5-tref-wasm-build-only-v1-20260916
    paths:
      - .github/workflows/lowalt-lt5-tref-wasm-build-only-v1.yml
      - review/lowalt-lt5-tref-wasm-build-only-v1/contract.json
      - review/lowalt-lt5-tref-wasm-build-only-v1/build-only.sh

permissions:
  contents: read
  actions: read

env:
  FLANG_WASM_IMAGE: ghcr.io/r-wasm/flang-wasm:main@sha256:bbaa3dc304de5b10df973cc8c49dbcd52ec815c309c35e9643ffe95d0e85b384
  R19E6_ARTIFACT_ID: '10136435459'
  R19E6_ARTIFACT_SHA256: 9a06a505fc3e5ef55d7e6fdadd259f84415c1a7e2c49ffc7d5f7cd6e7abe23b4

jobs:
  build-only-no-execution:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact pushed review head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce PRE-RESULT review-only contract
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'review/lowalt-lt5-tref-wasm-build-only-v1-20260916'
          grep -F '"classification": "PRE_RESULT_BUILD_ONLY_T_REFERENCE_WASM_FEASIBILITY"' review/lowalt-lt5-tref-wasm-build-only-v1/contract.json
          grep -F '"instantiateWasm": false' review/lowalt-lt5-tref-wasm-build-only-v1/contract.json
          grep -F '"executeWasm": false' review/lowalt-lt5-tref-wasm-build-only-v1/contract.json
          grep -F '"runBenchmark": false' review/lowalt-lt5-tref-wasm-build-only-v1/contract.json

      - name: Recover and verify frozen R19E6 reference source bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .lowalt-tref/source .lowalt-tref/out
          curl -LfsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -o .lowalt-tref/r19e6.zip \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/$R19E6_ARTIFACT_ID/zip"
          echo "$R19E6_ARTIFACT_SHA256  .lowalt-tref/r19e6.zip" | sha256sum -c -
          unzip -p .lowalt-tref/r19e6.zip reference/geofast_exact.f > .lowalt-tref/source/geofast_exact.f
          unzip -p .lowalt-tref/r19e6.zip reference/direct_ref_full.f > .lowalt-tref/source/direct_ref_full.f
          unzip -p .lowalt-tref/r19e6.zip reference/DISORT.MXD > .lowalt-tref/source/DISORT.MXD
          (
            cd .lowalt-tref/source
            echo 'a3d177f64a44f77227aa3a6774fc4ea744da1b9cc88a0059632b598bd4c8a1ac  geofast_exact.f' | sha256sum -c -
            echo '4f172445b795f8e3cb60f41f2c74835a4dd5978673d57b3c1f5aa82c78f7574c  direct_ref_full.f' | sha256sum -c -
            echo '9cf3f04bac9703b302a13b29eb1df11ea3200a992bc50ab3fa947d1d83c71f69  DISORT.MXD' | sha256sum -c -
          )

      - name: Pull exact pinned Fortran-to-WASM toolchain image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$FLANG_WASM_IMAGE"
          docker image inspect --format '{{.Id}}' "$FLANG_WASM_IMAGE" > .lowalt-tref/out/container-image-id.txt
          docker image inspect --format '{{json .RepoDigests}}' "$FLANG_WASM_IMAGE" > .lowalt-tref/out/container-repodigests.json

      - name: Compile and link only; never instantiate or execute WASM
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -e GITHUB_SHA \
            -e GITHUB_RUN_ID \
            -e GITHUB_RUN_ATTEMPT \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "$FLANG_WASM_IMAGE" \
            bash review/lowalt-lt5-tref-wasm-build-only-v1/build-only.sh /work/.lowalt-tref/source /work/.lowalt-tref/out/build
          sudo chown -R "$(id -u):$(id -g)" .lowalt-tref/out
          sha256sum .lowalt-tref/out/container-image-id.txt .lowalt-tref/out/container-repodigests.json >> .lowalt-tref/out/build/generated/sha256sums.txt
          grep -F '"wasmInstantiated": false' .lowalt-tref/out/build/generated/build-receipt.json
          grep -F '"wasmExecuted": false' .lowalt-tref/out/build/generated/build-receipt.json
          grep -F '"solverExecuted": false' .lowalt-tref/out/build/generated/build-receipt.json
          grep -F '"lt5SpectrumConstructed": false' .lowalt-tref/out/build/generated/build-receipt.json
          grep -F '"benchmarkExecuted": false' .lowalt-tref/out/build/generated/build-receipt.json
          test -s .lowalt-tref/out/build/generated/lt5-tref.wasm
          test -s .lowalt-tref/out/build/generated/lt5-tref.mjs
          cp review/lowalt-lt5-tref-wasm-build-only-v1/contract.json .lowalt-tref/out/contract.json
          sha256sum .lowalt-tref/r19e6.zip .lowalt-tref/source/* .lowalt-tref/out/contract.json > .lowalt-tref/out/input-sha256.txt

      - name: Publish immutable PRE-RESULT build-only evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lowalt-lt5-tref-wasm-build-only-v1
          path: .lowalt-tref/out
          if-no-files-found: error
          retention-days: 90
