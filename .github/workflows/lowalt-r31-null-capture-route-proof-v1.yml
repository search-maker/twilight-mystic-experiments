name: LowAlt R31 NULL predispatch capture-route proof

on:
  push:
    branches:
      - review/lowalt-r31-null-capture-route-proof-v1-20260910
    paths:
      - .github/workflows/lowalt-r31-null-capture-route-proof-v1.yml

permissions:
  contents: read

jobs:
  exact-source-runtime-route-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: lowalt-r31-null-route-proof-v1
          create-args: -c conda-forge python=3.12.4 rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true
      - name: Install debugger only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdb >/dev/null
      - name: Bind exact runtime and exact governing source
        shell: bash -el {0}
        run: |
          set -euo pipefail
          mkdir -p evidence/source evidence/runtime evidence/gdb
          UVSPEC="$(command -v uvspec)"
          printf '%s  %s\n' '2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3' "$UVSPEC" | sha256sum -c - | tee evidence/runtime/uvspec-sha-check.txt
          micromamba list rubin-libradtran | tee evidence/runtime/micromamba-package.txt
          grep -F 'rubin-libradtran' evidence/runtime/micromamba-package.txt | grep -F '2.0.6' | grep -F 'py312pl5321he9373c2_1'
          nm -an "$UVSPEC" > evidence/runtime/nm-all.txt
          grep -E ' (optical_properties|setup_and_call_solver|call_solver|setout_|sdisort_)$' evidence/runtime/nm-all.txt > evidence/runtime/route-symbols.txt
          for sym in optical_properties setup_and_call_solver call_solver setout_ sdisort_; do grep -q " $sym$" evidence/runtime/route-symbols.txt; done

          curl --fail --silent --show-error --location --compressed \
            'http://www.libradtran.org/download/libRadtran-2.0.6.tar.gz' \
            -o evidence/source/source-entity.tar
          printf '%s  %s\n' '999e47f4af4b5df6f85a6887fc105fc8f6e1a7cee89a3124f69ac8d8912c8e85' evidence/source/source-entity.tar | sha256sum -c - | tee evidence/source/source-sha-check.txt
          tar -xf evidence/source/source-entity.tar -C evidence/source libRadtran-2.0.6/src/solve_rte.c
          SRC=evidence/source/libRadtran-2.0.6/src/solve_rte.c
          sha256sum "$SRC" > evidence/source/solve-rte-sha256.txt
          rm evidence/source/source-entity.tar

          python - "$SRC" <<'PY'
          import json,pathlib,sys
          p=pathlib.Path(sys.argv[1]); lines=p.read_text().splitlines()
          def first_after(needle,start):
              for i,x in enumerate(lines,1):
                  if i>start and needle in x: return i
              raise SystemExit(f'missing exact source anchor after {start}: {needle}')
          setup=max(i for i,x in enumerate(lines,1) if 'static int setup_and_call_solver' in x)
          ordinary=first_after('status = optical_properties (input, output, 0.0, ir, iv1, iv2, ib, verbose, skip_optical_properties)',setup)
          solver_switch=first_after('switch (input.rte.solver)',ordinary)
          setout=first_after('F77_FUNC (setout, SETOUT)',solver_switch)
          nullcase=first_after('case SOLVER_NULL:',solver_switch)
          writeopt=first_after('if (input.write_optical_properties)',solver_switch)
          call_line=first_after('call_solver (input, output, rte_solver',writeopt)
          if not (setup < ordinary < solver_switch < setout < nullcase < writeopt < call_line):
              raise SystemExit('unexpected exact source order')
          # Our fresh route uses mol_abs_param crs, so the CK_LOWTRAN recalc block is not entered.
          ck=first_after('if (input.ck_scheme == CK_LOWTRAN)',ordinary)
          if not (ordinary < ck < solver_switch): raise SystemExit('unexpected CK_LOWTRAN block location')
          lo=ordinary-8; hi=call_line+5
          pathlib.Path('evidence/source/setup-and-call-solver-route.txt').write_text(''.join(f'{i:06d}: {lines[i-1]}\n' for i in range(lo,hi+1)))
          report={
            'schemaVersion':1,
            'classification':'EXACT_SOURCE_COMMON_POST_OPTICAL_PRE_SOLVER_MUTATION_POINT_EXISTS',
            'setupAndCallSolverLine':setup,
            'ordinaryOpticalPropertiesCallLine':ordinary,
            'ckLowtranConditionalLine':ck,
            'solverSpecificOutputTranslationSwitchLine':solver_switch,
            'sdisortSetoutMutationLine':setout,
            'nullNoSetoutCaseLine':nullcase,
            'writeOpticalPropertiesSwitchLine':writeopt,
            'callSolverLine':call_line,
            'sourceOrderProven':True,
            'writeOpticalPropertiesIsTooLateForRequiredPoint':True,
            'freshProbeUsesCrsSoCkLowtranRecalcNotEntered':True,
            'scientificExecution':False,
            'protectedDataOpened':False,
          }
          pathlib.Path('evidence/source/source-route.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          PY
      - name: Prove identical runtime breakpoint route for NULL and SDISORT without solver entry
        shell: bash -el {0}
        run: |
          set -euo pipefail
          UVSPEC="$(command -v uvspec)"
          DATA_DIR="$CONDA_PREFIX/share/libRadtran/data"
          cat > evidence/gdb/fresh-synthetic-base.inp <<EOF
          data_files_path $DATA_DIR
          atmosphere_file $DATA_DIR/atmmod/afglus.dat
          source solar
          mol_abs_param crs
          aerosol_default
          wavelength 553 553
          sza 87.32100000
          zout 0.000000
          albedo 0.17300000
          output_quantity transmittance
          output_user lambda edir
          quiet
          EOF
          cp evidence/gdb/fresh-synthetic-base.inp evidence/gdb/null.inp
          echo 'rte_solver null' >> evidence/gdb/null.inp
          cp evidence/gdb/fresh-synthetic-base.inp evidence/gdb/sdisort.inp
          printf '%s\n' 'rte_solver sdisort' 'sdisort nscat 1' >> evidence/gdb/sdisort.inp
          sha256sum evidence/gdb/null.inp evidence/gdb/sdisort.inp > evidence/gdb/input-sha256.txt

          run_probe () {
            role="$1"; inp="$2"; script="evidence/gdb/${role}.gdb"; log="evidence/gdb/${role}.log"
            cat > "$script" <<EOF
          set pagination off
          set confirm off
          set breakpoint pending on
          set logging file $log
          set logging overwrite on
          set logging enabled on
          break setup_and_call_solver
          run < $inp
          printf "MARK_HIT_SETUP_AND_CALL_SOLVER\\n"
          break optical_properties
          break setout_
          break call_solver
          break sdisort_
          continue
          printf "MARK_HIT_ORDINARY_OPTICAL_PROPERTIES\\n"
          finish
          printf "MARK_POST_OPTICAL_RETURN_PRE_MUTATION\\n"
          printf "ROUTE_OFFSET_FROM_SETUP=%ld\\n", (long)\$pc-(long)&setup_and_call_solver
          kill
          quit
          EOF
            gdb -q -batch -x "$script" "$UVSPEC" > "evidence/gdb/${role}.stdout" 2> "evidence/gdb/${role}.stderr"
          }
          run_probe null evidence/gdb/null.inp
          run_probe sdisort evidence/gdb/sdisort.inp

          python - <<'PY'
          import json,pathlib,re
          root=pathlib.Path('evidence/gdb'); rows={}
          for role in ('null','sdisort'):
              text=(root/f'{role}.log').read_text(errors='replace')
              for marker in ('MARK_HIT_SETUP_AND_CALL_SOLVER','MARK_HIT_ORDINARY_OPTICAL_PROPERTIES','MARK_POST_OPTICAL_RETURN_PRE_MUTATION'):
                  if marker not in text: raise SystemExit(f'{role}: missing {marker}')
              m=re.search(r'ROUTE_OFFSET_FROM_SETUP=(-?\d+)',text)
              if not m: raise SystemExit(f'{role}: missing route offset')
              rows[role]={'routeOffsetFromSetup':int(m.group(1))}
          if rows['null']['routeOffsetFromSetup'] != rows['sdisort']['routeOffsetFromSetup']:
              raise SystemExit(f'post-optical runtime PC offset differs: {rows}')
          report={
            'schemaVersion':1,
            'classification':'EXACT_RUNTIME_COMMON_POST_OPTICAL_RETURN_PC_PROVEN',
            'roles':rows,
            'samePinnedRuntimeBinary':True,
            'samePostOpticalPcOffset':True,
            'inferiorsKilledAtCommonPoint':True,
            'setoutExecutedAfterCommonPoint':False,
            'callSolverExecutedAfterCommonPoint':False,
            'sdisortEntryExecutedAfterCommonPoint':False,
            'scientificExecution':False,
            'protectedDataOpened':False,
            'claimBoundary':'route/ABI point only; no UTAU/VN or general NULL-vs-SDISORT value-equivalence claim'
          }
          (root/'runtime-route.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          PY
      - name: Build result-blind proof receipt
        shell: bash -el {0}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('evidence')
          receipt={
            'schemaVersion':1,
            'stageId':'LOWALT_STATE_0003_R31_NULL_CAPTURE_ROUTE_PREREQUISITE_PROOF_V1',
            'classification':'NULL_AND_SDISORT_SHARE_EXACT_POST_OPTICAL_PRE_SOLVER_MUTATION_RUNTIME_POINT',
            'sourceEntitySha256':'999e47f4af4b5df6f85a6887fc105fc8f6e1a7cee89a3124f69ac8d8912c8e85',
            'uvspecSha256':'2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3',
            'package':'rubin-libradtran=2.0.6=py312pl5321he9373c2_1',
            'sourceProof':json.loads((root/'source/source-route.json').read_text()),
            'runtimeProof':json.loads((root/'gdb/runtime-route.json').read_text()),
            'scientificExecution':False,
            'solverBodyExecution':False,
            'protectedDataOpened':False,
            'productionBoundaryChanged':False,
            'claimBoundary':'common result-blind observation point proven after ordinary optical_properties and before solver-specific setout/call_solver; no UTAU/VN equality and no general NULL-vs-SDISORT preprocessing equivalence claimed'
          }
          (root/'receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          (cd evidence && find . -type f ! -name manifest.sha256 -print0 | sort -z | xargs -0 sha256sum > manifest.sha256)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lowalt-r31-null-capture-route-proof-v1
          path: evidence
          if-no-files-found: error
          retention-days: 90
