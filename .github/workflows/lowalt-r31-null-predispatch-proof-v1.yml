name: Low-alt R31 NULL predispatch proof v1

on:
  push:
    branches:
      - review/lowalt-r31-null-predispatch-proof-v1
    paths:
      - ".github/workflows/lowalt-r31-null-predispatch-proof-v1.yml"

permissions:
  contents: read

jobs:
  capture-proof:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Freeze exact non-science proof boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/review/lowalt-r31-null-predispatch-proof-v1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          mkdir -p evidence
          cat > evidence/PROTOCOL.txt <<'EOF'
          LOWALT R31 NULL PREDISPATCH CAPTURE ROUTE PROOF V1
          NONPROTECTED / NON-SCIENCE / NO R31 IDENTITY / NO PROTECTED RESULT
          Goal: prove exact pinned-runtime NULL/SDISORT common observation point after ordinary optical_properties succeeds and before solver-specific setout dispatch.
          Paired synthetic executions differ only in rte_solver=null vs rte_solver=sdisort and are killed at the same common pre-dispatch instruction.
          No call_solver body, SDISORT body, MYSTIC body, scientific identity/seed/ordinal, Taylor/Jerusalem datum, or protected result may execute/open.
          Pinned runtime: rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          Pinned uvspec SHA256: 2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3
          Source entity SHA256: 999e47f4af4b5df6f85a6887fc105fc8f6e1a7cee89a3124f69ac8d8912c8e85
          Exact common breakpoint: setup_and_call_solver+0x257 (0xb26b7 non-relocated), first instruction of solver-specific switch.
          EOF

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: lowalt-r31-null-predispatch-proof-v1
          create-args: >-
            -c conda-forge
            python=3.12.4
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Install debugger
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdb binutils

      - name: Bind exact binary and exact decoded source entity
        shell: bash -el {0}
        run: |
          set -euo pipefail
          UVSPEC="$(command -v uvspec)"
          test "$(sha256sum "$UVSPEC" | awk '{print $1}')" = "2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3"
          printf '%s\n' "$UVSPEC" > evidence/uvspec-path.txt
          objdump -d -w -C -Mintel "$UVSPEC" > evidence/full-disassembly.txt
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re
          p=Path('evidence/full-disassembly.txt'); t=p.read_text(errors='replace')
          req={
            'setup_entry':r'^00000000000b2460 <setup_and_call_solver>:$',
            'optical_call':r'^\s*b2684:.*call\s+1ee20 <optical_properties>$',
            'status_test':r'^\s*b26a4:.*test\s+eax,eax$',
            'status_branch':r'^\s*b26a6:.*jne\s+b27f2 <setup_and_call_solver\+0x392>$',
            'switch_start':r'^\s*b26b7:.*cmp\s+r14d,0x1a$',
            'sdisort_setout':r'^\s*b2f32:.*call\s+1b9360 <setout_>$',
            'call_solver':r'^\s*b27cb:.*call\s+a9e30 <call_solver>$',
            'dtauc_offset':r'^\s*b2f0b:.*mov\s+rdi,QWORD PTR \[r15\+0x60\]$',
            'zd_offset':r'^\s*b2f24:.*mov\s+r8,QWORD PTR \[r15\+0x658\]$'
          }
          got={k:bool(re.search(v,t,re.M)) for k,v in req.items()}
          if not all(got.values()): raise SystemExit('static binding failed '+json.dumps(got,sort_keys=True))
          abi=[r'^\s*b2462:.*mov\s+r15,rdi$',r'^\s*b2487:.*mov\s+QWORD PTR \[rsp\+0x38\],rsi$',r'^\s*b24e2:.*mov\s+r14d,DWORD PTR \[rsp\+0x298\]$',r'^\s*b2f2b:.*mov\s+rcx,QWORD PTR \[rax\+0xa8\]$']
          if not all(re.search(x,t,re.M) for x in abi): raise SystemExit('ABI offset binding failed')
          Path('evidence/static-binding.json').write_text(json.dumps({
            'uvspecSha256':'2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3',
            'disassemblySha256':hashlib.sha256(p.read_bytes()).hexdigest(),
            'requiredStaticBindings':got,
            'commonBreakpoint':'setup_and_call_solver+0x257',
            'commonNonRelocatedAddress':'0xb26b7',
            'outputPointerRegister':'r15','rteInPointerSavedAt':'rsp+0x38','solverSelectorRegister':'r14d',
            'outputOffsets':{'dtaucPointer':'0x60','ssalbPointer':'0x88','zdPointer':'0x658','nlyrI32':'0x664','nzoutI32':'0x690'},
            'rteInOffsets':{'utauPointer':'0xa8'}
          },indent=2,sort_keys=True)+'\n')
          PY

          curl --compressed -fL --max-time 120 'http://www.libradtran.org/download/libRadtran-2.0.6.tar.gz' -o evidence/libRadtran-2.0.6.tar.gz 2>evidence/source-fetch.stderr
          got="$(sha256sum evidence/libRadtran-2.0.6.tar.gz | awk '{print $1}')"
          printf '%s\n' "$got" > evidence/source-entity-sha256.txt
          test "$got" = "999e47f4af4b5df6f85a6887fc105fc8f6e1a7cee89a3124f69ac8d8912c8e85"
          member="$(tar -tf evidence/libRadtran-2.0.6.tar.gz | grep -E '/src/solve_rte\.c$' | head -1)"
          test -n "$member"
          tar -xOf evidence/libRadtran-2.0.6.tar.gz "$member" > evidence/solve_rte.c
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,re
          p=Path('evidence/solve_rte.c'); t=p.read_text(errors='replace')
          iop=t.find('status = optical_properties (')
          if iop < 0: raise SystemExit('ordinary optical_properties marker missing')
          fs=t.rfind('setup_and_call_solver',0,iop)
          if fs < 0: raise SystemExit('setup_and_call_solver definition anchor missing')
          icall=t.find('status = call_solver (',iop)
          if icall < 0: raise SystemExit('call_solver marker missing')
          seg=t[fs:icall+len('status = call_solver (')]
          itr=seg.find('translate output altitudes (zout) to optical depths (utau)')
          if itr < 0: raise SystemExit('utau translation marker missing')
          isd=seg.find('case SOLVER_SDISORT',itr)
          iset=seg.find('c_setout',isd)
          inull=seg.find('case SOLVER_NULL',itr)
          itest=seg.find('if (input.test_optical_properties)',max(iset,itr))
          if min(isd,iset,inull,itest) < 0: raise SystemExit('scoped solver marker missing')
          # The relevant NULL/SDISORT cases must be in the same post-optical-properties translation switch.
          if not (0 < itr < min(isd,inull) and isd < iset and max(isd,inull,iset) < itest):
              raise SystemExit('scoped source ordering mismatch')
          null_tail=seg[inull:itest]
          # Fail closed if NULL itself contains setout before the late test-only switch.
          null_case_end=null_tail.find('case ',len('case SOLVER_NULL'))
          null_case=null_tail if null_case_end < 0 else null_tail[:null_case_end]
          if 'c_setout' in null_case or 'F77_FUNC (setout' in null_case:
              raise SystemExit('NULL unexpectedly performs setout')
          Path('evidence/exact-source-binding.json').write_text(json.dumps({
            'sourceEntitySha256':'999e47f4af4b5df6f85a6887fc105fc8f6e1a7cee89a3124f69ac8d8912c8e85',
            'solveRteSha256':hashlib.sha256(p.read_bytes()).hexdigest(),
            'ordinaryOpticalPropertiesBeforeTranslationSwitch':True,
            'plainNullSkipsSetout':True,
            'sdisortUsesSetout':True,
            'lateTestOpticalPropertiesNullSwitchExistsAfterSetoutSwitch':True,
            'scopedOffsets':{'functionAnchor':fs,'opticalProperties':iop,'translate':itr,'sdisortCase':isd,'setout':iset,'nullCase':inull,'lateTestSwitch':itest}
          },indent=2,sort_keys=True)+'\n')
          PY

      - name: Build paired synthetic inputs
        shell: bash -el {0}
        run: |
          set -euo pipefail
          D="$CONDA_PREFIX/share/libRadtran/data"; test -d "$D"
          cat > evidence/base.inp <<EOF
          data_files_path $D
          atmosphere_file $D/atmmod/afglus.dat
          source solar
          mol_abs_param crs
          aerosol_default
          wavelength 613 613
          sza 87.37000000
          atm_z_grid 1.370000 2.370000 3.370000 4.370000 5.370000 6.370000 7.370000 8.370000 9.370000 10.370000 12.370000 14.370000 16.370000 18.370000 20.370000 23.370000 26.370000 30.370000 35.370000 40.370000 45.370000 50.370000 55.370000 60.370000 65.370000 70.370000 75.370000 80.370000 85.370000 90.370000 95.370000 100.370000 105.370000 110.370000 115.370000 120.000000
          zout 0.000000
          albedo 0.31415900
          __SOLVER__
          sdisort nscat 1
          output_quantity transmittance
          output_user lambda edir
          quiet
          EOF
          sed 's/__SOLVER__/rte_solver null/' evidence/base.inp > evidence/null.inp
          sed 's/__SOLVER__/rte_solver sdisort/' evidence/base.inp > evidence/sdisort.inp
          python - <<'PY'
          from pathlib import Path
          a=Path('evidence/null.inp').read_text(); b=Path('evidence/sdisort.inp').read_text()
          assert a.replace('rte_solver null','rte_solver __PAIR__')==b.replace('rte_solver sdisort','rte_solver __PAIR__')
          PY

      - name: Capture paired common predispatch state and kill immediately
        shell: bash -el {0}
        run: |
          set -euo pipefail
          UVSPEC="$(command -v uvspec)"
          for solver in null sdisort; do
            mkdir -p "evidence/$solver"
            cat > "evidence/$solver/capture.gdb" <<'GDB'
          set pagination off
          set confirm off
          set breakpoint pending on
          break *setup_and_call_solver+0x257
          commands
            silent
            python
          import gdb,os,struct,hashlib,json
          from pathlib import Path
          outdir=Path(os.environ['CAPTURE_DIR']); inf=gdb.selected_inferior()
          def mem(a,n): return bytes(inf.read_memory(a,n))
          def reg(n): return int(gdb.parse_and_eval('$'+n))
          def u64(a): return struct.unpack('<Q',mem(a,8))[0]
          def i32(a): return struct.unpack('<i',mem(a,4))[0]
          def save(name,b): (outdir/name).write_bytes(b); return hashlib.sha256(b).hexdigest()
          pc=reg('pc'); out=reg('r15'); rsp=reg('rsp'); selector=reg('r14d'); rte=u64(rsp+0x38)
          nlyr=i32(out+0x664); nzout=i32(out+0x690)
          if not (0<nlyr<=256 and 0<nzout<=256): raise RuntimeError(('shape',nlyr,nzout))
          dtp=u64(out+0x60); ssp=u64(out+0x88); zdp=u64(out+0x658); utp=u64(rte+0xa8)
          hashes={'DTAUC':save('dtauc-f32le.bin',mem(dtp,4*nlyr)),'SSALB':save('ssalb-f32le.bin',mem(ssp,4*nlyr)),'ZD':save('zd-f32le.bin',mem(zdp,4*(nlyr+1))),'UTAU_PRE_SETOUT':save('utau-pre-setout-f32le.bin',mem(utp,4*nzout))}
          (outdir/'metadata.json').write_text(json.dumps({'pc':hex(pc),'solverSelectorR14d':selector,'nlyr':nlyr,'nzout':nzout,'rawSha256':hashes,'capturePoint':'setup_and_call_solver+0x257','killedBeforeSolverSpecificSwitchInstructionExecutes':True},indent=2,sort_keys=True)+'\n')
            end
            kill
            quit
          end
          run
          GDB
            CAPTURE_DIR="$PWD/evidence/$solver" gdb -q -batch -x "evidence/$solver/capture.gdb" --args "$UVSPEC" < "evidence/$solver.inp" > "evidence/$solver/gdb.stdout" 2> "evidence/$solver/gdb.stderr"
          done

      - name: Classify exact capture route
        shell: bash -el {0}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('evidence'); n=json.loads((root/'null/metadata.json').read_text()); s=json.loads((root/'sdisort/metadata.json').read_text())
          assert n['solverSelectorR14d']==16,n
          assert s['solverSelectorR14d']==2,s
          assert n['nlyr']==s['nlyr'] and n['nzout']==s['nzout']
          assert n['rawSha256']==s['rawSha256'],(n['rawSha256'],s['rawSha256'])
          src=json.loads((root/'exact-source-binding.json').read_text()); static=json.loads((root/'static-binding.json').read_text())
          decision={
            'schemaVersion':2,
            'classification':'R31_NULL_PREDISPATCH_COMMON_OBSERVATION_POINT_PROVEN',
            'pinnedUvspecSha256':static['uvspecSha256'],
            'sourceEntitySha256':src['sourceEntitySha256'],
            'commonBreakpoint':static['commonBreakpoint'],
            'nullObservedSolverSelector':n['solverSelectorR14d'],'sdisortObservedSolverSelector':s['solverSelectorR14d'],
            'ordinaryPreSetoutSubsetBitExact':True,
            'ordinaryPreSetoutComparedFields':['DTAUC','SSALB','ZD','UTAU_PRE_SETOUT'],
            'plainNullSkipsSetout':src['plainNullSkipsSetout'],'sdisortUsesSetout':src['sdisortUsesSetout'],
            'bothKilledBeforeSolverSpecificSwitchInstructionExecutes':True,
            'sdisortBodyExecuted':False,'callSolverBodyExecuted':False,'protectedResultOpened':False,'scientificIdentityConsumed':False,
            'claimBoundary':'Proves exact source/ABI common observation point after ordinary optical-property assembly and before solver-specific setout. Plain NULL does not perform SDISORT c_setout, so this does not assert final post-setout UTAU equivalence or general NULL-vs-SDISORT equivalence.'
          }
          (root/'decision.json').write_text(json.dumps(decision,indent=2,sort_keys=True)+'\n')
          manifest={}
          for p in sorted(root.rglob('*')):
            if p.is_file() and p.name!='manifest-sha256.json': manifest[str(p.relative_to(root))]=hashlib.sha256(p.read_bytes()).hexdigest()
          (root/'manifest-sha256.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          print(json.dumps(decision,sort_keys=True))
          PY

      - name: Preserve immutable proof
        uses: actions/upload-artifact@v4
        with:
          name: lowalt-r31-null-predispatch-proof-v1
          path: evidence/
          if-no-files-found: error
          retention-days: 90