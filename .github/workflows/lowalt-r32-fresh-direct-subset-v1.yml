name: LOWALT R32 fresh direct-subset frozen gate
run-name: LOWALT R32 fresh direct-subset frozen gate ${{ github.sha }}

on:
  push:
    branches:
      - execution/lowalt-r32-fresh-direct-subset-v1-20260910
    paths:
      - .github/workflows/lowalt-r32-fresh-direct-subset-v1.yml

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: lowalt-r32-fresh-direct-subset-v1-20260910
  cancel-in-progress: false

env:
  EXPECTED_BRANCH: execution/lowalt-r32-fresh-direct-subset-v1-20260910
  BASE_MAIN_SHA: f5ebc646aba96ad13753d55baf2b0c55cff64ccb
  COORDINATOR_COMMENT_ID: "5623807626"
  COORDINATOR_CREATED_AT: "2026-09-10T18:50:36Z"
  SOURCE_URL: http://www.libradtran.org/download/libRadtran-2.0.6.tar.gz
  SOURCE_ENTITY_SHA256: 999e47f4af4b5df6f85a6887fc105fc8f6e1a7cee89a3124f69ac8d8912c8e85
  PACKAGE_SHA256: 9090033a39a7e963ecabb31d5cbd264330c64ec1c4cb5f44be2e70f10cbc54c2
  UVSPEC_SHA256: 2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3
  MATRIX_SHA256: 15ee372f4c75f45949380c3a9ce9143d5212b2bc1edec251f09439f8a395d027
  CONTRACT_SHA256: b2538daa60fcf030d1b5f2dc5aca2a0fb1507a261bde86a8ce521e12c4a4cee0
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  r32-frozen-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize exact pre-result frozen bytes
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/experiments/lowalt-state0003/r32"
          mkdir -p "$ROOT"
          printf '%s' '' | base64 -d | gzip -d > "$ROOT/matrix.csv"
          printf '%s' '' | base64 -d | gzip -d > "$ROOT/contract.json"
          printf '%s' '' | base64 -d | gzip -d > "$ROOT/freeze-manifest.json"
          printf '%s' '' | base64 -d | gzip -d > "$ROOT/null_transform_capture.gdb"
          printf '%s' '' | base64 -d | gzip -d > "$ROOT/native_capture.gdb"
          printf '%s' '' | base64 -d | gzip -d > "$ROOT/run_r32.py"
          chmod +x "$ROOT/run_r32.py"
          sha256sum "$ROOT"/* > "$ROOT/materialized.sha256"
          test "$(sha256sum "$ROOT/matrix.csv" | awk '{print $1}')" = "$MATRIX_SHA256"
          test "$(sha256sum "$ROOT/contract.json" | awk '{print $1}')" = "$CONTRACT_SHA256"
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: lowalt-r32-frozen
          create-args: >-
            -c conda-forge
            python=3.12.4
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1
            gfortran_impl_linux-64=13.4.0=hb485fb8_18
            gfortran_linux-64=13.4.0=hce61b40_21
            gcc_impl_linux-64=13.4.0=he2fa53e_18
          cache-environment: true
          cache-downloads: true
      - name: Install exact-executable stress tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdb binutils curl file >/dev/null
      - name: Run frozen pre-stress development and gated sealed audit
        env:
          GH_TOKEN: ${{ github.token }}
          STARSVISIBILITY_READ_TOKEN: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          export R32_ROOT="$GITHUB_WORKSPACE/experiments/lowalt-state0003/r32"
          export EVIDENCE_DIR="$RUNNER_TEMP/lowalt-r32-evidence"
          mkdir -p "$EVIDENCE_DIR"
          python "$R32_ROOT/run_r32.py"
      - name: Upload isolated immutable evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lowalt-r32-fresh-direct-subset-evidence
          path: ${{ runner.temp }}/lowalt-r32-evidence/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
