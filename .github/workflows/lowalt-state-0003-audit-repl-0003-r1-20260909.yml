name: LOWALT STATE-0003 fresh audit replacement capture R1
run-name: LOWALT STATE-0003 audit replacement capture R1 ${{ github.sha }}

on:
  push:
    branches:
      - execution/lowalt-state-0003-audit-repl-0003-r1-20260909

permissions:
  contents: read
  actions: read

concurrency:
  group: lowalt-state-0003-audit-repl-0003-r1-20260909
  cancel-in-progress: false

env:
  EXPECTED_BRANCH: execution/lowalt-state-0003-audit-repl-0003-r1-20260909
  BASE_MAIN_SHA: 4310e58c0c4ecb8ece305f0f27b47122c1febad6
  CONTROLLER_STARS_MAIN_SHA: 1e74d0522f086dba634a587bb245c32bcd4fac60
  CONTROLLER_AVPS_BRANCH: repair/avps-recovery4-canonical-write-quiet-parser-v1-20260909
  CONTROLLER_AVPS_HEAD: f85680b43854f42d59e2f524a8d5bfbcc17ec641
  ISSUE60_COMMENT_COUNT: '1307'
  ISSUE60_UPDATED_AT: '2026-09-09T11:59:49Z'
  ISSUE60_LATEST_COMMENT_ID: '5601470985'
  UVSPEC_SHA256: 2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3
  PACKAGE_SPEC: rubin-libradtran=2.0.6=py312pl5321he9373c2_1
  GOVERNING_SOURCE_SHA256: 999e47f4af4b5df6f85a6887fc105fc8f6e1a7cee89a3124f69ac8d8912c8e85
  CASE_ID: gatea-r11b-audit-repl-0003-r1
  CASE_ALT_DEG: '0.81'
  CASE_SZA_DEG: '89.19000000'
  CASE_WL_NM: '467'
  CASE_SITE_KM: '1.25'
  CASE_AEROSOL: OFF

jobs:
  capture-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact fresh replacement commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify one-file execution boundary and freeze replacement before preprocessing
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mapfile -t PARENTS < <(git cat-file -p HEAD | sed -n 's/^parent //p')
          test "${#PARENTS[@]}" = 1
          test "${PARENTS[0]}" = "$BASE_MAIN_SHA"
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = 1
          test "${CHANGED[0]}" = '.github/workflows/lowalt-state-0003-audit-repl-0003-r1-20260909.yml'
          EVIDENCE_DIR="$RUNNER_TEMP/lowalt_state0003_audit_repl_0003_r1"
          rm -rf "$EVIDENCE_DIR"
          mkdir -p "$EVIDENCE_DIR/case"
          echo "EVIDENCE_DIR=$EVIDENCE_DIR" >> "$GITHUB_ENV"
          python - "$EVIDENCE_DIR" <<'PY'
          import csv, hashlib, json, os, sys
          from pathlib import Path
          e=Path(sys.argv[1])
          row={
            'case_id':os.environ['CASE_ID'],
            'split':'audit_replacement',
            'target_geometric_altitude_deg':os.environ['CASE_ALT_DEG'],
            'source_zenith_angle_deg':os.environ['CASE_SZA_DEG'],
            'wavelength_nm':os.environ['CASE_WL_NM'],
            'observer_elevation_km':os.environ['CASE_SITE_KM'],
            'aerosol':os.environ['CASE_AEROSOL'],
            'nsza_denstab':'0',
          }
          p=e/'replacement-matrix.csv'
          with p.open('w',newline='',encoding='utf-8') as f:
            w=csv.DictWriter(f,fieldnames=list(row),lineterminator='\n'); w.writeheader(); w.writerow(row)
          freeze={
            'schemaVersion':1,
            'classification':'STATE_0003_FRESH_NONPROTECTED_AUDIT_REPLACEMENT_FROZEN_BEFORE_RESULT',
            'executionIdentity':'lowalt-state-0003-audit-repl-0003-r1-20260909',
            'case':row,
            'matrixSha256':hashlib.sha256(p.read_bytes()).hexdigest(),
            'acceptanceContractUnchanged':{
              'nfacNfac2':'exact',
              'facFac2Chp2Ch':'abs_or_rel_le_1e-10',
              'directFloat64':'abs_or_rel_le_1e-12',
              'exactZeroSemantics':True
            },
            'protectedResidualUsedForSelection':False,
            'taylorOrJerusalemUsed':False,
            'protectedGeographyUsed':False,
            'seedOrOrdinalUsed':False,
            'solverContinuationAllowed':False,
            'solverResultOpeningAllowed':False,
            'productionChanged':False,
            'v1FiveDegreeSeamChanged':False
          }
          (e/'replacement-freeze.json').write_text(json.dumps(freeze,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY

      - name: Set up exact inherited libRadtran runtime
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: lowalt-state-0003-audit-repl-r1
          create-args: -c conda-forge python=3.12.4 rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Bind exact package executable and debugger
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          UVSPEC="$(command -v uvspec)"
          test -n "$UVSPEC"
          ACTUAL_UVSPEC_SHA="$(sha256sum "$UVSPEC" | awk '{print $1}')"
          test "$ACTUAL_UVSPEC_SHA" = "$UVSPEC_SHA256"
          micromamba list rubin-libradtran --json > "$EVIDENCE_DIR/micromamba-rubin-libradtran.json"
          ACTUAL_PACKAGE_SPEC="$(python - "$EVIDENCE_DIR/micromamba-rubin-libradtran.json" <<'PY'
          import json,sys
          obj=json.load(open(sys.argv[1],encoding='utf-8')); rows=[]
          def walk(x):
            if isinstance(x,dict):
              if x.get('name')=='rubin-libradtran': rows.append(x)
              for v in x.values(): walk(v)
            elif isinstance(x,list):
              for v in x: walk(v)
          walk(obj); specs=set()
          for r in rows:
            version=r.get('version'); build=r.get('build_string',r.get('build'))
            if version and build: specs.add(f'rubin-libradtran={version}={build}')
          if len(specs)!=1: raise SystemExit(sorted(specs))
          print(next(iter(specs)))
          PY
          )"
          test "$ACTUAL_PACKAGE_SPEC" = "$PACKAGE_SPEC"
          DATA_DIR="$CONDA_PREFIX/share/libRadtran/data"
          test -f "$DATA_DIR/atmmod/afglus.dat"
          if ! command -v gdb >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq gdb
          fi
          GDB="$(command -v gdb)"
          printf 'uvspec=%s\nuvspec_sha256=%s\npackage_spec=%s\ndata_dir=%s\ngdb=%s\ngoverning_source_sha256=%s\n' "$UVSPEC" "$ACTUAL_UVSPEC_SHA" "$ACTUAL_PACKAGE_SPEC" "$DATA_DIR" "$GDB" "$GOVERNING_SOURCE_SHA256" > "$EVIDENCE_DIR/runtime-binding.txt"
          echo "UVSPEC=$UVSPEC" >> "$GITHUB_ENV"
          echo "LIBRADTRAN_DATA=$DATA_DIR" >> "$GITHUB_ENV"
          echo "GDB=$GDB" >> "$GITHUB_ENV"

      - name: Fresh authoritative nonblocking fence immediately before capture
        env:
          GH_TOKEN: ${{ github.token }}
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          git fetch -q origin main
          test "$(git rev-parse origin/main)" = "$BASE_MAIN_SHA"
          python - <<'PY'
          import json, os, urllib.request
          def get(url):
            req=urllib.request.Request(url,headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+os.environ['GH_TOKEN']})
            with urllib.request.urlopen(req) as r: return json.load(r)
          issue=get('https://api.github.com/repos/search-maker/twilight-mystic-experiments/issues/60')
          assert str(issue['comments'])==os.environ['ISSUE60_COMMENT_COUNT']
          assert issue['updated_at']==os.environ['ISSUE60_UPDATED_AT']
          comments=get('https://api.github.com/repos/search-maker/twilight-mystic-experiments/issues/60/comments?per_page=1&page='+os.environ['ISSUE60_COMMENT_COUNT'])
          assert len(comments)==1 and str(comments[0]['id'])==os.environ['ISSUE60_LATEST_COMMENT_ID']
          stars=get('https://api.github.com/repos/search-maker/starsvisibility/branches/main')
          assert stars['commit']['sha']==os.environ['CONTROLLER_STARS_MAIN_SHA']
          avps=get('https://api.github.com/repos/search-maker/twilight-mystic-experiments/branches/'+os.environ['CONTROLLER_AVPS_BRANCH'])
          assert avps['commit']['sha']==os.environ['CONTROLLER_AVPS_HEAD']
          for status in ('in_progress','queued'):
            runs=get('https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/runs?status='+status+'&per_page=100')['workflow_runs']
            others=[int(r['id']) for r in runs if int(r['id'])!=int(os.environ['GITHUB_RUN_ID'])]
            assert not others, (status,others)
          PY
          cat > "$EVIDENCE_DIR/pre-capture-fence.json" <<EOF
          {"schemaVersion":1,"issue60CommentCount":1307,"issue60LatestCommentId":5601470985,"twilightMain":"$BASE_MAIN_SHA","starsMain":"$CONTROLLER_STARS_MAIN_SHA","liveAvpsHead":"$CONTROLLER_AVPS_HEAD","otherInProgressOrQueuedRuns":0,"captureMayProceed":true}
          EOF

      - name: Resolve exact installed SDISORT entry symbol
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          nm -an "$UVSPEC" > "$EVIDENCE_DIR/nm-all.txt"
          SDISORT_SYMBOL="$(python - "$EVIDENCE_DIR/nm-all.txt" <<'PY'
          import sys
          found=[]
          for line in open(sys.argv[1],encoding='utf-8',errors='replace'):
            p=line.split()
            if len(p)>=3 and p[-1] in {'sdisort','sdisort_'} and p[-2] in {'T','t'}: found.append(p[-1])
          found=sorted(set(found))
          if len(found)!=1: raise SystemExit(found)
          print(found[0])
          PY
          )"
          echo "$SDISORT_SYMBOL" > "$EVIDENCE_DIR/resolved-sdisort-symbol.txt"
          echo "SDISORT_SYMBOL=$SDISORT_SYMBOL" >> "$GITHUB_ENV"

      - name: Capture replacement final SDISORT handoff and kill before solver body
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          CASE_DIR="$EVIDENCE_DIR/case"; export CASE_DIR
          PROBE_INPUT="$CASE_DIR/input.inp"
          python - "$LIBRADTRAN_DATA/atmmod/afglus.dat" "$PROBE_INPUT" <<'PY'
          from pathlib import Path
          import os,sys
          atm=Path(sys.argv[1]); out=Path(sys.argv[2]); site=float(os.environ['CASE_SITE_KM']); wl=int(os.environ['CASE_WL_NM']); sza=float(os.environ['CASE_SZA_DEG'])
          levels=[]
          for raw in atm.read_text(encoding='utf-8').splitlines():
            s=raw.strip()
            if s and not s.startswith('#'): levels.append(float(s.split()[0]))
          if len(levels)<2 or any(levels[i] <= levels[i+1] for i in range(len(levels)-1)): raise SystemExit('bad AFGLUS grid')
          grid=[site,*sorted(z for z in levels if z>site)]
          lines=[f'data_files_path {atm.parent.parent}',f'atmosphere_file {atm}','source solar','mol_abs_param crs',f'wavelength {wl} {wl}',f'sza {sza:.8f}','atm_z_grid '+' '.join(f'{z:.6f}' for z in grid),'zout 0.000000','albedo 0.15000000','rte_solver sdisort','sdisort nscat 1','output_quantity transmittance','output_user lambda edir','quiet']
          out.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          sha256sum "$PROBE_INPUT" > "$CASE_DIR/input.sha256"
          cat > "$RUNNER_TEMP/capture.gdb" <<'GDBEOF'
          set pagination off
          set confirm off
          python
          import gdb, os, struct, hashlib, json
          from pathlib import Path
          d=Path(os.environ['CASE_DIR']); sym=os.environ['SDISORT_SYMBOL']; inf=gdb.selected_inferior()
          pc=int(gdb.parse_and_eval('$pc')); rsp=int(gdb.parse_and_eval('$rsp')); rdi=int(gdb.parse_and_eval('$rdi')); rsi=int(gdb.parse_and_eval('$rsi')); rdx=int(gdb.parse_and_eval('$rdx')); entry=int(gdb.parse_and_eval('&'+sym))
          def mem(a,n): return bytes(inf.read_memory(a,n))
          def ptr(off): return struct.unpack('<Q',mem(rsp+off,8))[0]
          def i32(a): return struct.unpack('<i',mem(a,4))[0]
          def f32(a): return struct.unpack('<f',mem(a,4))[0]
          nlyr=i32(rdi); ntau=i32(ptr(24))
          if not (0<nlyr<4096 and 0<ntau<4096): raise RuntimeError((nlyr,ntau))
          p={'dtauc':rsi,'ssalb':rdx,'utau':ptr(32),'umu0':ptr(112),'newgeo':ptr(128),'zd':ptr(136),'spher':ptr(144),'radius':ptr(152),'nrefrac':ptr(392),'ichap':ptr(400),'vn':ptr(408),'ndenssza':ptr(416),'dtauc_mb':ptr(448)}
          blobs={'dtauc_f32le.bin':mem(p['dtauc'],nlyr*4),'ssalb_f32le.bin':mem(p['ssalb'],nlyr*4),'utau_f32le.bin':mem(p['utau'],ntau*4),'zd_f32le.bin':mem(p['zd'],(nlyr+1)*4),'vn_f32le.bin':mem(p['vn'],(nlyr+1)*4),'dtauc_mb_f32le.bin':mem(p['dtauc_mb'],nlyr*4)}
          hs={}
          for name,b in blobs.items(): (d/name).write_bytes(b); hs[name]=hashlib.sha256(b).hexdigest()
          m={'schemaVersion':1,'caseId':os.environ['CASE_ID'],'resolvedEntrySymbol':sym,'pcEqualsEntry':pc==entry,'nlyr':nlyr,'ntau':ntau,'radiusKm':f32(p['radius']),'umu0':f32(p['umu0']),'nrefrac':i32(p['nrefrac']),'ichap':i32(p['ichap']),'newgeoRawI32':i32(p['newgeo']),'spherRawI32':i32(p['spher']),'ndenssza':i32(p['ndenssza']),'rawArraySha256':hs,'solverBodyInstructionExecutedAfterEntryBreakpoint':False,'solverResultOpened':False,'protectedResultOpened':False}
          (d/'capture-metadata.json').write_text(json.dumps(m,indent=2,sort_keys=True)+'\n')
          end
          kill
          quit
          GDBEOF
          export CASE_ID
          set +e
          "$GDB" -q -batch -ex "file $UVSPEC" -ex "break $SDISORT_SYMBOL" -ex "run < $PROBE_INPUT > $CASE_DIR/inferior.stdout 2> $CASE_DIR/inferior.stderr" -x "$RUNNER_TEMP/capture.gdb" > "$CASE_DIR/gdb.txt" 2>&1
          RC=$?
          set -e
          echo "$RC" > "$CASE_DIR/gdb-exit-code.txt"
          test "$RC" -eq 0
          test ! -s "$CASE_DIR/inferior.stdout"
          test ! -s "$CASE_DIR/inferior.stderr"
          python - "$CASE_DIR/capture-metadata.json" "$EVIDENCE_DIR" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          m=json.load(open(sys.argv[1],encoding='utf-8')); e=Path(sys.argv[2])
          assert m['pcEqualsEntry'] is True
          assert m['solverBodyInstructionExecutedAfterEntryBreakpoint'] is False
          assert m['solverResultOpened'] is False and m['protectedResultOpened'] is False
          assert m['radiusKm']==6370.0 and m['nrefrac']==0 and m['ichap']==1 and m['ndenssza']==0
          assert m['newgeoRawI32'] != 0 and m['spherRawI32'] != 0
          summary={'schemaVersion':1,'classification':'STATE_0003_FRESH_AUDIT_REPLACEMENT_FINAL_SDISORT_HANDOFF_CAPTURE_PASS','caseId':m['caseId'],'entryInterceptions':1,'solverBodyContinuations':0,'solverResultsOpened':0,'protectedResultsOpened':0,'rawArraySha256':m['rawArraySha256'],'exactPackage':'rubin-libradtran=2.0.6=py312pl5321he9373c2_1','uvspecSha256':'2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3','governingSourceSha256':'999e47f4af4b5df6f85a6887fc105fc8f6e1a7cee89a3124f69ac8d8912c8e85','compiledEquivalenceOpened':False,'formalAuditAcceptanceComplete':False,'productionChanged':False,'v1FiveDegreeSeamChanged':False}
          (e/'capture-summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          manifest=[]
          for p in sorted(x for x in e.rglob('*') if x.is_file() and x.name!='evidence-manifest.sha256'):
            manifest.append(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(e).as_posix()}')
          (e/'evidence-manifest.sha256').write_text('\n'.join(manifest)+'\n',encoding='utf-8')
          print(json.dumps(summary,sort_keys=True))
          PY

      - name: Publish isolated replacement-capture evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lowalt-state-0003-audit-repl-0003-r1-20260909
          path: ${{ runner.temp }}/lowalt_state0003_audit_repl_0003_r1/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
