name: LOWALT STATE-0003 buildenv provenance R13b
run-name: LOWALT STATE-0003 buildenv provenance R13b ${{ github.sha }}

on:
  push:
    branches:
      - execution/lowalt-state-0003-buildenv-provenance-r13b-20260909

permissions:
  contents: read

concurrency:
  group: lowalt-state-0003-buildenv-provenance-r13b-20260909
  cancel-in-progress: false

env:
  EXPECTED_BRANCH: execution/lowalt-state-0003-buildenv-provenance-r13b-20260909
  BASE_MAIN_SHA: 8cd85cf393e2d86a1b6d7325654747460a13e697
  PACKAGE_SPEC: rubin-libradtran=2.0.6=py312pl5321he9373c2_1
  PACKAGE_URL: https://conda.anaconda.org/conda-forge/linux-64/rubin-libradtran-2.0.6-py312pl5321he9373c2_1.conda
  PACKAGE_SHA256: 9090033a39a7e963ecabb31d5cbd264330c64ec1c4cb5f44be2e70f10cbc54c2
  UVSPEC_SHA256: 2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  exact-package-buildenv-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact provenance branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify additive non-science boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD^)" = "$BASE_MAIN_SHA"
          mapfile -t CHANGED < <(git diff --name-only "$BASE_MAIN_SHA"..HEAD | sort)
          test "${#CHANGED[@]}" = 1
          test "${CHANGED[0]}" = ".github/workflows/lowalt-state-0003-buildenv-provenance-r13b-20260909.yml"
          EVIDENCE_DIR="$RUNNER_TEMP/lowalt_state0003_buildenv_provenance_r13b_20260909"
          rm -rf "$EVIDENCE_DIR"
          mkdir -p "$EVIDENCE_DIR/download" "$EVIDENCE_DIR/package-info" "$EVIDENCE_DIR/runtime" "$EVIDENCE_DIR/elf" "$EVIDENCE_DIR/static-objects"
          echo "EVIDENCE_DIR=$EVIDENCE_DIR" >> "$GITHUB_ENV"
          cat > "$EVIDENCE_DIR/boundary.json" <<EOF
          {
            "schemaVersion": 1,
            "classification": "STATE_0003_EXACT_PACKAGE_BUILDENV_PROVENANCE_R13B",
            "baseMainSha": "$BASE_MAIN_SHA",
            "workflowHeadSha": "$GITHUB_SHA",
            "scienceExecution": false,
            "solverExecution": false,
            "scienceIdentityAllocated": false,
            "protectedResultOpened": false,
            "taylorOrJerusalemUsed": false,
            "productionMutationAuthorized": false,
            "fiveDegreeSeamMutationAuthorized": false
          }
          EOF

      - name: Install exact inherited runtime
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: lowalt-state-0003-buildenv-provenance-r13b
          create-args: -c conda-forge python=3.12.4 rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Recover exact package archive recipe metadata and installed linkage
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          UVSPEC="$(command -v uvspec)"
          test -n "$UVSPEC"
          ACTUAL_UVSPEC_SHA="$(sha256sum "$UVSPEC" | awk '{print $1}')"
          test "$ACTUAL_UVSPEC_SHA" = "$UVSPEC_SHA256"

          micromamba list rubin-libradtran --json > "$EVIDENCE_DIR/runtime/micromamba-rubin-libradtran.json"
          micromamba info --json > "$EVIDENCE_DIR/runtime/micromamba-info.json"
          printf 'CONDA_PREFIX=%s\nuvspec=%s\nuvspec_sha256=%s\npackage_spec=%s\n' \
            "$CONDA_PREFIX" "$UVSPEC" "$ACTUAL_UVSPEC_SHA" "$PACKAGE_SPEC" \
            > "$EVIDENCE_DIR/runtime/runtime-binding.txt"

          META="$CONDA_PREFIX/conda-meta/rubin-libradtran-2.0.6-py312pl5321he9373c2_1.json"
          test -f "$META"
          cp "$META" "$EVIDENCE_DIR/package-info/installed-conda-meta.json"
          python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path(os.environ['EVIDENCE_DIR'])/'package-info'/'installed-conda-meta.json'
          x=json.loads(p.read_text())
          assert x.get('name')=='rubin-libradtran'
          assert x.get('version')=='2.0.6'
          assert x.get('build')=='py312pl5321he9373c2_1'
          assert x.get('build_number')==1
          assert x.get('sha256')==os.environ['PACKAGE_SHA256']
          out={k:x.get(k) for k in ('name','version','build','build_number','channel','url','md5','sha256','depends','constrains','subdir')}
          (p.parent/'installed-conda-meta-summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY

          PKG="$RUNNER_TEMP/rubin-libradtran-2.0.6-py312pl5321he9373c2_1.conda"
          curl --proto '=https' --tlsv1.2 -fL \
            -D "$EVIDENCE_DIR/download/package-http-headers.txt" \
            -o "$PKG" \
            -w 'url_effective=%{url_effective}\nhttp_code=%{http_code}\nsize_download=%{size_download}\nnum_redirects=%{num_redirects}\n' \
            "$PACKAGE_URL" > "$EVIDENCE_DIR/download/package-http-summary.txt"
          ACTUAL_PACKAGE_SHA="$(sha256sum "$PKG" | awk '{print $1}')"
          test "$ACTUAL_PACKAGE_SHA" = "$PACKAGE_SHA256"
          printf 'url=%s\nsha256=%s\nsize_bytes=%s\n' "$PACKAGE_URL" "$ACTUAL_PACKAGE_SHA" "$(stat -c %s "$PKG")" \
            > "$EVIDENCE_DIR/download/package-archive-binding.txt"

          ZIPDIR="$RUNNER_TEMP/lowalt_r13b_conda_zip"
          INFODIR="$RUNNER_TEMP/lowalt_r13b_info"
          rm -rf "$ZIPDIR" "$INFODIR"
          mkdir -p "$ZIPDIR" "$INFODIR"
          python - "$PKG" "$ZIPDIR" "$EVIDENCE_DIR/download/conda-container-members.txt" <<'PY'
          import pathlib, sys, zipfile
          pkg, out, listing = map(pathlib.Path, sys.argv[1:])
          with zipfile.ZipFile(pkg) as z:
              names=sorted(z.namelist())
              listing.write_text('\n'.join(names)+'\n')
              z.extractall(out)
          PY
          INFO_TAR="$(find "$ZIPDIR" -maxdepth 1 -type f -name 'info-*.tar.zst' -print | head -n1)"
          test -n "$INFO_TAR"
          command -v zstd >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq zstd; }
          tar --use-compress-program=unzstd -xf "$INFO_TAR" -C "$INFODIR"
          find "$INFODIR" -type f -print | sed "s#^$INFODIR/##" | sort > "$EVIDENCE_DIR/package-info/extracted-info-file-list.txt"

          for f in index.json about.json hash_input.json paths.json files run_exports.json; do
            if [ -f "$INFODIR/$f" ]; then
              mkdir -p "$EVIDENCE_DIR/package-info/$(dirname "$f")"
              cp "$INFODIR/$f" "$EVIDENCE_DIR/package-info/$f"
            fi
          done
          if [ -d "$INFODIR/recipe" ]; then
            cp -a "$INFODIR/recipe" "$EVIDENCE_DIR/package-info/recipe"
          fi
          if [ -d "$INFODIR/test" ]; then
            cp -a "$INFODIR/test" "$EVIDENCE_DIR/package-info/test"
          fi

          file "$UVSPEC" > "$EVIDENCE_DIR/elf/uvspec-file.txt"
          readelf -p .comment "$UVSPEC" > "$EVIDENCE_DIR/elf/uvspec-comment.txt" 2>&1 || true
          readelf -p .GCC.command.line "$UVSPEC" > "$EVIDENCE_DIR/elf/uvspec-gcc-command-line.txt" 2>&1 || true
          readelf -d "$UVSPEC" > "$EVIDENCE_DIR/elf/uvspec-dynamic.txt"
          ldd "$UVSPEC" > "$EVIDENCE_DIR/elf/uvspec-ldd.txt"
          strings "$UVSPEC" | grep -E 'GCC:|GNU Fortran|GFORTRAN|gfortran|conda-forge' | sort -u > "$EVIDENCE_DIR/elf/uvspec-compiler-strings.txt" || true

          FLIB="$(find "$CONDA_PREFIX" -type f -name 'libRadtran_f.a' -print | head -n1 || true)"
          if [ -n "$FLIB" ]; then
            printf 'static_library=%s\n' "$FLIB" > "$EVIDENCE_DIR/static-objects/static-library.txt"
            sha256sum "$FLIB" > "$EVIDENCE_DIR/static-objects/libRadtran_f.sha256"
            nm -A "$FLIB" > "$EVIDENCE_DIR/static-objects/libRadtran_f-nm.txt"
            ar t "$FLIB" > "$EVIDENCE_DIR/static-objects/libRadtran_f-members.txt"
            OBJ="$(nm -A "$FLIB" | awk '/ [Tt] geofast_$/ {s=$1; sub(/^.*\.a:/,"",s); sub(/:$/,"",s); print s; exit}')"
            printf 'geofast_object=%s\n' "$OBJ" > "$EVIDENCE_DIR/static-objects/geofast-object.txt"
            if [ -n "$OBJ" ]; then
              TMP="$RUNNER_TEMP/lowalt_r13b_ar"
              rm -rf "$TMP"; mkdir -p "$TMP"
              (cd "$TMP" && ar x "$FLIB" "$OBJ")
              test -f "$TMP/$OBJ"
              sha256sum "$TMP/$OBJ" > "$EVIDENCE_DIR/static-objects/geofast-object.sha256"
              readelf -p .comment "$TMP/$OBJ" > "$EVIDENCE_DIR/static-objects/geofast-object-comment.txt" 2>&1 || true
              readelf -p .GCC.command.line "$TMP/$OBJ" > "$EVIDENCE_DIR/static-objects/geofast-object-gcc-command-line.txt" 2>&1 || true
              readelf -S "$TMP/$OBJ" > "$EVIDENCE_DIR/static-objects/geofast-object-sections.txt"
              strings "$TMP/$OBJ" | grep -E 'GCC:|GNU Fortran|GFORTRAN|gfortran|conda-forge' | sort -u > "$EVIDENCE_DIR/static-objects/geofast-object-compiler-strings.txt" || true
            fi
          else
            printf 'static_library_not_installed=true\n' > "$EVIDENCE_DIR/static-objects/static-library.txt"
          fi

          python - <<'PY'
          import hashlib, json, os, pathlib
          root=pathlib.Path(os.environ['EVIDENCE_DIR'])
          hi=root/'package-info'/'hash_input.json'
          hash_input=json.loads(hi.read_text()) if hi.exists() else None
          recipe_dir=root/'package-info'/'recipe'
          summary={
            'schemaVersion':1,
            'classification':'STATE_0003_EXACT_PACKAGE_BUILDENV_PROVENANCE_R13B_CAPTURED',
            'exactPackage':'rubin-libradtran=2.0.6=py312pl5321he9373c2_1',
            'packageSha256':os.environ['PACKAGE_SHA256'],
            'uvspecSha256':os.environ['UVSPEC_SHA256'],
            'packageInfoRecipeCaptured':recipe_dir.is_dir(),
            'hashInputCaptured':hash_input is not None,
            'hashInput':hash_input,
            'scienceExecution':False,
            'solverExecution':False,
            'protectedResultOpened':False,
            'productionChanged':False,
            'fiveDegreeSeamChanged':False,
          }
          (root/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          rows=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file() and x.name!='evidence-manifest.sha256'):
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              rows.append(f'{h}  {p.relative_to(root).as_posix()}')
          (root/'evidence-manifest.sha256').write_text('\n'.join(rows)+'\n')
          PY

      - name: Publish isolated exact package provenance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lowalt-state-0003-buildenv-provenance-r13b-20260909
          path: ${{ runner.temp }}/lowalt_state0003_buildenv_provenance_r13b_20260909/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
