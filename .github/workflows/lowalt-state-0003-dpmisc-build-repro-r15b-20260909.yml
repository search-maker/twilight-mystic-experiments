name: LOWALT STATE-0003 dpmisc build reproduction R15b
run-name: LOWALT STATE-0003 dpmisc build reproduction R15b ${{ github.sha }}

on:
  push:
    branches:
      - execution/lowalt-state-0003-dpmisc-build-repro-r15b-20260909

permissions:
  contents: read

concurrency:
  group: lowalt-state-0003-dpmisc-build-repro-r15b-20260909
  cancel-in-progress: false

env:
  EXPECTED_BRANCH: execution/lowalt-state-0003-dpmisc-build-repro-r15b-20260909
  BASE_MAIN_SHA: 8cd85cf393e2d86a1b6d7325654747460a13e697
  SOURCE_URL: http://www.libradtran.org/download/libRadtran-2.0.6.tar.gz
  SOURCE_SHA256: 999e47f4af4b5df6f85a6887fc105fc8f6e1a7cee89a3124f69ac8d8912c8e85
  KNOWN_WIRE_SHA256: 64930cc40b6e4a37aa220520974d330fc1563796f466a649b2238131f2d69840
  UVSPEC_SHA256: 2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3
  GOVERNING_DPMISC_SHA256: 8ec028a406ac0fea7456d039f144b0edc8e91752d0a0fe9912e0a0fff06fdb1b
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  reproduce-dpmisc:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify additive provenance-only boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD^)" = "$BASE_MAIN_SHA"
          mapfile -t CHANGED < <(git diff --name-only "$BASE_MAIN_SHA"..HEAD | sort)
          test "${#CHANGED[@]}" = 1
          test "${CHANGED[0]}" = ".github/workflows/lowalt-state-0003-dpmisc-build-repro-r15b-20260909.yml"
          EVIDENCE_DIR="$RUNNER_TEMP/lowalt_state0003_dpmisc_build_repro_r15b_20260909"
          rm -rf "$EVIDENCE_DIR"; mkdir -p "$EVIDENCE_DIR"/{boundary,source,toolchain,package-object,reproduction,comparison}
          echo "EVIDENCE_DIR=$EVIDENCE_DIR" >> "$GITHUB_ENV"
          cat > "$EVIDENCE_DIR/boundary/boundary.json" <<EOF
          {"schemaVersion":1,"classification":"STATE_0003_DPMISC_BUILD_REPRO_R15B","baseMainSha":"$BASE_MAIN_SHA","workflowHeadSha":"$GITHUB_SHA","scienceExecution":false,"solverExecution":false,"scienceIdentityAllocated":false,"protectedResultOpened":false,"taylorOrJerusalemUsed":false,"productionMutationAuthorized":false,"fiveDegreeSeamMutationAuthorized":false,"r12ConsumedIdentitiesReused":false,"sealedR12AuditOpened":false,"r15Attempt1MechanicalBarrier":"micromamba-list-json-shape-only"}
          EOF

      - name: Install pinned runtime plus exact rendered build toolchain
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: lowalt-state-0003-dpmisc-build-repro-r15b
          create-args: >-
            -c conda-forge
            python=3.12.4
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1
            binutils_impl_linux-64=2.45.1=default_hfdba357_101
            binutils_linux-64=2.45.1=default_h4852527_101
            ld_impl_linux-64=2.45.1=default_hbd61a6d_101
            gcc_impl_linux-64=13.4.0=he2fa53e_18
            gcc_linux-64=13.4.0=h0a5b801_21
            gfortran_impl_linux-64=13.4.0=hb485fb8_18
            gfortran_linux-64=13.4.0=hce61b40_21
            kernel-headers_linux-64=3.10.0=he073ed8_18
            libgcc=15.2.0=he0feb66_18
            libgcc-devel_linux-64=13.4.0=hd1d28cc_118
            libgcc-ng=15.2.0=h69a702a_18
            libgfortran5=15.2.0=h68bc16d_18
            libgomp=15.2.0=he0feb66_18
            libstdcxx=15.2.0=h934c35e_18
            libstdcxx-devel_linux-64=13.4.0=h6963c3b_118
            libstdcxx-ng=15.2.0=hdf11a46_18
            sysroot_linux-64=2.17=h0157908_18
            gnuconfig=2025.07.09=hd8ed1ab_0
            make=4.4.1=hb9d3cd8_2

      - name: Bind runtime compiler and governing package object
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          UVSPEC="$(command -v uvspec)"
          test "$(sha256sum "$UVSPEC" | awk '{print $1}')" = "$UVSPEC_SHA256"
          micromamba list --json > "$EVIDENCE_DIR/toolchain/micromamba-list.json"
          micromamba info --json > "$EVIDENCE_DIR/toolchain/micromamba-info.json"
          FC_BIN="$CONDA_PREFIX/bin/x86_64-conda-linux-gnu-gfortran"; test -x "$FC_BIN"
          "$FC_BIN" --version > "$EVIDENCE_DIR/toolchain/gfortran-version.txt"
          "$FC_BIN" -v > "$EVIDENCE_DIR/toolchain/gfortran-v.txt" 2>&1
          python - "$EVIDENCE_DIR/toolchain/micromamba-list.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1])); rows=x['packages'] if isinstance(x,dict) else x; by={r['name']:r for r in rows}
          expected={
            'rubin-libradtran':('2.0.6','py312pl5321he9373c2_1'),
            'binutils_impl_linux-64':('2.45.1','default_hfdba357_101'),
            'binutils_linux-64':('2.45.1','default_h4852527_101'),
            'ld_impl_linux-64':('2.45.1','default_hbd61a6d_101'),
            'gcc_impl_linux-64':('13.4.0','he2fa53e_18'),'gcc_linux-64':('13.4.0','h0a5b801_21'),
            'gfortran_impl_linux-64':('13.4.0','hb485fb8_18'),'gfortran_linux-64':('13.4.0','hce61b40_21'),
            'kernel-headers_linux-64':('3.10.0','he073ed8_18'),
            'libgcc':('15.2.0','he0feb66_18'),'libgcc-devel_linux-64':('13.4.0','hd1d28cc_118'),'libgcc-ng':('15.2.0','h69a702a_18'),
            'libgfortran5':('15.2.0','h68bc16d_18'),'libgomp':('15.2.0','he0feb66_18'),
            'libstdcxx':('15.2.0','h934c35e_18'),'libstdcxx-devel_linux-64':('13.4.0','h6963c3b_118'),'libstdcxx-ng':('15.2.0','hdf11a46_18'),
            'sysroot_linux-64':('2.17','h0157908_18'),'gnuconfig':('2025.07.09','hd8ed1ab_0'),'make':('4.4.1','hb9d3cd8_2')}
          for n,(v,b) in expected.items():
              r=by[n]; assert (r['version'],r['build_string'])==(v,b),(n,r['version'],r['build_string'],v,b)
          PY
          FLIB="$(find "$CONDA_PREFIX" -type f -name 'libRadtran_f.a' -print | head -n1)"; test -n "$FLIB"
          OBJ="$(ar t "$FLIB" | grep -E '(^|/)dpmisc\.o$' | head -n1)"; test -n "$OBJ"
          TMP="$RUNNER_TEMP/r15b_package_obj"; rm -rf "$TMP"; mkdir -p "$TMP"; (cd "$TMP" && ar x "$FLIB" "$OBJ")
          PACKAGE_OBJ="$TMP/$OBJ"; test -f "$PACKAGE_OBJ"
          test "$(sha256sum "$PACKAGE_OBJ" | awk '{print $1}')" = "$GOVERNING_DPMISC_SHA256"
          cp "$PACKAGE_OBJ" "$EVIDENCE_DIR/package-object/dpmisc.governing.o"
          sha256sum "$PACKAGE_OBJ" > "$EVIDENCE_DIR/package-object/dpmisc.governing.sha256"
          readelf -SW "$PACKAGE_OBJ" > "$EVIDENCE_DIR/package-object/readelf-sections.txt"
          readelf -p .comment "$PACKAGE_OBJ" > "$EVIDENCE_DIR/package-object/readelf-comment.txt" 2>&1 || true
          objdump -dr "$PACKAGE_OBJ" > "$EVIDENCE_DIR/package-object/objdump-dr.txt"
          nm -a "$PACKAGE_OBJ" > "$EVIDENCE_DIR/package-object/nm.txt"
          echo "PACKAGE_OBJ=$PACKAGE_OBJ" >> "$GITHUB_ENV"; echo "FC_BIN=$FC_BIN" >> "$GITHUB_ENV"

      - name: Recover literal HTTP source representation and extract exact tree
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          WIRE="$RUNNER_TEMP/libRadtran-2.0.6.http-wire.bin"; DECODED="$RUNNER_TEMP/libRadtran-2.0.6.conda-source.tar.gz"
          python - "$WIRE" "$DECODED" "$EVIDENCE_DIR/source/http-route.json" <<'PY'
          import gzip,hashlib,json,pathlib,shutil,sys,urllib.request,os
          wire,decoded,report=map(pathlib.Path,sys.argv[1:]); url=os.environ['SOURCE_URL']
          class Recorder(urllib.request.HTTPRedirectHandler):
              def __init__(self): super().__init__(); self.chain=[]
              def redirect_request(self,req,fp,code,msg,headers,newurl): self.chain.append({'status':int(code),'fromUrl':req.full_url,'toUrl':newurl}); return super().redirect_request(req,fp,code,msg,headers,newurl)
          rec=Recorder(); opener=urllib.request.build_opener(rec); req=urllib.request.Request(url,headers={'User-Agent':'lowalt-state-0003-dpmisc-build-repro-r15b/1','Accept':'*/*'})
          with opener.open(req,timeout=240) as r, wire.open('wb') as f:
              shutil.copyfileobj(r,f,1024*1024); headers={str(k).lower():str(v) for k,v in r.headers.items()}; final=r.geturl(); status=int(getattr(r,'status',r.getcode()))
          def sha(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for b in iter(lambda:f.read(1024*1024),b''): h.update(b)
              return h.hexdigest()
          enc=headers.get('content-encoding','').strip().lower(); wsha=sha(wire)
          if enc not in ('gzip','x-gzip'): raise RuntimeError(f'unexpected content-encoding {enc!r}')
          with gzip.open(wire,'rb') as src, decoded.open('wb') as dst: shutil.copyfileobj(src,dst,1024*1024)
          dsha=sha(decoded)
          data={'requestedUrl':url,'finalUrl':final,'status':status,'redirectChain':rec.chain,'responseHeaders':headers,'wireSize':wire.stat().st_size,'wireSha256':wsha,'knownWireSha256':os.environ['KNOWN_WIRE_SHA256'],'wireMatchesKnown':wsha==os.environ['KNOWN_WIRE_SHA256'],'contentEncoding':enc,'decodedSize':decoded.stat().st_size,'decodedSha256':dsha,'expectedDecodedSha256':os.environ['SOURCE_SHA256'],'decodedMatchesExpected':dsha==os.environ['SOURCE_SHA256'],'httpsSubstitutionPerformed':False}
          report.write_text(json.dumps(data,indent=2,sort_keys=True)+'\n'); assert dsha==os.environ['SOURCE_SHA256']
          PY
          SRCROOT="$RUNNER_TEMP/r15b_source"; rm -rf "$SRCROOT"; mkdir -p "$SRCROOT"; tar -xzf "$DECODED" -C "$SRCROOT"
          SRC="$(find "$SRCROOT" -mindepth 1 -maxdepth 1 -type d -name 'libRadtran-2.0.6*' -print | head -n1)"; test -n "$SRC"; test -f "$SRC/libsrc_f/dpmisc.f"
          sha256sum "$SRC/libsrc_f/dpmisc.f" > "$EVIDENCE_DIR/source/dpmisc-source.sha256"
          file "$DECODED" > "$EVIDENCE_DIR/source/decoded-file.txt"; echo "SRC=$SRC" >> "$GITHUB_ENV"

      - name: Reproduce dpmisc object with recovered conda-build surface
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          export CONDA_BUILD=1 PREFIX="$CONDA_PREFIX" BUILD_PREFIX="$CONDA_PREFIX" SRC_DIR="$SRC" PKG_NAME=rubin-libradtran PKG_VERSION=2.0.6
          export FC="$FC_BIN" F77="$FC_BIN" F90="$FC_BIN" F95="$FC_BIN" GFORTRAN="$FC_BIN"
          export FFLAGS="-march=nocona -mtune=haswell -ftree-vectorize -fPIC -fstack-protector-strong -fno-plt -O2 -ffunction-sections -pipe -isystem ${PREFIX}/include -I${CONDA_PREFIX}/include -fdebug-prefix-map=${SRC_DIR}=/usr/local/src/conda/${PKG_NAME}-${PKG_VERSION} -fdebug-prefix-map=${PREFIX}=/usr/local/src/conda-prefix"
          printf 'FC=%s\nFFLAGS=%s\nPREFIX=%s\nBUILD_PREFIX=%s\nSRC_DIR=%s\n' "$FC" "$FFLAGS" "$PREFIX" "$BUILD_PREFIX" "$SRC_DIR" > "$EVIDENCE_DIR/reproduction/recovered-build-env.txt"
          cd "$SRC"; cp "$BUILD_PREFIX"/share/gnuconfig/config.* ./; rm -f src/.depend libsrc_c/.depend
          set +e; ./configure --prefix="$PREFIX" --with-netcdf4="$PREFIX" > "$EVIDENCE_DIR/reproduction/configure.stdout.txt" 2> "$EVIDENCE_DIR/reproduction/configure.stderr.txt"; CONFIG_RC=$?; set -e
          echo "$CONFIG_RC" > "$EVIDENCE_DIR/reproduction/configure.exit.txt"
          BUILD_ROUTE=direct-compile-fallback; REPRO_OBJ="$RUNNER_TEMP/dpmisc.reproduced.o"; rm -f "$REPRO_OBJ"
          if [ "$CONFIG_RC" -eq 0 ]; then
            cp Makeconf "$EVIDENCE_DIR/reproduction/Makeconf.txt" || true; grep -nE '^(FC|F77|FFLAGS|FORTRANFLAGS|F77FLAGS|F90|F95)' Makeconf > "$EVIDENCE_DIR/reproduction/Makeconf-fortran-lines.txt" || true
            TARGET=''; for candidate in libsrc_f/dpmisc.o dpmisc.o; do if make -n "$candidate" > "$EVIDENCE_DIR/reproduction/make-dryrun-${candidate//\//_}.txt" 2>&1; then TARGET="$candidate"; break; fi; done
            if [ -n "$TARGET" ]; then
              rm -f "$TARGET"; set +e; make V=1 "$TARGET" > "$EVIDENCE_DIR/reproduction/make.stdout.txt" 2> "$EVIDENCE_DIR/reproduction/make.stderr.txt"; MAKE_RC=$?; set -e; echo "$MAKE_RC" > "$EVIDENCE_DIR/reproduction/make.exit.txt"
              if [ "$MAKE_RC" -eq 0 ] && [ -f "$TARGET" ]; then cp "$TARGET" "$REPRO_OBJ"; BUILD_ROUTE=configure-make-target; fi
            fi
          fi
          if [ ! -f "$REPRO_OBJ" ]; then
            printf '%q ' "$FC_BIN" $FFLAGS -fPIC -c "$SRC/libsrc_f/dpmisc.f" -o "$REPRO_OBJ" > "$EVIDENCE_DIR/reproduction/direct-compile-command.txt"; printf '\n' >> "$EVIDENCE_DIR/reproduction/direct-compile-command.txt"
            "$FC_BIN" $FFLAGS -fPIC -c "$SRC/libsrc_f/dpmisc.f" -o "$REPRO_OBJ" > "$EVIDENCE_DIR/reproduction/direct-compile.stdout.txt" 2> "$EVIDENCE_DIR/reproduction/direct-compile.stderr.txt"
          fi
          test -f "$REPRO_OBJ"; printf '%s\n' "$BUILD_ROUTE" > "$EVIDENCE_DIR/reproduction/build-route.txt"; cp "$REPRO_OBJ" "$EVIDENCE_DIR/reproduction/dpmisc.reproduced.o"
          sha256sum "$REPRO_OBJ" > "$EVIDENCE_DIR/reproduction/dpmisc.reproduced.sha256"; readelf -SW "$REPRO_OBJ" > "$EVIDENCE_DIR/reproduction/readelf-sections.txt"; readelf -p .comment "$REPRO_OBJ" > "$EVIDENCE_DIR/reproduction/readelf-comment.txt" 2>&1 || true; objdump -dr "$REPRO_OBJ" > "$EVIDENCE_DIR/reproduction/objdump-dr.txt"; nm -a "$REPRO_OBJ" > "$EVIDENCE_DIR/reproduction/nm.txt"; echo "REPRO_OBJ=$REPRO_OBJ" >> "$GITHUB_ENV"

      - name: Compare exact object and section-level codegen
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          python - "$PACKAGE_OBJ" "$REPRO_OBJ" "$EVIDENCE_DIR/comparison" <<'PY'
          import hashlib,json,pathlib,subprocess,sys,os
          pkg,repro=map(pathlib.Path,sys.argv[1:3]); out=pathlib.Path(sys.argv[3]); out.mkdir(parents=True,exist_ok=True)
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          def secs(obj):
              text=subprocess.check_output(['objdump','-h',str(obj)],text=True); return sorted({p[1] for l in text.splitlines() if len((p:=l.split()))>=3 and (p[1].startswith('.text') or p[1].startswith('.rodata'))})
          def dump(obj,sec,dst): subprocess.run(['objcopy','--dump-section',f'{sec}={dst}',str(obj)],check=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
          ps,rs=secs(pkg),secs(repro); names=sorted(set(ps)|set(rs)); rows=[]; pdir=out/'package-sections'; rdir=out/'repro-sections'; pdir.mkdir(); rdir.mkdir()
          for i,sec in enumerate(names):
              row={'section':sec,'packagePresent':sec in ps,'reproPresent':sec in rs}
              if sec in ps and sec in rs:
                  pp=pdir/f'{i:03d}.bin'; rp=rdir/f'{i:03d}.bin'; dump(pkg,sec,pp); dump(repro,sec,rp); row.update(packageSha256=sha(pp),reproSha256=sha(rp),packageSize=pp.stat().st_size,reproSize=rp.stat().st_size,byteIdentical=pp.read_bytes()==rp.read_bytes())
              else: row['byteIdentical']=False
              rows.append(row)
          relevant=['.text.chpman2_','.text.geofast_','.text.opathfast_','.text.optical_path_fast_','.text.points_of_incidence_fast_','.text.chapman4_']; by={r['section']:r for r in rows}; rel={s:bool(by.get(s,{}).get('byteIdentical')) for s in relevant}
          exact=pkg.read_bytes()==repro.read_bytes(); textrows=[r for r in rows if r['section'].startswith('.text')]; rodatarows=[r for r in rows if r['section'].startswith('.rodata')]
          all_text=set(s for s in ps if s.startswith('.text'))==set(s for s in rs if s.startswith('.text')) and all(r['byteIdentical'] for r in textrows)
          all_rodata=set(s for s in ps if s.startswith('.rodata'))==set(s for s in rs if s.startswith('.rodata')) and all(r['byteIdentical'] for r in rodatarows)
          if exact: cls='STATE_0003_GOVERNING_DPMISC_EXACT_OBJECT_REPRODUCTION_PASS'
          elif all_text and all_rodata: cls='STATE_0003_GOVERNING_DPMISC_CODEGEN_AND_CONSTANT_SECTIONS_EQUIVALENT_OBJECT_METADATA_DIFFERS'
          elif all(rel.values()): cls='STATE_0003_DIRECT_PATH_RELEVANT_CODEGEN_SECTIONS_EQUIVALENT_FULL_DPMISC_NOT_EQUIVALENT'
          else: cls='STATE_0003_GOVERNING_DPMISC_CODEGEN_EQUIVALENCE_NOT_PASS'
          summary={'schemaVersion':1,'classification':cls,'buildRoute':(pathlib.Path(os.environ['EVIDENCE_DIR'])/'reproduction/build-route.txt').read_text().strip(),'governingObjectSha256':sha(pkg),'reproducedObjectSha256':sha(repro),'exactObjectByteIdentical':exact,'packageObjectSize':pkg.stat().st_size,'reproducedObjectSize':repro.stat().st_size,'allTextSectionsByteIdentical':all_text,'allRodataSectionsByteIdentical':all_rodata,'directPathRelevantSections':rel,'sectionComparisons':rows,'scienceExecution':False,'solverExecution':False,'protectedResultOpened':False,'r12IdentitiesReused':False,'sealedR12AuditOpened':False,'productionChanged':False,'fiveDegreeSeamChanged':False}
          (out/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n'); (out/'classification.txt').write_text(cls+'\n'); print(json.dumps({k:summary[k] for k in ('classification','buildRoute','governingObjectSha256','reproducedObjectSha256','exactObjectByteIdentical','allTextSectionsByteIdentical','allRodataSectionsByteIdentical','directPathRelevantSections')},indent=2,sort_keys=True))
          PY
          cmp -l "$PACKAGE_OBJ" "$REPRO_OBJ" | head -n 200 > "$EVIDENCE_DIR/comparison/object-first-200-byte-differences.txt" || true; diff -u "$EVIDENCE_DIR/package-object/objdump-dr.txt" "$EVIDENCE_DIR/reproduction/objdump-dr.txt" > "$EVIDENCE_DIR/comparison/objdump-dr.diff.txt" || true
          python - <<'PY'
          import hashlib,os,pathlib
          root=pathlib.Path(os.environ['EVIDENCE_DIR']); rows=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file() and x.name!='evidence-manifest.sha256'): rows.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root).as_posix()}")
          (root/'evidence-manifest.sha256').write_text('\n'.join(rows)+'\n')
          PY

      - name: Publish isolated R15b build-reproduction evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lowalt-state-0003-dpmisc-build-repro-r15b-20260909
          path: ${{ runner.temp }}/lowalt_state0003_dpmisc_build_repro_r15b_20260909/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
