name: LOWALT STATE-0003 exact dpmisc object reproduction R15d
run-name: LOWALT STATE-0003 exact dpmisc object reproduction R15d ${{ github.sha }}

on:
  push:
    branches:
      - execution/lowalt-state-0003-dpmisc-object-repro-r15d-20260909

permissions:
  contents: read

concurrency:
  group: lowalt-state-0003-dpmisc-object-repro-r15d-20260909
  cancel-in-progress: false

env:
  EXPECTED_BRANCH: execution/lowalt-state-0003-dpmisc-object-repro-r15d-20260909
  BASE_MAIN_SHA: 8cd85cf393e2d86a1b6d7325654747460a13e697
  SOURCE_URL: http://www.libradtran.org/download/libRadtran-2.0.6.tar.gz
  SOURCE_SHA256: 999e47f4af4b5df6f85a6887fc105fc8f6e1a7cee89a3124f69ac8d8912c8e85
  KNOWN_WIRE_SHA256: 64930cc40b6e4a37aa220520974d330fc1563796f466a649b2238131f2d69840
  UVSPEC_SHA256: 2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3
  GOVERNING_DPMISC_SHA256: 8ec028a406ac0fea7456d039f144b0edc8e91752d0a0fe9912e0a0fff06fdb1b
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  reproduce-dpmisc-object:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify provenance-only boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD^)" = "$BASE_MAIN_SHA"
          mapfile -t CHANGED < <(git diff --name-only "$BASE_MAIN_SHA"..HEAD | sort)
          test "${#CHANGED[@]}" = 1
          test "${CHANGED[0]}" = ".github/workflows/lowalt-state-0003-dpmisc-object-repro-r15d-20260909.yml"
          EVIDENCE_DIR="$RUNNER_TEMP/lowalt_state0003_dpmisc_object_repro_r15d_20260909"
          rm -rf "$EVIDENCE_DIR"; mkdir -p "$EVIDENCE_DIR"/{boundary,source,toolchain,package-object,reproduction,comparison}
          echo "EVIDENCE_DIR=$EVIDENCE_DIR" >> "$GITHUB_ENV"
          cat > "$EVIDENCE_DIR/boundary/boundary.json" <<EOF
          {"schemaVersion":1,"classification":"STATE_0003_DPMISC_OBJECT_REPRO_R15D","baseMainSha":"$BASE_MAIN_SHA","workflowHeadSha":"$GITHUB_SHA","scienceExecution":false,"solverExecution":false,"scienceIdentityAllocated":false,"protectedResultOpened":false,"taylorOrJerusalemUsed":false,"productionMutationAuthorized":false,"fiveDegreeSeamMutationAuthorized":false,"r12ConsumedIdentitiesReused":false,"sealedR12AuditOpened":false,"r15cEstablishedAllExecutableTextSectionsExact":true,"r15dHypothesis":"remaining object mismatch is embedded absolute source filename only; compile from libsrc_f with basename dpmisc.f"}
          EOF

      - name: Install exact rendered compiler surface plus pinned runtime
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: lowalt-state-0003-dpmisc-object-repro-r15d
          create-args: >-
            -c conda-forge
            python=3.12.4
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1
            binutils_impl_linux-64=2.45.1=default_hfdba357_101
            binutils_linux-64=2.45.1=default_h4852527_101
            ld_impl_linux-64=2.45.1=default_hbd61a6d_101
            gcc_impl_linux-64=13.4.0=he2fa53e_18
            gcc_linux-64=13.4.0=h0a5b801_21
            gfortran_impl_linux-64=13.4.0=hb485fb8_18
            gfortran_linux-64=13.4.0=hce61b40_21
            kernel-headers_linux-64=3.10.0=he073ed8_18
            libgcc=15.2.0=he0feb66_18
            libgcc-devel_linux-64=13.4.0=hd1d28cc_118
            libgcc-ng=15.2.0=h69a702a_18
            libgfortran5=15.2.0=h68bc16d_18
            libgomp=15.2.0=he0feb66_18
            libstdcxx=15.2.0=h934c35e_18
            libstdcxx-devel_linux-64=13.4.0=h6963c3b_118
            libstdcxx-ng=15.2.0=hdf11a46_18
            sysroot_linux-64=2.17=h0157908_18
            gnuconfig=2025.07.09=hd8ed1ab_0
            make=4.4.1=hb9d3cd8_2

      - name: Bind exact runtime and governing package object
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          UVSPEC="$(command -v uvspec)"
          test "$(sha256sum "$UVSPEC" | awk '{print $1}')" = "$UVSPEC_SHA256"
          FC_BIN="$CONDA_PREFIX/bin/x86_64-conda-linux-gnu-gfortran"; test -x "$FC_BIN"
          "$FC_BIN" --version > "$EVIDENCE_DIR/toolchain/gfortran-version.txt"
          micromamba list --json > "$EVIDENCE_DIR/toolchain/micromamba-list.json"
          FLIB="$(find "$CONDA_PREFIX" -type f -name 'libRadtran_f.a' -print | head -n1)"; test -n "$FLIB"
          OBJ="$(ar t "$FLIB" | grep -E '(^|/)dpmisc\.o$' | head -n1)"; test -n "$OBJ"
          TMP="$RUNNER_TEMP/r15d_package_obj"; rm -rf "$TMP"; mkdir -p "$TMP"; (cd "$TMP" && ar x "$FLIB" "$OBJ")
          PACKAGE_OBJ="$TMP/$OBJ"; test -f "$PACKAGE_OBJ"
          test "$(sha256sum "$PACKAGE_OBJ" | awk '{print $1}')" = "$GOVERNING_DPMISC_SHA256"
          cp "$PACKAGE_OBJ" "$EVIDENCE_DIR/package-object/dpmisc.governing.o"
          sha256sum "$PACKAGE_OBJ" > "$EVIDENCE_DIR/package-object/dpmisc.governing.sha256"
          readelf -p .comment "$PACKAGE_OBJ" > "$EVIDENCE_DIR/package-object/readelf-comment.txt" 2>&1 || true
          strings -a "$PACKAGE_OBJ" > "$EVIDENCE_DIR/package-object/strings.txt"
          echo "FC_BIN=$FC_BIN" >> "$GITHUB_ENV"; echo "PACKAGE_OBJ=$PACKAGE_OBJ" >> "$GITHUB_ENV"

      - name: Recover literal HTTP bytes and exact governing source tree
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          WIRE="$RUNNER_TEMP/libRadtran-2.0.6.http-wire.bin"; DECODED="$RUNNER_TEMP/libRadtran-2.0.6.governing.tar"
          python - "$WIRE" "$DECODED" "$EVIDENCE_DIR/source/http-route.json" <<'PY'
          import gzip,hashlib,json,pathlib,shutil,sys,urllib.request,os
          wire,decoded,report=map(pathlib.Path,sys.argv[1:]); url=os.environ['SOURCE_URL']
          class Recorder(urllib.request.HTTPRedirectHandler):
              def __init__(self): super().__init__(); self.chain=[]
              def redirect_request(self,req,fp,code,msg,headers,newurl): self.chain.append({'status':int(code),'fromUrl':req.full_url,'toUrl':newurl}); return super().redirect_request(req,fp,code,msg,headers,newurl)
          rec=Recorder(); opener=urllib.request.build_opener(rec)
          req=urllib.request.Request(url,headers={'User-Agent':'lowalt-state-0003-r15d/1','Accept':'*/*'})
          with opener.open(req,timeout=240) as r, wire.open('wb') as f:
              shutil.copyfileobj(r,f,1024*1024); headers={str(k).lower():str(v) for k,v in r.headers.items()}; final=r.geturl(); status=int(getattr(r,'status',r.getcode()))
          def sha(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for b in iter(lambda:f.read(1024*1024),b''): h.update(b)
              return h.hexdigest()
          enc=headers.get('content-encoding','').strip().lower(); wsha=sha(wire)
          if enc not in ('gzip','x-gzip'): raise RuntimeError(f'unexpected content-encoding {enc!r}')
          with gzip.open(wire,'rb') as src, decoded.open('wb') as dst: shutil.copyfileobj(src,dst,1024*1024)
          dsha=sha(decoded)
          data={'requestedUrl':url,'finalUrl':final,'status':status,'redirectChain':rec.chain,'responseHeaders':headers,'wireSize':wire.stat().st_size,'wireSha256':wsha,'knownWireSha256':os.environ['KNOWN_WIRE_SHA256'],'wireMatchesKnown':wsha==os.environ['KNOWN_WIRE_SHA256'],'contentEncoding':enc,'decodedSize':decoded.stat().st_size,'decodedSha256':dsha,'expectedDecodedSha256':os.environ['SOURCE_SHA256'],'decodedMatchesExpected':dsha==os.environ['SOURCE_SHA256'],'httpsSubstitutionPerformed':False}
          report.write_text(json.dumps(data,indent=2,sort_keys=True)+'\n')
          assert wsha==os.environ['KNOWN_WIRE_SHA256']; assert dsha==os.environ['SOURCE_SHA256']
          PY
          SRCROOT="$RUNNER_TEMP/r15d_source"; rm -rf "$SRCROOT"; mkdir -p "$SRCROOT"; tar -xf "$DECODED" -C "$SRCROOT"
          SRC="$(find "$SRCROOT" -mindepth 1 -maxdepth 1 -type d -name 'libRadtran-2.0.6*' -print | head -n1)"; test -n "$SRC"; test -f "$SRC/libsrc_f/dpmisc.f"
          sha256sum "$SRC/libsrc_f/dpmisc.f" > "$EVIDENCE_DIR/source/dpmisc-source.sha256"
          echo "SRC=$SRC" >> "$GITHUB_ENV"

      - name: Compile exact source from governing basename context
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          export PREFIX="$CONDA_PREFIX" SRC_DIR="$SRC" PKG_NAME=rubin-libradtran PKG_VERSION=2.0.6
          FFLAGS="-march=nocona -mtune=haswell -ftree-vectorize -fPIC -fstack-protector-strong -fno-plt -O2 -ffunction-sections -pipe -isystem ${PREFIX}/include -I${CONDA_PREFIX}/include -fdebug-prefix-map=${SRC_DIR}=/usr/local/src/conda/${PKG_NAME}-${PKG_VERSION} -fdebug-prefix-map=${PREFIX}=/usr/local/src/conda-prefix"
          REPRO_OBJ="$RUNNER_TEMP/dpmisc.reproduced.o"
          cd "$SRC/libsrc_f"
          printf 'cwd=%s\n' "$PWD" > "$EVIDENCE_DIR/reproduction/compile-context.txt"
          printf '%q ' "$FC_BIN" $FFLAGS -fPIC -c dpmisc.f -o "$REPRO_OBJ" > "$EVIDENCE_DIR/reproduction/compile-command.txt"; printf '\n' >> "$EVIDENCE_DIR/reproduction/compile-command.txt"
          "$FC_BIN" $FFLAGS -fPIC -c dpmisc.f -o "$REPRO_OBJ"
          test -f "$REPRO_OBJ"; cp "$REPRO_OBJ" "$EVIDENCE_DIR/reproduction/dpmisc.reproduced.o"
          sha256sum "$REPRO_OBJ" > "$EVIDENCE_DIR/reproduction/dpmisc.reproduced.sha256"
          readelf -p .comment "$REPRO_OBJ" > "$EVIDENCE_DIR/reproduction/readelf-comment.txt" 2>&1 || true
          strings -a "$REPRO_OBJ" > "$EVIDENCE_DIR/reproduction/strings.txt"
          echo "REPRO_OBJ=$REPRO_OBJ" >> "$GITHUB_ENV"

      - name: Compare exact object and sections without mutating inputs
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          test "$(sha256sum "$PACKAGE_OBJ" | awk '{print $1}')" = "$GOVERNING_DPMISC_SHA256"
          python - "$PACKAGE_OBJ" "$REPRO_OBJ" "$EVIDENCE_DIR/comparison/summary.json" <<'PY'
          import hashlib,json,pathlib,subprocess,sys,tempfile
          pkg,repro,out=map(pathlib.Path,sys.argv[1:])
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          def sections(obj):
              txt=subprocess.check_output(['objdump','-h',str(obj)],text=True)
              return sorted({p[1] for line in txt.splitlines() if len((p:=line.split()))>=3 and (p[1].startswith('.text') or p[1].startswith('.rodata'))})
          def dump_preserving(obj,sec,dst,tmpout):
              subprocess.run(['objcopy',f'--dump-section={sec}={dst}',str(obj),str(tmpout)],check=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
          ps,rs=sections(pkg),sections(repro); names=sorted(set(ps)|set(rs)); rows=[]
          td=out.parent/'section-bytes'; td.mkdir(parents=True,exist_ok=True)
          for i,s in enumerate(names):
              row={'section':s,'packagePresent':s in ps,'reproPresent':s in rs,'byteIdentical':False}
              if s in ps and s in rs:
                  a=td/f'{i:03d}.pkg.bin'; b=td/f'{i:03d}.repro.bin'; ta=td/f'{i:03d}.pkg.tmp.o'; tb=td/f'{i:03d}.repro.tmp.o'
                  dump_preserving(pkg,s,a,ta); dump_preserving(repro,s,b,tb); ta.unlink(missing_ok=True); tb.unlink(missing_ok=True)
                  row.update(packageSha256=sha(a),reproSha256=sha(b),packageSize=a.stat().st_size,reproSize=b.stat().st_size,byteIdentical=a.read_bytes()==b.read_bytes())
              rows.append(row)
          by={r['section']:r for r in rows}; relevant=['.text.chpman2_','.text.geofast_','.text.opathfast_','.text.optical_path_fast_','.text.points_of_incidence_fast_','.text.chapman4_']; rel={s:bool(by.get(s,{}).get('byteIdentical')) for s in relevant}
          ptext={s for s in ps if s.startswith('.text')}; rtext={s for s in rs if s.startswith('.text')}; pro={s for s in ps if s.startswith('.rodata')}; rro={s for s in rs if s.startswith('.rodata')}
          alltext=ptext==rtext and all(by[s]['byteIdentical'] for s in ptext); allro=pro==rro and all(by[s]['byteIdentical'] for s in pro); exact=pkg.read_bytes()==repro.read_bytes()
          if exact: cls='STATE_0003_GOVERNING_DPMISC_EXACT_OBJECT_REPRODUCTION_PASS'
          elif alltext and allro: cls='STATE_0003_GOVERNING_DPMISC_CODEGEN_AND_CONSTANT_SECTIONS_EQUIVALENT_OBJECT_METADATA_DIFFERS'
          elif all(rel.values()): cls='STATE_0003_DIRECT_PATH_RELEVANT_CODEGEN_SECTIONS_EQUIVALENT_FULL_DPMISC_NOT_EQUIVALENT'
          else: cls='STATE_0003_GOVERNING_DPMISC_CODEGEN_EQUIVALENCE_NOT_PASS'
          data={'schemaVersion':1,'classification':cls,'governingObjectSha256':sha(pkg),'reproducedObjectSha256':sha(repro),'exactObjectByteIdentical':exact,'governingObjectSize':pkg.stat().st_size,'reproducedObjectSize':repro.stat().st_size,'allTextSectionsByteIdentical':alltext,'allRodataSectionsByteIdentical':allro,'directPathRelevantSections':rel,'sections':rows,'scienceExecution':False,'solverExecution':False,'protectedResultOpened':False,'r12IdentitiesReused':False,'sealedR12AuditOpened':False,'productionChanged':False,'fiveDegreeSeamChanged':False}
          out.write_text(json.dumps(data,indent=2,sort_keys=True)+'\n'); (out.parent/'classification.txt').write_text(cls+'\n'); print(json.dumps({k:data[k] for k in ('classification','governingObjectSha256','reproducedObjectSha256','exactObjectByteIdentical','governingObjectSize','reproducedObjectSize','allTextSectionsByteIdentical','allRodataSectionsByteIdentical','directPathRelevantSections')},indent=2,sort_keys=True))
          PY
          test "$(sha256sum "$PACKAGE_OBJ" | awk '{print $1}')" = "$GOVERNING_DPMISC_SHA256"
          cmp -s "$PACKAGE_OBJ" "$REPRO_OBJ" && echo EXACT_OBJECT_BYTE_IDENTICAL > "$EVIDENCE_DIR/comparison/cmp.txt" || echo OBJECT_BYTES_DIFFER > "$EVIDENCE_DIR/comparison/cmp.txt"
          python - <<'PY'
          import hashlib,os,pathlib
          root=pathlib.Path(os.environ['EVIDENCE_DIR']); rows=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file() and x.name!='evidence-manifest.sha256'): rows.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root).as_posix()}")
          (root/'evidence-manifest.sha256').write_text('\n'.join(rows)+'\n')
          PY

      - name: Publish isolated R15d evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lowalt-state-0003-dpmisc-object-repro-r15d-20260909
          path: ${{ runner.temp }}/lowalt_state0003_dpmisc_object_repro_r15d_20260909/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
