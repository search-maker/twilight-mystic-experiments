name: LOWALT STATE-0003 R19E2 nonprotected audit recovery
run-name: LOWALT STATE-0003 R19E2 audit ${{ github.sha }}

on:
  push:
    branches:
      - execution/lowalt-state0003-r19e2-audit-20260910

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

env:
  EXPECTED_BRANCH: execution/lowalt-state0003-r19e2-audit-20260910
  BASE_MAIN_SHA: 8cd85cf393e2d86a1b6d7325654747460a13e697
  R19_BASE_COMMIT: bc76a859cd93a9a1b2d249f28f9975a6faf7a666
  R19_BASE_BLOB: 5c226860e73df8dcd87799b94d8628735b3e259d
  R19_BASE_PATH: experiments/lowalt-state0003/runtime_internal_r19_20260909.py
  R19C_COMMIT: 156c800505137ccf98ad36ed5fd418d5d8b2f850
  R19C_BLOB: 52ac3df3cca8303d243883db1752545a9636d159
  R19C_PATH: experiments/lowalt-state0003/runtime_internal_r19c_20260909.py
  R19D_COMMIT: 7fe8e3dcc48145a738ede727aef3dc553a2ff104
  R19D_BLOB: 46294e11c75116190e1d3b1f70e5048ee949a33a
  R19D_PATH: experiments/lowalt-state0003/runtime_internal_r19d_20260909.py
  R19E_COMMIT: a58549371e45e6495626318ef609cc1183eae4dd
  R19E_BLOB: 883f231f4cfd996dba5dd7454f72baaef48d8cc8
  R19E_PATH: experiments/lowalt-state0003/runtime_internal_r19e_audit_20260909.py
  R19D_RUN_ID: '34434955020'
  R19D_HEAD: 792b8eca78a490f9fee8a20616ca97967d89d6db
  R19D_ARTIFACT_ID: '10135837963'
  R19D_ARTIFACT_DIGEST: sha256:61985e2b28aebe5f2ed56e0d9111aea2fe3cb7d3f91dbf1cc7e5015107e41002
  R19E_FAILED_RUN_ID: '34435187914'
  R19E_FAILED_JOB_ID: '102738660765'
  SOURCE_URL: http://www.libradtran.org/download/libRadtran-2.0.6.tar.gz
  SOURCE_ENTITY_SHA256: 999e47f4af4b5df6f85a6887fc105fc8f6e1a7cee89a3124f69ac8d8912c8e85
  UVSPEC_SHA256: 2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3
  R16_CONTRACT_SHA256: d7ef6a8e68c436728f71eba6e616126deb9f2d485af4926da4b2a294384475ca
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  audit-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact recovery head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bind additive recovery boundary and immutable driver chain
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git merge-base "$BASE_MAIN_SHA" HEAD)" = "$BASE_MAIN_SHA"
          ROOT="$RUNNER_TEMP/lowalt-state0003-r19e2"
          EVIDENCE="$ROOT/evidence"
          mkdir -p "$EVIDENCE"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "EVIDENCE_DIR=$EVIDENCE" >> "$GITHUB_ENV"
          git fetch --no-tags origin "$R19_BASE_COMMIT" "$R19C_COMMIT" "$R19D_COMMIT" "$R19E_COMMIT"
          for spec in \
            "$R19_BASE_COMMIT:$R19_BASE_PATH:$R19_BASE_BLOB:r19-base-driver.py" \
            "$R19C_COMMIT:$R19C_PATH:$R19C_BLOB:r19c-driver.py" \
            "$R19D_COMMIT:$R19D_PATH:$R19D_BLOB:r19d-driver.py" \
            "$R19E_COMMIT:$R19E_PATH:$R19E_BLOB:r19e-driver.py"; do
            commit=${spec%%:*}; rest=${spec#*:}; path=${rest%%:*}; rest=${rest#*:}; blob=${rest%%:*}; out=${rest#*:}
            test "$(git rev-parse "$commit:$path")" = "$blob"
            git show "$commit:$path" > "$ROOT/$out"
            test "$(git hash-object "$ROOT/$out")" = "$blob"
          done
          echo "R19_BASE_DRIVER_PATH=$ROOT/r19-base-driver.py" >> "$GITHUB_ENV"
          echo "R19C_DRIVER_PATH=$ROOT/r19c-driver.py" >> "$GITHUB_ENV"
          echo "R19D_DRIVER_PATH=$ROOT/r19d-driver.py" >> "$GITHUB_ENV"
          echo "DRIVER=$ROOT/r19e-driver.py" >> "$GITHUB_ENV"
          cat > "$EVIDENCE/execution-boundary.json" <<EOF
          {"schemaVersion":1,"classification":"STATE_0003_R19E2_PREALLOCATED_NONPROTECTED_AUDIT_MECHANICAL_RECOVERY_BOUNDARY","branch":"$GITHUB_REF_NAME","headSha":"$GITHUB_SHA","baseMainSha":"$BASE_MAIN_SHA","r19eDriverCommit":"$R19E_COMMIT","r19eDriverBlob":"$R19E_BLOB","failedR19eRunId":$R19E_FAILED_RUN_ID,"failedR19eJobId":$R19E_FAILED_JOB_ID,"auditIdentities":["r16-srcaud-0009","r16-srcaud-0010"],"auditIdentityReplacement":false,"protectedResultOpeningAuthorized":false,"taylorOrJerusalemUsed":false,"productionMutationAuthorized":false,"fiveDegreeSeamMutationAuthorized":false,"r12IdentityReuseAuthorized":false}
          EOF

      - name: Prove prior R19E failed before any audit exposure
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          hdr=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          curl -fsS "${hdr[@]}" "$api/actions/runs/$R19E_FAILED_RUN_ID" > "$ROOT/r19e-failed-run.json"
          curl -fsS "${hdr[@]}" "$api/actions/jobs/$R19E_FAILED_JOB_ID" > "$ROOT/r19e-failed-job.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['ROOT']); run=json.loads((root/'r19e-failed-run.json').read_text()); job=json.loads((root/'r19e-failed-job.json').read_text())
          assert run['id']==int(os.environ['R19E_FAILED_RUN_ID']) and run['status']=='completed' and run['conclusion']=='failure' and run['run_attempt']==1
          assert job['id']==int(os.environ['R19E_FAILED_JOB_ID']) and job['conclusion']=='failure'
          steps={s['name']:s['conclusion'] for s in job['steps']}
          assert steps['Rebind exact successful R19D development artifact before audit exposure']=='failure'
          assert steps['Set up exact inherited runtime and compiler provenance']=='skipped'
          assert steps['Execute two preallocated fresh NONPROTECTED audits under frozen contract']=='skipped'
          out={'schemaVersion':1,'classification':'STATE_0003_R19E_PRIOR_RUN_MECHANICAL_PREEXPOSURE_FAILURE_BOUND','runId':run['id'],'jobId':job['id'],'runAttempt':run['run_attempt'],'conclusion':run['conclusion'],'failedStep':'Rebind exact successful R19D development artifact before audit exposure','runtimeSetupSkipped':True,'auditExecutionSkipped':True,'auditIdentitiesRemainUnopened':['r16-srcaud-0009','r16-srcaud-0010']}
          (Path(os.environ['EVIDENCE_DIR'])/'prior-r19e-preexposure-barrier.json').write_text(json.dumps(out,sort_keys=True,separators=(',',':'))+'\n')
          PY

      - name: Rebind exact successful R19D development artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          hdr=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          curl -fsS "${hdr[@]}" "$api/actions/runs/$R19D_RUN_ID" > "$ROOT/r19d-run.json"
          curl -fsS "${hdr[@]}" "$api/actions/runs/$R19D_RUN_ID/artifacts?per_page=100" > "$ROOT/r19d-artifacts.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['ROOT']); run=json.loads((root/'r19d-run.json').read_text()); arts=json.loads((root/'r19d-artifacts.json').read_text())
          rid=int(os.environ['R19D_RUN_ID']); aid=int(os.environ['R19D_ARTIFACT_ID']); head=os.environ['R19D_HEAD']; dig=os.environ['R19D_ARTIFACT_DIGEST']
          assert run['id']==rid and run['head_sha']==head and run['run_attempt']==1 and run['status']=='completed' and run['conclusion']=='success'
          got=[a for a in arts['artifacts'] if int(a['id'])==aid]; assert len(got)==1 and got[0]['digest']==dig and not got[0]['expired']
          meta={'runId':rid,'headSha':head,'runAttempt':1,'conclusion':'success','artifactId':aid,'artifactDigest':dig}
          (root/'r19d-api-binding.json').write_text(json.dumps(meta,sort_keys=True,separators=(',',':'))+'\n')
          PY
          curl -fsSL "${hdr[@]}" "$api/actions/artifacts/$R19D_ARTIFACT_ID/zip" -o "$ROOT/r19d-artifact.zip"
          mkdir -p "$ROOT/r19d-artifact"
          unzip -q "$ROOT/r19d-artifact.zip" -d "$ROOT/r19d-artifact"
          test -f "$ROOT/r19d-artifact/development-summary.json"
          echo "R19D_DEVELOPMENT_SUMMARY_PATH=$ROOT/r19d-artifact/development-summary.json" >> "$GITHUB_ENV"
          echo "R19D_API_BINDING_PATH=$ROOT/r19d-api-binding.json" >> "$GITHUB_ENV"
          cp "$ROOT/r19d-api-binding.json" "$EVIDENCE_DIR/r19d-api-binding.json"
          cp "$ROOT/r19d-artifact/development-summary.json" "$EVIDENCE_DIR/r19d-development-summary.json"

      - name: Set up exact inherited runtime and compiler provenance
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: lowalt-state0003-r19e2
          create-args: >-
            -c conda-forge
            python=3.12.4
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1
            gfortran_impl_linux-64=13.4.0=hb485fb8_18
            gfortran_linux-64=13.4.0=hce61b40_21
            gcc_impl_linux-64=13.4.0=he2fa53e_18
          cache-environment: true
          cache-downloads: true

      - name: Ensure read-only debugger tooling
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdb binutils curl file > "$EVIDENCE_DIR/apt-install.log" 2>&1
          test -n "${FC:-}"
          sha256sum "$(command -v uvspec)" > "$EVIDENCE_DIR/uvspec-sha256.txt"
          test "$(sha256sum "$(command -v uvspec)" | awk '{print $1}')" = "$UVSPEC_SHA256"

      - name: Recover literal HTTP governing source entity and unchanged R16 contract
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          mkdir -p "$ROOT/source"
          curl -fsS -L --max-redirs 10 --compressed -D "$EVIDENCE_DIR/http-source-headers.txt" -o "$ROOT/source-entity.bin" -w 'initial=%{url}\nfinal=%{url_effective}\nhttp_code=%{http_code}\nredirects=%{num_redirects}\nsize_download=%{size_download}\n' "$SOURCE_URL" > "$EVIDENCE_DIR/http-source-route.txt" 2> "$EVIDENCE_DIR/http-source-curl.stderr"
          sha256sum "$ROOT/source-entity.bin" > "$EVIDENCE_DIR/http-source-entity-sha256.txt"
          wc -c "$ROOT/source-entity.bin" > "$EVIDENCE_DIR/http-source-entity-bytes.txt"
          test "$(sha256sum "$ROOT/source-entity.bin" | awk '{print $1}')" = "$SOURCE_ENTITY_SHA256"
          tar -xf "$ROOT/source-entity.bin" -C "$ROOT/source"
          DPMISC="$(find "$ROOT/source" -type f -path '*/libsrc_f/dpmisc.f' -print -quit)"; test -n "$DPMISC"
          SRC_ROOT="$(dirname "$(dirname "$DPMISC")")"; test -f "$SRC_ROOT/libsrc_f/DISORT.MXD"; test -f "$SRC_ROOT/libsrc_f/dpsdisort.f"
          echo "SOURCE_ROOT=$SRC_ROOT" >> "$GITHUB_ENV"
          cat > "$ROOT/r16-frozen-contract.json" <<'EOF'
          {
            "state": "STATE-0003",
            "gate": "R16-FRESH-SOURCE-EQUIVALENCE-TRAINING-FREEZE",
            "scope": "WHOLLY_FRESH_NONPROTECTED",
            "production_floor_deg": 5.0,
            "production_below_floor": "FAIL_CLOSED_UNCHANGED",
            "development_rows": 8,
            "audit_rows": 2,
            "audit_open_rule": "DO_NOT_OPEN_UNTIL_ALL_8_DEVELOPMENT_ROWS_PASS_THE_FROZEN_CONTRACT",
            "reference": "exact pinned libRadtran governing direct-path implementation/source and final pre-dispatch handoff",
            "integer_structural_fields": "EXACT",
            "fac_fac2_chp2_ch_abs_or_rel_tolerance": 1e-10,
            "direct_float64_abs_or_rel_tolerance": 1e-12,
            "exact_zero_preserved": true,
            "nan_or_inf": "FAIL",
            "post_result_retuning": "FORBIDDEN",
            "protected_residual_selection": "FORBIDDEN",
            "Taylor_Jerusalem_selection_or_fit": "FORBIDDEN",
            "consumed_R12_0001_0002": "FORBIDDEN_TO_RERUN_OR_REUSE",
            "R12_audit_0007_0008": "SEALED",
            "solver_executed_by_this_freeze": false,
            "science_seed_or_ordinal_allocated": false
          }
          EOF
          test "$(sha256sum "$ROOT/r16-frozen-contract.json" | awk '{print $1}')" = "$R16_CONTRACT_SHA256"
          echo "R16_CONTRACT_PATH=$ROOT/r16-frozen-contract.json" >> "$GITHUB_ENV"

      - name: Fresh-read authoritative governance and current lanes before audit exposure
        env:
          GH_TOKEN: ${{ github.token }}
          STARSVISIBILITY_READ_TOKEN: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${STARSVISIBILITY_READ_TOKEN:-}" || exit 78
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"; hdr=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          curl -fsS "${hdr[@]}" "$api/issues/60" > "$EVIDENCE_DIR/fresh-issue60.json"
          curl -fsS "${hdr[@]}" "$api/branches/main" > "$EVIDENCE_DIR/fresh-twilight-main.json"
          curl -fsS "${hdr[@]}" "$api/pulls/1026" > "$EVIDENCE_DIR/fresh-avps-pr1026.json"
          curl -fsS "${hdr[@]}" "$api/actions/runs?status=in_progress&per_page=100" > "$EVIDENCE_DIR/fresh-actions-in-progress.json"
          curl -fsS "${hdr[@]}" "$api/actions/runs?status=queued&per_page=100" > "$EVIDENCE_DIR/fresh-actions-queued.json"
          curl -fsS -H "Authorization: Bearer $STARSVISIBILITY_READ_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' https://api.github.com/repos/search-maker/starsvisibility/branches/main > "$EVIDENCE_DIR/fresh-stars-main.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          e=Path(os.environ['EVIDENCE_DIR'])
          tm=json.loads((e/'fresh-twilight-main.json').read_text()); sm=json.loads((e/'fresh-stars-main.json').read_text()); av=json.loads((e/'fresh-avps-pr1026.json').read_text()); ip=json.loads((e/'fresh-actions-in-progress.json').read_text()); q=json.loads((e/'fresh-actions-queued.json').read_text())
          assert tm['commit']['sha']==os.environ['BASE_MAIN_SHA']
          assert sm['commit']['sha']=='1e74d0522f086dba634a587bb245c32bcd4fac60'
          assert av['state']=='open' and av['draft'] is True and av['head']['sha']=='5028cb7c7cd585d720749f0d572aa15e2f614bf9'
          # An active V1 job is not itself a blocker. Record the complete visible inventory;
          # abort only on demonstrated runner queueing of a non-self critical lane.
          self_id=int(os.environ['GITHUB_RUN_ID'])
          critical=('exec005','v5r6','total-sky','avps','arm','v1')
          queued=[r for r in q.get('workflow_runs',[]) if int(r['id'])!=self_id and any(k in ((r.get('name') or '')+' '+(r.get('display_title') or '')).lower() for k in critical)]
          if queued: raise SystemExit('V1_CRITICAL_QUEUE_CONTENTION:'+','.join(str(r['id']) for r in queued))
          out={'schemaVersion':1,'classification':'STATE_0003_R19E2_FRESH_PREAUDIT_FENCE','issue60Comments':json.loads((e/'fresh-issue60.json').read_text())['comments'],'twilightMain':tm['commit']['sha'],'starsMain':sm['commit']['sha'],'avpsHead':av['head']['sha'],'inProgressCount':ip.get('total_count'),'queuedCount':q.get('total_count'),'criticalQueuedNonself':[]}
          (e/'fresh-preaudit-fence-summary.json').write_text(json.dumps(out,sort_keys=True,separators=(',',':'))+'\n')
          PY

      - name: Freeze exact audit implementation before any audit result opens
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          python -m py_compile "$R19_BASE_DRIVER_PATH" "$R19C_DRIVER_PATH" "$R19D_DRIVER_PATH" "$DRIVER"
          grep -n -i 'CALL geofast' "$SOURCE_ROOT/libsrc_f/dpsdisort.f" > "$EVIDENCE_DIR/dpssetdis-geofast-call-hits.txt"
          grep -n -i 'rearth=rearth\*1.D-5' "$SOURCE_ROOT/libsrc_f/dpsdisort.f" > "$EVIDENCE_DIR/dpssetdis-rearth-restore-hit.txt"
          test "$(wc -l < "$EVIDENCE_DIR/dpssetdis-geofast-call-hits.txt")" -ge 2
          test -s "$EVIDENCE_DIR/dpssetdis-rearth-restore-hit.txt"

      - name: Execute two preallocated fresh NONPROTECTED audits under frozen contract
        env:
          GH_TOKEN: ${{ github.token }}
          STARSVISIBILITY_READ_TOKEN: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          test -n "${STARSVISIBILITY_READ_TOKEN:-}" || exit 78
          python "$DRIVER"

      - name: Publish isolated R19E2 audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lowalt-state0003-r19e2-nonprotected-audit-20260910
          path: ${{ runner.temp }}/lowalt-state0003-r19e2/evidence/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
