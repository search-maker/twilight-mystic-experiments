name: LOWALT STATE-0003 R19E5 nonprotected audit recovery
run-name: LOWALT STATE-0003 R19E5 audit ${{ github.sha }}

on:
  push:
    branches:
      - execution/lowalt-state0003-r19e5-audit-20260910

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

env:
  EXPECTED_BRANCH: execution/lowalt-state0003-r19e5-audit-20260910
  BASE_MAIN_SHA: 8cd85cf393e2d86a1b6d7325654747460a13e697
  R19_BASE_BLOB: 5c226860e73df8dcd87799b94d8628735b3e259d
  R19C_BLOB: 52ac3df3cca8303d243883db1752545a9636d159
  R19D_BLOB: 46294e11c75116190e1d3b1f70e5048ee949a33a
  R19E_BLOB: 883f231f4cfd996dba5dd7454f72baaef48d8cc8
  R19D_RUN_ID: '34434955020'
  R19D_HEAD: 792b8eca78a490f9fee8a20616ca97967d89d6db
  R19D_ARTIFACT_ID: '10135837963'
  R19D_ARTIFACT_DIGEST: 61985e2b28aebe5f2ed56e0d9111aea2fe3cb7d3f91dbf1cc7e5015107e41002
  R19D_DEVELOPMENT_SUMMARY_SHA256: bb8ce5bba128c00e72cd789ea1dd3fb7ee184446b1b69aaa3b56871ca719ad48
  R19E_FAILED_RUN_ID: '34435187914'
  R19E_FAILED_JOB_ID: '102738660765'
  R19E2_FAILED_RUN_ID: '34435357255'
  R19E2_FAILED_JOB_ID: '102739171002'
  R19E3_FAILED_RUN_ID: '34436206774'
  R19E3_FAILED_JOB_ID: '102741687821'
  R19E4_FAILED_RUN_ID: '34436311218'
  R19E4_FAILED_JOB_ID: '102741987313'
  SOURCE_URL: http://www.libradtran.org/download/libRadtran-2.0.6.tar.gz
  SOURCE_ENTITY_SHA256: 999e47f4af4b5df6f85a6887fc105fc8f6e1a7cee89a3124f69ac8d8912c8e85
  UVSPEC_SHA256: 2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3
  R16_CONTRACT_SHA256: d7ef6a8e68c436728f71eba6e616126deb9f2d485af4926da4b2a294384475ca
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact fresh audit head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Bind immutable driver bytes and prove every prior audit attempt was pre-exposure
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          ROOT="$RUNNER_TEMP/lowalt-state0003-r19e5"
          EVIDENCE_DIR="$ROOT/evidence"
          mkdir -p "$EVIDENCE_DIR"
          export ROOT EVIDENCE_DIR
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "EVIDENCE_DIR=$EVIDENCE_DIR" >> "$GITHUB_ENV"
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')

          get_blob() {
            expected="$1"; out="$2"; meta="$ROOT/blob-$expected.json"
            curl -fsS "${auth[@]}" "$api/git/blobs/$expected" > "$meta"
            test "$(jq -r .sha "$meta")" = "$expected"
            test "$(jq -r .encoding "$meta")" = base64
            jq -r .content "$meta" | tr -d '\n' | base64 -d > "$out"
            test "$(git hash-object "$out")" = "$expected"
          }
          get_blob "$R19_BASE_BLOB" "$ROOT/r19-base-driver.py"
          get_blob "$R19C_BLOB" "$ROOT/r19c-driver.py"
          get_blob "$R19D_BLOB" "$ROOT/r19d-driver.py"
          get_blob "$R19E_BLOB" "$ROOT/r19e-driver.py"
          echo "R19_BASE_DRIVER_PATH=$ROOT/r19-base-driver.py" >> "$GITHUB_ENV"
          echo "R19C_DRIVER_PATH=$ROOT/r19c-driver.py" >> "$GITHUB_ENV"
          echo "R19D_DRIVER_PATH=$ROOT/r19d-driver.py" >> "$GITHUB_ENV"
          echo "DRIVER=$ROOT/r19e-driver.py" >> "$GITHUB_ENV"
          sha256sum "$ROOT"/*driver.py > "$EVIDENCE_DIR/immutable-driver-sha256.txt"
          printf '{"schemaVersion":1,"classification":"STATE_0003_R19E5_IMMUTABLE_DRIVER_BLOB_BINDING_PASS","r19BaseBlob":"%s","r19cBlob":"%s","r19dBlob":"%s","r19eBlob":"%s"}\n' "$R19_BASE_BLOB" "$R19C_BLOB" "$R19D_BLOB" "$R19E_BLOB" > "$EVIDENCE_DIR/driver-blob-binding.json"

          for pair in \
            "$R19E_FAILED_RUN_ID:$R19E_FAILED_JOB_ID" \
            "$R19E2_FAILED_RUN_ID:$R19E2_FAILED_JOB_ID" \
            "$R19E3_FAILED_RUN_ID:$R19E3_FAILED_JOB_ID" \
            "$R19E4_FAILED_RUN_ID:$R19E4_FAILED_JOB_ID"; do
            rid=${pair%%:*}; jid=${pair##*:}
            curl -fsS "${auth[@]}" "$api/actions/runs/$rid" > "$ROOT/run-$rid.json"
            curl -fsS "${auth[@]}" "$api/actions/jobs/$jid" > "$ROOT/job-$jid.json"
            test "$(jq -r .status "$ROOT/run-$rid.json")" = completed
            test "$(jq -r .conclusion "$ROOT/run-$rid.json")" = failure
            test "$(jq -r .run_attempt "$ROOT/run-$rid.json")" = 1
            test "$(jq -r .conclusion "$ROOT/job-$jid.json")" = failure
          done
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['ROOT']); e=Path(os.environ['EVIDENCE_DIR'])
          pairs=[('R19E_FAILED_RUN_ID','R19E_FAILED_JOB_ID'),('R19E2_FAILED_RUN_ID','R19E2_FAILED_JOB_ID'),('R19E3_FAILED_RUN_ID','R19E3_FAILED_JOB_ID'),('R19E4_FAILED_RUN_ID','R19E4_FAILED_JOB_ID')]
          rows=[]
          for re,je in pairs:
            rid=int(os.environ[re]); jid=int(os.environ[je]); job=json.loads((root/f'job-{jid}.json').read_text()); steps={s['name']:s['conclusion'] for s in job['steps']}
            audit=[(n,c) for n,c in steps.items() if 'Execute two preallocated fresh NONPROTECTED audit' in n]
            assert audit and all(c=='skipped' for _,c in audit),(rid,audit)
            runtime=[(n,c) for n,c in steps.items() if 'Set up exact inherited runtime' in n]
            assert runtime and all(c=='skipped' for _,c in runtime),(rid,runtime)
            rows.append({'runId':rid,'jobId':jid,'auditExecutionSkipped':True,'runtimeSetupSkipped':True})
          out={'schemaVersion':1,'classification':'STATE_0003_R19E5_ALL_PRIOR_AUDIT_ATTEMPTS_PROVEN_PREEXPOSURE','priorAttempts':rows,'auditIdentitiesRemainUnopened':['r16-srcaud-0009','r16-srcaud-0010']}
          (e/'prior-audit-attempts-preexposure.json').write_text(json.dumps(out,sort_keys=True,separators=(',',':'))+'\n')
          PY
          printf '{"schemaVersion":1,"classification":"STATE_0003_R19E5_PREALLOCATED_NONPROTECTED_AUDIT_BOUNDARY","branch":"%s","headSha":"%s","baseMainSha":"%s","auditIdentities":["r16-srcaud-0009","r16-srcaud-0010"],"auditIdentityReplacement":false,"protectedResultOpeningAuthorized":false,"taylorOrJerusalemUsed":false,"productionMutationAuthorized":false,"fiveDegreeSeamMutationAuthorized":false,"r12IdentityReuseAuthorized":false}\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" "$BASE_MAIN_SHA" > "$EVIDENCE_DIR/execution-boundary.json"

      - name: Rebind exact successful R19D development pass and artifact bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          curl -fsS "${auth[@]}" "$api/actions/runs/$R19D_RUN_ID" > "$ROOT/r19d-run.json"
          curl -fsS "${auth[@]}" "$api/actions/runs/$R19D_RUN_ID/artifacts?per_page=100" > "$ROOT/r19d-artifacts.json"
          test "$(jq -r .id "$ROOT/r19d-run.json")" = "$R19D_RUN_ID"
          test "$(jq -r .head_sha "$ROOT/r19d-run.json")" = "$R19D_HEAD"
          test "$(jq -r .run_attempt "$ROOT/r19d-run.json")" = 1
          test "$(jq -r .status "$ROOT/r19d-run.json")" = completed
          test "$(jq -r .conclusion "$ROOT/r19d-run.json")" = success
          got_digest="$(jq -r --argjson id "$R19D_ARTIFACT_ID" '.artifacts[] | select(.id==$id) | .digest' "$ROOT/r19d-artifacts.json")"
          test "$got_digest" = "sha256:$R19D_ARTIFACT_DIGEST"
          test "$(jq -r --argjson id "$R19D_ARTIFACT_ID" '.artifacts[] | select(.id==$id) | .expired' "$ROOT/r19d-artifacts.json")" = false
          printf '{"artifactDigest":"sha256:%s","artifactId":%s,"conclusion":"success","headSha":"%s","runAttempt":1,"runId":%s}\n' "$R19D_ARTIFACT_DIGEST" "$R19D_ARTIFACT_ID" "$R19D_HEAD" "$R19D_RUN_ID" > "$ROOT/r19d-api-binding.json"

          code="$(curl -sS -o /dev/null -D "$ROOT/r19d-redirect.headers" -w '%{http_code}' "${auth[@]}" "$api/actions/artifacts/$R19D_ARTIFACT_ID/zip")"
          test "$code" = 302
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' "$ROOT/r19d-redirect.headers")"
          test -n "$location"
          case "$location" in https://*) ;; *) exit 71;; esac
          curl -fsS --proto '=https' "$location" -o "$ROOT/r19d-artifact.zip"
          test "$(sha256sum "$ROOT/r19d-artifact.zip" | awk '{print $1}')" = "$R19D_ARTIFACT_DIGEST"
          mkdir -p "$ROOT/r19d-artifact"
          unzip -q "$ROOT/r19d-artifact.zip" -d "$ROOT/r19d-artifact"
          test -f "$ROOT/r19d-artifact/development-summary.json"
          test "$(sha256sum "$ROOT/r19d-artifact/development-summary.json" | awk '{print $1}')" = "$R19D_DEVELOPMENT_SUMMARY_SHA256"
          jq -e '.classification=="STATE_0003_R19D_FRESH_NONPROTECTED_RADIUS_STATE_CORRECTED_DEVELOPMENT_PASS_8_OF_8" and .allPass==true and .count==8 and .auditOpened==false and .allUtauEndpointPreprocessBitExact==true' "$ROOT/r19d-artifact/development-summary.json" >/dev/null
          echo "R19D_DEVELOPMENT_SUMMARY_PATH=$ROOT/r19d-artifact/development-summary.json" >> "$GITHUB_ENV"
          echo "R19D_API_BINDING_PATH=$ROOT/r19d-api-binding.json" >> "$GITHUB_ENV"
          cp "$ROOT/r19d-api-binding.json" "$EVIDENCE_DIR/r19d-api-binding.json"
          cp "$ROOT/r19d-artifact/development-summary.json" "$EVIDENCE_DIR/r19d-development-summary.json"
          sha256sum "$ROOT/r19d-artifact.zip" > "$EVIDENCE_DIR/r19d-artifact-zip-sha256.txt"

      - name: Set up exact inherited runtime and compiler provenance
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: lowalt-state0003-r19e5
          create-args: >-
            -c conda-forge
            python=3.12.4
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1
            gfortran_impl_linux-64=13.4.0=hb485fb8_18
            gfortran_linux-64=13.4.0=hce61b40_21
            gcc_impl_linux-64=13.4.0=he2fa53e_18
          cache-environment: true
          cache-downloads: true

      - name: Bind uvspec and debugger tooling
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdb binutils curl file > "$EVIDENCE_DIR/apt-install.log" 2>&1
          test -n "${FC:-}"
          test "$(sha256sum "$(command -v uvspec)" | awk '{print $1}')" = "$UVSPEC_SHA256"
          sha256sum "$(command -v uvspec)" > "$EVIDENCE_DIR/uvspec-sha256.txt"

      - name: Recover literal HTTP governing source and unchanged R16 contract
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          mkdir -p "$ROOT/source"
          curl -fsS -L --max-redirs 10 --compressed -D "$EVIDENCE_DIR/http-source-headers.txt" -o "$ROOT/source-entity.bin" -w 'initial=%{url}\nfinal=%{url_effective}\nhttp_code=%{http_code}\nredirects=%{num_redirects}\nsize_download=%{size_download}\n' "$SOURCE_URL" > "$EVIDENCE_DIR/http-source-route.txt" 2> "$EVIDENCE_DIR/http-source-curl.stderr"
          test "$(sha256sum "$ROOT/source-entity.bin" | awk '{print $1}')" = "$SOURCE_ENTITY_SHA256"
          sha256sum "$ROOT/source-entity.bin" > "$EVIDENCE_DIR/http-source-entity-sha256.txt"
          wc -c "$ROOT/source-entity.bin" > "$EVIDENCE_DIR/http-source-entity-bytes.txt"
          tar -xf "$ROOT/source-entity.bin" -C "$ROOT/source"
          DPMISC="$(find "$ROOT/source" -type f -path '*/libsrc_f/dpmisc.f' -print -quit)"; test -n "$DPMISC"
          SRC_ROOT="$(dirname "$(dirname "$DPMISC")")"; test -f "$SRC_ROOT/libsrc_f/DISORT.MXD"; test -f "$SRC_ROOT/libsrc_f/dpsdisort.f"
          echo "SOURCE_ROOT=$SRC_ROOT" >> "$GITHUB_ENV"
          cat > "$ROOT/r16-frozen-contract.json" <<'EOF'
          {
            "state": "STATE-0003",
            "gate": "R16-FRESH-SOURCE-EQUIVALENCE-TRAINING-FREEZE",
            "scope": "WHOLLY_FRESH_NONPROTECTED",
            "production_floor_deg": 5.0,
            "production_below_floor": "FAIL_CLOSED_UNCHANGED",
            "development_rows": 8,
            "audit_rows": 2,
            "audit_open_rule": "DO_NOT_OPEN_UNTIL_ALL_8_DEVELOPMENT_ROWS_PASS_THE_FROZEN_CONTRACT",
            "reference": "exact pinned libRadtran governing direct-path implementation/source and final pre-dispatch handoff",
            "integer_structural_fields": "EXACT",
            "fac_fac2_chp2_ch_abs_or_rel_tolerance": 1e-10,
            "direct_float64_abs_or_rel_tolerance": 1e-12,
            "exact_zero_preserved": true,
            "nan_or_inf": "FAIL",
            "post_result_retuning": "FORBIDDEN",
            "protected_residual_selection": "FORBIDDEN",
            "Taylor_Jerusalem_selection_or_fit": "FORBIDDEN",
            "consumed_R12_0001_0002": "FORBIDDEN_TO_RERUN_OR_REUSE",
            "R12_audit_0007_0008": "SEALED",
            "solver_executed_by_this_freeze": false,
            "science_seed_or_ordinal_allocated": false
          }
          EOF
          test "$(sha256sum "$ROOT/r16-frozen-contract.json" | awk '{print $1}')" = "$R16_CONTRACT_SHA256"
          echo "R16_CONTRACT_PATH=$ROOT/r16-frozen-contract.json" >> "$GITHUB_ENV"

      - name: Fresh governance and lane fence immediately before audit exposure
        env:
          GH_TOKEN: ${{ github.token }}
          STARSVISIBILITY_READ_TOKEN: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${STARSVISIBILITY_READ_TOKEN:-}" || exit 78
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"; auth=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          curl -fsS "${auth[@]}" "$api/issues/60" > "$EVIDENCE_DIR/fresh-issue60.json"
          curl -fsS "${auth[@]}" "$api/branches/main" > "$EVIDENCE_DIR/fresh-twilight-main.json"
          curl -fsS "${auth[@]}" "$api/pulls/1026" > "$EVIDENCE_DIR/fresh-avps-pr1026.json"
          curl -fsS "${auth[@]}" "$api/actions/runs?status=in_progress&per_page=100" > "$EVIDENCE_DIR/fresh-actions-in-progress.json"
          curl -fsS "${auth[@]}" "$api/actions/runs?status=queued&per_page=100" > "$EVIDENCE_DIR/fresh-actions-queued.json"
          curl -fsS -H "Authorization: Bearer $STARSVISIBILITY_READ_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' https://api.github.com/repos/search-maker/starsvisibility/branches/main > "$EVIDENCE_DIR/fresh-stars-main.json"
          test "$(jq -r .commit.sha "$EVIDENCE_DIR/fresh-twilight-main.json")" = "$BASE_MAIN_SHA"
          test "$(jq -r .commit.sha "$EVIDENCE_DIR/fresh-stars-main.json")" = 1e74d0522f086dba634a587bb245c32bcd4fac60
          test "$(jq -r .state "$EVIDENCE_DIR/fresh-avps-pr1026.json")" = open
          test "$(jq -r .draft "$EVIDENCE_DIR/fresh-avps-pr1026.json")" = true
          test "$(jq -r .head.sha "$EVIDENCE_DIR/fresh-avps-pr1026.json")" = 5028cb7c7cd585d720749f0d572aa15e2f614bf9
          python - <<'PY'
          import json,os
          from pathlib import Path
          e=Path(os.environ['EVIDENCE_DIR']); q=json.loads((e/'fresh-actions-queued.json').read_text()); ip=json.loads((e/'fresh-actions-in-progress.json').read_text())
          self_id=int(os.environ['GITHUB_RUN_ID']); critical=('exec005','v5r6','total-sky','avps','arm','v1')
          queued=[r for r in q.get('workflow_runs',[]) if int(r['id'])!=self_id and any(k in ((r.get('name') or '')+' '+(r.get('display_title') or '')).lower() for k in critical)]
          if queued: raise SystemExit('V1_CRITICAL_QUEUE_CONTENTION:'+','.join(str(r['id']) for r in queued))
          out={'schemaVersion':1,'classification':'STATE_0003_R19E5_FRESH_PREAUDIT_FENCE','issue60Comments':json.loads((e/'fresh-issue60.json').read_text())['comments'],'twilightMain':json.loads((e/'fresh-twilight-main.json').read_text())['commit']['sha'],'starsMain':json.loads((e/'fresh-stars-main.json').read_text())['commit']['sha'],'avpsHead':json.loads((e/'fresh-avps-pr1026.json').read_text())['head']['sha'],'inProgressCount':ip.get('total_count'),'queuedCount':q.get('total_count'),'criticalQueuedNonself':[]}
          (e/'fresh-preaudit-fence-summary.json').write_text(json.dumps(out,sort_keys=True,separators=(',',':'))+'\n')
          PY

      - name: Freeze immutable audit implementation before opening any audit result
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          python -m py_compile "$R19_BASE_DRIVER_PATH" "$R19C_DRIVER_PATH" "$R19D_DRIVER_PATH" "$DRIVER"
          grep -n -i 'CALL geofast' "$SOURCE_ROOT/libsrc_f/dpsdisort.f" > "$EVIDENCE_DIR/dpssetdis-geofast-call-hits.txt"
          grep -n -i 'rearth=rearth\*1.D-5' "$SOURCE_ROOT/libsrc_f/dpsdisort.f" > "$EVIDENCE_DIR/dpssetdis-rearth-restore-hit.txt"
          test "$(wc -l < "$EVIDENCE_DIR/dpssetdis-geofast-call-hits.txt")" -ge 2
          test -s "$EVIDENCE_DIR/dpssetdis-rearth-restore-hit.txt"
          printf '{"schemaVersion":1,"classification":"STATE_0003_R19E5_EXACT_AUDIT_IMPLEMENTATION_FROZEN","r19eDriverBlob":"%s","auditOrder":["r16-srcaud-0009","r16-srcaud-0010"],"stoppingRule":"stop after first audit failure","structuralComparison":"EXACT","facFac2Chp2ChTolerance":1e-10,"directFloat64Tolerance":1e-12,"postResultRetuning":"FORBIDDEN","productionBelow5Deg":"FAIL_CLOSED_UNCHANGED"}\n' "$R19E_BLOB" > "$EVIDENCE_DIR/r19e5-audit-freeze.json"

      - name: Execute two preallocated fresh NONPROTECTED audits under unchanged frozen contract
        env:
          GH_TOKEN: ${{ github.token }}
          STARSVISIBILITY_READ_TOKEN: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          test -n "${STARSVISIBILITY_READ_TOKEN:-}" || exit 78
          python "$DRIVER"

      - name: Publish isolated R19E5 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lowalt-state0003-r19e5-nonprotected-audit-20260910
          path: ${{ runner.temp }}/lowalt-state0003-r19e5/evidence/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
