name: LOWALT STATE-0003 R19E6 nonprotected audit role-adapter recovery
run-name: LOWALT STATE-0003 R19E6 audit ${{ github.sha }}

on:
  push:
    branches:
      - execution/lowalt-state0003-r19e6-audit-20260910

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

env:
  EXPECTED_BRANCH: execution/lowalt-state0003-r19e6-audit-20260910
  BASE_MAIN_SHA: 8cd85cf393e2d86a1b6d7325654747460a13e697
  R19_BASE_BLOB: 5c226860e73df8dcd87799b94d8628735b3e259d
  R19C_BLOB: 52ac3df3cca8303d243883db1752545a9636d159
  R19D_BLOB: 46294e11c75116190e1d3b1f70e5048ee949a33a
  R19E_BLOB: 883f231f4cfd996dba5dd7454f72baaef48d8cc8
  R19D_RUN_ID: '34434955020'
  R19D_HEAD: 792b8eca78a490f9fee8a20616ca97967d89d6db
  R19D_ARTIFACT_ID: '10135837963'
  R19D_ARTIFACT_DIGEST: 61985e2b28aebe5f2ed56e0d9111aea2fe3cb7d3f91dbf1cc7e5015107e41002
  R19D_DEVELOPMENT_SUMMARY_SHA256: bb8ce5bba128c00e72cd789ea1dd3fb7ee184446b1b69aaa3b56871ca719ad48
  R19E5_RUN_ID: '34436472998'
  R19E5_JOB_ID: '102742456192'
  R19E5_ARTIFACT_ID: '10136343664'
  R19E5_ARTIFACT_DIGEST: f4c4473d98624a5f24ab75c42d8438943302c5238738ddfbdede6d4e0d3140c0
  SOURCE_URL: http://www.libradtran.org/download/libRadtran-2.0.6.tar.gz
  SOURCE_ENTITY_SHA256: 999e47f4af4b5df6f85a6887fc105fc8f6e1a7cee89a3124f69ac8d8912c8e85
  UVSPEC_SHA256: 2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3
  R16_CONTRACT_SHA256: d7ef6a8e68c436728f71eba6e616126deb9f2d485af4926da4b2a294384475ca
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact fresh audit head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Bind immutable driver chain and R19E5 pre-result mechanical defect
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          ROOT="$RUNNER_TEMP/lowalt-state0003-r19e6"
          EVIDENCE_DIR="$ROOT/evidence"
          mkdir -p "$EVIDENCE_DIR"
          export ROOT EVIDENCE_DIR
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "EVIDENCE_DIR=$EVIDENCE_DIR" >> "$GITHUB_ENV"
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')

          get_blob() {
            expected="$1"; out="$2"; meta="$ROOT/blob-$expected.json"
            curl -fsS "${auth[@]}" "$api/git/blobs/$expected" > "$meta"
            test "$(jq -r .sha "$meta")" = "$expected"
            test "$(jq -r .encoding "$meta")" = base64
            jq -r .content "$meta" | tr -d '\n' | base64 -d > "$out"
            test "$(git hash-object "$out")" = "$expected"
          }
          get_blob "$R19_BASE_BLOB" "$ROOT/r19-base-driver.py"
          get_blob "$R19C_BLOB" "$ROOT/r19c-driver.py"
          get_blob "$R19D_BLOB" "$ROOT/r19d-driver.py"
          get_blob "$R19E_BLOB" "$ROOT/r19e-driver.py"
          echo "R19_BASE_DRIVER_PATH=$ROOT/r19-base-driver.py" >> "$GITHUB_ENV"
          echo "R19C_DRIVER_PATH=$ROOT/r19c-driver.py" >> "$GITHUB_ENV"
          echo "R19D_DRIVER_PATH=$ROOT/r19d-driver.py" >> "$GITHUB_ENV"
          echo "R19E_DRIVER_PATH=$ROOT/r19e-driver.py" >> "$GITHUB_ENV"
          sha256sum "$ROOT"/*driver.py > "$EVIDENCE_DIR/immutable-driver-sha256.txt"

          curl -fsS "${auth[@]}" "$api/actions/runs/$R19E5_RUN_ID" > "$ROOT/r19e5-run.json"
          curl -fsS "${auth[@]}" "$api/actions/jobs/$R19E5_JOB_ID" > "$ROOT/r19e5-job.json"
          curl -fsS "${auth[@]}" "$api/actions/runs/$R19E5_RUN_ID/artifacts?per_page=100" > "$ROOT/r19e5-artifacts.json"
          test "$(jq -r .status "$ROOT/r19e5-run.json")" = completed
          test "$(jq -r .conclusion "$ROOT/r19e5-run.json")" = failure
          test "$(jq -r .run_attempt "$ROOT/r19e5-run.json")" = 1
          test "$(jq -r '.steps[] | select(.name=="Execute two preallocated fresh NONPROTECTED audits under unchanged frozen contract") | .conclusion' "$ROOT/r19e5-job.json")" = failure
          got_digest="$(jq -r --argjson id "$R19E5_ARTIFACT_ID" '.artifacts[] | select(.id==$id) | .digest' "$ROOT/r19e5-artifacts.json")"
          test "$got_digest" = "sha256:$R19E5_ARTIFACT_DIGEST"

          code="$(curl -sS -o /dev/null -D "$ROOT/r19e5-redirect.headers" -w '%{http_code}' "${auth[@]}" "$api/actions/artifacts/$R19E5_ARTIFACT_ID/zip")"
          test "$code" = 302
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' "$ROOT/r19e5-redirect.headers")"
          case "$location" in https://*) ;; *) exit 71;; esac
          curl -fsS --proto '=https' "$location" -o "$ROOT/r19e5-artifact.zip"
          test "$(sha256sum "$ROOT/r19e5-artifact.zip" | awk '{print $1}')" = "$R19E5_ARTIFACT_DIGEST"
          mkdir -p "$ROOT/r19e5-artifact"
          unzip -q "$ROOT/r19e5-artifact.zip" -d "$ROOT/r19e5-artifact"
          jq -e '.classification=="STATE_0003_R19E_EXECUTION_BARRIER" and .errorType=="AssertionError" and .error==""' "$ROOT/r19e5-artifact/fatal-barrier.json" >/dev/null
          test ! -e "$ROOT/r19e5-artifact/audit-summary.json"
          test "$(find "$ROOT/r19e5-artifact" -path '*/cases/*' -type f | wc -l)" -eq 0

          python - <<'PY'
          import ast, json, os
          from pathlib import Path
          src=Path(os.environ['ROOT'])/'r19-base-driver.py'
          tree=ast.parse(src.read_text())
          fn=next(n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='run_case')
          text=ast.get_source_segment(src.read_text(),fn)
          assert text is not None
          old="assert role=='development'"
          assert text.count(old)==1
          assert text.index(old) < text.index("case=e/'cases'/cid")
          out={'schemaVersion':1,'classification':'STATE_0003_R19E5_AUDIT_ROLE_ASSERTION_PRE_SOLVER_BARRIER_PROVEN','r19e5RunId':int(os.environ['R19E5_RUN_ID']),'r19e5JobId':int(os.environ['R19E5_JOB_ID']),'r19e5ArtifactId':int(os.environ['R19E5_ARTIFACT_ID']),'r19e5ArtifactDigest':'sha256:'+os.environ['R19E5_ARTIFACT_DIGEST'],'baseDriverBlob':os.environ['R19_BASE_BLOB'],'mechanicalDefect':"core.run_case rejects role!='development' before creating the case directory",'auditIdentitiesReachedCaseDirectory':False,'auditIdentitiesReachedPinnedSdisortEntry':False,'auditResultsOpened':False,'auditIdentitiesRemainScientificallyUnopened':['r16-srcaud-0009','r16-srcaud-0010']}
          Path(os.environ['EVIDENCE_DIR'],'r19e5-pre-result-role-barrier.json').write_text(json.dumps(out,sort_keys=True,separators=(',',':'))+'\n')
          PY

      - name: Rebind exact successful R19D development pass and artifact bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          curl -fsS "${auth[@]}" "$api/actions/runs/$R19D_RUN_ID" > "$ROOT/r19d-run.json"
          curl -fsS "${auth[@]}" "$api/actions/runs/$R19D_RUN_ID/artifacts?per_page=100" > "$ROOT/r19d-artifacts.json"
          test "$(jq -r .head_sha "$ROOT/r19d-run.json")" = "$R19D_HEAD"
          test "$(jq -r .run_attempt "$ROOT/r19d-run.json")" = 1
          test "$(jq -r .status "$ROOT/r19d-run.json")" = completed
          test "$(jq -r .conclusion "$ROOT/r19d-run.json")" = success
          test "$(jq -r --argjson id "$R19D_ARTIFACT_ID" '.artifacts[] | select(.id==$id) | .digest' "$ROOT/r19d-artifacts.json")" = "sha256:$R19D_ARTIFACT_DIGEST"
          printf '{"artifactDigest":"sha256:%s","artifactId":%s,"conclusion":"success","headSha":"%s","runAttempt":1,"runId":%s}\n' "$R19D_ARTIFACT_DIGEST" "$R19D_ARTIFACT_ID" "$R19D_HEAD" "$R19D_RUN_ID" > "$ROOT/r19d-api-binding.json"
          code="$(curl -sS -o /dev/null -D "$ROOT/r19d-redirect.headers" -w '%{http_code}' "${auth[@]}" "$api/actions/artifacts/$R19D_ARTIFACT_ID/zip")"; test "$code" = 302
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' "$ROOT/r19d-redirect.headers")"; case "$location" in https://*) ;; *) exit 71;; esac
          curl -fsS --proto '=https' "$location" -o "$ROOT/r19d-artifact.zip"
          test "$(sha256sum "$ROOT/r19d-artifact.zip" | awk '{print $1}')" = "$R19D_ARTIFACT_DIGEST"
          mkdir -p "$ROOT/r19d-artifact"; unzip -q "$ROOT/r19d-artifact.zip" -d "$ROOT/r19d-artifact"
          test "$(sha256sum "$ROOT/r19d-artifact/development-summary.json" | awk '{print $1}')" = "$R19D_DEVELOPMENT_SUMMARY_SHA256"
          jq -e '.classification=="STATE_0003_R19D_FRESH_NONPROTECTED_RADIUS_STATE_CORRECTED_DEVELOPMENT_PASS_8_OF_8" and .allPass==true and .count==8 and .auditOpened==false and .allUtauEndpointPreprocessBitExact==true' "$ROOT/r19d-artifact/development-summary.json" >/dev/null
          echo "R19D_DEVELOPMENT_SUMMARY_PATH=$ROOT/r19d-artifact/development-summary.json" >> "$GITHUB_ENV"
          echo "R19D_API_BINDING_PATH=$ROOT/r19d-api-binding.json" >> "$GITHUB_ENV"
          cp "$ROOT/r19d-api-binding.json" "$EVIDENCE_DIR/r19d-api-binding.json"
          cp "$ROOT/r19d-artifact/development-summary.json" "$EVIDENCE_DIR/r19d-development-summary.json"

      - name: Freeze result-blind audit-role adapter before runtime setup
        shell: bash
        run: |
          set -euo pipefail
          cat > "$ROOT/r19e6-wrapper.py" <<'PY'
          #!/usr/bin/env python3
          import hashlib, importlib.util, inspect, json, os
          from pathlib import Path
          p=Path(os.environ['R19E_DRIVER_PATH'])
          spec=importlib.util.spec_from_file_location('r19e',p)
          r19e=importlib.util.module_from_spec(spec); assert spec.loader is not None; spec.loader.exec_module(r19e)
          core=r19e.core
          original=inspect.getsource(core.run_case)
          old="assert role=='development'"
          new="assert role in ('development','audit')"
          assert original.count(old)==1
          assert original.index(old) < original.index("case=e/'cases'/cid")
          patched=original.replace(old,new,1)
          compile(patched,'<r19e6-run-case-role-adapter>','exec')
          exec(compile(patched,'<r19e6-run-case-role-adapter>','exec'),core.__dict__,core.__dict__)
          evidence=Path(os.environ['EVIDENCE_DIR'])
          rec={'schemaVersion':1,'classification':'STATE_0003_R19E6_RESULT_BLIND_AUDIT_ROLE_ADAPTER_FROZEN','baseDriverBlob':os.environ['R19_BASE_BLOB'],'r19eDriverBlob':os.environ['R19E_BLOB'],'originalRunCaseSha256':hashlib.sha256(original.encode()).hexdigest(),'patchedRunCaseSha256':hashlib.sha256(patched.encode()).hexdigest(),'exactMechanicalChange':old+' -> '+new,'scienceInputsChanged':False,'comparisonLogicChanged':False,'tolerancesChanged':False,'auditIdentityReplacement':False,'auditOrder':['r16-srcaud-0009','r16-srcaud-0010'],'stoppingRule':'stop after first audit failure','productionBelow5Deg':'FAIL_CLOSED_UNCHANGED'}
          (evidence/'r19e6-role-adapter-binding.json').write_text(json.dumps(rec,sort_keys=True,separators=(',',':'))+'\n')
          raise SystemExit(r19e.main())
          PY
          python -m py_compile "$ROOT/r19e6-wrapper.py"
          sha256sum "$ROOT/r19e6-wrapper.py" > "$EVIDENCE_DIR/r19e6-wrapper-sha256.txt"
          echo "R19E6_WRAPPER=$ROOT/r19e6-wrapper.py" >> "$GITHUB_ENV"
          printf '{"schemaVersion":1,"classification":"STATE_0003_R19E6_AUDIT_ROLE_ADAPTER_PREREGISTERED","mechanicalChange":"permit the already-preallocated audit role through the development-only orchestration assertion; all science, comparison and stopping semantics unchanged","auditIdentities":["r16-srcaud-0009","r16-srcaud-0010"],"replacement":false,"retuning":false,"protected":false,"taylorJerusalem":false,"productionBelow5Deg":"FAIL_CLOSED_UNCHANGED"}\n' > "$EVIDENCE_DIR/r19e6-preregistration.json"

      - name: Set up exact inherited runtime and compiler provenance
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: lowalt-state0003-r19e6
          create-args: >-
            -c conda-forge
            python=3.12.4
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1
            gfortran_impl_linux-64=13.4.0=hb485fb8_18
            gfortran_linux-64=13.4.0=hce61b40_21
            gcc_impl_linux-64=13.4.0=he2fa53e_18
          cache-environment: true
          cache-downloads: true

      - name: Bind exact uvspec and debugger tooling
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdb binutils curl file > "$EVIDENCE_DIR/apt-install.log" 2>&1
          test -n "${FC:-}"
          test "$(sha256sum "$(command -v uvspec)" | awk '{print $1}')" = "$UVSPEC_SHA256"
          sha256sum "$(command -v uvspec)" > "$EVIDENCE_DIR/uvspec-sha256.txt"

      - name: Recover literal HTTP governing source and unchanged R16 contract
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          mkdir -p "$ROOT/source"
          curl -fsS -L --max-redirs 10 --compressed -D "$EVIDENCE_DIR/http-source-headers.txt" -o "$ROOT/source-entity.bin" -w 'initial=%{url}\nfinal=%{url_effective}\nhttp_code=%{http_code}\nredirects=%{num_redirects}\nsize_download=%{size_download}\n' "$SOURCE_URL" > "$EVIDENCE_DIR/http-source-route.txt" 2> "$EVIDENCE_DIR/http-source-curl.stderr"
          test "$(sha256sum "$ROOT/source-entity.bin" | awk '{print $1}')" = "$SOURCE_ENTITY_SHA256"
          sha256sum "$ROOT/source-entity.bin" > "$EVIDENCE_DIR/http-source-entity-sha256.txt"
          tar -xf "$ROOT/source-entity.bin" -C "$ROOT/source"
          DPMISC="$(find "$ROOT/source" -type f -path '*/libsrc_f/dpmisc.f' -print -quit)"; test -n "$DPMISC"
          SRC_ROOT="$(dirname "$(dirname "$DPMISC")")"; test -f "$SRC_ROOT/libsrc_f/DISORT.MXD"; test -f "$SRC_ROOT/libsrc_f/dpsdisort.f"
          echo "SOURCE_ROOT=$SRC_ROOT" >> "$GITHUB_ENV"
          cat > "$ROOT/r16-frozen-contract.json" <<'EOF'
          {
            "state": "STATE-0003",
            "gate": "R16-FRESH-SOURCE-EQUIVALENCE-TRAINING-FREEZE",
            "scope": "WHOLLY_FRESH_NONPROTECTED",
            "production_floor_deg": 5.0,
            "production_below_floor": "FAIL_CLOSED_UNCHANGED",
            "development_rows": 8,
            "audit_rows": 2,
            "audit_open_rule": "DO_NOT_OPEN_UNTIL_ALL_8_DEVELOPMENT_ROWS_PASS_THE_FROZEN_CONTRACT",
            "reference": "exact pinned libRadtran governing direct-path implementation/source and final pre-dispatch handoff",
            "integer_structural_fields": "EXACT",
            "fac_fac2_chp2_ch_abs_or_rel_tolerance": 1e-10,
            "direct_float64_abs_or_rel_tolerance": 1e-12,
            "exact_zero_preserved": true,
            "nan_or_inf": "FAIL",
            "post_result_retuning": "FORBIDDEN",
            "protected_residual_selection": "FORBIDDEN",
            "Taylor_Jerusalem_selection_or_fit": "FORBIDDEN",
            "consumed_R12_0001_0002": "FORBIDDEN_TO_RERUN_OR_REUSE",
            "R12_audit_0007_0008": "SEALED",
            "solver_executed_by_this_freeze": false,
            "science_seed_or_ordinal_allocated": false
          }
          EOF
          test "$(sha256sum "$ROOT/r16-frozen-contract.json" | awk '{print $1}')" = "$R16_CONTRACT_SHA256"
          echo "R16_CONTRACT_PATH=$ROOT/r16-frozen-contract.json" >> "$GITHUB_ENV"

      - name: Fresh governance and lane fence immediately before audit exposure
        env:
          GH_TOKEN: ${{ github.token }}
          STARSVISIBILITY_READ_TOKEN: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${STARSVISIBILITY_READ_TOKEN:-}" || exit 78
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"; auth=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          curl -fsS "${auth[@]}" "$api/issues/60" > "$EVIDENCE_DIR/fresh-issue60.json"
          curl -fsS "${auth[@]}" "$api/branches/main" > "$EVIDENCE_DIR/fresh-twilight-main.json"
          curl -fsS "${auth[@]}" "$api/pulls/1026" > "$EVIDENCE_DIR/fresh-avps-pr1026.json"
          curl -fsS "${auth[@]}" "$api/actions/runs?status=in_progress&per_page=100" > "$EVIDENCE_DIR/fresh-actions-in-progress.json"
          curl -fsS "${auth[@]}" "$api/actions/runs?status=queued&per_page=100" > "$EVIDENCE_DIR/fresh-actions-queued.json"
          curl -fsS -H "Authorization: Bearer $STARSVISIBILITY_READ_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' https://api.github.com/repos/search-maker/starsvisibility/branches/main > "$EVIDENCE_DIR/fresh-stars-main.json"
          test "$(jq -r .commit.sha "$EVIDENCE_DIR/fresh-twilight-main.json")" = "$BASE_MAIN_SHA"
          test "$(jq -r .commit.sha "$EVIDENCE_DIR/fresh-stars-main.json")" = 1e74d0522f086dba634a587bb245c32bcd4fac60
          test "$(jq -r .state "$EVIDENCE_DIR/fresh-avps-pr1026.json")" = open
          test "$(jq -r .draft "$EVIDENCE_DIR/fresh-avps-pr1026.json")" = true
          test "$(jq -r .head.sha "$EVIDENCE_DIR/fresh-avps-pr1026.json")" = 5028cb7c7cd585d720749f0d572aa15e2f614bf9
          python - <<'PY'
          import json,os
          from pathlib import Path
          e=Path(os.environ['EVIDENCE_DIR']); q=json.loads((e/'fresh-actions-queued.json').read_text()); ip=json.loads((e/'fresh-actions-in-progress.json').read_text())
          self_id=int(os.environ['GITHUB_RUN_ID']); critical=('exec005','v5r6','total-sky','avps','arm','v1')
          queued=[r for r in q.get('workflow_runs',[]) if int(r['id'])!=self_id and any(k in ((r.get('name') or '')+' '+(r.get('display_title') or '')).lower() for k in critical)]
          if queued: raise SystemExit('V1_CRITICAL_QUEUE_CONTENTION:'+','.join(str(r['id']) for r in queued))
          out={'schemaVersion':1,'classification':'STATE_0003_R19E6_FRESH_PREAUDIT_FENCE','issue60Comments':json.loads((e/'fresh-issue60.json').read_text())['comments'],'twilightMain':json.loads((e/'fresh-twilight-main.json').read_text())['commit']['sha'],'starsMain':json.loads((e/'fresh-stars-main.json').read_text())['commit']['sha'],'avpsHead':json.loads((e/'fresh-avps-pr1026.json').read_text())['head']['sha'],'inProgressCount':ip.get('total_count'),'queuedCount':q.get('total_count'),'criticalQueuedNonself':[]}
          (e/'fresh-preaudit-fence-summary.json').write_text(json.dumps(out,sort_keys=True,separators=(',',':'))+'\n')
          PY

      - name: Execute immutable R19E audit through pre-frozen mechanical role adapter
        env:
          GH_TOKEN: ${{ github.token }}
          STARSVISIBILITY_READ_TOKEN: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          test -n "${STARSVISIBILITY_READ_TOKEN:-}" || exit 78
          python "$R19E6_WRAPPER"

      - name: Publish isolated R19E6 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lowalt-state0003-r19e6-nonprotected-audit-20260910
          path: ${{ runner.temp }}/lowalt-state0003-r19e6/evidence/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
