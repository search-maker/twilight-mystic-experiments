name: LOWALT STATE-0003 R17 runtime-internal exact-direct gate
run-name: LOWALT STATE-0003 R17 runtime-internal ${{ github.sha }}

on:
  push:
    branches:
      - execution/lowalt-state0003-r17-runtime-internal-capture-20260909

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: lowalt-state0003-r17-runtime-internal-capture-20260909
  cancel-in-progress: false

env:
  BASE_MAIN_SHA: 8cd85cf393e2d86a1b6d7325654747460a13e697
  EXPECTED_BRANCH: execution/lowalt-state0003-r17-runtime-internal-capture-20260909
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  runtime-internal-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout exact execution head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable execution boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git merge-base "$BASE_MAIN_SHA" HEAD)" = "$BASE_MAIN_SHA"
          EVIDENCE_DIR="$RUNNER_TEMP/lowalt_state0003_r17_runtime_internal_20260909"
          rm -rf "$EVIDENCE_DIR"
          mkdir -p "$EVIDENCE_DIR"
          echo "EVIDENCE_DIR=$EVIDENCE_DIR" >> "$GITHUB_ENV"
          cat > "$EVIDENCE_DIR/execution-boundary.json" <<EOF
          {
            "schemaVersion": 1,
            "executionIdentity": "lowalt-state0003-r17-runtime-internal-capture-20260909",
            "baseMainSha": "$BASE_MAIN_SHA",
            "workflowHeadSha": "$GITHUB_SHA",
            "r16MatrixSha256": "8cc873592650dadb2f3ed0f33fc41903c69e5788750a7cf29fd9921beb7edb9a",
            "r16ContractSha256": "d7ef6a8e68c436728f71eba6e616126deb9f2d485af4926da4b2a294384475ca",
            "protectedResultOpeningAuthorized": false,
            "TaylorOrJerusalemUsed": false,
            "productionMutationAuthorized": false,
            "fiveDegreeSeamMutationAuthorized": false
          }
          EOF

      - name: Set up exact inherited libRadtran runtime
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: lowalt-state0003-r17
          create-args: -c conda-forge python=3.12.4 rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Ensure debugger compiler and binary tools
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          missing=()
          command -v gdb >/dev/null 2>&1 || missing+=(gdb)
          command -v gfortran >/dev/null 2>&1 || missing+=(gfortran)
          command -v nm >/dev/null 2>&1 || missing+=(binutils)
          command -v ar >/dev/null 2>&1 || missing+=(binutils)
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq "${missing[@]}"
          fi
          gdb --version | head -n 1
          gfortran --version | head -n 1
          nm --version | head -n 1

      - name: Materialize frozen R17 driver
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '...TRUNCATED_FOR_SUMMARY...' | base64 -d > "$RUNNER_TEMP/r17.py"
          test "$(sha256sum "$RUNNER_TEMP/r17.py" | awk '{print $1}')" = "ef5aa98cec59276520cc1bac509d931c68c653820a8fa49fbc1484a69c88f1c6"
          python -m py_compile "$RUNNER_TEMP/r17.py"

      - name: Execute frozen fresh NONPROTECTED runtime-internal gate
        env:
          GH_TOKEN: ${{ github.token }}
          STARSVISIBILITY_READ_TOKEN: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          test -n "${STARSVISIBILITY_READ_TOKEN:-}" || exit 78
          python "$RUNNER_TEMP/r17.py"

      - name: Publish isolated R17 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lowalt-state0003-r17-runtime-internal-20260909
          path: ${{ runner.temp }}/lowalt_state0003_r17_runtime_internal_20260909/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
