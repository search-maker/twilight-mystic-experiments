name: LOWALT-STELLAR-STATE-0001 Phase-B pre-execution review

on:
  pull_request:
    paths:
      - 'review/low-altitude-stellar-transport-v1/LOWALT_STELLAR_STATE_0001_PHASE_B_PROTOCOL.md'
      - 'review/low-altitude-stellar-transport-v1/low_altitude_phase_b.py'
      - 'tests/test_low_altitude_stellar_phase_b_state_0001.py'
      - '.github/workflows/lowalt-stellar-state-0001-phase-b-preexecution-review.yml'

permissions:
  contents: read

jobs:
  solver-free-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen Phase-B contract tests
        run: python -m unittest -v tests/test_low_altitude_stellar_phase_b_state_0001.py tests/test_low_altitude_stellar_transport_preexecution_v1.py
      - name: Prove no solver/result-opening path
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n -E 'subprocess\.|Popen\(|os\.system|--execute|allow_execution' review/low-altitude-stellar-transport-v1/low_altitude_phase_b.py
          ! grep -R -n -E 'Taylor|Jerusalem|first-seeing|halachic' review/low-altitude-stellar-transport-v1/low_altitude_phase_b.py
      - name: Emit and verify deterministic ledger
        run: |
          python review/low-altitude-stellar-transport-v1/low_altitude_phase_b.py --emit-ledger > /tmp/lowalt-phase-b-ledger.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/lowalt-phase-b-ledger.json',encoding='utf-8'))
          assert d['stateId']=='LOWALT-STELLAR-STATE-0001'
          assert d['scientificExecutionAuthorized'] is False
          assert d['protectedResultsOpened'] is False
          assert d['counts']=={'freshTrainingSpectra':275,'inheritedSeamSpectra':25,'protectedSpectra':176,'protectedJohnsonVComparisons':528}
          assert d['representation']['altitudeInterpolation']=='linear'
          assert d['representation']['cscExtrapolationBelow5Deg'] is False
          assert d['authoritativeV32Seam']['runtimeSha256']=='0b96bd5868dc0c72d5cd77b504098d35086feaf573d92556c4f8311a163e3ce2'
          assert d['disjointness']['freshTrainingProtectedCollisionCount']==0
          assert d['disjointness']['historicalProtectedTupleCollisionCountByAltitudeProof']==0
          assert d['failureSemantics']['epsilonSubstitutionAllowed'] is False
          print('LOWALT_PHASE_B_PREEXECUTION_PASS',d['ledgerSha256'])
          PY
