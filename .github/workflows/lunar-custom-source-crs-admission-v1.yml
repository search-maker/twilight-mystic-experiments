name: Lunar custom-source CRS admission v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'review/lunar-scattered-light-source-contract-v1/**'
      - 'tests/test_lunar_libradtran_custom_source_crs_admission_gate_v1.py'
      - '.github/workflows/lunar-custom-source-crs-admission-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-runtime-source-binding:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_UVSPEC_SHA256: 2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3
      EXPECTED_DATA_SHA256: ad30b49177e9c84e46497d69faf0c75e466996b0d0003f1de210289ae9f847d7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Enforce fresh first-attempt capability review
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: lunar-custom-source-crs-v1
          create-args: -c conda-forge python=3.12.4 rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Bind exact libRadtran runtime without scientific solver execution
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          mkdir -p lunar-source-probe-audit
          python experiments/mystic-batch-v1/runtime_probe.py \
            --uvspec "$(command -v uvspec)" \
            --data-dir "$CONDA_PREFIX/share/libRadtran/data" \
            --atmosphere "$CONDA_PREFIX/share/libRadtran/data/atmmod/afglus.dat" \
            --runtime-lock experiments/mystic-batch-v1/runtime-lock.micromamba.json \
            --skip-help \
            --output lunar-source-probe-audit/runtime-report.json
          python - <<'PY'
          import json, os
          x=json.load(open('lunar-source-probe-audit/runtime-report.json'))
          assert x['scientificSolverExecuted'] is False
          assert x['syntaxCheckExecuted'] is False
          assert x['uvspecSha256'] == os.environ['EXPECTED_UVSPEC_SHA256']
          assert x['libRadtranDataTreeSha256'] == os.environ['EXPECTED_DATA_SHA256']
          PY

      - name: Verify frozen admission contract and probe implementation
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          python tests/test_lunar_libradtran_custom_source_crs_admission_gate_v1.py

      - name: Execute exact non-MYSTIC source-binding probe
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          python review/lunar-scattered-light-source-contract-v1/libradtran_custom_source_crs_probe.py \
            --uvspec "$(command -v uvspec)" \
            --data-dir "$CONDA_PREFIX/share/libRadtran/data" \
            --atmosphere "$CONDA_PREFIX/share/libRadtran/data/atmmod/afglus.dat" \
            --runtime-report lunar-source-probe-audit/runtime-report.json \
            --contract review/lunar-scattered-light-source-contract-v1/libradtran-custom-source-crs-admission-gate-v1.json \
            --output-dir lunar-source-probe-audit

      - name: Upload immutable capability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lunar-custom-source-crs-admission-v1
          path: lunar-source-probe-audit
          retention-days: 30

      - name: Claim boundary
        if: always()
        shell: bash
        run: |
          echo 'Exact-runtime source-binding capability probe only.'
          echo 'No MYSTIC, no real-sky validation, no Air-LUSI/X-Shooter residual opening, no Taylor/Jerusalem residual use, no production authorization.'
