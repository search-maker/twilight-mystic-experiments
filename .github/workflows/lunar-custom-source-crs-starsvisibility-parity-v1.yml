name: Lunar custom-source CRS starsvisibility parity v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'review/lunar-scattered-light-source-contract-v1/starsvisibility-crs-source-binding-parity-contract-v1.json'
      - 'review/lunar-scattered-light-source-contract-v1/starsvisibility_crs_source_binding_parity_probe.py'
      - '.github/workflows/lunar-custom-source-crs-starsvisibility-parity-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-private-gate-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_UVSPEC_SHA256: 2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3
      EXPECTED_DATA_SHA256: ad30b49177e9c84e46497d69faf0c75e466996b0d0003f1de210289ae9f847d7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Enforce fresh first-attempt parity review
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: lunar-custom-source-crs-starsvisibility-parity-v1
          create-args: -c conda-forge python=3.12.4 rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Bind exact libRadtran runtime without MYSTIC execution
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          mkdir -p starsvisibility-crs-parity-audit
          python experiments/mystic-batch-v1/runtime_probe.py \
            --uvspec "$(command -v uvspec)" \
            --data-dir "$CONDA_PREFIX/share/libRadtran/data" \
            --atmosphere "$CONDA_PREFIX/share/libRadtran/data/atmmod/afglus.dat" \
            --runtime-lock experiments/mystic-batch-v1/runtime-lock.micromamba.json \
            --skip-help \
            --output starsvisibility-crs-parity-audit/runtime-report.json
          python - <<'PY'
          import json, os
          x=json.load(open('starsvisibility-crs-parity-audit/runtime-report.json'))
          assert x['scientificSolverExecuted'] is False
          assert x['syntaxCheckExecuted'] is False
          assert x['uvspecSha256'] == os.environ['EXPECTED_UVSPEC_SHA256']
          assert x['libRadtranDataTreeSha256'] == os.environ['EXPECTED_DATA_SHA256']
          PY

      - name: Verify external preregistration parity contract remains frozen
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p='review/lunar-scattered-light-source-contract-v1/starsvisibility-crs-source-binding-parity-contract-v1.json'
          c=json.load(open(p))
          assert c['status'] == 'PREREGISTERED_BEFORE_PARITY_RESULT'
          e=c['externalPreregistration']
          assert e['repository'] == 'search-maker/starsvisibility'
          assert e['path'] == 'scientific-tools/visibility-v3/lunar-libradtran-custom-source-admission-gate-v1.json'
          assert e['blobSha'] == '5bbebec12efe8f72a835dc74332ce73564e4acc1'
          assert e['observedBeforeThisParityResult'] is True
          assert c['probe']['armAFlux'] == [1.0, 1.0, 1.0]
          assert c['probe']['armBFlux'] == [7.0, 7.0, 7.0]
          assert 'no_absorption' in c['probe']['commonInputRequirements']
          assert 'no_scattering' in c['probe']['commonInputRequirements']
          r=c['frozenDecisionRule']
          assert r['expectedArmBToArmARatio'] == 7.0
          assert r['relativeTolerancePerComparisonWavelength'] == 1e-8
          assert r['postResultDecisionRuleChangeForbidden'] is True
          assert r['silentFallbackForbidden'] is True
          b=c['boundaries']
          assert b['mysticExecuted'] is False
          assert b['realSkyDataOpened'] is False
          assert b['taylorOrJerusalemResidualUsed'] is False
          assert b['atmosphericScatteredMoonlightValidated'] is False
          assert b['productionAuthorized'] is False
          PY

      - name: Execute exact starsvisibility preregistered parity probe
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          python review/lunar-scattered-light-source-contract-v1/starsvisibility_crs_source_binding_parity_probe.py \
            --uvspec "$(command -v uvspec)" \
            --data-dir "$CONDA_PREFIX/share/libRadtran/data" \
            --atmosphere "$CONDA_PREFIX/share/libRadtran/data/atmmod/afglus.dat" \
            --runtime-report starsvisibility-crs-parity-audit/runtime-report.json \
            --contract review/lunar-scattered-light-source-contract-v1/starsvisibility-crs-source-binding-parity-contract-v1.json \
            --output-dir starsvisibility-crs-parity-audit

      - name: Upload immutable parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lunar-custom-source-crs-starsvisibility-parity-v1
          path: starsvisibility-crs-parity-audit
          retention-days: 30

      - name: Claim boundary
        if: always()
        shell: bash
        run: |
          echo 'Exact-runtime parity test of an externally preregistered source-binding criterion only.'
          echo 'No MYSTIC, no real-sky validation, no lunar residual opening, no Taylor/Jerusalem use, no production authorization.'
