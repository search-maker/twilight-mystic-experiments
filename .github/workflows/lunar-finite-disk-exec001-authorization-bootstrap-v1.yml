name: Lunar finite-disk exec001 authorization bootstrap v1

on:
  push:
    branches:
      - authorization/lunar-finite-disk-transfer-kernel-sensitivity-v1-exec001
    paths:
      - 'review/lunar-scattered-light-source-contract-v1/lunar-finite-disk-transfer-kernel-sensitivity-v1-exec001-authorization.json'
      - 'tests/test_lunar_finite_disk_exec001_authorization_v1.py'
      - '.github/workflows/lunar-finite-disk-exec001-authorization-review-v1.yml'
      - '.github/workflows/lunar-finite-disk-exec001-authorization-bootstrap-v1.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: lunar-finite-disk-exec001-authorization-bootstrap-v1-${{ github.sha }}
  cancel-in-progress: false

jobs:
  review-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact authorization head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce exact solver-free authorization boundary
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          EXPECTED_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$EXPECTED_BRANCH" = "authorization/lunar-finite-disk-transfer-kernel-sensitivity-v1-exec001"
          git merge-base --is-ancestor 885c978b4349a0967056856724f5f8ea87bf5141 HEAD
          test -z "$(command -v uvspec || true)"
          mkdir -p authorization-review-evidence prior-recheck-proof

      - name: Run frozen authorization and refusal tests
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_lunar_finite_disk_transfer_kernel_sensitivity_v1.py
          python tests/test_lunar_finite_disk_authorization_recheck_v1.py
          python tests/test_lunar_finite_disk_exec001_authorization_v1.py

      - name: Verify and download exact zero-runtime authorization-time recheck proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT_ID: '9729425504'
          EXPECTED_DIGEST: 'sha256:52691f5eaa6b7337d02a845f76cc5601a3ac8f0274ff02329391fd965141200a'
          EXPECTED_RUN_ID: '33301829750'
          EXPECTED_RUN_HEAD: '885c978b4349a0967056856724f5f8ea87bf5141'
          EXPECTED_NAME: 'lunar-finite-disk-authorization-recheck-v1-proof'
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$EXPECTED_ARTIFACT_ID" --jq .name)" = "$EXPECTED_NAME"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$EXPECTED_ARTIFACT_ID" --jq .digest)" = "$EXPECTED_DIGEST"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EXPECTED_RUN_ID" --jq .id)" = "$EXPECTED_RUN_ID"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EXPECTED_RUN_ID" --jq .head_sha)" = "$EXPECTED_RUN_HEAD"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EXPECTED_RUN_ID" --jq .conclusion)" = success
          gh run download "$EXPECTED_RUN_ID" -n "$EXPECTED_NAME" --dir prior-recheck-proof
          test -f prior-recheck-proof/authorization-recheck-proof.json
          python - <<'PY'
          import json
          p=json.load(open('prior-recheck-proof/authorization-recheck-proof.json'))
          assert p['status']=='PASS_AUTHORIZATION_TIME_REPOSITORY_GLOBAL_SEED_RECHECK_ZERO_RUNTIME'
          assert p['auditedHead']=='885c978b4349a0967056856724f5f8ea87bf5141'
          assert p['candidateSeedCount']==198
          assert p['candidateSeedCanonicalSha256']=='ccfb4a645fdb35f35e759338cde7e5d20992391b4d25b3d272d1b8e80c93ad7a'
          assert p['candidateRowsCanonicalSha256']=='b2c69985b098ca46c5447f025c4a774ab384135b2a641a2a439121cb45f90ce8'
          assert p['repositoryGlobalCollisionCount']==0
          assert p['repositoryGlobalDoubleEnumerationStableAllBatches'] is True
          assert p['candidateSeedsAppliedToCases'] is False
          assert p['scientificExecutionAuthorizationCreated'] is False
          assert p['solverExecuted'] is False
          assert p['resultOpened'] is False
          assert p['finiteDiskContractGitBlobSha1']=='e235dcac8f3c307764d207b9111e9ab2011acb82'
          PY

      - name: Build immutable solver-free authorization review receipt
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          auth_path=Path('review/lunar-scattered-light-source-contract-v1/lunar-finite-disk-transfer-kernel-sensitivity-v1-exec001-authorization.json')
          auth=json.loads(auth_path.read_text())
          receipt={
            'schemaVersion':1,
            'status':'PASS_LUNAR_FINITE_DISK_EXEC001_AUTHORIZATION_REVIEW_SOLVER_FREE_NOT_DISPATCHED',
            'reviewHead':os.environ['EXPECTED_HEAD'],
            'authorizationId':auth['authorizationId'],
            'executionId':auth['executionId'],
            'authorizationJsonSha256':hashlib.sha256(auth_path.read_bytes()).hexdigest(),
            'authorizationRecheckRunId':33301829750,
            'authorizationRecheckArtifactId':9729425504,
            'authorizationRecheckArtifactDigest':'sha256:52691f5eaa6b7337d02a845f76cc5601a3ac8f0274ff02329391fd965141200a',
            'finiteDiskContractGitBlobSha1':'e235dcac8f3c307764d207b9111e9ab2011acb82',
            'candidateSeedCount':198,
            'candidateSeedCanonicalSha256':'ccfb4a645fdb35f35e759338cde7e5d20992391b4d25b3d272d1b8e80c93ad7a',
            'candidateRowsCanonicalSha256':'b2c69985b098ca46c5447f025c4a774ab384135b2a641a2a439121cb45f90ce8',
            'seedLiteralsLogged':False,
            'solverRuntimeInstalled':False,
            'solverExecuted':False,
            'dispatchCreated':False,
            'resultOpened':False,
            'finiteDiskAdequacyClaimed':False,
            'empiricalAtmosphericMoonlightValidated':False,
            'totalSkyValidated':False,
            'productionAuthorized':False,
            'nextAction':'Create a separate execution branch from this exact reviewed authorization head; perform a fresh Issue #60 fence check immediately before dispatch mutation, and execute attempt 1 only with the frozen evaluator.'
          }
          Path('authorization-review-evidence/authorization-review-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print('status='+receipt['status'])
          print('candidate_seed_count=198')
          print('seed_literals_logged=false')
          PY

      - name: Upload solver-free authorization review receipt
        uses: actions/upload-artifact@v4
        with:
          name: lunar-finite-disk-exec001-authorization-review-v1
          path: authorization-review-evidence/authorization-review-receipt.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Claim boundary
        if: always()
        shell: bash
        run: |
          echo 'Solver-free authorization review only; no dispatch or solver execution occurs in this workflow.'
          echo 'The 198 replacement seeds are bound by canonical hashes and are not printed as literals.'
          echo 'No finite-disk adequacy, Air-LUSI/X-Shooter/Taylor/Jerusalem, total-sky, or production claim is made.'
