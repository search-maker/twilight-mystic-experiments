name: Review lunar finite-disk exec001 pagination recovery v1

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [authorization/lunar-finite-disk-transfer-kernel-sensitivity-v1-exec001]
    paths:
      - '.github/workflows/lunar-finite-disk-exec001-pagination-recovery-review-v1.yml'
      - 'review/lunar-scattered-light-source-contract-v1/LUNAR_FINITE_DISK_EXEC001_PAGINATION_RECOVERY_V1.md'

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: lunar-finite-disk-exec001-pagination-recovery-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  solver-free-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_BASE: 72916c8c98cba2454c73e09b30915be3af609a07
      EXPECTED_BRANCH: review/lunar-finite-disk-exec001-pagination-recovery-v1
      CONSUMED_RUN: '33303099872'
      CONSUMED_HEAD: b73d5cf4a58aee3b3e8794b396b79bbd3463f680
      FINAL_PREFLIGHT_JOB: '99234734783'
      BARRIER_JOB: '99236492237'
      FINAL_PREFLIGHT_ARTIFACT: '9729769639'
      FINAL_PREFLIGHT_DIGEST: sha256:50b9acdf55ebe3188a3f7762c79e0365a9b5c58d5bf2c1b877244b340c9773b8
      FENCE_BEGIN_COMMENT: '5467776090'
      MACHINE_END_COMMENT: '5467875147'
      PROTOCOL: review/lunar-scattered-light-source-contract-v1/LUNAR_FINITE_DISK_EXEC001_PAGINATION_RECOVERY_V1.md
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact additive solver-free recovery surface
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$EVENT_BASE" = "$EXPECTED_BASE"
          test "$EVENT_BRANCH" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          git diff --name-only "$EXPECTED_BASE"...HEAD | sort > changed-paths.txt
          cat > expected-paths.txt <<'EOF'
          .github/workflows/lunar-finite-disk-exec001-pagination-recovery-review-v1.yml
          review/lunar-scattered-light-source-contract-v1/LUNAR_FINITE_DISK_EXEC001_PAGINATION_RECOVERY_V1.md
          EOF
          sort -o expected-paths.txt expected-paths.txt
          diff -u expected-paths.txt changed-paths.txt
          ! grep -E '^(experiments/|scientific-tools/|src/|data/)' changed-paths.txt

      - name: Re-verify immutable consumed exec001 pre-solver state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CONSUMED_RUN" > consumed-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CONSUMED_RUN/jobs?per_page=100" > consumed-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CONSUMED_RUN/artifacts?per_page=100" > consumed-artifacts.json
          gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/contents/.github/workflows/lunar-finite-disk-exec001-v1.yml?ref=$CONSUMED_HEAD" > consumed-workflow.yml
          python - <<'PY'
          import json, os
          run=json.load(open('consumed-run.json'))
          assert run['id']==int(os.environ['CONSUMED_RUN']) and run['run_attempt']==1
          assert run['head_sha']==os.environ['CONSUMED_HEAD'] and run['event']=='push'
          assert run['status'] in ('in_progress','completed')
          jobs=json.load(open('consumed-jobs.json'))['jobs']; by={int(j['id']):j for j in jobs}
          assert by[int(os.environ['FINAL_PREFLIGHT_JOB'])]['conclusion']=='success'
          barrier=by[int(os.environ['BARRIER_JOB'])]
          assert barrier['name']=='require matching WRITE_QUIET_END before solver' and barrier.get('conclusion')!='success'
          solver=[j for j in jobs if str(j.get('name','')).startswith('execute shard ')]
          assert all(j.get('conclusion')=='skipped' for j in solver), solver
          arts=json.load(open('consumed-artifacts.json'))['artifacts']
          hit=[a for a in arts if int(a['id'])==int(os.environ['FINAL_PREFLIGHT_ARTIFACT'])]
          assert len(hit)==1 and hit[0]['digest']==os.environ['FINAL_PREFLIGHT_DIGEST']
          wf=open('consumed-workflow.yml').read(); fence=wf.split('  snapshot-fence-release:',1)[1].split('  execute-shards:',1)[0]
          assert 'issues/60/comments?per_page=100' in fence and '--paginate' not in fence and 'for _ in range(90)' in fence
          PY

      - name: Prove page-one blindness and paginated recovery visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > issue60-first-page.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > issue60-pages.json
          python - <<'PY'
          import json, os
          first=json.load(open('issue60-first-page.json')); pages=json.load(open('issue60-pages.json'))
          allc=[r for p in pages for r in p]; target=int(os.environ['MACHINE_END_COMMENT'])
          assert len(first)==100 and all(int(r['id'])!=target for r in first) and len(allc)>100
          hit=[r for r in allc if int(r['id'])==target]; assert len(hit)==1
          body=str(hit[0].get('body') or '')
          required=(
            'WRITE_QUIET_END | LUNAR_FINITE_DISK_EXEC001_FINAL_PREFLIGHT_GLOBAL_SCAN_V1',
            f"begin={os.environ['FENCE_BEGIN_COMMENT']}", f"head={os.environ['CONSUMED_HEAD']}", f"run={os.environ['CONSUMED_RUN']}"
          )
          assert all(t in body for t in required)
          print(f'first_page_count={len(first)} all_paginated_count={len(allc)} machine_end_page_gt_1=PASS')
          PY

      - name: Verify protocol and zero-runtime boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          p=Path(os.environ['PROTOCOL']).read_text()
          required=(
            'EXEC001_CONSUMED_PRE_SOLVER_SNAPSHOT_BARRIER_PAGINATION_FAILURE',
            'Run `33303099872` is consumed.',
            'MUST NOT be GitHub Re-run, retried, resumed, or otherwise reused',
            'fresh candidate-seed universe', 'gh api --paginate --slurp',
            'absent from the first-page-only result and present in the fully paginated result',
            'every solver-bearing job depends on the release barrier', '550 nm',
            '198 directional cases total', '5,000,000 photon histories per directional case',
            '450/650/750 nm follow-on remains mandatory',
            'No Taylor or Jerusalem residual may be used',
            '`finiteDiskAdequacyValidated=false`', '`productionAuthorized=false`'
          )
          for t in required:
              if t not in p: raise SystemExit(f'protocol missing invariant: {t}')
          for t in ('reuse run `33303099872`','productionAuthorized=true'):
              if t in p: raise SystemExit(f'forbidden recovery claim: {t}')
          wf=Path('.github/workflows/lunar-finite-disk-exec001-pagination-recovery-review-v1.yml').read_text().lower()
          for t in ('uvspec <','mc_photons 5000000','micromamba install','conda install ','apt-get install libradtran'):
              if t in wf: raise SystemExit(f'unexpected scientific runtime command token: {t}')
          PY

      - name: Emit solver-free recovery review receipt
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p review-evidence
          cp changed-paths.txt consumed-run.json consumed-jobs.json consumed-artifacts.json issue60-first-page.json issue60-pages.json review-evidence/
          python - <<'PY'
          import json, os
          from pathlib import Path
          out={
            'schemaVersion':1,'status':'PASS_LUNAR_FINITE_DISK_EXEC001_PAGINATION_RECOVERY_PROTOCOL_SOLVER_FREE',
            'headSha':os.environ['EVENT_HEAD'],'baseSha':os.environ['EXPECTED_BASE'],
            'consumedRun':int(os.environ['CONSUMED_RUN']),'consumedHead':os.environ['CONSUMED_HEAD'],
            'finalPreflightJob':int(os.environ['FINAL_PREFLIGHT_JOB']),'finalPreflightArtifact':int(os.environ['FINAL_PREFLIGHT_ARTIFACT']),
            'barrierJob':int(os.environ['BARRIER_JOB']),'paginationDefectReproduced':True,'machineEndVisibleOnlyWithPagination':True,
            'oldExecutionIdentityReusable':False,'freshExecutionIdentityRequired':True,'freshCandidateSeedsRequired':True,
            'scientificRuntimePerformed':False,'finiteDiskResultOpened':False,'finiteDiskAdequacyValidated':False,
            'productionAuthorized':False,'taylorOrJerusalemUsed':False
          }
          Path('review-evidence/recovery-review-receipt.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: lunar-finite-disk-exec001-pagination-recovery-review-v1
          path: review-evidence/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Claim boundary
        if: always()
        run: |
          echo 'Solver-free recovery review only.'
          echo 'No seed generation/application, no uvspec/libRadtran/MYSTIC run, no lunar result opening, no finite-disk validation, no Taylor/Jerusalem use, no production authorization.'
