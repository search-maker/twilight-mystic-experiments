name: Lunar finite-disk exec001 solver-free preflight v1

on:
  push:
    branches:
      - execution/lunar-finite-disk-transfer-kernel-sensitivity-v1-exec001
    paths:
      - 'review/lunar-scattered-light-source-contract-v1/lunar_finite_disk_exec001.py'
      - 'tests/test_lunar_finite_disk_exec001_runtime_v1.py'
      - '.github/workflows/lunar-finite-disk-exec001-preflight-v1.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: lunar-finite-disk-exec001-preflight-v1-${{ github.sha }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce solver-free exact execution-child boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = 'execution/lunar-finite-disk-transfer-kernel-sensitivity-v1-exec001'
          git merge-base --is-ancestor 72916c8c98cba2454c73e09b30915be3af609a07 HEAD
          test -z "$(command -v uvspec || true)"

      - name: Run exact authorization and runtime/refusal tests
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_lunar_finite_disk_exec001_authorization_v1.py
          python tests/test_lunar_finite_disk_exec001_runtime_v1.py
          python review/lunar-scattered-light-source-contract-v1/lunar_finite_disk_exec001.py validate --json

      - name: Verify reviewed authorization receipt identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/artifacts/9729497306 --jq .name)" = 'lunar-finite-disk-exec001-authorization-review-v1'
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/artifacts/9729497306 --jq .digest)" = 'sha256:cf34132a74873e56bef0f66e47a6d6d662e7579d47a11e12ffdc81545d75f3ee'
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/33302850769 --jq .head_sha)" = '72916c8c98cba2454c73e09b30915be3af609a07'
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/33302850769 --jq .run_attempt)" = '1'
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/33302850769 --jq .conclusion)" = 'success'

      - name: Write solver-free preflight receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preflight-evidence
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipt={
            'schemaVersion':1,
            'status':'PASS_LUNAR_FINITE_DISK_EXEC001_RUNTIME_PREFLIGHT_SOLVER_FREE',
            'head':os.environ['GITHUB_SHA'],
            'authorizationHead':'72916c8c98cba2454c73e09b30915be3af609a07',
            'authorizationReviewRunId':33302850769,
            'authorizationReviewArtifactId':9729497306,
            'authorizationReviewArtifactDigest':'sha256:cf34132a74873e56bef0f66e47a6d6d662e7579d47a11e12ffdc81545d75f3ee',
            'caseCount':198,
            'shardCountPlanned':18,
            'casesPerShardPlanned':11,
            'photonHistoriesPerCase':5000000,
            'totalPhotonHistories':990000000,
            'seedLiteralsLogged':False,
            'solverRuntimeInstalled':False,
            'solverExecuted':False,
            'resultOpened':False,
            'finiteDiskAdequacyClaimed':False,
            'productionAuthorized':False
          }
          Path('preflight-evidence/preflight-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: lunar-finite-disk-exec001-solver-free-preflight-v1
          path: preflight-evidence/preflight-receipt.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Claim boundary
        if: always()
        run: |
          echo 'Solver-free runtime/preparation/evaluator contract preflight only.'
          echo 'No uvspec/MYSTIC, no seed consumption, no result opening, no finite-disk adequacy or production claim.'
