name: Lunar finite-disk exec002 authorization review v1

on:
  push:
    branches:
      - authorization/lunar-finite-disk-transfer-kernel-sensitivity-v1-exec002
    paths:
      - 'review/lunar-scattered-light-source-contract-v1/lunar-finite-disk-transfer-kernel-sensitivity-v1-exec002-authorization.json'
      - 'tests/test_lunar_finite_disk_exec002_authorization_v1.py'
      - '.github/workflows/lunar-finite-disk-exec002-authorization-review-v1.yml'

permissions:
  contents: read
  actions: read
  issues: read

concurrency:
  group: lunar-finite-disk-exec002-authorization-review-v1-${{ github.sha }}
  cancel-in-progress: false

jobs:
  review-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BASE_HEAD: 7698d3f58756650be5ffcfd41d277dadbbba1874
      EXPECTED_BRANCH: authorization/lunar-finite-disk-transfer-kernel-sensitivity-v1-exec002
      RECHECK_RUN: '33340294645'
      RECHECK_HEAD: 7698d3f58756650be5ffcfd41d277dadbbba1874
      RECHECK_ARTIFACT: '9740536985'
      RECHECK_NAME: lunar-finite-disk-exec002-authorization-recheck-v1-proof
      RECHECK_DIGEST: sha256:3949d8b0b9d7ef7b9a689613b4088a96a82a79c2a04f284ec44eeb64df1bc713
      RECHECK_PAYLOAD_SHA256: a926a708780141e737bf628701e755fa65483f9f4a790a203e4dfc818365d8c9
      CONTROL_RUN: '33337886233'
      CONTROL_HEAD: f675749e838c55385f907dd8f85000c2a607951e
      CONTROL_ARTIFACT: '9739969664'
      CONTROL_NAME: lunar-finite-disk-exec002-fresh-seed-control-v1-proof
      CONTROL_DIGEST: sha256:fa1ed884e21b59dee7a3013cfb2fd84ab3c3cd8f2befaca1f1ed26fb5b44e858
      CANDIDATE_SEED_CANONICAL: 30350e6986b554d09bcd77e9095cb871dd634a80a4f219cca29d0fc0b8249e84
      CANDIDATE_ROWS_CANONICAL: 7dbb4cbe6c34ffad668eb63ad051bd7319d68e56ea1b3c4e540d70eda23b1c95
      FINITE_DISK_CONTRACT_BLOB: e235dcac8f3c307764d207b9111e9ab2011acb82

    steps:
      - name: Checkout exact authorization head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce exact solver-free authorization surface
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$BASE_HEAD" HEAD
          git diff --name-only "$BASE_HEAD"...HEAD | sort > changed-paths.txt
          cat > expected-paths.txt <<'EOF'
          .github/workflows/lunar-finite-disk-exec002-authorization-review-v1.yml
          review/lunar-scattered-light-source-contract-v1/lunar-finite-disk-transfer-kernel-sensitivity-v1-exec002-authorization.json
          tests/test_lunar_finite_disk_exec002_authorization_v1.py
          EOF
          sort -o expected-paths.txt expected-paths.txt
          diff -u expected-paths.txt changed-paths.txt
          test -z "$(command -v uvspec || true)"
          mkdir -p authorization-review-evidence recheck-proof control-proof

      - name: Run frozen authorization and science-boundary tests
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_lunar_finite_disk_transfer_kernel_sensitivity_v1.py
          python tests/test_lunar_finite_disk_exec002_authorization_v1.py

      - name: Bind exact authorization-time recheck proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECHECK_RUN" > authorization-review-evidence/recheck-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$RECHECK_ARTIFACT" > authorization-review-evidence/recheck-artifact.json
          python - <<'PY'
          import json, os
          run=json.load(open('authorization-review-evidence/recheck-run.json'))
          assert run['id']==int(os.environ['RECHECK_RUN'])
          assert run['run_attempt']==1 and run['conclusion']=='success'
          assert run['head_sha']==os.environ['RECHECK_HEAD']
          art=json.load(open('authorization-review-evidence/recheck-artifact.json'))
          assert art['id']==int(os.environ['RECHECK_ARTIFACT'])
          assert art['name']==os.environ['RECHECK_NAME']
          assert art['digest']==os.environ['RECHECK_DIGEST']
          assert art['workflow_run']['id']==int(os.environ['RECHECK_RUN'])
          PY
          gh run download "$RECHECK_RUN" -n "$RECHECK_NAME" --dir recheck-proof
          test -f recheck-proof/authorization-recheck-proof.json
          python - <<'PY'
          import json, os
          p=json.load(open('recheck-proof/authorization-recheck-proof.json'))
          assert p['status']=='PASS_LUNAR_FINITE_DISK_EXEC002_AUTHORIZATION_TIME_RECHECK_ZERO_RUNTIME'
          assert p['reviewHead']==os.environ['RECHECK_HEAD']
          assert p['candidateSeedCount']==198
          assert p['candidateSeedCanonicalSha256']==os.environ['CANDIDATE_SEED_CANONICAL']
          assert p['candidateRowsCanonicalSha256']==os.environ['CANDIDATE_ROWS_CANONICAL']
          assert p['trackedTreeExternalCollisionCount']==0
          assert p['repositoryGlobalCollisionCount']==0
          assert p['repositoryGlobalDoubleEnumerationStableAllBatches'] is True
          assert p['freshExecutionIdentity']=='lunar-finite-disk-transfer-kernel-sensitivity-v1-exec002'
          assert p['candidateSeedsAppliedToCases'] is False
          assert p['freshExecutionIdentityAuthorized'] is False
          assert p['scientificExecutionAuthorized'] is False
          assert p['solverExecutionAuthorized'] is False
          assert p['solverExecuted'] is False
          assert p['resultOpeningAuthorized'] is False
          assert p['finiteDiskResultOpened'] is False
          assert p['finiteDiskAdequacyValidated'] is False
          assert p['mandatorySpectralFollowOnStillRequired'] is True
          assert p['mandatorySpectralFollowOnNm']==[450,650,750]
          assert p['proofPayloadSha256']==os.environ['RECHECK_PAYLOAD_SHA256']
          PY

      - name: Bind exact prior fresh candidate ledger without printing seeds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CONTROL_RUN" > authorization-review-evidence/control-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CONTROL_ARTIFACT" > authorization-review-evidence/control-artifact.json
          python - <<'PY'
          import json, os
          run=json.load(open('authorization-review-evidence/control-run.json'))
          assert run['id']==int(os.environ['CONTROL_RUN'])
          assert run['run_attempt']==1 and run['conclusion']=='success'
          assert run['head_sha']==os.environ['CONTROL_HEAD']
          art=json.load(open('authorization-review-evidence/control-artifact.json'))
          assert art['id']==int(os.environ['CONTROL_ARTIFACT'])
          assert art['name']==os.environ['CONTROL_NAME']
          assert art['digest']==os.environ['CONTROL_DIGEST']
          PY
          gh run download "$CONTROL_RUN" -n "$CONTROL_NAME" --dir control-proof
          test -f control-proof/exec002-control-proof.json
          test -f control-proof/exec002-candidate-seed-ledger.json
          python - <<'PY'
          import json, os
          proof=json.load(open('control-proof/exec002-control-proof.json'))
          ledger=json.load(open('control-proof/exec002-candidate-seed-ledger.json'))
          assert proof['status']=='PASS_LUNAR_FINITE_DISK_EXEC002_FRESH_SEED_AND_PAGINATED_RELEASE_CONTROL'
          assert proof['candidateSeedCount']==198
          assert proof['candidateSeedCanonicalSha256']==os.environ['CANDIDATE_SEED_CANONICAL']
          assert proof['candidateRowsCanonicalSha256']==os.environ['CANDIDATE_ROWS_CANONICAL']
          assert proof['repositoryGlobalCollisionCount']==0
          assert proof['repositoryGlobalDoubleEnumerationStableAllBatches'] is True
          assert ledger['candidateSeedCount']==198
          assert len(ledger['candidateSeeds'])==198
          assert len(set(ledger['candidateSeeds']))==198
          assert ledger['candidateSeedCanonicalSha256']==os.environ['CANDIDATE_SEED_CANONICAL']
          assert ledger['candidateRowsCanonicalSha256']==os.environ['CANDIDATE_ROWS_CANONICAL']
          assert ledger['freshExecutionIdentity']=='lunar-finite-disk-transfer-kernel-sensitivity-v1-exec002'
          assert ledger['candidateSeedsAppliedToCases'] is False
          print('candidate_ledger_binding=PASS count=198 literals_not_printed=true')
          PY

      - name: Verify immutable finite-disk contract blob identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object review/lunar-scattered-light-source-contract-v1/lunar-finite-disk-transfer-kernel-sensitivity-v1.json)" = "$FINITE_DISK_CONTRACT_BLOB"

      - name: Build solver-free authorization review receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          auth_path=Path('review/lunar-scattered-light-source-contract-v1/lunar-finite-disk-transfer-kernel-sensitivity-v1-exec002-authorization.json')
          auth=json.loads(auth_path.read_text())
          receipt={
            'schemaVersion':1,
            'status':'PASS_LUNAR_FINITE_DISK_EXEC002_AUTHORIZATION_REVIEW_SOLVER_FREE_NOT_DISPATCHED',
            'reviewHead':os.environ['GITHUB_SHA'],
            'reviewBase':os.environ['BASE_HEAD'],
            'authorizationId':auth['authorizationId'],
            'executionId':auth['executionId'],
            'authorizationJsonSha256':hashlib.sha256(auth_path.read_bytes()).hexdigest(),
            'authorizationRecheckRunId':int(os.environ['RECHECK_RUN']),
            'authorizationRecheckArtifactId':int(os.environ['RECHECK_ARTIFACT']),
            'authorizationRecheckArtifactDigest':os.environ['RECHECK_DIGEST'],
            'authorizationRecheckProofPayloadSha256':os.environ['RECHECK_PAYLOAD_SHA256'],
            'priorControlRunId':int(os.environ['CONTROL_RUN']),
            'priorControlArtifactId':int(os.environ['CONTROL_ARTIFACT']),
            'priorControlArtifactDigest':os.environ['CONTROL_DIGEST'],
            'finiteDiskContractGitBlobSha1':os.environ['FINITE_DISK_CONTRACT_BLOB'],
            'candidateSeedCount':198,
            'candidateSeedCanonicalSha256':os.environ['CANDIDATE_SEED_CANONICAL'],
            'candidateRowsCanonicalSha256':os.environ['CANDIDATE_ROWS_CANONICAL'],
            'candidateSeedLiteralsLogged':False,
            'candidateUniverseAllocatedToExec002AfterThisPass':True,
            'oneShotAttempt1Only':True,
            'githubRerunRetryResumeForbidden':True,
            'solverRuntimeInstalled':False,
            'solverExecuted':False,
            'dispatchCreated':False,
            'resultOpened':False,
            'finiteDiskAdequacyClaimed':False,
            'mandatorySpectralFollowOnStillRequired':True,
            'empiricalAtmosphericMoonlightValidated':False,
            'totalSkyValidated':False,
            'productionAuthorized':False,
            'nextAction':'Before any execution-branch mutation, re-read Issue #60. Then create exactly one fresh exec002 attempt-1 workflow bound to this receipt, the immutable recheck/control artifacts, and the frozen 550-nm 198-case science; use complete paginated Issue #60 release semantics and never rerun/retry/resume.'
          }
          Path('authorization-review-evidence/authorization-review-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print('status='+receipt['status'])
          print('candidate_seed_count=198')
          print('solver_executed=false dispatch_created=false')
          PY

      - name: Upload solver-free authorization review receipt
        uses: actions/upload-artifact@v4
        with:
          name: lunar-finite-disk-exec002-authorization-review-v1
          path: authorization-review-evidence/authorization-review-receipt.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Claim boundary
        if: always()
        shell: bash
        run: |
          echo 'Solver-free exec002 authorization review only; no dispatch or solver execution occurs here.'
          echo 'The 198 fresh candidate seeds are bound by canonical hashes and are never printed.'
          echo 'Exec001 remains consumed/non-rerunnable. The frozen 550-nm science is unchanged and 450/650/750-nm follow-on remains mandatory.'
          echo 'No Air-LUSI/X-Shooter/Taylor/Jerusalem result, finite-disk adequacy, total-sky validation, or production claim is made.'
