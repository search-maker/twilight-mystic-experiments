name: Lunar finite-disk exec003 authorization-time recheck v1

on:
  pull_request:
    types: [opened]
    branches:
      - review/lunar-finite-disk-exec003-fresh-seed-control-v1
    paths:
      - '.github/workflows/lunar-finite-disk-exec003-authorization-recheck-v1.yml'

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: lunar-finite-disk-exec003-authorization-recheck-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  zero-runtime-authorization-recheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      EXPECTED_BASE: 1e4fdba6755d28d998197444dcf994ef39d28d69
      EXPECTED_BRANCH: review/lunar-finite-disk-exec003-authorization-recheck-v3
      PRIOR_CONTROL_RUN: '33362571300'
      PRIOR_CONTROL_JOB: '99396670270'
      PRIOR_CONTROL_ARTIFACT: '9747665530'
      PRIOR_CONTROL_DIGEST: sha256:6dc617806f3b76fb675c19b295a9f9e1b6f85a5657d83d6811b69771c3d7683b
      PRIOR_CONTROL_NAME: lunar-finite-disk-exec003-fresh-seed-control-v1-proof
      PRIOR_CONTROL_PROOF_SHA: '684f4c343dee44e1ab65b8f50581482d1922d17175fb5ff7f9295e8db1f80acc'
      CANDIDATE_SEED_CANONICAL: 'e27ba17758a6111da3b791535fff2a46d4e06a04fb163b546c871d455370ab44'
      CANDIDATE_ROWS_CANONICAL: 'ad13f6645d6db0621af78c2434c3a0c9f82b09850def79d051175d4a6cb814d5'
      FRESH_EXECUTION_IDENTITY: lunar-finite-disk-transfer-kernel-sensitivity-v1-exec003
      FENCE_STAGE: LUNAR_FINITE_DISK_EXEC003_AUTHORIZATION_RECHECK_GLOBAL_SCAN_V3
      BOUND_SCANNER_BLOB: 4c6d704fa24228284780bcb1dd7c52537b4c5b0d

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Bind exact one-file zero-runtime authorization-recheck surface
        shell: bash
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$EVENT_BASE" = "$EXPECTED_BASE"
          test "$EVENT_BRANCH" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          git diff --name-only "$EXPECTED_BASE"...HEAD | sort > changed-paths.txt
          printf '%s\n' '.github/workflows/lunar-finite-disk-exec003-authorization-recheck-v1.yml' > expected-paths.txt
          diff -u expected-paths.txt changed-paths.txt
          test -z "$(command -v uvspec || true)"
          mkdir -p auth-evidence prior-control
          git ls-files -z > auth-evidence/tracked-files.nul

      - name: Bind exact prior exec003 freshness control artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR_CONTROL_RUN" > auth-evidence/prior-control-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR_CONTROL_RUN/jobs?per_page=100" > auth-evidence/prior-control-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PRIOR_CONTROL_ARTIFACT" > auth-evidence/prior-control-artifact.json
          python - <<'PY'
          import json, os, re
          run=json.load(open('auth-evidence/prior-control-run.json'))
          assert run['id']==int(os.environ['PRIOR_CONTROL_RUN'])
          assert run['run_attempt']==1 and run['conclusion']=='success'
          assert run['head_sha']==os.environ['EXPECTED_BASE']
          jobs=json.load(open('auth-evidence/prior-control-jobs.json'))['jobs']
          assert any(int(j['id'])==int(os.environ['PRIOR_CONTROL_JOB']) and j['conclusion']=='success' for j in jobs)
          art=json.load(open('auth-evidence/prior-control-artifact.json'))
          assert art['id']==int(os.environ['PRIOR_CONTROL_ARTIFACT'])
          assert art['name']==os.environ['PRIOR_CONTROL_NAME']
          expected_digest=os.environ['PRIOR_CONTROL_DIGEST']
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', expected_digest), expected_digest
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', art['digest']), art['digest']
          assert art['digest']==expected_digest
          PY
          gh run download "$PRIOR_CONTROL_RUN" -n "$PRIOR_CONTROL_NAME" --dir prior-control
          test -f prior-control/exec003-fresh-seed-control-proof.json
          test -f prior-control/exec003-candidate-seed-ledger.json
          python - <<'PY'
          import hashlib, json, os
          p=json.load(open('prior-control/exec003-fresh-seed-control-proof.json'))
          raw=dict(p); claimed=raw.pop('proofPayloadSha256')
          calc=hashlib.sha256(json.dumps(raw,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
          assert claimed==calc==os.environ['PRIOR_CONTROL_PROOF_SHA']
          assert p['status']=='PASS_LUNAR_FINITE_DISK_EXEC003_FRESH_SEED_GLOBAL_CONTROL_NOT_AUTHORIZED'
          assert p['reviewHead']==os.environ['EXPECTED_BASE']
          assert p['candidateSeedCount']==198
          assert p['candidateSeedCanonicalSha256']==os.environ['CANDIDATE_SEED_CANONICAL']
          assert p['candidateRowsCanonicalSha256']==os.environ['CANDIDATE_ROWS_CANONICAL']
          assert p['repositoryGlobalCollisionCount']==0
          assert p['repositoryGlobalDoubleEnumerationStableAllBatches'] is True
          assert p['retryPolicyBoundToReviewedExec003Recovery'] is True
          assert p['candidateSeedsAppliedToCases'] is False
          assert p['freshExecutionIdentityAuthorized'] is False
          assert p['scientificExecutionAuthorized'] is False
          assert p['solverExecutionAuthorized'] is False
          assert p['solverExecuted'] is False
          assert p['resultOpeningAuthorized'] is False
          assert p['finiteDiskResultOpened'] is False
          assert p['finiteDiskAdequacyValidated'] is False
          assert p['productionAuthorized'] is False
          ledger=json.load(open('prior-control/exec003-candidate-seed-ledger.json'))
          assert ledger['candidateSeedCount']==198 and len(ledger['candidateSeeds'])==198
          assert len(set(map(int,ledger['candidateSeeds'])))==198
          assert ledger['candidateSeedCanonicalSha256']==os.environ['CANDIDATE_SEED_CANONICAL']
          assert ledger['candidateRowsCanonicalSha256']==os.environ['CANDIDATE_ROWS_CANONICAL']
          assert ledger['freshExecutionIdentity']==os.environ['FRESH_EXECUTION_IDENTITY']
          assert ledger['candidateSeedsAppliedToCases'] is False
          seeds=list(map(int,ledger['candidateSeeds']))
          batches=[seeds[:72],seeds[72:144],seeds[144:]+seeds[:18]]
          assert all(len(b)==72 and len(set(b))==72 for b in batches)
          assert set().union(*(set(b) for b in batches))==set(seeds)
          for i,b in enumerate(batches,1):
              open(f'prior-control/exec003-candidate-seed-batch-{i}.json','w').write(json.dumps({'candidateSeeds':b},indent=2,sort_keys=True)+'\n')
          open('prior-control/empty-self-ledger-policy.json','w').write(json.dumps({'schemaVersion':2,'requiredTrackedSelfLedgerPaths':[],'futureEvidenceSelfLedgerPaths':[]},indent=2,sort_keys=True)+'\n')
          PY

      - name: Require matching live WRITE_QUIET fence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > auth-evidence/issue60-pages.json
          python - <<'PY'
          import json, os, re
          pages=json.load(open('auth-evidence/issue60-pages.json'))
          comments=[r for page in pages for r in page]
          stage=os.environ['FENCE_STAGE']; head=os.environ['EVENT_HEAD']; branch=os.environ['EXPECTED_BRANCH']
          begins=[]
          closed=set()
          for r in comments:
              body=str(r.get('body') or '')
              first=body.splitlines()[0] if body else ''
              if f'WRITE_QUIET_BEGIN | {stage}' in first and f'branch={branch}' in body and f'head={head}' in body:
                  begins.append(r)
              if first.startswith('WRITE_QUIET_END'):
                  ids=set()
                  for key in ('begin','beginComment','begin_comment'):
                      ids.update(int(x) for x in re.findall(rf'\b{key}=(\d+)\b', first))
                  if len(ids)>1: raise SystemExit(f'conflicting END header begin ids: {sorted(ids)}')
                  closed.update(ids)
          assert len(begins)==1, (len(begins),'matching begins')
          begin_id=int(begins[0]['id'])
          assert begin_id not in closed, 'matching fence already closed'
          all_begins=[]
          for r in comments:
              first=str(r.get('body') or '').splitlines()[0] if r.get('body') else ''
              if first.startswith('WRITE_QUIET_BEGIN'):
                  all_begins.append(int(r['id']))
          unmatched=[x for x in all_begins if x not in closed]
          assert unmatched==[begin_id], unmatched
          open('auth-evidence/fence-begin-id.txt','w').write(str(begin_id)+'\n')
          print('matching_write_quiet_begin='+str(begin_id))
          PY

      - name: Recheck exact tracked tree for exec003 candidate collisions
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            python experiments/aerosol-family-challenge-v2/tracked_tree_seed_scan.py \
              --repo-root . \
              --file-list auth-evidence/tracked-files.nul \
              --candidate-seed-ledger "prior-control/exec003-candidate-seed-batch-${i}.json" \
              --allow-self-ledger-json prior-control/empty-self-ledger-policy.json \
              --output "auth-evidence/tracked-seed-scan-${i}.json"
          done
          python - <<'PY'
          import json
          for i in range(1,4):
              r=json.load(open(f'auth-evidence/tracked-seed-scan-{i}.json'))
              assert r['candidateSeedCount']==72
              assert r['trackedTreeExternalCollisionCount']==0
              assert r['exactHeadTrackedTreeByteScanPassed'] is True
          PY

      - name: Build retry-hardened authorization-time repository-global scanner
        shell: bash
        run: |
          set -euo pipefail
          cat > auth-evidence/exec003_repository_global_seed_scan.py <<'PY'
          from __future__ import annotations
          import hashlib, importlib.util, os, sys
          from pathlib import Path
          base=Path('experiments/aerosol-family-challenge-v2/repository_global_seed_scan.py')
          recovery_path=Path('review/lunar-scattered-light-source-contract-v1/lunar_finite_disk_exec003_transport_recovery.py')
          data=base.read_bytes()
          blob=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          if blob != os.environ['BOUND_SCANNER_BLOB']: raise SystemExit('bound repository-global scanner bytes changed')
          rspec=importlib.util.spec_from_file_location('lunar_fd_exec003_recovery_for_auth_scan', recovery_path)
          if rspec is None or rspec.loader is None: raise SystemExit('cannot import exec003 recovery helper')
          recovery=importlib.util.module_from_spec(rspec); sys.modules[rspec.name]=recovery; rspec.loader.exec_module(recovery)
          spec=importlib.util.spec_from_file_location('lunar_fd_exec003_bound_auth_global_scan',base)
          if spec is None or spec.loader is None: raise SystemExit('cannot import repository-global scanner')
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          original_req_json=mod.req_json
          def retrying_req_json(url, token):
              value, _receipt = recovery.request_with_bounded_transport_retry(lambda: original_req_json(url, token))
              return value
          mod.req_json=retrying_req_json
          mod.REVIEW_PROOF_ARTIFACT_NAME='lunar-finite-disk-exec003-authorization-recheck-v1-proof'
          raise SystemExit(mod.main())
          PY

      - name: Fresh authorization-time repository-global exec003 seed recheck
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            python auth-evidence/exec003_repository_global_seed_scan.py \
              --repository "$GITHUB_REPOSITORY" \
              --issue-number 60 \
              --candidate-seed-ledger "prior-control/exec003-candidate-seed-batch-${i}.json" \
              --current-run-id "$GITHUB_RUN_ID" \
              --audit-mode authorization-recheck \
              --expected-branch-name "$EXPECTED_BRANCH" \
              --expected-repo-head "$EVENT_HEAD" \
              --output "auth-evidence/repository-global-seed-scan-${i}.json"
          done
          python - <<'PY'
          import json, os
          for i in range(1,4):
              r=json.load(open(f'auth-evidence/repository-global-seed-scan-{i}.json'))
              assert r['auditMode']=='authorization-recheck'
              assert r['candidateSeedCount']==72
              assert r['repositoryGlobalCollisionCount']==0
              assert r['repositoryGlobalCollisionSurfaceScanPassed'] is True
              assert r['repositoryGlobalDoubleEnumerationStable'] is True
              assert r['auditedBranchHeadMatchesRepositoryHead'] is True
              assert r['repositoryHeadExpected']==os.environ['EVENT_HEAD']
              assert r['auditedBranchHeadShaObserved']==os.environ['EVENT_HEAD']
          PY

      - name: Freeze zero-runtime exec003 authorization-time proof
        shell: bash
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          ledger=json.load(open('prior-control/exec003-candidate-seed-ledger.json'))
          globals_=[json.load(open(f'auth-evidence/repository-global-seed-scan-{i}.json')) for i in range(1,4)]
          tracked=[json.load(open(f'auth-evidence/tracked-seed-scan-{i}.json')) for i in range(1,4)]
          assert all(r['repositoryGlobalCollisionCount']==0 for r in globals_)
          assert all(r['repositoryGlobalDoubleEnumerationStable'] is True for r in globals_)
          assert all(r['auditedBranchHeadMatchesRepositoryHead'] is True for r in globals_)
          assert all(r['trackedTreeExternalCollisionCount']==0 for r in tracked)
          assert len(set(map(int,ledger['candidateSeeds'])))==198
          begin_id=int(open('auth-evidence/fence-begin-id.txt').read().strip())
          proof={
            'schemaVersion':1,
            'status':'PASS_LUNAR_FINITE_DISK_EXEC003_AUTHORIZATION_TIME_RECHECK_ZERO_RUNTIME_NOT_AUTHORIZED',
            'reviewHead':os.environ['EVENT_HEAD'],
            'reviewBase':os.environ['EXPECTED_BASE'],
            'writeQuietBeginComment':begin_id,
            'priorControlRun':int(os.environ['PRIOR_CONTROL_RUN']),
            'priorControlJob':int(os.environ['PRIOR_CONTROL_JOB']),
            'priorControlArtifact':int(os.environ['PRIOR_CONTROL_ARTIFACT']),
            'priorControlDigest':os.environ['PRIOR_CONTROL_DIGEST'],
            'priorControlProofSha256':os.environ['PRIOR_CONTROL_PROOF_SHA'],
            'candidateSeedCount':198,
            'candidateSeedCanonicalSha256':os.environ['CANDIDATE_SEED_CANONICAL'],
            'candidateRowsCanonicalSha256':os.environ['CANDIDATE_ROWS_CANONICAL'],
            'trackedTreeExternalCollisionCount':0,
            'repositoryGlobalCollisionCount':0,
            'repositoryGlobalDoubleEnumerationStableAllBatches':True,
            'retryPolicyBoundToReviewedExec003Recovery':True,
            'freshExecutionIdentity':os.environ['FRESH_EXECUTION_IDENTITY'],
            'candidateSeedsAppliedToCases':False,
            'freshExecutionIdentityAuthorized':False,
            'scientificExecutionAuthorized':False,
            'solverExecutionAuthorized':False,
            'solverExecuted':False,
            'resultOpeningAuthorized':False,
            'finiteDiskResultOpened':False,
            'finiteDiskAdequacyValidated':False,
            'mandatorySpectralFollowOnNm':[450,650,750],
            'mandatorySpectralFollowOnStillRequired':True,
            'taylorOrJerusalemUsed':False,
            'productionAuthorized':False,
          }
          canon=json.dumps(proof,sort_keys=True,separators=(',',':'),allow_nan=False).encode()
          proof['proofPayloadSha256']=hashlib.sha256(canon).hexdigest()
          open('auth-evidence/authorization-recheck-proof.json','w').write(json.dumps(proof,indent=2,sort_keys=True)+'\n')
          print('status='+proof['status'])
          print('candidate_seed_count=198')
          print('repository_global_collision_count=0')
          print('scientific_execution_authorized=false')
          PY

      - name: Upload immutable zero-runtime authorization-time proof
        uses: actions/upload-artifact@v4
        with:
          name: lunar-finite-disk-exec003-authorization-recheck-v1-proof
          path: |
            auth-evidence/authorization-recheck-proof.json
            auth-evidence/prior-control-run.json
            auth-evidence/prior-control-jobs.json
            auth-evidence/prior-control-artifact.json
            auth-evidence/repository-global-seed-scan-1.json
            auth-evidence/repository-global-seed-scan-2.json
            auth-evidence/repository-global-seed-scan-3.json
            auth-evidence/tracked-seed-scan-1.json
            auth-evidence/tracked-seed-scan-2.json
            auth-evidence/tracked-seed-scan-3.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Claim boundary
        if: always()
        run: |
          echo 'Zero-runtime exec003 authorization-time recheck only.'
          echo 'No seed application, no scientific execution authorization, no uvspec/libRadtran/MYSTIC, no result opening, no finite-disk adequacy or production claim.'
          echo 'No Taylor/Jerusalem residual use.'
