name: Lunar finite-disk exec003 fresh-seed control v1

on:
  pull_request:
    types: [opened]
    branches:
      - review/lunar-finite-disk-exec003-transport-recovery-v1
    paths:
      - '.github/workflows/lunar-finite-disk-exec003-fresh-seed-control-v1.yml'

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: lunar-finite-disk-exec003-fresh-seed-control-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  zero-runtime-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      EXPECTED_BASE: 14d1b18bb002e368effa3ca7a01c95f1e19529ea
      EXPECTED_BRANCH: review/lunar-finite-disk-exec003-fresh-seed-control-v1
      CONSUMED_EXEC002_RUN: '33350041283'
      CONSUMED_EXEC002_HEAD: ff5c6d434797d50d0d876429674091abf44f2987
      RECOVERY_HEAD: 14d1b18bb002e368effa3ca7a01c95f1e19529ea
      RECOVERY_REVIEW_RUN: '33358905490'
      RECOVERY_REVIEW_JOB: '99386300790'
      RECOVERY_GENERIC_RUN: '33358907725'
      RECOVERY_GENERIC_JOB: '99386307175'
      OLD_EXEC002_NAMESPACE: lunar-finite-disk-transfer-kernel-sensitivity-v1|pagination-recovery-exec002|case-seed|sha256-v1
      EXPECTED_EXEC002_SEED_CANONICAL: 30350e6986b554d09bcd77e9095cb871dd634a80a4f219cca29d0fc0b8249e84
      EXPECTED_EXEC002_ROWS_CANONICAL: 7dbb4cbe6c34ffad668eb63ad051bd7319d68e56ea1b3c4e540d70eda23b1c95
      NEW_EXEC003_NAMESPACE: lunar-finite-disk-transfer-kernel-sensitivity-v1|transport-recovery-exec003|case-seed|sha256-v1
      FRESH_EXECUTION_IDENTITY: lunar-finite-disk-transfer-kernel-sensitivity-v1-exec003

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Bind exact one-file zero-runtime control surface
        shell: bash
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$EVENT_BASE" = "$EXPECTED_BASE"
          test "$EVENT_BRANCH" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          git diff --name-only "$EXPECTED_BASE"...HEAD | sort > changed-paths.txt
          printf '%s\n' '.github/workflows/lunar-finite-disk-exec003-fresh-seed-control-v1.yml' > expected-paths.txt
          diff -u expected-paths.txt changed-paths.txt
          test -z "$(command -v uvspec || true)"
          mkdir -p control-evidence
          git ls-files -z > control-evidence/tracked-files.nul

      - name: Bind consumed exec002 and exact reviewed exec003 recovery
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CONSUMED_EXEC002_RUN" > control-evidence/exec002-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CONSUMED_EXEC002_RUN/jobs?per_page=100" > control-evidence/exec002-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECOVERY_REVIEW_RUN" > control-evidence/recovery-review-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECOVERY_REVIEW_RUN/jobs?per_page=100" > control-evidence/recovery-review-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECOVERY_GENERIC_RUN" > control-evidence/recovery-generic-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECOVERY_GENERIC_RUN/jobs?per_page=100" > control-evidence/recovery-generic-jobs.json
          python - <<'PY'
          import json, os
          e=json.load(open('control-evidence/exec002-run.json'))
          assert e['id']==int(os.environ['CONSUMED_EXEC002_RUN']) and e['run_attempt']==1
          assert e['head_sha']==os.environ['CONSUMED_EXEC002_HEAD'] and e['conclusion']=='failure'
          jobs=json.load(open('control-evidence/exec002-jobs.json'))['jobs']
          solver=[j for j in jobs if str(j.get('name','')).startswith('execute shard ')]
          assert solver and all(j.get('conclusion')=='skipped' for j in solver), solver
          rr=json.load(open('control-evidence/recovery-review-run.json'))
          assert rr['id']==int(os.environ['RECOVERY_REVIEW_RUN']) and rr['run_attempt']==1
          assert rr['head_sha']==os.environ['RECOVERY_HEAD'] and rr['conclusion']=='success'
          rjobs=json.load(open('control-evidence/recovery-review-jobs.json'))['jobs']
          assert any(int(j['id'])==int(os.environ['RECOVERY_REVIEW_JOB']) and j['conclusion']=='success' for j in rjobs)
          gr=json.load(open('control-evidence/recovery-generic-run.json'))
          assert gr['id']==int(os.environ['RECOVERY_GENERIC_RUN']) and gr['run_attempt']==1
          assert gr['head_sha']==os.environ['RECOVERY_HEAD'] and gr['conclusion']=='success'
          gjobs=json.load(open('control-evidence/recovery-generic-jobs.json'))['jobs']
          assert any(int(j['id'])==int(os.environ['RECOVERY_GENERIC_JOB']) and j['conclusion']=='success' for j in gjobs)
          PY

      - name: Derive fresh exec003 candidates without logging literals
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, importlib.util, json, os, sys
          from pathlib import Path
          old_path=Path('review/lunar-scattered-light-source-contract-v1/lunar_finite_disk_seed_ledger.py')
          spec=importlib.util.spec_from_file_location('lunar_fd_seed_base_exec003_control', old_path)
          if spec is None or spec.loader is None: raise SystemExit('cannot import finite-disk seed ledger')
          old=importlib.util.module_from_spec(spec); sys.modules[spec.name]=old; spec.loader.exec_module(old)
          old_ledger=old.validate_ledger()
          old_seeds=set(map(int, old_ledger['candidateSeeds']))
          case_ids=[str(x['caseId']) for x in old._load_planner().frozen_cases()]
          if len(case_ids)!=198 or len(set(case_ids))!=198: raise SystemExit('frozen 198-case universe drift')
          minimum=10_000_000; maximum=2_147_483_647; span=maximum-minimum
          retired=set(range(32_910_001,32_910_199))

          def derive(namespace, forbidden):
              rows=[]; used=set()
              for case_id in case_ids:
                  counter=0
                  while True:
                      material=f'{namespace}|caseId={case_id}|counter={counter}'
                      digest=hashlib.sha256(material.encode()).hexdigest()
                      seed=(int(digest[:16],16)%span)+minimum
                      if seed in retired or seed in forbidden or seed in used:
                          counter+=1; continue
                      break
                  used.add(seed)
                  rows.append({'caseId':case_id,'collisionCounter':counter,'derivationMaterialSha256':digest,'seed':seed})
              return rows

          canon=lambda x: hashlib.sha256(json.dumps(x,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
          exec002_rows=derive(os.environ['OLD_EXEC002_NAMESPACE'], old_seeds)
          exec002_seed_list=[int(r['seed']) for r in exec002_rows]
          exec002_seeds=set(exec002_seed_list)
          if len(exec002_seeds)!=198 or exec002_seeds & old_seeds: raise SystemExit('exec002 reconstruction drift')
          if canon(exec002_seed_list)!=os.environ['EXPECTED_EXEC002_SEED_CANONICAL']: raise SystemExit('exec002 candidate seed canonical drift')
          if canon(exec002_rows)!=os.environ['EXPECTED_EXEC002_ROWS_CANONICAL']: raise SystemExit('exec002 candidate row canonical drift')
          forbidden=old_seeds | exec002_seeds
          rows=derive(os.environ['NEW_EXEC003_NAMESPACE'], forbidden)
          seeds=[int(r['seed']) for r in rows]
          if len(seeds)!=198 or len(set(seeds))!=198: raise SystemExit('fresh exec003 seed cardinality/uniqueness drift')
          if set(seeds) & forbidden: raise SystemExit('fresh exec003 candidates overlap prior candidate universes')
          if any(s in retired for s in seeds): raise SystemExit('fresh exec003 candidate entered retired disclosed range')
          ledger={
            'schemaVersion':1,
            'stageId':'lunar-finite-disk-transfer-kernel-sensitivity-v1-exec003-fresh-candidate-seeds',
            'status':'CANDIDATE_ONLY_ARTIFACT_ONLY_NOT_APPLIED_NOT_AUTHORIZED',
            'namespace':os.environ['NEW_EXEC003_NAMESPACE'],
            'freshExecutionIdentity':os.environ['FRESH_EXECUTION_IDENTITY'],
            'candidateSeedCount':198,
            'candidateSeeds':seeds,
            'candidateRows':rows,
            'candidateSeedCanonicalSha256':canon(seeds),
            'candidateRowsCanonicalSha256':canon(rows),
            'overlapWithPriorReplacementCandidateCount':0,
            'overlapWithConsumedExec002CandidateCount':0,
            'retiredPriorCandidateRangeMayEverExecute':False,
            'candidateSeedsAppliedToCases':False,
            'freshExecutionIdentityAuthorized':False,
            'scientificExecutionAuthorized':False,
            'solverExecutionAuthorized':False,
            'solverExecuted':False,
            'resultOpeningAuthorized':False,
            'finiteDiskResultOpened':False,
            'finiteDiskAdequacyValidated':False,
            'productionAuthorized':False,
          }
          out=Path('control-evidence')
          (out/'exec003-candidate-seed-ledger.json').write_text(json.dumps(ledger,indent=2,sort_keys=True)+'\n')
          batches=[seeds[:72],seeds[72:144],seeds[144:]+seeds[:18]]
          if any(len(b)!=72 or len(set(b))!=72 for b in batches): raise SystemExit('scanner batch drift')
          if set().union(*(set(b) for b in batches)) != set(seeds): raise SystemExit('scanner batches do not cover exact fresh universe')
          for i,b in enumerate(batches,1):
              (out/f'exec003-candidate-seed-batch-{i}.json').write_text(json.dumps({'candidateSeeds':b},indent=2,sort_keys=True)+'\n')
          (out/'empty-self-ledger-policy.json').write_text(json.dumps({'schemaVersion':2,'requiredTrackedSelfLedgerPaths':[],'futureEvidenceSelfLedgerPaths':[]},indent=2,sort_keys=True)+'\n')
          print('fresh_candidate_seed_count=198')
          print('fresh_candidate_seed_canonical_sha256='+ledger['candidateSeedCanonicalSha256'])
          print('fresh_candidate_rows_canonical_sha256='+ledger['candidateRowsCanonicalSha256'])
          print('overlap_with_prior_candidate_universes=0')
          print('candidate_seed_literals_logged=false')
          PY

      - name: Scan exact tracked tree for fresh exec003 collisions
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            python experiments/aerosol-family-challenge-v2/tracked_tree_seed_scan.py \
              --repo-root . \
              --file-list control-evidence/tracked-files.nul \
              --candidate-seed-ledger "control-evidence/exec003-candidate-seed-batch-${i}.json" \
              --allow-self-ledger-json control-evidence/empty-self-ledger-policy.json \
              --output "control-evidence/tracked-seed-scan-${i}.json"
          done
          python - <<'PY'
          import json
          for i in range(1,4):
              r=json.load(open(f'control-evidence/tracked-seed-scan-{i}.json'))
              assert r['candidateSeedCount']==72
              assert r['trackedTreeExternalCollisionCount']==0
              assert r['exactHeadTrackedTreeByteScanPassed'] is True
          PY

      - name: Build retry-hardened bound repository-global scanner
        shell: bash
        run: |
          set -euo pipefail
          cat > control-evidence/exec003_repository_global_seed_scan.py <<'PY'
          from __future__ import annotations
          import hashlib, importlib.util, sys
          from pathlib import Path
          base=Path('experiments/aerosol-family-challenge-v2/repository_global_seed_scan.py')
          recovery_path=Path('review/lunar-scattered-light-source-contract-v1/lunar_finite_disk_exec003_transport_recovery.py')
          expected='4c6d704fa24228284780bcb1dd7c52537b4c5b0d'
          data=base.read_bytes()
          blob=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          if blob != expected: raise SystemExit('bound repository-global scanner bytes changed')
          rspec=importlib.util.spec_from_file_location('lunar_fd_exec003_recovery_for_scan', recovery_path)
          if rspec is None or rspec.loader is None: raise SystemExit('cannot import exec003 recovery helper')
          recovery=importlib.util.module_from_spec(rspec); sys.modules[rspec.name]=recovery; rspec.loader.exec_module(recovery)
          spec=importlib.util.spec_from_file_location('lunar_fd_exec003_bound_global_scan',base)
          if spec is None or spec.loader is None: raise SystemExit('cannot import repository-global scanner')
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          original_req_json=mod.req_json
          def retrying_req_json(url, token):
              value, _receipt = recovery.request_with_bounded_transport_retry(lambda: original_req_json(url, token))
              return value
          mod.req_json=retrying_req_json
          mod.REVIEW_PROOF_ARTIFACT_NAME='lunar-finite-disk-exec003-fresh-seed-control-v1-proof'
          raise SystemExit(mod.main())
          PY

      - name: Fresh three-batch repository-global exec003 seed scan
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            python control-evidence/exec003_repository_global_seed_scan.py \
              --repository "$GITHUB_REPOSITORY" \
              --issue-number 60 \
              --candidate-seed-ledger "control-evidence/exec003-candidate-seed-batch-${i}.json" \
              --current-run-id "$GITHUB_RUN_ID" \
              --audit-mode review-freeze \
              --expected-branch-name "$EXPECTED_BRANCH" \
              --expected-repo-head "$EXPECTED_HEAD" \
              --output "control-evidence/repository-global-seed-scan-${i}.json"
          done
          python - <<'PY'
          import json, os
          for i in range(1,4):
              r=json.load(open(f'control-evidence/repository-global-seed-scan-{i}.json'))
              assert r['auditMode']=='review-freeze'
              assert r['candidateSeedCount']==72
              assert r['repositoryGlobalCollisionCount']==0
              assert r['repositoryGlobalCollisionSurfaceScanPassed'] is True
              assert r['repositoryGlobalDoubleEnumerationStable'] is True
              assert r['auditedBranchHeadMatchesRepositoryHead'] is True
              assert r['repositoryHeadExpected']==os.environ['EXPECTED_HEAD']
              assert r['auditedBranchHeadShaObserved']==os.environ['EXPECTED_HEAD']
              assert r['priorReviewProofArtifactCount']==0
              assert r['reviewProofIdentityFresh'] is True
          PY

      - name: Freeze fresh exec003 zero-runtime control proof
        shell: bash
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          ledger=json.load(open('control-evidence/exec003-candidate-seed-ledger.json'))
          globals_=[json.load(open(f'control-evidence/repository-global-seed-scan-{i}.json')) for i in range(1,4)]
          tracked=[json.load(open(f'control-evidence/tracked-seed-scan-{i}.json')) for i in range(1,4)]
          proof={
            'schemaVersion':1,
            'status':'PASS_LUNAR_FINITE_DISK_EXEC003_FRESH_SEED_GLOBAL_CONTROL_NOT_AUTHORIZED',
            'reviewHead':os.environ['EVENT_HEAD'],
            'baseHead':os.environ['EXPECTED_BASE'],
            'freshExecutionIdentity':os.environ['FRESH_EXECUTION_IDENTITY'],
            'consumedExec002Run':int(os.environ['CONSUMED_EXEC002_RUN']),
            'consumedExec002Reusable':False,
            'exec002SeedUniverseReusable':False,
            'recoveryReviewRun':int(os.environ['RECOVERY_REVIEW_RUN']),
            'recoveryGenericRun':int(os.environ['RECOVERY_GENERIC_RUN']),
            'candidateSeedCount':ledger['candidateSeedCount'],
            'candidateSeedCanonicalSha256':ledger['candidateSeedCanonicalSha256'],
            'candidateRowsCanonicalSha256':ledger['candidateRowsCanonicalSha256'],
            'overlapWithPriorReplacementCandidateCount':0,
            'overlapWithConsumedExec002CandidateCount':0,
            'trackedTreeExternalCollisionCount':sum(int(x['trackedTreeExternalCollisionCount']) for x in tracked),
            'repositoryGlobalCollisionCount':sum(int(x['repositoryGlobalCollisionCount']) for x in globals_),
            'repositoryGlobalDoubleEnumerationStableAllBatches':all(bool(x['repositoryGlobalDoubleEnumerationStable']) for x in globals_),
            'retryPolicyBoundToReviewedExec003Recovery':True,
            'candidateSeedsAppliedToCases':False,
            'freshExecutionIdentityAuthorized':False,
            'scientificExecutionAuthorized':False,
            'solverExecutionAuthorized':False,
            'solverExecuted':False,
            'resultOpeningAuthorized':False,
            'finiteDiskResultOpened':False,
            'finiteDiskAdequacyValidated':False,
            'taylorJerusalemUsed':False,
            'productionAuthorized':False,
          }
          canonical=json.dumps(proof,sort_keys=True,separators=(',',':'),allow_nan=False).encode()
          proof['proofPayloadSha256']=hashlib.sha256(canonical).hexdigest()
          Path('control-evidence/exec003-fresh-seed-control-proof.json').write_text(json.dumps(proof,indent=2,sort_keys=True)+'\n')
          assert proof['candidateSeedCount']==198
          assert proof['trackedTreeExternalCollisionCount']==0
          assert proof['repositoryGlobalCollisionCount']==0
          assert proof['repositoryGlobalDoubleEnumerationStableAllBatches'] is True
          assert proof['candidateSeedsAppliedToCases'] is False
          assert proof['freshExecutionIdentityAuthorized'] is False
          assert proof['solverExecuted'] is False
          assert proof['resultOpeningAuthorized'] is False
          assert proof['productionAuthorized'] is False
          PY

      - name: Upload immutable zero-runtime control proof
        uses: actions/upload-artifact@v4
        with:
          name: lunar-finite-disk-exec003-fresh-seed-control-v1-proof
          path: |
            control-evidence/exec003-fresh-seed-control-proof.json
            control-evidence/exec003-candidate-seed-ledger.json
            control-evidence/repository-global-seed-scan-1.json
            control-evidence/repository-global-seed-scan-2.json
            control-evidence/repository-global-seed-scan-3.json
            control-evidence/tracked-seed-scan-1.json
            control-evidence/tracked-seed-scan-2.json
            control-evidence/tracked-seed-scan-3.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Claim boundary
        if: always()
        run: |
          echo 'Zero-runtime exec003 seed/global-freshness control only.'
          echo 'No seed application, no scientific authorization, no solver execution, no result opening, no empirical/total-sky/production claim.'
