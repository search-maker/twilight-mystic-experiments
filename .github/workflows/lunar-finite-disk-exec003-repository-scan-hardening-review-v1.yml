name: Lunar exec003 repository scan hardening review v1

on:
  push:
    branches:
      - review/lunar-finite-disk-exec003-repository-scan-hardening-v1

permissions:
  contents: read

concurrency:
  group: lunar-exec003-repository-scan-hardening-review-v1
  cancel-in-progress: false

jobs:
  solver-free-hardening-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Bind exact bounded hardening surface
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD^)" = "1e4fdba6755d28d998197444dcf994ef39d28d69"
          git diff --name-only HEAD^...HEAD | sort > changed-paths.txt
          cat > expected-paths.txt <<'EOF'
          .github/workflows/lunar-finite-disk-exec003-repository-scan-hardening-review-v1.yml
          review/lunar-finite-disk-exec003-repository-scan-hardening-v1/repository_global_seed_scan_hardening.py
          review/lunar-finite-disk-exec003-repository-scan-hardening-v1/test_repository_global_seed_scan_hardening.py
          EOF
          sort -o expected-paths.txt expected-paths.txt
          diff -u expected-paths.txt changed-paths.txt
          test -z "$(command -v uvspec || true)"

      - name: Verify bound scanner blob and compile helper
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object experiments/aerosol-family-challenge-v2/repository_global_seed_scan.py)" = "4c6d704fa24228284780bcb1dd7c52537b4c5b0d"
          python -m py_compile review/lunar-finite-disk-exec003-repository-scan-hardening-v1/repository_global_seed_scan_hardening.py
          python -m py_compile review/lunar-finite-disk-exec003-repository-scan-hardening-v1/test_repository_global_seed_scan_hardening.py

      - name: Run bounded hardening regressions
        shell: bash
        run: |
          set -euo pipefail
          python review/lunar-finite-disk-exec003-repository-scan-hardening-v1/test_repository_global_seed_scan_hardening.py
