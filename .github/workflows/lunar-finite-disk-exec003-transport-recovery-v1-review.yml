name: lunar finite-disk exec003 transport recovery v1 review

on:
  push:
    branches:
      - review/lunar-finite-disk-exec003-transport-recovery-v1

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Prove exact pushed head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Execute solver-free recovery contract regression
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_lunar_finite_disk_exec003_transport_recovery_v1.py
          python3 review/lunar-scattered-light-source-contract-v1/lunar_finite_disk_exec003_transport_recovery.py validate --json > /tmp/lunar_exec003_validate.json
          python3 review/lunar-scattered-light-source-contract-v1/lunar_finite_disk_exec003_transport_recovery.py self-test --json > /tmp/lunar_exec003_selftest.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          contract = json.loads(Path('/tmp/lunar_exec003_validate.json').read_text())
          selftest = json.loads(Path('/tmp/lunar_exec003_selftest.json').read_text())

          assert contract['status'] == 'FROZEN_SOLVER_FREE_RECOVERY_NOT_AUTHORIZED_NOT_DISPATCHED'
          assert contract['freshExecutionId'] == 'lunar-finite-disk-transfer-kernel-sensitivity-v1-exec003'
          assert contract['consumedPredecessor']['executionId'] == 'lunar-finite-disk-transfer-kernel-sensitivity-v1-exec002'
          assert contract['consumedPredecessor']['runId'] == 33350041283
          assert contract['consumedPredecessor']['rerunRetryResumeForbidden'] is True
          assert contract['consumedPredecessor']['seedUniverseConsumed'] is True

          science = contract['frozenScience']
          assert science['wavelengthNm'] == 550.0
          assert science['geometryCount'] == 6
          assert science['directionsPerGeometry'] == 33
          assert science['totalDirectionalCases'] == 198
          assert science['photonHistoriesPerDirectionalCase'] == 5_000_000
          assert science['totalPhotonHistories'] == 990_000_000
          assert science['acceptanceThreshold'] is None
          assert science['descriptiveEvaluatorUnchanged'] is True
          assert science['mandatorySpectralFollowOnNm'] == [450.0, 650.0, 750.0]

          policy = contract['transportRetryPolicy']
          assert policy['scope'] == 'READ_ONLY_GITHUB_REPOSITORY_METADATA_ENUMERATION_ONLY'
          assert policy['transientHttpStatuses'] == [408, 429, 500, 502, 503, 504]
          assert policy['maxAttemptsPerMetadataRequest'] == 4
          assert policy['backoffSeconds'] == [2, 5, 10]
          assert policy['githubActionsRunRerun'] is False
          assert policy['solverRetry'] is False
          assert policy['scientificExecutionRetry'] is False
          assert policy['nonTransientHttpFailureFailsClosedImmediately'] is True
          assert policy['exhaustedTransientFailureFailsClosed'] is True

          assert contract['seedPolicy']['exec001SeedsReusable'] is False
          assert contract['seedPolicy']['exec002SeedsReusable'] is False
          assert contract['seedPolicy']['freshExec003SeedUniverseRequired'] is True
          assert contract['seedPolicy']['freshRepositoryGlobalProofRequiredBeforeAuthorization'] is True
          assert contract['seedPolicy']['candidateSeedsAllocatedByThisContract'] is False
          assert contract['seedPolicy']['candidateSeedLiteralsIncluded'] is False
          assert all(value is False for value in contract['protectedBoundaries'].values())

          assert selftest['status'] == 'PASS_EXEC003_TRANSPORT_RECOVERY_SELF_TEST'
          assert selftest['maxMetadataRequestAttempts'] == 4
          assert selftest['solverExecuted'] is False
          assert selftest['seedAuthorized'] is False
          assert selftest['resultOpened'] is False
          PY
