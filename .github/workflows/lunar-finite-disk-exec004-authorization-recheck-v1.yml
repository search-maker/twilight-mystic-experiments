name: Lunar finite-disk exec004 authorization-time recheck v1

on:
  push:
    branches:
      - review/lunar-finite-disk-exec004-authorization-recheck-v1
    paths:
      - '.github/workflows/lunar-finite-disk-exec004-authorization-recheck-v1.yml'
      - 'review/lunar-finite-disk-exec004-repository-scan-hardening-v1/repository_global_seed_scan_hardening.py'
      - 'review/lunar-finite-disk-exec004-repository-scan-hardening-v1/test_repository_global_seed_scan_hardening.py'
  pull_request:
    types: [opened]
    branches:
      - review/lunar-finite-disk-exec004-fresh-seed-control-v1
    paths:
      - '.github/workflows/lunar-finite-disk-exec004-authorization-recheck-v1.yml'

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: lunar-finite-disk-exec004-authorization-recheck-${{ github.event_name }}-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

env:
  EXPECTED_BASE: a39a631221f9b7e4913a40c1227ba6b0ccebf04e
  EXPECTED_MAIN: 48295e390ad8f68e6d0d4d649f1ce2bb57b041d1
  EXPECTED_BRANCH: review/lunar-finite-disk-exec004-authorization-recheck-v1
  PRIOR_CONTROL_PR: '958'
  PRIOR_CONTROL_RUN: '34059309664'
  PRIOR_CONTROL_JOB: '101556849327'
  PRIOR_CONTROL_ARTIFACT: '9997398593'
  PRIOR_CONTROL_DIGEST: sha256:2314be605f0c8ed5f1592b36e8cd9801037434d3c9668ec2e1d2b7d287037d70
  PRIOR_CONTROL_NAME: lunar-finite-disk-exec004-fresh-seed-control-v1-proof
  PRIOR_CONTROL_PROOF_SHA: '16113b29ee13cb9545e14733b1eefda3fbb641905003d1ab28b713dbd46133ff'
  CANDIDATE_SEED_CANONICAL: '9a29092f1708b3c8c46542967b29471689b9de3b293adadbc16c25410091e585'
  CANDIDATE_ROWS_CANONICAL: '9f6aa730fa7720fd985cfbda55ac49023f90be7de8d5f5bc931ab52aca77aa56'
  FRESH_EXECUTION_IDENTITY: lunar-finite-disk-transfer-kernel-sensitivity-v1-exec004
  FENCE_STAGE: LUNAR_FINITE_DISK_EXEC004_AUTHORIZATION_RECHECK_GLOBAL_SCAN_V1
  TRACKED_SCANNER_BLOB: 1c110d75b516cb7b9d50dc2674080f4a67e55d2a
  BOUND_SCANNER_BLOB: 4c6d704fa24228284780bcb1dd7c52537b4c5b0d
  HARDENING_HELPER_BLOB: 3f0231314341c326316e8741091e45e34b1ba373
  HARDENING_TEST_BLOB: b40131299f6192a83cbf3ad7023691221d951537
  FROZEN_HISTORICAL_HEAD: 1e4fdba6755d28d998197444dcf994ef39d28d69
  FROZEN_RECOVERY_HELPER_BLOB: bc5f3677f2f0bc9c4824f7e404593834d87577e2
  PHYSICS_CLASSIFICATION_COMMENT: '5562518571'
  PREREQ_REPTRAN_HEAD: b85a9ea9175bc6c98cbdf3f607ad2b81bb7da823
  PREREQ_REPTRAN_RUN: '34052817182'
  PREREQ_REPTRAN_ARTIFACT: '9995060899'
  PREREQ_REPTRAN_DIGEST: sha256:60e01e40e899e28f65e58c2acb90eac4c893010fab0e7f7782a9c0391ff32c7a
  PREREQ_CAP_HEAD: 9d78567ffb55a2fe187e256a2abaf994aaad453f
  PREREQ_CAP_RUN: '34053349932'
  PREREQ_CAP_JOB: '101540778940'
  PREREQ_CAP_ARTIFACT: '9995224987'
  PREREQ_CAP_DIGEST: sha256:fd906b1060594a6e80884f3847e4fdcc43e8ede7f231d04cfe797fbcf4204e79

jobs:
  generic-zero-runtime-exact-head:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate fresh exact-head solver-free control surface
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git merge-base "$EXPECTED_BASE" HEAD)" = "$EXPECTED_BASE"
          git diff --name-only "$EXPECTED_BASE"...HEAD | sort > changed-paths.txt
          cat > expected-paths.txt <<'EOF'
          .github/workflows/lunar-finite-disk-exec004-authorization-recheck-v1.yml
          review/lunar-finite-disk-exec004-repository-scan-hardening-v1/repository_global_seed_scan_hardening.py
          review/lunar-finite-disk-exec004-repository-scan-hardening-v1/test_repository_global_seed_scan_hardening.py
          EOF
          sort -o expected-paths.txt expected-paths.txt
          diff -u expected-paths.txt changed-paths.txt
          test "$(git hash-object experiments/aerosol-family-challenge-v2/tracked_tree_seed_scan.py)" = "$TRACKED_SCANNER_BLOB"
          test "$(git hash-object experiments/aerosol-family-challenge-v2/repository_global_seed_scan.py)" = "$BOUND_SCANNER_BLOB"
          test "$(git hash-object review/lunar-finite-disk-exec004-repository-scan-hardening-v1/repository_global_seed_scan_hardening.py)" = "$HARDENING_HELPER_BLOB"
          test "$(git hash-object review/lunar-finite-disk-exec004-repository-scan-hardening-v1/test_repository_global_seed_scan_hardening.py)" = "$HARDENING_TEST_BLOB"
          test -z "$(command -v uvspec || true)"
          python review/lunar-finite-disk-exec004-repository-scan-hardening-v1/test_repository_global_seed_scan_hardening.py
          echo 'generic_exact_head_zero_runtime_control=PASS'
          echo 'protected_repository_global_scan_executed=false'
          echo 'scientific_execution_authorized=false'

  zero-runtime-authorization-recheck:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Bind exact fresh three-file authorization-recheck surface and clean prepared head
        shell: bash
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$EVENT_BASE" = "$EXPECTED_BASE"
          test "$EVENT_BRANCH" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test "$(git merge-base "$EXPECTED_BASE" HEAD)" = "$EXPECTED_BASE"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$EXPECTED_MAIN"
          git diff --name-only "$EXPECTED_BASE"...HEAD | sort > changed-paths.txt
          cat > expected-paths.txt <<'EOF'
          .github/workflows/lunar-finite-disk-exec004-authorization-recheck-v1.yml
          review/lunar-finite-disk-exec004-repository-scan-hardening-v1/repository_global_seed_scan_hardening.py
          review/lunar-finite-disk-exec004-repository-scan-hardening-v1/test_repository_global_seed_scan_hardening.py
          EOF
          sort -o expected-paths.txt expected-paths.txt
          diff -u expected-paths.txt changed-paths.txt
          test "$(git hash-object experiments/aerosol-family-challenge-v2/tracked_tree_seed_scan.py)" = "$TRACKED_SCANNER_BLOB"
          test "$(git hash-object experiments/aerosol-family-challenge-v2/repository_global_seed_scan.py)" = "$BOUND_SCANNER_BLOB"
          test "$(git hash-object review/lunar-finite-disk-exec004-repository-scan-hardening-v1/repository_global_seed_scan_hardening.py)" = "$HARDENING_HELPER_BLOB"
          test "$(git hash-object review/lunar-finite-disk-exec004-repository-scan-hardening-v1/test_repository_global_seed_scan_hardening.py)" = "$HARDENING_TEST_BLOB"
          test -z "$(command -v uvspec || true)"
          python review/lunar-finite-disk-exec004-repository-scan-hardening-v1/test_repository_global_seed_scan_hardening.py
          mkdir -p auth-evidence prior-control auth-evidence/frozen
          git ls-files -z > auth-evidence/tracked-files.nul

          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$EVENT_HEAD&event=push&per_page=100" > auth-evidence/prepared-push-runs.json
          python - <<'PY'
          import json, os
          data=json.load(open('auth-evidence/prepared-push-runs.json'))
          head=os.environ['EVENT_HEAD']
          rows=[r for r in data.get('workflow_runs',[]) if r.get('head_sha')==head and r.get('name')=='Lunar finite-disk exec004 authorization-time recheck v1']
          assert len(rows)==1, [(r.get('id'),r.get('status'),r.get('conclusion')) for r in rows]
          r=rows[0]
          assert r['event']=='push' and r['run_attempt']==1 and r['status']=='completed' and r['conclusion']=='success', r
          open('auth-evidence/prepared-generic-run-id.txt','w').write(str(r['id'])+'\n')
          print('prepared_generic_run='+str(r['id']))
          PY

      - name: Bind exact independent exec004 freshness classification and REPTRAN prerequisites
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PRIOR_CONTROL_PR" > auth-evidence/prior-control-pr.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR_CONTROL_RUN" > auth-evidence/prior-control-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR_CONTROL_RUN/jobs?per_page=100" > auth-evidence/prior-control-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PRIOR_CONTROL_ARTIFACT" > auth-evidence/prior-control-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$PHYSICS_CLASSIFICATION_COMMENT" > auth-evidence/physics-classification.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREREQ_REPTRAN_RUN" > auth-evidence/reptran-prestage-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PREREQ_REPTRAN_ARTIFACT" > auth-evidence/reptran-prestage-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREREQ_CAP_RUN" > auth-evidence/reptran-cap-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREREQ_CAP_RUN/jobs?per_page=100" > auth-evidence/reptran-cap-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PREREQ_CAP_ARTIFACT" > auth-evidence/reptran-cap-artifact.json
          python - <<'PY'
          import json, os, re
          pr=json.load(open('auth-evidence/prior-control-pr.json'))
          assert pr['number']==int(os.environ['PRIOR_CONTROL_PR'])
          assert pr['state']=='open' and pr['draft'] is True and pr.get('merged_at') is None
          assert pr['head']['sha']==os.environ['EXPECTED_BASE'] and pr['base']['sha']==os.environ['EXPECTED_MAIN']
          run=json.load(open('auth-evidence/prior-control-run.json'))
          assert run['id']==int(os.environ['PRIOR_CONTROL_RUN']) and run['run_attempt']==1
          assert run['head_sha']==os.environ['EXPECTED_BASE'] and run['conclusion']=='success'
          jobs=json.load(open('auth-evidence/prior-control-jobs.json'))['jobs']
          assert any(int(j['id'])==int(os.environ['PRIOR_CONTROL_JOB']) and j['conclusion']=='success' for j in jobs)
          art=json.load(open('auth-evidence/prior-control-artifact.json'))
          assert art['id']==int(os.environ['PRIOR_CONTROL_ARTIFACT']) and art['name']==os.environ['PRIOR_CONTROL_NAME']
          assert art['digest']==os.environ['PRIOR_CONTROL_DIGEST'] and not art['expired']
          pc=json.load(open('auth-evidence/physics-classification.json'))
          body=str(pc.get('body') or '')
          assert int(pc['id'])==int(os.environ['PHYSICS_CLASSIFICATION_COMMENT'])
          required=[
            'LUNAR_EXEC004_FRESH_CANDIDATE_FRESHNESS_CONTROL_CLEAN__TRANSITION_ELIGIBLE_FOR_NEXT_HISTORICAL_AUTHORIZATION_TIME_LIVE_RECHECK__SCIENCE_NOT_AUTHORIZED',
            os.environ['EXPECTED_BASE'], os.environ['PRIOR_CONTROL_ARTIFACT'], os.environ['PRIOR_CONTROL_DIGEST'],
            os.environ['CANDIDATE_SEED_CANONICAL'], os.environ['CANDIDATE_ROWS_CANONICAL'], os.environ['PRIOR_CONTROL_PROOF_SHA'],
            os.environ['PREREQ_REPTRAN_RUN'], os.environ['PREREQ_REPTRAN_ARTIFACT'], os.environ['PREREQ_CAP_RUN'], os.environ['PREREQ_CAP_ARTIFACT']
          ]
          assert all(x in body for x in required), [x for x in required if x not in body]
          rr=json.load(open('auth-evidence/reptran-prestage-run.json'))
          assert rr['id']==int(os.environ['PREREQ_REPTRAN_RUN']) and rr['run_attempt']==1 and rr['head_sha']==os.environ['PREREQ_REPTRAN_HEAD'] and rr['conclusion']=='success'
          ra=json.load(open('auth-evidence/reptran-prestage-artifact.json'))
          assert ra['id']==int(os.environ['PREREQ_REPTRAN_ARTIFACT']) and ra['digest']==os.environ['PREREQ_REPTRAN_DIGEST'] and not ra['expired']
          cr=json.load(open('auth-evidence/reptran-cap-run.json'))
          assert cr['id']==int(os.environ['PREREQ_CAP_RUN']) and cr['run_attempt']==1 and cr['head_sha']==os.environ['PREREQ_CAP_HEAD'] and cr['conclusion']=='success'
          cj=json.load(open('auth-evidence/reptran-cap-jobs.json'))['jobs']
          assert any(int(j['id'])==int(os.environ['PREREQ_CAP_JOB']) and j['conclusion']=='success' for j in cj)
          ca=json.load(open('auth-evidence/reptran-cap-artifact.json'))
          assert ca['id']==int(os.environ['PREREQ_CAP_ARTIFACT']) and ca['digest']==os.environ['PREREQ_CAP_DIGEST'] and not ca['expired']
          for val in [os.environ['PRIOR_CONTROL_DIGEST'], os.environ['PREREQ_REPTRAN_DIGEST'], os.environ['PREREQ_CAP_DIGEST']]:
              assert re.fullmatch(r'sha256:[0-9a-f]{64}', val)
          PY

      - name: Bind exact prior exec004 freshness artifact and candidate universe without disclosure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$PRIOR_CONTROL_RUN" -n "$PRIOR_CONTROL_NAME" --dir prior-control
          test -f prior-control/exec004-fresh-seed-control-proof.json
          test -f prior-control/exec004-candidate-seed-ledger.json
          python - <<'PY'
          import hashlib, json, os
          p=json.load(open('prior-control/exec004-fresh-seed-control-proof.json'))
          raw=dict(p); claimed=raw.pop('proofPayloadSha256')
          calc=hashlib.sha256(json.dumps(raw,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
          assert claimed==calc==os.environ['PRIOR_CONTROL_PROOF_SHA']
          assert p['status']=='PASS_LUNAR_FINITE_DISK_EXEC004_FRESH_SEED_GLOBAL_CONTROL_NOT_ALLOCATED_NOT_AUTHORIZED'
          assert p['reviewHead']==os.environ['EXPECTED_BASE']
          assert p['candidateSeedCount']==198
          assert p['candidateSeedCanonicalSha256']==os.environ['CANDIDATE_SEED_CANONICAL']
          assert p['candidateRowsCanonicalSha256']==os.environ['CANDIDATE_ROWS_CANONICAL']
          assert p['trackedTreeExternalCollisionCount']==0
          assert p['repositoryGlobalCollisionCount']==0
          assert p['repositoryGlobalDoubleEnumerationStableAllBatches'] is True
          assert p['retryPolicyBoundToFrozenExec003Recovery'] is True
          assert p['requiredMolAbsParam']=='reptran'
          assert p['reptranPrestageRun']==int(os.environ['PREREQ_REPTRAN_RUN'])
          assert p['reptranCapabilityRun']==int(os.environ['PREREQ_CAP_RUN'])
          assert p['candidateSeedsAppliedToCases'] is False
          assert p['candidateSeedUniverseAllocated'] is False
          assert p['candidateSeedUniverseConsumed'] is False
          assert p['freshExecutionIdentityAllocated'] is False
          assert p['freshExecutionIdentityAuthorized'] is False
          assert p['scientificOrdinalAllocated'] is False
          assert p['scientificExecutionAuthorized'] is False
          assert p['solverExecutionAuthorized'] is False and p['solverExecuted'] is False
          assert p['resultOpeningAuthorized'] is False and p['finiteDiskResultOpened'] is False
          assert p['productionAuthorized'] is False and p['taylorJerusalemUsed'] is False
          f=p['frozenScience']
          assert (f['wavelengthNmFirstStage'],f['configurationCount'],f['directionsPerConfiguration'],f['totalCases'])==(550.0,6,33,198)
          assert f['photonHistoriesPerCase']==5_000_000 and f['futureShardCount']==18 and f['futureCasesPerShard']==11
          assert f['exactMatchingEndCountRequired']==1 and f['duplicateEndRefusalRequired'] is True and f['fullPaginationReleaseBarrierRequired'] is True
          assert f['frozenEvaluatorOnlyAggregateOpening'] is True and f['spectralFollowOnNm']==[450.0,650.0,750.0] and f['spectralFollowOnSeparatelyGoverned'] is True
          ledger=json.load(open('prior-control/exec004-candidate-seed-ledger.json'))
          assert ledger['candidateSeedCount']==198 and len(ledger['candidateSeeds'])==198
          assert len(set(map(int,ledger['candidateSeeds'])))==198
          assert ledger['candidateSeedCanonicalSha256']==os.environ['CANDIDATE_SEED_CANONICAL']
          assert ledger['candidateRowsCanonicalSha256']==os.environ['CANDIDATE_ROWS_CANONICAL']
          assert ledger['freshExecutionIdentity']==os.environ['FRESH_EXECUTION_IDENTITY']
          assert ledger['candidateSeedsAppliedToCases'] is False
          assert ledger['candidateSeedUniverseAllocated'] is False and ledger['candidateSeedUniverseConsumed'] is False
          assert ledger['freshExecutionIdentityAllocated'] is False and ledger['freshExecutionIdentityAuthorized'] is False
          assert ledger['scientificExecutionAuthorized'] is False and ledger['solverExecutionAuthorized'] is False and ledger['solverExecuted'] is False
          seeds=list(map(int,ledger['candidateSeeds']))
          batches=[seeds[:72],seeds[72:144],seeds[144:]+seeds[:18]]
          assert all(len(b)==72 and len(set(b))==72 for b in batches)
          assert set().union(*(set(b) for b in batches))==set(seeds)
          for i,b in enumerate(batches,1):
              open(f'prior-control/exec004-candidate-seed-batch-{i}.json','w').write(json.dumps({'candidateSeeds':b},indent=2,sort_keys=True)+'\n')
          open('prior-control/empty-self-ledger-policy.json','w').write(json.dumps({'schemaVersion':2,'requiredTrackedSelfLedgerPaths':[],'futureEvidenceSelfLedgerPaths':[]},indent=2,sort_keys=True)+'\n')
          print('candidate_seed_count=198')
          print('candidate_seed_literals_disclosed=false')
          PY

      - name: Materialize exact frozen bounded-transport retry helper
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/contents/review/lunar-scattered-light-source-contract-v1/lunar_finite_disk_exec003_transport_recovery.py?ref=$FROZEN_HISTORICAL_HEAD" > auth-evidence/frozen-recovery-helper.json
          test "$(jq -r .sha auth-evidence/frozen-recovery-helper.json)" = "$FROZEN_RECOVERY_HELPER_BLOB"
          jq -r .content auth-evidence/frozen-recovery-helper.json | tr -d '\n' | base64 --decode > auth-evidence/frozen/lunar_finite_disk_exec003_transport_recovery.py
          test "$(git hash-object auth-evidence/frozen/lunar_finite_disk_exec003_transport_recovery.py)" = "$FROZEN_RECOVERY_HELPER_BLOB"

      - name: Require matching live WRITE_QUIET fence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > auth-evidence/issue60-pages.json
          python - <<'PY'
          import json, os, re
          pages=json.load(open('auth-evidence/issue60-pages.json'))
          comments=[r for page in pages for r in page]
          stage=os.environ['FENCE_STAGE']; head=os.environ['EVENT_HEAD']; branch=os.environ['EXPECTED_BRANCH']
          begins=[]; closed=set()
          for r in comments:
              body=str(r.get('body') or '')
              first=body.splitlines()[0] if body else ''
              if f'WRITE_QUIET_BEGIN | {stage}' in first and f'branch={branch}' in body and f'head={head}' in body:
                  begins.append(r)
              if first.startswith('WRITE_QUIET_END'):
                  ids=set()
                  for key in ('begin','beginComment','begin_comment'):
                      ids.update(int(x) for x in re.findall(rf'\b{key}=(\d+)\b', first))
                  if len(ids)>1: raise SystemExit(f'conflicting END header begin ids: {sorted(ids)}')
                  closed.update(ids)
          assert len(begins)==1, (len(begins),'matching begins')
          begin_id=int(begins[0]['id'])
          assert begin_id not in closed, 'matching fence already closed'
          all_begins=[]
          for r in comments:
              first=str(r.get('body') or '').splitlines()[0] if r.get('body') else ''
              if first.startswith('WRITE_QUIET_BEGIN'):
                  all_begins.append(int(r['id']))
          unmatched=[x for x in all_begins if x not in closed]
          assert unmatched==[begin_id], unmatched
          open('auth-evidence/fence-begin-id.txt','w').write(str(begin_id)+'\n')
          print('matching_write_quiet_begin='+str(begin_id))
          PY

      - name: Recheck exact tracked tree for exec004 candidate collisions
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            python experiments/aerosol-family-challenge-v2/tracked_tree_seed_scan.py \
              --repo-root . \
              --file-list auth-evidence/tracked-files.nul \
              --candidate-seed-ledger "prior-control/exec004-candidate-seed-batch-${i}.json" \
              --allow-self-ledger-json prior-control/empty-self-ledger-policy.json \
              --output "auth-evidence/tracked-seed-scan-${i}.json"
          done
          python - <<'PY'
          import json
          for i in range(1,4):
              r=json.load(open(f'auth-evidence/tracked-seed-scan-{i}.json'))
              assert r['candidateSeedCount']==72
              assert r['trackedTreeExternalCollisionCount']==0
              assert r['exactHeadTrackedTreeByteScanPassed'] is True
          PY

      - name: Build retry-and-stability-hardened authorization-time repository-global scanner
        shell: bash
        run: |
          set -euo pipefail
          cat > auth-evidence/exec004_repository_global_seed_scan.py <<'PY'
          from __future__ import annotations
          import importlib.util, os, sys
          from pathlib import Path
          recovery_path=Path('auth-evidence/frozen/lunar_finite_disk_exec003_transport_recovery.py')
          hardening_path=Path('review/lunar-finite-disk-exec004-repository-scan-hardening-v1/repository_global_seed_scan_hardening.py')
          rspec=importlib.util.spec_from_file_location('lunar_fd_exec004_recovery_for_auth_scan_v1', recovery_path)
          if rspec is None or rspec.loader is None: raise SystemExit('cannot import frozen exec003 bounded transport retry helper')
          recovery=importlib.util.module_from_spec(rspec); sys.modules[rspec.name]=recovery; rspec.loader.exec_module(recovery)
          hspec=importlib.util.spec_from_file_location('lunar_fd_exec004_stability_hardening_for_auth_scan_v1', hardening_path)
          if hspec is None or hspec.loader is None: raise SystemExit('cannot import exec004 stability hardening helper')
