name: Lunar finite-disk exec004 REPTRAN science-workflow solver-free review v1

on:
  push:
    branches:
      - review/lunar-finite-disk-exec004-science-workflow-v1
    paths:
      - '.github/workflows/lunar-finite-disk-exec004-science-workflow-review-v1.yml'
      - 'review/lunar-scattered-light-source-contract-v1/lunar_finite_disk_exec004.py'
      - 'review/lunar-scattered-light-source-contract-v1/lunar_mystic_input_exec004_reptran_adapter.py'
      - 'review/lunar-scattered-light-source-contract-v1/lunar-finite-disk-exec004-science-workflow-v1.yml'
      - 'tests/test_lunar_finite_disk_exec004_science_workflow_v1.py'

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

env:
  REVIEW_BASE: 74f70d2d5db29926c5d1833326d3469993cbbdb2
  PUBLIC_MAIN: 48295e390ad8f68e6d0d4d649f1ce2bb57b041d1
  REVIEW_BRANCH: review/lunar-finite-disk-exec004-science-workflow-v1
  PHYSICS_CLASSIFICATION: '5563154463'
  CONTROL_RUN: '34059309664'
  CONTROL_JOB: '101556849327'
  CONTROL_ARTIFACT: '9997398593'
  CONTROL_DIGEST: sha256:2314be605f0c8ed5f1592b36e8cd9801037434d3c9668ec2e1d2b7d287037d70
  CONTROL_PROOF_SHA: 16113b29ee13cb9545e14733b1eefda3fbb641905003d1ab28b713dbd46133ff
  SEED_CANONICAL: 9a29092f1708b3c8c46542967b29471689b9de3b293adadbc16c25410091e585
  ROWS_CANONICAL: 9f6aa730fa7720fd985cfbda55ac49023f90be7de8d5f5bc931ab52aca77aa56
  RECHECK_RUN: '34065544069'
  RECHECK_JOB: '101573540184'
  RECHECK_ARTIFACT: '9999276308'
  RECHECK_DIGEST: sha256:c97196f901fd3dd4004b6cf543b0c6ece2b2dcc1b60b99fc2894a7a05e247ff9
  RECHECK_PROOF_SHA: 0310413267de648fda91c1f0f683651d54ef55786a2e5244de67664260f5750b
  REPTRAN_HEAD: b85a9ea9175bc6c98cbdf3f607ad2b81bb7da823
  REPTRAN_CORE_BLOB: fbbca0e417062b8d82f29c44ad4be92646d1dbd6
  REPTRAN_CONTRACT_BLOB: 71d87a13faa991d97f826f20d19705adc0e5d27b
  REPTRAN_RUN: '34052817182'
  REPTRAN_ARTIFACT: '9995060899'
  REPTRAN_DIGEST: sha256:60e01e40e899e28f65e58c2acb90eac4c893010fab0e7f7782a9c0391ff32c7a
  CAP_HEAD: 9d78567ffb55a2fe187e256a2abaf994aaad453f
  CAP_RUN: '34053349932'
  CAP_JOB: '101540778940'
  CAP_ARTIFACT: '9995224987'
  CAP_DIGEST: sha256:fd906b1060594a6e80884f3847e4fdcc43e8ede7f231d04cfe797fbcf4204e79
  FROZEN_HISTORICAL_HEAD: 5e9a3a0ece29c824912090b00db2bffda11d0804

concurrency:
  group: lunar-finite-disk-exec004-science-workflow-review-${{ github.sha }}
  cancel-in-progress: false

jobs:
  solver-free-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Bind exact fresh five-file review surface and prohibit solver runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = "$REVIEW_BRANCH"
          test "$(git merge-base "$REVIEW_BASE" HEAD)" = "$REVIEW_BASE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$PUBLIC_MAIN"
          git diff --name-only "$REVIEW_BASE"...HEAD | sort > changed-paths.txt
          cat > expected-paths.txt <<'EOF'
          .github/workflows/lunar-finite-disk-exec004-science-workflow-review-v1.yml
          review/lunar-scattered-light-source-contract-v1/lunar-finite-disk-exec004-science-workflow-v1.yml
          review/lunar-scattered-light-source-contract-v1/lunar_finite_disk_exec004.py
          review/lunar-scattered-light-source-contract-v1/lunar_mystic_input_exec004_reptran_adapter.py
          tests/test_lunar_finite_disk_exec004_science_workflow_v1.py
          EOF
          sort -o expected-paths.txt expected-paths.txt
          diff -u expected-paths.txt changed-paths.txt
          test -z "$(command -v uvspec || true)"
          test ! -f review/lunar-scattered-light-source-contract-v1/lunar-finite-disk-transfer-kernel-sensitivity-v1-exec004-authorization.json
          mkdir -p review-evidence control-proof recheck-proof review/lunar-reptran-source-binding-prestage-v1 review/lunar-scattered-light-source-contract-v1/.exec004-frozen-base
      - name: Bind exact independent eligibility and immutable prior artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$PHYSICS_CLASSIFICATION" > review-evidence/physics.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CONTROL_RUN" > review-evidence/control-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CONTROL_RUN/jobs?per_page=100" > review-evidence/control-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CONTROL_ARTIFACT" > review-evidence/control-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECHECK_RUN" > review-evidence/recheck-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECHECK_RUN/jobs?per_page=100" > review-evidence/recheck-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$RECHECK_ARTIFACT" > review-evidence/recheck-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REPTRAN_RUN" > review-evidence/reptran-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$REPTRAN_ARTIFACT" > review-evidence/reptran-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CAP_RUN" > review-evidence/cap-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CAP_RUN/jobs?per_page=100" > review-evidence/cap-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CAP_ARTIFACT" > review-evidence/cap-artifact.json
          python - <<'PY'
          import json,os
          body=str(json.load(open('review-evidence/physics.json')).get('body') or '')
          required=['LUNAR_EXEC004_AUTHORIZATION_TIME_RECHECK_INDEPENDENTLY_CLEAN__TRANSITION_ELIGIBLE_FOR_NEXT_HISTORICAL_SOLVER_FREE_AUTHORIZATION_CONTROL_STEP__SCIENCE_NOT_AUTHORIZED',os.environ['REVIEW_BASE'],os.environ['RECHECK_ARTIFACT'],os.environ['CONTROL_ARTIFACT'],os.environ['REPTRAN_ARTIFACT'],os.environ['CAP_ARTIFACT']]
          assert all(x in body for x in required), [x for x in required if x not in body]
          r=json.load(open('review-evidence/control-run.json')); assert r['id']==int(os.environ['CONTROL_RUN']) and r['run_attempt']==1 and r['conclusion']=='success'
          jobs=json.load(open('review-evidence/control-jobs.json'))['jobs']; assert any(j['id']==int(os.environ['CONTROL_JOB']) and j['conclusion']=='success' for j in jobs)
          a=json.load(open('review-evidence/control-artifact.json')); assert a['id']==int(os.environ['CONTROL_ARTIFACT']) and a['digest']==os.environ['CONTROL_DIGEST'] and not a['expired']
          r=json.load(open('review-evidence/recheck-run.json')); assert r['id']==int(os.environ['RECHECK_RUN']) and r['run_attempt']==1 and r['head_sha']==os.environ['REVIEW_BASE'] and r['conclusion']=='success'
          jobs=json.load(open('review-evidence/recheck-jobs.json'))['jobs']; assert any(j['id']==int(os.environ['RECHECK_JOB']) and j['conclusion']=='success' for j in jobs)
          a=json.load(open('review-evidence/recheck-artifact.json')); assert a['id']==int(os.environ['RECHECK_ARTIFACT']) and a['digest']==os.environ['RECHECK_DIGEST'] and not a['expired']
          rr=json.load(open('review-evidence/reptran-run.json')); assert rr['id']==int(os.environ['REPTRAN_RUN']) and rr['run_attempt']==1 and rr['head_sha']==os.environ['REPTRAN_HEAD'] and rr['conclusion']=='success'
          ra=json.load(open('review-evidence/reptran-artifact.json')); assert ra['id']==int(os.environ['REPTRAN_ARTIFACT']) and ra['digest']==os.environ['REPTRAN_DIGEST'] and not ra['expired']
          cr=json.load(open('review-evidence/cap-run.json')); assert cr['id']==int(os.environ['CAP_RUN']) and cr['run_attempt']==1 and cr['head_sha']==os.environ['CAP_HEAD'] and cr['conclusion']=='success'
          cj=json.load(open('review-evidence/cap-jobs.json'))['jobs']; assert any(j['id']==int(os.environ['CAP_JOB']) and j['conclusion']=='success' for j in cj)
          ca=json.load(open('review-evidence/cap-artifact.json')); assert ca['id']==int(os.environ['CAP_ARTIFACT']) and ca['digest']==os.environ['CAP_DIGEST'] and not ca['expired']
          PY
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ env.CONTROL_ARTIFACT }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.CONTROL_RUN }}
          path: control-proof
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ env.RECHECK_ARTIFACT }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.RECHECK_RUN }}
          path: recheck-proof
          merge-multiple: true
      - name: Materialize exact reviewed REPTRAN core and only required frozen historical runtime bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fetch(){ path="$1"; ref="$2"; out="$3"; expected="${4:-}"; meta=review-evidence/meta-$(echo "$out"|tr '/.' '__').json; gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$ref" > "$meta"; [ -z "$expected" ] || test "$(jq -r .sha "$meta")" = "$expected"; jq -r .content "$meta" | tr -d '\n' | base64 --decode > "$out"; [ -z "$expected" ] || test "$(git hash-object "$out")" = "$expected"; }
          fetch review/lunar-reptran-source-binding-prestage-v1/lunar_mystic_input_reptran.py "$REPTRAN_HEAD" review/lunar-reptran-source-binding-prestage-v1/lunar_mystic_input_reptran.py "$REPTRAN_CORE_BLOB"
          fetch review/lunar-reptran-source-binding-prestage-v1/prestage-contract.json "$REPTRAN_HEAD" review/lunar-reptran-source-binding-prestage-v1/prestage-contract.json "$REPTRAN_CONTRACT_BLOB"
          base=review/lunar-scattered-light-source-contract-v1/.exec004-frozen-base
          for f in lunar_finite_disk_exec002.py lunar_finite_disk_transfer_kernel_sensitivity.py lunar_mystic_computational_precision_runtime.py lunar_mystic_computational_precision.py lunar-mystic-computational-precision-v1.json rolo311g.py; do fetch "review/lunar-scattered-light-source-contract-v1/$f" "$FROZEN_HISTORICAL_HEAD" "$base/$f"; done
          test ! -f "$base/lunar_mystic_input.py"
          test ! -f "$base/libradtran-custom-source-crs-admission-result-v1.json"
      - name: Recompute proof payloads, candidate binding, and solver-free renderer contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          for path,expected,status in [('control-proof/exec004-fresh-seed-control-proof.json',os.environ['CONTROL_PROOF_SHA'],'PASS_LUNAR_FINITE_DISK_EXEC004_FRESH_SEED_GLOBAL_CONTROL_NOT_ALLOCATED_NOT_AUTHORIZED'),('recheck-proof/authorization-recheck-proof.json',os.environ['RECHECK_PROOF_SHA'],'PASS_LUNAR_FINITE_DISK_EXEC004_AUTHORIZATION_TIME_RECHECK_ZERO_RUNTIME_NOT_ALLOCATED_NOT_AUTHORIZED')]:
              p=json.load(open(path)); raw=dict(p); claimed=raw.pop('proofPayloadSha256'); calc=hashlib.sha256(json.dumps(raw,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest(); assert claimed==calc==expected and p['status']==status and p['candidateSeedCount']==198 and p['candidateSeedCanonicalSha256']==os.environ['SEED_CANONICAL'] and p['candidateRowsCanonicalSha256']==os.environ['ROWS_CANONICAL']
          PY
          python review/lunar-scattered-light-source-contract-v1/lunar_finite_disk_exec004.py validate-review > review-evidence/runtime-review-contract.json
          python review/lunar-scattered-light-source-contract-v1/lunar_finite_disk_exec004.py validate-candidate-ledger --candidate-ledger control-proof/exec004-candidate-seed-ledger.json > review-evidence/candidate-ledger-validation.json
          python tests/test_lunar_finite_disk_exec004_science_workflow_v1.py
          python - <<'PY'
          import importlib.util,sys,tempfile
          from pathlib import Path
          p=Path('review/lunar-scattered-light-source-contract-v1/lunar_mystic_input_exec004_reptran_adapter.py'); spec=importlib.util.spec_from_file_location('adapter_review',p); m=importlib.util.module_from_spec(spec); sys.modules[spec.name]=m; spec.loader.exec_module(m)
          with tempfile.TemporaryDirectory() as td:
              root=Path(td); data=root/'data'; data.mkdir(); atm=root/'atm.dat'; atm.write_text('120 1\n10 1\n5 1\n0 1\n'); source=root/'source.dat'; core=m._core(); core.write_lunar_source_file(source,[380.0,550.0,780.0],[1e-6,2e-6,1e-6]); case=root/'case'; case.mkdir()
              text,meta=m.render_lunar_mystic_input(data_dir=data,atmosphere_file=atm,lunar_source_file=source,moon_zenith_deg=30.0,target_altitude_deg=45.0,target_relative_azimuth_to_moon_deg=90.0,observer_elevation_m=0.0,aod550=0.1,albedo=0.15,photon_histories=5_000_000,random_seed=1,case_dir=case,runtime_identity={'uvspecSha256':m.EXPECTED_UVSPEC_SHA256,'libRadtranDataTreeSha256':m.EXPECTED_DATA_SHA256},alis_importance_nm=550.0)
              lines=text.splitlines(); assert lines.count('mol_abs_param reptran')==1 and not any(x.startswith('mol_abs_param crs') for x in lines) and lines.count('mc_spherical 1D')==1 and lines.count('mc_vroom off')==1 and lines.count('mc_spectral_is 550.0')==1 and lines.count('zout 0.000000')==1; assert meta['customSourceReptranConsumptionCapabilityVerified'] is True and meta['productionAuthorized'] is False
          PY
      - name: Freeze exact solver-free review receipt
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os
          files={'workflow':'review/lunar-scattered-light-source-contract-v1/lunar-finite-disk-exec004-science-workflow-v1.yml','runtime':'review/lunar-scattered-light-source-contract-v1/lunar_finite_disk_exec004.py','rendererAdapter':'review/lunar-scattered-light-source-contract-v1/lunar_mystic_input_exec004_reptran_adapter.py'}
          sha={k:hashlib.sha256(open(v,'rb').read()).hexdigest() for k,v in files.items()}
          receipt={'schemaVersion':1,'status':'PASS_LUNAR_FINITE_DISK_EXEC004_REPTRAN_SCIENCE_WORKFLOW_SOLVER_FREE','reviewHead':os.environ['GITHUB_SHA'],'reviewRun':int(os.environ['GITHUB_RUN_ID']),'reviewAttempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'controlArtifact':int(os.environ['CONTROL_ARTIFACT']),'recheckArtifact':int(os.environ['RECHECK_ARTIFACT']),'reptranPrestageArtifact':int(os.environ['REPTRAN_ARTIFACT']),'reptranCapabilityArtifact':int(os.environ['CAP_ARTIFACT']),'candidateSeedCanonicalSha256':os.environ['SEED_CANONICAL'],'candidateRowsCanonicalSha256':os.environ['ROWS_CANONICAL'],'workflowSha256':sha['workflow'],'runtimeSha256':sha['runtime'],'rendererAdapterSha256':sha['rendererAdapter'],'molecularAbsorption':'reptran','historicalCrsFallbackAllowed':False,'candidateSeedUniverseAllocated':False,'candidateSeedsAppliedToCases':False,'scientificExecutionAuthorized':False,'solverRuntimeInstalled':False,'solverExecuted':False,'resultOpened':False,'mandatorySpectralFollowOnNm':[450,650,750],'productionAuthorized':False}
          raw=json.dumps(receipt,sort_keys=True,separators=(',',':'),allow_nan=False).encode(); receipt['reviewReceiptSha256']=hashlib.sha256(raw).hexdigest(); open('review-evidence/science-workflow-exec004-review-receipt.json','w').write(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print('status='+receipt['status']); print('workflow_sha256='+receipt['workflowSha256']); print('runtime_sha256='+receipt['runtimeSha256']); print('renderer_adapter_sha256='+receipt['rendererAdapterSha256'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lunar-finite-disk-exec004-reptran-science-workflow-review-v1
          path: |
            review-evidence/science-workflow-exec004-review-receipt.json
            review-evidence/runtime-review-contract.json
            review-evidence/candidate-ledger-validation.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Claim boundary
        if: always()
        run: |
          echo 'Solver-free review only. No uvspec/libRadtran/MYSTIC execution occurred.'
          echo 'No exec004 allocation, seed application/consumption, ordinal, dispatch, result opening, follow-on wavelength execution, validation, or production authority is created.'
