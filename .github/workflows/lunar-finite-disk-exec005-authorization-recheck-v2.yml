name: Lunar finite-disk exec005 authorization-time recheck v2

on:
  push:
    branches:
      - review/lunar-finite-disk-exec005-authorization-recheck-v2
    paths:
      - '.github/workflows/lunar-finite-disk-exec005-authorization-recheck-v2.yml'
  pull_request:
    types: [opened]
    branches:
      - main
    paths:
      - '.github/workflows/lunar-finite-disk-exec005-authorization-recheck-v2.yml'

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: lunar-finite-disk-exec005-authorization-recheck-v2-${{ github.event_name }}-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

env:
  EXPECTED_BASE: 3f3d134ec6472eb240e810d74a4d9d5c5112ae4c
  EXPECTED_MAIN: 3f3d134ec6472eb240e810d74a4d9d5c5112ae4c
  EXPECTED_BRANCH: review/lunar-finite-disk-exec005-authorization-recheck-v2
  PRIOR_CONTROL_PR: '962'
  PRIOR_CONTROL_HEAD: 55dc3978626642af2efe355c3be6b517c3d05519
  PRIOR_CONTROL_BASE: 48295e390ad8f68e6d0d4d649f1ce2bb57b041d1
  PRIOR_CONTROL_RUN: '34124504036'
  PRIOR_CONTROL_JOB: '101749881047'
  PRIOR_CONTROL_ARTIFACT: '10020881328'
  PRIOR_CONTROL_DIGEST: sha256:da568092d75e6ca9a0b7b9221dcac407aa6dac173a59e0841301c1b5a4885a55
  PRIOR_CONTROL_NAME: lunar-finite-disk-exec005-fresh-seed-control-v1-proof
  PRIOR_CONTROL_PROOF_SHA: e61d60d4dcc1166812ffa3294df77543d6e878c3bb61b841eacbfad48e4dfc10
  CANDIDATE_SEED_CANONICAL: f2621958182e4e6824b1f166a9df0ddfda438431448b2fed68f8cad3a0e27dab
  CANDIDATE_ROWS_CANONICAL: a60ea88d5369a0df2b5119d194730c0998f93cec1b7f6c252083d9df9f2bea21
  FRESH_EXECUTION_IDENTITY: lunar-finite-disk-transfer-kernel-sensitivity-v1-exec005
  FENCE_STAGE: LUNAR_FINITE_DISK_EXEC005_AUTHORIZATION_RECHECK_GLOBAL_SCAN_V2
  TRACKED_SCANNER_BLOB: 1c110d75b516cb7b9d50dc2674080f4a67e55d2a
  BOUND_SCANNER_BLOB: 4c6d704fa24228284780bcb1dd7c52537b4c5b0d
  HARDENING_SOURCE_HEAD: 74f70d2d5db29926c5d1833326d3469993cbbdb2
  HARDENING_HELPER_BLOB: 3f0231314341c326316e8741091e45e34b1ba373
  HARDENING_TEST_BLOB: b40131299f6192a83cbf3ad7023691221d951537
  FROZEN_HISTORICAL_HEAD: 1e4fdba6755d28d998197444dcf994ef39d28d69
  FROZEN_RECOVERY_HELPER_BLOB: bc5f3677f2f0bc9c4824f7e404593834d87577e2
  PHYSICS_CLASSIFICATION_COMMENT: '5571749637'
  RECOVERY_TRANSITION_COMMENT: '5573116714'
  HISTORICAL_BELOW_LINE_END_COMMENT: '5563105177'
  HISTORICAL_OVERMATCH_END_COMMENT: '5472575510'
  PREREQ_REPTRAN_HEAD: b85a9ea9175bc6c98cbdf3f607ad2b81bb7da823
  PREREQ_REPTRAN_RUN: '34052817182'
  PREREQ_REPTRAN_ARTIFACT: '9995060899'
  PREREQ_REPTRAN_DIGEST: sha256:60e01e40e899e28f65e58c2acb90eac4c893010fab0e7f7782a9c0391ff32c7a
  PREREQ_CAP_HEAD: 9d78567ffb55a2fe187e256a2abaf994aaad453f
  PREREQ_CAP_RUN: '34053349932'
  PREREQ_CAP_JOB: '101540778940'
  PREREQ_CAP_ARTIFACT: '9995224987'
  PREREQ_CAP_DIGEST: sha256:fd906b1060594a6e80884f3847e4fdcc43e8ede7f231d04cfe797fbcf4204e79

jobs:
  generic-zero-runtime-exact-head:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate fresh exact-head solver-free control surface
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse "$EXPECTED_BASE")" = "$EXPECTED_BASE"
          test "$(git merge-base "$EXPECTED_BASE" HEAD)" = "$EXPECTED_BASE"
          test "$(git rev-list --count "$EXPECTED_BASE..HEAD")" = 1
          test -z "$(git rev-list --merges "$EXPECTED_BASE..HEAD")"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$EXPECTED_MAIN"
          git diff --name-only "$EXPECTED_BASE"...HEAD > changed-paths.txt
          printf '%s\n' '.github/workflows/lunar-finite-disk-exec005-authorization-recheck-v2.yml' > expected-paths.txt
          diff -u expected-paths.txt changed-paths.txt
          test "$(git hash-object experiments/aerosol-family-challenge-v2/tracked_tree_seed_scan.py)" = "$TRACKED_SCANNER_BLOB"
          test "$(git hash-object experiments/aerosol-family-challenge-v2/repository_global_seed_scan.py)" = "$BOUND_SCANNER_BLOB"
          test -z "$(command -v uvspec || true)"
          mkdir -p generic-evidence/hardening
          for spec in \
            "repository_global_seed_scan_hardening.py:$HARDENING_HELPER_BLOB" \
            "test_repository_global_seed_scan_hardening.py:$HARDENING_TEST_BLOB"; do
            name="${spec%%:*}"; want="${spec##*:}"
            gh api "repos/$GITHUB_REPOSITORY/contents/review/lunar-finite-disk-exec004-repository-scan-hardening-v1/$name?ref=$HARDENING_SOURCE_HEAD" > "generic-evidence/$name.json"
            test "$(jq -r .sha "generic-evidence/$name.json")" = "$want"
            jq -r .content "generic-evidence/$name.json" | tr -d '\n' | base64 --decode > "generic-evidence/hardening/$name"
            test "$(git hash-object "generic-evidence/hardening/$name")" = "$want"
          done
          cp experiments/aerosol-family-challenge-v2/repository_global_seed_scan.py generic-evidence/hardening/../../repository_global_seed_scan.py
          python generic-evidence/hardening/test_repository_global_seed_scan_hardening.py
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$HISTORICAL_BELOW_LINE_END_COMMENT" > generic-evidence/historical-below-line-end.json
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$HISTORICAL_OVERMATCH_END_COMMENT" > generic-evidence/historical-overmatch-end.json
          python - <<'PY'
          import json, os, re
          key_re=re.compile(r'^(begin|beginComment|begin_comment)=(\d+)$')
          marker_re=re.compile(r'(?:^|::)WRITE_QUIET_END(?:\s|\||$)')
          def authoritative_begin(body):
              lines=body.splitlines()
              if not lines or not marker_re.search(lines[0].strip()):
                  return None
              values=[]
              for field in lines[0].split('|')[1:]:
                  m=key_re.fullmatch(field.strip())
                  if m: values.append(int(m.group(2)))
              for raw in lines[1:]:
                  m=key_re.fullmatch(raw.strip())
                  if m: values.append(int(m.group(2)))
              uniq=set(values)
              if len(uniq)!=1:
                  raise RuntimeError(f'END authoritative linkage cardinality={len(uniq)} values={sorted(uniq)}')
              return next(iter(uniq))
          assert authoritative_begin('WRITE_QUIET_END | stage=X | beginComment=123\nstatus=ok') == 123
          assert authoritative_begin('TOTAL_SKY_OWNER::WRITE_QUIET_END | stage=X\nbegin_comment=124\nstatus=ok') == 124
          assert authoritative_begin('WRITE_QUIET_END | stage=X\nbegin=125') == 125
          try: authoritative_begin('WRITE_QUIET_END | stage=X\nbegin=1\nbeginComment=2')
          except RuntimeError: pass
          else: raise SystemExit('conflicting authoritative linkage not rejected')
          try: authoritative_begin('WRITE_QUIET_END | stage=X\nprose beginComment=3')
          except RuntimeError: pass
          else: raise SystemExit('zero authoritative linkage not rejected')
          a=json.load(open('generic-evidence/historical-below-line-end.json'))
          b=json.load(open('generic-evidence/historical-overmatch-end.json'))
          assert int(a['id'])==int(os.environ['HISTORICAL_BELOW_LINE_END_COMMENT'])
          assert authoritative_begin(str(a.get('body') or '')) == 5562775627
          assert int(b['id'])==int(os.environ['HISTORICAL_OVERMATCH_END_COMMENT'])
          assert authoritative_begin(str(b.get('body') or '')) == 5472560826
          body_b=str(b.get('body') or '')
          assert '5463819190' in body_b and '5467489757' in body_b and '5472322006' in body_b
          print('structured_full_end_body_parser_regression=PASS')
          print('historical_below_line_linkage=5562775627')
          print('historical_incidental_reference_ids_ignored=true')
          PY
          echo 'generic_exact_head_zero_runtime_control=PASS'
          echo 'scientific_execution_authorized=false'

  zero-runtime-authorization-recheck:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Bind exact fresh one-file surface and clean prepared head
        shell: bash
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$EVENT_BASE" = "$EXPECTED_BASE"
          test "$EVENT_BRANCH" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test "$(git merge-base "$EXPECTED_BASE" HEAD)" = "$EXPECTED_BASE"
          test "$(git rev-list --count "$EXPECTED_BASE..HEAD")" = 1
          test -z "$(git rev-list --merges "$EXPECTED_BASE..HEAD")"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$EXPECTED_MAIN"
          git diff --name-only "$EXPECTED_BASE"...HEAD > changed-paths.txt
          printf '%s\n' '.github/workflows/lunar-finite-disk-exec005-authorization-recheck-v2.yml' > expected-paths.txt
          diff -u expected-paths.txt changed-paths.txt
          test "$(git hash-object experiments/aerosol-family-challenge-v2/tracked_tree_seed_scan.py)" = "$TRACKED_SCANNER_BLOB"
          test "$(git hash-object experiments/aerosol-family-challenge-v2/repository_global_seed_scan.py)" = "$BOUND_SCANNER_BLOB"
          test -z "$(command -v uvspec || true)"
          mkdir -p auth-evidence/hardening auth-evidence/frozen prior-control
          git ls-files -z > auth-evidence/tracked-files.nul
          for spec in \
            "repository_global_seed_scan_hardening.py:$HARDENING_HELPER_BLOB" \
            "test_repository_global_seed_scan_hardening.py:$HARDENING_TEST_BLOB"; do
            name="${spec%%:*}"; want="${spec##*:}"
            gh api "repos/$GITHUB_REPOSITORY/contents/review/lunar-finite-disk-exec004-repository-scan-hardening-v1/$name?ref=$HARDENING_SOURCE_HEAD" > "auth-evidence/$name.json"
            test "$(jq -r .sha "auth-evidence/$name.json")" = "$want"
            jq -r .content "auth-evidence/$name.json" | tr -d '\n' | base64 --decode > "auth-evidence/hardening/$name"
            test "$(git hash-object "auth-evidence/hardening/$name")" = "$want"
          done
          mkdir -p auth-evidence/experiments/aerosol-family-challenge-v2
          cp experiments/aerosol-family-challenge-v2/repository_global_seed_scan.py auth-evidence/experiments/aerosol-family-challenge-v2/repository_global_seed_scan.py
          (cd auth-evidence && python hardening/test_repository_global_seed_scan_hardening.py)
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$EVENT_HEAD&event=push&per_page=100" > auth-evidence/prepared-push-runs.json
          python - <<'PY'
          import json, os
          data=json.load(open('auth-evidence/prepared-push-runs.json'))
          rows=[r for r in data.get('workflow_runs',[]) if r.get('head_sha')==os.environ['EVENT_HEAD'] and r.get('name')=='Lunar finite-disk exec005 authorization-time recheck v2']
          assert len(rows)==1, [(r.get('id'),r.get('status'),r.get('conclusion')) for r in rows]
          r=rows[0]
          assert r['event']=='push' and r['run_attempt']==1 and r['status']=='completed' and r['conclusion']=='success', r
          open('auth-evidence/prepared-generic-run-id.txt','w').write(str(r['id'])+'\n')
          PY
      - name: Bind candidate control, independent Physics classification, recovery transition, and REPTRAN prerequisites
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PRIOR_CONTROL_PR" > auth-evidence/prior-control-pr.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR_CONTROL_RUN" > auth-evidence/prior-control-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR_CONTROL_RUN/jobs?per_page=100" > auth-evidence/prior-control-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PRIOR_CONTROL_ARTIFACT" > auth-evidence/prior-control-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$PHYSICS_CLASSIFICATION_COMMENT" > auth-evidence/physics-classification.json
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$RECOVERY_TRANSITION_COMMENT" > auth-evidence/recovery-transition.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREREQ_REPTRAN_RUN" > auth-evidence/reptran-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PREREQ_REPTRAN_ARTIFACT" > auth-evidence/reptran-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREREQ_CAP_RUN" > auth-evidence/cap-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREREQ_CAP_RUN/jobs?per_page=100" > auth-evidence/cap-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PREREQ_CAP_ARTIFACT" > auth-evidence/cap-artifact.json
          python - <<'PY'
          import json, os
          pr=json.load(open('auth-evidence/prior-control-pr.json'))
          assert pr['number']==int(os.environ['PRIOR_CONTROL_PR']) and pr['state']=='open' and pr['draft'] is True
          assert pr['head']['sha']==os.environ['PRIOR_CONTROL_HEAD'] and pr['base']['sha']==os.environ['PRIOR_CONTROL_BASE']
          run=json.load(open('auth-evidence/prior-control-run.json'))
          assert run['id']==int(os.environ['PRIOR_CONTROL_RUN']) and run['run_attempt']==1 and run['head_sha']==os.environ['PRIOR_CONTROL_HEAD'] and run['conclusion']=='success'
          jobs=json.load(open('auth-evidence/prior-control-jobs.json'))['jobs']
          assert any(int(j['id'])==int(os.environ['PRIOR_CONTROL_JOB']) and j['conclusion']=='success' for j in jobs)
          art=json.load(open('auth-evidence/prior-control-artifact.json'))
          assert art['id']==int(os.environ['PRIOR_CONTROL_ARTIFACT']) and art['name']==os.environ['PRIOR_CONTROL_NAME'] and art['digest']==os.environ['PRIOR_CONTROL_DIGEST'] and not art['expired']
          pc=json.load(open('auth-evidence/physics-classification.json')); body=str(pc.get('body') or '')
          required=['LUNAR_EXEC005_FRESH_CANDIDATE_FRESHNESS_CONTROL_INDEPENDENTLY_CLEAN__TRANSITION_ELIGIBLE_FOR_AUTHORIZATION_TIME_LIVE_RECHECK__SCIENCE_NOT_AUTHORIZED',os.environ['PRIOR_CONTROL_HEAD'],os.environ['PRIOR_CONTROL_ARTIFACT'],os.environ['PRIOR_CONTROL_DIGEST'],os.environ['CANDIDATE_SEED_CANONICAL'],os.environ['CANDIDATE_ROWS_CANONICAL'],os.environ['PRIOR_CONTROL_PROOF_SHA']]
          assert int(pc['id'])==int(os.environ['PHYSICS_CLASSIFICATION_COMMENT']) and all(x in body for x in required), [x for x in required if x not in body]
          rt=json.load(open('auth-evidence/recovery-transition.json')); rbody=str(rt.get('body') or '')
          rrequired=['LUNAR_EXEC005_AUTHORIZATION_RECHECK_V2_FRESH_ZERO_RUNTIME_RECOVERY_AUTHORIZED__SCIENCE_NOT_AUTHORIZED','dd12f5516601eae4d1cbf12479bbf40cff773942','34135681470','5573023942',os.environ['PRIOR_CONTROL_HEAD']]
          assert int(rt['id'])==int(os.environ['RECOVERY_TRANSITION_COMMENT']) and all(x in rbody for x in rrequired), [x for x in rrequired if x not in rbody]
          rr=json.load(open('auth-evidence/reptran-run.json')); ra=json.load(open('auth-evidence/reptran-artifact.json'))
          assert rr['id']==int(os.environ['PREREQ_REPTRAN_RUN']) and rr['run_attempt']==1 and rr['head_sha']==os.environ['PREREQ_REPTRAN_HEAD'] and rr['conclusion']=='success'
          assert ra['id']==int(os.environ['PREREQ_REPTRAN_ARTIFACT']) and ra['digest']==os.environ['PREREQ_REPTRAN_DIGEST'] and not ra['expired']
          cr=json.load(open('auth-evidence/cap-run.json')); cj=json.load(open('auth-evidence/cap-jobs.json'))['jobs']; ca=json.load(open('auth-evidence/cap-artifact.json'))
          assert cr['id']==int(os.environ['PREREQ_CAP_RUN']) and cr['run_attempt']==1 and cr['head_sha']==os.environ['PREREQ_CAP_HEAD'] and cr['conclusion']=='success'
          assert any(int(j['id'])==int(os.environ['PREREQ_CAP_JOB']) and j['conclusion']=='success' for j in cj)
          assert ca['id']==int(os.environ['PREREQ_CAP_ARTIFACT']) and ca['digest']==os.environ['PREREQ_CAP_DIGEST'] and not ca['expired']
          PY
      - name: Bind exact exec005 candidate artifact without seed disclosure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$PRIOR_CONTROL_RUN" -n "$PRIOR_CONTROL_NAME" --dir prior-control
          test -f prior-control/exec005-fresh-seed-control-proof.json
          test -f prior-control/exec005-candidate-seed-ledger.json
          python - <<'PY'
          import hashlib, json, os
          p=json.load(open('prior-control/exec005-fresh-seed-control-proof.json'))
          raw=dict(p); claimed=raw.pop('proofPayloadSha256')
          calc=hashlib.sha256(json.dumps(raw,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
          assert claimed==calc==os.environ['PRIOR_CONTROL_PROOF_SHA']
          assert p['status']=='PASS_LUNAR_FINITE_DISK_EXEC005_FRESH_SEED_GLOBAL_CONTROL_NOT_ALLOCATED_NOT_AUTHORIZED'
          assert p['reviewHead']==os.environ['PRIOR_CONTROL_HEAD'] and p['candidateSeedCount']==198
          assert p['candidateSeedCanonicalSha256']==os.environ['CANDIDATE_SEED_CANONICAL'] and p['candidateRowsCanonicalSha256']==os.environ['CANDIDATE_ROWS_CANONICAL']
          assert p['trackedTreeExternalCollisionCount']==0 and p['repositoryGlobalCollisionCount']==0 and p['repositoryGlobalDoubleEnumerationStableAllBatches'] is True
          assert p['requiredMolAbsParam']=='reptran' and p['candidateSeedsAppliedToCases'] is False and p['candidateSeedUniverseAllocated'] is False and p['candidateSeedUniverseConsumed'] is False
          assert p['freshExecutionIdentityAllocated'] is False and p['freshExecutionIdentityAuthorized'] is False and p['scientificOrdinalAllocated'] is False and p['dispatchCreated'] is False
          assert p['solverExecutionAuthorized'] is False and p['solverExecuted'] is False and p['resultOpeningAuthorized'] is False and p['finiteDiskResultOpened'] is False and p['productionAuthorized'] is False
          f=p['frozenScience']; assert (f['wavelengthNmFirstStage'],f['configurationCount'],f['directionsPerConfiguration'],f['totalCases'])==(550.0,6,33,198)
          assert f['photonHistoriesPerCase']==5000000 and f['futureShardCount']==18 and f['futureCasesPerShard']==11
          assert f['spectralFollowOnNm']==[450.0,650.0,750.0] and f['spectralFollowOnSeparatelyGoverned'] is True and f['duplicateEndRefusalRequired'] is True and f['exactMatchingEndCountRequired']==1 and f['fullPaginationReleaseBarrierRequired'] is True and f['frozenEvaluatorOnlyAggregateOpening'] is True
          ledger=json.load(open('prior-control/exec005-candidate-seed-ledger.json'))
          assert ledger['candidateSeedCount']==198 and len(ledger['candidateSeeds'])==198 and len(set(map(int,ledger['candidateSeeds'])))==198
          assert ledger['candidateSeedCanonicalSha256']==os.environ['CANDIDATE_SEED_CANONICAL'] and ledger['candidateRowsCanonicalSha256']==os.environ['CANDIDATE_ROWS_CANONICAL'] and ledger['freshExecutionIdentity']==os.environ['FRESH_EXECUTION_IDENTITY']
          for key in ('candidateSeedsAppliedToCases','candidateSeedUniverseAllocated','candidateSeedUniverseConsumed','freshExecutionIdentityAllocated','freshExecutionIdentityAuthorized','scientificExecutionAuthorized','solverExecutionAuthorized','solverExecuted','resultOpeningAuthorized','finiteDiskResultOpened','productionAuthorized'): assert ledger[key] is False, key
          seeds=list(map(int,ledger['candidateSeeds'])); batches=[seeds[:72],seeds[72:144],seeds[144:]+seeds[:18]]
          assert all(len(b)==72 and len(set(b))==72 for b in batches) and set().union(*(set(b) for b in batches))==set(seeds)
          for i,b in enumerate(batches,1): open(f'prior-control/exec005-candidate-seed-batch-{i}.json','w').write(json.dumps({'candidateSeeds':b},indent=2,sort_keys=True)+'\n')
          open('prior-control/empty-self-ledger-policy.json','w').write(json.dumps({'schemaVersion':2,'requiredTrackedSelfLedgerPaths':[],'futureEvidenceSelfLedgerPaths':[]},indent=2,sort_keys=True)+'\n')
          print('candidate_seed_count=198'); print('candidate_seed_literals_disclosed=false')
          PY
      - name: Materialize frozen bounded retry helper
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/contents/review/lunar-scattered-light-source-contract-v1/lunar_finite_disk_exec003_transport_recovery.py?ref=$FROZEN_HISTORICAL_HEAD" > auth-evidence/frozen-recovery.json
          test "$(jq -r .sha auth-evidence/frozen-recovery.json)" = "$FROZEN_RECOVERY_HELPER_BLOB"
          jq -r .content auth-evidence/frozen-recovery.json | tr -d '\n' | base64 --decode > auth-evidence/frozen/lunar_finite_disk_exec003_transport_recovery.py
          test "$(git hash-object auth-evidence/frozen/lunar_finite_disk_exec003_transport_recovery.py)" = "$FROZEN_RECOVERY_HELPER_BLOB"
      - name: Require sole matching live WRITE_QUIET fence with structured full-END-body parser
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > auth-evidence/issue60-pages.json
          python - <<'PY'
          import json, os, re
          comments=[r for page in json.load(open('auth-evidence/issue60-pages.json')) for r in page]
          stage=os.environ['FENCE_STAGE']; head=os.environ['EVENT_HEAD']; branch=os.environ['EXPECTED_BRANCH']
          key_re=re.compile(r'^(begin|beginComment|begin_comment)=(\d+)$')
          marker_re=re.compile(r'(?:^|::)WRITE_QUIET_END(?:\s|\||$)')
