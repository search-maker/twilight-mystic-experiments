          stage=os.environ['FENCE_STAGE']; head=os.environ['EVENT_HEAD']; branch=os.environ['EXPECTED_BRANCH']
          # EXEC005_V3_PARSER_SOURCE_BEGIN
          import re
          _key_any_re=re.compile(r'^(begin|beginComment|begin_comment)=(.*)$')
          _key_decimal_re=re.compile(r'^(begin|beginComment|begin_comment)=(\d+)$')
