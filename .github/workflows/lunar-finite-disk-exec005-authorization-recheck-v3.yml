name: Lunar finite-disk exec005 authorization-time recheck v3

on:
  push:
    branches:
      - review/lunar-finite-disk-exec005-authorization-recheck-v3
    paths:
      - '.github/workflows/lunar-finite-disk-exec005-authorization-recheck-v3.yml'
  pull_request:
    types: [opened]
    branches:
      - main
    paths:
      - '.github/workflows/lunar-finite-disk-exec005-authorization-recheck-v3.yml'

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: lunar-finite-disk-exec005-authorization-recheck-v3-${{ github.event_name }}-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

env:
  EXPECTED_BASE: 30930aa2d3da9c6fa789d27cea96d4d6319a17cc
  EXPECTED_MAIN: 30930aa2d3da9c6fa789d27cea96d4d6319a17cc
  EXPECTED_BRANCH: review/lunar-finite-disk-exec005-authorization-recheck-v3
  WORKFLOW_PATH: .github/workflows/lunar-finite-disk-exec005-authorization-recheck-v3.yml
  MAIN_PUSH_CI_RUN: '34159575903'
  PRIOR_CONTROL_PR: '962'
  PRIOR_CONTROL_HEAD: 55dc3978626642af2efe355c3be6b517c3d05519
  PRIOR_CONTROL_BASE: 48295e390ad8f68e6d0d4d649f1ce2bb57b041d1
  PRIOR_CONTROL_RUN: '34124504036'
  PRIOR_CONTROL_JOB: '101749881047'
  PRIOR_CONTROL_ARTIFACT: '10020881328'
  PRIOR_CONTROL_DIGEST: sha256:da568092d75e6ca9a0b7b9221dcac407aa6dac173a59e0841301c1b5a4885a55
  PRIOR_CONTROL_NAME: lunar-finite-disk-exec005-fresh-seed-control-v1-proof
  PRIOR_CONTROL_PROOF_SHA: e61d60d4dcc1166812ffa3294df77543d6e878c3bb61b841eacbfad48e4dfc10
  CANDIDATE_SEED_CANONICAL: f2621958182e4e6824b1f166a9df0ddfda438431448b2fed68f8cad3a0e27dab
  CANDIDATE_ROWS_CANONICAL: a60ea88d5369a0df2b5119d194730c0998f93cec1b7f6c252083d9df9f2bea21
  FRESH_EXECUTION_IDENTITY: lunar-finite-disk-transfer-kernel-sensitivity-v1-exec005
  FENCE_STAGE: LUNAR_FINITE_DISK_EXEC005_AUTHORIZATION_RECHECK_GLOBAL_SCAN_V3
  TRACKED_SCANNER_BLOB: 1c110d75b516cb7b9d50dc2674080f4a67e55d2a
  BOUND_SCANNER_BLOB: 4c6d704fa24228284780bcb1dd7c52537b4c5b0d
  HARDENING_SOURCE_HEAD: 74f70d2d5db29926c5d1833326d3469993cbbdb2
  HARDENING_HELPER_BLOB: 3f0231314341c326316e8741091e45e34b1ba373
  HARDENING_TEST_BLOB: b40131299f6192a83cbf3ad7023691221d951537
  FROZEN_HISTORICAL_HEAD: 1e4fdba6755d28d998197444dcf994ef39d28d69
  FROZEN_RECOVERY_HELPER_BLOB: bc5f3677f2f0bc9c4824f7e404593834d87577e2
  CANDIDATE_PHYSICS_COMMENT: '5571749637'
  V2_DEFECT_PHYSICS_COMMENT: '5575247484'
  RECOVERY_TRANSITION_COMMENT: '5575371232'
  HISTORICAL_LEGACY_END_COMMENT: '5471174859'
  HISTORICAL_BELOW_LINE_END_COMMENT: '5563105177'
  HISTORICAL_OVERMATCH_END_COMMENT: '5472575510'
  CURRENT_TOTAL_SKY_END_COMMENT: '5573638267'
  CORRECTION_PREDECESSOR_END: '5467858336'
  CORRECTION_CANONICAL_END: '5467875147'
  CORRECTION_BEGIN: '5467776090'
  PREREQ_REPTRAN_HEAD: b85a9ea9175bc6c98cbdf3f607ad2b81bb7da823
  PREREQ_REPTRAN_RUN: '34052817182'
  PREREQ_REPTRAN_ARTIFACT: '9995060899'
  PREREQ_REPTRAN_DIGEST: sha256:60e01e40e899e28f65e58c2acb90eac4c893010fab0e7f7782a9c0391ff32c7a
  PREREQ_CAP_HEAD: 9d78567ffb55a2fe187e256a2abaf994aaad453f
  PREREQ_CAP_RUN: '34053349932'
  PREREQ_CAP_JOB: '101540778940'
  PREREQ_CAP_ARTIFACT: '9995224987'
  PREREQ_CAP_DIGEST: sha256:fd906b1060594a6e80884f3847e4fdcc43e8ede7f231d04cfe797fbcf4204e79

jobs:
  generic-zero-runtime-exact-head-and-stress:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate fresh exact-head solver-free control surface
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse "$EXPECTED_BASE")" = "$EXPECTED_BASE"
          test "$(git merge-base "$EXPECTED_BASE" HEAD)" = "$EXPECTED_BASE"
          test "$(git rev-list --count "$EXPECTED_BASE..HEAD")" = 1
          test -z "$(git rev-list --merges "$EXPECTED_BASE..HEAD")"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$EXPECTED_MAIN"
          git diff --name-only "$EXPECTED_BASE"...HEAD > changed-paths.txt
          printf '%s\n' "$WORKFLOW_PATH" > expected-paths.txt
          diff -u expected-paths.txt changed-paths.txt
          test "$(git hash-object experiments/aerosol-family-challenge-v2/tracked_tree_seed_scan.py)" = "$TRACKED_SCANNER_BLOB"
          test "$(git hash-object experiments/aerosol-family-challenge-v2/repository_global_seed_scan.py)" = "$BOUND_SCANNER_BLOB"
          test -z "$(command -v uvspec || true)"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$MAIN_PUSH_CI_RUN" > main-push-ci.json
          python - <<'PY'
          import json, os
          r=json.load(open('main-push-ci.json'))
          assert r['id']==int(os.environ['MAIN_PUSH_CI_RUN'])
          assert r['head_sha']==os.environ['EXPECTED_MAIN'] and r['event']=='push' and r['run_attempt']==1
          assert r['status']=='completed' and r['conclusion']=='success', (r['status'],r['conclusion'])
          PY
      - name: Materialize exact non-science prerequisites for stress
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p generic-evidence/stale prior-control
          printf 'must-be-removed\n' > generic-evidence/stale/sentinel.txt
          rm -rf generic-evidence prior-control
          mkdir -p generic-evidence/hardening generic-evidence/frozen prior-control
          test ! -e generic-evidence/stale/sentinel.txt
          for spec in \
            "repository_global_seed_scan_hardening.py:$HARDENING_HELPER_BLOB" \
            "test_repository_global_seed_scan_hardening.py:$HARDENING_TEST_BLOB"; do
            name="${spec%%:*}"; want="${spec##*:}"
            gh api "repos/$GITHUB_REPOSITORY/contents/review/lunar-finite-disk-exec004-repository-scan-hardening-v1/$name?ref=$HARDENING_SOURCE_HEAD" > "generic-evidence/$name.json"
            test "$(jq -r .sha "generic-evidence/$name.json")" = "$want"
            jq -r .content "generic-evidence/$name.json" | tr -d '\n' | base64 --decode > "generic-evidence/hardening/$name"
            test "$(git hash-object "generic-evidence/hardening/$name")" = "$want"
          done
          mkdir -p generic-evidence/experiments/aerosol-family-challenge-v2
          cp experiments/aerosol-family-challenge-v2/repository_global_seed_scan.py generic-evidence/experiments/aerosol-family-challenge-v2/repository_global_seed_scan.py
          (cd generic-evidence && python hardening/test_repository_global_seed_scan_hardening.py)
          gh api "repos/$GITHUB_REPOSITORY/contents/review/lunar-scattered-light-source-contract-v1/lunar_finite_disk_exec003_transport_recovery.py?ref=$FROZEN_HISTORICAL_HEAD" > generic-evidence/frozen-recovery.json
          test "$(jq -r .sha generic-evidence/frozen-recovery.json)" = "$FROZEN_RECOVERY_HELPER_BLOB"
          jq -r .content generic-evidence/frozen-recovery.json | tr -d '\n' | base64 --decode > generic-evidence/frozen/lunar_finite_disk_exec003_transport_recovery.py
          test "$(git hash-object generic-evidence/frozen/lunar_finite_disk_exec003_transport_recovery.py)" = "$FROZEN_RECOVERY_HELPER_BLOB"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > generic-evidence/issue60-pages.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PRIOR_CONTROL_PR" > generic-evidence/prior-control-pr.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR_CONTROL_RUN" > generic-evidence/prior-control-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR_CONTROL_RUN/jobs?per_page=100" > generic-evidence/prior-control-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PRIOR_CONTROL_ARTIFACT" > generic-evidence/prior-control-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CANDIDATE_PHYSICS_COMMENT" > generic-evidence/candidate-physics.json
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$V2_DEFECT_PHYSICS_COMMENT" > generic-evidence/v2-defect-physics.json
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$RECOVERY_TRANSITION_COMMENT" > generic-evidence/recovery-transition.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREREQ_REPTRAN_RUN" > generic-evidence/reptran-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PREREQ_REPTRAN_ARTIFACT" > generic-evidence/reptran-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREREQ_CAP_RUN" > generic-evidence/cap-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREREQ_CAP_RUN/jobs?per_page=100" > generic-evidence/cap-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PREREQ_CAP_ARTIFACT" > generic-evidence/cap-artifact.json
          gh run download "$PRIOR_CONTROL_RUN" -n "$PRIOR_CONTROL_NAME" --dir prior-control
      - name: EXACT_EXECUTABLE_STRESS_PASS on actual successor bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, re, textwrap
          from pathlib import Path
          errors=[]
          def check(cond,msg):
              if not cond: errors.append(msg)
          wf=Path(os.environ['WORKFLOW_PATH']).read_text()
          begin_marker='# EXEC005_V3_PARSER_SOURCE_'+'BEGIN'
          end_marker='# EXEC005_V3_PARSER_SOURCE_'+'END'
          check(begin_marker in wf and end_marker in wf,'actual parser source sentinels missing')
          try:
              raw=wf.split(begin_marker,1)[1].split(end_marker,1)[0]
              lines=raw.splitlines()
              source='\n'.join((line[10:] if line.startswith('          ') else line) for line in lines)
              ns={}; exec(source,ns)
              authoritative_begin=ns['authoritative_begin']; canonical_end_records=ns['canonical_end_records']
          except Exception as exc:
              errors.append('actual parser extraction/exec failed: '+repr(exc))
              authoritative_begin=lambda body: (_ for _ in ()).throw(RuntimeError('parser unavailable'))
              canonical_end_records=lambda rows: rows
          pages=json.load(open('generic-evidence/issue60-pages.json'))
          comments=[r for page in pages for r in page]
          byid={int(r['id']):r for r in comments}
          fixtures=[
              (int(os.environ['HISTORICAL_LEGACY_END_COMMENT']),5471141095,'legacy-space-header'),
              (int(os.environ['HISTORICAL_BELOW_LINE_END_COMMENT']),5562775627,'structured-below-line'),
              (int(os.environ['HISTORICAL_OVERMATCH_END_COMMENT']),5472560826,'structured-incidental-prose-ignore'),
              (int(os.environ['CURRENT_TOTAL_SKY_END_COMMENT']),5573615763,'current-structured-marker')]
          for cid,want,label in fixtures:
              try: got=authoritative_begin(str(byid[cid].get('body') or '')); check(got==want,f'{label}: got={got} want={want}')
              except Exception as exc: errors.append(f'{label}: {exc!r}')
          bad=[
              ('WRITE_QUIET_END begin=1 beginComment=2 token=x','conflicting legacy accepted IDs'),
              ('WRITE_QUIET_END begin=abc token=x','nondecimal legacy accepted key'),
              ('WRITE_QUIET_END token=x\nprose `begin=3` only','prose/backtick-only linkage')]
          for body,label in bad:
              try:
                  authoritative_begin(body)
                  errors.append(label+' was not rejected')
              except Exception: pass
          try:
              pred=byid[int(os.environ['CORRECTION_PREDECESSOR_END'])]; canon=byid[int(os.environ['CORRECTION_CANONICAL_END'])]
              check(authoritative_begin(str(pred.get('body') or ''))==int(os.environ['CORRECTION_BEGIN']),'correction predecessor begin mismatch')
              check(authoritative_begin(str(canon.get('body') or ''))==int(os.environ['CORRECTION_BEGIN']),'correction canonical begin mismatch')
              normalized=canonical_end_records(comments)
              nids={int(r['id']) for r in normalized}
              check(int(os.environ['CORRECTION_PREDECESSOR_END']) not in nids,'superseded END not removed')
              check(int(os.environ['CORRECTION_CANONICAL_END']) in nids,'canonical corrected END missing')
          except Exception as exc: errors.append('corrected/superseded END handling: '+repr(exc))
          try:
              normalized=canonical_end_records(comments)
              end_counts={}; parse_errors=[]
              marker_re=re.compile(r'(?:^|::)WRITE_QUIET_END(?:\s|\||$)')
              for r in normalized:
                  body=str(r.get('body') or ''); first=body.splitlines()[0].strip() if body.splitlines() else ''
                  if marker_re.search(first):
                      try: x=authoritative_begin(body); end_counts[x]=end_counts.get(x,0)+1
                      except Exception as exc: parse_errors.append((int(r['id']),str(exc)))
              check(not parse_errors,'full-ledger END parse errors: '+repr(parse_errors[:20]))
              duplicates={k:v for k,v in end_counts.items() if v>1}
              check(not duplicates,'full-ledger duplicate END linkage after exact correction normalization: '+repr(duplicates))
              all_begins=[int(r['id']) for r in comments if str(r.get('body') or '').splitlines() and 'WRITE_QUIET_BEGIN' in str(r.get('body') or '').splitlines()[0]]
              unmatched=[x for x in all_begins if end_counts.get(x,0)==0]
              check(not unmatched,'full-ledger unmatched BEGINs before V3 fence: '+repr(unmatched))
          except Exception as exc: errors.append('complete-ledger diagnostic: '+repr(exc))
          try:
              pr=json.load(open('generic-evidence/prior-control-pr.json')); run=json.load(open('generic-evidence/prior-control-run.json')); jobs=json.load(open('generic-evidence/prior-control-jobs.json'))['jobs']; art=json.load(open('generic-evidence/prior-control-artifact.json'))
              check(pr['number']==int(os.environ['PRIOR_CONTROL_PR']) and pr['head']['sha']==os.environ['PRIOR_CONTROL_HEAD'],'prior-control PR binding drift')
              check(run['id']==int(os.environ['PRIOR_CONTROL_RUN']) and run['run_attempt']==1 and run['conclusion']=='success','prior-control run binding drift')
              check(any(int(j['id'])==int(os.environ['PRIOR_CONTROL_JOB']) and j['conclusion']=='success' for j in jobs),'prior-control job missing/success drift')
              check(art['id']==int(os.environ['PRIOR_CONTROL_ARTIFACT']) and art['digest']==os.environ['PRIOR_CONTROL_DIGEST'] and not art['expired'],'prior-control artifact digest/expiry drift')
              required_files=['exec005-fresh-seed-control-proof.json','exec005-candidate-seed-ledger.json']
              for name in required_files: check(Path('prior-control',name).is_file(),'artifact replay missing '+name)
              p=json.load(open('prior-control/exec005-fresh-seed-control-proof.json')); raw=dict(p); claimed=raw.pop('proofPayloadSha256'); calc=hashlib.sha256(json.dumps(raw,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
              check(claimed==calc==os.environ['PRIOR_CONTROL_PROOF_SHA'],'candidate proof payload hash mismatch')
              ledger=json.load(open('prior-control/exec005-candidate-seed-ledger.json')); seeds=list(map(int,ledger['candidateSeeds']))
              check(len(seeds)==198 and len(set(seeds))==198,'candidate cardinality/uniqueness mismatch')
              check(ledger['candidateSeedCanonicalSha256']==os.environ['CANDIDATE_SEED_CANONICAL'],'candidate seed canonical drift')
              check(ledger['candidateRowsCanonicalSha256']==os.environ['CANDIDATE_ROWS_CANONICAL'],'candidate row canonical drift')
              for key in ('candidateSeedsAppliedToCases','candidateSeedUniverseAllocated','candidateSeedUniverseConsumed','freshExecutionIdentityAllocated','freshExecutionIdentityAuthorized','scientificExecutionAuthorized','solverExecutionAuthorized','solverExecuted','resultOpeningAuthorized','finiteDiskResultOpened','productionAuthorized'):
                  check(ledger.get(key) is False,'candidate ledger authority drift '+key)
              batches=[seeds[:72],seeds[72:144],seeds[144:]+seeds[:18]]
              check(all(len(b)==72 and len(set(b))==72 for b in batches),'72-seed batch cardinality mismatch')
              check(set().union(*(set(b) for b in batches))==set(seeds),'candidate batch union mismatch')
          except Exception as exc: errors.append('artifact/replay/cardinality diagnostic: '+repr(exc))
          try:
              pc=json.load(open('generic-evidence/candidate-physics.json')); v2=json.load(open('generic-evidence/v2-defect-physics.json')); rt=json.load(open('generic-evidence/recovery-transition.json'))
              check('LUNAR_EXEC005_FRESH_CANDIDATE_FRESHNESS_CONTROL_INDEPENDENTLY_CLEAN' in str(pc.get('body') or ''),'candidate Physics classification missing')
              check('LEGACY_SPACE_DELIMITED_END_HEADER_COMPATIBILITY_MISSING' in str(v2.get('body') or ''),'V2 defect Physics classification missing')
              check('FRESH ZERO-RUNTIME V3 SUCCESSOR AUTHORIZED' in str(rt.get('body') or ''),'V3 recovery transition text missing')
              rr=json.load(open('generic-evidence/reptran-run.json')); ra=json.load(open('generic-evidence/reptran-artifact.json')); cr=json.load(open('generic-evidence/cap-run.json')); cj=json.load(open('generic-evidence/cap-jobs.json'))['jobs']; ca=json.load(open('generic-evidence/cap-artifact.json'))
              check(rr['id']==int(os.environ['PREREQ_REPTRAN_RUN']) and rr['head_sha']==os.environ['PREREQ_REPTRAN_HEAD'] and rr['conclusion']=='success','REPTRAN prestage drift')
              check(ra['id']==int(os.environ['PREREQ_REPTRAN_ARTIFACT']) and ra['digest']==os.environ['PREREQ_REPTRAN_DIGEST'] and not ra['expired'],'REPTRAN prestage artifact drift')
              check(cr['id']==int(os.environ['PREREQ_CAP_RUN']) and cr['head_sha']==os.environ['PREREQ_CAP_HEAD'] and cr['conclusion']=='success','REPTRAN capability drift')
              check(any(int(j['id'])==int(os.environ['PREREQ_CAP_JOB']) and j['conclusion']=='success' for j in cj),'REPTRAN capability job drift')
              check(ca['id']==int(os.environ['PREREQ_CAP_ARTIFACT']) and ca['digest']==os.environ['PREREQ_CAP_DIGEST'] and not ca['expired'],'REPTRAN capability artifact drift')
          except Exception as exc: errors.append('prerequisite binding diagnostic: '+repr(exc))
          required_receipt_tokens=['PASS_LUNAR_FINITE_DISK_EXEC005_AUTHORIZATION_TIME_RECHECK_V3_ZERO_RUNTIME_NOT_ALLOCATED_NOT_AUTHORIZED','candidateSeedUniverseAllocated','candidateSeedUniverseConsumed','scientificExecutionAuthorized','solverExecutionAuthorized','solverExecuted','resultOpeningAuthorized','finiteDiskResultOpened','productionAuthorized','legacySpaceDelimitedEndFallback','knownCorrectedEndCanonicalization']
          for token in required_receipt_tokens: check(token in wf,'receipt schema token missing: '+token)
          check('rm -rf auth-evidence prior-control' in wf,'protected stale-workspace cleanup missing')
          protected=wf.split('\n  zero-runtime-authorization-recheck:\n',1)[1] if '\n  zero-runtime-authorization-recheck:\n' in wf else ''
          check(bool(protected),'protected job section missing from actual workflow bytes')
          suspicious=[]
          risk_tokens=('subprocess'+'.','os.'+'system(','P'+'open(','shell'+'=True','docker'+' run','apt-get'+' install')
          for n,line in enumerate(protected.splitlines(),1):
              s=line.strip()
              if 'uvspec' in s and 'command -v uvspec' not in s and not s.startswith("echo '"): suspicious.append((n,s))
              if any(x in s for x in risk_tokens): suspicious.append((n,s))
          check(not suspicious,'hidden solver/runtime-risk tokens: '+repr(suspicious))
          report={'schemaVersion':1,'status':'PASS_EXACT_EXECUTABLE_STRESS_PASS' if not errors else 'FAIL_EXACT_EXECUTABLE_STRESS_PASS','actualWorkflowPath':os.environ['WORKFLOW_PATH'],'actualHead':os.environ['GITHUB_SHA'],'actualRef':os.environ['GITHUB_REF'],'actualBase':os.environ['EXPECTED_BASE'],'completeIssue60CommentCount':len(comments),'candidateSeedCount':198,'candidateSeedLiteralsDisclosed':False,'solverRuntimeExecuted':False,'scientificExecutionAuthorized':False,'errors':errors}
          Path('generic-evidence/exact-executable-stress-report.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print('status='+report['status']); print('diagnostic_error_count='+str(len(errors))); print('candidate_seed_literals_disclosed=false'); print('scientific_execution_authorized=false')
          for e in errors: print('DIAGNOSTIC_DEFECT: '+e)
          if errors: raise SystemExit(2)
          PY
      - name: Upload non-authorizing exact executable stress evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lunar-finite-disk-exec005-authorization-recheck-v3-stress
          path: |
            generic-evidence/exact-executable-stress-report.json
            generic-evidence/issue60-pages.json
            generic-evidence/prior-control-artifact.json
            generic-evidence/candidate-physics.json
            generic-evidence/v2-defect-physics.json
            generic-evidence/recovery-transition.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Generic boundary
        if: always()
        run: |
          echo 'NON_AUTHORIZING EXACT_EXECUTABLE_STRESS_PASS only.'
          echo 'No seed allocation/application/consumption, no scientific ordinal/dispatch, no solver or result opening.'

  zero-runtime-authorization-recheck:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Bind exact fresh one-file surface and clean prepared head
        shell: bash
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf auth-evidence prior-control
          mkdir -p auth-evidence/hardening auth-evidence/frozen prior-control
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$EVENT_BASE" = "$EXPECTED_BASE"
          test "$EVENT_BRANCH" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test "$(git merge-base "$EXPECTED_BASE" HEAD)" = "$EXPECTED_BASE"
          test "$(git rev-list --count "$EXPECTED_BASE..HEAD")" = 1
