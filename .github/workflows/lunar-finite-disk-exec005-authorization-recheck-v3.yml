              if len(legacy_ids)!=1: raise ValueError(f'legacy END linkage identity cardinality={len(legacy_ids)} values={legacy_ids}')
              return legacy_ids[0]
          def _pipe_fields(body):
              first=(body.splitlines()[0].strip() if body.splitlines() else '')
              out={}
              for field in first.split('|')[1:]:
                  token=field.strip()
                  if '=' in token:
                      k,v=token.split('=',1); out[k.strip()]=v.strip()
              return out
