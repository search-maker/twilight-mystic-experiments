          _marker_token_re=re.compile(r'(?:^|::)WRITE_QUIET_END$')
          _correction_predecessor=5467858336
          _correction_canonical=5467875147
          _correction_begin=5467776090
          def authoritative_begin(body):
              lines=body.splitlines()
              if not lines or not _marker_re.search(lines[0].strip()):
                  return None
              first=lines[0].strip(); structured=[]
              for field in first.split('|')[1:]:
