name: Lunar finite-disk exec005 authorization-time recheck v5r1

on:
  push:
    branches:
      - review/lunar-finite-disk-exec005-authorization-recheck-v5r1
    paths:
      - '.github/workflows/lunar-finite-disk-exec005-authorization-recheck-v5.yml'
  pull_request:
    types: [opened]
    branches:
      - main
    paths:
      - '.github/workflows/lunar-finite-disk-exec005-authorization-recheck-v5.yml'

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: lunar-finite-disk-exec005-authorization-recheck-v5r1-${{ github.event_name }}-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

env:
  EXPECTED_BASE: 60b388bcb2741d650f1c28a62ac90d70611a4f1b
  EXPECTED_MAIN: 60b388bcb2741d650f1c28a62ac90d70611a4f1b
  EXPECTED_BRANCH: review/lunar-finite-disk-exec005-authorization-recheck-v5r1
  WORKFLOW_PATH: .github/workflows/lunar-finite-disk-exec005-authorization-recheck-v5.yml
  MAIN_PUSH_CI_RUN: '34252186318'
  PRIOR_CONTROL_PR: '962'
  PRIOR_CONTROL_HEAD: 55dc3978626642af2efe355c3be6b517c3d05519
  PRIOR_CONTROL_BASE: 48295e390ad8f68e6d0d4d649f1ce2bb57b041d1
  PRIOR_CONTROL_RUN: '34124504036'
  PRIOR_CONTROL_JOB: '101749881047'
  PRIOR_CONTROL_ARTIFACT: '10020881328'
  PRIOR_CONTROL_DIGEST: sha256:da568092d75e6ca9a0b7b9221dcac407aa6dac173a59e0841301c1b5a4885a55
  PRIOR_CONTROL_NAME: lunar-finite-disk-exec005-fresh-seed-control-v1-proof
  PRIOR_CONTROL_PROOF_SHA: e61d60d4dcc1166812ffa3294df77543d6e878c3bb61b841eacbfad48e4dfc10
