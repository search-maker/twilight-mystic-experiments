jobs:
  generic-zero-runtime-exact-head-and-stress:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate fresh exact-head solver-free V5R1 surface
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse "$EXPECTED_BASE")" = "$EXPECTED_BASE"
          test "$(git merge-base "$EXPECTED_BASE" HEAD)" = "$EXPECTED_BASE"
          test "$(git rev-list --count "$EXPECTED_BASE..HEAD")" = 1
          test -z "$(git rev-list --merges "$EXPECTED_BASE..HEAD")"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$EXPECTED_MAIN"
          git diff --name-only "$EXPECTED_BASE"...HEAD > changed-paths.txt
          printf '%s\n' "$WORKFLOW_PATH" > expected-paths.txt
          diff -u expected-paths.txt changed-paths.txt
          test "$(git hash-object experiments/aerosol-family-challenge-v2/tracked_tree_seed_scan.py)" = "$TRACKED_SCANNER_BLOB"
          test "$(git hash-object experiments/aerosol-family-challenge-v2/repository_global_seed_scan.py)" = "$BOUND_SCANNER_BLOB"
          test -z "$(command -v uvspec || true)"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$MAIN_PUSH_CI_RUN" > main-push-ci.json
          python - <<'PY'
          import json, os
          r=json.load(open('main-push-ci.json'))
          assert r['id']==int(os.environ['MAIN_PUSH_CI_RUN'])
          assert r['head_sha']==os.environ['EXPECTED_MAIN'] and r['event']=='push' and r['run_attempt']==1
          assert r['status']=='completed' and r['conclusion']=='success', (r['status'],r['conclusion'])
          PY
      - name: Materialize exact non-science V5R1 stress prerequisites
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p generic-evidence/stale prior-control
          printf 'must-be-removed\n' > generic-evidence/stale/sentinel.txt
          rm -rf generic-evidence prior-control
          mkdir -p generic-evidence/hardening generic-evidence/frozen generic-evidence/experiments/aerosol-family-challenge-v2 prior-control
          test ! -e generic-evidence/stale/sentinel.txt
          for spec in \
            "repository_global_seed_scan_hardening.py:$HARDENING_HELPER_BLOB" \
            "test_repository_global_seed_scan_hardening.py:$HARDENING_TEST_BLOB"; do
            name="${spec%%:*}"; want="${spec##*:}"
            gh api "repos/$GITHUB_REPOSITORY/contents/review/lunar-finite-disk-exec004-repository-scan-hardening-v1/$name?ref=$HARDENING_SOURCE_HEAD" > "generic-evidence/$name.json"
            test "$(jq -r .sha "generic-evidence/$name.json")" = "$want"
            jq -r .content "generic-evidence/$name.json" | tr -d '\n' | base64 --decode > "generic-evidence/hardening/$name"
            test "$(git hash-object "generic-evidence/hardening/$name")" = "$want"
          done
          cp experiments/aerosol-family-challenge-v2/repository_global_seed_scan.py generic-evidence/experiments/aerosol-family-challenge-v2/repository_global_seed_scan.py
          (cd generic-evidence && python hardening/test_repository_global_seed_scan_hardening.py)
          gh api "repos/$GITHUB_REPOSITORY/contents/review/lunar-scattered-light-source-contract-v1/lunar_finite_disk_exec003_transport_recovery.py?ref=$FROZEN_HISTORICAL_HEAD" > generic-evidence/frozen-recovery.json
          test "$(jq -r .sha generic-evidence/frozen-recovery.json)" = "$FROZEN_RECOVERY_HELPER_BLOB"
          jq -r .content generic-evidence/frozen-recovery.json | tr -d '\n' | base64 --decode > generic-evidence/frozen/lunar_finite_disk_exec003_transport_recovery.py
          test "$(git hash-object generic-evidence/frozen/lunar_finite_disk_exec003_transport_recovery.py)" = "$FROZEN_RECOVERY_HELPER_BLOB"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > generic-evidence/issue60-pages.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PRIOR_CONTROL_PR" > generic-evidence/prior-control-pr.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR_CONTROL_RUN" > generic-evidence/prior-control-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR_CONTROL_RUN/jobs?per_page=100" > generic-evidence/prior-control-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PRIOR_CONTROL_ARTIFACT" > generic-evidence/prior-control-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CANDIDATE_PHYSICS_COMMENT" > generic-evidence/candidate-physics.json
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$V3_DEFECT_PHYSICS_COMMENT" > generic-evidence/v3-defect-physics.json
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$V4_REJECTION_PHYSICS_COMMENT" > generic-evidence/v4-rejection-physics.json
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$V5_TRANSITION_COMMENT" > generic-evidence/v5-transition.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/$V4_FROZEN_PR" > generic-evidence/v4-pr.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V4_FROZEN_RUN" > generic-evidence/v4-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$V4_FROZEN_ARTIFACT" > generic-evidence/v4-artifact.json
          gh run download "$PRIOR_CONTROL_RUN" -n "$PRIOR_CONTROL_NAME" --dir prior-control
      - name: EXACT_EXECUTABLE_STRESS_PASS on actual V5R1 bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy, hashlib, importlib.util, json, os, re, sys
          from pathlib import Path
          errors=[]
          def check(cond,msg):
              if not cond: errors.append(msg)
          def must_fail(fn,label):
              try: fn(); errors.append(label+' was not rejected')
              except Exception: pass
          wf=Path(os.environ['WORKFLOW_PATH']).read_text()
          def extract(tag):
              a='# EXEC005_V5_'+tag+'_BEGIN'; b='# EXEC005_V5_'+tag+'_END'
              check(a in wf and b in wf,'actual '+tag.lower()+' source sentinels missing')
              raw=wf.split(a,1)[1].split(b,1)[0]
              return '\n'.join((line[10:] if line.startswith('          ') else line) for line in raw.splitlines())
          try:
              ns={}; exec(extract('PARSER_SOURCE'),ns)
              authoritative_begin=ns['authoritative_begin']; canonical_end_records=ns['canonical_end_records']
          except Exception as exc:
              errors.append('actual parser extraction/exec failed: '+repr(exc)); authoritative_begin=lambda body: (_ for _ in ()).throw(RuntimeError('parser unavailable')); canonical_end_records=lambda rows: rows
          try:
              sns={}; exec(extract('STABILITY_SOURCE'),sns)
              install_v4_stability=sns['install_v4_stability']; v4_require_two_pass_stability=sns['v4_require_two_pass_stability']; v4_stable_context_sha256=sns['v4_stable_context_sha256']; v5_require_common_cross_batch_context=sns['v5_require_common_cross_batch_context']
          except Exception as exc:
              errors.append('actual stability extraction/exec failed: '+repr(exc)); install_v4_stability=lambda base: base; v4_require_two_pass_stability=lambda *a,**k: (_ for _ in ()).throw(RuntimeError('stability unavailable')); v4_stable_context_sha256=lambda *a,**k: ''; v5_require_common_cross_batch_context=lambda rows: (_ for _ in ()).throw(RuntimeError('cross-batch unavailable'))
          pages=json.load(open('generic-evidence/issue60-pages.json')); comments=[r for page in pages for r in page]; byid={int(r['id']):r for r in comments}
          fixtures=[
              (int(os.environ['HISTORICAL_LEGACY_END_COMMENT']),5471141095,'legacy-space-header'),
              (int(os.environ['HISTORICAL_BELOW_LINE_END_COMMENT']),5562775627,'structured-below-line'),
              (int(os.environ['HISTORICAL_OVERMATCH_END_COMMENT']),5472560826,'structured-incidental-prose-ignore'),
              (int(os.environ['CURRENT_TOTAL_SKY_END_COMMENT']),5589459757,'current-v5-terminal-end')]
          for cid,want,label in fixtures:
              try: check(authoritative_begin(str(byid[cid].get('body') or ''))==want,label+' mismatch')
              except Exception as exc: errors.append(label+': '+repr(exc))
          must_fail(lambda: authoritative_begin('WRITE_QUIET_END begin=1 beginComment=2 token=x'),'conflicting legacy accepted IDs')
          must_fail(lambda: authoritative_begin('WRITE_QUIET_END begin=abc token=x'),'nondecimal legacy accepted key')
          must_fail(lambda: authoritative_begin('WRITE_QUIET_END token=x\nprose `begin=3` only'),'prose/backtick-only linkage')
          try:
              pred=byid[int(os.environ['CORRECTION_PREDECESSOR_END'])]; canon=byid[int(os.environ['CORRECTION_CANONICAL_END'])]
              check(authoritative_begin(str(pred.get('body') or ''))==int(os.environ['CORRECTION_BEGIN']),'correction predecessor begin mismatch')
              check(authoritative_begin(str(canon.get('body') or ''))==int(os.environ['CORRECTION_BEGIN']),'correction canonical begin mismatch')
              normalized=canonical_end_records(comments); nids={int(r['id']) for r in normalized}
              check(int(os.environ['CORRECTION_PREDECESSOR_END']) not in nids,'superseded END not removed'); check(int(os.environ['CORRECTION_CANONICAL_END']) in nids,'canonical corrected END missing')
              end_counts={}; marker_re=re.compile(r'(?:^|::)WRITE_QUIET_END(?:\s|\||$)')
              for r in normalized:
                  body=str(r.get('body') or ''); first=body.splitlines()[0].strip() if body.splitlines() else ''
                  if marker_re.search(first):
                      x=authoritative_begin(body); check(isinstance(x,int) and x>0,'END without positive authoritative linkage '+str(r.get('id'))); end_counts[x]=end_counts.get(x,0)+1
              check(not {k:v for k,v in end_counts.items() if v>1},'duplicate END linkage remains after canonicalization')
          except Exception as exc: errors.append('full-ledger parser regression: '+repr(exc))
          try:
              p=json.load(open('prior-control/exec005-fresh-seed-control-proof.json')); ledger=json.load(open('prior-control/exec005-candidate-seed-ledger.json'))
              check(p['candidateSeedCount']==198 and p['candidateSeedCanonicalSha256']==os.environ['CANDIDATE_SEED_CANONICAL'] and p['candidateRowsCanonicalSha256']==os.environ['CANDIDATE_ROWS_CANONICAL'],'candidate proof canonical binding mismatch')
              seeds=list(map(int,ledger['candidateSeeds'])); check(len(seeds)==198 and len(set(seeds))==198,'candidate ledger cardinality/uniqueness mismatch'); check(ledger['candidateSeedCanonicalSha256']==os.environ['CANDIDATE_SEED_CANONICAL'] and ledger['candidateRowsCanonicalSha256']==os.environ['CANDIDATE_ROWS_CANONICAL'],'candidate ledger canonical binding mismatch')
              check(all(ledger[k] is False for k in ('candidateSeedsAppliedToCases','candidateSeedUniverseAllocated','candidateSeedUniverseConsumed','freshExecutionIdentityAllocated','freshExecutionIdentityAuthorized','scientificExecutionAuthorized','solverExecutionAuthorized','solverExecuted','resultOpeningAuthorized','finiteDiskResultOpened','productionAuthorized')),'candidate boundary false-field mismatch')
              batches=[seeds[:72],seeds[72:144],seeds[144:]+seeds[:18]]; check(all(len(b)==72 and len(set(b))==72 for b in batches) and set().union(*(set(b) for b in batches))==set(seeds),'three-batch accounting mismatch')
          except Exception as exc: errors.append('candidate artifact/replay layout: '+repr(exc))
          try:
              spec=importlib.util.spec_from_file_location('v5hardening',Path('generic-evidence/hardening/repository_global_seed_scan_hardening.py')); hardening=importlib.util.module_from_spec(spec); sys.modules[spec.name]=hardening; spec.loader.exec_module(hardening); base=hardening.install_into_bound_scanner(); base=install_v4_stability(base)
              def empty(): return {k:[] for k in base.SURFACE_KEYS}
              a=empty(); a['artifacts']=[{'id':1,'name':'a','digest':'sha256:111','size_in_bytes':7,'expired':False,'workflow_run':{'id':2}}]; b=copy.deepcopy(a); b['artifacts'][0]['expired']=True
              check(v4_stable_context_sha256(base,a)==v4_stable_context_sha256(base,b),'expired-only stability flip not normalized')
              c=copy.deepcopy(a); c['artifacts'][0]['digest']='sha256:222'; must_fail(lambda: v4_require_two_pass_stability(base,a,c),'meaningful artifact digest drift')
              d=copy.deepcopy(a); d['artifacts'][0]['size_in_bytes']=8; must_fail(lambda: v4_require_two_pass_stability(base,a,d),'meaningful artifact size drift')
              e=empty(); e['branches']=[{'name':'main','commit':{'sha':'a'}}]; f=copy.deepcopy(e); f['branches'][0]['commit']['sha']='b'; must_fail(lambda: v4_require_two_pass_stability(base,e,f),'branch-head drift')
              sha=v4_stable_context_sha256(base,a); check(v5_require_common_cross_batch_context([{'repositoryGlobalStableContextSha256':sha} for _ in range(3)])==sha,'same-context multi-batch PASS failed')
              must_fail(lambda: v5_require_common_cross_batch_context([{'repositoryGlobalStableContextSha256':sha},{'repositoryGlobalStableContextSha256':'0'*64},{'repositoryGlobalStableContextSha256':sha}]),'cross-batch meaningful-context drift')
          except Exception as exc: errors.append('actual V4/V5 stability regressions: '+repr(exc))
          try:
              vp=json.load(open('generic-evidence/v4-rejection-physics.json')); vt=json.load(open('generic-evidence/v5-transition.json')); vpr=json.load(open('generic-evidence/v4-pr.json')); vr=json.load(open('generic-evidence/v4-run.json')); va=json.load(open('generic-evidence/v4-artifact.json'))
              check('CROSS_BATCH_NORMALIZED_REPOSITORY_CONTEXT_DRIFT_NOT_FAIL_CLOSED' in str(vp.get('body') or ''),'Physics V4 defect binding missing')
              check('FRESH_V5R1_RECOVERY_AUTHORIZED' in str(vt.get('body') or ''),'Coordinator V5R1 transition binding missing')
              check(vpr['number']==int(os.environ['V4_FROZEN_PR']) and vpr['head']['sha']==os.environ['V4_FROZEN_HEAD'] and vpr['state']=='open' and vpr['draft'] is True,'frozen V4 PR binding mismatch')
              check(vr['id']==int(os.environ['V4_FROZEN_RUN']) and vr['run_attempt']==1 and vr['conclusion']=='success','frozen V4 run binding mismatch')
              check(va['id']==int(os.environ['V4_FROZEN_ARTIFACT']) and va['digest']==os.environ['V4_FROZEN_DIGEST'],'frozen V4 artifact binding mismatch')
          except Exception as exc: errors.append('V4 rejected evidence binding: '+repr(exc))
          required=['authorization-recheck-proof.json','repository-global-seed-scan-1.json','repository-global-seed-scan-2.json','repository-global-seed-scan-3.json','tracked-seed-scan-1.json','tracked-seed-scan-2.json','tracked-seed-scan-3.json','repositoryGlobalStableContextSha256','candidateSeedUniverseAllocated','scientificExecutionAuthorized','solverExecuted','finiteDiskResultOpened']
          for token in required: check(token in wf,'required V5R1 executable/receipt token missing: '+token)
          suspicious=[]
          runtime_tokens=('sub'+'process.','os.'+'system(')
          for n,line in enumerate(wf.splitlines(),1):
              s=line.strip()
              if re.search(r'(^|[;&|]\s*)(uvspec|mystic)(\s|$)',s,re.I) and 'command -v uvspec' not in s and not s.startswith("echo '"): suspicious.append((n,s))
              if any(token in s for token in runtime_tokens): suspicious.append((n,s))
          check(not suspicious,'hidden solver/runtime-risk tokens: '+repr(suspicious))
          report={'schemaVersion':3,'status':'PASS_EXACT_EXECUTABLE_STRESS_PASS' if not errors else 'FAIL_EXACT_EXECUTABLE_STRESS_PASS','actualWorkflowPath':os.environ['WORKFLOW_PATH'],'actualHead':os.environ['GITHUB_SHA'],'actualRef':os.environ['GITHUB_REF'],'actualBase':os.environ['EXPECTED_BASE'],'completeIssue60CommentCount':len(comments),'candidateSeedCount':198,'crossBatchStableContextRequired':True,'artifactExpiredStabilityOnly':True,'rawCollisionCanonicalizationUntouched':True,'candidateSeedLiteralsDisclosed':False,'solverRuntimeExecuted':False,'scientificExecutionAuthorized':False,'errors':errors}
          Path('generic-evidence/exact-executable-stress-report.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n'); print('status='+report['status']); print('diagnostic_error_count='+str(len(errors))); print('candidate_seed_literals_disclosed=false'); print('scientific_execution_authorized=false')
          for e in errors: print('DIAGNOSTIC_DEFECT: '+e)
          if errors: raise SystemExit(2)
          PY
      - name: Upload non-authorizing V5R1 exact executable stress evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lunar-finite-disk-exec005-authorization-recheck-v5r1-stress
          path: |
            generic-evidence/exact-executable-stress-report.json
            generic-evidence/issue60-pages.json
            generic-evidence/prior-control-artifact.json
            generic-evidence/candidate-physics.json
            generic-evidence/v3-defect-physics.json
            generic-evidence/v4-rejection-physics.json
            generic-evidence/v5-transition.json
            generic-evidence/v4-pr.json
            generic-evidence/v4-run.json
            generic-evidence/v4-artifact.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Generic V5R1 boundary
        if: always()
        run: |
          echo 'NON_AUTHORIZING EXACT_EXECUTABLE_STRESS_PASS only.'
          echo 'No seed allocation/application/consumption, no scientific ordinal/dispatch, no solver or result opening.'

  zero-runtime-authorization-recheck:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Bind exact fresh one-file V5R1 surface and clean prepared head
        shell: bash
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf auth-evidence prior-control
          mkdir -p auth-evidence/hardening auth-evidence/frozen auth-evidence/experiments/aerosol-family-challenge-v2 prior-control
