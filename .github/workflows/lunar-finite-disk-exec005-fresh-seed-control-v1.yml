name: Lunar finite-disk exec005 fresh-seed control v1

on:
  pull_request:
    types: [opened]
    branches:
      - main
    paths:
      - '.github/workflows/lunar-finite-disk-exec005-fresh-seed-control-v1.yml'

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: lunar-finite-disk-exec005-fresh-seed-control-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  zero-runtime-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      EXPECTED_BASE: 48295e390ad8f68e6d0d4d649f1ce2bb57b041d1
      PREREQ_BASE_MAIN: 16292e6246d0c15f72bc5e09bee9f0a0ba330e3e
      EXPECTED_BRANCH: review/lunar-finite-disk-exec005-fresh-seed-control-v1
      FROZEN_HISTORICAL_HEAD: 1e4fdba6755d28d998197444dcf994ef39d28d69
      FROZEN_SEED_LEDGER_BLOB: e530171cb1c60e1c0bf625b4c800b8bec02d6a1f
      FROZEN_PLANNER_BLOB: 80c3964713e947f5cae5694269ba521676b83757
      FROZEN_CONTRACT_BLOB: e235dcac8f3c307764d207b9111e9ab2011acb82
      FROZEN_LUNAR_INPUT_BLOB: ce81d2c3cd7fa3570b064c327cd834138535bdc8
      FROZEN_RECOVERY_HELPER_BLOB: bc5f3677f2f0bc9c4824f7e404593834d87577e2
      TRACKED_SCANNER_BLOB: 1c110d75b516cb7b9d50dc2674080f4a67e55d2a
      GLOBAL_SCANNER_BLOB: 4c6d704fa24228284780bcb1dd7c52537b4c5b0d
      PREREQ_REPTRAN_HEAD: b85a9ea9175bc6c98cbdf3f607ad2b81bb7da823
      PREREQ_REPTRAN_CONTRACT_BLOB: 71d87a13faa991d97f826f20d19705adc0e5d27b
      PREREQ_REPTRAN_RUN: '34052817182'
      PREREQ_REPTRAN_ARTIFACT: '9995060899'
      PREREQ_REPTRAN_ARTIFACT_DIGEST: sha256:60e01e40e899e28f65e58c2acb90eac4c893010fab0e7f7782a9c0391ff32c7a
      PREREQ_CAP_HEAD: 9d78567ffb55a2fe187e256a2abaf994aaad453f
      PREREQ_CAP_RUN: '34053349932'
      PREREQ_CAP_JOB: '101540778940'
      PREREQ_CAP_ARTIFACT: '9995224987'
      PREREQ_CAP_ARTIFACT_DIGEST: sha256:fd906b1060594a6e80884f3847e4fdcc43e8ede7f231d04cfe797fbcf4204e79
      CONSUMED_EXEC003_RUN: '33383637730'
      CONSUMED_EXEC003_HEAD: 5e9a3a0ece29c824912090b00db2bffda11d0804
      CONSUMED_EXEC003_FINAL_PREFLIGHT_JOB: '99461276383'
      CONSUMED_EXEC003_ARTIFACT: '9755463363'
      CONSUMED_EXEC003_ARTIFACT_DIGEST: sha256:3eb08bc488c6a77ccd80ab3dfe87fbfc41d9149ca6dfd4bd7653f08afe35a3ab
      CONSUMED_EXEC004_RUN: '34077749485'
      CONSUMED_EXEC004_HEAD: 4b135cf23d44d1f81f153b0e0f4ceccb8d7dd932
      CONSUMED_EXEC004_FINAL_PREFLIGHT_JOB: '101607088121'
      CONSUMED_EXEC004_END_COMMENT: '5564396631'
      CONSUMED_EXEC004_PHYSICS_COMMENT: '5564408534'
      EXEC005_RECOVERY_AUTH_COMMENT: '5568881450'
      OLD_EXEC002_NAMESPACE: lunar-finite-disk-transfer-kernel-sensitivity-v1|pagination-recovery-exec002|case-seed|sha256-v1
      EXPECTED_EXEC002_SEED_CANONICAL: 30350e6986b554d09bcd77e9095cb871dd634a80a4f219cca29d0fc0b8249e84
      EXPECTED_EXEC002_ROWS_CANONICAL: 7dbb4cbe6c34ffad668eb63ad051bd7319d68e56ea1b3c4e540d70eda23b1c95
      EXEC003_NAMESPACE: lunar-finite-disk-transfer-kernel-sensitivity-v1|transport-recovery-exec003|case-seed|sha256-v1
      EXPECTED_EXEC003_SEED_CANONICAL: e27ba17758a6111da3b791535fff2a46d4e06a04fb163b546c871d455370ab44
      EXPECTED_EXEC003_ROWS_CANONICAL: ad13f6645d6db0621af78c2434c3a0c9f82b09850def79d051175d4a6cb814d5
      EXEC004_NAMESPACE: lunar-finite-disk-transfer-kernel-sensitivity-v1|reptran-successor-exec004|case-seed|sha256-v1
      EXPECTED_EXEC004_SEED_CANONICAL: 9a29092f1708b3c8c46542967b29471689b9de3b293adadbc16c25410091e585
      EXPECTED_EXEC004_ROWS_CANONICAL: 9f6aa730fa7720fd985cfbda55ac49023f90be7de8d5f5bc931ab52aca77aa56
      NEW_EXEC005_NAMESPACE: lunar-finite-disk-transfer-kernel-sensitivity-v1|mechanical-recovery-exec005|case-seed|sha256-v1
      FRESH_EXECUTION_IDENTITY: lunar-finite-disk-transfer-kernel-sensitivity-v1-exec005

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Bind exact one-file zero-runtime control surface and current main
        shell: bash
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$EVENT_BASE" = "$EXPECTED_BASE"
          test "$EVENT_BRANCH" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$EXPECTED_BASE"
          git diff --name-only "$EXPECTED_BASE"...HEAD | sort > changed-paths.txt
          printf '%s\n' '.github/workflows/lunar-finite-disk-exec005-fresh-seed-control-v1.yml' > expected-paths.txt
          diff -u expected-paths.txt changed-paths.txt
          test -z "$(command -v uvspec || true)"
          test "$(git hash-object experiments/aerosol-family-challenge-v2/tracked_tree_seed_scan.py)" = "$TRACKED_SCANNER_BLOB"
          test "$(git hash-object experiments/aerosol-family-challenge-v2/repository_global_seed_scan.py)" = "$GLOBAL_SCANNER_BLOB"
          git diff --name-only "$PREREQ_BASE_MAIN" "$EXPECTED_BASE" | sort > main-bridge-paths.txt
          printf '%s\n' 'tests/test_lowalt_state_0002_capability_exec001.py' > expected-main-bridge-paths.txt
          diff -u expected-main-bridge-paths.txt main-bridge-paths.txt
          mkdir -p control-evidence/frozen/review/lunar-scattered-light-source-contract-v1
          mkdir -p control-evidence/reptran
          git ls-files -z > control-evidence/tracked-files.nul

      - name: Bind exact REPTRAN prerequisites and consumed exec003/exec004 recovery authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/957" > control-evidence/reptran/pr957.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREREQ_REPTRAN_RUN" > control-evidence/reptran/prestage-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PREREQ_REPTRAN_ARTIFACT" > control-evidence/reptran/prestage-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREREQ_CAP_RUN" > control-evidence/reptran/cap-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREREQ_CAP_RUN/jobs?per_page=100" > control-evidence/reptran/cap-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PREREQ_CAP_ARTIFACT" > control-evidence/reptran/cap-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CONSUMED_EXEC003_RUN" > control-evidence/exec003-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CONSUMED_EXEC003_RUN/jobs?per_page=100" > control-evidence/exec003-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CONSUMED_EXEC003_ARTIFACT" > control-evidence/exec003-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CONSUMED_EXEC004_RUN" > control-evidence/exec004-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CONSUMED_EXEC004_RUN/jobs?per_page=100" > control-evidence/exec004-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CONSUMED_EXEC004_RUN/artifacts?per_page=100" > control-evidence/exec004-artifacts.json
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CONSUMED_EXEC004_END_COMMENT" > control-evidence/exec004-end-comment.json
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CONSUMED_EXEC004_PHYSICS_COMMENT" > control-evidence/exec004-physics-comment.json
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$EXEC005_RECOVERY_AUTH_COMMENT" > control-evidence/exec005-recovery-auth-comment.json
          python - <<'PY'
          import json, os
          pr=json.load(open('control-evidence/reptran/pr957.json'))
          assert pr['number']==957 and pr['head']['sha']==os.environ['PREREQ_REPTRAN_HEAD']
          assert pr['state']=='open' and pr['draft'] is True and pr.get('merged_at') is None
          r=json.load(open('control-evidence/reptran/prestage-run.json'))
          assert r['id']==int(os.environ['PREREQ_REPTRAN_RUN']) and r['run_attempt']==1
          assert r['head_sha']==os.environ['PREREQ_REPTRAN_HEAD'] and r['conclusion']=='success'
          a=json.load(open('control-evidence/reptran/prestage-artifact.json'))
          assert a['id']==int(os.environ['PREREQ_REPTRAN_ARTIFACT']) and a['digest']==os.environ['PREREQ_REPTRAN_ARTIFACT_DIGEST'] and not a['expired']
          c=json.load(open('control-evidence/reptran/cap-run.json'))
          assert c['id']==int(os.environ['PREREQ_CAP_RUN']) and c['run_attempt']==1
          assert c['head_sha']==os.environ['PREREQ_CAP_HEAD'] and c['conclusion']=='success'
          cj=json.load(open('control-evidence/reptran/cap-jobs.json'))['jobs']
          assert any(int(j['id'])==int(os.environ['PREREQ_CAP_JOB']) and j['conclusion']=='success' for j in cj)
          ca=json.load(open('control-evidence/reptran/cap-artifact.json'))
          assert ca['id']==int(os.environ['PREREQ_CAP_ARTIFACT']) and ca['digest']==os.environ['PREREQ_CAP_ARTIFACT_DIGEST'] and not ca['expired']
          e3=json.load(open('control-evidence/exec003-run.json'))
          assert e3['id']==int(os.environ['CONSUMED_EXEC003_RUN']) and e3['run_attempt']==1
          assert e3['head_sha']==os.environ['CONSUMED_EXEC003_HEAD'] and e3['conclusion']=='failure'
          e3j=json.load(open('control-evidence/exec003-jobs.json'))['jobs']
          assert any(int(j['id'])==int(os.environ['CONSUMED_EXEC003_FINAL_PREFLIGHT_JOB']) and j['conclusion']=='success' for j in e3j)
          e3solver=[j for j in e3j if str(j.get('name','')).startswith('execute shard ')]
          assert e3solver and all(j.get('conclusion')=='skipped' for j in e3solver), e3solver
          e3a=json.load(open('control-evidence/exec003-artifact.json'))
          assert e3a['id']==int(os.environ['CONSUMED_EXEC003_ARTIFACT']) and e3a['digest']==os.environ['CONSUMED_EXEC003_ARTIFACT_DIGEST'] and not e3a['expired']
          e4=json.load(open('control-evidence/exec004-run.json'))
          assert e4['id']==int(os.environ['CONSUMED_EXEC004_RUN']) and e4['run_attempt']==1
          assert e4['head_sha']==os.environ['CONSUMED_EXEC004_HEAD'] and e4['conclusion']=='failure'
          e4j=json.load(open('control-evidence/exec004-jobs.json'))['jobs']
          pf=[j for j in e4j if int(j['id'])==int(os.environ['CONSUMED_EXEC004_FINAL_PREFLIGHT_JOB'])]
          assert len(pf)==1 and pf[0]['conclusion']=='failure'
          steps={str(s.get('name')):s.get('conclusion') for s in pf[0].get('steps',[])}
          assert steps.get('Require exact live lane-owned WRITE_QUIET fence')=='failure'
          e4solver=[j for j in e4j if str(j.get('name','')).startswith('execute shard ')]
          assert e4solver and all(j.get('conclusion')=='skipped' for j in e4solver), e4solver
          assert json.load(open('control-evidence/exec004-artifacts.json')).get('total_count')==0
          end=json.load(open('control-evidence/exec004-end-comment.json'))['body']
          physics=json.load(open('control-evidence/exec004-physics-comment.json'))['body']
          auth=json.load(open('control-evidence/exec005-recovery-auth-comment.json'))['body']
          assert 'FAIL_EXEC004_FINAL_PREFLIGHT_ZERO_SOLVER' in end
          assert 'EXEC004' in physics and 'CONSUMED' in physics.upper() and 'SCIENCE' in physics.upper()
          assert 'LUNAR_EXEC005_FRESH_ZERO_RUNTIME_RECOVERY_CONTROL_CHAIN_AUTHORIZED__SCIENCE_NOT_AUTHORIZED' in auth
          PY

      - name: Materialize exact frozen prior-governance bytes and REPTRAN prestage contract
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fetch_blob() {
            path="$1"; ref="$2"; expected="$3"; out="$4"
            meta="control-evidence/meta-$(printf '%s' "$out" | tr '/.' '__').json"
            gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$ref" > "$meta"
            test "$(jq -r .sha "$meta")" = "$expected"
            jq -r .content "$meta" | tr -d '\n' | base64 --decode > "$out"
            test "$(git hash-object "$out")" = "$expected"
          }
          root=control-evidence/frozen/review/lunar-scattered-light-source-contract-v1
          fetch_blob review/lunar-scattered-light-source-contract-v1/lunar_finite_disk_seed_ledger.py "$FROZEN_HISTORICAL_HEAD" "$FROZEN_SEED_LEDGER_BLOB" "$root/lunar_finite_disk_seed_ledger.py"
          fetch_blob review/lunar-scattered-light-source-contract-v1/lunar_finite_disk_transfer_kernel_sensitivity.py "$FROZEN_HISTORICAL_HEAD" "$FROZEN_PLANNER_BLOB" "$root/lunar_finite_disk_transfer_kernel_sensitivity.py"
          fetch_blob review/lunar-scattered-light-source-contract-v1/lunar-finite-disk-transfer-kernel-sensitivity-v1.json "$FROZEN_HISTORICAL_HEAD" "$FROZEN_CONTRACT_BLOB" "$root/lunar-finite-disk-transfer-kernel-sensitivity-v1.json"
          fetch_blob review/lunar-scattered-light-source-contract-v1/lunar_mystic_input.py "$FROZEN_HISTORICAL_HEAD" "$FROZEN_LUNAR_INPUT_BLOB" "$root/lunar_mystic_input.py"
          fetch_blob review/lunar-scattered-light-source-contract-v1/lunar_finite_disk_exec003_transport_recovery.py "$FROZEN_HISTORICAL_HEAD" "$FROZEN_RECOVERY_HELPER_BLOB" "$root/lunar_finite_disk_exec003_transport_recovery.py"
          fetch_blob review/lunar-reptran-source-binding-prestage-v1/prestage-contract.json "$PREREQ_REPTRAN_HEAD" "$PREREQ_REPTRAN_CONTRACT_BLOB" control-evidence/reptran/prestage-contract.json

      - name: Derive fresh exec005 candidates without logging literals
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, importlib.util, json, os, sys
          from pathlib import Path
          root=Path('control-evidence/frozen/review/lunar-scattered-light-source-contract-v1')
          old_path=root/'lunar_finite_disk_seed_ledger.py'
          spec=importlib.util.spec_from_file_location('lunar_fd_seed_base_exec005_control', old_path)
          if spec is None or spec.loader is None: raise SystemExit('cannot import frozen finite-disk seed ledger')
          old=importlib.util.module_from_spec(spec); sys.modules[spec.name]=old; spec.loader.exec_module(old)
          old_ledger=old.validate_ledger()
          old_seeds=set(map(int, old_ledger['candidateSeeds']))
          historical_case_ids=[str(x['caseId']) for x in old._load_planner().frozen_cases()]
          if len(historical_case_ids)!=198 or len(set(historical_case_ids))!=198: raise SystemExit('historical 198-case universe drift')

          rep=json.load(open('control-evidence/reptran/prestage-contract.json'))
          assert rep['contractId']=='lunar-reptran-source-binding-prestage-v1'
          assert rep['dependencyChange']['requiredMolAbsParam']=='reptran'
          assert rep['dependencyChange']['historicalCrsFallbackAllowed'] is False
          assert rep['dependencyChange']['historicalCrsAdmissionObjectAllowed'] is False
          p=rep['frozenPhysicalDesign']
          assert (p['wavelengthNmFirstStage'],p['atmosphereTargetConfigurationCount'],p['directionSamplesPerAtmosphereTargetConfiguration'],p['totalDirectionalCases'])==(550.0,6,33,198)
          assert p['photonHistoriesPerDirectionalCase']==5_000_000 and p['totalPhotonHistories']==990_000_000
          assert p['spectralFollowOnWavelengthsNm']==[450.0,650.0,750.0]
          assert p['mcSpherical']=='1D' and p['mcVroom'] is False and p['alis'] is True
          assert p['dayOfYearDistanceScalingApplied'] is False
          sample_ids=['center']+[f'r050-pa{i:02d}' for i in range(16)]+[f'r100-pa{i:02d}' for i in range(16)]
          rep_case_ids=[]
          for elevation in p['observerElevationM']:
              for az in p['targetRelativeAzimuthToMoonCenterDeg']:
                  g=f'e{int(round(elevation)):04d}-az{int(round(az)):03d}'
                  rep_case_ids.extend(f'fd550-{g}-{sid}' for sid in sample_ids)
          if rep_case_ids != historical_case_ids: raise SystemExit('REPTRAN prestage frozen case identity/order drift from consumed governance')
          case_ids=rep_case_ids

          minimum=10_000_000; maximum=2_147_483_647; span=maximum-minimum
          retired=set(range(32_910_001,32_910_199))
          def derive(namespace, forbidden):
              rows=[]; used=set()
              for case_id in case_ids:
                  counter=0
                  while True:
                      material=f'{namespace}|caseId={case_id}|counter={counter}'
                      digest=hashlib.sha256(material.encode()).hexdigest()
                      seed=(int(digest[:16],16)%span)+minimum
                      if seed in retired or seed in forbidden or seed in used:
                          counter+=1; continue
                      break
                  used.add(seed)
                  rows.append({'caseId':case_id,'collisionCounter':counter,'derivationMaterialSha256':digest,'seed':seed})
              return rows
          canon=lambda x: hashlib.sha256(json.dumps(x,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()

          exec002_rows=derive(os.environ['OLD_EXEC002_NAMESPACE'], old_seeds)
          exec002_seeds=set(int(r['seed']) for r in exec002_rows)
          if canon([int(r['seed']) for r in exec002_rows])!=os.environ['EXPECTED_EXEC002_SEED_CANONICAL']: raise SystemExit('exec002 reconstruction drift')
          if canon(exec002_rows)!=os.environ['EXPECTED_EXEC002_ROWS_CANONICAL']: raise SystemExit('exec002 row reconstruction drift')
          exec003_rows=derive(os.environ['EXEC003_NAMESPACE'], old_seeds | exec002_seeds)
          exec003_seed_list=[int(r['seed']) for r in exec003_rows]; exec003_seeds=set(exec003_seed_list)
          if canon(exec003_seed_list)!=os.environ['EXPECTED_EXEC003_SEED_CANONICAL']: raise SystemExit('consumed exec003 seed canonical drift')
          if canon(exec003_rows)!=os.environ['EXPECTED_EXEC003_ROWS_CANONICAL']: raise SystemExit('consumed exec003 row canonical drift')
          exec004_rows=derive(os.environ['EXEC004_NAMESPACE'], old_seeds | exec002_seeds | exec003_seeds)
          exec004_seed_list=[int(r['seed']) for r in exec004_rows]; exec004_seeds=set(exec004_seed_list)
          if canon(exec004_seed_list)!=os.environ['EXPECTED_EXEC004_SEED_CANONICAL']: raise SystemExit('consumed exec004 seed canonical drift')
          if canon(exec004_rows)!=os.environ['EXPECTED_EXEC004_ROWS_CANONICAL']: raise SystemExit('consumed exec004 row canonical drift')

          forbidden=old_seeds | exec002_seeds | exec003_seeds | exec004_seeds
          rows=derive(os.environ['NEW_EXEC005_NAMESPACE'], forbidden)
          seeds=[int(r['seed']) for r in rows]
          if len(seeds)!=198 or len(set(seeds))!=198: raise SystemExit('fresh exec005 seed cardinality/uniqueness drift')
          if set(seeds) & forbidden: raise SystemExit('fresh exec005 candidates overlap prior reconstructed universes')
          if any(s in retired for s in seeds): raise SystemExit('fresh exec005 candidate entered retired disclosed range')
          ledger={
            'schemaVersion':1,
            'stageId':'lunar-finite-disk-transfer-kernel-sensitivity-v1-exec005-fresh-candidate-seeds',
            'status':'CANDIDATE_ONLY_ARTIFACT_ONLY_NOT_APPLIED_NOT_ALLOCATED_NOT_AUTHORIZED',
            'namespace':os.environ['NEW_EXEC005_NAMESPACE'],
            'freshExecutionIdentity':os.environ['FRESH_EXECUTION_IDENTITY'],
            'sourceBindingMolAbsParam':'reptran',
            'candidateSeedCount':198,
            'candidateSeeds':seeds,
            'candidateRows':rows,
            'candidateSeedCanonicalSha256':canon(seeds),
            'candidateRowsCanonicalSha256':canon(rows),
            'overlapWithHistoricalReplacementCount':0,
            'overlapWithConsumedExec002Count':0,
            'overlapWithConsumedExec003Count':0,
            'overlapWithConsumedExec004Count':0,
            'retiredPriorCandidateRangeMayEverExecute':False,
            'candidateSeedsAppliedToCases':False,
            'candidateSeedUniverseAllocated':False,
            'candidateSeedUniverseConsumed':False,
            'freshExecutionIdentityAllocated':False,
            'freshExecutionIdentityAuthorized':False,
            'scientificExecutionAuthorized':False,
            'solverExecutionAuthorized':False,
            'solverExecuted':False,
            'resultOpeningAuthorized':False,
            'finiteDiskResultOpened':False,
            'productionAuthorized':False,
          }
          out=Path('control-evidence')
          (out/'exec005-candidate-seed-ledger.json').write_text(json.dumps(ledger,indent=2,sort_keys=True)+'\n')
          batches=[seeds[:72],seeds[72:144],seeds[144:]+seeds[:18]]
          if any(len(b)!=72 or len(set(b))!=72 for b in batches): raise SystemExit('scanner batch drift')
          if set().union(*(set(b) for b in batches)) != set(seeds): raise SystemExit('scanner batches do not cover exact fresh universe')
          for i,b in enumerate(batches,1):
              (out/f'exec005-candidate-seed-batch-{i}.json').write_text(json.dumps({'candidateSeeds':b},indent=2,sort_keys=True)+'\n')
          (out/'empty-self-ledger-policy.json').write_text(json.dumps({'schemaVersion':2,'requiredTrackedSelfLedgerPaths':[],'futureEvidenceSelfLedgerPaths':[]},indent=2,sort_keys=True)+'\n')
          print('fresh_candidate_seed_count=198')
          print('fresh_candidate_seed_canonical_sha256='+ledger['candidateSeedCanonicalSha256'])
          print('fresh_candidate_rows_canonical_sha256='+ledger['candidateRowsCanonicalSha256'])
          print('overlap_with_all_reconstructed_prior_candidate_universes=0')
          print('candidate_seed_literals_logged=false')
          PY

      - name: Scan exact tracked tree for fresh exec005 collisions
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            python experiments/aerosol-family-challenge-v2/tracked_tree_seed_scan.py \
              --repo-root . \
              --file-list control-evidence/tracked-files.nul \
              --candidate-seed-ledger "control-evidence/exec005-candidate-seed-batch-${i}.json" \
              --allow-self-ledger-json control-evidence/empty-self-ledger-policy.json \
              --output "control-evidence/tracked-seed-scan-${i}.json"
          done
          python - <<'PY'
