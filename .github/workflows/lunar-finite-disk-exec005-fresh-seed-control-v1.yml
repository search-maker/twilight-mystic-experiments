      - name: Build retry-hardened bound repository-global scanner
        shell: bash
        run: |
          set -euo pipefail
          cat > control-evidence/exec005_repository_global_seed_scan.py <<'PY'
          from __future__ import annotations
          import hashlib, importlib.util, sys
          from pathlib import Path
          base=Path('experiments/aerosol-family-challenge-v2/repository_global_seed_scan.py')
          recovery_path=Path('control-evidence/frozen/review/lunar-scattered-light-source-contract-v1/lunar_finite_disk_exec003_transport_recovery.py')
          expected='4c6d704fa24228284780bcb1dd7c52537b4c5b0d'
          data=base.read_bytes()
          blob=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          if blob != expected: raise SystemExit('bound repository-global scanner bytes changed')
          rspec=importlib.util.spec_from_file_location('lunar_fd_exec005_recovery_for_scan', recovery_path)
          if rspec is None or rspec.loader is None: raise SystemExit('cannot import frozen exec003 transport retry helper')
          recovery=importlib.util.module_from_spec(rspec); sys.modules[rspec.name]=recovery; rspec.loader.exec_module(recovery)
          spec=importlib.util.spec_from_file_location('lunar_fd_exec005_bound_global_scan',base)
          if spec is None or spec.loader is None: raise SystemExit('cannot import repository-global scanner')
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          original_req_json=mod.req_json
          def retrying_req_json(url, token):
              value, _receipt = recovery.request_with_bounded_transport_retry(lambda: original_req_json(url, token))
              return value
          mod.req_json=retrying_req_json
          mod.REVIEW_PROOF_ARTIFACT_NAME='lunar-finite-disk-exec005-fresh-seed-control-v1-proof'
          raise SystemExit(mod.main())
          PY

