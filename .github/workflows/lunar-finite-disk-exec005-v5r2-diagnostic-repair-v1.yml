name: Lunar exec005 V5R2 non-science repository-context diagnostic repair v1

on:
  push:
    branches:
      - review/lunar-finite-disk-exec005-v5r2-diagnostic-repair-v1-20260909
    paths:
      - 'tools/lunar_exec005_v5r2_diagnostic_repair_v1.py'
      - '.github/workflows/lunar-finite-disk-exec005-v5r2-diagnostic-repair-v1.yml'
  pull_request:
    types: [opened]
    branches:
      - main
    paths:
      - 'tools/lunar_exec005_v5r2_diagnostic_repair_v1.py'
      - '.github/workflows/lunar-finite-disk-exec005-v5r2-diagnostic-repair-v1.yml'

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: lunar-exec005-v5r2-diagnostic-repair-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

env:
  EXPECTED_BASE: a35365a433d08b5d65ed2134187c814f476e5aad
  EXPECTED_MAIN: a35365a433d08b5d65ed2134187c814f476e5aad
  EXPECTED_BRANCH: review/lunar-finite-disk-exec005-v5r2-diagnostic-repair-v1-20260909
  MAIN_PUSH_CI_RUN: '34352136194'
  SCANNER_BLOB: 4c6d704fa24228284780bcb1dd7c52537b4c5b0d
  TRACKED_SCANNER_BLOB: 1c110d75b516cb7b9d50dc2674080f4a67e55d2a
  CONTROLLING_TRANSITION: '5594921336'
  PHYSICS_DEFECT_COMMENT: '5594813725'
  FROZEN_V5R2_PR: '1007'
  FROZEN_V5R2_HEAD: 8c2da454f5488545ba4c5320d0289b994aa1a861
  FROZEN_V5R2_RUN: '34298987287'
  FROZEN_V5R2_JOB: '102301671240'
  PRIOR_CONTROL_PR: '962'
  PRIOR_CONTROL_HEAD: 55dc3978626642af2efe355c3be6b517c3d05519
  PRIOR_CONTROL_RUN: '34124504036'
  PRIOR_CONTROL_ARTIFACT: '10020881328'
  PRIOR_CONTROL_DIGEST: sha256:da568092d75e6ca9a0b7b9221dcac407aa6dac173a59e0841301c1b5a4885a55
  CANDIDATE_PHYSICS_COMMENT: '5571749637'
  CANDIDATE_SEED_CANONICAL: f2621958182e4e6824b1f166a9df0ddfda438431448b2fed68f8cad3a0e27dab
  CANDIDATE_ROWS_CANONICAL: a60ea88d5369a0df2b5119d194730c0998f93cec1b7f6c252083d9df9f2bea21
  HISTORICAL_LEGACY_END: '5471174859'
  HISTORICAL_BELOW_LINE_END: '5563105177'
  HISTORICAL_OVERMATCH_END: '5472575510'
  DIAGNOSTIC_TOOL: tools/lunar_exec005_v5r2_diagnostic_repair_v1.py
  WORKFLOW_PATH: .github/workflows/lunar-finite-disk-exec005-v5r2-diagnostic-repair-v1.yml

jobs:
  generic-actual-byte-stress:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate fresh successor exact head and frozen boundaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git merge-base "$EXPECTED_BASE" HEAD)" = "$EXPECTED_BASE"
          test "$(git rev-list --count "$EXPECTED_BASE..HEAD")" = 2
          test -z "$(git rev-list --merges "$EXPECTED_BASE..HEAD")"
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)" = main
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$EXPECTED_MAIN"
          git diff --name-only "$EXPECTED_BASE"...HEAD | sort > changed.txt
          printf '%s\n' "$WORKFLOW_PATH" "$DIAGNOSTIC_TOOL" | sort > expected.txt
          diff -u expected.txt changed.txt
          test "$(git hash-object experiments/aerosol-family-challenge-v2/repository_global_seed_scan.py)" = "$SCANNER_BLOB"
          test "$(git hash-object experiments/aerosol-family-challenge-v2/tracked_tree_seed_scan.py)" = "$TRACKED_SCANNER_BLOB"
          test -z "$(command -v uvspec || true)"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$MAIN_PUSH_CI_RUN" > main-ci.json
          python - <<'PY'
          import json, os
          r=json.load(open('main-ci.json'))
          assert r['id']==int(os.environ['MAIN_PUSH_CI_RUN'])
          assert r['head_sha']==os.environ['EXPECTED_MAIN'] and r['event']=='push' and r['run_attempt']==1
          assert r['status']=='completed' and r['conclusion']=='success', (r['status'],r['conclusion'])
          PY
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$FROZEN_V5R2_PR" --jq .head.sha)" = "$FROZEN_V5R2_HEAD"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FROZEN_V5R2_RUN" --jq '[.id,.run_attempt,.status,.conclusion]|@tsv' | grep -Fx $'34298987287\t1\tcompleted\tfailure'
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$PHYSICS_DEFECT_COMMENT" --jq .body | grep -F 'FINAL live path instead executes'
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CONTROLLING_TRANSITION" --jq .body | grep -F 'ONE FRESH TOTAL-SKY DIAGNOSTIC REPAIR SUCCESSOR AUTHORIZED'
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PRIOR_CONTROL_PR" --jq .head.sha)" = "$PRIOR_CONTROL_HEAD"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR_CONTROL_RUN" --jq '[.id,.run_attempt,.status,.conclusion]|@tsv' | grep -Fx $'34124504036\t1\tcompleted\tsuccess'
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PRIOR_CONTROL_ARTIFACT" > prior-control-artifact.json
          test "$(jq -r .digest prior-control-artifact.json)" = "$PRIOR_CONTROL_DIGEST"
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CANDIDATE_PHYSICS_COMMENT" --jq .body > candidate-physics.txt
          grep -F "$CANDIDATE_SEED_CANONICAL" candidate-physics.txt
          grep -F "$CANDIDATE_ROWS_CANONICAL" candidate-physics.txt
          grep -Ei 'candidate-only|unallocated|not allocated' candidate-physics.txt
      - name: Clear stale successor workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v5r2-repair-generic/stale
          printf 'stale\n' > v5r2-repair-generic/stale/sentinel
          rm -rf v5r2-repair-generic
          mkdir -p v5r2-repair-generic
          test ! -e v5r2-repair-generic/stale/sentinel
      - name: Materialize complete live issue 60 for non-authorizing stress
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/60" > v5r2-repair-generic/issue60-before.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > v5r2-repair-generic/issue60-pages.json
          for id in "$HISTORICAL_LEGACY_END" "$HISTORICAL_BELOW_LINE_END" "$HISTORICAL_OVERMATCH_END"; do
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/$id" > "v5r2-repair-generic/comment-$id.json"
          done
          gh api "repos/$GITHUB_REPOSITORY/issues/60" > v5r2-repair-generic/issue60-after.json
      - name: EXACT_EXECUTABLE_STRESS_PASS on actual successor bytes and complete issue 60
        shell: bash
        run: |
          set -euo pipefail
          python "$DIAGNOSTIC_TOOL" --self-test | tee v5r2-repair-generic/self-test.json
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, re

          tool=Path(os.environ['DIAGNOSTIC_TOOL'])
          wf=Path(os.environ['WORKFLOW_PATH'])
          text=tool.read_text()
          assert 'subprocess' not in text
          assert 'candidateSeeds' not in text
          assert 'uvspec' not in text
          assert 'libRadtran' not in text
          assert 'MYSTIC' not in text
          assert "final = bound_observation(base, collect_fn(), fence, current_run_id)" in text
          assert "write_receipt(args.output, receipt)" in text

          before=json.load(open('v5r2-repair-generic/issue60-before.json'))
          after=json.load(open('v5r2-repair-generic/issue60-after.json'))
          assert before['comments']==after['comments'] and before['updated_at']==after['updated_at'], (before['comments'], after['comments'], before['updated_at'], after['updated_at'])
          pages=json.load(open('v5r2-repair-generic/issue60-pages.json'))
          comments=[row for page in pages for row in page]
          assert len(comments)==before['comments'], (len(comments), before['comments'])
          assert len({int(row['id']) for row in comments})==len(comments)
          byid={int(row['id']):row for row in comments}
          assert int(os.environ['CONTROLLING_TRANSITION']) in byid
          assert int(os.environ['PHYSICS_DEFECT_COMMENT']) in byid

          def payload_first(body):
              first=(body or '').splitlines()[0].strip() if (body or '').splitlines() else ''
              return first.split('::',1)[1].strip() if '::' in first else first
          def is_marker(body, marker):
              first=payload_first(body)
              return first==marker or first.startswith(marker+' ') or first.startswith(marker+' |')
          key_re=re.compile(r'^(begin|beginComment|begin_comment)\s*[:=]\s*([0-9]+)$')
          legacy_re=re.compile(r'^(begin|beginComment|begin_comment)=([0-9]+)$')
          def end_link(body):
              lines=(body or '').splitlines()
              assert lines and is_marker(body,'WRITE_QUIET_END'), lines[:1]
              first=payload_first(body)
              vals=[]
              for field in first.split('|')[1:]:
                  m=key_re.fullmatch(field.strip())
                  if m: vals.append(m.group(2))
              for line in lines[1:]:
                  m=key_re.fullmatch(line.strip())
                  if m: vals.append(m.group(2))
              if not vals:
                  tail=first[len('WRITE_QUIET_END'):].strip()
                  for token in tail.split():
                      m=legacy_re.fullmatch(token.strip())
                      if m: vals.append(m.group(2))
              distinct=list(dict.fromkeys(vals))
              if len(distinct)!=1:
                  raise RuntimeError(f'WRITE_QUIET_END authoritative linkage cardinality={len(distinct)} values={distinct}')
              return int(distinct[0])

          legacy=json.load(open('v5r2-repair-generic/comment-'+os.environ['HISTORICAL_LEGACY_END']+'.json'))['body']
          below=json.load(open('v5r2-repair-generic/comment-'+os.environ['HISTORICAL_BELOW_LINE_END']+'.json'))['body']
          over=json.load(open('v5r2-repair-generic/comment-'+os.environ['HISTORICAL_OVERMATCH_END']+'.json'))['body']
          assert end_link(legacy)==5471141095
          assert end_link(below)==5562775627
          assert end_link(over)==5472560826
          assert end_link('WRITE_QUIET_END | begin=123 | stage=x\n\nprose `begin=999` beginComment=888')==123
          assert end_link('WRITE_QUIET_END | stage=x\nbegin_comment=123\nbegin=123')==123
          try:
              end_link('WRITE_QUIET_END | begin=123 | beginComment=124')
          except RuntimeError as exc:
              assert 'cardinality=2' in str(exc)
          else:
              raise AssertionError('conflicting authoritative linkage was not rejected')

          begins=[]; ends=[]
          for row in comments:
              if int(row['id']) <= int(os.environ['CONTROLLING_TRANSITION']):
                  continue
              body=row.get('body') or ''
              if is_marker(body,'WRITE_QUIET_BEGIN'):
                  begins.append(int(row['id']))
              elif is_marker(body,'WRITE_QUIET_END'):
                  ends.append((int(row['id']),end_link(body)))
          for begin in begins:
              hits=[end_id for end_id,linked in ends if linked==begin]
              assert len(hits)==1, (begin,hits)
          linked={linked for _,linked in ends}
          assert not (set(begins)-linked), (begins,ends)

          selftest=json.load(open('v5r2-repair-generic/self-test.json'))
          assert selftest['candidateCount']==198
          assert selftest['candidateState']=='candidate-only/unallocated/unapplied/unconsumed'
          assert selftest['identicalRepeatedStableIdCollapsed']=={'surface':'runs','id':'101'}
          assert selftest['conflictingRepeatedStableIdRejected']=={'surface':'runs','id':'101'}
          assert selftest['exceptionReceiptPersisted'] is True

          receipt={
            'schema':'LUNAR_EXEC005_V5R2_DIAGNOSTIC_REPAIR_GENERIC_STRESS_V1',
            'status':'PASS_V5R2_DIAGNOSTIC_REPAIR_GENERIC_ACTUAL_BYTE_STRESS_NOT_AUTHORIZED',
            'controllingTransition':os.environ['CONTROLLING_TRANSITION'],
            'base':os.environ['EXPECTED_BASE'],
            'branch':os.environ['EXPECTED_BRANCH'],
            'toolSha256':hashlib.sha256(tool.read_bytes()).hexdigest(),
            'workflowSha256':hashlib.sha256(wf.read_bytes()).hexdigest(),
            'scannerBlob':os.environ['SCANNER_BLOB'],
            'trackedScannerBlob':os.environ['TRACKED_SCANNER_BLOB'],
            'issue60CommentCount':len(comments),
            'issue60UpdatedAt':before['updated_at'],
            'candidateCount':198,
            'candidateSeedCanonicalSha256':os.environ['CANDIDATE_SEED_CANONICAL'],
            'candidateRowsCanonicalSha256':os.environ['CANDIDATE_ROWS_CANONICAL'],
            'candidateState':'candidate-only/unallocated/unapplied/unconsumed',
            'scienceAuthorized':False,
            'protectedAttemptAuthorized':False,
            'seedValuesPresent':False,
            'solverRuntimePresent':False,
            'historicalWriteQuietFixturesPass':True,
            'currentTailWriteQuietSelfCheckPass':True,
          }
          Path('v5r2-repair-generic/generic-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lunar-exec005-v5r2-diagnostic-repair-generic-stress
          path: v5r2-repair-generic
          if-no-files-found: error

  live-complete-repository-diagnostic:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Bind exact PR event and prior generic attempt1 success
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_HEAD_REF" = "$EXPECTED_BRANCH"
          test "$PR_BASE" = "$EXPECTED_BASE"
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          test "$(git merge-base "$EXPECTED_BASE" HEAD)" = "$EXPECTED_BASE"
          test "$(git rev-list --count "$EXPECTED_BASE..HEAD")" = 2
          test -z "$(git rev-list --merges "$EXPECTED_BASE..HEAD")"
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)" = main
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$EXPECTED_MAIN"
          test "$(git hash-object experiments/aerosol-family-challenge-v2/repository_global_seed_scan.py)" = "$SCANNER_BLOB"
          test "$(git hash-object experiments/aerosol-family-challenge-v2/tracked_tree_seed_scan.py)" = "$TRACKED_SCANNER_BLOB"
          test -z "$(command -v uvspec || true)"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$PR_HEAD&event=push&per_page=100" > exact-push-runs.json
          python - <<'PY'
          import json, os
          rows=json.load(open('exact-push-runs.json'))['workflow_runs']
          hits=[r for r in rows if r.get('path')==os.environ['WORKFLOW_PATH']]
          assert len(hits)==1, [(r.get('id'),r.get('path'),r.get('status'),r.get('conclusion')) for r in hits]
          r=hits[0]
          assert r['run_attempt']==1 and r['status']=='completed' and r['conclusion']=='success', r
          print('generic_run='+str(r['id']))
          PY
      - name: Fresh stable complete-issue60 boundary before repository-global observation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p v5r2-repair-live
          gh api "repos/$GITHUB_REPOSITORY/issues/60" > v5r2-repair-live/issue60-before.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > v5r2-repair-live/issue60-pages-before.json
          sleep 5
          gh api "repos/$GITHUB_REPOSITORY/issues/60" > v5r2-repair-live/issue60-after.json
          python - <<'PY'
          import json
          a=json.load(open('v5r2-repair-live/issue60-before.json'))
          b=json.load(open('v5r2-repair-live/issue60-after.json'))
          assert a['comments']==b['comments'] and a['updated_at']==b['updated_at'], (a['comments'],b['comments'],a['updated_at'],b['updated_at'])
          pages=json.load(open('v5r2-repair-live/issue60-pages-before.json'))
          rows=[r for page in pages for r in page]
          assert len(rows)==a['comments']
          import os, re
          def payload_first(body):
              first=(body or '').splitlines()[0].strip() if (body or '').splitlines() else ''
              return first.split('::',1)[1].strip() if '::' in first else first
          def marker(body, kind):
              first=payload_first(body)
              return first==kind or first.startswith(kind+' ') or first.startswith(kind+' |')
          key_re=re.compile(r'^(begin|beginComment|begin_comment)\s*[:=]\s*([0-9]+)$')
          legacy_re=re.compile(r'^(begin|beginComment|begin_comment)=([0-9]+)$')
          def link(body):
              lines=(body or '').splitlines(); first=payload_first(body); vals=[]
              for field in first.split('|')[1:]:
                  m=key_re.fullmatch(field.strip())
                  if m: vals.append(m.group(2))
              for line in lines[1:]:
                  m=key_re.fullmatch(line.strip())
                  if m: vals.append(m.group(2))
              if not vals:
                  for token in first[len('WRITE_QUIET_END'):].strip().split():
                      m=legacy_re.fullmatch(token.strip())
                      if m: vals.append(m.group(2))
              distinct=list(dict.fromkeys(vals))
              if len(distinct)!=1: raise RuntimeError(f'live END linkage cardinality={len(distinct)} values={distinct}')
              return int(distinct[0])
          cutoff=int(os.environ['CONTROLLING_TRANSITION'])
          begins=[int(r['id']) for r in rows if int(r['id'])>cutoff and marker(r.get('body') or '', 'WRITE_QUIET_BEGIN')]
          ends=[(int(r['id']),link(r.get('body') or '')) for r in rows if int(r['id'])>cutoff and marker(r.get('body') or '', 'WRITE_QUIET_END')]
          for begin in begins:
              hits=[eid for eid,bid in ends if bid==begin]
              assert len(hits)==1, (begin,hits)
          PY
      - name: Run NON_AUTHORIZING ACTUAL complete-repository V5R2 repair diagnostic
        id: live
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f v5r2-repair-live/repository-context-diagnostic.json
          python "$DIAGNOSTIC_TOOL" \
            --repository "$GITHUB_REPOSITORY" \
            --issue-number 60 \
            --current-run-id "$GITHUB_RUN_ID" \
            --output v5r2-repair-live/repository-context-diagnostic.json
      - name: Validate schema-valid sanitized receipt on pass or fail
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f v5r2-repair-live/repository-context-diagnostic.json
          python - <<'PY'
          import json
          p='v5r2-repair-live/repository-context-diagnostic.json'
          row=json.load(open(p))
          assert row['schema']=='LUNAR_EXEC005_V5R2_REPOSITORY_CONTEXT_DIAGNOSTIC_REPAIR_V1'
          assert row['batchCount']==3
          assert row['scienceAuthorized'] is False
          assert row['protectedAttemptAuthorized'] is False
          assert row['seedValuesPresent'] is False
          assert row['solverRuntimePresent'] is False
          assert row['candidateCount']==198
          assert row['candidateState']=='candidate-only/unallocated/unapplied/unconsumed'
          assert row['status'] in {
            'PASS_V5R2_DIAGNOSTIC_REPAIR_STABLE_NOT_AUTHORIZED',
            'FAIL_CLOSED_V5R2_DIAGNOSTIC_REPAIR_DRIFT_OBSERVED_NOT_AUTHORIZED',
            'FAIL_CLOSED_V5R2_DIAGNOSTIC_REPAIR_EXCEPTION_NOT_AUTHORIZED',
          }
          if row['status'].startswith('PASS_'):
              assert len(row['batches'])==3
              assert row['exception'] is None
              assert row['finalLiveReenumeration'] is not None
              for batch in row['batches']:
                  assert len(batch['stableContextSha256'])==64
                  for items in batch['evidence']['rows'].values():
                      for item in items:
                          assert set(item)=={'id','sha256'} and len(item['sha256'])==64
          else:
              assert isinstance(row['completedStage'],str) and row['completedStage']
              if row['status'].endswith('EXCEPTION_NOT_AUTHORIZED'):
                  assert set(row['exception'])=={'class','message'}
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lunar-exec005-v5r2-diagnostic-repair-context
          path: v5r2-repair-live/repository-context-diagnostic.json
          if-no-files-found: error
      - name: Preserve fail-closed terminal classification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status="$(python -c "import json; print(json.load(open('v5r2-repair-live/repository-context-diagnostic.json'))['status'])")"
          echo "diagnostic_status=$status"
          test "$status" = PASS_V5R2_DIAGNOSTIC_REPAIR_STABLE_NOT_AUTHORIZED
