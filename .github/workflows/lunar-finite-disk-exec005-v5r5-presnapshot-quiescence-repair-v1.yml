name: Lunar exec005 V5R5 non-science pre-snapshot quiescence repair

on:
  push:
    branches:
      - review/lunar-finite-disk-exec005-v5r5-presnapshot-quiescence-repair-v1-20260909
    paths:
      - 'tools/lunar_exec005_v5r4_dedupe_order_repair_v1.py'
      - '.github/workflows/lunar-finite-disk-exec005-v5r5-presnapshot-quiescence-repair-v1.yml'
  pull_request:
    types: [opened, reopened]
    branches:
      - main
    paths:
      - 'tools/lunar_exec005_v5r4_dedupe_order_repair_v1.py'
      - '.github/workflows/lunar-finite-disk-exec005-v5r5-presnapshot-quiescence-repair-v1.yml'

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: lunar-exec005-v5r5-presnapshot-quiescence-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

env:
  EXPECTED_BASE: 8cd85cf393e2d86a1b6d7325654747460a13e697
  EXPECTED_MAIN: 8cd85cf393e2d86a1b6d7325654747460a13e697
  EXPECTED_BRANCH: review/lunar-finite-disk-exec005-v5r5-presnapshot-quiescence-repair-v1-20260909
  CONTROLLING_TRANSITION: '5611346406'
  ACCEPTED_V5R4_PR: '1022'
  ACCEPTED_V5R4_HEAD: afe6ed0565e5f4aa7578a26cfde5c29365e066f0
  ACCEPTED_V5R4_TOOL_BLOB: 8701002021b08a493f48a0b0969d1b0380cffab5
  V5R4_PHYSICS_ACCEPTANCE: '5608202202'
  V5R4_TERMINAL_PHYSICS: '5611217257'
  FROZEN_V5R4_RUN: '34421313840'
  FROZEN_V5R4_ARTIFACT: '10131919561'
  FROZEN_V5R4_DIGEST: sha256:08f1000930e610a195e907a6911f3f83c27a489959f554d5c25ca0e0c43bdb11
  CANDIDATE_PHYSICS_COMMENT: '5571749637'
  CANDIDATE_SEED_CANONICAL: f2621958182e4e6824b1f166a9df0ddfda438431448b2fed68f8cad3a0e27dab
  CANDIDATE_ROWS_CANONICAL: a60ea88d5369a0df2b5119d194730c0998f93cec1b7f6c252083d9df9f2bea21
  SCANNER_BLOB: 4c6d704fa24228284780bcb1dd7c52537b4c5b0d
  TRACKED_SCANNER_BLOB: 1c110d75b516cb7b9d50dc2674080f4a67e55d2a
  HISTORICAL_LEGACY_END: '5471174859'
  HISTORICAL_BELOW_LINE_END: '5563105177'
  HISTORICAL_OVERMATCH_END: '5472575510'
  DIAGNOSTIC_TOOL: tools/lunar_exec005_v5r4_dedupe_order_repair_v1.py
  WORKFLOW_PATH: .github/workflows/lunar-finite-disk-exec005-v5r5-presnapshot-quiescence-repair-v1.yml

jobs:
  generic-actual-byte-stress:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Bind exact V5R5 head and accepted V5R4 mechanics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git merge-base "$EXPECTED_BASE" HEAD)" = "$EXPECTED_BASE"
          test "$(git rev-list --count "$EXPECTED_BASE..HEAD")" = 1
          test -z "$(git rev-list --merges "$EXPECTED_BASE..HEAD")"
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)" = main
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$EXPECTED_MAIN"
          git diff --name-only "$EXPECTED_BASE"...HEAD | sort > changed.txt
          printf '%s\n' "$WORKFLOW_PATH" "$DIAGNOSTIC_TOOL" | sort > expected.txt
          diff -u expected.txt changed.txt
          test "$(git hash-object "$DIAGNOSTIC_TOOL")" = "$ACCEPTED_V5R4_TOOL_BLOB"
          test "$(git hash-object experiments/aerosol-family-challenge-v2/repository_global_seed_scan.py)" = "$SCANNER_BLOB"
          test "$(git hash-object experiments/aerosol-family-challenge-v2/tracked_tree_seed_scan.py)" = "$TRACKED_SCANNER_BLOB"
          test -z "$(command -v uvspec || true)"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$ACCEPTED_V5R4_PR" --jq .head.sha)" = "$ACCEPTED_V5R4_HEAD"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FROZEN_V5R4_RUN" --jq '[.id,.run_attempt,.status,.conclusion]|@tsv' | grep -Fx $'34421313840\t1\tcompleted\tfailure'
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$FROZEN_V5R4_ARTIFACT" > frozen-v5r4-artifact.json
          test "$(jq -r .digest frozen-v5r4-artifact.json)" = "$FROZEN_V5R4_DIGEST"
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$V5R4_PHYSICS_ACCEPTANCE" --jq .body > v5r4-physics-acceptance.txt
          grep -F "$ACCEPTED_V5R4_HEAD" v5r4-physics-acceptance.txt
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$V5R4_TERMINAL_PHYSICS" --jq .body > v5r4-terminal-physics.txt
          grep -F "$FROZEN_V5R4_RUN" v5r4-terminal-physics.txt
          grep -F 'NO_V5R4_DEFECT' v5r4-terminal-physics.txt
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CONTROLLING_TRANSITION" --jq .body > controlling-transition.txt
          grep -F 'TOTAL-SKY NARROW V5R5 REPAIR AUTHORITY' controlling-transition.txt
          grep -F 'all non-self repository Actions' controlling-transition.txt
          grep -F 'same-event/same-head siblings' controlling-transition.txt
          grep -F 'Exact 198 candidates remain untouched' controlling-transition.txt
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CANDIDATE_PHYSICS_COMMENT" --jq .body > candidate-physics.txt
          grep -F "$CANDIDATE_SEED_CANONICAL" candidate-physics.txt
          grep -F "$CANDIDATE_ROWS_CANONICAL" candidate-physics.txt
          grep -Ei 'candidate-only|unallocated|not allocated' candidate-physics.txt
      - name: Clear stale V5R5 workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v5r5-generic/stale
          printf 'stale\n' > v5r5-generic/stale/sentinel
          rm -rf v5r5-generic
          mkdir -p v5r5-generic
          test ! -e v5r5-generic/stale/sentinel
      - name: Materialize complete live issue 60 for actual-byte stress
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/60" > v5r5-generic/issue60-before.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > v5r5-generic/issue60-pages.json
          for id in "$HISTORICAL_LEGACY_END" "$HISTORICAL_BELOW_LINE_END" "$HISTORICAL_OVERMATCH_END"; do
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/$id" > "v5r5-generic/comment-$id.json"
          done
          gh api "repos/$GITHUB_REPOSITORY/issues/60" > v5r5-generic/issue60-after.json
      - name: NON_AUTHORIZING ACTUAL executable stress on V5R5 bytes
        shell: bash
        run: |
          set -euo pipefail
          python "$DIAGNOSTIC_TOOL" --self-test | tee v5r5-generic/self-test.json
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, re

          tool=Path(os.environ['DIAGNOSTIC_TOOL'])
          wf=Path(os.environ['WORKFLOW_PATH'])
          text=tool.read_text()
          assert hashlib.sha1(tool.read_bytes()).hexdigest()==os.environ['ACCEPTED_V5R4_TOOL_BLOB']
          assert 'subprocess' not in text
          assert 'candidateSeeds' not in text
          assert "surface == 'runs' and name in {'status', 'conclusion', 'run_attempt'}" in text
          assert "surface == 'pulls' and name in {'state', 'state_reason'}" in text
          assert 'v5r4_build_snapshot_fence(base, initial_raw, current_run_id)' in text
          assert 'final = bound_observation(base, collect_fn(), fence, current_run_id)' in text
          assert 'write_receipt(args.output, receipt)' in text

          before=json.load(open('v5r5-generic/issue60-before.json'))
          after=json.load(open('v5r5-generic/issue60-after.json'))
          assert before['comments']==after['comments'] and before['updated_at']==after['updated_at']
          pages=json.load(open('v5r5-generic/issue60-pages.json'))
          comments=[row for page in pages for row in page]
          assert len(comments)==before['comments']
          assert len({int(row['id']) for row in comments})==len(comments)
          byid={int(row['id']):row for row in comments}
          assert int(os.environ['CONTROLLING_TRANSITION']) in byid
          assert int(os.environ['V5R4_TERMINAL_PHYSICS']) in byid

          def payload_first(body):
              first=(body or '').splitlines()[0].strip() if (body or '').splitlines() else ''
              return first.split('::',1)[1].strip() if '::' in first else first
          def is_marker(body, marker):
              first=payload_first(body)
              return first==marker or first.startswith(marker+' ') or first.startswith(marker+' |')
          key_re=re.compile(r'^(begin|beginComment|begin_comment)\s*[:=]\s*([0-9]+)$')
          legacy_re=re.compile(r'^(begin|beginComment|begin_comment)=([0-9]+)$')
          def end_link(body):
              lines=(body or '').splitlines(); first=payload_first(body); vals=[]
              assert lines and is_marker(body,'WRITE_QUIET_END')
              for field in first.split('|')[1:]:
                  m=key_re.fullmatch(field.strip())
                  if m: vals.append(m.group(2))
              for line in lines[1:]:
                  m=key_re.fullmatch(line.strip())
                  if m: vals.append(m.group(2))
              if not vals:
                  for token in first[len('WRITE_QUIET_END'):].strip().split():
                      m=legacy_re.fullmatch(token.strip())
                      if m: vals.append(m.group(2))
              distinct=list(dict.fromkeys(vals))
              if len(distinct)!=1:
                  raise RuntimeError(f'WRITE_QUIET_END authoritative linkage cardinality={len(distinct)} values={distinct}')
              return int(distinct[0])

          legacy=json.load(open('v5r5-generic/comment-'+os.environ['HISTORICAL_LEGACY_END']+'.json'))['body']
          below=json.load(open('v5r5-generic/comment-'+os.environ['HISTORICAL_BELOW_LINE_END']+'.json'))['body']
          over=json.load(open('v5r5-generic/comment-'+os.environ['HISTORICAL_OVERMATCH_END']+'.json'))['body']
          assert end_link(legacy)==5471141095
          assert end_link(below)==5562775627
          assert end_link(over)==5472560826
          begins=[]; ends=[]
          for row in comments:
              if int(row['id']) <= int(os.environ['CONTROLLING_TRANSITION']):
                  continue
              body=row.get('body') or ''
              if is_marker(body,'WRITE_QUIET_BEGIN'):
                  begins.append(int(row['id']))
              elif is_marker(body,'WRITE_QUIET_END'):
                  ends.append((int(row['id']),end_link(body)))
          for begin in begins:
              hits=[eid for eid,bid in ends if bid==begin]
              assert len(hits)==1,(begin,hits)

          selftest=json.load(open('v5r5-generic/self-test.json'))
          assert selftest['sameContextPass'] is True
          assert selftest['nestedRepositorySummaryNoiseIgnored'] is True
          assert selftest['meaningfulPullRunDriftCaughtCount'] >= 15
          assert selftest['sameIdRunRepositorySummaryOnlyCollapsed']=={'surface':'runs','id':'101'}
          assert selftest['sameIdPullRepositorySummaryOnlyCollapsed']=={'surface':'pulls','id':'301'}
          assert selftest['meaningfulSameIdConflictsRejectedAndNamed']==['pullState','pullStateReason','runAttempt','runConclusion','runHeadSha','runStatus']
          assert selftest['pathSpecificProjectionPrecedesStableIdDedupe'] is True
          assert selftest['finalUsesSameBoundObservationPath'] is True
          assert selftest['exceptionReceiptPersisted'] is True
          assert selftest['candidateCount']==198
          assert selftest['candidateState']=='candidate-only/unallocated/unapplied/unconsumed'

          mutable={'queued','in_progress','requested','waiting','pending'}
          def blockers(rows,current):
              return sorted(int(r['id']) for r in rows if int(r['id'])!=current and r.get('status') in mutable)
          sibling={'id':9001,'status':'in_progress','conclusion':None,'run_attempt':1,'head_sha':'f'*40,'head_branch':'feature','path':'.github/workflows/contract.yml','event':'pull_request'}
          assert blockers([sibling],9999)==[9001]
          sibling_done=dict(sibling,status='completed',conclusion='success')
          assert blockers([sibling_done],9999)==[]
          fields=('id','status','conclusion','run_attempt','head_sha','head_branch','path','event')
          def lifecycle(rows,current):
              return sorted(tuple(r.get(k) for k in fields) for r in rows if int(r['id'])!=current)
          assert lifecycle([sibling_done],9999)==lifecycle([dict(sibling_done)],9999)
          changed=dict(sibling_done,conclusion='failure')
          assert lifecycle([sibling_done],9999)!=lifecycle([changed],9999)

          receipt={
            'schema':'LUNAR_EXEC005_V5R5_GENERIC_ACTUAL_BYTE_STRESS_V1',
            'status':'PASS_V5R5_GENERIC_ACTUAL_BYTE_STRESS_NOT_AUTHORIZED',
            'controllingTransition':os.environ['CONTROLLING_TRANSITION'],
            'head':os.environ['GITHUB_SHA'],
            'base':os.environ['EXPECTED_BASE'],
            'branch':os.environ['EXPECTED_BRANCH'],
            'acceptedV5R4Head':os.environ['ACCEPTED_V5R4_HEAD'],
            'acceptedV5R4ToolBlob':os.environ['ACCEPTED_V5R4_TOOL_BLOB'],
            'toolSha256':hashlib.sha256(tool.read_bytes()).hexdigest(),
            'workflowSha256':hashlib.sha256(wf.read_bytes()).hexdigest(),
            'issue60CommentCount':len(comments),
            'issue60UpdatedAt':before['updated_at'],
            'candidateCount':198,
            'candidateSeedCanonicalSha256':os.environ['CANDIDATE_SEED_CANONICAL'],
            'candidateRowsCanonicalSha256':os.environ['CANDIDATE_ROWS_CANONICAL'],
            'candidateState':'candidate-only/unallocated/unapplied/unconsumed',
            'scienceAuthorized':False,
            'protectedAttemptAuthorized':False,
            'seedValuesPresent':False,
            'solverRuntimePresent':False,
            'projectionBeforeDedupePreserved':True,
            'meaningfulLifecyclePreserved':True,
            'siblingRunQuiescenceFixturePass':True,
            'completeIssue60AndWriteQuietPass':True,
            'staleWorkspacePass':True,
          }
          Path('v5r5-generic/generic-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lunar-exec005-v5r5-generic-actual-byte-stress
          path: v5r5-generic
          if-no-files-found: error

  independent-review-gated-live-diagnostic:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Bind exact PR event and V5R5 generic attempt1 success
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_HEAD_REF" = "$EXPECTED_BRANCH"
          test "$PR_BASE" = "$EXPECTED_BASE"
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          test "$(git merge-base "$EXPECTED_BASE" HEAD)" = "$EXPECTED_BASE"
          test "$(git rev-list --count "$EXPECTED_BASE..HEAD")" = 1
          test -z "$(git rev-list --merges "$EXPECTED_BASE..HEAD")"
          test "$(git hash-object "$DIAGNOSTIC_TOOL")" = "$ACCEPTED_V5R4_TOOL_BLOB"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$EXPECTED_MAIN"
          test -z "$(command -v uvspec || true)"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$PR_HEAD&event=push&per_page=100" > exact-push-runs.json
          python - <<'PY'
          import json,os
          rows=json.load(open('exact-push-runs.json'))['workflow_runs']
          hits=[r for r in rows if r.get('path')==os.environ['WORKFLOW_PATH']]
          assert len(hits)==1,[(r.get('id'),r.get('status'),r.get('conclusion')) for r in hits]
          r=hits[0]
          assert r['run_attempt']==1 and r['status']=='completed' and r['conclusion']=='success',r
          print('generic_run='+str(r['id']))
          PY
      - name: Require independent Physics acceptance for exact V5R5 bytes
        id: physics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p v5r5-live
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > v5r5-live/issue60-pages-review.json
          python - <<'PY'
          import json,os
          pages=json.load(open('v5r5-live/issue60-pages-review.json')); rows=[r for p in pages for r in p]
          head=os.environ['PR_HEAD']; cutoff=int(os.environ['CONTROLLING_TRANSITION']); hits=[]
          for row in rows:
              if int(row['id'])<=cutoff: continue
              body=row.get('body') or ''; first=body.splitlines()[0].strip() if body.splitlines() else ''; upper=body.upper()
              accepted=('ACCEPTED_FOR_ZERO_RUNTIME_CONTROL_GATE' in upper or 'ACCEPTED_FOR_LIVE_REPOSITORY_DIAGNOSTIC' in upper or 'EXACT_BYTE_ACCEPTED' in upper)
              if 'PHYSICS_INDEPENDENT::EXEC005_V5R5' in first and head in body and accepted and 'REJECTED' not in upper and 'NONACCEPTED' not in upper:
                  hits.append(int(row['id']))
          if len(hits)==1:
              with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('authorized=true\nphysics_comment='+str(hits[0])+'\n')
              print('authorized=true physics_comment='+str(hits[0]))
          else:
              with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('authorized=false\n')
              print('authorized=false hits='+repr(hits))
          PY
      - name: Stop cleanly at independent-review boundary
        if: steps.physics.outputs.authorized != 'true'
        run: echo 'Physics acceptance for exact V5R5 bytes not yet present; protected repository observation intentionally not attempted.'
      - name: Wait for all non-self repository Actions to become terminal and stable
        if: steps.physics.outputs.authorized == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p v5r5-live/quiescence
          check_mutable() {
            local tag="$1"
            : > "v5r5-live/quiescence/$tag.ids"
            for status in in_progress queued requested waiting pending; do
              gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=$status&per_page=100" > "v5r5-live/quiescence/$tag-$status.json"
            done
            python - "$tag" <<'PY'
          import json,os,sys
          tag=sys.argv[1]; current=int(os.environ['GITHUB_RUN_ID']); ids=[]
          for status in ('in_progress','queued','requested','waiting','pending'):
              rows=json.load(open(f'v5r5-live/quiescence/{tag}-{status}.json'))['workflow_runs']
              ids.extend(int(r['id']) for r in rows if int(r['id'])!=current)
          ids=sorted(set(ids))
          open(f'v5r5-live/quiescence/{tag}.ids','w').write('\n'.join(map(str,ids))+('\n' if ids else ''))
          print('nonself_mutable_ids='+repr(ids))
          PY
          }
          stable=false
          for n in $(seq 1 90); do
            check_mutable first
            if test ! -s v5r5-live/quiescence/first.ids; then
              sleep 8
              check_mutable second
              if test ! -s v5r5-live/quiescence/second.ids; then stable=true; break; fi
            fi
            sleep 10
          done
          test "$stable" = true
      - name: Re-read complete authority surfaces and require quiescence immediately before observation A
        if: steps.physics.outputs.authorized == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/60" > v5r5-live/issue60-before.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > v5r5-live/issue60-pages-before.json
          gh api "repos/$GITHUB_REPOSITORY/issues/60" > v5r5-live/issue60-after.json
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$EXPECTED_MAIN"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}" --jq .head.sha)" = "$PR_HEAD"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}" --jq .base.sha)" = "$PR_BASE"
          python - <<'PY'
          import json,os,re
          a=json.load(open('v5r5-live/issue60-before.json')); b=json.load(open('v5r5-live/issue60-after.json'))
          assert a['comments']==b['comments'] and a['updated_at']==b['updated_at']
          pages=json.load(open('v5r5-live/issue60-pages-before.json')); rows=[r for p in pages for r in p]
          assert len(rows)==a['comments']
          def payload_first(body):
              first=(body or '').splitlines()[0].strip() if (body or '').splitlines() else ''
              return first.split('::',1)[1].strip() if '::' in first else first
          def marker(body,kind):
              first=payload_first(body); return first==kind or first.startswith(kind+' ') or first.startswith(kind+' |')
          key_re=re.compile(r'^(begin|beginComment|begin_comment)\s*[:=]\s*([0-9]+)$'); legacy_re=re.compile(r'^(begin|beginComment|begin_comment)=([0-9]+)$')
          def link(body):
              lines=(body or '').splitlines(); first=payload_first(body); vals=[]
              for field in first.split('|')[1:]:
                  m=key_re.fullmatch(field.strip())
                  if m: vals.append(m.group(2))
              for line in lines[1:]:
                  m=key_re.fullmatch(line.strip())
                  if m: vals.append(m.group(2))
              if not vals:
                  for token in first[len('WRITE_QUIET_END'):].strip().split():
                      m=legacy_re.fullmatch(token.strip())
                      if m: vals.append(m.group(2))
              distinct=list(dict.fromkeys(vals))
              if len(distinct)!=1: raise RuntimeError(f'live END linkage cardinality={len(distinct)} values={distinct}')
              return int(distinct[0])
          cutoff=int(os.environ['CONTROLLING_TRANSITION'])
          begins=[int(r['id']) for r in rows if int(r['id'])>cutoff and marker(r.get('body') or '', 'WRITE_QUIET_BEGIN')]
          ends=[(int(r['id']),link(r.get('body') or '')) for r in rows if int(r['id'])>cutoff and marker(r.get('body') or '', 'WRITE_QUIET_END')]
          linked={bid for _,bid in ends}
          for begin in begins:
              hits=[eid for eid,bid in ends if bid==begin]; assert len(hits)==1,(begin,hits)
          assert not (set(begins)-linked),(begins,ends)
          PY
          for status in in_progress queued requested waiting pending; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=$status&per_page=100" > "v5r5-live/final-$status.json"
          done
          python - <<'PY'
          import json,os
          current=int(os.environ['GITHUB_RUN_ID']); blockers=[]
          for status in ('in_progress','queued','requested','waiting','pending'):
              rows=json.load(open(f'v5r5-live/final-{status}.json'))['workflow_runs']
              blockers.extend((int(r['id']),status,r.get('path'),r.get('head_sha')) for r in rows if int(r['id'])!=current)
          assert not blockers,blockers
          PY
      - name: Run NON_AUTHORIZING ACTUAL complete-repository V5R5 control
        if: steps.physics.outputs.authorized == 'true'
        id: live
        continue-on-error: true
        shell: bash
