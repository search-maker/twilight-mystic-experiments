name: Lunar exec005 V5R6 non-science pagination and Physics binding repair

on:
  push:
    branches:
      - review/lunar-finite-disk-exec005-v5r6-pagination-physics-binding-repair-v1-20260910
    paths:
      - 'tools/lunar_exec005_v5r4_dedupe_order_repair_v1.py'
      - 'tools/lunar_exec005_v5r6_control_guard_v1.py'
      - '.github/workflows/lunar-finite-disk-exec005-v5r6-pagination-physics-binding-repair-v1.yml'
  pull_request:
    types: [opened, reopened]
    branches: [main]
    paths:
      - 'tools/lunar_exec005_v5r4_dedupe_order_repair_v1.py'
      - 'tools/lunar_exec005_v5r6_control_guard_v1.py'
      - '.github/workflows/lunar-finite-disk-exec005-v5r6-pagination-physics-binding-repair-v1.yml'

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: lunar-exec005-v5r6-pagination-physics-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

env:
  EXPECTED_BASE: 8cd85cf393e2d86a1b6d7325654747460a13e697
  EXPECTED_MAIN: 8cd85cf393e2d86a1b6d7325654747460a13e697
  EXPECTED_BRANCH: review/lunar-finite-disk-exec005-v5r6-pagination-physics-binding-repair-v1-20260910
  EXPECTED_COMMITS: '2'
  CONTROLLING_TRANSITION: '5612317997'
  REJECTED_V5R5_HEAD: d5a3e0a78292773f2214eefabedb97329e35dcb7
  REJECTED_V5R5_TREE: 5cf946e74773c640b3f0430ca1e9b72f361caf36
  V5R5_PHYSICS_REJECTION: '5612115920'
  V5R5_GENERIC_RUN: '34429607311'
  V5R5_GENERIC_ARTIFACT: '10133961985'
  V5R5_GENERIC_DIGEST: sha256:393726c8d17d4d86914133e367f25133fab9c38cc6f0e8d1720947c792382b34
  V5R5_PRELIM_RUN_1: '34429344010'
  V5R5_PRELIM_RUN_2: '34429439470'
  ACCEPTED_V5R4_PR: '1022'
  ACCEPTED_V5R4_HEAD: afe6ed0565e5f4aa7578a26cfde5c29365e066f0
  ACCEPTED_V5R4_TOOL_BLOB: 8701002021b08a493f48a0b0969d1b0380cffab5
  V5R4_PHYSICS_ACCEPTANCE: '5608202202'
  V5R4_TERMINAL_PHYSICS: '5611217257'
  FROZEN_V5R4_RUN: '34421313840'
  FROZEN_V5R4_ARTIFACT: '10131919561'
  FROZEN_V5R4_DIGEST: sha256:08f1000930e610a195e907a6911f3f83c27a489959f554d5c25ca0e0c43bdb11
  FROZEN_SIBLING_RUN: '34421313864'
  CANDIDATE_PHYSICS_COMMENT: '5571749637'
  CANDIDATE_SEED_CANONICAL: f2621958182e4e6824b1f166a9df0ddfda438431448b2fed68f8cad3a0e27dab
  CANDIDATE_ROWS_CANONICAL: a60ea88d5369a0df2b5119d194730c0998f93cec1b7f6c252083d9df9f2bea21
  SCANNER_BLOB: 4c6d704fa24228284780bcb1dd7c52537b4c5b0d
  TRACKED_SCANNER_BLOB: 1c110d75b516cb7b9d50dc2674080f4a67e55d2a
  HISTORICAL_LEGACY_END: '5471174859'
  HISTORICAL_BELOW_LINE_END: '5563105177'
  HISTORICAL_OVERMATCH_END: '5472575510'
  DIAGNOSTIC_TOOL: tools/lunar_exec005_v5r4_dedupe_order_repair_v1.py
  CONTROL_GUARD: tools/lunar_exec005_v5r6_control_guard_v1.py
  WORKFLOW_PATH: .github/workflows/lunar-finite-disk-exec005-v5r6-pagination-physics-binding-repair-v1.yml
  PHYSICS_TOKEN: PHYSICS_INDEPENDENT::EXEC005_V5R6_EXACT_BYTES_ACCEPTED_FOR_SINGLE_NON_SCIENCE_LIVE_CONTROL

jobs:
  generic-actual-byte-stress:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Bind exact V5R6 attempt1 lineage and frozen predecessor evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git merge-base "$EXPECTED_BASE" HEAD)" = "$EXPECTED_BASE"
          test "$(git rev-list --count "$EXPECTED_BASE..HEAD")" = "$EXPECTED_COMMITS"
          test -z "$(git rev-list --merges "$EXPECTED_BASE..HEAD")"
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)" = main
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$EXPECTED_MAIN"
          git diff --name-only "$EXPECTED_BASE"...HEAD | sort > changed.txt
          printf '%s\n' "$WORKFLOW_PATH" "$DIAGNOSTIC_TOOL" "$CONTROL_GUARD" | sort > expected.txt
          diff -u expected.txt changed.txt
          test "$(git hash-object "$DIAGNOSTIC_TOOL")" = "$ACCEPTED_V5R4_TOOL_BLOB"
          test "$(git hash-object experiments/aerosol-family-challenge-v2/repository_global_seed_scan.py)" = "$SCANNER_BLOB"
          test "$(git hash-object experiments/aerosol-family-challenge-v2/tracked_tree_seed_scan.py)" = "$TRACKED_SCANNER_BLOB"
          test -z "$(command -v uvspec || true)"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/review/lunar-finite-disk-exec005-v5r5-presnapshot-quiescence-repair-v1-20260909" --jq .object.sha)" = "$REJECTED_V5R5_HEAD"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$REJECTED_V5R5_HEAD" --jq .tree.sha)" = "$REJECTED_V5R5_TREE"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V5R5_GENERIC_RUN" --jq '[.id,.run_attempt,.status,.conclusion]|@tsv' | grep -Fx $'34429607311\t1\tcompleted\tsuccess'
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$V5R5_GENERIC_ARTIFACT" > v5r5-generic-artifact.json
          test "$(jq -r .digest v5r5-generic-artifact.json)" = "$V5R5_GENERIC_DIGEST"
          for run in "$V5R5_PRELIM_RUN_1" "$V5R5_PRELIM_RUN_2"; do
            test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .run_attempt)" = 1
            test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .status)" = completed
            test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .conclusion)" = failure
          done
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$V5R5_PHYSICS_REJECTION" --jq .body > v5r5-physics-rejection.txt
          grep -F "$REJECTED_V5R5_HEAD" v5r5-physics-rejection.txt
          grep -F 'ACTIONS_MUTABLE_INVENTORY_NOT_PAGINATED' v5r5-physics-rejection.txt
          grep -F 'FROZEN_PHYSICS_ACCEPTANCE_TOKEN_NOT_RECOGNIZED' v5r5-physics-rejection.txt
          grep -Ei 'NONACCEPTED|REJECT' v5r5-physics-rejection.txt
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CONTROLLING_TRANSITION" --jq .body > controlling-transition.txt
          grep -F 'EXACTLY ONE FRESH V5R6 AUTHORITY' controlling-transition.txt
          grep -F "$PHYSICS_TOKEN" controlling-transition.txt
          grep -F 'Exact 198 EXEC005 candidates remain candidate-only / unallocated / unapplied / unconsumed' controlling-transition.txt
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$ACCEPTED_V5R4_PR" --jq .head.sha)" = "$ACCEPTED_V5R4_HEAD"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FROZEN_V5R4_RUN" --jq '[.id,.run_attempt,.status,.conclusion]|@tsv' | grep -Fx $'34421313840\t1\tcompleted\tfailure'
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$FROZEN_V5R4_ARTIFACT" > v5r4-artifact.json
          test "$(jq -r .digest v5r4-artifact.json)" = "$FROZEN_V5R4_DIGEST"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FROZEN_SIBLING_RUN" > frozen-sibling-run.json
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$V5R4_PHYSICS_ACCEPTANCE" --jq .body | grep -F "$ACCEPTED_V5R4_HEAD"
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$V5R4_TERMINAL_PHYSICS" --jq .body | grep -F "$FROZEN_SIBLING_RUN"
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CANDIDATE_PHYSICS_COMMENT" --jq .body > candidate-physics.txt
          grep -F "$CANDIDATE_SEED_CANONICAL" candidate-physics.txt
          grep -F "$CANDIDATE_ROWS_CANONICAL" candidate-physics.txt
          grep -Ei 'candidate-only|unallocated|not allocated' candidate-physics.txt
      - name: Clear stale V5R6 workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v5r6-generic/stale
          printf 'stale\n' > v5r6-generic/stale/sentinel
          rm -rf v5r6-generic
          mkdir -p v5r6-generic
          test ! -e v5r6-generic/stale/sentinel
      - name: Materialize COMPLETE then-live issue 60 corpus
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/60" > v5r6-generic/issue60-before.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > v5r6-generic/issue60-pages.json
          for id in "$HISTORICAL_LEGACY_END" "$HISTORICAL_BELOW_LINE_END" "$HISTORICAL_OVERMATCH_END"; do
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/$id" > "v5r6-generic/comment-$id.json"
          done
          gh api "repos/$GITHUB_REPOSITORY/issues/60" > v5r6-generic/issue60-after.json
      - name: NON_AUTHORIZING ACTUAL EXACT_EXECUTABLE_STRESS_PASS
        shell: bash
        run: |
          set -euo pipefail
          python "$DIAGNOSTIC_TOOL" --self-test | tee v5r6-generic/diagnostic-self-test.json
          python "$CONTROL_GUARD" --self-test | tee v5r6-generic/guard-self-test.json
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,re
          tool=Path(os.environ['DIAGNOSTIC_TOOL']); guard=Path(os.environ['CONTROL_GUARD']); wf=Path(os.environ['WORKFLOW_PATH'])
          data=tool.read_bytes(); blob=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          assert blob==os.environ['ACCEPTED_V5R4_TOOL_BLOB']
          text=tool.read_text(); wft=wf.read_text(); guardt=guard.read_text()
          assert 'subprocess' not in text and 'candidateSeeds' not in text
          assert "surface == 'runs' and name in {'status', 'conclusion', 'run_attempt'}" in text
          assert "surface == 'pulls' and name in {'state', 'state_reason'}" in text
          assert 'v5r4_build_snapshot_fence(base, initial_raw, current_run_id)' in text
          assert 'final = bound_observation(base, collect_fn(), fence, current_run_id)' in text
          assert 'write_receipt(args.output, receipt)' in text
          assert '--paginate --slurp' in wft and 'actions/runs?status=$status&per_page=100' in wft
          assert os.environ['PHYSICS_TOKEN'] in guardt and 'EXACT_BYTE_ACCEPTED' in guardt

          before=json.load(open('v5r6-generic/issue60-before.json')); after=json.load(open('v5r6-generic/issue60-after.json'))
          assert before['comments']==after['comments'] and before['updated_at']==after['updated_at']
          pages=json.load(open('v5r6-generic/issue60-pages.json')); comments=[r for p in pages for r in p]
          assert len(comments)==before['comments'] and len({int(r['id']) for r in comments})==len(comments)
          byid={int(r['id']):r for r in comments}
          assert int(os.environ['CONTROLLING_TRANSITION']) in byid and int(os.environ['V5R5_PHYSICS_REJECTION']) in byid

          def payload_first(body):
              first=(body or '').splitlines()[0].strip() if (body or '').splitlines() else ''
              return first.split('::',1)[1].strip() if '::' in first else first
          def marker(body,kind):
              x=payload_first(body); return x==kind or x.startswith(kind+' ') or x.startswith(kind+' |')
          key=re.compile(r'^(begin|beginComment|begin_comment)\s*[:=]\s*([0-9]+)$'); legacy=re.compile(r'^(begin|beginComment|begin_comment)=([0-9]+)$')
          def end_link(body):
              lines=(body or '').splitlines(); x=payload_first(body); vals=[]
              assert marker(body,'WRITE_QUIET_END')
              for field in x.split('|')[1:]:
                  m=key.fullmatch(field.strip()); vals += [m.group(2)] if m else []
              for line in lines[1:]:
                  m=key.fullmatch(line.strip()); vals += [m.group(2)] if m else []
              if not vals:
                  for token in x[len('WRITE_QUIET_END'):].strip().split():
                      m=legacy.fullmatch(token.strip()); vals += [m.group(2)] if m else []
              distinct=list(dict.fromkeys(vals)); assert len(distinct)==1,(x,distinct); return int(distinct[0])
          assert end_link(json.load(open('v5r6-generic/comment-'+os.environ['HISTORICAL_LEGACY_END']+'.json'))['body'])==5471141095
          assert end_link(json.load(open('v5r6-generic/comment-'+os.environ['HISTORICAL_BELOW_LINE_END']+'.json'))['body'])==5562775627
          assert end_link(json.load(open('v5r6-generic/comment-'+os.environ['HISTORICAL_OVERMATCH_END']+'.json'))['body'])==5472560826
          cutoff=int(os.environ['CONTROLLING_TRANSITION']); begins=[]; ends=[]
          for r in comments:
              if int(r['id'])<=cutoff: continue
              body=r.get('body') or ''
              if marker(body,'WRITE_QUIET_BEGIN'): begins.append(int(r['id']))
              elif marker(body,'WRITE_QUIET_END'): ends.append((int(r['id']),end_link(body)))
          for begin in begins: assert len([eid for eid,bid in ends if bid==begin])==1,(begin,ends)
          assert not (set(begins)-{bid for _,bid in ends}),(begins,ends)

          ds=json.load(open('v5r6-generic/diagnostic-self-test.json'))
          assert ds['sameContextPass'] is True and ds['nestedRepositorySummaryNoiseIgnored'] is True
          assert ds['meaningfulPullRunDriftCaughtCount']>=15
          assert ds['pathSpecificProjectionPrecedesStableIdDedupe'] is True and ds['finalUsesSameBoundObservationPath'] is True
          assert ds['exceptionReceiptPersisted'] is True
          assert ds['candidateCount']==198 and ds['candidateState']=='candidate-only/unallocated/unapplied/unconsumed'
          gs=json.load(open('v5r6-generic/guard-self-test.json'))
          assert all(gs['allMutableStatusesPaginated'].values())
          for key in ('page2PlusBlockerEnumerated','exactSelfExclusion','incompletePaginationFailsClosed','malformedPaginationFailsClosed','countMismatchFailsClosed','exactPositivePhysicsTokenAccepted','duplicatePositivePhysicsFailsClosed','rejectionConflictFailsClosed','identityMismatchFailsClosed','legacyLooseAliasNotAccepted'):
              assert gs[key] is True,(key,gs)

          # ACTUAL helper path with >100 rows in every mutable status and a designated non-self blocker only on page 2.
          fixture=Path('v5r6-generic/actions-fixture'); fixture.mkdir()
          statuses=('in_progress','queued','requested','waiting','pending'); sentinel=900001
          for si,status in enumerate(statuses):
              rows=[{'id':100000+si*1000+i,'status':status,'path':'fixture/page1'} for i in range(100)]
              rows.append({'id':sentinel+si,'status':status,'path':'fixture/page2-only-sentinel'})
              pages=[{'total_count':101,'workflow_runs':rows[:100]},{'total_count':101,'workflow_runs':rows[100:]}]
              (fixture.parent/f'inv-{status}.json').write_text(json.dumps(pages))
          PY
          python "$CONTROL_GUARD" --actions-prefix v5r6-generic/inv --current-run-id 9999999 --output v5r6-generic/actual-pagination-fixture.json
          python - <<'PY'
          import json
          r=json.load(open('v5r6-generic/actual-pagination-fixture.json'))
          assert r['completePagination'] is True and r['enumeratedMutableCount']==505
          for sid in range(900001,900006): assert sid in r['blockerIds']
          assert r['mutableStatuses']==['in_progress','queued','requested','waiting','pending']
          PY
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          actual=json.load(open('frozen-sibling-run.json'))
          mutable={'queued','in_progress','requested','waiting','pending'}
          def blockers(rows,current): return sorted(int(r['id']) for r in rows if int(r['id'])!=current and r.get('status') in mutable)
          live=dict(actual); live['status']='in_progress'; live['conclusion']=None
          assert blockers([live],999999)==[int(os.environ['FROZEN_SIBLING_RUN'])] and blockers([actual],999999)==[]
          fields=('id','status','conclusion','run_attempt','head_sha','head_branch','path','event')
          def lifecycle(rows,current): return sorted(tuple(r.get(k) for k in fields) for r in rows if int(r['id'])!=current)
          changed=dict(actual,conclusion='failure'); assert lifecycle([actual],999999)!=lifecycle([changed],999999)
          receipt={
            'schema':'LUNAR_EXEC005_V5R6_GENERIC_ACTUAL_BYTE_STRESS_V1','status':'EXACT_EXECUTABLE_STRESS_PASS',
            'controllingTransition':os.environ['CONTROLLING_TRANSITION'],'head':os.environ['GITHUB_SHA'],'base':os.environ['EXPECTED_BASE'],'branch':os.environ['EXPECTED_BRANCH'],
            'tree':os.popen('git rev-parse HEAD^{tree}').read().strip(),'runAttempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
            'diagnosticToolBlob':os.environ['ACCEPTED_V5R4_TOOL_BLOB'],'diagnosticToolSha256':hashlib.sha256(Path(os.environ['DIAGNOSTIC_TOOL']).read_bytes()).hexdigest(),
            'controlGuardSha256':hashlib.sha256(Path(os.environ['CONTROL_GUARD']).read_bytes()).hexdigest(),'workflowSha256':hashlib.sha256(Path(os.environ['WORKFLOW_PATH']).read_bytes()).hexdigest(),
            'issue60CommentCount':len(json.load(open('v5r6-generic/issue60-pages.json'))[0]) if False else json.load(open('v5r6-generic/issue60-before.json'))['comments'],
            'completeMutableActionsPaginationPass':True,'page2PlusBlockerPass':True,'allMutableStatusesPass':True,'exactSelfExclusionPass':True,
            'exactPhysicsPositiveTokenPass':True,'physicsRejectionConflictMismatchFailClosedPass':True,'siblingLifecycleQuiescencePass':True,
            'completeIssue60WriteQuietCurrentTailPass':True,'staleWorkspacePass':True,'receiptPassFailSchemaPreserved':True,
            'candidateCount':198,'candidateSeedCanonicalSha256':os.environ['CANDIDATE_SEED_CANONICAL'],'candidateRowsCanonicalSha256':os.environ['CANDIDATE_ROWS_CANONICAL'],
            'candidateState':'candidate-only/unallocated/unapplied/unconsumed','scienceAuthorized':False,'protectedAttemptAuthorized':False,'seedValuesPresent':False,'solverRuntimePresent':False,
          }
          Path('v5r6-generic/generic-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lunar-exec005-v5r6-generic-actual-byte-stress
          path: v5r6-generic
          if-no-files-found: error

  independent-review-gated-live-diagnostic:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Bind exact PR event, two-commit lineage and exact generic artifact
        id: generic
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_HEAD_REF" = "$EXPECTED_BRANCH"
          test "$PR_BASE" = "$EXPECTED_BASE"
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          test "$(git merge-base "$EXPECTED_BASE" HEAD)" = "$EXPECTED_BASE"
          test "$(git rev-list --count "$EXPECTED_BASE..HEAD")" = "$EXPECTED_COMMITS"
          test -z "$(git rev-list --merges "$EXPECTED_BASE..HEAD")"
          test "$(git hash-object "$DIAGNOSTIC_TOOL")" = "$ACCEPTED_V5R4_TOOL_BLOB"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$EXPECTED_MAIN"
          test -z "$(command -v uvspec || true)"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$PR_HEAD&event=push&per_page=100" > exact-push-run-pages.json
          python - <<'PY'
          import json,os
          pages=json.load(open('exact-push-run-pages.json')); rows=[]
          for page in pages:
              if not isinstance(page,dict) or not isinstance(page.get('workflow_runs'),list): raise RuntimeError('malformed push-run pagination')
              rows.extend(page['workflow_runs'])
          hits=[r for r in rows if r.get('path')==os.environ['WORKFLOW_PATH']]
          assert len(hits)==1,[(r.get('id'),r.get('status'),r.get('conclusion')) for r in hits]
          r=hits[0]; assert r['run_attempt']==1 and r['status']=='completed' and r['conclusion']=='success',r
          open('generic-run-id.txt','w').write(str(r['id']))
          PY
          generic_run="$(cat generic-run-id.txt)"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$generic_run/artifacts?per_page=100" > generic-artifact-pages.json
          python - <<'PY'
          import json
          pages=json.load(open('generic-artifact-pages.json')); rows=[]; totals=[]
          for page in pages:
              assert isinstance(page,dict) and isinstance(page.get('artifacts'),list); totals.append(page.get('total_count')); rows.extend(page['artifacts'])
          assert totals and len(set(totals))==1 and len(rows)==totals[0]
          hits=[a for a in rows if a.get('name')=='lunar-exec005-v5r6-generic-actual-byte-stress' and not a.get('expired')]
          assert len(hits)==1,[(a.get('id'),a.get('name'),a.get('expired')) for a in hits]
          a=hits[0]; open('generic-artifact-id.txt','w').write(str(a['id'])); open('generic-artifact-digest.txt','w').write(str(a.get('digest') or ''))
          PY
          echo "run_id=$generic_run" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$(cat generic-artifact-id.txt)" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$(cat generic-artifact-digest.txt)" >> "$GITHUB_OUTPUT"
      - name: Require exact independent Physics V5R6 token bound to head tree branch artifact
        id: physics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          GENERIC_ARTIFACT: ${{ steps.generic.outputs.artifact_id }}
        run: |
          set -euo pipefail
          mkdir -p v5r6-live
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > v5r6-live/issue60-pages-review.json
          tree="$(git rev-parse HEAD^{tree})"
          python "$CONTROL_GUARD" --physics-comments v5r6-live/issue60-pages-review.json --cutoff "$CONTROLLING_TRANSITION" --head "$PR_HEAD" --tree "$tree" --branch "$EXPECTED_BRANCH" --artifact-id "$GENERIC_ARTIFACT" --output v5r6-live/physics-binding.json
          authorized="$(python -c "import json; print(str(json.load(open('v5r6-live/physics-binding.json'))['authorized']).lower())")"
          echo "authorized=$authorized" >> "$GITHUB_OUTPUT"
          if test "$authorized" = true; then
            echo "physics_comment=$(python -c "import json; print(json.load(open('v5r6-live/physics-binding.json'))['positiveCommentIds'][0])")" >> "$GITHUB_OUTPUT"
          fi
      - name: Stop cleanly at independent-review boundary
        if: steps.physics.outputs.authorized != 'true'
        run: echo 'Exact V5R6 Physics acceptance not present; no protected repository observation attempted.'
      - name: Wait for COMPLETE paginated non-self mutable Actions to become terminal and stable
        if: steps.physics.outputs.authorized == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p v5r6-live/quiescence
          fetch_inventory() {
            tag="$1"
            for status in in_progress queued requested waiting pending; do
              gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs?status=$status&per_page=100" > "v5r6-live/quiescence/$tag-$status.json"
            done
            python "$CONTROL_GUARD" --actions-prefix "v5r6-live/quiescence/$tag" --current-run-id "$GITHUB_RUN_ID" --output "v5r6-live/quiescence/$tag-inventory.json"
          }
          stable=false
          for n in $(seq 1 90); do
            if fetch_inventory first && test "$(jq '.blockerIds|length' v5r6-live/quiescence/first-inventory.json)" = 0; then
              sleep 8
              if fetch_inventory second && test "$(jq '.blockerIds|length' v5r6-live/quiescence/second-inventory.json)" = 0; then stable=true; break; fi
            fi
            sleep 10
          done
          test "$stable" = true
      - name: Re-read complete authority surfaces and COMPLETE quiescence before observation A
        if: steps.physics.outputs.authorized == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/60" > v5r6-live/issue60-before.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > v5r6-live/issue60-pages-before.json
          gh api "repos/$GITHUB_REPOSITORY/issues/60" > v5r6-live/issue60-after.json
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$EXPECTED_MAIN"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}" --jq .head.sha)" = "$PR_HEAD"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}" --jq .base.sha)" = "$PR_BASE"
          python - <<'PY'
          import json,os,re
          a=json.load(open('v5r6-live/issue60-before.json')); b=json.load(open('v5r6-live/issue60-after.json')); assert a['comments']==b['comments'] and a['updated_at']==b['updated_at']
          pages=json.load(open('v5r6-live/issue60-pages-before.json')); rows=[r for p in pages for r in p]
          assert len(rows)==a['comments'] and len({int(r['id']) for r in rows})==len(rows)
          def first(body):
              x=(body or '').splitlines()[0].strip() if (body or '').splitlines() else ''; return x.split('::',1)[1].strip() if '::' in x else x
          def marker(body,k):
              x=first(body); return x==k or x.startswith(k+' ') or x.startswith(k+' |')
          key=re.compile(r'^(begin|beginComment|begin_comment)\s*[:=]\s*([0-9]+)$'); legacy=re.compile(r'^(begin|beginComment|begin_comment)=([0-9]+)$')
          def link(body):
              lines=(body or '').splitlines(); x=first(body); vals=[]
              for field in x.split('|')[1:]:
                  m=key.fullmatch(field.strip()); vals += [m.group(2)] if m else []
              for line in lines[1:]:
                  m=key.fullmatch(line.strip()); vals += [m.group(2)] if m else []
              if not vals:
                  for token in x[len('WRITE_QUIET_END'):].strip().split():
                      m=legacy.fullmatch(token.strip()); vals += [m.group(2)] if m else []
              d=list(dict.fromkeys(vals)); assert len(d)==1,(x,d); return int(d[0])
          cutoff=int(os.environ['CONTROLLING_TRANSITION']); begins=[int(r['id']) for r in rows if int(r['id'])>cutoff and marker(r.get('body') or '','WRITE_QUIET_BEGIN')]; ends=[(int(r['id']),link(r.get('body') or '')) for r in rows if int(r['id'])>cutoff and marker(r.get('body') or '','WRITE_QUIET_END')]
          for begin in begins: assert len([eid for eid,bid in ends if bid==begin])==1,(begin,ends)
          assert not (set(begins)-{bid for _,bid in ends}),(begins,ends)
          PY
          for status in in_progress queued requested waiting pending; do
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs?status=$status&per_page=100" > "v5r6-live/authority-$status.json"
          done
          python "$CONTROL_GUARD" --actions-prefix v5r6-live/authority --current-run-id "$GITHUB_RUN_ID" --output v5r6-live/authority-inventory.json
          test "$(jq '.blockerIds|length' v5r6-live/authority-inventory.json)" = 0
      - name: Immediate COMPLETE mutable-Action guard immediately before control
        if: steps.physics.outputs.authorized == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for status in in_progress queued requested waiting pending; do
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs?status=$status&per_page=100" > "v5r6-live/immediate-$status.json"
          done
          python "$CONTROL_GUARD" --actions-prefix v5r6-live/immediate --current-run-id "$GITHUB_RUN_ID" --output v5r6-live/immediate-inventory.json
          test "$(jq '.blockerIds|length' v5r6-live/immediate-inventory.json)" = 0
      - name: Run NON_AUTHORIZING ACTUAL complete-repository V5R6 control
        if: steps.physics.outputs.authorized == 'true'
        id: live
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f v5r6-live/repository-context-diagnostic.json
          python "$DIAGNOSTIC_TOOL" --repository "$GITHUB_REPOSITORY" --issue-number 60 --current-run-id "$GITHUB_RUN_ID" --output v5r6-live/repository-context-diagnostic.json
      - name: Validate sanitized schema-valid receipt on pass or fail
        if: steps.physics.outputs.authorized == 'true' && always()
        shell: bash
        run: |
          set -euo pipefail
          test -f v5r6-live/repository-context-diagnostic.json
          python - <<'PY'
          import json
          row=json.load(open('v5r6-live/repository-context-diagnostic.json'))
          assert row['schema']=='LUNAR_EXEC005_V5R4_REPOSITORY_CONTEXT_DIAGNOSTIC_V1' and row['batchCount']==3
          assert row['scienceAuthorized'] is False and row['protectedAttemptAuthorized'] is False and row['seedValuesPresent'] is False and row['solverRuntimePresent'] is False
          assert row['candidateCount']==198 and row['candidateState']=='candidate-only/unallocated/unapplied/unconsumed'
          assert row['normalization']['pathSpecificProjectionPrecedesStableIdDedupe'] is True and row['normalization']['rootRunStatusConclusionAttemptPreserved'] is True and row['normalization']['rootPullStateAndStateReasonPreserved'] is True
          assert row['status'] in {'PASS_V5R4_DEDUPE_ORDER_REPAIR_STABLE_NOT_AUTHORIZED','FAIL_CLOSED_V5R4_REPOSITORY_CONTEXT_DRIFT_OBSERVED_NOT_AUTHORIZED','FAIL_CLOSED_V5R4_REPOSITORY_CONTEXT_EXCEPTION_NOT_AUTHORIZED'}
          if row['status'].startswith('PASS_'):
              assert len(row['batches'])==3 and row['exception'] is None and row['finalLiveReenumeration'] is not None and row['allIntraBatchStable'] is True and row['crossBatchCommonContext'] is True and row['finalLiveEqualsCapturedContext'] is True
          elif row['status'].endswith('EXCEPTION_NOT_AUTHORIZED'):
              assert set(row['exception'])=={'class','message'}
          PY
      - uses: actions/upload-artifact@v4
        if: steps.physics.outputs.authorized == 'true' && always()
        with:
          name: lunar-exec005-v5r6-repository-context-diagnostic
          path: v5r6-live/repository-context-diagnostic.json
          if-no-files-found: error
      - name: Preserve fail-closed terminal classification
        if: steps.physics.outputs.authorized == 'true' && always()
        shell: bash
        run: |
          set -euo pipefail
          status="$(python -c "import json; print(json.load(open('v5r6-live/repository-context-diagnostic.json'))['status'])")"
          echo "diagnostic_status=$status"
          test "$status" = PASS_V5R4_DEDUPE_ORDER_REPAIR_STABLE_NOT_AUTHORIZED
