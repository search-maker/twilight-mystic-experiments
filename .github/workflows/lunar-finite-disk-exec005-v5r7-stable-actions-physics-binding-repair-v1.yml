name: Lunar exec005 V5R7 non-science stable Actions and Physics binding repair

on:
  push:
    branches:
      - review/lunar-finite-disk-exec005-v5r7-stable-actions-physics-binding-repair-v1-20260910
    paths:
      - 'tools/lunar_exec005_v5r4_dedupe_order_repair_v1.py'
      - 'tools/lunar_exec005_v5r7_control_guard_v1.py'
      - '.github/workflows/lunar-finite-disk-exec005-v5r7-stable-actions-physics-binding-repair-v1.yml'
  pull_request:
    types: [opened, reopened]
    branches: [main]
    paths:
      - 'tools/lunar_exec005_v5r4_dedupe_order_repair_v1.py'
      - 'tools/lunar_exec005_v5r7_control_guard_v1.py'
      - '.github/workflows/lunar-finite-disk-exec005-v5r7-stable-actions-physics-binding-repair-v1.yml'

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: lunar-exec005-v5r7-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

env:
  EXPECTED_BASE: 8cd85cf393e2d86a1b6d7325654747460a13e697
  EXPECTED_MAIN: 8cd85cf393e2d86a1b6d7325654747460a13e697
  EXPECTED_BRANCH: review/lunar-finite-disk-exec005-v5r7-stable-actions-physics-binding-repair-v1-20260910
  EXPECTED_COMMITS: '2'
  CONTROLLING_TRANSITION: '5613718749'
  REJECTED_V5R6_HEAD: 1c61b3f83b17b335651c9206898e73c42278bb8c
  REJECTED_V5R6_TREE: bdb964231ae66b6a7dc77047e57fbff01c15141c
  V5R6_PHYSICS_REJECTION: '5613592391'
  V5R6_GENERIC_RUN: '34437028222'
  V5R6_GENERIC_ARTIFACT: '10136534573'
  V5R6_GENERIC_DIGEST: sha256:5d0027b64da132bd06cfbed33ee82b3d68b0806b37d865a758c6d3423699c1fc
  ACCEPTED_V5R4_TOOL_BLOB: 8701002021b08a493f48a0b0969d1b0380cffab5
  ACCEPTED_V5R4_PR: '1022'
  ACCEPTED_V5R4_HEAD: afe6ed0565e5f4aa7578a26cfde5c29365e066f0
  CANDIDATE_PHYSICS_COMMENT: '5571749637'
  CANDIDATE_SEED_CANONICAL: f2621958182e4e6824b1f166a9df0ddfda438431448b2fed68f8cad3a0e27dab
  CANDIDATE_ROWS_CANONICAL: a60ea88d5369a0df2b5119d194730c0998f93cec1b7f6c252083d9df9f2bea21
  SCANNER_BLOB: 4c6d704fa24228284780bcb1dd7c52537b4c5b0d
  TRACKED_SCANNER_BLOB: 1c110d75b516cb7b9d50dc2674080f4a67e55d2a
  DIAGNOSTIC_TOOL: tools/lunar_exec005_v5r4_dedupe_order_repair_v1.py
  CONTROL_GUARD: tools/lunar_exec005_v5r7_control_guard_v1.py
  WORKFLOW_PATH: .github/workflows/lunar-finite-disk-exec005-v5r7-stable-actions-physics-binding-repair-v1.yml
  PHYSICS_TOKEN: PHYSICS_INDEPENDENT::EXEC005_V5R7_EXACT_BYTES_ACCEPTED_FOR_SINGLE_NON_SCIENCE_LIVE_CONTROL

jobs:
  generic-actual-byte-stress:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Bind exact V5R7 attempt1 lineage and frozen predecessor evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git merge-base "$EXPECTED_BASE" HEAD)" = "$EXPECTED_BASE"
          test "$(git rev-list --count "$EXPECTED_BASE..HEAD")" = "$EXPECTED_COMMITS"
          test -z "$(git rev-list --merges "$EXPECTED_BASE..HEAD")"
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)" = main
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$EXPECTED_MAIN"
          git diff --name-only "$EXPECTED_BASE"...HEAD | sort > changed.txt
          printf '%s\n' "$WORKFLOW_PATH" "$DIAGNOSTIC_TOOL" "$CONTROL_GUARD" | sort > expected.txt
          diff -u expected.txt changed.txt
          test "$(git hash-object "$DIAGNOSTIC_TOOL")" = "$ACCEPTED_V5R4_TOOL_BLOB"
          test "$(git hash-object experiments/aerosol-family-challenge-v2/repository_global_seed_scan.py)" = "$SCANNER_BLOB"
          test "$(git hash-object experiments/aerosol-family-challenge-v2/tracked_tree_seed_scan.py)" = "$TRACKED_SCANNER_BLOB"
          test -z "$(command -v uvspec || true)"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/review/lunar-finite-disk-exec005-v5r6-pagination-physics-binding-repair-v1-20260910" --jq .object.sha)" = "$REJECTED_V5R6_HEAD"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$REJECTED_V5R6_HEAD" --jq .tree.sha)" = "$REJECTED_V5R6_TREE"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V5R6_GENERIC_RUN" --jq '[.id,.run_attempt,.status,.conclusion]|@tsv' | grep -Fx $'34437028222\t1\tcompleted\tsuccess'
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$V5R6_GENERIC_ARTIFACT" > v5r6-artifact.json
          test "$(jq -r .digest v5r6-artifact.json)" = "$V5R6_GENERIC_DIGEST"
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$V5R6_PHYSICS_REJECTION" --jq .body > v5r6-physics-rejection.txt
          grep -F "$REJECTED_V5R6_HEAD" v5r6-physics-rejection.txt
          grep -Ei 'NONACCEPTED|REJECT' v5r6-physics-rejection.txt
          grep -F 'same-comment' v5r6-physics-rejection.txt
          grep -F 'substring' v5r6-physics-rejection.txt
          grep -F 'sequential status-filtered' v5r6-physics-rejection.txt
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CONTROLLING_TRANSITION" --jq .body > controlling-transition.txt
          grep -F 'EXEC005_V5R7' controlling-transition.txt
          grep -F "$PHYSICS_TOKEN" controlling-transition.txt
          grep -F 'COMPLETE unfiltered Actions-run inventory' controlling-transition.txt
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$ACCEPTED_V5R4_PR" --jq .head.sha)" = "$ACCEPTED_V5R4_HEAD"
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CANDIDATE_PHYSICS_COMMENT" --jq .body > candidate-physics.txt
          grep -F "$CANDIDATE_SEED_CANONICAL" candidate-physics.txt
          grep -F "$CANDIDATE_ROWS_CANONICAL" candidate-physics.txt
          grep -Ei 'candidate-only|unallocated|not allocated' candidate-physics.txt

      - name: Clear stale V5R7 workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v5r7-generic/stale
          printf 'stale\n' > v5r7-generic/stale/sentinel
          rm -rf v5r7-generic
          mkdir -p v5r7-generic
          test ! -e v5r7-generic/stale/sentinel

      - name: Materialize COMPLETE then-live issue 60 corpus
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/60" > v5r7-generic/issue60-before.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > v5r7-generic/issue60-pages.json
          gh api "repos/$GITHUB_REPOSITORY/issues/60" > v5r7-generic/issue60-after.json

      - name: NON_AUTHORIZING ACTUAL EXACT_EXECUTABLE_STRESS_PASS
        shell: bash
        run: |
          set -euo pipefail
          python "$DIAGNOSTIC_TOOL" --self-test | tee v5r7-generic/diagnostic-self-test.json
          python "$CONTROL_GUARD" --self-test | tee v5r7-generic/guard-self-test.json
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,re
          tool=Path(os.environ['DIAGNOSTIC_TOOL'])
          guard=Path(os.environ['CONTROL_GUARD'])
          wf=Path(os.environ['WORKFLOW_PATH'])
          data=tool.read_bytes()
          blob=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          assert blob==os.environ['ACCEPTED_V5R4_TOOL_BLOB']
          text=tool.read_text()
          wft=wf.read_text()
          guardt=guard.read_text()
          assert 'subprocess' not in text and 'candidateSeeds' not in text
          assert "surface == 'runs' and name in {'status', 'conclusion', 'run_attempt'}" in text
          assert "surface == 'pulls' and name in {'state', 'state_reason'}" in text
          assert 'v5r4_build_snapshot_fence(base, initial_raw, current_run_id)' in text
          assert 'final = bound_observation(base, collect_fn(), fence, current_run_id)' in text
          assert 'write_receipt(args.output, receipt)' in text
          assert 'actions/runs?status=' not in wft
          assert wft.count('actions/runs?per_page=100') >= 3
          assert os.environ['PHYSICS_TOKEN'] in guardt
          before=json.load(open('v5r7-generic/issue60-before.json'))
          after=json.load(open('v5r7-generic/issue60-after.json'))
          assert before['comments']==after['comments'] and before['updated_at']==after['updated_at']
          pages=json.load(open('v5r7-generic/issue60-pages.json'))
          comments=[row for page in pages for row in page]
          assert len(comments)==before['comments']
          assert len({int(row['id']) for row in comments})==len(comments)
          byid={int(row['id']):row for row in comments}
          assert int(os.environ['CONTROLLING_TRANSITION']) in byid
          assert int(os.environ['V5R6_PHYSICS_REJECTION']) in byid

          def payload_first(body):
              lines=(body or '').splitlines()
              first=lines[0].strip() if lines else ''
              return first.split('::',1)[1].strip() if '::' in first else first
          def marker(body,kind):
              first=payload_first(body)
              return first==kind or first.startswith(kind+' ') or first.startswith(kind+' |')
          key=re.compile(r'^(begin|beginComment|begin_comment)\s*[:=]\s*`?([0-9]+)`?$')
          sentence=re.compile(r'^Exact matching closure for BEGIN\s+`?([0-9]+)`?\s+only\.$')
          legacy=re.compile(r'^(begin|beginComment|begin_comment)=([0-9]+)$')
          def end_link(body):
              lines=(body or '').splitlines()
              first=payload_first(body)
              values=[]
              for field in first.split('|')[1:]:
                  m=key.fullmatch(field.strip())
                  if m: values.append(m.group(2))
              for line in lines[1:]:
                  stripped=line.strip()
                  m=key.fullmatch(stripped)
                  if m: values.append(m.group(2))
                  s=sentence.fullmatch(stripped)
                  if s: values.append(s.group(1))
              if not values:
                  for token in first[len('WRITE_QUIET_END'):].strip().split():
                      m=legacy.fullmatch(token.strip())
                      if m: values.append(m.group(2))
              distinct=list(dict.fromkeys(values))
              assert len(distinct)==1,(first,distinct)
              return int(distinct[0])
          cutoff=int(os.environ['CONTROLLING_TRANSITION'])
          begins=[]
          ends=[]
          for row in comments:
              if int(row['id'])<=cutoff: continue
              body=row.get('body') or ''
              if marker(body,'WRITE_QUIET_BEGIN'):
                  begins.append(int(row['id']))
              elif marker(body,'WRITE_QUIET_END'):
                  ends.append((int(row['id']),end_link(body)))
          for begin in begins:
              assert len([eid for eid,bid in ends if bid==begin])==1,(begin,ends)
          assert not (set(begins)-{bid for _,bid in ends}),(begins,ends)

          ds=json.load(open('v5r7-generic/diagnostic-self-test.json'))
          assert ds['sameContextPass'] is True
          assert ds['nestedRepositorySummaryNoiseIgnored'] is True
          assert ds['meaningfulPullRunDriftCaughtCount']>=15
          assert ds['pathSpecificProjectionPrecedesStableIdDedupe'] is True
          assert ds['finalUsesSameBoundObservationPath'] is True
          assert ds['exceptionReceiptPersisted'] is True
          assert ds['candidateCount']==198
          assert ds['candidateState']=='candidate-only/unallocated/unapplied/unconsumed'

          gs=json.load(open('v5r7-generic/guard-self-test.json'))
          for key,value in gs.items():
              if key!='schema': assert value is True,(key,gs)

          completed=[{
              'id':i+1,'status':'completed','conclusion':'success','run_attempt':1,
              'head_sha':'a'*40,'head_branch':'fixture','path':'fixture','event':'push'
          } for i in range(100)]
          sentinel={
              'id':900001,'status':'queued','conclusion':None,'run_attempt':1,
              'head_sha':'b'*40,'head_branch':'fixture','path':'page2','event':'push'
          }
          Path('v5r7-generic/actions-page2.json').write_text(json.dumps([
              {'total_count':101,'workflow_runs':completed},
              {'total_count':101,'workflow_runs':[sentinel]},
          ]))
          PY
          python "$CONTROL_GUARD" --actions-pages v5r7-generic/actions-page2.json --current-run-id 9999999 --output v5r7-generic/actions-page2-result.json
          python - <<'PY'
          import json
          row=json.load(open('v5r7-generic/actions-page2-result.json'))
          assert row['completeUnfilteredPagination'] is True
          assert row['totalRunCount']==101
          assert row['blockerIds']==[900001]
          PY
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          receipt={
              'schema':'LUNAR_EXEC005_V5R7_GENERIC_ACTUAL_BYTE_STRESS_V1',
              'status':'EXACT_EXECUTABLE_STRESS_PASS',
              'controllingTransition':os.environ['CONTROLLING_TRANSITION'],
              'head':os.environ['GITHUB_SHA'],
              'tree':os.popen('git rev-parse HEAD^{tree}').read().strip(),
              'base':os.environ['EXPECTED_BASE'],
              'branch':os.environ['EXPECTED_BRANCH'],
              'runAttempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
              'diagnosticToolBlob':os.environ['ACCEPTED_V5R4_TOOL_BLOB'],
              'controlGuardSha256':hashlib.sha256(Path(os.environ['CONTROL_GUARD']).read_bytes()).hexdigest(),
              'workflowSha256':hashlib.sha256(Path(os.environ['WORKFLOW_PATH']).read_bytes()).hexdigest(),
              'completeUnfilteredActionsPaginationPass':True,
              'page2PlusBlockerPass':True,
              'allMutableStatusesLocalFilterPass':True,
              'selfExclusionPass':True,
              'mutableStatusTransitionStabilityPass':True,
              'sameCommentRejectionPrecedencePass':True,
              'uniqueAnchoredPhysicsIdentityBindingPass':True,
              'completeIssue60WriteQuietCurrentTailPass':True,
              'staleWorkspacePass':True,
              'receiptPassFailSchemaPreserved':True,
              'candidateCount':198,
              'candidateSeedCanonicalSha256':os.environ['CANDIDATE_SEED_CANONICAL'],
              'candidateRowsCanonicalSha256':os.environ['CANDIDATE_ROWS_CANONICAL'],
              'candidateState':'candidate-only/unallocated/unapplied/unconsumed',
              'scienceAuthorized':False,
              'protectedAttemptAuthorized':False,
              'seedValuesPresent':False,
              'solverRuntimePresent':False,
          }
          Path('v5r7-generic/generic-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: lunar-exec005-v5r7-generic-actual-byte-stress
          path: v5r7-generic
          if-no-files-found: error

  independent-review-gated-live-diagnostic:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Bind exact PR attempt1 lineage and exact generic artifact
        id: generic
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_HEAD_REF" = "$EXPECTED_BRANCH"
          test "$PR_BASE" = "$EXPECTED_BASE"
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          test "$(git merge-base "$EXPECTED_BASE" HEAD)" = "$EXPECTED_BASE"
          test "$(git rev-list --count "$EXPECTED_BASE..HEAD")" = "$EXPECTED_COMMITS"
          test -z "$(git rev-list --merges "$EXPECTED_BASE..HEAD")"
          test "$(git hash-object "$DIAGNOSTIC_TOOL")" = "$ACCEPTED_V5R4_TOOL_BLOB"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$EXPECTED_MAIN"
          test -z "$(command -v uvspec || true)"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$PR_HEAD&event=push&per_page=100" > exact-push-run-pages.json
          python - <<'PY'
          import json,os
          pages=json.load(open('exact-push-run-pages.json'))
          rows=[]
          for page in pages:
              if not isinstance(page,dict) or not isinstance(page.get('workflow_runs'),list):
                  raise RuntimeError('malformed push-run pagination')
              rows.extend(page['workflow_runs'])
          hits=[r for r in rows if r.get('path')==os.environ['WORKFLOW_PATH']]
          assert len(hits)==1,[(r.get('id'),r.get('status'),r.get('conclusion')) for r in hits]
          row=hits[0]
          assert row['run_attempt']==1 and row['status']=='completed' and row['conclusion']=='success',row
          open('generic-run-id.txt','w').write(str(row['id']))
          PY
          generic_run="$(cat generic-run-id.txt)"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$generic_run/artifacts?per_page=100" > generic-artifact-pages.json
          python - <<'PY'
          import json
          pages=json.load(open('generic-artifact-pages.json'))
          rows=[]; totals=[]
          for page in pages:
              assert isinstance(page,dict) and isinstance(page.get('artifacts'),list)
              totals.append(page.get('total_count'))
              rows.extend(page['artifacts'])
          assert totals and len(set(totals))==1 and len(rows)==totals[0]
          hits=[a for a in rows if a.get('name')=='lunar-exec005-v5r7-generic-actual-byte-stress' and not a.get('expired')]
          assert len(hits)==1,[(a.get('id'),a.get('name'),a.get('expired')) for a in hits]
          a=hits[0]
          open('generic-artifact-id.txt','w').write(str(a['id']))
          open('generic-artifact-digest.txt','w').write(str(a.get('digest') or ''))
          PY
          echo "run_id=$generic_run" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$(cat generic-artifact-id.txt)" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$(cat generic-artifact-digest.txt)" >> "$GITHUB_OUTPUT"

      - name: Require exact independent Physics V5R7 token and unique anchored identity
        id: physics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          GENERIC_ARTIFACT: ${{ steps.generic.outputs.artifact_id }}
        run: |
          set -euo pipefail
          mkdir -p v5r7-live
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > v5r7-live/issue60-pages-review.json
          tree="$(git rev-parse HEAD^{tree})"
          python "$CONTROL_GUARD" --physics-comments v5r7-live/issue60-pages-review.json --cutoff "$CONTROLLING_TRANSITION" --head "$PR_HEAD" --tree "$tree" --branch "$EXPECTED_BRANCH" --artifact-id "$GENERIC_ARTIFACT" --output v5r7-live/physics-binding.json
          authorized="$(python -c "import json; print(str(json.load(open('v5r7-live/physics-binding.json'))['authorized']).lower())")"
          echo "authorized=$authorized" >> "$GITHUB_OUTPUT"
          if test "$authorized" = true; then
            echo "physics_comment=$(python -c "import json; print(json.load(open('v5r7-live/physics-binding.json'))['positiveCommentIds'][0])")" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop cleanly at independent-review boundary
        if: steps.physics.outputs.authorized != 'true'
        run: echo 'Exact V5R7 Physics acceptance is absent; no protected repository observation attempted.'

      - name: Wait for stable complete unfiltered non-self mutable Actions quiescence
        if: steps.physics.outputs.authorized == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p v5r7-live/quiescence
          stable=false
          for n in $(seq 1 90); do
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" > v5r7-live/quiescence/first.json
            python "$CONTROL_GUARD" --actions-pages v5r7-live/quiescence/first.json --current-run-id "$GITHUB_RUN_ID" --output v5r7-live/quiescence/first-inventory.json
            if test "$(jq '.blockerIds|length' v5r7-live/quiescence/first-inventory.json)" = 0; then
              sleep 8
              gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" > v5r7-live/quiescence/second.json
              python "$CONTROL_GUARD" --actions-pages v5r7-live/quiescence/second.json --compare-actions-pages v5r7-live/quiescence/first.json --current-run-id "$GITHUB_RUN_ID" --output v5r7-live/quiescence/second-inventory.json
              if test "$(jq '.blockerIds|length' v5r7-live/quiescence/second-inventory.json)" = 0 && test "$(jq -r .stableAgainstComparison v5r7-live/quiescence/second-inventory.json)" = true; then
                stable=true
                break
              fi
            fi
            sleep 10
          done
          test "$stable" = true

      - name: Re-read complete authority surfaces and exact identity before observation A
        if: steps.physics.outputs.authorized == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/60" > v5r7-live/issue60-before.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > v5r7-live/issue60-pages-before.json
          gh api "repos/$GITHUB_REPOSITORY/issues/60" > v5r7-live/issue60-after.json
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$EXPECTED_MAIN"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}" --jq .head.sha)" = "$PR_HEAD"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}" --jq .base.sha)" = "$PR_BASE"
          python - <<'PY'
          import json,os,re
          before=json.load(open('v5r7-live/issue60-before.json'))
          after=json.load(open('v5r7-live/issue60-after.json'))
          assert before['comments']==after['comments'] and before['updated_at']==after['updated_at']
          pages=json.load(open('v5r7-live/issue60-pages-before.json'))
          rows=[row for page in pages for row in page]
          assert len(rows)==before['comments']
          assert len({int(row['id']) for row in rows})==len(rows)
          def first(body):
              lines=(body or '').splitlines()
              value=lines[0].strip() if lines else ''
              return value.split('::',1)[1].strip() if '::' in value else value
          def marker(body,kind):
              value=first(body)
              return value==kind or value.startswith(kind+' ') or value.startswith(kind+' |')
          key=re.compile(r'^(begin|beginComment|begin_comment)\s*[:=]\s*`?([0-9]+)`?$')
          sentence=re.compile(r'^Exact matching closure for BEGIN\s+`?([0-9]+)`?\s+only\.$')
          legacy=re.compile(r'^(begin|beginComment|begin_comment)=([0-9]+)$')
          def link(body):
              lines=(body or '').splitlines()
              value=first(body)
              found=[]
              for field in value.split('|')[1:]:
                  m=key.fullmatch(field.strip())
                  if m: found.append(m.group(2))
              for line in lines[1:]:
                  stripped=line.strip()
                  m=key.fullmatch(stripped)
                  if m: found.append(m.group(2))
                  s=sentence.fullmatch(stripped)
                  if s: found.append(s.group(1))
              if not found:
                  for token in value[len('WRITE_QUIET_END'):].strip().split():
                      m=legacy.fullmatch(token.strip())
                      if m: found.append(m.group(2))
              distinct=list(dict.fromkeys(found))
              assert len(distinct)==1,(value,distinct)
              return int(distinct[0])
          cutoff=int(os.environ['CONTROLLING_TRANSITION'])
          begins=[]
          ends=[]
          for row in rows:
              if int(row['id'])<=cutoff: continue
              body=row.get('body') or ''
              if marker(body,'WRITE_QUIET_BEGIN'): begins.append(int(row['id']))
              elif marker(body,'WRITE_QUIET_END'): ends.append((int(row['id']),link(body)))
          for begin in begins:
              assert len([eid for eid,bid in ends if bid==begin])==1,(begin,ends)
          assert not (set(begins)-{bid for _,bid in ends}),(begins,ends)
          PY

      - name: Immediate repeated complete unfiltered Actions guard before control
        if: steps.physics.outputs.authorized == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" > v5r7-live/immediate-first.json
          python "$CONTROL_GUARD" --actions-pages v5r7-live/immediate-first.json --current-run-id "$GITHUB_RUN_ID" --output v5r7-live/immediate-first-inventory.json
          test "$(jq '.blockerIds|length' v5r7-live/immediate-first-inventory.json)" = 0
          sleep 4
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" > v5r7-live/immediate-second.json
          python "$CONTROL_GUARD" --actions-pages v5r7-live/immediate-second.json --compare-actions-pages v5r7-live/immediate-first.json --current-run-id "$GITHUB_RUN_ID" --output v5r7-live/immediate-second-inventory.json
          test "$(jq '.blockerIds|length' v5r7-live/immediate-second-inventory.json)" = 0
          test "$(jq -r .stableAgainstComparison v5r7-live/immediate-second-inventory.json)" = true

      - name: Run NON_AUTHORIZING ACTUAL complete-repository V5R7 control
        if: steps.physics.outputs.authorized == 'true'
        id: live
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f v5r7-live/repository-context-diagnostic.json
          python "$DIAGNOSTIC_TOOL" --repository "$GITHUB_REPOSITORY" --issue-number 60 --current-run-id "$GITHUB_RUN_ID" --output v5r7-live/repository-context-diagnostic.json

      - name: Validate sanitized schema-valid receipt on pass or fail
        if: steps.physics.outputs.authorized == 'true' && always()
        shell: bash
        run: |
          set -euo pipefail
          test -f v5r7-live/repository-context-diagnostic.json
          python - <<'PY'
          import json
          row=json.load(open('v5r7-live/repository-context-diagnostic.json'))
          assert row['schema']=='LUNAR_EXEC005_V5R4_REPOSITORY_CONTEXT_DIAGNOSTIC_V1'
          assert row['batchCount']==3
          assert row['scienceAuthorized'] is False
          assert row['protectedAttemptAuthorized'] is False
          assert row['seedValuesPresent'] is False
          assert row['solverRuntimePresent'] is False
          assert row['candidateCount']==198
          assert row['candidateState']=='candidate-only/unallocated/unapplied/unconsumed'
          assert row['normalization']['pathSpecificProjectionPrecedesStableIdDedupe'] is True
          assert row['normalization']['rootRunStatusConclusionAttemptPreserved'] is True
          assert row['normalization']['rootPullStateAndStateReasonPreserved'] is True
          assert row['status'] in {
              'PASS_V5R4_DEDUPE_ORDER_REPAIR_STABLE_NOT_AUTHORIZED',
              'FAIL_CLOSED_V5R4_REPOSITORY_CONTEXT_DRIFT_OBSERVED_NOT_AUTHORIZED',
              'FAIL_CLOSED_V5R4_REPOSITORY_CONTEXT_EXCEPTION_NOT_AUTHORIZED',
          }
          if row['status'].startswith('PASS_'):
              assert len(row['batches'])==3
              assert row['exception'] is None
              assert row['finalLiveReenumeration'] is not None
              assert row['allIntraBatchStable'] is True
              assert row['crossBatchCommonContext'] is True
              assert row['finalLiveEqualsCapturedContext'] is True
          elif row['status'].endswith('EXCEPTION_NOT_AUTHORIZED'):
              assert set(row['exception'])=={'class','message'}
          PY

      - uses: actions/upload-artifact@v4
        if: steps.physics.outputs.authorized == 'true' && always()
        with:
          name: lunar-exec005-v5r7-repository-context-diagnostic
          path: v5r7-live/repository-context-diagnostic.json
          if-no-files-found: error

      - name: Preserve fail-closed terminal classification
        if: steps.physics.outputs.authorized == 'true' && always()
        shell: bash
        run: |
          set -euo pipefail
          status="$(python -c "import json; print(json.load(open('v5r7-live/repository-context-diagnostic.json'))['status'])")"
          echo "diagnostic_status=$status"
          test "$status" = PASS_V5R4_DEDUPE_ORDER_REPAIR_STABLE_NOT_AUTHORIZED
