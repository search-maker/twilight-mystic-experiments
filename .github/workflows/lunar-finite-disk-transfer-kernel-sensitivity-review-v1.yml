name: Lunar finite-disk transfer-kernel sensitivity review v1

on:
  pull_request:
    branches:
      - review/lunar-secondary-aod550-anchor-precision-recovery-v1
    paths:
      - 'review/lunar-scattered-light-source-contract-v1/lunar-finite-disk-transfer-kernel-sensitivity-v1.json'
      - 'review/lunar-scattered-light-source-contract-v1/lunar_finite_disk_transfer_kernel_sensitivity.py'
      - 'tests/test_lunar_finite_disk_transfer_kernel_sensitivity_v1.py'
      - '.github/workflows/lunar-finite-disk-transfer-kernel-sensitivity-review-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-only-no-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Enforce fresh first-attempt review
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"

      - name: Prove review workflow has no radiative-transfer execution surface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/lunar-finite-disk-transfer-kernel-sensitivity-review-v1.yml')
          text = path.read_text(encoding='utf-8')
          forbidden = [
              ('uv' + 'spec') + ' -c',
              'command -v ' + ('uv' + 'spec'),
              'rte_' + 'solver ' + 'mystic',
              'mc_' + 'photons',
              'setup-' + 'micromamba',
              'rubin-' + 'libradtran',
          ]
          for token in forbidden:
              if token in text:
                  raise SystemExit(f'forbidden runtime token in review workflow: {token}')
          PY

      - name: Run frozen finite-disk planner and evaluator tests
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_lunar_topocentric_geometry_and_finite_disk_sensitivity_v1.py
          python tests/test_lunar_finite_disk_transfer_kernel_sensitivity_v1.py
          python -m py_compile review/lunar-scattered-light-source-contract-v1/lunar_finite_disk_transfer_kernel_sensitivity.py

      - name: Claim boundary
        if: always()
        shell: bash
        run: |
          echo 'Review only: 550-nm lunar directional transfer-kernel sensitivity protocol.'
          echo 'No radiative-transfer execution, no lunar result opening, no empirical residual use, no finite-disk validation claim, no production authorization.'
