name: Lunar MYSTIC computational precision review v1

on:
  pull_request:
    branches:
      - review/lunar-scattered-light-source-contract-v1
    paths:
      - 'review/lunar-scattered-light-source-contract-v1/lunar-mystic-computational-precision-v1.json'
      - 'review/lunar-scattered-light-source-contract-v1/lunar_mystic_computational_precision.py'
      - 'review/lunar-scattered-light-source-contract-v1/lunar_mystic_computational_precision_runtime.py'
      - 'tests/test_lunar_mystic_computational_precision_v1.py'
      - '.github/workflows/lunar-mystic-computational-precision-review-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-only-no-solver:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Enforce fresh first-attempt review
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"

      - name: Prove review workflow contains no solver execution surface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/lunar-mystic-computational-precision-review-v1.yml')
          text=path.read_text(encoding='utf-8')
          fragments=[
              ('uv'+'spec') + ' -c',
              'command -v ' + ('uv'+'spec'),
              'rte_' + 'solver ' + 'mystic',
              'mc_' + 'photons',
              'setup-' + 'micromamba',
              'rubin-' + 'libradtran',
          ]
          for token in fragments:
              if token in text:
                  raise SystemExit(f'forbidden solver/runtime token in review workflow: {token}')
          PY

      - name: Run frozen contract and runner tests
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_lunar_mystic_computational_precision_v1.py
          python -m py_compile \
            review/lunar-scattered-light-source-contract-v1/lunar_mystic_computational_precision.py \
            review/lunar-scattered-light-source-contract-v1/lunar_mystic_computational_precision_runtime.py

      - name: Claim boundary
        if: always()
        shell: bash
        run: |
          echo 'Review-only lunar computational precision contract/runner verification.'
          echo 'No uvspec/MYSTIC, no lunar result opening, no Taylor/Jerusalem/X-Shooter/Air-LUSI residual use, no production authorization.'
