name: Lunar MYSTIC computational precision v1 exec001
run-name: Lunar MYSTIC precision exec001 | ${{ github.sha }}

on:
  push:
    branches:
      - execution/lunar-mystic-computational-precision-v1-exec001

permissions:
  contents: read

concurrency:
  group: lunar-mystic-computational-precision-v1-exec001
  cancel-in-progress: false

env:
  REVIEW_HEAD: 65e7303d2573acd18f42f3525d785ca5a3913563
  EXEC_BRANCH: execution/lunar-mystic-computational-precision-v1-exec001
  STAGE_DIR: review/lunar-scattered-light-source-contract-v1
  AUTH_PATH: review/lunar-scattered-light-source-contract-v1/lunar-mystic-computational-precision-v1-exec001-authorization.json
  WORKFLOW_PATH: .github/workflows/lunar-mystic-computational-precision-v1-exec001.yml
  RUNTIME_TOOL: review/lunar-scattered-light-source-contract-v1/lunar_mystic_computational_precision_runtime.py
  RUNTIME_PROBE: experiments/mystic-batch-v1/runtime_probe.py
  RUNTIME_LOCK: experiments/mystic-batch-v1/runtime-lock.micromamba.json
  EXPECTED_UVSPEC_SHA256: 2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3
  EXPECTED_DATA_SHA256: ad30b49177e9c84e46497d69faf0c75e466996b0d0003f1de210289ae9f847d7
  EXEC_BOOTSTRAP_COMMIT: 96ffde7a7aff43f0202176d35cd5f8a8a4f2973b

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact one-shot execution commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 3
          persist-credentials: false

      - name: Verify immutable one-shot authorization boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = "$EXEC_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mapfile -t PARENTS < <(git cat-file -p HEAD | sed -n 's/^parent //p')
          test "${#PARENTS[@]}" = 1
          test "${PARENTS[0]}" = "$EXEC_BOOTSTRAP_COMMIT"
          test "$(git rev-parse HEAD^^)" = "$REVIEW_HEAD"
          mapfile -t HEAD_CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD | sort)
          test "${#HEAD_CHANGED[@]}" = 1
          test "${HEAD_CHANGED[0]}" = "$WORKFLOW_PATH"
          mapfile -t CHANGED < <(git diff --name-only "$REVIEW_HEAD"..HEAD | sort)
          test "${#CHANGED[@]}" = 2
          test "${CHANGED[0]}" = "$WORKFLOW_PATH"
          test "${CHANGED[1]}" = "$AUTH_PATH"
          test "$(git rev-parse "$REVIEW_HEAD:$STAGE_DIR/lunar-mystic-computational-precision-v1.json")" = 96a48c63b7ab86b60e9c3f84540be625eeb89c12
          python - <<'PY'
          import json, os
          d=json.load(open(os.environ['AUTH_PATH'],encoding='utf-8'))
          expected={
            'authorizationId':'lunar-mystic-computational-precision-v1-exec001',
            'status':'AUTHORIZED_ONE_SHOT_COMPUTATIONAL_PRECISION_EXECUTION',
            'executionBranch':os.environ['EXEC_BRANCH'],
            'parentReviewPr':667,
            'parentReviewHead':os.environ['REVIEW_HEAD'],
            'parentReviewWorkflowRun':33293582298,
            'parentReviewWorkflowAttempt':1,
            'parentReviewWorkflowConclusion':'success',
            'frozenProtocolBlobSha':'96a48c63b7ab86b60e9c3f84540be625eeb89c12',
          }
          for k,v in expected.items():
            if d.get(k)!=v: raise SystemExit(f'authorization drift: {k}: {d.get(k)!r} != {v!r}')
          fence=d['issue60FenceCheck']
          if fence.get('activeWriteQuietObserved') is not False or fence.get('freshRecheckRequiredBeforeRefPublication') is not True:
            raise SystemExit('Issue #60 fence evidence drift')
          frozen=d['frozenExecution']
          if frozen.get('caseCount')!=12 or frozen.get('geometryCount')!=6 or frozen.get('replicatesPerGeometry')!=2:
            raise SystemExit('frozen case cardinality drift')
          if frozen.get('photonHistoriesPerReplicate')!=5000000 or frozen.get('totalPhotonHistories')!=60000000:
            raise SystemExit('frozen photon budget drift')
          if frozen.get('seeds') != [761001,761002,761011,761012,761021,761022,761101,761102,761111,761112,761121,761122]:
            raise SystemExit('frozen seed drift')
          auth=d['authorization']
          required_true=('scientificSolverExecutionAuthorized','resultOpeningAuthorized','githubRunAttemptMustEqualOne')
          required_false=('githubRerunPermitted','solverRetryPermitted','solverResumePermitted','seedReusePermitted','postResultThresholdRelaxationPermitted','postResultParameterTuningPermitted')
          if any(auth.get(k) is not True for k in required_true): raise SystemExit('authorization true-boundary drift')
          if any(auth.get(k) is not False for k in required_false): raise SystemExit('authorization false-boundary drift')
          claims=d['claimBoundary']
          if claims.get('computationalPrecisionStageOnly') is not True: raise SystemExit('claim scope drift')
          for k in ('toaSourceIndependentlyValidatedByThisExecution','atmosphericScatteredMoonlightEmpiricallyValidatedByThisExecution','finiteMoonDiskValidatedByThisExecution','totalSkyValidatedByThisExecution','taylorResidualUsed','jerusalemResidualUsed','xshooterResidualOpened','airLusiResidualOpened','productionAuthorized'):
            if claims.get(k) is not False: raise SystemExit(f'protected claim drift: {k}')
          PY

      - name: Set up exact libRadtran runtime
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: lunar-mystic-computational-precision-v1-exec001
          create-args: -c conda-forge python=3.12.4 rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Verify exact runtime and frozen review contract before solver
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          mkdir -p preflight
          python "$RUNTIME_PROBE" \
            --uvspec "$(command -v uvspec)" \
            --data-dir "$CONDA_PREFIX/share/libRadtran/data" \
            --atmosphere "$CONDA_PREFIX/share/libRadtran/data/atmmod/afglus.dat" \
            --runtime-lock "$RUNTIME_LOCK" \
            --skip-help \
            --output preflight/runtime-report.json
          python - <<'PY'
          import json,os
          x=json.load(open('preflight/runtime-report.json'))
          if x.get('scientificSolverExecuted') is not False: raise SystemExit('preflight executed scientific solver')
          if x.get('uvspecSha256') != os.environ['EXPECTED_UVSPEC_SHA256']: raise SystemExit('uvspec hash drift')
          if x.get('libRadtranDataTreeSha256') != os.environ['EXPECTED_DATA_SHA256']: raise SystemExit('data-tree hash drift')
          PY
          python tests/test_lunar_mystic_computational_precision_v1.py
          python "$RUNTIME_TOOL" \
            --prepare \
            --data-dir "$CONDA_PREFIX/share/libRadtran/data" \
            --atmosphere-file "$CONDA_PREFIX/share/libRadtran/data/atmmod/afglus.dat" \
            --atlas-file "$CONDA_PREFIX/share/libRadtran/data/solar_flux/atlas_plus_modtran" \
            --runtime-report preflight/runtime-report.json \
            --output-root preflight/prepared
          python - <<'PY'
          import json
          p=json.load(open('preflight/prepared/prepared-manifest.json'))
          if p.get('status')!='PREPARED_NO_SOLVER_EXECUTION' or p.get('caseCount')!=12: raise SystemExit('prepared manifest drift')
          if p.get('scientificSolverExecuted') is not False or p.get('resultsOpened') is not False: raise SystemExit('preflight boundary drift')
          seeds=[c['randomSeed'] for c in p['cases']]
          if seeds != [761001,761002,761011,761012,761021,761022,761101,761102,761111,761112,761121,761122]: raise SystemExit('prepared seed drift')
          if any(c.get('photonHistories')!=5000000 for c in p['cases']): raise SystemExit('prepared photon budget drift')
          PY

      - name: Publish pre-solver immutable preparation evidence
        uses: actions/upload-artifact@v4
        with:
          name: lunar-mystic-computational-precision-v1-exec001-preflight
          path: preflight
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  cases:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        case_id:
          - e0000-az030-r1
          - e0000-az030-r2
          - e0000-az090-r1
          - e0000-az090-r2
          - e0000-az150-r1
          - e0000-az150-r2
          - e2000-az030-r1
          - e2000-az030-r2
          - e2000-az090-r1
          - e2000-az090-r2
          - e2000-az150-r1
          - e2000-az150-r2
    steps:
      - name: Checkout exact one-shot execution commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 3
          persist-credentials: false

      - name: Refuse rerun or branch mutation before solver
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = "$EXEC_BRANCH"
          test "$(git rev-parse HEAD^)" = "$EXEC_BOOTSTRAP_COMMIT"
          test "$(git rev-parse HEAD^^)" = "$REVIEW_HEAD"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up exact libRadtran runtime
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: lunar-mystic-computational-precision-v1-exec001
          create-args: -c conda-forge python=3.12.4 rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Prepare exact local case inputs under the bound runtime
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          mkdir -p runtime-reports execution-root
          python "$RUNTIME_PROBE" \
            --uvspec "$(command -v uvspec)" \
            --data-dir "$CONDA_PREFIX/share/libRadtran/data" \
            --atmosphere "$CONDA_PREFIX/share/libRadtran/data/atmmod/afglus.dat" \
            --runtime-lock "$RUNTIME_LOCK" \
            --skip-help \
            --output runtime-reports/runtime-report.json
          python - <<'PY'
          import json,os
          x=json.load(open('runtime-reports/runtime-report.json'))
          if x.get('scientificSolverExecuted') is not False: raise SystemExit('runtime probe executed solver')
          if x.get('uvspecSha256') != os.environ['EXPECTED_UVSPEC_SHA256']: raise SystemExit('uvspec hash drift')
          if x.get('libRadtranDataTreeSha256') != os.environ['EXPECTED_DATA_SHA256']: raise SystemExit('data-tree hash drift')
          PY
          python "$RUNTIME_TOOL" \
            --prepare \
            --data-dir "$CONDA_PREFIX/share/libRadtran/data" \
            --atmosphere-file "$CONDA_PREFIX/share/libRadtran/data/atmmod/afglus.dat" \
            --atlas-file "$CONDA_PREFIX/share/libRadtran/data/solar_flux/atlas_plus_modtran" \
            --runtime-report runtime-reports/runtime-report.json \
            --output-root execution-root

      - name: Execute exactly one frozen MYSTIC case once
        shell: micromamba-shell {0}
        env:
          CASE_ID: ${{ matrix.case_id }}
        run: |
          set -euo pipefail
          CASE_DIR="execution-root/$CASE_ID"
          test -f "$CASE_DIR/case.inp"
          mkdir -p "case-artifact/$CASE_ID"
          set +e
          uvspec < "$CASE_DIR/case.inp" > "$CASE_DIR/uvspec.stdout" 2> "$CASE_DIR/uvspec.stderr"
          RC=$?
          set -e
          printf '%s\n' "$RC" > "$CASE_DIR/uvspec.exitcode"
          cp runtime-reports/runtime-report.json "$CASE_DIR/runtime-report.json"
          cp -a "$CASE_DIR"/. "case-artifact/$CASE_ID/"
          if [ "$RC" -ne 0 ]; then
            echo "uvspec failed for $CASE_ID with exit $RC" >&2
            exit "$RC"
          fi
          test -s "$CASE_DIR/mc.rad.spc"
          test -s "$CASE_DIR/mc.rad.std.spc"

      - name: Upload immutable case evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lunar-mystic-computational-precision-v1-exec001-case-${{ matrix.case_id }}
          path: case-artifact
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0

  aggregate:
    needs: [preflight, cases]
    if: always() && needs.preflight.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact one-shot execution commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 3
          persist-credentials: false

      - name: Download every case artifact without opening external validation data
        uses: actions/download-artifact@v4
        with:
          pattern: lunar-mystic-computational-precision-v1-exec001-case-*
          path: case-results
          merge-multiple: true

      - name: Apply only the frozen computational precision evaluator
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          expected=[
            'e0000-az030-r1','e0000-az030-r2','e0000-az090-r1','e0000-az090-r2','e0000-az150-r1','e0000-az150-r2',
            'e2000-az030-r1','e2000-az030-r2','e2000-az090-r1','e2000-az090-r2','e2000-az150-r1','e2000-az150-r2',
          ]
          root=Path('case-results')
          missing=[]
          bad_exit=[]
          missing_outputs=[]
          for case in expected:
            d=root/case
            if not d.is_dir():
              missing.append(case); continue
            ep=d/'uvspec.exitcode'
            if not ep.is_file() or ep.read_text().strip()!='0': bad_exit.append(case)
            for name in ('mc.rad.spc','mc.rad.std.spc'):
              if not (d/name).is_file(): missing_outputs.append(f'{case}:{name}')
          complete=not missing and not bad_exit and not missing_outputs
          evaluator_exit=None
          if complete:
            r=subprocess.run(['python', os.environ['RUNTIME_TOOL'], '--evaluate-results', '--output-root', str(root)], check=False)
            evaluator_exit=r.returncode
          report_path=root/'computational-precision-report.json'
          report=json.load(open(report_path)) if report_path.is_file() else None
          status='EXECUTION_INCOMPLETE'
          if complete and evaluator_exit==0 and report and report.get('status')=='PASS_COMPUTATIONAL_PRECISION': status='PASS_COMPUTATIONAL_PRECISION'
          elif complete: status='FAIL_COMPUTATIONAL_PRECISION'
          classification={
            'schemaVersion':1,
            'authorizationId':'lunar-mystic-computational-precision-v1-exec001',
            'workflowRunId':os.environ['GITHUB_RUN_ID'],
            'workflowRunAttempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
            'executionCommit':os.environ['GITHUB_SHA'],
            'status':status,
            'executionComplete':complete,
            'missingCases':missing,
            'nonzeroOrMissingExitCases':bad_exit,
            'missingOutputFiles':missing_outputs,
            'frozenEvaluatorExitCode':evaluator_exit,
            'computationallyEligibleForFrozenSyntheticGrid': bool(report and report.get('computationallyEligibleForFrozenSyntheticGrid') is True and evaluator_exit==0),
            'toaSourceIndependentlyValidatedByThisResult':False,
            'atmosphericScatteredMoonlightEmpiricallyValidatedByThisResult':False,
            'finiteMoonDiskModeled':False,
            'totalSkyValidated':False,
            'taylorResidualUsed':False,
            'jerusalemResidualUsed':False,
            'productionAuthorized':False,
          }
          Path('execution-classification.json').write_text(json.dumps(classification,indent=2,sort_keys=True)+'\n')
          print(json.dumps(classification,sort_keys=True))
          PY

      - name: Upload aggregate and frozen classification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lunar-mystic-computational-precision-v1-exec001-result
          path: |
            case-results
            execution-classification.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Enforce terminal computational classification after evidence publication
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          x=json.load(open('execution-classification.json'))
          if x.get('status') != 'PASS_COMPUTATIONAL_PRECISION':
            raise SystemExit(f"lunar computational precision stage did not pass: {x.get('status')}")
          if x.get('computationallyEligibleForFrozenSyntheticGrid') is not True:
            raise SystemExit('PASS classification without computational eligibility')
          for k in ('toaSourceIndependentlyValidatedByThisResult','atmosphericScatteredMoonlightEmpiricallyValidatedByThisResult','finiteMoonDiskModeled','totalSkyValidated','taylorResidualUsed','jerusalemResidualUsed','productionAuthorized'):
            if x.get(k) is not False: raise SystemExit(f'claim boundary drift: {k}')
          PY
