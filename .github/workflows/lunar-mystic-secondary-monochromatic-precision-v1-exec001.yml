name: Lunar MYSTIC secondary monochromatic precision v1 exec001
run-name: Lunar secondary monochromatic precision exec001 | ${{ github.sha }}

on:
  push:
    branches:
      - execution/lunar-mystic-secondary-monochromatic-precision-v1-exec001

permissions:
  contents: read

concurrency:
  group: lunar-mystic-secondary-monochromatic-precision-v1-exec001
  cancel-in-progress: false

env:
  REVIEW_HEAD: ee5692138c808a8a34c76bca12ed9548eeb9e5bf
  EXEC_BRANCH: execution/lunar-mystic-secondary-monochromatic-precision-v1-exec001
  STAGE_DIR: review/lunar-scattered-light-source-contract-v1
  CONTRACT_PATH: review/lunar-scattered-light-source-contract-v1/lunar-mystic-secondary-monochromatic-precision-v1.json
  AUTH_PATH: review/lunar-scattered-light-source-contract-v1/lunar-mystic-secondary-monochromatic-precision-v1-exec001-authorization.json
  WORKFLOW_PATH: .github/workflows/lunar-mystic-secondary-monochromatic-precision-v1-exec001.yml
  RUNTIME_TOOL: review/lunar-scattered-light-source-contract-v1/lunar_mystic_secondary_monochromatic_precision.py
  RUNTIME_PROBE: experiments/mystic-batch-v1/runtime_probe.py
  RUNTIME_LOCK: experiments/mystic-batch-v1/runtime-lock.micromamba.json
  EXPECTED_CONTRACT_BLOB_SHA: 447ab520609bbdf6ccb4433baa0cfdbf9e178a06
  EXPECTED_UVSPEC_SHA256: 2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3
  EXPECTED_DATA_SHA256: ad30b49177e9c84e46497d69faf0c75e466996b0d0003f1de210289ae9f847d7

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact one-shot execution commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Verify immutable one-shot authorization boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = "$EXEC_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mapfile -t PARENTS < <(git cat-file -p HEAD | sed -n 's/^parent //p')
          test "${#PARENTS[@]}" = 1
          test "${PARENTS[0]}" = "$REVIEW_HEAD"
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD | sort)
          test "${#CHANGED[@]}" = 2
          test "${CHANGED[0]}" = "$WORKFLOW_PATH"
          test "${CHANGED[1]}" = "$AUTH_PATH"
          test "$(git rev-parse "$REVIEW_HEAD:$CONTRACT_PATH")" = "$EXPECTED_CONTRACT_BLOB_SHA"
          python - <<'PY'
          import json, os
          d=json.load(open(os.environ['AUTH_PATH'], encoding='utf-8'))
          expected={
            'authorizationId':'lunar-mystic-secondary-monochromatic-precision-v1-exec001',
            'status':'AUTHORIZED_ONE_SHOT_SECONDARY_MONOCHROMATIC_PRECISION_EXECUTION',
            'executionBranch':os.environ['EXEC_BRANCH'],
            'parentReviewPr':669,
            'parentReviewHead':os.environ['REVIEW_HEAD'],
            'parentReviewWorkflowRun':33296180033,
            'parentReviewWorkflowAttempt':1,
            'parentReviewWorkflowConclusion':'success',
            'parentReviewArtifactId':9727473150,
            'parentReviewArtifactDigest':'sha256:0ff82afc96de96777b3d18b226319f7b6aa5e2b8d066ef790f1032f3f22c6540',
            'frozenProtocolBlobSha':os.environ['EXPECTED_CONTRACT_BLOB_SHA'],
          }
          for k,v in expected.items():
            if d.get(k)!=v: raise SystemExit(f'authorization drift: {k}: {d.get(k)!r} != {v!r}')
          fence=d['issue60FenceCheck']
          if fence.get('latestCommentIdObserved')!=5467079251 or fence.get('activeWriteQuietObserved') is not False:
            raise SystemExit('Issue #60 fence evidence drift')
          frozen=d['frozenExecution']
          if frozen.get('wavelengthNm') != [450.0,650.0,750.0]: raise SystemExit('wavelength drift')
          if frozen.get('spectralMode') != 'MONOCHROMATIC_NO_MC_SPECTRAL_IS': raise SystemExit('spectral mode drift')
          if frozen.get('caseCount')!=36 or frozen.get('geometryCount')!=6 or frozen.get('replicatesPerGeometryPerWavelength')!=2:
            raise SystemExit('case cardinality drift')
          if frozen.get('photonHistoriesPerReplicate')!=5000000 or frozen.get('totalPhotonHistories')!=180000000:
            raise SystemExit('photon budget drift')
          if frozen.get('freshSeeds') != list(range(28762001,28762037)): raise SystemExit('seed drift')
          if frozen.get('perReplicateRelativeMcStdMax')!=0.1 or frozen.get('replicateConsistencyZMax')!=4.0:
            raise SystemExit('precision threshold drift')
          if frozen.get('parentV1StatusRemains')!='FAIL_COMPUTATIONAL_PRECISION': raise SystemExit('parent classification drift')
          auth=d['authorization']
          for k in ('scientificSolverExecutionAuthorized','resultOpeningAuthorized','githubRunAttemptMustEqualOne'):
            if auth.get(k) is not True: raise SystemExit(f'authorization true-boundary drift: {k}')
          for k in ('githubRerunPermitted','solverRetryPermitted','solverResumePermitted','seedReusePermitted','postResultThresholdRelaxationPermitted','postResultPhotonBudgetIncreaseUnderThisIdentityPermitted','postResultParameterTuningPermitted','parentV1ReclassificationPermitted'):
            if auth.get(k) is not False: raise SystemExit(f'authorization false-boundary drift: {k}')
          claims=d['claimBoundary']
          if claims.get('computationalSecondaryPrecisionStageOnly') is not True: raise SystemExit('claim scope drift')
          if claims.get('parent550NmPrecisionEvidenceMayBeCarriedForwardOnlyIfContinuationPasses') is not True: raise SystemExit('parent carry-forward boundary drift')
          for k in ('toaSourceIndependentlyValidatedByThisExecution','atmosphericScatteredMoonlightEmpiricallyValidatedByThisExecution','finiteMoonDiskValidatedByThisExecution','totalSkyValidatedByThisExecution','taylorResidualUsed','jerusalemResidualUsed','xshooterResidualOpened','airLusiResidualOpened','productionAuthorized'):
            if claims.get(k) is not False: raise SystemExit(f'protected claim drift: {k}')
          PY

      - name: Set up exact libRadtran runtime
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: lunar-secondary-monochromatic-exec001
          create-args: -c conda-forge python=3.12.4 rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Verify exact runtime and prepare frozen cases without solver
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          mkdir -p preflight
          python "$RUNTIME_PROBE" \
            --uvspec "$(command -v uvspec)" \
            --data-dir "$CONDA_PREFIX/share/libRadtran/data" \
            --atmosphere "$CONDA_PREFIX/share/libRadtran/data/atmmod/afglus.dat" \
            --runtime-lock "$RUNTIME_LOCK" \
            --skip-help \
            --output preflight/runtime-report.json
          python - <<'PY'
          import json,os
          x=json.load(open('preflight/runtime-report.json'))
          if x.get('scientificSolverExecuted') is not False: raise SystemExit('runtime preflight executed solver')
          if x.get('uvspecSha256')!=os.environ['EXPECTED_UVSPEC_SHA256']: raise SystemExit('uvspec hash drift')
          if x.get('libRadtranDataTreeSha256')!=os.environ['EXPECTED_DATA_SHA256']: raise SystemExit('data-tree hash drift')
          PY
          python tests/test_lunar_mystic_secondary_monochromatic_precision_v1.py
          python "$RUNTIME_TOOL" \
            --prepare \
            --data-dir "$CONDA_PREFIX/share/libRadtran/data" \
            --atmosphere-file "$CONDA_PREFIX/share/libRadtran/data/atmmod/afglus.dat" \
            --atlas-file "$CONDA_PREFIX/share/libRadtran/data/solar_flux/atlas_plus_modtran" \
            --runtime-report preflight/runtime-report.json \
            --output-root preflight/prepared
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.load(open('preflight/prepared/prepared-manifest.json'))
          if p.get('status')!='PREPARED_NO_SOLVER_EXECUTION' or p.get('caseCount')!=36: raise SystemExit('prepared manifest drift')
          if p.get('totalPhotonHistories')!=180000000: raise SystemExit('total histories drift')
          if p.get('scientificSolverExecuted') is not False or p.get('resultsOpened') is not False: raise SystemExit('preflight boundary drift')
          if p.get('parentResultReclassified') is not False or p.get('empiricalValidationClaim') is not False or p.get('productionAuthorized') is not False: raise SystemExit('preflight claim drift')
          if [c['randomSeed'] for c in p['cases']] != list(range(28762001,28762037)): raise SystemExit('prepared seed drift')
          for c in p['cases']:
            text=Path(c['inputPath']).read_text()
            w=c['wavelengthNm']
            if text.count(f'wavelength {w:.1f} {w:.1f}')!=1: raise SystemExit(f'monochromatic wavelength drift: {c["caseId"]}')
            if 'mc_spectral_is' in text: raise SystemExit(f'ALIS leakage: {c["caseId"]}')
            if text.count('mc_std')!=1: raise SystemExit(f'mc_std drift: {c["caseId"]}')
          PY

      - name: Publish immutable pre-solver evidence
        uses: actions/upload-artifact@v4
        with:
          name: lunar-mystic-secondary-monochromatic-precision-v1-exec001-preflight
          path: preflight
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  cases:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        case_id:
          - w450-e0000-az030-r1
          - w450-e0000-az030-r2
          - w450-e0000-az090-r1
          - w450-e0000-az090-r2
          - w450-e0000-az150-r1
          - w450-e0000-az150-r2
          - w450-e2000-az030-r1
          - w450-e2000-az030-r2
          - w450-e2000-az090-r1
          - w450-e2000-az090-r2
          - w450-e2000-az150-r1
          - w450-e2000-az150-r2
          - w650-e0000-az030-r1
          - w650-e0000-az030-r2
          - w650-e0000-az090-r1
          - w650-e0000-az090-r2
          - w650-e0000-az150-r1
          - w650-e0000-az150-r2
          - w650-e2000-az030-r1
          - w650-e2000-az030-r2
          - w650-e2000-az090-r1
          - w650-e2000-az090-r2
          - w650-e2000-az150-r1
          - w650-e2000-az150-r2
          - w750-e0000-az030-r1
          - w750-e0000-az030-r2
          - w750-e0000-az090-r1
          - w750-e0000-az090-r2
          - w750-e0000-az150-r1
          - w750-e0000-az150-r2
          - w750-e2000-az030-r1
          - w750-e2000-az030-r2
          - w750-e2000-az090-r1
          - w750-e2000-az090-r2
          - w750-e2000-az150-r1
          - w750-e2000-az150-r2
    steps:
      - name: Checkout exact one-shot execution commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Refuse rerun or branch mutation before solver
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = "$EXEC_BRANCH"
          test "$(git rev-parse HEAD^)" = "$REVIEW_HEAD"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up exact libRadtran runtime
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: lunar-secondary-monochromatic-exec001
          create-args: -c conda-forge python=3.12.4 rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Prepare exact local inputs under the bound runtime
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          mkdir -p runtime-reports execution-root
          python "$RUNTIME_PROBE" \
            --uvspec "$(command -v uvspec)" \
            --data-dir "$CONDA_PREFIX/share/libRadtran/data" \
            --atmosphere "$CONDA_PREFIX/share/libRadtran/data/atmmod/afglus.dat" \
            --runtime-lock "$RUNTIME_LOCK" \
            --skip-help \
            --output runtime-reports/runtime-report.json
          python - <<'PY'
          import json,os
          x=json.load(open('runtime-reports/runtime-report.json'))
          if x.get('scientificSolverExecuted') is not False: raise SystemExit('runtime probe executed solver')
          if x.get('uvspecSha256')!=os.environ['EXPECTED_UVSPEC_SHA256']: raise SystemExit('uvspec hash drift')
          if x.get('libRadtranDataTreeSha256')!=os.environ['EXPECTED_DATA_SHA256']: raise SystemExit('data-tree hash drift')
          PY
          python "$RUNTIME_TOOL" \
            --prepare \
            --data-dir "$CONDA_PREFIX/share/libRadtran/data" \
            --atmosphere-file "$CONDA_PREFIX/share/libRadtran/data/atmmod/afglus.dat" \
            --atlas-file "$CONDA_PREFIX/share/libRadtran/data/solar_flux/atlas_plus_modtran" \
            --runtime-report runtime-reports/runtime-report.json \
            --output-root execution-root

      - name: Execute exactly one frozen monochromatic MYSTIC case once
        shell: micromamba-shell {0}
        env:
          CASE_ID: ${{ matrix.case_id }}
        run: |
          set -euo pipefail
          CASE_DIR="execution-root/$CASE_ID"
          test -f "$CASE_DIR/case.inp"
          test "$(grep -c '^mc_spectral_is ' "$CASE_DIR/case.inp" || true)" = 0
          test "$(grep -c '^mc_std$' "$CASE_DIR/case.inp")" = 1
          mkdir -p "case-artifact/$CASE_ID"
          set +e
          uvspec < "$CASE_DIR/case.inp" > "$CASE_DIR/uvspec.stdout" 2> "$CASE_DIR/uvspec.stderr"
          RC=$?
          set -e
          printf '%s\n' "$RC" > "$CASE_DIR/uvspec.exitcode"
          cp runtime-reports/runtime-report.json "$CASE_DIR/runtime-report.json"
          cp -a "$CASE_DIR"/. "case-artifact/$CASE_ID/"
          if [ "$RC" -ne 0 ]; then
            echo "uvspec failed for $CASE_ID with exit $RC" >&2
            exit "$RC"
          fi
          test -s "$CASE_DIR/mc.rad.spc"
          test -s "$CASE_DIR/mc.rad.std.spc"

      - name: Upload immutable case evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lunar-mystic-secondary-monochromatic-precision-v1-exec001-case-${{ matrix.case_id }}
          path: case-artifact
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0

  aggregate:
    needs: [preflight, cases]
    if: always() && needs.preflight.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact one-shot execution commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Download every case artifact
        uses: actions/download-artifact@v4
        with:
          pattern: lunar-mystic-secondary-monochromatic-precision-v1-exec001-case-*
          path: case-results
          merge-multiple: true

      - name: Apply only the frozen continuation evaluator
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          wavelengths=(450,650,750)
          elevations=(0,2000)
          azimuths=(30,90,150)
          expected=[f'w{w}-e{e:04d}-az{az:03d}-r{r}' for w in wavelengths for e in elevations for az in azimuths for r in (1,2)]
          root=Path('case-results')
          missing=[]; bad_exit=[]; missing_outputs=[]
          for case in expected:
            d=root/case
            if not d.is_dir(): missing.append(case); continue
            ep=d/'uvspec.exitcode'
            if not ep.is_file() or ep.read_text().strip()!='0': bad_exit.append(case)
            for name in ('mc.rad.spc','mc.rad.std.spc'):
              if not (d/name).is_file(): missing_outputs.append(f'{case}:{name}')
          complete=not missing and not bad_exit and not missing_outputs
          evaluator_exit=None
          if complete:
            r=subprocess.run(['python', os.environ['RUNTIME_TOOL'], '--evaluate-results', '--output-root', str(root)], check=False)
            evaluator_exit=r.returncode
          report_path=root/'secondary-monochromatic-precision-report.json'
          report=json.load(open(report_path)) if report_path.is_file() else None
          status='EXECUTION_INCOMPLETE'
          if complete and evaluator_exit==0 and report and report.get('status')=='PASS_SECONDARY_MONOCHROMATIC_PRECISION': status='PASS_SECONDARY_MONOCHROMATIC_PRECISION'
          elif complete: status='FAIL_SECONDARY_MONOCHROMATIC_PRECISION'
          classification={
            'schemaVersion':1,
            'authorizationId':'lunar-mystic-secondary-monochromatic-precision-v1-exec001',
            'workflowRunId':os.environ['GITHUB_RUN_ID'],
            'workflowRunAttempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
            'executionCommit':os.environ['GITHUB_SHA'],
            'status':status,
            'executionComplete':complete,
            'missingCases':missing,
            'nonzeroOrMissingExitCases':bad_exit,
            'missingOutputFiles':missing_outputs,
            'frozenEvaluatorExitCode':evaluator_exit,
            'computationallyEligibleForFrozenSecondaryGrid': bool(report and report.get('computationallyEligibleForFrozenSecondaryGrid') is True and evaluator_exit==0),
            'combinedParentContinuationClassification': report.get('combinedParentContinuationClassification') if report else None,
            'parentV1StatusRemains':'FAIL_COMPUTATIONAL_PRECISION',
            'parentV1Reclassified':False,
            'toaSourceIndependentlyValidatedByThisResult':False,
            'atmosphericScatteredMoonlightEmpiricallyValidatedByThisResult':False,
            'finiteMoonDiskModeled':False,
            'totalSkyValidated':False,
            'taylorResidualUsed':False,
            'jerusalemResidualUsed':False,
            'productionAuthorized':False,
          }
          Path('execution-classification.json').write_text(json.dumps(classification,indent=2,sort_keys=True)+'\n')
          print(json.dumps(classification,sort_keys=True))
          PY

      - name: Upload aggregate and frozen classification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lunar-mystic-secondary-monochromatic-precision-v1-exec001-result
          path: |
            case-results
            execution-classification.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Enforce terminal computational classification after evidence publication
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          x=json.load(open('execution-classification.json'))
          if x.get('status')!='PASS_SECONDARY_MONOCHROMATIC_PRECISION': raise SystemExit(f"secondary monochromatic precision did not pass: {x.get('status')}")
          if x.get('computationallyEligibleForFrozenSecondaryGrid') is not True: raise SystemExit('PASS without continuation eligibility')
          if x.get('combinedParentContinuationClassification')!='COMPUTATIONAL_PRECISION_SUPPORTED_FOR_FROZEN_CENTRAL_COLLIMATED_GRID': raise SystemExit('combined classification drift')
          if x.get('parentV1StatusRemains')!='FAIL_COMPUTATIONAL_PRECISION' or x.get('parentV1Reclassified') is not False: raise SystemExit('parent classification drift')
          for k in ('toaSourceIndependentlyValidatedByThisResult','atmosphericScatteredMoonlightEmpiricallyValidatedByThisResult','finiteMoonDiskModeled','totalSkyValidated','taylorResidualUsed','jerusalemResidualUsed','productionAuthorized'):
            if x.get(k) is not False: raise SystemExit(f'claim boundary drift: {k}')
          PY
