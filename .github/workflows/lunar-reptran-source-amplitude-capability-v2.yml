name: Lunar custom-source REPTRAN capability v2

on:
  push:
    branches:
      - review/lunar-reptran-source-amplitude-capability-v2
    paths:
      - '.github/workflows/lunar-reptran-source-amplitude-capability-v2.yml'

permissions:
  contents: read

concurrency:
  group: lunar-reptran-source-amplitude-capability-v2-${{ github.sha }}
  cancel-in-progress: false

jobs:
  exact-runtime-source-amplitude-capability-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_MAIN: 16292e6246d0c15f72bc5e09bee9f0a0ba330e3e
      CONSUMED_V1_HEAD: c2a0b72edfb63a59572a49600dc4e28cd136eada
      CONSUMED_V1_RUN: '34053109775'
      KNOWN_V1_DEFECT: CAPABILITY_V1_PRE_RUNTIME_STATIC_GUARD_FALSE_POSITIVE_ON_CRS_REFUSAL_LITERAL
      EXPECTED_UVSPEC_SHA256: 2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3
      EXPECTED_DATA_SHA256: ad30b49177e9c84e46497d69faf0c75e466996b0d0003f1de210289ae9f847d7
      AUDIT_DIR: lunar-reptran-source-amplitude-capability-v2-audit
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce wholly fresh attempt-1 isolated identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_SHA" != "$CONSUMED_V1_HEAD"
          test "$(git merge-base HEAD "$BASE_MAIN")" = "$BASE_MAIN"
          git diff --name-only "$BASE_MAIN"...HEAD > /tmp/changed.txt
          python - <<'PY'
          from pathlib import Path
          changed = [x for x in Path('/tmp/changed.txt').read_text().splitlines() if x]
          allowed = '.github/workflows/lunar-reptran-source-amplitude-capability-v2.yml'
          assert changed == [allowed], f'capability-v2 scope drift: {changed!r}'
          PY

      - name: Preregister frozen non-protected REPTRAN capability contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$AUDIT_DIR"
          python - <<'PY'
          import json, os
          c = {
            'schemaVersion': 2,
            'contractId': 'libradtran-custom-source-reptran-capability-v2',
            'status': 'PREREGISTERED_BEFORE_FRESH_EXACT_RUNTIME_PROBE',
            'baseMain': os.environ['BASE_MAIN'],
            'bindingIssue60Decision': 5560785094,
            'knownConsumedV1': {
              'run': int(os.environ['CONSUMED_V1_RUN']),
              'head': os.environ['CONSUMED_V1_HEAD'],
              'firstDefect': os.environ['KNOWN_V1_DEFECT'],
              'rerunRetryResumeForbidden': True,
              'runtimeReached': False,
              'uvspecExecuted': False,
            },
            'historicalFrozenInvariant': {
              'historicalCrsRun': 33291389252,
              'historicalCrsResultStatus': 'PASS_CUSTOM_SOURCE_WITH_CRS_CONSUMED_EXACT_RUNTIME',
              'soleIntendedDependencyChange': 'mol_abs_param crs -> mol_abs_param reptran',
            },
            'exactRuntime': {
              'distribution': 'conda-forge',
              'package': 'rubin-libradtran',
              'versionBuild': '2.0.6=py312pl5321he9373c2_1',
              'python': '3.12.4',
              'runnerImage': 'ubuntu-24.04',
              'uvspecSha256': os.environ['EXPECTED_UVSPEC_SHA256'],
              'libRadtranDataTreeSha256': os.environ['EXPECTED_DATA_SHA256'],
            },
            'probe': {
              'classification': 'NON_SCIENTIFIC_NON_PROTECTED_SOURCE_AMPLITUDE_CAPABILITY_PROBE',
              'sourceWavelengthNm': [380.0, 550.0, 780.0],
              'sourceFluxUnit': 'mW m-2 nm-1',
              'armASourceFluxValues': [1.0, 1.0, 1.0],
              'armBSourceFluxValues': [7.0, 7.0, 7.0],
              'requiredMolecularAbsorption': 'reptran',
              'historicalCrsFallbackAllowed': False,
              'protectedLunarGeometryUsed': False,
              'protectedLunarResultOpened': False,
              'mysticExecuted': False,
            },
            'frozenDecisionRule': {
              'expectedArmBToArmARatio': 7.0,
              'maximumAbsoluteRatioDeviation': 0.01,
              'requirements': [
                'both arms exit zero',
                'same non-empty wavelength vector',
                'all Arm A direct irradiance values finite and strictly positive',
                'all Arm B values and ratios finite',
                'every absolute B/A ratio deviation from 7.0 <= 0.01',
              ],
              'passStatus': 'PASS_CUSTOM_SOURCE_WITH_REPTRAN_CONSUMED_EXACT_RUNTIME',
              'failStatus': 'FAIL_CUSTOM_SOURCE_WITH_REPTRAN_NOT_ADMITTED',
              'noPostResultToleranceChange': True,
            },
            'authority': {
              'attemptMustEqual': 1,
              'rerunRetryResumeForbidden': True,
              'scientificIdentityAllocated': False,
              'scientificSeedAllocated': False,
              'exec004Allocated': False,
              'ordinalAllocated': False,
              'writeQuietAuthorized': False,
              'dispatchAuthorized': False,
              'protectedScienceAuthorized': False,
              'protectedResultOpeningAuthorized': False,
              'taylorOrJerusalemUseAuthorized': False,
              'productionAuthorized': False,
            },
            'failureDisposition': 'freeze first exact capability defect; never rerun/retry/resume this identity; do not change frozen lunar science design',
          }
          path = os.path.join(os.environ['AUDIT_DIR'], 'capability-contract.json')
          with open(path, 'w', encoding='utf-8') as f:
            json.dump(c, f, indent=2, sort_keys=True)
            f.write('\n')
          assert c['probe']['requiredMolecularAbsorption'] == 'reptran'
          assert c['probe']['historicalCrsFallbackAllowed'] is False
          assert c['frozenDecisionRule']['expectedArmBToArmARatio'] == 7.0
          assert c['frozenDecisionRule']['maximumAbsoluteRatioDeviation'] == 0.01
          assert c['authority']['exec004Allocated'] is False
          PY

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: lunar-custom-source-reptran-capability-v2
          create-args: -c conda-forge python=3.12.4 rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Bind exact pinned libRadtran runtime without protected science
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          python experiments/mystic-batch-v1/runtime_probe.py \
            --uvspec "$(command -v uvspec)" \
            --data-dir "$CONDA_PREFIX/share/libRadtran/data" \
            --atmosphere "$CONDA_PREFIX/share/libRadtran/data/atmmod/afglus.dat" \
            --runtime-lock experiments/mystic-batch-v1/runtime-lock.micromamba.json \
            --skip-help \
            --output "$AUDIT_DIR/runtime-report.json"
          python - <<'PY'
          import json, os
          p = os.path.join(os.environ['AUDIT_DIR'], 'runtime-report.json')
          x = json.load(open(p, encoding='utf-8'))
          assert x['scientificSolverExecuted'] is False
          assert x['syntaxCheckExecuted'] is False
          assert x['uvspecSha256'] == os.environ['EXPECTED_UVSPEC_SHA256']
          assert x['libRadtranDataTreeSha256'] == os.environ['EXPECTED_DATA_SHA256']
          PY

      - name: Execute fresh synthetic 1x-to-7x REPTRAN source-amplitude capability
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, math, os, subprocess
          from pathlib import Path

          audit = Path(os.environ['AUDIT_DIR']).resolve()
          uvspec = Path(os.popen('command -v uvspec').read().strip()).resolve()
          data = Path(os.environ['CONDA_PREFIX']) / 'share/libRadtran/data'
          atmosphere = data / 'atmmod/afglus.dat'
          contract = json.load(open(audit / 'capability-contract.json', encoding='utf-8'))
          expected = contract['frozenDecisionRule']['expectedArmBToArmARatio']
          tolerance = contract['frozenDecisionRule']['maximumAbsoluteRatioDeviation']

          def write_source(path, amplitude):
              path.write_text(''.join(f'{w:.1f} {amplitude:.12g}\n' for w in (380.0,550.0,780.0)), encoding='utf-8')

          def render(source):
              lines = [
                  f'data_files_path {data.resolve()}',
                  f'atmosphere_file {atmosphere.resolve()}',
                  f'source solar {source.resolve()}',
                  'mol_abs_param reptran',
                  'wavelength 380 780',
                  'sza 0',
                  'albedo 0',
                  'rte_solver disort',
                  'number_of_streams 4',
                  'zout TOA',
                  'output_user lambda edir',
                  'quiet',
              ]
              # Corrected v2 guard: validate emitted directives, while intentionally
              # retaining an explicit fail-closed CRS-refusal assertion.
              assert lines.count(f'source solar {source.resolve()}') == 1
              assert lines.count('mol_abs_param reptran') == 1
              assert not any(line.startswith('mol_abs_param crs') for line in lines)
              assert sum(line.startswith('mol_abs_param ') for line in lines) == 1
              assert 'rte_solver mystic' not in lines
              assert not any(line.startswith('mc_') for line in lines)
              return '\n'.join(lines) + '\n'

          def run(inp):
              return subprocess.run([str(uvspec)], input=inp, text=True, capture_output=True, timeout=180, check=False)

          def parse(stdout):
              rows=[]
              for raw in stdout.splitlines():
                  parts=raw.strip().split()
                  if len(parts) < 2:
                      continue
                  try:
                      w=float(parts[0]); e=float(parts[1])
                  except ValueError:
                      continue
                  rows.append((w,e))
              if not rows:
                  raise RuntimeError('no parseable lambda/edir rows')
              if any(not math.isfinite(v) for row in rows for v in row):
                  raise RuntimeError('non-finite lambda/edir value')
              return rows

          src_a=audit/'synthetic-source-a.dat'; src_b=audit/'synthetic-source-b.dat'
          write_source(src_a,1.0); write_source(src_b,7.0)
          inp_a=render(src_a); inp_b=render(src_b)
          (audit/'arm-a.inp').write_text(inp_a,encoding='utf-8')
          (audit/'arm-b.inp').write_text(inp_b,encoding='utf-8')
          a=run(inp_a); b=run(inp_b)
          (audit/'arm-a.stdout.txt').write_text(a.stdout,encoding='utf-8')
          (audit/'arm-a.stderr.txt').write_text(a.stderr,encoding='utf-8')
          (audit/'arm-b.stdout.txt').write_text(b.stdout,encoding='utf-8')
          (audit/'arm-b.stderr.txt').write_text(b.stderr,encoding='utf-8')

          failures=[]
          if a.returncode != 0: failures.append(f'arm A exit code {a.returncode}')
          if b.returncode != 0: failures.append(f'arm B exit code {b.returncode}')
          wavelengths=[]; av=[]; bv=[]; ratios=[]; maxdev=None
          if not failures:
              try:
                  ar=parse(a.stdout); br=parse(b.stdout)
                  if [x[0] for x in ar] != [x[0] for x in br]:
                      failures.append('arm wavelength vectors differ')
                  elif len(ar) != len(br):
                      failures.append('arm output vector lengths differ')
                  elif any(x[1] <= 0.0 for x in ar):
                      failures.append('Arm A direct irradiance contains non-positive value')
                  else:
                      wavelengths=[x[0] for x in ar]; av=[x[1] for x in ar]; bv=[x[1] for x in br]
                      ratios=[y/x for x,y in zip(av,bv)]
                      if any(not math.isfinite(r) for r in ratios):
                          failures.append('non-finite B/A ratio')
                      else:
                          maxdev=max(abs(r-expected) for r in ratios)
                          if maxdev > tolerance:
                              failures.append(f'maximum absolute ratio deviation {maxdev:.12g} exceeds {tolerance}')
              except Exception as exc:
                  failures.append(str(exc))

          report={
              'schemaVersion':2,
              'status':'PASS_CUSTOM_SOURCE_WITH_REPTRAN_CONSUMED_EXACT_RUNTIME' if not failures else 'FAIL_CUSTOM_SOURCE_WITH_REPTRAN_NOT_ADMITTED',
              'classification':'NON_SCIENTIFIC_NON_PROTECTED_SOURCE_AMPLITUDE_CAPABILITY_PROBE',
              'baseMain':os.environ['BASE_MAIN'],
              'head':os.environ['GITHUB_SHA'],
              'runId':int(os.environ['GITHUB_RUN_ID']),
              'runAttempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
              'consumedV1Run':int(os.environ['CONSUMED_V1_RUN']),
              'knownV1Defect':os.environ['KNOWN_V1_DEFECT'],
              'molecularAbsorption':'reptran',
              'crsFallbackAllowed':False,
              'armAExitCode':a.returncode,
              'armBExitCode':b.returncode,
              'wavelengthNm':wavelengths,
              'armAEdirect':av,
              'armBEdirect':bv,
              'armBToArmARatio':ratios,
              'expectedRatio':expected,
              'maximumAbsoluteRatioDeviationAllowed':tolerance,
              'maximumAbsoluteRatioDeviationObserved':maxdev,
              'failureReasons':failures,
              'boundaries':{
                  'mysticExecuted':False,
                  'protectedLunarGeometryUsed':False,
                  'protectedLunarResultOpened':False,
                  'scientificSeedAllocated':False,
                  'exec004Allocated':False,
                  'writeQuietEntered':False,
                  'dispatchCreated':False,
                  'taylorOrJerusalemUsed':False,
                  'productionAuthorized':False,
              },
              'inputSha256':{
                  'armA':hashlib.sha256(inp_a.encode()).hexdigest(),
                  'armB':hashlib.sha256(inp_b.encode()).hexdigest(),
              },
          }
          with open(audit/'reptran-source-amplitude-capability-v2-report.json','w',encoding='utf-8') as f:
              json.dump(report,f,indent=2,sort_keys=True); f.write('\n')
          print(json.dumps(report,indent=2,sort_keys=True))
          if failures:
              raise SystemExit(2)
          PY

      - name: Enforce PASS and non-authorizing boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          p=os.path.join(os.environ['AUDIT_DIR'],'reptran-source-amplitude-capability-v2-report.json')
          x=json.load(open(p,encoding='utf-8'))
          assert x['status'] == 'PASS_CUSTOM_SOURCE_WITH_REPTRAN_CONSUMED_EXACT_RUNTIME'
          assert x['maximumAbsoluteRatioDeviationObserved'] <= 0.01
          assert x['armBToArmARatio'] and all(abs(r-7.0) <= 0.01 for r in x['armBToArmARatio'])
          b=x['boundaries']
          assert b['mysticExecuted'] is False
          assert b['protectedLunarGeometryUsed'] is False
          assert b['protectedLunarResultOpened'] is False
          assert b['scientificSeedAllocated'] is False
          assert b['exec004Allocated'] is False
          assert b['writeQuietEntered'] is False
          assert b['dispatchCreated'] is False
          assert b['taylorOrJerusalemUsed'] is False
          assert b['productionAuthorized'] is False
          PY

      - name: Upload immutable capability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lunar-reptran-source-amplitude-capability-v2
          path: lunar-reptran-source-amplitude-capability-v2-audit
          if-no-files-found: error
          retention-days: 30

      - name: Claim boundary
        if: always()
        shell: bash
        run: |
          echo 'Fresh exact-runtime synthetic REPTRAN source-amplitude capability only.'
          echo 'No MYSTIC, no protected lunar geometry/results, no scientific seeds/exec004/ordinal/WRITE_QUIET/dispatch, no Taylor/Jerusalem, no production authorization.'
