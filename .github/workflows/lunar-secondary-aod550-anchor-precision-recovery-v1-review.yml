name: Lunar secondary AOD550 anchor precision recovery v1 review

on:
  push:
    branches:
      - review/lunar-secondary-aod550-anchor-precision-recovery-v1
  pull_request:
    branches:
      - review/lunar-secondary-aod550-anchor-compatibility-v1
    paths:
      - 'review/lunar-scattered-light-source-contract-v1/lunar-mystic-secondary-aod550-anchor-precision-recovery-v1.json'
      - 'review/lunar-scattered-light-source-contract-v1/lunar_mystic_secondary_aod550_anchor_precision_recovery.py'
      - 'tests/test_lunar_mystic_secondary_aod550_anchor_precision_recovery_v1.py'
      - '.github/workflows/lunar-secondary-aod550-anchor-precision-recovery-v1-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-solver-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Refuse rerun semantics
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1

      - name: Run deterministic recovery contract and evaluator tests
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_lunar_mystic_secondary_aod550_anchor_compatibility_v1.py
          python tests/test_lunar_mystic_secondary_aod550_anchor_precision_recovery_v1.py

      - name: Set up exact frozen libRadtran runtime without scientific execution
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: lunar-anchor-precision-recovery-review-v1
          create-args: -c conda-forge python=3.12.4 rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Prepare all 36 exact-runtime recovery inputs and prove no solver execution
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          mkdir -p review-artifact
          python experiments/mystic-batch-v1/runtime_probe.py \
            --uvspec "$(command -v uvspec)" \
            --data-dir "$CONDA_PREFIX/share/libRadtran/data" \
            --atmosphere "$CONDA_PREFIX/share/libRadtran/data/atmmod/afglus.dat" \
            --runtime-lock experiments/mystic-batch-v1/runtime-lock.micromamba.json \
            --skip-help \
            --output review-artifact/runtime-report.json
          python review/lunar-scattered-light-source-contract-v1/lunar_mystic_secondary_aod550_anchor_precision_recovery.py \
            --prepare \
            --data-dir "$CONDA_PREFIX/share/libRadtran/data" \
            --atmosphere-file "$CONDA_PREFIX/share/libRadtran/data/atmmod/afglus.dat" \
            --atlas-file "$CONDA_PREFIX/share/libRadtran/data/solar_flux/atlas_plus_modtran" \
            --runtime-report review-artifact/runtime-report.json \
            --output-root review-artifact/prepared
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('review-artifact/prepared')
          manifest=json.load(open(root/'prepared-manifest.json'))
          assert manifest['status']=='PREPARED_NO_SOLVER_EXECUTION'
          assert manifest['caseCount']==36
          assert manifest['scientificSolverExecuted'] is False
          assert manifest['resultsOpened'] is False
          assert manifest['parentResultReclassified'] is False
          assert manifest['failedExec001Reclassified'] is False
          assert manifest['compatibilityProbeUsedAsPrecisionEvidence'] is False
          assert manifest['empiricalValidationClaim'] is False
          assert manifest['productionAuthorized'] is False
          assert [x['randomSeed'] for x in manifest['cases']]==list(range(28764001,28764037))
          assert [x['targetWavelengthNm'] for x in manifest['cases'][:12]]==[450.0]*12
          assert [x['targetWavelengthNm'] for x in manifest['cases'][12:24]]==[650.0]*12
          assert [x['targetWavelengthNm'] for x in manifest['cases'][24:]]==[750.0]*12
          for row in manifest['cases']:
            target=row['targetWavelengthNm']
            lo,hi=sorted((target,550.0))
            text=Path(row['inputPath']).read_text()
            assert text.count(f'wavelength {lo:.1f} {hi:.1f}')==1
            assert text.count('aerosol_set_tau_at_wvl 550 0.100000')==1
            assert 'mc_spectral_is' not in text
            assert text.count('mc_photons 5000000')==1
            assert text.count('mc_std')==1
            assert text.count('atm_z_grid ')==1
            assert text.count('zout 0.000000')==1
            assert 'altitude ' not in text
            source=Path(row['sparseSourcePath']).read_text().splitlines()
            assert len(source)==2
            assert [float(line.split()[0]) for line in source]==[lo,hi]
          runtime=json.load(open('review-artifact/runtime-report.json'))
          assert runtime['scientificSolverExecuted'] is False
          assert runtime['uvspecSha256']=='2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3'
          assert runtime['libRadtranDataTreeSha256']=='ad30b49177e9c84e46497d69faf0c75e466996b0d0003f1de210289ae9f847d7'
          PY

      - name: Publish review-only recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: lunar-secondary-aod550-anchor-precision-recovery-v1-review
          path: review-artifact
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Claim boundary
        if: always()
        shell: bash
        run: |
          echo 'Review/preparation only: this workflow does not invoke uvspec.'
          echo 'Compatibility probe magnitudes are not precision evidence.'
          echo 'Parent v1 remains FAIL_COMPUTATIONAL_PRECISION; exec001 remains EXECUTION_INCOMPLETE.'
          echo 'No Air-LUSI/X-Shooter/Taylor/Jerusalem residuals opened; no empirical, TOA, finite-disk, total-sky, or production claim.'
