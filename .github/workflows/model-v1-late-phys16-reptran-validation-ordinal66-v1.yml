name: Model v1 late PHYS16 fresh REPTRAN validation ordinal66 v1
run-name: Model v1 late PHYS16 fresh REPTRAN validation ordinal66 v1

on:
  push:
    branches:
      - 'dispatch/model-v1-late-phys16-reptran-validation-ordinal66-v1'

permissions:
  contents: read
  actions: read
  issues: read

concurrency:
  group: model-v1-late-phys16-reptran-validation-ordinal66-v1
  cancel-in-progress: false

env:
  SOURCE_HEAD: 33c2a944bc1d3c66fb24b7c1f78735c0e912e0b7
  DISPATCH_BRANCH: dispatch/model-v1-late-phys16-reptran-validation-ordinal66-v1
  WORKFLOW_PATH: .github/workflows/model-v1-late-phys16-reptran-validation-ordinal66-v1.yml
  FREEZE: review/model-v1-ordinal65-artifact-salvage-refit-seam-v1/post-ordinal65-structural-redesign-reptran-validation-freeze-v1.json
  MANIFEST: frozen/manifest.json
  ADAPTER: frozen/ordinal66_reptran_adapter.py
  EXECUTOR: frozen/ordinal66_executor.py

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.freeze.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - name: Exact one-shot identity, frozen-science, seed, and authority guards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_RUN_NUMBER" = 1
          test "$GITHUB_REF_NAME" = "$DISPATCH_BRANCH"
          test "$(git cat-file -p "$GITHUB_SHA" | grep -c '^parent ')" = 1
          test "$(git rev-parse "$GITHUB_SHA^")" = "$SOURCE_HEAD"
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")
          test "${#CHANGED[@]}" = 1
          test "${CHANGED[0]}" = "$WORKFLOW_PATH"

          test "$(git rev-parse "$SOURCE_HEAD:$FREEZE")" = 4107250a4175b9f37bb5329784e431d3e79e3152
          test "$(git rev-parse "$SOURCE_HEAD:experiments/mystic-batch-v1/reptran_visible_renderer_v1.py")" = 13c569ff271cb292fe7ad1fcfcff01d7e292923f
          test "$(git rev-parse "$SOURCE_HEAD:experiments/mystic-batch-v1/cross_geometry_adapter.py")" = 8d4416fceb323876b24fb98bfa6192cb235a6d4b
          test "$(git rev-parse "$SOURCE_HEAD:experiments/mystic-batch-v1/twilight_surrogate_tier1_execution_adapter.py")" = b00252709ca9ea41c6bf8b3ab59f8cdb8a2fc7bd
          test "$(git rev-parse "$SOURCE_HEAD:experiments/tier2-stage1-execution-v1/executor_v1.py")" = 01ed73eed2ef3ef04c17b7ff9f2adfea232489ea
          test "$(git rev-parse "$SOURCE_HEAD:experiments/tier2-stage1-execution-v1/stage1-execution-manifest-v1.json")" = d3c4c73047fb5844a59ddd0687c323c7f827c8a0

          gh api "repos/${{ github.repository }}/issues/comments/6024668760" > authority.json
          gh api "repos/${{ github.repository }}/actions/runs?branch=$DISPATCH_BRANCH&per_page=100" > branch-runs.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          a=json.loads(Path('authority.json').read_text())
          body=str(a.get('body',''))
          assert int(a.get('id',0)) == 6024668760
          assert 'MODEL_V1_STANDING_AUTHORITY_2026_10_06' in body
          assert '<=16deg' in body or '<=16' in body
          runs=json.loads(Path('branch-runs.json').read_text()).get('workflow_runs',[])
          current=[r for r in runs if int(r.get('id',0))==int(os.environ['GITHUB_RUN_ID'])]
          same=[r for r in runs if r.get('path')==os.environ['WORKFLOW_PATH']]
          prior=[r for r in same if int(r.get('id',0))!=int(os.environ['GITHUB_RUN_ID'])]
          assert len(current)==1, f'current run identity count={len(current)}'
          assert not prior, f'ordinal66 workflow already has prior run(s): {[r.get("id") for r in prior]}'
          PY

          git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
          mapfile -t SEED_SCAN_TIPS < <({
            printf '%s\n' "$SOURCE_HEAD"
            git for-each-ref --format='%(objectname) %(refname)' refs/remotes/origin/ | while read -r sha ref; do
              test "$ref" = "refs/remotes/origin/HEAD" && continue
              test "$ref" = "refs/remotes/origin/$DISPATCH_BRANCH" && continue
              printf '%s\n' "$sha"
            done
          } | sort -u)
          test "${#SEED_SCAN_TIPS[@]}" -ge 1
          for seed in \
            2261066601 2261066602 2261066603 2261066604 \
            2261066605 2261066606 2261066607 2261066608 \
            2261066609 2261066610 2261066611 2261066612 \
            2261066613 2261066614 2261066615 2261066616; do
            for tip in "${SEED_SCAN_TIPS[@]}"; do
              if git grep -F "$seed" "$tip" -- . >/dev/null 2>&1; then
                echo "seed collision outside current dispatch branch: seed=$seed tip=$tip"; exit 1
              fi
            done
          done

      - id: freeze
        name: Materialize exact frozen ordinal66 manifest and guarded REPTRAN execution adapter
        run: |
          set -euo pipefail
          mkdir -p frozen
          python - <<'PY'
          from pathlib import Path
          src=Path('experiments/tier2-stage1-execution-v1/executor_v1.py').read_text()
          old="BRANCH_RE=re.compile(r'^dispatch/tier2-stage1-ordinal[1-9][0-9]*-v3$')"
          new="BRANCH_RE=re.compile(r'^dispatch/model-v1-late-phys16-reptran-validation-ordinal66-v1$')"
          assert src.count(old)==1
          src=src.replace(old,new)
          old_mod="m=importlib.util.module_from_spec(s);s.loader.exec_module(m);return m"
          new_mod="m=importlib.util.module_from_spec(s);sys.modules[name]=m;s.loader.exec_module(m);return m"
          assert src.count(old_mod)==1
          src=src.replace(old_mod,new_mod)
          start=src.index('def parse_full_spectrum(')
          end=src.index('def compatibility_manifest(', start)
          replacement='''def parse_full_spectrum(path:Path)->tuple[list[float],list[float]]:\n    wl=[];rad=[]\n    for line in path.read_text(encoding=\'utf-8\',errors=\'strict\').splitlines():\n        p=line.split()\n        if len(p)<2:continue\n        try:w=float(p[0]);v=float(p[-1])\n        except ValueError:continue\n        req(math.isfinite(w) and math.isfinite(v) and v>=0.0,\'invalid raw spectrum value\');wl.append(w);rad.append(v)\n    req(len(wl)>=2,\'raw spectrum has fewer than two numeric rows\')\n    req(abs(wl[0]-380.0)<1e-8 and abs(wl[-1]-780.0)<1e-8,\'raw spectrum wavelength coverage drift\')\n    req(all(wl[i+1]>wl[i] for i in range(len(wl)-1)),\'raw spectrum wavelength order drift\')\n    return wl,rad\n'''
          src=src[:start]+replacement+src[end:]
          old_count="'rawSpectrumNodeCount':8001"
          assert src.count(old_count)==1
          src=src.replace(old_count,"'rawSpectrumNodeCount':len(wl)")
          Path('frozen/ordinal66_executor.py').write_text(src)
          PY

          cat > frozen/ordinal66_reptran_adapter.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations
          import copy, hashlib, importlib.util, json, math, sys
          from pathlib import Path
          MANIFEST_ID='model-v1-late-phys16-fresh-reptran-validation-ordinal66-v1'
          RUNTIME_KEYS=('uvspecSha256','uvspecHelpSha256','libRadtranDataTreeSha256','atmosphereSha256','runtimeLockRawSha256')
          RENDERER_REL=Path('experiments/mystic-batch-v1/reptran_visible_renderer_v1.py')
          GRID_REL=Path('review/full-spectrum-estimator-pilot-v2/wavelength-grid-1nm.dat')
          class Refusal(RuntimeError): pass
          def req(c,m):
              if not c: raise Refusal(m)
          def load(p):
              x=json.loads(Path(p).read_text()); req(isinstance(x,dict),f'object required: {p}'); return x
          def canon(v): return hashlib.sha256(json.dumps(v,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
          def module(name,path):
              req(Path(path).is_file(),f'reference missing: {path}')
              s=importlib.util.spec_from_file_location(name,path); req(s is not None and s.loader is not None,'module load failure')
              m=importlib.util.module_from_spec(s); sys.modules[name]=m; s.loader.exec_module(m); return m
          def selfhash(m):
              x=copy.deepcopy(m); x['manifestSha256']=None; return canon(x)
          def validate_manifest(m):
              req(m.get('manifestId')==MANIFEST_ID and m.get('status')=='FROZEN_BEFORE_ANY_ORDINAL66_RESULT','manifest identity drift')
              req(m.get('scientificOrdinal')==66 and m.get('validationOnly') is True,'ordinal/validation boundary drift')
              req(m.get('protectedHoldout') is False and m.get('geometryCount')==4 and m.get('caseCount')==16,'validation accounting drift')
              req(m.get('configuredPhotonHistories')==800_000_000,'photon accounting drift')
              req(m.get('candidateSha256')=='22e5e83b0156b5da8cb9499a3a8ada9a79ea85bf4210538b697ae6ace3445bcb','candidate identity drift')
              req(m.get('preregistrationSha256')=='5271ab173ff4ebe8b776bb1f2a80c7c7c3231f0240fd9035c38e991833ad6862','preregistration identity drift')
              req(m.get('manifestSha256')==selfhash(m),'manifest selfhash drift')
              req(all(c.get('role')=='fresh-independent-reptran-validation' and c.get('method')=='alis' and c.get('photonHistories')==50_000_000 for c in m.get('cases',[])),'case role/method/photon drift')
              req((m.get('closedBoundaries') or {}).get('coefficientRidgeFamilyRetuningAuthorized') is False,'retuning boundary opened')
              req((m.get('closedBoundaries') or {}).get('protectedHoldoutOpeningAuthorized') is False,'protected boundary opened')
          def validate_runtime(m,r):
              req(r.get('schemaVersion')==1 and r.get('stageId')=='mystic-batch-v1' and r.get('scientificSolverExecuted') is False and r.get('syntaxCheckExecuted') is False,'runtime header drift')
              want=m.get('runtimeIdentityRequired') or {}
              for k in RUNTIME_KEYS: req(r.get(k)==want.get(k),f'runtime identity drift: {k}')
          def resolve_case(m,case_id):
              rows=[x for x in m['cases'] if x.get('caseId')==case_id]; req(len(rows)==1,'case not unique'); c=rows[0]
              gs=[x for x in m['geometries'] if x.get('geometryId')==c.get('geometryId')]; req(len(gs)==1,'geometry not unique')
              return c,gs[0]
          def inputs(m,c,g):
              out={'caseId':c['caseId'],'groupId':g['geometryId'],'method':'alis','block':c['block'],'seed':c['seed'],'photonHistories':c['photonHistories'],
                   'sunDepressionDeg':g['sunDepressionDeg'],'targetAltitudeDeg':g['targetAltitudeDeg'],'relativeAzimuthDeg':g['relativeAzimuthDeg'],
                   'observerElevationM':g['observerElevationM'],'aod550':g['aod550'],'albedo':0.15,'wavelengthDomainNm':[380.0,780.0],
                   'diagnosticNodesNm':[500.0,550.0,600.0],'molecularAbsorption':'reptran','mcSpherical':'1D','alisSpectralImportanceSamplingNm':550.0,
                   'solarFlux':{'root':'libRadtranData','path':'solar_flux/atlas_plus_modtran'},
                   'wavelengthGrid':{'root':'repository','path':GRID_REL.as_posix()},'atmosphere':{'root':'libRadtranData','path':'atmmod/afglus.dat'}}
              req(10.5<out['sunDepressionDeg']<=16.0 and 5.0<=out['targetAltitudeDeg']<=80.0 and 0.0<=out['relativeAzimuthDeg']<=180.0 and 0.0<=out['observerElevationM']<=2500.0 and 0.05<=out['aod550']<=0.40,'physical input outside late-v1 box')
              return out
          def render_case(manifest_path,runtime_report_path,case_id,data_dir,repository_root,case_dir):
              m=load(manifest_path); r=load(runtime_report_path); validate_manifest(m); validate_runtime(m,r); c,g=resolve_case(m,case_id); x=inputs(m,c,g)
              renderer=module('ordinal66_reptran_renderer',Path(repository_root)/RENDERER_REL)
              text,renderer_proof=renderer.render_ground_site_input(x,Path(data_dir).resolve(),Path(repository_root).resolve(),Path(case_dir).resolve())
              lines=text.splitlines()
              req(lines.count('mol_abs_param reptran')==1 and 'mol_abs_param crs' not in lines,'REPTRAN absorption route drift')
              req(lines.count('wavelength 380 780')==1,'wavelength-domain drift')
              req(lines.count('mc_spherical 1D')==1 and lines.count('mc_vroom off')==1 and lines.count('mc_spectral_is 550.0')==1,'MYSTIC ALIS route drift')
              req(lines.count('zout 0.000000')==1 and sum(line.startswith('atm_z_grid ') for line in lines)==1,'ground-site representation drift')
              req(not any(line.startswith('altitude ') or line.startswith('mc_elevation_file ') for line in lines),'forbidden elevation shortcut emitted')
              p={'schemaVersion':1,'stageId':'model-v1-late-phys16-reptran-validation-prepared-v1','caseId':case_id,'geometryId':g['geometryId'],'block':c['block'],'role':c['role'],
                 'seed':c['seed'],'photonHistories':c['photonHistories'],'executionManifestSha256':m['manifestSha256'],
                 'inputResolvedSha256':hashlib.sha256(text.encode()).hexdigest(),'physicalInputCanonicalSha256':canon(x),
                 'rendererPath':RENDERER_REL.as_posix(),'rendererProof':renderer_proof,'inputs':x}
              return text,p
          PY

          python - <<'PY'
          import copy, hashlib, json, os
          from pathlib import Path
          freeze=json.loads(Path(os.environ['FREEZE']).read_text())
          pre=freeze['freshReptranValidationPreregistration']
          assert pre['status']=='FROZEN_BEFORE_ANY_ORDINAL66_RESULT'
          assert pre['scientificOrdinal']==66
          assert pre['candidateSha256']=='22e5e83b0156b5da8cb9499a3a8ada9a79ea85bf4210538b697ae6ace3445bcb'
          assert pre['preregistrationSha256']=='5271ab173ff4ebe8b776bb1f2a80c7c7c3231f0240fd9035c38e991833ad6862'
          assert pre['validationPhysics']['molecularAbsorption']=='reptran'
          assert pre['validationPhysics']['method']=='alis' and pre['validationPhysics']['mcSpherical']=='1D'
          assert pre['validationPhysics']['wavelengthDomainNm']==[380.0,780.0]
          assert pre['initialPhotonPlan']=={
              'blocksPerGeometry':4,'caseCount':16,
              'freshSeeds':'must be unique and collision-scanned before execution; ordinal65 seeds forbidden forever',
              'geometryCount':4,'photonHistoriesPerBlock':50000000,'totalPhotonHistories':800000000}
          base=json.loads(Path('experiments/tier2-stage1-execution-v1/stage1-execution-manifest-v1.json').read_text())
          seeds=list(range(2261066601,2261066617))
          geometries=[]; cases=[]; si=0
          for vg in pre['validationGeometries']:
              g=dict(vg['geometry']); g['geometryId']=vg['validationId']; geometries.append(g)
              for block in range(1,5):
                  cases.append({'ordinal':66,'caseId':f"{vg['validationId']}-b{block}",'geometryId':vg['validationId'],'groupId':vg['validationId'],
                      'role':'fresh-independent-reptran-validation','block':block,'seed':seeds[si],'photonHistories':50_000_000,'method':'alis',
                      'alisSpectralImportanceSamplingNm':550.0,'executionStage':'FRESH_REPTRAN_VALIDATION'})
                  si+=1
          assert len(geometries)==4 and len(cases)==16 and si==16
          m={'schemaVersion':1,'manifestId':'model-v1-late-phys16-fresh-reptran-validation-ordinal66-v1','status':'FROZEN_BEFORE_ANY_ORDINAL66_RESULT',
             'executionKey':'model-v1-late-phys16-fresh-reptran-validation-ordinal66-v1:scientific:1','scientificExecution':True,
             'validationOnly':True,'trainingOnly':False,'protectedHoldout':False,'standingAuthorityCommentId':6024668760,
             'sourceHead':os.environ['SOURCE_HEAD'],'scientificOrdinal':66,'candidateSha256':pre['candidateSha256'],'preregistrationSha256':pre['preregistrationSha256'],
             'geometryCount':4,'caseCount':16,'configuredPhotonHistories':800_000_000,'geometries':geometries,'cases':cases,
             'runtimeIdentityRequired':base['runtimeIdentityRequired'],'runtimePackage':base['runtimePackage'],
             'artifactContract':{'requiredMembers':base['artifactContract']['requiredMembers'],'rawBytesPreserved':True,'spectrumGridDecisionDeferredToPostRunAudit':True},
             'executionLimits':{'workflowAttemptExactly':1,'automaticRetryCountMaximum':0,'githubRerunAllowed':False,'resumeAllowed':False,
                                'solverExecutionsPerCaseExactly':1,'syntaxChecksPerCaseExactly':1,'perCaseTimeoutSeconds':2700,'maxParallel':4},
             'acceptanceRule':pre['acceptanceRule'],'precisionRule':pre['precisionRule'],'validationPhysics':pre['validationPhysics'],
             'closedBoundaries':{'protectedHoldoutOpeningAuthorized':False,'coefficientRidgeFamilyRetuningAuthorized':False,
                                 'TaylorJerusalemTuningAuthorized':False,'geometryReplacementBasedOnAgreementAuthorized':False,
                                 'productionPromotionByValidationAlone':False,'sunDepressionGreaterThan16Authorized':False},
             'manifestSha256':None}
          x=copy.deepcopy(m); x['manifestSha256']=None
          m['manifestSha256']=hashlib.sha256(json.dumps(x,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
          Path('frozen/manifest.json').write_text(json.dumps(m,indent=2,sort_keys=True,allow_nan=False)+'\n')
          matrix={'include':[{'caseId':c['caseId'],'timeoutSeconds':2700} for c in cases]}
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('matrix='+json.dumps(matrix,separators=(',',':'))+'\n')
          print(json.dumps({'manifestSha256':m['manifestSha256'],'caseCount':len(cases),'geometryCount':len(geometries),'seeds':seeds},sort_keys=True))
          PY

          python - <<'PY'
          import ast
          from pathlib import Path
          for p in ('frozen/ordinal66_executor.py','frozen/ordinal66_reptran_adapter.py'):
              ast.parse(Path(p).read_text(),filename=p)
          print('generated Python syntax audit: PASS')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: model-v1-late-o66-preflight-${{ github.sha }}
          path: |
            frozen/manifest.json
            frozen/ordinal66_reptran_adapter.py
            frozen/ordinal66_executor.py
          if-no-files-found: error
          retention-days: 90

  cases:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: model-v1-late-o66
          create-args: -c conda-forge python=3.12.4 rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true
      - uses: actions/download-artifact@v4
        with:
          name: model-v1-late-o66-preflight-${{ github.sha }}
          path: frozen
      - name: Re-prove exact runtime identity without solver execution
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          python experiments/mystic-batch-v1/runtime_probe.py \
            --uvspec "$(command -v uvspec)" \
            --data-dir "$CONDA_PREFIX/share/libRadtran/data" \
            --atmosphere "$CONDA_PREFIX/share/libRadtran/data/atmmod/afglus.dat" \
            --runtime-lock experiments/mystic-batch-v1/runtime-lock.micromamba.json \
            --output case-runtime.json
      - name: Execute exactly one syntax check and one REPTRAN MYSTIC solver invocation
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          python frozen/ordinal66_executor.py \
            --manifest frozen/manifest.json \
            --runtime-report case-runtime.json \
            --adapter frozen/ordinal66_reptran_adapter.py \
            --case-id '${{ matrix.caseId }}' \
            --data-dir "$CONDA_PREFIX/share/libRadtran/data" \
            --repository-root . \
            --uvspec "$(command -v uvspec)" \
            --output-root case-output \
            --timeout-seconds '${{ matrix.timeoutSeconds }}' \
            --expected-dispatch-branch "$DISPATCH_BRANCH" \
            --allow-execution
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-v1-late-o66-case-${{ matrix.caseId }}
          path: case-output/${{ matrix.caseId }}
          if-no-files-found: warn
          retention-days: 90

  collect:
    needs: [preflight, cases]
    if: always() && needs.preflight.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: model-v1-late-o66-preflight-${{ github.sha }}
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          pattern: model-v1-late-o66-case-*
          path: case-artifacts
          merge-multiple: false
      - name: Collect statuses and raw hashes without scientific interpretation
        run: |
          set -euo pipefail
          mkdir -p collection-output
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest=json.loads(Path('frozen/manifest.json').read_text())
          rows=[]
          for c in manifest['cases']:
              matches=[]
              for p in Path('case-artifacts').rglob('case-result.json'):
                  try:x=json.loads(p.read_text())
                  except Exception:continue
                  if x.get('caseId')==c['caseId']: matches.append((p,x))
              rec={'caseId':c['caseId'],'geometryId':c['geometryId'],'block':c['block'],'seed':c['seed'],'photonHistories':c['photonHistories'],'occurrenceCount':len(matches)}
              if len(matches)==1:
                  p,x=matches[0]; rec['status']=x.get('status'); rec['caseResultSha256']=hashlib.sha256(p.read_bytes()).hexdigest(); rec['rawSpectrumNodeCount']=x.get('rawSpectrumNodeCount')
                  rad=p.parent/'mc.rad.spc'; std=p.parent/'mc.rad.std.spc'
                  rec['radiancePresent']=rad.is_file(); rec['stdRadiancePresent']=std.is_file()
                  rec['radianceSha256']=hashlib.sha256(rad.read_bytes()).hexdigest() if rad.is_file() else None
                  rec['stdRadianceSha256']=hashlib.sha256(std.read_bytes()).hexdigest() if std.is_file() else None
              else:
                  rec['status']='MISSING_OR_DUPLICATE'
              rows.append(rec)
          out={'schemaVersion':1,'status':'RAW_ORDINAL66_COLLECTION_NO_SCIENTIFIC_INTERPRETATION','scientificOrdinal':66,
               'candidateSha256':manifest['candidateSha256'],'preregistrationSha256':manifest['preregistrationSha256'],
               'manifestSha256':manifest['manifestSha256'],'caseCountExpected':16,'caseRecords':rows,
               'completedCount':sum(r.get('status')=='COMPLETED' for r in rows),'protectedHoldoutOpened':False,'modelRetuningPerformed':False}
          raw=json.dumps(out,sort_keys=True,separators=(',',':'),allow_nan=False).encode(); out['collectionSha256']=hashlib.sha256(raw).hexdigest()
          Path('collection-output/ordinal66-raw-collection.json').write_text(json.dumps(out,indent=2,sort_keys=True,allow_nan=False)+'\n')
          print(json.dumps({'completedCount':out['completedCount'],'collectionSha256':out['collectionSha256']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-v1-late-o66-raw-collection-${{ github.sha }}
          path: collection-output
          if-no-files-found: error
          retention-days: 90
