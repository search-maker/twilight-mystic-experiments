name: MYSTIC cross-geometry authorization proposal

on:
  pull_request:
    paths:
      - ".github/workflows/mystic-batch-v1-cross-geometry-authorization-proposal.yml"
      - ".github/workflows/mystic-batch-v1-cross-geometry-execution.yml"
      - "experiments/mystic-batch-v1/cross_geometry_authorization_proposal.py"
      - "experiments/mystic-batch-v1/duplicate_run_audit.py"
      - "experiments/mystic-batch-v1/manifest.cross-geometry-pilot.proposal.json"
      - "experiments/mystic-batch-v1/cross-geometry-contract.json"
      - "experiments/mystic-batch-v1/authorization.cross-geometry-template.json"
      - "experiments/mystic-batch-v1/cross_geometry_adapter.py"
      - "experiments/mystic-batch-v1/cross_geometry_validate.py"
      - "experiments/mystic-batch-v1/cross_geometry_execution_adapter.py"
      - "experiments/mystic-batch-v1/runtime-lock.micromamba.json"
      - "experiments/mystic-batch-v1/cross_geometry_execution_plan.py"
      - "experiments/mystic-batch-v1/cross_geometry_execution_analysis_driver.py"
      - "experiments/mystic-batch-v1/scientific_case_executor.py"
      - "experiments/mystic-batch-v1/scientific_aggregate.py"
      - "experiments/mystic-batch-v1/scientific_audit.py"
      - "tests/test_mystic_batch_v1_cross_geometry_authorization_proposal.py"
      - "tests/test_mystic_batch_v1_cross_geometry_authorization_attempt.py"
      - "tests/test_mystic_batch_v1_duplicate_run_titles.py"
  push:
    branches:
      - "agent/**"
    paths:
      - ".github/workflows/mystic-batch-v1-cross-geometry-authorization-proposal.yml"
      - ".github/workflows/mystic-batch-v1-cross-geometry-execution.yml"
      - "experiments/mystic-batch-v1/cross_geometry_authorization_proposal.py"
      - "experiments/mystic-batch-v1/duplicate_run_audit.py"
      - "experiments/mystic-batch-v1/manifest.cross-geometry-pilot.proposal.json"
      - "experiments/mystic-batch-v1/cross-geometry-contract.json"
      - "experiments/mystic-batch-v1/authorization.cross-geometry-template.json"
      - "experiments/mystic-batch-v1/cross_geometry_adapter.py"
      - "experiments/mystic-batch-v1/cross_geometry_validate.py"
      - "experiments/mystic-batch-v1/cross_geometry_execution_adapter.py"
      - "experiments/mystic-batch-v1/runtime-lock.micromamba.json"
      - "experiments/mystic-batch-v1/cross_geometry_execution_plan.py"
      - "experiments/mystic-batch-v1/cross_geometry_execution_analysis_driver.py"
      - "experiments/mystic-batch-v1/scientific_case_executor.py"
      - "experiments/mystic-batch-v1/scientific_aggregate.py"
      - "experiments/mystic-batch-v1/scientific_audit.py"
      - "tests/test_mystic_batch_v1_cross_geometry_authorization_proposal.py"
      - "tests/test_mystic_batch_v1_cross_geometry_authorization_attempt.py"
      - "tests/test_mystic_batch_v1_duplicate_run_titles.py"

permissions:
  contents: read

jobs:
  proposal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - name: Test exact authorization proposal and one-shot title contracts
        run: >-
          python -m unittest -v
          tests/test_mystic_batch_v1_cross_geometry_authorization_proposal.py
          tests/test_mystic_batch_v1_cross_geometry_authorization_attempt.py
          tests/test_mystic_batch_v1_duplicate_run_titles.py
      - name: Compile proposal generator and duplicate-run guard
        run: >-
          python -m py_compile
          experiments/mystic-batch-v1/cross_geometry_authorization_proposal.py
          experiments/mystic-batch-v1/duplicate_run_audit.py
      - name: Generate exact proposal without execution
        run: >-
          python experiments/mystic-batch-v1/cross_geometry_authorization_proposal.py
          --repository-root .
          --output authorization-proposal/cross-geometry-authorization-proposal.json
      - name: Prove workflow contains no scientific execution trigger or command
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path(".github/workflows/mystic-batch-v1-cross-geometry-authorization-proposal.yml").read_text().lower()
          header = workflow.split("jobs:", 1)[0]
          forbidden_triggers = ("workflow_dispatch:", "schedule:", "repository_dispatch:")
          present = [token for token in forbidden_triggers if token in header]
          if present:
              raise SystemExit(f"proposal workflow has execution trigger: {present}")
          script = Path("experiments/mystic-batch-v1/cross_geometry_authorization_proposal.py").read_text().lower()
          forbidden = ("uvspec -c", "rte_solver", "mc_photons", "subprocess.run(", "os.system", "popen(")
          found = [token for token in forbidden if token in script]
          if found:
              raise SystemExit(f"proposal generator has execution primitive: {found}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cross-geometry-authorization-proposal
          path: authorization-proposal
          if-no-files-found: error
          retention-days: 90
