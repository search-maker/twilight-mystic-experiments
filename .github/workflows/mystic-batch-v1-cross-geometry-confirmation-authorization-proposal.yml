name: MYSTIC cross-geometry held-out confirmation authorization proposal

on:
  workflow_run:
    workflows: ["MYSTIC cross-geometry final convergence v1 scientific execution"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful final-convergence source run ID
        required: true
        type: string
  push:
    branches: ["agent/cross-geometry-held-out-confirmation"]
    paths:
      - ".github/workflows/mystic-batch-v1-cross-geometry-confirmation-authorization-proposal.yml"
      - ".github/workflows/mystic-batch-v1-cross-geometry-confirmation-execution.yml"
      - "experiments/mystic-batch-v1/authorization.cross-geometry-confirmation.json"
      - "experiments/mystic-batch-v1/authorization.cross-geometry-confirmation-execution-template.json"
      - "experiments/mystic-batch-v1/cross_geometry_confirmation_package.py"
      - "experiments/mystic-batch-v1/cross_geometry_confirmation_execution_adapter.py"
      - "experiments/mystic-batch-v1/cross_geometry_confirmation_execution_guard.py"
      - "experiments/mystic-batch-v1/cross_geometry_confirmation_execution_plan.py"
      - "experiments/mystic-batch-v1/cross_geometry_confirmation_analysis_driver.py"
      - "experiments/mystic-batch-v1/cross_geometry_confirmation_authorization_proposal.py"

permissions:
  contents: read
  actions: read

jobs:
  proposal:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - name: Resolve source run ID
        id: source
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_id=${{ inputs.source_run_id }}" >> "$GITHUB_OUTPUT"
          else
            echo "run_id=30869495039" >> "$GITHUB_OUTPUT"
          fi
      - name: Download exact final-convergence analysis artifact
        uses: actions/download-artifact@v4
        with:
          name: cross-geometry-final-convergence-v1-analysis
          path: source-download
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize source files and fetch run metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p source-package
          python - <<'PY'
          from pathlib import Path
          import shutil
          root = Path('source-download')
          target = Path('source-package')
          for name in ('final-convergence-analysis.json', 'next-confirmation-proposal.json', 'model-readiness.json'):
              matches = list(root.rglob(name))
              if len(matches) != 1:
                  raise SystemExit(f'expected one {name}, found {len(matches)}')
              shutil.copy2(matches[0], target / name)
          PY
          gh api "repos/${{ github.repository }}/actions/runs/${{ steps.source.outputs.run_id }}" > source-package/source-run.json
      - name: Generate exact proposal without authorization or execution
        run: >-
          python experiments/mystic-batch-v1/cross_geometry_confirmation_authorization_proposal.py
          --repository-root .
          --source-analysis source-package/final-convergence-analysis.json
          --source-proposal source-package/next-confirmation-proposal.json
          --source-readiness source-package/model-readiness.json
          --source-run-metadata source-package/source-run.json
          --source-run-id "${{ steps.source.outputs.run_id }}"
          --output authorization-proposal/cross-geometry-confirmation-authorization-proposal.json
      - name: Prove proposal workflow has no scientific execution surface
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/mystic-batch-v1-cross-geometry-confirmation-authorization-proposal.yml').read_text().lower()
          executable = workflow.split('- name: prove proposal workflow has no scientific execution surface', 1)[0]
          forbidden = ('setup-micromamba', 'scientific_case_executor.py', 'uvspec -c', 'rte_solver mystic', '--allow-execution')
          found = [token for token in forbidden if token in executable]
          if found:
              raise SystemExit(f'proposal workflow has scientific execution surface: {found}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cross-geometry-held-out-confirmation-authorization-proposal
          path: authorization-proposal
          if-no-files-found: error
          retention-days: 90
