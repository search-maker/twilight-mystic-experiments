name: MYSTIC cross-geometry held-out confirmation contract

on:
  pull_request:
    paths:
      - ".github/workflows/mystic-batch-v1-cross-geometry-confirmation-contract.yml"
      - ".github/workflows/mystic-batch-v1-cross-geometry-confirmation-execution.yml"
      - ".github/workflows/mystic-batch-v1-cross-geometry-confirmation-authorization-proposal.yml"
      - "experiments/mystic-batch-v1/HELD_OUT_CONFIRMATION.md"
      - "experiments/mystic-batch-v1/authorization.cross-geometry-confirmation.json"
      - "experiments/mystic-batch-v1/authorization.cross-geometry-confirmation-execution-template.json"
      - "experiments/mystic-batch-v1/cross_geometry_confirmation_package.py"
      - "experiments/mystic-batch-v1/cross_geometry_confirmation_execution_adapter.py"
      - "experiments/mystic-batch-v1/cross_geometry_confirmation_execution_guard.py"
      - "experiments/mystic-batch-v1/cross_geometry_confirmation_execution_plan.py"
      - "experiments/mystic-batch-v1/cross_geometry_confirmation_analysis_driver.py"
      - "experiments/mystic-batch-v1/cross_geometry_confirmation_authorization_proposal.py"
      - "tests/test_mystic_batch_v1_cross_geometry_confirmation.py"
  push:
    branches: ["agent/**"]
    paths:
      - ".github/workflows/mystic-batch-v1-cross-geometry-confirmation-contract.yml"
      - ".github/workflows/mystic-batch-v1-cross-geometry-confirmation-execution.yml"
      - ".github/workflows/mystic-batch-v1-cross-geometry-confirmation-authorization-proposal.yml"
      - "experiments/mystic-batch-v1/HELD_OUT_CONFIRMATION.md"
      - "experiments/mystic-batch-v1/authorization.cross-geometry-confirmation.json"
      - "experiments/mystic-batch-v1/authorization.cross-geometry-confirmation-execution-template.json"
      - "experiments/mystic-batch-v1/cross_geometry_confirmation_package.py"
      - "experiments/mystic-batch-v1/cross_geometry_confirmation_execution_adapter.py"
      - "experiments/mystic-batch-v1/cross_geometry_confirmation_execution_guard.py"
      - "experiments/mystic-batch-v1/cross_geometry_confirmation_execution_plan.py"
      - "experiments/mystic-batch-v1/cross_geometry_confirmation_analysis_driver.py"
      - "experiments/mystic-batch-v1/cross_geometry_confirmation_authorization_proposal.py"
      - "tests/test_mystic_batch_v1_cross_geometry_confirmation.py"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - name: Test dynamic promotion, planning, held-out isolation, and disabled authorization
        run: python -m unittest -v tests/test_mystic_batch_v1_cross_geometry_confirmation.py
      - name: Compile held-out confirmation package
        run: >-
          python -m py_compile
          experiments/mystic-batch-v1/cross_geometry_confirmation_package.py
          experiments/mystic-batch-v1/cross_geometry_confirmation_execution_adapter.py
          experiments/mystic-batch-v1/cross_geometry_confirmation_execution_guard.py
          experiments/mystic-batch-v1/cross_geometry_confirmation_execution_plan.py
          experiments/mystic-batch-v1/cross_geometry_confirmation_analysis_driver.py
          experiments/mystic-batch-v1/cross_geometry_confirmation_authorization_proposal.py
      - name: Prove active authorization remains exactly disabled
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          active=json.loads(Path('experiments/mystic-batch-v1/authorization.cross-geometry-confirmation.json').read_text())
          template=json.loads(Path('experiments/mystic-batch-v1/authorization.cross-geometry-confirmation-execution-template.json').read_text())
          if active != template:
              raise SystemExit('active confirmation authorization differs from template')
          required={'authorized':False,'scientificExecution':False,'scientificDiagnostic':False,'authorizationOrdinal':0,'consumed':False,'exactAuthorizationParentCommit':None,'exactAuthorizationCommit':None}
          stale={key:(active.get(key),value) for key,value in required.items() if active.get(key)!=value}
          if stale:
              raise SystemExit(f'confirmation authorization is not disabled: {stale}')
          PY
      - name: Prove execution is manual, isolated, and non-retrying
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/mystic-batch-v1-cross-geometry-confirmation-execution.yml')
          text=path.read_text()
          header=text.split('jobs:',1)[0]
          required=('workflow_dispatch:','fail-fast: false','cancel-in-progress: false','duplicate_run_audit.py','runtime_probe.py','scientific_case_executor.py','scientific_aggregate.py','scientific_audit.py','held-out-confirmation-analysis.json')
          missing=[token for token in required if token not in text]
          if missing:
              raise SystemExit(f'execution workflow tokens missing: {missing}')
          forbidden=('schedule:','repository_dispatch:','\n  push:','\n  pull_request:','rerun')
          present=[token for token in forbidden if token in header.lower()]
          if present:
              raise SystemExit(f'execution workflow has forbidden trigger or retry: {present}')
          PY
      - name: Prove proposal automation cannot execute science
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/mystic-batch-v1-cross-geometry-confirmation-authorization-proposal.yml').read_text().lower()
          required=('workflow_run:','workflow_dispatch:','cross_geometry_confirmation_authorization_proposal.py')
          missing=[token for token in required if token not in text]
          if missing:
              raise SystemExit(f'proposal workflow tokens missing: {missing}')
          forbidden=('setup-micromamba','scientific_case_executor.py','uvspec -c','rte_solver mystic','--allow-execution')
          present=[token for token in forbidden if token in text]
          if present:
              raise SystemExit(f'proposal workflow has scientific execution surface: {present}')
          PY
      - name: Prove confirmation is bounded and does not auto-authorize a model
        run: |
          python - <<'PY'
          from pathlib import Path
          package=Path('experiments/mystic-batch-v1/cross_geometry_confirmation_package.py').read_text()
          analysis=Path('experiments/mystic-batch-v1/cross_geometry_confirmation_analysis_driver.py').read_text()
          required=('MAX_CASES = 24','MAX_PHOTONS_PER_CASE = 400_000_000','noAutomaticAdditionalBlocks','productionModelReady": False','observationValidationRequired": True')
          missing=[token for token in required if token not in package+analysis]
          if missing:
              raise SystemExit(f'bounded confirmation tokens missing: {missing}')
          PY
