name: MYSTIC cross-geometry held-out confirmation v1 scientific execution
run-name: Cross geometry held-out confirmation v1 | key=${{ inputs.execution_key }} | auth=${{ inputs.authorization_ref }} | ordinal=${{ inputs.authorization_ordinal }}

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful final-convergence source run ID
        required: true
        type: string
      authorization_ref:
        description: Exact one-purpose held-out confirmation authorization commit SHA
        required: true
        type: string
      execution_key:
        description: Exact one-shot held-out confirmation execution key
        required: true
        type: string
      authorization_ordinal:
        description: Exact held-out confirmation authorization ordinal
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: cross-geometry-held-out-confirmation-v1-${{ inputs.execution_key }}
  cancel-in-progress: false

env:
  AUTHORIZATION: experiments/mystic-batch-v1/authorization.cross-geometry-confirmation.json
  AUTHORIZATION_TEMPLATE: experiments/mystic-batch-v1/authorization.cross-geometry-confirmation-execution-template.json
  PACKAGE: experiments/mystic-batch-v1/cross_geometry_confirmation_package.py
  BASE_ADAPTER: experiments/mystic-batch-v1/cross_geometry_adapter.py
  EXECUTION_ADAPTER: experiments/mystic-batch-v1/cross_geometry_confirmation_execution_adapter.py
  DUPLICATE_RUN_AUDIT: experiments/mystic-batch-v1/duplicate_run_audit.py
  RUNTIME_PROBE: experiments/mystic-batch-v1/runtime_probe.py
  EXECUTION_WORKFLOW: .github/workflows/mystic-batch-v1-cross-geometry-confirmation-execution.yml
  RUNTIME_LOCK: experiments/mystic-batch-v1/runtime-lock.micromamba.json
  PLAN: experiments/mystic-batch-v1/cross_geometry_confirmation_execution_plan.py
  ANALYSIS_DRIVER: experiments/mystic-batch-v1/cross_geometry_confirmation_analysis_driver.py
  CONVERGENCE_MODULE: experiments/mystic-batch-v1/cross_geometry_convergence_v2.py
  EXECUTOR: experiments/mystic-batch-v1/scientific_case_executor.py
  AGGREGATE: experiments/mystic-batch-v1/scientific_aggregate.py
  AUDIT: experiments/mystic-batch-v1/scientific_audit.py
  SOURCE_ARTIFACT: cross-geometry-final-convergence-v1-analysis

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      max_parallel: ${{ steps.plan.outputs.max_parallel }}
      timeout_seconds: ${{ steps.plan.outputs.timeout_seconds }}
    steps:
      - name: Check out exact held-out confirmation authorization commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.authorization_ref }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - name: Download exact final-convergence analysis artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source-download
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize source files and fetch immutable run metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p source-package
          python - <<'PY'
          from pathlib import Path
          import shutil
          root = Path('source-download')
          target = Path('source-package')
          for name in ('final-convergence-analysis.json', 'next-confirmation-proposal.json', 'model-readiness.json'):
              matches = list(root.rglob(name))
              if len(matches) != 1:
                  raise SystemExit(f'expected one {name}, found {len(matches)}')
              shutil.copy2(matches[0], target / name)
          PY
          gh api "repos/${{ github.repository }}/actions/runs/${{ inputs.source_run_id }}" > source-package/source-run.json
      - name: Verify one-purpose authorization and promote exact held-out manifest
        run: >-
          python experiments/mystic-batch-v1/cross_geometry_confirmation_execution_guard.py
          --repository-root .
          --authorization "$AUTHORIZATION"
          --authorization-template "$AUTHORIZATION_TEMPLATE"
          --source-analysis source-package/final-convergence-analysis.json
          --source-proposal source-package/next-confirmation-proposal.json
          --source-readiness source-package/model-readiness.json
          --source-run-metadata source-package/source-run.json
          --promoted-manifest-output preflight/manifest.json
          --package "$PACKAGE"
          --base-adapter "$BASE_ADAPTER"
          --execution-adapter "$EXECUTION_ADAPTER"
          --duplicate-run-audit "$DUPLICATE_RUN_AUDIT"
          --runtime-probe "$RUNTIME_PROBE"
          --execution-workflow "$EXECUTION_WORKFLOW"
          --runtime-lock "$RUNTIME_LOCK"
          --plan "$PLAN"
          --analysis-driver "$ANALYSIS_DRIVER"
          --convergence-module "$CONVERGENCE_MODULE"
          --executor "$EXECUTOR"
          --aggregate "$AGGREGATE"
          --audit "$AUDIT"
          --source-run-id "${{ inputs.source_run_id }}"
          --authorization-ref "${{ inputs.authorization_ref }}"
          --execution-key "${{ inputs.execution_key }}"
          --authorization-ordinal "${{ inputs.authorization_ordinal }}"
          --output preflight/authorization-guard.json
      - name: Refuse duplicate held-out confirmation marker before syntax or solver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python "$DUPLICATE_RUN_AUDIT"
          --repository "${{ github.repository }}"
          --workflow mystic-batch-v1-cross-geometry-confirmation-execution.yml
          --current-run-id "${{ github.run_id }}"
          --execution-key "${{ inputs.execution_key }}"
          --authorization-ref "${{ inputs.authorization_ref }}"
          --authorization-ordinal "${{ inputs.authorization_ordinal }}"
          --token "$GH_TOKEN"
          --output preflight/duplicate-run-audit.json
      - name: Freeze exact dynamic held-out confirmation plan
        id: plan
        run: >-
          python "$PLAN"
          --manifest preflight/manifest.json
          --guard-report preflight/authorization-guard.json
          --output preflight/plan.json
          --github-output "$GITHUB_OUTPUT"
      - name: Preserve exact source package inside preflight artifact
        run: cp -R source-package preflight/source-package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-geometry-held-out-confirmation-v1-preflight
          path: preflight
          if-no-files-found: warn
          retention-days: 90

  cases:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.preflight.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    steps:
      - name: Check out exact held-out confirmation authorization commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.authorization_ref }}
          fetch-depth: 2
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: cross-geometry-held-out-confirmation-v1
          create-args: >-
            -c conda-forge
            python=3.12.4
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true
      - uses: actions/download-artifact@v4
        with:
          name: cross-geometry-held-out-confirmation-v1-preflight
          path: preflight
      - name: Recompute exact runtime identity after cache restore
        shell: bash -el {0}
        run: |
          set -euo pipefail
          UVSPEC="$(command -v uvspec)"
          DATA_DIR="$CONDA_PREFIX/share/libRadtran/data"
          ATMOSPHERE="$DATA_DIR/atmmod/afglus.dat"
          test -x "$UVSPEC"
          test -d "$DATA_DIR"
          test -s "$ATMOSPHERE"
          python "$RUNTIME_PROBE" \
            --uvspec "$UVSPEC" \
            --data-dir "$DATA_DIR" \
            --atmosphere "$ATMOSPHERE" \
            --runtime-lock "$RUNTIME_LOCK" \
            --output "runtime-reports/${{ matrix.case_id }}/runtime-report.json"
      - name: Execute exactly one isolated held-out confirmation case
        shell: bash -el {0}
        run: |
          set -euo pipefail
          UVSPEC="$(command -v uvspec)"
          DATA_DIR="$CONDA_PREFIX/share/libRadtran/data"
          python "$EXECUTOR" \
            --manifest preflight/manifest.json \
            --runtime-report "runtime-reports/${{ matrix.case_id }}/runtime-report.json" \
            --adapter "$EXECUTION_ADAPTER" \
            --case-id "${{ matrix.case_id }}" \
            --data-dir "$DATA_DIR" \
            --repository-root "$GITHUB_WORKSPACE" \
            --uvspec "$UVSPEC" \
            --output-root case-output \
            --timeout-seconds "${{ needs.preflight.outputs.timeout_seconds }}" \
            --allow-execution
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-geometry-held-out-confirmation-v1-case-${{ matrix.case_id }}
          path: |
            case-output
            runtime-reports
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    needs: [preflight, cases]
    if: always() && needs.preflight.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.authorization_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - uses: actions/download-artifact@v4
        with:
          name: cross-geometry-held-out-confirmation-v1-preflight
          path: preflight
      - uses: actions/download-artifact@v4
        with:
          pattern: cross-geometry-held-out-confirmation-v1-case-*
          path: case-artifacts
          merge-multiple: true
      - name: Aggregate exact held-out confirmation case set
        run: python "$AGGREGATE" --plan preflight/plan.json --cases-root case-artifacts --output-dir aggregate-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-geometry-held-out-confirmation-v1-aggregate
          path: aggregate-output
          if-no-files-found: warn
          retention-days: 90

  audit:
    needs: [preflight, cases, aggregate]
    if: always() && needs.preflight.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.authorization_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - uses: actions/download-artifact@v4
        with:
          name: cross-geometry-held-out-confirmation-v1-preflight
          path: preflight
      - uses: actions/download-artifact@v4
        with:
          pattern: cross-geometry-held-out-confirmation-v1-case-*
          path: case-artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: cross-geometry-held-out-confirmation-v1-aggregate
          path: aggregate-output
      - name: Independently audit exact held-out plan, hashes, counts, and statistics
        run: python "$AUDIT" --plan preflight/plan.json --cases-root case-artifacts --aggregate-dir aggregate-output --output audit-output/audit-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-geometry-held-out-confirmation-v1-audit
          path: audit-output
          if-no-files-found: warn
          retention-days: 90

  analysis:
    needs: [preflight, cases, aggregate, audit]
    if: needs.aggregate.result == 'success' && needs.audit.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.authorization_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - uses: actions/download-artifact@v4
        with:
          name: cross-geometry-held-out-confirmation-v1-preflight
          path: preflight
      - uses: actions/download-artifact@v4
        with:
          pattern: cross-geometry-held-out-confirmation-v1-case-*
          path: case-artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: cross-geometry-held-out-confirmation-v1-aggregate
          path: aggregate-output
      - uses: actions/download-artifact@v4
        with:
          name: cross-geometry-held-out-confirmation-v1-audit
          path: audit-output
      - name: Analyze held-out results and emit audited reference dataset
        run: >-
          python "$ANALYSIS_DRIVER"
          --manifest preflight/manifest.json
          --source-final-analysis preflight/source-package/final-convergence-analysis.json
          --cases-root case-artifacts
          --summary aggregate-output/batch-summary.json
          --audit audit-output/audit-report.json
          --convergence-module "$CONVERGENCE_MODULE"
          --output-dir analysis-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-geometry-held-out-confirmation-v1-analysis
          path: analysis-output
          if-no-files-found: warn
          retention-days: 90
