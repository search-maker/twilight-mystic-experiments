name: MYSTIC cross-geometry execution bridge contract

on:
  pull_request:
    paths:
      - ".github/workflows/mystic-batch-v1-cross-geometry-execution.yml"
      - ".github/workflows/mystic-batch-v1-cross-geometry-execution-contract.yml"
      - "experiments/mystic-batch-v1/cross_geometry_execution_guard.py"
      - "experiments/mystic-batch-v1/cross_geometry_execution_plan.py"
      - "experiments/mystic-batch-v1/cross_geometry_execution_adapter.py"
      - "experiments/mystic-batch-v1/cross_geometry_execution_analysis_driver.py"
      - "experiments/mystic-batch-v1/authorization.cross-geometry.json"
      - "experiments/mystic-batch-v1/authorization.cross-geometry-execution-template.json"
      - "tests/test_mystic_batch_v1_cross_geometry_execution.py"
  push:
    branches:
      - "agent/**"
    paths:
      - ".github/workflows/mystic-batch-v1-cross-geometry-execution.yml"
      - ".github/workflows/mystic-batch-v1-cross-geometry-execution-contract.yml"
      - "experiments/mystic-batch-v1/cross_geometry_execution_guard.py"
      - "experiments/mystic-batch-v1/cross_geometry_execution_plan.py"
      - "experiments/mystic-batch-v1/cross_geometry_execution_adapter.py"
      - "experiments/mystic-batch-v1/cross_geometry_execution_analysis_driver.py"
      - "experiments/mystic-batch-v1/authorization.cross-geometry.json"
      - "experiments/mystic-batch-v1/authorization.cross-geometry-execution-template.json"
      - "tests/test_mystic_batch_v1_cross_geometry_execution.py"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - name: Run bridge, authorization, adapter, plan, and analysis tests
        run: python -m unittest -v tests/test_mystic_batch_v1_cross_geometry_execution.py
      - name: Compile bridge package
        run: >-
          python -m py_compile
          experiments/mystic-batch-v1/cross_geometry_execution_guard.py
          experiments/mystic-batch-v1/cross_geometry_execution_plan.py
          experiments/mystic-batch-v1/cross_geometry_execution_adapter.py
          experiments/mystic-batch-v1/cross_geometry_execution_analysis_driver.py
      - name: Prove active authorization remains exactly disabled
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          active = json.loads(Path("experiments/mystic-batch-v1/authorization.cross-geometry.json").read_text())
          template = json.loads(Path("experiments/mystic-batch-v1/authorization.cross-geometry-execution-template.json").read_text())
          if active != template:
              raise SystemExit("active authorization differs from disabled template")
          required = {
              "authorized": False,
              "scientificExecution": False,
              "scientificDiagnostic": False,
              "authorizationOrdinal": 0,
              "consumed": False,
              "exactAuthorizationParentCommit": None,
              "exactAuthorizationCommit": None,
          }
          stale = {key: (active.get(key), value) for key, value in required.items() if active.get(key) != value}
          if stale:
              raise SystemExit(f"cross-geometry authorization is not disabled: {stale}")
          PY
      - name: Prove bridge workflow is manual, matrix-isolated, and non-retrying
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path(".github/workflows/mystic-batch-v1-cross-geometry-execution.yml").read_text()
          header = workflow.split("jobs:", 1)[0]
          required = (
              "workflow_dispatch:",
              "fail-fast: false",
              "cancel-in-progress: false",
              "cross_geometry_execution_guard.py",
              "duplicate_run_audit.py",
              "runtime_probe.py",
              "scientific_case_executor.py",
              "scientific_aggregate.py",
              "scientific_audit.py",
              "cross_geometry_execution_analysis_driver.py",
          )
          missing = [token for token in required if token not in workflow]
          if missing:
              raise SystemExit(f"execution bridge tokens missing: {missing}")
          forbidden = ("schedule:", "repository_dispatch:", "\n  push:", "\n  pull_request:")
          present = [token for token in forbidden if token in header]
          if present:
              raise SystemExit(f"execution workflow has forbidden automatic trigger: {present}")
          PY
      - name: Prove proposal itself remains non-executable
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          proposal = json.loads(Path("experiments/mystic-batch-v1/manifest.cross-geometry-pilot.proposal.json").read_text())
          if proposal["proposalOnly"] is not True or proposal["scientificExecution"] is not False:
              raise SystemExit("source proposal execution boundary changed")
          PY
