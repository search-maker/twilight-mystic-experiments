name: MYSTIC cross-geometry final-convergence authorization proposal

on:
  pull_request:
    paths:
      - ".github/workflows/mystic-batch-v1-cross-geometry-final-authorization-proposal.yml"
      - ".github/workflows/mystic-batch-v1-cross-geometry-final-execution.yml"
      - "experiments/mystic-batch-v1/authorization.cross-geometry-final*.json"
      - "experiments/mystic-batch-v1/manifest.cross-geometry-final-convergence.proposal.json"
      - "experiments/mystic-batch-v1/cross_geometry_final_*.py"
      - "experiments/mystic-batch-v1/cross_geometry_convergence_v2.py"
      - "experiments/mystic-batch-v1/results/*final-convergence*"
      - "experiments/mystic-batch-v1/results/convergence-v2.cross-geometry-stage-two-3.json"
      - "experiments/mystic-batch-v1/results/screening-analysis.cross-geometry-stage-two-3.json"
      - "experiments/mystic-batch-v1/scientific_case_executor.py"
      - "experiments/mystic-batch-v1/scientific_aggregate.py"
      - "experiments/mystic-batch-v1/scientific_audit.py"
      - "experiments/mystic-batch-v1/runtime-lock.micromamba.json"
      - "tests/test_mystic_batch_v1_cross_geometry_final_convergence.py"
  push:
    branches:
      - "agent/**"
    paths:
      - ".github/workflows/mystic-batch-v1-cross-geometry-final-authorization-proposal.yml"
      - ".github/workflows/mystic-batch-v1-cross-geometry-final-execution.yml"
      - "experiments/mystic-batch-v1/authorization.cross-geometry-final*.json"
      - "experiments/mystic-batch-v1/manifest.cross-geometry-final-convergence.proposal.json"
      - "experiments/mystic-batch-v1/cross_geometry_final_*.py"
      - "experiments/mystic-batch-v1/cross_geometry_convergence_v2.py"
      - "experiments/mystic-batch-v1/results/*final-convergence*"
      - "experiments/mystic-batch-v1/results/convergence-v2.cross-geometry-stage-two-3.json"
      - "experiments/mystic-batch-v1/results/screening-analysis.cross-geometry-stage-two-3.json"
      - "experiments/mystic-batch-v1/scientific_case_executor.py"
      - "experiments/mystic-batch-v1/scientific_aggregate.py"
      - "experiments/mystic-batch-v1/scientific_audit.py"
      - "experiments/mystic-batch-v1/runtime-lock.micromamba.json"
      - "tests/test_mystic_batch_v1_cross_geometry_final_convergence.py"

permissions:
  contents: read

jobs:
  proposal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - name: Run final-convergence contract tests
        run: python -m unittest -v tests/test_mystic_batch_v1_cross_geometry_final_convergence.py
      - name: Compile authorization generator
        run: python -m py_compile experiments/mystic-batch-v1/cross_geometry_final_authorization_proposal.py
      - name: Generate exact proposal without execution
        run: >-
          python experiments/mystic-batch-v1/cross_geometry_final_authorization_proposal.py
          --repository-root .
          --output authorization-proposal/cross-geometry-final-authorization-proposal.json
      - name: Prove this workflow exposes no execution trigger
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path(".github/workflows/mystic-batch-v1-cross-geometry-final-authorization-proposal.yml").read_text().lower()
          header = text.split("jobs:", 1)[0]
          forbidden = ("workflow_dispatch:", "schedule:", "repository_dispatch:")
          present = [token for token in forbidden if token in header]
          if present:
              raise SystemExit(f"proposal workflow has execution trigger: {present}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cross-geometry-final-authorization-proposal
          path: authorization-proposal
          if-no-files-found: error
          retention-days: 90
