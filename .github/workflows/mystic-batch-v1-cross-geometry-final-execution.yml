name: MYSTIC cross-geometry final convergence v1 scientific execution
run-name: Cross geometry final convergence v1 | key=${{ inputs.execution_key }} | auth=${{ inputs.authorization_ref }} | ordinal=${{ inputs.authorization_ordinal }}

on:
  workflow_dispatch:
    inputs:
      authorization_ref:
        description: Exact one-purpose final-convergence authorization commit SHA
        required: true
        type: string
      execution_key:
        description: Exact one-shot final-convergence execution key
        required: true
        type: string
      authorization_ordinal:
        description: Exact final-convergence authorization ordinal
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: cross-geometry-final-convergence-v1-${{ inputs.execution_key }}
  cancel-in-progress: false

env:
  AUTHORIZATION: experiments/mystic-batch-v1/authorization.cross-geometry-final.json
  AUTHORIZATION_TEMPLATE: experiments/mystic-batch-v1/authorization.cross-geometry-final-execution-template.json
  PROPOSAL: experiments/mystic-batch-v1/manifest.cross-geometry-final-convergence.proposal.json
  SOURCE_SCREENING: experiments/mystic-batch-v1/results/screening-analysis.cross-geometry-stage-two-3.json
  SOURCE_CONVERGENCE: experiments/mystic-batch-v1/results/convergence-v2.cross-geometry-stage-two-3.json
  SOURCE_PROVENANCE: experiments/mystic-batch-v1/results/final-convergence-source-provenance.json
  BASE_ADAPTER: experiments/mystic-batch-v1/cross_geometry_adapter.py
  EXECUTION_ADAPTER: experiments/mystic-batch-v1/cross_geometry_final_execution_adapter.py
  DUPLICATE_RUN_AUDIT: experiments/mystic-batch-v1/duplicate_run_audit.py
  RUNTIME_PROBE: experiments/mystic-batch-v1/runtime_probe.py
  EXECUTION_WORKFLOW: .github/workflows/mystic-batch-v1-cross-geometry-final-execution.yml
  RUNTIME_LOCK: experiments/mystic-batch-v1/runtime-lock.micromamba.json
  PLAN: experiments/mystic-batch-v1/cross_geometry_final_execution_plan.py
  ANALYSIS_DRIVER: experiments/mystic-batch-v1/cross_geometry_final_analysis_driver.py
  CONVERGENCE_MODULE: experiments/mystic-batch-v1/cross_geometry_convergence_v2.py
  EXECUTOR: experiments/mystic-batch-v1/scientific_case_executor.py
  AGGREGATE: experiments/mystic-batch-v1/scientific_aggregate.py
  AUDIT: experiments/mystic-batch-v1/scientific_audit.py
  SOURCE_RUN_ID: "30863907633"
  SOURCE_ARTIFACT: cross-geometry-stage-two-v1-screening

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      max_parallel: ${{ steps.plan.outputs.max_parallel }}
      timeout_seconds: ${{ steps.plan.outputs.timeout_seconds }}
    steps:
      - name: Check out exact final-convergence authorization commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.authorization_ref }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - name: Verify exact one-purpose final-convergence authorization
        run: >-
          python experiments/mystic-batch-v1/cross_geometry_final_execution_guard.py
          --repository-root .
          --authorization "$AUTHORIZATION"
          --authorization-template "$AUTHORIZATION_TEMPLATE"
          --proposal "$PROPOSAL"
          --source-screening "$SOURCE_SCREENING"
          --source-convergence "$SOURCE_CONVERGENCE"
          --source-provenance "$SOURCE_PROVENANCE"
          --base-adapter "$BASE_ADAPTER"
          --execution-adapter "$EXECUTION_ADAPTER"
          --duplicate-run-audit "$DUPLICATE_RUN_AUDIT"
          --runtime-probe "$RUNTIME_PROBE"
          --execution-workflow "$EXECUTION_WORKFLOW"
          --runtime-lock "$RUNTIME_LOCK"
          --plan "$PLAN"
          --analysis-driver "$ANALYSIS_DRIVER"
          --convergence-module "$CONVERGENCE_MODULE"
          --executor "$EXECUTOR"
          --aggregate "$AGGREGATE"
          --audit "$AUDIT"
          --authorization-ref "${{ inputs.authorization_ref }}"
          --execution-key "${{ inputs.execution_key }}"
          --authorization-ordinal "${{ inputs.authorization_ordinal }}"
          --output preflight/authorization-guard.json
      - name: Refuse duplicate final-convergence one-shot marker before syntax or solver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python "$DUPLICATE_RUN_AUDIT"
          --repository "${{ github.repository }}"
          --workflow mystic-batch-v1-cross-geometry-final-execution.yml
          --current-run-id "${{ github.run_id }}"
          --execution-key "${{ inputs.execution_key }}"
          --authorization-ref "${{ inputs.authorization_ref }}"
          --authorization-ordinal "${{ inputs.authorization_ordinal }}"
          --token "$GH_TOKEN"
          --output preflight/duplicate-run-audit.json
      - name: Freeze exact 26-case final-convergence plan
        id: plan
        run: >-
          python "$PLAN"
          --proposal "$PROPOSAL"
          --guard-report preflight/authorization-guard.json
          --output preflight/plan.json
          --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-geometry-final-convergence-v1-preflight
          path: preflight
          if-no-files-found: warn
          retention-days: 90

  cases:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.preflight.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    steps:
      - name: Check out exact final-convergence authorization commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.authorization_ref }}
          fetch-depth: 2
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: cross-geometry-final-convergence-v1
          create-args: >-
            -c conda-forge
            python=3.12.4
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true
      - uses: actions/download-artifact@v4
        with:
          name: cross-geometry-final-convergence-v1-preflight
          path: preflight
      - name: Recompute exact runtime identity after cache restore
        shell: bash -el {0}
        run: |
          set -euo pipefail
          UVSPEC="$(command -v uvspec)"
          DATA_DIR="$CONDA_PREFIX/share/libRadtran/data"
          ATMOSPHERE="$DATA_DIR/atmmod/afglus.dat"
          test -x "$UVSPEC"
          test -d "$DATA_DIR"
          test -s "$ATMOSPHERE"
          python "$RUNTIME_PROBE" \
            --uvspec "$UVSPEC" \
            --data-dir "$DATA_DIR" \
            --atmosphere "$ATMOSPHERE" \
            --runtime-lock "$RUNTIME_LOCK" \
            --output "runtime-reports/${{ matrix.case_id }}/runtime-report.json"
      - name: Execute exactly one isolated final-convergence case
        shell: bash -el {0}
        run: |
          set -euo pipefail
          UVSPEC="$(command -v uvspec)"
          DATA_DIR="$CONDA_PREFIX/share/libRadtran/data"
          python "$EXECUTOR" \
            --manifest "$PROPOSAL" \
            --runtime-report "runtime-reports/${{ matrix.case_id }}/runtime-report.json" \
            --adapter "$EXECUTION_ADAPTER" \
            --case-id "${{ matrix.case_id }}" \
            --data-dir "$DATA_DIR" \
            --repository-root "$GITHUB_WORKSPACE" \
            --uvspec "$UVSPEC" \
            --output-root case-output \
            --timeout-seconds "${{ needs.preflight.outputs.timeout_seconds }}" \
            --allow-execution
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-geometry-final-convergence-v1-case-${{ matrix.case_id }}
          path: |
            case-output
            runtime-reports
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    needs: [preflight, cases]
    if: always() && needs.preflight.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.authorization_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - uses: actions/download-artifact@v4
        with:
          name: cross-geometry-final-convergence-v1-preflight
          path: preflight
      - uses: actions/download-artifact@v4
        with:
          pattern: cross-geometry-final-convergence-v1-case-*
          path: case-artifacts
          merge-multiple: true
      - name: Aggregate exact final-convergence case set
        run: python "$AGGREGATE" --plan preflight/plan.json --cases-root case-artifacts --output-dir aggregate-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-geometry-final-convergence-v1-aggregate
          path: aggregate-output
          if-no-files-found: warn
          retention-days: 90

  audit:
    needs: [preflight, cases, aggregate]
    if: always() && needs.preflight.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.authorization_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - uses: actions/download-artifact@v4
        with:
          name: cross-geometry-final-convergence-v1-preflight
          path: preflight
      - uses: actions/download-artifact@v4
        with:
          pattern: cross-geometry-final-convergence-v1-case-*
          path: case-artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: cross-geometry-final-convergence-v1-aggregate
          path: aggregate-output
      - name: Independently audit exact final-convergence plan, hashes, counts, and statistics
        run: python "$AUDIT" --plan preflight/plan.json --cases-root case-artifacts --aggregate-dir aggregate-output --output audit-output/audit-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-geometry-final-convergence-v1-audit
          path: audit-output
          if-no-files-found: warn
          retention-days: 90

  analysis:
    needs: [preflight, cases, aggregate, audit]
    if: needs.aggregate.result == 'success' && needs.audit.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.authorization_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - name: Download exact Stage-2 screening artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source-stage-two
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: cross-geometry-final-convergence-v1-case-*
          path: case-artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: cross-geometry-final-convergence-v1-aggregate
          path: aggregate-output
      - uses: actions/download-artifact@v4
        with:
          name: cross-geometry-final-convergence-v1-audit
          path: audit-output
      - name: Analyze corrected convergence and generate held-out proposal
        run: >-
          python "$ANALYSIS_DRIVER"
          --proposal "$PROPOSAL"
          --frozen-source-screening source-stage-two/stage-two-screening-analysis.json
          --source-convergence "$SOURCE_CONVERGENCE"
          --source-screening-artifact-root source-stage-two
          --cases-root case-artifacts
          --summary aggregate-output/batch-summary.json
          --audit audit-output/audit-report.json
          --convergence-module "$CONVERGENCE_MODULE"
          --output-dir analysis-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-geometry-final-convergence-v1-analysis
          path: analysis-output
          if-no-files-found: warn
          retention-days: 90
