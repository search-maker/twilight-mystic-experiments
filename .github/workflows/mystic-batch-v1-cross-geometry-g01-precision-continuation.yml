name: MYSTIC g01 fixed precision diagnosis execution v1
run-name: G01 held-out precision continuation | key=${{ inputs.execution_key }} | auth=${{ inputs.authorization_ref }} | ordinal=${{ inputs.authorization_ordinal }}

on:
  workflow_dispatch:
    inputs:
      source_diagnosis_run_id:
        description: Exact successful g01 diagnosis proposal run ID
        required: true
        type: string
      authorization_ref:
        description: Exact one-purpose ordinal-7 authorization commit
        required: true
        type: string
      execution_key:
        description: Exact one-shot execution key
        required: true
        type: string
      authorization_ordinal:
        description: Exact authorization ordinal
        required: true
        type: string

permissions: {contents: read, actions: read}
concurrency:
  group: g01-held-out-precision-${{ inputs.execution_key }}
  cancel-in-progress: false

env:
  PROPOSAL: experiments/mystic-batch-v1/g01-fixed-diagnostic-execution.proposal.json
  AUTHORIZATION: experiments/mystic-batch-v1/authorization.cross-geometry-g01-precision.json
  AUTHORIZATION_TEMPLATE: experiments/mystic-batch-v1/authorization.cross-geometry-g01-precision-template.json
  SOURCE_AUDIT: experiments/mystic-batch-v1/cross_geometry_g01_precision_source_audit.py
  GUARD: experiments/mystic-batch-v1/cross_geometry_g01_precision_execution_guard.py
  PLAN: experiments/mystic-batch-v1/cross_geometry_g01_precision_execution_plan.py
  EXECUTION_ADAPTER: experiments/mystic-batch-v1/cross_geometry_g01_precision_execution_adapter.py
  ANALYSIS_DRIVER: experiments/mystic-batch-v1/cross_geometry_g01_precision_analysis_driver.py
  DUPLICATE_RUN_AUDIT: experiments/mystic-batch-v1/duplicate_run_audit.py
  RUNTIME_PROBE: experiments/mystic-batch-v1/runtime_probe.py
  RUNTIME_LOCK: experiments/mystic-batch-v1/runtime-lock.micromamba.json
  EXECUTOR: experiments/mystic-batch-v1/scientific_case_executor.py
  AGGREGATE: experiments/mystic-batch-v1/scientific_aggregate.py
  AUDIT: experiments/mystic-batch-v1/scientific_audit.py
  CONVERGENCE_MODULE: experiments/mystic-batch-v1/cross_geometry_convergence_v2.py
  SOURCE_PILOT_MANIFEST: experiments/mystic-batch-v1/manifest.cross-geometry-pilot.proposal.json

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      max_parallel: ${{ steps.plan.outputs.max_parallel }}
      timeout_seconds: ${{ steps.plan.outputs.timeout_seconds }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.authorization_ref }}", fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12.4"}
      - name: Download exact reviewed g01 diagnosis proposal
        uses: actions/download-artifact@v4
        with:
          name: g01-fixed-precision-diagnosis-proposal-v1
          path: diagnosis-source
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_diagnosis_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download exact ordinal-6 analysis
        uses: actions/download-artifact@v4
        with:
          name: cross-geometry-timeout-continuation-v1-analysis
          path: source-analysis
          repository: ${{ github.repository }}
          run-id: 30875148389
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download exact ordinal-6 preflight
        uses: actions/download-artifact@v4
        with:
          name: cross-geometry-timeout-continuation-v1-preflight
          path: source-preflight
          repository: ${{ github.repository }}
          run-id: 30875148389
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch immutable source metadata
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          mkdir -p diagnosis-meta source-meta
          gh api "repos/${{ github.repository }}/actions/runs/${{ inputs.source_diagnosis_run_id }}" > diagnosis-meta/run.json
          gh api "repos/${{ github.repository }}/actions/runs/${{ inputs.source_diagnosis_run_id }}/artifacts?per_page=100" > diagnosis-meta/artifacts.json
          gh api "repos/${{ github.repository }}/actions/runs/30875148389" > source-meta/source-run.json
          gh api "repos/${{ github.repository }}/actions/runs/30875148389/artifacts?per_page=100" > source-meta/source-artifacts.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('source-meta/source-run.json');v=json.loads(p.read_text())
          v['display_title']=v.get('name','');v['name']='MYSTIC held-out timeout continuation v1 scientific execution'
          p.write_text(json.dumps(v,indent=2,sort_keys=True)+'\n')
          PY
      - name: Audit exact narrow g01 precision gap
        run: >-
          python "$SOURCE_AUDIT"
          --execution-proposal "$PROPOSAL"
          --diagnosis-dir diagnosis-source
          --diagnosis-run diagnosis-meta/run.json
          --diagnosis-artifacts diagnosis-meta/artifacts.json
          --source-analysis-dir source-analysis
          --source-preflight-dir source-preflight
          --source-run source-meta/source-run.json
          --source-artifacts source-meta/source-artifacts.json
          --output preflight/source-audit.json
      - name: Verify one-purpose ordinal-7 authorization
        run: >-
          python "$GUARD"
          --repository-root .
          --authorization "$AUTHORIZATION"
          --authorization-template "$AUTHORIZATION_TEMPLATE"
          --proposal "$PROPOSAL"
          --source-audit preflight/source-audit.json
          --authorization-ref "${{ inputs.authorization_ref }}"
          --execution-key "${{ inputs.execution_key }}"
          --authorization-ordinal "${{ inputs.authorization_ordinal }}"
          --output preflight/authorization-guard.json
      - name: Refuse duplicate execution marker
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: >-
          python "$DUPLICATE_RUN_AUDIT"
          --repository "${{ github.repository }}"
          --workflow mystic-batch-v1-cross-geometry-g01-precision-continuation.yml
          --current-run-id "${{ github.run_id }}"
          --execution-key "${{ inputs.execution_key }}"
          --authorization-ref "${{ inputs.authorization_ref }}"
          --authorization-ordinal "${{ inputs.authorization_ordinal }}"
          --token "$GH_TOKEN"
          --output preflight/duplicate-run-audit.json
      - name: Freeze exact four-case plan
        id: plan
        run: |
          cp "$PROPOSAL" preflight/manifest.json
          python "$PLAN" --manifest preflight/manifest.json --guard-report preflight/authorization-guard.json --output preflight/plan.json --github-output "$GITHUB_OUTPUT"
      - name: Preserve exact source packages
        run: |
          cp -R diagnosis-source preflight/diagnosis-source
          cp -R source-analysis preflight/source-analysis
          cp -R source-preflight preflight/source-preflight
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: cross-geometry-g01-precision-continuation-v1-preflight, path: preflight, if-no-files-found: warn, retention-days: 90}

  cases:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.preflight.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.authorization_ref }}", fetch-depth: 2}
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: cross-geometry-g01-precision-v1
          create-args: -c conda-forge python=3.12.4 rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true
      - uses: actions/download-artifact@v4
        with: {name: cross-geometry-g01-precision-continuation-v1-preflight, path: preflight}
      - name: Recompute exact runtime identity
        shell: bash -el {0}
        run: |
          UVSPEC="$(command -v uvspec)"; DATA_DIR="$CONDA_PREFIX/share/libRadtran/data"; ATMOSPHERE="$DATA_DIR/atmmod/afglus.dat"
          python "$RUNTIME_PROBE" --uvspec "$UVSPEC" --data-dir "$DATA_DIR" --atmosphere "$ATMOSPHERE" --runtime-lock "$RUNTIME_LOCK" --output "runtime-reports/${{ matrix.case_id }}/runtime-report.json"
      - name: Execute one fresh g01 50M precision block
        shell: bash -el {0}
        run: |
          UVSPEC="$(command -v uvspec)"; DATA_DIR="$CONDA_PREFIX/share/libRadtran/data"
          python "$EXECUTOR" --manifest preflight/manifest.json --runtime-report "runtime-reports/${{ matrix.case_id }}/runtime-report.json" --adapter "$EXECUTION_ADAPTER" --case-id "${{ matrix.case_id }}" --data-dir "$DATA_DIR" --repository-root "$GITHUB_WORKSPACE" --uvspec "$UVSPEC" --output-root case-output --timeout-seconds "${{ needs.preflight.outputs.timeout_seconds }}" --allow-execution
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-geometry-g01-precision-continuation-v1-case-${{ matrix.case_id }}
          path: |
            case-output
            runtime-reports
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    needs: [preflight, cases]
    if: always() && needs.preflight.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.authorization_ref }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12.4"}
      - uses: actions/download-artifact@v4
        with: {name: cross-geometry-g01-precision-continuation-v1-preflight, path: preflight}
      - uses: actions/download-artifact@v4
        with: {pattern: cross-geometry-g01-precision-continuation-v1-case-*, path: case-artifacts, merge-multiple: true}
      - run: python "$AGGREGATE" --plan preflight/plan.json --cases-root case-artifacts --output-dir aggregate-output
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: cross-geometry-g01-precision-continuation-v1-aggregate, path: aggregate-output, if-no-files-found: warn, retention-days: 90}

  audit:
    needs: [preflight, cases, aggregate]
    if: always() && needs.preflight.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.authorization_ref }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12.4"}
      - uses: actions/download-artifact@v4
        with: {name: cross-geometry-g01-precision-continuation-v1-preflight, path: preflight}
      - uses: actions/download-artifact@v4
        with: {pattern: cross-geometry-g01-precision-continuation-v1-case-*, path: case-artifacts, merge-multiple: true}
      - uses: actions/download-artifact@v4
        with: {name: cross-geometry-g01-precision-continuation-v1-aggregate, path: aggregate-output}
      - run: python "$AUDIT" --plan preflight/plan.json --cases-root case-artifacts --aggregate-dir aggregate-output --output audit-output/audit-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: cross-geometry-g01-precision-continuation-v1-audit, path: audit-output, if-no-files-found: warn, retention-days: 90}

  analysis:
    needs: [preflight, cases, aggregate, audit]
    if: needs.aggregate.result == 'success' && needs.audit.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.authorization_ref }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12.4"}
      - uses: actions/download-artifact@v4
        with: {name: cross-geometry-g01-precision-continuation-v1-preflight, path: preflight}
      - uses: actions/download-artifact@v4
        with: {pattern: cross-geometry-g01-precision-continuation-v1-case-*, path: case-artifacts, merge-multiple: true}
      - uses: actions/download-artifact@v4
        with: {name: cross-geometry-g01-precision-continuation-v1-aggregate, path: aggregate-output}
      - uses: actions/download-artifact@v4
        with: {name: cross-geometry-g01-precision-continuation-v1-audit, path: audit-output}
      - run: >-
          python "$ANALYSIS_DRIVER"
          --proposal preflight/manifest.json
          --source-analysis-dir preflight/source-analysis
          --source-preflight-dir preflight/source-preflight
          --new-cases-root case-artifacts
          --summary aggregate-output/batch-summary.json
          --audit audit-output/audit-report.json
          --convergence-module "$CONVERGENCE_MODULE"
          --source-pilot-manifest "$SOURCE_PILOT_MANIFEST"
          --output-dir analysis-output
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: g01-fixed-precision-diagnosis-execution-v1-analysis, path: analysis-output, if-no-files-found: warn, retention-days: 90}
