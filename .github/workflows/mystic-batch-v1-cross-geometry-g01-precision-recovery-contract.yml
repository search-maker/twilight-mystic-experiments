name: G01 precision artifact recovery contract

on:
  pull_request:
    paths:
      - ".github/workflows/mystic-batch-v1-cross-geometry-g01-precision-recovery*.yml"
      - "experiments/mystic-batch-v1/cross_geometry_g01_precision_recovery_plan.py"
      - "tests/test_mystic_g01_precision_recovery.py"
  push:
    branches: ["agent/**"]
    paths:
      - ".github/workflows/mystic-batch-v1-cross-geometry-g01-precision-recovery*.yml"
      - "experiments/mystic-batch-v1/cross_geometry_g01_precision_recovery_plan.py"
      - "tests/test_mystic_g01_precision_recovery.py"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - name: Test exact failed-run boundary and canonical recovery plan
        run: python -m unittest -v tests/test_mystic_g01_precision_recovery.py
      - name: Compile recovery planner
        run: python -m py_compile experiments/mystic-batch-v1/cross_geometry_g01_precision_recovery_plan.py
      - name: Prove recovery is exact and postprocess-only
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow=Path('.github/workflows/mystic-batch-v1-cross-geometry-g01-precision-recovery.yml').read_text().lower()
          script=Path('experiments/mystic-batch-v1/cross_geometry_g01_precision_recovery_plan.py').read_text()
          required=('30878704003','8880452058','8880552334','8880568680','8880568315','8880568006','artifact-only recovery','g01_persistent_high_variance')
          missing=[token for token in required if token.lower() not in (workflow+script).lower()]
          if missing:
              raise SystemExit(f'recovery exact-boundary tokens missing: {missing}')
          executable=workflow.split('- name: prove recovery cannot execute science',1)[0]
          forbidden=('setup-micromamba','scientific_case_executor.py','--allow-execution','uvspec -c','rte_solver mystic','rerun','retry')
          found=[token for token in forbidden if token in executable]
          if found:
              raise SystemExit(f'recovery has forbidden execution surface: {found}')
          PY
