name: MYSTIC cross-geometry stage-two proposal contract

on:
  pull_request:
    paths:
      - ".github/workflows/mystic-batch-v1-cross-geometry-stage-two-contract.yml"
      - "experiments/mystic-batch-v1/cross_geometry_stage_two.py"
      - "experiments/mystic-batch-v1/manifest.cross-geometry-pilot.proposal.json"
      - "experiments/mystic-batch-v1/manifest.cross-geometry-stage-two.proposal.json"
      - "experiments/mystic-batch-v1/results/screening-analysis.cross-geometry-pilot-screening-2.json"
      - "experiments/mystic-batch-v1/results/stage-two-source-provenance.json"
      - "experiments/mystic-batch-v1/STAGE_TWO_PROPOSAL.md"
      - "tests/test_mystic_batch_v1_cross_geometry_stage_two_real.py"
  push:
    branches:
      - "agent/**"
    paths:
      - ".github/workflows/mystic-batch-v1-cross-geometry-stage-two-contract.yml"
      - "experiments/mystic-batch-v1/cross_geometry_stage_two.py"
      - "experiments/mystic-batch-v1/manifest.cross-geometry-pilot.proposal.json"
      - "experiments/mystic-batch-v1/manifest.cross-geometry-stage-two.proposal.json"
      - "experiments/mystic-batch-v1/results/screening-analysis.cross-geometry-pilot-screening-2.json"
      - "experiments/mystic-batch-v1/results/stage-two-source-provenance.json"
      - "experiments/mystic-batch-v1/STAGE_TWO_PROPOSAL.md"
      - "tests/test_mystic_batch_v1_cross_geometry_stage_two_real.py"

permissions:
  contents: read

jobs:
  proposal-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - name: Verify exact real stage-two proposal and provenance
        run: python -m unittest -v tests/test_mystic_batch_v1_cross_geometry_stage_two_real.py
      - name: Compile stage-two generator and test
        run: >-
          python -m py_compile
          experiments/mystic-batch-v1/cross_geometry_stage_two.py
          tests/test_mystic_batch_v1_cross_geometry_stage_two_real.py
      - name: Prove proposal package cannot execute MYSTIC
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path(".github/workflows/mystic-batch-v1-cross-geometry-stage-two-contract.yml").read_text().lower()
          header = workflow.split("jobs:", 1)[0]
          forbidden_triggers = ("workflow_dispatch:", "schedule:", "repository_dispatch:")
          present = [token for token in forbidden_triggers if token in header]
          if present:
              raise SystemExit(f"stage-two contract has forbidden trigger: {present}")
          script = Path("experiments/mystic-batch-v1/cross_geometry_stage_two.py").read_text().lower()
          forbidden_primitives = (
              "uvspec -c",
              "subprocess.run(",
              "subprocess.popen(",
              "os.system(",
              "mc_photons",
              "rte_solver",
          )
          found = [token for token in forbidden_primitives if token in script]
          if found:
              raise SystemExit(f"stage-two generator contains execution primitive: {found}")
          PY
      - name: Prove no authorization is embedded in the proposal
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          proposal = json.loads(Path("experiments/mystic-batch-v1/manifest.cross-geometry-stage-two.proposal.json").read_text())
          provenance = json.loads(Path("experiments/mystic-batch-v1/results/stage-two-source-provenance.json").read_text())
          if proposal.get("proposalOnly") is not True or proposal.get("scientificExecution") is not False:
              raise SystemExit("stage-two proposal boundary changed")
          if provenance.get("authorizationCreated") is not False or provenance.get("scientificExecution") is not False:
              raise SystemExit("stage-two source provenance claims authorization or execution")
          PY
