name: MYSTIC cross-geometry stage-two execution bridge contract

on:
  pull_request:
    paths:
      - ".github/workflows/mystic-batch-v1-cross-geometry-stage-two-execution.yml"
      - ".github/workflows/mystic-batch-v1-cross-geometry-stage-two-execution-contract.yml"
      - "experiments/mystic-batch-v1/authorization.cross-geometry-stage-two.json"
      - "experiments/mystic-batch-v1/authorization.cross-geometry-stage-two-execution-template.json"
      - "experiments/mystic-batch-v1/cross_geometry_stage_two_execution_adapter.py"
      - "experiments/mystic-batch-v1/cross_geometry_stage_two_execution_guard.py"
      - "experiments/mystic-batch-v1/cross_geometry_stage_two_execution_plan.py"
      - "experiments/mystic-batch-v1/cross_geometry_stage_two_execution_analysis_driver.py"
      - "experiments/mystic-batch-v1/STAGE_TWO_EXECUTION.md"
      - "tests/test_mystic_batch_v1_cross_geometry_stage_two_execution.py"
  push:
    branches:
      - "agent/**"
    paths:
      - ".github/workflows/mystic-batch-v1-cross-geometry-stage-two-execution.yml"
      - ".github/workflows/mystic-batch-v1-cross-geometry-stage-two-execution-contract.yml"
      - "experiments/mystic-batch-v1/authorization.cross-geometry-stage-two.json"
      - "experiments/mystic-batch-v1/authorization.cross-geometry-stage-two-execution-template.json"
      - "experiments/mystic-batch-v1/cross_geometry_stage_two_execution_adapter.py"
      - "experiments/mystic-batch-v1/cross_geometry_stage_two_execution_guard.py"
      - "experiments/mystic-batch-v1/cross_geometry_stage_two_execution_plan.py"
      - "experiments/mystic-batch-v1/cross_geometry_stage_two_execution_analysis_driver.py"
      - "experiments/mystic-batch-v1/STAGE_TWO_EXECUTION.md"
      - "tests/test_mystic_batch_v1_cross_geometry_stage_two_execution.py"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - name: Test stage-two adapter, guard, plan, aggregate, audit, and combined analysis
        run: python -m unittest -v tests/test_mystic_batch_v1_cross_geometry_stage_two_execution.py
      - name: Compile stage-two execution bridge
        run: >-
          python -m py_compile
          experiments/mystic-batch-v1/cross_geometry_stage_two_execution_adapter.py
          experiments/mystic-batch-v1/cross_geometry_stage_two_execution_guard.py
          experiments/mystic-batch-v1/cross_geometry_stage_two_execution_plan.py
          experiments/mystic-batch-v1/cross_geometry_stage_two_execution_analysis_driver.py
          tests/test_mystic_batch_v1_cross_geometry_stage_two_execution.py
      - name: Prove active stage-two authorization remains exactly disabled
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          active = json.loads(Path("experiments/mystic-batch-v1/authorization.cross-geometry-stage-two.json").read_text())
          template = json.loads(Path("experiments/mystic-batch-v1/authorization.cross-geometry-stage-two-execution-template.json").read_text())
          if active != template:
              raise SystemExit("active stage-two authorization differs from disabled template")
          required = {
              "authorized": False,
              "scientificExecution": False,
              "scientificDiagnostic": False,
              "authorizationOrdinal": 0,
              "consumed": False,
              "exactAuthorizationParentCommit": None,
              "exactAuthorizationCommit": None,
          }
          stale = {key: (active.get(key), expected) for key, expected in required.items() if active.get(key) != expected}
          if stale:
              raise SystemExit(f"stage-two authorization is not disabled: {stale}")
          PY
      - name: Prove workflow is manual, bounded, isolated, and non-retrying
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path(".github/workflows/mystic-batch-v1-cross-geometry-stage-two-execution.yml").read_text()
          header = workflow.split("jobs:", 1)[0]
          required = (
              "workflow_dispatch:",
              "fail-fast: false",
              "cancel-in-progress: false",
              "cross_geometry_stage_two_execution_guard.py",
              "duplicate_run_audit.py",
              "runtime_probe.py",
              "scientific_case_executor.py",
              "scientific_aggregate.py",
              "scientific_audit.py",
              "cross_geometry_stage_two_execution_analysis_driver.py",
              "SOURCE_POSTPROCESS_RUN_ID: \"30858046820\"",
              "cross-geometry-pilot-v1-postprocess-30856116586",
          )
          missing = [token for token in required if token not in workflow]
          if missing:
              raise SystemExit(f"stage-two workflow tokens missing: {missing}")
          forbidden = ("schedule:", "repository_dispatch:", "\n  push:", "\n  pull_request:")
          present = [token for token in forbidden if token in header]
          if present:
              raise SystemExit(f"stage-two workflow has forbidden automatic trigger: {present}")
          if "continue-on-error: true" in workflow or "retry" in workflow.lower():
              raise SystemExit("stage-two workflow contains retry or ignored-error path")
          PY
      - name: Prove every execution-bound helper is authorization-hash-bound
        run: |
          python - <<'PY'
          from pathlib import Path
          guard = Path("experiments/mystic-batch-v1/cross_geometry_stage_two_execution_guard.py").read_text()
          template = Path("experiments/mystic-batch-v1/authorization.cross-geometry-stage-two-execution-template.json").read_text()
          fields = (
              "authorizationTemplateRawSha256",
              "baseAdapterRawSha256",
              "executionAdapterRawSha256",
              "analysisModuleRawSha256",
              "duplicateRunAuditRawSha256",
              "runtimeProbeRawSha256",
              "executionWorkflowRawSha256",
              "runtimeLockRawSha256",
              "planRawSha256",
              "analysisDriverRawSha256",
              "executorRawSha256",
              "aggregateRawSha256",
              "auditRawSha256",
          )
          missing = [field for field in fields if field not in guard or field not in template]
          if missing:
              raise SystemExit(f"stage-two authorization hash bindings missing: {missing}")
          PY
