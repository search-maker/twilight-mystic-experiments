name: MYSTIC held-out timeout continuation contract
on:
  pull_request:
    paths:
      - "experiments/mystic-batch-v1/*timeout*"
      - "experiments/mystic-batch-v1/TIMEOUT_CONTINUATION.md"
      - "tests/test_mystic_timeout_continuation.py"
      - ".github/workflows/mystic-batch-v1-cross-geometry-timeout-continuation*"
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12.4"}
      - run: python -m unittest tests/test_mystic_timeout_continuation.py -v
      - run: python -m py_compile experiments/mystic-batch-v1/*timeout*.py
      - name: Prove disabled and bounded
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('experiments/mystic-batch-v1')
          a=json.loads((root/'authorization.cross-geometry-timeout-continuation.json').read_text())
          t=json.loads((root/'authorization.cross-geometry-timeout-continuation-template.json').read_text())
          assert a==t and not a['authorized'] and a['authorizationOrdinal']==0
          assert 'sourcePilotManifestRawSha256' in a and a['sourcePilotManifestRawSha256'] is None
          m=json.loads((root/'cross-geometry-confirmation-timeout-continuation.proposal.json').read_text())
          assert len(m['cases'])==8 and sum(x['photonHistories'] for x in m['cases'])==1600000000
          assert all(x['photonHistories']==200000000 for x in m['cases'])
          assert not ({x['seed'] for x in m['cases']} & {82501,82502,82503,82504})
          PY
      - name: Prove execution is manual, source-preserving, and non-retrying
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/mystic-batch-v1-cross-geometry-confirmation-timeout-continuation.yml').read_text().lower()
          assert 'workflow_dispatch' in text and 'pull_request:' not in text.split('jobs:',1)[0]
          assert 'rerun' not in text and 'retry' not in text
          assert 'preflight/source-g01' in text and '200m g06' in text
          PY

      - name: Prove authorization proposal regenerates from exact main after merge
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/mystic-batch-v1-cross-geometry-timeout-continuation-authorization-proposal.yml').read_text()
          assert 'push:' in text and 'branches: ["main"]' in text
          assert "github.event.pull_request.head.sha" in text
          assert 'cross_geometry_confirmation_timeout_source_audit.py' in text
          PY
