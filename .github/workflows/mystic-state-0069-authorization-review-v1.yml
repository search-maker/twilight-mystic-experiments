name: MYSTIC-STATE-0069 ordinal23 authorization review v1

on:
  pull_request:
    paths:
      - 'experiments/mystic-state-0069-local-densification-v1/authorization.json'

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

jobs:
  authorization-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - name: Refuse non-draft, retry, moved-main or non-one-file authorization
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          AUTH_PATH: experiments/mystic-state-0069-local-densification-v1/authorization.json
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_HEAD_REF" = authorization/mystic-state-0069-ordinal23-v1
          test "$PR_DRAFT" = true
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          test "$(git cat-file -p HEAD | grep -c '^parent ')" = 1
          test "$(git rev-parse HEAD^)" = "$PR_BASE"
          LIVE_MAIN="$(gh api "repos/${{ github.repository }}/branches/main" --jq .commit.sha)"
          test "$LIVE_MAIN" = "$PR_BASE"
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = 1
          test "${CHANGED[0]}" = "$AUTH_PATH"
          test -f "$AUTH_PATH"
          if git cat-file -e "$LIVE_MAIN:$AUTH_PATH" 2>/dev/null; then echo 'authorization already exists on main'; exit 1; fi
      - name: Validate exact authorization content and reviewed transport
        env:
          AUTH_PATH: experiments/mystic-state-0069-local-densification-v1/authorization.json
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          python review/mystic-state-0069-local-training-densification-v1/validate_v1.py \
            --protocol review/mystic-state-0069-local-training-densification-v1/protocol-v1.json \
            --audit review/mystic-state-0069-local-training-densification-v1/audit-v1.json
          python review/mystic-state-0069-execution-transport-v1/validate_impl_v1.py
          python - <<'PY'
          import json,os
          a=json.load(open(os.environ['AUTH_PATH']))
          expected={
            'schemaVersion':1,
            'status':'AUTHORIZED_PENDING_SEPARATE_DISPATCH',
            'governance':'MYSTIC-STATE-0069',
            'enabled':True,
            'scientificOrdinal':23,
            'authorizationParentMainSha':os.environ['PR_BASE'],
            'authorizationBranch':'authorization/mystic-state-0069-ordinal23-v1',
            'dispatchBranch':'dispatch/mystic-state-0069-ordinal23-v1',
            'protocolGitBlobSha':'d47bceb9b415ca8ebf14f6014207fd1310b4809c',
            'protocolCanonicalSha256':'9dbc150881b11481d7d0e267cb14d9507051d15442c21853b3256875db5d3c64',
            'caseCount':28,
            'geometryCount':14,
            'configuredPhotonHistories':560000000,
            'seedRangeInclusive':[2100000101,2100000128],
            'automaticDispatch':False,
            'githubRerunAllowed':False,
            'retryAllowed':False,
            'resumeAllowed':False,
            'adaptiveContinuationAllowed':False,
            'ordinal22ValuesMayBeRead':False,
            'protectedValidationAuthorized':False,
            'modelFitAuthorized':False,
            'productionPromotionAuthorized':False,
          }
          assert a==expected,(a,expected)
          PY
          python experiments/mystic-state-0069-local-densification-v1/build_manifest_v1.py \
            --protocol review/mystic-state-0069-local-training-densification-v1/protocol-v1.json \
            --base-manifest experiments/tier2-stage1-execution-v1/stage1-execution-manifest-v1.json \
            --output frozen-manifest.json
      - name: Fail closed on seed or geometry identity use outside reviewed 0069 surfaces
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,subprocess
          allowed=(
            'review/mystic-state-0069-local-training-densification-v1/',
            'review/mystic-state-0069-execution-transport-v1/',
            'experiments/mystic-state-0069-local-densification-v1/',
            '.github/workflows/mystic-state-0069-'
          )
          for token in [str(x) for x in range(2100000101,2100000129)]+[f'train-{x:04d}' for x in range(101,115)]:
              p=subprocess.run(['git','grep','-n','-F',token,'HEAD^','--'],text=True,capture_output=True)
              if p.returncode not in (0,1): raise SystemExit(p.stderr)
              for line in p.stdout.splitlines():
                  path=line.split(':',2)[1] if line.startswith('HEAD^:') else line.split(':',1)[0]
                  if not path.startswith(allowed): raise SystemExit(f'unreviewed identity occurrence: {token} {line}')
          PY
      - name: Capture repository-global allocation surfaces
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${{ github.repository }}/branches?per_page=100" > branch-pages.json
          gh api --paginate --slurp "repos/${{ github.repository }}/actions/runs?per_page=100" > run-pages.json
          gh api --paginate --slurp "repos/${{ github.repository }}/actions/artifacts?per_page=100" > artifact-pages.json
          gh api --paginate --slurp "repos/${{ github.repository }}/issues/60/comments?per_page=100" > issue-pages.json
      - name: Prove ordinal23 has not already been dispatched or allocated
        env:
          AUTH_PATH: experiments/mystic-state-0069-local-densification-v1/authorization.json
        run: |
          python - <<'PY'
          import json,os
          def load(p): return json.load(open(p))
          def flat(pages,key=None):
              out=[]
              for page in pages: out.extend(page.get(key,[]) if key else page)
              return out
          branches=flat(load('branch-pages.json')); runs=flat(load('run-pages.json'),'workflow_runs'); artifacts=flat(load('artifact-pages.json'),'artifacts'); comments=flat(load('issue-pages.json'))
          auth=load(os.environ['AUTH_PATH']); ab=auth['authorizationBranch']; db=auth['dispatchBranch']
          assert len([b for b in branches if b.get('name')==ab])==1
          assert not [b for b in branches if b.get('name')==db]
          assert not [r for r in runs if r.get('head_branch')==db]
          assert not [a for a in artifacts if str(a.get('name','')).startswith('m0069-ordinal23-')]
          marker='ALLOCATED | MYSTIC-STATE-0069 | ordinal23'
          assert not [c for c in comments if marker in str(c.get('body',''))]
          out={'schemaVersion':1,'status':'PREAUTHORIZED_NO_PRIOR_DISPATCH','authorizationBranch':ab,'dispatchBranch':db,'scientificOrdinal':23,'currentAuthorizationHead':os.environ['GITHUB_SHA'],'priorDispatchRunCount':0,'priorExecutionArtifactCount':0,'issueAllocationMarkerPresent':False,'ordinal22ValuesRead':False,'protectedValidationAuthorized':False,'modelFitAuthorized':False}
          json.dump(out,open('preauthorization-guard.json','w'),indent=2,sort_keys=True); open('preauthorization-guard.json','a').write('\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m0069-ordinal23-authorization-review-${{ github.event.pull_request.head.sha }}
          path: |
            frozen-manifest.json
            preauthorization-guard.json
          if-no-files-found: error
          retention-days: 90
