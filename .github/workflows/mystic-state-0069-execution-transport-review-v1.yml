name: MYSTIC-STATE-0069 execution transport review v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mystic-state-0069-execution-transport-review-v1.yml'
      - '.github/workflows/mystic-state-0069-authorization-review-v1.yml'
      - '.github/workflows/mystic-state-0069-execution-v1.yml'
      - 'review/mystic-state-0069-execution-transport-v1/**'
      - 'experiments/mystic-state-0069-local-densification-v1/**'

permissions:
  contents: read

jobs:
  review-only-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Revalidate immutable preregistration and transport binding
        run: |
          python review/mystic-state-0069-local-training-densification-v1/validate_v1.py \
            --protocol review/mystic-state-0069-local-training-densification-v1/protocol-v1.json \
            --audit review/mystic-state-0069-local-training-densification-v1/audit-v1.json
          python review/mystic-state-0069-execution-transport-v1/validate_impl_v1.py
      - name: Compile transport and run synthetic tests
        run: |
          python -m py_compile \
            experiments/mystic-state-0069-local-densification-v1/build_manifest_v1.py \
            experiments/mystic-state-0069-local-densification-v1/adapter_v1.py \
            experiments/mystic-state-0069-local-densification-v1/executor_v1.py \
            review/mystic-state-0069-execution-transport-v1/test_v1.py
          python review/mystic-state-0069-execution-transport-v1/test_v1.py -v
      - name: Rebuild exact 14-geometry / 28-case manifest without solver execution
        run: |
          python experiments/mystic-state-0069-local-densification-v1/build_manifest_v1.py \
            --protocol review/mystic-state-0069-local-training-densification-v1/protocol-v1.json \
            --base-manifest experiments/tier2-stage1-execution-v1/stage1-execution-manifest-v1.json \
            --output /tmp/m0069-manifest.json
          python - <<'PY'
          import json
          m=json.load(open('/tmp/m0069-manifest.json'))
          assert (m['geometryCount'],m['caseCount'],m['configuredPhotonHistories'])==(14,28,560000000)
          assert [c['seed'] for c in m['cases']]==list(range(2100000101,2100000129))
          assert m['closedBoundaries']['protectedHoldoutOpeningAuthorized'] is False
          assert m['closedBoundaries']['modelFitAuthorized'] is False
          PY
      - name: Prove review PR has no authorization and execution workflow is dispatch-push only
        shell: bash
        run: |
          set -euo pipefail
          test ! -e experiments/mystic-state-0069-local-densification-v1/authorization.json
          ! grep -n 'pull_request' .github/workflows/mystic-state-0069-execution-v1.yml
          grep -F "dispatch/mystic-state-0069-ordinal23-v1" .github/workflows/mystic-state-0069-execution-v1.yml
