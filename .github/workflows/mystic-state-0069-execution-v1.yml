name: MYSTIC-STATE-0069 ordinal23 execution v1
run-name: MYSTIC-STATE-0069 ordinal23 execution v1

on:
  push:
    branches:
      - 'dispatch/mystic-state-0069-ordinal23-v1'

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: mystic-state-0069-ordinal23
  cancel-in-progress: false

env:
  AUTH_PATH: experiments/mystic-state-0069-local-densification-v1/authorization.json
  PROTOCOL: review/mystic-state-0069-local-training-densification-v1/protocol-v1.json
  BASE_MANIFEST: experiments/tier2-stage1-execution-v1/stage1-execution-manifest-v1.json

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - name: Refuse wrong branch, retry, commit shape, moved main or authorization content
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = dispatch/mystic-state-0069-ordinal23-v1
          test "$(git cat-file -p "$GITHUB_SHA" | grep -c '^parent ')" = 1
          PARENT="$(git rev-parse "$GITHUB_SHA^")"
          LIVE_MAIN="$(gh api "repos/${{ github.repository }}/branches/main" --jq .commit.sha)"
          test "$PARENT" = "$LIVE_MAIN"
          if git cat-file -e "$PARENT:$AUTH_PATH" 2>/dev/null; then echo 'authorization path already exists on main parent'; exit 1; fi
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")
          test "${#CHANGED[@]}" = 1
          test "${CHANGED[0]}" = "$AUTH_PATH"
          python - <<'PY'
          import json,os,subprocess
          a=json.load(open(os.environ['AUTH_PATH'])); parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          assert a=={
            'schemaVersion':1,'status':'AUTHORIZED_PENDING_SEPARATE_DISPATCH','governance':'MYSTIC-STATE-0069','enabled':True,'scientificOrdinal':23,
            'authorizationParentMainSha':parent,'authorizationBranch':'authorization/mystic-state-0069-ordinal23-v2','dispatchBranch':'dispatch/mystic-state-0069-ordinal23-v1',
            'protocolGitBlobSha':'d47bceb9b415ca8ebf14f6014207fd1310b4809c','protocolCanonicalSha256':'9dbc150881b11481d7d0e267cb14d9507051d15442c21853b3256875db5d3c64',
            'caseCount':28,'geometryCount':14,'configuredPhotonHistories':560000000,'seedRangeInclusive':[2100000101,2100000128],
            'automaticDispatch':False,'githubRerunAllowed':False,'retryAllowed':False,'resumeAllowed':False,'adaptiveContinuationAllowed':False,
            'ordinal22ValuesMayBeRead':False,'protectedValidationAuthorized':False,'modelFitAuthorized':False,'productionPromotionAuthorized':False,
          }
          PY
          python review/mystic-state-0069-local-training-densification-v1/validate_v1.py --protocol "$PROTOCOL" --audit review/mystic-state-0069-local-training-densification-v1/audit-v1.json
          python review/mystic-state-0069-execution-transport-v1/validate_impl_v1.py
      - id: authreview
        name: Resolve exactly one successful attempt-1 authorization review on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY%%/*}"
          gh api "repos/${{ github.repository }}/pulls?state=open&head=${OWNER}:authorization/mystic-state-0069-ordinal23-v2&per_page=100" > auth-prs.json
          gh api "repos/${{ github.repository }}/actions/workflows/mystic-state-0069-authorization-review-v1.yml/runs?event=pull_request&branch=authorization/mystic-state-0069-ordinal23-v2&per_page=100" > auth-runs.json
          python - <<'PY'
          import json,os
          prs=json.load(open('auth-prs.json')); runs=json.load(open('auth-runs.json'))['workflow_runs']; sha=os.environ['GITHUB_SHA']
          ps=[p for p in prs if p['head']['sha']==sha and p['head']['ref']=='authorization/mystic-state-0069-ordinal23-v2' and p['draft'] is True and p['merged_at'] is None]
          rs=[r for r in runs if r['head_sha']==sha and r['head_branch']=='authorization/mystic-state-0069-ordinal23-v2' and r['run_attempt']==1 and r['status']=='completed' and r['conclusion']=='success']
          if len(ps)!=1 or len(rs)!=1: raise SystemExit(f'exact auth evidence mismatch prs={len(ps)} runs={len(rs)}')
          json.dump(ps[0],open('selected-auth-pr.json','w'),indent=2,sort_keys=True); open('selected-auth-pr.json','a').write('\n')
          json.dump(rs[0],open('selected-auth-run.json','w'),indent=2,sort_keys=True); open('selected-auth-run.json','a').write('\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f"run_id={rs[0]['id']}\n")
          PY
      - uses: actions/download-artifact@v4
        with:
          name: m0069-ordinal23-authorization-review-${{ github.sha }}
          path: authorization-review-evidence
          repository: ${{ github.repository }}
          run-id: ${{ steps.authreview.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Prove exact allocation marker, no earlier dispatch run and no execution artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${{ github.repository }}/issues/60/comments?per_page=100" > issue-pages.json
          gh api "repos/${{ github.repository }}/actions/workflows/mystic-state-0069-execution-v1.yml/runs?branch=${GITHUB_REF_NAME}&per_page=100" > execution-runs.json
          gh api --paginate --slurp "repos/${{ github.repository }}/actions/artifacts?per_page=100" > artifact-pages.json
          python - <<'PY'
          import json,os
          comments=[]
          for p in json.load(open('issue-pages.json')): comments.extend(p)
          marker=f"ALLOCATED | MYSTIC-STATE-0069 | ordinal23 | authorizationHead={os.environ['GITHUB_SHA']} | seeds=2100000101-2100000128"
          hits=[c for c in comments if marker in str(c.get('body',''))]
          assert len(hits)==1,f'allocation marker count={len(hits)}'
          runs=json.load(open('execution-runs.json'))['workflow_runs']; exact=[r for r in runs if r['head_sha']==os.environ['GITHUB_SHA'] and r['head_branch']==os.environ['GITHUB_REF_NAME']]
          assert len(exact)==1 and exact[0]['id']==int(os.environ['GITHUB_RUN_ID']) and exact[0]['run_attempt']==1,f'execution run identity drift {[(r["id"],r["head_sha"]) for r in exact]}'
          arts=[]
          for p in json.load(open('artifact-pages.json')): arts.extend(p.get('artifacts',[]))
          prior=[a for a in arts if str(a.get('name','')).startswith('m0069-ordinal23-case-') or str(a.get('name','')).startswith('m0069-ordinal23-inventory-')]
          assert not prior,f'prior ordinal23 execution artifacts exist: {[a["name"] for a in prior]}'
          g=json.load(open('authorization-review-evidence/preauthorization-guard.json')); assert g['status']=='PREAUTHORIZED_NO_PRIOR_DISPATCH' and g['priorDispatchRunCount']==0 and g['priorExecutionArtifactCount']==0
          PY
      - name: Rebuild and match exact frozen execution manifest
        run: |
          python experiments/mystic-state-0069-local-densification-v1/build_manifest_v1.py --protocol "$PROTOCOL" --base-manifest "$BASE_MANIFEST" --output execution-manifest.json
          cmp execution-manifest.json authorization-review-evidence/frozen-manifest.json
      - id: matrix
        name: Emit exact 28-case matrix only after all guards pass
        run: |
          python - <<'PY'
          import json,os
          m=json.load(open('execution-manifest.json')); rows=[{'caseId':c['caseId'],'timeoutSeconds':900} for c in m['cases']]
          assert len(rows)==28 and all(c['photonHistories']==20_000_000 for c in m['cases'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('matrix='+json.dumps({'include':rows},separators=(',',':'))+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m0069-ordinal23-preflight-${{ github.sha }}
          path: |
            experiments/mystic-state-0069-local-densification-v1/authorization.json
            execution-manifest.json
            selected-auth-pr.json
            selected-auth-run.json
            authorization-review-evidence/preauthorization-guard.json
          if-no-files-found: error
          retention-days: 90

  cases:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 28
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: m0069-ordinal23
          create-args: -c conda-forge python=3.12.4 rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true
      - uses: actions/download-artifact@v4
        with:
          name: m0069-ordinal23-preflight-${{ github.sha }}
          path: preflight
      - name: Re-prove exact runtime identity without solver execution
        shell: micromamba-shell {0}
        run: |
          python experiments/mystic-batch-v1/runtime_probe.py \
            --uvspec "$(command -v uvspec)" \
            --data-dir "$CONDA_PREFIX/share/libRadtran/data" \
            --atmosphere "$CONDA_PREFIX/share/libRadtran/data/atmmod/afglus.dat" \
            --runtime-lock experiments/mystic-batch-v1/runtime-lock.micromamba.json \
            --output case-runtime.json
      - name: Execute exactly one syntax check and one MYSTIC invocation
        shell: micromamba-shell {0}
        run: |
          python experiments/mystic-state-0069-local-densification-v1/executor_v1.py \
            --manifest preflight/execution-manifest.json \
            --runtime-report case-runtime.json \
            --adapter experiments/mystic-state-0069-local-densification-v1/adapter_v1.py \
            --case-id '${{ matrix.caseId }}' \
            --data-dir "$CONDA_PREFIX/share/libRadtran/data" \
            --repository-root . \
            --uvspec "$(command -v uvspec)" \
            --output-root case-output \
            --timeout-seconds '${{ matrix.timeoutSeconds }}' \
            --expected-dispatch-branch 'dispatch/mystic-state-0069-ordinal23-v1' \
            --allow-execution
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m0069-ordinal23-case-${{ matrix.caseId }}
          path: case-output/${{ matrix.caseId }}
          if-no-files-found: error
          retention-days: 90

  inventory:
    needs: [preflight, cases]
    if: needs.preflight.result == 'success' && needs.cases.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: m0069-ordinal23-preflight-${{ github.sha }}
          path: preflight
      - uses: actions/download-artifact@v4
        with:
          pattern: m0069-ordinal23-case-*
          path: case-artifacts
          merge-multiple: false
      - name: Verify exact 28 immutable completed case artifacts without fitting
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('case-artifacts'); m=json.load(open('preflight/execution-manifest.json'))
          def canon(v): return hashlib.sha256(json.dumps(v,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
          rows=[]
          for c in m['cases']:
              hits=[]
              for p in root.rglob('case-result.json'):
                  x=json.load(open(p))
                  if x.get('caseId')==c['caseId']: hits.append((p,x))
              assert len(hits)==1,(c['caseId'],len(hits)); p,x=hits[0]; h=x['contentSha256']; y=dict(x); y.pop('contentSha256'); assert h==canon(y)
              assert x['status']=='COMPLETED' and x['role']=='surrogate-training' and x['workflowRunAttempt']==1
              assert x['syntaxCheckCount']==1 and x['solverExecutionCount']==1 and x['retryPerformed'] is False and x['resumePerformed'] is False and x['githubRerun'] is False
              assert (x['seed'],x['photonHistories'],x['block'])==(c['seed'],c['photonHistories'],c['block'])
              assert x['protectedHoldoutValueExposed'] is False and x['modelFittingSurfaceExposed'] is False
              rows.append({'caseId':c['caseId'],'geometryId':c['geometryId'],'block':c['block'],'seed':c['seed'],'caseResultSha256':h,'radianceSha256':x['radianceOutputSha256'],'stdRadianceSha256':x['stdRadianceOutputSha256']})
          assert len(rows)==28 and len({r['caseId'] for r in rows})==28
          out={'schemaVersion':1,'status':'ORDINAL23_TRAINING_DENSIFICATION_CASE_ARTIFACTS_COMPLETE_NO_FITTING','governance':'MYSTIC-STATE-0069','scientificOrdinal':23,'workflowRunId':int(os.environ['GITHUB_RUN_ID']),'workflowRunAttempt':1,'headSha':os.environ['GITHUB_SHA'],'manifestSha256':m['manifestSha256'],'caseCount':28,'geometryCount':14,'configuredPhotonHistories':560000000,'cases':rows,'ordinal22ValuesRead':False,'protectedValidationOpened':False,'modelFitPerformed':False,'productionPromotionAuthorized':False}
          out['inventorySha256']=canon(out); pathlib.Path('inventory-output').mkdir(); json.dump(out,open('inventory-output/execution-inventory-v1.json','w'),indent=2,sort_keys=True); open('inventory-output/execution-inventory-v1.json','a').write('\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m0069-ordinal23-inventory-${{ github.sha }}
          path: inventory-output/
          if-no-files-found: error
          retention-days: 90
