name: MYSTIC-STATE-0069 local training densification preregistration v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mystic-state-0069-local-training-densification-v1.yml'
      - 'review/mystic-state-0069-local-training-densification-v1/**'

permissions:
  contents: read

jobs:
  review-only-preregistration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen audit and 14-geometry / 28-case protocol
        run: |
          python review/mystic-state-0069-local-training-densification-v1/validate_v1.py \
            --protocol review/mystic-state-0069-local-training-densification-v1/protocol-v1.json \
            --audit review/mystic-state-0069-local-training-densification-v1/audit-v1.json
      - name: Prove proposed IDs and seeds are fresh against base main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          ! git grep -n -E '2100000(10[1-9]|11[0-9]|12[0-8])' origin/main --
          ! git grep -n -E 'train-01(0[1-9]|1[0-4])' origin/main --
      - name: Prove review PR cannot execute MYSTIC or open protected values
        shell: bash
        run: |
          set -euo pipefail
          test ! -e review/mystic-state-0069-local-training-densification-v1/authorization.json
          test ! -e review/mystic-state-0069-local-training-densification-v1/activation.json
          ! grep -R -n -E 'uvspec|mc_basename|9209494627|stage2-evaluation|tier2-stage2-ordinal22' review/mystic-state-0069-local-training-densification-v1
