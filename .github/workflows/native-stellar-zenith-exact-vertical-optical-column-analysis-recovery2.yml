name: Native stellar exact-vertical optical-column analysis recovery2
run-name: Native stellar exact-vertical optical-column analysis recovery2 ${{ github.sha }}

on:
  push:
    branches:
      - recovery/native-stellar-zenith-exact-vertical-optical-column-analysis-recovery2
    paths:
      - review/native-stellar-zenith-v3/exact-vertical-optical-column-analysis-recovery2-dispatch.json

permissions:
  contents: read
  actions: read

env:
  STAGE_DIR: review/native-stellar-zenith-v3
  DISPATCH_PATH: review/native-stellar-zenith-v3/exact-vertical-optical-column-analysis-recovery2-dispatch.json
  SOURCE_RUN_ID: '33041069040'
  SOURCE_DISPATCH_SHA: ac4a1230fd3ceb500019f5188173fb8f7165f5ec
  SOURCE_ARTIFACT_ID: '9633879569'
  SOURCE_ARTIFACT_NAME: native-stellar-zenith-exact-vertical-optical-column-recovery1-33041069040
  SOURCE_ARTIFACT_DIGEST: sha256:eba59cc5d22e1600b0c38809cac29d615dddd0af02b491febae65164c3a1004e

concurrency:
  group: native-stellar-zenith-exact-vertical-optical-column-analysis-recovery2
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact analysis dispatch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify one-file analysis-only dispatch and no solver runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = recovery/native-stellar-zenith-exact-vertical-optical-column-analysis-recovery2
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
          test "$(git diff --name-only HEAD^ HEAD)" = "$DISPATCH_PATH"
          if command -v uvspec >/dev/null 2>&1; then
            echo 'uvspec unexpectedly present in analysis-only workflow' >&2
            exit 1
          fi
          python - <<'PY'
          import json, os, subprocess
          d=json.load(open(os.environ['DISPATCH_PATH'],encoding='utf-8'))
          parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          expected={
            'schemaVersion':2,
            'stageId':'native-stellar-zenith-exact-vertical-optical-column-analysis-recovery2',
            'status':'AUTHORIZED_ANALYSIS_ONLY_RECOVERY_NO_SOLVER',
            'baseMainSha':parent,
            'sourceRunId':33041069040,
            'sourceDispatchSha':'ac4a1230fd3ceb500019f5188173fb8f7165f5ec',
            'sourceArtifactId':9633879569,
            'sourceArtifactName':'native-stellar-zenith-exact-vertical-optical-column-recovery1-33041069040',
            'sourceArtifactDigest':'sha256:eba59cc5d22e1600b0c38809cac29d615dddd0af02b491febae65164c3a1004e',
            'sourceSolverInvocationCount':4,
            'newSolverExecutionAuthorized':False,
            'denseStdoutRowCount':8001,
            'denseStdoutStepNm':0.05,
            'selectedIntegerNodeCount':401,
            'stdoutStderrFluxTolerance':1e-7,
            'maxAbsDeltaOpticalDepthLimit':1e-5,
            'maxAbsDeltaAvMagLimit':1e-4,
            'protectedHoldoutOpeningAuthorized':False,
            'modelFitAuthorized':False,
            'stellarLutAcceptanceGateEvaluationAuthorized':False,
            'productionAuthorized':False,
            'githubRerunPermitted':False,
          }
          for k,v in expected.items():
            if d.get(k)!=v: raise SystemExit(f'analysis dispatch mismatch {k}: {d.get(k)!r} != {v!r}')
          PY

      - name: Verify immutable source run and artifact metadata
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          def get(url):
            req=urllib.request.Request(url,headers={
              'Authorization':f'Bearer {token}',
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'exact-vertical-analysis-recovery2',
            })
            with urllib.request.urlopen(req) as r:
              return json.load(r)
          run=get(f'https://api.github.com/repos/{repo}/actions/runs/{os.environ["SOURCE_RUN_ID"]}')
          if run.get('id') != int(os.environ['SOURCE_RUN_ID']): raise SystemExit('source run id drift')
          if run.get('head_sha') != os.environ['SOURCE_DISPATCH_SHA']: raise SystemExit('source run head drift')
          if run.get('status') != 'completed' or run.get('conclusion') != 'failure':
            raise SystemExit('source recovery1 terminal status drift')
          arts=get(f'https://api.github.com/repos/{repo}/actions/runs/{os.environ["SOURCE_RUN_ID"]}/artifacts?per_page=100')
          matches=[a for a in arts.get('artifacts',[]) if a.get('id')==int(os.environ['SOURCE_ARTIFACT_ID'])]
          if len(matches)!=1: raise SystemExit('source artifact id missing or ambiguous')
          a=matches[0]
          if a.get('name') != os.environ['SOURCE_ARTIFACT_NAME']: raise SystemExit('source artifact name drift')
          if a.get('digest') != os.environ['SOURCE_ARTIFACT_DIGEST']: raise SystemExit('source artifact digest drift')
          if a.get('expired') is not False: raise SystemExit('source artifact expired')
          open('source-artifact-metadata.json','w').write(json.dumps({
            'runId':run['id'],'headSha':run['head_sha'],'runConclusion':run['conclusion'],
            'artifactId':a['id'],'artifactName':a['name'],'artifactDigest':a['digest'],
            'artifactSizeBytes':a.get('size_in_bytes'),'artifactExpired':a['expired'],
          },indent=2,sort_keys=True)+'\n')
          PY

      - name: Set up Python only
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'

      - name: Verify analysis code and frozen assets without libRadtran
        shell: bash
        run: |
          set -euo pipefail
          if command -v uvspec >/dev/null 2>&1; then
            echo 'uvspec unexpectedly present after Python setup' >&2
            exit 1
          fi
          python -m unittest tests.test_native_stellar_zenith_exact_vertical_optical_column_v1 -v
          python -m unittest tests.test_native_stellar_zenith_exact_vertical_optical_column_analysis_recovery2 -v
          python "$STAGE_DIR/analyze_exact_vertical_optical_column_recovery2.py"

      - name: Download immutable recovery1 solver artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 33041069040
          name: native-stellar-zenith-exact-vertical-optical-column-recovery1-33041069040
          path: source-artifact

      - name: Analyze existing four solver outputs only
        shell: bash
        run: |
          set -euo pipefail
          if command -v uvspec >/dev/null 2>&1; then
            echo 'uvspec unexpectedly present immediately before analysis' >&2
            exit 1
          fi
          test ! -e analysis-output
          python "$STAGE_DIR/analyze_exact_vertical_optical_column_recovery2.py" \
            --root . \
            --source-root source-artifact \
            --sed-bundle review/asiv-matched-stellar-transport-v1/frozen-assets/pickles-sed-1nm.json \
            --johnson-v review/asiv-matched-stellar-transport-v1/frozen-assets/johnson-v-1nm.json \
            --output-dir analysis-output
          cp source-artifact-metadata.json analysis-output/source-artifact-metadata.json

      - name: Preserve complete derived analysis before gate
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-stellar-zenith-exact-vertical-optical-column-analysis-recovery2-${{ github.run_id }}
          path: analysis-output/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0

      - name: Require original scientific gates and parser-evidence gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('analysis-output/exact-vertical-optical-column-analysis-recovery2-summary.json'))
          if d.get('schemaVersion') != 2: raise SystemExit('schema drift')
          if d.get('stageId') != 'native-stellar-zenith-exact-vertical-optical-column-analysis-recovery2': raise SystemExit('stage drift')
          if d.get('status') != 'EXACT_VERTICAL_OPTICAL_COLUMN_ANALYSIS_RECOVERY2_PASS':
            raise SystemExit('analysis recovery2 did not pass')
          s=d.get('source',{})
          if s.get('runId')!=33041069040 or s.get('dispatchSha')!='ac4a1230fd3ceb500019f5188173fb8f7165f5ec': raise SystemExit('source run drift')
          if s.get('artifactId')!=9633879569 or s.get('artifactDigest')!='sha256:eba59cc5d22e1600b0c38809cac29d615dddd0af02b491febae65164c3a1004e': raise SystemExit('source artifact drift')
          a=d.get('analysisExecution',{})
          if a.get('scientificSolverExecutionPerformedByThisAnalysis') is not False: raise SystemExit('analysis executed solver')
          if a.get('sourceCaseCount') != 4 or a.get('selectedIntegerNodeCountPerCase') != 401: raise SystemExit('analysis case/grid drift')
          p=d.get('parserEvidenceGate',{})
          if p.get('passed') is not True or p.get('maxStdoutStderrDirectFluxAbsDelta',1)>1e-7: raise SystemExit('parser-evidence gate failed')
          g=d.get('scientificGates',{})
          if g.get('spectralOpticalColumnPassed') is not True or g.get('maxAbsDeltaOpticalDepth',1)>1e-5: raise SystemExit('original optical-depth gate failed')
          if g.get('johnsonVConsequencePassed') is not True or g.get('maxAbsDeltaAvMag',1)>1e-4: raise SystemExit('original Johnson-V gate failed')
          if g.get('passed') is not True: raise SystemExit('scientific gate bundle failed')
          c=d.get('claimBoundary',{})
          for key in ('protectedHoldoutOpened','modelFitPerformed','stellarLutAcceptanceGateEvaluated','productionAuthorized','empiricalRealSkyValidated','humanFirstSeeingValidated'):
            if c.get(key) is not False: raise SystemExit(f'claim boundary drift: {key}')
          if c.get('analysisOnlyRecovery') is not True or c.get('v32EndpointMethodAuthorizedForDraftOnlyIfPass') is not True:
            raise SystemExit('analysis-only draft endpoint boundary drift')
          print(json.dumps({'status':d['status'],'parserEvidenceGate':p,'scientificGates':g},sort_keys=True))
          PY
