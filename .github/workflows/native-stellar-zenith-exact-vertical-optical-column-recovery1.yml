name: Native stellar exact-vertical optical-column recovery1
run-name: Native stellar exact-vertical optical-column recovery1 ${{ github.sha }}

on:
  push:
    branches:
      - dispatch/native-stellar-zenith-exact-vertical-optical-column-recovery1

permissions:
  contents: read

env:
  STAGE_DIR: review/native-stellar-zenith-v3
  DISPATCH_PATH: review/native-stellar-zenith-v3/exact-vertical-optical-column-recovery1-dispatch.json
  SED_SHA256: 85cbf41c86309b9d54d4765516167165f2d8736bcda8994337ef25d775ea11cb
  JOHNSON_V_SHA256: 51c357eb4cb3609361759f9750ad13ae13a901970913e3a5d87bb5c45ee2db9a
  UVSPEC_SHA256: 2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3
  UVSPEC_HELP_SHA256: 868aea5af762d968f6f62c4e1472916d25232ed9cab5be112d753b0823d20548
  AFGLUS_SHA256: dab26290ed81c762ed0c607e5dc2d53393c1462a0c3a528bc5e3f5935191cfb5
  PRIOR_RUN_ID: '33040457601'
  PRIOR_ARTIFACT_ID: '9633642762'
  PRIOR_ARTIFACT_DIGEST: sha256:f2f6f5b0d33518a48d36312b7f4bf18bea4ae22e1ce5fba2e80775c6b063332f
  PRIOR_DISPATCH_SHA: 2663fbc3241b31e095f3fb814cecc5a60e078c0a

concurrency:
  group: native-stellar-zenith-exact-vertical-optical-column-recovery1
  cancel-in-progress: false

jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact recovery dispatch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify one-shot infrastructure-recovery boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = dispatch/native-stellar-zenith-exact-vertical-optical-column-recovery1
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = 1
          test "${CHANGED[0]}" = "$DISPATCH_PATH"
          python - <<'PY'
          import json, os, subprocess
          d=json.load(open(os.environ['DISPATCH_PATH'],encoding='utf-8'))
          parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          expected={
            'schemaVersion':1,
            'stageId':'native-stellar-zenith-exact-vertical-optical-column-recovery1',
            'status':'AUTHORIZED_ONE_SHOT_PRE_SOLVER_PATH_RECOVERY',
            'baseMainSha':parent,
            'recoveryOfRunId':33040457601,
            'recoveryOfArtifactId':9633642762,
            'recoveryOfArtifactDigest':'sha256:f2f6f5b0d33518a48d36312b7f4bf18bea4ae22e1ce5fba2e80775c6b063332f',
            'recoveryOfDispatchSha':'2663fbc3241b31e095f3fb814cecc5a60e078c0a',
            'priorFailureClass':'PRE_SOLVER_WAVELENGTH_GRID_RELATIVE_PATH_NOT_FOUND',
            'priorValidScientificSpectrumCount':0,
            'soleRecoveryChange':'CANONICAL_ABSOLUTE_WAVELENGTH_GRID_PATH',
            'scientificInputsChanged':False,
            'acceptanceThresholdsChanged':False,
            'caseUniverse':[
              {'observerElevationM':500.0,'aod550':0.3},
              {'observerElevationM':1250.0,'aod550':0.1},
              {'observerElevationM':1250.0,'aod550':0.3},
              {'observerElevationM':2000.0,'aod550':0.2},
            ],
            'solverInvocationCountAuthorized':4,
            'maxAbsDeltaOpticalDepthLimit':1e-5,
            'maxAbsDeltaAvMagLimit':1e-4,
            'protectedHoldoutOpeningAuthorized':False,
            'modelFitAuthorized':False,
            'stellarLutAcceptanceGateEvaluationAuthorized':False,
            'productionAuthorized':False,
            'githubRerunPermitted':False,
            'solverRetryPermitted':False,
          }
          for k,v in expected.items():
            if d.get(k)!=v: raise SystemExit(f'recovery dispatch mismatch {k}: {d.get(k)!r} != {v!r}')
          PY

      - name: Set up exact libRadtran runtime
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: native-stellar-exact-vertical-optical-column-recovery1
          create-args: -c conda-forge python=3.12.4 rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Verify exact runtime, immutable assets, and path-only recovery proof
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$SED_SHA256" review/asiv-matched-stellar-transport-v1/frozen-assets/pickles-sed-1nm.json | sha256sum -c -
          printf '%s  %s\n' "$JOHNSON_V_SHA256" review/asiv-matched-stellar-transport-v1/frozen-assets/johnson-v-1nm.json | sha256sum -c -
          UVSPEC="$(command -v uvspec)"
          test -n "$UVSPEC"
          printf '%s  %s\n' "$UVSPEC_SHA256" "$UVSPEC" | sha256sum -c -
          UVHELP_SHA="$(python - <<'PY'
          import hashlib, subprocess, shutil
          u=shutil.which('uvspec'); r=subprocess.run([u,'-h'],capture_output=True,check=True)
          print(hashlib.sha256(r.stdout+r.stderr).hexdigest())
          PY
          )"
          test "$UVHELP_SHA" = "$UVSPEC_HELP_SHA256"
          PACKAGE_SPEC="$(python - <<'PY'
          import subprocess
          text=subprocess.check_output(['micromamba','list','rubin-libradtran'],text=True)
          rows=[]
          for raw in text.splitlines():
            p=raw.split()
            if len(p)>=3 and p[0]=='rubin-libradtran': rows.append(p[:3])
          if len(rows)!=1: raise SystemExit(f'package identity ambiguity: {rows!r}')
          print('='.join(rows[0]))
          PY
          )"
          test "$PACKAGE_SPEC" = 'rubin-libradtran=2.0.6=py312pl5321he9373c2_1'
          DATA_DIR="$(python - <<'PY'
          from pathlib import Path
          import shutil
          u=Path(shutil.which('uvspec')).resolve()
          for p in (u.parent.parent/'share'/'libRadtran'/'data',u.parent.parent/'data'):
            if p.is_dir(): print(p); break
          else: raise SystemExit('libRadtran data directory not found')
          PY
          )"
          test -f "$DATA_DIR/solar_flux/atlas_plus_modtran"
          printf '%s  %s\n' "$AFGLUS_SHA256" "$DATA_DIR/atmmod/afglus.dat" | sha256sum -c -
          test -f experiments/aerosol-family-challenge-v2-r8/wavelength-grid-1nm.dat
          python -m unittest tests.test_native_stellar_zenith_exact_vertical_optical_column_v1 -v
          python -m unittest tests.test_native_stellar_zenith_exact_vertical_optical_column_recovery1 -v
          python "$STAGE_DIR/diagnose_exact_vertical_optical_column_recovery1.py"
          python - <<'PY'
          import importlib.util, pathlib
          p=pathlib.Path('review/native-stellar-zenith-v3/diagnose_exact_vertical_optical_column_recovery1.py')
          s=importlib.util.spec_from_file_location('recovery',p); m=importlib.util.module_from_spec(s); s.loader.exec_module(m)
          proof=m.validate_recovery_surface(
            data_dir=pathlib.Path('${{ env.CONDA_PREFIX }}') if False else pathlib.Path('.'),
            atmosphere_file=pathlib.Path(os.environ['DATA_DIR'])/'atmmod'/'afglus.dat' if False else pathlib.Path('/nonexistent'),
            wavelength_grid_file=pathlib.Path('experiments/aerosol-family-challenge-v2-r8/wavelength-grid-1nm.dat'),
          ) if False else None
          PY
          echo "UVSPEC=$UVSPEC" >> "$GITHUB_ENV"
          echo "LIBRADTRAN_DATA=$DATA_DIR" >> "$GITHUB_ENV"

      - name: Prove path-only renderer difference with exact runtime atmosphere
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util, json, os
          from pathlib import Path
          p=Path('review/native-stellar-zenith-v3/diagnose_exact_vertical_optical_column_recovery1.py')
          s=importlib.util.spec_from_file_location('recovery',p); m=importlib.util.module_from_spec(s); s.loader.exec_module(m)
          proof=m.validate_recovery_surface(
            data_dir=Path(os.environ['LIBRADTRAN_DATA']),
            atmosphere_file=Path(os.environ['LIBRADTRAN_DATA'])/'atmmod'/'afglus.dat',
            wavelength_grid_file=Path('experiments/aerosol-family-challenge-v2-r8/wavelength-grid-1nm.dat'),
          )
          if proof['scientificInputsChanged'] is not False: raise SystemExit('scientific input drift')
          if proof['acceptanceThresholdsChanged'] is not False: raise SystemExit('threshold drift')
          if len(proof['caseProofs']) != 4: raise SystemExit('case proof count drift')
          print(json.dumps({'gridSha256':proof['gridSha256'],'caseProofs':proof['caseProofs']},sort_keys=True))
          PY

      - name: Execute four recovered exact-vertical training cases once
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          test ! -e recovery-output
          python "$STAGE_DIR/diagnose_exact_vertical_optical_column_recovery1.py" \
            --execute --allow-execution \
            --root . \
            --uvspec "$UVSPEC" \
            --data-dir "$LIBRADTRAN_DATA" \
            --atmosphere-file "$LIBRADTRAN_DATA/atmmod/afglus.dat" \
            --wavelength-grid-file experiments/aerosol-family-challenge-v2-r8/wavelength-grid-1nm.dat \
            --sed-bundle review/asiv-matched-stellar-transport-v1/frozen-assets/pickles-sed-1nm.json \
            --johnson-v review/asiv-matched-stellar-transport-v1/frozen-assets/johnson-v-1nm.json \
            --output-dir recovery-output

      - name: Preserve complete recovery evidence before gate
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-stellar-zenith-exact-vertical-optical-column-recovery1-${{ github.run_id }}
          path: recovery-output/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0

      - name: Require original preregistered gates without relaxation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('recovery-output/exact-vertical-optical-column-recovery1-summary.json'))
          if d.get('stageId')!='native-stellar-zenith-exact-vertical-optical-column-recovery1': raise SystemExit('stage drift')
          if d.get('solverInvocationCount')!=4: raise SystemExit('solver count drift')
          if d.get('status')!='EXACT_VERTICAL_OPTICAL_COLUMN_DIAGNOSTIC_PASS':
            raise SystemExit('original preregistered exact-vertical optical-column gates did not pass')
          m=d.get('metrics',{})
          if m.get('maxAbsDeltaOpticalDepth',1)>1e-5: raise SystemExit('spectral optical-column gate failed')
          if m.get('maxAbsDeltaAvMag',1)>1e-4: raise SystemExit('Johnson-V consequence gate failed')
          r=d.get('recoveryOf',{})
          if r.get('runId')!=33040457601 or r.get('artifactId')!=9633642762: raise SystemExit('recovery source drift')
          if r.get('artifactDigest')!='sha256:f2f6f5b0d33518a48d36312b7f4bf18bea4ae22e1ce5fba2e80775c6b063332f': raise SystemExit('recovery artifact digest drift')
          p=d.get('recoveryProof',{})
          if p.get('soleRecoveryChange')!='CANONICAL_ABSOLUTE_WAVELENGTH_GRID_PATH': raise SystemExit('recovery change drift')
          if p.get('scientificInputsChanged') is not False or p.get('acceptanceThresholdsChanged') is not False: raise SystemExit('scientific or threshold drift')
          c=d.get('claimBoundary',{})
          for key in ('protectedHoldoutOpened','modelFitPerformed','stellarLutAcceptanceGateEvaluated','productionAuthorized','empiricalRealSkyValidated','humanFirstSeeingValidated'):
            if c.get(key) is not False: raise SystemExit(f'claim boundary drift: {key}')
          if c.get('recoveryOnly') is not True or c.get('originalV1ScientificSpectrumCount') != 0: raise SystemExit('recovery boundary drift')
          if c.get('v32EndpointMethodAuthorizedForDraftOnlyIfPass') is not True: raise SystemExit('PASS did not preserve draft-only endpoint boundary')
          print(json.dumps({'status':d['status'],'metrics':m,'recoveryProof':p},sort_keys=True))
          PY
