name: Native stellar zenith v3 exact90 grid diagnostic v1
run-name: Native stellar zenith v3 exact90 grid diagnostic ${{ github.sha }}

on:
  push:
    branches:
      - dispatch/native-stellar-zenith-v3-exact90-grid-diagnostic-v1

permissions:
  contents: read

env:
  STAGE_DIR: review/native-stellar-zenith-v3
  DISPATCH_PATH: review/native-stellar-zenith-v3/exact90-grid-diagnostic-v1-dispatch.json
  UVSPEC_SHA256: 2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3
  UVSPEC_HELP_SHA256: 868aea5af762d968f6f62c4e1472916d25232ed9cab5be112d753b0823d20548
  AFGLUS_SHA256: dab26290ed81c762ed0c607e5dc2d53393c1462a0c3a528bc5e3f5935191cfb5

concurrency:
  group: native-stellar-zenith-v3-exact90-grid-diagnostic-v1
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact diagnostic dispatch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify diagnostic authorization boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = dispatch/native-stellar-zenith-v3-exact90-grid-diagnostic-v1
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = 1
          test "${CHANGED[0]}" = "$DISPATCH_PATH"
          python - <<'PY'
          import json, os, subprocess
          d=json.load(open(os.environ['DISPATCH_PATH'],encoding='utf-8'))
          parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          expected={
            'schemaVersion':1,
            'stageId':'native-stellar-zenith-v3-exact90-grid-diagnostic-v1',
            'status':'AUTHORIZED_ONE_CASE_STRUCTURAL_DIAGNOSTIC',
            'baseMainSha':parent,
            'diagnosticOfRunId':33033742217,
            'priorFailure':'UVSPEC_OUTPUT_GRID_NOT_EXACT_380_780_1NM',
            'case':{'targetAltitudeDeg':90.0,'observerElevationM':0.0,'aod550':0.05},
            'solverInvocationCountAuthorized':1,
            'protectedHoldoutOpeningAuthorized':False,
            'radiometricAcceptanceEvaluationAuthorized':False,
            'modelFitAuthorized':False,
            'postResultRetuningAuthorized':False,
            'productionAuthorized':False,
            'githubRerunPermitted':False,
          }
          for k,v in expected.items():
            if d.get(k)!=v: raise SystemExit(f'diagnostic dispatch mismatch {k}: {d.get(k)!r} != {v!r}')
          PY

      - name: Set up exact libRadtran runtime
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: native-stellar-exact90-grid-diagnostic-v1
          create-args: -c conda-forge python=3.12.4 rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Verify exact runtime identity
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          UVSPEC="$(command -v uvspec)"
          printf '%s  %s\n' "$UVSPEC_SHA256" "$UVSPEC" | sha256sum -c -
          UVHELP_SHA="$(python - <<'PY'
          import hashlib,subprocess,shutil
          u=shutil.which('uvspec'); r=subprocess.run([u,'-h'],capture_output=True,check=True)
          print(hashlib.sha256(r.stdout+r.stderr).hexdigest())
          PY
          )"
          test "$UVHELP_SHA" = "$UVSPEC_HELP_SHA256"
          PACKAGE_SPEC="$(python - <<'PY'
          import subprocess
          text=subprocess.check_output(['micromamba','list','rubin-libradtran'],text=True)
          rows=[]
          for raw in text.splitlines():
            p=raw.split()
            if len(p)>=3 and p[0]=='rubin-libradtran': rows.append(p[:3])
          if len(rows)!=1: raise SystemExit(f'package identity ambiguity: {rows!r}')
          print('='.join(rows[0]))
          PY
          )"
          test "$PACKAGE_SPEC" = 'rubin-libradtran=2.0.6=py312pl5321he9373c2_1'
          DATA_DIR="$(python - <<'PY'
          from pathlib import Path
          import shutil
          u=Path(shutil.which('uvspec')).resolve()
          for p in (u.parent.parent/'share'/'libRadtran'/'data',u.parent.parent/'data'):
            if p.is_dir(): print(p); break
          else: raise SystemExit('libRadtran data directory not found')
          PY
          )"
          printf '%s  %s\n' "$AFGLUS_SHA256" "$DATA_DIR/atmmod/afglus.dat" | sha256sum -c -
          python "$STAGE_DIR/diagnose_exact90_grid_v1.py"
          echo "UVSPEC=$UVSPEC" >> "$GITHUB_ENV"
          echo "LIBRADTRAN_DATA=$DATA_DIR" >> "$GITHUB_ENV"

      - name: Run exactly one structural diagnostic case
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          test ! -e diagnostic-output
          python "$STAGE_DIR/diagnose_exact90_grid_v1.py" \
            --execute --allow-execution \
            --uvspec "$UVSPEC" \
            --data-dir "$LIBRADTRAN_DATA" \
            --atmosphere-file "$LIBRADTRAN_DATA/atmmod/afglus.dat" \
            --wavelength-grid-file experiments/aerosol-family-challenge-v2-r8/wavelength-grid-1nm.dat \
            --output-dir diagnostic-output

      - name: Verify diagnostic scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('diagnostic-output/grid-summary.json'))
          if d.get('solverInvocationCount')!=1: raise SystemExit('solver invocation count drift')
          if d.get('case')!={'targetAltitudeDeg':90.0,'observerElevationM':0.0,'aod550':0.05}: raise SystemExit('case drift')
          if d.get('protectedHoldoutOpened') is not False: raise SystemExit('holdout boundary drift')
          if d.get('radiometricAcceptanceEvaluated') is not False: raise SystemExit('radiometric evaluation boundary drift')
          if d.get('modelFitPerformed') is not False: raise SystemExit('fit boundary drift')
          if d.get('productionAuthorized') is not False: raise SystemExit('production boundary drift')
          print(json.dumps(d,sort_keys=True))
          PY

      - name: Publish structural diagnostic evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-stellar-zenith-v3-exact90-grid-diagnostic-v1
          path: diagnostic-output/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
