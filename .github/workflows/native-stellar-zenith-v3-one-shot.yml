name: Native stellar zenith v3 one-shot
run-name: Native stellar zenith v3 one-shot ${{ github.sha }}

on:
  push:
    branches:
      - dispatch/native-stellar-zenith-v3

permissions:
  contents: read

env:
  STAGE_DIR: review/native-stellar-zenith-v3
  DISPATCH_PATH: review/native-stellar-zenith-v3/dispatch.json
  SOURCE_RUNTIME_URL: https://raw.githubusercontent.com/search-maker/twilight-mystic-experiments/4b71445139e24236f12952ab41c791bd07a9f7db/generated/level-b-stellar-v2/stellar-transport-v2-lut.json
  SOURCE_RUNTIME_SHA256: 21eeb51fcc5287ab3bb8cb59cfe0bb0073f34e9ca1b6cc6df988c6eb5043631f
  SED_SHA256: 85cbf41c86309b9d54d4765516167165f2d8736bcda8994337ef25d775ea11cb
  JOHNSON_V_SHA256: 51c357eb4cb3609361759f9750ad13ae13a901970913e3a5d87bb5c45ee2db9a
  UVSPEC_SHA256: 2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3
  UVSPEC_HELP_SHA256: 868aea5af762d968f6f62c4e1472916d25232ed9cab5be112d753b0823d20548
  AFGLUS_SHA256: dab26290ed81c762ed0c607e5dc2d53393c1462a0c3a528bc5e3f5935191cfb5

concurrency:
  group: native-stellar-zenith-v3-one-shot
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact dispatch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify single-use dispatch boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = dispatch/native-stellar-zenith-v3
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin main
          mapfile -t PARENTS < <(git cat-file -p HEAD | sed -n 's/^parent //p')
          test "${#PARENTS[@]}" = 1
          PARENT="${PARENTS[0]}"
          test "$PARENT" = "$(git rev-parse origin/main)"
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = 1
          test "${CHANGED[0]}" = "$DISPATCH_PATH"
          python - <<'PY'
          import json,os,subprocess
          p=os.environ['DISPATCH_PATH']
          d=json.load(open(p,encoding='utf-8'))
          parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          expected={
              'schemaVersion':1,
              'stageId':'native-stellar-zenith-v3',
              'status':'AUTHORIZED_ONE_SHOT_COMPUTATIONAL_REFERENCE_EXECUTION',
              'executionKey':'native-stellar-zenith-v3-one-shot',
              'baseMainSha':parent,
              'scientificExecutionAuthorized':True,
              'solverExecutionAuthorized':True,
              'resultOpeningAuthorized':True,
              'githubRerunPermitted':False,
              'solverRetryPermitted':False,
              'solverResumePermitted':False,
              'postResultRetuningAuthorized':False,
              'productionAuthorized':False,
              'empiricalRealSkyValidationClaimAuthorized':False,
              'humanFirstSeeingValidationClaimAuthorized':False,
          }
          for key,value in expected.items():
              if d.get(key)!=value:
                  raise SystemExit(f'dispatch mismatch: {key}: {d.get(key)!r} != {value!r}')
          if d.get('newTrainingSpectrumCount')!=100 or d.get('freshValidationSpectrumCount')!=64:
              raise SystemExit('dispatch case-count drift')
          if d.get('freshJohnsonVComparisonCount')!=192:
              raise SystemExit('dispatch photometric-comparison count drift')
          PY

      - name: Set up exact libRadtran runtime
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: native-stellar-zenith-v3
          create-args: -c conda-forge python=3.12.4 rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Verify exact binary, package, data and frozen inputs
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          mkdir -p execution-inputs
          curl --fail --location --retry 3 --retry-all-errors "$SOURCE_RUNTIME_URL" --output execution-inputs/stellar-transport-v2-lut.json
          printf '%s  %s\n' "$SOURCE_RUNTIME_SHA256" execution-inputs/stellar-transport-v2-lut.json | sha256sum -c -
          printf '%s  %s\n' "$SED_SHA256" review/asiv-matched-stellar-transport-v1/frozen-assets/pickles-sed-1nm.json | sha256sum -c -
          printf '%s  %s\n' "$JOHNSON_V_SHA256" review/asiv-matched-stellar-transport-v1/frozen-assets/johnson-v-1nm.json | sha256sum -c -
          UVSPEC="$(command -v uvspec)"
          test -n "$UVSPEC"
          printf '%s  %s\n' "$UVSPEC_SHA256" "$UVSPEC" | sha256sum -c -
          UVHELP_SHA="$(python - <<'PY'
          import hashlib,subprocess,shutil
          u=shutil.which('uvspec')
          r=subprocess.run([u,'-h'],capture_output=True,check=True)
          print(hashlib.sha256(r.stdout+r.stderr).hexdigest())
          PY
          )"
          test "$UVHELP_SHA" = "$UVSPEC_HELP_SHA256"
          PACKAGE_SPEC="$(python - <<'PY'
          import json,subprocess
          rows=json.loads(subprocess.check_output(['micromamba','list','--json'],text=True))
          matches=[r for r in rows if r.get('name')=='rubin-libradtran']
          if len(matches)!=1: raise SystemExit(f'expected one rubin-libradtran package; got {len(matches)}')
          r=matches[0]
          print(f"{r['name']}={r['version']}={r['build_string']}")
          PY
          )"
          test "$PACKAGE_SPEC" = 'rubin-libradtran=2.0.6=py312pl5321he9373c2_1'
          DATA_DIR="$(python - <<'PY'
          from pathlib import Path
          import shutil
          u=Path(shutil.which('uvspec')).resolve()
          for p in (u.parent.parent/'share'/'libRadtran'/'data', u.parent.parent/'data'):
              if p.is_dir():
                  print(p); break
          else:
              raise SystemExit('libRadtran data directory not found')
          PY
          )"
          test -d "$DATA_DIR"
          printf '%s  %s\n' "$AFGLUS_SHA256" "$DATA_DIR/atmmod/afglus.dat" | sha256sum -c -
          python "$STAGE_DIR/native_stellar_zenith_v3.py"
          echo "UVSPEC=$UVSPEC" >> "$GITHUB_ENV"
          echo "LIBRADTRAN_DATA=$DATA_DIR" >> "$GITHUB_ENV"

      - name: Execute exactly 100 training and 64 fresh holdout spectra once
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          test ! -e execution-output
          python "$STAGE_DIR/native_stellar_zenith_v3.py" \
            --execute --allow-execution \
            --root . \
            --source-runtime execution-inputs/stellar-transport-v2-lut.json \
            --uvspec "$UVSPEC" \
            --data-dir "$LIBRADTRAN_DATA" \
            --atmosphere-file "$LIBRADTRAN_DATA/atmmod/afglus.dat" \
            --wavelength-grid-file experiments/aerosol-family-challenge-v2-r8/wavelength-grid-1nm.dat \
            --sed-bundle review/asiv-matched-stellar-transport-v1/frozen-assets/pickles-sed-1nm.json \
            --johnson-v review/asiv-matched-stellar-transport-v1/frozen-assets/johnson-v-1nm.json \
            --output-dir execution-output

      - name: Verify final PASS evidence before publication
        shell: bash
        run: |
          set -euo pipefail
          test -f execution-output/stellar-transport-v3-zenith-lut.json
          test -f execution-output/native-stellar-zenith-v3-validation.json
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          v=json.load(open('execution-output/native-stellar-zenith-v3-validation.json'))
          r=Path('execution-output/stellar-transport-v3-zenith-lut.json')
          sha=hashlib.sha256(r.read_bytes()).hexdigest()
          if v.get('status')!='COMPUTATIONAL_REFERENCE_VALIDATION_PASS': raise SystemExit('fresh zenith validation did not PASS')
          if v.get('extendedRuntimeSha256')!=sha: raise SystemExit('runtime SHA binding mismatch')
          if v.get('newTrainingSolverSpectrumCount')!=100: raise SystemExit('training count drift')
          if v.get('freshValidationAtmosphericSpectrumCount')!=64: raise SystemExit('fresh validation count drift')
          if v.get('johnsonVComparisonCount')!=192: raise SystemExit('Johnson-V comparison count drift')
          if v.get('scientificSolverExecuted') is not True or v.get('solverInvocationCount')!=164: raise SystemExit('solver execution count evidence drift')
          if v.get('randomNumbersUsed') is not False: raise SystemExit('random-number boundary drift')
          if v.get('overall',{}).get('passed') is not True: raise SystemExit('global gate failed')
          if not all(row.get('passed') is True for row in v.get('byValidationAltitudeDeg',{}).values()): raise SystemExit('per-altitude gate failed')
          if v.get('claimBoundary',{}).get('productionAuthorized') is not False: raise SystemExit('production claim boundary drift')
          print(json.dumps({'status':v['status'],'runtimeSha256':sha,'overall':v['overall'],'byAltitude':v['byValidationAltitudeDeg']},sort_keys=True))
          PY

      - name: Publish exact successful computational-validation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-stellar-zenith-v3-result
          path: execution-output/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
