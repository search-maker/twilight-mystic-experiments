name: Native stellar zenith v3.2 endpoint training v1
run-name: Native stellar zenith v3.2 endpoint training ${{ github.sha }}

on:
  push:
    branches:
      - dispatch/native-stellar-zenith-v32-endpoint-training-v1

permissions:
  contents: read
  actions: read

env:
  STAGE_DIR: review/native-stellar-zenith-v3
  DISPATCH_PATH: review/native-stellar-zenith-v3/v32-endpoint-training-v1-dispatch.json
  SOURCE_RUNTIME_URL: https://raw.githubusercontent.com/search-maker/twilight-mystic-experiments/4b71445139e24236f12952ab41c791bd07a9f7db/generated/level-b-stellar-v2/stellar-transport-v2-lut.json
  SOURCE_RUNTIME_SHA256: 21eeb51fcc5287ab3bb8cb59cfe0bb0073f34e9ca1b6cc6df988c6eb5043631f
  SED_SHA256: 85cbf41c86309b9d54d4765516167165f2d8736bcda8994337ef25d775ea11cb
  JOHNSON_V_SHA256: 51c357eb4cb3609361759f9750ad13ae13a901970913e3a5d87bb5c45ee2db9a
  UVSPEC_SHA256: 2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3
  UVSPEC_HELP_SHA256: 868aea5af762d968f6f62c4e1472916d25232ed9cab5be112d753b0823d20548
  AFGLUS_SHA256: dab26290ed81c762ed0c607e5dc2d53393c1462a0c3a528bc5e3f5935191cfb5
  SOURCE_V31_RUN_ID: '33035467761'
  SOURCE_V31_DISPATCH_SHA: 2a6f6eadb003ea70c99e0c306f232a6233650a0e
  SOURCE_V31_ARTIFACT_ID: '9631872858'
  SOURCE_V31_ARTIFACT_NAME: native-stellar-zenith-v31-recovery2-33035467761
  SOURCE_V31_ARTIFACT_DIGEST: sha256:dd8cbf6c00fdcf34041fb61e43d0f97d43646a5d2bdaf5a2ef899ed1a40f078b
  ENDPOINT_VALIDATION_RUN_ID: '33041830554'
  ENDPOINT_VALIDATION_DISPATCH_SHA: bdac3f0f03f1d2c63d274076365f1f3331a8b68e
  ENDPOINT_VALIDATION_ARTIFACT_ID: '9634148868'
  ENDPOINT_VALIDATION_ARTIFACT_NAME: native-stellar-zenith-exact-vertical-optical-column-analysis-recovery2-33041830554
  ENDPOINT_VALIDATION_ARTIFACT_DIGEST: sha256:aa5b0b4a5b705bdcefd29c35113f331aa667b8dca9a2b228d44aa52ec864ca78

concurrency:
  group: native-stellar-zenith-v32-endpoint-training-v1
  cancel-in-progress: false

jobs:
  train-endpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact endpoint-training dispatch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify one-file training-only authorization boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = dispatch/native-stellar-zenith-v32-endpoint-training-v1
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = 1
          test "${CHANGED[0]}" = "$DISPATCH_PATH"
          python - <<'PY'
          import json, os, subprocess
          d=json.load(open(os.environ['DISPATCH_PATH'],encoding='utf-8'))
          parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          expected={
            'schemaVersion':1,
            'stageId':'native-stellar-zenith-v3.2-endpoint-training-v1',
            'status':'AUTHORIZED_ONE_SHOT_TRAINING_ONLY_EXACT90_ENDPOINT',
            'baseMainSha':parent,
            'sourceV31RunId':33035467761,
            'sourceV31DispatchSha':'2a6f6eadb003ea70c99e0c306f232a6233650a0e',
            'sourceV31ArtifactId':9631872858,
            'sourceV31ArtifactDigest':'sha256:dd8cbf6c00fdcf34041fb61e43d0f97d43646a5d2bdaf5a2ef899ed1a40f078b',
            'exactVerticalValidationRunId':33041830554,
            'exactVerticalValidationDispatchSha':'bdac3f0f03f1d2c63d274076365f1f3331a8b68e',
            'exactVerticalValidationArtifactId':9634148868,
            'exactVerticalValidationArtifactDigest':'sha256:aa5b0b4a5b705bdcefd29c35113f331aa667b8dca9a2b228d44aa52ec864ca78',
            'reusedNonZenithTrainingSpectrumCount':75,
            'newExactZenithTrainingSpectrumCount':25,
            'newSolverInvocationCountAuthorized':25,
            'protectedHoldoutOpeningAuthorized':False,
            'protectedHoldoutSolverInvocationCountAuthorized':0,
            'modelFitAuthorized':False,
            'postResultRetuningAuthorized':False,
            'stdoutStderrFluxTolerance':1e-7,
            'maxAbsDeltaOpticalDepthLimit':1e-5,
            'maxAbsDeltaAvMagLimit':1e-4,
            'knotReproductionTolerance':1e-12,
            'endpointMonotonicSlack':1e-10,
            'githubRerunPermitted':False,
            'solverRetryPermitted':False,
            'solverResumePermitted':False,
            'productionAuthorized':False,
          }
          for k,v in expected.items():
            if d.get(k)!=v: raise SystemExit(f'v3.2 endpoint dispatch mismatch {k}: {d.get(k)!r} != {v!r}')
          PY

      - name: Verify immutable source run and artifact identities
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          def get(url):
            req=urllib.request.Request(url,headers={
              'Authorization':f'Bearer {token}',
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'native-stellar-v32-endpoint-training',
            })
            with urllib.request.urlopen(req) as r: return json.load(r)
          pairs=[
            ('SOURCE_V31_RUN_ID','SOURCE_V31_DISPATCH_SHA','SOURCE_V31_ARTIFACT_ID','SOURCE_V31_ARTIFACT_NAME','SOURCE_V31_ARTIFACT_DIGEST','failure'),
            ('ENDPOINT_VALIDATION_RUN_ID','ENDPOINT_VALIDATION_DISPATCH_SHA','ENDPOINT_VALIDATION_ARTIFACT_ID','ENDPOINT_VALIDATION_ARTIFACT_NAME','ENDPOINT_VALIDATION_ARTIFACT_DIGEST','success'),
          ]
          evidence=[]
          for run_k,sha_k,id_k,name_k,digest_k,conclusion in pairs:
            run_id=int(os.environ[run_k]); art_id=int(os.environ[id_k])
            run=get(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}')
            if run.get('head_sha')!=os.environ[sha_k]: raise SystemExit(f'{run_k} head drift')
            if run.get('status')!='completed' or run.get('conclusion')!=conclusion: raise SystemExit(f'{run_k} terminal status drift')
            arts=get(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100')
            found=[a for a in arts.get('artifacts',[]) if a.get('id')==art_id]
            if len(found)!=1: raise SystemExit(f'{id_k} missing/ambiguous')
            a=found[0]
            if a.get('name')!=os.environ[name_k] or a.get('digest')!=os.environ[digest_k] or a.get('expired') is not False:
              raise SystemExit(f'{id_k} metadata drift')
            evidence.append({'runId':run_id,'headSha':run['head_sha'],'conclusion':run['conclusion'],'artifactId':art_id,'artifactName':a['name'],'artifactDigest':a['digest']})
          open('source-artifact-identities.json','w').write(json.dumps(evidence,indent=2,sort_keys=True)+'\n')
          PY

      - name: Download immutable 75-spectrum v3.1 source artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 33035467761
          name: native-stellar-zenith-v31-recovery2-33035467761
          path: source-v31

      - name: Download immutable exact-vertical validation artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 33041830554
          name: native-stellar-zenith-exact-vertical-optical-column-analysis-recovery2-33041830554
          path: endpoint-validation

      - name: Set up exact libRadtran runtime
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: native-stellar-zenith-v32-endpoint-training
          create-args: -c conda-forge python=3.12.4 rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Verify runtime, source LUT, frozen assets, and review surface
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          mkdir -p execution-inputs
          curl --fail --location --retry 3 --retry-all-errors "$SOURCE_RUNTIME_URL" --output execution-inputs/stellar-transport-v2-lut.json
          printf '%s  %s\n' "$SOURCE_RUNTIME_SHA256" execution-inputs/stellar-transport-v2-lut.json | sha256sum -c -
          printf '%s  %s\n' "$SED_SHA256" review/asiv-matched-stellar-transport-v1/frozen-assets/pickles-sed-1nm.json | sha256sum -c -
          printf '%s  %s\n' "$JOHNSON_V_SHA256" review/asiv-matched-stellar-transport-v1/frozen-assets/johnson-v-1nm.json | sha256sum -c -
          UVSPEC="$(command -v uvspec)"
          test -n "$UVSPEC"
          printf '%s  %s\n' "$UVSPEC_SHA256" "$UVSPEC" | sha256sum -c -
          UVHELP_SHA="$(python - <<'PY'
          import hashlib, subprocess, shutil
          u=shutil.which('uvspec'); r=subprocess.run([u,'-h'],capture_output=True,check=True)
          print(hashlib.sha256(r.stdout+r.stderr).hexdigest())
          PY
          )"
          test "$UVHELP_SHA" = "$UVSPEC_HELP_SHA256"
          PACKAGE_SPEC="$(python - <<'PY'
          import subprocess
          text=subprocess.check_output(['micromamba','list','rubin-libradtran'],text=True)
          rows=[]
          for raw in text.splitlines():
            p=raw.split()
            if len(p)>=3 and p[0]=='rubin-libradtran': rows.append(p[:3])
          if len(rows)!=1: raise SystemExit(f'package identity ambiguity: {rows!r}')
          print('='.join(rows[0]))
          PY
          )"
          test "$PACKAGE_SPEC" = 'rubin-libradtran=2.0.6=py312pl5321he9373c2_1'
          DATA_DIR="$(python - <<'PY'
          from pathlib import Path
          import shutil
          u=Path(shutil.which('uvspec')).resolve()
          for p in (u.parent.parent/'share'/'libRadtran'/'data',u.parent.parent/'data'):
            if p.is_dir(): print(p); break
          else: raise SystemExit('libRadtran data directory not found')
          PY
          )"
          printf '%s  %s\n' "$AFGLUS_SHA256" "$DATA_DIR/atmmod/afglus.dat" | sha256sum -c -
          test -f "$DATA_DIR/solar_flux/atlas_plus_modtran"
          test -f experiments/aerosol-family-challenge-v2-r8/wavelength-grid-1nm.dat
          python -m unittest tests.test_native_stellar_zenith_v31_limit -v
          python -m unittest tests.test_native_stellar_zenith_exact_vertical_optical_column_analysis_recovery2 -v
          python -m unittest tests.test_native_stellar_zenith_v32_endpoint_training -v
          python "$STAGE_DIR/native_stellar_zenith_v32.py"
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path('review/native-stellar-zenith-v3/native_stellar_zenith_v32.py')
          s=importlib.util.spec_from_file_location('v32',p); m=importlib.util.module_from_spec(s); s.loader.exec_module(m)
          reused,e=m.load_reused_v31_training(Path('source-v31'))
          if len(reused)!=75: raise SystemExit('source reusable count drift')
          v=m.validate_exact_vertical_validation_artifact(Path('endpoint-validation'))
          print({'reused':len(reused),'reusedEvidence':e,'endpointValidation':v})
          PY
          echo "UVSPEC=$UVSPEC" >> "$GITHUB_ENV"
          echo "LIBRADTRAN_DATA=$DATA_DIR" >> "$GITHUB_ENV"

      - name: Execute only 25 exact-90 training solver calls and assemble v3.2 training LUT
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          test ! -e execution-output
          python "$STAGE_DIR/native_stellar_zenith_v32.py" \
            --execute --allow-execution \
            --root . \
            --source-runtime execution-inputs/stellar-transport-v2-lut.json \
            --source-v31-root source-v31 \
            --exact-vertical-validation-root endpoint-validation \
            --uvspec "$UVSPEC" \
            --data-dir "$LIBRADTRAN_DATA" \
            --atmosphere-file "$LIBRADTRAN_DATA/atmmod/afglus.dat" \
            --wavelength-grid-file experiments/aerosol-family-challenge-v2-r8/wavelength-grid-1nm.dat \
            --sed-bundle review/asiv-matched-stellar-transport-v1/frozen-assets/pickles-sed-1nm.json \
            --johnson-v review/asiv-matched-stellar-transport-v1/frozen-assets/johnson-v-1nm.json \
            --output-dir execution-output
          cp source-artifact-identities.json execution-output/source-artifact-identities.json

      - name: Preserve all endpoint-training evidence before final gate
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-stellar-zenith-v32-endpoint-training-v1-${{ github.run_id }}
          path: execution-output/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0

      - name: Require all 25 endpoint gates and structural seam PASS
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=Path('execution-output/native-stellar-zenith-v32-endpoint-training.json')
          r=Path('execution-output/stellar-transport-v32-training-lut.json')
          if not p.is_file() or not r.is_file(): raise SystemExit('v3.2 training outputs missing')
          d=json.load(open(p)); runtime=json.load(open(r))
          sha=hashlib.sha256(r.read_bytes()).hexdigest()
          if d.get('stageId')!='native-stellar-zenith-v3.2-endpoint-training-v1': raise SystemExit('stage drift')
          if d.get('status')!='V32_ENDPOINT_TRAINING_AND_STRUCTURAL_SEAM_PASS': raise SystemExit('endpoint training did not pass')
          if d.get('trainingRuntimeSha256')!=sha: raise SystemExit('training runtime SHA binding mismatch')
          if d.get('reusedNonZenithTrainingSpectrumCount')!=75: raise SystemExit('reused spectrum count drift')
          if d.get('newExactZenithSolverInvocationCount')!=25 or d.get('successfulExactZenithTrainingSpectrumCount')!=25: raise SystemExit('exact90 solver/success count drift')
          if d.get('failures')!=[]: raise SystemExit('endpoint failures present')
          if d.get('maxExact90StdoutStderrDirectFluxAbsDelta',1)>1e-7: raise SystemExit('exact90 parser-evidence gate failed')
          if d.get('maxExact90AbsDeltaOpticalDepth',1)>1e-5: raise SystemExit('exact90 optical-column gate failed')
          if d.get('maxExact90AbsDeltaAvMag',1)>1e-4: raise SystemExit('exact90 Johnson-V gate failed')
          seam=d.get('structuralSeam',{})
          if seam.get('passed') is not True or seam.get('status')!='V32_TRAINING_STRUCTURAL_SEAM_PASS': raise SystemExit('structural seam failed')
          if seam.get('maxKnotReproductionAbsDeltaOpticalDepth',1)>1e-12: raise SystemExit('knot reproduction failed')
          if seam.get('endpointOrderingViolationCount')!=0 or seam.get('overshootViolationCount')!=0 or seam.get('nonfiniteOrNegativeCount')!=0: raise SystemExit('structural seam violation present')
          if seam.get('diagnosticOnlyExact90VsCscExtrapolationFrom85And87p5',{}).get('acceptanceThresholdApplied') is not False: raise SystemExit('post-hoc extrapolation threshold drift')
          if d.get('protectedHoldoutOpened') is not False: raise SystemExit('holdout was opened')
          cb=d.get('claimBoundary',{})
          if cb.get('protectedHoldoutOpened') is not False or cb.get('computationalReferenceValidationComplete') is not False or cb.get('productionAuthorized') is not False: raise SystemExit('claim boundary drift')
          if cb.get('holdoutAuthorizationPermittedAfterSeparateReview') is not True: raise SystemExit('separate holdout handoff missing')
          if len(runtime.get('directOpticalDepth',[]))!=775: raise SystemExit('training LUT spectrum count drift')
          prov=runtime.get('provenance',{})
          if prov.get('reusedNonZenithTrainingSpectrumCount')!=75 or prov.get('newExactZenithTrainingSpectrumCount')!=25: raise SystemExit('runtime provenance count drift')
          if prov.get('tiltedSdisortDisortInterchangeabilityClaimed') is not False or prov.get('epsilonApproximationUsedAtExactZenith') is not False: raise SystemExit('solver-method claim drift')
          case_files=sorted(Path('execution-output/exact90-cases').glob('*/case.json'))
          if len(case_files)!=25: raise SystemExit(f'exact90 evidence count drift: {len(case_files)}')
          cases=[json.load(open(x)) for x in case_files]
          if not all(c.get('status')=='CASE_EXECUTED_PARSED_AND_GATED' and c.get('targetAltitudeDeg')==90.0 and c.get('solver')=='disort' and c.get('solverSourceZenithAngleDeg')==0.0 for c in cases): raise SystemExit('exact90 case evidence drift')
          print(json.dumps({'status':d['status'],'trainingRuntimeSha256':sha,'maxExact90AbsDeltaOpticalDepth':d['maxExact90AbsDeltaOpticalDepth'],'maxExact90AbsDeltaAvMag':d['maxExact90AbsDeltaAvMag'],'maxExact90StdoutStderrDirectFluxAbsDelta':d['maxExact90StdoutStderrDirectFluxAbsDelta'],'structuralSeam':seam},sort_keys=True))
          PY
