name: Native stellar zenith v3.2 one-shot
run-name: Native stellar zenith v3.2 one-shot ${{ github.sha }}

on:
  push:
    branches:
      - dispatch/native-stellar-zenith-v32
    paths:
      - review/native-stellar-zenith-v3/v32-dispatch.json

permissions:
  contents: read

env:
  STAGE_DIR: review/native-stellar-zenith-v3
  DISPATCH_PATH: review/native-stellar-zenith-v3/v32-dispatch.json
  SOURCE_RUNTIME_URL: https://raw.githubusercontent.com/search-maker/twilight-mystic-experiments/4b71445139e24236f12952ab41c791bd07a9f7db/generated/level-b-stellar-v2/stellar-transport-v2-lut.json
  SOURCE_RUNTIME_SHA256: 21eeb51fcc5287ab3bb8cb59cfe0bb0073f34e9ca1b6cc6df988c6eb5043631f
  SED_SHA256: 85cbf41c86309b9d54d4765516167165f2d8736bcda8994337ef25d775ea11cb
  JOHNSON_V_SHA256: 51c357eb4cb3609361759f9750ad13ae13a901970913e3a5d87bb5c45ee2db9a
  UVSPEC_SHA256: 2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3
  UVSPEC_HELP_SHA256: 868aea5af762d968f6f62c4e1472916d25232ed9cab5be112d753b0823d20548
  AFGLUS_SHA256: dab26290ed81c762ed0c607e5dc2d53393c1462a0c3a528bc5e3f5935191cfb5
  EXACT_VERTICAL_ANALYSIS_RUN_ID: '33041830554'
  EXACT_VERTICAL_ANALYSIS_ARTIFACT_ID: '9634148868'
  EXACT_VERTICAL_ANALYSIS_ARTIFACT_DIGEST: sha256:aa5b0b4a5b705bdcefd29c35113f331aa667b8dca9a2b228d44aa52ec864ca78

concurrency:
  group: native-stellar-zenith-v32-one-shot
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact dispatch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify single-use frozen-method dispatch boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = dispatch/native-stellar-zenith-v32
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin main
          mapfile -t PARENTS < <(git cat-file -p HEAD | sed -n 's/^parent //p')
          test "${#PARENTS[@]}" = 1
          PARENT="${PARENTS[0]}"
          test "$PARENT" = "$(git rev-parse origin/main)"
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = 1
          test "${CHANGED[0]}" = "$DISPATCH_PATH"
          python - <<'PY'
          import json,os,subprocess
          d=json.load(open(os.environ['DISPATCH_PATH'],encoding='utf-8'))
          parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          expected={
              'schemaVersion':1,
              'stageId':'native-stellar-zenith-v3.2',
              'status':'AUTHORIZED_ONE_SHOT_FROZEN_METHOD_VALIDATION',
              'executionKey':'native-stellar-zenith-v32-one-shot',
              'baseMainSha':parent,
              'scientificExecutionAuthorized':True,
              'solverExecutionAuthorized':True,
              'protectedHoldoutOpeningAuthorized':True,
              'resultOpeningAuthorized':True,
              'trainingSpectrumCount':100,
              'exactVerticalTrainingSpectrumCount':25,
              'belowZenithSdisortTrainingSpectrumCount':75,
              'protectedHoldoutSpectrumCount':64,
              'totalSolverInvocationCount':164,
              'freshJohnsonVComparisonCount':192,
              'maxAbsDeltaAvMagLimit':0.025,
              'rmsDeltaAvMagLimit':0.010,
              'exactVerticalAnalysisRunId':33041830554,
              'exactVerticalAnalysisArtifactId':9634148868,
              'exactVerticalAnalysisArtifactDigest':'sha256:aa5b0b4a5b705bdcefd29c35113f331aa667b8dca9a2b228d44aa52ec864ca78',
              'positiveEpsilonSubstitutionAuthorized':False,
              'githubRerunPermitted':False,
              'solverRetryPermitted':False,
              'solverResumePermitted':False,
              'postResultThresholdRelaxationAuthorized':False,
              'postResultRetuningAuthorized':False,
              'productionAuthorized':False,
              'empiricalRealSkyValidationClaimAuthorized':False,
              'humanFirstSeeingValidationClaimAuthorized':False,
          }
          if d != expected:
              missing={k:v for k,v in expected.items() if d.get(k)!=v}
              extra={k:v for k,v in d.items() if k not in expected}
              raise SystemExit(f'dispatch mismatch missing_or_changed={missing!r} extra={extra!r}')
          PY

      - name: Set up exact libRadtran runtime
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: native-stellar-zenith-v32
          create-args: -c conda-forge python=3.12.4 rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Verify exact binary, package, frozen inputs, method tests and proof binding
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          mkdir -p execution-inputs
          curl --fail --location --retry 3 --retry-all-errors "$SOURCE_RUNTIME_URL" --output execution-inputs/stellar-transport-v2-lut.json
          printf '%s  %s\n' "$SOURCE_RUNTIME_SHA256" execution-inputs/stellar-transport-v2-lut.json | sha256sum -c -
          printf '%s  %s\n' "$SED_SHA256" review/asiv-matched-stellar-transport-v1/frozen-assets/pickles-sed-1nm.json | sha256sum -c -
          printf '%s  %s\n' "$JOHNSON_V_SHA256" review/asiv-matched-stellar-transport-v1/frozen-assets/johnson-v-1nm.json | sha256sum -c -
          UVSPEC="$(command -v uvspec)"
          test -n "$UVSPEC"
          printf '%s  %s\n' "$UVSPEC_SHA256" "$UVSPEC" | sha256sum -c -
          UVHELP_SHA="$(python - <<'PY'
          import hashlib,subprocess,shutil
          u=shutil.which('uvspec')
          r=subprocess.run([u,'-h'],capture_output=True,check=True)
          print(hashlib.sha256(r.stdout+r.stderr).hexdigest())
          PY
          )"
          test "$UVHELP_SHA" = "$UVSPEC_HELP_SHA256"
          PACKAGE_SPEC="$(python - <<'PY'
          import json,subprocess
          rows=json.loads(subprocess.check_output(['micromamba','list','--json'],text=True))
          matches=[r for r in rows if r.get('name')=='rubin-libradtran']
          if len(matches)!=1: raise SystemExit(f'expected one rubin-libradtran package; got {len(matches)}')
          r=matches[0]
          print(f"{r['name']}={r['version']}={r['build_string']}")
          PY
          )"
          test "$PACKAGE_SPEC" = 'rubin-libradtran=2.0.6=py312pl5321he9373c2_1'
          DATA_DIR="$(python - <<'PY'
          from pathlib import Path
          import shutil
          u=Path(shutil.which('uvspec')).resolve()
          for p in (u.parent.parent/'share'/'libRadtran'/'data', u.parent.parent/'data'):
              if p.is_dir():
                  print(p); break
          else:
              raise SystemExit('libRadtran data directory not found')
          PY
          )"
          test -d "$DATA_DIR"
          printf '%s  %s\n' "$AFGLUS_SHA256" "$DATA_DIR/atmmod/afglus.dat" | sha256sum -c -
          test -f "$DATA_DIR/solar_flux/atlas_plus_modtran"
          test -f experiments/aerosol-family-challenge-v2-r8/wavelength-grid-1nm.dat
          python -m unittest tests.test_native_stellar_zenith_v32 tests.test_native_stellar_zenith_v32_controller -v
          python "$STAGE_DIR/native_stellar_zenith_v32.py"
          echo "UVSPEC=$UVSPEC" >> "$GITHUB_ENV"
          echo "LIBRADTRAN_DATA=$DATA_DIR" >> "$GITHUB_ENV"

      - name: Execute frozen 100 training plus 64 protected holdout spectra exactly once
        id: science
        continue-on-error: true
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          test ! -e execution-output
          python "$STAGE_DIR/run_native_stellar_zenith_v32.py" \
            --root . \
            --source-runtime execution-inputs/stellar-transport-v2-lut.json \
            --uvspec "$UVSPEC" \
            --data-dir "$LIBRADTRAN_DATA" \
            --atmosphere-file "$LIBRADTRAN_DATA/atmmod/afglus.dat" \
            --wavelength-grid-file experiments/aerosol-family-challenge-v2-r8/wavelength-grid-1nm.dat \
            --sed-bundle review/asiv-matched-stellar-transport-v1/frozen-assets/pickles-sed-1nm.json \
            --johnson-v review/asiv-matched-stellar-transport-v1/frozen-assets/johnson-v-1nm.json \
            --output-dir execution-output

      - name: Preserve complete execution evidence before final gate
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-stellar-zenith-v32-result-${{ github.run_id }}
          path: execution-output/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0

      - name: Require frozen protected-holdout PASS without relaxation
        if: always()
        shell: bash
        env:
          SCIENCE_OUTCOME: ${{ steps.science.outcome }}
        run: |
          set -euo pipefail
          test "$SCIENCE_OUTCOME" = success
          test -f execution-output/stellar-transport-v32-zenith-lut.json
          test -f execution-output/native-stellar-zenith-v32-validation.json
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          v=json.load(open('execution-output/native-stellar-zenith-v32-validation.json'))
          r=Path('execution-output/stellar-transport-v32-zenith-lut.json')
          runtime=json.load(open(r))
          sha=hashlib.sha256(r.read_bytes()).hexdigest()
          if v.get('stageId')!='native-stellar-zenith-v3.2': raise SystemExit('stage drift')
          if v.get('status')!='COMPUTATIONAL_REFERENCE_VALIDATION_PASS': raise SystemExit('fresh v3.2 validation did not PASS')
          if v.get('extendedRuntimeSha256')!=sha: raise SystemExit('runtime SHA binding mismatch')
          if v.get('newTrainingSolverSpectrumCount')!=100: raise SystemExit('training count drift')
          if v.get('exactVerticalTrainingSpectrumCount')!=25: raise SystemExit('exact-vertical training count drift')
          if v.get('belowZenithSdisortTrainingSpectrumCount')!=75: raise SystemExit('below-zenith training count drift')
          if v.get('freshValidationAtmosphericSpectrumCount')!=64 or v.get('protectedHoldoutSdisortSpectrumCount')!=64: raise SystemExit('protected holdout count drift')
          if v.get('johnsonVComparisonCount')!=192: raise SystemExit('Johnson-V comparison count drift')
          if v.get('scientificSolverExecuted') is not True or v.get('solverInvocationCount')!=164: raise SystemExit('solver execution count evidence drift')
          if v.get('exactVerticalTrainingSolverInvocationCount')!=25: raise SystemExit('exact-vertical execution count drift')
          if v.get('belowZenithSdisortTrainingSolverInvocationCount')!=75: raise SystemExit('SDISORT training execution count drift')
          if v.get('protectedHoldoutSolverInvocationCount')!=64: raise SystemExit('holdout execution count drift')
          if v.get('randomNumbersUsed') is not False: raise SystemExit('random-number boundary drift')
          if v.get('overall',{}).get('maxAbsDeltaAvMagLimit')!=0.025: raise SystemExit('max gate drift')
          if v.get('overall',{}).get('rmsDeltaAvMagLimit')!=0.010: raise SystemExit('RMS gate drift')
          if v.get('overall',{}).get('passed') is not True: raise SystemExit('global gate failed')
          if not all(row.get('passed') is True for row in v.get('byValidationAltitudeDeg',{}).values()): raise SystemExit('per-altitude gate failed')
          proof=v.get('exactVerticalEndpointProof',{})
          if proof.get('analysisRunId')!=33041830554 or proof.get('analysisArtifactId')!=9634148868 or proof.get('passed') is not True: raise SystemExit('exact-vertical proof binding drift')
          if proof.get('analysisArtifactDigest')!='sha256:aa5b0b4a5b705bdcefd29c35113f331aa667b8dca9a2b228d44aa52ec864ca78': raise SystemExit('exact-vertical proof digest drift')
          if runtime.get('directOpticalDepth',[])[:675] != json.loads(Path('execution-inputs/stellar-transport-v2-lut.json').read_text())['directOpticalDepth']: raise SystemExit('old 5..80 domain changed')
          rep=runtime.get('representation',{})
          if rep.get('version')!='stellar-transport-v3.2-exact-vertical-endpoint' or rep.get('positiveEpsilonSubstitutionUsed') is not False: raise SystemExit('runtime endpoint representation drift')
          prov=runtime.get('provenance',{})
          if prov.get('exactVerticalOpticalColumnTrainingSpectrumCount')!=25 or prov.get('belowZenithSdisortTrainingSpectrumCount')!=75: raise SystemExit('runtime endpoint provenance drift')
          if prov.get('productionAuthorized') is not False: raise SystemExit('runtime production boundary drift')
          claim=v.get('claimBoundary',{})
          for key in ('productionAuthorized','empiricalRealSkyValidated','humanFirstSeeingValidated'):
              if claim.get(key) is not False: raise SystemExit(f'claim boundary drift: {key}')
          if claim.get('positiveEpsilonSubstitutionUsed') is not False: raise SystemExit('epsilon claim boundary drift')
          print(json.dumps({'status':v['status'],'runtimeSha256':sha,'overall':v['overall'],'byAltitude':v['byValidationAltitudeDeg'],'endpointProof':proof},sort_keys=True))
          PY
