name: Observation integration v1 synthetic contract

on:
  pull_request:
    paths:
      - ".github/workflows/observation-integration-v1-contract.yml"
      - "experiments/observation-integration-v1/**"
      - "tests/test_observation_integration_v1.py"
  push:
    branches:
      - "agent/**"
    paths:
      - ".github/workflows/observation-integration-v1-contract.yml"
      - "experiments/observation-integration-v1/**"
      - "tests/test_observation_integration_v1.py"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - name: Run observation and API tests
        run: PYTHONPATH=experiments/observation-integration-v1 python -m unittest -v tests/test_observation_integration_v1.py
      - name: Run synthetic observation to visibility demo
        run: |
          python experiments/observation-integration-v1/demo.py \
            --observation experiments/observation-integration-v1/observation.synthetic.json \
            --output observation-integration-artifact/demo-result.json
      - name: Prove no scientific provider is claimed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("observation-integration-artifact/demo-result.json").read_text())
          assert result["syntheticOnly"] is True
          assert result["visibility"]["syntheticOnly"] is True
          assert result["visibility"]["scientificVisibilityModelInstalled"] is False
          assert result["observationRole"] == "calibration"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: observation-integration-v1-synthetic-demo
          path: observation-integration-artifact
          if-no-files-found: error
          retention-days: 30
