name: OPAC 550nm RH optical-property source audit v1

on:
  pull_request:
    paths:
      - review/opac-550nm-rh-optics-source-audit-v1/**
      - .github/workflows/opac-550nm-rh-optics-source-audit-v1.yml

permissions:
  contents: read
  pull-requests: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      SOURCE_URL: https://www.libradtran.org/lib/exe/fetch.php?media=download%3Aoptprop_v2.1.tar.gz
      EXPECTED_UVSPEC_SHA256: 2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3
      EXPECTED_BASE_DATA_SHA256: ad30b49177e9c84e46497d69faf0c75e466996b0d0003f1de210289ae9f847d7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact review/source-audit identity
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_HEAD_REF" = review/opac-550nm-rh-optics-source-audit-v1
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          gh api "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}" > pr.json
          python - <<'PY'
          import json,os
          p=json.load(open('pr.json'))
          if p['state']!='open' or p['draft'] is not True or p['merged_at'] is not None: raise SystemExit('audit PR must remain Draft/open/unmerged')
          if p['head']['ref']!='review/opac-550nm-rh-optics-source-audit-v1' or p['head']['sha']!=os.environ['PR_HEAD']: raise SystemExit('audit head drift')
          if p['base']['ref']!='main' or p['base']['sha']!='99ade7798627e67921139697ba1a004fa8a304bb': raise SystemExit('audit base drift')
          PY
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: opac-550nm-rh-audit-v1
          create-args: -c conda-forge python=3.12.4 rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true
      - name: Verify locked runtime without invoking uvspec
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          mkdir -p evidence
          python -m py_compile review/opac-550nm-rh-optics-source-audit-v1/audit.py
          python - <<'PY'
          import netCDF4
          print('netCDF4', netCDF4.__version__)
          PY
          python experiments/mystic-batch-v1/runtime_probe.py --uvspec "$(command -v uvspec)" --data-dir "$CONDA_PREFIX/share/libRadtran/data" --atmosphere "$CONDA_PREFIX/share/libRadtran/data/atmmod/afglus.dat" --runtime-lock experiments/mystic-batch-v1/runtime-lock.micromamba.json --skip-help --output evidence/runtime-report.json
          python - <<'PY'
          import json,os
          x=json.load(open('evidence/runtime-report.json'))
          if x['uvspecSha256']!=os.environ['EXPECTED_UVSPEC_SHA256']: raise SystemExit('uvspec SHA drift')
          if x['libRadtranDataTreeSha256']!=os.environ['EXPECTED_BASE_DATA_SHA256']: raise SystemExit('base data-tree drift')
          if x['scientificSolverExecuted'] is not False or x['syntaxCheckExecuted'] is not False: raise SystemExit('runtime probe crossed no-solver boundary')
          PY
      - name: Audit exact official OPAC NetCDF structures and AFGL-US source
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-all-errors --max-time 2700 -o opac.tar.gz "$SOURCE_URL"
          python review/opac-550nm-rh-optics-source-audit-v1/audit.py --archive opac.tar.gz --afgl "$CONDA_PREFIX/share/libRadtran/data/atmmod/afglus.dat" --output audit-out | tee evidence/compact-summary.json
          cp audit-out/source-audit.json evidence/source-audit.json
          rm -rf audit-out opac.tar.gz
          python - <<'PY'
          import json
          x=json.load(open('evidence/source-audit.json'))
          if x['status']!='PASS_EXACT_OPAC_NETCDF_STRUCTURE_AND_AFGL_SOURCE_FROZEN': raise SystemExit('source audit did not pass')
          if x['uvspecInvoked'] is not False or x['scientificSolverExecuted'] is not False or x['scientificOrdinalAllocated'] is not False: raise SystemExit('source audit crossed boundary')
          if sorted(x['assets'])!=['INSO','SOOT','SUSO','WASO']: raise SystemExit('four-species asset set drift')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opac-550nm-rh-optics-source-audit-v1
          path: evidence/
          if-no-files-found: error
          compression-level: 0
