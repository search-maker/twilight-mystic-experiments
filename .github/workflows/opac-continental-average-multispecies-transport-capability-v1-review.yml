name: Review OPAC continental_average multispecies transport capability v1

on:
  pull_request:
    paths:
      - review/opac-continental-average-multispecies-transport-capability-v1/**
      - .github/recovery-templates/opac-continental-average-multispecies-transport-capability-v1.yml
      - .github/workflows/opac-continental-average-multispecies-transport-capability-v1-review.yml

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      V5_PR: '590'
      V5_REVIEW_HEAD: f0675ec48c637509cd7a5bb9c2a2746507e5bea8
      V5_RUN_ID: '33186446347'
      V5_ARTIFACT_ID: '9691923455'
      V5_ARTIFACT_DIGEST: sha256:fed6bb961088232e593159c4f50911758802e9209aed86e2a0eef4b403e4d9b7
      SOURCE_AUDIT_PR: '591'
      SOURCE_AUDIT_HEAD: 2bfae9341075eb04fe4621f4f53d4ab56262c22b
      SOURCE_AUDIT_RUN_ID: '33187119926'
      SOURCE_AUDIT_ARTIFACT_ID: '9692162280'
      SOURCE_AUDIT_ARTIFACT_DIGEST: sha256:cdcb0041a5197e31ff24520b3e653119d11c5d4a1c1b4f727e392ba7e719101e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Bind exact review-only identity and predecessor evidence
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_HEAD_REF" = review/opac-continental-average-multispecies-transport-capability-v1
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          test ! -e .github/workflows/opac-continental-average-multispecies-transport-capability-v1.yml
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}" > pr.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/$V5_PR" > v5-pr.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V5_RUN_ID" > v5-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V5_RUN_ID/artifacts" > v5-artifacts.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/$SOURCE_AUDIT_PR" > source-pr.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_AUDIT_RUN_ID" > source-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_AUDIT_RUN_ID/artifacts" > source-artifacts.json
          python - <<'PY'
          import json,os
          p=json.load(open('pr.json'))
          if p.get('state')!='open' or p.get('draft') is not True or p.get('merged_at') is not None: raise SystemExit('review PR must remain Draft/open/unmerged')
          if p['head']['ref']!='review/opac-continental-average-multispecies-transport-capability-v1' or p['head']['sha']!=os.environ['PR_HEAD']: raise SystemExit('review head drift')
          if p['base']['ref']!='main' or p['base']['sha']!='99ade7798627e67921139697ba1a004fa8a304bb': raise SystemExit('review base drift')
          vp=json.load(open('v5-pr.json')); vr=json.load(open('v5-run.json')); va=json.load(open('v5-artifacts.json'))['artifacts']
          if vp['state']!='open' or vp['draft'] is not True or vp['merged_at'] is not None or vp['head']['sha']!=os.environ['V5_REVIEW_HEAD']: raise SystemExit('v5 PR drift')
          if vr['id']!=int(os.environ['V5_RUN_ID']) or vr['run_attempt']!=1 or vr['conclusion']!='success': raise SystemExit('v5 run drift')
          vm=[a for a in va if a['id']==int(os.environ['V5_ARTIFACT_ID'])]
          if len(vm)!=1 or vm[0].get('digest')!=os.environ['V5_ARTIFACT_DIGEST'] or vm[0].get('expired'): raise SystemExit('v5 artifact drift')
          sp=json.load(open('source-pr.json')); sr=json.load(open('source-run.json')); sa=json.load(open('source-artifacts.json'))['artifacts']
          if sp['state']!='open' or sp['draft'] is not True or sp['merged_at'] is not None or sp['head']['sha']!=os.environ['SOURCE_AUDIT_HEAD']: raise SystemExit('source audit PR drift')
          if sr['id']!=int(os.environ['SOURCE_AUDIT_RUN_ID']) or sr['head_sha']!=os.environ['SOURCE_AUDIT_HEAD'] or sr['run_attempt']!=1 or sr['conclusion']!='success': raise SystemExit('source audit run drift')
          sm=[a for a in sa if a['id']==int(os.environ['SOURCE_AUDIT_ARTIFACT_ID'])]
          if len(sm)!=1 or sm[0].get('digest')!=os.environ['SOURCE_AUDIT_ARTIFACT_DIGEST'] or sm[0].get('expired'): raise SystemExit('source audit artifact drift')
          PY
      - name: Run solver-free multispecies code tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile review/opac-continental-average-multispecies-transport-capability-v1/build_inputs.py review/opac-continental-average-multispecies-transport-capability-v1/activation_support.py
          python - <<'PY'
          import hashlib,importlib.util,tempfile
          from pathlib import Path
          root=Path('review/opac-continental-average-multispecies-transport-capability-v1')
          def load(name,path):
              s=importlib.util.spec_from_file_location(name,path); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); return m
          b=load('mb',root/'build_inputs.py'); a=load('ma',root/'activation_support.py')
          assert b.STAGE_ID=='opac-continental-average-multispecies-transport-capability-v1'
          assert b.SPECIES==('INSO','WASO','SOOT','SUSO')
          assert b.PROFILE_MASS_WEIGHTS=={'INSO':0.25,'WASO':0.25,'SOOT':0.25,'SUSO':0.25}
          assert b.AOD550==0.10 and b.MYSTIC_SEED==730_194_613 and b.MYSTIC_PHOTONS==500_000
          heights=(20.0,12.0,8.0,4.0,2.0,1.0,0.0)
          lo=b.synthetic_density_shape(heights,'low'); hi=b.synthetic_density_shape(heights,'high')
          assert lo!=hi and lo[-1]>lo[2] and hi[2]>hi[-1]
          profile=b.render_species_profile(heights,'low')
          rows=[x for x in profile.splitlines() if x and not x.startswith('#')]
          assert all(len(x.split())==5 for x in rows)
          with tempfile.TemporaryDirectory() as td:
              data=Path(td)/'data'
              cont=data/b.CONTINENTAL_SOURCE_REL; cont.parent.mkdir(parents=True)
              header='# z(km) inso waso soot suso\n'
              numeric=''.join(f'{35-i:.1f} 1 2 3 4\n' for i in range(14))
              cont.write_text(header+numeric)
              b.EXPECTED_CONTINENTAL_SOURCE_SHA256=hashlib.sha256(cont.read_bytes()).hexdigest()
              assert b.verify_continental_average_source(data)['speciesColumns']==list(b.SPECIES)
              for species in b.SPECIES:
                  rel,_=b.SOURCE_ASSETS[species]; p=data/rel; p.parent.mkdir(parents=True,exist_ok=True); payload=(species+'-official').encode(); p.write_bytes(payload); b.SOURCE_ASSETS[species]=(rel,hashlib.sha256(payload).hexdigest())
              aliases=b.prepare_species_aliases(data)
              assert aliases['allByteIdentical'] and len(aliases['aliases'])==4
              for species in b.SPECIES: assert (data/b.ALIAS_TARGETS[species]).is_file()
          with tempfile.TemporaryDirectory() as td:
              d=Path(td); low=d/'low'; high=d/'high'; low.write_text('540 1\n541 2\n'); high.write_text('540 1.1\n541 2.2\n')
              assert a.validate_output_pair(low,high,'TEST')['outputsDiffer']
          base={'uvspecSha256':a.EXPECTED_UVSPEC_SHA256,'libRadtranDataTreeSha256':a.EXPECTED_BASE_DATA_SHA256}
          pre={'libRadtranDataTreeSha256':a.EXPECTED_STAGED_DATA_SHA256,'libRadtranDataFileCount':10,'libRadtranDataByteCount':100}
          aliases=[]; total=0
          for species,want in a.EXPECTED_SPECIES_SHA256.items():
              n=10; total+=n; aliases.append({'species':species,'sourceSha256':want,'aliasSha256':want,'aliasRelativePath':a.EXPECTED_ALIAS_PATHS[species],'byteIdentical':True,'byteCount':n})
          am={'status':'FOUR_BYTE_IDENTICAL_NO_EXTENSION_OPAC_ALIASES_CREATED','species':list(a.EXPECTED_SPECIES_SHA256),'aliases':aliases,'allByteIdentical':True}
          post={'libRadtranDataTreeSha256':'post','libRadtranDataFileCount':14,'libRadtranDataByteCount':100+total}
          assert a.validate_runtime_reports(base,pre,post,am)['status']=='POST_FOUR_NO_EXTENSION_ALIASES_RUNTIME_PROVENANCE_VALIDATED'
          print('multispecies solver-free tests: PASS')
          PY
      - name: Prove capability-only scope and inactive activation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          b=Path('review/opac-continental-average-multispecies-transport-capability-v1/build_inputs.py').read_text()
          a=Path('review/opac-continental-average-multispecies-transport-capability-v1/activation_support.py').read_text()
          p=Path('review/opac-continental-average-multispecies-transport-capability-v1/PROTOCOL.md').read_text()
          w=Path('.github/recovery-templates/opac-continental-average-multispecies-transport-capability-v1.yml').read_text()
          for token in ('SPECIES = ("INSO", "WASO", "SOOT", "SUSO")','aerosol_species_file {profile_path.resolve()} {\' \'.join(SPECIES)}','"scientificOrdinalAllocated": False','"humidityInterpretationAuthorized": False'):
              if token not in b: raise SystemExit(f'builder freeze missing {token}')
          for token in ('PASS_FOUR_CONTINENTAL_SPECIES_REACH_DISORT_AND_MYSTIC','EXPECTED_SPECIES_SHA256','SOURCE_AUDIT_RUN_ID = 33187119926','V5_RUN_ID = 33186446347'):
              if token not in a: raise SystemExit(f'activation-support freeze missing {token}')
          for token in ('NO SCIENTIFIC ORDINAL','INSO WASO SOOT SUSO','equal positive mass weight `0.25`','ordinal 41 remains unallocated','no claim about scientifically correct humidity treatment'):
              if token.lower() not in p.lower(): raise SystemExit(f'protocol freeze missing {token}')
          for token in ('status/opac-continental-average-multispecies-transport-capability-v1','REQUEST_ONE_SHOT_OPAC_CONTINENTAL_AVERAGE_MULTISPECIES_CAPABILITY_V1','33186446347','33187119926','PASS_FOUR_CONTINENTAL_SPECIES_REACH_DISORT_AND_MYSTIC'):
              if token not in w: raise SystemExit(f'inactive workflow freeze missing {token}')
          if 'workflow_dispatch:' in w: raise SystemExit('manual dispatch forbidden')
          if 'aerosol_file tau' in b: raise SystemExit('competing aerosol_file tau leaked into builder')
          PY
      - name: Freeze solver-free review receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir review-receipt
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          def blob(path):
              b=Path(path).read_bytes(); return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          out={
            'schemaVersion':1,'stageId':'opac-continental-average-multispecies-transport-capability-v1-review',
            'status':'REVIEW_PASS_FOUR_SPECIES_CAPABILITY_INACTIVE_NO_LIBRADTRAN_EXECUTION',
            'reviewHead':os.environ['PR_HEAD'],'workflowRunId':int(os.environ['GITHUB_RUN_ID']),'workflowRunAttempt':1,
            'builderGitBlobSha1':blob('review/opac-continental-average-multispecies-transport-capability-v1/build_inputs.py'),
            'activationSupportGitBlobSha1':blob('review/opac-continental-average-multispecies-transport-capability-v1/activation_support.py'),
            'protocolGitBlobSha1':blob('review/opac-continental-average-multispecies-transport-capability-v1/PROTOCOL.md'),
            'inactiveWorkflowGitBlobSha1':blob('.github/recovery-templates/opac-continental-average-multispecies-transport-capability-v1.yml'),
            'v5RunId':int(os.environ['V5_RUN_ID']),'v5ArtifactId':int(os.environ['V5_ARTIFACT_ID']),'v5ArtifactDigest':os.environ['V5_ARTIFACT_DIGEST'],
            'sourceAuditRunId':int(os.environ['SOURCE_AUDIT_RUN_ID']),'sourceAuditArtifactId':int(os.environ['SOURCE_AUDIT_ARTIFACT_ID']),'sourceAuditArtifactDigest':os.environ['SOURCE_AUDIT_ARTIFACT_DIGEST'],
            'species':['INSO','WASO','SOOT','SUSO'],'libRadtranExecuted':False,'mysticExecuted':False,'scientificOrdinalAllocated':False,'taylorOrJerusalemUsed':False,'productionAuthorized':False,'activationAuthorizedByReview':False,
          }
          raw=json.dumps(out,sort_keys=True,separators=(',',':'),allow_nan=False).encode(); out['contentSha256']=hashlib.sha256(raw).hexdigest()
          Path('review-receipt/review.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: opac-continental-average-multispecies-transport-capability-v1-review, path: review-receipt/, if-no-files-found: error, compression-level: 0}
