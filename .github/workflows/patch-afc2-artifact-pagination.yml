name: Patch AFC2 artifact pagination

on:
  push:
    branches:
      - "fix/aerosol-family-v2-artifact-pagination"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Apply exact pagination-only workflow patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/aerosol-family-v2-execution.yml')
          s=p.read_text()
          replacements={
          '''gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${REVIEW_RUN_ID}/artifacts?per_page=100" > auth-review-artifacts.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          rows=json.loads(Path('auth-review-artifacts.json').read_text()).get('artifacts',[])''': '''gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${REVIEW_RUN_ID}/artifacts?per_page=100" > auth-review-artifact-pages.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          pages=json.loads(Path('auth-review-artifact-pages.json').read_text())
          rows=[a for page in pages for a in page.get('artifacts',[])]''',
          '''gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" > current-run-artifacts.json
          ARTIFACT_ID="$(python - <<'PY'
          import json, os
          rows=json.load(open('current-run-artifacts.json')).get('artifacts',[])''': '''gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" > current-run-artifact-pages.json
          ARTIFACT_ID="$(python - <<'PY'
          import json, os
          pages=json.load(open('current-run-artifact-pages.json'))
          rows=[a for page in pages for a in page.get('artifacts',[])]'''
          }
          changed=0
          for old,new in replacements.items():
              n=s.count(old)
              if n==1:
                  s=s.replace(old,new); changed+=1
              elif n==0 and new in s:
                  pass
              else:
                  raise SystemExit(f'unexpected replacement count {n}')
          p.write_text(s)
          print(f'changed_blocks={changed}')
          PY
          git diff --check
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/aerosol-family-v2-execution.yml
          git commit -m "Fix AFC2 artifact pagination"
          git push origin HEAD:fix/aerosol-family-v2-artifact-pagination
