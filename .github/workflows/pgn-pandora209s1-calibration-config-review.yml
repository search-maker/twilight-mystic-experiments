name: PGN Pandora209s1 calibration configuration review

on:
  pull_request:
    paths:
      - ".github/workflows/pgn-pandora209s1-calibration-config-review.yml"
      - "review/empirical-twilight-radiance-source-admission-v1/PGN_PANDORA209S1_CALIBRATION_FILE_CONTENT_PRECONTRACT.review.json"

permissions:
  contents: read

jobs:
  calibration-configuration-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch exact public Pandora209s1 calibration configuration files only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from urllib.parse import urlparse
          from urllib.request import Request, urlopen

          base = 'https://data.hetzner.pandonia-global-network.org/calibrationfiles/'
          expected_host = 'data.hetzner.pandonia-global-network.org'
          filenames = [
              'Pandora209s1_CF_v1d20220309.txt',
              'Pandora209s1_CF_v1d20220324.txt',
              'Pandora209s1_CF_v4d20221111.txt',
              'Pandora209s1_CF_v5d20220720.txt',
              'Pandora209s1_CF_v8d20230220.txt',
          ]
          outdir = Path('pandora209s1_calibrationfiles')
          outdir.mkdir(exist_ok=True)
          manifest = []

          for filename in filenames:
              if '/' in filename or '\\' in filename:
                  raise SystemExit(f'unsafe calibration filename: {filename!r}')
              url = base + filename
              request = Request(
                  url,
                  headers={
                      'Accept': 'text/plain,application/octet-stream;q=0.8',
                      'User-Agent': 'starsvisibility-blind-calibration-config-metadata-v1',
                  },
                  method='GET',
              )
              with urlopen(request, timeout=30) as response:
                  final_url = response.geturl()
                  content_type = response.headers.get_content_type()
                  raw = response.read()

              parsed = urlparse(final_url)
              if final_url != url:
                  raise SystemExit(f'unexpected calibration-file redirect: {final_url}')
              if parsed.scheme != 'https' or parsed.netloc != expected_host:
                  raise SystemExit(f'unexpected calibration-file host: {parsed.netloc}')
              if not parsed.path.startswith('/calibrationfiles/'):
                  raise SystemExit(f'unexpected calibration-file path: {parsed.path}')
              # Transport-only sanity guard. This is not a calibration-value filter:
              # every one of the five pre-frozen exact files must be retrieved or the job fails.
              if len(raw) > 20_000_000:
                  raise SystemExit(f'calibration configuration unexpectedly large: {filename} {len(raw)} bytes')

              path = outdir / filename
              path.write_bytes(raw)
              manifest.append({
                  'filename': filename,
                  'url': url,
                  'finalUrl': final_url,
                  'contentType': content_type,
                  'byteCount': len(raw),
                  'sha256': hashlib.sha256(raw).hexdigest(),
              })

          evidence = {
              'sourceDirectory': base,
              'files': manifest,
              'calibrationConfigurationGetPerformed': True,
              'measurementFileRequested': False,
              's2FilenameGuessedOrRequested': False,
              'v1DownloadUsed': False,
              'targetDataOpened': False,
          }
          Path('pandora209s1_calibrationfiles_manifest.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print('PGN_PANDORA209S1_CALIBRATION_CONFIG_MANIFEST_BEGIN')
          print(json.dumps(evidence, indent=2, sort_keys=True))
          print('PGN_PANDORA209S1_CALIBRATION_CONFIG_MANIFEST_END')
          PY

          sha256sum pandora209s1_calibrationfiles_manifest.json > pandora209s1_calibrationfiles_manifest.sha256
          cat pandora209s1_calibrationfiles_manifest.sha256

      - name: Prove no measurement file or s2 guess was used
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          e = json.loads(Path('pandora209s1_calibrationfiles_manifest.json').read_text())
          assert e['calibrationConfigurationGetPerformed'] is True
          assert len(e['files']) == 5
          assert e['measurementFileRequested'] is False
          assert e['s2FilenameGuessedOrRequested'] is False
          assert e['v1DownloadUsed'] is False
          assert e['targetDataOpened'] is False
          print('Calibration review remained public-config-only')
          PY

      - name: Upload immutable calibration configuration evidence
        uses: actions/upload-artifact@v4
        with:
          name: pandora209s1-calibration-configuration-only
          path: |
            pandora209s1_calibrationfiles/
            pandora209s1_calibrationfiles_manifest.json
            pandora209s1_calibrationfiles_manifest.sha256
          if-no-files-found: error
          retention-days: 30
