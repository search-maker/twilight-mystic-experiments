name: Publish ASIV matched-stellar v2 runtime assets

on:
  pull_request:
    paths:
      - '.github/workflows/publish-asiv-matched-stellar-v2-runtime-assets.yml'

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TRAINING_ARTIFACT_ID: '9580080568'
      TRAINING_ARTIFACT_DIGEST: 'bccc9f58a649202c395842df298ace1c4f609badc0d0530e40ba10d8ddc5300f'
      TRAINING_JSON_SHA256: '75d7f64e8dd753070b65ef1bc10a507f3bfb2c9a6123e009b476379e88f4a0ab'
      V2_VALIDATION_ARTIFACT_ID: '9590314049'
      V2_VALIDATION_ARTIFACT_DIGEST: '785cc3c37835aaa47a63d6aa50b16234317ba137ab9dc144e412ea75077756cc'
      V2_VALIDATION_JSON_SHA256: '1d7cd3e7c2a75819935e2d131c94047a20994390102c01bafccc74bce5265b78'

    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          persist-credentials: true

      - name: Require clean one-shot publisher proposal
        shell: bash
        run: |
          set -euo pipefail
          test "$(git status --porcelain | wc -l)" -eq 0
          test ! -e generated/asiv-matched-stellar-v2-runtime/manifest.json

      - name: Download and verify opened training and fresh-v2 evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/matched-stellar-assets"
          cd "$RUNNER_TEMP/matched-stellar-assets"
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${TRAINING_ARTIFACT_ID}/zip" > training.zip
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V2_VALIDATION_ARTIFACT_ID}/zip" > validation-v2.zip
          printf '%s  %s\n' "$TRAINING_ARTIFACT_DIGEST" training.zip | sha256sum -c -
          printf '%s  %s\n' "$V2_VALIDATION_ARTIFACT_DIGEST" validation-v2.zip | sha256sum -c -
          unzip -q training.zip -d training
          unzip -q validation-v2.zip -d validation-v2
          printf '%s  %s\n' "$TRAINING_JSON_SHA256" training/matched-stellar-final-validation-recovery-v5.json | sha256sum -c -
          printf '%s  %s\n' "$V2_VALIDATION_JSON_SHA256" validation-v2/matched-stellar-v2-fresh-validation.json | sha256sum -c -

      - name: Extract exact four-family training LUTs under v2 PASS binding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'matched-stellar-assets'
          training_path = root / 'training' / 'matched-stellar-final-validation-recovery-v5.json'
          validation_path = root / 'validation-v2' / 'matched-stellar-v2-fresh-validation.json'
          training = json.loads(training_path.read_text())
          validation = json.loads(validation_path.read_text())

          if validation.get('status') != 'COMPUTATIONAL_REFERENCE_VALIDATION_PASS' or validation.get('allFamiliesPassed') is not True:
              raise SystemExit('fresh v2 evidence is not an all-family PASS')
          expected_families = [
              'opac-continental-average',
              'opac-maritime-clean',
              'opac-desert',
              'opac-desert-spheroids',
          ]
          family_results = validation.get('familyResults', {})
          if set(family_results) != set(expected_families):
              raise SystemExit(f'unexpected v2 family set: {sorted(family_results)}')
          for family in expected_families:
              row = family_results[family]
              vals = [s['deltaAvMag'] for case in row['cases'] for s in case['sedComparisons']]
              if len(vals) != 576:
                  raise SystemExit(f'{family}: expected 576 v2 comparisons, got {len(vals)}')
              max_abs = max(abs(v) for v in vals)
              rms = (sum(v*v for v in vals)/len(vals))**0.5
              if max_abs > 0.025 or rms > 0.010:
                  raise SystemExit(f'{family}: v2 gate unexpectedly failed: max={max_abs} rms={rms}')

          runtime_luts = training.get('runtimeLuts')
          if not isinstance(runtime_luts, dict) or set(runtime_luts) != set(expected_families):
              raise SystemExit('training runtimeLuts family set mismatch')

          out_dir = Path('generated/asiv-matched-stellar-v2-runtime')
          out_dir.mkdir(parents=True, exist_ok=False)
          assets = {}
          for family in expected_families:
              lut = runtime_luts[family]
              axes = lut.get('axes', {})
              if len(axes.get('targetAltitudeDeg', [])) != 27:
                  raise SystemExit(f'{family}: target-altitude knot count mismatch')
              if len(axes.get('observerElevationM', [])) != 5 or len(axes.get('aod550', [])) != 5:
                  raise SystemExit(f'{family}: elevation/AOD knot count mismatch')
              spectra = lut.get('directOpticalDepth')
              if not isinstance(spectra, list) or len(spectra) != 675:
                  raise SystemExit(f'{family}: expected 675 training spectra')
              if any(not isinstance(row, list) or len(row) != 401 for row in spectra):
                  raise SystemExit(f'{family}: expected 401 samples per spectrum')

              payload = {
                  'schemaVersion': 2,
                  'quantity': 'asiv-matched-stellar-v2-direct-optical-depth-training-lut',
                  'aerosolFamily': family,
                  'interpolationMethod': {
                      'targetAltitudeCoordinate': 'csc(targetAltitudeDeg)',
                      'targetAltitudeInterpolation': 'PCHIP_Fritsch_Butland_weighted_harmonic_with_one_sided_endpoint_limiter',
                      'observerElevationInterpolation': 'linear',
                      'aod550Interpolation': 'linear',
                      'interpolatedQuantity': 'directOpticalDepth',
                      'extrapolation': 'forbidden',
                  },
                  'freshValidationBinding': {
                      'runId': 32921981013,
                      'runAttempt': 1,
                      'artifactId': int(os.environ['V2_VALIDATION_ARTIFACT_ID']),
                      'artifactDigest': 'sha256:' + os.environ['V2_VALIDATION_ARTIFACT_DIGEST'],
                      'jsonSha256': os.environ['V2_VALIDATION_JSON_SHA256'],
                      'maxAbsDeltaAvMagLimit': 0.025,
                      'rmsDeltaAvMagLimit': 0.010,
                      'comparisonsForFamily': 576,
                  },
                  'trainingSourceBinding': {
                      'runId': 32889328517,
                      'artifactId': int(os.environ['TRAINING_ARTIFACT_ID']),
                      'artifactDigest': 'sha256:' + os.environ['TRAINING_ARTIFACT_DIGEST'],
                      'jsonSha256': os.environ['TRAINING_JSON_SHA256'],
                      'trainingSolverRunsExecutedForV2': 0,
                  },
                  'wavelengthNm': lut.get('wavelengthNm'),
                  'axes': axes,
                  'directOpticalDepth': spectra,
                  'atmosphereContract': lut.get('atmosphereContract'),
                  'sourceRuntimeProvenance': lut.get('provenance'),
                  'claimBoundary': {
                      'computationalReferenceValidationOnly': True,
                      'fullSpectrumSkyValidated': False,
                      'measuredRealSkyValidated': False,
                      'humanFirstSeeingValidated': False,
                      'productionAuthorized': False,
                      'pandoraOpened': False,
                  },
              }
              raw = (json.dumps(payload, separators=(',', ':'), sort_keys=True) + '\n').encode()
              path = out_dir / f'{family}.json'
              path.write_bytes(raw)
              assets[family] = {
                  'path': str(path),
                  'sha256': hashlib.sha256(raw).hexdigest(),
                  'bytes': len(raw),
                  'trainingSpectra': 675,
                  'wavelengthSamples': 401,
              }

          manifest = {
              'schemaVersion': 1,
              'status': 'ASIV_MATCHED_STELLAR_V2_RUNTIME_ASSETS_EXTRACTED_FROM_VALIDATED_EVIDENCE',
              'method': 'PCHIP_csc_altitude_linear_elevation_linear_AOD_direct_optical_depth',
              'families': assets,
              'freshValidationRunId': 32921981013,
              'freshValidationArtifactId': int(os.environ['V2_VALIDATION_ARTIFACT_ID']),
              'freshValidationArtifactDigest': 'sha256:' + os.environ['V2_VALIDATION_ARTIFACT_DIGEST'],
              'freshValidationJsonSha256': os.environ['V2_VALIDATION_JSON_SHA256'],
              'trainingArtifactId': int(os.environ['TRAINING_ARTIFACT_ID']),
              'trainingArtifactDigest': 'sha256:' + os.environ['TRAINING_ARTIFACT_DIGEST'],
              'trainingJsonSha256': os.environ['TRAINING_JSON_SHA256'],
              'newSolverExecutionPerformed': False,
              'postResultRetuningPerformed': False,
              'productionAuthorized': False,
          }
          manifest_raw = (json.dumps(manifest, indent=2, sort_keys=True) + '\n').encode()
          (out_dir / 'manifest.json').write_bytes(manifest_raw)
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Verify no scientific or control source was changed
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain --untracked-files=all | awk '{print $2}')"
          printf '%s\n' "$changed"
          test -n "$changed"
          if printf '%s\n' "$changed" | grep -Ev '^generated/asiv-matched-stellar-v2-runtime/'; then
            echo 'Unexpected generated change outside runtime asset directory' >&2
            exit 1
          fi

      - name: Commit exact generated assets to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated/asiv-matched-stellar-v2-runtime
          git commit -m 'Publish validated ASIV matched-stellar v2 runtime assets'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Record safety boundary
        shell: bash
        run: |
          printf '%s\n' \
            'solverExecution=false' \
            'postResultRetuning=false' \
            'pandoraOpened=false' \
            'productionAuthorized=false'
