name: AFC2 R8 cancelled-job detail observer

on:
  push:
    branches:
      - status/r8-cancel-observer-v2

permissions:
  actions: read
  checks: read
  contents: write

jobs:
  observe-detail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout neutral result branch
        uses: actions/checkout@v4
        with:
          ref: status/r8-cancel-observer-v2-result
          fetch-depth: 1

      - name: Collect cancelled-job detail
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_JOB: '96669314294'
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          out="observer-result-v2"
          mkdir -p "$out"

          gh api "repos/$repo/actions/jobs/$TARGET_JOB" > "$out/cancelled-job-raw.json"
          jq '{id,name,status,conclusion,started_at,completed_at,runner_name,check_run_url,steps:[.steps[] | {number,name,status,conclusion,started_at,completed_at}]}' \
            "$out/cancelled-job-raw.json" > "$out/cancelled-job-detail.json"

          check_url="$(jq -r '.check_run_url // empty' "$out/cancelled-job-raw.json")"
          if [ -n "$check_url" ]; then
            gh api "$check_url" > "$out/cancelled-job-check-run.json"
            annotations_url="$(jq -r '.output.annotations_url // empty' "$out/cancelled-job-check-run.json")"
            if [ -n "$annotations_url" ]; then
              gh api -X GET -f per_page=100 "$annotations_url" > "$out/cancelled-job-annotations.json" || true
            fi
          fi

          set +e
          gh api "repos/$repo/actions/jobs/$TARGET_JOB/logs" > "$out/cancelled-job.log" 2> "$out/cancelled-job-log-fetch.err"
          log_rc=$?
          set -e
          printf '%s\n' "$log_rc" > "$out/cancelled-job-log-fetch.rc"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$out"
          if git diff --cached --quiet; then
            echo "No detail changes"
          else
            git commit -m "Record R8 cancelled-job detail"
            git push origin HEAD:refs/heads/status/r8-cancel-observer-v2-result
          fi
