name: R8 recovery neutral observer current

on:
  push:
    branches:
      - status/r8-recovery-observer-current

permissions:
  contents: write
  actions: read
  pull-requests: read

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read exact recovery run surface only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BRANCH: dispatch/aerosol-family-challenge-v2-r8-timeout-recovery-v1-ordinal-35
          EXPECTED_HEAD: b37aab8fd2c2f0a6b58eef79a00811c9adea02a0
        run: |
          set -euo pipefail
          mkdir -p observer-current
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/aerosol-family-v2-r8-timeout-recovery-v1-execution.yml/runs?event=workflow_dispatch&per_page=100" > observer-current/science-run-pages.json
          gh api "repos/${GITHUB_REPOSITORY}/branches/main" > observer-current/main.json
          gh api "repos/${GITHUB_REPOSITORY}/pulls/291" > observer-current/pr291.json
          gh api "repos/${GITHUB_REPOSITORY}/pulls/285" > observer-current/pr285.json
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          root=Path('observer-current')
          pages=json.loads((root/'science-run-pages.json').read_text())
          runs=[r for page in pages for r in page.get('workflow_runs',[])]
          exact=[r for r in runs if r.get('head_branch')==os.environ['EXPECTED_BRANCH'] and r.get('head_sha')==os.environ['EXPECTED_HEAD'] and r.get('event')=='workflow_dispatch']
          if len(exact)>1:
              raise SystemExit(f'refuse: expected at most one exact recovery science run, got {len(exact)}')
          summary={
              'schemaVersion':1,
              'observerPurpose':'neutral read-only AFC2 R8 timeout-recovery status; no result channels downloaded or interpreted',
              'expectedBranch':os.environ['EXPECTED_BRANCH'],
              'expectedHead':os.environ['EXPECTED_HEAD'],
              'exactScienceRunCount':len(exact),
              'main':json.loads((root/'main.json').read_text()),
              'pr291':json.loads((root/'pr291.json').read_text()),
              'pr285':json.loads((root/'pr285.json').read_text()),
          }
          if exact:
              run=exact[0]
              run_id=int(run['id'])
              subprocess.run(['gh','api','--paginate','--slurp',f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{run_id}/jobs?filter=all&per_page=100'],check=True,stdout=(root/'job-pages.json').open('w'))
              subprocess.run(['gh','api','--paginate','--slurp',f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{run_id}/artifacts?per_page=100'],check=True,stdout=(root/'artifact-pages.json').open('w'))
              job_pages=json.loads((root/'job-pages.json').read_text())
              jobs=[j for page in job_pages for j in page.get('jobs',[])]
              artifact_pages=json.loads((root/'artifact-pages.json').read_text())
              artifacts=[a for page in artifact_pages for a in page.get('artifacts',[])]
              by_conclusion={}
              by_status={}
              for j in jobs:
                  by_status[str(j.get('status'))]=by_status.get(str(j.get('status')),0)+1
                  by_conclusion[str(j.get('conclusion'))]=by_conclusion.get(str(j.get('conclusion')),0)+1
              summary['run']={k:run.get(k) for k in ('id','name','status','conclusion','run_attempt','event','head_branch','head_sha','created_at','run_started_at','updated_at')}
              summary['jobs']={
                  'total':len(jobs),
                  'byStatus':by_status,
                  'byConclusion':by_conclusion,
                  'rows':[{k:j.get(k) for k in ('id','name','status','conclusion','started_at','completed_at')} for j in jobs],
              }
              summary['artifacts']={
                  'total':len(artifacts),
                  'rows':[{k:a.get(k) for k in ('id','name','size_in_bytes','digest','expired','created_at')} for a in artifacts],
              }
          (root/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          PY
      - name: Publish neutral observer snapshot on result branch
        shell: bash
        run: |
          set -euo pipefail
          cp observer-current/summary.json /tmp/r8-recovery-observer-summary.json
          git fetch origin main
          git switch -C status/r8-recovery-observer-current-result origin/main
          mkdir -p observer-current
          cp /tmp/r8-recovery-observer-summary.json observer-current/summary.json
          git add observer-current/summary.json
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -m "Record neutral R8 recovery observer snapshot"
          git push origin HEAD:refs/heads/status/r8-recovery-observer-current-result
