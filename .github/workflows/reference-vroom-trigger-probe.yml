name: Reference VROOM trigger probe

on:
  push:
    branches:
      - probe/reference-vroom-trigger-v1
    paths:
      - probes/reference-vroom-trigger-v1.txt

permissions:
  contents: read

jobs:
  record-trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Print immutable trigger identity
        run: |
          printf 'event=%s\n' '${{ github.event_name }}'
          printf 'ref=%s\n' '${{ github.ref }}'
          printf 'ref_name=%s\n' '${{ github.ref_name }}'
          printf 'sha=%s\n' '${{ github.sha }}'
          printf 'repository=%s\n' '${{ github.repository }}'
