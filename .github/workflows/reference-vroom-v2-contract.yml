name: Reference VROOM v2 execution package contract

on:
  pull_request:
    paths:
      - "experiments/reference-vroom-v2/**"
      - ".github/workflows/reference-vroom-*.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"

      - name: Verify frozen package and disabled authorization
        shell: python
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path('.')
          v2 = root / 'experiments/reference-vroom-v2'
          prereg = json.loads((v2 / 'preregistration.json').read_text())
          auth = json.loads((v2 / 'authorization.json').read_text())

          assert prereg['stageId'] == 'reference-vroom-v2'
          assert prereg['status'] == 'PREREGISTERED_NOT_AUTHORIZED'
          assert prereg['scientificDesignChanged'] is False
          assert prereg['productionBehaviorChanged'] is False
          transport = prereg['transportContract']
          assert transport['event'] == 'workflow_dispatch'
          assert transport['requiredExecutionKey'] == 'reference-vroom-v2'
          assert transport['maximumDispatchesThatMayReachSolver'] == 1
          assert transport['requiredRunAttempt'] == 1
          assert transport['rerunAllowed'] is False
          assert transport['resumeAllowed'] is False
          assert transport['authorizationReuseAllowed'] is False
          assert transport['duplicateMustRefuseBeforeSyntaxOrSolver'] is True
          assert transport['authorizationCurrentlyEnabled'] is False

          assert auth == {
              'schemaVersion': 1,
              'stageId': 'reference-vroom-v2',
              'authorized': False,
              'runMystic': False,
              'runUvspec': False,
              'scientificDiagnostic': False,
              'successDoesNotAuthorizeProduction': True,
              'executionKey': 'reference-vroom-v2',
              'exactAuthorizationParentCommit': None,
              'exactAuthorizationCommit': None,
              'authorizationOrdinal': 0,
              'consumed': False,
              'note': 'Preparation only. This file does not authorize a dispatch or any scientific execution.',
          }

          expected_hashes = {
              'experiments/reference-vroom-v1/runner.py': '462fad44ad9924a95dcc92544564467678d792afaacb26acf0264c25171f2af1',
              'experiments/reference-vroom-v1/audit.py': 'e12d7bef82fd4f725736fa7183f76993b73a98ace6271959729ff65c15784c10',
              'experiments/reference-vroom-v1/preregistration.json': '8fd87715eed5d192df2b7fe0718d4e94c1a2e8ad1a75f23fbf9d7a4522cfb5b6',
              'experiments/reference-vroom-v1/contract.json': 'b562b89a3cc0e867395829ac6a5201ca57d4e4325fb55da5e0050399a847e7c1',
              'experiments/reference-vroom-v1/frozen-comparators.zlib.b64': '7678ae3f6a9a0199f3ab31556cdbd1ade579dae23e9a21915ae08a8cc59cfcfb',
              'experiments/reference-vroom-v1/wavelength-grid.dat': '2f2fb3c9bf0002bdbe7d97f36e100f4334a40ac8fcfd7e5d6a98306de2cead23',
              'experiments/reference-vroom-v1/authorization-template.json': '6e15ff7723369d30bb0188bfb3ca1643fcc12c98182daf9dd25e01a52fac7ff9',
              '.github/workflows/reference-vroom-execution.yml': 'c3493a855e9dfb97309b941dfec0988bbae71240f07a893856ff872a1400ef74',
          }
          for path, expected in expected_hashes.items():
              actual = hashlib.sha256((root / path).read_bytes()).hexdigest()
              assert actual == expected, (path, actual, expected)

          required = [
              v2 / 'runner_adapter.py',
              v2 / 'duplicate_run_audit.py',
              root / '.github/workflows/reference-vroom-v2-execution.yml',
          ]
          assert all(path.is_file() for path in required)

          gate = (root / '.github/workflows/reference-vroom-v2-execution.yml').read_text()
          assert gate.count('workflow_dispatch:') == 1
          assert '\n  push:' not in gate
          required_gate_tokens = [
              'name: Reference VROOM v2 one-shot execution',
              'run-name: Reference VROOM v2 | key=',
              'cancel-in-progress: false',
              'GITHUB_RUN_ATTEMPT',
              'REFUSED_BEFORE_SYNTAX_OR_SOLVER',
              'id: authorization-guard',
              'id: duplicate-run-audit',
              'id: verify-package',
              'mamba-org/setup-micromamba@v2',
              'id: runtime-identity',
              'id: scientific-run',
              'experiments/reference-vroom-v2/runner_adapter.py',
              'experiments/reference-vroom-v2/duplicate_run_audit.py',
              '--allow-execution',
          ]
          for token in required_gate_tokens:
              assert token in gate, token
          positions = [
              gate.index('id: authorization-guard'),
              gate.index('id: duplicate-run-audit'),
              gate.index('id: verify-package'),
              gate.index('mamba-org/setup-micromamba@v2'),
              gate.index('id: runtime-identity'),
              gate.index('id: scientific-run'),
          ]
          assert positions == sorted(positions), positions

          adapter = (v2 / 'runner_adapter.py').read_text()
          for token in [
              'V1_RUNNER',
              'importlib.util.spec_from_file_location',
              'verify_authorization_v2',
              'authorizationOrdinal',
              "changed != [AUTHORIZATION_PATH]",
              'package_hashes',
              'module.main()',
          ]:
              assert token in adapter, token

          duplicate = (v2 / 'duplicate_run_audit.py').read_text()
          for token in [
              'actions/workflows',
              'event=workflow_dispatch',
              'display_title',
              'run_attempt',
              'prior workflow run already used this one-shot marker',
              'REFUSED_BEFORE_SYNTAX_OR_SOLVER',
          ]:
              assert token in duplicate, token

          base = os.environ['BASE_REF']
          changed = sorted(subprocess.check_output(
              ['git', 'diff', '--name-only', f'origin/{base}...HEAD'],
              text=True,
          ).splitlines())
          package_scope = sorted([
              '.github/workflows/reference-vroom-contract.yml',
              '.github/workflows/reference-vroom-v2-contract.yml',
              '.github/workflows/reference-vroom-v2-execution.yml',
              'experiments/reference-vroom-v2/duplicate_run_audit.py',
              'experiments/reference-vroom-v2/runner_adapter.py',
          ])
          proposal_scope = sorted([
              '.github/workflows/reference-vroom-v2-authorization-proposal-contract.yml',
              '.github/workflows/reference-vroom-v2-contract.yml',
              'experiments/reference-vroom-v2/authorization-proposal.json',
          ])
          assert changed in (package_scope, proposal_scope), changed
          if changed == proposal_scope:
              proposal = json.loads((v2 / 'authorization-proposal.json').read_text())
              assert proposal['stageId'] == 'reference-vroom-v2'
              assert proposal['status'] == 'PROPOSAL_ONLY_NOT_AUTHORIZATION'
              assert proposal['proposedAuthorization']['exactAuthorizationParentCommit'] is None
              assert proposal['proposedAuthorization']['exactAuthorizationCommit'] is None
              assert proposal['runnerProposal']['executionAuthorizedByProposal'] is False
          print('Reference VROOM v2 frozen package and disabled authorization: PASS')

      - name: Compile adapter and duplicate audit
        run: >-
          python -m py_compile
          experiments/reference-vroom-v2/runner_adapter.py
          experiments/reference-vroom-v2/duplicate_run_audit.py

      - name: Prove duplicate refusal boundary
        run: python experiments/reference-vroom-v2/duplicate_run_audit.py --self-test

      - name: Validate exact frozen runner proposal
        run: |
          python experiments/reference-vroom-v2/runner_adapter.py --print-proposal > proposal.json
          cat proposal.json
          python - <<'PY'
          import json
          proposal = json.load(open('proposal.json'))
          assert proposal['stageId'] == 'reference-vroom-v2'
          assert proposal['authorizationRequired'] is True
          assert proposal['executionAuthorizedByProposal'] is False
          assert len(proposal['cases']) == 6
          assert [case['seed'] for case in proposal['cases']] == [77301, 77302, 77303, 77304, 77305, 77306]
          assert all(case['photonHistories'] == 160000000 for case in proposal['cases'])
          hashes = proposal['expectedHashes']
          assert hashes['exactSourceRunnerSha256'] == '462fad44ad9924a95dcc92544564467678d792afaacb26acf0264c25171f2af1'
          assert hashes['exactSourceCaseSetPayloadSha256'] == '89fe386f3e65f31d02025d9ecda02d97737dd82e13d224aefccec5c64ca0f101'
          assert hashes['maximumSolverExecutionCount'] == 6
          assert hashes['maximumSyntaxCheckCount'] == 6
          assert hashes['maximumConfiguredMcPhotonsSum'] == 960000000
          assert hashes['maximumAuthorizedRunnerMinutes'] == 90
          assert hashes['perCaseTimeoutSeconds'] == 1200
          assert hashes['purpose'] == 'reference-vroom-v2'
          assert hashes['executionKey'] == 'reference-vroom-v2'
          assert proposal['resolvedInputAssertions'] == {
              'containsMcVroomOn': True,
              'containsMcVroomOff': False,
              'containsSpectralImportanceSampling': False,
          }
          print('Reference VROOM v2 runner proposal: PASS')
          PY
