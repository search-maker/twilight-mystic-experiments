name: Reference VROOM v2 one-shot execution
run-name: Reference VROOM v2 | key=${{ inputs.execution_key }} | auth=${{ inputs.authorization_ref }} | ordinal=${{ inputs.authorization_ordinal }}

on:
  workflow_dispatch:
    inputs:
      authorization_ref:
        description: Exact one-purpose authorization commit SHA
        required: true
        type: string
      execution_key:
        description: Frozen one-shot execution key
        required: true
        type: string
      authorization_ordinal:
        description: Frozen authorization ordinal
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  EXPECTED_EXECUTION_KEY: reference-vroom-v2
  EXPECTED_AUTHORIZATION_ORDINAL: "1"

concurrency:
  group: reference-vroom-v2-${{ inputs.execution_key }}
  cancel-in-progress: false

jobs:
  run-reference-vroom-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Check out exact authorization ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.authorization_ref }}
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"

      - name: Require exact first-attempt enabled authorization
        id: authorization-guard
        shell: python
        env:
          INPUT_EXECUTION_KEY: ${{ inputs.execution_key }}
          INPUT_AUTHORIZATION_REF: ${{ inputs.authorization_ref }}
          INPUT_AUTHORIZATION_ORDINAL: ${{ inputs.authorization_ordinal }}
        run: |
          import json
          import os
          import subprocess
          from pathlib import Path

          def refuse(reason: str) -> None:
              raise SystemExit(f"REFUSED_BEFORE_SYNTAX_OR_SOLVER: {reason}")

          if os.environ.get("GITHUB_EVENT_NAME") != "workflow_dispatch":
              refuse("wrong event")
          if os.environ.get("GITHUB_RUN_ATTEMPT") != "1":
              refuse("run attempt is not one")
          if os.environ.get("INPUT_EXECUTION_KEY") != os.environ.get("EXPECTED_EXECUTION_KEY"):
              refuse("wrong execution key")
          if os.environ.get("INPUT_AUTHORIZATION_ORDINAL") != os.environ.get("EXPECTED_AUTHORIZATION_ORDINAL"):
              refuse("wrong authorization ordinal")

          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if os.environ.get("INPUT_AUTHORIZATION_REF") != head:
              refuse("authorization ref is not checked-out HEAD")

          authorization = json.loads(Path("experiments/reference-vroom-v2/authorization.json").read_text())
          if authorization.get("stageId") != "reference-vroom-v2":
              refuse("wrong stage")
          if authorization.get("executionKey") != "reference-vroom-v2":
              refuse("wrong authorization execution key")
          if authorization.get("authorizationOrdinal") != 1:
              refuse("authorization ordinal is not one")
          if authorization.get("consumed") is not False:
              refuse("authorization is already marked consumed")
          if authorization.get("exactAuthorizationCommit") is not None:
              refuse("self-referential exactAuthorizationCommit must remain null")
          required_true = (
              "authorized",
              "runMystic",
              "runUvspec",
              "scientificDiagnostic",
              "successDoesNotAuthorizeProduction",
          )
          if not all(authorization.get(key) is True for key in required_true):
              refuse("authorization is disabled")

      - name: Refuse a duplicate one-shot marker before syntax or solver
        id: duplicate-run-audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python experiments/reference-vroom-v2/duplicate_run_audit.py
          --repository "${{ github.repository }}"
          --workflow reference-vroom-v2-execution.yml
          --current-run-id "${{ github.run_id }}"
          --execution-key "${{ inputs.execution_key }}"
          --authorization-ref "${{ inputs.authorization_ref }}"
          --authorization-ordinal "${{ inputs.authorization_ordinal }}"
          --token "$GH_TOKEN"
          --output duplicate-run-audit.json

      - name: Verify frozen package and one-purpose authorization
        id: verify-package
        env:
          INPUT_EXECUTION_KEY: ${{ inputs.execution_key }}
          INPUT_AUTHORIZATION_REF: ${{ inputs.authorization_ref }}
          INPUT_AUTHORIZATION_ORDINAL: ${{ inputs.authorization_ordinal }}
        run: python experiments/reference-vroom-v2/runner_adapter.py --verify-only

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: reference-vroom-v2-runtime
          create-args: >-
            -c conda-forge
            python=3.12.4
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1

      - name: Bind exact libRadtran paths and freeze runtime report
        id: runtime-identity
        shell: bash -el {0}
        run: |
          set -euo pipefail
          UVSPEC="$(command -v uvspec)"
          LIBRADTRAN_DATA="$CONDA_PREFIX/share/libRadtran/data"
          export UVSPEC LIBRADTRAN_DATA
          echo "UVSPEC=$UVSPEC" >> "$GITHUB_ENV"
          echo "LIBRADTRAN_DATA=$LIBRADTRAN_DATA" >> "$GITHUB_ENV"
          mkdir -p runtime-report/derived-atmospheres
          source_atmosphere="$LIBRADTRAN_DATA/atmmod/afglus.dat"
          target_atmosphere="runtime-report/derived-atmospheres/afglus-site-0000m.dat"
          test -s "$source_atmosphere"
          cp "$source_atmosphere" "$target_atmosphere"
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          atmosphere = Path("runtime-report/derived-atmospheres/afglus-site-0000m.dat")
          report = {
              "schemaVersion": 1,
              "stageId": "reference-vroom-v2",
              "python": subprocess.check_output(["python", "--version"], text=True, stderr=subprocess.STDOUT).strip(),
              "uvspec": os.environ["UVSPEC"],
              "uvspecHelpSha256": hashlib.sha256(subprocess.check_output([os.environ["UVSPEC"], "-h"], stderr=subprocess.STDOUT)).hexdigest(),
              "libRadtranData": os.environ["LIBRADTRAN_DATA"],
              "atmosphere": str(atmosphere),
              "atmosphereSha256": hashlib.sha256(atmosphere.read_bytes()).hexdigest(),
              "observerElevationM": 0,
              "boundary": "runtime identity only; no scientific result",
          }
          Path("runtime-report/environment-report.json").write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          PY

      - name: Run the exact frozen reference diagnostic once
        id: scientific-run
        shell: bash -el {0}
        env:
          INPUT_EXECUTION_KEY: ${{ inputs.execution_key }}
          INPUT_AUTHORIZATION_REF: ${{ inputs.authorization_ref }}
          INPUT_AUTHORIZATION_ORDINAL: ${{ inputs.authorization_ordinal }}
        run: >-
          python experiments/reference-vroom-v2/runner_adapter.py
          --uvspec "$UVSPEC"
          --data-dir "$LIBRADTRAN_DATA"
          --atmosphere runtime-report/derived-atmospheres/afglus-site-0000m.dat
          --output-dir reference-vroom-v2-output
          --allow-execution

      - name: Preserve exact artifact even on structural failure
        uses: actions/upload-artifact@v4
        if: always() && steps.authorization-guard.outcome == 'success'
        with:
          name: reference-vroom-v2-run
          path: |
            duplicate-run-audit.json
            reference-vroom-v2-output
            runtime-report
          if-no-files-found: warn
          retention-days: 90
