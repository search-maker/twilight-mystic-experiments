  final_evidence:
    needs: [checkpoint_3, checkpoint_6, checkpoint_12, checkpoint_20]
    if: always() && needs.checkpoint_3.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: {name: c2v7-control, path: c2v7/control}
      - uses: actions/download-artifact@v4
        with: {pattern: 'c2v7-block-*', path: c2v7/downloads}
      - uses: actions/download-artifact@v4
        with: {pattern: 'c2v7-checkpoint-*', path: c2v7/checkpoints}
      - name: Bind terminal mechanical evidence without Physics Completeness classification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path.cwd(); p=json.loads((root/'c2v7/control/protocol.json').read_text())
          cps=[json.loads(f.read_text()) for f in (root/'c2v7/checkpoints').glob('**/checkpoint-*.json')]
          if not cps: raise SystemExit('no checkpoint evidence')
          cps.sort(key=lambda x:x['checkpointBlocks']); latest=cps[-1]; n=int(latest['checkpointBlocks'])
          blocks=[]
          for f in (root/'c2v7/downloads').glob('**/block.json'):
              r=json.loads(f.read_text())
              if int(r['block'])<=n: blocks.append(r)
          keys={(r['geometryId'],int(r['block'])) for r in blocks}; expected={(g,b) for g in p['selectedGeometryIds'] for b in range(1,n+1)}
          if keys!=expected or len(blocks)!=len(expected): raise SystemExit('terminal block evidence cardinality mismatch')
          total_ms=sum(int(r['arms'][arm]['elapsedMs']) for r in blocks for arm in p['molecularArms'])
          result={'schemaVersion':7,'resultId':p['protocolId'],'status':'TERMINAL_MECHANICAL_SUCCESSOR_EVIDENCE','protocol':p,'githubRunId':os.environ.get('GITHUB_RUN_ID'),'githubRunAttempt':os.environ.get('GITHUB_RUN_ATTEMPT'),'githubHeadSha':os.environ.get('GITHUB_SHA'),'executedBlocksPerGeometry':n,'historiesPerArmCase':n*p['photonHistoriesPerArmCaseBlock'],'totalConfiguredHistoriesAcrossAllExecutedArmsCases':n*len(p['selectedGeometryIds'])*len(p['molecularArms'])*p['photonHistoriesPerArmCaseBlock'],'summedSolverElapsedMs':total_ms,'checkpoints':cps,'terminalCheckpoint':latest,'mechanicalStopReason':latest['mechanicalStopReason'],'perBlockEvidence':sorted(blocks,key=lambda r:(r['geometryId'],int(r['block']))),'physicsCompletenessFinalV1ClassificationPerformed':False,'postResultBudgetOrStoppingAlterationPerformed':False,'protectedHoldoutOpened':False,'taylorOrJerusalemUsed':False,'publisherInvocationAuthorized':False,'publisherInvoked':False,'writeQuietEntered':False,'dispatchCreated':False,'consumedMarkerCreated':False,'workflowDispatchPerformed':False,'scientificProtectedExecutionPerformed':False,'resultOpeningAuthorizedForProtectedData':False,'levelBAdmissionAuthorized':False,'productionAuthorized':False,'newMappingAuthorized':False}
          out=root/'c2v7/final'; out.mkdir(parents=True,exist_ok=True); (out/'result.json').write_text(json.dumps(result,indent=2,sort_keys=True,allow_nan=False)+'\n')
          hashes=[]
          for f in sorted((root/'c2v7').glob('**/*')):
              if not f.is_file() or f==out/'manifest.json': continue
              hashes.append({'path':str(f.relative_to(root)),'sha256':hashlib.sha256(f.read_bytes()).hexdigest()})
          (out/'manifest.json').write_text(json.dumps({'files':hashes},indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: reptran-crs-materiality-c2-v7-postblackout-sequential-jackknife
          path: |
            c2v7/control
            c2v7/downloads
            c2v7/checkpoints
            c2v7/final
          if-no-files-found: error
          retention-days: 90
