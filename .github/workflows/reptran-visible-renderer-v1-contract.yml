name: REPTRAN visible renderer v1 contract

on:
  pull_request:
    paths:
      - ".github/workflows/reptran-visible-renderer-v1-contract.yml"
      - "experiments/mystic-batch-v1/reptran_visible_renderer_v1.py"
      - "tests/test_reptran_visible_renderer_v1.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/reptran-visible-renderer-v1-contract.yml"
      - "experiments/mystic-batch-v1/reptran_visible_renderer_v1.py"
      - "tests/test_reptran_visible_renderer_v1.py"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - name: Compile successor renderer and tests
        run: >-
          python -m py_compile
          experiments/mystic-batch-v1/reptran_visible_renderer_v1.py
          tests/test_reptran_visible_renderer_v1.py
      - name: Run zero-runtime REPTRAN renderer tests
        run: python -m unittest -v tests/test_reptran_visible_renderer_v1.py
      - name: Prove contract cannot execute solver or protected science
        run: |
          python - <<'PY'
          from pathlib import Path

          renderer = Path("experiments/mystic-batch-v1/reptran_visible_renderer_v1.py").read_text()
          forbidden = (
              "import subprocess",
              "from subprocess",
              "subprocess.run",
              "subprocess.Popen",
              "os.system",
              "workflow_dispatch",
          )
          for token in forbidden:
              if token in renderer:
                  raise SystemExit(f"forbidden execution token in renderer: {token}")

          workflow = Path(".github/workflows/reptran-visible-renderer-v1-contract.yml").read_text()
          dispatch_key = "workflow_" + "dispatch:"
          if dispatch_key in workflow:
              raise SystemExit("renderer contract must not expose workflow dispatch")
          PY
