name: review-arm-ena-sws-e0-live25-v2-contract

on:
  push:
    branches:
      - review/arm-ena-sws-v1-stage0
    paths:
      - review/arm-ena-sws-v1-stage0/stream_ena_sws_e0_live25_v2.py
      - review/arm-ena-sws-v1-stage0/test_stream_ena_sws_e0_live25_v2.py
      - .github/workflows/review-arm-ena-sws-e0-live25-v2-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile wrapper and contract test
        run: |
          python -m py_compile \
            review/arm-ena-sws-v1-stage0/stream_ena_sws_e0_live25.py \
            review/arm-ena-sws-v1-stage0/stream_ena_sws_e0_live25_v2.py \
            review/arm-ena-sws-v1-stage0/audit_ena_sws_e0_v2.py \
            review/arm-ena-sws-v1-stage0/test_stream_ena_sws_e0_live25_v2.py
      - name: Verify live25 E0 v2 hard-pin
        working-directory: review/arm-ena-sws-v1-stage0
        run: python test_stream_ena_sws_e0_live25_v2.py
      - name: Static holdout-safe orchestration boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('review/arm-ena-sws-v1-stage0/stream_ena_sws_e0_live25_v2.py')
          s = p.read_text(encoding='utf-8')
          assert 'audit_ena_sws_e0_v2.py' in s
          assert 'audit_ena_sws_e0.py' not in s.replace('audit_ena_sws_e0_v2.py', '')
          assert 'netCDF4' not in s
          assert '.variables[' not in s
          assert 'radiance' not in s.lower()
          assert 'signal' not in s.lower()
          assert 'intensity' not in s.lower()
          assert 'brightness' not in s.lower()
          print('PASS live25 E0-v2 wrapper contains no native/photometric reads')
          PY
