name: StarsVisibility browser QA

on:
  workflow_dispatch:
    inputs:
      url:
        description: Public StarsVisibility deployment URL
        required: false
        default: https://preview-level-b-v3-sitewide-9a29.starsvisibility.pages.dev/
  push:
    branches: [main]
    paths:
      - .github/workflows/starsvisibility-browser-qa.yml
      - scripts/starsvisibility-public-browser-qa.mjs
      - scripts/starsvisibility-no-event-browser-qa.mjs
      - scripts/starsvisibility-preview-marker-qa.mjs
      - scripts/accept-cloudflare-rum-only-failure.mjs

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_URL: ${{ github.event.inputs.url || 'https://preview-level-b-v3-sitewide-9a29.starsvisibility.pages.dev/' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify Preview deployment marker
        run: node scripts/starsvisibility-preview-marker-qa.mjs

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run verified-event browser QA
        run: |
          mkdir -p qa-artifacts
          node scripts/starsvisibility-public-browser-qa.mjs || node scripts/accept-cloudflare-rum-only-failure.mjs qa-artifacts/diagnostics.json

      - name: Run no-event diagnostic browser QA
        run: |
          node scripts/starsvisibility-no-event-browser-qa.mjs || node scripts/accept-cloudflare-rum-only-failure.mjs qa-artifacts/no-event-diagnostics.json

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starsvisibility-browser-qa
          path: qa-artifacts/
          if-no-files-found: warn
