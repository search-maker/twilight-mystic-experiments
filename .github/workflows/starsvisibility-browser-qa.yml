name: StarsVisibility browser QA

on:
  workflow_dispatch:
    inputs:
      url:
        description: Public StarsVisibility deployment URL
        required: false
        default: https://starsvisibility.pages.dev/
  push:
    branches: [main]
    paths:
      - .github/workflows/starsvisibility-browser-qa.yml
      - scripts/starsvisibility-public-browser-qa.mjs

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_URL: ${{ github.event.inputs.url || 'https://starsvisibility.pages.dev/' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run public deployment QA
        run: |
          mkdir -p qa-artifacts
          node scripts/starsvisibility-public-browser-qa.mjs

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starsvisibility-browser-qa
          path: qa-artifacts/
          if-no-files-found: warn
