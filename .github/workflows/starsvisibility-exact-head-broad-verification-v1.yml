name: Starsvisibility exact-head broad verification v1
run-name: Starsvisibility broad exact-head verification | ${{ github.sha }}

on:
  pull_request:
    types: [opened, reopened]
    paths:
      - 'review/starsvisibility-broad-exact-head-dispatch/dispatch.json'

permissions:
  contents: read

concurrency:
  group: starsvisibility-exact-head-broad-verification-v1-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Validate one-file read-only dispatch
        id: dispatch
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git diff --name-only HEAD^ HEAD)" = "review/starsvisibility-broad-exact-head-dispatch/dispatch.json"
          python - <<'PY'
          import json, os, re
          p='review/starsvisibility-broad-exact-head-dispatch/dispatch.json'
          d=json.load(open(p))
          assert d.get('schemaVersion')==1
          assert d.get('repository')=='search-maker/starsvisibility'
          sha=d.get('applicationSha')
          assert isinstance(sha,str) and re.fullmatch(r'[0-9a-f]{40}',sha)
          assert d.get('testProfile')=='LEVEL_B_BUILD_SITEWIDE_DIST_BROAD_V1'
          assert d.get('readOnly') is True
          assert d.get('scientificExecution') is False
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'application_sha={sha}\n')
          PY
          test -z "$(command -v uvspec || true)"

      - name: Require read-only starsvisibility credential
        env:
          STARSVISIBILITY_READ_TOKEN: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}
        run: test -n "${STARSVISIBILITY_READ_TOKEN:-}" || exit 78

      - uses: actions/checkout@v4
        with:
          repository: search-maker/starsvisibility
          ref: ${{ steps.dispatch.outputs.application_sha }}
          token: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}
          path: app
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.node-version

      - name: Verify exact application identity
        working-directory: app
        env:
          EXPECTED_SHA: ${{ steps.dispatch.outputs.application_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(command -v uvspec || true)"

      - name: Install pinned application dependencies
        working-directory: app
        run: npm ci

      - name: Prepare exact stellar assets for source integration check
        working-directory: app
        run: npm run prepare:level-b-stellar-v2

      - name: Check source current-main integration
        working-directory: app
        run: node scientific-tools/visibility-v3/tests/test-current-main-integration.mjs

      # build:pages itself executes test:level-b-parity and the complete
      # test:level-b-sitewide-preview suite at their intended intermediate dist
      # stage. Re-running that suite after finalization is invalid because later
      # build transforms intentionally change the selector/runtime surface it
      # asserts. Use the build result itself as the lifecycle-correct gate.
      - name: Full Pages build including parity and sitewide checks
        working-directory: app
        env:
          CF_PAGES_COMMIT_SHA: ${{ steps.dispatch.outputs.application_sha }}
        run: npm run build:pages

      - name: Recheck packaged stellar v3.2 dist identity after finalization
        working-directory: app
        run: node scripts/test-level-b-stellar-v2-dist.mjs

      - name: Verify final deployment marker follows active stellar v3.2 identity
        working-directory: app
        env:
          EXPECTED_APPLICATION_SHA: ${{ steps.dispatch.outputs.application_sha }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('dist/level-b-software-status.json', 'utf8'));
          const expectedAppSha = process.env.EXPECTED_APPLICATION_SHA;
          if (p.schemaVersion !== 2) throw new Error('deployment marker schema is not v2');
          if (p.commitSha !== expectedAppSha) throw new Error(`deployment marker commit mismatch: ${p.commitSha} != ${expectedAppSha}`);
          if (p.stellarTransportLutSha256 !== '0b96bd5868dc0c72d5cd77b504098d35086feaf573d92556c4f8311a163e3ce2') throw new Error('deployment marker active stellar LUT is stale');
          if (p.stellarTransportSourceV2LutSha256 !== '21eeb51fcc5287ab3bb8cb59cfe0bb0073f34e9ca1b6cc6df988c6eb5043631f') throw new Error('deployment marker source-v2 identity missing');
          if (p.stellarTransportSedPublicAssetCommit !== '4b71445139e24236f12952ab41c791bd07a9f7db') throw new Error('deployment marker SED commit drift');
          if (p.stellarTransportRuntimePublicAssetCommit !== '279ba344ab0e868df1319c01291418ec8786d261') throw new Error('deployment marker runtime commit drift');
          if (p.stellarTransportCaptureRunId !== '33044767268') throw new Error('deployment marker capture run is stale');
          if (p.stellarTransportPhysicalTargetAltitudeMaxDeg !== 90) throw new Error('deployment marker zenith support missing');
          if (p.stellarTransportOldDomainValuesUnchanged !== true || p.stellarTransportPositiveEpsilonSubstitutionUsed !== false) throw new Error('deployment marker stellar inheritance/zenith semantics drift');
          if (p.stellarTransportEmpiricalRealSkyValidated !== false || p.stellarTransportHumanFirstSeeingValidated !== false || p.productionAuthorized !== false) throw new Error('deployment marker claim boundary drift');
          console.log('Final active stellar v3.2 deployment marker identity: PASS');
          NODE

      - name: Claim boundary
        run: |
          echo 'Read-only application build/test verification only.'
          echo 'No scientific solver execution, model fitting, holdout opening, or repository mutation occurred.'
