name: Starsvisibility exact-head Level-B parity
run-name: Starsvisibility exact-head Level-B parity | ${{ github.event.pull_request.head.sha }}

on:
  pull_request:
    types: [opened, reopened]
    paths:
      - 'review/starsvisibility-exact-head-dispatch/dispatch.json'

permissions:
  contents: read

concurrency:
  group: starsvisibility-exact-head-level-b-parity-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - id: dispatch
        name: Validate one-file read-only dispatch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only HEAD^ HEAD)" = "review/starsvisibility-exact-head-dispatch/dispatch.json"
          python - <<'PY'
          import json, os, re
          p='review/starsvisibility-exact-head-dispatch/dispatch.json'
          d=json.load(open(p))
          assert d.get('schemaVersion')==1
          assert d.get('repository')=='search-maker/starsvisibility'
          sha=d.get('applicationSha')
          assert isinstance(sha,str) and re.fullmatch(r'[0-9a-f]{40}',sha)
          assert d.get('testProfile')=='LEVEL_B_PARITY_AND_NEW_SKY_FOUNDATION'
          assert d.get('readOnly') is True
          assert d.get('scientificExecution') is False
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'application_sha={sha}\n')
          PY
      - name: Require read-only starsvisibility credential
        env:
          STARSVISIBILITY_READ_TOKEN: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}
        run: test -n "${STARSVISIBILITY_READ_TOKEN:-}" || exit 78
      - name: Checkout exact private application SHA
        uses: actions/checkout@v4
        with:
          repository: search-maker/starsvisibility
          ref: ${{ steps.dispatch.outputs.application_sha }}
          token: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}
          path: app
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.node-version
      - name: Verify exact application identity
        working-directory: app
        env:
          EXPECTED_SHA: ${{ steps.dispatch.outputs.application_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install pinned application dependencies
        working-directory: app
        run: npm ci
      - name: Syntax-check new sky foundation modules and regressions
        working-directory: app
        run: |
          set -euo pipefail
          node --check scientific-tools/visibility-v3/total-sky-compositor.mjs
          node --check scientific-tools/visibility-v3/zenith-invariant-geometry.mjs
          node --check scientific-tools/visibility-v3/tests/test-total-sky-compositor.mjs
          node --check scientific-tools/visibility-v3/tests/test-zenith-invariant-geometry.mjs
      - name: Run focused sky-foundation regressions
        working-directory: app
        run: |
          set -euo pipefail
          node scientific-tools/visibility-v3/tests/test-total-sky-compositor.mjs
          node scientific-tools/visibility-v3/tests/test-zenith-invariant-geometry.mjs
      - name: Run complete Level-B parity chain
        working-directory: app
        run: npm run test:level-b-parity
