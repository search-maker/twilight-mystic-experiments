name: StarsVisibility known-object production validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Install browser driver
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright-core@1.61.1 --no-save
          echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Validate production clean defaults and persisted override
        env:
          SITE: https://starsvisibility.pages.dev
        run: |
          set -euo pipefail
          cat > validate.mjs <<'NODE'
          import { chromium } from 'playwright-core';

          const browser = await chromium.launch({ headless: true, executablePath: process.env.CHROME_PATH });
          const ids = [
            'excludeKnownVenus',
            'excludeKnownJupiter',
            'excludeKnownSirius',
            'excludeKnownMars',
            'excludeKnownCanopus',
            'excludeKnownAlphaCentauri',
            'excludeKnownArcturus',
          ];
          const read = page => page.evaluate(ids => Object.fromEntries(ids.map(id => [id, document.getElementById(id)?.checked ?? null])), ids);

          const fresh = await browser.newContext();
          await fresh.addInitScript(() => localStorage.removeItem('starVisibilityThreeStarSelectionV1'));
          const freshPage = await fresh.newPage();
          const freshErrors = [];
          freshPage.on('pageerror', error => freshErrors.push(error.message));
          let marker = false;
          for (let i = 0; i < 30; i++) {
            await freshPage.goto(`${process.env.SITE}/?known-prod=${process.env.GITHUB_RUN_ID}-${i}`, { waitUntil: 'domcontentloaded', timeout: 120000 });
            marker = await freshPage.evaluate(() => document.documentElement.outerHTML.includes('STARS-KNOWN-EXCLUSION-DEFAULT-FOUR-V1'));
            if (marker) break;
            await freshPage.waitForTimeout(10000);
          }
          if (!marker) throw new Error('DEFAULT_FOUR_PRODUCTION_NOT_DEPLOYED');
          const clean = await read(freshPage);
          const cleanExpected = {
            excludeKnownVenus: true,
            excludeKnownJupiter: true,
            excludeKnownSirius: true,
            excludeKnownMars: true,
            excludeKnownCanopus: false,
            excludeKnownAlphaCentauri: false,
            excludeKnownArcturus: false,
          };
          if (JSON.stringify(clean) !== JSON.stringify(cleanExpected)) throw new Error(`CLEAN_DEFAULT_BAD_${JSON.stringify(clean)}`);
          if (freshErrors.length) throw new Error(`FRESH_PAGE_ERRORS_${JSON.stringify(freshErrors)}`);
          await fresh.close();

          const saved = await browser.newContext();
          await saved.addInitScript(() => {
            localStorage.setItem('starVisibilityThreeStarSelectionV1', JSON.stringify({
              count: '3',
              magnitudeBasis: 'known-exclusions',
              magnitudeThreshold: '1.7',
              excludedKnownObjects: ['canopus', 'arcturus'],
            }));
          });
          const savedPage = await saved.newPage();
          const savedErrors = [];
          savedPage.on('pageerror', error => savedErrors.push(error.message));
          await savedPage.goto(`${process.env.SITE}/?known-prod-saved=${process.env.GITHUB_RUN_ID}`, { waitUntil: 'domcontentloaded', timeout: 120000 });
          const restored = await read(savedPage);
          const restoredExpected = {
            excludeKnownVenus: false,
            excludeKnownJupiter: false,
            excludeKnownSirius: false,
            excludeKnownMars: false,
            excludeKnownCanopus: true,
            excludeKnownAlphaCentauri: false,
            excludeKnownArcturus: true,
          };
          if (JSON.stringify(restored) !== JSON.stringify(restoredExpected)) throw new Error(`SAVED_OVERRIDE_BAD_${JSON.stringify(restored)}`);
          const basis = await savedPage.locator('#threeStarMagnitudeBasis').inputValue();
          if (basis !== 'known-exclusions') throw new Error(`SAVED_BASIS_BAD_${basis}`);
          if (savedErrors.length) throw new Error(`SAVED_PAGE_ERRORS_${JSON.stringify(savedErrors)}`);
          await saved.close();

          console.log('KNOWN_OBJECT_PRODUCTION_PASS', JSON.stringify({ clean, restored, basis }));
          await browser.close();
          NODE
          node validate.mjs
