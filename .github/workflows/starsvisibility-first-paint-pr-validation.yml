name: StarsVisibility production payload audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Audit production HTML payload
        env:
          SITE: https://starsvisibility.pages.dev
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const url = process.env.SITE + '/?payload-audit=' + process.env.GITHUB_RUN_ID;
          const response = await fetch(url);
          const html = await response.text();
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)].map((m,i)=>({i,start:m.index,chars:m[1].length,body:m[1]}));
          scripts.sort((a,b)=>b.chars-a.chars);
          const main=scripts[0];
          console.log('HTML_CHARS',html.length,'SCRIPT_SIZES',scripts.map(s=>({i:s.i,start:s.start,chars:s.chars})).slice(0,20));
          const lines=main.body.split('\n').map((text,index)=>({line:index+1,chars:text.length,text})).sort((a,b)=>b.chars-a.chars).slice(0,30);
          console.log('TOP_LINES',JSON.stringify(lines.map(x=>({line:x.line,chars:x.chars,prefix:x.text.slice(0,220)}))));
          for(const needle of ['STAR_CATALOG','starCatalog','CATALOG','catalog','BRIGHT','const stars','const STAR','STARS','hip','ra:', 'dec:']){
            const hits=[];let from=0;while(true){const i=main.body.indexOf(needle,from);if(i<0)break;hits.push(i);from=i+needle.length;}console.log('NEEDLE',needle,'COUNT',hits.length,'FIRST',hits.slice(0,10));
          }
          const bigLines=main.body.split('\n').map((text,index)=>({line:index+1,chars:text.length,text})).filter(x=>x.chars>5000);
          console.log('BIG_LINE_COUNT',bigLines.length,'BIG_LINE_TOTAL',bigLines.reduce((s,x)=>s+x.chars,0));
          for(const x of bigLines.slice(0,30)) console.log('BIG',x.line,x.chars,JSON.stringify(x.text.slice(0,400)));
          NODE
