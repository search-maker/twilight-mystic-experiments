name: StarsVisibility responsive preview startup diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Install browser driver
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright-core@1.61.1 --no-save
          echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Diagnose automatic calculation startup
        env:
          SITE: https://agent-responsive-calculation.starsvisibility.pages.dev
        run: |
          set -euo pipefail
          cat > validate.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH});
          const settings={date:{value:'2026-05-29'},lat:{value:'32.74907'},lon:{value:'35.09901'},timezone:{value:'Asia/Jerusalem'},observerElevationM:{value:'105'},observerMode:{value:'ordinaryOrGuided'},minAlt:{value:'3'},moonOn:{value:'off'},threeStarCount:{value:'3'},threeStarMagnitudeBasis:{value:'effective'},threeStarMagnitudeThreshold:{value:'1.7'},threeCloseEnabled:{checked:true},threeCloseMaxDiameterDeg:{value:'4'},threeCloseMagnitudeBasis:{value:'effective'},threeCloseMagnitudeThreshold:{value:'3'}};
          const context=await browser.newContext({viewport:{width:1440,height:1200}});
          await context.addInitScript(v=>localStorage.setItem('starVisibilityUserSettingsV1',JSON.stringify({version:4,mode:'evening',values:v})),settings);
          await context.addInitScript(()=>{const Native=window.Worker;window.__workerCount=0;window.Worker=class extends Native{constructor(...args){window.__workerCount++;super(...args);}};});
          const page=await context.newPage(); const errors=[]; page.on('pageerror',e=>errors.push(e.message));
          await page.goto(`${process.env.SITE}/?startup-diag=${process.env.GITHUB_RUN_ID}`,{waitUntil:'domcontentloaded',timeout:120000});
          await page.waitForTimeout(7000);
          const diag=await page.evaluate(()=>({
            readyState:document.readyState,
            fcp:performance.getEntriesByType('paint').find(e=>e.name==='first-contentful-paint')?.startTime??null,
            autoMarks:performance.getEntriesByName('stars-auto-calc-start').map(e=>e.startTime),
            workerCount:window.__workerCount,
            workerEnabled:(()=>{try{return eval('workerEnabled')}catch(e){return `ERR:${e.message}`}})(),
            appScriptLength:(()=>{try{return eval('APP_SCRIPT_SOURCE.length')}catch(e){return `ERR:${e.message}`}})(),
            activeWorker:(()=>{try{return Boolean(eval('activeCalculationWorker'))}catch{return null}})(),
            calculateDisabled:document.getElementById('calculate')?.disabled??null,
            calculateClass:document.getElementById('calculate')?.className??null,
            lazyMain:globalThis.__STARS_BUILT_IN_CATALOG_MAIN_THREAD_LAZY__===true,
            mainCatalogCount:(()=>{try{return eval('builtInStars.length')}catch{return null}})(),
            pageCatalogScript:Boolean(document.querySelector('script[data-stars-builtin-catalog]')),
            result:(()=>{try{const d=eval('threeStarResultData');return d?{found:d.found,minutes:d.minutesAfterSunset,close:d.closeTriple&&{enabled:d.closeTriple.enabled,found:d.closeTriple.found,minutes:d.closeTriple.minutesAfterSunset}}:null}catch{return null}})(),
            feature:document.getElementById('calculatorFeature')?.value??null,
          }));
          console.log('STARTUP_DIAG',JSON.stringify({diag,errors}));
          await context.close(); await browser.close();
          NODE
          node validate.mjs
