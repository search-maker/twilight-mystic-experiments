name: StarsVisibility catalog boundary audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Inspect catalog boundaries
        env:
          SITE: https://starsvisibility.pages.dev
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const html=await (await fetch(process.env.SITE+'/?catalog-boundary='+process.env.GITHUB_RUN_ID)).text();
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)].map(m=>m[1]);
          const main=scripts.sort((a,b)=>b.length-a.length)[0];
          console.log('MAIN_PREFIX',JSON.stringify(main.slice(0,3000)));
          const probes=['const CATALOG','CATALOG =','const catalog','catalog =','BSC5/Yale Bright Star processed local catalog'];
          for(const p of probes){const i=main.indexOf(p);console.log('PROBE',p,i,i>=0?JSON.stringify(main.slice(Math.max(0,i-800),i+1800)):'');}
          for(const pos of [500000,1000000,1500000,2000000,2400000,2500000]) console.log('AT',pos,JSON.stringify(main.slice(pos,pos+600)));
          NODE
