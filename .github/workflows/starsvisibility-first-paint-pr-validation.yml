name: StarsVisibility first-paint PR validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Install browser driver
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright-core@1.61.1 --no-save
          echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Diagnose startup timing signals
        env:
          SITE: https://a95dda08.starsvisibility.pages.dev
        run: |
          set -euo pipefail
          cat > diagnose.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH});
          const context=await browser.newContext({viewport:{width:1440,height:1200}});
          await context.addInitScript(v=>localStorage.setItem('starVisibilityUserSettingsV1',JSON.stringify({version:4,mode:'evening',values:v})),{date:{value:'2026-05-29'},lat:{value:'32.74907'},lon:{value:'35.09901'},timezone:{value:'Asia/Jerusalem'},observerElevationM:{value:'105'},observerMode:{value:'ordinaryOrGuided'},minAlt:{value:'3'},moonOn:{value:'off'},threeStarCount:{value:'3'},threeStarMagnitudeBasis:{value:'effective'},threeStarMagnitudeThreshold:{value:'1.7'},threeCloseEnabled:{checked:true},threeCloseMaxDiameterDeg:{value:'4'},threeCloseMagnitudeBasis:{value:'effective'},threeCloseMagnitudeThreshold:{value:'3'}});
          const page=await context.newPage();const errors=[];page.on('pageerror',e=>errors.push(e.message));
          await page.goto(`${process.env.SITE}/?paint-diagnostic=${process.env.GITHUB_RUN_ID}`,{waitUntil:'domcontentloaded',timeout:120000});
          await page.waitForTimeout(5000);
          const snap=await page.evaluate(()=>({
            now:performance.now(),
            paints:performance.getEntriesByType('paint').map(e=>({name:e.name,startTime:e.startTime})),
            marker:document.documentElement.outerHTML.includes('STARS-INITIAL-CALC-AFTER-FIRST-PAINT-V1'),
            readyState:document.readyState,
            controls:(()=>{const r=document.getElementById('mainControls')?.getBoundingClientRect?.();return r?{w:r.width,h:r.height}:null})(),
            button:{disabled:document.getElementById('calculate')?.disabled,text:document.getElementById('calculate')?.textContent},
            status:document.getElementById('calculationStatus')?.textContent,
            active:(()=>{try{return !!eval('activeCalculationWorker')}catch(e){return `eval-error:${e.message}`}})(),
            result:(()=>{try{const d=eval('threeStarResultData');return{found:d?.found,closeEnabled:d?.closeTriple?.enabled,closeFound:d?.closeTriple?.found,regular:d?.minutesAfterSunset,close:d?.closeTriple?.minutesAfterSunset}}catch(e){return{error:e.message}}})(),
            workerType:typeof Worker
          }));
          snap.pageErrors=errors;
          console.log('STARTUP_DIAGNOSTIC',JSON.stringify(snap));
          if(!snap.marker)throw new Error('MARKER_MISSING');
          if(!snap.paints.some(e=>e.name==='first-contentful-paint'))throw new Error(`FCP_MISSING_${JSON.stringify(snap)}`);
          if(!snap.controls||!(snap.controls.w>0&&snap.controls.h>0))throw new Error(`CONTROLS_NOT_VISIBLE_${JSON.stringify(snap)}`);
          if(errors.length)throw new Error(`PAGE_ERRORS_${JSON.stringify(errors)}`);
          await context.close();await browser.close();
          NODE
          node diagnose.mjs
