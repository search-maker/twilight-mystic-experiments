name: StarsVisibility calculate entrypoint audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Inspect calculate entrypoints
        env:
          SITE: https://starsvisibility.pages.dev
        run: |
          node --input-type=module <<'NODE'
          const html=await (await fetch(process.env.SITE+'/?calc-entry='+process.env.GITHUB_RUN_ID)).text();
          const main=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)].map(m=>m[1]).sort((a,b)=>b.length-a.length)[0];
          for(const needle of ['function calculate(', 'async function calculate(', 'calculate =', 'addEventListener("click", calculate', "addEventListener('click', calculate"]){
            const hits=[];let from=0;while(true){const i=main.indexOf(needle,from);if(i<0)break;hits.push(i);from=i+needle.length;}console.log('HITS',needle,hits);for(const i of hits)console.log('CTX',JSON.stringify(main.slice(Math.max(0,i-500),i+1800)));
          }
          NODE
