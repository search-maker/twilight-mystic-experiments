name: StarsVisibility catalog reference audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Inspect catalog references
        env:
          SITE: https://starsvisibility.pages.dev
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const html=await (await fetch(process.env.SITE+'/?catalog-refs='+process.env.GITHUB_RUN_ID)).text();
          const main=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)].map(m=>m[1]).sort((a,b)=>b.length-a.length)[0];
          for(const needle of ['builtInStars','BUILT_IN_CATALOG_META']){
            const hits=[];let from=0;while(true){const i=main.indexOf(needle,from);if(i<0)break;hits.push(i);from=i+needle.length;}
            console.log('REFS',needle,'COUNT',hits.length,'POSITIONS',hits.join(','));
            for(const i of hits) console.log('CTX',needle,i,JSON.stringify(main.slice(Math.max(0,i-280),Math.min(main.length,i+520))));
          }
          const start=main.indexOf('const builtInStars = [');
          let depth=0,inStr=null,esc=false,end=-1;
          const arr=main.indexOf('[',start);
          for(let i=arr;i<main.length;i++){const c=main[i];if(inStr){if(esc)esc=false;else if(c==='\\')esc=true;else if(c===inStr)inStr=null;continue;}if(c==='"'||c==="'"||c==='`'){inStr=c;continue;}if(c==='[')depth++;else if(c===']'){depth--;if(depth===0){end=i;break;}}}
          console.log('CATALOG_RANGE',JSON.stringify({start,arr,end,chars:end-start+2,after:main.slice(end,end+300)}));
          NODE
