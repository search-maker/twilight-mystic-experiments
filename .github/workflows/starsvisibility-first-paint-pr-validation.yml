name: StarsVisibility production load profile

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Install browser driver
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright-core@1.61.1 --no-save
          echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Profile production startup
        env:
          SITE: https://starsvisibility.pages.dev
        run: |
          set -euo pipefail
          echo "profile-trigger-v1" >/dev/null
          cat > profile.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          const browser = await chromium.launch({ headless: true, executablePath: process.env.CHROME_PATH });
          const context = await browser.newContext({ viewport: { width: 1440, height: 1200 } });
          await context.addInitScript(() => {
            window.__profile = { controlsVisibleAt: null, lcp: null, longTasks: [] };
            new PerformanceObserver(list => {
              for (const e of list.getEntries()) window.__profile.lcp = { startTime: e.startTime, size: e.size, tag: e.element?.tagName || null, id: e.element?.id || null, cls: e.element?.className || null };
            }).observe({ type: 'largest-contentful-paint', buffered: true });
            try {
              new PerformanceObserver(list => {
                for (const e of list.getEntries()) window.__profile.longTasks.push({ startTime: e.startTime, duration: e.duration });
              }).observe({ type: 'longtask', buffered: true });
            } catch {}
            const tick = () => {
              if (window.__profile.controlsVisibleAt == null) {
                const el = document.getElementById('mainControls');
                const r = el?.getBoundingClientRect?.();
                const s = el ? getComputedStyle(el) : null;
                if (r && r.width > 0 && r.height > 0 && s && s.visibility !== 'hidden' && s.display !== 'none' && Number(s.opacity) !== 0) window.__profile.controlsVisibleAt = performance.now();
              }
              if (performance.now() < 15000) requestAnimationFrame(tick);
            };
            requestAnimationFrame(tick);
          });
          const page = await context.newPage();
          const pageErrors = [];
          page.on('pageerror', e => pageErrors.push(e.message));
          const response = await page.goto(`${process.env.SITE}/?load-profile=${process.env.GITHUB_RUN_ID}`, { waitUntil: 'load', timeout: 120000 });
          await page.waitForTimeout(5000);
          const result = await page.evaluate(() => {
            const nav = performance.getEntriesByType('navigation')[0];
            const paints = Object.fromEntries(performance.getEntriesByType('paint').map(e => [e.name, e.startTime]));
            const resources = performance.getEntriesByType('resource').map(e => ({
              name: e.name,
              initiatorType: e.initiatorType,
              startTime: e.startTime,
              responseStart: e.responseStart,
              responseEnd: e.responseEnd,
              duration: e.duration,
              transferSize: e.transferSize,
              encodedBodySize: e.encodedBodySize,
              decodedBodySize: e.decodedBodySize,
            })).sort((a,b) => b.duration - a.duration).slice(0, 15);
            const scripts = [...document.scripts].map(s => ({ src: s.src || null, inlineChars: s.src ? 0 : s.textContent.length }));
            return {
              nav: nav ? {
                startTime: nav.startTime,
                domainLookupStart: nav.domainLookupStart,
                domainLookupEnd: nav.domainLookupEnd,
                connectStart: nav.connectStart,
                secureConnectionStart: nav.secureConnectionStart,
                connectEnd: nav.connectEnd,
                requestStart: nav.requestStart,
                responseStart: nav.responseStart,
                responseEnd: nav.responseEnd,
                domInteractive: nav.domInteractive,
                domContentLoadedEventEnd: nav.domContentLoadedEventEnd,
                loadEventEnd: nav.loadEventEnd,
                transferSize: nav.transferSize,
                encodedBodySize: nav.encodedBodySize,
                decodedBodySize: nav.decodedBodySize,
              } : null,
              paints,
              controlsVisibleAt: window.__profile.controlsVisibleAt,
              lcp: window.__profile.lcp,
              longTasks: window.__profile.longTasks.sort((a,b)=>b.duration-a.duration).slice(0, 20),
              totalLongTaskMs: window.__profile.longTasks.reduce((s,e)=>s+e.duration,0),
              resources,
              scripts,
              htmlChars: document.documentElement.outerHTML.length,
              bodyTextChars: document.body?.innerText?.length || 0,
              readyState: document.readyState,
            };
          });
          result.status = response?.status() ?? null;
          result.headers = response ? await response.allHeaders() : null;
          result.pageErrors = pageErrors;
          console.log('LOAD_PROFILE', JSON.stringify(result));
          if (pageErrors.length) throw new Error(`PAGE_ERRORS_${JSON.stringify(pageErrors)}`);
          await context.close(); await browser.close();
          NODE
          node profile.mjs
