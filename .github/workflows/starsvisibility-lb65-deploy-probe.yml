name: StarsVisibility LB65 deploy probe

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/starsvisibility-lb65-deploy-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe fresh Cloudflare branch alias
        run: |
          set -eu
          url='https://preview-lb65-deploy-probe.starsvisibility.pages.dev/'
          echo "Probing $url"
          code="$(curl -L -sS -o /tmp/index.html -w '%{http_code}' --retry 4 --retry-delay 5 "$url")"
          echo "HTTP $code"
          test "$code" = '200'
          grep -F 'LEVEL-B-THREE-STAR-MIN-ALTITUDE-V1' /tmp/index.html >/dev/null
          grep -F 'LEVEL-B-THREE-STAR-RESULT-TIME-PARITY-V1' /tmp/index.html >/dev/null
          echo 'Fresh Cloudflare branch deployment contains LB65 exact markers: PASS'
