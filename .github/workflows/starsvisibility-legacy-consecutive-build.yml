name: StarsVisibility Legacy consecutive exact-head build

on:
  pull_request:
    paths:
      - '.github/workflows/starsvisibility-legacy-consecutive-build.yml'

permissions:
  contents: read

concurrency:
  group: starsvisibility-legacy-consecutive-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APPLICATION_SHA: f51fbbb48372d41bca3beadedb61afeb0d231c07
      STARSVISIBILITY_READ_TOKEN: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}
      LIVE_SITE_URL: https://starsvisibility.pages.dev

    steps:
      - name: Require read-only private checkout credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${STARSVISIBILITY_READ_TOKEN:-}" || { echo 'Required read-only secret unavailable.' >&2; exit 78; }
          printf '%s' "$APPLICATION_SHA" | grep -Eq '^[0-9a-f]{40}$'

      - name: Checkout public runner
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact private StarsVisibility head
        uses: actions/checkout@v4
        with:
          repository: search-maker/starsvisibility
          ref: ${{ env.APPLICATION_SHA }}
          token: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}
          path: private-app
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact private identity and remove private remote
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C private-app rev-parse HEAD)" = "$APPLICATION_SHA"
          git -C private-app remote remove origin || true

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: private-app/package-lock.json

      - name: Install dependencies and run exact Pages build
        working-directory: private-app
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          GITHUB_SHA="$APPLICATION_SHA" npm run build:pages

      - name: Verify baked Legacy consecutive runtime in final dist
        working-directory: private-app
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          grep -Fq 'STARS-PRECISION-ASTRONOMY-V3' dist/index.html
          grep -Fq 'STARS-CLOSE-TRIPLE-STABLE-GEOMETRY-V2' dist/index.html
          grep -Fq 'STARS-CLOSE-TRIPLE-MAGNITUDE-V1' dist/index.html
          grep -Fq 'STARS-CLOSE-TRIPLE-INDEPENDENT-RESULT-HOST-V1' dist/index.html
          grep -Fq 'LEGACY-THREE-STAR-CONSECUTIVE-MAIN-THREAD-V1' dist/index.html
          grep -Fq 'LEVEL-B-THREE-STAR-CONSECUTIVE-V1' dist/index.html
          grep -Fq 'closeTriple: closeTripleResult' dist/index.html
          grep -Fq 'if (!close?.enabled)' dist/index.html
          if grep -Fq 'if (!result?.found || !close?.enabled)' dist/index.html; then
            echo 'FAIL: consecutive result is still gated by ordinary Three-Star result' >&2
            exit 1
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          marker=json.loads(Path('dist/level-b-software-status.json').read_text())
          assert marker['commitSha'] == os.environ['APPLICATION_SHA']
          summary={
              'applicationSha': os.environ['APPLICATION_SHA'],
              'pagesBuild': 'PASS',
              'legacyConsecutiveBaked': True,
              'independentResultHost': True,
              'ordinaryResultGateRemoved': True,
              'liveDeployment': 'PENDING',
              'liveCommitSha': None,
          }
          out=Path(os.environ['RUNNER_TEMP'])/'starsvisibility-legacy-consecutive-summary.json'
          out.write_text(json.dumps(summary, indent=2, sort_keys=True)+'\n')
          print(json.dumps(summary, sort_keys=True))
          PY

      - name: Verify exact fix is live on Cloudflare Pages
        shell: bash
        run: |
          set -euo pipefail
          marker_url="$LIVE_SITE_URL/.well-known/level-b-software-status.json"
          live_sha=""
          for attempt in $(seq 1 12); do
            body="$(curl --fail --silent --show-error --location --max-time 20 \
              -H 'Cache-Control: no-cache' \
              "$marker_url?verify=$GITHUB_RUN_ID-$attempt" || true)"
            live_sha="$(printf '%s' "$body" | python -c 'import json,sys; 
try: print(json.load(sys.stdin).get("commitSha", ""))
except Exception: print("")')"
            echo "Live deployment attempt $attempt: ${live_sha:-unavailable}"
            if [ "$live_sha" = "$APPLICATION_SHA" ]; then
              html="$(curl --fail --silent --show-error --location --max-time 30 \
                -H 'Cache-Control: no-cache' \
                "$LIVE_SITE_URL/?verify=$GITHUB_RUN_ID-$attempt")"
              printf '%s' "$html" | grep -Fq 'STARS-CLOSE-TRIPLE-MAGNITUDE-V1'
              printf '%s' "$html" | grep -Fq 'STARS-CLOSE-TRIPLE-INDEPENDENT-RESULT-HOST-V1'
              printf '%s' "$html" | grep -Fq 'LEGACY-THREE-STAR-CONSECUTIVE-MAIN-THREAD-V1'
              if printf '%s' "$html" | grep -Fq 'if (!result?.found || !close?.enabled)'; then
                echo 'FAIL: live HTML still contains the old ordinary-result gate' >&2
                exit 1
              fi
              LIVE_SHA="$live_sha" python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'starsvisibility-legacy-consecutive-summary.json'
          data=json.loads(p.read_text())
          data['liveDeployment']='PASS'
          data['liveCommitSha']=os.environ['LIVE_SHA']
          p.write_text(json.dumps(data, indent=2, sort_keys=True)+'\n')
          print(json.dumps(data, sort_keys=True))
          PY
              exit 0
            fi
            sleep 10
          done
          LIVE_SHA="$live_sha" python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'starsvisibility-legacy-consecutive-summary.json'
          data=json.loads(p.read_text())
          data['liveDeployment']='FAIL'
          data['liveCommitSha']=os.environ.get('LIVE_SHA') or None
          p.write_text(json.dumps(data, indent=2, sort_keys=True)+'\n')
          print(json.dumps(data, sort_keys=True))
          PY
          echo "Cloudflare Pages is not serving expected SHA $APPLICATION_SHA; observed ${live_sha:-unavailable}" >&2
          exit 1

      - name: Upload public-safe verification summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starsvisibility-legacy-consecutive-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: ${{ runner.temp }}/starsvisibility-legacy-consecutive-summary.json
