name: StarsVisibility live deployment check

on:
  pull_request:
    paths:
      - '.github/workflows/starsvisibility-live-deployment-check.yml'

permissions:
  contents: read

jobs:
  live:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_SHA: f51fbbb48372d41bca3beadedb61afeb0d231c07
      SITE: https://starsvisibility.pages.dev
    steps:
      - name: Check live deployment marker and Legacy consecutive HTML
        shell: bash
        run: |
          set -euo pipefail
          marker_file="$RUNNER_TEMP/live-marker.json"
          html_file="$RUNNER_TEMP/live-index.html"
          curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' \
            "$SITE/.well-known/level-b-software-status.json?run=$GITHUB_RUN_ID" -o "$marker_file"
          cat "$marker_file"
          live_sha="$(python -c 'import json,sys; print(json.load(open(sys.argv[1])).get("commitSha", ""))' "$marker_file")"
          echo "live_sha=$live_sha"
          test -n "$live_sha"
          if [ "$live_sha" != "$EXPECTED_SHA" ]; then
            echo "LIVE_SHA_MISMATCH expected=$EXPECTED_SHA observed=$live_sha" >&2
            exit 2
          fi
          curl --fail --silent --show-error --location --max-time 30 -H 'Cache-Control: no-cache' \
            "$SITE/?run=$GITHUB_RUN_ID" -o "$html_file"
          grep -Fq 'STARS-CLOSE-TRIPLE-MAGNITUDE-V1' "$html_file"
          grep -Fq 'STARS-CLOSE-TRIPLE-INDEPENDENT-RESULT-HOST-V1' "$html_file"
          grep -Fq 'LEGACY-THREE-STAR-CONSECUTIVE-MAIN-THREAD-V1' "$html_file"
          if grep -Fq 'if (!result?.found || !close?.enabled)' "$html_file"; then
            echo 'LIVE_OLD_RESULT_GATE_PRESENT' >&2
            exit 3
          fi
          echo 'LIVE_LEGACY_CONSECUTIVE_FIX_PASS'
