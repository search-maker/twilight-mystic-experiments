name: StarsVisibility live Legacy consecutive default probe

on:
  pull_request:
    paths:
      - '.github/workflows/starsvisibility-live-legacy-default-browser.yml'

permissions:
  contents: read

jobs:
  browser:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APPLICATION_SHA: f51fbbb48372d41bca3beadedb61afeb0d231c07
      STARSVISIBILITY_READ_TOKEN: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}
      SITE: https://starsvisibility.pages.dev
    steps:
      - name: Checkout exact private app for Playwright tooling
        uses: actions/checkout@v4
        with:
          repository: search-maker/starsvisibility
          ref: ${{ env.APPLICATION_SHA }}
          token: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}
          path: private-app
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: private-app/package-lock.json
      - name: Install Playwright tooling
        working-directory: private-app
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
      - name: Probe live Legacy defaults
        working-directory: private-app
        shell: bash
        run: |
          set -euo pipefail
          cat > legacy-default-probe.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1200 } });
          const pageErrors = [];
          page.on('pageerror', e => pageErrors.push(e.message));
          await page.goto(`${process.env.SITE}/?legacy-default-probe=${process.env.GITHUB_RUN_ID}`, { waitUntil: 'networkidle', timeout: 120000 });
          const setup = await page.evaluate(() => {
            const setValue = (id, value) => {
              const el = document.getElementById(id); if (!el) return false;
              el.value = String(value); el.dispatchEvent(new Event('input', { bubbles: true })); el.dispatchEvent(new Event('change', { bubbles: true })); return true;
            };
            const setChecked = (id, value) => {
              const el = document.getElementById(id); if (!el) return false;
              el.checked = Boolean(value); el.dispatchEvent(new Event('change', { bubbles: true })); return true;
            };
            setValue('calculatorFeature', 'three-star');
            setValue('visibilityEngineMode', 'legacy');
            globalThis.__STAR_VISIBILITY_ENGINE_MODE__ = 'legacy';
            setValue('date', '2026-08-11');
            setValue('lat', 31.778);
            setValue('lon', 35.235);
            setValue('timezone', 'Asia/Jerusalem');
            setValue('observerElevationM', 800);
            setValue('threeStarCount', 3);
            setValue('threeStarMagnitudeBasis', 'catalog');
            setValue('threeStarMagnitudeThreshold', 3);
            setChecked('threeCloseEnabled', true);
            setValue('threeCloseMaxDiameterDeg', 4);
            setValue('threeCloseMagnitudeBasis', 'effective');
            setValue('threeCloseMagnitudeThreshold', 3);
            setValue('minAlt', 0);
            if (document.getElementById('kvMode')) setValue('kvMode', 'manual');
            if (document.getElementById('kv')) setValue('kv', 0.2);
            return {
              engine: document.getElementById('visibilityEngineMode')?.value,
              closeDiameter: document.getElementById('threeCloseMaxDiameterDeg')?.value,
              closeBasis: document.getElementById('threeCloseMagnitudeBasis')?.value,
              closeThreshold: document.getElementById('threeCloseMagnitudeThreshold')?.value,
            };
          });
          console.log('SETUP', JSON.stringify(setup));
          const result = await page.evaluate(async () => {
            await calculate();
            const data = eval('threeStarResultData');
            const close = data?.closeTriple ?? null;
            const section = document.getElementById('threeCloseResultSection');
            return {
              ordinaryFound: data?.found ?? null,
              ordinaryReason: data?.reason ?? null,
              close,
              sectionExists: !!section,
              sectionHidden: section?.hidden ?? null,
              sectionText: section?.innerText ?? '',
              errorText: document.getElementById('error')?.textContent ?? ''
            };
          });
          console.log('RESULT', JSON.stringify(result));
          console.log('PAGE_ERRORS', JSON.stringify(pageErrors));
          await page.screenshot({ path: 'legacy-default-probe.png', fullPage: true });
          await browser.close();
          if (!result.close?.enabled) throw new Error('closeTriple was not enabled');
          if (!result.sectionExists) throw new Error('close result section missing');
          if (pageErrors.length) throw new Error(`page errors: ${JSON.stringify(pageErrors)}`);
          console.log('LEGACY_DEFAULT_PROBE_COMPLETE');
          NODE
          node legacy-default-probe.mjs
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-default-probe-${{ github.run_id }}
          path: private-app/legacy-default-probe.png
          if-no-files-found: warn
          retention-days: 3
