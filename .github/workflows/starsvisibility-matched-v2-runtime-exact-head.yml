name: Starsvisibility matched-stellar v2 runtime exact-head gate

on:
  pull_request:
    paths:
      - '.github/workflows/starsvisibility-matched-v2-runtime-exact-head.yml'

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APPLICATION_REPO: search-maker/starsvisibility
      APPLICATION_SHA: 4a901ba6af55315c532b6d0f5735c32aa06d7aaa
      STARSVISIBILITY_READ_TOKEN: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}

    steps:
      - name: Checkout verification lane
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Require established read-only starsvisibility credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${STARSVISIBILITY_READ_TOKEN:-}" || { echo 'Required read-only starsvisibility secret unavailable.' >&2; exit 78; }

      - name: Checkout exact starsvisibility integration head
        uses: actions/checkout@v4
        with:
          repository: search-maker/starsvisibility
          ref: ${{ env.APPLICATION_SHA }}
          token: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}
          path: app
          persist-credentials: false
          fetch-depth: 1

      - name: Verify immutable application identity and boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C app rev-parse HEAD)" = "$APPLICATION_SHA"
          git -C app remote remove origin || true
          grep -Fq '203d5b8e8a0f84e1bccf401f0db8d4e990c0061d' app/scientific-tools/visibility-v3/matched-aerosol-stellar-v2-asset-binding.json
          grep -Fq 'COMPUTATIONAL_REFERENCE_VALIDATION_PASS' app/scientific-tools/visibility-v3/matched-aerosol-stellar-v2-asset-binding.json
          grep -Fq 'test-transient-contiguous-support.mjs' app/package.json
          grep -Fq 'test-matched-aerosol-stellar-packaged-assets-v2.mjs' app/package.json
          grep -Fq 'prepare:matched-aerosol-stellar-v2' app/package.json

      - name: Set up exact Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: app/.node-version

      - name: Install exact application dependencies
        working-directory: app
        shell: bash
        run: npm ci

      - name: Fetch and verify all matched-stellar v2 assets
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          npm run prepare:matched-aerosol-stellar-v2
          node scientific-tools/visibility-v3/tests/test-matched-aerosol-stellar-packaged-assets-v2.mjs

      - name: Execute full parity and Pages build contract
        working-directory: app
        shell: bash
        env:
          GITHUB_SHA: ${{ env.APPLICATION_SHA }}
        run: |
          set -euo pipefail
          npm run build:pages

      - name: Preserve claim and parameter boundaries
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "fieldFactor: 3.14" scientific-tools/visibility-v3/level-b-current-main-adapter.mjs
          grep -Fq 'productionAuthorized": false' scientific-tools/visibility-v3/matched-aerosol-stellar-v2-asset-binding.json
          grep -Fq 'humanFirstSeeingValidated": false' scientific-tools/visibility-v3/matched-aerosol-stellar-v2-asset-binding.json
          grep -Fq 'fullSpectrumSkyValidated": false' scientific-tools/visibility-v3/matched-aerosol-stellar-v2-asset-binding.json
          grep -Fq 'pandoraOpened": false' scientific-tools/visibility-v3/matched-aerosol-stellar-v2-asset-binding.json
          test "$(git diff bfcd6ebacd8cce9f57a634d805867c49f80493be -- scientific-tools/visibility-v3/human-threshold.mjs scientific-tools/visibility-v3/transient-adaptation.mjs scientific-tools/visibility-v3/level-b-transient-contiguous-support.mjs | wc -c)" -eq 0

      - name: Seal public-safe verification summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/matched-v2-summary"
          python - <<'PY'
          import json, os
          from pathlib import Path
          out = {
              'verificationKind': 'starsvisibility-matched-stellar-v2-runtime-software-only',
              'applicationRepo': os.environ['APPLICATION_REPO'],
              'applicationSha': os.environ['APPLICATION_SHA'],
              'githubRunId': int(os.environ['GITHUB_RUN_ID']),
              'githubRunAttempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'scientificExecutionPerformed': False,
              'mysticExecutionPerformed': False,
              'productionAuthorized': False,
              'fChanged': False,
              'transientTauRetuned': False,
              'claimBoundary': 'runtime-integration-review-only',
          }
          p = Path(os.environ['RUNNER_TEMP'])/'matched-v2-summary'/'summary.json'
          p.write_text(json.dumps(out, indent=2, sort_keys=True) + '\n')
          print(json.dumps(out, sort_keys=True))
          PY

      - name: Upload public-safe software evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starsvisibility-matched-v2-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/matched-v2-summary/summary.json
