name: StarsVisibility min-alt core QA

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/starsvisibility-min-alt-core-qa.yml
      - scripts/starsvisibility-min-alt-core-qa.mjs

permissions:
  contents: read

jobs:
  min-alt-core:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TARGET_URL: https://preview-level-b-v3-sitewide-9a29.starsvisibility.pages.dev/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run final Level-B 89-degree regression
        run: node scripts/starsvisibility-min-alt-core-qa.mjs
