name: StarsVisibility Moon isolation core
on:
  pull_request:
    paths:
      - '.github/workflows/starsvisibility-moon-isolation-core.yml'
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install driver
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright-core@1.61.1 --no-save
          echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Run four decisive calculations
        env:
          SITE: https://starsvisibility.pages.dev
        run: |
          cat > core.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH});
          const page=await browser.newPage();
          const errors=[];page.on('pageerror',e=>errors.push(e.message));
          await page.goto(`${process.env.SITE}/?moon-core=${process.env.GITHUB_RUN_ID}`,{waitUntil:'networkidle',timeout:120000});
          for(const date of ['2026-05-31','2026-06-01']) for(const moonMode of ['on','off']){
            const row=await page.evaluate(async ({date,moonMode})=>{
              const set=(id,v)=>{const e=document.getElementById(id);if(!e)return; if('checked' in e&&typeof v==='boolean')e.checked=v;else e.value=String(v);e.dispatchEvent(new Event('change',{bubbles:true}));};
              set('calculatorFeature','three-star');globalThis.__STAR_VISIBILITY_ENGINE_MODE__='legacy';set('date',date);set('lat',31.778);set('lon',35.235);set('timezone','Asia/Jerusalem');set('observerElevationM',754);set('observerMode','ordinaryOrGuided');set('minAlt',3);set('threeStarCount',3);set('threeStarMagnitudeBasis','effective');set('threeStarMagnitudeThreshold',1.7);set('threeCloseEnabled',true);set('threeCloseMaxDiameterDeg',4);set('threeCloseMagnitudeBasis','effective');set('threeCloseMagnitudeThreshold',3);set('moonOn',moonMode);await calculate();const d=eval('threeStarResultData');const c=d?.closeTriple??null;return{date,moonMode,uiMoon:document.getElementById('moonOn')?.value,found:c?.found??null,minutes:c?.minutesAfterSunset??null,sunAltitude:c?.sunAltitude??null,catalogIds:c?.catalogIds??[],diameter:c?.actualDiameterDeg??null,stars:c?.stars??[],starMagnitudes:c?.starMagnitudes??[],error:document.getElementById('error')?.textContent??''};
            },{date,moonMode});
            console.log('CORE_ROW',JSON.stringify(row));
          }
          console.log('PAGE_ERRORS',JSON.stringify(errors));
          await browser.close();
          if(errors.length)throw new Error(JSON.stringify(errors));
          NODE
          node core.mjs
