name: StarsVisibility Moon isolation fast
on:
  pull_request:
    paths:
      - '.github/workflows/starsvisibility-moon-isolation-fast.yml'
permissions:
  contents: read
jobs:
  isolate-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install browser driver
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright-core@1.61.1 --no-save
          echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Run Moon comparison
        env:
          SITE: https://starsvisibility.pages.dev
        run: |
          cat > probe.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH});
          const page=await browser.newPage();
          await page.goto(`${process.env.SITE}/?moon-fast=${process.env.GITHUB_RUN_ID}`,{waitUntil:'networkidle',timeout:120000});
          const dates=['2026-05-28','2026-05-29','2026-05-30','2026-05-31','2026-06-01','2026-06-02','2026-06-03','2026-06-04'];
          for(const moonMode of ['on','off']) for(const minAlt of [3,0]) for(const date of dates){
            const row=await page.evaluate(async ({moonMode,minAlt,date})=>{
              const set=(id,value)=>{const el=document.getElementById(id);if(!el)return; if('checked' in el&&typeof value==='boolean')el.checked=value;else el.value=String(value);el.dispatchEvent(new Event('change',{bubbles:true}));};
              set('calculatorFeature','three-star');globalThis.__STAR_VISIBILITY_ENGINE_MODE__='legacy';set('date',date);set('lat',31.778);set('lon',35.235);set('timezone','Asia/Jerusalem');set('observerElevationM',754);set('observerMode','ordinaryOrGuided');set('minAlt',minAlt);set('threeStarCount',3);set('threeStarMagnitudeBasis','effective');set('threeStarMagnitudeThreshold',1.7);set('threeCloseEnabled',true);set('threeCloseMaxDiameterDeg',4);set('threeCloseMagnitudeBasis','effective');set('threeCloseMagnitudeThreshold',3);set('moonOn',moonMode);await calculate();const d=eval('threeStarResultData');const c=d?.closeTriple??null;return{moonMode,minAlt,date,uiMoon:document.getElementById('moonOn')?.value,minutes:c?.minutesAfterSunset??null,sunAltitude:c?.sunAltitude??null,catalogIds:c?.catalogIds??[],diameter:c?.actualDiameterDeg??null,stars:c?.stars??[],mags:c?.starMagnitudes??[],error:document.getElementById('error')?.textContent??''};
            },{moonMode,minAlt,date});
            console.log('ROW',JSON.stringify(row));
          }
          await browser.close();
          NODE
          node probe.mjs
