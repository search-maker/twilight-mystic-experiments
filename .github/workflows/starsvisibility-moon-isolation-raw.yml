name: StarsVisibility Moon isolation raw
on:
  pull_request:
    paths:
      - '.github/workflows/starsvisibility-moon-isolation-raw.yml'
permissions:
  contents: read
jobs:
  raw:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install driver
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright-core@1.61.1 --no-save
          echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Run raw-value Moon comparison
        env:
          SITE: https://starsvisibility.pages.dev
        run: |
          cat > raw.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH});
          const page=await browser.newPage();
          const pageErrors=[];page.on('pageerror',e=>pageErrors.push(e.message));
          await page.goto(`${process.env.SITE}/?moon-raw=${process.env.GITHUB_RUN_ID}`,{waitUntil:'networkidle',timeout:120000});
          const setup=await page.evaluate(()=>{
            const raw=(id,v)=>{const e=document.getElementById(id);if(!e)return false;if('checked' in e&&typeof v==='boolean')e.checked=v;else e.value=String(v);return true;};
            raw('calculatorFeature','three-star');globalThis.__STAR_VISIBILITY_ENGINE_MODE__='legacy';raw('lat',31.778);raw('lon',35.235);raw('timezone','Asia/Jerusalem');raw('observerElevationM',754);raw('observerMode','ordinaryOrGuided');raw('minAlt',3);raw('threeStarCount',3);raw('threeStarMagnitudeBasis','effective');raw('threeStarMagnitudeThreshold',1.7);raw('threeCloseEnabled',true);raw('threeCloseMaxDiameterDeg',4);raw('threeCloseMagnitudeBasis','effective');raw('threeCloseMagnitudeThreshold',3);return{moon:document.getElementById('moonOn')?.value,minAlt:document.getElementById('minAlt')?.value};
          });
          console.log('SETUP',JSON.stringify(setup));
          const rows=[];
          for(const date of ['2026-05-31','2026-06-01'])for(const moonMode of ['on','off']){
            const row=await page.evaluate(async ({date,moonMode})=>{
              document.getElementById('date').value=date;document.getElementById('moonOn').value=moonMode;await calculate();const d=eval('threeStarResultData');const c=d?.closeTriple??null;return{date,moonMode,uiMoon:document.getElementById('moonOn')?.value,found:c?.found??null,minutes:c?.minutesAfterSunset??null,sunAltitude:c?.sunAltitude??null,catalogIds:c?.catalogIds??[],diameter:c?.actualDiameterDeg??null,stars:c?.stars??[],starMagnitudes:c?.starMagnitudes??[],error:document.getElementById('error')?.textContent??''};
            },{date,moonMode});rows.push(row);console.log('RAW_ROW',JSON.stringify(row));
          }
          console.log('RAW_SUMMARY',JSON.stringify(rows));console.log('PAGE_ERRORS',JSON.stringify(pageErrors));await browser.close();if(pageErrors.length)throw new Error(JSON.stringify(pageErrors));
          NODE
          node raw.mjs
