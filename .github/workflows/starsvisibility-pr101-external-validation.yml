name: StarsVisibility PR101 exact-head external validation

on:
  pull_request:
    paths:
      - '.github/workflows/starsvisibility-pr101-external-validation.yml'

permissions:
  contents: read

jobs:
  validate-pr101:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact StarsVisibility PR101 head
        uses: actions/checkout@v4
        with:
          repository: search-maker/starsvisibility
          ref: 96e3ceeb3e5492620072542b3ff49f905331b90c
          path: starsvisibility
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: starsvisibility/package-lock.json

      - name: Install exact npm dependencies
        working-directory: starsvisibility
        run: npm ci

      - name: Run Level-B parity suite including matched-family integration tests
        working-directory: starsvisibility
        run: npm run test:level-b-parity

      - name: Run current-main integration suite with exact native stellar assets
        working-directory: starsvisibility
        run: npm run test:level-b-current-main

      - name: Run full Pages build contract
        working-directory: starsvisibility
        run: npm run build:pages

      - name: Record validation boundary
        run: |
          printf '%s\n' \
            'validatedRepository=search-maker/starsvisibility' \
            'validatedHead=96e3ceeb3e5492620072542b3ff49f905331b90c' \
            'scienceSolverExecution=false' \
            'pandoraOpened=false' \
            'productionDeployment=false'
