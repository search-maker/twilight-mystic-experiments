name: starsvisibility PR108 exact-head

on:
  pull_request:
    paths:
      - '.github/workflows/starsvisibility-pr108-exact-head.yml'

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APPLICATION_SHA: a97f84a90fb54a1182720335b0688d69179a01ca
      STARSVISIBILITY_READ_TOKEN: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Require read-only application credential
        shell: bash
        run: test -n "${STARSVISIBILITY_READ_TOKEN:-}" || exit 78
      - name: Checkout exact private application head
        uses: actions/checkout@v4
        with:
          repository: search-maker/starsvisibility
          ref: ${{ env.APPLICATION_SHA }}
          token: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}
          path: app
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.node-version
      - name: Verify exact head and full Pages build
        working-directory: app
        shell: bash
        env:
          GITHUB_SHA: ${{ env.APPLICATION_SHA }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPLICATION_SHA"
          npm ci
          node tests/test-three-star-level-b-atmosphere-failure.mjs
          npm run build:pages
          grep -q 'LEVEL-B-THREE-STAR-ATMOSPHERE-FAILURE-V1' dist/index.html
          grep -q "reason: failureReason" dist/index.html
          grep -q "fieldFactor: 3.14" scientific-tools/visibility-v3/level-b-current-main-adapter.mjs
          git diff --exit-code -- scientific-tools/visibility-v3/level-b-current-main-adapter.mjs scientific-tools/visibility-v3/level-b-transient-contiguous-support.mjs
      - name: Record evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr108-evidence"
          cat > "$RUNNER_TEMP/pr108-evidence/summary.json" <<EOF
          {"status":"PASS","applicationSha":"$APPLICATION_SHA","scope":"software-only atmosphere failure preservation","f314Unchanged":true,"scienceParametersChanged":false}
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: starsvisibility-pr108-exact-head-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/pr108-evidence/summary.json
