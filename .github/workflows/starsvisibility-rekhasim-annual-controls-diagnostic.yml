name: StarsVisibility Rekhasim annual controls diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/starsvisibility-rekhasim-annual-controls-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install browser driver
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright-core@1.61.1 --no-save
          echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Inspect annual controls
        shell: bash
        env:
          SITE: https://starsvisibility.pages.dev
        run: |
          set -euo pipefail
          cat > inspect.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH});
          const page=await browser.newPage({viewport:{width:1440,height:1200}});
          await page.goto(`${process.env.SITE}/?annual-controls=${process.env.GITHUB_RUN_ID}`,{waitUntil:'networkidle',timeout:120000});
          const controls=await page.evaluate(()=>Array.from(document.querySelectorAll('input,select,button')).filter(el=>/annual/i.test((el.id||'')+' '+(el.name||'')+' '+(el.textContent||''))).map(el=>({tag:el.tagName,id:el.id||'',name:el.name||'',type:el.type||'',value:el.value??'',text:(el.textContent||'').trim().slice(0,200),hidden:el.hidden||false,disabled:el.disabled||false})));
          console.log('ANNUAL_CONTROLS',JSON.stringify(controls));
          await browser.close();
          NODE
          node inspect.mjs
