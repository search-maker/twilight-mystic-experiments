name: StarsVisibility Rekhasim annual controls diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/starsvisibility-rekhasim-annual-controls-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install browser driver
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright-core@1.61.1 --no-save
          echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Inspect Annual worker lifecycle source
        shell: bash
        env:
          SITE: https://starsvisibility.pages.dev
        run: |
          set -euo pipefail
          cat > inspect.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH});
          const page=await browser.newPage();
          const errors=[]; page.on('pageerror',e=>errors.push(e.message));
          await page.goto(`${process.env.SITE}/?annual-worker-source=${process.env.GITHUB_RUN_ID}`,{waitUntil:'networkidle',timeout:120000});
          await page.waitForSelector('#calculateAnnual',{state:'attached',timeout:30000});
          const out=await page.evaluate(()=>{
            const get=(name,max=30000)=>{try{return eval(name).toString().slice(0,max)}catch(e){return String(e)}};
            const globals={};
            for(const name of ['annualBatch','annualResults','annualChartPoints','annualResultsFinal']){
              try{const v=eval(name); globals[name]=Array.isArray(v)?{type:'array',length:v.length}:v&&typeof v==='object'?{type:'object',keys:Object.keys(v)}:v;}catch(e){globals[name]=String(e)}
            }
            return {
              calculateAnnualResults:get('calculateAnnualResults',40000),
              cancelAnnualCalculation:get('cancelAnnualCalculation',16000),
              clearAnnualBatchResults:get('clearAnnualBatchResults',16000),
              setAnnualUiState:get('setAnnualUiState',12000),
              globals
            };
          });
          console.log('ANNUAL_LIFECYCLE_SOURCE',JSON.stringify(out));
          console.log('PAGE_ERRORS',JSON.stringify(errors));
          await browser.close();
          if(errors.length)throw new Error(JSON.stringify(errors));
          NODE
          node inspect.mjs
