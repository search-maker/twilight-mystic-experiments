name: StarsVisibility Rekhasim annual controls diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/starsvisibility-rekhasim-annual-controls-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install browser driver
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright-core@1.61.1 --no-save
          echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Inspect annual controls and batch values
        shell: bash
        env:
          SITE: https://starsvisibility.pages.dev
        run: |
          set -euo pipefail
          cat > inspect.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH});
          const page=await browser.newPage({viewport:{width:1440,height:1200}});
          await page.goto(`${process.env.SITE}/?annual-controls=${process.env.GITHUB_RUN_ID}`,{waitUntil:'networkidle',timeout:120000});
          await page.waitForSelector('#calculateAnnual',{state:'attached',timeout:30000});
          const info=await page.evaluate(()=>{
            const raw=(id,v)=>{const e=document.getElementById(id);if(!e)return false;if('checked' in e&&typeof v==='boolean')e.checked=v;else e.value=String(v);return true;};
            raw('calculatorFeature','three-star'); raw('moonOn','off'); raw('minAlt',3);
            raw('threeStarCount',3); raw('threeStarMagnitudeBasis','effective'); raw('threeStarMagnitudeThreshold',1.7);
            raw('threeCloseEnabled',true); raw('threeCloseMaxDiameterDeg',4); raw('threeCloseMagnitudeBasis','effective'); raw('threeCloseMagnitudeThreshold',3);
            const controls=Array.from(document.querySelectorAll('input,select,button')).filter(el=>/annual/i.test((el.id||'')+' '+(el.name||'')+' '+(el.textContent||''))).map(el=>({tag:el.tagName,id:el.id||'',type:el.type||'',value:el.value??'',text:(el.textContent||'').trim().slice(0,200),hidden:el.hidden||false,disabled:el.disabled||false}));
            let batch=null, batchError=null;
            try { batch=eval('collectThreeStarBatchValues')(); } catch(e) { batchError=String(e); }
            const pick={};
            for(const key of ['moonOn','minAlt','threeStarCount','threeStarMagnitudeBasis','threeStarMagnitudeThreshold','threeCloseEnabled','threeCloseMaxDiameterDeg','threeCloseMagnitudeBasis','threeCloseMagnitudeThreshold','excludeKnownVenus','excludeKnownJupiter','excludeKnownSirius','excludeKnownMars','excludeKnownCanopus','excludeKnownAlphaCentauri','excludeKnownArcturus']) pick[key]=batch?.[key]??null;
            return {controls,annualResultKind:document.getElementById('annualResultKind')?{value:document.getElementById('annualResultKind').value,html:document.getElementById('annualResultKind').outerHTML}:null,pick,batchError};
          });
          console.log('ANNUAL_BATCH_INFO',JSON.stringify(info));
          await browser.close();
          NODE
          node inspect.mjs
