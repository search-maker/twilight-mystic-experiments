name: StarsVisibility Rekhasim annual controls diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/starsvisibility-rekhasim-annual-controls-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install browser driver
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright-core@1.61.1 --no-save
          echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Probe full-year tooltip and annual runtime mapping
        shell: bash
        env:
          SITE: https://starsvisibility.pages.dev
        run: |
          set -euo pipefail
          cat > inspect.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH});
          const page=await browser.newPage({viewport:{width:1440,height:1600}});
          const errors=[]; page.on('pageerror',e=>errors.push(e.message));
          await page.goto(`${process.env.SITE}/?annual-tooltip-full-year=${process.env.GITHUB_RUN_ID}`,{waitUntil:'networkidle',timeout:120000});
          await page.waitForSelector('#annualResultKind',{state:'attached',timeout:30000});
          const sources=await page.evaluate(()=>({
            show:(()=>{try{return eval('showAnnualChartTooltip').toString().slice(0,12000)}catch(e){return String(e)}})(),
            draw:(()=>{try{return eval('drawAnnualChart').toString().slice(0,16000)}catch(e){return String(e)}})(),
            render:(()=>{try{return eval('renderAnnualResults').toString().slice(0,12000)}catch(e){return String(e)}})()
          }));
          console.log('ANNUAL_RUNTIME_SOURCES',JSON.stringify(sources));
          await page.evaluate(()=>{
            try { eval('uiLanguage = "he"'); eval('applyUiLanguage')(); } catch(_) {}
            const raw=(id,v)=>{const e=document.getElementById(id);if(!e)return;if('checked' in e&&typeof v==='boolean')e.checked=v;else e.value=String(v);};
            raw('calculatorFeature','three-star'); globalThis.__STAR_VISIBILITY_ENGINE_MODE__='legacy';
            raw('lat',32.74907); raw('lon',35.09901); raw('timezone','Asia/Jerusalem'); raw('observerElevationM',105);
            raw('observerMode','ordinaryOrGuided'); raw('minAlt',3); raw('moonOn','on');
            raw('threeStarCount',3); raw('threeStarMagnitudeBasis','effective'); raw('threeStarMagnitudeThreshold',1.7);
            raw('threeCloseEnabled',true); raw('threeCloseMaxDiameterDeg',4); raw('threeCloseMagnitudeBasis','effective'); raw('threeCloseMagnitudeThreshold',3);
            raw('annualCalendar','gregorian-year'); raw('annualYear','2026'); raw('annualCadence','weekly'); raw('annualResultKind','consecutive'); raw('annualChartMetric','minutes');
            document.getElementById('calculateAnnual')?.click();
          });
          await page.waitForFunction(()=>document.getElementById('calculateAnnual')?.disabled===false && document.getElementById('exportAnnualCsv')?.disabled===false,null,{timeout:300000});
          await page.waitForTimeout(700);
          const base=await page.evaluate(()=>{
            let rows=[];try{rows=eval('annualResults')||[];}catch(_){}
            let points=[];try{points=eval('annualChartPoints')||[];}catch(_){}
            return {
              moon:document.getElementById('moonOn')?.value,
              rows:rows.map((x,i)=>({i,date:x?.date??null,closeMinutes:x?.closeTriple?.minutesAfterSunset??null,closeStars:x?.closeTriple?.stars??[]})),
              points:points.map((p,i)=>{const o={i};for(const k of Object.keys(p||{})){const v=p[k];if(v==null||['string','number','boolean'].includes(typeof v))o[k]=v;}return o;})
            };
          });
          console.log('ANNUAL_ON_MAY_ROWS',JSON.stringify(base.rows.filter(x=>/^2026-(05|06)-/.test(String(x.date||'')))));
          console.log('ANNUAL_ON_MAY_POINTS',JSON.stringify(base.points.slice(17,25)));
          const canvas=page.locator('#annualChart');
          const box=await canvas.boundingBox();
          const probes=[];
          if(box){
            for(const idx of [19,20,21,22]){
              const p=base.points[idx]; if(!p||!Number.isFinite(Number(p.x)))continue;
              await page.mouse.move(box.x+Number(p.x),box.y+box.height/2);
              await page.waitForTimeout(150);
              const tip=await page.evaluate(()=>{const t=document.getElementById('annualChartTooltip');return t?{hidden:t.hidden,text:(t.textContent||'').trim(),html:t.innerHTML,left:t.style.left,top:t.style.top}:null;});
              probes.push({idx,row:base.rows[idx]??null,point:p,tip});
            }
          }
          console.log('ANNUAL_TOOLTIP_PROBES',JSON.stringify({box,probes,errors}));
          await browser.close();
          if(errors.length)throw new Error(JSON.stringify(errors));
          NODE
          node inspect.mjs
