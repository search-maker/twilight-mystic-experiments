name: StarsVisibility Rekhasim annual controls diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/starsvisibility-rekhasim-annual-controls-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install browser driver
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright-core@1.61.1 --no-save
          echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Inspect annual cache contract
        shell: bash
        env:
          SITE: https://starsvisibility.pages.dev
        run: |
          set -euo pipefail
          cat > inspect.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH});
          const page=await browser.newPage();
          const errors=[]; page.on('pageerror',e=>errors.push(e.message));
          await page.goto(`${process.env.SITE}/?annual-cache-contract=${process.env.GITHUB_RUN_ID}`,{waitUntil:'networkidle',timeout:120000});
          await page.waitForSelector('#calculateAnnual',{state:'attached',timeout:30000});
          const out=await page.evaluate(()=>{
            const get=(name,max=24000)=>{try{return eval(name).toString().slice(0,max)}catch(e){return String(e)}};
            const raw=(id,v)=>{const e=document.getElementById(id);if(!e)return;if('checked' in e&&typeof v==='boolean')e.checked=v;else e.value=String(v);};
            raw('calculatorFeature','three-star'); globalThis.__STAR_VISIBILITY_ENGINE_MODE__='legacy';
            raw('lat',32.74907); raw('lon',35.09901); raw('timezone','Asia/Jerusalem'); raw('observerElevationM',105);
            raw('observerMode','ordinaryOrGuided'); raw('minAlt',3); raw('moonOn','off');
            raw('threeStarCount',3); raw('threeStarMagnitudeBasis','effective'); raw('threeStarMagnitudeThreshold',1.7);
            raw('threeCloseEnabled',true); raw('threeCloseMaxDiameterDeg',4); raw('threeCloseMagnitudeBasis','effective'); raw('threeCloseMagnitudeThreshold',3);
            raw('annualCalendar','gregorian-year'); raw('annualYear','2026'); raw('annualCadence','weekly'); raw('annualResultKind','consecutive'); raw('annualChartMetric','minutes');
            let snapshot=null;try{snapshot=eval('currentAnnualSettingsSnapshot')()}catch(e){snapshot=String(e)}
            let modelVersion=null;try{modelVersion=eval('THREE_STAR_MODEL_VERSION')}catch(e){modelVersion=String(e)}
            return {
              currentAnnualSettingsSnapshot:get('currentAnnualSettingsSnapshot'),
              collectThreeStarBatchValues:get('collectThreeStarBatchValues'),
              hashAnnualSettings:get('hashAnnualSettings'),
              saveAnnualCache:get('saveAnnualCache'),
              pruneAnnualCache:get('pruneAnnualCache'),
              calculateAnnualResults:get('calculateAnnualResults',40000),
              snapshot,modelVersion,
              localStorageKeys:Object.keys(localStorage).filter(k=>k.startsWith('threeStarAnnualCache')).sort()
            };
          });
          console.log('ANNUAL_CACHE_CONTRACT',JSON.stringify(out));
          console.log('PAGE_ERRORS',JSON.stringify(errors));
          await browser.close();
          if(errors.length)throw new Error(JSON.stringify(errors));
          NODE
          node inspect.mjs
