name: StarsVisibility Rekhasim annual raw diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/starsvisibility-rekhasim-annual-raw-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose-annual:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install browser driver
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright-core@1.61.1 --no-save
          echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Cancel Moon-on annual run and immediately recalculate Moon-off
        shell: bash
        env:
          SITE: https://starsvisibility.pages.dev
        run: |
          set -euo pipefail
          cat > annual.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH});
          const page=await browser.newPage({viewport:{width:1440,height:1200}});
          const errors=[]; page.on('pageerror',e=>errors.push(e.message));
          await page.goto(`${process.env.SITE}/?rekhasim-annual-race=${process.env.GITHUB_RUN_ID}`,{waitUntil:'networkidle',timeout:120000});
          await page.waitForSelector('#annualResultKind',{state:'attached',timeout:30000});
          await page.evaluate(()=>{
            const raw=(id,v)=>{const e=document.getElementById(id);if(!e)return;if('checked' in e&&typeof v==='boolean')e.checked=v;else e.value=String(v);};
            raw('calculatorFeature','three-star'); globalThis.__STAR_VISIBILITY_ENGINE_MODE__='legacy';
            raw('lat',32.74907); raw('lon',35.09901); raw('timezone','Asia/Jerusalem'); raw('observerElevationM',105);
            raw('observerMode','ordinaryOrGuided'); raw('minAlt',3); raw('moonOn','on');
            raw('threeStarCount',3); raw('threeStarMagnitudeBasis','effective'); raw('threeStarMagnitudeThreshold',1.7);
            raw('threeCloseEnabled',true); raw('threeCloseMaxDiameterDeg',4); raw('threeCloseMagnitudeBasis','effective'); raw('threeCloseMagnitudeThreshold',3);
            raw('annualCalendar','gregorian-year'); raw('annualYear','2026'); raw('annualCadence','weekly'); raw('annualResultKind','consecutive'); raw('annualChartMetric','combined');
            document.getElementById('calculateAnnual')?.click();
          });
          await page.waitForFunction(()=>document.getElementById('calculateAnnual')?.disabled===true,null,{timeout:10000});
          await page.waitForFunction(()=>{try{return (eval('annualResults')||[]).length>=22}catch{return false}},null,{timeout:180000});
          const partial=await page.evaluate(()=>{let r=[];try{r=eval('annualResults')||[]}catch(_){};return {moon:document.getElementById('moonOn')?.value,rows:r.length,lastDate:r.at(-1)?.date??null,lastClose:r.at(-1)?.closeTriple?.minutesAfterSunset??null};});
          await page.evaluate(()=>{const moon=document.getElementById('moonOn');moon.value='off';moon.dispatchEvent(new Event('change',{bubbles:true}));});
          await page.waitForFunction(()=>document.getElementById('calculateAnnual')?.disabled===false,null,{timeout:10000});
          const cleared=await page.evaluate(()=>{let r=[];let p=[];try{r=eval('annualResults')||[]}catch(_){};try{p=eval('annualChartPoints')||[]}catch(_){};return {moon:document.getElementById('moonOn')?.value,rows:r.length,points:p.length,chartHidden:document.getElementById('annualChartWrap')?.hidden??null};});
          await page.evaluate(()=>document.getElementById('calculateAnnual')?.click());
          await page.waitForFunction(()=>document.getElementById('calculateAnnual')?.disabled===true,null,{timeout:10000});
          await page.waitForFunction(()=>document.getElementById('calculateAnnual')?.disabled===false && document.getElementById('exportAnnualCsv')?.disabled===false,null,{timeout:300000});
          await page.waitForTimeout(1000);
          const final=await page.evaluate(()=>{
            let r=[];let p=[];try{r=eval('annualResults')||[]}catch(_){};try{p=eval('annualChartPoints')||[]}catch(_){}
            const rows=r.map(x=>({date:x?.date??null,minutes:x?.closeTriple?.minutesAfterSunset??null,stars:x?.closeTriple?.stars??[]}));
            return {moon:document.getElementById('moonOn')?.value,rowsCount:rows.length,mayJune:rows.filter(x=>/^2026-(05|06)-/.test(String(x.date||''))),pointMinutes:p.map(x=>x?.minutes??null),exportsCurrent:(()=>{try{return eval('annualExportsAreCurrent')()}catch{return null}})(),chartHidden:document.getElementById('annualChartWrap')?.hidden??null};
          });
          console.log('ANNUAL_MOON_CANCEL_RECALCULATE',JSON.stringify({partial,cleared,final,errors}));
          await browser.close();
          if(errors.length)throw new Error(JSON.stringify(errors));
          NODE
          node annual.mjs
