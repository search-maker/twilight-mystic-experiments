name: StarsVisibility result-shape browser QA

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/starsvisibility-result-shape-browser-qa.yml
      - scripts/starsvisibility-result-shape-browser-qa.mjs

permissions:
  contents: read

jobs:
  result-shape:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TARGET_URL: https://preview-level-b-v3-sitewide-9a29.starsvisibility.pages.dev/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run result-shape parity in a real browser
        run: node scripts/starsvisibility-result-shape-browser-qa.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starsvisibility-result-shape-browser-qa
          path: |
            result-shape-desktop.png
            result-shape-mobile-390.png
          if-no-files-found: warn
