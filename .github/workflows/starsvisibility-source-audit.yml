name: StarsVisibility deployed source audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/starsvisibility-source-audit.yml
      - scripts/starsvisibility-deployed-source-audit.mjs

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_URL: https://preview-level-b-v3-sitewide-9a29.starsvisibility.pages.dev/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Inspect deployed Three-Star source
        run: node scripts/starsvisibility-deployed-source-audit.mjs
