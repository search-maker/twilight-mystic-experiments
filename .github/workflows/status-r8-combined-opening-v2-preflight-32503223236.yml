name: AFC2 R8 combined opening v2 neutral preflight 32503223236

on:
  push:
    branches:
      - status/r8-combined-opening-v2-preflight-32503223236
    paths:
      - .github/workflows/status-r8-combined-opening-v2-preflight-32503223236.yml

permissions:
  actions: read
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: afc2-r8-combined-opening-v2-neutral-preflight-32503223236
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact observer head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect v1 history and fresh v2 opening surface without scientific downloads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN: e938a5383f41220bb26ca1e681a792dbbcbcf8d3
          SOURCE_HEAD: b37aab8fd2c2f0a6b58eef79a00811c9adea02a0
          V1_REQUEST_BRANCH: status/aerosol-family-v2-r8-timeout-recovery-v1-combined-opening-publisher-run-32503223236
          V1_REQUEST_HEAD: 1d8b5c047341d3e81a69463433e26cd94d6836e7
          V1_DISPATCH_BRANCH: dispatch/aerosol-family-v2-r8-timeout-recovery-v1-combined-opening-run-32503223236
          V1_TRANSPORT_HEAD: 0ca71ea91a94707f23c1d5da31526bf4e68b1423
          V2_REQUEST_BRANCH: status/aerosol-family-v2-r8-timeout-recovery-v1-combined-opening-publisher-v2-run-32503223236
          V2_DISPATCH_BRANCH: dispatch/aerosol-family-v2-r8-timeout-recovery-v1-combined-opening-v2-run-32503223236
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          git fetch origin main "$V1_REQUEST_BRANCH" "$V1_DISPATCH_BRANCH"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse origin/$V1_REQUEST_BRANCH)" = "$V1_REQUEST_HEAD"
          test "$(git rev-parse origin/$V1_DISPATCH_BRANCH)" = "$V1_TRANSPORT_HEAD"
          mkdir -p preflight
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/32508493509" > preflight/v1-publisher-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/96853960455" > preflight/v1-publisher-job.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/aerosol-family-v2-r8-timeout-recovery-v1-combined-analysis.yml/runs?per_page=100" > preflight/original-combined-runs.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/aerosol-family-v2-r8-timeout-recovery-v1-combined-opening-recovery.yml/runs?per_page=100" > preflight/v1-opening-runs.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/aerosol-family-v2-r8-timeout-recovery-v1-combined-opening-recovery-v2.yml/runs?per_page=100" > preflight/v2-opening-runs.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls?state=all&head=${GITHUB_REPOSITORY%%/*}:authorization/aerosol-family-challenge-v2-r8-timeout-recovery-v1-ordinal-35&per_page=100" > preflight/auth-pr-pages.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/60/comments?per_page=100" > preflight/issue60-comments.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/branches?per_page=100" > preflight/branches.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          v1=json.load(open('preflight/v1-publisher-run.json')); job=json.load(open('preflight/v1-publisher-job.json'))
          original=[r for p in json.load(open('preflight/original-combined-runs.json')) for r in p.get('workflow_runs',[])]
          v1_open=[r for p in json.load(open('preflight/v1-opening-runs.json')) for r in p.get('workflow_runs',[])]
          v2_open=[r for p in json.load(open('preflight/v2-opening-runs.json')) for r in p.get('workflow_runs',[])]
          prs=[p for page in json.load(open('preflight/auth-pr-pages.json')) for p in page]
          comments=[c for page in json.load(open('preflight/issue60-comments.json')) for c in page]
          branches=[b for page in json.load(open('preflight/branches.json')) for b in page]
          names={str(b.get('name') or '') for b in branches}
          steps={str(s.get('name')):s.get('conclusion') for s in job.get('steps',[])}
          good_pr=[p for p in prs if p.get('number')==291 and p.get('state')=='open' and p.get('draft') is True and p.get('merged_at') is None and (p.get('head') or {}).get('sha')==os.environ['SOURCE_HEAD']]
          v1_alloc='AFC2_R8_TIMEOUT_RECOVERY_V1_COMBINED_OPENING_RECOVERY_ALLOCATED source_run=32503223236 transport_head='+os.environ['V1_TRANSPORT_HEAD']
          v1_consumed='AFC2_R8_TIMEOUT_RECOVERY_V1_COMBINED_OPENING_RECOVERY_CONSUMED source_run=32503223236 transport_head='+os.environ['V1_TRANSPORT_HEAD']
          v2_alloc='AFC2_R8_TIMEOUT_RECOVERY_V1_COMBINED_OPENING_RECOVERY_V2_ALLOCATED source_run=32503223236 transport_head='+os.environ['EXPECTED_MAIN']
          v2_consumed='AFC2_R8_TIMEOUT_RECOVERY_V1_COMBINED_OPENING_RECOVERY_V2_CONSUMED source_run=32503223236 transport_head='+os.environ['EXPECTED_MAIN']
          result={
            'schemaVersion':1,
            'stageId':'aerosol-family-challenge-v2-r8-timeout-recovery-v1-combined-opening-v2-preflight',
            'mainSha':os.environ['EXPECTED_MAIN'],
            'v1PublisherRunExactFailureAttempt1':v1.get('id')==32508493509 and v1.get('run_attempt')==1 and v1.get('status')=='completed' and v1.get('conclusion')=='failure' and v1.get('head_sha')==os.environ['V1_REQUEST_HEAD'],
            'v1PublisherPushAndConsumeSucceededBeforeDispatchFailure':steps.get('Actual authenticated push creates exact opening dispatch ref')=='success' and steps.get('Consume opening recovery identity exactly once after successful push')=='success' and steps.get('Dispatch exact guarded combined opening recovery')=='failure',
            'originalCombinedRunCount':len(original),
            'v1OpeningRunCount':len(v1_open),
            'v2OpeningRunCount':len(v2_open),
            'historicalAuthorizationPr291DraftOpenUnmerged':len(good_pr)==1,
            'v1RequestBranchExact':os.environ['V1_REQUEST_BRANCH'] in names,
            'v1DispatchBranchExact':os.environ['V1_DISPATCH_BRANCH'] in names,
            'v2RequestBranchExists':os.environ['V2_REQUEST_BRANCH'] in names,
            'v2DispatchBranchExists':os.environ['V2_DISPATCH_BRANCH'] in names,
            'v1AllocationMarkerCount':len([c for c in comments if str(c.get('body') or '').strip()==v1_alloc]),
            'v1ConsumedMarkerCount':len([c for c in comments if str(c.get('body') or '').strip()==v1_consumed]),
            'v2AllocationMarkerCount':len([c for c in comments if str(c.get('body') or '').strip()==v2_alloc]),
            'v2ConsumedMarkerCount':len([c for c in comments if str(c.get('body') or '').strip()==v2_consumed]),
            'scientificChannelsOpenedByPreflight':False,
          }
          ok=(result['v1PublisherRunExactFailureAttempt1'] and result['v1PublisherPushAndConsumeSucceededBeforeDispatchFailure'] and result['originalCombinedRunCount']==0 and result['v1OpeningRunCount']==0 and result['v2OpeningRunCount']==0 and result['historicalAuthorizationPr291DraftOpenUnmerged'] and result['v1RequestBranchExact'] and result['v1DispatchBranchExact'] and not result['v2RequestBranchExists'] and not result['v2DispatchBranchExists'] and result['v1AllocationMarkerCount']==1 and result['v1ConsumedMarkerCount']==1 and result['v2AllocationMarkerCount']==0 and result['v2ConsumedMarkerCount']==0)
          result['status']='PASS_CLEAN_FRESH_V2_OPENING_SURFACE' if ok else 'REFUSE_V2_OPENING_SURFACE_NOT_CLEAN'
          Path('preflight/result.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps(result,sort_keys=True))
          if not ok: raise SystemExit(result['status'])
          PY
      - name: Publish immutable v2 preflight result branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_BRANCH: status/r8-combined-opening-v2-preflight-32503223236-result
          BASE_SHA: e938a5383f41220bb26ca1e681a792dbbcbcf8d3
        run: |
          set -euo pipefail
          cp preflight/result.json /tmp/r8-combined-opening-v2-preflight.json
          if git ls-remote --exit-code --heads origin "$RESULT_BRANCH" >/dev/null 2>&1; then echo 'v2 preflight result branch exists' >&2; exit 1; fi
          git checkout --detach "$BASE_SHA"
          git switch -c "$RESULT_BRANCH"
          mkdir -p observer-result
          cp /tmp/r8-combined-opening-v2-preflight.json observer-result/preflight-v2.json
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- observer-result/preflight-v2.json
          git commit -m 'Record AFC2 R8 combined opening v2 preflight'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/${RESULT_BRANCH}"
