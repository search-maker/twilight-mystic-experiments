name: AFC2 R8 combined opening v3 neutral preflight 32503223236

on:
  push:
    branches:
      - status/r8-combined-opening-v3-preflight-32503223236
    paths:
      - .github/workflows/status-r8-combined-opening-v3-preflight-32503223236.yml

permissions:
  actions: read
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: afc2-r8-combined-opening-v3-neutral-preflight-32503223236
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact observer head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect v1 v2 history and fresh v3 opening surface without scientific downloads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN: be46eb693da71249ae47f6c186289914bf684ebc
          SOURCE_HEAD: b37aab8fd2c2f0a6b58eef79a00811c9adea02a0
          V1_REQUEST_BRANCH: status/aerosol-family-v2-r8-timeout-recovery-v1-combined-opening-publisher-run-32503223236
          V1_REQUEST_HEAD: 1d8b5c047341d3e81a69463433e26cd94d6836e7
          V1_DISPATCH_BRANCH: dispatch/aerosol-family-v2-r8-timeout-recovery-v1-combined-opening-run-32503223236
          V1_TRANSPORT_HEAD: 0ca71ea91a94707f23c1d5da31526bf4e68b1423
          V2_REQUEST_BRANCH: status/aerosol-family-v2-r8-timeout-recovery-v1-combined-opening-publisher-v2-run-32503223236
          V2_REQUEST_HEAD: b4ddc0fb20f219b5e6f9dddc50d0a5e5bfc2f37c
          V2_TRANSPORT_HEAD: e938a5383f41220bb26ca1e681a792dbbcbcf8d3
          V3_REQUEST_BRANCH: status/aerosol-family-v2-r8-timeout-recovery-v1-combined-opening-publisher-v3-run-32503223236
          V3_DISPATCH_BRANCH: dispatch/aerosol-family-v2-r8-timeout-recovery-v1-combined-opening-v3-run-32503223236
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          git fetch origin main "$V1_REQUEST_BRANCH" "$V1_DISPATCH_BRANCH" "$V2_REQUEST_BRANCH"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse origin/$V1_REQUEST_BRANCH)" = "$V1_REQUEST_HEAD"
          test "$(git rev-parse origin/$V1_DISPATCH_BRANCH)" = "$V1_TRANSPORT_HEAD"
          test "$(git rev-parse origin/$V2_REQUEST_BRANCH)" = "$V2_REQUEST_HEAD"
          mkdir -p preflight
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/32508493509" > preflight/v1-publisher-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/96853960455" > preflight/v1-publisher-job.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/32510096551" > preflight/v2-publisher-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/96858517974" > preflight/v2-publisher-job.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/aerosol-family-v2-r8-timeout-recovery-v1-combined-analysis.yml/runs?per_page=100" > preflight/original-combined-runs.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/aerosol-family-v2-r8-timeout-recovery-v1-combined-opening-recovery.yml/runs?per_page=100" > preflight/v1-opening-runs.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/aerosol-family-v2-r8-timeout-recovery-v1-combined-opening-recovery-v2.yml/runs?per_page=100" > preflight/v2-opening-runs.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/aerosol-family-v2-r8-timeout-recovery-v1-combined-opening-recovery-v3.yml/runs?per_page=100" > preflight/v3-opening-runs.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls?state=all&head=${GITHUB_REPOSITORY%%/*}:authorization/aerosol-family-challenge-v2-r8-timeout-recovery-v1-ordinal-35&per_page=100" > preflight/auth-pr-pages.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/60/comments?per_page=100" > preflight/issue60-comments.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/branches?per_page=100" > preflight/branches.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          v1=json.load(open('preflight/v1-publisher-run.json')); j1=json.load(open('preflight/v1-publisher-job.json'))
          v2=json.load(open('preflight/v2-publisher-run.json')); j2=json.load(open('preflight/v2-publisher-job.json'))
          original=[r for p in json.load(open('preflight/original-combined-runs.json')) for r in p.get('workflow_runs',[])]
          v1o=[r for p in json.load(open('preflight/v1-opening-runs.json')) for r in p.get('workflow_runs',[])]
          v2o=[r for p in json.load(open('preflight/v2-opening-runs.json')) for r in p.get('workflow_runs',[])]
          v3o=[r for p in json.load(open('preflight/v3-opening-runs.json')) for r in p.get('workflow_runs',[])]
          prs=[p for page in json.load(open('preflight/auth-pr-pages.json')) for p in page]
          comments=[c for page in json.load(open('preflight/issue60-comments.json')) for c in page]
          branches=[b for page in json.load(open('preflight/branches.json')) for b in page]
          names={str(b.get('name') or '') for b in branches}
          s1={str(s.get('name')):s.get('conclusion') for s in j1.get('steps',[])}
          s2={str(s.get('name')):s.get('conclusion') for s in j2.get('steps',[])}
          good_pr=[p for p in prs if p.get('number')==291 and p.get('state')=='open' and p.get('draft') is True and p.get('merged_at') is None and (p.get('head') or {}).get('sha')==os.environ['SOURCE_HEAD']]
          by_id={int(c.get('id') or 0):str(c.get('body') or '') for c in comments}
          v1_alloc='AFC2_R8_TIMEOUT_RECOVERY_V1_COMBINED_OPENING_RECOVERY_ALLOCATED source_run=32503223236 transport_head='+os.environ['V1_TRANSPORT_HEAD']
          v1_consumed='AFC2_R8_TIMEOUT_RECOVERY_V1_COMBINED_OPENING_RECOVERY_CONSUMED source_run=32503223236 transport_head='+os.environ['V1_TRANSPORT_HEAD']
          v2_alloc='AFC2_R8_TIMEOUT_RECOVERY_V1_COMBINED_OPENING_RECOVERY_V2_ALLOCATED source_run=32503223236 transport_head='+os.environ['V2_TRANSPORT_HEAD']
          v2_consumed='AFC2_R8_TIMEOUT_RECOVERY_V1_COMBINED_OPENING_RECOVERY_V2_CONSUMED source_run=32503223236 transport_head='+os.environ['V2_TRANSPORT_HEAD']
          v3_alloc='AFC2_R8_TIMEOUT_RECOVERY_V1_COMBINED_OPENING_RECOVERY_V3_ALLOCATED source_run=32503223236 transport_head='+os.environ['EXPECTED_MAIN']
          v3_consumed='AFC2_R8_TIMEOUT_RECOVERY_V1_COMBINED_OPENING_RECOVERY_V3_CONSUMED source_run=32503223236 transport_head='+os.environ['EXPECTED_MAIN']
          result={
            'schemaVersion':1,
            'stageId':'aerosol-family-challenge-v2-r8-timeout-recovery-v1-combined-opening-v3-preflight',
            'mainSha':os.environ['EXPECTED_MAIN'],
            'v1PublisherExactFailureAttempt1':v1.get('id')==32508493509 and v1.get('run_attempt')==1 and v1.get('status')=='completed' and v1.get('conclusion')=='failure' and v1.get('head_sha')==os.environ['V1_REQUEST_HEAD'],
            'v1PushConsumeThenDispatchFailure':s1.get('Actual authenticated push creates exact opening dispatch ref')=='success' and s1.get('Consume opening recovery identity exactly once after successful push')=='success' and s1.get('Dispatch exact guarded combined opening recovery')=='failure',
            'v2PublisherExactFailureAttempt1':v2.get('id')==32510096551 and v2.get('run_attempt')==1 and v2.get('status')=='completed' and v2.get('conclusion')=='failure' and v2.get('head_sha')==os.environ['V2_REQUEST_HEAD'],
            'v2FailedBeforePushConsumeDispatch':s2.get('Prove exact reviewed v2 transport bytes')=='success' and s2.get('Prove v1 terminal failure and fresh v2 one-use surface')=='failure' and s2.get('Actual authenticated push creates fresh v2 opening dispatch ref')=='skipped' and s2.get('Consume fresh v2 opening identity exactly once after successful push')=='skipped',
            'v1CheckpointExact': 'CONTROL_PLANE_WORKFLOW_DISPATCH_INPUT_TYPE_COERCION_HTTP_422_AFTER_OPENING_IDENTITY_CONSUMED_NO_OPENING_RUN' in by_id.get(5373207353,''),
            'v2CheckpointExact': 'CONTROL_PLANE_AUDIT_RAW_LOG_RENDER_REFUSAL_BEFORE_V2_PUSH_CONSUME_DISPATCH_NO_RESULTS_OPENED' in by_id.get(5373348599,''),
            'originalCombinedRunCount':len(original),
            'v1OpeningRunCount':len(v1o),
            'v2OpeningRunCount':len(v2o),
            'v3OpeningRunCount':len(v3o),
            'historicalAuthorizationPr291DraftOpenUnmerged':len(good_pr)==1,
            'v1RequestBranchExact':os.environ['V1_REQUEST_BRANCH'] in names,
            'v1DispatchBranchExact':os.environ['V1_DISPATCH_BRANCH'] in names,
            'v2RequestBranchExact':os.environ['V2_REQUEST_BRANCH'] in names,
            'v2DispatchBranchExists': 'dispatch/aerosol-family-v2-r8-timeout-recovery-v1-combined-opening-v2-run-32503223236' in names,
            'v3RequestBranchExists':os.environ['V3_REQUEST_BRANCH'] in names,
            'v3DispatchBranchExists':os.environ['V3_DISPATCH_BRANCH'] in names,
            'v1AllocationMarkerCount':len([c for c in comments if str(c.get('body') or '').strip()==v1_alloc]),
            'v1ConsumedMarkerCount':len([c for c in comments if str(c.get('body') or '').strip()==v1_consumed]),
            'v2AllocationMarkerCount':len([c for c in comments if str(c.get('body') or '').strip()==v2_alloc]),
            'v2ConsumedMarkerCount':len([c for c in comments if str(c.get('body') or '').strip()==v2_consumed]),
            'v3AllocationMarkerCount':len([c for c in comments if str(c.get('body') or '').strip()==v3_alloc]),
            'v3ConsumedMarkerCount':len([c for c in comments if str(c.get('body') or '').strip()==v3_consumed]),
            'scientificChannelsOpenedByPreflight':False,
          }
          ok=(result['v1PublisherExactFailureAttempt1'] and result['v1PushConsumeThenDispatchFailure'] and result['v2PublisherExactFailureAttempt1'] and result['v2FailedBeforePushConsumeDispatch'] and result['v1CheckpointExact'] and result['v2CheckpointExact'] and result['originalCombinedRunCount']==0 and result['v1OpeningRunCount']==0 and result['v2OpeningRunCount']==0 and result['v3OpeningRunCount']==0 and result['historicalAuthorizationPr291DraftOpenUnmerged'] and result['v1RequestBranchExact'] and result['v1DispatchBranchExact'] and result['v2RequestBranchExact'] and not result['v2DispatchBranchExists'] and not result['v3RequestBranchExists'] and not result['v3DispatchBranchExists'] and result['v1AllocationMarkerCount']==1 and result['v1ConsumedMarkerCount']==1 and result['v2AllocationMarkerCount']==1 and result['v2ConsumedMarkerCount']==0 and result['v3AllocationMarkerCount']==0 and result['v3ConsumedMarkerCount']==0)
          result['status']='PASS_CLEAN_FRESH_V3_OPENING_SURFACE' if ok else 'REFUSE_V3_OPENING_SURFACE_NOT_CLEAN'
          Path('preflight/result.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps(result,sort_keys=True))
          if not ok: raise SystemExit(result['status'])
          PY
      - name: Publish immutable v3 preflight result branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_BRANCH: status/r8-combined-opening-v3-preflight-32503223236-result
          BASE_SHA: be46eb693da71249ae47f6c186289914bf684ebc
        run: |
          set -euo pipefail
          cp preflight/result.json /tmp/r8-combined-opening-v3-preflight.json
          if git ls-remote --exit-code --heads origin "$RESULT_BRANCH" >/dev/null 2>&1; then echo 'v3 preflight result branch exists' >&2; exit 1; fi
          git checkout --detach "$BASE_SHA"
          git switch -c "$RESULT_BRANCH"
          mkdir -p observer-result
          cp /tmp/r8-combined-opening-v3-preflight.json observer-result/preflight-v3.json
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- observer-result/preflight-v3.json
          git commit -m 'Record AFC2 R8 combined opening v3 preflight'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/${RESULT_BRANCH}"
