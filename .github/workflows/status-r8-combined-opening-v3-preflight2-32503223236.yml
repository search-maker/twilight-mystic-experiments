name: AFC2 R8 combined opening v3 neutral preflight2 32503223236

on:
  push:
    branches:
      - status/r8-combined-opening-v3-preflight2-32503223236
    paths:
      - .github/workflows/status-r8-combined-opening-v3-preflight2-32503223236.yml

permissions:
  actions: read
  contents: write
  issues: read
  pull-requests: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect only control-plane metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN: be46eb693da71249ae47f6c186289914bf684ebc
          SOURCE_HEAD: b37aab8fd2c2f0a6b58eef79a00811c9adea02a0
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          mkdir -p preflight
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/32508493509" > preflight/v1run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/96853960455" > preflight/v1job.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/32510096551" > preflight/v2run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/96858517974" > preflight/v2job.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/aerosol-family-v2-r8-timeout-recovery-v1-combined-analysis.yml/runs?per_page=100" > preflight/original.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/aerosol-family-v2-r8-timeout-recovery-v1-combined-opening-recovery.yml/runs?per_page=100" > preflight/v1open.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/aerosol-family-v2-r8-timeout-recovery-v1-combined-opening-recovery-v2.yml/runs?per_page=100" > preflight/v2open.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/aerosol-family-v2-r8-timeout-recovery-v1-combined-opening-recovery-v3.yml/runs?per_page=100" > preflight/v3open.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls?state=all&head=${GITHUB_REPOSITORY%%/*}:authorization/aerosol-family-challenge-v2-r8-timeout-recovery-v1-ordinal-35&per_page=100" > preflight/prs.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/60/comments?per_page=100" > preflight/comments.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/branches?per_page=100" > preflight/branches.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          def runs(path):
              return [r for p in json.load(open(path)) for r in p.get('workflow_runs',[])]
          v1=json.load(open('preflight/v1run.json')); j1=json.load(open('preflight/v1job.json'))
          v2=json.load(open('preflight/v2run.json')); j2=json.load(open('preflight/v2job.json'))
          prs=[p for page in json.load(open('preflight/prs.json')) for p in page]
          comments=[c for page in json.load(open('preflight/comments.json')) for c in page]
          branches={b.get('name') for page in json.load(open('preflight/branches.json')) for b in page}
          s1={s.get('name'):s.get('conclusion') for s in j1.get('steps',[])}
          s2={s.get('name'):s.get('conclusion') for s in j2.get('steps',[])}
          by_id={int(c.get('id') or 0):str(c.get('body') or '') for c in comments}
          main=os.environ['EXPECTED_MAIN']
          v3_alloc=f'AFC2_R8_TIMEOUT_RECOVERY_V1_COMBINED_OPENING_RECOVERY_V3_ALLOCATED source_run=32503223236 transport_head={main}'
          v3_consumed=f'AFC2_R8_TIMEOUT_RECOVERY_V1_COMBINED_OPENING_RECOVERY_V3_CONSUMED source_run=32503223236 transport_head={main}'
          good_pr=[p for p in prs if p.get('number')==291 and p.get('state')=='open' and p.get('draft') is True and p.get('merged_at') is None and (p.get('head') or {}).get('sha')==os.environ['SOURCE_HEAD']]
          out={
            'schemaVersion':1,
            'stageId':'afc2-r8-combined-opening-v3-preflight2',
            'mainSha':main,
            'v1FailureExact':v1.get('id')==32508493509 and v1.get('run_attempt')==1 and v1.get('conclusion')=='failure' and s1.get('Actual authenticated push creates exact opening dispatch ref')=='success' and s1.get('Consume opening recovery identity exactly once after successful push')=='success' and s1.get('Dispatch exact guarded combined opening recovery')=='failure',
            'v2FailureExact':v2.get('id')==32510096551 and v2.get('run_attempt')==1 and v2.get('conclusion')=='failure' and s2.get('Prove exact reviewed v2 transport bytes')=='success' and s2.get('Prove v1 terminal failure and fresh v2 one-use surface')=='failure' and s2.get('Actual authenticated push creates fresh v2 opening dispatch ref')=='skipped',
            'v1CheckpointExact':'CONTROL_PLANE_WORKFLOW_DISPATCH_INPUT_TYPE_COERCION_HTTP_422_AFTER_OPENING_IDENTITY_CONSUMED_NO_OPENING_RUN' in by_id.get(5373207353,''),
            'v2CheckpointExact':'CONTROL_PLANE_AUDIT_RAW_LOG_RENDER_REFUSAL_BEFORE_V2_PUSH_CONSUME_DISPATCH_NO_RESULTS_OPENED' in by_id.get(5373348599,''),
            'originalCombinedRunCount':len(runs('preflight/original.json')),
            'v1OpeningRunCount':len(runs('preflight/v1open.json')),
            'v2OpeningRunCount':len(runs('preflight/v2open.json')),
            'v3OpeningRunCount':len(runs('preflight/v3open.json')),
            'pr291DraftOpenUnmerged':len(good_pr)==1,
            'v3RequestBranchExists':'status/aerosol-family-v2-r8-timeout-recovery-v1-combined-opening-publisher-v3-run-32503223236' in branches,
            'v3DispatchBranchExists':'dispatch/aerosol-family-v2-r8-timeout-recovery-v1-combined-opening-v3-run-32503223236' in branches,
            'v3AllocationMarkerCount':sum(str(c.get('body') or '').strip()==v3_alloc for c in comments),
            'v3ConsumedMarkerCount':sum(str(c.get('body') or '').strip()==v3_consumed for c in comments),
            'scientificChannelsOpenedByPreflight':False,
          }
          ok=(out['v1FailureExact'] and out['v2FailureExact'] and out['v1CheckpointExact'] and out['v2CheckpointExact'] and out['originalCombinedRunCount']==0 and out['v1OpeningRunCount']==0 and out['v2OpeningRunCount']==0 and out['v3OpeningRunCount']==0 and out['pr291DraftOpenUnmerged'] and not out['v3RequestBranchExists'] and not out['v3DispatchBranchExists'] and out['v3AllocationMarkerCount']==0 and out['v3ConsumedMarkerCount']==0)
          out['status']='PASS_CLEAN_FRESH_V3_OPENING_SURFACE' if ok else 'REFUSE_V3_OPENING_SURFACE_NOT_CLEAN'
          Path('preflight/result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          if not ok: raise SystemExit(out['status'])
          PY
      - name: Publish readback result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_BRANCH: status/r8-combined-opening-v3-preflight2-32503223236-result
          BASE_SHA: be46eb693da71249ae47f6c186289914bf684ebc
        run: |
          set -euo pipefail
          cp preflight/result.json /tmp/preflight-v3.json
          if git ls-remote --exit-code --heads origin "$RESULT_BRANCH" >/dev/null 2>&1; then exit 1; fi
          git checkout --detach "$BASE_SHA"
          git switch -c "$RESULT_BRANCH"
          mkdir -p observer-result
          cp /tmp/preflight-v3.json observer-result/preflight-v3.json
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- observer-result/preflight-v3.json
          git commit -m 'Record AFC2 R8 combined opening v3 preflight readback'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/${RESULT_BRANCH}"
