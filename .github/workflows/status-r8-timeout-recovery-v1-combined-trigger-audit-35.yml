name: AFC2 R8 timeout recovery v1 combined trigger audit 35

on:
  push:
    branches:
      - status/r8-timeout-recovery-v1-combined-trigger-audit-35
    paths:
      - .github/workflows/status-r8-timeout-recovery-v1-combined-trigger-audit-35.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: afc2-r8-timeout-recovery-v1-combined-trigger-audit-35
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout audit head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect workflow registration and workflow_run history only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SCIENCE_RUN_ID: '32503223236'
          AUTH_HEAD: b37aab8fd2c2f0a6b58eef79a00811c9adea02a0
          AUTH_PARENT: 19bd924ab86ed0744b3fd77ce5d6756039674d5f
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = status/r8-timeout-recovery-v1-combined-trigger-audit-35
          mkdir -p audit
          gh api "repos/${GITHUB_REPOSITORY}" > audit/repository.json
          gh api "repos/${GITHUB_REPOSITORY}/branches/main" > audit/main.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/aerosol-family-v2-r8-timeout-recovery-v1-execution.yml" > audit/science-workflow.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/aerosol-family-v2-r8-timeout-recovery-v1-combined-analysis.yml" > audit/combined-workflow.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SCIENCE_RUN_ID}" > audit/science-run.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/aerosol-family-v2-r8-timeout-recovery-v1-combined-analysis.yml/runs?per_page=100" > audit/combined-runs.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs?event=workflow_run&per_page=100" > audit/repository-workflow-run-events.json
          python - <<'PY'
          import json, os
          from pathlib import Path

          def load(name): return json.loads(Path('audit',name).read_text())
          def flat(name,key='workflow_runs'):
              pages=load(name)
              return [r for page in pages for r in page.get(key,[])]

          repo=load('repository.json'); main=load('main.json'); sw=load('science-workflow.json'); cw=load('combined-workflow.json'); sci=load('science-run.json')
          runs=flat('combined-runs.json')
          repo_wr=flat('repository-workflow-run-events.json')
          expected_title=f'AFC2 R8 timeout recovery v1 combined analysis recovery-run-{os.environ["SCIENCE_RUN_ID"]}'
          exact=[r for r in runs if r.get('display_title')==expected_title]
          related=[r for r in runs if 'AFC2 R8 timeout recovery v1 combined analysis' in str(r.get('name') or '') or 'timeout-recovery-v1-combined-analysis' in str(r.get('path') or '')]
          repo_related=[r for r in repo_wr if 'timeout recovery v1' in (str(r.get('name') or '')+' '+str(r.get('display_title') or '')).lower() or 'timeout-recovery-v1' in str(r.get('path') or '')]
          out={
            'schemaVersion':1,
            'stageId':'aerosol-family-challenge-v2-r8-timeout-recovery-v1-combined-trigger-audit-35',
            'defaultBranch':repo.get('default_branch'),
            'mainSha':(main.get('commit') or {}).get('sha'),
            'expectedMainSha':os.environ['AUTH_PARENT'],
            'scienceWorkflow':{k:sw.get(k) for k in ('id','name','path','state')},
            'combinedWorkflow':{k:cw.get(k) for k in ('id','name','path','state')},
            'scienceRun':{k:sci.get(k) for k in ('id','name','display_title','path','event','status','conclusion','run_attempt','head_branch','head_sha','created_at','updated_at')},
            'expectedCombinedDisplayTitle':expected_title,
            'combinedWorkflowRunCount':len(runs),
            'exactCombinedRunCountForScience':len(exact),
            'combinedRuns':[ {k:r.get(k) for k in ('id','name','display_title','path','event','status','conclusion','run_attempt','head_branch','head_sha','created_at','updated_at')} for r in runs[:25] ],
            'repositoryWorkflowRunRelatedCount':len(repo_related),
            'repositoryWorkflowRunRelated':[ {k:r.get(k) for k in ('id','name','display_title','path','event','status','conclusion','run_attempt','head_branch','head_sha','created_at','updated_at')} for r in repo_related[:25] ],
            'scientificChannelsOpenedByAudit':False,
          }
          if len(exact)>1: raise SystemExit('duplicate exact combined-analysis runs')
          Path('audit/result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY
      - name: Publish immutable trigger-audit result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_BRANCH: status/r8-timeout-recovery-v1-combined-trigger-audit-35-result
          BASE_SHA: 19bd924ab86ed0744b3fd77ce5d6756039674d5f
        run: |
          set -euo pipefail
          cp audit/result.json /tmp/r8-recovery-combined-trigger-audit-35.json
          if git ls-remote --exit-code --heads origin "$RESULT_BRANCH" >/dev/null 2>&1; then
            echo 'trigger-audit result branch already exists; refuse overwrite' >&2
            exit 1
          fi
          git checkout --detach "$BASE_SHA"
          git switch -c "$RESULT_BRANCH"
          mkdir -p observer-result
          cp /tmp/r8-recovery-combined-trigger-audit-35.json observer-result/combined-trigger-audit.json
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- observer-result/combined-trigger-audit.json
          git commit -m 'Record AFC2 R8 recovery combined trigger audit'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/${RESULT_BRANCH}"
