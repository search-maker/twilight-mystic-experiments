name: AFC2 R8 corrected v3 publisher neutral observer

on:
  push:
    branches:
      - status/r8-v3-publisher-observer-32503223236
    paths:
      - .github/workflows/status-r8-v3-publisher-observer-32503223236.yml

permissions:
  actions: read
  contents: write
  issues: read

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read exact publisher run state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_BRANCH: status/aerosol-family-v2-r8-timeout-recovery-v1-combined-opening-publisher-v3-run-32503223236
          REQUEST_HEAD: ab068cd16b214651d5f6789127e86d35e09b8ec1
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/aerosol-family-v2-r8-timeout-recovery-v1-combined-opening-publisher-v3.yml/runs?branch=${REQUEST_BRANCH}&event=push&per_page=100" > runs.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/60/comments?per_page=100" > comments.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          runs=[r for p in json.load(open('runs.json')) for r in p.get('workflow_runs',[])]
          same=[r for r in runs if r.get('head_branch')==os.environ['REQUEST_BRANCH'] and r.get('head_sha')==os.environ['REQUEST_HEAD']]
          comments=[c for p in json.load(open('comments.json')) for c in p]
          consumed='AFC2_R8_TIMEOUT_RECOVERY_V1_COMBINED_OPENING_RECOVERY_V3_CONSUMED source_run=32503223236 transport_head=2a9feb864fe7bf328074854d22f0e3c6a5cb7616'
          out={'schemaVersion':1,'stageId':'afc2-r8-corrected-v3-publisher-observer','matchingRunCount':len(same),'consumedMarkerCount':sum(str(c.get('body') or '').strip()==consumed for c in comments),'scientificChannelsOpened':False}
          if same:
              r=sorted(same,key=lambda x:x.get('created_at') or '')[-1]
              out.update({'runId':r.get('id'),'runAttempt':r.get('run_attempt'),'status':r.get('status'),'conclusion':r.get('conclusion'),'headSha':r.get('head_sha'),'headBranch':r.get('head_branch'),'createdAt':r.get('created_at'),'updatedAt':r.get('updated_at')})
          Path('result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
      - name: Publish observer result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_BRANCH: status/r8-v3-publisher-observer-32503223236-result
          BASE_SHA: 2a9feb864fe7bf328074854d22f0e3c6a5cb7616
        run: |
          set -euo pipefail
          cp result.json /tmp/result.json
          if git ls-remote --exit-code --heads origin "$RESULT_BRANCH" >/dev/null 2>&1; then exit 1; fi
          git checkout --detach "$BASE_SHA"
          git switch -c "$RESULT_BRANCH"
          mkdir -p observer-result
          cp /tmp/result.json observer-result/publisher.json
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add observer-result/publisher.json
          git commit -m 'Record corrected AFC2 R8 v3 publisher state'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/${RESULT_BRANCH}"
