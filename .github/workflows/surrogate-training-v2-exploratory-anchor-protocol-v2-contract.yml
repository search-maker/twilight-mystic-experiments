name: Surrogate training v2 exploratory anchor protocol v2 contract

on:
  pull_request:
    paths:
      - ".github/workflows/surrogate-training-v2-exploratory-anchor-protocol-v2-contract.yml"
      - "modeling/surrogate-training-v2/exploratory_anchor_protocol.json"
      - "modeling/surrogate-training-v2/exploratory_anchor_evaluation.py"
      - "tests/test_surrogate_training_v2_exploratory_anchor_evaluation.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: surrogate-training-v2-exploratory-anchor-protocol-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"

      - name: Prove attempt-one unopened-anchor boundary
        env:
          EXPECTED_BASE_SHA: "ae178bb94ddbc3d88a2a9f9e24cebe1a365a1170"
          ACTUAL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$ACTUAL_BASE_SHA" = "$EXPECTED_BASE_SHA"
          python - <<'PY'
          from pathlib import Path
          paths=(
              Path('modeling/surrogate-training-v2/exploratory_anchor_protocol.json'),
              Path('modeling/surrogate-training-v2/exploratory_anchor_evaluation.py'),
          )
          text='\n'.join(path.read_text(encoding='utf-8') for path in paths)
          workflow=Path('.github/workflows/surrogate-training-v2-exploratory-anchor-protocol-v2-contract.yml').read_text(encoding='utf-8')
          forbidden=(
              '8890' + '906227',
              'twilight-surrogate-tier-1-' + 'proposal-v1',
              'validated-reference-' + 'anchors.json',
              'workflow_' + 'dispatch',
          )
          found=[token for token in forbidden if token in workflow]
          if found:
              raise SystemExit(f'anchor protocol workflow exposed anchor-opening surface: {found}')
          evaluator_command='python modeling/surrogate-training-v2/' + 'exploratory_anchor_evaluation.py'
          if evaluator_command in workflow:
              raise SystemExit('review-only workflow must not execute real anchor evaluation')
          if 'openedInternalHoldoutUsedForSelection' not in text:
              raise SystemExit('v2 no-holdout-use boundary missing')
          PY

      - name: Download exact frozen v2 model artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib,io,json,os,urllib.parse,urllib.request,zipfile
          from pathlib import Path
          artifact_id=8969169714
          expected_name='surrogate-training-v2-exploratory-noisy-label-v2-contract'
          expected_run=31105103370
          expected_head='ca6da420cd7acfbcfad77c4f55eecc78b4e1bdfe'
          expected_zip='b5d64aab87066eea029ef57dcfcfb1e50753a54a848c73641adc2a308ad18a3e'
          expected_member='exploratory-training-only-model-v2.json'
          expected_raw='2497c0b78f552a03564565e44d2b633828428eda0bc967954f646cfdf1dd0cb5'
          repository=os.environ['REPOSITORY']; token=os.environ['GH_TOKEN']
          root=f'https://api.github.com/repos/{repository}'
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'surrogate-training-v2-anchor-protocol'}
          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,response_headers,newurl):
                  redirected=super().redirect_request(req,fp,code,msg,response_headers,newurl)
                  if redirected is not None and urllib.parse.urlparse(req.full_url).netloc != urllib.parse.urlparse(newurl).netloc:
                      redirected.remove_header('Authorization')
                  return redirected
          opener=urllib.request.build_opener(SafeRedirect())
          def request(url):
              with opener.open(urllib.request.Request(url,headers=headers),timeout=90) as response:
                  return response.read()
          metadata=json.loads(request(f'{root}/actions/artifacts/{artifact_id}'))
          workflow=metadata.get('workflow_run',{})
          if metadata.get('name')!=expected_name or workflow.get('id')!=expected_run or workflow.get('head_sha')!=expected_head:
              raise SystemExit('frozen v2 model artifact identity changed')
          data=request(metadata['archive_download_url'])
          digest=hashlib.sha256(data).hexdigest()
          if digest!=expected_zip or metadata.get('digest','').removeprefix('sha256:')!=expected_zip:
              raise SystemExit('frozen v2 model artifact ZIP digest changed')
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              raw=archive.read(expected_member)
          if hashlib.sha256(raw).hexdigest()!=expected_raw:
              raise SystemExit('frozen v2 model member hash changed')
          output=Path('review-source'); output.mkdir()
          (output/expected_member).write_bytes(raw)
          PY

      - name: Verify frozen anchor protocol and model contracts
        env:
          ANCHOR_V2_MODEL_PATH: review-source/exploratory-training-only-model-v2.json
        run: |
          python -m unittest -v tests/test_surrogate_training_v2_exploratory_anchor_evaluation.py
          python -m py_compile \
            modeling/surrogate-training-v2/exploratory_anchor_evaluation.py \
            tests/test_surrogate_training_v2_exploratory_anchor_evaluation.py

      - name: Seal review-only anchor protocol evidence
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          mkdir -p review
          cp modeling/surrogate-training-v2/exploratory_anchor_protocol.json review/
          cp review-source/exploratory-training-only-model-v2.json review/
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          def raw(path): return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          value={
              'schemaVersion':1,
              'stageId':'surrogate-training-v2-exploratory-external-anchor-protocol-v2-review',
              'status':'REVIEW_ONLY_EXTERNAL_ANCHOR_PROTOCOL_PASSED',
              'headSha':os.environ['HEAD_SHA'],
              'baseSha':os.environ['BASE_SHA'],
              'runId':int(os.environ['RUN_ID']),
              'runAttempt':int(os.environ['RUN_ATTEMPT']),
              'protocolRawSha256':raw('modeling/surrogate-training-v2/exploratory_anchor_protocol.json'),
              'protocolSha256':'7ddeb3d0c4e29a8e419513339e50925d09a340d8fe86c651ea7f0e7b277b8a77',
              'modelRawSha256':raw('review-source/exploratory-training-only-model-v2.json'),
              'modelHash':'c75971120e778e9ca85ffec81cdd8aa362fd46be364b436c54ef6cdf2a82bcac',
              'anchorValuesRead':False,
              'hardAnchorsOpened':False,
              'softDiagnosticsOpened':False,
              'selectionFromAnchorsForbidden':True,
              'thresholdTuningFromAnchorsForbidden':True,
              'tier2Authorized':False,
              'productionModelReady':False,
              'productionPromotionAuthorized':False,
          }
          value['reviewSha256']=hashlib.sha256(json.dumps(value,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          Path('review/anchor-protocol-review.json').write_text(json.dumps(value,indent=2,sort_keys=True)+'\n')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: surrogate-training-v2-exploratory-anchor-protocol-v2-contract
          path: review
          if-no-files-found: error
          retention-days: 90
