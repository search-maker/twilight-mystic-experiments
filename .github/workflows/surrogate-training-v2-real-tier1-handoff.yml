name: Surrogate training v2 real Tier-1 handoff
run-name: Tier-1 v2 artifact handoff | descriptor=${{ inputs.source_descriptor_path }}

on:
  workflow_dispatch:
    inputs:
      source_descriptor_path:
        description: Reviewed committed immutable future-source descriptor path
        required: true
        type: string
      source_descriptor_raw_sha256:
        description: Exact raw SHA-256 of the reviewed descriptor file
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: surrogate-training-v2-real-tier1-handoff-${{ inputs.source_descriptor_raw_sha256 }}
  cancel-in-progress: false

env:
  REFERENCE_RUN_ID: "30905632743"
  REFERENCE_ARTIFACT: twilight-surrogate-tier-1-proposal-v1
  SOURCE_DESCRIPTOR: ${{ inputs.source_descriptor_path }}
  SOURCE_GUARD: modeling/surrogate-training-v2/real_handoff_guard.py
  HANDOFF: modeling/surrogate-training-v2/tier1_handoff.py

jobs:
  handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"

      - name: Resolve reviewed immutable future-source descriptor
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          case "$SOURCE_DESCRIPTOR" in
            modeling/surrogate-training-v2/future-tier1-source-*.json) ;;
            *) echo "source descriptor must be a scoped committed future-tier1-source JSON file" >&2; exit 2 ;;
          esac
          git ls-files --error-unmatch -- "$SOURCE_DESCRIPTOR"
          test "$(git ls-files -s -- "$SOURCE_DESCRIPTOR" | wc -l)" -eq 1
          test "$(git ls-files -s -- "$SOURCE_DESCRIPTOR" | awk '{print $1}')" = "100644"
          python "$SOURCE_GUARD" \
            --source-descriptor "$SOURCE_DESCRIPTOR" \
            --source-descriptor-raw-sha256 "${{ inputs.source_descriptor_raw_sha256 }}" \
            --resolve-descriptor \
            --github-env "$GITHUB_ENV"

      - name: Fetch exact source and frozen-reference metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p metadata
          gh api "repos/${{ github.repository }}/actions/runs/$SOURCE_RUN_ID" > metadata/source-run.json
          gh api "repos/${{ github.repository }}/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100&page=1" > metadata/source-artifacts.json
          gh api "repos/${{ github.repository }}/actions/runs/$REFERENCE_RUN_ID" > metadata/reference-run.json
          gh api "repos/${{ github.repository }}/actions/runs/$REFERENCE_RUN_ID/artifacts?per_page=100&page=1" > metadata/reference-artifacts.json

      - name: Download exact source preflight only
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_PREFLIGHT_ARTIFACT }}
          path: preflight
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download exact frozen reference anchors
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.REFERENCE_ARTIFACT }}
          path: reference
          repository: ${{ github.repository }}
          run-id: ${{ env.REFERENCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse consumed, nonterminal, retried, incomplete, or drifted sources
        run: >-
          python "$SOURCE_GUARD"
          --source-descriptor "$SOURCE_DESCRIPTOR"
          --source-descriptor-raw-sha256 "$SOURCE_DESCRIPTOR_RAW_SHA256"
          --source-run metadata/source-run.json
          --plan "preflight/plan.json"
          --source-artifacts metadata/source-artifacts.json
          --manifest "preflight/$SOURCE_MANIFEST_RELATIVE_PATH"
          --reference-run metadata/reference-run.json
          --reference-artifacts metadata/reference-artifacts.json
          --handoff-head-sha "$GITHUB_SHA"
          --output metadata/source-guard.json

      - name: Download exact 96 case artifacts after terminal guard
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.SOURCE_CASE_PATTERN }}
          path: case-artifacts
          merge-multiple: true
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download exact aggregate
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_AGGREGATE_ARTIFACT }}
          path: aggregate-output
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download exact independent audit
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_AUDIT_ARTIFACT }}
          path: audit-output
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download exact precision analysis
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ANALYSIS_ARTIFACT }}
          path: analysis-output
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build strict Tier-1 v2 dataset envelope without fitting
        run: >-
          python "$HANDOFF"
          --manifest "preflight/$SOURCE_MANIFEST_RELATIVE_PATH"
          --plan preflight/plan.json
          --summary aggregate-output/batch-summary.json
          --audit audit-output/audit-report.json
          --analysis analysis-output/tier1-analysis.json
          --v1-dataset analysis-output/tier1-numerical-dataset.json
          --reference-anchors reference/validated-reference-anchors.json
          --source-run metadata/source-run.json
          --artifact-list metadata/source-artifacts.json
          --source-guard metadata/source-guard.json
          --main-sha "$SOURCE_RUN_HEAD_SHA"
          --output-dir handoff-output

      - name: Verify handoff remains non-authorizing and non-production
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          guard = json.loads(Path('metadata/source-guard.json').read_text())
          envelope = json.loads(Path('handoff-output/dataset-envelope.json').read_text())
          dataset = json.loads(Path('handoff-output/tier1-numerical-dataset.json').read_text())
          design = json.loads(Path('handoff-output/frozen-design.json').read_text())

          source_run_id = int(os.environ['SOURCE_RUN_ID'])
          source_head_sha = os.environ['SOURCE_RUN_HEAD_SHA']
          assert guard['status'] == 'REAL_TIER1_HANDOFF_SOURCE_ACCEPTED'
          assert guard['sourceRunId'] == source_run_id
          assert guard['sourceRunId'] != 30952457327
          assert guard['sourceArtifactCount'] == 100
          assert guard['caseArtifactCount'] == 96
          assert envelope['sourceRunId'] == source_run_id
          assert envelope['sourceRunHeadSha'] == source_head_sha
          assert envelope['exactMainSha'] == source_head_sha
          assert envelope['bindings']['sourceGuardRawSha256']
          assert envelope['bindings']['sourceDescriptorRawSha256'] == guard['sourceDescriptorRawSha256']
          assert envelope['bindings']['sourcePlanRawSha256'] == guard['sourcePlanRawSha256']
          assert envelope['bindings']['sourceArtifactListGuardRawSha256'] == guard['sourceArtifactListRawSha256']
          for value in (envelope, dataset, design):
              assert value['syntheticOnly'] is False
              assert value['scientificExecution'] is True
              assert value['observationallyValidated'] is False
              assert value['productionModelReady'] is False
              assert value['successDoesNotAuthorizeProduction'] is True
          assert guard['surrogateTrainingAuthorized'] is False
          assert guard['internalHoldoutOpeningAuthorized'] is False
          assert guard['tier2Authorized'] is False
          assert guard['productionPromotionAuthorized'] is False
          assert envelope['authorizationPermitted'] is False
          assert envelope['tier2AutomaticallyPermitted'] is False
          assert envelope['productionPromotionAuthorized'] is False
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: surrogate-training-v2-tier1-real-handoff-${{ env.SOURCE_RUN_ID }}
          path: |
            handoff-output
            metadata/source-run.json
            metadata/source-artifacts.json
            metadata/reference-run.json
            metadata/reference-artifacts.json
            metadata/source-guard.json
            ${{ inputs.source_descriptor_path }}
          if-no-files-found: error
          retention-days: 90
