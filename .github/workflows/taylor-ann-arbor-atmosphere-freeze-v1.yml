name: Taylor Ann Arbor atmosphere freeze v1
run-name: Taylor Ann Arbor atmosphere freeze v1 | ${{ github.event.pull_request.head.sha || github.sha }}

on:
  pull_request:
    paths:
      - 'experiments/taylor-ann-arbor-atmosphere-freeze-v1/**'
      - '.github/workflows/taylor-ann-arbor-atmosphere-freeze-v1.yml'

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch AERONET first, then frozen CAMS fallback
        run: |
          set +e
          python experiments/taylor-ann-arbor-atmosphere-freeze-v1/fetch_and_freeze_v2.py atmosphere-artifact
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "AERONET primary frozen"
          elif [ "$rc" -eq 42 ]; then
            echo "AERONET unavailable under preregistered rule; using CAMS fallback"
            python experiments/taylor-ann-arbor-atmosphere-freeze-v1/fetch_cams_fallback.py atmosphere-artifact
          else
            exit "$rc"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taylor-ann-arbor-atmosphere-freeze-v1
          path: atmosphere-artifact
          if-no-files-found: error
          retention-days: 90
