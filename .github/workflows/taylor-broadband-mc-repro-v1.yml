name: Taylor broadband Monte Carlo reproducibility v1
run-name: Taylor broadband MC reproducibility v1 | ${{ github.event.pull_request.head.sha }}

on:
  pull_request:
    types: [opened]
    paths:
      - 'experiments/taylor-broadband-mc-repro-v1/**'
      - '.github/workflows/taylor-broadband-mc-repro-v1.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: taylor-broadband-mc-repro-v1-scientific-1
  cancel-in-progress: false

env:
  PKG: experiments/taylor-broadband-mc-repro-v1
  REVIEW_PARENT: 68556d5a794af06115b542b56647267e4cce35fc
  BROADBAND_REVIEW_SOURCE: 75035d9ea316af574b2fac50f52c43c633b2bdbc
  TAYLOR_SOURCE_SHA: 7231bd873859cc8c36fe6749985e0ece193b5de7
  HRRR_SHAPE_SOURCE_SHA: 3b32dfba4d861c0db8a4c2dac3e2d5c4ce73e359
  DERIVED_SOURCE_SHA: 86d4432cc902e50e09811558465e9fa489c57ea2
  HRRR_ARTIFACT_ID: '9630599968'
  HRRR_ARTIFACT_SHA256: afd3f5fbf3e20674a1c5432112ce36fcb7f6678690f9ea8cff5ef6bcca5d5c9c
  HRRR_RAW_SHA256: 929e787c15f8d689bf63a732152eb552e621542325e4942d4d48bf91eb6d75a9
  PRIOR_RUN_ID: '33042326594'
  RUNTIME_LOCK: experiments/mystic-batch-v1/runtime-lock.micromamba.json
  RUNTIME_PROBE: experiments/mystic-batch-v1/runtime_probe.py

jobs:
  preflight:
    if: github.head_ref == 'science/taylor-broadband-mc-repro-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      head: ${{ steps.identity.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - id: identity
        name: Verify one-shot science identity and reviewed parent
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_HEAD_REF" = "science/taylor-broadband-mc-repro-v1"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD^)" = "$REVIEW_PARENT"
          git fetch --no-tags --depth=1 origin "$REVIEW_PARENT"
          git diff --exit-code "$REVIEW_PARENT" HEAD -- \
            "$PKG" \
            tests/test_taylor_broadband_mc_repro_v1_review.py \
            .github/workflows/taylor-broadband-mc-repro-v1-review.yml
          python - <<'PY'
          import ast,pathlib
          p=pathlib.Path('experiments/taylor-broadband-mc-repro-v1/run_fresh_replicate.py')
          tree=ast.parse(p.read_text())
          vals={}
          for node in tree.body:
              if isinstance(node,ast.Assign) and len(node.targets)==1 and isinstance(node.targets[0],ast.Name):
                  name=node.targets[0].id
                  if name in {'ROWS','REPLICATES','SEED_BASE','EXPECTED_PHOTONS'}:
                      vals[name]=ast.literal_eval(node.value)
          assert vals['ROWS']==[23,24,25]
          assert vals['REPLICATES']==[3,4,5,6]
          assert vals['EXPECTED_PHOTONS']==50000
          assert vals['SEED_BASE']=={3:957000000,4:958000000,5:959000000,6:960000000}
          new=[vals['SEED_BASE'][rep]+row*1000+ray for rep in vals['REPLICATES'] for row in vals['ROWS'] for ray in range(1,65)]
          old=[base+row*1000+ray for base in (955000000,956000000) for row in vals['ROWS'] for ray in range(1,65)]
          assert len(new)==768 and len(set(new))==768
          assert set(new).isdisjoint(old)
          assert 768*2==1536 and 1536*50000==76800000
          print('FRESH_MC_UNIVERSE_PASS',len(new),'unique paired seeds / 1536 condition calls')
          PY
          python -m py_compile "$PKG/run_fresh_replicate.py" "$PKG/run_fresh_preflight.py" "$PKG/analyze_reproducibility.py"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Materialize exact reviewed broadband and immutable source files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p frozen-broadband frozen-source hrrr

          git fetch --no-tags --depth=1 origin "$BROADBAND_REVIEW_SOURCE"
          git show "$BROADBAND_REVIEW_SOURCE:experiments/taylor-hrrr-broadband-vertical-shape-v1/run_row_replicate.py" > frozen-broadband/run_row_replicate.py
          git show "$BROADBAND_REVIEW_SOURCE:experiments/taylor-hrrr-broadband-vertical-shape-v1/preflight.py" > frozen-broadband/preflight.py

          git fetch --no-tags --depth=1 origin "$TAYLOR_SOURCE_SHA"
          git show "$TAYLOR_SOURCE_SHA:experiments/taylor-ann-arbor-sqm-mystic-v1/run_row.py" > frozen-source/run_row.py
          git show "$TAYLOR_SOURCE_SHA:experiments/taylor-ann-arbor-sqm-mystic-v1/observations.csv" > frozen-source/observations.csv
          git show "$TAYLOR_SOURCE_SHA:experiments/taylor-ann-arbor-sqm-mystic-v1/sqm_response.csv" > frozen-source/sqm_response.csv
          test "$(git rev-parse "$TAYLOR_SOURCE_SHA:experiments/taylor-ann-arbor-sqm-mystic-v1/run_row.py")" = "34e6229ccbd0976032a292171b4f64c66854029d"

          git fetch --no-tags --depth=1 origin "$HRRR_SHAPE_SOURCE_SHA"
          git show "$HRRR_SHAPE_SOURCE_SHA:experiments/taylor-hrrr-vertical-sensitivity-v3/run_profile_row.py" > frozen-source/hrrr_shape.py
          test "$(git rev-parse "$HRRR_SHAPE_SOURCE_SHA:experiments/taylor-hrrr-vertical-sensitivity-v3/run_profile_row.py")" = "572e80fef1c0456011f09d176a2ae0adf20a597f"

          git fetch --no-tags --depth=1 origin "$DERIVED_SOURCE_SHA"
          git show "$DERIVED_SOURCE_SHA:experiments/aerosol-family-challenge-v2/derived_channels.py" > frozen-source/derived_channels.py
          test "$(git rev-parse "$DERIVED_SOURCE_SHA:experiments/aerosol-family-challenge-v2/derived_channels.py")" = "ccfd04d4c21188966351f4257e92893d7ce340c7"

      - name: Download exact immutable HRRR artifact and verify bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/$HRRR_ARTIFACT_ID/zip" \
            -o hrrr.zip
          echo "$HRRR_ARTIFACT_SHA256  hrrr.zip" | sha256sum -c -
          unzip -q hrrr.zip -d hrrr
          test -s hrrr/point_profile_raw.csv
          echo "$HRRR_RAW_SHA256  hrrr/point_profile_raw.csv" | sha256sum -c -

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: taylor-broadband-mc-repro-preflight-v1
          create-args: >-
            -c conda-forge
            python=3.12.4
            numpy=2.3.2
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Verify exact reviewed MYSTIC runtime without solver execution
        shell: bash -el {0}
        run: |
          set -euo pipefail
          UVSPEC="$(command -v uvspec)"
          DATA_DIR="$CONDA_PREFIX/share/libRadtran/data"
          ATM="$DATA_DIR/atmmod/afglus.dat"
          python "$RUNTIME_PROBE" --uvspec "$UVSPEC" --data-dir "$DATA_DIR" --atmosphere "$ATM" --runtime-lock "$RUNTIME_LOCK" --output runtime-report.json
          python - <<'PY'
          import json
          r=json.load(open('runtime-report.json'))
          assert r['uvspecSha256']=='2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3'
          assert r['uvspecHelpSha256']=='868aea5af762d968f6f62c4e1472916d25232ed9cab5be112d753b0823d20548'
          assert r['libRadtranDataTreeSha256']=='ad30b49177e9c84e46497d69faf0c75e466996b0d0003f1de210289ae9f847d7'
          assert r['atmosphereSha256']=='dab26290ed81c762ed0c607e5dc2d53393c1462a0c3a528bc5e3f5935191cfb5'
          PY

      - name: Execute exact dry fresh-seed tau-only audit and HRRR source sanity
        shell: bash -el {0}
        run: |
          set -euo pipefail
          python "$PKG/run_fresh_preflight.py" \
            --frozen-preflight frozen-broadband/preflight.py \
            --frozen-runner frozen-broadband/run_row_replicate.py \
            --output fresh-preflight \
            --baseline-runner frozen-source/run_row.py \
            --hrrr-shape-runner frozen-source/hrrr_shape.py \
            --observations frozen-source/observations.csv \
            --response frozen-source/sqm_response.csv \
            --hrrr-raw hrrr/point_profile_raw.csv \
            --data-dir "$CONDA_PREFIX/share/libRadtran/data"
          python - <<'PY'
          import json
          x=json.load(open('fresh-preflight/preflight.json'))
          assert x['status']=='TAU_ONLY_INPUT_DELTA_PASS'
          assert x['auditCount']==768
          assert x['freshReplicateUniverse']==[3,4,5,6]
          print('FRESH_DRY_PREFLIGHT_PASS',x['auditCount'])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: taylor-broadband-mc-repro-v1-preflight
          path: |
            frozen-broadband
            frozen-source
            hrrr/point_profile_raw.csv
            fresh-preflight
            runtime-report.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

  cases:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        row: [23,24,25]
        replicate: [3,4,5,6]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.head }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: taylor-broadband-mc-repro-v1-preflight
          path: preflight-artifact

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: taylor-broadband-mc-repro-v1
          create-args: >-
            -c conda-forge
            python=3.12.4
            numpy=2.3.2
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Verify exact reviewed MYSTIC runtime
        shell: bash -el {0}
        run: |
          set -euo pipefail
          UVSPEC="$(command -v uvspec)"
          DATA_DIR="$CONDA_PREFIX/share/libRadtran/data"
          ATM="$DATA_DIR/atmmod/afglus.dat"
          python "$RUNTIME_PROBE" --uvspec "$UVSPEC" --data-dir "$DATA_DIR" --atmosphere "$ATM" --runtime-lock "$RUNTIME_LOCK" --output runtime-report.json
          python - <<'PY'
          import json
          r=json.load(open('runtime-report.json'))
          assert r['uvspecSha256']=='2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3'
          assert r['libRadtranDataTreeSha256']=='ad30b49177e9c84e46497d69faf0c75e466996b0d0003f1de210289ae9f847d7'
          assert r['atmosphereSha256']=='dab26290ed81c762ed0c607e5dc2d53393c1462a0c3a528bc5e3f5935191cfb5'
          PY

      - name: Execute one frozen fresh paired broadband replicate
        shell: bash -el {0}
        run: |
          set -euo pipefail
          python "$PKG/run_fresh_replicate.py" \
            --frozen-runner preflight-artifact/frozen-broadband/run_row_replicate.py \
            --replicate "${{ matrix.replicate }}" \
            --row "${{ matrix.row }}" \
            --baseline-runner preflight-artifact/frozen-source/run_row.py \
            --hrrr-shape-runner preflight-artifact/frozen-source/hrrr_shape.py \
            --derived-channels preflight-artifact/frozen-source/derived_channels.py \
            --observations preflight-artifact/frozen-source/observations.csv \
            --response preflight-artifact/frozen-source/sqm_response.csv \
            --hrrr-raw preflight-artifact/hrrr/point_profile_raw.csv \
            --uvspec "$(command -v uvspec)" \
            --data-dir "$CONDA_PREFIX/share/libRadtran/data" \
            --output-dir "row-${{ matrix.row }}-rep-${{ matrix.replicate }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taylor-broadband-mc-repro-v1-row-${{ matrix.row }}-rep-${{ matrix.replicate }}
          path: |
            row-${{ matrix.row }}-rep-${{ matrix.replicate }}
            runtime-report.json
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6

  analysis:
    needs: [preflight,cases]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.head }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: taylor-broadband-mc-repro-v1-row-*-rep-*
          path: new-results
          merge-multiple: false

      - name: Download and verify exact six immutable prior 50k artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p old-zips old-results
          cat > old-artifacts.tsv <<'EOF'
          23	1	9634362087	09425bbac571a8083c30378af48bea446600b7ad6457919fa7515c80ac2f7603
          23	2	9634364324	4f06e87fb39b3f80ed3cf6e6932f05d413620f61064b578711b5ebaa3efc237b
          24	1	9634358068	60c252e31c7a932ff66a37c4e387dff14374f48696d6f8e8cca1d4a7041ff424
          24	2	9634358076	aac46afe41e4cea5477c4ab22e98ddbe41b2022ae7d5b828fd2241c57005b4d4
          25	1	9634361831	3a2ae1bd94c96d67f9bd226d14f7331cdf0a70122cf395f572568e30b9d3c7b8
          25	2	9634363793	6fa06d95fcabda70a4e25783f286dce7738080e7e4180b682efa948ffabb3943
          EOF
          while IFS=$'\t' read -r row rep id digest; do
            zip="old-zips/row-${row}-rep-${rep}.zip"
            dir="old-results/row-${row}-rep-${rep}"
            curl --fail --location --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/${id}/zip" \
              -o "$zip"
            echo "$digest  $zip" | sha256sum -c -
            mkdir -p "$dir"
            unzip -q "$zip" -d "$dir"
          done < old-artifacts.tsv
          test "$(find old-results -name row-replicate-result.json | wc -l)" = "6"

      - name: Analyze empirical between-seed variability only
        run: |
          set -euo pipefail
          python "$PKG/analyze_reproducibility.py" \
            --old-results-root old-results \
            --new-results-root new-results \
            --output analysis-output
          cat analysis-output/report.md

      - uses: actions/upload-artifact@v4
        with:
          name: taylor-broadband-mc-repro-v1-analysis
          path: analysis-output
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
