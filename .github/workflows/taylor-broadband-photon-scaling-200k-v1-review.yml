name: Taylor broadband photon scaling 200k review v1

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'experiments/taylor-broadband-photon-scaling-200k-v1/**'
      - 'tests/test_taylor_broadband_photon_scaling_200k_v1_review.py'
      - '.github/workflows/taylor-broadband-photon-scaling-200k-v1-review.yml'

permissions:
  contents: read

jobs:
  review-only:
    if: github.head_ref == 'review/taylor-broadband-photon-scaling-200k-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove MYSTIC solver is unavailable
        shell: bash
        run: |
          set -euo pipefail
          if command -v uvspec >/dev/null 2>&1; then
            echo 'uvspec unexpectedly present in review-only job' >&2
            exit 1
          fi
      - name: Install review dependencies
        run: python -m pip install --disable-pip-version-check pytest==8.4.1 numpy==2.3.2
      - name: Compile package
        run: python -m py_compile experiments/taylor-broadband-photon-scaling-200k-v1/*.py
      - name: Run no-solver tests
        run: pytest -q tests/test_taylor_broadband_photon_scaling_200k_v1_review.py
