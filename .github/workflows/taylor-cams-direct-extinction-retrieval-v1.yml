name: Taylor CAMS prior-cycle 137-level profile v1

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read
  actions: read

jobs:
  prior-cycle-profile:
    if: github.head_ref == 'review/taylor-cams-direct-extinction-retrieval-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install ADS and GRIB tools
        run: python -m pip install --disable-pip-version-check 'cdsapi>=0.7.7' eccodes numpy

      - name: Retrieve frozen prior-cycle CAMS fields
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cams-output
          python - <<'PY'
          import cdsapi, json, os, pathlib
          out=pathlib.Path('cams-output')
          key=os.environ.get('ADS_API_KEY','').strip()
          if not key: raise SystemExit('ADS_API_KEY missing')
          dataset='cams-global-atmospheric-composition-forecasts'
          common={
              'date':['2025-08-07/2025-08-07'],
              'time':['12:00'],
              'leadtime_hour':['12','15'],
              'type':['forecast'],
              'data_format':'grib',
              'area':[42.4,-84.0,42.0,-83.6],
          }
          ml={**common,
              'variable':['aerosol_extinction_coefficient_532nm','temperature','specific_humidity','geopotential','logarithm_of_surface_pressure'],
              'model_level':[str(i) for i in range(1,138)],
          }
          aod={**common,
              'variable':['total_aerosol_optical_depth_532nm','total_aerosol_optical_depth_550nm'],
          }
          (out/'request.json').write_text(json.dumps({'dataset':dataset,'modelLevelFields':ml,'aodFields':aod},indent=2,sort_keys=True)+'\n')
          client=cdsapi.Client(url='https://ads.atmosphere.copernicus.eu/api',key=key,quiet=False,debug=False)
          mlfile=out/'cams_2025-08-07_12Z_lead12-15_ext532_t_q_z_lnsp_ml.grib'
          aodfile=out/'cams_2025-08-07_12Z_lead12-15_aod532_aod550.grib'
          client.retrieve(dataset,ml,str(mlfile))
          client.retrieve(dataset,aod,str(aodfile))
          if not mlfile.is_file() or mlfile.stat().st_size==0: raise SystemExit('model-level retrieval missing')
          if not aodfile.is_file() or aodfile.stat().st_size==0: raise SystemExit('AOD retrieval missing')
          print('ML_BYTES',mlfile.stat().st_size,'AOD_BYTES',aodfile.stat().st_size)
          PY

      - name: Compute exact 137-level heights and extinction diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json, math, pathlib
          import numpy as np
          from eccodes import codes_grib_new_from_file, codes_get, codes_get_array, codes_is_defined, codes_release

          LAT=42.256; LON=-83.709; R_D=287.06; G=9.80665
          out=pathlib.Path('cams-output')
          mlfile=out/'cams_2025-08-07_12Z_lead12-15_ext532_t_q_z_lnsp_ml.grib'
          aodfile=out/'cams_2025-08-07_12Z_lead12-15_aod532_aod550.grib'

          def safe(g,k,d=None):
              try:
                  if codes_is_defined(g,k): return codes_get(g,k)
              except Exception: pass
              return d
          def point(g):
              lats=codes_get_array(g,'latitudes'); lons=codes_get_array(g,'longitudes'); vals=codes_get_array(g,'values')
              pts=[]
              for la,lo,v in zip(lats,lons,vals):
                  lo=float(lo); lo=lo-360 if lo>180 else lo
                  pts.append((round(float(la),6),round(lo,6),float(v)))
              by={(y,x):v for y,x,v in pts}; ys=sorted(set(y for y,_,_ in pts)); xs=sorted(set(x for _,x,_ in pts))
              yl=[y for y in ys if y<=LAT]; yh=[y for y in ys if y>=LAT]; xl=[x for x in xs if x<=LON]; xh=[x for x in xs if x>=LON]
              if yl and yh and xl and xh:
                  y0=max(yl); y1=min(yh); x0=max(xl); x1=min(xh)
                  need=[(y0,x0),(y0,x1),(y1,x0),(y1,x1)]
                  if all(k in by for k in need):
                      fy=0 if y1==y0 else (LAT-y0)/(y1-y0); fx=0 if x1==x0 else (LON-x0)/(x1-x0)
                      return (1-fy)*((1-fx)*by[(y0,x0)]+fx*by[(y0,x1)])+fy*((1-fx)*by[(y1,x0)]+fx*by[(y1,x1)])
              return min(pts,key=lambda p:(p[0]-LAT)**2+(p[1]-LON)**2)[2]
          def read(path):
              rows=[]; pv=None
              with path.open('rb') as f:
                  while True:
                      g=codes_grib_new_from_file(f)
                      if g is None: break
                      try:
                          r={'short':str(safe(g,'shortName','')),'name':str(safe(g,'name','')),'step':int(safe(g,'step',-1)),
                             'level':int(safe(g,'level',-1)),'units':str(safe(g,'units','')),'value':point(g)}
                          rows.append(r)
                          if pv is None:
                              try:
                                  x=codes_get_array(g,'pv')
                                  if len(x): pv=np.asarray(x,float)
                              except Exception: pass
                      finally: codes_release(g)
              return rows,pv
          ml,pv=read(mlfile); aod,_=read(aodfile)
          if pv is None: raise SystemExit('hybrid pv missing')
          N=len(pv)//2-1
          if N!=137: raise SystemExit(f'expected 137 levels, got {N}')
          A=pv[:N+1]; B=pv[N+1:]
          t={(r['step'],r['level']):r['value'] for r in ml if r['short']=='t' or r['name'].lower()=='temperature'}
          q={(r['step'],r['level']):r['value'] for r in ml if r['short']=='q' or r['name'].lower()=='specific humidity'}
          ext={(r['step'],r['level']):r['value'] for r in ml if 'extinction' in r['name'].lower() and '532' in r['name']}
          z={(r['step'],r['level']):r['value'] for r in ml if r['short']=='z' or r['name'].lower()=='geopotential'}
          lnsp={(r['step'],r['level']):r['value'] for r in ml if r['short']=='lnsp' or 'logarithm of surface pressure' in r['name'].lower()}
          aod532={r['step']:r['value'] for r in aod if r['short']=='aod532' or ('total aerosol optical depth' in r['name'].lower() and '532' in r['name'])}
          aod550={r['step']:r['value'] for r in aod if r['short']=='aod550' or ('total aerosol optical depth' in r['name'].lower() and '550' in r['name'])}
          leads=sorted(set(s for s,l in ext))

          def trap(points):
              return sum(.5*(max(b0,0)+max(b1,0))*(h1-h0) for (h0,b0),(h1,b1) in zip(points[:-1],points[1:]) if h1>h0)
          def part(points,cut):
              ans=0.0
              for (h0,b0),(h1,b1) in zip(points[:-1],points[1:]):
                  if h0>=cut: break
                  if h1<=h0: continue
                  hu=min(h1,cut); f=(hu-h0)/(h1-h0); bu=b0+f*(b1-b0)
                  ans += .5*(max(b0,0)+max(bu,0))*(hu-h0)
                  if h1>=cut: break
              return ans

          prof=[]; sums=[]
          for step in leads:
              if any((step,l) not in t or (step,l) not in q or (step,l) not in ext for l in range(1,138)): raise SystemExit(f'missing levels step {step}')
              if (step,1) not in z or (step,1) not in lnsp: raise SystemExit(f'missing z/lnsp step {step}')
              if step not in aod532 or step not in aod550: raise SystemExit(f'missing direct AOD step {step}')
              if max(ext[(step,l)] for l in range(1,138))<=0: raise SystemExit(f'nonpositive extinction profile step {step}')
              sp=math.exp(lnsp[(step,1)]); zs=z[(step,1)]; hs=zs/G; zh=zs; comp={}
              for lev in range(137,0,-1):
                  tv=t[(step,lev)]*(1+0.609133*q[(step,lev)])
                  ptop=A[lev-1]+B[lev-1]*sp; pbot=A[lev]+B[lev]*sp
                  if lev==1: dlog=math.log(pbot/0.1); alpha=math.log(2)
                  else: dlog=math.log(pbot/ptop); alpha=1-(ptop/(pbot-ptop))*dlog
                  trd=tv*R_D; zf=zh+trd*alpha; zh=zh+trd*dlog
                  comp[lev]=(zf/G,ptop,pbot)
              pts=[(0.0,ext[(step,137)])]
              for lev in range(137,0,-1):
                  h,pt,pb=comp[lev]; agl=h-hs; beta=ext[(step,lev)]
                  prof.append({'baseDateUTC':'2025-08-07','baseHourUTC':12,'leadHour':step,'validHourUTC':(12+step)%24,
                               'modelLevel':lev,'extinction532_m-1':beta,'heightAGL_m':agl,'siteAnchoredAltitude_m':262+agl,
                               'geopotentialHeight_m':h,'fullLevelPressureApprox_Pa':.5*(pt+pb),'temperature_K':t[(step,lev)],'specificHumidity_kgkg':q[(step,lev)]})
                  pts.append((agl,beta))
              pts.sort(); ti=trap(pts); pk=max((ext[(step,l)],l,comp[l][0]-hs) for l in range(1,138))
              s={'baseHourUTC':12,'leadHour':step,'validHourUTC':(12+step)%24,'surfacePressure_Pa':sp,'nativeSurfaceHeight_m':hs,
                 'integratedExtinctionTau532':ti,'directCamsAOD532':aod532[step],'directCamsAOD550':aod550[step],
                 'integrationToDirectAOD532Ratio':ti/aod532[step] if aod532[step]>0 else None,
                 'peakExtinction532_m-1':pk[0],'peakModelLevel':pk[1],'peakHeightAGL_m':pk[2]}
              for km in [.5,1,2,3,5,10]:
                  k=str(km).replace('.','p'); s[f'tauFractionBelow{k}km']=part(pts,km*1000)/ti
              sums.append(s)
          prof.sort(key=lambda r:(r['leadHour'],r['heightAGL_m']))
          with (out/'ann_arbor_cams_priorcycle_extinction532_137level_profile.csv').open('w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=list(prof[0])); w.writeheader(); w.writerows(prof)
          with (out/'ann_arbor_cams_priorcycle_extinction532_summary.csv').open('w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=list(sums[0])); w.writeheader(); w.writerows(sums)
          meta={'selectionReason':'avoid lead-0 zero forecast diagnostic; use single prior 12Z cycle with lead12/15 for valid 00Z/03Z, frozen before viewing results',
                'method':'ECMWF model-level geopotential algorithm using T/q/lnsp/surface-z and GRIB hybrid coefficients',
                'target':{'lat':LAT,'lon':LON,'siteElevation_m':262},'nlevels':137,'perValidTime':sums}
          (out/'summary.json').write_text(json.dumps(meta,indent=2,sort_keys=True)+'\n')
          print(json.dumps(meta,indent=2,sort_keys=True))
          PY
          sha256sum cams-output/* > cams-output/SHA256SUMS.txt

      - name: Upload prior-cycle CAMS profile
        uses: actions/upload-artifact@v4
        with:
          name: taylor-cams-priorcycle-extinction532-137level-v1
          path: cams-output
          if-no-files-found: error
          retention-days: 90
