name: Taylor CAMS direct extinction retrieval v1

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  actions: read

jobs:
  retrieve:
    if: github.head_ref == 'review/taylor-cams-direct-extinction-retrieval-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
      CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
      CDS_API_KEY: ${{ secrets.CDS_API_KEY }}
      ECMWF_ADS_KEY: ${{ secrets.ECMWF_ADS_KEY }}
      ECMWF_API_KEY: ${{ secrets.ECMWF_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install retrieval and GRIB tools
        run: |
          python -m pip install --disable-pip-version-check 'cdsapi>=0.7.7' eccodes requests
      - name: Probe ADS and retrieve frozen Ann Arbor profile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cams-output
          python - <<'PY'
          import json, os, pathlib, sys, time, requests
          out=pathlib.Path('cams-output')
          dataset='cams-global-atmospheric-composition-forecasts'
          request={
              'variable':['aerosol_extinction_coefficient_532nm','geopotential'],
              'model_level':[str(i) for i in range(1,138)],
              'date':['2025-08-08/2025-08-08'],
              'time':['00:00'],
              'leadtime_hour':['0','3'],
              'type':['forecast'],
              'data_format':'grib',
              'area':[42.4,-84.0,42.0,-83.6],
          }
          (out/'request.json').write_text(json.dumps({'dataset':dataset,'request':request},indent=2,sort_keys=True)+'\n')
          base='https://ads.atmosphere.copernicus.eu/api'
          probe={}
          for u in [f'{base}/catalogue/v1/collections/{dataset}',f'{base}/retrieve/v1/processes/{dataset}']:
              try:
                  r=requests.get(u,timeout=30)
                  probe[u]={'status':r.status_code,'content_type':r.headers.get('content-type'),'body_prefix':r.text[:1000]}
              except Exception as e:
                  probe[u]={'error':type(e).__name__+': '+str(e)}
          (out/'public_probe.json').write_text(json.dumps(probe,indent=2,sort_keys=True)+'\n')

          # First test whether this open-data process permits anonymous execution.
          exec_url=f'{base}/retrieve/v1/processes/{dataset}/execution'
          try:
              r=requests.post(exec_url,json={'inputs':request},timeout=60)
              anon={'status':r.status_code,'body_prefix':r.text[:4000]}
          except Exception as e:
              r=None; anon={'error':type(e).__name__+': '+str(e)}
          (out/'anonymous_execution_probe.json').write_text(json.dumps(anon,indent=2,sort_keys=True)+'\n')

          target=out/'cams_2025-08-08_00Z_lead0-3_aerext532_geopotential_ml1-137.grib'
          if r is not None and r.status_code in (200,201,202):
              try:
                  j=r.json(); job_id=j.get('jobID') or j.get('job_id') or j.get('id')
              except Exception:
                  job_id=None
              if job_id:
                  (out/'anonymous_job_id.txt').write_text(str(job_id)+'\n')
                  for _ in range(240):
                      s=requests.get(f'{base}/retrieve/v1/jobs/{job_id}',timeout=30)
                      sj=s.json() if 'json' in s.headers.get('content-type','') else {'raw':s.text}
                      (out/'anonymous_job_status.json').write_text(json.dumps(sj,indent=2,sort_keys=True)+'\n')
                      state=str(sj.get('status') or sj.get('state') or '').lower()
                      if state in ('successful','completed','succeeded'):
                          rr=requests.get(f'{base}/retrieve/v1/jobs/{job_id}/results',timeout=60)
                          rr.raise_for_status(); rj=rr.json()
                          (out/'anonymous_results.json').write_text(json.dumps(rj,indent=2,sort_keys=True)+'\n')
                          href=None
                          if isinstance(rj,dict):
                              for v in rj.values():
                                  if isinstance(v,dict) and isinstance(v.get('href'),str): href=v['href']; break
                                  if isinstance(v,list):
                                      for q in v:
                                          if isinstance(q,dict) and isinstance(q.get('href'),str): href=q['href']; break
                          if href:
                              with requests.get(href,stream=True,timeout=120) as dl:
                                  dl.raise_for_status()
                                  with target.open('wb') as f:
                                      for chunk in dl.iter_content(1<<20):
                                          if chunk: f.write(chunk)
                              print('ANONYMOUS_CAMS_RETRIEVAL_COMPLETE',target,target.stat().st_size)
                              break
                      if state in ('failed','dismissed','cancelled','canceled'):
                          break
                      time.sleep(15)

          if target.is_file() and target.stat().st_size:
              sys.exit(0)

          key=''; key_name=''
          for name in ['ADS_API_KEY','CDSAPI_KEY','CDS_API_KEY','ECMWF_ADS_KEY','ECMWF_API_KEY']:
              v=os.environ.get(name,'').strip()
              if v:
                  key=v; key_name=name; break
          status={'credential_present':bool(key),'credential_name':key_name if key else None}
          (out/'credential_status.json').write_text(json.dumps(status,indent=2,sort_keys=True)+'\n')
          if not key:
              print('NO_ADS_CREDENTIAL_PRESENT')
              sys.exit(0)

          import cdsapi
          client=cdsapi.Client(url=base,key=key,quiet=False,debug=False)
          client.retrieve(dataset,request,str(target)).download()
          print('AUTHENTICATED_CAMS_RETRIEVAL_COMPLETE',target,target.stat().st_size)
          PY
      - name: Extract point profile if GRIB was retrieved
        shell: bash
        run: |
          set -euo pipefail
          f='cams-output/cams_2025-08-08_00Z_lead0-3_aerext532_geopotential_ml1-137.grib'
          if [ ! -s "$f" ]; then
            echo 'No GRIB retrieved; leaving probe artifact only.'
            exit 0
          fi
          python - <<'PY'
          import csv, json, pathlib
          from eccodes import codes_grib_new_from_file,codes_get,codes_get_array,codes_release
          src=pathlib.Path('cams-output/cams_2025-08-08_00Z_lead0-3_aerext532_geopotential_ml1-137.grib')
          rows=[]
          with src.open('rb') as fh:
              while True:
                  gid=codes_grib_new_from_file(fh)
                  if gid is None: break
                  try:
                      short=str(codes_get(gid,'shortName')); level=int(codes_get(gid,'level'))
                      dataDate=int(codes_get(gid,'dataDate')); dataTime=int(codes_get(gid,'dataTime')); step=int(codes_get(gid,'step'))
                      lats=codes_get_array(gid,'latitudes'); lons=codes_get_array(gid,'longitudes'); vals=codes_get_array(gid,'values')
                      pts=[]
                      for la,lo,v in zip(lats,lons,vals):
                          if lo>180: lo-=360
                          pts.append((round(float(la),6),round(float(lo),6),float(v)))
                      target_lat=42.256; target_lon=-83.709; by={(la,lo):v for la,lo,v in pts}
                      lat0,lat1=42.0,42.4; lon0,lon1=-84.0,-83.6
                      needed=[(lat0,lon0),(lat0,lon1),(lat1,lon0),(lat1,lon1)]
                      if all(k in by for k in needed):
                          fy=(target_lat-lat0)/(lat1-lat0); fx=(target_lon-lon0)/(lon1-lon0)
                          v=(1-fy)*((1-fx)*by[(lat0,lon0)]+fx*by[(lat0,lon1)])+fy*((1-fx)*by[(lat1,lon0)]+fx*by[(lat1,lon1)])
                          interpolation='bilinear_four_native_nodes'
                      else:
                          la,lo,v=min(pts,key=lambda p:(p[0]-target_lat)**2+(p[1]-target_lon)**2); interpolation='nearest_fallback'
                      rows.append({'shortName':short,'modelLevel':level,'baseDate':dataDate,'baseTime':dataTime,'leadHour':step,'valueAnnArbor':v,'interpolation':interpolation})
                  finally:
                      codes_release(gid)
          rows.sort(key=lambda r:(r['leadHour'],r['shortName'],r['modelLevel']))
          with open('cams-output/ann_arbor_profile.csv','w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=rows[0].keys()); w.writeheader(); w.writerows(rows)
          summary={'records':len(rows),'shortNames':sorted(set(r['shortName'] for r in rows)),'levels':sorted(set(r['modelLevel'] for r in rows)),'leadHours':sorted(set(r['leadHour'] for r in rows))}
          pathlib.Path('cams-output/profile_summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,sort_keys=True))
          PY
          sha256sum cams-output/* > cams-output/SHA256SUMS.txt
      - name: Upload retrieval evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taylor-cams-direct-extinction-retrieval-v1
          path: cams-output
          if-no-files-found: error
          retention-days: 90
