name: Taylor HRRR broadband vertical-shape review v1

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'experiments/taylor-hrrr-broadband-vertical-shape-v1/**'
      - 'tests/test_taylor_hrrr_broadband_vertical_shape_v1_review.py'
      - '.github/workflows/taylor-hrrr-broadband-review-v1.yml'

permissions:
  contents: read

jobs:
  review-only:
    if: github.head_ref == 'review/taylor-hrrr-broadband-vertical-shape-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove solver is unavailable
        shell: bash
        run: |
          set -euo pipefail
          if command -v uvspec >/dev/null 2>&1; then
            echo 'uvspec unexpectedly present in review-only job' >&2
            exit 1
          fi
      - name: Install review-only dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.2 pytest==8.4.1
      - name: Compile complete review package
        run: |
          python -m py_compile \
            experiments/taylor-hrrr-broadband-vertical-shape-v1/run_row_replicate.py \
            experiments/taylor-hrrr-broadband-vertical-shape-v1/preflight.py \
            experiments/taylor-hrrr-broadband-vertical-shape-v1/check_default_replication.py \
            experiments/taylor-hrrr-broadband-vertical-shape-v1/analyze.py
      - name: Run no-solver review tests
        run: pytest -q tests/test_taylor_hrrr_broadband_vertical_shape_v1_review.py
