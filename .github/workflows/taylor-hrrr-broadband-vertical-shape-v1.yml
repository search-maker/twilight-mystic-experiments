name: Taylor HRRR broadband vertical-shape v1
run-name: Taylor HRRR broadband v1 | ${{ github.event.pull_request.head.sha }}

on:
  pull_request:
    types: [opened]
    paths:
      - 'experiments/taylor-hrrr-broadband-vertical-shape-v1/**'
      - '.github/workflows/taylor-hrrr-broadband-vertical-shape-v1.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: taylor-hrrr-broadband-vertical-shape-v1-scientific-1
  cancel-in-progress: false

env:
  PKG: experiments/taylor-hrrr-broadband-vertical-shape-v1
  REVIEW_PARENT: 75035d9ea316af574b2fac50f52c43c633b2bdbc
  TAYLOR_SOURCE_SHA: 7231bd873859cc8c36fe6749985e0ece193b5de7
  HRRR_SHAPE_SOURCE_SHA: 3b32dfba4d861c0db8a4c2dac3e2d5c4ce73e359
  DERIVED_SOURCE_SHA: 86d4432cc902e50e09811558465e9fa489c57ea2
  HRRR_ARTIFACT_ID: '9630599968'
  HRRR_ARTIFACT_SHA256: afd3f5fbf3e20674a1c5432112ce36fcb7f6678690f9ea8cff5ef6bcca5d5c9c
  HRRR_RAW_SHA256: 929e787c15f8d689bf63a732152eb552e621542325e4942d4d48bf91eb6d75a9
  RUNTIME_LOCK: experiments/mystic-batch-v1/runtime-lock.micromamba.json
  RUNTIME_PROBE: experiments/mystic-batch-v1/runtime_probe.py

jobs:
  preflight:
    if: github.head_ref == 'science/taylor-hrrr-broadband-vertical-shape-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      head: ${{ steps.identity.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - id: identity
        name: Verify one-shot science identity and frozen review parent
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD^)" = "$REVIEW_PARENT"
          python - <<'PY'
          import importlib.util, pathlib
          p=pathlib.Path('experiments/taylor-hrrr-broadband-vertical-shape-v1/run_row_replicate.py')
          spec=importlib.util.spec_from_file_location('r',p); m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          assert m.ROWS==[23,24,25]
          assert m.REPLICATES==[1,2]
          assert m.PHOTONS==50000
          assert m.SEED_BASE=={1:955000000,2:956000000}
          seeds=[m.SEED_BASE[q]+row*1000+ray for q in m.REPLICATES for row in m.ROWS for ray in range(1,65)]
          assert len(seeds)==384 and len(set(seeds))==384
          assert 384*2==768
          assert 768*50000==38400000
          print('FROZEN_SCIENTIFIC_UNIVERSE_PASS',len(seeds),'unique seeds / 768 paired-condition calls')
          PY
          python -m py_compile "$PKG/run_row_replicate.py" "$PKG/preflight.py" "$PKG/check_default_replication.py" "$PKG/analyze.py"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Materialize immutable Taylor, HRRR-shape, and derived-channel source files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p frozen-source hrrr
          git fetch --no-tags --depth=1 origin "$TAYLOR_SOURCE_SHA"
          git show "$TAYLOR_SOURCE_SHA:experiments/taylor-ann-arbor-sqm-mystic-v1/run_row.py" > frozen-source/run_row.py
          git show "$TAYLOR_SOURCE_SHA:experiments/taylor-ann-arbor-sqm-mystic-v1/observations.csv" > frozen-source/observations.csv
          git show "$TAYLOR_SOURCE_SHA:experiments/taylor-ann-arbor-sqm-mystic-v1/sqm_response.csv" > frozen-source/sqm_response.csv
          test "$(git rev-parse "$TAYLOR_SOURCE_SHA:experiments/taylor-ann-arbor-sqm-mystic-v1/run_row.py")" = "34e6229ccbd0976032a292171b4f64c66854029d"

          git fetch --no-tags --depth=1 origin "$HRRR_SHAPE_SOURCE_SHA"
          git show "$HRRR_SHAPE_SOURCE_SHA:experiments/taylor-hrrr-vertical-sensitivity-v3/run_profile_row.py" > frozen-source/hrrr_shape.py
          test "$(git rev-parse "$HRRR_SHAPE_SOURCE_SHA:experiments/taylor-hrrr-vertical-sensitivity-v3/run_profile_row.py")" = "572e80fef1c0456011f09d176a2ae0adf20a597f"

          git fetch --no-tags --depth=1 origin "$DERIVED_SOURCE_SHA"
          git show "$DERIVED_SOURCE_SHA:experiments/aerosol-family-challenge-v2/derived_channels.py" > frozen-source/derived_channels.py
          test "$(git rev-parse "$DERIVED_SOURCE_SHA:experiments/aerosol-family-challenge-v2/derived_channels.py")" = "ccfd04d4c21188966351f4257e92893d7ce340c7"

      - name: Download exact immutable HRRR artifact by ID and verify bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/search-maker/twilight-mystic-experiments/actions/artifacts/$HRRR_ARTIFACT_ID/zip" \
            -o hrrr.zip
          echo "$HRRR_ARTIFACT_SHA256  hrrr.zip" | sha256sum -c -
          unzip -q hrrr.zip -d hrrr
          test -s hrrr/point_profile_raw.csv
          echo "$HRRR_RAW_SHA256  hrrr/point_profile_raw.csv" | sha256sum -c -

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: taylor-hrrr-broadband-preflight-v1
          create-args: >-
            -c conda-forge
            python=3.12.4
            numpy=2.3.2
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Verify exact reviewed MYSTIC runtime without solver execution
        shell: bash -el {0}
        run: |
          set -euo pipefail
          UVSPEC="$(command -v uvspec)"
          DATA_DIR="$CONDA_PREFIX/share/libRadtran/data"
          ATM="$DATA_DIR/atmmod/afglus.dat"
          python "$RUNTIME_PROBE" --uvspec "$UVSPEC" --data-dir "$DATA_DIR" --atmosphere "$ATM" --runtime-lock "$RUNTIME_LOCK" --output runtime-report.json
          python - <<'PY'
          import json
          r=json.load(open('runtime-report.json'))
          assert r['uvspecSha256']=='2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3'
          assert r['uvspecHelpSha256']=='868aea5af762d968f6f62c4e1472916d25232ed9cab5be112d753b0823d20548'
          assert r['libRadtranDataTreeSha256']=='ad30b49177e9c84e46497d69faf0c75e466996b0d0003f1de210289ae9f847d7'
          assert r['atmosphereSha256']=='dab26290ed81c762ed0c607e5dc2d53393c1462a0c3a528bc5e3f5935191cfb5'
          PY

      - name: Execute exact dry tau-only input audit and HRRR source sanity
        shell: bash -el {0}
        run: |
          set -euo pipefail
          python "$PKG/preflight.py" \
            --runner "$PKG/run_row_replicate.py" \
            --baseline-runner frozen-source/run_row.py \
            --hrrr-shape-runner frozen-source/hrrr_shape.py \
            --observations frozen-source/observations.csv \
            --response frozen-source/sqm_response.csv \
            --hrrr-raw hrrr/point_profile_raw.csv \
            --data-dir "$CONDA_PREFIX/share/libRadtran/data" \
            --output preflight-output

      - uses: actions/upload-artifact@v4
        with:
          name: taylor-hrrr-broadband-v1-preflight
          path: |
            frozen-source
            hrrr/point_profile_raw.csv
            preflight-output
            runtime-report.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

  cases:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        row: [23,24,25]
        replicate: [1,2]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.head }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: taylor-hrrr-broadband-v1-preflight
          path: preflight-artifact

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: taylor-hrrr-broadband-v1
          create-args: >-
            -c conda-forge
            python=3.12.4
            numpy=2.3.2
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Verify exact reviewed MYSTIC runtime
        shell: bash -el {0}
        run: |
          set -euo pipefail
          UVSPEC="$(command -v uvspec)"
          DATA_DIR="$CONDA_PREFIX/share/libRadtran/data"
          ATM="$DATA_DIR/atmmod/afglus.dat"
          python "$RUNTIME_PROBE" --uvspec "$UVSPEC" --data-dir "$DATA_DIR" --atmosphere "$ATM" --runtime-lock "$RUNTIME_LOCK" --output runtime-report.json
          python - <<'PY'
          import json
          r=json.load(open('runtime-report.json'))
          assert r['uvspecSha256']=='2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3'
          assert r['libRadtranDataTreeSha256']=='ad30b49177e9c84e46497d69faf0c75e466996b0d0003f1de210289ae9f847d7'
          assert r['atmosphereSha256']=='dab26290ed81c762ed0c607e5dc2d53393c1462a0c3a528bc5e3f5935191cfb5'
          PY

      - name: Execute one frozen paired broadband row/replicate
        shell: bash -el {0}
        run: |
          set -euo pipefail
          python "$PKG/run_row_replicate.py" \
            --row "${{ matrix.row }}" \
            --replicate "${{ matrix.replicate }}" \
            --baseline-runner preflight-artifact/frozen-source/run_row.py \
            --hrrr-shape-runner preflight-artifact/frozen-source/hrrr_shape.py \
            --derived-channels preflight-artifact/frozen-source/derived_channels.py \
            --observations preflight-artifact/frozen-source/observations.csv \
            --response preflight-artifact/frozen-source/sqm_response.csv \
            --hrrr-raw preflight-artifact/hrrr/point_profile_raw.csv \
            --uvspec "$(command -v uvspec)" \
            --data-dir "$CONDA_PREFIX/share/libRadtran/data" \
            --output-dir "row-${{ matrix.row }}-rep-${{ matrix.replicate }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taylor-hrrr-broadband-v1-row-${{ matrix.row }}-rep-${{ matrix.replicate }}
          path: |
            row-${{ matrix.row }}-rep-${{ matrix.replicate }}
            runtime-report.json
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6

  default-replication-gate:
    needs: [preflight,cases]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.head }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: taylor-hrrr-broadband-v1-row-*-rep-*
          path: new-results
          merge-multiple: false

      - name: Download immutable Taylor-v1 row 23
        uses: actions/download-artifact@v4
        with:
          name: taylor-sqm-mystic-v1-row-23
          path: old-results/row-23
          github-token: ${{ github.token }}
          repository: search-maker/twilight-mystic-experiments
          run-id: 33015974632
      - name: Download immutable Taylor-v1 row 24
        uses: actions/download-artifact@v4
        with:
          name: taylor-sqm-mystic-v1-row-24
          path: old-results/row-24
          github-token: ${{ github.token }}
          repository: search-maker/twilight-mystic-experiments
          run-id: 33015974632
      - name: Download immutable Taylor-v1 row 25
        uses: actions/download-artifact@v4
        with:
          name: taylor-sqm-mystic-v1-row-25
          path: old-results/row-25
          github-token: ${{ github.token }}
          repository: search-maker/twilight-mystic-experiments
          run-id: 33015974632

      - name: Enforce all-six fresh-default 5-sigma replication gate
        run: |
          set -euo pipefail
          python "$PKG/check_default_replication.py" \
            --new-results-root new-results \
            --taylor-v1-results-root old-results \
            --output default-gate
          cat default-gate/default-replication.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taylor-hrrr-broadband-v1-default-replication-gate
          path: default-gate
          if-no-files-found: warn
          retention-days: 90

  analysis:
    needs: [preflight,default-replication-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.head }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: taylor-hrrr-broadband-v1-row-*-rep-*
          path: new-results
          merge-multiple: false

      - name: Download immutable Taylor broadband baseline analysis
        uses: actions/download-artifact@v4
        with:
          name: taylor-sqm-mystic-v1-analysis-recovery
          path: baseline
          github-token: ${{ github.token }}
          repository: search-maker/twilight-mystic-experiments
          run-id: 33016529095

      - name: Download immutable HRRR monochromatic-550 analysis
        uses: actions/download-artifact@v4
        with:
          name: taylor-hrrr-vertical-v3-analysis
          path: mono550
          github-token: ${{ github.token }}
          repository: search-maker/twilight-mystic-experiments
          run-id: 33033634173

      - name: Produce frozen paired broadband analysis
        run: |
          set -euo pipefail
          python "$PKG/analyze.py" \
            --results-root new-results \
            --baseline-root baseline \
            --mono550-root mono550 \
            --output analysis-output
          cat analysis-output/report.md

      - uses: actions/upload-artifact@v4
        with:
          name: taylor-hrrr-broadband-v1-analysis
          path: analysis-output
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
