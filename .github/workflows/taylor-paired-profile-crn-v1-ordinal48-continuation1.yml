name: Taylor paired profile row26 continuation ordinal48
run-name: Taylor Issue828 row26 continuation ordinal48 | ${{ github.event.pull_request.head.sha }}

on:
  pull_request:
    types: [synchronize]
    paths:
      - 'experiments/taylor-paired-profile-crn-v1/EXECUTE_ORDINAL48_CONTINUATION1.txt'

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: taylor-paired-profile-crn-v1-scientific-48-continuation1
  cancel-in-progress: false

env:
  PKG: experiments/taylor-paired-profile-crn-v1
  MANIFEST: experiments/taylor-paired-profile-crn-v1/manifest-ordinal48-continuation1.json
  RUNNER: experiments/taylor-paired-profile-crn-v1/run_continuation_ordinal48.py
  ANALYZER: experiments/taylor-paired-profile-crn-v1/analyze_continuation_ordinal48.py
  SOURCE_SHA: 7231bd873859cc8c36fe6749985e0ece193b5de7
  ORD47_SCIENCE_HEAD: 2426335c652adacf442122c3a1bcdf9489a10298
  ORD47_SCIENCE_RUN_ID: '33543818095'
  ORD47_ANALYSIS_RUN_ID: '33545920403'
  ORD47_ANALYSIS_ARTIFACT_ID: '9815468437'
  ORD47_ANALYSIS_ARTIFACT_NAME: taylor-paired-profile-crn-ordinal47-analysis-recovery-r3
  ORD47_ANALYSIS_ARTIFACT_DIGEST: 'sha256:0d376c504f70b792a0393636d885094159bc10a0696dd49643fadf1fffb2e5c4'
  CAMS_RUN_ID: '33039911540'
  CAMS_ARTIFACT_NAME: taylor-cams-priorcycle-split-extinction532-v2
  CAMS_PROFILE_SHA256: '6c3a3041b6718db415300323f23da0277752b6c9fc6c806e5eff7c493b060359'
  EXPECTED_BRANCH: science/taylor-paired-profile-crn-v1-ordinal48-continuation1

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      head: ${{ steps.guard.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - id: guard
        name: Verify fresh preregistered row26-only continuation identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_HEAD_REF" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git diff --name-only HEAD^ HEAD)" = "$PKG/EXECUTE_ORDINAL48_CONTINUATION1.txt"
          PARENT="$(git rev-parse HEAD^)"
          test "$(cat "$PKG/EXECUTE_ORDINAL48_CONTINUATION1.txt")" = "AUTHORIZED_EXECUTION_KEY=taylor-paired-profile-crn-v1:scientific:48-continuation1 PARENT=$PARENT"

          gh api "repos/$GITHUB_REPOSITORY/issues/828/comments?per_page=100" --paginate --slurp > issue828-comments.json
          python - "$PARENT" <<'PY'
          import json,sys
          parent=sys.argv[1]
          pages=json.load(open('issue828-comments.json'))
          comments=[c for page in pages for c in page]
          token=f'TAYLOR828_ORDINAL48_CONTINUATION1_PREREGISTERED_HEAD={parent}'
          hits=[c for c in comments if token in (c.get('body') or '')]
          if len(hits)!=1:
              raise SystemExit(f'expected exactly one continuation preregistration for {parent}, got {len(hits)}')
          print('CONTINUATION_PREREGISTRATION_PASS',hits[0]['id'])
          PY

          python -m json.tool "$MANIFEST" >/dev/null
          python -m py_compile "$RUNNER" "$ANALYZER"
          python - <<'PY'
          import json
          m=json.load(open('experiments/taylor-paired-profile-crn-v1/manifest-ordinal48-continuation1.json'))
          assert m['executionKey']=='taylor-paired-profile-crn-v1:scientific:48-continuation1'
          assert m['frozenRows']==[26]
          mm=m['mystic']
          assert mm['newPairCount']==4 and mm['continuationPairLabels']==[7,8,9,10]
          assert mm['pairSeedBases']==[1531000000,1532000000,1533000000,1534000000]
          assert mm['photonsPerRayPerCase']==200000 and mm['wideSqmRayCount']==64
          assert mm['maximumScientificSolverCalls']==520
          assert mm['maximumConfiguredPhotonHistories']==104000000
          assert m['precisionThresholdsMag']['caseMeanSeMax']==0.03
          assert m['precisionThresholdsMag']['pairedDeltaSeMax']==0.03
          assert m['precisionThresholdsMag']['combinedIndependentPairCount']==10
          assert all(m['analysis'][k] is False for k in ('fitOffset','fitAod','fitProfile','fitAnyParameter'))
          seeds=[]
          for b in mm['pairSeedBases']:
              seeds.extend(b+26*1000+i for i in range(1,65))
              seeds.append(b+26*1000+900)
          assert len(seeds)==260 and len(set(seeds))==260 and max(seeds)<2147483647
          print('FROZEN_CONTINUATION_CONTRACT_PASS',len(seeds),min(seeds),max(seeds))
          PY

          git fetch --no-tags --depth=1 origin main
          if git grep -n -E '(^|[^0-9])(1531000000|1532000000|1533000000|1534000000)([^0-9]|$)' origin/main -- .; then
            echo 'candidate continuation seed base already present as a bounded integer on main' >&2
            exit 1
          fi

          gh api "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" --paginate --slurp > issue60-comments.json
          python - <<'PY'
          import json,re
          pages=json.load(open('issue60-comments.json'))
          comments=[c for page in pages for c in page]
          active={}
          pat=re.compile(r'(?:^|[|\s])(begin|beginComment|begin_comment)=([^\s|]+)')
          for c in comments:
              body=c.get('body') or ''
              lines=body.splitlines(); first=lines[0].strip() if lines else ''
              if first.startswith('WRITE_QUIET_BEGIN'):
                  active[int(c['id'])]=first
              elif first.startswith('WRITE_QUIET_END'):
                  vals=[]
                  for _,v in pat.findall(first):
                      if not v.isdigit(): raise SystemExit(f'non-numeric WRITE_QUIET END id in comment {c["id"]}')
                      vals.append(int(v))
                  if vals:
                      if len(set(vals))!=1: raise SystemExit(f'conflicting WRITE_QUIET END ids in comment {c["id"]}')
                      active.pop(vals[0],None)
          if active: raise SystemExit(f'unmatched WRITE_QUIET_BEGIN present: {active}')
          print('ISSUE60_FENCE_CLEAR',len(comments))
          PY

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORD47_SCIENCE_RUN_ID" > ordinal47-science-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ORD47_ANALYSIS_ARTIFACT_ID" > ordinal47-analysis-artifact.json
          python - <<'PY'
          import json,os
          r=json.load(open('ordinal47-science-run.json'))
          assert str(r['id'])==os.environ['ORD47_SCIENCE_RUN_ID'] and r['head_sha']==os.environ['ORD47_SCIENCE_HEAD']
          assert r['run_attempt']==1 and r['status']=='completed'
          a=json.load(open('ordinal47-analysis-artifact.json'))
          assert str(a['id'])==os.environ['ORD47_ANALYSIS_ARTIFACT_ID']
          assert a['name']==os.environ['ORD47_ANALYSIS_ARTIFACT_NAME']
          assert a['digest']==os.environ['ORD47_ANALYSIS_ARTIFACT_DIGEST'] and a['expired'] is False
          print('IMMUTABLE_PARENT_EVIDENCE_PASS')
          PY
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.ORD47_ANALYSIS_ARTIFACT_NAME }}
          path: ordinal47-analysis
          github-token: ${{ github.token }}
          repository: search-maker/twilight-mystic-experiments
          run-id: ${{ env.ORD47_ANALYSIS_RUN_ID }}

      - name: Prove row26 is the only frozen precision-gate continuation target
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,json,pathlib
          root=pathlib.Path('ordinal47-analysis')
          s=json.loads(next(root.rglob('summary.json')).read_text())
          c=list(csv.DictReader(next(root.rglob('comparison.csv')).open()))
          state={int(x['row']):bool(x['pass']) for x in s['numericalConvergence']['rows']}
          assert state=={23:True,24:True,25:True,26:False}, state
          r=next(x for x in c if int(x['row'])==26)
          assert float(r['baseline_mean_se_mag'])<=0.03
          assert float(r['profile_mean_se_mag'])<=0.03
          assert float(r['paired_delta_se_mag'])>0.03
          assert abs(float(r['paired_delta_se_mag'])-0.031271263202890705)<1e-12
          print('ROW26_ONLY_CONTINUATION_JUSTIFIED',r['paired_delta_se_mag'])
          PY

      - name: Materialize immutable ordinal47 base and Taylor source/runtime files
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$ORD47_SCIENCE_HEAD"
          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          mkdir -p frozen-ordinal47 frozen-source
          git show "$ORD47_SCIENCE_HEAD:experiments/taylor-paired-profile-crn-v1/run_pair.py" > frozen-ordinal47/run_pair.py
          for f in run_row.py observations.csv sqm_response.csv; do
            git show "$SOURCE_SHA:experiments/taylor-ann-arbor-sqm-mystic-v1/$f" > "frozen-source/$f"
          done
          git show "$SOURCE_SHA:experiments/mystic-batch-v1/runtime-lock.micromamba.json" > frozen-source/runtime-lock.micromamba.json
          git show "$SOURCE_SHA:experiments/mystic-batch-v1/runtime_probe.py" > frozen-source/runtime_probe.py

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.CAMS_ARTIFACT_NAME }}
          path: cams
          github-token: ${{ github.token }}
          repository: search-maker/twilight-mystic-experiments
          run-id: ${{ env.CAMS_RUN_ID }}

      - name: Verify unchanged profile/source semantics
        shell: bash
        run: |
          set -euo pipefail
          echo "$CAMS_PROFILE_SHA256  cams/profile.csv" | sha256sum -c -
          grep -q "wavelength 380 780" frozen-source/run_row.py
          grep -q "mc_spectral_is 550.0" frozen-source/run_row.py
          grep -q "aerosol_default" frozen-source/run_row.py
          python - <<'PY'
          import csv
          rows=list(csv.DictReader(open('frozen-source/observations.csv')))
          r=next(x for x in rows if int(x['row'])==26)
          assert abs(float(r['sun_alt_geometric_deg']) - (-6.134193948733613)) < 1e-12
          assert r['comparison_role']=='secondary_moon_background_sensitive'
          PY

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: taylor-paired-profile-crn-continuation48
          create-args: >-
            -c conda-forge
            python=3.12.4
            numpy=2.3.2
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Verify exact reviewed MYSTIC runtime
        shell: bash -el {0}
        run: |
          set -euo pipefail
          UVSPEC="$(command -v uvspec)"
          DATA_DIR="$CONDA_PREFIX/share/libRadtran/data"
          ATM="$DATA_DIR/atmmod/afglus.dat"
          python frozen-source/runtime_probe.py --uvspec "$UVSPEC" --data-dir "$DATA_DIR" --atmosphere "$ATM" --runtime-lock frozen-source/runtime-lock.micromamba.json --output runtime-report.json
          python - <<'PY'
          import json
          r=json.load(open('runtime-report.json'))
          assert r['uvspecSha256']=='2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3'
          assert r['uvspecHelpSha256']=='868aea5af762d968f6f62c4e1472916d25232ed9cab5be112d753b0823d20548'
          assert r['libRadtranDataTreeSha256']=='ad30b49177e9c84e46497d69faf0c75e466996b0d0003f1de210289ae9f847d7'
          assert r['atmosphereSha256']=='dab26290ed81c762ed0c607e5dc2d53393c1462a0c3a528bc5e3f5935191cfb5'
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: taylor-paired-profile-crn-ordinal48-continuation-preflight
          path: |
            runtime-report.json
            issue60-comments.json
            issue828-comments.json
            ordinal47-science-run.json
            ordinal47-analysis-artifact.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

  cases:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        continuation_pair: [7,8,9,10]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.head }}
          fetch-depth: 2
          persist-credentials: false

      - name: Materialize immutable ordinal47 base and Taylor source inputs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$ORD47_SCIENCE_HEAD"
          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          mkdir -p frozen-ordinal47 frozen-source
          git show "$ORD47_SCIENCE_HEAD:experiments/taylor-paired-profile-crn-v1/run_pair.py" > frozen-ordinal47/run_pair.py
          for f in run_row.py observations.csv sqm_response.csv; do
            git show "$SOURCE_SHA:experiments/taylor-ann-arbor-sqm-mystic-v1/$f" > "frozen-source/$f"
          done

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.CAMS_ARTIFACT_NAME }}
          path: cams
          github-token: ${{ github.token }}
          repository: search-maker/twilight-mystic-experiments
          run-id: ${{ env.CAMS_RUN_ID }}

      - run: echo "$CAMS_PROFILE_SHA256  cams/profile.csv" | sha256sum -c -

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: taylor-paired-profile-crn-continuation48
          create-args: >-
            -c conda-forge
            python=3.12.4
            numpy=2.3.2
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Execute one fresh row26 CRN continuation pair
        shell: bash -el {0}
        run: |
          set -euo pipefail
          python "$RUNNER" \
            --continuation-pair "${{ matrix.continuation_pair }}" \
            --base-runner frozen-ordinal47/run_pair.py \
            --row 26 \
            --manifest "$MANIFEST" \
            --baseline-runner frozen-source/run_row.py \
            --observations frozen-source/observations.csv \
            --response frozen-source/sqm_response.csv \
            --cams-profile cams/profile.csv \
            --uvspec "$(command -v uvspec)" \
            --data-dir "$CONDA_PREFIX/share/libRadtran/data" \
            --output-dir "row-26-pair-${{ matrix.continuation_pair }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taylor-paired-profile-crn-ordinal48-cont-row26-pair-${{ matrix.continuation_pair }}
          path: row-26-pair-${{ matrix.continuation_pair }}
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6

  analysis:
    needs: [preflight,cases]
    if: ${{ needs.cases.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.head }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install --disable-pip-version-check matplotlib==3.10.5

      - uses: actions/download-artifact@v4
        with:
          pattern: taylor-paired-profile-crn-ordinal47-row-26-pair-*
          path: old-row26-artifacts
          merge-multiple: false
          github-token: ${{ github.token }}
          repository: search-maker/twilight-mystic-experiments
          run-id: ${{ env.ORD47_SCIENCE_RUN_ID }}

      - uses: actions/download-artifact@v4
        with:
          pattern: taylor-paired-profile-crn-ordinal48-cont-row26-pair-*
          path: new-row26-artifacts
          merge-multiple: false

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.ORD47_ANALYSIS_ARTIFACT_NAME }}
          path: ordinal47-analysis
          github-token: ${{ github.token }}
          repository: search-maker/twilight-mystic-experiments
          run-id: ${{ env.ORD47_ANALYSIS_RUN_ID }}

      - name: Verify exact fresh continuation solver budget
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          fs=list(pathlib.Path('new-row26-artifacts').rglob('pair-result.json'))
          assert len(fs)==4, len(fs)
          rows=[]; calls=hist=0
          for p in fs:
              x=json.loads(p.read_text()); rows.append((int(x['row']),int(x['pair'])))
              assert x['executionKey']=='taylor-paired-profile-crn-v1:scientific:48-continuation1'
              assert int(x['photonsPerRayPerCase'])==200000 and x['commonRandomNumbers'] is True
              calls+=int(x['solverCalls']); hist+=int(x['configuredPhotonHistories'])
          assert sorted(rows)==[(26,7),(26,8),(26,9),(26,10)]
          assert calls==520 and hist==104000000, (calls,hist)
          print('FRESH_CONTINUATION_BUDGET_PASS',calls,hist)
          PY

      - name: Analyze ten-pair row26 precision closure without reweighting regional tests
        shell: bash
        run: |
          set -euo pipefail
          python "$ANALYZER" \
            --old-results-root old-row26-artifacts \
            --new-results-root new-row26-artifacts \
            --old-analysis-root ordinal47-analysis \
            --output analysis-output
          cat analysis-output/report.md

      - uses: actions/upload-artifact@v4
        with:
          name: taylor-paired-profile-crn-ordinal48-continuation-analysis
          path: analysis-output
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Publish compact continuation result to Issue 828
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          {
            cat analysis-output/issue-summary.md
            echo
            echo "Continuation execution: taylor-paired-profile-crn-v1:scientific:48-continuation1"
            echo "Continuation run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (attempt $GITHUB_RUN_ATTEMPT)"
            echo "Continuation head: ${{ needs.preflight.outputs.head }}"
            echo "Immutable parent science run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$ORD47_SCIENCE_RUN_ID"
            echo "Immutable parent analysis run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$ORD47_ANALYSIS_RUN_ID"
          } > issue-comment.md
          gh issue comment 828 --repo "$GITHUB_REPOSITORY" --body-file issue-comment.md
