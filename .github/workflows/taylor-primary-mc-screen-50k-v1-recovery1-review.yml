name: Taylor primary MC screen 50k recovery1 review

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'experiments/taylor-primary-mc-screen-50k-v1/**'
      - 'tests/test_taylor_primary_mc_screen_50k_v1_review.py'
      - '.github/workflows/taylor-primary-mc-screen-50k-v1-recovery1-review.yml'

permissions:
  contents: read

jobs:
  review-only:
    if: github.head_ref == 'review/taylor-primary-mc-screen-50k-v1-recovery1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove solver unavailable
        shell: bash
        run: |
          set -euo pipefail
          if command -v uvspec >/dev/null 2>&1; then
            echo 'uvspec unexpectedly present in recovery review' >&2
            exit 1
          fi
      - name: Install review dependencies
        run: python -m pip install --disable-pip-version-check pytest==8.4.1
      - name: Compile recovery package
        run: python -m py_compile experiments/taylor-primary-mc-screen-50k-v1/*.py
      - name: Run recovery regression tests
        run: pytest -q tests/test_taylor_primary_mc_screen_50k_v1_review.py
