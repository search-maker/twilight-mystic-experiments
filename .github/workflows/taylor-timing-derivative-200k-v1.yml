name: Taylor timing derivative 200k v1
run-name: Taylor timing derivative 200k v1 | ${{ github.event.pull_request.head.sha }}

on:
  pull_request:
    types: [opened]
    paths:
      - 'experiments/taylor-timing-derivative-200k-v1/**'
      - '.github/workflows/taylor-timing-derivative-200k-v1.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: taylor-timing-derivative-200k-v1-scientific-1
  cancel-in-progress: false

env:
  PKG: experiments/taylor-timing-derivative-200k-v1
  REVIEW_PARENT: 223efe35e265a7fe565696f688e4007ca3498001
  TAYLOR_SOURCE_SHA: 7231bd873859cc8c36fe6749985e0ece193b5de7
  PRIOR_200K_RUN_ID: '33044289555'
  LEGACY_ANALYSIS_RUN_ID: '33016529095'
  RUNTIME_LOCK: experiments/mystic-batch-v1/runtime-lock.micromamba.json
  RUNTIME_PROBE: experiments/mystic-batch-v1/runtime_probe.py

jobs:
  preflight:
    if: github.head_ref == 'science/taylor-timing-derivative-200k-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      head: ${{ steps.identity.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - id: identity
        name: Verify one-shot science identity and reviewed parent
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_HEAD_REF" = "science/taylor-timing-derivative-200k-v1"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD^)" = "$REVIEW_PARENT"
          git fetch --no-tags --depth=1 origin "$REVIEW_PARENT"
          git diff --exit-code "$REVIEW_PARENT" HEAD -- \
            "$PKG" \
            tests/test_taylor_timing_derivative_200k_v1_review.py \
            .github/workflows/taylor-timing-derivative-200k-v1-review.yml
          python - <<'PY'
          import ast,pathlib
          p=pathlib.Path('experiments/taylor-timing-derivative-200k-v1/run_neighbor_replicate.py')
          t=ast.parse(p.read_text()); vals={}
          for n in t.body:
              if isinstance(n,ast.Assign) and len(n.targets)==1 and isinstance(n.targets[0],ast.Name):
                  name=n.targets[0].id
                  if name in {'ROWS','REPLICATES','PHOTONS','SEED_BASE'}: vals[name]=ast.literal_eval(n.value)
          assert vals['ROWS']==[22,26]
          assert vals['REPLICATES']==[1,2,3,4,5,6]
          assert vals['PHOTONS']==200000
          assert vals['SEED_BASE']=={1:973000000,2:974000000,3:975000000,4:976000000,5:977000000,6:978000000}
          seeds=[vals['SEED_BASE'][rep]+row*1000+ray for rep in vals['REPLICATES'] for row in vals['ROWS'] for ray in range(1,65)]
          consumed=[base+row*1000+ray for base in range(955000000,973000000,1000000) for row in vals['ROWS'] for ray in range(1,65)]
          assert len(seeds)==768 and len(set(seeds))==768 and set(seeds).isdisjoint(consumed)
          assert 768*200000==153600000
          print('FROZEN_TIMING_NEIGHBOR_UNIVERSE_PASS',len(seeds),'calls')
          PY
          python -m py_compile "$PKG"/*.py
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Materialize exact Taylor-v1 source files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p frozen-source
          git fetch --no-tags --depth=1 origin "$TAYLOR_SOURCE_SHA"
          git show "$TAYLOR_SOURCE_SHA:experiments/taylor-ann-arbor-sqm-mystic-v1/run_row.py" > frozen-source/run_row.py
          git show "$TAYLOR_SOURCE_SHA:experiments/taylor-ann-arbor-sqm-mystic-v1/observations.csv" > frozen-source/observations.csv
          git show "$TAYLOR_SOURCE_SHA:experiments/taylor-ann-arbor-sqm-mystic-v1/sqm_response.csv" > frozen-source/sqm_response.csv
          test "$(git rev-parse "$TAYLOR_SOURCE_SHA:experiments/taylor-ann-arbor-sqm-mystic-v1/run_row.py")" = "34e6229ccbd0976032a292171b4f64c66854029d"
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: taylor-timing-derivative-preflight-v1
          create-args: >-
            -c conda-forge
            python=3.12.4
            numpy=2.3.2
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true
      - name: Verify exact reviewed MYSTIC runtime without solver execution
        shell: bash -el {0}
        run: |
          set -euo pipefail
          UVSPEC="$(command -v uvspec)"
          DATA_DIR="$CONDA_PREFIX/share/libRadtran/data"
          ATM="$DATA_DIR/atmmod/afglus.dat"
          python "$RUNTIME_PROBE" --uvspec "$UVSPEC" --data-dir "$DATA_DIR" --atmosphere "$ATM" --runtime-lock "$RUNTIME_LOCK" --output runtime-report.json
          python - <<'PY'
          import json
          r=json.load(open('runtime-report.json'))
          assert r['uvspecSha256']=='2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3'
          assert r['uvspecHelpSha256']=='868aea5af762d968f6f62c4e1472916d25232ed9cab5be112d753b0823d20548'
          assert r['libRadtranDataTreeSha256']=='ad30b49177e9c84e46497d69faf0c75e466996b0d0003f1de210289ae9f847d7'
          assert r['atmosphereSha256']=='dab26290ed81c762ed0c607e5dc2d53393c1462a0c3a528bc5e3f5935191cfb5'
          PY
      - name: Execute exact dry timing-neighbor input audit
        shell: bash -el {0}
        run: |
          set -euo pipefail
          python "$PKG/preflight.py" \
            --baseline-runner frozen-source/run_row.py \
            --observations frozen-source/observations.csv \
            --response frozen-source/sqm_response.csv \
            --data-dir "$CONDA_PREFIX/share/libRadtran/data" \
            --output dry-preflight
          python - <<'PY'
          import json
          x=json.load(open('dry-preflight/preflight.json'))
          assert x['status']=='DRY_TIMING_NEIGHBOR_IDENTITY_PASS'
          assert x['uniqueSeedCount']==768 and x['auditCount']==768
          assert x['configuredPhotonHistoriesIfAuthorized']==153600000
          print('DRY_TIMING_PREFLIGHT_PASS',x['auditCount'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: taylor-timing-derivative-200k-v1-preflight
          path: |
            frozen-source
            dry-preflight
            runtime-report.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

  cases:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        row: [22,26]
        replicate: [1,2,3,4,5,6]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.head }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: taylor-timing-derivative-200k-v1-preflight
          path: preflight-artifact
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: taylor-timing-derivative-200k-v1
          create-args: >-
            -c conda-forge
            python=3.12.4
            numpy=2.3.2
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true
      - name: Verify exact reviewed MYSTIC runtime
        shell: bash -el {0}
        run: |
          set -euo pipefail
          python "$RUNTIME_PROBE" --uvspec "$(command -v uvspec)" --data-dir "$CONDA_PREFIX/share/libRadtran/data" --atmosphere "$CONDA_PREFIX/share/libRadtran/data/atmmod/afglus.dat" --runtime-lock "$RUNTIME_LOCK" --output runtime-report.json
          python - <<'PY'
          import json
          r=json.load(open('runtime-report.json'))
          assert r['uvspecSha256']=='2b9c7a69e4dfe4e77ade97148b2499b0a2c205c8d8000d3516a29344cc9d2fc3'
          assert r['libRadtranDataTreeSha256']=='ad30b49177e9c84e46497d69faf0c75e466996b0d0003f1de210289ae9f847d7'
          assert r['atmosphereSha256']=='dab26290ed81c762ed0c607e5dc2d53393c1462a0c3a528bc5e3f5935191cfb5'
          PY
      - name: Execute one frozen 200k timing-neighbor replicate
        shell: bash -el {0}
        run: |
          set -euo pipefail
          python "$PKG/run_neighbor_replicate.py" \
            --row "${{ matrix.row }}" \
            --replicate "${{ matrix.replicate }}" \
            --baseline-runner preflight-artifact/frozen-source/run_row.py \
            --observations preflight-artifact/frozen-source/observations.csv \
            --response preflight-artifact/frozen-source/sqm_response.csv \
            --uvspec "$(command -v uvspec)" \
            --data-dir "$CONDA_PREFIX/share/libRadtran/data" \
            --output-dir "row-${{ matrix.row }}-rep-${{ matrix.replicate }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taylor-timing-derivative-200k-v1-row-${{ matrix.row }}-rep-${{ matrix.replicate }}
          path: |
            row-${{ matrix.row }}-rep-${{ matrix.replicate }}
            runtime-report.json
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6

  analysis:
    needs: [preflight,cases]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.head }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependency
        run: python -m pip install --disable-pip-version-check numpy==2.3.2
      - uses: actions/download-artifact@v4
        with:
          pattern: taylor-timing-derivative-200k-v1-row-*-rep-*
          path: new-neighbors
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          pattern: taylor-broadband-photon-scaling-200k-v1-row-*-rep-*
          path: prior-200k
          merge-multiple: false
          github-token: ${{ github.token }}
          repository: search-maker/twilight-mystic-experiments
          run-id: ${{ env.PRIOR_200K_RUN_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: taylor-sqm-mystic-v1-analysis-recovery
          path: legacy-analysis
          github-token: ${{ github.token }}
          repository: search-maker/twilight-mystic-experiments
          run-id: ${{ env.LEGACY_ANALYSIS_RUN_ID }}
      - name: Verify immutable prior universes
        shell: bash
        run: |
          set -euo pipefail
          test "$(find prior-200k -name row-replicate-result.json | wc -l)" = "18"
          test -s legacy-analysis/metrics.json
          test -s legacy-analysis/comparison.csv
      - name: Analyze exact Taylor timing derivative reconvergence
        run: |
          set -euo pipefail
          python "$PKG/analyze.py" --new-neighbor-results-root new-neighbors --prior-200k-results-root prior-200k --legacy-analysis-root legacy-analysis --output analysis-output
          cat analysis-output/report.md
      - uses: actions/upload-artifact@v4
        with:
          name: taylor-timing-derivative-200k-v1-analysis
          path: analysis-output
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
