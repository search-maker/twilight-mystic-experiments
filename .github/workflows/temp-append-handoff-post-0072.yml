name: Temporary append cumulative handoff post-0072

on:
  push:
    branches:
      - docs/update-2026-08-16-handoff-post-0072

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/update-2026-08-16-handoff-post-0072
      - name: Append staged delta exactly once
        shell: bash
        run: |
          set -euo pipefail
          target='review/full-spectrum-estimator-pilot-v2/STAR_VISIBILITY_PROJECT_HANDOFF_2026-08-16.md'
          delta='review/full-spectrum-estimator-pilot-v2/.handoff-post-0072-delta.tmp.md'
          marker='## 34. POST-CREATION DELTA — MYSTIC-STATE-0072 COMPLETE / ORDINAL28 PASS / VALIDATED PACKAGE PUBLISHED'
          test -f "$delta"
          ! grep -Fq "$marker" "$target"
          cat "$delta" >> "$target"
          git diff --check -- "$target"
          git config user.name search-maker
          git config user.email 304153003+search-maker@users.noreply.github.com
          git add "$target"
          git commit -m 'Update cumulative handoff through ordinal28 PASS'
          git push origin HEAD:docs/update-2026-08-16-handoff-post-0072
