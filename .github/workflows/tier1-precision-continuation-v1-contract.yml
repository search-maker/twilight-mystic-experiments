name: Tier-1 precision continuation v1 contract
on:
  pull_request:
    paths:
      - 'experiments/tier1-precision-continuation-v1/**'
      - 'tests/test_tier1_precision_continuation_v1.py'
      - '.github/workflows/tier1-precision-continuation-v1-contract.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - run: python -m py_compile experiments/tier1-precision-continuation-v1/package.py tests/test_tier1_precision_continuation_v1.py
      - run: python -m unittest tests/test_tier1_precision_continuation_v1.py
      - name: Prove no automatic scientific trigger
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          workflow = Path('.github/workflows/tier1-precision-continuation-v1-contract.yml').read_text()
          assert '\n  workflow_dispatch:' not in workflow
          path = Path('experiments/tier1-precision-continuation-v1/package.py')
          spec = importlib.util.spec_from_file_location('continuation_contract', path)
          assert spec and spec.loader
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          assert module.TARGET_RSEM == 0.05
          assert module.ACCEPTED_MAX_RSEM == 0.08
          assert module.MAX_TOTAL_BLOCKS == 8
          assert module.authorization_template({'proposalSha256': 'a' * 64})['enabled'] is False
          assert module.authorization_template({'proposalSha256': 'a' * 64})['automaticDispatch'] is False
          assert module.authorization_template({'proposalSha256': 'a' * 64})['githubRerunAllowed'] is False
          PY
