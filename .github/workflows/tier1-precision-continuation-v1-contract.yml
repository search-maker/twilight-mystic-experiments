name: Tier-1 precision continuation v1 contract
on:
  pull_request:
    paths:
      - 'experiments/tier1-precision-continuation-v1/**'
      - 'tests/test_tier1_precision_continuation_v1.py'
      - '.github/workflows/tier1-precision-continuation-v1-contract.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - run: python -m py_compile experiments/tier1-precision-continuation-v1/package.py tests/test_tier1_precision_continuation_v1.py
      - run: python -m unittest tests/test_tier1_precision_continuation_v1.py
      - name: Prove no automatic scientific trigger
        run: |
          test "$(grep -R "workflow_dispatch" -n .github/workflows/tier1-precision-continuation-v1-contract.yml | wc -l)" -eq 0
          grep -q "automaticDispatch':False" experiments/tier1-precision-continuation-v1/package.py
          grep -q "authorizationEnabled':False" experiments/tier1-precision-continuation-v1/package.py
