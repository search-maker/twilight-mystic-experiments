name: Tier-1 precision continuation v2 contract
on:
  pull_request:
    paths:
      - 'experiments/tier1-precision-continuation-v2/**'
      - 'evidence/ordinal2-corrected-v2/**'
      - 'tests/test_tier1_precision_continuation_v2.py'
      - '.github/workflows/tier1-precision-continuation-v2-contract.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - run: python -m py_compile experiments/tier1-precision-continuation-v2/package.py tests/test_tier1_precision_continuation_v2.py
      - run: python -m unittest discover -s tests -p 'test_tier1_precision_continuation_v2.py'
      - name: Prove preparation-only boundary
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          workflow = Path('.github/workflows/tier1-precision-continuation-v2-contract.yml').read_text()
          assert '\n  workflow_dispatch:' not in workflow
          path = Path('experiments/tier1-precision-continuation-v2/package.py')
          spec = importlib.util.spec_from_file_location('continuation_v2_contract', path)
          assert spec and spec.loader
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          assert module.TARGET_RSEM == 0.05
          assert module.ACCEPTED_MAX_RSEM == 0.08
          assert module.MAX_TOTAL_BLOCKS == 8
          assert module.MAX_WAVE_PHOTONS == 5_100_000_000
          assert module.MAX_CONTINUATION_PHOTONS == 15_300_000_000
          template = module.authorization_template({'proposalSha256': 'a' * 64}, 1)
          assert template['enabled'] is False
          assert template['authorizationOrdinal'] is None
          assert template['executionKey'] is None
          assert template['automaticDispatch'] is False
          assert template['githubRerunAllowed'] is False
          PY
