name: Tier-1 wave-1 ordinal 8 authorization contract

on:
  pull_request:
    paths:
      - '.github/workflows/tier1-precision-continuation-wave1-ordinal8-authorization-contract.yml'
      - 'experiments/tier1-precision-continuation-wave1-v2/authorization.ordinal8.json'
      - 'experiments/tier1-precision-continuation-wave1-v2/authorization.template.json'
      - 'experiments/tier1-precision-continuation-wave1-v2/ordinal8_review.py'
      - 'evidence/tier1-precision-continuation-wave1-v2/preregistration.json'
      - 'evidence/tier1-precision-continuation-wave1-v2/ordinal8-duplicate-search-snapshot.json'

permissions:
  contents: read

jobs:
  authorization-contract-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - name: Prove workflow boundary and build exact authorization payload
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          WORKFLOW=.github/workflows/tier1-precision-continuation-wave1-ordinal8-authorization-contract.yml
          AUTH=experiments/tier1-precision-continuation-wave1-v2/authorization.ordinal8.json
          MODE=authorization
          if [ ! -f "$AUTH" ]; then MODE=ephemeral-contract; fi
          mkdir -p contract
          printf '%s\n' "$MODE" > contract/mode.txt
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          def must(ok, message):
              if not ok:
                  raise SystemExit(message)

          def load(path):
              raw = Path(path).read_bytes()
              value = json.loads(raw)
              must(isinstance(value, dict), f'{path} must contain a JSON object')
              return value, hashlib.sha256(raw).hexdigest()

          workflow = Path('.github/workflows/tier1-precision-continuation-wave1-ordinal8-authorization-contract.yml').read_text().lower()
          header = workflow.split('jobs:', 1)[0]
          must(('workflow_' + 'dispatch:') not in header, 'workflow_dispatch is forbidden')
          must('repository_dispatch:' not in header, 'repository_dispatch is forbidden')
          must('schedule:' not in header, 'schedule is forbidden')
          must('workflow_run:' not in header, 'workflow_run is forbidden')
          must(('uv' + 'spec') not in workflow, 'solver command is forbidden')
          must(('--allow-' + 'execution') not in workflow, 'execution flag is forbidden')

          prereg, prereg_raw = load('evidence/tier1-precision-continuation-wave1-v2/preregistration.json')
          template, template_raw = load('experiments/tier1-precision-continuation-wave1-v2/authorization.template.json')
          snapshot, snapshot_raw = load('evidence/tier1-precision-continuation-wave1-v2/ordinal8-duplicate-search-snapshot.json')
          review_blob = os.popen('git rev-parse HEAD:experiments/tier1-precision-continuation-wave1-v2/ordinal8_review.py').read().strip()
          must(prereg_raw == 'bcbb2376e6d7b9a3e3cefc52cd071857a98496dc5d0a8aebce2f512ac6ddf38a', 'preregistration raw SHA-256 drift')
          must(template_raw == '8db81c9b4ed13076f7510300cc3b54e7d1e952ef036846aa219a0709d7504b00', 'template raw SHA-256 drift')
          must(snapshot_raw == '017e775cd98e63b26d6f85fcd9aa49555f14144c0f9e1269b0f8b8d795add51f', 'duplicate snapshot raw SHA-256 drift')
          must(review_blob == '09d9577547e0a5791dff23bbfefc25b8d7c424d8', 'review module Git blob drift')

          must(prereg.get('caseCount') == 40 and prereg.get('geometryCount') == 20, 'wave-1 scope changed')
          must(prereg.get('blocks') == [3, 4], 'wave-1 blocks changed')
          must(prereg.get('maximumConfiguredPhotonHistories') == 5_100_000_000, 'wave-1 photon budget changed')
          must(prereg.get('authorizationEnabled') is False and prereg.get('dispatchEnabled') is False, 'preregistration boundary opened')
          must(prereg.get('workflowDispatchEnabled') is False and prereg.get('scientificExecution') is False, 'preregistration execution boundary opened')
          must(prereg.get('seedProof', {}).get('wave1SeedCount') == 40, 'wave-1 seed count changed')
          must(prereg.get('seedProof', {}).get('historicalOverlap') == [], 'wave-1 seed overlap found')

          candidate = snapshot.get('candidateIdentity', {})
          findings = snapshot.get('findings', {})
          must(snapshot.get('ordinalScope') == 'REPOSITORY_GLOBAL_SINGLE_USE', 'ordinal scope changed')
          must(snapshot.get('candidateSearchComplete') is True, 'candidate search incomplete')
          must(candidate.get('authorizationOrdinal') == 8, 'candidate ordinal changed')
          must(candidate.get('executionKey') == 'twilight-surrogate-tier-1-v1:numerical:8', 'candidate key changed')
          must(candidate.get('runTitle') == 'Tier-1 precision continuation wave 1 ordinal 8', 'candidate title changed')
          must(findings.get('candidateOrdinalCollisions') == [], 'candidate ordinal collision found')
          must(findings.get('candidateExecutionKeyCollisions') == [], 'candidate execution-key collision found')
          must(findings.get('authorizationRefCollisions') == [], 'authorization-ref collision found')
          must(findings.get('runTitleCollisions') == [], 'run-title collision found')
          must(findings.get('branchPathCollisions') == [], 'branch collision found')
          must(findings.get('authorizationFilePathCollisions') == [], 'authorization-path collision found')
          must(findings.get('wave1SeedCollisions') == [], 'seed collision found')
          must([row.get('authorizationOrdinal') for row in snapshot.get('consumedIdentityInventory', [])] == list(range(1, 8)), 'consumed ordinal inventory changed')

          expected_keys = {
              'authorizationCommit', 'authorizationOrdinal', 'authorizationRef', 'automaticDispatch',
              'blocks', 'caseCount', 'dispatch', 'enabled', 'executionKey', 'githubRerunAllowed',
              'preregistrationSha256', 'runAttempt', 'schemaVersion', 'solverExecutionAuthorized',
              'stageId', 'status', 'templateSha256', 'wave', 'workflowDispatchEnabled',
          }
          must(set(template) == expected_keys, 'authorization template schema changed')
          for key in ('authorizationCommit', 'authorizationOrdinal', 'authorizationRef', 'executionKey', 'runAttempt'):
              must(template.get(key) is None, f'template {key} must remain null')
          for key in ('automaticDispatch', 'dispatch', 'enabled', 'githubRerunAllowed', 'solverExecutionAuthorized', 'workflowDispatchEnabled'):
              must(template.get(key) is False, f'template {key} must remain false')
          must(template.get('blocks') == [3, 4] and template.get('caseCount') == 40 and template.get('wave') == 1, 'template scope changed')

          expected = dict(template)
          expected.update({
              'authorizationCommit': None,
              'authorizationOrdinal': 8,
              'authorizationRef': None,
              'automaticDispatch': False,
              'dispatch': False,
              'enabled': True,
              'executionKey': 'twilight-surrogate-tier-1-v1:numerical:8',
              'githubRerunAllowed': False,
              'runAttempt': 1,
              'solverExecutionAuthorized': True,
              'stageId': 'tier1-precision-continuation-wave1-ordinal8-authorization-v2',
              'status': 'AUTHORIZED_PENDING_SEPARATE_DISPATCH',
              'workflowDispatchEnabled': False,
          })
          auth_path = Path('experiments/tier1-precision-continuation-wave1-v2/authorization.ordinal8.json')
          if auth_path.exists():
              actual = json.loads(auth_path.read_text())
              must(actual == expected, 'committed ordinal-8 authorization differs from exact payload')
          else:
              auth_path.write_text(json.dumps(expected, indent=2, sort_keys=True) + '\n')
          Path('contract/authorization.ordinal8.json').write_text(json.dumps(expected, indent=2, sort_keys=True) + '\n')
          PY
          if [ "$MODE" = ephemeral-contract ]; then
            PARENT="$(git rev-parse HEAD)"
            git config user.email contract@example.invalid
            git config user.name 'Ordinal-8 Authorization Contract'
            git add "$AUTH"
            git commit -m 'Ephemeral ordinal-8 authorization contract'
          else
            test "$HEAD_BRANCH" = authorization/tier1-precision-continuation-wave1-ordinal8-v2
            PARENT="$(git rev-parse HEAD^)"
            test "$PARENT" = "$BASE_SHA"
          fi
          AUTH_REF="$(git rev-parse HEAD)"
          test "$(git diff --name-only "$PARENT" "$AUTH_REF")" = "$AUTH"
          python - <<'PY'
          import json, os
          from pathlib import Path
          auth = json.loads(Path('contract/authorization.ordinal8.json').read_text())
          report = {
              'schemaVersion': 1,
              'status': 'AUTHORIZED_PENDING_SEPARATE_DISPATCH',
              'authorizationRef': os.popen('git rev-parse HEAD').read().strip(),
              'authorizationParentCommit': os.popen('git rev-parse HEAD^').read().strip(),
              'authorizationBranch': 'authorization/tier1-precision-continuation-wave1-ordinal8-v2',
              'authorizationFile': 'experiments/tier1-precision-continuation-wave1-v2/authorization.ordinal8.json',
              'authorizationOrdinal': auth['authorizationOrdinal'],
              'executionKey': auth['executionKey'],
              'runAttemptAuthorized': auth['runAttempt'],
              'authorizationEnabled': auth['enabled'],
              'solverExecutionAuthorized': auth['solverExecutionAuthorized'],
              'dispatchPerformed': False,
              'automaticDispatch': False,
              'workflowDispatchEnabled': False,
              'githubRerunAllowed': False,
              'trainingAuthorized': False,
              'holdoutOpeningAuthorized': False,
              'tier2Authorized': False,
              'productionAuthorized': False,
              'boundary': 'one-purpose immutable authorization only; separate reviewed dispatch still required',
          }
          Path('contract/authorization-guard.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          PY
      - name: Run full non-scientific suite
        run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: tier1-wave1-ordinal8-authorization-contract-only
          path: contract
          if-no-files-found: error
          retention-days: 30
