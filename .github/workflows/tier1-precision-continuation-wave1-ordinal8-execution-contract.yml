name: Tier-1 precision continuation wave 1 ordinal 8 execution contract
on:
  pull_request:
    paths:
      - '.github/workflows/tier1-precision-continuation-wave1-ordinal8-execution.yml'
      - '.github/workflows/tier1-precision-continuation-wave1-ordinal8-execution-contract.yml'
      - 'experiments/tier1-precision-continuation-wave1-v2/execution.py'
      - 'experiments/tier1-precision-continuation-wave1-v2/execution_adapter.py'
      - 'experiments/tier1-precision-continuation-wave1-v2/case_executor.py'
      - 'tests/test_tier1_precision_continuation_wave1_execution.py'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.4'}
      - run: pip install PyYAML
      - run: python -m py_compile experiments/tier1-precision-continuation-wave1-v2/execution.py experiments/tier1-precision-continuation-wave1-v2/execution_adapter.py experiments/tier1-precision-continuation-wave1-v2/case_executor.py tests/test_tier1_precision_continuation_wave1_execution.py
      - run: python -m unittest discover -s tests -p 'test_tier1_precision_continuation_wave1_execution.py' -v
      - run: python -c "import yaml; yaml.safe_load(open('.github/workflows/tier1-precision-continuation-wave1-ordinal8-execution.yml')); yaml.safe_load(open('.github/workflows/tier1-precision-continuation-wave1-ordinal8-execution-contract.yml'))"
      - run: python -m unittest discover -s tests -v
      - name: Generate deterministic synthetic contract artifacts twice
        run: |
          python tests/test_tier1_precision_continuation_wave1_execution.py --emit-contract contract-a
          python tests/test_tier1_precision_continuation_wave1_execution.py --emit-contract contract-b
          diff -r contract-a contract-b
          cp -r contract-a contract-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: tier1-wave1-ordinal8-execution-contract
          path: contract-artifacts