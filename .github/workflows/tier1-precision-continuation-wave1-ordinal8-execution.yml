name: Tier-1 precision continuation wave 1 ordinal 8 execution
run-name: Tier-1 precision continuation wave 1 ordinal 8
on:
  workflow_dispatch:
    inputs:
      authorization_ref:
        description: Exact immutable ordinal-8 authorization commit
        required: true
        type: string
      authorization_ordinal:
        description: Exact authorization ordinal
        required: true
        type: string
      execution_key:
        description: Exact fresh execution key
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: tier1-wave1-ordinal8-execution
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Refuse wrong source and inputs
        env:
          AUTH_REF: ${{ inputs.authorization_ref }}
          AUTH_ORDINAL: ${{ inputs.authorization_ordinal }}
          EXECUTION_KEY: ${{ inputs.execution_key }}
        run: |
          test "$GITHUB_REF_NAME" = main
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$AUTH_REF" = 5168be57c28bca5f316d70a785a782ea9b3b1036
          test "$AUTH_ORDINAL" = 8
          test "$EXECUTION_KEY" = twilight-surrogate-tier-1-v1:numerical:8
      - name: Fetch immutable authorization payload
        run: |
          git fetch origin 5168be57c28bca5f316d70a785a782ea9b3b1036
          git show 5168be57c28bca5f316d70a785a782ea9b3b1036:experiments/tier1-precision-continuation-wave1-v2/authorization.ordinal8.json > authorization.json
      - name: Duplicate search before any syntax or solver execution
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh api --method GET --paginate repos/${{ github.repository }}/actions/workflows/tier1-precision-continuation-wave1-ordinal8-execution.yml/runs -f per_page=100 --slurp --jq '[.[].workflow_runs[]]' > runs.json
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: tier1-wave1-ordinal8
          create-args: -c conda-forge python=3.12.4 rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true
      - name: Capture runtime identity without solver execution
        shell: micromamba-shell {0}
        run: python experiments/mystic-batch-v1/runtime_probe.py --uvspec "$(command -v uvspec)" --data-dir "$CONDA_PREFIX/share/libRadtran/data" --atmosphere "$CONDA_PREFIX/share/libRadtran/data/atmmod/afglus.dat" --runtime-lock experiments/mystic-batch-v1/runtime-lock.micromamba.json --output runtime-report.json
      - name: Build exact deterministic 40-case manifest
        run: |
          python - <<'PY'
          import json, os
          context={'eventName':os.environ['GITHUB_EVENT_NAME'],'runAttempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'displayTitle':'Tier-1 precision continuation wave 1 ordinal 8','authorizationRef':'${{ inputs.authorization_ref }}','authorizationOrdinal':int('${{ inputs.authorization_ordinal }}'),'executionKey':'${{ inputs.execution_key }}','headBranch':os.environ['GITHUB_REF_NAME'],'headSha':os.environ['GITHUB_SHA'],'runId':int(os.environ['GITHUB_RUN_ID'])}
          open('context.json','w').write(json.dumps(context))
          PY
          python experiments/tier1-precision-continuation-wave1-v2/execution.py manifest --root . --authorization authorization.json --context context.json --runs runs.json --runtime runtime-report.json --output execution-manifest.json
      - id: matrix
        run: echo "matrix=$(python -c \"import json; d=json.load(open('execution-manifest.json')); print(json.dumps({'include':[{'caseId':c['caseId'],'timeout':2400} for c in d['cases']]},separators=(',',':')))\")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: tier1-wave1-ordinal8-execution-manifest
          path: |
            authorization.json
            runtime-report.json
            execution-manifest.json
            runs.json
  cases:
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: tier1-wave1-ordinal8
          create-args: -c conda-forge python=3.12.4 rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true
      - uses: actions/download-artifact@v4
        with: {name: tier1-wave1-ordinal8-execution-manifest}
      - name: Re-prove runtime identity
        shell: micromamba-shell {0}
        run: python experiments/mystic-batch-v1/runtime_probe.py --uvspec "$(command -v uvspec)" --data-dir "$CONDA_PREFIX/share/libRadtran/data" --atmosphere "$CONDA_PREFIX/share/libRadtran/data/atmmod/afglus.dat" --runtime-lock experiments/mystic-batch-v1/runtime-lock.micromamba.json --output case-runtime.json
      - name: Execute exactly one syntax check and one solver invocation
        shell: micromamba-shell {0}
        run: python experiments/tier1-precision-continuation-wave1-v2/case_executor.py --manifest execution-manifest.json --runtime-report case-runtime.json --adapter experiments/tier1-precision-continuation-wave1-v2/execution_adapter.py --case-id '${{ matrix.caseId }}' --data-dir "$CONDA_PREFIX/share/libRadtran/data" --repository-root . --uvspec "$(command -v uvspec)" --output-root output --timeout-seconds '${{ matrix.timeout }}' --allow-execution
      - uses: actions/upload-artifact@v4
        with:
          name: tier1-wave1-ordinal8-case-${{ matrix.caseId }}
          path: output/${{ matrix.caseId }}
  aggregate:
    if: ${{ always() && needs.preflight.result == 'success' && needs.cases.result == 'success' }}
    needs: [preflight, cases]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: tier1-wave1-ordinal8-*, path: artifacts}
      - name: Complete aggregate, independent audit, and closed analysis
        run: |
          python - <<'PY'
          import importlib.util,json,pathlib
          p=pathlib.Path('experiments/tier1-precision-continuation-wave1-v2/execution.py'); s=importlib.util.spec_from_file_location('e',p); e=importlib.util.module_from_spec(s); s.loader.exec_module(e)
          manifest=json.load(open('artifacts/tier1-wave1-ordinal8-execution-manifest/execution-manifest.json'))
          results=[json.load(open(p)) for p in pathlib.Path('artifacts').glob('tier1-wave1-ordinal8-case-*/case-result.json')]
          a=e.aggregate(pathlib.Path('.').resolve(),manifest,results); open('aggregate.json','w').write(e.dump(a))
          u=e.audit(pathlib.Path('.').resolve(),manifest,results,a); open('audit.json','w').write(e.dump(u))
          z=e.analyze(pathlib.Path('.').resolve(),manifest,a,u); open('analysis.json','w').write(e.dump(z))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: tier1-wave1-ordinal8-aggregate, path: aggregate.json}
      - uses: actions/upload-artifact@v4
        with: {name: tier1-wave1-ordinal8-audit, path: audit.json}
      - uses: actions/upload-artifact@v4
        with: {name: tier1-wave1-ordinal8-analysis, path: analysis.json}