name: Tier-1 precision continuation wave 1 v3 review contract
on:
  pull_request:
    paths:
      - '.github/workflows/tier1-precision-continuation-wave1-v3-contract.yml'
      - 'evidence/tier1-precision-continuation-wave1-v3/**'
      - 'experiments/tier1-precision-continuation-wave1-v3/**'
      - 'tests/test_tier1_precision_continuation_wave1_v3.py'
permissions:
  contents: read
jobs:
  review-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - name: Compile v3 review package
        run: python -m py_compile experiments/tier1-precision-continuation-wave1-v3/package.py experiments/tier1-precision-continuation-wave1-v3/duplicate_pages.py tests/test_tier1_precision_continuation_wave1_v3.py
      - name: Run focused v3 review tests
        run: python -m unittest discover -s tests -p 'test_tier1_precision_continuation_wave1_v3.py' -v
      - name: Generate deterministic review artifacts twice
        run: |
          python experiments/tier1-precision-continuation-wave1-v3/package.py --output-dir out/a
          python experiments/tier1-precision-continuation-wave1-v3/package.py --output-dir out/b
          diff -r out/a out/b
      - name: Prove closed preparation boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          prereg = json.loads(Path('out/a/preregistration.json').read_text())
          auth = json.loads(Path('out/a/authorization.template.json').read_text())
          packet = json.loads(Path('out/a/candidate-review.json').read_text())
          assert prereg['authorizationOrdinal'] is None
          assert prereg['authorizationRef'] is None
          assert prereg['executionKey'] is None
          assert prereg['authorizationEnabled'] is False
          assert prereg['dispatchEnabled'] is False
          assert prereg['scientificExecution'] is False
          assert auth['enabled'] is False
          assert auth['solverExecutionAuthorized'] is False
          assert packet['authorizationAllocated'] is False
          assert packet['dispatchEnabled'] is False
          assert packet['scientificExecution'] is False
          workflow = Path('.github/workflows/tier1-precision-continuation-wave1-v3-contract.yml').read_text()
          dispatch_token = 'workflow_' + 'dispatch'
          broken_cli_pair = '--slurp' + ' --jq'
          assert dispatch_token not in workflow
          assert broken_cli_pair not in workflow
          template = Path('experiments/tier1-precision-continuation-wave1-v3/execution-workflow.template.yml').read_text()
          assert 'uvspec' not in template
          PY
      - name: Run complete non-scientific repository suite
        run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: tier1-wave1-v3-candidate-ordinal9-review-only
          path: |
            out/a
            evidence/tier1-precision-continuation-wave1-v3/seed-plan.json
            evidence/tier1-precision-continuation-wave1-v3/ordinal9-duplicate-search-snapshot.json
            experiments/tier1-precision-continuation-wave1-v3/execution-workflow.template.yml
