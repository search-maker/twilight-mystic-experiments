name: Tier-1 precision continuation wave 3 authorization review v1

on:
  pull_request:
    paths:
      - ".github/workflows/tier1-precision-continuation-wave3-authorization-review-v1.yml"
      - "experiments/tier1-precision-continuation-wave3-v1/authorization_review.py"
      - "experiments/tier1-precision-continuation-wave3-v1/authorization.ordinal13.json"
      - "tests/test_tier1_precision_continuation_wave3_authorization_review_v1.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: tier1-wave3-authorization-review-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"

      - name: Prove reviewer performs zero scientific execution
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/tier1-precision-continuation-wave3-authorization-review-v1.yml')
          text = path.read_text(encoding='utf-8')
          forbidden = (
              'mamba-' + 'org/setup-micromamba',
              'command -v ' + 'uvspec',
              ' --allow-' + 'execution',
              'workflow_' + 'dispatch:',
              'schedule:',
              'repository_dispatch:',
          )
          found = [token for token in forbidden if token in text]
          if found:
              raise SystemExit(f'authorization reviewer exposed execution or alternate trigger: {found}')
          PY

      - name: Verify exact ordinal-12 terminal artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/artifacts/8954776553" > source-artifact.json
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('source-artifact.json').read_text())
          expected = {
              'id': 8954776553,
              'name': 'tier1-wave2-ordinal12-analysis',
              'expired': False,
              'digest': 'sha256:bd60e2ff433aa104ab84a4497310737d0b0d4695c8d454ad125d91f94efabe37',
          }
          stale = {key: (value.get(key), expected_value) for key, expected_value in expected.items() if value.get(key) != expected_value}
          run = value.get('workflow_run') or {}
          expected_run = {
              'id': 31065046524,
              'head_branch': 'dispatch/tier1-precision-continuation-wave2-ordinal12-v1',
              'head_sha': '18a5746778441d57b722c740a17c94af9b56e9c9',
          }
          stale_run = {key: (run.get(key), expected_value) for key, expected_value in expected_run.items() if run.get(key) != expected_value}
          if stale or stale_run:
              raise SystemExit(f'ordinal-12 source artifact changed: {stale} {stale_run}')
          PY

      - name: Download exact ordinal-12 terminal analysis
        uses: actions/download-artifact@v4
        with:
          name: tier1-wave2-ordinal12-analysis
          path: source-analysis
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31065046524

      - name: Capture complete repository-wide run history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method GET --paginate \
            "repos/${{ github.repository }}/actions/runs" \
            -f per_page=100 --slurp > run-pages.json
          python experiments/tier1-precision-continuation-wave1-v3/duplicate_pages.py \
            --pages run-pages.json \
            --output scientific-runs.json

      - id: identity
        name: Build dry or actual one-file authorization identity
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          AUTH_PATH=experiments/tier1-precision-continuation-wave3-v1/authorization.ordinal13.json
          AUTH_BRANCH=authorization/tier1-precision-continuation-wave3-ordinal13-v1
          DISPATCH_BRANCH=dispatch/tier1-precision-continuation-wave3-ordinal13-v1
          LIVE_MAIN="$(gh api "repos/${{ github.repository }}/branches/main" --jq .commit.sha)"
          if gh api "repos/${{ github.repository }}/branches/dispatch%2Ftier1-precision-continuation-wave3-ordinal13-v1" > dispatch-branch.json 2>/dev/null; then
            echo "ordinal-13 dispatch branch already exists" >&2
            exit 1
          fi
          if test -e "$AUTH_PATH"; then
            MODE=actual-authorization
            test "$PR_HEAD_BRANCH" = "$AUTH_BRANCH"
            mapfile -t PARENTS < <(git cat-file -p "$PR_HEAD_SHA" | sed -n 's/^parent //p')
            test "${#PARENTS[@]}" = 1
            AUTH_PARENT="${PARENTS[0]}"
            test "$AUTH_PARENT" = "$LIVE_MAIN"
            mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r "$PR_HEAD_SHA")
            test "${#CHANGED[@]}" = 1
            test "${CHANGED[0]}" = "$AUTH_PATH"
            AUTH_HEAD="$PR_HEAD_SHA"
            AUTHORIZATION_BRANCH_EXISTS=true
            cp "$AUTH_PATH" authorization.json
          else
            MODE=dry-review
            test "$PR_BASE_SHA" = "$LIVE_MAIN"
            if gh api "repos/${{ github.repository }}/branches/authorization%2Ftier1-precision-continuation-wave3-ordinal13-v1" > authorization-branch.json 2>/dev/null; then
              echo "ordinal-13 authorization branch already exists before dry review" >&2
              exit 1
            fi
            AUTH_PARENT="$LIVE_MAIN"
            AUTH_HEAD=2222222222222222222222222222222222222222
            AUTHORIZATION_BRANCH_EXISTS=false
            AUTH_PARENT="$AUTH_PARENT" python - <<'PY'
          import json
          import os
          from pathlib import Path
          value = {
              'schemaVersion': 1,
              'stageId': 'tier1-precision-continuation-wave3-authorization-v1',
              'status': 'AUTHORIZED_PENDING_SEPARATE_DISPATCH',
              'authorizationOrdinal': 13,
              'executionKey': 'twilight-surrogate-tier-1-v1:numerical:13',
              'runTitle': 'Tier-1 precision continuation wave 3 ordinal 13',
              'runAttempt': 1,
              'wave': 3,
              'blocks': [7, 8],
              'geometryCount': 15,
              'caseCount': 30,
              'enabled': True,
              'solverExecutionAuthorized': True,
              'automaticDispatch': False,
              'dispatch': False,
              'workflowDispatchEnabled': False,
              'triggerBranch': 'dispatch/tier1-precision-continuation-wave3-ordinal13-v1',
              'triggerEvent': 'push',
              'githubRerunAllowed': False,
              'surrogateTrainingAuthorized': False,
              'internalHoldoutOpeningAuthorized': False,
              'tier2Authorized': False,
              'productionPromotionAuthorized': False,
              'sourceRunId': 31065046524,
              'sourceRunAttempt': 1,
              'sourceMainSha': '0ef7e011e00a4c4badcafb2f6ca06256026b1746',
              'sourceAuthorizationRef': '18a5746778441d57b722c740a17c94af9b56e9c9',
              'sourceExecutionKey': 'twilight-surrogate-tier-1-v1:numerical:12',
              'sourceArtifactId': 8954776553,
              'sourceArtifactDigest': 'sha256:bd60e2ff433aa104ab84a4497310737d0b0d4695c8d454ad125d91f94efabe37',
              'preregistrationSha256': '5f3664c3d4a4f6455bbf1996a492d658bcb9216989d99adeca5f92ece2ee6352',
              'sourceAnalysisRawSha256': 'c18f9ca23c910924400360ca18c4186d30594bc1aa2d3dd07a43a6031b274237',
              'sourceAnalysisSha256': '8e87fd440d15233dc66543a9ca011535a857b12b5602fd506f6466a900bfafc2',
              'executionSourceHeadSha': os.environ['AUTH_PARENT'],
          }
          Path('authorization.json').write_text(json.dumps(value, indent=2, sort_keys=True) + '\n')
          PY
          fi
          MODE="$MODE" AUTH_HEAD="$AUTH_HEAD" AUTH_PARENT="$AUTH_PARENT" LIVE_MAIN="$LIVE_MAIN" AUTHORIZATION_BRANCH_EXISTS="$AUTHORIZATION_BRANCH_EXISTS" python - <<'PY'
          import json
          import os
          from pathlib import Path
          value = {
              'mode': os.environ['MODE'],
              'authorizationBranch': 'authorization/tier1-precision-continuation-wave3-ordinal13-v1',
              'authorizationBranchExists': os.environ['AUTHORIZATION_BRANCH_EXISTS'] == 'true',
              'authorizationHead': os.environ['AUTH_HEAD'],
              'authorizationParent': os.environ['AUTH_PARENT'],
              'liveMain': os.environ['LIVE_MAIN'],
              'parentCount': 1,
              'changedFiles': ['experiments/tier1-precision-continuation-wave3-v1/authorization.ordinal13.json'],
              'dispatchBranchExists': False,
          }
          Path('commit-metadata.json').write_text(json.dumps(value, indent=2, sort_keys=True) + '\n')
          PY
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Run authorization reviewer and inherited exact-source tests
        run: |
          python -m unittest -v \
            tests/test_tier1_precision_continuation_wave3_authorization_review_v1.py \
            tests/test_tier1_precision_continuation_wave3_terminal_binding_v1.py \
            tests/test_tier1_precision_continuation_wave3_trigger_v1.py
          python -m py_compile \
            experiments/tier1-precision-continuation-wave3-v1/authorization_review.py \
            tests/test_tier1_precision_continuation_wave3_authorization_review_v1.py
          python experiments/tier1-precision-continuation-wave3-v1/authorization_review.py \
            --root . \
            --mode '${{ steps.identity.outputs.mode }}' \
            --authorization authorization.json \
            --source-analysis source-analysis/analysis.json \
            --source-artifact-metadata source-artifact.json \
            --scientific-runs scientific-runs.json \
            --commit-metadata commit-metadata.json \
            --output review/authorization-review.json

      - name: Seal review inputs
        run: |
          cp authorization.json review/authorization.json
          cp commit-metadata.json review/commit-metadata.json
          cp source-artifact.json review/source-artifact.json
          cp scientific-runs.json review/scientific-runs.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          report = json.loads(Path('review/authorization-review.json').read_text())
          seal = report.pop('reportSha256')
          observed = hashlib.sha256(json.dumps(report, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          if seal != observed:
              raise SystemExit('authorization review report self-hash changed')
          report['reportSha256'] = seal
          inputs = {
              name: hashlib.sha256(Path(name).read_bytes()).hexdigest()
              for name in ('authorization.json', 'commit-metadata.json', 'source-artifact.json', 'scientific-runs.json')
          }
          Path('review/input-hashes.json').write_text(json.dumps(inputs, indent=2, sort_keys=True) + '\n')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: tier1-precision-continuation-wave3-authorization-review-v1
          path: review
          if-no-files-found: error
          retention-days: 90
