name: Tier-1 precision continuation wave 3 execution v1 contract

on:
  pull_request:
    paths:
      - ".github/workflows/tier1-precision-continuation-wave3-execution-v1-contract.yml"
      - "experiments/tier1-precision-continuation-wave3-v1/execution.py"
      - "experiments/tier1-precision-continuation-wave3-v1/execution_adapter.py"
      - "experiments/tier1-precision-continuation-wave3-v1/case_executor.py"
      - "experiments/tier1-precision-continuation-wave3-v1/matrix_output.py"
      - "experiments/tier1-precision-continuation-wave3-v1/postprocess.py"
      - "experiments/tier1-precision-continuation-wave3-v1/package.py"
      - "tests/test_tier1_precision_continuation_wave3_execution_v1.py"
      - "tests/test_tier1_precision_continuation_wave3_integration_v1.py"
      - "tests/test_tier1_precision_continuation_wave3_v1.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: tier1-precision-continuation-wave3-execution-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"

      - name: Prove disabled dynamic execution boundary
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          test ! -e experiments/tier1-precision-continuation-wave3-v1/authorization.ordinal13.json
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/tier1-precision-continuation-wave3-execution-v1-contract.yml').read_text(encoding='utf-8')
          forbidden = (
              'workflow_' + 'dispatch:',
              'mamba-' + 'org/setup-micromamba',
              'uv' + 'spec',
              '--allow-' + 'execution',
              'productionPromotionAuthorized' + ': true',
              'tier2Authorized' + ': true',
          )
          found = [token for token in forbidden if token in workflow]
          if found:
              raise SystemExit(f'wave-three contract exposed forbidden execution surface: {found}')
          PY

      - name: Run dynamic execution and preparation tests
        run: |
          python -m unittest -v \
            tests/test_tier1_precision_continuation_wave3_execution_v1.py \
            tests/test_tier1_precision_continuation_wave3_v1.py \
            tests/test_tier1_precision_continuation_wave2_execution_v1.py \
            tests/test_tier1_precision_continuation_wave2_v1.py \
            tests/test_tier1_precision_continuation_v2.py

      - name: Compile dynamic execution package
        run: |
          python -m py_compile \
            experiments/tier1-precision-continuation-wave3-v1/package.py \
            experiments/tier1-precision-continuation-wave3-v1/execution.py \
            experiments/tier1-precision-continuation-wave3-v1/execution_adapter.py \
            experiments/tier1-precision-continuation-wave3-v1/case_executor.py \
            experiments/tier1-precision-continuation-wave3-v1/matrix_output.py \
            experiments/tier1-precision-continuation-wave3-v1/postprocess.py \
            tests/test_tier1_precision_continuation_wave3_execution_v1.py \
            tests/test_tier1_precision_continuation_wave3_integration_v1.py

      - name: Download exact merged-main wave-one salvage
        uses: actions/download-artifact@v4
        with:
          name: tier1-wave1-ordinal11-postprocess-salvage
          path: source-salvage
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31063167217

      - name: Run actual-source three-wave integration test
        env:
          WAVE3_SOURCE_SALVAGE_ROOT: ${{ github.workspace }}/source-salvage
        run: |
          python -m unittest -v \
            tests.test_tier1_precision_continuation_wave3_integration_v1

      - name: Produce sealed dynamic execution review
        run: |
          python - <<'PY'
          import hashlib
          import json
          import tempfile
          from pathlib import Path
          from tests.test_tier1_precision_continuation_wave3_execution_v1 import Wave3ExecutionV1Tests

          root = Path.cwd()
          Wave3ExecutionV1Tests.setUpClass()
          helper = Wave3ExecutionV1Tests()
          review = root / 'review'
          review.mkdir()
          with tempfile.TemporaryDirectory() as raw:
              work = Path(raw)
              source, prereg, manifest = helper.manifest(work)
              results = helper.fake_results(manifest)
              aggregate = helper.postprocess.aggregate_wave3(prereg, results, root)
              audit = helper.postprocess.audit_wave3(prereg, results, aggregate, root)
              matrix = json.loads(helper.matrix.matrix_value(manifest))
              outputs = {
                  'synthetic-source-analysis.json': json.loads(source.read_text()),
                  'synthetic-preregistration.json': prereg,
                  'synthetic-manifest.json': manifest,
                  'synthetic-matrix.json': matrix,
                  'synthetic-aggregate.json': aggregate,
                  'synthetic-audit.json': audit,
              }
              hashes = {}
              for name, value in outputs.items():
                  path = review / name
                  path.write_text(json.dumps(value, indent=2, sort_keys=True) + '\n')
                  hashes[name] = hashlib.sha256(path.read_bytes()).hexdigest()
              report = {
                  'schemaVersion': 1,
                  'stageId': 'tier1-precision-continuation-wave3-execution-v1-contract-review',
                  'status': 'DYNAMIC_WAVE3_EXECUTION_CONTRACT_PASSED_NOT_AUTHORIZED',
                  'headSha': '${{ github.event.pull_request.head.sha }}',
                  'runId': ${{ github.run_id }},
                  'runAttempt': ${{ github.run_attempt }},
                  'candidateOrdinal': 13,
                  'candidateExecutionKey': 'twilight-surrogate-tier-1-v1:numerical:13',
                  'geometryCount': manifest['geometryCount'],
                  'caseCount': manifest['caseCount'],
                  'blocks': [7, 8],
                  'actualWave1ThreeWaveIntegrationCovered': True,
                  'generatedHashes': hashes,
                  'authorizationAllocated': False,
                  'dispatchEnabled': False,
                  'scientificSolverExecutions': 0,
                  'githubRerunAllowed': False,
                  'surrogateTrainingAuthorized': False,
                  'internalHoldoutOpened': False,
                  'tier2Authorized': False,
                  'productionPromotionAuthorized': False,
              }
              report['reportSha256'] = hashlib.sha256(json.dumps(report, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
              (review / 'review-report.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: tier1-precision-continuation-wave3-execution-v1-contract
          path: review
          if-no-files-found: error
          retention-days: 90
