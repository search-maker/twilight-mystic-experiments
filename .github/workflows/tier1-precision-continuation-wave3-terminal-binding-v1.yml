name: Tier-1 precision continuation wave 3 terminal binding v1

on:
  pull_request:
    paths:
      - ".github/workflows/tier1-precision-continuation-wave3-terminal-binding-v1.yml"
      - "experiments/tier1-precision-continuation-wave3-v1/**"
      - "tests/test_tier1_precision_continuation_wave3_terminal_binding_v1.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: tier1-wave3-terminal-binding-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terminal-binding:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"

      - name: Prove preparation-only boundary
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          test ! -e experiments/tier1-precision-continuation-wave3-v1/authorization.ordinal13.json
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path('experiments/tier1-precision-continuation-wave3-v1/terminal_binding.py'),
              Path('experiments/tier1-precision-continuation-wave3-v1/terminal_package.py'),
              Path('tests/test_tier1_precision_continuation_wave3_terminal_binding_v1.py'),
          ]
          text = '\n'.join(path.read_text(encoding='utf-8') for path in paths)
          forbidden = (
              'workflow_' + 'dispatch', 'uv' + 'spec',
              'solverExecutionAuthorized' + ': true',
              'dispatchEnabled' + ': true',
              'surrogateTrainingAuthorized' + ': true',
              'internalHoldoutOpeningAuthorized' + ': true',
              'productionPromotionAuthorized' + ': true',
          )
          found = [token for token in forbidden if token in text]
          if found:
              raise SystemExit(f'terminal binding exposed forbidden surface: {found}')
          PY

      - name: Verify exact ordinal-12 analysis artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/artifacts/8954776553" > source-artifact.json
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('source-artifact.json').read_text())
          expected = {
              'id': 8954776553,
              'name': 'tier1-wave2-ordinal12-analysis',
              'expired': False,
              'digest': 'sha256:bd60e2ff433aa104ab84a4497310737d0b0d4695c8d454ad125d91f94efabe37',
          }
          stale = {key: (value.get(key), expected_value) for key, expected_value in expected.items() if value.get(key) != expected_value}
          if stale:
              raise SystemExit(f'ordinal-12 analysis artifact metadata changed: {stale}')
          run = value.get('workflow_run') or {}
          expected_run = {
              'id': 31065046524,
              'head_branch': 'dispatch/tier1-precision-continuation-wave2-ordinal12-v1',
              'head_sha': '18a5746778441d57b722c740a17c94af9b56e9c9',
          }
          stale_run = {key: (run.get(key), expected_value) for key, expected_value in expected_run.items() if run.get(key) != expected_value}
          if stale_run:
              raise SystemExit(f'ordinal-12 source run binding changed: {stale_run}')
          PY

      - name: Download exact ordinal-12 terminal analysis
        uses: actions/download-artifact@v4
        with:
          name: tier1-wave2-ordinal12-analysis
          path: source-analysis
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31065046524

      - name: Validate exact terminal source and generate b7-b8 preregistration
        run: |
          python experiments/tier1-precision-continuation-wave3-v1/terminal_binding.py \
            --source-analysis source-analysis/analysis.json \
            --output review/terminal-source-binding.json
          python experiments/tier1-precision-continuation-wave3-v1/terminal_package.py \
            --source-analysis source-analysis/analysis.json \
            --output-dir review/generated
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          binding = json.loads(Path('review/terminal-source-binding.json').read_text())
          prereg = json.loads(Path('review/generated/preregistration.json').read_text())
          expected_ids = [
              'train-0003', 'train-0007', 'train-0011', 'train-0013', 'train-0015',
              'train-0019', 'train-0023', 'train-0027', 'train-0029', 'train-0031',
              'train-0035', 'train-0039', 'train-0041', 'train-0043', 'train-0047',
          ]
          if binding.get('status') != 'ORDINAL12_TERMINAL_SOURCE_EXACTLY_BOUND':
              raise SystemExit('terminal source binding did not pass')
          if prereg.get('geometryIds') != expected_ids or prereg.get('geometryCount') != 15 or prereg.get('caseCount') != 30:
              raise SystemExit('terminal wave-three scope changed')
          if prereg.get('blocks') != [7, 8] or len(prereg.get('cases', [])) != 30:
              raise SystemExit('terminal wave-three cases changed')
          seeds = [case['seed'] for case in prereg['cases']]
          if len(set(seeds)) != 30 or prereg.get('seedProof', {}).get('consumedOverlap') != []:
              raise SystemExit('wave-three seed proof changed')
          if prereg.get('terminalSourceArtifactId') != 8954776553:
              raise SystemExit('terminal artifact binding changed')
          report = {
              'schemaVersion': 1,
              'stageId': 'tier1-precision-continuation-wave3-terminal-binding-contract-v1',
              'status': 'EXACT_ORDINAL12_TERMINAL_SOURCE_AND_30_CASE_WAVE3_SCOPE_PASSED',
              'headSha': '${{ github.event.pull_request.head.sha }}',
              'runId': ${{ github.run_id }},
              'runAttempt': ${{ github.run_attempt }},
              'sourceArtifactId': 8954776553,
              'sourceArtifactDigest': 'sha256:bd60e2ff433aa104ab84a4497310737d0b0d4695c8d454ad125d91f94efabe37',
              'sourceAnalysisRawSha256': hashlib.sha256(Path('source-analysis/analysis.json').read_bytes()).hexdigest(),
              'sourceAnalysisSha256': binding['sourceAnalysisSha256'],
              'geometryIds': expected_ids,
              'geometryCount': 15,
              'caseCount': 30,
              'wave3SeedsSha256': prereg['seedProof']['wave3SeedsSha256'],
              'authorizationAllocated': False,
              'dispatchEnabled': False,
              'scientificExecution': False,
              'surrogateTrainingAuthorized': False,
              'internalHoldoutOpeningAuthorized': False,
              'tier2Authorized': False,
              'productionPromotionAuthorized': False,
          }
          report['reportSha256'] = hashlib.sha256(json.dumps(report, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          Path('review/contract-review.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          PY

      - name: Run terminal binding and inherited wave-three tests
        run: |
          python -m unittest -v \
            tests/test_tier1_precision_continuation_wave3_terminal_binding_v1.py \
            tests/test_tier1_precision_continuation_wave3_v1.py \
            tests/test_tier1_precision_continuation_wave2_v1.py \
            tests/test_tier1_precision_continuation_wave2_execution_v1.py
          python -m py_compile \
            experiments/tier1-precision-continuation-wave3-v1/terminal_binding.py \
            experiments/tier1-precision-continuation-wave3-v1/terminal_package.py \
            tests/test_tier1_precision_continuation_wave3_terminal_binding_v1.py

      - uses: actions/upload-artifact@v4
        with:
          name: tier1-precision-continuation-wave3-terminal-binding-v1-contract
          path: review
          if-no-files-found: error
          retention-days: 90
