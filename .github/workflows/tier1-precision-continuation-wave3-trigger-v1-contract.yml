name: Tier-1 precision continuation wave 3 trigger v1 contract

on:
  pull_request:
    paths:
      - ".github/workflows/tier1-precision-continuation-wave3-trigger-v1-contract.yml"
      - ".github/workflows/tier1-precision-continuation-wave3-ordinal13-execution.yml"
      - "experiments/tier1-precision-continuation-wave3-v1/terminal_binding.py"
      - "experiments/tier1-precision-continuation-wave3-v1/terminal_trigger_execution.py"
      - "experiments/tier1-precision-continuation-wave3-v1/trigger_execution.py"
      - "experiments/tier1-precision-continuation-wave3-v1/trigger_case_executor.py"
      - "tests/test_tier1_precision_continuation_wave3_trigger_v1.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: tier1-wave3-trigger-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"

      - name: Prove review-only transport and push-only scientific workflow
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          test ! -e experiments/tier1-precision-continuation-wave3-v1/authorization.ordinal13.json
          python - <<'PY'
          from pathlib import Path
          scientific = Path('.github/workflows/tier1-precision-continuation-wave3-ordinal13-execution.yml').read_text(encoding='utf-8')
          contract = Path('.github/workflows/tier1-precision-continuation-wave3-trigger-v1-contract.yml').read_text(encoding='utf-8')
          required = (
              'run-name: Tier-1 precision continuation wave 3 ordinal 13',
              'push:',
              'dispatch/tier1-precision-continuation-wave3-ordinal13-v1',
              'terminal_trigger_execution.py manifest',
              'trigger_case_executor.py',
              '--allow-execution',
              'githubRerunAllowed',
          )
          missing = [token for token in required if token not in scientific]
          if missing:
              raise SystemExit(f'scientific push transport incomplete: {missing}')
          forbidden_scientific = ('workflow_' + 'dispatch:', 'pull_request:', 'schedule:', 'repository_dispatch:')
          found = [token for token in forbidden_scientific if token in scientific]
          if found:
              raise SystemExit(f'scientific workflow exposed an alternate trigger: {found}')
          forbidden_contract = (
              'mamba-' + 'org/setup-micromamba',
              '--allow-' + 'execution',
              'uv' + 'spec',
              'authorization.ordinal13.json' + "' >",
          )
          found = [token for token in forbidden_contract if token in contract]
          if found:
              raise SystemExit(f'contract workflow exposed scientific execution: {found}')
          PY

      - name: Verify exact ordinal-12 terminal artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/artifacts/8954776553" > source-artifact.json
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('source-artifact.json').read_text())
          expected = {
              'id': 8954776553,
              'name': 'tier1-wave2-ordinal12-analysis',
              'expired': False,
              'digest': 'sha256:bd60e2ff433aa104ab84a4497310737d0b0d4695c8d454ad125d91f94efabe37',
          }
          stale = {key: (value.get(key), expected_value) for key, expected_value in expected.items() if value.get(key) != expected_value}
          run = value.get('workflow_run') or {}
          expected_run = {
              'id': 31065046524,
              'head_branch': 'dispatch/tier1-precision-continuation-wave2-ordinal12-v1',
              'head_sha': '18a5746778441d57b722c740a17c94af9b56e9c9',
          }
          stale_run = {key: (run.get(key), expected_value) for key, expected_value in expected_run.items() if run.get(key) != expected_value}
          if stale or stale_run:
              raise SystemExit(f'terminal source metadata changed: {stale} {stale_run}')
          PY

      - name: Download exact ordinal-12 terminal analysis
        uses: actions/download-artifact@v4
        with:
          name: tier1-wave2-ordinal12-analysis
          path: source-analysis
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31065046524

      - name: Capture scientific workflow history and refuse allocated identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method GET --paginate \
            "repos/${{ github.repository }}/actions/workflows/tier1-precision-continuation-wave3-ordinal13-execution.yml/runs" \
            -f per_page=100 --slurp > scientific-run-pages.json
          python experiments/tier1-precision-continuation-wave1-v3/duplicate_pages.py \
            --pages scientific-run-pages.json \
            --output scientific-runs.json
          python - <<'PY'
          import json
          from pathlib import Path
          rows = json.loads(Path('scientific-runs.json').read_text())
          title = 'Tier-1 precision continuation wave 3 ordinal 13'
          duplicates = [row for row in rows if row.get('display_title') == title]
          if duplicates:
              raise SystemExit(f'ordinal-13 title already allocated: {[row.get("id") for row in duplicates]}')
          PY

      - name: Run trigger, terminal-binding, and inherited execution tests
        run: |
          python -m unittest -v \
            tests/test_tier1_precision_continuation_wave3_trigger_v1.py \
            tests/test_tier1_precision_continuation_wave3_terminal_binding_v1.py \
            tests/test_tier1_precision_continuation_wave3_execution_v1.py \
            tests/test_tier1_precision_continuation_wave3_integration_v1.py \
            tests/test_tier1_precision_continuation_wave3_v1.py \
            tests/test_tier1_precision_continuation_wave2_execution_v1.py \
            tests/test_tier1_precision_continuation_wave2_v1.py
          python -m py_compile \
            experiments/tier1-precision-continuation-wave3-v1/terminal_binding.py \
            experiments/tier1-precision-continuation-wave3-v1/terminal_trigger_execution.py \
            experiments/tier1-precision-continuation-wave3-v1/trigger_execution.py \
            experiments/tier1-precision-continuation-wave3-v1/trigger_case_executor.py \
            tests/test_tier1_precision_continuation_wave3_trigger_v1.py

      - name: Build sealed exact-source dry manifest with zero solver execution
        run: |
          python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          def load(path, name):
              spec = importlib.util.spec_from_file_location(name, path)
              if spec is None or spec.loader is None:
                  raise RuntimeError(path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module

          root = Path.cwd()
          directory = root / 'experiments/tier1-precision-continuation-wave3-v1'
          guard = load(directory / 'terminal_trigger_execution.py', 'wave3_trigger_contract_guard')
          package = load(directory / 'package.py', 'wave3_trigger_contract_package')
          binding = load(directory / 'terminal_binding.py', 'wave3_trigger_contract_binding')
          source = root / 'source-analysis/analysis.json'
          source_value = package.load_json(source)
          prereg = package.build_preregistration(source_value, source, root)
          expected_ids = list(binding.ACTIVE_GEOMETRY_IDS)
          if prereg.get('geometryIds') != expected_ids or prereg.get('caseCount') != 30:
              raise SystemExit('real terminal source did not generate exact 30-case scope')
          head = '1' * 40
          authorization_ref = '2' * 40
          context = {
              'eventName': 'push',
              'triggerBranch': 'dispatch/tier1-precision-continuation-wave3-ordinal13-v1',
              'runAttempt': 1,
              'displayTitle': 'Tier-1 precision continuation wave 3 ordinal 13',
              'authorizationOrdinal': 13,
              'executionKey': 'twilight-surrogate-tier-1-v1:numerical:13',
              'headBranch': 'main',
              'headSha': head,
              'authorizationRef': authorization_ref,
              'runId': 717171,
          }
          authorization = {
              'schemaVersion': 1,
              'stageId': 'tier1-precision-continuation-wave3-authorization-v1',
              'status': 'AUTHORIZED_PENDING_SEPARATE_DISPATCH',
              'authorizationOrdinal': 13,
              'executionKey': 'twilight-surrogate-tier-1-v1:numerical:13',
              'runTitle': 'Tier-1 precision continuation wave 3 ordinal 13',
              'runAttempt': 1,
              'wave': 3,
              'blocks': [7, 8],
              'geometryCount': 15,
              'caseCount': 30,
              'enabled': True,
              'solverExecutionAuthorized': True,
              'automaticDispatch': False,
              'dispatch': False,
              'workflowDispatchEnabled': False,
              'triggerBranch': 'dispatch/tier1-precision-continuation-wave3-ordinal13-v1',
              'triggerEvent': 'push',
              'githubRerunAllowed': False,
              'surrogateTrainingAuthorized': False,
              'internalHoldoutOpeningAuthorized': False,
              'tier2Authorized': False,
              'productionPromotionAuthorized': False,
              'sourceRunId': 31065046524,
              'sourceRunAttempt': 1,
              'sourceMainSha': '0ef7e011e00a4c4badcafb2f6ca06256026b1746',
              'sourceAuthorizationRef': '18a5746778441d57b722c740a17c94af9b56e9c9',
              'sourceExecutionKey': 'twilight-surrogate-tier-1-v1:numerical:12',
              'sourceArtifactId': 8954776553,
              'sourceArtifactDigest': 'sha256:bd60e2ff433aa104ab84a4497310737d0b0d4695c8d454ad125d91f94efabe37',
              'preregistrationSha256': prereg['preregistrationSha256'],
              'sourceAnalysisRawSha256': prereg['sourceAnalysisRawSha256'],
              'sourceAnalysisSha256': prereg['sourceAnalysisSha256'],
              'executionSourceHeadSha': head,
          }
          metadata = {
              'authorizationCommit': authorization_ref,
              'authorizationParent': head,
              'changedFiles': ['experiments/tier1-precision-continuation-wave3-v1/authorization.ordinal13.json'],
              'parentCount': 1,
          }
          runtime = {
              'uvspecSha256': '3' * 64,
              'uvspecHelpSha256': '4' * 64,
              'libRadtranDataTreeSha256': '5' * 64,
              'atmosphereSha256': '6' * 64,
              'runtimeLockRawSha256': '7' * 64,
          }
          rows = json.loads(Path('scientific-runs.json').read_text())
          rows.append({
              'id': 717171,
              'display_title': context['displayTitle'],
              'status': 'in_progress',
              'conclusion': None,
              'event': 'push',
              'run_attempt': 1,
              'head_sha': authorization_ref,
              'head_branch': context['triggerBranch'],
          })
          manifest = guard.build_manifest(
              root, authorization, context, rows, runtime, metadata, source
          )
          guard.validate_terminal_manifest(manifest, root=root)
          if manifest.get('geometryIds') != expected_ids or manifest.get('caseCount') != 30:
              raise SystemExit('dry manifest terminal scope changed')
          if manifest.get('duplicateRunAudit', {}).get('priorMatchingRuns') != []:
              raise SystemExit('dry manifest duplicate audit changed')
          review = Path('review')
          review.mkdir()
          (review / 'terminal-source-binding.json').write_text(
              json.dumps(binding.validate_path(source), indent=2, sort_keys=True) + '\n'
          )
          (review / 'dry-authorization.json').write_text(json.dumps(authorization, indent=2, sort_keys=True) + '\n')
          (review / 'dry-manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          report = {
              'schemaVersion': 1,
              'stageId': 'tier1-precision-continuation-wave3-trigger-v1-contract-review',
              'status': 'EXACT_TERMINAL_BOUND_ORDINAL13_PUSH_TRANSPORT_CONTRACT_PASSED',
              'headSha': '${{ github.event.pull_request.head.sha }}',
              'runId': ${{ github.run_id }},
              'runAttempt': ${{ github.run_attempt }},
              'sourceArtifactId': 8954776553,
              'sourceAnalysisRawSha256': binding.SOURCE_ANALYSIS_RAW_SHA256,
              'sourceAnalysisSha256': binding.SOURCE_ANALYSIS_SHA256,
              'geometryIds': expected_ids,
              'geometryCount': 15,
              'caseCount': 30,
              'blocks': [7, 8],
              'wave3SeedsSha256': manifest['seedProof']['wave3SeedsSha256'],
              'candidateOrdinal': 13,
              'candidateExecutionKey': context['executionKey'],
              'candidateRunTitle': context['displayTitle'],
              'candidateTriggerBranch': context['triggerBranch'],
              'authorizationAllocated': False,
              'dispatchBranchCreated': False,
              'scientificSolverExecutions': 0,
              'githubRerunAllowed': False,
              'surrogateTrainingAuthorized': False,
              'internalHoldoutOpened': False,
              'tier2Authorized': False,
              'productionPromotionAuthorized': False,
          }
          base = guard._modules(root)[1]._base(root)
          report['reportSha256'] = base.canonical_sha256(report)
          (review / 'contract-review.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: tier1-precision-continuation-wave3-trigger-v1-contract
          path: review
          if-no-files-found: error
          retention-days: 90
