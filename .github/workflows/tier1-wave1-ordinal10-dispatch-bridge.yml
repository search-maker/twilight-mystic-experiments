name: One-time Tier-1 wave-1 ordinal-10 dispatch bridge
on:
  pull_request:
    types: [opened]
    paths:
      - '.github/workflows/tier1-wave1-ordinal10-dispatch-bridge.yml'
permissions:
  contents: read
  actions: write
concurrency:
  group: tier1-wave1-ordinal10-dispatch-bridge
  cancel-in-progress: false
jobs:
  dispatch-once:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Prove exact bridge shape and immutable sources
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_ACTION: ${{ github.event.action }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          test "$EVENT_ACTION" = opened
          test "$BASE_REF" = main
          test "$BASE_SHA" = 465c1734076af0e047bca422f281d9efba26a249
          test "$HEAD_REF" = dispatch/tier1-wave1-ordinal10-once
          test "$HEAD_REPO" = "$REPO"
          test "$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)" = "$BASE_SHA"
          mapfile -t CHANGED < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          test "${#CHANGED[@]}" = 1
          test "${CHANGED[0]}" = .github/workflows/tier1-wave1-ordinal10-dispatch-bridge.yml
          AUTH_REF=eb11263a66d8e0d7ff3a0d0b923674d18e904ea4
          test "$(gh api "repos/$REPO/commits/$AUTH_REF" --jq '.parents | length')" = 1
          test "$(gh api "repos/$REPO/commits/$AUTH_REF" --jq '.parents[0].sha')" = "$BASE_SHA"
          test "$(gh api "repos/$REPO/commits/$AUTH_REF" --jq '.files | length')" = 1
          test "$(gh api "repos/$REPO/commits/$AUTH_REF" --jq '.files[0].filename')" = experiments/tier1-precision-continuation-wave1-v4/authorization.ordinal10.json
          gh api "repos/$REPO/contents/experiments/tier1-precision-continuation-wave1-v4/authorization.ordinal10.json?ref=$AUTH_REF" --jq .content | tr -d '\n' | base64 -d > authorization.json
          python - <<'PY'
          import json
          value=json.load(open('authorization.json'))
          expected={
            'schemaVersion':1,
            'stageId':'tier1-precision-continuation-wave1-authorization-v4',
            'status':'AUTHORIZED_PENDING_SEPARATE_DISPATCH',
            'preregistrationSha256':'72331ddcdfbd04ddc5b08b145181231642c608124fc02b9cf24d7778cdaed140',
            'executionSourceHeadSha':'465c1734076af0e047bca422f281d9efba26a249',
            'authorizationOrdinal':10,
            'executionKey':'twilight-surrogate-tier-1-v1:numerical:10',
            'runTitle':'Tier-1 precision continuation wave 1 ordinal 10',
            'runAttempt':1,
            'caseCount':40,
            'geometryCount':20,
            'blocks':[3,4],
            'maximumConfiguredPhotonHistories':5100000000,
            'orderedSeedsSha256':'a297c3118eacc03b35684c92f2530dd1c185996b78e1043e57580c6a3583c0af',
            'enabled':True,
            'solverExecutionAuthorized':True,
            'automaticDispatch':False,
            'dispatch':False,
            'workflowDispatchEnabled':False,
            'githubRerunAllowed':False,
            'surrogateTrainingAuthorized':False,
            'internalHoldoutOpeningAuthorized':False,
            'tier2Authorized':False,
            'productionPromotionAuthorized':False,
          }
          stale={k:(value.get(k),v) for k,v in expected.items() if value.get(k)!=v}
          if stale: raise SystemExit(f'authorization mismatch: {stale}')
          PY
      - name: Refuse any prior ordinal-10 scientific run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --method GET --paginate "repos/$REPO/actions/workflows/tier1-precision-continuation-wave1-ordinal10-execution.yml/runs" -f per_page=100 --slurp > before-pages.json
          python - <<'PY'
          import json
          pages=json.load(open('before-pages.json'))
          rows=[r for p in pages for r in p.get('workflow_runs',[])]
          if rows: raise SystemExit(f'ordinal-10 workflow already has {len(rows)} run(s)')
          PY
      - name: Dispatch exact ordinal-10 workflow once
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api --method POST "repos/$REPO/actions/workflows/tier1-precision-continuation-wave1-ordinal10-execution.yml/dispatches" \
            -f ref=main \
            -f 'inputs[authorization_ref]=eb11263a66d8e0d7ff3a0d0b923674d18e904ea4' \
            -f 'inputs[authorization_ordinal]=10' \
            -f 'inputs[execution_key]=twilight-surrogate-tier-1-v1:numerical:10'
      - name: Verify exactly one attempt-1 run appeared
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            gh api --method GET --paginate "repos/$REPO/actions/workflows/tier1-precision-continuation-wave1-ordinal10-execution.yml/runs" -f per_page=100 --slurp > after-pages.json
            COUNT=$(python - <<'PY'
          import json
          pages=json.load(open('after-pages.json'))
          print(sum(len(p.get('workflow_runs',[])) for p in pages))
          PY
            )
            if [ "$COUNT" = 1 ]; then break; fi
            test "$COUNT" = 0
            sleep 2
          done
          python - <<'PY'
          import json
          pages=json.load(open('after-pages.json'))
          rows=[r for p in pages for r in p.get('workflow_runs',[])]
          if len(rows)!=1: raise SystemExit(f'expected one run, found {len(rows)}')
          run=rows[0]
          expected={
            'event':'workflow_dispatch',
            'run_attempt':1,
            'head_branch':'main',
            'head_sha':'465c1734076af0e047bca422f281d9efba26a249',
            'display_title':'Tier-1 precision continuation wave 1 ordinal 10',
          }
          stale={k:(run.get(k),v) for k,v in expected.items() if run.get(k)!=v}
          if stale: raise SystemExit(f'run identity mismatch: {stale}')
          report={
            'status':'EXACTLY_ONE_ORDINAL10_RUN_DISPATCHED',
            'runId':run['id'],
            'runAttempt':run['run_attempt'],
            'event':run['event'],
            'headBranch':run['head_branch'],
            'headSha':run['head_sha'],
            'authorizationRef':'eb11263a66d8e0d7ff3a0d0b923674d18e904ea4',
            'authorizationOrdinal':10,
            'executionKey':'twilight-surrogate-tier-1-v1:numerical:10',
            'githubRerunAllowed':False,
          }
          open('dispatch-report.json','w').write(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tier1-wave1-ordinal10-one-time-dispatch-report
          path: |
            authorization.json
            before-pages.json
            after-pages.json
            dispatch-report.json
