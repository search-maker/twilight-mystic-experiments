name: Tier2 v1 core campaign contract v1 review
run-name: Tier2 v1 core campaign contract v1 review

on:
  pull_request:
    paths:
      - review/tier2-core-campaign-contract-v1/tier2-core-campaign-contract-v1.json
      - review/tier2-core-campaign-contract-v1/validate_tier2_core_campaign_contract_v1.py
      - review/tier2-core-campaign-contract-v1/test_tier2_core_campaign_contract_v1.py
      - review/tier2-core-campaign-contract-v1/test_workflow_surface_v1.py
      - .github/workflows/tier2-core-campaign-contract-v1-review.yml

permissions:
  contents: read

jobs:
  review:
    if: github.head_ref == 'review/tier2-core-campaign-contract-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'

      - name: Refuse wrong review context or execution surface
        env:
          EXPECTED_BASE_SHA: 23583f702a00b5317c10f2254564685f416a5e84
          ACTUAL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_HEAD_REF" = review/tier2-core-campaign-contract-v1
          test "$GITHUB_BASE_REF" = main
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$ACTUAL_BASE_SHA" = "$EXPECTED_BASE_SHA"
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/tier2-core-campaign-contract-v1-review.yml').read_text(encoding='utf-8').lower()
          forbidden=('workflow_'+'dispatch','uv'+'spec','librad'+'tran','mc_'+'vroom','mc_'+'spectral_is','--allow-'+'execution','upload-'+'artifact')
          found=[x for x in forbidden if x in text]
          if found: raise SystemExit(f'forbidden execution surface: {found}')
          PY

      - name: Bind merged Level-B decision and deterministic source files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('review/level-b-v1-domain-scope-decision-v1/level-b-v1-domain-scope-decision-v1.json')
          d=json.loads(p.read_text())
          assert d['decisionId']=='public-level-b-v1-domain-scope-decision-v1'
          assert d['decisionSha256']=='c2e91a8ca7b17fa65075652920e3b120800dc8a9206aa4c013006b9cdad68b18'
          assert d['decisionSemantics']['newScientificExecutionAuthorized'] is False
          assert d['decisionSemantics']['ordinal19Allocated'] is False
          assert d['frozenScope']['intendedPhysicalDesignBox']['solarDepressionDeg']=={'minInclusive':2.0,'maxInclusive':10.5}
          assert d['frozenScope']['protectedHoldoutPolicy']['protectedHoldoutGeometryCount']==6
          assert d['nextBoundary']['artifactPipelineReplayRequiredBeforeAnyNewSolverJob'] is True
          PY
          test "$(git rev-parse HEAD:experiments/model-readiness-v1/training-design.proposal.json)" = e1ee465541e6b8664b34435f3698a33626eeff0f
          test "$(git rev-parse HEAD:experiments/model-readiness-v1/training_design.py)" = 7c0547a1a6a0f192637fc1956acb76d67334e687
          test "$(git rev-parse HEAD:experiments/model-readiness-v1/importance_policy.py)" = be61de779824af74b36f7ac479f14b6d67c2a7c1
          test "$(git rev-parse HEAD:experiments/tier2-disabled-readiness-v1/package.py)" = 4aa3c5aefc03a1a4cd07ac38f515ddc416744db7

      - name: Validate exact campaign contract
        run: |
          python review/tier2-core-campaign-contract-v1/validate_tier2_core_campaign_contract_v1.py --contract review/tier2-core-campaign-contract-v1/tier2-core-campaign-contract-v1.json

      - name: Run fail-closed mutation and workflow-surface tests
        run: |
          python review/tier2-core-campaign-contract-v1/test_tier2_core_campaign_contract_v1.py
          python review/tier2-core-campaign-contract-v1/test_workflow_surface_v1.py
