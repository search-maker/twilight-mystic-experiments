name: Tier-2 disabled readiness v1 contract
on:
  pull_request:
    paths:
      - 'experiments/tier2-disabled-readiness-v1/**'
      - 'tests/test_tier2_disabled_readiness_v1.py'
      - '.github/workflows/tier2-disabled-readiness-v1-contract.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - run: python -m py_compile experiments/tier2-disabled-readiness-v1/package.py tests/test_tier2_disabled_readiness_v1.py
      - run: python -m unittest tests/test_tier2_disabled_readiness_v1.py
      - name: Prove disabled-only boundary
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          workflow = Path('.github/workflows/tier2-disabled-readiness-v1-contract.yml').read_text()
          assert '\n  workflow_dispatch:' not in workflow
          path = Path('experiments/tier2-disabled-readiness-v1/package.py')
          spec = importlib.util.spec_from_file_location('tier2_contract', path)
          assert spec and spec.loader
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          assert module.EXPECTED_GEOMETRIES == 48
          assert module.EXPECTED_CASES == 96
          assert module.EXPECTED_PHOTONS == 7_320_000_000
          assert module.TARGET_RSEM == 0.05
          assert module.ACCEPTED_MAX_RSEM == 0.08
          template = module.authorization_template({'packageSha256': 'a' * 64})
          assert template['enabled'] is False
          assert template['automaticTrigger'] is False
          assert template['githubRerunAllowed'] is False
          PY
