name: Tier-2 disabled readiness v1 contract
on:
  pull_request:
    paths:
      - 'experiments/tier2-disabled-readiness-v1/**'
      - 'tests/test_tier2_disabled_readiness_v1.py'
      - '.github/workflows/tier2-disabled-readiness-v1-contract.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - run: python -m py_compile experiments/tier2-disabled-readiness-v1/package.py tests/test_tier2_disabled_readiness_v1.py
      - run: python -m unittest tests/test_tier2_disabled_readiness_v1.py
      - name: Prove disabled-only boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/tier2-disabled-readiness-v1-contract.yml').read_text()
          assert '\n  workflow_dispatch:' not in text
          PY
          grep -q "automaticTrigger':False" experiments/tier2-disabled-readiness-v1/package.py
          grep -q "authorizationEnabled':False" experiments/tier2-disabled-readiness-v1/package.py
          grep -q "productionPromotionAuthorized':False" experiments/tier2-disabled-readiness-v1/package.py
