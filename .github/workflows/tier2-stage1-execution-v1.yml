name: Tier2 stage1 guarded scientific execution v1
run-name: Tier2 stage1 guarded scientific execution v1

on:
  push:
    branches:
      - 'dispatch/tier2-stage1-*'

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: tier2-stage1-${{ github.ref_name }}
  cancel-in-progress: false

env:
  AUTH_PATH: experiments/tier2-stage1-execution-v1/authorization.json
  CONTRACT: review/tier2-stage1-execution-transport-v1/tier2-stage1-execution-transport-v1.json
  MANIFEST: experiments/tier2-stage1-execution-v1/stage1-execution-manifest-v1.json

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      max_parallel: ${{ steps.matrix.outputs.max_parallel }}
      dispatch_branch: ${{ steps.identity.outputs.dispatch_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - id: identity
        name: Refuse wrong event, retry, commit shape, moved main, or authorization identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          case "$GITHUB_REF_NAME" in dispatch/tier2-stage1-*) ;; *) exit 1 ;; esac
          test "$(git cat-file -p "$GITHUB_SHA" | grep -c '^parent ')" = 1
          SOURCE_SHA="$(git rev-parse "$GITHUB_SHA^")"
          LIVE_MAIN="$(gh api "repos/${{ github.repository }}/branches/main" --jq .commit.sha)"
          test "$SOURCE_SHA" = "$LIVE_MAIN"
          if git cat-file -e "$SOURCE_SHA:$AUTH_PATH" 2>/dev/null; then echo 'authorization path already exists on main parent'; exit 1; fi
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")
          test "${#CHANGED[@]}" = 1
          test "${CHANGED[0]}" = "$AUTH_PATH"
          test -f "$AUTH_PATH"
          python - <<'PY'
          import json,os
          from pathlib import Path
          a=json.loads(Path(os.environ['AUTH_PATH']).read_text())
          assert a['dispatchBranch']==os.environ['GITHUB_REF_NAME']
          assert a['status']=='AUTHORIZED_PENDING_SEPARATE_DISPATCH' and a['enabled'] is True
          assert a['automaticDispatch'] is False and a['githubRerunAllowed'] is False and a['retryAllowed'] is False and a['resumeAllowed'] is False
          assert a['protectedHoldoutOpeningAuthorized'] is False and a['stage2Authorized'] is False
          print(f"authorization_branch={a['authorizationBranch']}")
          print(f"dispatch_branch={a['dispatchBranch']}")
          PY
          AUTH_BRANCH="$(python -c 'import json;print(json.load(open("experiments/tier2-stage1-execution-v1/authorization.json"))["authorizationBranch"])')"
          echo "authorization_branch=$AUTH_BRANCH" >> "$GITHUB_OUTPUT"
          echo "dispatch_branch=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - name: Rebuild exact frozen manifest and exact-head 100-seed audit
        run: |
          set -euo pipefail
          python review/tier2-stage1-execution-transport-v1/validate_transport_v1.py --contract "$CONTRACT" --repo-root .
          python experiments/tier2-stage1-execution-v1/build_manifest_v1.py \
            --campaign review/tier2-core-campaign-contract-v1/tier2-core-campaign-contract-v1.json \
            --implementation review/tier2-stage1-authorization-implementation-v1/tier2-stage1-authorization-implementation-v1.json \
            --output /tmp/tier2-stage1-manifest.json
          cmp /tmp/tier2-stage1-manifest.json "$MANIFEST"
          python experiments/tier2-stage1-execution-v1/seed_audit_v1.py --repo-root . --contract "$CONTRACT" --authorization-path "$AUTH_PATH" --output tracked-seed-audit.json
      - id: authreview
        name: Resolve exactly one successful attempt-1 authorization review on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          AUTH_BRANCH: ${{ steps.identity.outputs.authorization_branch }}
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY%%/*}"
          gh api "repos/${{ github.repository }}/pulls?state=open&head=${OWNER}:${AUTH_BRANCH}&per_page=100" > auth-prs.json
          gh api "repos/${{ github.repository }}/actions/workflows/tier2-stage1-authorization-review-v1.yml/runs?event=pull_request&branch=${AUTH_BRANCH}&per_page=100" > auth-runs.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          prs=json.loads(Path('auth-prs.json').read_text()); runs=json.loads(Path('auth-runs.json').read_text())['workflow_runs']; sha=os.environ['GITHUB_SHA']
          ps=[p for p in prs if p['head']['sha']==sha and p['head']['ref']==os.environ['AUTH_BRANCH'] and p['merged_at'] is None]
          rs=[r for r in runs if r['head_sha']==sha and r['head_branch']==os.environ['AUTH_BRANCH'] and r['run_attempt']==1 and r['status']=='completed' and r['conclusion']=='success']
          if len(ps)!=1 or len(rs)!=1: raise SystemExit(f'exact authorization PR/review count mismatch: prs={len(ps)} runs={len(rs)}')
          Path('selected-auth-pr.json').write_text(json.dumps(ps[0],indent=2,sort_keys=True)+'\n'); Path('selected-auth-run.json').write_text(json.dumps(rs[0],indent=2,sort_keys=True)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f"run_id={rs[0]['id']}\n")
          PY
      - uses: actions/download-artifact@v4
        with:
          name: tier2-stage1-authorization-review-${{ github.sha }}
          path: authorization-review-evidence
          repository: ${{ github.repository }}
          run-id: ${{ steps.authreview.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Capture fresh repository-global duplicate/provenance surfaces
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${{ github.repository }}/branches?per_page=100" > branch-pages.json
          gh api --paginate --slurp "repos/${{ github.repository }}/actions/runs?per_page=100" > run-pages.json
          gh api --paginate --slurp "repos/${{ github.repository }}/actions/artifacts?per_page=100" > artifact-pages.json
          gh api --paginate --slurp "repos/${{ github.repository }}/issues/60/comments?per_page=100" > issue-pages.json
      - name: Build fresh dispatch context and authorize exactly one immutable stage1 attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          def load(p):return json.loads(Path(p).read_text())
          def flat(pages,key=None):
              out=[]
              for p in pages:out.extend(p.get(key,[]) if key else p)
              return out
          auth=load(os.environ['AUTH_PATH']); head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(); parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip(); live=subprocess.check_output(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/branches/main",'--jq','.commit.sha'],text=True).strip()
          pr=load('selected-auth-pr.json'); run=load('selected-auth-run.json'); seed=load('tracked-seed-audit.json')
          ctx={'schemaVersion':1,'eventName':os.environ['GITHUB_EVENT_NAME'],'runAttempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'currentRunId':int(os.environ['GITHUB_RUN_ID']),'refName':os.environ['GITHUB_REF_NAME'],'headSha':head,'authorizationCommitSha':head,'parentSha':parent,'liveMain':live,'changedFiles':[os.environ['AUTH_PATH']],'mainAuthorizationPathPresent':False,'trackedSeedAudit':seed,'branches':flat(load('branch-pages.json')),'runs':flat(load('run-pages.json'),'workflow_runs'),'artifacts':flat(load('artifact-pages.json'),'artifacts'),'issue60Comments':flat(load('issue-pages.json')),'authorizationReview':{'headSha':run['head_sha'],'headBranch':run['head_branch'],'runAttempt':run['run_attempt'],'status':run['status'],'conclusion':run['conclusion'],'runId':run['id']},'authorizationPr':{'number':pr['number'],'state':pr['state'],'draft':pr['draft'],'headSha':pr['head']['sha'],'headBranch':pr['head']['ref'],'merged':pr['merged_at'] is not None}}
          Path('execution-context.json').write_text(json.dumps(ctx,indent=2,sort_keys=True)+'\n')
          PY
          python experiments/tier2-stage1-execution-v1/execution_guard_v1.py \
            --contract "$CONTRACT" --manifest "$MANIFEST" --authorization "$AUTH_PATH" \
            --review-guard authorization-review-evidence/preauthorization-guard.json \
            --context execution-context.json --output execution-guard.json
      - id: matrix
        name: Emit exact 76-case matrix only after all guards pass
        run: |
          python - <<'PY'
          import json,os
          m=json.load(open(os.environ['MANIFEST']))
          rows=[{'caseId':c['caseId'],'timeoutSeconds':900 if c['photonHistories']==20_000_000 else 1200} for c in m['cases']]
          assert len(rows)==76
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('matrix='+json.dumps({'include':rows},separators=(',',':'))+'\n')
              f.write('max_parallel=76\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tier2-stage1-preflight-${{ github.sha }}
          path: |
            experiments/tier2-stage1-execution-v1/authorization.json
            tracked-seed-audit.json
            selected-auth-pr.json
            selected-auth-run.json
            authorization-review-evidence/preauthorization-guard.json
            execution-context.json
            execution-guard.json
            experiments/tier2-stage1-execution-v1/stage1-execution-manifest-v1.json
          if-no-files-found: error
          retention-days: 90

  cases:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.preflight.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: tier2-stage1-v1
          create-args: -c conda-forge python=3.12.4 rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true
      - uses: actions/download-artifact@v4
        with:
          name: tier2-stage1-preflight-${{ github.sha }}
          path: preflight
      - name: Re-prove exact runtime identity without solver execution
        shell: micromamba-shell {0}
        run: |
          python experiments/mystic-batch-v1/runtime_probe.py \
            --uvspec "$(command -v uvspec)" \
            --data-dir "$CONDA_PREFIX/share/libRadtran/data" \
            --atmosphere "$CONDA_PREFIX/share/libRadtran/data/atmmod/afglus.dat" \
            --runtime-lock experiments/mystic-batch-v1/runtime-lock.micromamba.json \
            --output case-runtime.json
      - name: Execute exactly one syntax check and one stage1 solver invocation
        shell: micromamba-shell {0}
        run: |
          python experiments/tier2-stage1-execution-v1/executor_v1.py \
            --manifest experiments/tier2-stage1-execution-v1/stage1-execution-manifest-v1.json \
            --runtime-report case-runtime.json \
            --adapter experiments/tier2-stage1-execution-v1/adapter_v1.py \
            --case-id '${{ matrix.caseId }}' \
            --data-dir "$CONDA_PREFIX/share/libRadtran/data" \
            --repository-root . \
            --uvspec "$(command -v uvspec)" \
            --output-root case-output \
            --timeout-seconds '${{ matrix.timeoutSeconds }}' \
            --expected-dispatch-branch '${{ needs.preflight.outputs.dispatch_branch }}' \
            --allow-execution
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tier2-stage1-case-${{ matrix.caseId }}
          path: case-output/${{ matrix.caseId }}
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    needs: [preflight, cases]
    if: always() && needs.preflight.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: tier2-stage1-case-*
          path: case-artifacts
          merge-multiple: false
      - name: Aggregate exact 76-case training acquisition with no fitting
        run: python experiments/tier2-stage1-execution-v1/aggregate_v1.py --manifest "$MANIFEST" --results-root case-artifacts --output aggregate-output/aggregate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tier2-stage1-aggregate-${{ github.sha }}
          path: aggregate-output
          if-no-files-found: error
          retention-days: 90

  audit:
    needs: [preflight, aggregate]
    if: needs.preflight.result == 'success' && needs.aggregate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: tier2-stage1-case-*
          path: case-artifacts
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          name: tier2-stage1-aggregate-${{ github.sha }}
          path: aggregate-output
      - name: Independently re-open all 76 raw spectra and audit channels/hashes
        run: python experiments/tier2-stage1-execution-v1/audit_v1.py --manifest "$MANIFEST" --aggregate aggregate-output/aggregate.json --results-root case-artifacts --output audit-output/audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tier2-stage1-audit-${{ github.sha }}
          path: audit-output
          if-no-files-found: error
          retention-days: 90

  handoff:
    needs: [preflight, aggregate, audit]
    if: needs.preflight.result == 'success' && needs.aggregate.result == 'success' && needs.audit.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: tier2-stage1-aggregate-${{ github.sha }}
          path: aggregate-output
      - uses: actions/download-artifact@v4
        with:
          name: tier2-stage1-audit-${{ github.sha }}
          path: audit-output
      - name: Freeze training-only handoff; keep fitting and stage2 closed
        run: python experiments/tier2-stage1-execution-v1/handoff_v1.py --manifest "$MANIFEST" --aggregate aggregate-output/aggregate.json --audit audit-output/audit.json --output handoff-output/training-handoff.json
      - uses: actions/upload-artifact@v4
        with:
          name: tier2-stage1-handoff-${{ github.sha }}
          path: handoff-output
          if-no-files-found: error
          retention-days: 90
