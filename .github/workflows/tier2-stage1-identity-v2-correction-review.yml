name: Tier2 stage1 identity v3 correction review
run-name: Tier2 stage1 identity v3 correction review

on:
  pull_request:
    paths:
      - experiments/tier2-stage1-execution-v1/executor_v1.py
      - review/tier2-stage1-execution-transport-v1/tier2-stage1-execution-transport-v1.json
      - review/tier2-stage1-execution-transport-v1/test_guards_v1.py
      - review/tier2-stage1-execution-transport-v1/test_transport_v1.py
      - .github/workflows/tier2-stage1-identity-v2-correction-review.yml

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

jobs:
  review:
    if: github.head_ref == 'review/tier2-stage1-identity-v3-correction'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - name: Refuse wrong correction context or diff
        env:
          EXPECTED_BASE_SHA: 0737566c4cb2f04c3b5ca52ee9ff1e15f305cdac
          ACTUAL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_HEAD_REF" = review/tier2-stage1-identity-v3-correction
          test "$GITHUB_BASE_REF" = main
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$ACTUAL_BASE_SHA" = "$EXPECTED_BASE_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git merge-base HEAD "$EXPECTED_BASE_SHA")" = "$EXPECTED_BASE_SHA"
          test ! -e experiments/tier2-stage1-execution-v1/authorization.json
          mapfile -t CHANGED < <(git diff --name-only "$EXPECTED_BASE_SHA" HEAD | sort)
          EXPECTED=(
            .github/workflows/tier2-stage1-identity-v2-correction-review.yml
            experiments/tier2-stage1-execution-v1/executor_v1.py
            review/tier2-stage1-execution-transport-v1/test_guards_v1.py
            review/tier2-stage1-execution-transport-v1/test_transport_v1.py
            review/tier2-stage1-execution-transport-v1/tier2-stage1-execution-transport-v1.json
          )
          test "${#CHANGED[@]}" = "${#EXPECTED[@]}"
          diff -u <(printf '%s\n' "${EXPECTED[@]}") <(printf '%s\n' "${CHANGED[@]}")
      - name: Bind preserved v1 and v2 authorization refusal evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/${{ github.repository }}/actions/runs/31742055624 --jq .run_attempt)" = 1
          test "$(gh api repos/${{ github.repository }}/actions/runs/31742055624 --jq .head_sha)" = 56aa4af8a2818bb1c605af0e46c5d64d49bee922
          test "$(gh api repos/${{ github.repository }}/actions/runs/31742055624 --jq .conclusion)" = failure
          gh api repos/${{ github.repository }}/issues/comments/5285605573 --jq .body | grep -F 'dispatch/tier2-stage1-ordinal19-v1' >/dev/null
          test "$(gh api repos/${{ github.repository }}/actions/runs/31754924218 --jq .run_attempt)" = 1
          test "$(gh api repos/${{ github.repository }}/actions/runs/31754924218 --jq .head_sha)" = 393fb39615f146e20129963fc7d2700255ccbd27
          test "$(gh api repos/${{ github.repository }}/actions/runs/31754924218 --jq .conclusion)" = failure
          test "$(gh api repos/${{ github.repository }}/actions/runs/31754924218/jobs --jq '.jobs[] | select(.name=="authorization-review") | .steps[] | select(.name=="Run exact-head tracked-tree 100-seed collision audit") | .conclusion')" = failure
      - name: Prove identity-only correction, seed-audit self-collision removal, and unchanged science payload
        env:
          EXPECTED_BASE_SHA: 0737566c4cb2f04c3b5ca52ee9ff1e15f305cdac
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy, hashlib, json, os, subprocess
          from pathlib import Path
          cp='review/tier2-stage1-execution-transport-v1/tier2-stage1-execution-transport-v1.json'
          mp='experiments/tier2-stage1-execution-v1/stage1-execution-manifest-v1.json'
          ep='experiments/tier2-stage1-execution-v1/executor_v1.py'
          base=os.environ['EXPECTED_BASE_SHA']
          old=json.loads(subprocess.check_output(['git','show',f'{base}:{cp}'],text=True))
          cur=json.loads(Path(cp).read_text())
          old_manifest=subprocess.check_output(['git','show',f'{base}:{mp}'])
          cur_manifest=Path(mp).read_bytes()
          assert old_manifest==cur_manifest
          assert cur['authorization']['authorizationBranchTemplate'].endswith('-v3')
          assert cur['authorization']['dispatchBranchTemplate'].endswith('-v3')
          assert cur['authorization']['executionKeyTemplate'].startswith('tier2-core-stage1-v3:')
          assert old['authorization']['authorizationBranchTemplate'].endswith('-v2')
          assert old['authorization']['dispatchBranchTemplate'].endswith('-v2')
          assert old['authorization']['executionKeyTemplate'].startswith('tier2-core-stage1-v2:')
          for k in ('frozenStage1','seedAudit','runtimeIdentityRequired','sourceBindings','executionBoundary','governance','status','workflows'):
              assert cur[k]==old[k], k
          old_auth=copy.deepcopy(old['authorization']); cur_auth=copy.deepcopy(cur['authorization'])
          for k in ('authorizationBranchTemplate','dispatchBranchTemplate','executionKeyTemplate'):
              old_auth.pop(k); cur_auth.pop(k)
          assert cur_auth==old_auth
          old_components=copy.deepcopy(old['components']); cur_components=copy.deepcopy(cur['components'])
          old_exec=old_components.pop('executor_v1.py'); cur_exec=cur_components.pop('executor_v1.py')
          assert cur_components==old_components
          assert cur_exec['path']==old_exec['path']==ep
          assert cur_exec['rawSha256']==hashlib.sha256(Path(ep).read_bytes()).hexdigest()
          assert cur_exec['rawSha256']!=old_exec['rawSha256']
          wf=Path('.github/workflows/tier2-stage1-identity-v2-correction-review.yml').read_text()
          first=str(cur['seedAudit']['candidateFirstSeed']); last=str(cur['seedAudit']['candidateLastSeed'])
          assert first not in wf and last not in wf
          assert cur['executionBoundary']['solverExecutionPerformed'] is False
          assert cur['executionBoundary']['protectedHoldoutOpeningAuthorized'] is False
          assert cur['executionBoundary']['stage2Authorized'] is False
          PY
      - name: Run full fail-closed transport regression with no solver
        run: |
          set -euo pipefail
          python review/tier2-stage1-execution-transport-v1/validate_transport_v1.py --contract review/tier2-stage1-execution-transport-v1/tier2-stage1-execution-transport-v1.json --repo-root .
          python review/tier2-stage1-execution-transport-v1/test_contract_mutations_v1.py
          python review/tier2-stage1-execution-transport-v1/test_guards_v1.py
          python review/tier2-stage1-execution-transport-v1/test_transport_v1.py
          python review/tier2-stage1-execution-transport-v1/test_workflow_surface_v1.py
          python -m py_compile experiments/tier2-stage1-execution-v1/*.py review/tier2-stage1-execution-transport-v1/*.py
