name: Tier2 stage1 identity v4 matrix-recovery review
run-name: Tier2 stage1 identity v4 matrix-recovery review

on:
  pull_request:
    paths:
      - .github/workflows/tier2-stage1-identity-v2-correction-review.yml
      - .github/workflows/tier2-stage1-execution-v1.yml
      - experiments/tier2-stage1-execution-v1/execution_guard_v1.py
      - experiments/tier2-stage1-execution-v1/preauthorization_guard_v1.py
      - review/tier2-stage1-execution-transport-v1/test_contract_mutations_v1.py
      - review/tier2-stage1-execution-transport-v1/test_guards_v1.py
      - review/tier2-stage1-execution-transport-v1/test_workflow_surface_v1.py
      - review/tier2-stage1-execution-transport-v1/tier2-stage1-execution-transport-v1.json
      - review/tier2-stage1-execution-transport-v1/validate_transport_v1.py

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

jobs:
  review:
    if: github.head_ref == 'review/tier2-stage1-identity-v4-matrix-recovery'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - name: Refuse wrong recovery context or diff
        env:
          EXPECTED_BASE_SHA: a8544de4a96cc4c3abfdb1708a0c23595954fb0b
          ACTUAL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_HEAD_REF" = review/tier2-stage1-identity-v4-matrix-recovery
          test "$GITHUB_BASE_REF" = main
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$ACTUAL_BASE_SHA" = "$EXPECTED_BASE_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git merge-base HEAD "$EXPECTED_BASE_SHA")" = "$EXPECTED_BASE_SHA"
          test ! -e experiments/tier2-stage1-execution-v1/authorization.json
          mapfile -t CHANGED < <(git diff --name-only "$EXPECTED_BASE_SHA" HEAD | sort)
          EXPECTED=(
            .github/workflows/tier2-stage1-execution-v1.yml
            .github/workflows/tier2-stage1-identity-v2-correction-review.yml
            experiments/tier2-stage1-execution-v1/execution_guard_v1.py
            experiments/tier2-stage1-execution-v1/preauthorization_guard_v1.py
            review/tier2-stage1-execution-transport-v1/test_contract_mutations_v1.py
            review/tier2-stage1-execution-transport-v1/test_guards_v1.py
            review/tier2-stage1-execution-transport-v1/test_workflow_surface_v1.py
            review/tier2-stage1-execution-transport-v1/tier2-stage1-execution-transport-v1.json
            review/tier2-stage1-execution-transport-v1/validate_transport_v1.py
          )
          test "${#CHANGED[@]}" = "${#EXPECTED[@]}"
          diff -u <(printf '%s\n' "${EXPECTED[@]}") <(printf '%s\n' "${CHANGED[@]}")
      - name: Bind immutable v3 pre-solver failure evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/${{ github.repository }}/actions/runs/31761751524 --jq .run_attempt)" = 1
          test "$(gh api repos/${{ github.repository }}/actions/runs/31761751524 --jq .head_sha)" = 66ed95ab7801a2b3a20bd54a4dced53bf6f9ee5c
          test "$(gh api repos/${{ github.repository }}/actions/runs/31761751524 --jq .head_branch)" = dispatch/tier2-stage1-ordinal19-v3
          test "$(gh api repos/${{ github.repository }}/actions/runs/31761751524 --jq .conclusion)" = failure
          gh api "repos/${{ github.repository }}/actions/runs/31761751524/jobs?per_page=100&filter=all" > /tmp/recovery-jobs.json
          gh api "repos/${{ github.repository }}/actions/runs/31761751524/artifacts?per_page=100" > /tmp/recovery-artifacts.json
          python - <<'PY'
          import json
          jobs=json.load(open('/tmp/recovery-jobs.json'))['jobs']; arts=json.load(open('/tmp/recovery-artifacts.json'))['artifacts']
          assert len(jobs)==4
          assert {j['name']:j['conclusion'] for j in jobs}=={'preflight':'success','aggregate':'failure','audit':'skipped','handoff':'skipped'}
          assert not any(j['name'].startswith('cases') for j in jobs)
          expected={
            9204873878:('tier2-stage1-preflight-66ed95ab7801a2b3a20bd54a4dced53bf6f9ee5c','sha256:e46f82583f766b7ba72980d6a265829f3744077e54a4e5356ab2e9aef28f1429'),
            9204877503:('tier2-stage1-aggregate-66ed95ab7801a2b3a20bd54a4dced53bf6f9ee5c','sha256:1a2ae921828174b9e1f8f4f0c0dc124116180dbcfd82f7c64075ea1f348efd39')}
          assert len(arts)==2
          assert {a['id']:(a['name'],a['digest']) for a in arts}==expected
          assert not any(a['name'].startswith('tier2-stage1-case-') for a in arts)
          PY
      - name: Prove matrix repair, fresh identity, and unchanged science payload
        env:
          EXPECTED_BASE_SHA: a8544de4a96cc4c3abfdb1708a0c23595954fb0b
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy,json,os,subprocess
          from pathlib import Path
          cp='review/tier2-stage1-execution-transport-v1/tier2-stage1-execution-transport-v1.json'; mp='experiments/tier2-stage1-execution-v1/stage1-execution-manifest-v1.json'; base=os.environ['EXPECTED_BASE_SHA']
          old=json.loads(subprocess.check_output(['git','show',f'{base}:{cp}'],text=True)); cur=json.load(open(cp))
          assert subprocess.check_output(['git','show',f'{base}:{mp}'])==Path(mp).read_bytes()
          assert old['sourceBindings']['latestConsumedScientificOrdinal']==18 and cur['sourceBindings']['latestConsumedScientificOrdinal']==19
          assert cur['authorization']['authorizationBranchTemplate']==old['authorization']['authorizationBranchTemplate'] and cur['authorization']['dispatchBranchTemplate']==old['authorization']['dispatchBranchTemplate'] and cur['authorization']['executionKeyTemplate']==old['authorization']['executionKeyTemplate']
          for k in ('frozenStage1','seedAudit','runtimeIdentityRequired','executionBoundary','governance','status'):
              assert cur[k]==old[k],k
          exe=Path('.github/workflows/tier2-stage1-execution-v1.yml').read_text()
          assert "json.dumps({'include':rows},separators=(',',':'))" in exe
          assert "json.dumps(rows,separators=(',',':'))" not in exe
          assert cur['recovery']['priorFailedPresolverDispatch']['solverExecutionCount']==0
          PY
      - name: Run full fail-closed transport regression with no solver
        run: |
          set -euo pipefail
          python review/tier2-stage1-execution-transport-v1/validate_transport_v1.py --contract review/tier2-stage1-execution-transport-v1/tier2-stage1-execution-transport-v1.json --repo-root .
          python review/tier2-stage1-execution-transport-v1/test_contract_mutations_v1.py
          python review/tier2-stage1-execution-transport-v1/test_guards_v1.py
          python review/tier2-stage1-execution-transport-v1/test_transport_v1.py
          python review/tier2-stage1-execution-transport-v1/test_workflow_surface_v1.py
          python -m py_compile experiments/tier2-stage1-execution-v1/*.py review/tier2-stage1-execution-transport-v1/*.py
