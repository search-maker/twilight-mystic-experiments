name: Tier2 Stage2 guarded protected validation v1
run-name: Tier2 Stage2 guarded protected validation v1

on:
  push:
    branches:
      - 'dispatch/tier2-stage2-ordinal*-v1'

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: tier2-stage2-${{ github.ref_name }}
  cancel-in-progress: false

env:
  AUTH_PATH: experiments/tier2-stage2-execution-v1/authorization.json
  CONTRACT: review/tier2-stage2-protected-holdout-v1/contract-v1.json

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      dispatch_branch: ${{ steps.identity.outputs.dispatch_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - name: Install frozen preflight dependency
        run: python -m pip install --disable-pip-version-check 'numpy==2.3.2'
      - id: identity
        name: Refuse wrong event, retry, moved main, commit shape, or authorization
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          case "$GITHUB_REF_NAME" in dispatch/tier2-stage2-ordinal*-v1) ;; *) exit 1 ;; esac
          test "$(git cat-file -p "$GITHUB_SHA" | grep -c '^parent ')" = 1
          PARENT="$(git rev-parse "$GITHUB_SHA^")"
          test "$PARENT" = "$(gh api repos/${GITHUB_REPOSITORY}/branches/main --jq .commit.sha)"
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")
          test "${#CHANGED[@]}" = 1
          test "${CHANGED[0]}" = "$AUTH_PATH"
          test -f "$AUTH_PATH"
          if git cat-file -e "$PARENT:$AUTH_PATH" 2>/dev/null; then echo authorization-already-on-main; exit 1; fi
          python - <<'PY'
          import json,os,subprocess
          a=json.load(open(os.environ['AUTH_PATH'])); parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip(); blob=subprocess.check_output(['git','rev-parse','HEAD^:review/tier2-stage2-protected-holdout-v1/contract-v1.json'],text=True).strip()
          assert a['status']=='AUTHORIZED_PENDING_SEPARATE_DISPATCH' and a['enabled'] is True
          assert a['dispatchBranch']==os.environ['GITHUB_REF_NAME'] and a['exactAuthorizationParentCommit']==parent and a['executionContractGitBlobSha']==blob
          assert a['scientificExecutionAuthorized'] is True and a['protectedHoldoutOpeningAuthorized'] is True and a['holdoutValuesMayBeRead'] is True and a['stage2Authorized'] is True
          assert a['automaticDispatch'] is False and a['githubRerunAllowed'] is False and a['retryAllowed'] is False and a['resumeAllowed'] is False and a['solverExecutionPerformed'] is False
          assert a['modelRetuningAuthorized'] is False and a['productionPromotionAuthorized'] is False
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('dispatch_branch='+a['dispatchBranch']+'\n')
          PY
      - name: Rebuild exact frozen Stage2 payload
        run: |
          set -euo pipefail
          python review/tier2-stage2-protected-holdout-v1/stage2_v1.py validate --contract "$CONTRACT" --repo-root .
          python experiments/tier2-stage2-execution-v1/build_manifest_v1.py --repo-root . --contract "$CONTRACT" --output stage2-manifest.json
      - name: Resolve exact successful attempt-1 Draft authorization review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AUTH_BRANCH="$(python -c 'import json;print(json.load(open("experiments/tier2-stage2-execution-v1/authorization.json"))["authorizationBranch"])')"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${OWNER}:${AUTH_BRANCH}&per_page=100" > auth-prs.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/tier2-stage2-authorization-review-v1.yml/runs?event=pull_request&branch=${AUTH_BRANCH}&per_page=100" > auth-runs.json
          python - <<'PY'
          import json,os
          prs=json.load(open('auth-prs.json'));runs=json.load(open('auth-runs.json'))['workflow_runs'];sha=os.environ['GITHUB_SHA'];a=json.load(open('experiments/tier2-stage2-execution-v1/authorization.json'))
          ps=[p for p in prs if p['head']['sha']==sha and p['head']['ref']==a['authorizationBranch'] and p['merged_at'] is None and p['draft'] is True]
          rs=[r for r in runs if r['head_sha']==sha and r['head_branch']==a['authorizationBranch'] and r['run_attempt']==1 and r['status']=='completed' and r['conclusion']=='success']
          assert len(ps)==1 and len(rs)==1,(len(ps),len(rs))
          PY
      - uses: actions/download-artifact@v4
        with:
          name: tier2-stage1-ordinal20-artifact-salvage-v1-e5e3454866b6fd2f7ca940955816af2fe2d3c98f
          path: ordinal20-salvage
          repository: ${{ github.repository }}
          run-id: 31767381839
          github-token: ${{ github.token }}
      - name: Fresh global ordinal, duplicate identity, and reserved-seed audit at dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp repos/${GITHUB_REPOSITORY}/branches?per_page=100 > branch-pages.json
          gh api --paginate --slurp repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100 > run-pages.json
          gh api --paginate --slurp repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100 > artifact-pages.json
          gh api --paginate --slurp repos/${GITHUB_REPOSITORY}/issues/60/comments?per_page=100 > issue-pages.json
          python - <<'PY'
          import json,os,re
          def flat(path,key=None):
            out=[]
            for x in json.load(open(path)): out.extend(x.get(key,[]) if key else x)
            return out
          a=json.load(open(os.environ['AUTH_PATH']));p=json.load(open(os.environ['CONTRACT']));branches=flat('branch-pages.json');runs=flat('run-pages.json','workflow_runs');arts=flat('artifact-pages.json','artifacts');comments=flat('issue-pages.json');rx=re.compile(r'^dispatch/.*ordinal([1-9][0-9]*)',re.I)
          prior_refusal=p['authorization']['priorDispatchRefusal']; assert prior_refusal['scientificOrdinal']==21 and prior_refusal['scientificOrdinalConsumed'] is True and prior_refusal['reservedSeedsConsumed'] is False and prior_refusal['holdoutValuesRead'] is False and prior_refusal['scientificSolverExecutionPerformed'] is False
          prior=[]
          for n in [str(x.get('name') or '') for x in branches if x.get('name')!=a['dispatchBranch']]+[str(x.get('head_branch') or '') for x in runs if x.get('event')=='push' and not (x.get('head_branch')==a['dispatchBranch'] and int(x.get('id') or 0)==int(os.environ['GITHUB_RUN_ID']))]:
            m=rx.match(n)
            if m:prior.append(int(m.group(1)))
          assert prior and max(prior)==prior_refusal['scientificOrdinal'] and a['scientificOrdinal']==prior_refusal['scientificOrdinal']+1
          current=[r for r in runs if r.get('head_branch')==a['dispatchBranch'] and r.get('head_sha')==os.environ['GITHUB_SHA'] and r.get('event')=='push']
          assert len(current)==1 and int(current[0]['id'])==int(os.environ['GITHUB_RUN_ID']) and int(current[0]['run_attempt'])==1
          old=[r for r in runs if int(r.get('id') or 0)==prior_refusal['dispatchRunId']]; assert len(old)==1 and old[0].get('head_branch')==prior_refusal['dispatchBranch'] and old[0].get('head_sha')==prior_refusal['authorizationCommitSha'] and old[0].get('conclusion')=='failure' and int(old[0].get('run_attempt') or 0)==1
          ledger=json.load(open('ordinal20-salvage/consumed-training-seed-ledger.json'));reserved={int(s) for g in p['stage2Scope']['geometries'] for s in g['reservedSeeds']};used={int(x['seed']) for x in ledger['entries']};assert ledger['ledgerSha256']==p['sourceBindings']['consumedTrainingSeedLedgerSha256'] and not(reserved&used)
          external=[]
          for c in comments:
            vals={s for s in reserved if str(s) in str(c.get('body') or '')}
            if vals and int(c.get('id') or 0)!=5279964834:external.append((c.get('id'),sorted(vals)))
          assert not external,external
          meta=json.dumps({'branches':branches,'runs':runs,'artifacts':arts},sort_keys=True);assert not any(str(s) in meta for s in reserved)
          PY
      - id: matrix
        name: Emit exact 24-case matrix only after all guards pass
        run: |
          python - <<'PY'
          import json,os
          m=json.load(open('stage2-manifest.json'));rows=[{'caseId':c['caseId'],'timeoutSeconds':900 if c['photonHistories']==20_000_000 else 1200} for c in m['cases']];assert len(rows)==24
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('matrix='+json.dumps({'include':rows},separators=(',',':'))+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tier2-stage2-preflight-${{ github.sha }}
          path: |
            experiments/tier2-stage2-execution-v1/authorization.json
            stage2-manifest.json
            auth-prs.json
            auth-runs.json
          if-no-files-found: error
          retention-days: 90

  cases:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: tier2-stage2-v1
          create-args: -c conda-forge python=3.12.4 rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true
      - uses: actions/download-artifact@v4
        with:
          name: tier2-stage2-preflight-${{ github.sha }}
          path: preflight
      - name: Re-prove exact runtime identity without solver execution
        shell: micromamba-shell {0}
        run: |
          python experiments/mystic-batch-v1/runtime_probe.py --uvspec "$(command -v uvspec)" --data-dir "$CONDA_PREFIX/share/libRadtran/data" --atmosphere "$CONDA_PREFIX/share/libRadtran/data/atmmod/afglus.dat" --runtime-lock experiments/mystic-batch-v1/runtime-lock.micromamba.json --output case-runtime.json
      - name: Execute exactly one syntax check and one protected Stage2 MYSTIC invocation
        shell: micromamba-shell {0}
        run: |
          python experiments/tier2-stage2-execution-v1/executor_v1.py --manifest preflight/stage2-manifest.json --runtime-report case-runtime.json --adapter experiments/tier2-stage2-execution-v1/adapter_v1.py --case-id '${{ matrix.caseId }}' --data-dir "$CONDA_PREFIX/share/libRadtran/data" --repository-root . --uvspec "$(command -v uvspec)" --output-root case-output --timeout-seconds '${{ matrix.timeoutSeconds }}' --expected-dispatch-branch '${{ needs.preflight.outputs.dispatch_branch }}' --allow-execution
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tier2-stage2-case-${{ matrix.caseId }}
          path: case-output/${{ matrix.caseId }}
          if-no-files-found: warn
          retention-days: 90

  evaluate:
    needs: [preflight, cases]
    if: needs.preflight.result == 'success' && needs.cases.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - run: python -m pip install --disable-pip-version-check 'numpy==2.3.2'
      - uses: actions/download-artifact@v4
        with:
          pattern: tier2-stage2-case-*
          path: case-artifacts
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          name: level-b-core-surrogate-model-freeze-v1-fe7a19431f71566be2c797601a4189eebe89700f
          path: frozen-model
          repository: ${{ github.repository }}
          run-id: 31772063894
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: level-b-core-training-spectral-representation-v2-source-binding-fix-v1-9dff6961cbdc318e9b4b65880aac469f9a4a4a38
          path: frozen-representation
          repository: ${{ github.repository }}
          run-id: 31771224298
          github-token: ${{ github.token }}
      - name: Evaluate exact six holdouts against frozen model and DoD once
        run: python review/tier2-stage2-protected-holdout-v1/stage2_v1.py evaluate --contract "$CONTRACT" --cases-root case-artifacts --model-dir frozen-model --representation-dir frozen-representation --output stage2-evaluation.json
      - name: Independent result selfhash and frozen-pass audit
        run: |
          python - <<'PY'
          import hashlib,json
          r=json.load(open('stage2-evaluation.json'));base={k:v for k,v in r.items() if k!='resultSha256'};h=hashlib.sha256(json.dumps(base,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest();assert h==r['resultSha256'];assert (r['geometryCount'],r['caseCount'],r['configuredPhotonHistories'])==(6,24,720_000_000);assert r['p90OrP95Used'] is False and r['retuningPerformed'] is False and r['modelChangedAfterHoldoutOpening'] is False;calc=r['supportPass'] and all(x['passes'] for x in r['channelSummary'].values()) and r['shapePass'] and r['baselinePass'];assert calc==r['definitionOfDonePassed'];assert r['productionPromotionAuthorized'] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tier2-stage2-evaluation-${{ github.sha }}
          path: stage2-evaluation.json
          if-no-files-found: error
          retention-days: 90
