name: train-0014 fresh training acquisition preregistration v1 review
on:
  pull_request:
    paths:
      - review/train-0014-fresh-training-acquisition-v1/**
      - review/full-spectrum-estimator-confirmation-decision-v1/**
      - review/full-spectrum-training-admission-readiness-v2/**
      - .github/workflows/train-0014-fresh-training-acquisition-v1-review.yml
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - name: Bind exact gate and ordinal-17 preflight templates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD:review/full-spectrum-estimator-pilot-v2/full-spectrum-training-admission-complete-v1.json)" = c136f23f7df68b1481cb5ff939646198a3e336fe
          test "$(git rev-parse HEAD:review/full-spectrum-estimator-pilot-v2/full-spectrum-estimator-pilot-seed-collision-audit-v4.json)" = 88648e720fc1f3b2c237a76614d904f2d02d817d
          gh api repos/search-maker/twilight-mystic-experiments/actions/artifacts/9127923286/zip > /tmp/confirmation-preflight.zip
          echo "db276a4645db6461dc21ce6eb8a8d42b6bca60a89d07e31c9c1e368b5dea08d7  /tmp/confirmation-preflight.zip" | sha256sum -c -
          mkdir -p /tmp/confirmation-preflight
          unzip -q /tmp/confirmation-preflight.zip -d /tmp/confirmation-preflight
      - name: Validate preregistration and mutation refusals
        shell: bash
        run: |
          python -m py_compile review/train-0014-fresh-training-acquisition-v1/*.py
          python review/train-0014-fresh-training-acquisition-v1/validate_train0014_fresh_training_preregistration_v1.py \
            --preregistration review/train-0014-fresh-training-acquisition-v1/train-0014-fresh-training-acquisition-preregistration-v1.json \
            --decision review/full-spectrum-estimator-confirmation-decision-v1/full-spectrum-estimator-confirmation-decision-v1.json \
            --readiness review/full-spectrum-training-admission-readiness-v2/full-spectrum-training-admission-readiness-v2.json \
            --gate review/full-spectrum-estimator-pilot-v2/full-spectrum-training-admission-complete-v1.json \
            --seed-audit review/full-spectrum-estimator-pilot-v2/full-spectrum-estimator-pilot-seed-collision-audit-v4.json \
            --confirmation-manifest /tmp/confirmation-preflight/execution-manifest-v1.json \
            --render-report /tmp/confirmation-preflight/render-report-v1.json \
            --source-template /tmp/confirmation-preflight/rendered-templates/train-0014-fs-confirm-alis-600-c1/input-template.txt \
            --template-root review/train-0014-fresh-training-acquisition-v1/rendered-review-v1 \
            --output /tmp/train0014-prereg-review.json
          python review/train-0014-fresh-training-acquisition-v1/test_train0014_fresh_training_preregistration_v1.py
          python review/train-0014-fresh-training-acquisition-v1/test_workflow_surface_v1.py --workflow .github/workflows/train-0014-fresh-training-acquisition-v1-review.yml
      - uses: actions/upload-artifact@v4
        with:
          name: train-0014-fresh-training-acquisition-v1-review
          path: /tmp/train0014-prereg-review.json
          if-no-files-found: error
          retention-days: 90
