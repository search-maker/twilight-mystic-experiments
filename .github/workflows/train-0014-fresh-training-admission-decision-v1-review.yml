name: Train-0014 fresh training admission decision v1 review
run-name: Train-0014 fresh training admission decision v1 review

on:
  pull_request:
    paths:
      - review/train-0014-fresh-training-admission-decision-v1/train-0014-fresh-training-admission-decision-v1.json
      - review/train-0014-fresh-training-admission-decision-v1/validate_train0014_fresh_training_admission_decision_v1.py
      - review/train-0014-fresh-training-admission-decision-v1/test_train0014_fresh_training_admission_decision_v1.py
      - review/train-0014-fresh-training-admission-decision-v1/test_workflow_surface_v1.py
      - .github/workflows/train-0014-fresh-training-admission-decision-v1-review.yml

permissions:
  contents: read
  actions: read

jobs:
  review:
    if: github.head_ref == 'review/train0014-fresh-training-admission-decision-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'

      - name: Refuse wrong review context or execution surface
        run: |
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_HEAD_REF" = review/train0014-fresh-training-admission-decision-v1
          test "$GITHUB_RUN_ATTEMPT" = 1
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/train-0014-fresh-training-admission-decision-v1-review.yml')
          text=p.read_text(encoding='utf-8')
          forbidden=(
              'workflow_'+'dispatch',
              'mamba-'+'org/setup-micromamba',
              'uv'+'spec',
              'mys'+'tic',
              'libRad'+'tran',
              'executor_'+'v1.py',
              '--allow-'+'execution',
          )
          found=[x for x in forbidden if x.lower() in text.lower()]
          if found:
              raise SystemExit(f'forbidden scientific execution surface: {found}')
          PY

      - name: Re-download and bind exact audited ordinal-18 salvage evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9166569024" > artifact-meta.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/31662184272" > salvage-run.json
          python - <<'PY'
          import json
          a=json.load(open('artifact-meta.json'))
          expected={
              'id':9166569024,
              'name':'training-continuation-train0014-ordinal18-postprocess-salvage-v2',
              'size_in_bytes':18588,
              'digest':'sha256:98d78438add36b7aaebefe53a26af8ee1b5f2ead5ba6507eb49faa95420d4838',
              'expired':False,
          }
          stale={k:(a.get(k),v) for k,v in expected.items() if a.get(k)!=v}
          if stale: raise SystemExit(f'salvage artifact metadata drift: {stale}')
          wr=a.get('workflow_run') or {}
          if wr.get('id')!=31662184272 or wr.get('head_branch')!='postprocess/training-continuation-train0014-ordinal18-salvage-v2' or wr.get('head_sha')!='b2bd49b855e2ef2718d21c328a5a627792b11390':
              raise SystemExit(f'salvage artifact workflow binding drift: {wr}')
          r=json.load(open('salvage-run.json'))
          exp={'status':'completed','conclusion':'success','run_attempt':1,'event':'push','head_branch':'postprocess/training-continuation-train0014-ordinal18-salvage-v2','head_sha':'b2bd49b855e2ef2718d21c328a5a627792b11390','path':'.github/workflows/training-continuation-train0014-ordinal18-postprocess-salvage-v2.yml'}
          stale={k:(r.get(k),v) for k,v in exp.items() if r.get(k)!=v}
          if stale: raise SystemExit(f'salvage run identity drift: {stale}')
          PY
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9166569024/zip" > salvage-v2.zip
          python - <<'PY'
          import hashlib,zipfile
          from pathlib import Path
          raw=Path('salvage-v2.zip').read_bytes()
          got=hashlib.sha256(raw).hexdigest()
          want='98d78438add36b7aaebefe53a26af8ee1b5f2ead5ba6507eb49faa95420d4838'
          if got!=want: raise SystemExit(f'salvage ZIP digest drift: {got}')
          with zipfile.ZipFile('salvage-v2.zip') as z:
              names=z.namelist()
              required={'salvage/analysis.json','salvage/normalized-evidence.json','salvage/salvage-report.json','source-before.sha256','source-after.sha256'}
              if not required.issubset(set(names)): raise SystemExit(f'salvage ZIP required members missing: {sorted(required-set(names))}')
              if len(names)!=len(set(names)) or any('..' in Path(n).parts for n in names): raise SystemExit('unsafe or duplicate salvage ZIP member')
          PY
          unzip -q salvage-v2.zip -d salvage-v2
          cmp salvage-v2/source-before.sha256 salvage-v2/source-after.sha256

      - name: Validate exact post-result admission decision against frozen sources
        run: |
          python review/train-0014-fresh-training-admission-decision-v1/validate_train0014_fresh_training_admission_decision_v1.py \
            --decision review/train-0014-fresh-training-admission-decision-v1/train-0014-fresh-training-admission-decision-v1.json \
            --preregistration review/train-0014-fresh-training-acquisition-v1/train-0014-fresh-training-acquisition-preregistration-v1.json \
            --analysis salvage-v2/salvage/analysis.json \
            --evidence salvage-v2/salvage/normalized-evidence.json \
            --salvage-report salvage-v2/salvage/salvage-report.json \
            --prior-readiness review/full-spectrum-training-admission-readiness-v2/full-spectrum-training-admission-readiness-v2.json \
            --exhausted-treatment review/full-spectrum-precision-exhausted-treatment-v1/full-spectrum-precision-exhausted-treatment-protocol-v1.json \
            --output decision-review.json
          python - <<'PY'
          import json
          r=json.load(open('decision-review.json'))
          expected={
              'status':'PASS',
              'decisionSha256':'439f11900d82148e3af61be46071f1ae5910a73ae552f33949e6cdc58eabe10c',
              'admittedGeometryId':'train-0014',
              'admittedTrainingGeometryCount':25,
              'remainingContinuationRequiredGeometryIds':['train-0037'],
              'modelFittingAuthorized':False,
              'scientificExecutionAuthorized':False,
          }
          if r!=expected: raise SystemExit(f'decision review output drift: {r}')
          PY

      - name: Run focused refusal and workflow-surface regressions
        run: |
          python -m py_compile \
            review/train-0014-fresh-training-admission-decision-v1/validate_train0014_fresh_training_admission_decision_v1.py \
            review/train-0014-fresh-training-admission-decision-v1/test_train0014_fresh_training_admission_decision_v1.py \
            review/train-0014-fresh-training-admission-decision-v1/test_workflow_surface_v1.py
          python review/train-0014-fresh-training-admission-decision-v1/test_train0014_fresh_training_admission_decision_v1.py
          python review/train-0014-fresh-training-admission-decision-v1/test_workflow_surface_v1.py
          python review/train-0014-fresh-training-acquisition-v1/test_train0014_fresh_training_preregistration_v1.py
