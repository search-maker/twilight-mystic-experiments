name: train-0037 targeted estimator comparison v1 review
on:
  pull_request:
    paths:
      - review/train-0037-targeted-estimator-comparison-v1/**
      - review/full-spectrum-estimator-confirmation-decision-v1/**
      - review/full-spectrum-training-admission-readiness-v2/**
      - .github/workflows/train-0037-targeted-estimator-comparison-v1-review.yml
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - name: Bind exact source files
        shell: bash
        run: |
          test "$(git rev-parse HEAD:review/full-spectrum-estimator-pilot-v2/full-spectrum-training-admission-complete-v1.json)" = c136f23f7df68b1481cb5ff939646198a3e336fe
          test "$(git rev-parse HEAD:review/full-spectrum-estimator-pilot-v2/full-spectrum-estimator-pilot-seed-collision-audit-v4.json)" = 88648e720fc1f3b2c237a76614d904f2d02d817d
          test "$(git rev-parse HEAD:review/full-spectrum-estimator-pilot-v2/rendered-review-v5/train-0037-fs-alis-500-r1/input-template.txt)" = 97060abd19873f40b4f6b89c473796da27fd8b39
          test "$(git rev-parse HEAD:review/full-spectrum-estimator-pilot-v2/rendered-review-v5/train-0037-fs-alis-600-r1/input-template.txt)" = f55d1f8b26010ce42d98fac3d8d81dd6ccae9cd6
      - name: Validate preregistration and mutation refusals
        shell: bash
        run: |
          python -m py_compile review/train-0037-targeted-estimator-comparison-v1/*.py
          python review/train-0037-targeted-estimator-comparison-v1/validate_train0037_targeted_estimator_comparison_v1.py \
            --preregistration review/train-0037-targeted-estimator-comparison-v1/train-0037-targeted-estimator-comparison-preregistration-v1.json \
            --decision review/full-spectrum-estimator-confirmation-decision-v1/full-spectrum-estimator-confirmation-decision-v1.json \
            --readiness review/full-spectrum-training-admission-readiness-v2/full-spectrum-training-admission-readiness-v2.json \
            --gate review/full-spectrum-estimator-pilot-v2/full-spectrum-training-admission-complete-v1.json \
            --screening review/train-0037-targeted-estimator-comparison-v1/test-fixtures/train-0037-screening-report-v8-minimal.json \
            --seed-audit review/full-spectrum-estimator-pilot-v2/full-spectrum-estimator-pilot-seed-collision-audit-v4.json \
            --source-500 review/full-spectrum-estimator-pilot-v2/rendered-review-v5/train-0037-fs-alis-500-r1/input-template.txt \
            --source-600 review/full-spectrum-estimator-pilot-v2/rendered-review-v5/train-0037-fs-alis-600-r1/input-template.txt \
            --template-root review/train-0037-targeted-estimator-comparison-v1/rendered-review-v1 \
            --output /tmp/train0037-comparison-review.json
          python review/train-0037-targeted-estimator-comparison-v1/test_train0037_targeted_estimator_comparison_v1.py
          python review/train-0037-targeted-estimator-comparison-v1/test_workflow_surface_v1.py --workflow .github/workflows/train-0037-targeted-estimator-comparison-v1-review.yml
      - uses: actions/upload-artifact@v4
        with:
          name: train-0037-targeted-estimator-comparison-v1-review
          path: /tmp/train0037-comparison-review.json
          if-no-files-found: error
          retention-days: 90
