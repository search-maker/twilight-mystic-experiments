name: Training continuation train-0014 ordinal18 activation review
on:
  pull_request:
    paths:
      - 'experiments/training-continuation-train0014-ordinal18-activation-v1/**'
      - 'experiments/training-continuation-transport-v1/README.md'
      - 'experiments/training-continuation-transport-v1/build_execution_manifest_v1.py'
      - 'experiments/training-continuation-transport-v1/test_repository_bindings_v1.py'
      - '.github/workflows/training-continuation-train0014-ordinal18-*.yml'
permissions:
  contents: read
  actions: read
  issues: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - name: Run deterministic activation tests
        run: |
          python -m py_compile experiments/training-continuation-train0014-ordinal18-activation-v1/*.py experiments/training-continuation-transport-v1/*.py
          python experiments/training-continuation-train0014-ordinal18-activation-v1/test_activation_v1.py
          python experiments/training-continuation-train0014-ordinal18-activation-v1/test_runtime_capture_v1.py
          python experiments/training-continuation-train0014-ordinal18-activation-v1/test_guards_v1.py
          python experiments/training-continuation-train0014-ordinal18-activation-v1/test_workflow_surface_v1.py
          python experiments/training-continuation-transport-v1/test_repository_bindings_v1.py
          python experiments/training-continuation-transport-v1/build_execution_manifest_v1.py --repository-root . --variant train0014 --preregistration review/train-0014-fresh-training-acquisition-v1/train-0014-fresh-training-acquisition-preregistration-v1.json --contract experiments/training-continuation-transport-v1/transport-contract.v1.json --analysis-contract experiments/training-continuation-transport-v1/analysis-contract.v1.json --output /tmp/manifest.json
          python - <<'PY2'
          import json
          m=json.load(open('/tmp/manifest.json')); f=json.load(open('experiments/training-continuation-train0014-ordinal18-activation-v1/execution-manifest.train0014.v1.json'))
          if m!=f or m.get('manifestSha256')!='493329bcaf941910fc6a33bf9364ff424875e88594028e5d6908b0d20e77699c': raise SystemExit('frozen execution manifest drift')
          PY2
      - name: Capture fresh global preauthorization preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/branches?per_page=100" > /tmp/branches.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" > /tmp/runs.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" > /tmp/artifacts.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/60/comments?per_page=100" > /tmp/comments.json
          python experiments/training-continuation-transport-v1/preauthorization_guard_v1.py --contract experiments/training-continuation-transport-v1/transport-contract.v1.json --variant train0014 --branches-pages /tmp/branches.json --runs-pages /tmp/runs.json --artifacts-pages /tmp/artifacts.json --issue-comments-pages /tmp/comments.json --source-seed-audit review/full-spectrum-estimator-pilot-v2/full-spectrum-estimator-pilot-seed-collision-audit-v4.json --confirmation-preregistration review/full-spectrum-estimator-confirmation-v1/full-spectrum-estimator-confirmation-preregistration-v1.json --output /tmp/preauthorization.train0014.json
          python - <<'PY2'
          import json
          p=json.load(open('/tmp/preauthorization.train0014.json'))
          if p.get('status')!='PREAUTHORIZATION_SURFACE_CLEAN_NOT_ALLOCATED' or p.get('latestConsumedScientificOrdinal')!=17 or p.get('nextAvailableScientificOrdinalIfAllocatedLater')!=18: raise SystemExit('ordinal18 no longer fresh')
          PY2
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: training-continuation-train0014-ordinal18-runtime-review
          create-args: -c conda-forge python=3.12.4 rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true
      - name: Verify expected runtime identity without syntax check or solver
        shell: micromamba-shell {0}
        run: |
          python experiments/mystic-batch-v1/runtime_probe.py --uvspec "$(command -v uvspec)" --data-dir "$CONDA_PREFIX/share/libRadtran/data" --atmosphere "$CONDA_PREFIX/share/libRadtran/data/atmmod/afglus.dat" --runtime-lock experiments/mystic-batch-v1/runtime-lock.micromamba.json --output /tmp/runtime-probe.json
          python experiments/training-continuation-train0014-ordinal18-activation-v1/runtime_capture_v1.py --probe /tmp/runtime-probe.json --expected experiments/training-continuation-train0014-ordinal18-activation-v1/expected-runtime-identity.v1.json --output /tmp/runtime-identity.json
      - uses: actions/upload-artifact@v4
        with:
          name: training-continuation-train0014-ordinal18-activation-review
          path: |
            /tmp/preauthorization.train0014.json
            /tmp/runtime-identity.json
            /tmp/manifest.json
          if-no-files-found: error
          retention-days: 90
