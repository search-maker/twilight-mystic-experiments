name: Training continuation train-0014 ordinal 18 execution
run-name: Training continuation train-0014 ordinal 18
on:
  push:
    branches:
      - dispatch/training-continuation-train0014-ordinal18
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read
concurrency:
  group: training-continuation-train0014-ordinal18-execution
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - name: Refuse wrong trigger, retry, or multi-file dispatch
        run: |
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF_NAME" = dispatch/training-continuation-train0014-ordinal18
          test "$GITHUB_RUN_ATTEMPT" = 1
          mapfile -t PARENTS < <(git cat-file -p "$GITHUB_SHA" | sed -n 's/^parent //p')
          test "${#PARENTS[@]}" = 1
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")
          test "${#CHANGED[@]}" = 1
          test "${CHANGED[0]}" = experiments/training-continuation-train0014-ordinal18-activation-v1/authorization.ordinal18.json
      - name: Capture live execution surface and successful exact-head authorization review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" > /tmp/live-main.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls?state=all&head=search-maker:authorization/training-continuation-train0014-ordinal18&per_page=100" > /tmp/prs.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/training-continuation-train0014-ordinal18-authorization-review.yml/runs?branch=authorization/training-continuation-train0014-ordinal18&event=pull_request&per_page=100" > /tmp/auth-runs.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/branches?per_page=100" > /tmp/branches.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" > /tmp/runs.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" > /tmp/artifacts.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/60/comments?per_page=100" > /tmp/comments.json
          if gh api "repos/${GITHUB_REPOSITORY}/contents/experiments/training-continuation-train0014-ordinal18-activation-v1/authorization.ordinal18.json?ref=main" >/dev/null 2>&1; then echo true >/tmp/main-auth.txt; else echo false >/tmp/main-auth.txt; fi
          python - <<'PY2'
          import json,os,subprocess
          from pathlib import Path
          prs=[p for page in json.load(open('/tmp/prs.json')) for p in page if p.get('head',{}).get('sha')==os.environ['GITHUB_SHA']]
          if len(prs)!=1: raise SystemExit('expected exactly one authorization PR for dispatch head')
          p=prs[0]; runs=json.load(open('/tmp/auth-runs.json')).get('workflow_runs',[]); good=[r for r in runs if r.get('head_sha')==os.environ['GITHUB_SHA'] and r.get('run_attempt')==1 and r.get('status')=='completed' and r.get('conclusion')=='success']
          if len(good)!=1: raise SystemExit('expected exactly one successful attempt-1 authorization review')
          live=json.load(open('/tmp/live-main.json'))['object']['sha']; parent=subprocess.check_output(['git','rev-parse',os.environ['GITHUB_SHA']+'^'],text=True).strip()
          def fl(p): return [x for page in json.load(open(p)) for x in page]
          def fo(p,k): return [x for page in json.load(open(p)) for x in page.get(k,[])]
          ctx={'eventName':os.environ['GITHUB_EVENT_NAME'],'runAttempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'refName':os.environ['GITHUB_REF_NAME'],'headSha':os.environ['GITHUB_SHA'],'dispatchBranchHeadSha':os.environ['GITHUB_SHA'],'liveMain':live,'authorizationParent':parent,'changedFiles':subprocess.check_output(['git','diff-tree','--no-commit-id','--name-only','-r',os.environ['GITHUB_SHA']],text=True).splitlines(),'pr':{'number':p['number'],'state':p['state'],'draft':p['draft'],'merged':p.get('merged_at') is not None,'headSha':p['head']['sha'],'headBranch':p['head']['ref'],'baseSha':p['base']['sha']},'authorizationReview':{'workflow':'.github/workflows/training-continuation-train0014-ordinal18-authorization-review.yml','headSha':good[0]['head_sha'],'prNumber':p['number'],'runAttempt':good[0]['run_attempt'],'status':good[0]['status'],'conclusion':good[0]['conclusion'],'scientificRuntimeSetupPerformed':False,'scientificExecutionPerformed':False},'branches':fl('/tmp/branches.json'),'runs':fo('/tmp/runs.json','workflow_runs'),'artifacts':fo('/tmp/artifacts.json','artifacts'),'issue60Comments':fl('/tmp/comments.json'),'currentRunId':int(os.environ['GITHUB_RUN_ID']),'mainAuthorizationPathPresent':Path('/tmp/main-auth.txt').read_text().strip()=='true'}
          Path('/tmp/context.json').write_text(json.dumps(ctx,indent=2,sort_keys=True)+'\n')
          PY2
          python experiments/training-continuation-train0014-ordinal18-activation-v1/execution_guard_v1.py --authorization experiments/training-continuation-train0014-ordinal18-activation-v1/authorization.ordinal18.json --contract experiments/training-continuation-train0014-ordinal18-activation-v1/activation-contract.v1.json --context /tmp/context.json --output /tmp/execution-guard.json
      - name: Rebuild exact frozen four-case manifest
        run: |
          mkdir -p preflight
          python experiments/training-continuation-transport-v1/build_execution_manifest_v1.py --repository-root . --variant train0014 --preregistration review/train-0014-fresh-training-acquisition-v1/train-0014-fresh-training-acquisition-preregistration-v1.json --contract experiments/training-continuation-transport-v1/transport-contract.v1.json --analysis-contract experiments/training-continuation-transport-v1/analysis-contract.v1.json --output preflight/execution-manifest.json
          cmp preflight/execution-manifest.json experiments/training-continuation-train0014-ordinal18-activation-v1/execution-manifest.train0014.v1.json
          cp experiments/training-continuation-train0014-ordinal18-activation-v1/authorization.ordinal18.json preflight/authorization.ordinal18.json
          cp experiments/training-continuation-train0014-ordinal18-activation-v1/expected-runtime-identity.v1.json preflight/expected-runtime-identity.v1.json
          cp experiments/training-continuation-transport-v1/analysis-contract.v1.json preflight/analysis-contract.v1.json
          cp /tmp/execution-guard.json preflight/execution-guard.json
      - id: matrix
        run: |
          python - <<'PY2'
          import json,os
          m=json.load(open('preflight/execution-manifest.json')); matrix={'include':[{'caseId':x['caseId']} for x in m['cases']]}; v=json.dumps(matrix,sort_keys=True,separators=(',',':'))
          if len(matrix['include'])!=4: raise SystemExit('case matrix drift')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('matrix='+v+'\n')
          PY2
      - uses: actions/upload-artifact@v4
        with:
          name: training-continuation-train0014-ordinal18-preflight
          path: preflight
          if-no-files-found: error
          retention-days: 90
  cases:
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: training-continuation-train0014-ordinal18-preflight
          path: preflight
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: training-continuation-train0014-ordinal18
          create-args: -c conda-forge python=3.12.4 rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true
      - name: Capture and bind exact runtime identity before syntax or solver
        shell: micromamba-shell {0}
        run: |
          python experiments/mystic-batch-v1/runtime_probe.py --uvspec "$(command -v uvspec)" --data-dir "$CONDA_PREFIX/share/libRadtran/data" --atmosphere "$CONDA_PREFIX/share/libRadtran/data/atmmod/afglus.dat" --runtime-lock experiments/mystic-batch-v1/runtime-lock.micromamba.json --output raw-runtime-probe.json
          python experiments/training-continuation-train0014-ordinal18-activation-v1/runtime_capture_v1.py --probe raw-runtime-probe.json --expected preflight/expected-runtime-identity.v1.json --output runtime-report.json
      - name: Execute one exact frozen train0014 block once
        shell: micromamba-shell {0}
        run: |
          python experiments/training-continuation-transport-v1/executor_v1.py --repository-root . --manifest preflight/execution-manifest.json --analysis-contract preflight/analysis-contract.v1.json --authorization preflight/authorization.ordinal18.json --runtime-report runtime-report.json --case-id '${{ matrix.caseId }}' --data-dir "$CONDA_PREFIX/share/libRadtran/data" --output-root case-output --uvspec "$(command -v uvspec)" --timeout-seconds 3600 --allow-execution
      - uses: actions/upload-artifact@v4
        with:
          name: training-continuation-train0014-case-${{ matrix.caseId }}
          path: case-output/${{ matrix.caseId }}
          if-no-files-found: error
          retention-days: 90
  aggregate:
    needs: [preflight,cases]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: training-continuation-train0014-ordinal18-preflight
          path: preflight
      - name: Download exact current-run four case artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p raw-cases zips
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" > artifacts.json
          python - <<'PY2'
          import json,os,subprocess
          from pathlib import Path
          arts=json.load(open('artifacts.json')).get('artifacts',[]); m=json.load(open('preflight/execution-manifest.json')); wanted={f"training-continuation-train0014-case-{c['caseId']}":c['caseId'] for c in m['cases']}; rows=[a for a in arts if a.get('name') in wanted]
          if len(rows)!=4 or len({a['name'] for a in rows})!=4: raise SystemExit('exact four case artifacts required')
          for a in rows:
              z=Path('zips')/(a['name']+'.zip')
              with z.open('wb') as f: subprocess.run(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{a['id']}/zip"],stdout=f,check=True)
              d=Path('raw-cases')/wanted[a['name']]; d.mkdir(); subprocess.run(['unzip','-q',str(z),'-d',str(d)],check=True)
          PY2
      - name: Normalize and analyze under frozen pre-result contract
        run: |
          python experiments/training-continuation-transport-v1/normalize_results_v1.py --repository-root . --manifest preflight/execution-manifest.json --raw-root raw-cases --contract preflight/analysis-contract.v1.json --output normalized-evidence.json
          python experiments/training-continuation-transport-v1/analyze_normalized_evidence_v1.py --evidence normalized-evidence.json --contract preflight/analysis-contract.v1.json --output analysis.json
          python - <<'PY2'
          import json
          a=json.load(open('analysis.json'))
          if a.get('status')!='ANALYZED_WITHOUT_DOWNSTREAM_ADMISSION' or a.get('result',{}).get('automaticTrainingAdmission') is not False or a.get('result',{}).get('valuesAdmittedAsTrainingLabels') is not False: raise SystemExit('downstream boundary drift')
          PY2
      - uses: actions/upload-artifact@v4
        with:
          name: training-continuation-train0014-ordinal18-analysis
          path: |
            normalized-evidence.json
            analysis.json
            artifacts.json
            preflight/execution-guard.json
          if-no-files-found: error
          retention-days: 90
