name: Training continuation train-0014 ordinal18 postprocess salvage v1
run-name: Training continuation train-0014 ordinal18 postprocess salvage v1

on:
  pull_request:
    paths:
      - .github/workflows/training-continuation-train0014-ordinal18-postprocess-salvage-v1.yml
  push:
    branches:
      - postprocess/training-continuation-train0014-ordinal18-salvage-v1

permissions:
  contents: read
  actions: read

concurrency:
  group: training-continuation-train0014-ordinal18-postprocess-salvage-v1
  cancel-in-progress: false

jobs:
  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - name: Prove artifact-only salvage surface
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/training-continuation-train0014-ordinal18-postprocess-salvage-v1.yml')
          text=p.read_text(encoding='utf-8')
          forbidden=(
              'mamba-'+'org/setup-micromamba',
              'uv'+'spec',
              'executor_'+'v1.py',
              '--allow-'+'execution',
              'workflow_'+'dispatch',
          )
          found=[x for x in forbidden if x in text]
          if found:
              raise SystemExit(f'forbidden execution/publication surface: {found}')
          required=(
              '31659053288',
              '52da7e06ef1d68a01cdcb68c62f124d34cac290c',
              '9165598893', '9165598618', '9165583752', '9165618945',
              'b53f6b0707b9868e30399e207e67327e6e826be75c9a25e31e2563f299266d7d',
              'c82bce260414d400c27d224331959171280f2de46ef594c4b6efba34bbfa82b6',
              'e6967d3de56c2b6faad753ee9eb391cf71af666ce915599aa1cf3ed36643987c',
              '9c0d15b53b12729c53d7dfe20e42788b745ef3b375a68c93073f68e2b352f649',
          )
          missing=[x for x in required if x not in text]
          if missing:
              raise SystemExit(f'frozen source identity missing: {missing}')
          PY
      - name: Run existing deterministic transport and repository-binding tests
        run: |
          python experiments/training-continuation-transport-v1/test_transport_and_analysis_v1.py
          python experiments/training-continuation-transport-v1/test_repository_bindings_v1.py

  salvage:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - name: Refuse wrong trigger, retry, branch drift, or code drift
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF_NAME" = postprocess/training-continuation-train0014-ordinal18-salvage-v1
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git hash-object experiments/training-continuation-transport-v1/normalize_results_v1.py)" = b2a20a9868936c9be3d51116828913f0eaa86c75
          test "$(git hash-object experiments/training-continuation-transport-v1/analyze_normalized_evidence_v1.py)" = b03d1e8d73df8b322f8461a80c630dc8a147a5fc
          test "$(git hash-object experiments/training-continuation-transport-v1/common_v1.py)" = 9979a4dc0bdf005fc12c0da52fa869c9af4b8fd1
          test "$(git hash-object experiments/training-continuation-train0014-ordinal18-activation-v1/execution-manifest.train0014.v1.json)" = 4dc94cf990fa4c4c5f1de8e9898ca617874ca72f
          test "$(git hash-object experiments/training-continuation-transport-v1/analysis-contract.v1.json)" = bdafa810b26cbd434cd70ff5fa385aaa49c0a21a
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" > live-main.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=postprocess/training-continuation-train0014-ordinal18-salvage-v1&event=push&per_page=100" > salvage-runs.json
          python - <<'PY'
          import json,os
          live=json.load(open('live-main.json'))['object']['sha']
          if live != os.environ['GITHUB_SHA']:
              raise SystemExit(f'postprocess branch is not exact live main: live={live} head={os.environ["GITHUB_SHA"]}')
          runs=json.load(open('salvage-runs.json')).get('workflow_runs',[])
          matching=[r for r in runs if r.get('head_sha')==os.environ['GITHUB_SHA'] and r.get('head_branch')=='postprocess/training-continuation-train0014-ordinal18-salvage-v1' and r.get('event')=='push']
          if len(matching)!=1 or int(matching[0].get('id') or 0)!=int(os.environ['GITHUB_RUN_ID']):
              raise SystemExit(f'expected exactly one current postprocess push run, got {[r.get("id") for r in matching]}')
          PY
      - name: Verify exact failed source run and successful four-case universe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/31659053288" > source-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/31659053288/jobs?per_page=100" > source-jobs.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/31659053288/artifacts?per_page=100" > source-artifacts.json
          python - <<'PY'
          import json
          from pathlib import Path
          run=json.loads(Path('source-run.json').read_text())
          expected={
              'status':'completed','conclusion':'failure','run_attempt':1,
              'head_branch':'dispatch/training-continuation-train0014-ordinal18',
              'head_sha':'52da7e06ef1d68a01cdcb68c62f124d34cac290c',
              'event':'push','path':'.github/workflows/training-continuation-train0014-ordinal18-execution.yml',
          }
          stale={k:(run.get(k),v) for k,v in expected.items() if run.get(k)!=v}
          if stale: raise SystemExit(f'source run identity drift: {stale}')
          jobs=json.loads(Path('source-jobs.json').read_text()).get('jobs',[])
          by_name={j.get('name'):j for j in jobs}
          if by_name.get('preflight',{}).get('id')!=94319800286 or by_name['preflight'].get('conclusion')!='success':
              raise SystemExit('source preflight identity/status drift')
          expected_cases={
              'cases (train-0014-fs-acquire-alis-600-t1)':94319960489,
              'cases (train-0014-fs-acquire-alis-600-t2)':94319960507,
              'cases (train-0014-fs-acquire-alis-600-t3)':94319960531,
              'cases (train-0014-fs-acquire-alis-600-t4)':94319960588,
          }
          for name,jid in expected_cases.items():
              j=by_name.get(name,{})
              if j.get('id')!=jid or j.get('conclusion')!='success':
                  raise SystemExit(f'source case job drift: {name}: {j.get("id")}/{j.get("conclusion")}')
          agg=by_name.get('aggregate',{})
          if agg.get('id')!=94320894457 or agg.get('conclusion')!='failure':
              raise SystemExit(f'source aggregate identity/status drift: {agg.get("id")}/{agg.get("conclusion")}')
          expected_artifacts={
              9165510128:('training-continuation-train0014-ordinal18-preflight','sha256:39daa0c52bb4a4639c9b875c73977ad4e13fa2596c0623e0a558c25109993064'),
              9165598893:('training-continuation-train0014-case-train-0014-fs-acquire-alis-600-t1','sha256:b53f6b0707b9868e30399e207e67327e6e826be75c9a25e31e2563f299266d7d'),
              9165598618:('training-continuation-train0014-case-train-0014-fs-acquire-alis-600-t2','sha256:c82bce260414d400c27d224331959171280f2de46ef594c4b6efba34bbfa82b6'),
              9165583752:('training-continuation-train0014-case-train-0014-fs-acquire-alis-600-t3','sha256:e6967d3de56c2b6faad753ee9eb391cf71af666ce915599aa1cf3ed36643987c'),
              9165618945:('training-continuation-train0014-case-train-0014-fs-acquire-alis-600-t4','sha256:9c0d15b53b12729c53d7dfe20e42788b745ef3b375a68c93073f68e2b352f649'),
          }
          rows=json.loads(Path('source-artifacts.json').read_text()).get('artifacts',[])
          observed={int(a['id']):(a.get('name'),a.get('digest')) for a in rows}
          if observed!=expected_artifacts:
              raise SystemExit(f'source artifact universe drift: {observed}')
          if any(a.get('expired') for a in rows):
              raise SystemExit('source artifact expired')
          for a in rows:
              wr=a.get('workflow_run') or {}
              if wr.get('id')!=31659053288 or wr.get('head_sha')!='52da7e06ef1d68a01cdcb68c62f124d34cac290c':
                  raise SystemExit(f'source artifact workflow identity drift: {a.get("id")}')
          PY
      - name: Download, digest-check, and stage exact immutable case artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifact-zips source-cases staging/raw-cases salvage
          python - <<'PY'
          import hashlib,json,os,subprocess,zipfile
          from pathlib import Path
          cases={
              'train-0014-fs-acquire-alis-600-t1':(9165598893,'b53f6b0707b9868e30399e207e67327e6e826be75c9a25e31e2563f299266d7d'),
              'train-0014-fs-acquire-alis-600-t2':(9165598618,'c82bce260414d400c27d224331959171280f2de46ef594c4b6efba34bbfa82b6'),
              'train-0014-fs-acquire-alis-600-t3':(9165583752,'e6967d3de56c2b6faad753ee9eb391cf71af666ce915599aa1cf3ed36643987c'),
              'train-0014-fs-acquire-alis-600-t4':(9165618945,'9c0d15b53b12729c53d7dfe20e42788b745ef3b375a68c93073f68e2b352f649'),
          }
          required={
              'case-result.json','prepared.json','input-resolved.txt','runtime-report.json','randomseed',
              'syntax-stdout.txt','syntax-stderr.txt','solver-stdout.txt','solver-stderr.txt','mc.rad.spc','mc.rad.std.spc',
          }
          ancillary={'mc.flx.is.spc','mc.flx.spc','mc.flx.std.spc','mc.is.spc','mc0.rad','mc0.rad.std'}
          expected=required|ancillary
          for case,(aid,digest) in cases.items():
              z=Path('artifact-zips')/(case+'.zip')
              with z.open('wb') as f:
                  subprocess.run(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/artifacts/{aid}/zip'],stdout=f,check=True)
              got=hashlib.sha256(z.read_bytes()).hexdigest()
              if got!=digest: raise SystemExit(f'ZIP digest drift {case}: {got}')
              with zipfile.ZipFile(z) as arc:
                  names=arc.namelist()
                  if len(names)!=len(set(names)) or set(names)!=expected:
                      raise SystemExit(f'exact 17-member source set drift {case}: {sorted(names)}')
                  if any('/' in n or '\\' in n for n in names):
                      raise SystemExit(f'unsafe ZIP member path: {case}')
                  src=Path('source-cases')/case; src.mkdir()
                  stage=Path('staging/raw-cases')/case; stage.mkdir(parents=True)
                  for name in sorted(names):
                      data=arc.read(name)
                      (src/name).write_bytes(data)
                      if name in required: (stage/name).write_bytes(data)
          def hashes(root):
              return [f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}' for p in sorted(Path(root).rglob('*')) if p.is_file()]
          Path('source-before.sha256').write_text('\n'.join(hashes('artifact-zips')+hashes('source-cases'))+'\n',encoding='utf-8')
          PY
      - name: Normalize and analyze existing evidence only under frozen contract
        run: |
          python experiments/training-continuation-transport-v1/normalize_results_v1.py \
            --repository-root . \
            --manifest experiments/training-continuation-train0014-ordinal18-activation-v1/execution-manifest.train0014.v1.json \
            --raw-root staging/raw-cases \
            --contract experiments/training-continuation-transport-v1/analysis-contract.v1.json \
            --output salvage/normalized-evidence.json
          python experiments/training-continuation-transport-v1/analyze_normalized_evidence_v1.py \
            --evidence salvage/normalized-evidence.json \
            --contract experiments/training-continuation-transport-v1/analysis-contract.v1.json \
            --output salvage/analysis.json
      - name: Independently verify result boundaries and seal salvage report
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          def canonical(value):
              return hashlib.sha256(json.dumps(value,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
          evp=Path('salvage/normalized-evidence.json'); ap=Path('salvage/analysis.json')
          ev=json.loads(evp.read_text()); a=json.loads(ap.read_text())
          if ev.get('status')!='NORMALIZED_ATTEMPT1_FRESH_EVIDENCE' or ev.get('variant')!='train0014' or ev.get('caseCount')!=4:
              raise SystemExit('normalized evidence identity/status drift')
          if ev.get('exactZeroPreserved') is not True or ev.get('epsilonSubstitutionUsed') is not False or ev.get('holdoutValuesRead') is not False:
              raise SystemExit('normalization boundary drift')
          if ev.get('evidenceSha256')!=canonical({k:v for k,v in ev.items() if k!='evidenceSha256'}):
              raise SystemExit('normalized evidence self-hash mismatch')
          if a.get('status')!='ANALYZED_WITHOUT_DOWNSTREAM_ADMISSION' or a.get('variant')!='train0014':
              raise SystemExit('analysis identity/status drift')
          if a.get('analysisSha256')!=canonical({k:v for k,v in a.items() if k!='analysisSha256'}):
              raise SystemExit('analysis self-hash mismatch')
          r=a.get('result') or {}
          if r.get('automaticTrainingAdmission') is not False or r.get('automaticExtension') is not False or r.get('valuesAdmittedAsTrainingLabels') is not False:
              raise SystemExit('analysis downstream boundary drift')
          if any(v is not False for v in (a.get('downstreamBoundary') or {}).values()):
              raise SystemExit('closed downstream boundary drift')
          report={
              'schemaVersion':1,
              'stageId':'training-continuation-train0014-ordinal18-postprocess-salvage-v1',
              'status':'AUDITED_POSTPROCESS_SALVAGE_COMPLETE',
              'sourceRunId':31659053288,
              'sourceRunAttempt':1,
              'sourceRunConclusion':'failure',
              'sourceHeadSha':'52da7e06ef1d68a01cdcb68c62f124d34cac290c',
              'sourceDispatchBranch':'dispatch/training-continuation-train0014-ordinal18',
              'sourceAggregateJobId':94320894457,
              'sourceAggregateConclusion':'failure',
              'sourceFailureClass':'POST_SOLVER_PACKAGING_NORMALIZATION_CONTRACT_DEFECT',
              'caseCount':4,
              'caseArtifactIds':[9165598893,9165598618,9165583752,9165618945],
              'normalizerGitBlob':'b2a20a9868936c9be3d51116828913f0eaa86c75',
              'analyzerGitBlob':'b03d1e8d73df8b322f8461a80c630dc8a147a5fc',
              'executionManifestSha256':'493329bcaf941910fc6a33bf9364ff424875e88594028e5d6908b0d20e77699c',
              'analysisContractSha256':'1f7dc8cc71beeb2b56a15a137f377317ae0de90de088ea429fc2eafedcc89c0c',
              'normalizedEvidenceRawSha256':hashlib.sha256(evp.read_bytes()).hexdigest(),
              'normalizedEvidenceSha256':ev['evidenceSha256'],
              'analysisRawSha256':hashlib.sha256(ap.read_bytes()).hexdigest(),
              'analysisSha256':a['analysisSha256'],
              'classification':r.get('classification'),
              'statistics':r.get('statistics'),
              'anyExactZeroPrimaryBlock':r.get('anyExactZeroPrimaryBlock'),
              'solverExecutionsPerformedBySalvage':0,
              'sourceArtifactsModified':False,
              'automaticTrainingAdmission':False,
              'valuesAdmittedAsTrainingLabels':False,
              'holdoutOpened':False,
              'modelFittingAuthorized':False,
              'modelSelectionAuthorized':False,
              'tier2Authorized':False,
              'productionPromotionAuthorized':False,
          }
          report['reportSha256']=canonical(report)
          Path('salvage/salvage-report.json').write_text(json.dumps(report,indent=2,sort_keys=True,allow_nan=False)+'\n',encoding='utf-8')
          PY
      - name: Re-prove source artifacts are byte-identical
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          def hashes(root):
              return [f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}' for p in sorted(Path(root).rglob('*')) if p.is_file()]
          Path('source-after.sha256').write_text('\n'.join(hashes('artifact-zips')+hashes('source-cases'))+'\n',encoding='utf-8')
          PY
          diff -u source-before.sha256 source-after.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: training-continuation-train0014-ordinal18-postprocess-salvage-v1
          path: |
            source-run.json
            source-jobs.json
            source-artifacts.json
            source-before.sha256
            source-after.sha256
            salvage/normalized-evidence.json
            salvage/analysis.json
            salvage/salvage-report.json
          if-no-files-found: error
          retention-days: 90
