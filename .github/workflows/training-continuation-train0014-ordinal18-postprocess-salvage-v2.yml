name: Training continuation train-0014 ordinal18 postprocess salvage v2
run-name: Training continuation train-0014 ordinal18 postprocess salvage v2

on:
  pull_request:
    paths:
      - .github/workflows/training-continuation-train0014-ordinal18-postprocess-salvage-v2.yml
  push:
    branches:
      - postprocess/training-continuation-train0014-ordinal18-salvage-v2

permissions:
  contents: read
  actions: read

concurrency:
  group: training-continuation-train0014-ordinal18-postprocess-salvage-v2
  cancel-in-progress: false

jobs:
  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - name: Prove artifact-only dual-fingerprint compatibility surface
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/training-continuation-train0014-ordinal18-postprocess-salvage-v2.yml')
          text=p.read_text(encoding='utf-8')
          forbidden=(
              'mamba-'+'org/setup-micromamba',
              'uv'+'spec',
              'executor_'+'v1.py',
              '--allow-'+'execution',
              'workflow_'+'dispatch',
          )
          found=[x for x in forbidden if x in text]
          if found:
              raise SystemExit(f'forbidden execution/publication surface: {found}')
          required=(
              '31659053288',
              '31660894426',
              '52da7e06ef1d68a01cdcb68c62f124d34cac290c',
              '64f994a0a32ea04b9073190f72ac0897e0f95ce5',
              '37be7d517bcd129f017048b4684b71bce03270da5ed48f90ff4ad95aa790aa25',
              '5eab27f6bad59ba4acfd9bcb98e357794b21fbc4de116e0f3747a663bedffd0f',
              '9165598893', '9165598618', '9165583752', '9165618945',
              'b53f6b0707b9868e30399e207e67327e6e826be75c9a25e31e2563f299266d7d',
              'c82bce260414d400c27d224331959171280f2de46ef594c4b6efba34bbfa82b6',
              'e6967d3de56c2b6faad753ee9eb391cf71af666ce915599aa1cf3ed36643987c',
              '9c0d15b53b12729c53d7dfe20e42788b745ef3b375a68c93073f68e2b352f649',
          )
          missing=[x for x in required if x not in text]
          if missing:
              raise SystemExit(f'frozen source/compatibility identity missing: {missing}')
          PY
      - name: Re-prove frozen preregistration dual fingerprint semantics
        run: |
          python review/train-0014-fresh-training-acquisition-v1/test_train0014_fresh_training_preregistration_v1.py
          python experiments/training-continuation-transport-v1/test_transport_and_analysis_v1.py
          python experiments/training-continuation-transport-v1/test_repository_bindings_v1.py

  salvage:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - name: Refuse wrong trigger, retry, branch drift, or code drift
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF_NAME" = postprocess/training-continuation-train0014-ordinal18-salvage-v2
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git hash-object experiments/training-continuation-transport-v1/normalize_results_v1.py)" = b2a20a9868936c9be3d51116828913f0eaa86c75
          test "$(git hash-object experiments/training-continuation-transport-v1/analyze_normalized_evidence_v1.py)" = b03d1e8d73df8b322f8461a80c630dc8a147a5fc
          test "$(git hash-object experiments/training-continuation-transport-v1/common_v1.py)" = 9979a4dc0bdf005fc12c0da52fa869c9af4b8fd1
          test "$(git hash-object review/full-spectrum-estimator-pilot-v2/normalize_full_spectrum_estimator_pilot_results_v6.py)" = 8fb7c9eae30e7f2b28fdf67291f682ae2770ea9c
          test "$(git hash-object review/full-spectrum-estimator-pilot-v2/normalize_full_spectrum_estimator_pilot_results_v7.py)" = fe45136d595e6039b355d68cd2a926259af0ac40
          test "$(git hash-object experiments/training-continuation-train0014-ordinal18-activation-v1/execution-manifest.train0014.v1.json)" = 4dc94cf990fa4c4c5f1de8e9898ca617874ca72f
          test "$(git hash-object experiments/training-continuation-transport-v1/analysis-contract.v1.json)" = bdafa810b26cbd434cd70ff5fa385aaa49c0a21a
          test "$(git hash-object review/train-0014-fresh-training-acquisition-v1/train-0014-fresh-training-acquisition-preregistration-v1.json)" = 2f75a2cd830d064c9dcd9d5bdbdfcb0df050fa28
          test "$(git hash-object .github/workflows/training-continuation-train0014-ordinal18-postprocess-salvage-v1.yml)" = 39131b0069cec882e0b601f462936f55fd7ecc55
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" > live-main.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=postprocess/training-continuation-train0014-ordinal18-salvage-v2&event=push&per_page=100" > salvage-v2-runs.json
          python - <<'PY'
          import json,os
          live=json.load(open('live-main.json'))['object']['sha']
          if live != os.environ['GITHUB_SHA']:
              raise SystemExit(f'postprocess v2 branch is not exact live main: live={live} head={os.environ["GITHUB_SHA"]}')
          runs=json.load(open('salvage-v2-runs.json')).get('workflow_runs',[])
          matching=[r for r in runs if r.get('head_sha')==os.environ['GITHUB_SHA'] and r.get('head_branch')=='postprocess/training-continuation-train0014-ordinal18-salvage-v2' and r.get('event')=='push']
          if len(matching)!=1 or int(matching[0].get('id') or 0)!=int(os.environ['GITHUB_RUN_ID']):
              raise SystemExit(f'expected exactly one current postprocess-v2 push run, got {[r.get("id") for r in matching]}')
          PY
      - name: Bind exact source science and terminal salvage-v1 refusal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/31659053288" > source-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/31659053288/jobs?per_page=100" > source-jobs.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/31659053288/artifacts?per_page=100" > source-artifacts.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/31660894426" > salvage-v1-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/31660894426/jobs?per_page=100" > salvage-v1-jobs.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/31660894426/artifacts?per_page=100" > salvage-v1-artifacts.json
          python - <<'PY'
          import json
          from pathlib import Path
          run=json.loads(Path('source-run.json').read_text())
          expected={
              'status':'completed','conclusion':'failure','run_attempt':1,
              'head_branch':'dispatch/training-continuation-train0014-ordinal18',
              'head_sha':'52da7e06ef1d68a01cdcb68c62f124d34cac290c',
              'event':'push','path':'.github/workflows/training-continuation-train0014-ordinal18-execution.yml',
          }
          stale={k:(run.get(k),v) for k,v in expected.items() if run.get(k)!=v}
          if stale: raise SystemExit(f'source run identity drift: {stale}')
          jobs=json.loads(Path('source-jobs.json').read_text()).get('jobs',[])
          by_name={j.get('name'):j for j in jobs}
          if by_name.get('preflight',{}).get('id')!=94319800286 or by_name['preflight'].get('conclusion')!='success':
              raise SystemExit('source preflight identity/status drift')
          expected_cases={
              'cases (train-0014-fs-acquire-alis-600-t1)':94319960489,
              'cases (train-0014-fs-acquire-alis-600-t2)':94319960507,
              'cases (train-0014-fs-acquire-alis-600-t3)':94319960531,
              'cases (train-0014-fs-acquire-alis-600-t4)':94319960588,
          }
          for name,jid in expected_cases.items():
              j=by_name.get(name,{})
              if j.get('id')!=jid or j.get('conclusion')!='success':
                  raise SystemExit(f'source case job drift: {name}: {j.get("id")}/{j.get("conclusion")}')
          agg=by_name.get('aggregate',{})
          if agg.get('id')!=94320894457 or agg.get('conclusion')!='failure':
              raise SystemExit(f'source aggregate identity/status drift: {agg.get("id")}/{agg.get("conclusion")}')
          expected_artifacts={
              9165510128:('training-continuation-train0014-ordinal18-preflight','sha256:39daa0c52bb4a4639c9b875c73977ad4e13fa2596c0623e0a558c25109993064'),
              9165598893:('training-continuation-train0014-case-train-0014-fs-acquire-alis-600-t1','sha256:b53f6b0707b9868e30399e207e67327e6e826be75c9a25e31e2563f299266d7d'),
              9165598618:('training-continuation-train0014-case-train-0014-fs-acquire-alis-600-t2','sha256:c82bce260414d400c27d224331959171280f2de46ef594c4b6efba34bbfa82b6'),
              9165583752:('training-continuation-train0014-case-train-0014-fs-acquire-alis-600-t3','sha256:e6967d3de56c2b6faad753ee9eb391cf71af666ce915599aa1cf3ed36643987c'),
              9165618945:('training-continuation-train0014-case-train-0014-fs-acquire-alis-600-t4','sha256:9c0d15b53b12729c53d7dfe20e42788b745ef3b375a68c93073f68e2b352f649'),
          }
          rows=json.loads(Path('source-artifacts.json').read_text()).get('artifacts',[])
          observed={int(a['id']):(a.get('name'),a.get('digest')) for a in rows}
          if observed!=expected_artifacts: raise SystemExit(f'source artifact universe drift: {observed}')
          if any(a.get('expired') for a in rows): raise SystemExit('source artifact expired')
          for a in rows:
              wr=a.get('workflow_run') or {}
              if wr.get('id')!=31659053288 or wr.get('head_sha')!='52da7e06ef1d68a01cdcb68c62f124d34cac290c':
                  raise SystemExit(f'source artifact workflow identity drift: {a.get("id")}')

          v1=json.loads(Path('salvage-v1-run.json').read_text())
          v1_expected={
              'status':'completed','conclusion':'failure','run_attempt':1,
              'head_branch':'postprocess/training-continuation-train0014-ordinal18-salvage-v1',
              'head_sha':'64f994a0a32ea04b9073190f72ac0897e0f95ce5',
              'event':'push','path':'.github/workflows/training-continuation-train0014-ordinal18-postprocess-salvage-v1.yml',
          }
          stale={k:(v1.get(k),v) for k,v in v1_expected.items() if v1.get(k)!=v}
          if stale: raise SystemExit(f'salvage-v1 run identity drift: {stale}')
          v1_jobs=json.loads(Path('salvage-v1-jobs.json').read_text()).get('jobs',[])
          salvage=[j for j in v1_jobs if j.get('name')=='salvage']
          if len(salvage)!=1 or salvage[0].get('id')!=94325301751 or salvage[0].get('conclusion')!='failure':
              raise SystemExit('salvage-v1 job identity/status drift')
          steps={s.get('name'):s.get('conclusion') for s in salvage[0].get('steps',[])}
          exact_steps={
              'Refuse wrong trigger, retry, branch drift, or code drift':'success',
              'Verify exact failed source run and successful four-case universe':'success',
              'Download, digest-check, and stage exact immutable case artifacts':'success',
              'Normalize and analyze existing evidence only under frozen contract':'failure',
              'Independently verify result boundaries and seal salvage report':'skipped',
              'Re-prove source artifacts are byte-identical':'skipped',
              'Run actions/upload-artifact@v4':'skipped',
          }
          stale={k:(steps.get(k),v) for k,v in exact_steps.items() if steps.get(k)!=v}
          if stale: raise SystemExit(f'salvage-v1 step evidence drift: {stale}')
          if json.loads(Path('salvage-v1-artifacts.json').read_text()).get('artifacts') not in ([],None):
              raise SystemExit('unexpected salvage-v1 output artifact appeared')
          PY
      - name: Download and stage exact immutable case artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifact-zips source-cases staging/raw-cases salvage
          python - <<'PY'
          import hashlib,os,subprocess,zipfile
          from pathlib import Path
          cases={
              'train-0014-fs-acquire-alis-600-t1':(9165598893,'b53f6b0707b9868e30399e207e67327e6e826be75c9a25e31e2563f299266d7d'),
              'train-0014-fs-acquire-alis-600-t2':(9165598618,'c82bce260414d400c27d224331959171280f2de46ef594c4b6efba34bbfa82b6'),
              'train-0014-fs-acquire-alis-600-t3':(9165583752,'e6967d3de56c2b6faad753ee9eb391cf71af666ce915599aa1cf3ed36643987c'),
              'train-0014-fs-acquire-alis-600-t4':(9165618945,'9c0d15b53b12729c53d7dfe20e42788b745ef3b375a68c93073f68e2b352f649'),
          }
          required={
              'case-result.json','prepared.json','input-resolved.txt','runtime-report.json','randomseed',
              'syntax-stdout.txt','syntax-stderr.txt','solver-stdout.txt','solver-stderr.txt','mc.rad.spc','mc.rad.std.spc',
          }
          ancillary={'mc.flx.is.spc','mc.flx.spc','mc.flx.std.spc','mc.is.spc','mc0.rad','mc0.rad.std'}
          expected=required|ancillary
          for case,(aid,digest) in cases.items():
              z=Path('artifact-zips')/(case+'.zip')
              with z.open('wb') as f:
                  subprocess.run(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/artifacts/{aid}/zip'],stdout=f,check=True)
              got=hashlib.sha256(z.read_bytes()).hexdigest()
              if got!=digest: raise SystemExit(f'ZIP digest drift {case}: {got}')
              with zipfile.ZipFile(z) as arc:
                  names=arc.namelist()
                  if len(names)!=len(set(names)) or set(names)!=expected:
                      raise SystemExit(f'exact 17-member source set drift {case}: {sorted(names)}')
                  if any('/' in n or '\\' in n for n in names): raise SystemExit(f'unsafe ZIP member path: {case}')
                  src=Path('source-cases')/case; src.mkdir()
                  stage=Path('staging/raw-cases')/case; stage.mkdir(parents=True)
                  for name in sorted(names):
                      data=arc.read(name); (src/name).write_bytes(data)
                      if name in required: (stage/name).write_bytes(data)
          def hashes(root):
              return [f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}' for p in sorted(Path(root).rglob('*')) if p.is_file()]
          Path('source-before.sha256').write_text('\n'.join(hashes('artifact-zips')+hashes('source-cases'))+'\n',encoding='utf-8')
          PY
      - name: Seal dual-fingerprint compatibility transform
        run: |
          python - <<'PY'
          from copy import deepcopy
          import hashlib,importlib.util,json,sys
          from pathlib import Path
          transport=Path('experiments/training-continuation-transport-v1').resolve()
          sys.path.insert(0,str(transport))
          from common_v1 import canon,git_blob_sha1,load,require,sha_file,verify_self
          repo=Path('.').resolve()
          manifest_path=repo/'experiments/training-continuation-train0014-ordinal18-activation-v1/execution-manifest.train0014.v1.json'
          prereg_path=repo/'review/train-0014-fresh-training-acquisition-v1/train-0014-fresh-training-acquisition-preregistration-v1.json'
          manifest=load(manifest_path); prereg=load(prereg_path)
          verify_self(manifest,'manifestSha256')
          require(manifest['manifestSha256']=='493329bcaf941910fc6a33bf9364ff424875e88594028e5d6908b0d20e77699c','original manifest identity drift')
          require(manifest.get('variant')=='train0014' and manifest.get('caseCount')==4,'manifest variant/case universe drift')
          pbare=dict(prereg); pbare['preregistrationSha256']=None
          require(prereg.get('preregistrationSha256')=='6cebee523f775d0814c563aecef0475b5d512b611b06e79a1f9adef089f7eaf0' and canon(pbare)==prereg['preregistrationSha256'],'preregistration identity/self-hash drift')
          src=prereg.get('sourceBindings') or {}
          template_fp='37be7d517bcd129f017048b4684b71bce03270da5ed48f90ff4ad95aa790aa25'
          physical_fp='5eab27f6bad59ba4acfd9bcb98e357794b21fbc4de116e0f3747a663bedffd0f'
          require(src.get('normalizedTemplatePhysicalFingerprintSha256')==template_fp,'prereg normalized-template fingerprint drift')
          require(src.get('physicalFingerprint')==physical_fp,'prereg physical fingerprint drift')
          v6_path=repo/'review/full-spectrum-estimator-pilot-v2/normalize_full_spectrum_estimator_pilot_results_v6.py'
          require(git_blob_sha1(v6_path)=='8fb7c9eae30e7f2b28fdf67291f682ae2770ea9c','v6 normalizer identity drift')
          spec=importlib.util.spec_from_file_location('salvage_v2_v6',v6_path)
          require(spec is not None and spec.loader is not None,'cannot load frozen v6 normalizer')
          v6=importlib.util.module_from_spec(spec); spec.loader.exec_module(v6)
          def template_norm(text):
              out=[]
              for line in text.splitlines():
                  if line.startswith('mc_randomseed '): line='mc_randomseed <SEED>'
                  elif line.startswith('mc_basename '): line='mc_basename <BASENAME>'
                  out.append(line)
              return '\n'.join(out)+'\n'
          prereg_cases={r['caseId']:r for r in prereg['caseDesign']['cases']}
          compat=deepcopy(manifest); transformed=[]
          for case in compat['cases']:
              cid=case['caseId']; original_case=next(r for r in manifest['cases'] if r['caseId']==cid); preg=prereg_cases.get(cid)
              require(preg is not None,'prereg case missing: '+cid)
              require(original_case.get('templatePhysicalFingerprintSha256')==template_fp,'manifest template fingerprint drift: '+cid)
              require(preg.get('templatePhysicalFingerprintSha256')==template_fp,'prereg case template fingerprint drift: '+cid)
              require(preg.get('templateSha256')==original_case.get('templateSha256'),'prereg/manifest template SHA drift: '+cid)
              tp=repo/original_case['templatePath']; require(tp.is_file(),'template path missing: '+cid)
              require(sha_file(tp)==original_case['templateSha256'],'template raw SHA drift: '+cid)
              require(hashlib.sha256(template_norm(tp.read_text(encoding='utf-8')).encode()).hexdigest()==template_fp,'normalized template SHA drift: '+cid)
              require(v6.physical_fingerprint(tp.read_bytes())==physical_fp,'template v6 physical fingerprint drift: '+cid)
              inp=repo/'staging/raw-cases'/cid/'input-resolved.txt'; require(inp.is_file(),'staged input missing: '+cid)
              require(v6.physical_fingerprint(inp.read_bytes())==physical_fp,'resolved input v6 physical fingerprint drift: '+cid)
              case['templatePhysicalFingerprintSha256']=physical_fp
              transformed.append({'caseId':cid,'field':'templatePhysicalFingerprintSha256','authoritativeManifestValue':template_fp,'compatibilityNormalizerValue':physical_fp})
          compat['manifestSha256']=canon({k:v for k,v in compat.items() if k!='manifestSha256'})
          verify_self(compat,'manifestSha256')
          # Prove the compatibility copy differs only in four named case fields plus its self-hash.
          restored=deepcopy(compat)
          for case in restored['cases']: case['templatePhysicalFingerprintSha256']=template_fp
          restored['manifestSha256']=manifest['manifestSha256']
          require(restored==manifest,'compatibility manifest changed an unauthorized field')
          report={
              'schemaVersion':1,
              'status':'SEALED_DUAL_FINGERPRINT_COMPATIBILITY_TRANSFORM',
              'authoritativeExecutionManifestSha256':manifest['manifestSha256'],
              'compatibilityNormalizerManifestSha256':compat['manifestSha256'],
              'preregistrationSha256':prereg['preregistrationSha256'],
              'normalizedTemplateFingerprintSha256':template_fp,
              'resolvedPhysicalFingerprintSha256':physical_fp,
              'frozenV6NormalizerGitBlob':'8fb7c9eae30e7f2b28fdf67291f682ae2770ea9c',
              'historicalSalvageV1RunId':31660894426,
              'historicalSalvageV1Conclusion':'failure',
              'scientificSolverReexecuted':False,
              'sourceArtifactsModified':False,
              'transformedFields':transformed,
          }
          report['reportSha256']=canon(report)
          Path('salvage/compatibility-manifest.json').write_text(json.dumps(compat,indent=2,sort_keys=True,allow_nan=False)+'\n',encoding='utf-8')
          Path('salvage/compatibility-transform.json').write_text(json.dumps(report,indent=2,sort_keys=True,allow_nan=False)+'\n',encoding='utf-8')
          PY
      - name: Normalize existing evidence with frozen normalizer under sealed compatibility manifest
        run: |
          python experiments/training-continuation-transport-v1/normalize_results_v1.py \
            --repository-root . \
            --manifest salvage/compatibility-manifest.json \
            --raw-root staging/raw-cases \
            --contract experiments/training-continuation-transport-v1/analysis-contract.v1.json \
            --output salvage/normalized-evidence.compat.json
      - name: Rebind evidence to authoritative original manifest and run frozen analysis
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('experiments/training-continuation-transport-v1').resolve()))
          from common_v1 import canon,load,require,verify_self
          original=load(Path('experiments/training-continuation-train0014-ordinal18-activation-v1/execution-manifest.train0014.v1.json'))
          verify_self(original,'manifestSha256')
          transform=load(Path('salvage/compatibility-transform.json'))
          require(transform.get('reportSha256')==canon({k:v for k,v in transform.items() if k!='reportSha256'}),'compatibility-transform self-hash mismatch')
          ev=load(Path('salvage/normalized-evidence.compat.json'))
          require(ev.get('executionManifestSha256')==transform['compatibilityNormalizerManifestSha256'],'compatibility evidence binding drift')
          require(ev.get('status')=='NORMALIZED_ATTEMPT1_FRESH_EVIDENCE' and ev.get('variant')=='train0014' and ev.get('caseCount')==4,'compatibility normalized evidence identity drift')
          ev['executionManifestSha256']=original['manifestSha256']
          ev['compatibilityAdapter']={
              'status':'DUAL_FINGERPRINT_INTERFACE_RECONCILED_WITHOUT_SCIENTIFIC_REEXECUTION',
              'authoritativeExecutionManifestSha256':original['manifestSha256'],
              'compatibilityNormalizerManifestSha256':transform['compatibilityNormalizerManifestSha256'],
              'compatibilityTransformSha256':transform['reportSha256'],
              'normalizedTemplateFingerprintSha256':transform['normalizedTemplateFingerprintSha256'],
              'resolvedPhysicalFingerprintSha256':transform['resolvedPhysicalFingerprintSha256'],
              'historicalSalvageV1RunId':31660894426,
              'scientificSolverReexecuted':False,
              'sourceArtifactsModified':False,
          }
          ev.pop('evidenceSha256',None); ev['evidenceSha256']=canon(ev)
          Path('salvage/normalized-evidence.json').write_text(json.dumps(ev,indent=2,sort_keys=True,allow_nan=False)+'\n',encoding='utf-8')
          PY
          python experiments/training-continuation-transport-v1/analyze_normalized_evidence_v1.py \
            --evidence salvage/normalized-evidence.json \
            --contract experiments/training-continuation-transport-v1/analysis-contract.v1.json \
            --output salvage/analysis.json
      - name: Independently verify result boundaries and seal salvage-v2 report
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          def canonical(value):
