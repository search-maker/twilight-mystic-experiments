name: Spillmann transient-adaptation audit v1

on:
  push:
    branches:
      - review/jerusalem-exact-event-mesopic-v1
    paths:
      - 'review/transient-adaptation-spillmann-audit-v1/run.mjs'
      - '.github/workflows/transient-adaptation-spillmann-audit-v1.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APPLICATION_SHA: 80110c8cb4575c7be3c91b4817be5126c40b2b15
      STARSVISIBILITY_READ_TOKEN: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require read-only application credential
        shell: bash
        run: test -n "${STARSVISIBILITY_READ_TOKEN:-}" || exit 78
      - uses: actions/checkout@v4
        with:
          repository: search-maker/starsvisibility
          ref: ${{ env.APPLICATION_SHA }}
          token: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}
          path: app
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.node-version
      - name: Run current transient model on published waning ramps
        run: >-
          node review/transient-adaptation-spillmann-audit-v1/run.mjs
          --app-root app
          --output diagnostic-output/transient-adaptation-spillmann-audit-v1.json
      - name: Assert no MYSTIC solver execution
        shell: bash
        run: |
          test ! -e diagnostic-output/uvspec.log
          test ! -e diagnostic-output/mc.rad.spc
          echo NO_MYSTIC_SOLVER_EXECUTION
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transient-adaptation-spillmann-audit-v1
          path: diagnostic-output/
          if-no-files-found: warn
          retention-days: 90
