name: Clean Jerusalem transient overlap diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/transient-overlap-clean-v1.yml'
      - 'review/transient-overlap-clean-v1/triple-transient-detail.mjs'
      - 'review/transient-overlap-clean-v1/sunset-depth-audit.mjs'
      - 'review/transient-overlap-clean-v1/ui-transformed-transient.mjs'

permissions:
  contents: read

jobs:
  audit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - label: tishrei-transient-overlap
          - label: tammuz-transient-overlap
    env:
      APPLICATION_SHA: d1c534822915c4668df9ef47ad17b7b771d56617
      STARSVISIBILITY_READ_TOKEN: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}
      CASE_LABEL: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Require read-only application credential
        run: test -n "${STARSVISIBILITY_READ_TOKEN:-}" || exit 78
      - name: Checkout exact starsvisibility PR111 head
        uses: actions/checkout@v4
        with:
          repository: search-maker/starsvisibility
          ref: ${{ env.APPLICATION_SHA }}
          token: ${{ secrets.STARSVISIBILITY_READ_TOKEN }}
          path: app
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.node-version
      - name: Build exact application and full Level-B regressions
        working-directory: app
        env:
          GITHUB_SHA: ${{ env.APPLICATION_SHA }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPLICATION_SHA"
          npm ci
          npm run build:pages
          grep -q 'LEVEL-B-THREE-STAR-DIRECT-CATALOG-HANDOFF-V3' dist/work-in-progress/index.html
          grep -q 'LEVEL-B-THREE-STAR-CATALOG-ONLY-WORKER-BYPASS-V1' dist/work-in-progress/index.html
          grep -q "fieldFactor: 3.14" scientific-tools/visibility-v3/level-b-current-main-adapter.mjs
          grep -q 'TRANSIENT_ADAPTATION_SENSITIVITY_TAU_SECONDS = Object.freeze(\[20, 30, 45, 60\])' scientific-tools/visibility-v3/transient-adaptation.mjs
          grep -q 'DEFAULT_TRANSIENT_ADAPTATION_TAU_SECONDS = 30' scientific-tools/visibility-v3/transient-adaptation.mjs
          grep -q 'INITIAL_CONTIGUOUS_COMMON_SKY_STELLAR_SUPPORT_ONLY_FAIL_CLOSED_AFTER_GAP_V2' scientific-tools/visibility-v3/level-b-transient-contiguous-support.mjs
          grep -q 'legacy-application-sunset-depth-relative-shape-anchored-at-level-b-2deg-v2' scientific-tools/visibility-v3/sunset-adaptation-prehistory.mjs
          grep -q 'sunDepressionAtSunsetDeg: hooks.sunDepressionAtSunsetDeg' dist/work-in-progress/index.html
      - name: Install Chromium
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Run focused triple, transformed-UI, and sunset-depth diagnostics
        run: |
          set -euo pipefail
          cp review/transient-overlap-clean-v1/triple-transient-detail.mjs app/triple-transient-detail.mjs
          cp review/transient-overlap-clean-v1/ui-transformed-transient.mjs app/ui-transformed-transient.mjs
          cp review/transient-overlap-clean-v1/sunset-depth-audit.mjs app/sunset-depth-audit.mjs
          python3 -m http.server 4173 --bind 127.0.0.1 --directory app/dist > "$RUNNER_TEMP/transient-overlap-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:4173/work-in-progress/ >/dev/null && break; sleep 0.2; done
          cd app
          node triple-transient-detail.mjs
          node ui-transformed-transient.mjs
          node sunset-depth-audit.mjs
      - name: Enforce removal of the old prehistory rejection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          label=os.environ['CASE_LABEL']
          root=Path(os.environ['RUNNER_TEMP'])
          triple=json.loads((root/'transient-triple-detail'/f'{label}.json').read_text())
          ui=json.loads((root/'transient-ui-transformed'/f'{label}.json').read_text())
          reasons=triple['audit']['reasonCounts']
          assert reasons.get('TRANSIENT_SUNSET_PREHISTORY_REJECTED',0)==0, ('triple',reasons)
          assert reasons.get('APPLICATION_SUNSET_SOLAR_DEPRESSION_REQUIRED_FOR_CONTINUOUS_ADAPTATION',0)==0, ('triple',reasons)
          ui_reasons=ui['payload']['reasonCounts']
          assert ui_reasons.get('TRANSIENT_SUNSET_PREHISTORY_REJECTED',0)==0, ('transformed-ui',ui_reasons)
          assert ui_reasons.get('APPLICATION_SUNSET_SOLAR_DEPRESSION_REQUIRED_FOR_CONTINUOUS_ADAPTATION',0)==0, ('transformed-ui',ui_reasons)
          dep=triple['audit']['applicationSunsetSunDepressionDeg']
          assert 0.82 < dep < 0.85, dep
          ui_dep=ui['payload']['hooksSunDepressionAtSunsetDeg']
          assert abs(ui_dep-dep)<1e-9, (dep,ui_dep)
          for row in triple['audit']['detailed']:
              prov=row.get('transientAdaptationPrehistoryProvenance')
              if prov is not None:
                  assert abs(prov['applicationSunsetSunDepressionDeg']-dep)<1e-9
                  assert prov['levelBSkyEvaluatedBelowSupport'] is False
                  assert prov['mysticV3ExtrapolatedBelowSupport'] is False
          assert ui['payload']['localRowCount'] < 9090, ui['payload']['localRowCount']
          assert ui['payload']['transientResultCount'] > 1000
          assert ui['payload']['directCatalogGlobalAfterFinally']=='deleted'
          assert ui['payload']['catalogOnlyFlagAfterFinally']=='deleted'
          print({'status':'PR111_POST_FIX_TRANSIENT_TRANSFORMED_UI_GATE_PASS','label':label,'sunsetDepressionDeg':dep,'tripleReasons':reasons,'uiReasons':ui_reasons,'uiThreeStar':ui['payload']['result']})
          PY
      - name: Upload triple detail evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transient-post-fix-triple-${{ matrix.label }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: ${{ runner.temp }}/transient-triple-detail/${{ matrix.label }}.json
      - name: Upload transformed-UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transient-post-fix-ui-${{ matrix.label }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: ${{ runner.temp }}/transient-ui-transformed/${{ matrix.label }}.json
      - name: Upload sunset-depth evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transient-post-fix-sunset-depth-${{ matrix.label }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: ${{ runner.temp }}/sunset-depth-audit/${{ matrix.label }}.json
