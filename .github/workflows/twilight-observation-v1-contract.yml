name: Twilight observation and integration v1 contract

on:
  pull_request:
    paths:
      - ".github/workflows/twilight-observation-v1-contract.yml"
      - "integration/twilight-observation-v1/**"
      - "tests/test_twilight_observation_v1.py"
  push:
    branches:
      - "agent/**"
    paths:
      - ".github/workflows/twilight-observation-v1-contract.yml"
      - "integration/twilight-observation-v1/**"
      - "tests/test_twilight_observation_v1.py"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - name: Run metadata, calibration, and visibility integration tests
        run: python -m unittest -v tests/test_twilight_observation_v1.py
      - name: Compile package
        run: >-
          python -m py_compile
          integration/twilight-observation-v1/observation_validator.py
          integration/twilight-observation-v1/calibration.py
          integration/twilight-observation-v1/visibility_api.py
      - name: Prove package cannot execute MYSTIC or access network
        run: |
          python - <<'PY'
          from pathlib import Path

          forbidden = (
              "subprocess",
              "urllib",
              "requests",
              "uvspec",
              "rte_solver",
              "workflow_dispatch",
          )
          for path in Path("integration/twilight-observation-v1").glob("*.py"):
              text = path.read_text().lower()
              for token in forbidden:
                  if token in text:
                      raise SystemExit(f"forbidden integration token {token!r} in {path}")
          PY
