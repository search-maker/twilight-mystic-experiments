name: Twilight surrogate tier-1 atm z grid candidate probe

on:
  pull_request:
    paths:
      - ".github/workflows/twilight-surrogate-tier-1-atm-z-grid-probe.yml"
      - "experiments/mystic-batch-v1/twilight_surrogate_tier1_atm_z_grid_probe.py"
      - "tests/test_twilight_surrogate_tier1_atm_z_grid_probe.py"
      - "experiments/mystic-batch-v1/runtime-lock.micromamba.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-contract-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - name: Test and compile bounded candidate probe
        run: |
          python -m unittest -v tests/test_twilight_surrogate_tier1_atm_z_grid_probe.py
          python -m py_compile \
            experiments/mystic-batch-v1/twilight_surrogate_tier1_atm_z_grid_probe.py \
            tests/test_twilight_surrogate_tier1_atm_z_grid_probe.py

  frozen-runtime-one-photon-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: twilight-surrogate-tier-1-atm-z-grid-probe-v1
          create-args: -c conda-forge python=3.12.4 rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true
      - name: Run one-photon executable-candidate probe
        shell: bash -el {0}
        run: |
          set -euo pipefail
          DATA_DIR="$CONDA_PREFIX/share/libRadtran/data"
          python experiments/mystic-batch-v1/twilight_surrogate_tier1_atm_z_grid_probe.py \
            --uvspec "$(command -v uvspec)" \
            --data-dir "$DATA_DIR" \
            --atmosphere "$DATA_DIR/atmmod/afglus.dat" \
            --solar-flux "$DATA_DIR/solar_flux/atlas_plus_modtran" \
            --runtime-lock experiments/mystic-batch-v1/runtime-lock.micromamba.json \
            --output-dir atm-z-grid-probe-output
      - name: Verify acceptance without equivalence or authorization claim
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('atm-z-grid-probe-output')
          report = json.loads((root / 'atm-z-grid-probe.json').read_text())
          assert report['status'] == 'FROZEN_RUNTIME_ACCEPTS_ATM_Z_GRID_SITE_ALTITUDE_CANDIDATE'
          assert report['candidateAcceptedByFrozenRuntime'] is True
          assert report['candidateMechanism'] == 'atm_z_grid_with_bottom_at_site_altitude_and_no_explicit_altitude'
          assert report['siteAltitudeKm'] == 0.357143
          assert report['forcedGridBottomKm'] == 0.357143
          assert report['explicitAltitudePresent'] is False
          assert report['mcElevationFilePresent'] is False
          assert report['localSurfaceZout'] == 0.0
          assert report['physicalEquivalenceEstablished'] is False
          assert report['authorizationPermitted'] is False
          assert report['ordinal2ScientificDispatchPermitted'] is False
          assert report['scientificDatasetProduced'] is False
          assert report['solverExecutionCount'] == 1
          assert report['mcPhotons'] == 1
          assert report['exitCode'] == 0
          assert report['generatedOutputFileCount'] > 0
          assert report['generatedOutputFilesPreserved'] is False
          input_text = (root / 'input-resolved.txt').read_text()
          assert '\naltitude ' not in '\n' + input_text
          assert '\nmc_elevation_file ' not in '\n' + input_text
          assert input_text.count('zout 0.000000') == 1
          assert input_text.count('atm_z_grid ') == 1
          assert not list(root.glob('mc*'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twilight-surrogate-tier-1-atm-z-grid-candidate-probe-v1
          path: atm-z-grid-probe-output
          if-no-files-found: error
          retention-days: 90
