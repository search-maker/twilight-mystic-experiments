name: Twilight surrogate tier-1 authorization proposal

on:
  workflow_run:
    workflows: ["Twilight surrogate tier-1 proposal"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_proposal_run_id:
        description: Successful Twilight surrogate tier-1 proposal workflow run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  proposal:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - name: Resolve exact source proposal run
        id: source
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
          else
            echo "run_id=${{ inputs.source_proposal_run_id }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Download exact tier-1 proposal artifact
        uses: actions/download-artifact@v4
        with:
          name: twilight-surrogate-tier-1-proposal-v1
          path: source-download
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize source files and fetch immutable metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p source-proposal source-meta source-audit authorization-proposal
          python - <<'PY'
          from pathlib import Path
          import shutil
          root = Path('source-download')
          target = Path('source-proposal')
          for name in ('tier-1-scientific-proposal.json', 'validated-reference-anchors.json', 'tier-1-readiness.json'):
              matches = list(root.rglob(name))
              if len(matches) != 1:
                  raise SystemExit(f'expected one {name}, found {len(matches)}')
              shutil.copy2(matches[0], target / name)
          PY
          gh api "repos/${{ github.repository }}/actions/runs/${{ steps.source.outputs.run_id }}" > source-meta/source-run.json
          gh api "repos/${{ github.repository }}/actions/runs/${{ steps.source.outputs.run_id }}/artifacts?per_page=100" > source-meta/source-artifacts.json
      - name: Reproduce exact source proposal audit
        run: >-
          python experiments/mystic-batch-v1/twilight_surrogate_tier1_source_audit.py
          --proposal source-proposal/tier-1-scientific-proposal.json
          --anchors source-proposal/validated-reference-anchors.json
          --readiness source-proposal/tier-1-readiness.json
          --source-run source-meta/source-run.json
          --source-artifacts source-meta/source-artifacts.json
          --output source-audit/source-proposal-audit.json
      - name: Generate exact ordinal-1 authorization proposal
        run: >-
          python experiments/mystic-batch-v1/twilight_surrogate_tier1_authorization_proposal.py
          --repository-root .
          --source-audit source-audit/source-proposal-audit.json
          --output authorization-proposal/tier1-authorization-proposal.json
      - name: Prove proposal workflow cannot execute science or fit a model
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/twilight-surrogate-tier-1-authorization-proposal.yml').read_text().lower()
          executable = workflow.split('- name: prove proposal workflow cannot execute science or fit a model', 1)[0]
          forbidden = ('setup-micromamba', 'scientific_case_executor.py', '--allow-execution', 'uvspec -c', 'rte_solver mystic', 'model.fit(', 'torch.optim', 'tensorflow')
          found = [token for token in forbidden if token in executable]
          if found:
              raise SystemExit(f'authorization proposal workflow has forbidden execution or training surface: {found}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: twilight-surrogate-tier-1-authorization-proposal-v1
          path: |
            authorization-proposal
            source-audit
          if-no-files-found: error
          retention-days: 90
