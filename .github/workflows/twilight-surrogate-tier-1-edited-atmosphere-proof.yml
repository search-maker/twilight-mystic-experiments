name: Twilight surrogate tier-1 edited atmosphere proof

on:
  pull_request:
    paths:
      - ".github/workflows/twilight-surrogate-tier-1-edited-atmosphere-proof.yml"
      - "experiments/mystic-batch-v1/twilight_surrogate_tier1_edited_atmosphere_proof.py"
      - "experiments/mystic-batch-v1/runtime-lock.micromamba.json"
      - "tests/test_twilight_surrogate_tier1_edited_atmosphere_proof.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-contract-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - name: Run edited-atmosphere proof tests
        run: |
          python -m unittest -v tests/test_twilight_surrogate_tier1_edited_atmosphere_proof.py
          python -m py_compile \
            experiments/mystic-batch-v1/twilight_surrogate_tier1_edited_atmosphere_proof.py \
            tests/test_twilight_surrogate_tier1_edited_atmosphere_proof.py

  frozen-runtime-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: twilight-surrogate-tier-1-edited-atmosphere-proof-v1
          create-args: -c conda-forge python=3.12.4 rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true
      - name: Run bounded deterministic equivalence and one-photon MYSTIC probe
        shell: bash -el {0}
        run: |
          set -euo pipefail
          DATA_DIR="$CONDA_PREFIX/share/libRadtran/data"
          python experiments/mystic-batch-v1/twilight_surrogate_tier1_edited_atmosphere_proof.py \
            --uvspec "$(command -v uvspec)" \
            --data-dir "$DATA_DIR" \
            --atmosphere "$DATA_DIR/atmmod/afglus.dat" \
            --solar-flux "$DATA_DIR/solar_flux/atlas_plus_modtran" \
            --runtime-lock experiments/mystic-batch-v1/runtime-lock.micromamba.json \
            --output-dir edited-atmosphere-proof-output
      - name: Verify conservative proof boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('edited-atmosphere-proof-output/edited-atmosphere-proof.json').read_text())
          assert report['status'] == 'EDITED_ATMOSPHERE_EXECUTABLE_AND_DETERMINISTIC_EQUIVALENCE_PASSED'
          assert report['siteAltitudeKm'] == 0.357143
          assert report['profileTransformation']['transformedMinimumAltitudeKm'] == 0.357143
          assert report['deterministicComparison']['maximumRelativeDifference'] <= report['deterministicComparison']['relativeTolerance']
          assert report['mysticProbe']['exitCode'] == 0
          assert report['mysticProbe']['mcPhotons'] == 1
          assert report['mysticProbe']['solverExecutionCount'] == 1
          assert report['mysticProbe']['generatedOutputFileCount'] > 0
          assert report['mysticProbe']['generatedOutputFilesPreserved'] is False
          assert report['scientificExecution'] is False
          assert report['scientificDatasetProduced'] is False
          assert report['surrogateTrainingUsePermitted'] is False
          assert report['authorizationPermitted'] is False
          assert report['ordinal2ScientificDispatchPermitted'] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twilight-surrogate-tier-1-edited-atmosphere-proof-v1
          path: edited-atmosphere-proof-output
          if-no-files-found: error
          retention-days: 90
