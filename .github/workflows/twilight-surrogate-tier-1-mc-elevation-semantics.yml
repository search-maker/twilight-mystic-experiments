name: Twilight surrogate tier-1 mc elevation semantics

on:
  pull_request:
    paths:
      - ".github/workflows/twilight-surrogate-tier-1-mc-elevation-semantics.yml"
      - "experiments/mystic-batch-v1/twilight_surrogate_tier1_mc_elevation_inventory.py"
      - "experiments/mystic-batch-v1/twilight_surrogate_tier1_mc_elevation_semantics_audit.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-primary-documentation-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: twilight-surrogate-tier-1-mc-elevation-semantics-v1
          create-args: -c conda-forge python=3.12.4 rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true
      - name: Preserve installed primary documentation and examples
        shell: bash -el {0}
        run: |
          set -euo pipefail
          python experiments/mystic-batch-v1/twilight_surrogate_tier1_mc_elevation_inventory.py \
            --uvspec "$(command -v uvspec)" \
            --prefix "$CONDA_PREFIX" \
            --output-dir mc-elevation-semantics-output
      - name: Audit documented mechanism boundary
        run: |
          python experiments/mystic-batch-v1/twilight_surrogate_tier1_mc_elevation_semantics_audit.py \
            --inventory-dir mc-elevation-semantics-output \
            --output mc-elevation-semantics-output/semantics-audit.json
      - name: Verify no equivalence, authorization, or dispatch claim
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('mc-elevation-semantics-output/semantics-audit.json').read_text())
          assert report['status'] == 'FORMAT_DEFINED_SITE_ALTITUDE_EQUIVALENCE_NOT_ESTABLISHED'
          assert report['mcElevationFileFormatDefined'] is True
          assert report['siteAltitudeEquivalenceEstablished'] is False
          assert report['scientificExecution'] is False
          assert report['solverExecutionCount'] == 0
          assert report['authorizationPermitted'] is False
          assert report['ordinal2ScientificDispatchPermitted'] is False
          PY
      - name: Compile audit code
        run: >-
          python -m py_compile
          experiments/mystic-batch-v1/twilight_surrogate_tier1_mc_elevation_inventory.py
          experiments/mystic-batch-v1/twilight_surrogate_tier1_mc_elevation_semantics_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twilight-surrogate-tier-1-mc-elevation-semantics-v1
          path: mc-elevation-semantics-output
          if-no-files-found: error
          retention-days: 90
