name: Twilight surrogate tier-1 ordinal-2 execution contract

on:
  pull_request:
    paths:
      - ".github/workflows/twilight-surrogate-tier-1-ordinal2-execution*.yml"
      - "experiments/mystic-batch-v1/authorization.twilight-surrogate-tier-1-ordinal2*.json"
      - "experiments/mystic-batch-v1/twilight_surrogate_tier1_ordinal2_*.py"
      - "tests/test_twilight_surrogate_tier1_ordinal2_execution_guard.py"
  push:
    branches: ["agent/**"]
    paths:
      - ".github/workflows/twilight-surrogate-tier-1-ordinal2-execution*.yml"
      - "experiments/mystic-batch-v1/authorization.twilight-surrogate-tier-1-ordinal2*.json"
      - "experiments/mystic-batch-v1/twilight_surrogate_tier1_ordinal2_*.py"
      - "tests/test_twilight_surrogate_tier1_ordinal2_execution_guard.py"

permissions:
  contents: read
  actions: read
  issues: read

env:
  AUTHORIZATION: experiments/mystic-batch-v1/authorization.twilight-surrogate-tier-1-ordinal2.json
  AUTHORIZATION_TEMPLATE: experiments/mystic-batch-v1/authorization.twilight-surrogate-tier-1-ordinal2-template.json
  EVIDENCE_BUNDLE: experiments/mystic-batch-v1/twilight_surrogate_tier1_ordinal2_evidence_bundle.py
  GUARD: experiments/mystic-batch-v1/twilight_surrogate_tier1_ordinal2_execution_guard.py
  PROPOSAL: experiments/mystic-batch-v1/twilight_surrogate_tier1_ordinal2_authorization_proposal.py
  READINESS_RUN_ID: "30946826336"
  COMBINED_PROOF_RUN_ID: "30946822822"
  SOURCE_AUDIT_RUN_ID: "30946825851"
  PROVENANCE_RUN_ID: "30946822824"

jobs:
  direct-contract-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - name: Test and compile ordinal-2 execution package
        run: |
          python -m unittest -v tests/test_twilight_surrogate_tier1_ordinal2_execution_guard.py
          python -m py_compile \
            "$EVIDENCE_BUNDLE" \
            "$GUARD" \
            "$PROPOSAL" \
            tests/test_twilight_surrogate_tier1_ordinal2_execution_guard.py
      - name: Prove authorization is disabled in preparation PR
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          active = json.loads(Path('experiments/mystic-batch-v1/authorization.twilight-surrogate-tier-1-ordinal2.json').read_text())
          template = json.loads(Path('experiments/mystic-batch-v1/authorization.twilight-surrogate-tier-1-ordinal2-template.json').read_text())
          assert active == template
          assert active['authorized'] is False
          assert active['scientificExecution'] is False
          assert active['scientificDiagnostic'] is False
          assert active['authorizationOrdinal'] == 0
          assert active['consumed'] is False
          assert active['exactAuthorizationParentCommit'] is None
          assert active['exactAuthorizationCommit'] is None
          PY
      - name: Prove manual one-shot workflow and fresh-seed manifest path
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/twilight-surrogate-tier-1-ordinal2-execution.yml')
          text = path.read_text()
          header = text.split('jobs:', 1)[0].lower()
          required = (
              'workflow_dispatch:',
              'run-name: mystic batch v1 | key=',
              'cancel-in-progress: false',
              'fail-fast: false',
              'ordinal2-manifest.json',
              'twilight-surrogate-tier-1-ordinal2-atm-z-grid-readiness-v1',
              'twilight-surrogate-tier-1-atm-z-grid-combined-spectral-proof-v3',
              'twilight-surrogate-tier-1-libradtran-source-audit-v1',
              'twilight-surrogate-tier-1-libradtran-provenance-recovery-v1',
              'duplicate_run_audit.py',
              'scientific_case_executor.py',
              '--allow-execution',
          )
          missing = [token for token in required if token not in text.lower()]
          assert not missing, missing
          forbidden = ('schedule:', 'repository_dispatch:', '\n  push:', '\n  pull_request:', 'workflow_run:')
          present = [token for token in forbidden if token in header]
          assert not present, present
          guard = text.index('Verify one-purpose ordinal-2 authorization and all evidence')
          duplicate = text.index('Refuse duplicate ordinal-2 execution marker')
          plan = text.index('Freeze exact 96-case ordinal-2 plan')
          solver = text.index('Execute one authorized ordinal-2 case')
          assert guard < duplicate < plan < solver
          assert 'preflight/evidence/ordinal2-manifest.json' in text
          assert 'source-proposal/tier-1-scientific-proposal.json' not in text
          PY

  exact-evidence-authorization-proposal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - name: Download exact frozen evidence packages
        uses: actions/download-artifact@v4
        with:
          name: twilight-surrogate-tier-1-ordinal2-atm-z-grid-readiness-v1
          path: downloads/readiness
          repository: ${{ github.repository }}
          run-id: ${{ env.READINESS_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: twilight-surrogate-tier-1-atm-z-grid-combined-spectral-proof-v3
          path: downloads/combined
          repository: ${{ github.repository }}
          run-id: ${{ env.COMBINED_PROOF_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: twilight-surrogate-tier-1-libradtran-source-audit-v1
          path: downloads/source-audit
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_AUDIT_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: twilight-surrogate-tier-1-libradtran-provenance-recovery-v1
          path: downloads/provenance
          repository: ${{ github.repository }}
          run-id: ${{ env.PROVENANCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch exact run, artifact, and issue metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p contract/metadata contract/evidence
          for item in \
            "readiness:$READINESS_RUN_ID" \
            "combined:$COMBINED_PROOF_RUN_ID" \
            "source-audit:$SOURCE_AUDIT_RUN_ID" \
            "provenance:$PROVENANCE_RUN_ID"
          do
            label="${item%%:*}"
            run_id="${item##*:}"
            gh api "repos/${{ github.repository }}/actions/runs/$run_id" > "contract/metadata/$label-run.json"
            gh api "repos/${{ github.repository }}/actions/runs/$run_id/artifacts?per_page=100" > "contract/metadata/$label-artifacts.json"
          done
          gh api "repos/${{ github.repository }}/issues/55/comments?per_page=100" > contract/issue-comments.json
      - name: Normalize and validate exact evidence without science
        run: |
          python "$EVIDENCE_BUNDLE" \
            --readiness-root downloads/readiness \
            --combined-root downloads/combined \
            --source-audit-root downloads/source-audit \
            --provenance-root downloads/provenance \
            --output-dir contract/evidence
          python "$PROPOSAL" \
            --repository-root . \
            --authorization-template "$AUTHORIZATION_TEMPLATE" \
            --active-authorization "$AUTHORIZATION" \
            --evidence-dir contract/evidence \
            --metadata-dir contract/metadata \
            --issue-comments contract/issue-comments.json \
            --output contract/authorization-proposal.json
      - name: Prove generated authorization is one-purpose and guard-valid
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          proposal = json.loads(Path('contract/authorization-proposal.json').read_text())
          assert proposal['status'] == 'PROPOSAL_ONLY_NOT_AUTHORIZATION'
          assert proposal['executionAuthorizedByProposal'] is False
          Path('experiments/mystic-batch-v1/authorization.twilight-surrogate-tier-1-ordinal2.json').write_text(
              json.dumps(proposal['authorization'], indent=2, sort_keys=True) + '\n'
          )
          PY
          git config user.email contract@example.invalid
          git config user.name "Ordinal-2 Contract"
          git add "$AUTHORIZATION"
          git commit -m "Ephemeral ordinal-2 authorization contract"
          AUTH_REF="$(git rev-parse HEAD)"
          python "$GUARD" \
            --repository-root . \
            --authorization "$AUTHORIZATION" \
            --authorization-template "$AUTHORIZATION_TEMPLATE" \
            --evidence-dir contract/evidence \
            --metadata-dir contract/metadata \
            --issue-comments contract/issue-comments.json \
            --authorization-ref "$AUTH_REF" \
            --execution-key twilight-surrogate-tier-1-v1:numerical:2 \
            --authorization-ordinal 2 \
            --output contract/authorization-guard.json \
            --contract-mode
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twilight-surrogate-tier-1-ordinal2-authorization-proposal-contract
          path: contract
          if-no-files-found: error
          retention-days: 90
