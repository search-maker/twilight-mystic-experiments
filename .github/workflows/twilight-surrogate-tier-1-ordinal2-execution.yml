name: Twilight surrogate tier-1 ordinal-2 scientific execution
run-name: MYSTIC batch v1 | key=${{ inputs.execution_key }} | auth=${{ inputs.authorization_ref }} | ordinal=${{ inputs.authorization_ordinal }}

on:
  workflow_dispatch:
    inputs:
      authorization_ref:
        description: Exact one-purpose ordinal-2 authorization commit SHA
        required: true
        type: string
      execution_key:
        description: Exact one-shot ordinal-2 execution key
        required: true
        type: string
      authorization_ordinal:
        description: Exact ordinal-2 authorization ordinal
        required: true
        type: string

permissions:
  contents: read
  actions: read
  issues: read

concurrency:
  group: twilight-surrogate-tier-1-ordinal2-${{ inputs.execution_key }}
  cancel-in-progress: false

env:
  AUTHORIZATION: experiments/mystic-batch-v1/authorization.twilight-surrogate-tier-1-ordinal2.json
  AUTHORIZATION_TEMPLATE: experiments/mystic-batch-v1/authorization.twilight-surrogate-tier-1-ordinal2-template.json
  EVIDENCE_BUNDLE: experiments/mystic-batch-v1/twilight_surrogate_tier1_ordinal2_evidence_bundle.py
  GUARD: experiments/mystic-batch-v1/twilight_surrogate_tier1_ordinal2_execution_guard.py
  DUPLICATE_RUN_AUDIT: experiments/mystic-batch-v1/duplicate_run_audit.py
  PLAN: experiments/mystic-batch-v1/twilight_surrogate_tier1_execution_plan.py
  EXECUTION_ADAPTER: experiments/mystic-batch-v1/twilight_surrogate_tier1_execution_adapter.py
  RUNTIME_PROBE: experiments/mystic-batch-v1/runtime_probe.py
  RUNTIME_LOCK: experiments/mystic-batch-v1/runtime-lock.micromamba.json
  EXECUTOR: experiments/mystic-batch-v1/scientific_case_executor.py
  AGGREGATE: experiments/mystic-batch-v1/scientific_aggregate.py
  AUDIT: experiments/mystic-batch-v1/scientific_audit.py
  ANALYSIS_DRIVER: experiments/mystic-batch-v1/twilight_surrogate_tier1_analysis.py
  READINESS_RUN_ID: "30946826336"
  COMBINED_PROOF_RUN_ID: "30946822822"
  SOURCE_AUDIT_RUN_ID: "30946825851"
  PROVENANCE_RUN_ID: "30946822824"

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      max_parallel: ${{ steps.plan.outputs.max_parallel }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.authorization_ref }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"

      - name: Download exact ordinal-2 readiness evidence
        uses: actions/download-artifact@v4
        with:
          name: twilight-surrogate-tier-1-ordinal2-atm-z-grid-readiness-v1
          path: downloads/readiness
          repository: ${{ github.repository }}
          run-id: ${{ env.READINESS_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download exact final combined mechanism proof
        uses: actions/download-artifact@v4
        with:
          name: twilight-surrogate-tier-1-atm-z-grid-combined-spectral-proof-v3
          path: downloads/combined
          repository: ${{ github.repository }}
          run-id: ${{ env.COMBINED_PROOF_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download exact source-drift audit
        uses: actions/download-artifact@v4
        with:
          name: twilight-surrogate-tier-1-libradtran-source-audit-v1
          path: downloads/source-audit
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_AUDIT_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download exact package-provenance recovery
        uses: actions/download-artifact@v4
        with:
          name: twilight-surrogate-tier-1-libradtran-provenance-recovery-v1
          path: downloads/provenance
          repository: ${{ github.repository }}
          run-id: ${{ env.PROVENANCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch immutable run, artifact, and governance metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p preflight/metadata preflight/evidence
          for item in \
            "readiness:$READINESS_RUN_ID" \
            "combined:$COMBINED_PROOF_RUN_ID" \
            "source-audit:$SOURCE_AUDIT_RUN_ID" \
            "provenance:$PROVENANCE_RUN_ID"
          do
            label="${item%%:*}"
            run_id="${item##*:}"
            gh api "repos/${{ github.repository }}/actions/runs/$run_id" > "preflight/metadata/$label-run.json"
            gh api "repos/${{ github.repository }}/actions/runs/$run_id/artifacts?per_page=100" > "preflight/metadata/$label-artifacts.json"
          done
          gh api "repos/${{ github.repository }}/issues/55/comments?per_page=100" > preflight/issue-comments.json

      - name: Normalize exact evidence files
        run: >-
          python "$EVIDENCE_BUNDLE"
          --readiness-root downloads/readiness
          --combined-root downloads/combined
          --source-audit-root downloads/source-audit
          --provenance-root downloads/provenance
          --output-dir preflight/evidence

      - name: Verify one-purpose ordinal-2 authorization and all evidence
        run: >-
          python "$GUARD"
          --repository-root .
          --authorization "$AUTHORIZATION"
          --authorization-template "$AUTHORIZATION_TEMPLATE"
          --evidence-dir preflight/evidence
          --metadata-dir preflight/metadata
          --issue-comments preflight/issue-comments.json
          --authorization-ref "${{ inputs.authorization_ref }}"
          --execution-key "${{ inputs.execution_key }}"
          --authorization-ordinal "${{ inputs.authorization_ordinal }}"
          --output preflight/authorization-guard.json

      - name: Refuse duplicate ordinal-2 execution marker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python "$DUPLICATE_RUN_AUDIT"
          --repository "${{ github.repository }}"
          --workflow twilight-surrogate-tier-1-ordinal2-execution.yml
          --current-run-id "${{ github.run_id }}"
          --execution-key "${{ inputs.execution_key }}"
          --authorization-ref "${{ inputs.authorization_ref }}"
          --authorization-ordinal "${{ inputs.authorization_ordinal }}"
          --token "$GH_TOKEN"
          --output preflight/duplicate-run-audit.json

      - name: Freeze exact 96-case ordinal-2 plan
        id: plan
        run: >-
          python "$PLAN"
          --manifest preflight/evidence/ordinal2-manifest.json
          --guard-report preflight/authorization-guard.json
          --adapter "$EXECUTION_ADAPTER"
          --runtime-lock "$RUNTIME_LOCK"
          --workflow .github/workflows/twilight-surrogate-tier-1-ordinal2-execution.yml
          --output preflight/plan.json
          --github-output "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twilight-surrogate-tier-1-ordinal2-execution-preflight
          path: preflight
          if-no-files-found: error
          retention-days: 90

  cases:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.preflight.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.authorization_ref }}
          fetch-depth: 2
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: twilight-surrogate-tier-1-ordinal2-v1
          create-args: -c conda-forge python=3.12.4 rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true
      - uses: actions/download-artifact@v4
        with:
          name: twilight-surrogate-tier-1-ordinal2-execution-preflight
          path: preflight
      - name: Recompute exact runtime identity
        shell: bash -el {0}
        run: |
          set -euo pipefail
          DATA_DIR="$CONDA_PREFIX/share/libRadtran/data"
          python "$RUNTIME_PROBE" \
            --uvspec "$(command -v uvspec)" \
            --data-dir "$DATA_DIR" \
            --atmosphere "$DATA_DIR/atmmod/afglus.dat" \
            --runtime-lock "$RUNTIME_LOCK" \
            --output "runtime-reports/${{ matrix.case_id }}/runtime-report.json"
      - name: Execute one authorized ordinal-2 case
        shell: bash -el {0}
        run: |
          set -euo pipefail
          DATA_DIR="$CONDA_PREFIX/share/libRadtran/data"
          python "$EXECUTOR" \
            --manifest preflight/evidence/ordinal2-manifest.json \
            --runtime-report "runtime-reports/${{ matrix.case_id }}/runtime-report.json" \
            --adapter "$EXECUTION_ADAPTER" \
            --case-id "${{ matrix.case_id }}" \
            --data-dir "$DATA_DIR" \
            --repository-root "$GITHUB_WORKSPACE" \
            --uvspec "$(command -v uvspec)" \
            --output-root case-output \
            --timeout-seconds "${{ matrix.timeout_seconds }}" \
            --allow-execution
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twilight-surrogate-tier-1-ordinal2-case-${{ matrix.case_id }}
          path: |
            case-output
            runtime-reports
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    needs: [preflight, cases]
    if: always() && needs.preflight.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.authorization_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - uses: actions/download-artifact@v4
        with:
          name: twilight-surrogate-tier-1-ordinal2-execution-preflight
          path: preflight
      - uses: actions/download-artifact@v4
        with:
          pattern: twilight-surrogate-tier-1-ordinal2-case-*
          path: case-artifacts
          merge-multiple: true
      - name: Aggregate exact ordinal-2 case set
        run: python "$AGGREGATE" --plan preflight/plan.json --cases-root case-artifacts --output-dir aggregate-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twilight-surrogate-tier-1-ordinal2-aggregate
          path: aggregate-output
          if-no-files-found: warn
          retention-days: 90

  audit:
    needs: [preflight, cases, aggregate]
    if: always() && needs.preflight.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.authorization_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - uses: actions/download-artifact@v4
        with:
          name: twilight-surrogate-tier-1-ordinal2-execution-preflight
          path: preflight
      - uses: actions/download-artifact@v4
        with:
          pattern: twilight-surrogate-tier-1-ordinal2-case-*
          path: case-artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: twilight-surrogate-tier-1-ordinal2-aggregate
          path: aggregate-output
      - name: Independently audit plan, cases, hashes, and statistics
        run: >-
          python "$AUDIT"
          --plan preflight/plan.json
          --cases-root case-artifacts
          --aggregate-dir aggregate-output
          --output audit-output/audit-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twilight-surrogate-tier-1-ordinal2-audit
          path: audit-output
          if-no-files-found: warn
          retention-days: 90

  analysis:
    needs: [preflight, cases, aggregate, audit]
    if: needs.aggregate.result == 'success' && needs.audit.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.authorization_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - uses: actions/download-artifact@v4
        with:
          name: twilight-surrogate-tier-1-ordinal2-execution-preflight
          path: preflight
      - uses: actions/download-artifact@v4
        with:
          pattern: twilight-surrogate-tier-1-ordinal2-case-*
          path: case-artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: twilight-surrogate-tier-1-ordinal2-aggregate
          path: aggregate-output
      - uses: actions/download-artifact@v4
        with:
          name: twilight-surrogate-tier-1-ordinal2-audit
          path: audit-output
      - name: Analyze precision without fitting a surrogate
        run: >-
          python "$ANALYSIS_DRIVER"
          --manifest preflight/evidence/ordinal2-manifest.json
          --cases-root case-artifacts
          --summary aggregate-output/batch-summary.json
          --audit audit-output/audit-report.json
          --output-dir analysis-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twilight-surrogate-tier-1-ordinal2-analysis
          path: analysis-output
          if-no-files-found: warn
          retention-days: 90
