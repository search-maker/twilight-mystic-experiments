name: Twilight surrogate tier-1 ordinal-2 readiness

on:
  pull_request:
    paths:
      - ".github/workflows/twilight-surrogate-tier-1-ordinal2-readiness.yml"
      - ".github/workflows/twilight-surrogate-tier-1-execution-contract.yml"
      - "experiments/mystic-batch-v1/twilight_surrogate_tier1_execution_adapter.py"
      - "experiments/mystic-batch-v1/twilight_surrogate_tier1_ordinal1_audit.py"
      - "experiments/mystic-batch-v1/twilight_surrogate_tier1_ordinal2_recovery.py"
      - "experiments/mystic-batch-v1/twilight_surrogate_tier1_execution_package.py"
      - "experiments/mystic-batch-v1/runtime-lock.micromamba.json"
      - "tests/test_tier1_site_altitude.py"
      - "tests/test_twilight_surrogate_tier1_recovery.py"
  push:
    branches: ["agent/**"]
    paths:
      - ".github/workflows/twilight-surrogate-tier-1-ordinal2-readiness.yml"
      - ".github/workflows/twilight-surrogate-tier-1-execution-contract.yml"
      - "experiments/mystic-batch-v1/twilight_surrogate_tier1_execution_adapter.py"
      - "experiments/mystic-batch-v1/twilight_surrogate_tier1_ordinal1_audit.py"
      - "experiments/mystic-batch-v1/twilight_surrogate_tier1_ordinal2_recovery.py"
      - "experiments/mystic-batch-v1/twilight_surrogate_tier1_execution_package.py"
      - "experiments/mystic-batch-v1/runtime-lock.micromamba.json"
      - "tests/test_tier1_site_altitude.py"
      - "tests/test_twilight_surrogate_tier1_recovery.py"

permissions:
  contents: read
  actions: read

env:
  SOURCE_PROPOSAL_RUN_ID: "30905632743"
  SOURCE_PROPOSAL_ARTIFACT_ID: "8890906227"
  SOURCE_PROPOSAL_ARTIFACT_DIGEST: "sha256:899507d315ae25db88babb3f610587fca24238e7a7000038eed009c7a14af9a0"
  ORDINAL1_RUN_ID: "30906913329"
  ORDINAL1_HEAD_SHA: "9ab74efabfd34799aeeb5c9220a84639861f739d"
  COMBINED_PROOF_RUN_ID: "30931968171"
  COMBINED_PROOF_ARTIFACT_ID: "8901527280"
  COMBINED_PROOF_ARTIFACT_DIGEST: "sha256:5abef9ffeff99600f0da67cb3138a060a24abf02945bcdb1e17cc62e9a9f0c96"

jobs:
  direct-contract-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - name: Test exact adapter and recovery contracts
        run: |
          python -m unittest -v \
            tests/test_tier1_site_altitude.py \
            tests/test_twilight_surrogate_tier1_recovery.py
          python -m py_compile \
            experiments/mystic-batch-v1/twilight_surrogate_tier1_execution_adapter.py \
            experiments/mystic-batch-v1/twilight_surrogate_tier1_ordinal1_audit.py \
            experiments/mystic-batch-v1/twilight_surrogate_tier1_ordinal2_recovery.py
      - name: Prove no authorization or dispatch surface
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base = Path('experiments/mystic-batch-v1')
          active = json.loads((base / 'authorization.twilight-surrogate-tier-1.json').read_text())
          template = json.loads((base / 'authorization.twilight-surrogate-tier-1-template.json').read_text())
          assert active == template
          assert active['authorized'] is False
          assert active['scientificExecution'] is False
          assert active['authorizationOrdinal'] == 0
          recovery = (base / 'twilight_surrogate_tier1_ordinal2_recovery.py').read_text()
          adapter = (base / 'twilight_surrogate_tier1_execution_adapter.py').read_text()
          assert 'authorizationPermitted": False' in recovery
          assert 'ordinal2ScientificDispatchPermitted": False' in recovery
          assert 'githubRerunPermitted": False' in recovery
          assert 'observerElevationMechanism": elevation_mechanism' in adapter
          assert 'atm_z_grid ' in adapter
          assert 'zout 0.000000' in adapter
          PY

  exact-artifact-and-runtime-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: twilight-surrogate-tier-1-ordinal2-readiness-v1
          create-args: >-
            -c conda-forge
            python=3.12.4
            rubin-libradtran=2.0.6=py312pl5321he9373c2_1
          cache-environment: true
          cache-downloads: true

      - name: Download exact source proposal
        uses: actions/download-artifact@v4
        with:
          name: twilight-surrogate-tier-1-proposal-v1
          path: source-proposal-download
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_PROPOSAL_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download exact passing combined proof
        uses: actions/download-artifact@v4
        with:
          name: twilight-surrogate-tier-1-atm-z-grid-combined-spectral-proof-v3
          path: combined-proof-download
          repository: ${{ github.repository }}
          run-id: ${{ env.COMBINED_PROOF_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download exact ordinal-1 preflight
        uses: actions/download-artifact@v4
        with:
          name: twilight-surrogate-tier-1-execution-preflight
          path: ordinal1-preflight-download
          repository: ${{ github.repository }}
          run-id: ${{ env.ORDINAL1_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download exact ordinal-1 cases
        uses: actions/download-artifact@v4
        with:
          pattern: twilight-surrogate-tier-1-case-*
          path: ordinal1-cases-download
          merge-multiple: true
          repository: ${{ github.repository }}
          run-id: ${{ env.ORDINAL1_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download exact ordinal-1 aggregate
        uses: actions/download-artifact@v4
        with:
          name: twilight-surrogate-tier-1-aggregate
          path: ordinal1-aggregate-download
          repository: ${{ github.repository }}
          run-id: ${{ env.ORDINAL1_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download exact ordinal-1 independent audit
        uses: actions/download-artifact@v4
        with:
          name: twilight-surrogate-tier-1-audit
          path: ordinal1-independent-audit-download
          repository: ${{ github.repository }}
          run-id: ${{ env.ORDINAL1_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bind immutable run and artifact metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p readiness/metadata
          gh api "repos/${{ github.repository }}/actions/runs/$SOURCE_PROPOSAL_RUN_ID" > readiness/metadata/source-run.json
          gh api "repos/${{ github.repository }}/actions/runs/$SOURCE_PROPOSAL_RUN_ID/artifacts?per_page=100" > readiness/metadata/source-artifacts.json
          gh api "repos/${{ github.repository }}/actions/runs/$ORDINAL1_RUN_ID" > readiness/metadata/ordinal1-run.json
          gh api "repos/${{ github.repository }}/actions/runs/$ORDINAL1_RUN_ID/artifacts?per_page=100" > readiness/metadata/ordinal1-artifacts.json
          gh api "repos/${{ github.repository }}/actions/runs/$COMBINED_PROOF_RUN_ID" > readiness/metadata/combined-run.json
          gh api "repos/${{ github.repository }}/actions/runs/$COMBINED_PROOF_RUN_ID/artifacts?per_page=100" > readiness/metadata/combined-artifacts.json
          python - <<'PY'
          import json, os
          from pathlib import Path

          root = Path('readiness/metadata')
          source_run = json.loads((root / 'source-run.json').read_text())
          ordinal_run = json.loads((root / 'ordinal1-run.json').read_text())
          combined_run = json.loads((root / 'combined-run.json').read_text())
          assert source_run['id'] == int(os.environ['SOURCE_PROPOSAL_RUN_ID'])
          assert source_run['conclusion'] == 'success'
          assert source_run['head_sha'] == '9ab74efabfd34799aeeb5c9220a84639861f739d'
          assert ordinal_run['id'] == int(os.environ['ORDINAL1_RUN_ID'])
          assert ordinal_run['head_sha'] == os.environ['ORDINAL1_HEAD_SHA']
          assert combined_run['id'] == int(os.environ['COMBINED_PROOF_RUN_ID'])
          assert combined_run['conclusion'] == 'success'

          def artifact(path, artifact_id, digest, name):
              rows = json.loads(path.read_text())['artifacts']
              matches = [row for row in rows if row['id'] == artifact_id]
              assert len(matches) == 1
              row = matches[0]
              assert row['name'] == name
              assert row['digest'] == digest
              assert row['expired'] is False

          artifact(
              root / 'source-artifacts.json',
              int(os.environ['SOURCE_PROPOSAL_ARTIFACT_ID']),
              os.environ['SOURCE_PROPOSAL_ARTIFACT_DIGEST'],
              'twilight-surrogate-tier-1-proposal-v1',
          )
          artifact(
              root / 'combined-artifacts.json',
              int(os.environ['COMBINED_PROOF_ARTIFACT_ID']),
              os.environ['COMBINED_PROOF_ARTIFACT_DIGEST'],
              'twilight-surrogate-tier-1-atm-z-grid-combined-spectral-proof-v3',
          )
          ordinal_rows = json.loads((root / 'ordinal1-artifacts.json').read_text())['artifacts']
          case_rows = [row for row in ordinal_rows if row['name'].startswith('twilight-surrogate-tier-1-case-')]
          assert len(case_rows) == 96
          assert len({row['name'] for row in case_rows}) == 96
          required = {
              'twilight-surrogate-tier-1-execution-preflight',
              'twilight-surrogate-tier-1-aggregate',
              'twilight-surrogate-tier-1-audit',
          }
          assert required <= {row['name'] for row in ordinal_rows}
          assert all(row['expired'] is False for row in case_rows)
          PY

      - name: Normalize exact immutable evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import shutil

          def one(root, name):
              rows = list(Path(root).rglob(name))
              if len(rows) != 1:
                  raise SystemExit(f'expected one {name} under {root}, found {len(rows)}')
              return rows[0]

          target = Path('readiness/normalized')
          target.mkdir(parents=True, exist_ok=True)
          for name in ('tier-1-scientific-proposal.json', 'validated-reference-anchors.json', 'tier-1-readiness.json'):
              shutil.copy2(one('source-proposal-download', name), target / name)
          shutil.copy2(
              one('combined-proof-download', 'atm-z-grid-equivalence-proof.json'),
              target / 'combined-proof.json',
          )
          shutil.copy2(
              one('ordinal1-aggregate-download', 'batch-summary.json'),
              target / 'ordinal1-batch-summary.json',
          )
          shutil.copy2(
              one('ordinal1-independent-audit-download', 'audit-report.json'),
              target / 'ordinal1-independent-audit.json',
          )
          preflight = Path('readiness/ordinal1-preflight')
          preflight.mkdir(parents=True, exist_ok=True)
          for name in ('plan.json', 'authorization-guard.json', 'duplicate-run-audit.json'):
              shutil.copy2(one('ordinal1-preflight-download', name), preflight / name)
          cases = list(Path('ordinal1-cases-download').rglob('case-result.json'))
          if len(cases) != 96:
              raise SystemExit(f'expected 96 ordinal-1 case results, found {len(cases)}')
          PY

      - name: Recompute ordinal-1 failure audit from exact artifacts
        run: >-
          python experiments/mystic-batch-v1/twilight_surrogate_tier1_ordinal1_audit.py
          --preflight readiness/ordinal1-preflight
          --cases-root ordinal1-cases-download
          --aggregate readiness/normalized/ordinal1-batch-summary.json
          --independent-audit readiness/normalized/ordinal1-independent-audit.json
          --output readiness/ordinal1-audit.json

      - name: Rebuild exact source manifest without science
        run: >-
          python experiments/mystic-batch-v1/twilight_surrogate_tier1_execution_package.py
          --proposal readiness/normalized/tier-1-scientific-proposal.json
          --pilot-manifest experiments/mystic-batch-v1/manifest.cross-geometry-pilot.proposal.json
          --output readiness/source-manifest.json

      - name: Freeze ordinal-2 recovery from exact proof and failure evidence
        run: >-
          python experiments/mystic-batch-v1/twilight_surrogate_tier1_ordinal2_recovery.py
          --manifest readiness/source-manifest.json
          --ordinal1-audit readiness/ordinal1-audit.json
          --combined-proof readiness/normalized/combined-proof.json
          --output-manifest readiness/ordinal2-manifest.json
          --output-report readiness/ordinal2-recovery-report.json

      - name: Recompute exact frozen runtime identity
        shell: bash -el {0}
        run: |
          set -euo pipefail
          DATA_DIR="$CONDA_PREFIX/share/libRadtran/data"
          python experiments/mystic-batch-v1/runtime_probe.py \
            --uvspec "$(command -v uvspec)" \
            --data-dir "$DATA_DIR" \
            --atmosphere "$DATA_DIR/atmmod/afglus.dat" \
            --runtime-lock experiments/mystic-batch-v1/runtime-lock.micromamba.json \
            --output readiness/runtime-report.json

      - name: Render representative exact ordinal-2 inputs only
        shell: bash -el {0}
        run: |
          set -euo pipefail
          DATA_DIR="$CONDA_PREFIX/share/libRadtran/data"
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path('experiments/mystic-batch-v1/twilight_surrogate_tier1_execution_adapter.py')
          spec = importlib.util.spec_from_file_location('tier1_adapter', path)
          assert spec and spec.loader
          adapter = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(adapter)
          manifest = Path('readiness/ordinal2-manifest.json')
          runtime = Path('readiness/runtime-report.json')
          data = Path(__import__('os').environ['CONDA_PREFIX']) / 'share/libRadtran/data'
          for case_id in (
              'train-0001-alis-b1',
              'train-0003-alis-b1',
              'train-0007-alis-b1',
              'train-0048-alis-b2',
          ):
              adapter.prepare_case(
                  manifest,
                  runtime,
                  case_id,
                  data,
                  Path('.').resolve(),
                  Path('readiness/rendered'),
              )
          PY

      - name: Verify all frozen invariants and exact adapter representation
        run: |
          python - <<'PY'
          import hashlib, json, math
          from pathlib import Path

          source = json.loads(Path('readiness/source-manifest.json').read_text())
          recovered = json.loads(Path('readiness/ordinal2-manifest.json').read_text())
          report = json.loads(Path('readiness/ordinal2-recovery-report.json').read_text())
          ordinal1 = json.loads(Path('readiness/ordinal1-audit.json').read_text())
          proof = json.loads(Path('readiness/normalized/combined-proof.json').read_text())

          assert ordinal1['status'] == 'ORDINAL_1_UNIFORMLY_FAILED_BEFORE_SCIENTIFIC_RESULT'
          assert ordinal1['validScientificCaseResultCount'] == 0
          assert ordinal1['authorizationConsumed'] is True
          assert ordinal1['githubRerunPermitted'] is False
          assert proof['proofPassed'] is True
          assert proof['mysticProbeDecision'] is True
          assert report['status'] == 'ORDINAL_2_RECOVERY_FROZEN_WITH_ATM_Z_GRID_PENDING_SEPARATE_AUTHORIZATION'
          assert report['geometryCount'] == 48
          assert report['caseCount'] == 96
          assert report['configuredMcPhotonsSum'] == 6960000000
          assert report['freshSeedCount'] == 96
          assert report['sourceSeedOverlapCount'] == 0
          assert report['observerElevationRepresentation'] == 'atm_z_grid'
          assert report['localSurfaceZoutKm'] == 0.0
          assert report['scientificExecution'] is False
          assert report['executionAuthorized'] is False
          assert report['authorizationPermitted'] is False
          assert report['ordinal2ScientificDispatchPermitted'] is False
          assert report['githubRerunPermitted'] is False

          assert len(source['geometries']) == len(recovered['geometries']) == 48
          assert len(source['cases']) == len(recovered['cases']) == 96
          assert source['geometries'] == recovered['geometries']
          for field in ('trainingGeometryIds', 'internalHoldoutGeometryIds', 'externalValidationAnchorIds', 'limits', 'frozenInputs', 'bindings', 'runtime'):
              assert source[field] == recovered[field]
          assert len(source['trainingGeometryIds']) == 39
          assert len(source['internalHoldoutGeometryIds']) == 9
          assert sum(case['photonHistories'] for case in recovered['cases']) == 6960000000
          assert {case['alisSpectralImportanceSamplingNm'] for case in recovered['cases']} == {500.0, 550.0, 600.0}
          old_seeds = {case['seed'] for case in source['cases']}
          new_seeds = {case['seed'] for case in recovered['cases']}
          assert len(old_seeds) == len(new_seeds) == 96
          assert not (old_seeds & new_seeds)
          for before, after in zip(source['cases'], recovered['cases']):
              assert {key for key in set(before) | set(after) if before.get(key) != after.get(key)} == {'seed'}

          geometry = {row['geometryId']: row for row in recovered['geometries']}
          cases = {row['caseId']: row for row in recovered['cases']}
          for prepared_path in sorted(Path('readiness/rendered').rglob('tier1-prepared.json')):
              prepared = json.loads(prepared_path.read_text())
              case = cases[prepared['caseId']]
              site_km = geometry[case['groupId']]['observerElevationM'] / 1000.0
              text = Path(prepared['inputPath']).read_text()
              lines = text.splitlines()
              grid_lines = [line for line in lines if line.startswith('atm_z_grid ')]
              assert len(grid_lines) == 1
              grid = [float(value) for value in grid_lines[0].split()[1:]]
              assert math.isclose(grid[0], site_km, rel_tol=0.0, abs_tol=5.1e-7)
              assert all(grid[index] < grid[index + 1] for index in range(len(grid) - 1))
              assert lines.count('zout 0.000000') == 1
              assert not any(line.startswith('altitude ') for line in lines)
              assert not any(line.startswith('mc_elevation_file ') for line in lines)
              assert lines.count('wavelength 380 780') == 1
              assert lines.count(f"mc_spectral_is {case['alisSpectralImportanceSamplingNm']:.1f}") == 1
              assert lines.count(f"mc_photons {case['photonHistories']}") == 1
              assert lines.count(f"mc_randomseed {case['seed']}") == 1
              assert prepared['observerElevationMechanism'] == 'atm_z_grid'
              assert prepared['zoutKmAboveLocalSurface'] == 0.0
              assert prepared['atmosphereGridLevelCount'] == len(grid)
              assert hashlib.sha256(text.encode()).hexdigest() == prepared['inputResolvedSha256']
          assert len(list(Path('readiness/rendered').rglob('tier1-prepared.json'))) == 4
          PY

      - name: Run exactly one syntax-only check on rendered Tier-1 input
        shell: bash -el {0}
        run: |
          set -euo pipefail
          INPUT="readiness/rendered/train-0001-alis-b1/input-resolved.txt"
          set +e
          "$(command -v uvspec)" -c < "$INPUT" \
            > readiness/syntax-stdout.txt \
            2> readiness/syntax-stderr.txt
          status=$?
          set -e
          printf '%s\n' "$status" > readiness/syntax-exit-code.txt
          test "$status" -eq 0
          test -z "$(find readiness/rendered -type f -name 'mc*' -print -quit)"

      - name: Write machine-readable readiness decision
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          result = {
              'schemaVersion': 1,
              'stageId': 'twilight-surrogate-tier-1-ordinal2-readiness-v1',
              'status': 'ORDINAL_2_ATM_Z_GRID_RECOVERY_READY_PENDING_SEPARATE_AUTHORIZATION_AND_SOURCE_PROVENANCE_DECISION',
              'sourceProposalRunId': 30905632743,
              'sourceProposalArtifactId': 8890906227,
              'ordinal1RunId': 30906913329,
              'combinedProofRunId': 30931968171,
              'combinedProofArtifactId': 8901527280,
              'geometryCount': 48,
              'caseCount': 96,
              'configuredMcPhotonsSum': 6960000000,
              'freshSeedCount': 96,
              'observerElevationRepresentation': 'atm_z_grid',
              'syntaxCheckCount': 1,
              'solverExecutionCount': 0,
              'scientificDatasetProduced': False,
              'scientificExecution': False,
              'authorizationPermitted': False,
              'ordinal2ScientificDispatchPermitted': False,
              'githubRerunPermitted': False,
              'sourceProvenanceAccepted': False,
              'surrogateTrainingAuthorized': False,
              'tier2Authorized': False,
              'productionModelReady': False,
              'hashes': {
                  'ordinal1Audit': sha('readiness/ordinal1-audit.json'),
                  'combinedProof': sha('readiness/normalized/combined-proof.json'),
                  'sourceManifest': sha('readiness/source-manifest.json'),
                  'ordinal2Manifest': sha('readiness/ordinal2-manifest.json'),
                  'ordinal2RecoveryReport': sha('readiness/ordinal2-recovery-report.json'),
                  'runtimeReport': sha('readiness/runtime-report.json'),
                  'executionAdapter': sha('experiments/mystic-batch-v1/twilight_surrogate_tier1_execution_adapter.py'),
                  'runtimeLock': sha('experiments/mystic-batch-v1/runtime-lock.micromamba.json'),
              },
              'boundary': 'readiness evidence only; exact immutable source/failure/proof artifacts plus one syntax check; no solver, authorization, dispatch, training, Tier-2, or production use',
          }
          Path('readiness/readiness-decision.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Upload complete readiness evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twilight-surrogate-tier-1-ordinal2-atm-z-grid-readiness-v1
          path: readiness
          if-no-files-found: error
          retention-days: 90
