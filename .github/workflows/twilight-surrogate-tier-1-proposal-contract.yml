name: Twilight surrogate tier-1 proposal contract

on:
  pull_request:
    paths:
      - ".github/workflows/twilight-surrogate-tier-1-proposal*.yml"
      - "experiments/model-readiness-v1/tier1_proposal.py"
      - "experiments/model-readiness-v1/reference_dataset_contract.py"
      - "experiments/model-readiness-v1/training_design.py"
      - "experiments/model-readiness-v1/training-design.proposal.json"
      - "experiments/model-readiness-v1/importance_policy.py"
      - "experiments/mystic-batch-v1/twilight_surrogate_tier1_source_audit.py"
      - "tests/test_tier1_proposal.py"
      - "tests/test_tier1_source_profiles.py"
      - "tests/test_tier1_soft_anchor.py"
  push:
    branches: ["agent/**"]
    paths:
      - ".github/workflows/twilight-surrogate-tier-1-proposal*.yml"
      - "experiments/model-readiness-v1/tier1_proposal.py"
      - "experiments/model-readiness-v1/reference_dataset_contract.py"
      - "experiments/model-readiness-v1/training_design.py"
      - "experiments/model-readiness-v1/training-design.proposal.json"
      - "experiments/model-readiness-v1/importance_policy.py"
      - "experiments/mystic-batch-v1/twilight_surrogate_tier1_source_audit.py"
      - "tests/test_tier1_proposal.py"
      - "tests/test_tier1_source_profiles.py"
      - "tests/test_tier1_soft_anchor.py"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - name: Test source profiles, hard-soft anchor isolation, and exact tier selection
        run: >-
          python -m unittest -v
          tests/test_tier1_proposal.py
          tests/test_tier1_source_profiles.py
          tests/test_tier1_soft_anchor.py
      - name: Compile proposal and source-audit packages
        run: >-
          python -m py_compile
          experiments/model-readiness-v1/tier1_proposal.py
          experiments/model-readiness-v1/reference_dataset_contract.py
          experiments/mystic-batch-v1/twilight_surrogate_tier1_source_audit.py
      - name: Prove workflow is proposal-only and cannot dispatch science
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow=Path('.github/workflows/twilight-surrogate-tier-1-proposal.yml').read_text().lower()
          executable=workflow.split('- name: prove proposal workflow cannot execute science or train a model',1)[0]
          header=workflow.split('jobs:',1)[0]
          required=(
              'workflow_run:',
              'workflow_dispatch:',
              '\n  push:',
              'branches: [main]',
              'tier1_proposal.py',
              'g01 precision artifact-only recovery',
              'cross-geometry-g01-precision-continuation-v1-recovery-analysis',
              '--source-pilot-manifest',
          )
          missing=[item for item in required if item not in executable]
          if missing:
              raise SystemExit(f'proposal workflow tokens missing: {missing}')
          forbidden_triggers=('schedule:','repository_dispatch:','\n  pull_request:')
          found=[item for item in forbidden_triggers if item in header]
          if found:
              raise SystemExit(f'forbidden trigger: {found}')
          forbidden=('setup-micromamba','scientific_case_executor.py','--allow-execution','uvspec -c','rte_solver mystic')
          found=[item for item in forbidden if item in executable]
          if found:
              raise SystemExit(f'scientific execution surface: {found}')
          PY
      - name: Prove tier-1 remains bounded, non-authorizing, and honest about g01
        run: |
          python - <<'PY'
          from pathlib import Path
          proposal=Path('experiments/model-readiness-v1/tier1_proposal.py').read_text()
          contract=Path('experiments/model-readiness-v1/reference_dataset_contract.py').read_text()
          audit=Path('experiments/mystic-batch-v1/twilight_surrogate_tier1_source_audit.py').read_text()
          required=(
              'len(geometries) != 48',
              'len(cases) != 96',
              '6_960_000_000',
              'authorizationRequired',
              'surrogateTrainingAutomaticallyAuthorized',
              'observationValidationRequired',
              'soft-diagnostic',
              'eligibleForModelAcceptance',
              'softDiagnosticsAreReportOnly',
              'G01_PERSISTENT_HIGH_VARIANCE',
          )
          combined=proposal+contract+audit
          missing=[item for item in required if item not in combined]
          if missing:
              raise SystemExit(f'tier-1 safety tokens missing: {missing}')
          PY
