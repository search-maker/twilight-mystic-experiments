name: Twilight surrogate tier-1 proposal contract
on:
  pull_request:
    paths:
      - ".github/workflows/twilight-surrogate-tier-1-proposal*.yml"
      - "experiments/model-readiness-v1/tier1_proposal.py"
      - "experiments/model-readiness-v1/reference_dataset_contract.py"
      - "experiments/model-readiness-v1/training_design.py"
      - "experiments/model-readiness-v1/training-design.proposal.json"
      - "experiments/model-readiness-v1/importance_policy.py"
      - "tests/test_tier1_proposal.py"
      - "tests/test_tier1_source_profiles.py"
  push:
    branches: ["agent/**"]
    paths:
      - ".github/workflows/twilight-surrogate-tier-1-proposal*.yml"
      - "experiments/model-readiness-v1/tier1_proposal.py"
      - "experiments/model-readiness-v1/reference_dataset_contract.py"
      - "experiments/model-readiness-v1/training_design.py"
      - "experiments/model-readiness-v1/training-design.proposal.json"
      - "experiments/model-readiness-v1/importance_policy.py"
      - "tests/test_tier1_proposal.py"
      - "tests/test_tier1_source_profiles.py"
permissions: {contents: read}
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12.4"}
      - name: Test source profiles, anchor isolation, and exact tier selection
        run: python -m unittest -v tests/test_tier1_proposal.py tests/test_tier1_source_profiles.py
      - name: Compile proposal package
        run: python -m py_compile experiments/model-readiness-v1/tier1_proposal.py experiments/model-readiness-v1/reference_dataset_contract.py
      - name: Prove workflow is proposal-only and cannot dispatch science
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow=Path('.github/workflows/twilight-surrogate-tier-1-proposal.yml').read_text().lower();executable=workflow.split('- name: prove proposal workflow cannot execute science or train a model',1)[0];header=workflow.split('jobs:',1)[0]
          required=('workflow_run:','workflow_dispatch:','tier1_proposal.py','cross-geometry-timeout-continuation-v1-analysis','g01-fixed-precision-diagnosis-execution-v1-analysis')
          missing=[x for x in required if x not in executable]
          if missing: raise SystemExit(f'proposal workflow tokens missing: {missing}')
          forbidden_triggers=('schedule:','repository_dispatch:','\n  push:','\n  pull_request:')
          found=[x for x in forbidden_triggers if x in header]
          if found: raise SystemExit(f'forbidden trigger: {found}')
          forbidden=('setup-micromamba','scientific_case_executor.py','--allow-execution','uvspec -c','rte_solver mystic')
          found=[x for x in forbidden if x in executable]
          if found: raise SystemExit(f'scientific execution surface: {found}')
          PY
      - name: Prove tier-1 remains bounded and non-authorizing
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('experiments/model-readiness-v1/tier1_proposal.py').read_text()
          required=('len(geometries)!=48','len(cases)!=96','6_960_000_000','authorizationRequired','surrogateTrainingAutomaticallyAuthorized','observationValidationRequired')
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit(f'tier-1 safety tokens missing: {missing}')
          PY
