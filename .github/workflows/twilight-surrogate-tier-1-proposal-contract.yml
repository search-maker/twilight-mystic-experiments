name: Twilight surrogate tier-1 proposal contract

on:
  pull_request:
    paths:
      - ".github/workflows/twilight-surrogate-tier-1-proposal*.yml"
      - "experiments/model-readiness-v1/tier1_proposal.py"
      - "experiments/model-readiness-v1/reference_dataset_contract.py"
      - "experiments/model-readiness-v1/training_design.py"
      - "experiments/model-readiness-v1/training-design.proposal.json"
      - "experiments/model-readiness-v1/importance_policy.py"
      - "tests/test_tier1_proposal.py"
  push:
    branches: ["agent/**"]
    paths:
      - ".github/workflows/twilight-surrogate-tier-1-proposal*.yml"
      - "experiments/model-readiness-v1/tier1_proposal.py"
      - "experiments/model-readiness-v1/reference_dataset_contract.py"
      - "experiments/model-readiness-v1/training_design.py"
      - "experiments/model-readiness-v1/training-design.proposal.json"
      - "experiments/model-readiness-v1/importance_policy.py"
      - "tests/test_tier1_proposal.py"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - name: Test source refusal, anchor isolation, and exact tier selection
        run: python -m unittest -v tests/test_tier1_proposal.py
      - name: Compile proposal package
        run: python -m py_compile experiments/model-readiness-v1/tier1_proposal.py
      - name: Prove workflow is proposal-only and cannot dispatch science
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/twilight-surrogate-tier-1-proposal.yml').read_text().lower()
          header = workflow.split('jobs:', 1)[0]
          required = ('workflow_run:', 'workflow_dispatch:', 'tier1_proposal.py', 'cross-geometry-timeout-continuation-v1-analysis')
          missing = [token for token in required if token not in workflow]
          if missing:
              raise SystemExit(f'proposal workflow tokens missing: {missing}')
          forbidden_triggers = ('schedule:', 'repository_dispatch:', '\n  push:', '\n  pull_request:')
          present = [token for token in forbidden_triggers if token in header]
          if present:
              raise SystemExit(f'proposal workflow has forbidden trigger: {present}')
          forbidden = ('setup-micromamba', 'scientific_case_executor.py', '--allow-execution', 'uvspec -c', 'rte_solver mystic')
          present = [token for token in forbidden if token in workflow]
          if present:
              raise SystemExit(f'proposal workflow has scientific execution surface: {present}')
          PY
      - name: Prove tier-1 remains bounded and non-authorizing
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('experiments/model-readiness-v1/tier1_proposal.py').read_text()
          required = ('len(geometries) != 48', 'len(cases) != 96', '6_960_000_000', 'authorizationRequired', 'surrogateTrainingAutomaticallyAuthorized', 'observationValidationRequired')
          missing = [token for token in required if token not in text]
          if missing:
              raise SystemExit(f'tier-1 safety tokens missing: {missing}')
          PY
