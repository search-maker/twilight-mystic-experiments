name: Twilight sampling and surrogate v1 contract

on:
  pull_request:
    paths:
      - ".github/workflows/twilight-surrogate-v1-contract.yml"
      - "modeling/twilight-surrogate-v1/**"
      - "tests/test_twilight_surrogate_v1.py"
  push:
    branches:
      - "agent/**"
    paths:
      - ".github/workflows/twilight-surrogate-v1-contract.yml"
      - "modeling/twilight-surrogate-v1/**"
      - "tests/test_twilight_surrogate_v1.py"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - name: Run synthetic allocation, split, surrogate, and selector tests
        run: python -m unittest -v tests/test_twilight_surrogate_v1.py
      - name: Compile package
        run: >-
          python -m py_compile
          modeling/twilight-surrogate-v1/two_stage_allocator.py
          modeling/twilight-surrogate-v1/split.py
          modeling/twilight-surrogate-v1/surrogate.py
          modeling/twilight-surrogate-v1/adaptive_baseline.py
      - name: Prove package cannot execute radiative transfer
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = list(Path("modeling/twilight-surrogate-v1").glob("*.py"))
          forbidden = (
              "subprocess.run",
              "subprocess.popen",
              "os.system",
              "command -v uvspec",
              "rte_solver mystic",
              "workflow_dispatch",
          )
          for path in paths:
              text = path.read_text().lower()
              for token in forbidden:
                  if token in text:
                      raise SystemExit(f"forbidden execution token {token!r} in {path}")
          PY
