name: Worker-B v3 exact-head verification v1

on:
  pull_request:
    paths:
      - review/worker-b-v3-exact-head-verification-v1/**
      - .github/workflows/worker-b-v3-exact-head-verification-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  exact-app-head-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download canonical validated surrogate package only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api /repos/${GITHUB_REPOSITORY}/actions/artifacts/9259468043/zip > /tmp/level-b-v3-package.zip
      - name: Verify package to exact application snapshot binding
        run: |
          python review/worker-b-v3-exact-head-verification-v1/verify_v1.py \
            --package /tmp/level-b-v3-package.zip \
            --snapshot review/worker-b-v3-exact-head-verification-v1/snapshot
      - name: Run exact application validated-v3 provider test
        run: |
          node review/worker-b-v3-exact-head-verification-v1/snapshot/tests/test-validated-v3-sky-provider.mjs
      - name: Prove review-only boundary
        run: |
          python - <<'PY'
          import json, pathlib
          c=json.loads(pathlib.Path('review/worker-b-v3-exact-head-verification-v1/contract-v1.json').read_text())
          assert c['status']=='REVIEW_ONLY_EXACT_APP_HEAD_VERIFICATION_NO_SCIENCE_NO_PRODUCTION'
          v=c['verification']
          assert v['protectedValidationValuesRead'] is False
          assert v['mysticExecutionAllowed'] is False
          assert v['newScientificOrdinalAllowed'] is False
          assert v['retuningAllowed'] is False
          assert v['productionActivationAllowed'] is False
          assert v['applicationMergeAuthorizedByThisReview'] is False
          print('review-only boundary: PASS')
          PY
