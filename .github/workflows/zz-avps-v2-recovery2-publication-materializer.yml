name: Temporary AVPS recovery2 publication materializer

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - dispatch-triggers/avps-v2-postconsumption-recovery2-publication-materialize.txt

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: temporary-avps-recovery2-publication-materializer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Materialize exact already-reviewed recovery2 bytes
        shell: bash
        run: |
          set -euo pipefail
          BASE='${{ github.event.pull_request.base.sha }}'
          TRIGGER=dispatch-triggers/avps-v2-postconsumption-recovery2-publication-materialize.txt
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "${{ github.event.pull_request.base.ref }}" = main
          test "${{ github.event.pull_request.head.ref }}" = review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-publication-v1
          test "$(git diff --name-only "$BASE...HEAD")" = "$TRIGGER"
          test "$(git rev-parse "$BASE:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-implementation-generator-v1/generate_recovery_workflows.py")" = d70928d3f820e6a991ba539064227485bbef3aa9
          test -z "$(command -v uvspec || true)"
          for p in \
            .github/workflows/avps-v2-postconsumption-recovery2-science.yml \
            .github/workflows/avps-v2-postconsumption-recovery2-dispatch-publisher.yml \
            .github/workflows/avps-v2-postconsumption-recovery2-publisher-trigger-bridge.yml; do
            if git cat-file -e "$BASE:$p" 2>/dev/null; then
              echo "candidate already present on base: $p" >&2; exit 1
            fi
          done

          python review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-implementation-generator-v1/generate_recovery_workflows.py
          test "$(sha256sum generated-avps-v2-recovery2/avps-v2-postconsumption-recovery2-science.yml | cut -d' ' -f1)" = 0c893ede91d3c639acffc9a0d6550841f521a87c248a66c514366a2aaa7bad9d
          test "$(sha256sum generated-avps-v2-recovery2/avps-v2-postconsumption-recovery2-dispatch-publisher.yml | cut -d' ' -f1)" = 40831c4119b872dd2e1f17df92c2dda8e0c42d5d9c5883599a6b6b8f01c0d557
          test "$(sha256sum generated-avps-v2-recovery2/avps-v2-postconsumption-recovery2-publisher-trigger-bridge.yml | cut -d' ' -f1)" = 07ce5e3d2cedac6058f6d83e11108de3c3b6418da33c3b439b93bf194ac5c101
          test "$(sha256sum generated-avps-v2-recovery2/MANIFEST.tsv | cut -d' ' -f1)" = e202593c92fb640e373958c429d53aa5d4f2eb593755d62a3be04c8f77de0153

          cp generated-avps-v2-recovery2/avps-v2-postconsumption-recovery2-science.yml .github/workflows/
          cp generated-avps-v2-recovery2/avps-v2-postconsumption-recovery2-dispatch-publisher.yml .github/workflows/
          cp generated-avps-v2-recovery2/avps-v2-postconsumption-recovery2-publisher-trigger-bridge.yml .github/workflows/
          rm "$TRIGGER"
          rm -rf generated-avps-v2-recovery2

          git add -A
          git diff --cached --name-only | sort > materialized-paths.txt
          cat > expected-paths.txt <<'EOF'
          .github/workflows/avps-v2-postconsumption-recovery2-dispatch-publisher.yml
          .github/workflows/avps-v2-postconsumption-recovery2-publisher-trigger-bridge.yml
          .github/workflows/avps-v2-postconsumption-recovery2-science.yml
          dispatch-triggers/avps-v2-postconsumption-recovery2-publication-materialize.txt
          EOF
          sort -o expected-paths.txt expected-paths.txt
          diff -u expected-paths.txt materialized-paths.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Materialize reviewed AVPS recovery2 ordinal43 workflows'
          git push origin HEAD:review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-publication-v1
