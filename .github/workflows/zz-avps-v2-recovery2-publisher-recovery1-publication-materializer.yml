name: Temporary AVPS publisher recovery1 publication materializer

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    paths:
      - .github/workflows/zz-avps-v2-recovery2-publisher-recovery1-publication-materializer.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: temporary-avps-publisher-recovery1-publication-materializer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Generate exact reviewed recovery1 bytes and replace this temporary materializer
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "${{ github.event.pull_request.base.ref }}" = main
          test "${{ github.event.pull_request.base.sha }}" = 6820eee40186f22cd4df503380c475146c284fda
          test "${{ github.event.pull_request.head.ref }}" = review/avps-v2-recovery2-ordinal43-publisher-recovery1-publication-v1
          test "$(git rev-parse HEAD^)" = 326ab5990c7565ae20e5fa51a5ca600f85b1aeda
          test "$(git diff --name-only 6820eee40186f22cd4df503380c475146c284fda...HEAD)" = .github/workflows/zz-avps-v2-recovery2-publisher-recovery1-publication-materializer.yml
          test -z "$(command -v uvspec || true)"

          python review/avps-v2-recovery2-ordinal43-publisher-recovery1-generator-v1/generate.py
          test "$(sha256sum generated-avps-v2-recovery2-publisher-recovery1/avps-v2-postconsumption-recovery2-dispatch-publisher-recovery1.yml | cut -d' ' -f1)" = c02c49ac85f262b5cac2ddd4aedfbe7eec49db62b4d07b063d071f976e05ac4d
          test "$(sha256sum generated-avps-v2-recovery2-publisher-recovery1/avps-v2-postconsumption-recovery2-publisher-recovery1-trigger-bridge.yml | cut -d' ' -f1)" = 21b34383e3113457aad48904f585c0da014677ebc9249d856a2205385193c8ef
          test "$(sha256sum generated-avps-v2-recovery2-publisher-recovery1/avps-v2-recovery2-ordinal43-publisher-recovery1-review.yml | cut -d' ' -f1)" = 721a5ba1fa03b242f4e39cea7a8d0f4dd84c08ce69815ae55e3ceb4902800bad
          python - <<'PY'
          import json
          m=json.load(open('generated-avps-v2-recovery2-publisher-recovery1/manifest.json'))
          if m.get('status')!='GENERATED_AVPS_V2_RECOVERY2_ORDINAL43_PUBLISHER_RECOVERY1_ZERO_RUNTIME': raise SystemExit('manifest status drift')
          if m.get('scientificOrdinal')!=43 or m.get('failedPublisherRun')!=33290906727: raise SystemExit('identity drift')
          for key in ('scienceChanged','authorizationChanged','seedIdentityChanged','dispatchCreated','scientificRuntime'):
              if m.get(key) is not False: raise SystemExit(f'{key} unexpectedly true')
          PY

          cp generated-avps-v2-recovery2-publisher-recovery1/avps-v2-postconsumption-recovery2-dispatch-publisher-recovery1.yml .github/workflows/
          cp generated-avps-v2-recovery2-publisher-recovery1/avps-v2-postconsumption-recovery2-publisher-recovery1-trigger-bridge.yml .github/workflows/
          cp generated-avps-v2-recovery2-publisher-recovery1/avps-v2-recovery2-ordinal43-publisher-recovery1-review.yml .github/workflows/
          rm .github/workflows/zz-avps-v2-recovery2-publisher-recovery1-publication-materializer.yml
          rm -rf generated-avps-v2-recovery2-publisher-recovery1

          git add -A
          git diff --cached --name-only | sort > materialized-paths.txt
          cat > expected-paths.txt <<'EOF'
          .github/workflows/avps-v2-postconsumption-recovery2-dispatch-publisher-recovery1.yml
          .github/workflows/avps-v2-postconsumption-recovery2-publisher-recovery1-trigger-bridge.yml
          .github/workflows/avps-v2-recovery2-ordinal43-publisher-recovery1-review.yml
          .github/workflows/zz-avps-v2-recovery2-publisher-recovery1-publication-materializer.yml
          EOF
          sort -o expected-paths.txt expected-paths.txt
          diff -u expected-paths.txt materialized-paths.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Materialize reviewed AVPS ordinal43 publisher recovery1 workflows'
          git push origin HEAD:review/avps-v2-recovery2-ordinal43-publisher-recovery1-publication-v1
