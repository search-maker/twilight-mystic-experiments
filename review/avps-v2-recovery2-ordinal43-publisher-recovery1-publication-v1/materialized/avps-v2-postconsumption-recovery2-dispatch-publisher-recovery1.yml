name: AVPS v2 recovery2 ordinal43 dispatch publisher recovery1
run-name: AVPS v2 postconsumption recovery2 ordinal 43 zero-runtime dispatch publisher recovery1

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: avps-v2-postconsumption-recovery2-ordinal-43-dispatch-publisher-recovery1
  cancel-in-progress: false

env:
  AUTH_BRANCH: authorization/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-ordinal-43
  AUTH_HEAD: 5fd0c82cb14a02ace38a5a7be30b8b075ccae298
  AUTH_PARENT: 0842dd27f62c4bc2af4b5763ae4dd547ee009fce
  AUTH_PR: '647'
  AUTH_REVIEW_RUN: '33277629404'
  AUTH_REVIEW_ARTIFACT: '9722104370'
  AUTH_REVIEW_DIGEST: sha256:9dac9e9305b78e2ddbceacbc10a19435121b0eeacfe48550d23878359556ae15
  DISPATCH_BRANCH: dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-ordinal-43
  EXECUTION_KEY: aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2:numerical:43
  ALLOCATION_MARKER: ORDINAL43_AVPS_V2_POSTCONSUMPTION_RECOVERY2_AUTHORIZATION_ALLOCATED_REVIEWED_NOT_DISPATCHED commit=5fd0c82cb14a02ace38a5a7be30b8b075ccae298 parent=0842dd27f62c4bc2af4b5763ae4dd547ee009fce pr=647
  CONSUMED_MARKER: ORDINAL43_AVPS_V2_POSTCONSUMPTION_RECOVERY2_DISPATCH_CONSUMED
  CANDIDATE_SEED_SHA256: 38c074fe01bd6d09fa7dc78af1ad323e2f42b606ca992c2950b8fc1f5b343a9f
  CANDIDATE_ROWS_SHA256: a88b28dcfaaeb354f294d1705a0f8ddbcd061083f277a038ab8c9dace44d9954
  AUTH_SEED_LEDGER_PATH: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-seed-freshness-v1/seed_ledger.py
  AUTH_SEED_LEDGER_BLOB: d4bdc95e9ed576fa6c70711c81d8097ddab33dbf
  NATIVE_SEED_HELPER_PATH: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-science-transport-v1/native_authorization_seed_transport.py
  NATIVE_SEED_HELPER_BLOB: 2df2c3fd1ffa78e16f44e6825d67b3e82e903c1e
  HISTORICAL_AUTH_BRANCH: authorization/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery1-ordinal-42
  HISTORICAL_HEAD: e627a689ada0493a8a5b9cdafc4aba0198fbabec
  HISTORICAL_SEED_LEDGER_PATH: review/aerosol-vertical-profile-sensitivity-v2-postconsumption-seed-freshness-v1/seed_ledger.py
  HISTORICAL_SEED_LEDGER_BLOB: 491d1b6653bea0fcc5275269723a76aa1af52300
  FAILED_PUBLISHER_RUN: '33290906727'
  FAILED_PUBLISHER_JOB: '99202243870'
  RECOVERY_REVIEW_WORKFLOW: avps-v2-recovery2-ordinal43-publisher-recovery1-review.yml
  RECOVERY_REVIEW_ARTIFACT: avps-v2-recovery2-ordinal43-publisher-recovery1-review

jobs:
  publish-recovery1:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Fresh recovery1 zero-runtime pre-dispatch fence
        id: fence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -s .github/workflows/avps-v2-postconsumption-recovery2-science.yml
          test -s .github/workflows/avps-v2-postconsumption-recovery2-dispatch-publisher.yml
          mkdir -p dispatch-recovery1-evidence
          # Bind the failed publisher as immutable pre-consumption evidence. Never rerun it.
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_PUBLISHER_RUN" > dispatch-recovery1-evidence/failed-publisher-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_PUBLISHER_RUN/jobs" > dispatch-recovery1-evidence/failed-publisher-jobs.json
          python - <<'PY'
          import json,os
          r=json.load(open('dispatch-recovery1-evidence/failed-publisher-run.json'))
          jobs=json.load(open('dispatch-recovery1-evidence/failed-publisher-jobs.json')).get('jobs',[])
          if r.get('id')!=int(os.environ['FAILED_PUBLISHER_RUN']) or r.get('run_attempt')!=1 or r.get('event')!='workflow_dispatch' or r.get('conclusion')!='failure': raise SystemExit('failed publisher identity drift')
          hit=[j for j in jobs if j.get('id')==int(os.environ['FAILED_PUBLISHER_JOB'])]
          if len(hit)!=1 or hit[0].get('conclusion')!='failure': raise SystemExit('failed publisher job drift')
          steps={s.get('name'):s.get('conclusion') for s in hit[0].get('steps',[])}
          if steps.get('Fresh zero-runtime pre-dispatch fence')!='failure': raise SystemExit('prior publisher failure-step drift')
          for n in ('Create exact dispatch ref and consumed marker once','Upload zero-runtime publisher evidence before science dispatch','Explicitly dispatch exact science workflow from main'):
              if steps.get(n)!='skipped': raise SystemExit(f'prior publisher crossed pre-consumption boundary: {n}={steps.get(n)!r}')
          PY
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          Path('dispatch-recovery1-evidence/implementation-bytes.json').write_text(json.dumps({'scienceWorkflowSha256':sha('.github/workflows/avps-v2-postconsumption-recovery2-science.yml'),'publisherWorkflowSha256':sha('.github/workflows/avps-v2-postconsumption-recovery2-dispatch-publisher.yml')},indent=2,sort_keys=True)+'\n')
          PY
          git fetch origin "refs/heads/$AUTH_BRANCH:refs/remotes/origin/$AUTH_BRANCH"
          test "$(git rev-parse origin/$AUTH_BRANCH)" = "$AUTH_HEAD"
          mapfile -t PARENTS < <(git cat-file -p "$AUTH_HEAD" | sed -n 's/^parent //p')
          test "${#PARENTS[@]}" = 1
          test "${PARENTS[0]}" = "$AUTH_PARENT"
          if git ls-remote --exit-code --heads origin "$DISPATCH_BRANCH" >/dev/null 2>&1; then echo 'dispatch branch already exists' >&2; exit 1; fi

          gh api "repos/$GITHUB_REPOSITORY/pulls/$AUTH_PR" > dispatch-recovery1-evidence/authorization-pr.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$AUTH_REVIEW_RUN" > dispatch-recovery1-evidence/authorization-review-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$AUTH_REVIEW_ARTIFACT" > dispatch-recovery1-evidence/authorization-review-artifact.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > dispatch-recovery1-evidence/issue60-pages.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/avps-v2-postconsumption-recovery2-science.yml/runs?event=workflow_dispatch&per_page=100" > dispatch-recovery1-evidence/science-run-pages.json
          python - <<'PY'
          import json,os
          p=json.load(open('dispatch-recovery1-evidence/authorization-pr.json'))
          if p['number']!=647 or p['state']!='open' or p['draft'] is not True or p['merged_at'] is not None or p['head']['sha']!=os.environ['AUTH_HEAD'] or p['base']['sha']!=os.environ['AUTH_PARENT']: raise SystemExit('authorization PR drift')
          r=json.load(open('dispatch-recovery1-evidence/authorization-review-run.json'))
          if r['id']!=int(os.environ['AUTH_REVIEW_RUN']) or r['head_sha']!=os.environ['AUTH_HEAD'] or r['run_attempt']!=1 or r['conclusion']!='success': raise SystemExit('authorization review drift')
          a=json.load(open('dispatch-recovery1-evidence/authorization-review-artifact.json'))
          if a['id']!=int(os.environ['AUTH_REVIEW_ARTIFACT']) or a.get('digest')!=os.environ['AUTH_REVIEW_DIGEST'] or a.get('expired'): raise SystemExit('authorization review artifact drift')
          pages=json.load(open('dispatch-recovery1-evidence/issue60-pages.json')); bodies=[str(c.get('body') or '').strip() for p in pages for c in p]
          if sum(b==os.environ['ALLOCATION_MARKER'] for b in bodies)!=1: raise SystemExit('allocation marker cardinality drift')
          if sum(b.startswith(os.environ['CONSUMED_MARKER']) for b in bodies)!=0: raise SystemExit('consumed marker already exists')
          pages=json.load(open('dispatch-recovery1-evidence/science-run-pages.json')); runs=[r for p in pages for r in p.get('workflow_runs',[])]
          if runs: raise SystemExit(f'candidate science run already exists: {[r.get("id") for r in runs]}')
          PY

          git ls-files -z > dispatch-recovery1-evidence/tracked-files.nul
          test "$(git rev-parse HEAD:$NATIVE_SEED_HELPER_PATH)" = "$NATIVE_SEED_HELPER_BLOB"
          git fetch origin "refs/heads/$HISTORICAL_AUTH_BRANCH:refs/remotes/origin/$HISTORICAL_AUTH_BRANCH"
          test "$(git rev-parse origin/$HISTORICAL_AUTH_BRANCH)" = "$HISTORICAL_HEAD"
          python "$NATIVE_SEED_HELPER_PATH" \
            --repo-root . \
            --authorization-head "$AUTH_HEAD" \
            --authorization-parent "$AUTH_PARENT" \
            --authorization-ledger-path "$AUTH_SEED_LEDGER_PATH" \
            --authorization-ledger-blob "$AUTH_SEED_LEDGER_BLOB" \
            --candidate-seed-sha256 "$CANDIDATE_SEED_SHA256" \
            --candidate-rows-sha256 "$CANDIDATE_ROWS_SHA256" \
            --historical-head "$HISTORICAL_HEAD" \
            --historical-ledger-path "$HISTORICAL_SEED_LEDGER_PATH" \
            --historical-ledger-blob "$HISTORICAL_SEED_LEDGER_BLOB" \
            --work-root dispatch-recovery1-evidence/native-seed-transport \
            --output-ledger dispatch-recovery1-evidence/candidate-seed-ledger.json \
            --output-context dispatch-recovery1-evidence/native-seed-context.json
          python - <<'PY'
          import json
          from pathlib import Path
          Path('dispatch-recovery1-evidence/empty-self-ledger-policy.json').write_text(json.dumps({'schemaVersion':2,'requiredTrackedSelfLedgerPaths':[],'futureEvidenceSelfLedgerPaths':[]},indent=2,sort_keys=True)+'\n')
          PY
          python review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/tracked_tree_seed_scan.py --repo-root . --file-list dispatch-recovery1-evidence/tracked-files.nul --candidate-seed-ledger dispatch-recovery1-evidence/candidate-seed-ledger.json --allow-self-ledger-json dispatch-recovery1-evidence/empty-self-ledger-policy.json --output dispatch-recovery1-evidence/tracked-seed-scan.json
          python review/aerosol-vertical-profile-sensitivity-v2-seed-freshness/repository_global_seed_scan.py --repository "$GITHUB_REPOSITORY" --issue-number 60 --candidate-seed-ledger dispatch-recovery1-evidence/candidate-seed-ledger.json --current-run-id "$GITHUB_RUN_ID" --audit-mode authorization-recheck --expected-branch-name main --expected-repo-head "$GITHUB_SHA" --output dispatch-recovery1-evidence/repository-global-seed-scan.json
          python - <<'PY'
          import json
          t=json.load(open('dispatch-recovery1-evidence/tracked-seed-scan.json')); g=json.load(open('dispatch-recovery1-evidence/repository-global-seed-scan.json'))
          if t.get('trackedTreeExternalCollisionCount')!=0: raise SystemExit('tracked seed collision')
          if g.get('repositoryGlobalCollisionCount',g.get('collisionCount'))!=0: raise SystemExit('repository-global seed collision')
          PY

          PYTHONPATH=experiments/aerosol-vertical-profile-sensitivity-v1 python - <<'PY'
          import json,os
          from pathlib import Path
          import preauthorization_surface, global_ordinal
          payload=preauthorization_surface.collect(os.environ['GITHUB_REPOSITORY'],os.environ['GITHUB_TOKEN'])
          latest=preauthorization_surface.latest_consumed_or_dispatched_ordinal(payload)
          observations=global_ordinal.authoritative_global_ordinal_observations(payload,current_run_id=int(os.environ['GITHUB_RUN_ID']))
          ordinals=sorted({int(row['ordinal']) for row in observations})
          if latest!=42: raise SystemExit(f'latest consumed/dispatched global ordinal drift: {latest}')
          if not ordinals or max(ordinals)!=43: raise SystemExit(f'global ordinal surface drift: {ordinals[-10:]}')
          bodies=[str(c.get('body') or '').strip() for c in payload.get('issue60Comments',[])]
          if sum(b==os.environ['ALLOCATION_MARKER'] for b in bodies)!=1: raise SystemExit('ordinal43 allocation marker cardinality drift in global surface')
          if sum(b.startswith(os.environ['CONSUMED_MARKER']) for b in bodies)!=0: raise SystemExit('ordinal43 consumed marker already exists in global surface')
          Path('dispatch-recovery1-evidence/global-ordinal-observations.json').write_text(json.dumps(observations,indent=2,sort_keys=True)+'\n')
          Path('dispatch-recovery1-evidence/global-ordinal-recheck.json').write_text(json.dumps({'schemaVersion':1,'status':'PASS_GLOBAL_ORDINAL43_ALLOCATED_NOT_CONSUMED_PRE_DISPATCH','latestConsumedOrDispatchedScientificOrdinal':latest,'maxObservedScientificOrdinal':max(ordinals),'candidateScientificOrdinal':43},indent=2,sort_keys=True)+'\n')
          PY

          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-implementation-generator-v1-review.yml/runs?event=pull_request&per_page=100" > dispatch-recovery1-evidence/implementation-review-pages.json
          python - <<'PY'
          import json
          pages=json.load(open('dispatch-recovery1-evidence/implementation-review-pages.json')); runs=[r for p in pages for r in p.get('workflow_runs',[])]
          good=[r for r in runs if int(r.get('run_attempt') or 0)==1 and r.get('status')=='completed' and r.get('conclusion')=='success']
          if not good: raise SystemExit('no successful attempt-1 AVPS v2 workflow implementation review')
          json.dump(good,open('dispatch-recovery1-evidence/implementation-review-candidates.json','w'),indent=2)
          PY
          MATCHED=''
          for RID in $(python -c "import json; print(' '.join(str(x['id']) for x in json.load(open('dispatch-recovery1-evidence/implementation-review-candidates.json'))))"); do
            rm -rf dispatch-recovery1-evidence/review-artifact
            mkdir dispatch-recovery1-evidence/review-artifact
            if gh run download "$RID" -n avps-v2-postconsumption-recovery2-implementation-generator-v1-review -D dispatch-recovery1-evidence/review-artifact >/dev/null 2>&1; then
              if python - <<'PY'
          import hashlib,json
          from pathlib import Path
          hits=list(Path('dispatch-recovery1-evidence/review-artifact').rglob('review-receipt.json'))
          if len(hits)!=1: raise SystemExit(1)
          r=json.load(open(hits[0]))
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          if r.get('status')!='PASS_AVPS_V2_POSTCONSUMPTION_RECOVERY2_GENERATED_IMPLEMENTATION_REVIEW_DISPATCH_NOT_CREATED': raise SystemExit(1)
          if r.get('scienceWorkflowSha256')!=sha('.github/workflows/avps-v2-postconsumption-recovery2-science.yml'): raise SystemExit(1)
          if r.get('publisherWorkflowSha256')!=sha('.github/workflows/avps-v2-postconsumption-recovery2-dispatch-publisher.yml'): raise SystemExit(1)
          PY
              then MATCHED="$RID"; break; fi
            fi
          done
          test -n "$MATCHED"
          export MATCHED
          echo "review_run=$MATCHED" >> "$GITHUB_OUTPUT"

          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/$RECOVERY_REVIEW_WORKFLOW/runs?event=pull_request&per_page=100" > dispatch-recovery1-evidence/recovery-review-pages.json
          python - <<'PY'
          import json
          pages=json.load(open('dispatch-recovery1-evidence/recovery-review-pages.json')); runs=[r for p in pages for r in p.get('workflow_runs',[])]
          good=[r for r in runs if int(r.get('run_attempt') or 0)==1 and r.get('status')=='completed' and r.get('conclusion')=='success']
          if not good: raise SystemExit('no successful attempt-1 publisher recovery1 review')
          json.dump(good,open('dispatch-recovery1-evidence/recovery-review-candidates.json','w'),indent=2)
          PY
          RECOVERY_REVIEW_RUN=''
          for RID in $(python -c "import json; print(' '.join(str(x['id']) for x in json.load(open('dispatch-recovery1-evidence/recovery-review-candidates.json'))))"); do
            rm -rf dispatch-recovery1-evidence/recovery-review-artifact; mkdir dispatch-recovery1-evidence/recovery-review-artifact
            if gh run download "$RID" -n "$RECOVERY_REVIEW_ARTIFACT" -D dispatch-recovery1-evidence/recovery-review-artifact >/dev/null 2>&1; then
              if python - <<'PY'
          import json,subprocess
          from pathlib import Path
          hits=list(Path('dispatch-recovery1-evidence/recovery-review-artifact').rglob('review-receipt.json'))
          if len(hits)!=1: raise SystemExit(1)
          r=json.load(open(hits[0]))
          pub_blob=subprocess.check_output(['git','hash-object','.github/workflows/avps-v2-postconsumption-recovery2-dispatch-publisher-recovery1.yml'],text=True).strip()
          trig_blob=subprocess.check_output(['git','hash-object','.github/workflows/avps-v2-postconsumption-recovery2-publisher-recovery1-trigger-bridge.yml'],text=True).strip()
          if r.get('status')!='PASS_AVPS_V2_RECOVERY2_ORDINAL43_PUBLISHER_RECOVERY1_SOLVER_FREE': raise SystemExit(1)
          if r.get('publisherBlob')!=pub_blob or r.get('triggerBlob')!=trig_blob: raise SystemExit(1)
          if not r.get('failedPublisherPreConsumption'): raise SystemExit(1)
          PY
              then RECOVERY_REVIEW_RUN="$RID"; break; fi
            fi
          done
          test -n "$RECOVERY_REVIEW_RUN"
          export RECOVERY_REVIEW_RUN

          python - <<'PY'
          import json,os
          from pathlib import Path
          out={'schemaVersion':1,'status':'RECOVERY1_PRE_DISPATCH_FENCE_PASS_ZERO_RUNTIME','scientificOrdinal':43,'executionKey':os.environ['EXECUTION_KEY'],'authorizationHead':os.environ['AUTH_HEAD'],'authorizationParent':os.environ['AUTH_PARENT'],'authorizationPr':647,'dispatchBranch':os.environ['DISPATCH_BRANCH'],'candidateSeedCanonicalSha256':os.environ['CANDIDATE_SEED_SHA256'],'implementationReviewRun':int(os.environ['MATCHED']),'scientificRuntimeSetupPerformed':False,'scientificExecutionPerformed':False,'solverExecutionPerformed':False,'dispatchCreated':False,'failedPublisherRun':int(os.environ['FAILED_PUBLISHER_RUN']),'failedPublisherPreConsumption':True,'recoveryReviewRun':int(os.environ['RECOVERY_REVIEW_RUN'])}
          Path('dispatch-recovery1-evidence/pre-dispatch-fence.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY

      - name: Create exact dispatch ref and consumed marker once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$DISPATCH_BRANCH" -f sha="$AUTH_HEAD" > dispatch-recovery1-evidence/ref-create.json
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$DISPATCH_BRANCH" --jq .object.sha)" = "$AUTH_HEAD"
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/60/comments" -f body="$CONSUMED_MARKER" > dispatch-recovery1-evidence/consumed-comment.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/60/comments?per_page=100" > dispatch-recovery1-evidence/post-comments-pages.json
          python - <<'PY'
          import json,os
          pages=json.load(open('dispatch-recovery1-evidence/post-comments-pages.json')); bodies=[str(c.get('body') or '').strip() for p in pages for c in p]
          if sum(b==os.environ['ALLOCATION_MARKER'] for b in bodies)!=1: raise SystemExit('post-dispatch allocation cardinality drift')
          if sum(b.startswith(os.environ['CONSUMED_MARKER']) for b in bodies)!=1: raise SystemExit('post-dispatch consumed cardinality drift')
          PY
          python - <<'PY'
          import json,os
          from pathlib import Path
          out={'schemaVersion':1,'status':'RECOVERY1_DISPATCH_PUBLISHED_ZERO_RUNTIME','scientificOrdinal':43,'executionKey':os.environ['EXECUTION_KEY'],'authorizationHead':os.environ['AUTH_HEAD'],'authorizationParent':os.environ['AUTH_PARENT'],'authorizationPr':647,'dispatchBranch':os.environ['DISPATCH_BRANCH'],'dispatchBranchHeadSha':os.environ['AUTH_HEAD'],'workflowRunAttempt':1,'scientificRuntimeSetupPerformed':False,'scientificExecutionPerformed':False,'solverExecutionPerformed':False,'consumedMarkerPosted':True,'scienceDispatchRequested':False}
          Path('dispatch-recovery1-evidence/dispatch-publisher.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY

      - name: Upload zero-runtime publisher evidence before science dispatch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: avps-v2-postconsumption-recovery2-dispatch-publisher-recovery1-ordinal-43
          path: dispatch-recovery1-evidence/
          if-no-files-found: error
          compression-level: 0

      - name: Explicitly dispatch exact science workflow from main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PAYLOAD='{"ref":"main","inputs":{"dispatch_ref":"dispatch/aerosol-vertical-profile-sensitivity-v2-postconsumption-recovery2-ordinal-43"}}'
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/avps-v2-postconsumption-recovery2-science.yml/dispatches" --input - <<< "$PAYLOAD"
